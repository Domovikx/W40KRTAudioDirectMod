- guid: aceadac1-6b70-469b-8a52-a12e4f736688
  event: PRL_AbelardRecruit_19
  text: '"Я не кормчий и, упаси меня Бог-Император, не Навигатор — однако я всю свою жизнь провел на пустотных кораблях, оснащенных варп-двигателями, и знаю, что подобные знаки — не к добру. Быть может, Поле Геллера дало осечку. Может быть, Навигатор был охвачен варп-скверной и борется за остатки своей человечности прямо сейчас..."'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: Я не кормчий и, упаси меня Бог-Император, не Навигатор — однако я всю свою жизнь провел на пустотных кораблях, оснащенных варп-двигателями, и знаю, что подобные знаки — не к добру. Быть может, Поле Геллера дало осечку. Может быть, Навигатор был охвачен варп-скверной и борется за остатки своей человечности прямо сейчас...
