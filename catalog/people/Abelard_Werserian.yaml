  text: '{n}Абеляр мрачно хмыкает.{/n} "Ну, если сломался всего один офицер из всего выводка — это не совсем уж плохой результат. Ваша Светлость, смиренно прошу прощения от лица всего экипажа. Что прикажете делать с Мастером орудий — теперь, видимо, уже бывшим? Кроме очевидного "найти замену" — замена есть".'
  speaker: Abelard Werserian
  parts:
  - speaker: narrator
    text_clean: Абеляр мрачно хмыкает.
  - speaker: Abelard Werserian
    text_clean: Ну, если сломался всего один офицер из всего выводка — это не совсем уж плохой результат. Ваша Светлость, смиренно прошу прощения от лица всего экипажа. Что прикажете делать с Мастером орудий — теперь, видимо, уже бывшим? Кроме очевидного "найти замену" — замена есть.
- guid: 007e07c1-a25b-424d-8e8a-14d01f3e091b
  event: ''
  text: '"Да что это такое... у фон Валанциусов в крови — тянуть руки к любой непонятной гадости! И почему я не выбрал службу в тылу, интендантом какого-нибудь склада магнитных катушек?" {n}Абеляр, взволнованно перебирающий снаряжение, вскидывает голову.{/n} "Лорд-капитан, вы пришли в себя! И даже лекарства не понадобились. Вот удача-то!"'
  speaker: Abelard Werserian
  parts:
