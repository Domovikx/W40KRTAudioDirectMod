- guid: a4b4fb88-f083-43b0-ae89-08b764854572
  event: PRL_AbelardRecruit_06
  text: '"Кровь святых! Тогда понятно, почему еретики действуют столь слаженно! Я думал, что блокирование переходов между палубами — его попытка предотвратить распространение врагов по палубам, однако теперь ясно, зачем он это сделал: чтобы затруднить доступ блюстителям! По крайней мере вы живы и теперь в безопасности, госпо{mf|дин|жа} {name}. Только, боюсь, отсидеться в безопасном отсеке нам не удастся".'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: 'Кровь святых! Тогда понятно, почему еретики действуют столь слаженно! Я думал, что блокирование переходов между палубами — его попытка предотвратить распространение врагов по палубам, однако теперь ясно, зачем он это сделал: чтобы затруднить доступ блюстителям! По крайней мере вы живы и теперь в безопасности, господин КЭП. Только, боюсь, отсидеться в безопасном отсеке нам не удастся.'
