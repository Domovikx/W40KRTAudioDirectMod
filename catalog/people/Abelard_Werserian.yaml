  event: PRL_AbelardRecruit_21
  text: '{n}Сервочереп внезапно разражается потоком статики, сквозь которую пробивается голос Теодоры:{/n} "...верные сыны и дочери Бога-Императора, к оружию! Сопротивляйтесь ереси и скверне, что грозит поглотить нашу обитель, и направьте все силы на уничтожение тех, кто посмел..."'
