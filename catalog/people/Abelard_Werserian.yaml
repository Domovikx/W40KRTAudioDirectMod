  text: '"Быть может... Нам нужно просто уступить... Ты всегда говорила, душа моя, что Даргонус тебе не дом..." {n}Абеляр смотрит мимо вас на одному ему видную собеседницу. На дрожащих губах появляется неуверенная улыбка.{/n} "Ты хочешь этого, душа моя?... Оставить все это... позади... убраться подальше... отойти от дел..."'
