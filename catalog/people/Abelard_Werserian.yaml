    text_clean: От Леди Теодоры... которую? Последняя, полученная мной, была про Святилище Навигатора, и это было... изрядно давно. В любом случае будем надеяться, что Лорд-капитан в здравии и в безопасности командует обороной судна — а мы тем временем сделаем все возможное, чтобы остановить сход корабля с курса.
