  event: PRL_AbelardRecruit_11
  text: '"О святый {g|Encyclopedia:Emperor}Бог-Император{/g}..." {n}Абеляр хватается за лоб, на его лице на мгновение появляется выражение полной растерянности — которая, впрочем, сменяется решимостью.{/n} "Полагаю, к восстанию на корабле причастен именно он? И, госпо{mf|дин|жа} {name}, хотел бы напомнить, что для вас Лорд-капитан — Леди Теодора".'
