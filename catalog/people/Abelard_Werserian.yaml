- guid: 101f7129-62a4-48fe-9b29-e8517045130d
  event: PRL_AbelardRecruit_03
  text: '"Камера Патента — древний, особо священный механизм, к которому с величайшим почтением относятся наши бортовые {g|Encyclopedia:TechPriest}техножрецы{/g}. Полагаю, если вы так или иначе разбудили Стража, вы активировали некие процессы... но тогда почему этого не происходило, когда то же самое проделывала Леди Теодора?" {n}Сенешаль хмурится.{/n}'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Камера Патента — древний, особо священный механизм, к которому с величайшим почтением относятся наши бортовые техножрецы. Полагаю, если вы так или иначе разбудили Стража, вы активировали некие процессы... но тогда почему этого не происходило, когда то же самое проделывала Леди Теодора?
  - speaker: narrator
    text_clean: Сенешаль хмурится.
- guid: 0e320211-dea2-4617-bbcd-00ae36ea9aea
  event: PRL_AbelardRecruit_04
  text: '{n}Сенешаль оживляется, на его лице появляется мрачная улыбка.{/n} "Лорд-капитан призывает свой экипаж к борьбе — значит, вокс-сети работают на общую трансляцию, а не обмен сообщениями. Прекрасно. Пока Вольный Торговец внушает своим подданным должное рвение к борьбе, мы с вами отправимся оправдывать ее доверие. Вперед!"'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Сенешаль оживляется, на его лице появляется мрачная улыбка.
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан призывает свой экипаж к борьбе — значит, вокс-сети работают на общую трансляцию, а не обмен сообщениями. Прекрасно. Пока Вольный Торговец внушает своим подданным должное рвение к борьбе, мы с вами отправимся оправдывать ее доверие. Вперед!
