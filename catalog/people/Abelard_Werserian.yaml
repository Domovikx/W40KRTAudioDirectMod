  text: '{n}Абеляр выходит вперед и внимательно смотрит на патриарха Зауэрбэков.{/n} "Махарий. Признаться честно, твоя прямота мне всегда импонировала. Но так же, как я когда-то распрощался с повышением в службе из-за своей нелюбви к экивокам, ты — и вся твоя семья — могут распрощаться с головами. Скажи мне сейчас, со всей своей прямотой — верен ли ты роду фон Валанциус?"'
