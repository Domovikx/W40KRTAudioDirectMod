- guid: 9a552559-648e-4add-b8b9-efe9f6f37a7f
  event: RM_ArbitesFirstMeeting_Abelard_01
  text: '"Полагаю, потому что это представитель {g|Encyclopedia:AdeptusArbitesGlossary}Адептус Арбитес{/g}, Ваша Светлость, подобный тон — часть их, кхм, особенностей". {n}Сенешаль хмурится.{/n} "Проктор, перед вами — Вольный Торговец {name} фон Валанциус, Помазанни{mf|к|ца} Императора и держатель{mf||ница} священного Патента. Касательно целей {mf|Его|Ее} Светлости на планете — вы не в праве требовать ответа. Относитесь к Лорд-капитану с тем же уважением, которое выказывали Леди Теодоре... Ныне покойной".'
  speaker: Abelard Werserian
