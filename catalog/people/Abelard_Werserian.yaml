  event: PRL_AbelardRecruit_10
  text: '"Однако не это хуже всего..." {n}Сенешаль умолкает, когда свет в очередной раз тухнет и вспыхивает.{/n} "Эти перепады и тряска — очень дурные знаки. Знаки того, что {g|Encyclopedia:Navigator}Навигатор{/g} и Главный кормчий испытывают сложности при трансляции корабля из варпа в реальный мир. В худшем случае — они уже потеряли контроль над процессом, и нам всем остаются считанные мгновения. В лучшем... возможно, если нам удастся добраться до Святилища Навигатора и разобраться, в чем дело, кто-то на судне уцелеет".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Однако не это хуже всего...
  - speaker: narrator
    text_clean: Сенешаль умолкает, когда свет в очередной раз тухнет и вспыхивает.
