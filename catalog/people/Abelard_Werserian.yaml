- guid: 5ca4d14a-5fa6-41e1-8a81-8021afaf7224
  event: BNTRS_Stressful_Abelard_38
  text: '"Я, кхм, всегда желал лишь уважения, а не страха. Приятно знать, что мои старания не прошли даром. Благодарю... что рассказали об этом".'
