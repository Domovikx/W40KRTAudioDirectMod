  text: '"Это все, Ваша Светлость. Дел вам предстоит переделать немало, но это так... затравочка перед настоящими буднями Вольного Торговца. Скоро вам предстоит взять в руки бразды правления протекторатом фон Валанциус..." {n}Абеляр снова смотрит на вас испытующе, будто оценивая, насколько вы держитесь перед лицом вороха свалившихся проблем. Лицо его немного смягчается, кажется, он готов произнести что-то ободряющее...{/n}'
