  text: '{n}Абеляр вздрагивает от ваших слов. Он недовольно хмурит брови, а в его слезящихся глазах появляется огонек.{/n} "Еретик? Прежде чем раскидываться обвинениями, подтяните теорию — в Аддендум Примум Эррандум категоризация ксеновлияний была упразднена, так что..." {n}Бросив на вас прояснившийся взгляд, Абеляр судорожно вздыхает.{/n} "Кровь святых, Лорд-капитан! Вы живы!"'
