- guid: 2184319f-548f-4ffe-8232-8c8363b6c792
  event: PRL_AbelardRecruit_09
  text: '"Нижние палубы кишат еретиками, подбивающими чернь на бунт, но это меньшая из наших проблем — корабельные блюстители вылавливают супостатов и подавляют сопротивление. Гораздо хуже ситуация на средних палубах: на них направили ударные отряды, при этом связь с мостиком и инженерным отсеком прервана — помимо обрывочных {g|Encyclopedia:Vox}вокс{/g}-передач мы не имеем никакого источника информации о происходящем".'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: 'Нижние палубы кишат еретиками, подбивающими чернь на бунт, но это меньшая из наших проблем — корабельные блюстители вылавливают супостатов и подавляют сопротивление. Гораздо хуже ситуация на средних палубах: на них направили ударные отряды, при этом связь с мостиком и инженерным отсеком прервана — помимо обрывочных вокс-передач мы не имеем никакого источника информации о происходящем.'
