- guid: 0ac59ae0-da31-4d06-b928-bccd9bf161d4
  event: PRL_AbelardRecruit_01
  text: '{n}Сенешаль Абеляр Версериан растерял часть своего прежнего лоска: на его лбу выступил пот, а рукав кителя разорван и пропитан кровью. Тем не менее, старый офицер, пускай и запыхавшийся, твердо стоит на ногах и взирает на вас требовательным, хотя и несколько удивленным, взглядом.{/n} "Госпо{mf|дин|жа} {name}! Что... что вы делаете в Камере {g|Encyclopedia:Warrant}Патента{/g}? Как вы..." {n}Он оглядывается, осматривая место побоища. Его лоб собирается в мелкую складку, а рука ложится на оружие.{/n} "{g|Encyclopedia:GoldenThrone}Трон{/g} меня храни, что здесь творится?!"'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: 'Сенешаль Абеляр Версериан растерял часть своего прежнего лоска: на его лбу выступил пот, а рукав кителя разорван и пропитан кровью. Тем не менее, старый офицер, пускай и запыхавшийся, твердо стоит на ногах и взирает на вас требовательным, хотя и несколько удивленным, взглядом.'
