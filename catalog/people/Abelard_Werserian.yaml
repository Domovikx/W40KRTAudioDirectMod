  text: '{n}Абеляр бросает на вас усталый и немного раздраженный взгляд — так смотрят на дерзящего ребенка.{/n} "Я был бы счастлив соблюдать формальный протокол, госпо{mf|дин|жа} {name}, однако обстоятельства позволяют оценивать текущую ситуацию как экстраординарную, а следовательно — позволяющую отойти от наших обычных процедур".'
