  event: PRL_AbelardRecruit_05
  text: '"Верно, верно..." {n}Абеляр хмурится.{/n} "Проще сказать, чем сделать, конечно. Но уже то, что один из наследников Леди Теодоры жив, внушает хотя бы немного оптимизма".'
