- guid: 53220070-fd38-4e46-ba75-90a0c998fb7a
  event: PRL_AbelardRecruit_23
  text: '"Во время перехода в варпе святилище изолировано для всех, кто не участвует в процессе прокладки маршрута сквозь {g|Encyclopedia:Warp}Эмпиреи{/g}. Для этого есть причина: чтобы навигатор мог отверзть свое третье око и узреть путь, святилище должно быть погружено в энергии Имматериума. Только навигатор способен выдержать такое испытание — для обычных смертных контакт с варпом грозит помрачением рассудка, спонтанными мутациями и гибелью". {n}Абеляр перечисляет все предстоящие вам ужасы, не меняясь в лице.{/n}'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: 'Во время перехода в варпе святилище изолировано для всех, кто не участвует в процессе прокладки маршрута сквозь Эмпиреи. Для этого есть причина: чтобы навигатор мог отверзть свое третье око и узреть путь, святилище должно быть погружено в энергии Имматериума. Только навигатор способен выдержать такое испытание — для обычных смертных контакт с варпом грозит помрачением рассудка, спонтанными мутациями и гибелью.'
