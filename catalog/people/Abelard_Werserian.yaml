    text_clean: Полагаю, к восстанию на корабле причастен именно он? И, господин КЭП, хотел бы напомнить, что для вас Лорд-капитан — Леди Теодора.
- guid: 1e06006a-3ec2-450d-bfad-041372360833
  event: PRL_AbelardRecruit_12
  text: '"От Леди Теодоры... которую? Последняя, полученная мной, была про Святилище Навигатора, и это было... изрядно давно. В любом случае будем надеяться, что Лорд-капитан в здравии и в безопасности командует обороной судна — а мы тем временем сделаем все возможное, чтобы остановить сход корабля с курса".'
  speaker: Abelard Werserian
  parts:
