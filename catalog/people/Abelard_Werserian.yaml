- guid: fe7f2cfa-fed4-4ef0-9ce7-04c41d3c25cd
  event: PRL_AbelardRecruit_08
  text: '"Служит... богам {g|Encyclopedia:Warp}варпа{/g}?! Кунрад — еретик? Ох, Войгтвир, пустотная ты крыса..." {n}Абеляр трясет головой.{/n} "Безумие. Не сомневаюсь, восстание на корабле тоже его рук дело?"'
