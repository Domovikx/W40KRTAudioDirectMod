  text: '"Бедняга Гапрак. Он мне еще лет десять назад говорил, что ему не по себе в присутствии достопочтимых жестяных братьев. Осторожно так сетовал, что ему не досталась нормальная планета. Надо будет почтить его память молебном... когда закончим с зачисткой". {n}Абеляр выразительно поводит оружием.{/n} "Благо господин Фабрикатор-Цензор сам, без принуждения, признался в измене".'
