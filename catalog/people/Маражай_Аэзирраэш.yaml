  text: '{n}Маражай оскаливается в плотоядной усмешке.{/n} "Ты слишком высокого мнения о себе, звереныш. Молись, чтобы тебя убили на арене до того, как ты познаешь ласку моих клинков".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай оскаливается в плотоядной усмешке.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты слишком высокого мнения о себе, звереныш. Молись, чтобы тебя убили на арене до того, как ты познаешь ласку моих клинков.
- guid: f1e6afb7-6df4-4219-8438-ac5827eb1412
  event: ''
  text: '{n}Маражай взирает на разворачивающуюся сцену без малейшего признака сочувствия к павшей "кузине".{/n} "Теперь все встало на свои места. Прощай, Ирлиэт. Ты была полезна мне... до времени".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай взирает на разворачивающуюся сцену без малейшего признака сочувствия к павшей "кузине".
  - speaker: Маражай Аэзирраэш
    text_clean: Теперь все встало на свои места. Прощай, Ирлиэт. Ты была полезна мне... до времени.
