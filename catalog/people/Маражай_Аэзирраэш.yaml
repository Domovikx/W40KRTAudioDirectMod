- guid: 017ea674-5f13-4907-80bb-c57c5daa110a
  event: RMNC_Marazhai_StartingEvent_P2_23
  text: '"Наивное создание... гемункулам Комморры — вроде Тервантьяса, пригретого Иремерисс — по силам выращивать новые тела из небольших кусков плоти, заключенных в амниотические трубки. Любой друкари, сраженный тобой на поле боя, может вновь прийти за тобой. Если душа Иремерисс будет у меня — возможно, ее клон — если он появится — выйдет неполноценным. Быть может, она даже не вспомнит обо мне".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Наивное создание... гемункулам Комморры — вроде Тервантьяса, пригретого Иремерисс — по силам выращивать новые тела из небольших кусков плоти, заключенных в амниотические трубки. Любой друкари, сраженный тобой на поле боя, может вновь прийти за тобой. Если душа Иремерисс будет у меня — возможно, ее клон — если он появится — выйдет неполноценным. Быть может, она даже не вспомнит обо мне.
