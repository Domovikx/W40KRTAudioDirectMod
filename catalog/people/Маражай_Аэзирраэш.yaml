  - speaker: Маражай Аэзирраэш
    text_clean: Верно, КЭП! Все, что тебе нужно — это сосредоточиться на своих обязательствах.
- guid: 2c41b160-ceb9-4d04-bf45-692e3d0dcd2e
  event: RMNC_Marazhai_StartingEvent_P2_17
  text: '"Посмотрим, как ты справишься с теми, что я уже возложил на тебя. Помни — Иремерисс моя, когда бы и где бы мы не встретили ее. На этом — мой разговор к тебе исчерпан, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Посмотрим, как ты справишься с теми, что я уже возложил на тебя. Помни — Иремерисс моя, когда бы и где бы мы не встретили ее. На этом — мой разговор к тебе исчерпан, КЭП.
- guid: a035aa8f-e2b2-4d83-99e1-9d3d5334d876
  event: RMNC_Marazhai_StartingEvent_P2_18
  text: '"Право забрать жизнь Эзирраеш есть только у Эзирраеш. Ты дашь мне возможность прервать существование архонта Опустошительной бури".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Право забрать жизнь Эзирраеш есть только у Эзирраеш. Ты дашь мне возможность прервать существование архонта Опустошительной бури.
- guid: e6c8db64-86ca-40d3-880c-87e6f62b8821
  event: RMNC_Marazhai_StartingEvent_P2_19
  text: '"Тогда вернемся к тому, что я требую. Душа Иремерисс и мое право на нее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда вернемся к тому, что я требую. Душа Иремерисс и мое право на нее.
- guid: 1f125aa8-f4cf-4996-80d8-96d3307b1291
  event: RMNC_Marazhai_StartingEvent_P2_20
  text: '"Да?..." {n}На лице друкари появляется выражение глубочайшего недоумения.{/n} "И твое изумление заставляет меня думать, что мон-кай еще примитивнее, чем я подозревал. Не говори мне, что узы крови налагают на вас какие-то особые запреты и табу".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Да?...
  - speaker: narrator
    text_clean: На лице друкари появляется выражение глубочайшего недоумения.
  - speaker: Маражай Аэзирраэш
    text_clean: И твое изумление заставляет меня думать, что мон-кай еще примитивнее, чем я подозревал. Не говори мне, что узы крови налагают на вас какие-то особые запреты и табу.
