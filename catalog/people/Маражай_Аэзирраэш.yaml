    text_clean: Маражай прищуривается и смотрит на вас несколько секунд, словно пытаясь просверлить взглядом дырку у вас между глаз.
  - speaker: Маражай Аэзирраэш
    text_clean: Какой забавный образец примитивного мышления... Любой друкари стоит бесконечно выше любого мон-кай, и мы не скрываем своего отношения к скоту. Но мои собратья? Любой из них достоин настороженности, а те, кто уже показали свою силу и власть — сами по себе смертельная опасность. Я не наслаждаюсь подчинением — я умею принимать данность. И ждать, когда откроется слабое место, манящее мой клинок.
- guid: 1f833a8a-6614-419f-9185-f1cdba30ae8c
  event: Companions_Marazhai_48
  text: '"Фарказа Эзирраеш, Отравительница Асдружара и Отмеченная Шаймеш, была одной из таких возвышенных предводительниц друкари. Результат..." {n}Маражай небрежно взмахивает рукой, словно приглашая вас как следует полюбоваться его персоной.{/n} "...оправдал сложности".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Фарказа Эзирраеш, Отравительница Асдружара и Отмеченная Шаймеш, была одной из таких возвышенных предводительниц друкари. Результат...
