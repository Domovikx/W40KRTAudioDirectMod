  event: Companions_Marazhai_108
  text: '{n}Маражай скрещивает руки на груди и посылает вам многозначительную улыбку.{/n} "Ах как сильно тебе хотелось бы это узнать, да, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай скрещивает руки на груди и посылает вам многозначительную улыбку.
  - speaker: Маражай Аэзирраэш
    text_clean: Ах как сильно тебе хотелось бы это узнать, да, КЭП?
