- guid: 9aa65218-1381-49e9-99c7-b2dc5aafa043
  event: Companions_Marazhai_105
  text: '{n}Друкари бросает на вас ненавидящий взгляд.{/n} "Надо сказать, Назракею не требовалось много труда обернуть суд против меня — не после того, что ты устроил{mf||а} перед собранием архонтов".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари бросает на вас ненавидящий взгляд.
  - speaker: Маражай Аэзирраэш
    text_clean: Надо сказать, Назракею не требовалось много труда обернуть суд против меня — не после того, что ты устроил перед собранием архонтов.
- guid: c9a0b073-6779-47fd-81c2-99dfb637c8f9
  event: Companions_Marazhai_106
  text: '"После того, как Тервантьяс поссорился с ведьмами и лишился протекции кабала, его убежища в Комморре превратились в смертельную западню — полагаю, они уже разграблены и разрушены. Возможно, где-то в переплетениях Паутины... или в реальном мире. Хотя последнее — безумие даже для гемункула".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: После того, как Тервантьяс поссорился с ведьмами и лишился протекции кабала, его убежища в Комморре превратились в смертельную западню — полагаю, они уже разграблены и разрушены. Возможно, где-то в переплетениях Паутины... или в реальном мире. Хотя последнее — безумие даже для гемункула.
- guid: 987730e0-4ec6-4db9-ac93-9239bc4071c0
  event: Companions_Marazhai_107
  text: '"Когда гротеск конкурирующего кабала вырвал мне плечо с рукой. Когда мне нужно было средство выдавить из тебя правду на Обсидиановом суде. Когда у меня возникали личные пожелания, удовлетворить которые мог только мастер плоти".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Когда гротеск конкурирующего кабала вырвал мне плечо с рукой. Когда мне нужно было средство выдавить из тебя правду на Обсидиановом суде. Когда у меня возникали личные пожелания, удовлетворить которые мог только мастер плоти.
