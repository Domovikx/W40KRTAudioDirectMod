    text_clean: Мон-кай...
  - speaker: narrator
    text_clean: 'Друкари осекается. Вы видите, как у ксеноса сводит скулы, когда он с трудом выдавливает из себя:'
  - speaker: Маражай Аэзирраэш
    text_clean: '...КЭП. У меня есть для тебя поручение.'
- guid: 273c8769-054d-430b-bc0e-a2990db43289
  event: RMNC_Marazhai_StartingEvent_P2_25
  text: '"Славно, {name}. Поверь, ты никогда не смог бы обречь ее на худшую участь, чем я приготовил для нее. Теперь же, когда этот договор заключен..." {n}Маражай с хлопком возвращает пластину на место.{/n} "Мы оба можем идти".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Славно, КЭП. Поверь, ты никогда не смог бы обречь ее на худшую участь, чем я приготовил для нее. Теперь же, когда этот договор заключен...
  - speaker: narrator
    text_clean: Маражай с хлопком возвращает пластину на место.
  - speaker: Маражай Аэзирраэш
    text_clean: Мы оба можем идти.
- guid: 75238ce3-8c0c-465c-8126-937e63488bfa
  event: RMNC_Marazhai_StartingEvent_P2_26
  text: '"Все... несколько сложнее, чем ты способ{mf|ен|на} осознать. Наша старинная игра должна закончиться. Мой первый шаг пошел прахом из-за предательства Назракея — теперь мне остается только довести начатое до конца. Своими руками добить ее, пока она не добила меня".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Все... несколько сложнее, чем ты способен осознать. Наша старинная игра должна закончиться. Мой первый шаг пошел прахом из-за предательства Назракея — теперь мне остается только довести начатое до конца. Своими руками добить ее, пока она не добила меня.
- guid: 9d42ac2d-1c6f-43b4-a031-caf69159f89e
  event: RMNC_Marazhai_StartingEvent_P2_27
  text: '{n}Друкари издевательски скалится.{/n} "Твой страх почти осязаем. Восхитительно. Что ж, вернемся к тому, зачем я тебя позвал — Иремерисс. И твои обязанности передо мной".'
