  event: RMNC_Marazhai_StartingEvent_P2_14
  text: '{n}Друкари утробно смеется.{/n} "Я не жду от примитивных созданий осознавания того, что вам не по уму. Все, что мне нужно от тебя — понимание твоих обязательств".'
