  event: BNTRS_Reactivity_Marazhai_55
  text: '"М-м-м, какой интересный букет. Это из-за Вольного Торговца, да? Не могу различить, что это... ущемленные амбиции или просто ревность? Хочешь, я помогу тебе излить их?"'
  speaker: Маражай Аэзирраэш
