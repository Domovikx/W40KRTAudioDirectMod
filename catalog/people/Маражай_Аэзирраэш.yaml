  event: RMNC_Marazhai_StartingEvent_P2_13
  text: '{n}Холодное прикосновение когтистой перчатки застает врасплох: взяв вас за подбородок, Маражай наклоняется вперед — так близко, что вы видите узкую полоску темной бирюзы вокруг расширенных зрачков друкари.{/n} "Я могу показать тебе этот мир, {name}. Я могу научить тебя. Если ты будешь слушаться".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: 'Холодное прикосновение когтистой перчатки застает врасплох: взяв вас за подбородок, Маражай наклоняется вперед — так близко, что вы видите узкую полоску темной бирюзы вокруг расширенных зрачков друкари.'
