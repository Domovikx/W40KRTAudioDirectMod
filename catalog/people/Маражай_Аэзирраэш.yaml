    text_clean: Хм. Возможно, я высказался недостаточно понятно. Право забрать жизнь Эзирраеш...
- guid: b43e25a0-3921-4ab3-9dcf-e55af337a997
  event: RMNC_Marazhai_StartingEvent_P2_09
  text: '{n}Маражай обрывает сам себя — все его внимание теперь приковано к отогнутой пластине доспеха на плече. Спустя секунду он берется за ее край и со сдавленным стоном отдирает от доспеха — деталь с шипением покидает свое место. Друкари начинает руками разгибать помятую пластину — удивительно, сколько силы таится в его жилистом теле.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай обрывает сам себя — все его внимание теперь приковано к отогнутой пластине доспеха на плече. Спустя секунду он берется за ее край и со сдавленным стоном отдирает от доспеха — деталь с шипением покидает свое место. Друкари начинает руками разгибать помятую пластину — удивительно, сколько силы таится в его жилистом теле.
- guid: b7476828-2ccf-42d9-90d3-9f974557c2de
  event: RMNC_Marazhai_StartingEvent_P2_10
  text: '{n}Спустя пару секунд вас вдруг пронзает древний инстинкт — ощущение пристального внимания смертоносного хищника. Вы смотрите вверх: Маражай, заметивший ваш интерес, неслышно повернул голову и, склонившись, сверлит вас взглядом — насмешливым и многообещающим.{/n} "На что ты смотришь?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: 'Спустя пару секунд вас вдруг пронзает древний инстинкт — ощущение пристального внимания смертоносного хищника. Вы смотрите вверх: Маражай, заметивший ваш интерес, неслышно повернул голову и, склонившись, сверлит вас взглядом — насмешливым и многообещающим.'
  - speaker: Маражай Аэзирраэш
    text_clean: На что ты смотришь?
- guid: 6a2137ea-f34c-4690-a7a4-50b7916c79d5
  event: RMNC_Marazhai_StartingEvent_P2_11
  text: '"М, конечно же... я слышу твой заполошный пульс, {name}". {n}Друкари склоняет голову набок.{/n} "Что же ты чувствуешь, взирая на меня? Первобытный страх? Парализующий ужас? Или необъяснимый трепет? Позволь мне объяснить: ты заворожен{mf||а} близостью к гибели и твое сознание опьянено невероятностью того, что ты все же еще жив{mf||а}. Но ты не можешь осознать это, ибо не постигаешь пределов своих ощущений из-за ограничений. Ограничений, от которых избавлен мой мир".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: М, конечно же... я слышу твой заполошный пульс, КЭП.
  - speaker: narrator
    text_clean: Друкари склоняет голову набок.
  - speaker: Маражай Аэзирраэш
    text_clean: 'Что же ты чувствуешь, взирая на меня? Первобытный страх? Парализующий ужас? Или необъяснимый трепет? Позволь мне объяснить: ты заворожен близостью к гибели и твое сознание опьянено невероятностью того, что ты все же еще жив. Но ты не можешь осознать это, ибо не постигаешь пределов своих ощущений из-за ограничений. Ограничений, от которых избавлен мой мир.'
- guid: 82d39351-7859-4a05-9ffc-344e7fea976b
  event: RMNC_Marazhai_StartingEvent_P2_12
  text: '"Верно. Прямо в нервные узлы". {n}Друкари склоняет голову набок, его голос обретает бархатные ноты — он смакует каждое слово.{/n} "Прямая стимуляция триггерных зон, вызывающая постоянную, неослабевающую боль. Знаешь ли ты, какое наслаждение испытываешь, когда твое страдание звенит в унисон с чужим? Какой экстаз преисполняет тебя, когда собственная агония сливается с агонией врага? Это — то, из чего соткан мой мир, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Верно. Прямо в нервные узлы.
  - speaker: narrator
    text_clean: Друкари склоняет голову набок, его голос обретает бархатные ноты — он смакует каждое слово.
  - speaker: Маражай Аэзирраэш
    text_clean: Прямая стимуляция триггерных зон, вызывающая постоянную, неослабевающую боль. Знаешь ли ты, какое наслаждение испытываешь, когда твое страдание звенит в унисон с чужим? Какой экстаз преисполняет тебя, когда собственная агония сливается с агонией врага? Это — то, из чего соткан мой мир, КЭП.
