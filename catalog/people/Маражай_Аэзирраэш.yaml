  event: BNTRS_Reactivity_Marazhai_85
  text: '"Ты действительно хочешь знать ответ? Любопытство. Любопытство, которое я найду способ удовлетворить... наиболее полным и приятным образом".'
  speaker: Маражай Аэзирраэш
