  text: '"Точнее — визжал, как и подобает забойному скоту. Тогда, на разоренном мире, где я часами коверкал его душу и разум". {n}Маражай тянет слова, медленно наступая на дознавателя.{/n} "Твой слуга торговался за избавление от боли самыми страшными секретами — твоими, Хейнрикс ван Калокс, и твоей маленькой мон-кайской Инквизиции. Нужны ли они мне были? Нет. То, что я хотел узнать, было неведомо твоему слуге — но он все не успокаивался, отчаянно пытаясь купить мое милосердие. Все бормотал и бормотал без устали — и о тебе, которого так боялся, и о своей обожаемой хозяйке... Лихтенхарт, не так ли?"'
