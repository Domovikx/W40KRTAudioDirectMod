  event: Companions_Marazhai_53
  text: '"Нужен иной повод, кроме выживания и амбиций? Комморра не терпит слабых. Комморра уважает лишь силу и хитрость. Ты либо идешь вверх по трупам своих врагов, либо становишься одной из ступенек".'
  speaker: Маражай Аэзирраэш
