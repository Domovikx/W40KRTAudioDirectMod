  text: '"Не прикидывайся, Вольный Торговец. Мон-кай знают, когда на их мир или судно придет жатва. Мон-кай прячутся или пытаются огрызаться. Мон-кай откуда-то известно то же, что и нам — и я подозреваю, что поиски этой утечки стоит начинать с тебя. В конце концов, с тебя и началась череда этих... накладок".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Не прикидывайся, Вольный Торговец. Мон-кай знают, когда на их мир или судно придет жатва. Мон-кай прячутся или пытаются огрызаться. Мон-кай откуда-то известно то же, что и нам — и я подозреваю, что поиски этой утечки стоит начинать с тебя. В конце концов, с тебя и началась череда этих... накладок.
