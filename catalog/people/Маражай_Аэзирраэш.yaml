    text_clean: Он одним движением выкручивает руку из вашей хватки и смотрит на вас из-под полуопущенных век.
  - speaker: Маражай Аэзирраэш
    text_clean: Я услышал тебя, КЭП. И это может быть... необычно.
- guid: bcc24321-4d49-4e2a-b696-70266ceb57c7
  event: Companions_Marazhai_76
  text: '{n}Маражай щелкает языком.{/n} "Мандрагоры, которых я когда-то использовал, чтобы добраться до тебя. Твари из бездн Комморры решили, что могут застать меня врасплох здесь, на твоей посудине. Я преподал им урок. Одному вырезал символ Эзирраеш на горле и вышвырнул обратно в тени — чтобы стал посланием тем, кто не рискнул прийти за мной в этот раз".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай щелкает языком.
  - speaker: Маражай Аэзирраэш
    text_clean: Мандрагоры, которых я когда-то использовал, чтобы добраться до тебя. Твари из бездн Комморры решили, что могут застать меня врасплох здесь, на твоей посудине. Я преподал им урок. Одному вырезал символ Эзирраеш на горле и вышвырнул обратно в тени — чтобы стал посланием тем, кто не рискнул прийти за мной в этот раз.
- guid: 2d8dce6f-308f-4acd-9f20-9820984cb7f0
  event: Companions_Marazhai_77
  text: '{n}Маражай со смехом отстраняется от вас.{/n} "Тогда не говори того, чего на самом деле не думаешь, {name}. Это... небезопасно для твоего вида".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай со смехом отстраняется от вас.
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда не говори того, чего на самом деле не думаешь, КЭП. Это... небезопасно для твоего вида.
- guid: 921c72d5-df6a-4311-8ae2-934d34f03f12
  event: Companions_Marazhai_78
  text: '{n}Маражай окидывает взглядом мостик корабля. На мгновение вам кажется, что в обычно надменно-насмешливом взгляде друкари читается растерянность.{/n} "Я... должен привыкнуть к своим новым обстоятельствам. И этому ведру, которое мон-кай называют пустотным кораблем. Эти сплавы переборок... столь примитивно..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай окидывает взглядом мостик корабля. На мгновение вам кажется, что в обычно надменно-насмешливом взгляде друкари читается растерянность.
  - speaker: Маражай Аэзирраэш
    text_clean: Я... должен привыкнуть к своим новым обстоятельствам. И этому ведру, которое мон-кай называют пустотным кораблем. Эти сплавы переборок... столь примитивно...
- guid: db62e461-ad78-42aa-8767-db58e8ead814
  event: Companions_Marazhai_79
  text: '"Явиться на место встречи с остатками Опустошительной бури. Меня снедает любопытство, что это — ловушка? Или же мои бывшие подданные настолько отчаялись, что действительно решили играть в открытую? Хм... посмотрим".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Явиться на место встречи с остатками Опустошительной бури. Меня снедает любопытство, что это — ловушка? Или же мои бывшие подданные настолько отчаялись, что действительно решили играть в открытую? Хм... посмотрим.
- guid: 41240987-2c2e-4f51-ac36-3196d6966361
  event: Companions_Marazhai_80
  text: '"Дальше" — слишком расплывчатое понятие. Когда придет время, я вернусь в Комморру и {d|Encyclopedia:CompMarazhai_Archont}займу трон архонта{/d} — место, которое принадлежит мне по праву. А пока... пока я остаюсь здесь, подле тебя. Я чую в будущем еще немало крови и страданий, которые мне будет жаль упустить".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Дальше" — слишком расплывчатое понятие. Когда придет время, я вернусь в Комморру и займу трон архонта — место, которое принадлежит мне по праву. А пока... пока я остаюсь здесь, подле тебя. Я чую в будущем еще немало крови и страданий, которые мне будет жаль упустить.
- guid: 7adb94a6-986a-4851-a536-076e41fa352f
  event: Companions_Marazhai_81
  text: '{n}Маражай пожимает плечом.{/n} "Кабал считай что мертв... и с ним умерли и {d|Encyclopedia:CompMarazhai_Corsair}те, кто желал мне смерти{/d}. Теперь, когда меня не разыскивают убийцы, я волен принять любое решение". {n}Друкари заинтригованно хмыкает.{/n} "Странное ощущение. Я разберусь с этим позже, а пока что — нас с тобой ждет новая кровь и свежие страдания. Не желаю пропустить все веселье".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай пожимает плечом.
  - speaker: Маражай Аэзирраэш
    text_clean: Кабал считай что мертв... и с ним умерли и те, кто желал мне смерти. Теперь, когда меня не разыскивают убийцы, я волен принять любое решение.
  - speaker: narrator
    text_clean: Друкари заинтригованно хмыкает.
  - speaker: Маражай Аэзирраэш
    text_clean: Странное ощущение. Я разберусь с этим позже, а пока что — нас с тобой ждет новая кровь и свежие страдания. Не желаю пропустить все веселье.
- guid: c45ecd38-f84e-4402-974a-f55a5bece65d
  event: Companions_Marazhai_82
  text: '"Тогда что еще тебе нужно знать?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда что еще тебе нужно знать?
- guid: adb26f9d-9cd1-4e6b-9bed-175857fe2e73
  event: Companions_Marazhai_83
  text: '"Ммм. Занятное объяснение того, что ты не в силах постичь. Хотя и весьма предсказуемое".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ммм. Занятное объяснение того, что ты не в силах постичь. Хотя и весьма предсказуемое.
- guid: dd9ad9ba-9445-43cc-bdb3-9b0cd6f6d8af
  event: Companions_Marazhai_84
  text: '"Хм. Почему я не удивлен тому, как быстро ты уш{mf|ел|ла} от темы".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хм. Почему я не удивлен тому, как быстро ты ушел от темы.
- guid: 7204b806-adbd-466a-813f-cfcfffb6fbbd
  event: Companions_Marazhai_85
  text: '"Я начал рассылать шпионов и убийц. Мои глаза и уши проникли на твое судно. Проникли в ваши города. И отыскали нити, что вели на один из твоих миров. Нити, сошедшиеся на обожженном мон-кай — источнике информации о том, где и когда нанесет удар мой кабал. Небольшой фокус с отвлечением тебя от планеты..." {n}Маражай взмахивает ладонью.{/n} "...и твой маленький информатор оказался в моих умелых руках".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я начал рассылать шпионов и убийц. Мои глаза и уши проникли на твое судно. Проникли в ваши города. И отыскали нити, что вели на один из твоих миров. Нити, сошедшиеся на обожженном мон-кай — источнике информации о том, где и когда нанесет удар мой кабал. Небольшой фокус с отвлечением тебя от планеты...
  - speaker: narrator
    text_clean: Маражай взмахивает ладонью.
  - speaker: Маражай Аэзирраэш
    text_clean: '...и твой маленький информатор оказался в моих умелых руках.'
- guid: 4ac0f755-6d4c-4f04-ad18-c5aafe01e2ec
  event: Companions_Marazhai_86
  text: '"Это особая страта Комморры. Высокородные друкари, рожденные при особых условиях: их колыбелью до рождения была не амниотическая колба для вызревания, а живая утроба. Носить плод на протяжении долгого времени — почти что смертный приговор в Комморре: в таком положении друкари слишком уязвима для своих врагов и бесполезна в рейдах. Лишь самые могущественные друкари, способные окружить себя достойной защитой, могут позволить себе подобную роскошь в Комморре".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: 'Это особая страта Комморры. Высокородные друкари, рожденные при особых условиях: их колыбелью до рождения была не амниотическая колба для вызревания, а живая утроба. Носить плод на протяжении долгого времени — почти что смертный приговор в Комморре: в таком положении друкари слишком уязвима для своих врагов и бесполезна в рейдах. Лишь самые могущественные друкари, способные окружить себя достойной защитой, могут позволить себе подобную роскошь в Комморре.'
- guid: 04602e77-1253-4bc3-aacd-d00975380e52
  event: Companions_Marazhai_87
  text: '"А значит, пришло время узнать, что творится с кабалом Опустошительной бури, обезглавленным и брошенным на поживу Комморре. Хм... выживших наверняка погонят в реальный мир, чтобы предать власти Сай''лантреш... {name}, ты долж{mf|ен|на} найти их. Если мы встретим остатки кабала в этом измерении — я хочу говорить с ними".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: А значит, пришло время узнать, что творится с кабалом Опустошительной бури, обезглавленным и брошенным на поживу Комморре. Хм... выживших наверняка погонят в реальный мир, чтобы предать власти Сай'лантреш... КЭП, ты должен найти их. Если мы встретим остатки кабала в этом измерении — я хочу говорить с ними.
- guid: bfa2ff54-7176-4299-8e17-cec6162d96e7
  event: Companions_Marazhai_88
  text: '"Мы делим одну кровь и появились на свет из одной материнской утробы. Мы оба — истиннорожденные, и оба стоим выше сброда, появляющегося из пробирок и колб".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мы делим одну кровь и появились на свет из одной материнской утробы. Мы оба — истиннорожденные, и оба стоим выше сброда, появляющегося из пробирок и колб.
- guid: 08031abc-ff87-4b0a-928f-f73d2ba415a7
  event: Companions_Marazhai_89
  text: '{n}Маражай суживает глаза.{/n} "Умерь спесь, {name}. Иремерисс была умна и опасна, и если бы я не считался с ее способностями и силой, то давно бы отправился на корм ур-гулям. Сам факт того, что она обошла меня, уже говорит о многом. И я не собирался давать ей повод устранить меня как изменника. Нет, наше соперничество, наша маленькая игра, которая длилась с самого рождения, требовала времени. Вдобавок... когда ты на вершине, тебе надо как-то разгонять скуку. Эта игра развлекала нас и держала в страхе весь кабал".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай суживает глаза.
  - speaker: Маражай Аэзирраэш
    text_clean: Умерь спесь, КЭП. Иремерисс была умна и опасна, и если бы я не считался с ее способностями и силой, то давно бы отправился на корм ур-гулям. Сам факт того, что она обошла меня, уже говорит о многом. И я не собирался давать ей повод устранить меня как изменника. Нет, наше соперничество, наша маленькая игра, которая длилась с самого рождения, требовала времени. Вдобавок... когда ты на вершине, тебе надо как-то разгонять скуку. Эта игра развлекала нас и держала в страхе весь кабал.
- guid: 7961aea8-b3ee-4e16-9b14-60c677da1017
  event: Companions_Marazhai_90
  text: '{n}Маражай растягивает губы в улыбке и лениво манит вас рукой.{/n} "Подойди, мо{mf|й|я} маленьк{mf|ий|ая} звер{mf|ек|ушка}. Я вижу, как тебя снедает желание быть ближе".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай растягивает губы в улыбке и лениво манит вас рукой.
  - speaker: Маражай Аэзирраэш
    text_clean: Подойди, мой маленький зверек. Я вижу, как тебя снедает желание быть ближе.
- guid: 98133ba9-6c8c-488f-917c-df7365779837
  event: Companions_Marazhai_91
  text: '{n}Маражай склоняет голову при вашем приближении. Уголки его губ приподнимаются в многообещающей улыбке.{/n} "Я и мое внимание твои, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай склоняет голову при вашем приближении. Уголки его губ приподнимаются в многообещающей улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Я и мое внимание твои, КЭП.
- guid: 0b3d2a43-8e6d-4fff-8a06-6fce9c0d9aa7
  event: Companions_Marazhai_92
  text: '{n}При виде вас глаза Маражая вспыхивают огнем.{/n} "Чего ты жаждешь, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: При виде вас глаза Маражая вспыхивают огнем.
  - speaker: Маражай Аэзирраэш
    text_clean: Чего ты жаждешь, КЭП?
- guid: 3284170d-b9a0-405b-96d8-c28faf5e3905
  event: Companions_Marazhai_93
  text: '{n}Маражай с разъяренным шипением замахивается — и все же неимоверным усилием воли сдерживает себя и убирает руку.{/n} "Еще раз я услышу про жалость, {name} — и ты горько, горько пожалеешь об этом. Я закончил с тобой говорить".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай с разъяренным шипением замахивается — и все же неимоверным усилием воли сдерживает себя и убирает руку.
  - speaker: Маражай Аэзирраэш
    text_clean: Еще раз я услышу про жалость, КЭП — и ты горько, горько пожалеешь об этом. Я закончил с тобой говорить.
- guid: 9eb319ec-ca02-47ab-9248-28b8cf124680
  event: Companions_Marazhai_94
  text: '{n}Маражай со скучающим видом поднимает бровь.{/n} "Припоминаю. Что тебе до того?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай со скучающим видом поднимает бровь.
  - speaker: Маражай Аэзирраэш
    text_clean: Припоминаю. Что тебе до того?
- guid: d4487c0c-3b51-4520-bd42-85af72374207
  event: Companions_Marazhai_95
  text: '{n}Маражай окидывает вас взглядом.{/n} "Хм. Верно. Но я не просто наймит, {name}. Странно, что ты не уч{mf|ел|ла} этого, когда предложил{mf||а} мне союз. Впрочем... неважно".'
  speaker: Маражай Аэзирраэш
