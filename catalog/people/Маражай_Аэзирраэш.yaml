- guid: 023200a3-4737-4089-a124-f981070e381b
  event: ''
  text: '{n}Маражай бросает ленивый взгляд на Кибеллу.{/n} "Вот видишь? Твоя смертоносная зверушка как раз собирает мясное ассорти для своих забавных ритуалов".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай бросает ленивый взгляд на Кибеллу.
  - speaker: Маражай Аэзирраэш
    text_clean: Вот видишь? Твоя смертоносная зверушка как раз собирает мясное ассорти для своих забавных ритуалов.
- guid: 0236fc16-795a-4fc0-be59-d33fca6c7d5b
  event: ''
  text: '"Или же..." {n}Маражай бросает взгляд в сторону.{/n} "Или же я найду нечто... совершенно иное. Но преисполненное смысла".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Или же...
  - speaker: narrator
    text_clean: Маражай бросает взгляд в сторону.
  - speaker: Маражай Аэзирраэш
    text_clean: Или же я найду нечто... совершенно иное. Но преисполненное смысла.
- guid: 02c80684-8666-423e-9ebb-d868fdfe4f33
  event: ''
  text: '{n}Маражай лениво озирается, разглядывая ропщущую толпу. Его пальцы, еще секунду назад небрежно ласкавшие когтями ваше лицо, сползают вниз и чуть сжимаются на вашем горле.{/n} "Так-то ты следишь за своими слугами, мо{mf|й|я} звер{mf|ек|ушка}? Их дерзость оскорбляет меня. Убей одного из зачинщиков — мне на потеху".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай лениво озирается, разглядывая ропщущую толпу. Его пальцы, еще секунду назад небрежно ласкавшие когтями ваше лицо, сползают вниз и чуть сжимаются на вашем горле.
  - speaker: Маражай Аэзирраэш
    text_clean: Так-то ты следишь за своими слугами, мой зверек? Их дерзость оскорбляет меня. Убей одного из зачинщиков — мне на потеху.
- guid: 04c19cc3-1650-45e8-9554-14e99e97c85a
  event: ''
  text: '{n}Маражай безучастно хмыкает.{/n} "Ты даже поломался скучно. Давай же, вперед. Таких, как ты, Комморра проглатывает миллионами каждодневно — ты не успеешь настрадаться своим мученичеством вволю".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай безучастно хмыкает.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты даже поломался скучно. Давай же, вперед. Таких, как ты, Комморра проглатывает миллионами каждодневно — ты не успеешь настрадаться своим мученичеством вволю.
- guid: 075c7c56-f882-45d5-9385-ba1e924fc0e4
  event: ''
  text: '"Это поправимо". {n}Маражай не отрывает придирчивого взгляда от своих острых когтей.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Это поправимо.
  - speaker: narrator
    text_clean: Маражай не отрывает придирчивого взгляда от своих острых когтей.
- guid: 0806744b-6ec4-44ba-bc77-c611cc811d68
  event: ''
  text: '{n}Маражай прищелкивает языком и нежно проводит когтями перчатки по предмету в руке — тот откликается тихим писком.{/n} "Кажется, ты вош{mf|ел|ла} во вкус боли, мон-кай. Что ж, будь по-твоему: сопротивляйся неизбежному, и познаешь новую грань страданий".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай прищелкивает языком и нежно проводит когтями перчатки по предмету в руке — тот откликается тихим писком.
  - speaker: Маражай Аэзирраэш
    text_clean: 'Кажется, ты вошел во вкус боли, мон-кай. Что ж, будь по-твоему: сопротивляйся неизбежному, и познаешь новую грань страданий.'
- guid: 09a30207-ac4c-4ca0-ac98-715397dc7f1a
  event: ''
  text: '{n}Маражай отвечает недоброму гулу презрительным смехом.{/n} "Прекрасно! Лучшего я и не ждал! Слышишь, сколько гнева вызывает одно мое появление? О, эту бойню я запомню надол..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай отвечает недоброму гулу презрительным смехом.
  - speaker: Маражай Аэзирраэш
    text_clean: Прекрасно! Лучшего я и не ждал! Слышишь, сколько гнева вызывает одно мое появление? О, эту бойню я запомню надол...
- guid: 0a2fe212-37a0-4cc4-87f7-9f2f91f49137
  event: ''
  text: '"Не сомневаюсь". {n}Маражай неслышно пересекает разделяющее вас пространство и наклоняется к вам. Его дыхание щекочет ухо.{/n} "И не заставляй меня ждать".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Не сомневаюсь.
  - speaker: narrator
    text_clean: Маражай неслышно пересекает разделяющее вас пространство и наклоняется к вам. Его дыхание щекочет ухо.
  - speaker: Маражай Аэзирраэш
    text_clean: И не заставляй меня ждать.
- guid: 0a384ff4-def2-407d-9e14-7257d12ed8f1
  event: ''
  text: '{n}Маражай останавливает вас, в его взгляде плещется с трудом сдерживаемый гнев.{/n} "Не тебе лишать жизни мою собственность".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай останавливает вас, в его взгляде плещется с трудом сдерживаемый гнев.
  - speaker: Маражай Аэзирраэш
    text_clean: Не тебе лишать жизни мою собственность.
- guid: 0a85f80e-fd7f-4617-83a5-e0574339b58d
  event: ''
  text: '{n}Маражай кивает вам.{/n} "Прекрасно. Координаты у нас есть. Что ждать — нам известно. Я заточу клинки — они мне явно понадобятся при воссоединении с моими собратьями. По крайней мере... я очень на это надеюсь".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай кивает вам.
  - speaker: Маражай Аэзирраэш
    text_clean: Прекрасно. Координаты у нас есть. Что ждать — нам известно. Я заточу клинки — они мне явно понадобятся при воссоединении с моими собратьями. По крайней мере... я очень на это надеюсь.
- guid: 0b3e1f66-7919-4105-9871-288c05e2c9e8
  event: ''
  text: '{n}Маражай молча переваривает слова Арлекина. Наконец на его лице появляется тень обычной ухмылки.{/n} "Я... понял тебя, Аребенниан".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай молча переваривает слова Арлекина. Наконец на его лице появляется тень обычной ухмылки.
  - speaker: Маражай Аэзирраэш
    text_clean: Я... понял тебя, Аребенниан.
- guid: 0c53e7c3-4155-44d1-8027-a223b2f214fd
  event: ''
  text: '"Говоря проще: да, здесь использованы технологии других рас, но тебе об этом знать не полагается". {n}Маражай не отводит насмешливого взгляда от техножреца.{/n} "Иногда я поражаюсь, насколько примитивно искусство обмана у {g|Encyclopedia:MonKeigh}мон-кай{/g}. Побольше затейливых слов, щепотка таинственности, и вот твои слова уже внушают священный трепет".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: 'Говоря проще: да, здесь использованы технологии других рас, но тебе об этом знать не полагается.'
  - speaker: narrator
    text_clean: Маражай не отводит насмешливого взгляда от техножреца.
  - speaker: Маражай Аэзирраэш
    text_clean: Иногда я поражаюсь, насколько примитивно искусство обмана у мон-кай. Побольше затейливых слов, щепотка таинственности, и вот твои слова уже внушают священный трепет.
- guid: 0ded0938-fa56-4f8c-a84d-a096e8bf8d64
  event: ''
  text: '{n}Маражай трет пальцы друг о друга, издавая отвратительный металлический звук.{/n} "Мы подружимся. Обещаю".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай трет пальцы друг о друга, издавая отвратительный металлический звук.
  - speaker: Маражай Аэзирраэш
    text_clean: Мы подружимся. Обещаю.
- guid: 0e70f273-de67-4180-9b50-7a2c5869d4b2
  event: ''
  text: '{n}Друкари делает шаг вперед — и вдруг останавливается и бросает взгляд на вас.{/n} "Мо{mf|й|я} маленьк{mf|ий|ая} звер{mf|ек|ушка}, ты был{mf||а} столь прилежн{mf|ым|ой} учени{mf|ком|цей}... почему бы тебе не выбрать, как умрет этот скот". {n}Маражай следит за каждым движением вашего лица.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари делает шаг вперед — и вдруг останавливается и бросает взгляд на вас.
  - speaker: Маражай Аэзирраэш
    text_clean: Мой маленький зверек, ты был столь прилежным учеником... почему бы тебе не выбрать, как умрет этот скот.
  - speaker: narrator
    text_clean: Маражай следит за каждым движением вашего лица.
- guid: 10542589-41bf-4f5a-b645-7383bd92db0b
  event: ''
  text: '{n}Маражай хватает вас за подбородок и задирает вам голову, любуясь клеймом.{/n} "Итак, мо{mf|й|я} маленьк{mf|ий|ая} звер{mf|ек|ушка}... Я жажду пиршества. И ты... ты идешь со мной. Сейчас же".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай хватает вас за подбородок и задирает вам голову, любуясь клеймом.
  - speaker: Маражай Аэзирраэш
    text_clean: Итак, мой маленький зверек... Я жажду пиршества. И ты... ты идешь со мной. Сейчас же.
- guid: 12354c78-fa27-4b7c-a486-bae8c4ff2da2
  event: ''
  text: '"Она клянется в вечной верности и, кажется, знает, за какой конец клинка держаться, чтобы им размахивать". {n}Маражай пренебрежительно взмахивает рукой.{/n} "Одной мон-кай в свите больше, одной меньше..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Она клянется в вечной верности и, кажется, знает, за какой конец клинка держаться, чтобы им размахивать.
  - speaker: narrator
    text_clean: Маражай пренебрежительно взмахивает рукой.
  - speaker: Маражай Аэзирраэш
    text_clean: Одной мон-кай в свите больше, одной меньше...
- guid: 127885fc-4344-48e2-a1b9-ad8464fb8e80
  event: ''
  text: '{n}Маражай прищуривает глаза.{/n} "Я лично выпотрошу вот этого, {name}. Поспеши со своими расспросами, пока мое терпение не иссякло".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай прищуривает глаза.
  - speaker: Маражай Аэзирраэш
    text_clean: Я лично выпотрошу вот этого, КЭП. Поспеши со своими расспросами, пока мое терпение не иссякло.
- guid: 140f0f54-591b-463e-899a-3e8f89bcb23c
  event: ''
  text: '"Подобающий финал". {n}Маражай презрительно фыркает и бросает на вас взгляд.{/n} "Я закончил. Полагаю, теперь мы можем перейти к важному — найти то судно, о котором талдычил Аребенниан, и заняться Иремерисс".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Подобающий финал.
  - speaker: narrator
    text_clean: Маражай презрительно фыркает и бросает на вас взгляд.
  - speaker: Маражай Аэзирраэш
    text_clean: Я закончил. Полагаю, теперь мы можем перейти к важному — найти то судно, о котором талдычил Аребенниан, и заняться Иремерисс.
- guid: 1415adb1-7947-4f4e-afde-6de3d0147241
  event: ''
  text: '{n}Маражай морщится, словно услышал что-то неприятное.{/n} "Ты... нарушаешь правила игры. Будь внимательнее, если желаешь продолжать ее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай морщится, словно услышал что-то неприятное.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты... нарушаешь правила игры. Будь внимательнее, если желаешь продолжать ее.
- guid: 141d3a34-a04a-4381-a7cd-535c78085412
  event: ''
  text: '"Хотя..." {n}Маражай словно что-то припоминает, и на его лице появляется выражение удовлетворения.{/n} "Забудь. На самом деле... это лишь подтверждение того, какой спектакль нас ожидает".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хотя...
  - speaker: narrator
    text_clean: Маражай словно что-то припоминает, и на его лице появляется выражение удовлетворения.
  - speaker: Маражай Аэзирраэш
    text_clean: Забудь. На самом деле... это лишь подтверждение того, какой спектакль нас ожидает.
- guid: 15177235-09fa-40ac-91aa-a67bb8b2ef24
  event: ''
  text: '{n}Маражай, кажется, полностью пропускает тираду Чорды мимо ушей и как ни в чем не бывало продолжает, неотрывно рассматривая человека со вскрытым черепом:{/n} "Жаль, что Вольный Торговец, с которым сошлись мои пути, не способ{mf|ен|на} на подобные тонкости удовольствий... или же способ{mf|ен|на}?" {n}Обжигающий взгляд ксеноса упирается в вас.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: 'Маражай, кажется, полностью пропускает тираду Чорды мимо ушей и как ни в чем не бывало продолжает, неотрывно рассматривая человека со вскрытым черепом:'
  - speaker: Маражай Аэзирраэш
    text_clean: Жаль, что Вольный Торговец, с которым сошлись мои пути, не способен на подобные тонкости удовольствий... или же способен?
  - speaker: narrator
    text_clean: Обжигающий взгляд ксеноса упирается в вас.
- guid: 15298f3e-29e4-470d-a2e1-40530cecd241
  event: ''
  text: '{n}Маражай тонко улыбается.{/n} "Осторожнее — я могу решить, что ты размяк{mf||ла} и ослабел{mf||а}". {n}Чуть помедлив, он добавляет — тише и раздраженнее:{/n} "Я скажу это один только раз, {name}: ты — причина не только всех моих бед, но и того, что я выжил — невзирая на ярость всей Комморры и гнев Черного сердца. Считай это признание изъявлением моей благодарности".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай тонко улыбается.
  - speaker: Маражай Аэзирраэш
    text_clean: Осторожнее — я могу решить, что ты размяк и ослабел.
  - speaker: narrator
    text_clean: 'Чуть помедлив, он добавляет — тише и раздраженнее:'
  - speaker: Маражай Аэзирраэш
    text_clean: 'Я скажу это один только раз, КЭП: ты — причина не только всех моих бед, но и того, что я выжил — невзирая на ярость всей Комморры и гнев Черного сердца. Считай это признание изъявлением моей благодарности.'
- guid: 15e4dcc8-3eaa-49f4-a160-4648c85c29cb
  event: ''
  text: '{n}Маражай убирает выбившуюся прядь со лба и плотоядно улыбается.{/n} "Что ж, {name}. Я развлекся на славу. Залижи раны как следует, прежде чем звать меня снова".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай убирает выбившуюся прядь со лба и плотоядно улыбается.
  - speaker: Маражай Аэзирраэш
    text_clean: Что ж, КЭП. Я развлекся на славу. Залижи раны как следует, прежде чем звать меня снова.
- guid: 168f1ec9-ce66-44b7-badb-f91041bbc4d8
  event: ''
  text: '{n}Маражай окидывает взглядом собравшихся. На его узком костистом лице написан сдержанный восторг, а глаза затягивает поволока эйфории.{/n} "Знали бы вы, насколько сладок ваш ужас и гнев... и как его много... восхитительно!"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай окидывает взглядом собравшихся. На его узком костистом лице написан сдержанный восторг, а глаза затягивает поволока эйфории.
  - speaker: Маражай Аэзирраэш
    text_clean: Знали бы вы, насколько сладок ваш ужас и гнев... и как его много... восхитительно!
- guid: 17569e89-d37f-4925-8c24-9d5fd9204ef7
  event: ''
  text: '{n}Маражай цыкает зубом.{/n} "Жаль, очень жаль... меня изрядно развлекала наша маленькая игра. Что ж, оставайся в своем унылом ограниченном мирке — я найду себе занятие поинтереснее тебя".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай цыкает зубом.
  - speaker: Маражай Аэзирраэш
    text_clean: Жаль, очень жаль... меня изрядно развлекала наша маленькая игра. Что ж, оставайся в своем унылом ограниченном мирке — я найду себе занятие поинтереснее тебя.
- guid: 1cabb0a8-36d1-4371-a0f3-4b590f4d5eb1
  event: ''
