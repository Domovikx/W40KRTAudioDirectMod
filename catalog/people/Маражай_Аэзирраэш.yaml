  event: Companions_Marazhai_55
  text: '"После того, первого раза... я постепенно привыкаю к странствиям за вуаль. Только мон-кай могла прийти в голову мысль странствовать по галактике таким самоубийственным образом. Но знаешь что? Это нечто новое. И будоражащее". {n}Маражай взмахивает ладонью.{/n} "В любом случае я теперь знаю, с чем имею дело. А следовательно, найду способ этому противостоять".'
  speaker: Маражай Аэзирраэш
  parts:
