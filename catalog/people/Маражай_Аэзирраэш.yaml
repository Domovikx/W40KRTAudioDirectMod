  text: '{n}Ксенос делает паузу, чуть откидывая назад голову и пристально изучая вас взглядом.{/n} "Ты прискорбно мало отличаешься от других, менее сообразительных особей. И все же, мон-кай, все же ты не так{mf|ой|ая}, как они... ведь ты из числа их правителей, верно? "Вольный Торговец", так тебя называют? Что ж, Вольный Торговец, раз ты все же соизволил{mf||а} явиться на встречу, открой мне свой маленький секрет".'
