  event: BNTRS_Reactivity_Marazhai_94
  text: '"Если бы ты довела свое "перевоспитание" в Комморре до конца, то могла бы сейчас вкушать свою боль и одиночество словно изысканное явство. Эх. Мы все жалеем об упущенных возможностях слишком поздно, не так ли?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Если бы ты довела свое "перевоспитание" в Комморре до конца, то могла бы сейчас вкушать свою боль и одиночество словно изысканное явство. Эх. Мы все жалеем об упущенных возможностях слишком поздно, не так ли?
- guid: 641022af-6435-442b-a5bd-25e52a7fff84
  event: BNTRS_Reactivity_Marazhai_98
  text: '"Разве это не прекрасно? Ради Вольного Торговца Ирлиэт лишилась самого дорогого, чем обладала. Сколько боли принес этот выбор. Сколько страха..."'
  speaker: Маражай Аэзирраэш
