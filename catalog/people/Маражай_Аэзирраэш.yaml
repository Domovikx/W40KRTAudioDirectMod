  event: RMNC_Marazhai_StartingEvent_P2_15
  text: '{n}Губы Маражая растягиваются в улыбке.{/n} "Покорн{mf|ый|ая} питом{mf|ец|ица}. Хорошо". {n}Он наклоняется еще ближе — и вдруг отталкивает вас, отстраняясь с безразличным видом и с хлопком возвращая деталь доспеха на место.{/n} "Тогда начни с исполнения моего приказа. Если мы встретим ее, то Иремерисс будет моей. А теперь — иди, {name}. Я с тобой закончил. Пока".'
  speaker: Маражай Аэзирраэш
