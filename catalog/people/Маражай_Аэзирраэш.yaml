  event: BNTRS_Stressful_Marazhai_115
  text: '"В тебе скрыт огромный потенциал. Сильная, волевая, упорная в сопротивлении жертва... Из тебя бы вышла прекрасная игрушка боли".'
  speaker: Маражай Аэзирраэш
