- guid: 8fa773eb-670b-49e1-924e-c3156808942a
  event: Companions_Marazhai_115
  text: '"А, сообразил{mf||а}, о ком речь, да?" {n}Маражай осклабляется, но его улыбка тут же тает.{/n} "Твари не угомонились после своего фиаско в шпиле Опустошительной бури. Они хотят моей крови и боли, потому решили наведаться на твою посудину и попытаться застать меня врасплох. Напрасно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: А, сообразил, о ком речь, да?
  - speaker: narrator
    text_clean: Маражай осклабляется, но его улыбка тут же тает.
  - speaker: Маражай Аэзирраэш
    text_clean: Твари не угомонились после своего фиаско в шпиле Опустошительной бури. Они хотят моей крови и боли, потому решили наведаться на твою посудину и попытаться застать меня врасплох. Напрасно.
- guid: db48ef4e-beea-44ad-8125-a047d7f74983
  event: Companions_Marazhai_116
  text: '{n}Маражай взирает на вас с насмешливой снисходительностью.{/n} "Признаю, ты изрядно повеселил{mf||а} меня, {name}. {d|Encyclopedia:MiniJealousyRomanceBroken}Сдал{mf|ся|ась} и сбежал{mf||а}{/d} без единого слова! Можно ли унизить себя более, чем это сделал{mf||а} ты?" {n}Друкари смеется с искренним наслаждением.{/n} "А, мне даже не хочется марать об тебя руки после этого! Можешь жить — со славой никчемной трусливой твари".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай взирает на вас с насмешливой снисходительностью.
