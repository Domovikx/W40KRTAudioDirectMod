  event: RMNC_Marazhai_StartingEvent_P2_21
  text: '"Да. Я ценил ее, пока она не зашла слишком далеко в своих попытках избавиться от меня. Она ценила меня, пока я не отказался молча подставить горло под клинок. Отношения зашли в тупик. Осталось лишь перерубить этот узел".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Да. Я ценил ее, пока она не зашла слишком далеко в своих попытках избавиться от меня. Она ценила меня, пока я не отказался молча подставить горло под клинок. Отношения зашли в тупик. Осталось лишь перерубить этот узел.
- guid: 2bc6dc53-f7f9-4279-b347-07c53883186a
  event: RMNC_Marazhai_StartingEvent_P2_22
  text: '{n}Маражай с довольным смешком уклоняется от удара и подается назад.{/n} "Напрасно. Впрочем, неважно. Вернемся к твоим обязательствам".'
  speaker: Маражай Аэзирраэш
  parts:
