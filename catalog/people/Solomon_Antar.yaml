  event: ''
  text: '{n}Соломон усмехается.{/n} "Блестящее суждение. Что-то я забыл, что {d|Encyclopedia:CharGen_Arbitrator}вы собирали подать{/d} с не меньшего числа миров, чем я. У меня нет твердой гипотезы, зачем губернатор задерживает нас, но есть план: не будем выдавать своей осведомленности, пока не появится шанс для успешной атаки — мы на чужой территории, так что действовать надо внезапно и наверняка. Теперь договоримся об условном сигнале".'
