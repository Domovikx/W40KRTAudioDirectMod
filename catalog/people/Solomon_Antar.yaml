  event: BNTRS_DLC2_Solomorne_06
  text: '"Вы как-то спросили, что я люблю читать, и я обещал поделиться книгами. Охотно обсужу с вами поправки в законах за прошлые два столетия — по-моему, этот период наиболее интересен".'
