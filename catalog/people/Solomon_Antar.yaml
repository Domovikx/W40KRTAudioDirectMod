- guid: ab9a1504-f6c7-4dbd-890f-8a7dea481861
  event: BNTRS_DLC2_Solomorne_118
  text: '"Я не обсуждаю приказы, ведьма, и без колебаний делаю то, что должно. Мне достаточно и того почета, что Вольный Торговец велел{mf||а} мне избрать маршала".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Я не обсуждаю приказы, ведьма, и без колебаний делаю то, что должно. Мне достаточно и того почета, что Вольный Торговец велел мне избрать маршала.
- guid: 4a293892-8bb7-4972-b746-f4afa8c7665a
  event: BNTRS_DLC2_Solomorne_12
  text: '"Твоего обаяния не хватит даже на мой мизинец, торговка. Просто ты слишком мелкая преступница, чтобы арбитр тратил на тебя время".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Твоего обаяния не хватит даже на мой мизинец, торговка. Просто ты слишком мелкая преступница, чтобы арбитр тратил на тебя время.
- guid: a46b9940-38ab-4bae-8e67-62044b8e88a1
  event: BNTRS_DLC2_Solomorne_124
  text: '"Спасибо, Паскаль. Жаль, что в моей голове нет шестеренок, чтобы ты при необходимости мог туда залезть и починить, как чинишь Глейто".'
