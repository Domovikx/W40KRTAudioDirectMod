- guid: 2f72899d-4b8f-4ac5-a1e5-c35886099cdc
  event: BNTRS_DLC2_Solomorne_10
  text: '"Не угадала: я просчитывал, насколько легко изолировать это место, если пьяная ведьма слетит с катушек".'
