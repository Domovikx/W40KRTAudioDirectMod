  parts:
  - speaker: Solomon Antar
    text_clean: Вультур просчиталась, решив, что контроль над маршалом дает и власть над Лекс Империалис. Закон Императора нельзя ни обмануть, ни подкупить, ни исказить.
- guid: 4cfee753-3b68-4455-bca7-32ad5a0a0470
  event: BNTRS_DLC2_Solomorne_112
  text: '"Они это сделают, но по своим причинам: избрание нового префекта ввергнет чиновников в бумажный кошмар. Администратум не захочет повторения ситуации".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: 'Они это сделают, но по своим причинам: избрание нового префекта ввергнет чиновников в бумажный кошмар. Администратум не захочет повторения ситуации.'
