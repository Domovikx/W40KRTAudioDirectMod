  text: '"Куда важнее решить, что делать с тассерцием. Мы не можем проигнорировать подобный... ресурс". {n}Соломон смотрит вам прямо в глаза.{/n} "Мое предложение — уничтожить весь добытый тассерций и его залежи. Шансы, что сам материал является источником порчи, слишком высоки. Требуются годы исследований Адептус Астра Телепатика, чтобы удостовериться, что он безопасен для душ санкционатов — годы, которых нет у Коронуса, даже если у местного Адепта были бы ресурсы на это. Против Лекса позволять существовать подобной мерзости. Что касается оценки осквернения Тассеры и ее участи, закон предписывает оставить это на суд владельца мира — Администратума".'
