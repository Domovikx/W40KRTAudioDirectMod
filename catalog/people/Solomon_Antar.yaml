  event: Solomorn_RomanceFinalSolomorne_16
  text: '"Эта... печать величия на твоем лице. Каждый раз ты будто видел{mf||а} людей — даже меня, — насквозь. Читал{mf||а} их мотивы. Совершал{mf||а} подвиги, побеждал{mf||а}. И все в твоих словах и поступках превозносило тебя над обычными людьми, будто пьедестал сам рос под твоими ногами. Если взглянуть на многих Вольных Торговцев, то станет видно, насколько выродилась их порода, но ты..."'
