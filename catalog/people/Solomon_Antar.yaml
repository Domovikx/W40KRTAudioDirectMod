- guid: 015feae2-c2ce-42f9-8084-6cfa608fd02d
  event: ''
  text: '{n}Соломон поднимает глаза к потолку.{/n} "Клянусь Светом Императора, я не пытался оказать никаких знаков внимания. Я просто исполнял свой долг".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон поднимает глаза к потолку.
  - speaker: Solomon Antar
    text_clean: Клянусь Светом Императора, я не пытался оказать никаких знаков внимания. Я просто исполнял свой долг.
- guid: 07ce75c6-8a3d-4409-b41b-a1fa5a03452d
  event: ''
  text: '{n}Соломон упрямо смотрит исподлобья.{/n} "Вы же как-то выбрались из плена нелюдей. Значит, и меня рано хоронить".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон упрямо смотрит исподлобья.
  - speaker: Solomon Antar
    text_clean: Вы же как-то выбрались из плена нелюдей. Значит, и меня рано хоронить.
- guid: 0a715406-3c74-4be3-b296-2d5b8c44bd35
  event: ''
  text: '{n}Соломон резко оборачивается к вам — на нем нет респиратора, а из-под формы выглядывают свежие бинты. Бывший проктор встречает вас ревом, полным ярости:{/n} "Кто открыл ваши камеры? Кто?! Отвечайте, или ваша смерть будет..."'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: 'Соломон резко оборачивается к вам — на нем нет респиратора, а из-под формы выглядывают свежие бинты. Бывший проктор встречает вас ревом, полным ярости:'
  - speaker: Solomon Antar
    text_clean: Кто открыл ваши камеры? Кто?! Отвечайте, или ваша смерть будет...
- guid: 0b81f901-d81f-498e-afea-d00b5eb87faf
  event: ''
  text: '{n}Соломон прикладывает два пальца к уху, вслушиваясь в {g|Encyclopedia:CommBead}комм-бусину{/g}{/n}. "Другой отряд арбитров прижали — найдите способ открыть нам дверь, поблизости должен быть когитатор или пульт управления. Но сначала мы спустимся и займем позиции — надо ошеломить врага внезапной атакой".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон прикладывает два пальца к уху, вслушиваясь в комм-бусину
  - speaker: Solomon Antar
    text_clean: . "Другой отряд арбитров прижали — найдите способ открыть нам дверь, поблизости должен быть когитатор или пульт управления. Но сначала мы спустимся и займем позиции — надо ошеломить врага внезапной атакой".
- guid: 0d0f238e-dbf2-43a4-9685-4de9346b0544
  event: ''
  text: '"Этот суд нелегитимен, поскольку является частью махинации префекта Вультур. Искажение правосудия Императора недопустимо". {n}Соломон обводит взглядом арбитров и задерживается на маршале.{/n} "Мне приходится объяснять очевидное, и это только подчеркивает слепоту, что поразила слуг закона Его".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Этот суд нелегитимен, поскольку является частью махинации префекта Вультур. Искажение правосудия Императора недопустимо.
  - speaker: narrator
    text_clean: Соломон обводит взглядом арбитров и задерживается на маршале.
  - speaker: Solomon Antar
    text_clean: Мне приходится объяснять очевидное, и это только подчеркивает слепоту, что поразила слуг закона Его.
- guid: 11cd6da4-62cd-4309-92db-a490cf6556aa
  event: ''
  text: '"Я, проктор Соломон Антар, свидетельствую союзу Вольного Торговца и Адептус Арбитес, и славлю держател{mf|я|ьницу} священного Патента в день вступления в законные права". {n}Соломон с глухим стуком прижимает кулак к груди, и толпа заходится восторженным ревом.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Я, проктор Соломон Антар, свидетельствую союзу Вольного Торговца и Адептус Арбитес, и славлю держателя священного Патента в день вступления в законные права.
  - speaker: narrator
    text_clean: Соломон с глухим стуком прижимает кулак к груди, и толпа заходится восторженным ревом.
- guid: 14f04561-e271-4cff-b50e-0657c6506bd8
  event: ''
  text: '"Вы знаете, что готов". {n}Соломон твердо кладет руку на оружие, и Глейто вытягивается в струну, вторя решимости хозяина.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Вы знаете, что готов.
  - speaker: narrator
    text_clean: Соломон твердо кладет руку на оружие, и Глейто вытягивается в струну, вторя решимости хозяина.
- guid: 1fef91ce-c1e0-44ac-a4cd-5b4c097c3d13
  event: ''
  text: '{n}Соломон привлекает ваше внимание скупым жестом.{/n} "Я поведу отряд Дельта-Кси по нижней части палубы — там узкие пространства, трубы с прометием, технические помещения, где противних хорошо ориентируется. Эту сложную территорию мы берем на себя. Ваш отряд, позывной Вита-Тета, идет поверху. Цель — прорваться к лифту. Вольного Торговца прошу особо — под пули не подставляйтесь, напрасно не рискуйте. Мы не имеем права вас потерять. После зачистки палубы встречаемся для перегруппировки и штурма".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон привлекает ваше внимание скупым жестом.
  - speaker: Solomon Antar
    text_clean: Я поведу отряд Дельта-Кси по нижней части палубы — там узкие пространства, трубы с прометием, технические помещения, где противних хорошо ориентируется. Эту сложную территорию мы берем на себя. Ваш отряд, позывной Вита-Тета, идет поверху. Цель — прорваться к лифту. Вольного Торговца прошу особо — под пули не подставляйтесь, напрасно не рискуйте. Мы не имеем права вас потерять. После зачистки палубы встречаемся для перегруппировки и штурма.
- guid: 20a5b9ad-3f80-467c-9f68-f63220186db7
  event: ''
  text: '"Я принимаю смерть за верность истинному Лекс Империалис, и делаю это без сожалений. Единственное, о чем я попрошу — позаботьтесь о Глейто". {n}Соломон закрывает глаза и громко произносит:{/n} "Протокол Отказ — покинуть ДК-1. Прощай... друг".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Я принимаю смерть за верность истинному Лекс Империалис, и делаю это без сожалений. Единственное, о чем я попрошу — позаботьтесь о Глейто.
  - speaker: narrator
    text_clean: 'Соломон закрывает глаза и громко произносит:'
  - speaker: Solomon Antar
    text_clean: Протокол Отказ — покинуть ДК-1. Прощай... друг.
- guid: 240214a5-37ff-4265-ab5e-deec8bd0b824
  event: ''
  text: '"О, во сне я порой успеваю даже спасти Империум пару раз". {n}Соломон отвечает натянутой улыбкой, в глазах ни намека на смех.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: О, во сне я порой успеваю даже спасти Империум пару раз.
  - speaker: narrator
    text_clean: Соломон отвечает натянутой улыбкой, в глазах ни намека на смех.
- guid: 25d305df-85a9-488f-8f12-0118cb2a5b3c
  event: ''
  text: '"Только потому, что вы просите". {n}Соломон дает знак Глейто, и кибермастиф обрушивается на агрессора. Мощные металлические лапы придавливают мужчину к земле, не давая пошевелиться.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Только потому, что вы просите.
  - speaker: narrator
    text_clean: Соломон дает знак Глейто, и кибермастиф обрушивается на агрессора. Мощные металлические лапы придавливают мужчину к земле, не давая пошевелиться.
- guid: 2abd7b83-bdce-4618-ab3f-bc2472b0a3fb
  event: ''
  text: '{n}Соломон задерживает на вас тяжелый взгляд.{/n} "Перед лицом Лекс Империалис я свидетельствую — Вольный Торговец {name} фон Валанциус {d|Encyclopedia:TW_SolomorneNotConvincedDecision}похитил{mf||а} десятину{/d}".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон задерживает на вас тяжелый взгляд.
  - speaker: Solomon Antar
    text_clean: Перед лицом Лекс Империалис я свидетельствую — Вольный Торговец КЭП фон Валанциус {d|Encyclopedia:TW_SolomorneNotConvincedDecision}похитил десятину{/d}.
- guid: 2bf8f9b9-75eb-485b-a790-41f0c570361a
  event: ''
  text: '"Борюсь с несовершенствами в толковании Лекс Империалис". {n}Соломон на мгновение отводит взгляд от Йегер, всматриваясь в вас.{/n} "Не думал, что вы расцените ситуацию иначе".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Борюсь с несовершенствами в толковании Лекс Империалис.
  - speaker: narrator
    text_clean: Соломон на мгновение отводит взгляд от Йегер, всматриваясь в вас.
  - speaker: Solomon Antar
    text_clean: Не думал, что вы расцените ситуацию иначе.
- guid: 2d711356-d7ad-493e-aead-0c384d6bc4aa
  event: ''
  text: '"Глейто..." {n}Соломон пытается не то дотянуться до кибермастифа, не то жестом отдать ему приказ, но пес лежит, не реагируя на происходящее.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Глейто...
  - speaker: narrator
    text_clean: Соломон пытается не то дотянуться до кибермастифа, не то жестом отдать ему приказ, но пес лежит, не реагируя на происходящее.
- guid: 2d9f54f7-9b34-4ffe-9fff-91d9272d7175
  event: ''
  text: '{n}Соломон чуть кивает.{/n} "Лучше отсечь руку, чем дать гнили охватить все тело".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон чуть кивает.
  - speaker: Solomon Antar
    text_clean: Лучше отсечь руку, чем дать гнили охватить все тело.
- guid: 2ec60b0b-13e6-4707-b1e0-4d5069c80492
  event: ''
  text: '{n}Соломон обводит взглядом собравшихся, взирающих на вас с изумлением и трепетом.{/n} "Звездн{mf|ый|ая} Госпо{mf|дин|жа}, значит... Ваше появление тут сродни историческому событию. Вот увидите, местные будут следить за каждым вашим шагом: может хватить одного вашего слова или нечаянного жеста, чтобы навсегда перевернуть жизнь этого отсталого мира".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон обводит взглядом собравшихся, взирающих на вас с изумлением и трепетом.
  - speaker: Solomon Antar
    text_clean: 'Звездный Господин, значит... Ваше появление тут сродни историческому событию. Вот увидите, местные будут следить за каждым вашим шагом: может хватить одного вашего слова или нечаянного жеста, чтобы навсегда перевернуть жизнь этого отсталого мира.'
- guid: 30d0fc33-0ef3-4eb3-8dd4-edc7365bea17
  event: ''
  text: '"Я бы не стал подвергать сомнению ваш титул, губернатор". {n}Соломон одаривает вас долгим взглядом.{/n} "Да и Вольный Торговец тоже вряд ли желает вас смутить".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Я бы не стал подвергать сомнению ваш титул, губернатор.
  - speaker: narrator
    text_clean: Соломон одаривает вас долгим взглядом.
  - speaker: Solomon Antar
    text_clean: Да и Вольный Торговец тоже вряд ли желает вас смутить.
- guid: 347b6266-f6a1-4680-9183-2357b8450eb4
  event: ''
  text: '"Можно ли требовать от любовников, чтобы они судили друг о друге непредвзято? К тому же..." {n}Соломон придает голосу мягкости.{/n} "...я не вижу себя человеком, заинтересованным в глубоких отношениях с кем-то".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Можно ли требовать от любовников, чтобы они судили друг о друге непредвзято? К тому же...
  - speaker: narrator
    text_clean: Соломон придает голосу мягкости.
  - speaker: Solomon Antar
    text_clean: '...я не вижу себя человеком, заинтересованным в глубоких отношениях с кем-то.'
- guid: 34831a31-12fd-4b7a-b2d9-83a3fb80ad0d
  event: ''
  text: '"Значит, "развлечение" — это не кодовое слово, и вам ничего не угрожает?" {n} Соломон несколько озадаченно осматривает купальню.{/n} "Так вы действительно желаете знать, как арбитры проводят свободное время... Что ж, почему нет? Предлагаю небольшое состязание по стрельбе — пустые бутылки сойдут за мишени".'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Значит, "развлечение" — это не кодовое слово, и вам ничего не угрожает?
  - speaker: narrator
    text_clean: Соломон несколько озадаченно осматривает купальню.
  - speaker: Solomon Antar
    text_clean: Так вы действительно желаете знать, как арбитры проводят свободное время... Что ж, почему нет? Предлагаю небольшое состязание по стрельбе — пустые бутылки сойдут за мишени.
- guid: 34efacbb-1e45-4476-91f8-2b02e5d766d3
  event: ''
  text: '"Конечно. Праздная светская беседа — всегда хотел попробовать". {n}Соломон властно складывает руки на груди, непостижимым образом становясь еще выше ростом и шире в плечах.{/n} "Расскажите о ласераксах, губернатор. Такие любопытные твари — откуда вам удалось их достать?"'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Конечно. Праздная светская беседа — всегда хотел попробовать.
  - speaker: narrator
    text_clean: Соломон властно складывает руки на груди, непостижимым образом становясь еще выше ростом и шире в плечах.
  - speaker: Solomon Antar
    text_clean: Расскажите о ласераксах, губернатор. Такие любопытные твари — откуда вам удалось их достать?
- guid: 35786eec-7fef-4ee5-9f86-39cb2144c283
  event: ''
  text: '{n}Соломон двумя железными пальцами отрывает листок и протягивает вам.{/n} "Это все? Хм, а скверно выглядит эта штука. Хорошо, что я завел себе привычку касаться подозрительных предметов исключительно аугментированной рукой".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон двумя железными пальцами отрывает листок и протягивает вам.
  - speaker: Solomon Antar
    text_clean: Это все? Хм, а скверно выглядит эта штука. Хорошо, что я завел себе привычку касаться подозрительных предметов исключительно аугментированной рукой.
- guid: 35df1822-039f-461a-a9fd-3e645d14b832
  event: ''
  text: '{n}Соломон треплет кибермастифа за холку, губы проктора чуть вздрагивают в печальной улыбке.{/n} "Со мной вы и мой пес — не иначе Император вознаградил меня за службу, дав возможность или доблестно умереть в славной компании, или сообща одолеть невообразимую опасность. Чего еще желать?"'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: Соломон треплет кибермастифа за холку, губы проктора чуть вздрагивают в печальной улыбке.
  - speaker: Solomon Antar
    text_clean: Со мной вы и мой пес — не иначе Император вознаградил меня за службу, дав возможность или доблестно умереть в славной компании, или сообща одолеть невообразимую опасность. Чего еще желать?
- guid: 36bcc12a-51e3-4018-81dd-b659413131f7
  event: ''
  text: '{n}Соломон молча долго смотрит на вас, а затем тихо произносит:{/n} "Если бы я в тебя влюбился, мне бы действительно сложно было выбрать между тобой и долгом. Так что пусть это останется чем-то несбывшимся".'
  speaker: Solomon Antar
  parts:
  - speaker: narrator
    text_clean: 'Соломон молча долго смотрит на вас, а затем тихо произносит:'
  - speaker: Solomon Antar
    text_clean: Если бы я в тебя влюбился, мне бы действительно сложно было выбрать между тобой и долгом. Так что пусть это останется чем-то несбывшимся.
- guid: 3b8e9625-61d5-40ce-aac4-5f9ae206b291
  event: ''
  text: '"Отлично, у Глейто сбой. Наша синхронизация нарушена, и он..." {n}Арбитр срывается на рев.{/n} "Да этот драный день когда-нибудь закончится?! Мой пес, единственный, кому я мог доверить свою жизнь — и он..." {n}Соломон яростно мотает головой в сторону.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Отлично, у Глейто сбой. Наша синхронизация нарушена, и он...
  - speaker: narrator
    text_clean: Арбитр срывается на рев.
  - speaker: Solomon Antar
    text_clean: Да этот драный день когда-нибудь закончится?! Мой пес, единственный, кому я мог доверить свою жизнь — и он...
  - speaker: narrator
    text_clean: Соломон яростно мотает головой в сторону.
- guid: 3e6d1688-080a-4b27-b7aa-c85158d8cee6
  event: ''
  text: '"Почему бы сперва и не осмотреться. Кто знает, какие улики мы обнаружим — и какие секреты своего господина выболтает наша сопровождающая". {n}Соломон одаривает Мейв не обещающим ничего хорошего взглядом, и девушка испуганно вздрагивает.{/n}'
  speaker: Solomon Antar
  parts:
  - speaker: Solomon Antar
    text_clean: Почему бы сперва и не осмотреться. Кто знает, какие улики мы обнаружим — и какие секреты своего господина выболтает наша сопровождающая.
  - speaker: narrator
    text_clean: Соломон одаривает Мейв не обещающим ничего хорошего взглядом, и девушка испуганно вздрагивает.
- guid: 401613a5-2979-4cf2-a376-9bd6be81cffd
  event: ''
