    text_clean: Вам, Версериан, не приходило в голову, что есть вещи выше выгод династии? Торжество закона Императора и неотвратимость правосудия, например.
- guid: 94a90408-805c-47b3-bdc6-b6c56ddde640
  event: BNTRS_DLC2_Solomorne_110
  text: '"Вультур просчиталась, решив, что контроль над маршалом дает и власть над Лекс Империалис. Закон Императора нельзя ни обмануть, ни подкупить, ни исказить".'
