- guid: d9b3b010-5de5-4e39-9481-588f85136667
  event: Companions_Interrogator_07
  text: '{n}Хейнрикс бросает на вас косой взгляд, его губы растягиваются в холодной змеиной улыбке.{/n} "Я не считаю необузданные эмоции чем-то необходимым в каждодневном общении. Но, уверяю вас, я более чем способен на гнев. К счастью для окружающих, я научился его фокусировать. Правильно отмеренная ярость раскрывает весь потенциал боевой псайканы так же, как пряный сыр — ноты выдержанного амасека".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс бросает на вас косой взгляд, его губы растягиваются в холодной змеиной улыбке.
  - speaker: Heinrix van Calox
    text_clean: Я не считаю необузданные эмоции чем-то необходимым в каждодневном общении. Но, уверяю вас, я более чем способен на гнев. К счастью для окружающих, я научился его фокусировать. Правильно отмеренная ярость раскрывает весь потенциал боевой псайканы так же, как пряный сыр — ноты выдержанного амасека.
- guid: bd6dccf2-fb5a-453b-a91d-a515597b1c44
  event: Companions_Interrogator_08
  text: '{n}Хейнрикс долго молчит, глядя куда-то в сторону. Затем переводит взгляд на вас.{/n} "Ни один слуга Бога-Императора не имеет дела со скверной настолько близко, как агенты {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}. В стремлении уберечь Империум от самых коварных и тайных происков его врагов Инквизиция стремится познать суть зла. Для нас недостаточно спалить или разрубить поганый росток — мы должны изучить его. Понять его. Прикоснуться к нему. Любой из нас рискует собственной душой, когда выполняет свой долг. Но псайкеры... душа псайкера особенно заманчива для Архиврага".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс долго молчит, глядя куда-то в сторону. Затем переводит взгляд на вас.
  - speaker: Heinrix van Calox
    text_clean: Ни один слуга Бога-Императора не имеет дела со скверной настолько близко, как агенты Золотого Трона. В стремлении уберечь Империум от самых коварных и тайных происков его врагов Инквизиция стремится познать суть зла. Для нас недостаточно спалить или разрубить поганый росток — мы должны изучить его. Понять его. Прикоснуться к нему. Любой из нас рискует собственной душой, когда выполняет свой долг. Но псайкеры... душа псайкера особенно заманчива для Архиврага.
- guid: 1a132b01-36ea-4a82-9dbc-64e59fa87333
  event: Companions_Interrogator_09
  text: '"Как и многие {g|Encyclopedia:Psyker}псайкеры{/g}, не ведающие о своем проклятии — в тот момент, когда сильная эмоциональная реакция вызвала непроизвольный отклик". {n}Хейнрикс молчит. Потом вздыхает и неохотно продолжает.{/n} "Я вскипятил укусившего меня ручного гринка двоюродной тетки". {n}Дознаватель отводит взгляд и еще тише добавляет.{/n} "А потом и ее саму, когда она закатила мне пощечину".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Как и многие псайкеры, не ведающие о своем проклятии — в тот момент, когда сильная эмоциональная реакция вызвала непроизвольный отклик.
  - speaker: narrator
    text_clean: Хейнрикс молчит. Потом вздыхает и неохотно продолжает.
  - speaker: Heinrix van Calox
    text_clean: Я вскипятил укусившего меня ручного гринка двоюродной тетки.
  - speaker: narrator
    text_clean: Дознаватель отводит взгляд и еще тише добавляет.
  - speaker: Heinrix van Calox
    text_clean: А потом и ее саму, когда она закатила мне пощечину.
- guid: 4ae8a33d-feef-42ce-97e6-6fb6fbe39c90
  event: Companions_Interrogator_10
  text: '"Я был бы готов рассказать тебе больше, но не могу — не из-за запретов {g|Encyclopedia:Inquisition}Инквизиции{/g}, а потому что информация обрывочна и не проверена. Судя по тому, что мы узнали здесь, мы — в тюрьме одной из арен, на которых друкари убивают пленников на потеху своей публике. Эти {g|Encyclopedia:Xenos}ксеносы{/g} питаются болью... а значит, подобные развлечения — не только блажь, но и необходимость для этих исчадий. Боль нужна им больше, чем воздух, которым они дышат — а значит, представления должны проходить постоянно... и значит, рейды за новыми жертвами не должны останавливаться".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я был бы готов рассказать тебе больше, но не могу — не из-за запретов Инквизиции, а потому что информация обрывочна и не проверена. Судя по тому, что мы узнали здесь, мы — в тюрьме одной из арен, на которых друкари убивают пленников на потеху своей публике. Эти ксеносы питаются болью... а значит, подобные развлечения — не только блажь, но и необходимость для этих исчадий. Боль нужна им больше, чем воздух, которым они дышат — а значит, представления должны проходить постоянно... и значит, рейды за новыми жертвами не должны останавливаться.
- guid: ae536c97-9f0e-4022-8e62-0405a96ab4f5
  event: Companions_Interrogator_100
  text: '"Объяснения? Лорд-инквизитор Ксавьер Калькасар счел необходимым после наблюдения за новым Вольным Торговцем фон Валанциус в социальной среде провести уединенную беседу. С элементом неожиданности, который обычно располагает собеседника к более прямому разговору и менее подготовленным ответам. Ты, {name}, остал{mf|ся|ась} цел{mf||а} и невредим{mf||а} — поверь мне, это более чем удачный финал разговора с моим наставником. Более того, тебе преподнесли подарок — официальное выражение отношения к тебе и твоим деяниям. Я затрудняюсь добавить к этому что либо еще".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Объяснения? Лорд-инквизитор Ксавьер Калькасар счел необходимым после наблюдения за новым Вольным Торговцем фон Валанциус в социальной среде провести уединенную беседу. С элементом неожиданности, который обычно располагает собеседника к более прямому разговору и менее подготовленным ответам. Ты, КЭП, остался цел и невредим — поверь мне, это более чем удачный финал разговора с моим наставником. Более того, тебе преподнесли подарок — официальное выражение отношения к тебе и твоим деяниям. Я затрудняюсь добавить к этому что либо еще.
- guid: d7d4218e-4750-42a1-9a12-3e94ae8f93d4
  event: Companions_Interrogator_101
  text: '"Больше мы к этому разговору не вернемся. С моей точки зрения теперь Лорд-капитану будет полезнее сосредоточиться на своих прямых обязанностях, чем продолжать пережевывать прошлое".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Больше мы к этому разговору не вернемся. С моей точки зрения теперь Лорд-капитану будет полезнее сосредоточиться на своих прямых обязанностях, чем продолжать пережевывать прошлое.
- guid: dc6336e8-4947-4666-8763-309526219a94
  event: Companions_Interrogator_102
  text: '{n}Хейнрикс поднимает одну бровь.{/n} "Я рад это слышать. Мои опасения, что наша беседа примет неприятный оборот, не оправдались".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс поднимает одну бровь.
  - speaker: Heinrix van Calox
    text_clean: Я рад это слышать. Мои опасения, что наша беседа примет неприятный оборот, не оправдались.
- guid: 1ea0862f-be4f-44bf-93b3-cf88d94cce61
  event: Companions_Interrogator_103
  text: '"Я не готов дать тебе обещание, что Лорд-инквизитор более не изъявит желания побеседовать с Вольным Торговцем фон Валанциус с глазу на глаз в удобное ему время. Если это произойдет — встреча состоится. Полагаю, в таком случае у нас будет еще одна неприятная беседа — я буду к ней готов". {n}Лицо Хейнрикса не выражает ничего, кроме ледяного спокойствия.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я не готов дать тебе обещание, что Лорд-инквизитор более не изъявит желания побеседовать с Вольным Торговцем фон Валанциус с глазу на глаз в удобное ему время. Если это произойдет — встреча состоится. Полагаю, в таком случае у нас будет еще одна неприятная беседа — я буду к ней готов.
  - speaker: narrator
    text_clean: Лицо Хейнрикса не выражает ничего, кроме ледяного спокойствия.
- guid: 65512a81-c3aa-4755-b72a-f7859cd18560
  event: Companions_Interrogator_104
  text: '{n}Взгляд Хейнрикса смягчается.{/n} "Я рад, что я... что мое... я рад, что я смог помочь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Взгляд Хейнрикса смягчается.
  - speaker: Heinrix van Calox
    text_clean: Я рад, что я... что мое... я рад, что я смог помочь.
- guid: b5ebd6f9-ac63-4d8e-a847-e29bd42990fc
  event: Companions_Interrogator_105
  text: '{n}Хейнрикс смотрит на вас с необычным для него выражением — словно его загнали в угол и прижали к стене. Наконец, он несколько судорожно выдыхает:{/n} "Я... не знаю". {n}Он тут же морщится от собственного ответа, словно от зубной боли.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'Хейнрикс смотрит на вас с необычным для него выражением — словно его загнали в угол и прижали к стене. Наконец, он несколько судорожно выдыхает:'
  - speaker: Heinrix van Calox
    text_clean: Я... не знаю.
  - speaker: narrator
    text_clean: Он тут же морщится от собственного ответа, словно от зубной боли.
- guid: 289dca75-f527-4d39-a1dc-88707cd53981
  event: Companions_Interrogator_106
  text: '{n}Хейнрикс неожиданно неловко ежится.{/n} "Если на этом все..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс неожиданно неловко ежится.
  - speaker: Heinrix van Calox
    text_clean: Если на этом все...
- guid: 26938220-5542-43fc-b535-e4df83cdb520
  event: Companions_Interrogator_107
  text: '{n}Хейнрикс не двигается с места и смотрит вам прямо в глаза.{/n} "Баланс сил, леди {name}. Подобная "инициатива" от меня в прилюдном месте будет проинтерпретирована вашими поддаными как нападение. Или попытка опорочить репутацию — что, кажется, вас не волнует ни в коей мере, не правда ли?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс не двигается с места и смотрит вам прямо в глаза.
  - speaker: Heinrix van Calox
    text_clean: Баланс сил, леди КЭП. Подобная "инициатива" от меня в прилюдном месте будет проинтерпретирована вашими поддаными как нападение. Или попытка опорочить репутацию — что, кажется, вас не волнует ни в коей мере, не правда ли?
- guid: 44175f6b-b45b-434f-927b-3835c64aa654
  event: Companions_Interrogator_108
  text: '{n}Дознаватель умолкает, явно недовольный своей необычно неровной речью.{/n} "Надеюсь, мой ответ не задел вас. Теперь, если позволите... давайте вернемся к более безопасным темам".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Дознаватель умолкает, явно недовольный своей необычно неровной речью.
  - speaker: Heinrix van Calox
    text_clean: Надеюсь, мой ответ не задел вас. Теперь, если позволите... давайте вернемся к более безопасным темам.
- guid: b4754640-16db-42f5-aacf-77dd73808a8c
  event: Companions_Interrogator_109
  text: '"Наверняка. Скорее всего, в этом мои бывшие коллеги, рано или поздно, преуспеют". {n}Хейнрикс криво улыбается.{/n} "Я не рассчитывал бы на то, что они отступятся от цели уничтожить предателя — я бы не отступился. Но тебе не о чем волноваться — я сделаю все возможное, чтобы, когда за мной придут, ты не пострадала".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Наверняка. Скорее всего, в этом мои бывшие коллеги, рано или поздно, преуспеют.
  - speaker: narrator
    text_clean: Хейнрикс криво улыбается.
  - speaker: Heinrix van Calox
    text_clean: Я не рассчитывал бы на то, что они отступятся от цели уничтожить предателя — я бы не отступился. Но тебе не о чем волноваться — я сделаю все возможное, чтобы, когда за мной придут, ты не пострадала.
- guid: 58ad6de0-4587-4e87-b636-a0e8e68773d8
  event: Companions_Interrogator_11
  text: '{n}Хейнрикс молчит — так долго, что вам начинает казаться, что ответа вы уже не дождетесь.{/n} "Представь себе огромный корабль-тюрьму, заполоненный испуганными, озлобленными, не умеющими контролировать себя {g|Encyclopedia:Psyker}псайкерами{/g}, которых лишили дома и семей. Часть — дети и подростки, как я. Часть — чудовищные твари, лишенные права называться людьми, или психопаты, упивающиеся своими нечистыми силами".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс молчит — так долго, что вам начинает казаться, что ответа вы уже не дождетесь.
  - speaker: Heinrix van Calox
    text_clean: Представь себе огромный корабль-тюрьму, заполоненный испуганными, озлобленными, не умеющими контролировать себя псайкерами, которых лишили дома и семей. Часть — дети и подростки, как я. Часть — чудовищные твари, лишенные права называться людьми, или психопаты, упивающиеся своими нечистыми силами.
- guid: 384f6e62-5098-4342-b266-0558685e92ee
  event: Companions_Interrogator_110
  text: '{n}Вместо ответа Хейнрикс берет вас за руку.{/n} "Перестань беспокоиться о моем решении. Оно не изменится. Я останусь рядом с тобой — навсегда".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Вместо ответа Хейнрикс берет вас за руку.
  - speaker: Heinrix van Calox
    text_clean: Перестань беспокоиться о моем решении. Оно не изменится. Я останусь рядом с тобой — навсегда.
- guid: f6fbbcd7-d0f0-44a7-8817-03f6ce27464b
  event: Companions_Interrogator_111
  text: '{n}Хейнрикс молчит, не скрывая горечи на лице.{/n} "Мне... невыносимо тяжело признать это. Скаландр был истовым имперцем и прекрасным агентом... а хуже всего то, что момент, когда он перестал быть и тем, и другим, прошел мимо меня!" {n}Дознаватель прикрывает глаза — не то от стыда, не то от гнева.{/n} "Мне нечем оправдать свой проступок перед Золотым троном".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс молчит, не скрывая горечи на лице.
  - speaker: Heinrix van Calox
    text_clean: Мне... невыносимо тяжело признать это. Скаландр был истовым имперцем и прекрасным агентом... а хуже всего то, что момент, когда он перестал быть и тем, и другим, прошел мимо меня!
  - speaker: narrator
    text_clean: Дознаватель прикрывает глаза — не то от стыда, не то от гнева.
  - speaker: Heinrix van Calox
    text_clean: Мне нечем оправдать свой проступок перед Золотым троном.
- guid: 4b70ee05-af6f-4a7f-8efe-d55f19d0acc2
  event: Companions_Interrogator_112
  text: '{n}Хейнрикс смотрит на вас с нескрываемым гневом.{/n} "Присутствие Орудия Хаоса на борту пустотного корабля — ересь, которую ты пытаешься оправдать практическими интересами. Знай же — именно из "практических интересов" люди, некогда бывшие верными слугами Трона, и превращаются в преступников. Твои привилегии — лишь тонкая вуаль над свершенным тобой святотатством".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс смотрит на вас с нескрываемым гневом.
  - speaker: Heinrix van Calox
    text_clean: Присутствие Орудия Хаоса на борту пустотного корабля — ересь, которую ты пытаешься оправдать практическими интересами. Знай же — именно из "практических интересов" люди, некогда бывшие верными слугами Трона, и превращаются в преступников. Твои привилегии — лишь тонкая вуаль над свершенным тобой святотатством.
- guid: a57d7bbf-6882-4b9f-9b6f-6b2054e56efb
  event: Companions_Interrogator_113
  text: '"Я займусь этим".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я займусь этим.
- guid: 9f14ecd9-53f7-468f-b8a6-c34e123be89a
  event: Companions_Interrogator_114
  text: '"{d|Encyclopedia:MiniJealousyRomanceBroken}До меня дошли сведения{/d}, Лорд-капитан, что у вас сложились особо тесные отношения с другим членом свиты". {n}В голосе Хейнрикса больше нет и капли былого тепла.{/n} "Желаю вам, чтобы они сложились удачно. Что ж, теперь давайте перейдем к делам".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: До меня дошли сведения, Лорд-капитан, что у вас сложились особо тесные отношения с другим членом свиты.
  - speaker: narrator
    text_clean: В голосе Хейнрикса больше нет и капли былого тепла.
  - speaker: Heinrix van Calox
    text_clean: Желаю вам, чтобы они сложились удачно. Что ж, теперь давайте перейдем к делам.
- guid: a9a8640f-dfca-4504-bceb-003811611d91
  event: Companions_Interrogator_12
  text: '"До тех пор, пока приказ Лорд-инквизитора Калькасара остается в силе, я обязан сопровождать {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} династии фон Валанциус, оказывая всевозможное содействие и поддержку. Боюсь, я не смогу удовлетворить твое желание".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: До тех пор, пока приказ Лорд-инквизитора Калькасара остается в силе, я обязан сопровождать Вольного Торговца династии фон Валанциус, оказывая всевозможное содействие и поддержку. Боюсь, я не смогу удовлетворить твое желание.
- guid: 649fa5b1-dd31-4b6d-af07-bd3ea5e38ec5
  event: Companions_Interrogator_13
  text: '"Да, однако с ней меня не связывает ничего, кроме имени". {n}Хейнрикс морщится.{/n} "Я покинул Гвизорн III еще ребенком. Моя семья отреклась от меня, лишив родового имени — новое я получил уже от своих наставников. Даже для дворянина клеймо {g|Encyclopedia:Psyker}псайкера{/g} — вечная отметка позора. Я успел почувствовать это на себе прежде, чем меня забрали на Черный корабль".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Да, однако с ней меня не связывает ничего, кроме имени.
  - speaker: narrator
    text_clean: Хейнрикс морщится.
  - speaker: Heinrix van Calox
    text_clean: Я покинул Гвизорн III еще ребенком. Моя семья отреклась от меня, лишив родового имени — новое я получил уже от своих наставников. Даже для дворянина клеймо псайкера — вечная отметка позора. Я успел почувствовать это на себе прежде, чем меня забрали на Черный корабль.
- guid: ab413f0b-d045-4ef5-aa35-043c1c500af3
  event: Companions_Interrogator_14
  text: '"Со дня моего посвящения в аколиты — десятилетия". {n}Хейнрикс пожимает плечом.{/n} "Сколько при этом прошло реальных лет — трудно сказать. Нередко после очередного перелета в {g|Encyclopedia:Warp}варпе{/g} оказывалось, что в {g|Encyclopedia:Realspace}реальном мире{/g} прошло намного больше — или намного меньше".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Со дня моего посвящения в аколиты — десятилетия.
  - speaker: narrator
    text_clean: Хейнрикс пожимает плечом.
  - speaker: Heinrix van Calox
    text_clean: Сколько при этом прошло реальных лет — трудно сказать. Нередко после очередного перелета в варпе оказывалось, что в реальном мире прошло намного больше — или намного меньше.
- guid: 3b742d95-4e50-4459-b37d-197d9159fa3c
  event: Companions_Interrogator_15
  text: '{n}Хейнрикс отвешивает сдержанный, точно отмеренный поклон.{/n} "Раз гостеприимство {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} себя исчерпало, не смею более докучать своим присутствием. Я покину корабль с первой же возможностью и оповещу Лорд-инквизитора об изменившихся обстоятельствах".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс отвешивает сдержанный, точно отмеренный поклон.
  - speaker: Heinrix van Calox
    text_clean: Раз гостеприимство Вольного Торговца себя исчерпало, не смею более докучать своим присутствием. Я покину корабль с первой же возможностью и оповещу Лорд-инквизитора об изменившихся обстоятельствах.
- guid: 2878f3ac-b227-4e91-a379-916b81a16b34
  event: Companions_Interrogator_16
  text: '{n}Хейнрикс изгибает бровь.{/n} "Правильно ли я понимаю, что этим заявлением вы избавляете {g|Encyclopedia:Xenos}ксеноса{/g} от своего покровительства Вольного Торговца и препоручаете дальнейшую судьбу врага Человечества {g|Encyclopedia:Inquisition}Священной Инквизиции{/g}?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс изгибает бровь.
  - speaker: Heinrix van Calox
    text_clean: Правильно ли я понимаю, что этим заявлением вы избавляете ксеноса от своего покровительства Вольного Торговца и препоручаете дальнейшую судьбу врага Человечества Священной Инквизиции?
- guid: 6eb864c9-e713-49b5-817b-092e9ee43a62
  event: Companions_Interrogator_17
  text: '"Я действительно посетил многие места, приведенные к свету Императора... и подернутые скверной {g|Encyclopedia:Chaos}Архиврага{/g}. Признаться, даже спустя все эти годы, побывав в разных концах Империума и заглянув за его пределы, я все еще считаю Сегментум Соляр величайшим из оплотов Человечества. Ничто не сравнится с величием {g|Encyclopedia:HolyTerra}Святой Терры{/g}, могуществом {g|Encyclopedia:Mars}Марса{/g} и грандиозностью иных миров этого сегмента".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я действительно посетил многие места, приведенные к свету Императора... и подернутые скверной Архиврага. Признаться, даже спустя все эти годы, побывав в разных концах Империума и заглянув за его пределы, я все еще считаю Сегментум Соляр величайшим из оплотов Человечества. Ничто не сравнится с величием Святой Терры, могуществом Марса и грандиозностью иных миров этого сегмента.
- guid: ff8b93a9-a77c-4620-ad50-fe95c0c31d61
  event: Companions_Interrogator_18
  text: '{n}Дознаватель встречается с вами взглядом и улыбается — вкупе с выражением его ледяных глаз эта улыбка выглядит жутко.{/n} "Неужели ты на самом деле надеешься получить ответ на этот вопрос?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Дознаватель встречается с вами взглядом и улыбается — вкупе с выражением его ледяных глаз эта улыбка выглядит жутко.
  - speaker: Heinrix van Calox
    text_clean: Неужели ты на самом деле надеешься получить ответ на этот вопрос?
- guid: 324389a5-aa38-4886-ba18-3b3f4bb85144
  event: Companions_Interrogator_19
  text: '{n}Дознаватель кланяется вам.{/n} "Благодарю за содействие, Лорд-капитан. Я организую и лично проведу изъятие ксеноса из вашего экипажа без жертв и разрушений".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Дознаватель кланяется вам.
  - speaker: Heinrix van Calox
    text_clean: Благодарю за содействие, Лорд-капитан. Я организую и лично проведу изъятие ксеноса из вашего экипажа без жертв и разрушений.
- guid: e380aac7-3669-4940-b01a-b4ca31244190
  event: Companions_Interrogator_20
  text: '"С большим удовольствием".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: С большим удовольствием.
- guid: d0ddfbf1-0e1f-4073-b5b9-18c0de72bd51
  event: Companions_Interrogator_21
  text: '"Рядовые члены культа — оскверненные {g|Encyclopedia:Chaos}Архиврагом{/g} люди, предатели {g|Encyclopedia:Imperium}Империума{/g} и пособники Хаоса. Участие в ритуалах культа не проходит без промывки мозгов, буквальной или фигуральной — чем дольше они среди других культистов, тем меньше критичность их мышления и тем ближе они к покорным скотам, которые лишены страха и инстинкта самосохранения. Худшие из них идут на смерть без тени сомнения, готовые забрать с собой сотни и тысячи душ".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Рядовые члены культа — оскверненные Архиврагом люди, предатели Империума и пособники Хаоса. Участие в ритуалах культа не проходит без промывки мозгов, буквальной или фигуральной — чем дольше они среди других культистов, тем меньше критичность их мышления и тем ближе они к покорным скотам, которые лишены страха и инстинкта самосохранения. Худшие из них идут на смерть без тени сомнения, готовые забрать с собой сотни и тысячи душ.
- guid: 315bd700-279d-45a2-9d5d-94cc49145a24
  event: Companions_Interrogator_22
  text: '"Что касается тех, кто находится на вершине культа... нам так и не удалось выйти на след всех предводителей. Я предполагаю, часть из них скрывается в глубинах {g|Encyclopedia:KoronusExpanse}Простора Коронус{/g}, а те, что руководят фанатиками на ближних мирах, хорошо прячутся... или пользуются высоким покровительством".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Что касается тех, кто находится на вершине культа... нам так и не удалось выйти на след всех предводителей. Я предполагаю, часть из них скрывается в глубинах Простора Коронус, а те, что руководят фанатиками на ближних мирах, хорошо прячутся... или пользуются высоким покровительством.
- guid: 73c3a260-b401-47b9-a0d2-b20f26ee0d2f
  event: Companions_Interrogator_23
  text: '"Губернаторы. Командоры. {g|Encyclopedia:RogueTrader}Вольные Торговцы{/g}. История полна примеров людей, пренебрегавших своим долгом перед {g|Encyclopedia:GoldenThrone}Золотым Троном{/g} и искавших союзников не в тех местах".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Губернаторы. Командоры. Вольные Торговцы. История полна примеров людей, пренебрегавших своим долгом перед Золотым Троном и искавших союзников не в тех местах.
- guid: 35bc2950-8348-4067-b94d-60991375808f
  event: Companions_Interrogator_24
  text: '"Я должен проверить рапорты своих агентов. Согласно им, один из предводителей культа находится в сегменте Кьявы Гамма — {g|Encyclopedia:IndustrialWorld}индустриального мира{/g}, расположенного во владениях династии фон Валанциус. Надеюсь, ты не будешь препятствовать моему расследованию".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я должен проверить рапорты своих агентов. Согласно им, один из предводителей культа находится в сегменте Кьявы Гамма — индустриального мира, расположенного во владениях династии фон Валанциус. Надеюсь, ты не будешь препятствовать моему расследованию.
- guid: 5bb81830-d0ff-46cf-96ea-4e5499c5026d
  event: Companions_Interrogator_25
  text: '"Первые его следы были обнаружены нами сразу после прибытия в {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g}. С тех пор чем больше мы узнаем, тем лучше мы видим, насколько далеко эта зараза пустила корни. Уничтожение отдельных ячеек бессмысленно, пока мы не отрубим этому левиафану голову".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Первые его следы были обнаружены нами сразу после прибытия в Простор Коронус. С тех пор чем больше мы узнаем, тем лучше мы видим, насколько далеко эта зараза пустила корни. Уничтожение отдельных ячеек бессмысленно, пока мы не отрубим этому левиафану голову.
- guid: 6c7dcb63-0dac-4c9b-b604-613836af05d6
  event: Companions_Interrogator_26
  text: '"Визит на Кьяву Гамма не дал ответы на все вопросы, но нам удалось нанести удар культу, уничтожив машину {g|Encyclopedia:Fabricator}Фабрикатор-Цензора{/g}. Я направил усилия своих соглядатаев на выслеживание уцелевших предводителей секты — уверен, в скором времени они предоставят нам ценные данные. Это небольшая, но победа для {g|Encyclopedia:GoldenThrone}Золотого Трона{/g} — победа, за которую я благодарю тебя, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Визит на Кьяву Гамма не дал ответы на все вопросы, но нам удалось нанести удар культу, уничтожив машину Фабрикатор-Цензора. Я направил усилия своих соглядатаев на выслеживание уцелевших предводителей секты — уверен, в скором времени они предоставят нам ценные данные. Это небольшая, но победа для Золотого Трона — победа, за которую я благодарю тебя, КЭП.
- guid: 9a6e73d5-8368-4c1c-864b-7a8acd438ade
  event: Companions_Interrogator_27
  text: '"Как скажешь, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Как скажешь, КЭП.
- guid: c1ec9374-974b-4e27-b72a-ea1635b9b4a3
  event: Companions_Interrogator_28
  text: '"Лорд-инквизитор особо настаивал на том, чтобы я освоил дисциплину святой демонологии. Я использую свою веру и силу для уничтожения врагов {g|Encyclopedia:Imperium}Империума{/g} — слуги {g|Encyclopedia:Chaos}Хаоса{/g} дрожат при звуке имени Императора, произнесенным моими устами. Я также обладаю навыками биоманта, управляющего телесными процессами. Иногда... иногда я прибегаю к ним в своей работе. Когда необходимо сделать дознаваемого сговорчивее".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Лорд-инквизитор особо настаивал на том, чтобы я освоил дисциплину святой демонологии. Я использую свою веру и силу для уничтожения врагов Империума — слуги Хаоса дрожат при звуке имени Императора, произнесенным моими устами. Я также обладаю навыками биоманта, управляющего телесными процессами. Иногда... иногда я прибегаю к ним в своей работе. Когда необходимо сделать дознаваемого сговорчивее.
- guid: fbbccdb9-9bb1-4ea9-896e-eef36cc66518
  event: Companions_Interrogator_29
  text: '"Биоманты вроде меня в первую очередь овладевают процессами в собственном теле — в том числе и контроль за старением". {n}Хейнрикс криво улыбается.{/n} "Поверь мне, я выглядел бы совершенно иначе, если бы оставлял на себе все следы того, что мне удалось пережить".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Биоманты вроде меня в первую очередь овладевают процессами в собственном теле — в том числе и контроль за старением.
  - speaker: narrator
    text_clean: Хейнрикс криво улыбается.
  - speaker: Heinrix van Calox
    text_clean: Поверь мне, я выглядел бы совершенно иначе, если бы оставлял на себе все следы того, что мне удалось пережить.
- guid: 74f8b900-fcb4-40a5-ae96-375641bc6b7b
  event: Companions_Interrogator_30
  text: '{n}Хейнрикс моргает и смотрит на вас почти что удивленно.{/n} "Я... не задумывался над этим, пока ты не задала этот вопрос. Хм. Пожалуй. Иногда".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс моргает и смотрит на вас почти что удивленно.
  - speaker: Heinrix van Calox
    text_clean: Я... не задумывался над этим, пока ты не задала этот вопрос. Хм. Пожалуй. Иногда.
- guid: 0d1d4d55-439c-4bb6-89de-62df1d4cb956
  event: Companions_Interrogator_31
  text: '"Подавляющее большинство едва обнаруживших себя псайкеров отличаются крайней неуправляемостью и нестабильностью. Я не был исключением... впрочем, я дожил до прибытия {g|Encyclopedia:BlackShip}Черного корабля{/g} на наш мир, а значит, все же доставлял не слишком много неприятностей моим тюремщикам".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Подавляющее большинство едва обнаруживших себя псайкеров отличаются крайней неуправляемостью и нестабильностью. Я не был исключением... впрочем, я дожил до прибытия Черного корабля на наш мир, а значит, все же доставлял не слишком много неприятностей моим тюремщикам.
- guid: 02d2d166-d9e3-4b18-818b-a89726000357
  event: Companions_Interrogator_32
  text: '{n}Хейнрикс рассеянно пожимает плечом.{/n} "У меня редко бывает время и возможность задуматься над этим".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс рассеянно пожимает плечом.
  - speaker: Heinrix van Calox
    text_clean: У меня редко бывает время и возможность задуматься над этим.
- guid: 969f703a-7023-40f1-adfa-1293fad9a2e3
  event: Companions_Interrogator_33
  text: '"Благодарю за то, что нашли время для беседы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодарю за то, что нашли время для беседы.
- guid: bb4b1e27-fa72-4abb-8f1a-8c8a0c210499
  event: Companions_Interrogator_34
  text: '"Мы не свита, {name}, — мы аколиты. Что касается твоего вопроса — я ближе всех к тому, кого принято называть личным учеником. Лорд-инквизитор счел меня достойным того, чтобы поручать мне самые ответственные и щепетильные задания, требующие внимания агентов {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мы не свита, КЭП, — мы аколиты. Что касается твоего вопроса — я ближе всех к тому, кого принято называть личным учеником. Лорд-инквизитор счел меня достойным того, чтобы поручать мне самые ответственные и щепетильные задания, требующие внимания агентов Золотого Трона.
- guid: 262df89f-2174-4562-b857-2e5ae018e7a9
  event: Companions_Interrogator_35
  text: '"Я прикоснулся к самой скверне Архиврага, {name}. Неужели ты думал{mf||а}, что подобный опыт может быть чем-то приятным? {g|Encyclopedia:Psyker}Псайкеры{/g}, даже санкционированные, даже прошедшие все ритуалы и посвящения — врата для сил, враждебных Человечеству. Я выдержал непростой бой на Кьяве Гамма — почти незримый для окружающих и смертельно опасный для меня".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я прикоснулся к самой скверне Архиврага, КЭП. Неужели ты думал, что подобный опыт может быть чем-то приятным? Псайкеры, даже санкционированные, даже прошедшие все ритуалы и посвящения — врата для сил, враждебных Человечеству. Я выдержал непростой бой на Кьяве Гамма — почти незримый для окружающих и смертельно опасный для меня.
- guid: ce7eba3c-5d02-44ca-8af8-b0b5d80aebad
  event: Companions_Interrogator_36
  text: '"В тот час, когда я прикоснулся к когитатору культа, я обратил на себя тысячеглазый взгляд зла — как и любой агент, вмешивающийся в дела тех, что служат Разрушительным Силам. И это зло, без сомнений, оставило на мне незримый отпечаток — как и на любом аколите, что сражается с Архиврагом. Так будет каждый раз, когда я буду исполнять свой долг. Я достаточно много знаю о судьбах тех, кто служил Трону до меня. Достаточно, чтобы понимать, что иного пути для меня не существует".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В тот час, когда я прикоснулся к когитатору культа, я обратил на себя тысячеглазый взгляд зла — как и любой агент, вмешивающийся в дела тех, что служат Разрушительным Силам. И это зло, без сомнений, оставило на мне незримый отпечаток — как и на любом аколите, что сражается с Архиврагом. Так будет каждый раз, когда я буду исполнять свой долг. Я достаточно много знаю о судьбах тех, кто служил Трону до меня. Достаточно, чтобы понимать, что иного пути для меня не существует.
- guid: a524a9d6-d5f3-4fac-b8e1-c752dbc7efd6
  event: Companions_Interrogator_37
  text: '"В тот же момент, когда мы пришвартуемся в одном из доков Футфола. Конечно, если династия фон Валанциус заинтересована в служении {g|Encyclopedia:GoldenThrone}Золотому Трону{/g}... как тому и положено быть".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В тот же момент, когда мы пришвартуемся в одном из доков Футфола. Конечно, если династия фон Валанциус заинтересована в служении Золотому Трону... как тому и положено быть.
- guid: b1dbb5fd-1a14-454a-8cce-b27b8a290f29
  event: Companions_Interrogator_38
  text: '{n}Хейнрикс впивается в вас внимательным взглядом.{/n} "Таково желание главы династии фон Валанциус?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс впивается в вас внимательным взглядом.
  - speaker: Heinrix van Calox
    text_clean: Таково желание главы династии фон Валанциус?
- guid: 3b52e0d1-00f3-4142-8b6e-cb740125281c
  event: Companions_Interrogator_39
  text: '{n}Улыбка слетает с лица дознавателя.{/n} "Однако есть кое-что, о чем я должен тебе сообщить. Там, у {g|Encyclopedia:Cogitator}когитатора{/g}... мое решение позволить ему завершить свою работу позволило мне... я не могу даже подобрать слов... осознать часть грядущего. Ты долж{mf|ен|на} это знать, ибо культ грозит и твоим мирам, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Улыбка слетает с лица дознавателя.
  - speaker: Heinrix van Calox
    text_clean: Однако есть кое-что, о чем я должен тебе сообщить. Там, у когитатора... мое решение позволить ему завершить свою работу позволило мне... я не могу даже подобрать слов... осознать часть грядущего. Ты должен это знать, ибо культ грозит и твоим мирам, КЭП.
- guid: d172c5d4-c7a0-4ab8-988f-8afc430a49e0
  event: Companions_Interrogator_40
  text: '"Когда один из таких ублюдков вырвался на свободу, команда приняла решение просто разгерметизировать отсек и избавиться и от него, и от пленников и экипажа, затронутых его скверной. Но и после этого я слышал эхо бесчеловечных страданий и ужаса, что наполняли ту часть корабля. Даже сегодня воспоминание об этом эпизоде будит во мне скорбь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Когда один из таких ублюдков вырвался на свободу, команда приняла решение просто разгерметизировать отсек и избавиться и от него, и от пленников и экипажа, затронутых его скверной. Но и после этого я слышал эхо бесчеловечных страданий и ужаса, что наполняли ту часть корабля. Даже сегодня воспоминание об этом эпизоде будит во мне скорбь.
- guid: ca88624f-b924-4f1a-bda9-d8807898ea21
  event: Companions_Interrogator_41
  text: '"Тогда, Трона ради, перестань озадачивать меня подобными заявлениями". {n}Голос Хейнрикса звучит то ли устало, то ли насмешливо.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Тогда, Трона ради, перестань озадачивать меня подобными заявлениями.
  - speaker: narrator
    text_clean: Голос Хейнрикса звучит то ли устало, то ли насмешливо.
- guid: 6fd4d7b1-49fa-4549-92a6-5554458c85e2
  event: Companions_Interrogator_42
  text: '"Я бы мог решить, что речь об эхо прошлого или призраке грядущего, но это не так. Колдовство {g|Encyclopedia:Warp}варпа{/g} соединяет временные промежутки, нарушает принятый порядок и ток событий. Мне удалось услышать отголосок того, кто стоит за культом. Я не в первый раз сталкиваюсь с демонами, {name}, но это? Подобного средоточия зла и скверны я не мог себе и представить. {name}... я уверен, что за культом Последнего восхода стоит один из Великих демонов. Страшись того дня, когда он найдет способ лично явиться в этот мир".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я бы мог решить, что речь об эхо прошлого или призраке грядущего, но это не так. Колдовство варпа соединяет временные промежутки, нарушает принятый порядок и ток событий. Мне удалось услышать отголосок того, кто стоит за культом. Я не в первый раз сталкиваюсь с демонами, КЭП, но это? Подобного средоточия зла и скверны я не мог себе и представить. КЭП... я уверен, что за культом Последнего восхода стоит один из Великих демонов. Страшись того дня, когда он найдет способ лично явиться в этот мир.
- guid: e382c9ab-f2dc-42a1-8c3f-664276e32a86
  event: Companions_Interrogator_43
  text: '"Я оперировал машиной, сотворенной слугами Архиврага, и тем самым привлек внимание повелителя культа. Я должен благодарить Трон, что это было лишь мимолетное прикосновение, ибо иначе ... иначе мы бы не говорили здесь с тобой".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я оперировал машиной, сотворенной слугами Архиврага, и тем самым привлек внимание повелителя культа. Я должен благодарить Трон, что это было лишь мимолетное прикосновение, ибо иначе... иначе мы бы не говорили здесь с тобой.
- guid: 4ffbc317-503f-43a1-871b-8dc2f6e39057
  event: Companions_Interrogator_44
  text: '"Пускай {g|Encyclopedia:Cogitator}когитатор{/g} и был остановлен..." {n}Хейнрикс прикрывает глаза, а в его голосе появляются горькие ноты.{/n} "Я прикасался к чудовищной машине, сотворенной ради служения Хаосу. Использовал ее. Вникал в принцип ее работы... этого достаточно. Скверне достаточно самого малого касания".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Пускай когитатор и был остановлен...
  - speaker: narrator
    text_clean: Хейнрикс прикрывает глаза, а в его голосе появляются горькие ноты.
  - speaker: Heinrix van Calox
    text_clean: Я прикасался к чудовищной машине, сотворенной ради служения Хаосу. Использовал ее. Вникал в принцип ее работы... этого достаточно. Скверне достаточно самого малого касания.
- guid: c372ce36-74cc-4612-9748-cab70db25599
  event: Companions_Interrogator_45
  text: '"Это займет некоторое время, {name}. Я умею залечивать грубые раны, умею исправлять уродства... однако перешивать заново свои нервные окончания — слишком тонкая и кропотливая работа. С тобой — ни дня без новых вызовов". {n}Последнюю фразу Хейнрикс произносит с мрачной ухмылкой.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Это займет некоторое время, КЭП. Я умею залечивать грубые раны, умею исправлять уродства... однако перешивать заново свои нервные окончания — слишком тонкая и кропотливая работа. С тобой — ни дня без новых вызовов.
  - speaker: narrator
    text_clean: Последнюю фразу Хейнрикс произносит с мрачной ухмылкой.
- guid: 6a00de4f-9900-450b-80e6-60f8f00675d4
  event: Companions_Interrogator_46
  text: '"Надеюсь, ты не нуждаешься в моем пояснении, что брать в свою свиту {g|Encyclopedia:Drukhari}друкари{/g} — это затея, прочно укрепившаяся между святотатственной ересью и невероятной глупостью? Тем более того, кто один раз уже преуспел в том, чтобы навлечь на наши головы мириад бед? Я не могу представить себе ни одной праведной причины, почему ты пош{mf|ел|ла} на такой шаг... зато неправедных — массу, и это меня пугает и настораживает".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Надеюсь, ты не нуждаешься в моем пояснении, что брать в свою свиту друкари — это затея, прочно укрепившаяся между святотатственной ересью и невероятной глупостью? Тем более того, кто один раз уже преуспел в том, чтобы навлечь на наши головы мириад бед? Я не могу представить себе ни одной праведной причины, почему ты пошел на такой шаг... зато неправедных — массу, и это меня пугает и настораживает.
- guid: 623005d4-3fce-46fd-894e-2120c7c0860b
  event: Companions_Interrogator_47
  text: '"Ирлиэт прямо виновна в том, что мы угодили в ловушку ее собрата. Они сговорились против нас, и то, что одна из них сама стала добычей своего родственника, говорит лишь о том, сколь подлыми и жестокими существами они являются по своей природе. Что бы она не наплела тебе, {name}, верить этому — вершина наивности".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ирлиэт прямо виновна в том, что мы угодили в ловушку ее собрата. Они сговорились против нас, и то, что одна из них сама стала добычей своего родственника, говорит лишь о том, сколь подлыми и жестокими существами они являются по своей природе. Что бы она не наплела тебе, КЭП, верить этому — вершина наивности.
- guid: 3a2d6b21-519d-4386-9b60-49f2ff91cd56
  event: Companions_Interrogator_48
  text: '"Если быть откровенным, у меня есть... некоторые опасения касательно Ульфара. Бесспорно, он — один из {g|Encyclopedia:AdeptusAstartes}Астартес{/g}, божественных воинов Императора, и его помощь будет неоценима в наших попытках убраться из Комморры. Однако... Космические волки — весьма специфический Орден. Я не могу рассказать тебе все... нюансы, не нарушив запреты {g|Encyclopedia:Inquisition}Инквизиции{/g}, однако прошу тебя — будь осторожнее в обращении с этим воителем".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Если быть откровенным, у меня есть... некоторые опасения касательно Ульфара. Бесспорно, он — один из Астартес, божественных воинов Императора, и его помощь будет неоценима в наших попытках убраться из Комморры. Однако... Космические волки — весьма специфический Орден. Я не могу рассказать тебе все... нюансы, не нарушив запреты Инквизиции, однако прошу тебя — будь осторожнее в обращении с этим воителем.
- guid: db81963b-9823-4d2b-bdf5-1224a944c4c5
  event: Companions_Interrogator_49
  text: '"Верно, но не здесь. Я бы не хотел, чтобы наш разговор стал достоянием сплетен на мостике и в офицерских каютах".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Верно, но не здесь. Я бы не хотел, чтобы наш разговор стал достоянием сплетен на мостике и в офицерских каютах.
- guid: 3242c20e-c93c-4fee-9f52-e5278cb3b825
  event: Companions_Interrogator_50
  text: '{n}Хейнрикс смотрит на вас не мигая. Затем его губы искривляются в болезненной гримасе.{/n} "Троном клянусь, {name}... почему ты до сих пор не предал{mf||а} {g|Encyclopedia:Xenos}ксеноса{/g} смерти? Сначала предательство. Теперь — убийство агента {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}. Чего ты ждешь — ножа в собственное сердце?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс смотрит на вас не мигая. Затем его губы искривляются в болезненной гримасе.
  - speaker: Heinrix van Calox
    text_clean: Троном клянусь, КЭП... почему ты до сих пор не предал ксеноса смерти? Сначала предательство. Теперь — убийство агента Золотого Трона. Чего ты ждешь — ножа в собственное сердце?
- guid: fb0e310a-9271-4891-9858-7020b1d4fe7b
  event: Companions_Interrogator_51
  text: '"Я закончил залечивать свое тело. Теперь движения не причиняют мне боли. Надо сказать, весьма вовремя — без моргания глаза весьма сильно пересыхают". {n}Голос Хейнрикса пронизан мрачным весельем.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я закончил залечивать свое тело. Теперь движения не причиняют мне боли. Надо сказать, весьма вовремя — без моргания глаза весьма сильно пересыхают.
  - speaker: narrator
    text_clean: Голос Хейнрикса пронизан мрачным весельем.
- guid: 27231969-8f4f-45a8-a06f-217b859d8e89
  event: Companions_Interrogator_52
  text: '"Прискорбно мало, {name}. Комморра — город {g|Encyclopedia:Drukhari}друкари{/g}, огромный домен ксеносов, возведенный прямо в переплетениях {g|Encyclopedia:Webway}Паутины{/g}. Здесь обретаются их кабалы, отсюда начинаются рейды в реальный мир, в этих тенях таятся верховные предводители ксеносов. Сюда же друкари свозят свою добычу — как свезли и нас".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Прискорбно мало, КЭП. Комморра — город друкари, огромный домен ксеносов, возведенный прямо в переплетениях Паутины. Здесь обретаются их кабалы, отсюда начинаются рейды в реальный мир, в этих тенях таятся верховные предводители ксеносов. Сюда же друкари свозят свою добычу — как свезли и нас.
- guid: a6179ae0-65ce-4f05-9737-722ae3ead587
  event: Companions_Interrogator_53
  text: '{n}Хейнрикс задумывается.{/n} "Едва ли я могу предложить готовый план побега... но я точно знаю, что {g|Encyclopedia:Drukhari}друкари{/g} постоянно соперничают и воюют друг с другом — их вождям многого стоит удерживать своих слуг от полного взаимного уничтожения. Возможно, если ты найдешь способ воспользоваться их личными распрями, у нас появится призрачный шанс выжить... и ускользнуть".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс задумывается.
  - speaker: Heinrix van Calox
    text_clean: Едва ли я могу предложить готовый план побега... но я точно знаю, что друкари постоянно соперничают и воюют друг с другом — их вождям многого стоит удерживать своих слуг от полного взаимного уничтожения. Возможно, если ты найдешь способ воспользоваться их личными распрями, у нас появится призрачный шанс выжить... и ускользнуть.
- guid: 2964137d-b29b-4915-9114-abc570585705
  event: Companions_Interrogator_54
  text: '"{g|Encyclopedia:Emperor}Император{/g} защищает, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Император защищает, КЭП.
- guid: 4ad132e3-e5ff-4ae1-a02a-4d7668c9afe6
  event: Companions_Interrogator_55
  text: '"Ты действительно хочешь знать, что я имею сказать по этому поводу? Или это вежливый оборот речи, на который надо ответить столь же вежливым и лицемерным "Вам померещилось, Лорд-капитан"?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты действительно хочешь знать, что я имею сказать по этому поводу? Или это вежливый оборот речи, на который надо ответить столь же вежливым и лицемерным "Вам померещилось, Лорд-капитан"?
- guid: 9e291b53-9a38-495c-8ee6-324a035087d1
  event: Companions_Interrogator_56
  text: '{n}Хейнрикс растягивает губы в щучьей улыбке.{/n} "Тогда я изолью свои персональные соображения по данному поводу в отчете Лорд-инквизитору. Если, конечно, мне представится такая возможность".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс растягивает губы в щучьей улыбке.
  - speaker: Heinrix van Calox
    text_clean: Тогда я изолью свои персональные соображения по данному поводу в отчете Лорд-инквизитору. Если, конечно, мне представится такая возможность.
- guid: edca3257-0839-44bc-99de-9bed2f6c7117
  event: Companions_Interrogator_57
  text: '{n}Хейнрикс закрывает глаза с таким видом, словно сдерживается от потока грязной брани. Потом с шипением выпускает воздух сквозь сжатые зубы.{/n} "Весьма".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс закрывает глаза с таким видом, словно сдерживается от потока грязной брани. Потом с шипением выпускает воздух сквозь сжатые зубы.
  - speaker: Heinrix van Calox
    text_clean: Весьма.
- guid: 970dc0f6-2f68-4a18-bfac-44e3b624a38d
  event: Companions_Interrogator_58
  text: '"Нет. Изначально мне был присвоен статус {g|Encyclopedia:Psyker}псайкера{/g}, годного для службы в {g|Encyclopedia:AstraMilitarum}Имперской гвардии{/g}, где я и провел несколько лет. Лишь позже я стал агентом {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}". {n}Хейнрикс умолкает, явно не намереваясь продолжать рассказ.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Нет. Изначально мне был присвоен статус псайкера, годного для службы в Имперской гвардии, где я и провел несколько лет. Лишь позже я стал агентом Золотого Трона.
  - speaker: narrator
    text_clean: Хейнрикс умолкает, явно не намереваясь продолжать рассказ.
- guid: 0804f0e8-0a2d-4f9d-867f-85d1830df60b
  event: Companions_Interrogator_59
  text: '{n}Дознаватель разражается злобным и немного безумным смехом. Потом обрывает сам себя и говорит — размеренным, ледяным голосом.{/n} "Позволь мне сказать, что, скорее всего, произошло. Ксенос Ирлиэт вступила в сговор с ксеносом Маражаем. Ахиллеас обнаружил этот факт и поплатился за это своей жизнью. После чего тебе скормили плохо слепленную сказку, оправдывающую врагов Человечества".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Дознаватель разражается злобным и немного безумным смехом. Потом обрывает сам себя и говорит — размеренным, ледяным голосом.
  - speaker: Heinrix van Calox
    text_clean: Позволь мне сказать, что, скорее всего, произошло. Ксенос Ирлиэт вступила в сговор с ксеносом Маражаем. Ахиллеас обнаружил этот факт и поплатился за это своей жизнью. После чего тебе скормили плохо слепленную сказку, оправдывающую врагов Человечества.
- guid: 125b3c87-76c4-40ef-8571-99c4ec284e53
  event: Companions_Interrogator_60
  text: '"Следовало сделать это давным давно, {name}". {n}В глазах дознавателя вспыхивают злые огоньки.{/n} "Тем не менее, если ты сдержишь свое обещание, я буду весьма... нет, неописуемо признателен".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Следовало сделать это давным давно, КЭП.
  - speaker: narrator
    text_clean: В глазах дознавателя вспыхивают злые огоньки.
  - speaker: Heinrix van Calox
    text_clean: Тем не менее, если ты сдержишь свое обещание, я буду весьма... нет, неописуемо признателен.
- guid: 422e6569-3e15-4fd1-8421-3f03efa824af
  event: Companions_Interrogator_61
  text: '"Хм. Прискорбная неуверенность, Лорд-капитан. Но я буду ждать вашего решения".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Хм. Прискорбная неуверенность, Лорд-капитан. Но я буду ждать вашего решения.
- guid: d185da29-46b0-4115-9992-e2853fd313fa
  event: Companions_Interrogator_62
  text: '{n}Хейнрикс откидывает голову назад и несколько секунд размышляет. Затем злобно ухмыляется.{/n} "Полагаю, ксеносу Ирлиэт не пришлась по вкусу столица ее родичей, раз она рвется помогать своей собственной жертве. Иронично".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс откидывает голову назад и несколько секунд размышляет. Затем злобно ухмыляется.
  - speaker: Heinrix van Calox
    text_clean: Полагаю, ксеносу Ирлиэт не пришлась по вкусу столица ее родичей, раз она рвется помогать своей собственной жертве. Иронично.
- guid: 3b1e63e3-dfe3-437b-8d23-60449d3c8d9a
  event: Companions_Interrogator_63
  text: '"Более чем. Полученные данные уже в руках {g|Encyclopedia:Inquisition}Инквизиции{/g} — на попечении тех, кто способен вырвать тайны грядущего из лап {g|Encyclopedia:Chaos}Хаоса{/g}. {d|Encyclopedia:CompHeinrix_Rough}Жертвы{/d}, принесенные когитатору, не будут напрасны".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Более чем. Полученные данные уже в руках Инквизиции — на попечении тех, кто способен вырвать тайны грядущего из лап Хаоса. Жертвы, принесенные когитатору, не будут напрасны.
- guid: 9ac4345e-7798-491c-9cae-9ef5b84cc026
  event: Companions_Interrogator_64
  text: '"Разумеется. Машина {g|Encyclopedia:Fabricator}Фабрикатор-Цензора{/g} {d|Encyclopedia:CompHeinrix_Humane}остановлена{/d}. Больше ни одна душа не отправится в пасть {g|Encyclopedia:Chaos}Архиврага{/g}. Со временем мы сумеем раскрыть и остановить прочие происки культа".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Разумеется. Машина Фабрикатор-Цензора остановлена. Больше ни одна душа не отправится в пасть Архиврага. Со временем мы сумеем раскрыть и остановить прочие происки культа.
- guid: 3336a9bf-2fbe-427b-b730-d0cb6b2aac81
  event: Companions_Interrogator_65
  text: '{n}Хейнрикс позволяет себе слегка улыбнуться.{/n} "Мы нанесли удар не просто культистам, а самому Архиврагу. Это не может не радовать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс позволяет себе слегка улыбнуться.
  - speaker: Heinrix van Calox
    text_clean: Мы нанесли удар не просто культистам, а самому Архиврагу. Это не может не радовать.
- guid: 4a881bf6-8023-4e77-84da-60531f42d375
  event: Companions_Interrogator_66
  text: '{n}Хейнрикс издает сухой смешок.{/n} "Если бы я призвал демона или обрушил на головы окружающих огненный ливень, мы бы сейчас не стояли тут и не разговаривали. Тем не менее, {name}, я унес жизнь члена семьи — на мой взгляд, драмы более чем достаточно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс издает сухой смешок.
  - speaker: Heinrix van Calox
    text_clean: Если бы я призвал демона или обрушил на головы окружающих огненный ливень, мы бы сейчас не стояли тут и не разговаривали. Тем не менее, КЭП, я унес жизнь члена семьи — на мой взгляд, драмы более чем достаточно.
- guid: 823d0314-6d21-4ebd-a167-f8733560c986
  event: Companions_Interrogator_67
  text: '"Ты настолько уверен{mf||а} в том, что культ не пустил корни где-либо еще в твоих владениях? Боюсь, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}, мне придется задержаться. Кроме того, я нахожусь в вашей свите не только из-за своей миссии, но и в качестве..." {n}Хейнрикс запинается, силясь подобрать слово.{/n} "...благосклонного вашему труду советника. Дабы, напомню, "обеспечить сопровождение и содействие в делах великих и малых, что призваны уберечь владения {g|Encyclopedia:Imperium}Империума{/g} от врагов его".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты настолько уверен в том, что культ не пустил корни где-либо еще в твоих владениях? Боюсь, Вольный Торговец, мне придется задержаться. Кроме того, я нахожусь в вашей свите не только из-за своей миссии, но и в качестве...
  - speaker: narrator
    text_clean: Хейнрикс запинается, силясь подобрать слово.
  - speaker: Heinrix van Calox
    text_clean: '...благосклонного вашему труду советника. Дабы, напомню, "обеспечить сопровождение и содействие в делах великих и малых, что призваны уберечь владения Империума от врагов его.'
- guid: f268d30f-be2f-4595-b8c1-18a7816ea9ac
  event: Companions_Interrogator_68
  text: '{n}Хейнрикс скрещивает руки и барабанит пальцами по предплечью.{/n} "Это небезопасная информация, но ты уже слишком увяз{mf||ла} в этой истории... в рядах Инквизиции существуют две основные философии — пуританство и радикализм. Приверженцы первой — консерваторы, которые стремятся во всем придерживаться инквизиторской доктрины во всех деталях. Радикалы... более прагматичны. Они часто считают, что цель оправдывает средства, и используют инструменты, которые пуританин заклеймит ересью".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс скрещивает руки и барабанит пальцами по предплечью.
  - speaker: Heinrix van Calox
    text_clean: Это небезопасная информация, но ты уже слишком увяз в этой истории... в рядах Инквизиции существуют две основные философии — пуританство и радикализм. Приверженцы первой — консерваторы, которые стремятся во всем придерживаться инквизиторской доктрины во всех деталях. Радикалы... более прагматичны. Они часто считают, что цель оправдывает средства, и используют инструменты, которые пуританин заклеймит ересью.
- guid: f6f98bb9-81da-4fb6-8f3e-8fa24b1625ca
  event: Companions_Interrogator_69
  text: '{n}Хейнрикс чуть склоняет голову и начинает говорить тише.{/n} "Присутствие рядом с тобой — испытание для меня. Испытание, к которому я готов не был и потому даже говорить о нем мне... сложно. Как и обо всем, что касается моих желаний, а не обязанностей и долга. Ибо последние стоят превыше меня. Прошу тебя, {name}..." {n}Он колеблется секунду. Потом берет вашу руку, подносит к губам и нежно целует ваши пальцы.{/n} "В нашем положении я могу позволить себе... весьма немного. И ты, на самом деле — тоже. Просто... позволь мне быть рядом и помогать тебе. Этого для меня уже достаточно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс чуть склоняет голову и начинает говорить тише.
  - speaker: Heinrix van Calox
    text_clean: Присутствие рядом с тобой — испытание для меня. Испытание, к которому я готов не был и потому даже говорить о нем мне... сложно. Как и обо всем, что касается моих желаний, а не обязанностей и долга. Ибо последние стоят превыше меня. Прошу тебя, КЭП...
  - speaker: narrator
    text_clean: Он колеблется секунду. Потом берет вашу руку, подносит к губам и нежно целует ваши пальцы.
  - speaker: Heinrix van Calox
    text_clean: В нашем положении я могу позволить себе... весьма немного. И ты, на самом деле — тоже. Просто... позволь мне быть рядом и помогать тебе. Этого для меня уже достаточно.
- guid: 264238e8-9222-4040-ae1f-50f7ae018467
  event: Companions_Interrogator_70
  text: '{n}Хейнрикс несколько секунд молчит. Затем заглядывает вам глаза:{/n} "Позвольте быть откровенны, {name}... вы удивительны. Неповторимы. Не только в силу своего особого положения, сколько в силу..." {n}Он запинается.{/n} "Я благодарен Богу-Императору, что долг перед ним привел меня в вашу свиту. И за то, что у меня есть возможность... быть рядом с вами. Поверьте, невзирая на мою... специфическую роль при вас, я искренне хочу оградить вас от... напрасных переживаний".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'Хейнрикс несколько секунд молчит. Затем заглядывает вам глаза:'
  - speaker: Heinrix van Calox
    text_clean: Позвольте быть откровенны, КЭП... вы удивительны. Неповторимы. Не только в силу своего особого положения, сколько в силу...
  - speaker: narrator
    text_clean: Он запинается.
  - speaker: Heinrix van Calox
    text_clean: Я благодарен Богу-Императору, что долг перед ним привел меня в вашу свиту. И за то, что у меня есть возможность... быть рядом с вами. Поверьте, невзирая на мою... специфическую роль при вас, я искренне хочу оградить вас от... напрасных переживаний.
- guid: f838435c-5a24-4cdf-95e0-29afa22ae923
  event: Companions_Interrogator_71
  text: '"Я — еретик, {name}". {n}Хейнрикс чуть пожимает плечами и мягко улыбается.{/n} "Странно слышать такое о себе... и все же это мое решение. Довольно жертв во имя Империума. Я отдал долг перед Золотым Троном — теперь я служу тебе".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я — еретик, КЭП.
  - speaker: narrator
    text_clean: Хейнрикс чуть пожимает плечами и мягко улыбается.
  - speaker: Heinrix van Calox
    text_clean: Странно слышать такое о себе... и все же это мое решение. Довольно жертв во имя Империума. Я отдал долг перед Золотым Троном — теперь я служу тебе.
- guid: dc1e2f11-4805-48e2-b760-3fcde853e827
  event: Companions_Interrogator_72
  text: '{n}Хейнрикс жарко отвечает на ваш поцелуй, после чего хрипло усмехается.{/n} "Я знаю".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс жарко отвечает на ваш поцелуй, после чего хрипло усмехается.
  - speaker: Heinrix van Calox
    text_clean: Я знаю.
- guid: be2e6b8c-d291-4f48-a14a-c7066df2519c
  event: Companions_Interrogator_73
  text: '"Я понимаю, что ты беспокоишься. Возможно, ты уже не доверяешь моему суждению по этому поводу, но... после того срыва я больше не чувствую былого напряжения и былой опасности. Кажется, мой контроль над колдовством восстановился... по крайней мере частично".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я понимаю, что ты беспокоишься. Возможно, ты уже не доверяешь моему суждению по этому поводу, но... после того срыва я больше не чувствую былого напряжения и былой опасности. Кажется, мой контроль над колдовством восстановился... по крайней мере частично.
- guid: a8126bef-36f4-471e-8c6b-43e5b617ca01
  event: Companions_Interrogator_74
  text: '"Если же ты считаешь, что отлучение от Инквизиции автоматически лишит меня всех психотехник и всей моей воли, которыми я противостою варпу... нет". {n}Он позволяет себе смешок.{/n} "Это не так. Мой самоконтроль — исключительно мой".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Если же ты считаешь, что отлучение от Инквизиции автоматически лишит меня всех психотехник и всей моей воли, которыми я противостою варпу... нет.
  - speaker: narrator
    text_clean: Он позволяет себе смешок.
  - speaker: Heinrix van Calox
    text_clean: Это не так. Мой самоконтроль — исключительно мой.
- guid: 8a970380-b923-4218-82d0-78b2081f0f12
  event: Companions_Interrogator_75
  text: '{n}Бровь Хейнрикса взмывает вверх.{/n} "Ваше, Лорд-капитан, беспокойство о моих... потребностях весьма неожиданно. Желаете восполнить мой недостаток общения? Я был бы не против приятной беседы, если для этого у вас когда-нибудь найдется время".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Бровь Хейнрикса взмывает вверх.
  - speaker: Heinrix van Calox
    text_clean: Ваше, Лорд-капитан, беспокойство о моих... потребностях весьма неожиданно. Желаете восполнить мой недостаток общения? Я был бы не против приятной беседы, если для этого у вас когда-нибудь найдется время.
- guid: 5052cf4e-76d8-4422-ae88-1a1b4d785bd6
  event: Companions_Interrogator_76
  text: '{n}Хейнрикс смотрит на вас несколько мгновений, после чего едва заметно улыбается.{/n} "Возможно. Когда у нас с тобой появится подходящее время".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс смотрит на вас несколько мгновений, после чего едва заметно улыбается.
  - speaker: Heinrix van Calox
    text_clean: Возможно. Когда у нас с тобой появится подходящее время.
- guid: 7e1c8aad-d3b1-4817-92e1-9d269bdf72e8
  event: Companions_Interrogator_77
  text: '{n}Хейнрикс взирает на вас, словно размышляя о чем-то. Наконец, решившись, он негромко произносит.{/n} "С завершением моей миссии я могу посвятить время иным вещам. Например, данному когда-то обещанию о беседе с Лорд-капитаном".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс взирает на вас, словно размышляя о чем-то. Наконец, решившись, он негромко произносит.
  - speaker: Heinrix van Calox
    text_clean: С завершением моей миссии я могу посвятить время иным вещам. Например, данному когда-то обещанию о беседе с Лорд-капитаном.
