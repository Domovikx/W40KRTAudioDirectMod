- guid: c2897045-8f9f-4f78-a8d9-debab485ef71
  event: Companions_Interrogator_97
  text: '"Госпожа Хейдари — опасный человек, а опасные люди любят опасные вещи. Джай наверняка неравнодушна к хорошему оружию, у нее даже есть небольшая, но внушающая почтение коллекция. Такой подарок был бы не только практичен, учитывая ее опасное ремесло, но и показал бы, что вы проявили внимание к ее персоне, интересовались ее вкусами. Такие демонстрации личной симпатии очень важны при общении с информ... людьми, которых вы хотите к себе расположить".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Госпожа Хейдари — опасный человек, а опасные люди любят опасные вещи. Джай наверняка неравнодушна к хорошему оружию, у нее даже есть небольшая, но внушающая почтение коллекция. Такой подарок был бы не только практичен, учитывая ее опасное ремесло, но и показал бы, что вы проявили внимание к ее персоне, интересовались ее вкусами. Такие демонстрации личной симпатии очень важны при общении с информ... людьми, которых вы хотите к себе расположить.
