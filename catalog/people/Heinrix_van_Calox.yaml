  event: CH1_HeinrixFirstMeet_17
  text: '"Я уверен, что не все электрожрецы, обретающиеся в этих стенах, погибли — еретики упоминали о тенях, что появлялись из боковых аллей и стремительно уничтожали вторгнувшихся в их чертоги культистов. Я могу предположить, что вход в их убежище находится где-то в зале рядом с машиной под названием "циркулярный когитатор". Полагаю, это одна из местных святынь, к которым электрожрецы относятся с особым пиететом".'
  speaker: Heinrix van Calox
