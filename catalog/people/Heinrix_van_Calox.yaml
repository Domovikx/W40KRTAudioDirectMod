    text_clean: И я помню, что из всех мест на этом корабле я пришел сюда. К тебе.
- guid: 5cb3c3cb-c1d8-494e-9ee8-05b89b09934a
  event: RMNC_Heinrix_MainEvent_3_06
  text: '{n}Медленно, очень медленно воздух вокруг вас перестает звенеть от потусторонней стужи. В лице дознавателя появляется признак жизни: он устало опускает веки и с сипом втягивает воздух сквозь посиневшие губы, по его телу пробегает крупная дрожь.{/n} "{name}? Что... произошло?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'Медленно, очень медленно воздух вокруг вас перестает звенеть от потусторонней стужи. В лице дознавателя появляется признак жизни: он устало опускает веки и с сипом втягивает воздух сквозь посиневшие губы, по его телу пробегает крупная дрожь.'
  - speaker: Heinrix van Calox
    text_clean: КЭП? Что... произошло?
