  text: '{n}Невозмутимое выражение Хейнрикса на мгновение меняется, являя миру нечто потаенное, темное и жестокое.{/n} "Благодарю за содействие, Лорд-капитан. Я лично избавлю мир от этой падали — сразу после того, как проведу пристрастное дознание по ряду вопросов".'
