  event: RMNC_Heinrix_MainEvent_3_05
  text: '{n}Хейнрикс обводит взглядом помещение.{/n} "Я помню. Я помню, как был на палубе... офицера... срыв..." {n}Он смотрит на вас в упор.{/n} "И я помню, что из всех мест на этом корабле я пришел сюда. К тебе".'
