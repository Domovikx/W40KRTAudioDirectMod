  event: RMNC_Heinrix_MainEvent_3_04
  text: '{n}Хейнрикс едва слышно смеется.{/n} "Нет. Я защищаю тебя. Варп-лед... физическое проявление колдовства. Я пытаюсь сдержать прорыв. И чем больше я это делаю, тем сильнее становится лед. Хорошо. Правильно. Я стану глыбой, если это позволит уберечь тебя".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс едва слышно смеется.
  - speaker: Heinrix van Calox
    text_clean: Нет. Я защищаю тебя. Варп-лед... физическое проявление колдовства. Я пытаюсь сдержать прорыв. И чем больше я это делаю, тем сильнее становится лед. Хорошо. Правильно. Я стану глыбой, если это позволит уберечь тебя.
