  event: Companions_Interrogator_84
  text: '"Есть методы, которые позволят вскрыть ее память и извлечь те секреты, которые она пока что хранит при себе. Я позабочусь о том, чтобы ни одна тайна не ускользнула от внимания Святого Ордоса".'
