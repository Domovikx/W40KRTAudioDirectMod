  - speaker: Heinrix van Calox
    text_clean: Кто знает — возможно, когда-нибудь я закончу свой путь так же, как Эмелина. Но этот день еще не настал.
- guid: 77ac123e-791b-4483-8bfe-c0760c1ed267
  event: Companions_Interrogator_90
  text: '"Эмелина использовала силы Хаоса, чтобы совладать с ксеносами. Я прикоснулся к когитатору, сотворенному культистами, чтобы постичь его тайны. Никто из нас не чист. Ксавьер..." {n}Хейнрикс запинается. А потом начинает говорить, очень, очень тщательно выбирая слова.{/n} "Малодушные говорят, что каждый инквизитор заканчивает свою карьеру гибелью или клеймением еретиком. Лорд-инквизитор в этом ремесле дольше любого из нас. Наивно считать, что он всегда пользовался только пуританскими методами — и не менее наивно думать, что его методы хоть сколько-то поколебали его верность Богу-Императору. На этом — закроем эту тему".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Эмелина использовала силы Хаоса, чтобы совладать с ксеносами. Я прикоснулся к когитатору, сотворенному культистами, чтобы постичь его тайны. Никто из нас не чист. Ксавьер...
  - speaker: narrator
    text_clean: Хейнрикс запинается. А потом начинает говорить, очень, очень тщательно выбирая слова.
  - speaker: Heinrix van Calox
    text_clean: Малодушные говорят, что каждый инквизитор заканчивает свою карьеру гибелью или клеймением еретиком. Лорд-инквизитор в этом ремесле дольше любого из нас. Наивно считать, что он всегда пользовался только пуританскими методами — и не менее наивно думать, что его методы хоть сколько-то поколебали его верность Богу-Императору. На этом — закроем эту тему.
