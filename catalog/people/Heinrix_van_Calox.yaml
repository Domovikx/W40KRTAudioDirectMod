- guid: 19f63821-cb0b-4f5d-80b8-5d89d1d3a9f0
  event: Companions_Interrogator_89
  text: '"Я все еще остаюсь частью твоей свиты, {name} — это не изменилось. Я продолжу сопровождать тебя, пока не получу иной приказ от Лорд-инквизитора... если получу". {n}Хейнрикс мрачнеет.{/n} "Кто знает — возможно, когда-нибудь я закончу свой путь так же, как Эмелина. Но этот день еще не настал".'
