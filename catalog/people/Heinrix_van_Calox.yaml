  event: RMNC_Heinrix_MainEvent_3_03
  text: '{n}Стоит вам сделать шаг, как ваше тело охватывают колючие тиски нестерпимого холода. Вы видите, как по ногам Хейнрикса начинают змеиться кристаллы льда. Дознаватель едва шевелит рукой:{/n} "Не подходи. Прямо сейчас я опасен. Я пытаюсь сдержать прорыв, но я все же могу причинить тебе вред".'
