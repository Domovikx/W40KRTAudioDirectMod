  text: '"{name}..." {n}Хейнрикс медленно встает. Видно, как тяжело это дается ему.{/n} "Ты невероятна... Ты показала мне, каким может быть мир вокруг, когда сердце бьется в унисон с другим. Ты... спасла меня от себя. Я люблю тебя".'
