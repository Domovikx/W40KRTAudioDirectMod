  event: CH1_HeinrixFirstMeet_27
  text: '{n}Идира отшатывается от дознавателя как ошпаренная и начинает качаться из стороны в сторону.{/n} "Т-тень, огроменная тень, что заслоняет солнца и плетет цепи! Ниточки вижу, мириады их ко всем нам тянутся, все к нему ползут словно змеи, ядом нас окутывают. Беду чую, ой-ой-ой, аж в горле скребет!" {n}Изо рта {g|Encyclopedia:Psyker}псайкера{/g} вырывается облачко черного дыма, который тут же рассеивается в воздухе.{/n}'
