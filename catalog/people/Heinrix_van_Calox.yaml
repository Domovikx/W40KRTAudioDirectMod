name: Heinrix van Calox
sound_keys:
- Heinrix
- Interrogator
- HC
total_phrases: 410
phrases:
- guid: 1490f455-def7-4a23-9cea-df410719273c
  event: BNTRS_AreaPeaceful_Heinrix_12
  text: '"Твой вид живет на искусственных кораблях, питаемых энергией усопших. На твоем месте я бы воздержался от инсинуаций".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Твой вид живет на искусственных кораблях, питаемых энергией усопших. На твоем месте я бы воздержался от инсинуаций.
- guid: f490b765-1707-41e5-8cae-3cb12fe0e541
  event: BNTRS_AreaPeaceful_Heinrix_8
  text: '"Затянувшееся восстание не могло не ударить по боевому духу солдат. Дисциплина и верность Богу-Императору — вот что держит людей, когда моральные ресурсы истрачены".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Затянувшееся восстание не могло не ударить по боевому духу солдат. Дисциплина и верность Богу-Императору — вот что держит людей, когда моральные ресурсы истрачены.
- guid: 7d1148b6-d246-45f4-8196-aef72e4e7ce0
  event: BNTRS_AreaStressful_Heinrix_101
  text: '"Полагаю, обитатели подобных усадеб могут при желании купить Футфол целиком в качестве сезонной резиденции".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Полагаю, обитатели подобных усадеб могут при желании купить Футфол целиком в качестве сезонной резиденции.
- guid: 62e191d9-838b-4a76-829a-c00bbadab39e
  event: BNTRS_AreaStressful_Heinrix_102
  text: '"Руины создают слабый пси-фон... впрочем, сейчас он не представляет непосредственной угрозы. Задерживаться все же не советую".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Руины создают слабый пси-фон... впрочем, сейчас он не представляет непосредственной угрозы. Задерживаться все же не советую.
- guid: ee3896b6-da97-42d4-9378-59a17d17bcb5
  event: BNTRS_AreaStressful_Heinrix_107
  text: '"В наших общих интересах сделать так, чтобы Вольный Торговец случайно не сгинул{mf||а} в недрах собственного судна. Не так ли, сенешаль?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В наших общих интересах сделать так, чтобы Вольный Торговец случайно не сгинул в недрах собственного судна. Не так ли, сенешаль?
- guid: ee10517e-7899-4dff-a0c9-88da5e9735ba
  event: BNTRS_AreaStressful_Heinrix_11
  text: '"Весь улей в дыму. И ваш дворец... Мы вычистим его до последнего ксеноса, Вольный Торговец".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Весь улей в дыму. И ваш дворец... Мы вычистим его до последнего ксеноса, Вольный Торговец.
- guid: 8cb040b2-0958-424c-997b-520b6d1c422f
  event: BNTRS_AreaStressful_Heinrix_114
  text: '"Дуновение Имматериума... похоже на присутствие вашей придворной ведьмы. Мы близко".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Дуновение Имматериума... похоже на присутствие вашей придворной ведьмы. Мы близко.
- guid: f49bb054-e043-429d-8d67-afc5f37856c6
  event: BNTRS_AreaStressful_Heinrix_116
  text: '"Навис Нобилите — специфическая структура в составе Империума. Привилегированное положение навигаторов позволяет им совершать многие сомнительные деяния, которые они прячут за стенами своих крепостей".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Навис Нобилите — специфическая структура в составе Империума. Привилегированное положение навигаторов позволяет им совершать многие сомнительные деяния, которые они прячут за стенами своих крепостей.
- guid: 3bb1959f-86c9-4e89-bed2-cf338572424a
  event: BNTRS_AreaStressful_Heinrix_125
  text: '"Полагаю, многие заслуживают. Но не от рук ксеносов".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Полагаю, многие заслуживают. Но не от рук ксеносов.
- guid: 1d0bdfaf-55ee-412f-826a-e7b53a15db8e
  event: BNTRS_AreaStressful_Heinrix_128
  text: '"Проклятье... это вокс-литургия, искаженная колдовством варпа. Не прислушивайтесь слишком сильно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Проклятье... это вокс-литургия, искаженная колдовством варпа. Не прислушивайтесь слишком сильно.
- guid: 7c629b2e-2252-4d7b-9dad-901e15afd5b8
  event: BNTRS_AreaStressful_Heinrix_143
  text: '"Находку уцелевшего шаттла в этом пылающем аду можно будет смело приравнять к чуду Бога-Императора".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Находку уцелевшего шаттла в этом пылающем аду можно будет смело приравнять к чуду Бога-Императора.
- guid: 79c7987e-aa91-4de5-a373-d504f4a1921f
  event: BNTRS_AreaStressful_Heinrix_160
  text: '"В воздухе витает слабое напряжение, словно далекое пси-эхо... Полагаю, оно вызывано произошедшей на этих улицах бойней".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В воздухе витает слабое напряжение, словно далекое пси-эхо... Полагаю, оно вызывано произошедшей на этих улицах бойней.
- guid: e52700f2-e268-43dd-9570-9ad9f6b77b5d
  event: BNTRS_AreaStressful_Heinrix_167
  text: '"Красивая метафора, но, судя по характеру разрушений, я бы скорее ставил на мельта-заряды".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Красивая метафора, но, судя по характеру разрушений, я бы скорее ставил на мельта-заряды.
- guid: a2511ee6-bc6a-4146-9230-0668cd08a9b3
  event: BNTRS_AreaStressful_Heinrix_28
  text: '"Госпожа Хейдари, если вам удастся провернуть подобную сделку, я буду крайне заинтересован в информации о тех, кто у вас это купит".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Госпожа Хейдари, если вам удастся провернуть подобную сделку, я буду крайне заинтересован в информации о тех, кто у вас это купит.
- guid: cd5db23a-7930-4f65-8f38-758e92d5e418
  event: BNTRS_AreaStressful_Heinrix_4
  text: '"Обычно с таких безмятежных ремарок и начинаются крупные неприятности. Оставайтесь начеку".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Обычно с таких безмятежных ремарок и начинаются крупные неприятности. Оставайтесь начеку.
- guid: 0a158906-7952-4e2f-8d2a-48baa859b4ec
  event: BNTRS_AreaStressful_Heinrix_50
  text: '"Футфол — знаковое место, великий памятник огромных амбиций и разрушенных надежд".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Футфол — знаковое место, великий памятник огромных амбиций и разрушенных надежд.
- guid: cb465034-4804-4b0d-b6f2-cc854c6e54fc
  event: BNTRS_AreaStressful_Heinrix_56
  text: '"Мы знаем все, что надо знать, и контролируем все, что надо контролировать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мы знаем все, что надо знать, и контролируем все, что надо контролировать.
- guid: 4a4e74cc-0f58-479e-812e-2fd87c7a2bef
  event: BNTRS_AreaStressful_Heinrix_63
  text: '"Дело не в том, насколько далеко вы разбрасываетесь сведениями. Дело в том, насколько тщательно мы опрашиваем тех, кто ими обладает".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Дело не в том, насколько далеко вы разбрасываетесь сведениями. Дело в том, насколько тщательно мы опрашиваем тех, кто ими обладает.
- guid: a178e185-f8aa-4e72-9f1a-9a956a227d44
  event: BNTRS_AreaStressful_Heinrix_73
  text: '"Сестра, умерьте пыл. Ваш энтузиазм похвален, однако в первую очередь я должен выяснить намерения Архиврага, а не растоптать его проявления без оглядки".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Сестра, умерьте пыл. Ваш энтузиазм похвален, однако в первую очередь я должен выяснить намерения Архиврага, а не растоптать его проявления без оглядки.
- guid: 7bb900c2-cb84-4197-8a82-d0c880f2e956
  event: BNTRS_AreaStressful_Heinrix_75
  text: '"Я притворюсь, что не слышал твоих последних слов, ведьма".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я притворюсь, что не слышал твоих последних слов, ведьма.
- guid: 7ed40f78-4833-4102-9f42-d03d9f4d4994
  event: BNTRS_AreaStressful_Heinrix_77
  text: '"Вы опасный человек, леди Орселлио. Все навигаторы опасны, но ваши способности выделяют вас в особую категорию".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы опасный человек, леди Орселлио. Все навигаторы опасны, но ваши способности выделяют вас в особую категорию.
- guid: 5f6ebe2b-d9cc-4cf5-8a6e-a82dafa5b4f5
  event: BNTRS_AreaStressful_Heinrix_83
  text: '"Бесценнее этого глубокомысленного прорицания — только выражение лиц тех, кто его сейчас услышал".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Бесценнее этого глубокомысленного прорицания — только выражение лиц тех, кто его сейчас услышал.
- guid: 7bd665ee-5dae-4345-a294-7676f2f35e36
  event: BNTRS_AreaStressful_Heinrix_88
  text: '"Я не успел побывать на Райкади Филии до того, как на основной планете вспыхнуло восстание. Из рапорта я читал, что комендант проявляет... необычную изобретательность в обращении с заточенными на планетоиде".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я не успел побывать на Райкади Филии до того, как на основной планете вспыхнуло восстание. Из рапорта я читал, что комендант проявляет... необычную изобретательность в обращении с заточенными на планетоиде.
- guid: abfee042-a167-44bc-a3c0-037b320aebb9
  event: BNTRS_Chapter1_Heinrix_02
  text: '"Боюсь, скверна Архиврага способна жить в трещинах и сколах святых машин еще долгие годы. Убедите своих коллег внимательнее следить за их исчислениями".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Боюсь, скверна Архиврага способна жить в трещинах и сколах святых машин еще долгие годы. Убедите своих коллег внимательнее следить за их исчислениями.
- guid: 45c656ab-a788-4b34-8c3c-962c1c16d28b
  event: BNTRS_Chapter1_Heinrix_09
  text: '"Я бы назвал это более емким термином... но не хочу сквернословить в вашем присутствии".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я бы назвал это более емким термином... но не хочу сквернословить в вашем присутствии.
- guid: 26fa51fd-62be-451f-9e5b-baae14a42688
  event: BNTRS_Chapter1_Heinrix_19
  text: '"Интересная интерпретация реальности. Впрочем, если перевести ваши слова в метафору, она будет весьма точна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Интересная интерпретация реальности. Впрочем, если перевести ваши слова в метафору, она будет весьма точна.
- guid: be5dfdfa-7ea0-498b-9000-42f29106dc2e
  event: BNTRS_Chapter1_Heinrix_27
  text: '"Надеюсь, Дом Орселлио перенесет полученный удар. Разом лишиться станции и множества слуг — тяжелое испытание".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Надеюсь, Дом Орселлио перенесет полученный удар. Разом лишиться станции и множества слуг — тяжелое испытание.
- guid: 263d6d56-b8a7-438d-8de8-07c56ce63716
  event: BNTRS_Chapter1_Heinrix_30
  text: '"Силы Архиврага уже охватывают этот мир... у нас очень мало времени".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Силы Архиврага уже охватывают этот мир... у нас очень мало времени.
- guid: a65b47d7-ac5d-4aa2-84d8-793d893ce460
  event: BNTRS_Chapter1_Heinrix_42
  text: '"У вас весьма необычная свита, Вольный Торговец. Едва ли удивительно при вашем статусе, но все же".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: У вас весьма необычная свита, Вольный Торговец. Едва ли удивительно при вашем статусе, но все же.
- guid: bd5759cc-09d2-4e08-866c-ab1fd293e0e3
  event: BNTRS_Chapter1_Heinrix_47
  text: '"Заверяю вас, Первый офицер Версериан. Если мне понадобится что-то осмотреть, я не буду взламывать замки — я попрошу вас лично сопроводить меня".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Заверяю вас, Первый офицер Версериан. Если мне понадобится что-то осмотреть, я не буду взламывать замки — я попрошу вас лично сопроводить меня.
- guid: 8f35cecc-a458-48eb-9761-fd96a83422df
  event: BNTRS_Chapter1_Heinrix_56
  text: '"Замена людей на сервиторов — предприятие, которое под силу только крупному миру-кузне. Остальным приходится мириться с людскими слабостями".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Замена людей на сервиторов — предприятие, которое под силу только крупному миру-кузне. Остальным приходится мириться с людскими слабостями.
- guid: 1e40891e-d92f-479c-8d03-91f615cb333e
  event: BNTRS_Chapter2_Heinrix_02
  text: '"Я бы не хотел обсуждать свое эмоциональное состояние. Особенно касающееся того... места".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я бы не хотел обсуждать свое эмоциональное состояние. Особенно касающееся того... места.
- guid: 3aac7d4b-e920-407c-ac50-453832fe5d1a
  event: BNTRS_Chapter2_Heinrix_103
  text: '"Ты вкладываешь слишком много веры в силу своего обещания. Я найду время, чтобы обучить тебя нескольким психотехникам, которые помогают скрепить волю против влияния Архиврага".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты вкладываешь слишком много веры в силу своего обещания. Я найду время, чтобы обучить тебя нескольким психотехникам, которые помогают скрепить волю против влияния Архиврага.
- guid: 8de87e6f-a9e9-49f9-9351-d2b4b5f7e8b4
  event: BNTRS_Chapter2_Heinrix_105
  text: '"Идира. Скажи мне. Слышала ли ты вновь голос Теодоры с той стороны?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Идира. Скажи мне. Слышала ли ты вновь голос Теодоры с той стороны?
- guid: b31f9fb4-d70a-4986-bec5-5e05a41201fa
  event: BNTRS_Chapter2_Heinrix_112
  text: '"Вы очень, просто поразительно прямолинейны в словах, сестра".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы очень, просто поразительно прямолинейны в словах, сестра.
- guid: 07f39cf4-88ce-4857-816b-103b07d1162a
  event: BNTRS_Chapter2_Heinrix_123
  text: '"Если бы "шерин Джай" нагрешила в достаточной мере, чтобы у меня было на нее досье, госпожа Хейдари давно бы никому не докучала".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Если бы "шерин Джай" нагрешила в достаточной мере, чтобы у меня было на нее досье, госпожа Хейдари давно бы никому не докучала.
- guid: 8df3619c-b0f1-41cc-ac70-cdcd19e9677f
  event: BNTRS_Chapter2_Heinrix_134
  text: '"У меня есть подозрение, что время и силы Вольного Торговца можно было бы растрачивать более эффективно, чем добывать справки. Впрочем, у Лорд-капитана явно другое мнение на этот счет".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: У меня есть подозрение, что время и силы Вольного Торговца можно было бы растрачивать более эффективно, чем добывать справки. Впрочем, у Лорд-капитана явно другое мнение на этот счет.
- guid: 739f0e75-32ac-41cb-af09-f3fbc98938b1
  event: BNTRS_Chapter2_Heinrix_136
  text: '"Магос Паскаль, исследования аугментов, извлеченных из ваших собратьев, принесли какие-либо плоды?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Магос Паскаль, исследования аугментов, извлеченных из ваших собратьев, принесли какие-либо плоды?
- guid: 588cbbd9-9dc2-49ec-97ba-17210d2b8fd6
  event: BNTRS_Chapter2_Heinrix_14
  text: '"Утрата сектора — это катастрофа. В Просторе Коронус нет сил, способных противостоять тому, что отныне может явиться из системы Райкада".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Утрата сектора — это катастрофа. В Просторе Коронус нет сил, способных противостоять тому, что отныне может явиться из системы Райкада.
- guid: f23839c7-2b97-498a-acca-a367245deb79
  event: BNTRS_Chapter2_Heinrix_140
  text: '"Будьте спокойны, Первый офицер — пока в моих планах такового нет".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Будьте спокойны, Первый офицер — пока в моих планах такового нет.
- guid: a9d64547-cee4-4299-bd13-865d230256cc
  event: BNTRS_Chapter2_Heinrix_145
  text: '"Что я могу сказать, Леди-Навигатор. Редко когда я вынужден допускать и терпеть подле себя ксеноересь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Что я могу сказать, Леди-Навигатор. Редко когда я вынужден допускать и терпеть подле себя ксеноересь.
- guid: 1bfba8d7-724c-4f19-8b99-6cb511c5b96b
  event: BNTRS_Chapter2_Heinrix_152
  text: '"Не усердствуй в своих исследованиях, эльдар. Черта, за которой твое любопытство будет выглядеть как шпионаж, весьма условна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не усердствуй в своих исследованиях, эльдар. Черта, за которой твое любопытство будет выглядеть как шпионаж, весьма условна.
- guid: 91712f8f-a573-4fc7-a73e-d541554fb70a
  event: BNTRS_Chapter2_Heinrix_16
  text: '"Это знак того, что оборона Даргонуса была организована более-менее эффективно. Налет друкари — тяжелое испытание для любого мира".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Это знак того, что оборона Даргонуса была организована более-менее эффективно. Налет друкари — тяжелое испытание для любого мира.
- guid: a327456c-8249-43f6-8f03-68e66878922b
  event: BNTRS_Chapter2_Heinrix_29
  text: '"И он все еще на свободе и волен действовать как ему угодно. На вашем месте, Абеляр, я бы озаботился тем, чтобы более ни один подданный фон Валанциус не пребывал в неведении касательно его предательства".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: И он все еще на свободе и волен действовать как ему угодно. На вашем месте, Абеляр, я бы озаботился тем, чтобы более ни один подданный фон Валанциус не пребывал в неведении касательно его предательства.
- guid: 5bd2a2a3-ada8-403f-9a5f-afef4eac4653
  event: BNTRS_Chapter2_Heinrix_38
  text: '"В первую очередь Владайм будет кормить тех, от кого зависит его власть на Футфоле. Впрочем, до простых работяг очередь тоже должна дойти".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В первую очередь Владайм будет кормить тех, от кого зависит его власть на Футфоле. Впрочем, до простых работяг очередь тоже должна дойти.
- guid: dd66eab7-dcc7-4d6f-9dae-c0bd05fecccf
  event: BNTRS_Chapter2_Heinrix_43
  text: '"Зная то, что мне известно о госпоже Чорда, я бы на твоем месте не веселился. Вольный Торговец — опасный противник".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Зная то, что мне известно о госпоже Чорда, я бы на твоем месте не веселился. Вольный Торговец — опасный противник.
- guid: b889710c-64d5-43b4-852d-a9c8f4f647c6
  event: BNTRS_Chapter2_Heinrix_45
  text: '"Янус еще долго будет оставаться объектом пристального внимания Инквизиции. То, что происходило на планете, слишком... проблематично".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Янус еще долго будет оставаться объектом пристального внимания Инквизиции. То, что происходило на планете, слишком... проблематично.
- guid: cdbf3c56-ece1-4599-ab53-f7a337f87f41
  event: BNTRS_Chapter2_Heinrix_55
  text: '"Любая победа Архиврага вносит смуту в мысли и сердце. Крепитесь, магос — для вас произошедшее особенно тяжело".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Любая победа Архиврага вносит смуту в мысли и сердце. Крепитесь, магос — для вас произошедшее особенно тяжело.
- guid: c53efabf-47a7-460b-b91a-b7ac3b534530
  event: BNTRS_Chapter2_Heinrix_60
  text: '"Появление Несущих Слово на Кьяве Гамма — тревожный знак. Еще тревожнее этого — то, как легко Фабрикатор-Цензор поддался на посулы еретиков".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Появление Несущих Слово на Кьяве Гамма — тревожный знак. Еще тревожнее этого — то, как легко Фабрикатор-Цензор поддался на посулы еретиков.
- guid: f27cd349-276d-411c-88ec-8e2c1e4056ce
  event: BNTRS_Chapter2_Heinrix_64
  text: '"Я надеюсь, что их присутствие в Просторе ограничено только тем кораблем. И даже если это так... я уже отправил сообщение Лорд-инквизитору. Ордос выделит ресурсы на исследование проблемы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я надеюсь, что их присутствие в Просторе ограничено только тем кораблем. И даже если это так... я уже отправил сообщение Лорд-инквизитору. Ордос выделит ресурсы на исследование проблемы.
- guid: b8e81367-cb36-40a0-a92f-e29c7522b0ef
  event: BNTRS_Chapter2_Heinrix_71
  text: '"Оправданное решение. Все познания, что прежде охранялись обетами и клятвами, стали в их руках орудием Архиврага. Это измена".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Оправданное решение. Все познания, что прежде охранялись обетами и клятвами, стали в их руках орудием Архиврага. Это измена.
- guid: e63c3abb-b0c8-4b75-9c37-c53bee62abcc
  event: BNTRS_Chapter2_Heinrix_75
  text: '"Стараниями сестры Ардженты Футфол стал немного чище, чем обычно. Уничтожить ячейку культа — достойное свершение".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Стараниями сестры Ардженты Футфол стал немного чище, чем обычно. Уничтожить ячейку культа — достойное свершение.
- guid: 27ce8995-9c7c-4f96-967f-90a6ea5a4cd9
  event: BNTRS_Chapter2_Heinrix_83
  text: '"Ты попалась на старую удочку слуг Хаоса. Еретики часто пытаются смутить разум праведников, когда смерть заглядывает им в лицо. Впрочем, с сестрой Арджентой такой примитивный трюк вряд ли бы прошел".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты попалась на старую удочку слуг Хаоса. Еретики часто пытаются смутить разум праведников, когда смерть заглядывает им в лицо. Впрочем, с сестрой Арджентой такой примитивный трюк вряд ли бы прошел.
- guid: 31b27def-1e29-489b-87af-c3409da1cd8f
  event: BNTRS_Chapter2_Heinrix_90
  text: '"Ссора внутри Дома Навис Нобилите... прискорбная ситуация, которая чревата многочисленными проблемами в будущем".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ссора внутри Дома Навис Нобилите... прискорбная ситуация, которая чревата многочисленными проблемами в будущем.
- guid: 916f1a3b-5314-459f-8a34-70ad5e8b2689
  event: BNTRS_Chapter2_Heinrix_94
  text: '"Вероятно, Лорд-капитан сумел{mf||а} бы справиться с вторжением и без меня. Все же, надеюсь, мое присутствие было полезным династии фон Валанциус".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вероятно, Лорд-капитан сумел бы справиться с вторжением и без меня. Все же, надеюсь, мое присутствие было полезным династии фон Валанциус.
- guid: 67ff5f56-5bd8-4cee-8c30-3c49176e1f03
  event: BNTRS_Chapter2_Heinrix_97
  text: '"Мне казалось, ты должна уже была извлечь урок о том, какова цена излишнего внимания к твоим "шепоткам". Остерегайся тех, кого привыкла считать своими друзьями, Идира".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мне казалось, ты должна уже была извлечь урок о том, какова цена излишнего внимания к твоим "шепоткам". Остерегайся тех, кого привыкла считать своими друзьями, Идира.
- guid: 368f1420-fcf3-4ba3-9244-a7a3316649ad
  event: BNTRS_Chapter3_Heinrix_102
  text: '"Осторожнее в своем преследовании знаний, магос. Ересь проникает в сердца незаметно, порой рядясь в святые одежды".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Осторожнее в своем преследовании знаний, магос. Ересь проникает в сердца незаметно, порой рядясь в святые одежды.
- guid: e55bf1b4-fc24-421e-896b-268baf7a7a67
  event: BNTRS_Chapter3_Heinrix_109
  text: '"Теперь прикончить нас — вопрос престижа. Мы — призовая дичь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Теперь прикончить нас — вопрос престижа. Мы — призовая дичь.
- guid: ead2a8a6-2d9e-4287-a116-181f2190e9c3
  event: BNTRS_Chapter3_Heinrix_119
  text: '"Одинокий Космический волк в недрах Комморры... абсурдная ситуация. Настолько, что у меня начинают возникать вопросы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Одинокий Космический волк в недрах Комморры... абсурдная ситуация. Настолько, что у меня начинают возникать вопросы.
- guid: 8e7adce8-de48-4cb5-9667-a51947757b5c
  event: BNTRS_Chapter3_Heinrix_128
  text: '"Я расформировал его сеть соглядатаев, а самого его отослал выслеживать более легкую цель. Полагаю, он с головой ушел в работу, пытаясь загладить свою вину — неудивительно, что он не показывается без результата".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я расформировал его сеть соглядатаев, а самого его отослал выслеживать более легкую цель. Полагаю, он с головой ушел в работу, пытаясь загладить свою вину — неудивительно, что он не показывается без результата.
- guid: 482c763f-87f5-4c5f-80ad-4454d3f6db57
  event: BNTRS_Chapter3_Heinrix_136
  text: '"Жаль, что мне уже не доведется провести допрос Ирлиэт. Я уверен, что ненавидевшая нас ксенос скрывала многое за своей фальшивой личиной".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Жаль, что мне уже не доведется провести допрос Ирлиэт. Я уверен, что ненавидевшая нас ксенос скрывала многое за своей фальшивой личиной.
- guid: b5bb4302-fe05-4ab0-a235-6df4d8c4569a
  event: BNTRS_Chapter3_Heinrix_14
  text: '"Ахиллеас все же сумел выйти на след Кунрада. После его провала с разгадкой планов ксеносов я не рассчитывал на столь быстрый результат в этом направлении".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ахиллеас все же сумел выйти на след Кунрада. После его провала с разгадкой планов ксеносов я не рассчитывал на столь быстрый результат в этом направлении.
- guid: f4025b96-bb8f-4178-8958-8dd1ded87822
  event: BNTRS_Chapter3_Heinrix_142
  text: '"Еще одно слово — и ты распрощаешься с жизнью, ксенос. Слово Вольного Торговца — вот и все, что сейчас оберегает тебя".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Еще одно слово — и ты распрощаешься с жизнью, ксенос. Слово Вольного Торговца — вот и все, что сейчас оберегает тебя.
- guid: 94440dee-96ba-4d6b-a0e8-17db7b1b7928
  event: BNTRS_Chapter3_Heinrix_20
  text: '"Я не могу отделаться от дурного ощущения, что нам позволили сбежать. Этот "Ноктюрн" вряд ли смог провернуть свою "шалость" в центре Комморры без высокого покровительства".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я не могу отделаться от дурного ощущения, что нам позволили сбежать. Этот "Ноктюрн" вряд ли смог провернуть свою "шалость" в центре Комморры без высокого покровительства.
- guid: adc1da26-f020-4b7c-89e2-2b2a149907e3
  event: BNTRS_Chapter3_Heinrix_33
  text: '"Справедливого расследования и суда Теодора фон Валанциус уже в любом случае не получит. Вердикт может вынести только Вольный Торговец... и он{mf||а} это уже сделал{mf||а}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Справедливого расследования и суда Теодора фон Валанциус уже в любом случае не получит. Вердикт может вынести только Вольный Торговец... и он это уже сделал.
- guid: 51ccd9c1-0ff7-4a09-a300-d043f8ec56cc
  event: BNTRS_Chapter3_Heinrix_46
  text: '"Леди Кассия, не надо так смотреть на меня. Уверяю вас, я в совершенном порядке".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Леди Кассия, не надо так смотреть на меня. Уверяю вас, я в совершенном порядке.
- guid: e09aec74-8f64-4785-896f-dcbb5c561c9a
  event: BNTRS_Chapter3_Heinrix_51
  text: '"Это долгий процесс. Полагаю, такой же долгий, как и возвращение к вашему привычному фальшивому лексикону... шерин Джай".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Это долгий процесс. Полагаю, такой же долгий, как и возвращение к вашему привычному фальшивому лексикону... шерин Джай.
- guid: 87fc27e4-32a0-4da2-a138-61712929d4d2
  event: BNTRS_Chapter3_Heinrix_53
  text: '"Мое истовое желание выжечь изнутри пару сотен ксеносов на пути отсюда оказалось сильнее смерти".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мое истовое желание выжечь изнутри пару сотен ксеносов на пути отсюда оказалось сильнее смерти.
- guid: ab72293f-0b37-4e1d-b582-fc78bec4e423
  event: BNTRS_Chapter3_Heinrix_54
  text: '"Вы сумели бежать от своих пленителей. Сестры битвы — воистину дочери самого Бога-Императора".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы сумели бежать от своих пленителей. Сестры битвы — воистину дочери самого Бога-Императора.
- guid: b546f370-5dba-4dac-9f48-4b334204ecae
  event: BNTRS_Chapter3_Heinrix_56
  text: '"Даже Комморра не смогла заставить вас надолго оставить ваш пост подле Лорд-капитана".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Даже Комморра не смогла заставить вас надолго оставить ваш пост подле Лорд-капитана.
- guid: c34664c1-02b4-45d8-bf02-0bbecc8b3f9c
  event: BNTRS_Chapter3_Heinrix_78
  text: '"Слишком сильные переживания и слишком много амасека, я полагаю".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Слишком сильные переживания и слишком много амасека, я полагаю.
- guid: d1d8af40-2ef0-4376-b8be-3ce95052f15a
  event: BNTRS_Chapter3_Heinrix_88
  text: '"Слишком быстро. Слишком легко. Ксенос унес в могилу слишком много знаний. И ушел... непростительно просто".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Слишком быстро. Слишком легко. Ксенос унес в могилу слишком много знаний. И ушел... непростительно просто.
- guid: 6d5f7de2-d6e5-466f-bb15-7454c70dea25
  event: BNTRS_Chapter3_Heinrix_94
  text: '"Да я... тебя... проклятье, я от ярости дар речи потерял. Довольно. Я разберусь с тобой позже".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Да я... тебя... проклятье, я от ярости дар речи потерял. Довольно. Я разберусь с тобой позже.
- guid: d8db3d1d-10c6-4184-9400-6681f41402f5
  event: BNTRS_Chapter4_Heinrix_04
  text: '"Не думаю, что эльдары на Кетца Темере были последними выжившими с мира-корабля. Тем не менее, их уничтожение — важный шаг в очищении Простора от этой напасти".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не думаю, что эльдары на Кетца Темере были последними выжившими с мира-корабля. Тем не менее, их уничтожение — важный шаг в очищении Простора от этой напасти.
- guid: d78760aa-665b-4dc4-ad3c-93d8eeb84883
  event: BNTRS_Chapter4_Heinrix_101
  text: '"Ростки скверны могут скрываться где угодно, сестра. Ваша священная миссия не закончится никогда — впрочем, думаю, вам это известно и без меня".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ростки скверны могут скрываться где угодно, сестра. Ваша священная миссия не закончится никогда — впрочем, думаю, вам это известно и без меня.
- guid: 4f1cb528-d13d-4285-bec9-40cba0514ed9
  event: BNTRS_Chapter4_Heinrix_106
  text: '"Эксперименты Тисифоны переступили порог ереси. Если бы не особые привилегии Навис Нобилите, ваш Дом был бы давно низвергнут и уничтожен. Хочется верить, что в будущем Орселлио ждут более... приемлемые способы укрепления власти".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Эксперименты Тисифоны переступили порог ереси. Если бы не особые привилегии Навис Нобилите, ваш Дом был бы давно низвергнут и уничтожен. Хочется верить, что в будущем Орселлио ждут более... приемлемые способы укрепления власти.
- guid: 2864f858-c4ce-445c-a8c2-30240ac60388
  event: BNTRS_Chapter4_Heinrix_115
  text: '"Когда придет время, Идира. Когда придет время".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Когда придет время, Идира. Когда придет время.
- guid: cf4f47b4-128a-4b89-83de-b917b9543374
  event: BNTRS_Chapter4_Heinrix_116
  text: '"Утрата саванта — тяжелый удар для круга Лорд-инквизитора. Найти замену Эмелине будет тяжело".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Утрата саванта — тяжелый удар для круга Лорд-инквизитора. Найти замену Эмелине будет тяжело.
- guid: 0347ec6a-50a1-4856-89eb-06077539c62c
  event: BNTRS_Chapter4_Heinrix_119
  text: '"Система Фтона потеряна для Человечества. Нет средств, способных остановить то, что было начато руками Эмелины".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Система Фтона потеряна для Человечества. Нет средств, способных остановить то, что было начато руками Эмелины.
- guid: fee9f473-490e-4604-8851-2ad4d4e1e419
  event: BNTRS_Chapter4_Heinrix_13
  text: '"Оставлять аколитов в неведении касательно всех планов — резонная тактика. Только это сдерживает мое изумление действиями Лорд-инквизитора".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Оставлять аколитов в неведении касательно всех планов — резонная тактика. Только это сдерживает мое изумление действиями Лорд-инквизитора.
- guid: 8e8d42f3-f5e8-4630-84fa-33442e346f6b
  event: BNTRS_Chapter4_Heinrix_132
  text: '"Разделяю их глубокое непонимание".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Разделяю их глубокое непонимание.
- guid: 96635ac2-1105-4919-80ee-0871737a5d09
  event: BNTRS_Chapter4_Heinrix_137
  text: '"Магос, вы... уверены в том, что этот Номос не является анафемой, подлежащей немедленному уничтожению? Создание из когитатора, обуявшее мобильную машину... только ваше одобрение удерживает меня от поспешных действий".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Магос, вы... уверены в том, что этот Номос не является анафемой, подлежащей немедленному уничтожению? Создание из когитатора, обуявшее мобильную машину... только ваше одобрение удерживает меня от поспешных действий.
- guid: fcb4a306-88c0-4345-ad54-b3aef0d5fb13
  event: BNTRS_Chapter4_Heinrix_145
  text: '"Я верно понимаю, что вы решили открыто выступить против догматов Механикус? Призываете к ереси?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я верно понимаю, что вы решили открыто выступить против догматов Механикус? Призываете к ереси?
- guid: 00f48e9c-2fc7-4b9c-8f4f-d1b57fd9b7f6
  event: BNTRS_Chapter4_Heinrix_23
  text: '"Если у меня возникнет хотя бы одно подозрение, что ты права, я первым делом проверю, можно ли умереть в реальном мире, перерезав себе глотку в грезе".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Если у меня возникнет хотя бы одно подозрение, что ты права, я первым делом проверю, можно ли умереть в реальном мире, перерезав себе глотку в грезе.
- guid: 41e0979c-7650-4203-81c1-8b0083acb84e
  event: BNTRS_Chapter4_Heinrix_30
  text: '"Методы Инцендии Чорда позволили ей держать под контролем целый торговый протекторат. Не сомневаюсь, что Футфол окончательно склонится перед ней — рано или поздно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Методы Инцендии Чорда позволили ей держать под контролем целый торговый протекторат. Не сомневаюсь, что Футфол окончательно склонится перед ней — рано или поздно.
- guid: 81895ecc-b16c-4d7c-a8be-985999fe93f1
  event: BNTRS_Chapter4_Heinrix_37
  text: '"У Лорд-инквизитора должны были быть очень хорошие причины, чтобы поставить Чорда во главе Футфола".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: У Лорд-инквизитора должны были быть очень хорошие причины, чтобы поставить Чорда во главе Футфола.
- guid: 7f94b478-0170-4989-814b-7e6e6fef3ffb
  event: BNTRS_Chapter4_Heinrix_46
  text: '"Касбаллика сохранила контроль над Футфолом. Полагаю, всех старых агентов, присматривавших за хладным торгом, можно оставить на своих местах без изменений".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Касбаллика сохранила контроль над Футфолом. Полагаю, всех старых агентов, присматривавших за хладным торгом, можно оставить на своих местах без изменений.
- guid: e1054f55-f26c-4c3a-92c1-52d6a01d1798
  event: BNTRS_Chapter4_Heinrix_51
  text: '"Меня больше удручает присутствие следов людей в том же самом месте. Под пеленой тайны скрывается некий темный союз, который явно страшнее обычной хладной сделки".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Меня больше удручает присутствие следов людей в том же самом месте. Под пеленой тайны скрывается некий темный союз, который явно страшнее обычной хладной сделки.
- guid: a23b18b0-28fe-48e5-a465-19aba984b369
  event: BNTRS_Chapter4_Heinrix_68
  text: '"Я хотел бы думать, что это положит конец обители друкари... но Комморра слишком велика, чтобы даже такой удар стал для нее смертельным".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я хотел бы думать, что это положит конец обители друкари... но Комморра слишком велика, чтобы даже такой удар стал для нее смертельным.
- guid: 942cea8c-120e-403a-8d48-402373a04eaf
  event: BNTRS_Chapter4_Heinrix_70
  text: '"Да, и причина его гибели — династия фон Валанциус. На вашем месте, Абеляр, я бы готовился к затяжной войне двух родов Вольных Торговцев".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Да, и причина его гибели — династия фон Валанциус. На вашем месте, Абеляр, я бы готовился к затяжной войне двух родов Вольных Торговцев.
- guid: 58a6a175-c118-4e5d-b1de-5232f73809ac
  event: BNTRS_Chapter4_Heinrix_79
  text: '"Я бы рекомендовал вам, глубокоуважаемый Ульфар, выбирать впредь выражения. Я не потерплю подобных высказываний в адрес Лорд-инквизитора".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я бы рекомендовал вам, глубокоуважаемый Ульфар, выбирать впредь выражения. Я не потерплю подобных высказываний в адрес Лорд-инквизитора.
- guid: 0d82328e-5b4c-4c74-9170-7a6484923750
  event: BNTRS_Chapter4_Heinrix_85
  text: '"Некоторые ритуалы санкционирования ксеносов предполагают усекновение языка. Я с удовольствием обсужу внедрение этой славной традиции с Вольным Торговцем. При первой же возможности".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Некоторые ритуалы санкционирования ксеносов предполагают усекновение языка. Я с удовольствием обсужу внедрение этой славной традиции с Вольным Торговцем. При первой же возможности.
- guid: 5b8fae84-ec1c-4721-a3e2-9f646560350c
  event: BNTRS_Chapter4_Heinrix_89
  text: '"Войгтвир не оставит в покое ни семью Версериан, ни династию фон Валанциус, пока не будет мертв. Сосредоточьтесь на его поисках и уничтожении — это лучшее, что можно сделать сейчас".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Войгтвир не оставит в покое ни семью Версериан, ни династию фон Валанциус, пока не будет мертв. Сосредоточьтесь на его поисках и уничтожении — это лучшее, что можно сделать сейчас.
- guid: a337a56f-00c0-4323-b7d8-c15c765e1cb7
  event: BNTRS_Chapter5_Heinrix_02
  text: '"Господин Ханейманн, осмелюсь напомнить, мы прибыли сюда по другому делу... А, он уже не слушает".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Господин Ханейманн, осмелюсь напомнить, мы прибыли сюда по другому делу... А, он уже не слушает.
- guid: 94f355ea-1d4d-4a94-86d8-24451f92124a
  event: BNTRS_Chapter5_Heinrix_12
  text: '"Архонт Черного сердца пал... скажи мне, ксенос, нанесет ли это хоть сколько-то значимый урон Комморре?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Архонт Черного сердца пал... скажи мне, ксенос, нанесет ли это хоть сколько-то значимый урон Комморре?
- guid: 6a720a01-94a4-41be-bfd4-2f309717da5e
  event: BNTRS_Chapter5_Heinrix_14
  text: '"Знаю, что ты не питаешь ко мне доверия, Ульфар, но даю слово — информация о том, как пала твоя стая, не будет оглашена. Ваши секреты будут в безопасности".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Знаю, что ты не питаешь ко мне доверия, Ульфар, но даю слово — информация о том, как пала твоя стая, не будет оглашена. Ваши секреты будут в безопасности.
- guid: b1e0b0b1-2a2d-40dc-9870-0e26e6c74fb4
  event: BNTRS_Companion_DLC3_Heinrix_136
  text: '"Столь резкий переход к полемике, генетор, свидетельствует об обуявшем вас бесстрашии. Желаете совет? Отриньте это чувство. Методы Священных Ордосов являются весьма неудачной темой для диспута".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Столь резкий переход к полемике, генетор, свидетельствует об обуявшем вас бесстрашии. Желаете совет? Отриньте это чувство. Методы Священных Ордосов являются весьма неудачной темой для диспута.
- guid: 658290da-070b-4906-9b9e-9ee42cfdf919
  event: BNTRS_Companion_DLC3_Heinrix_142
  text: '"Советовал бы вам, генетор, тщательнее выбирать объекты своих изысканий. Некоторые явления не стоят того, чтобы знать о них больше дозволенного".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Советовал бы вам, генетор, тщательнее выбирать объекты своих изысканий. Некоторые явления не стоят того, чтобы знать о них больше дозволенного.
- guid: 6677987e-9557-447d-b234-6417cea6af7f
  event: BNTRS_Companion_DLC3_Heinrix_29
  text: '"Я навел справки о вашей биографии, генетор, и в ней поразительно много пробелов. В частности, период длиной в полвека до вашего появления в Фурибундусе, будто бы старательно вымаран. Кто вы на самом деле такой, Фебрус?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я навел справки о вашей биографии, генетор, и в ней поразительно много пробелов. В частности, период длиной в полвека до вашего появления в Фурибундусе, будто бы старательно вымаран. Кто вы на самом деле такой, Фебрус?
- guid: 33f8127a-00c1-4c69-9050-a1e8bdb1a995
  event: BNTRS_Companion_DLC3_Heinrix_52
  text: '"Со своей стороны, настоятельно рекомендую более не хранить в лаборатории ничего, что может вызвать у меня желание туда наведаться. Это сбережет душевное здоровье вашего... "коллеги".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Со своей стороны, настоятельно рекомендую более не хранить в лаборатории ничего, что может вызвать у меня желание туда наведаться. Это сбережет душевное здоровье вашего... "коллеги.
- guid: 4978afc0-a49e-49e1-9193-61bec7035203
  event: BNTRS_Companion_DLC3_Heinrix_71
  text: '"Возможно, испробовав методы ксеносов на себе, вы охладите пыл к их изучению. По крайней мере, я буду на это уповать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Возможно, испробовав методы ксеносов на себе, вы охладите пыл к их изучению. По крайней мере, я буду на это уповать.
- guid: 01010b7c-2761-4f91-8afe-fab4ec756f4c
  event: BNTRS_Companion_DLC3_Heinrix_91
  text: '"Вектор вашего любопытства вызывает обеспокоенность, генетор Фебрус. Еще несколько таких вопросов, и я в ответ начну интересоваться сутью ваших изысканий".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вектор вашего любопытства вызывает обеспокоенность, генетор Фебрус. Еще несколько таких вопросов, и я в ответ начну интересоваться сутью ваших изысканий.
- guid: 28685ef9-7846-471b-a26d-7f87936baa05
  event: BNTRS_Companion_DLC3_Heinrix_94
  text: '"Искренне благодарен, но нет. Не могли бы. К несчастью, я слишком многое знаю о вашем подходе к врачеванию".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Искренне благодарен, но нет. Не могли бы. К несчастью, я слишком многое знаю о вашем подходе к врачеванию.
- guid: f9730576-eea9-4497-a7c8-c00b61abd49d
  event: BNTRS_DLC2_Heinrix_07
  text: '"Вы напряглись, проктор. Заметили что-то подозрительное?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы напряглись, проктор. Заметили что-то подозрительное?
- guid: 66f72caa-9f42-409b-b1ab-0757314e31fd
  event: BNTRS_DLC2_Heinrix_132
  text: '"Вы займете пост маршала Простора. Каких перемен стоит ждать после вашего вступления в должность?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы займете пост маршала Простора. Каких перемен стоит ждать после вашего вступления в должность?
- guid: 1c3dcf3e-38c0-4825-9f12-5cf82c62d9a7
  event: BNTRS_DLC2_Heinrix_144
  text: '"Меня не оставляет ощущение, что проктор был не дарован в качестве телохранителя, а приставлен как соглядатай арбитров".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Меня не оставляет ощущение, что проктор был не дарован в качестве телохранителя, а приставлен как соглядатай арбитров.
- guid: 6e9bb452-807f-46a6-b0f0-d75cc5078db6
  event: BNTRS_DLC2_Heinrix_152
  text: '"Уверен, защитники судна были бы в меньшем ужасе от появления крейсера на авгурах, чем от вашего присутствия".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Уверен, защитники судна были бы в меньшем ужасе от появления крейсера на авгурах, чем от вашего присутствия.
- guid: 3e49fd18-b743-4904-bb07-7b92decf6fcd
  event: BNTRS_DLC2_Heinrix_169
  text: '"Исходя из опыта совместных путешествий в свите Вольного Торговца, могу предположить, что сейчас начнутся попытки... обогащения".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Исходя из опыта совместных путешествий в свите Вольного Торговца, могу предположить, что сейчас начнутся попытки... обогащения.
- guid: d8cda858-dafa-4060-86b2-4023cd194c7a
  event: BNTRS_DLC2_Heinrix_190
  text: '"Очень немногие в Империуме могут рассчитывать на привилегию суда. Эти люди в круг избранных не входят".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Очень немногие в Империуме могут рассчитывать на привилегию суда. Эти люди в круг избранных не входят.
- guid: 131fac96-74f9-4b76-9a38-44d7a3e34915
  event: BNTRS_DLC2_Heinrix_244
  text: '"Несмотря на то, как я выгляжу, я способен разобраться с врагами — по крайней мере не хуже искалеченного арбитра. Так что от протекции, пожалуй, откажусь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Несмотря на то, как я выгляжу, я способен разобраться с врагами — по крайней мере не хуже искалеченного арбитра. Так что от протекции, пожалуй, откажусь.
- guid: aacd2b9b-2bb3-46bb-8c8e-36ab444d1f83
  event: BNTRS_DLC2_Heinrix_26
  text: '"Некоторые миссии требуют не только физической силы, но и твердого ума. Я хотел узнать, подойдет ли ваша кандидатура для более сложной службы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Некоторые миссии требуют не только физической силы, но и твердого ума. Я хотел узнать, подойдет ли ваша кандидатура для более сложной службы.
- guid: c882e2b0-c8a5-421f-9d35-c93e0cd45ca2
  event: BNTRS_DLC2_Heinrix_278
  text: '"Не вижу смысла тратить арсенал на уже отработанную цель".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не вижу смысла тратить арсенал на уже отработанную цель.
- guid: 7e6e9d93-428a-4e2a-84cf-3df8085e5f97
  event: BNTRS_DLC2_Heinrix_280
  text: '"Интересная формулировка — "вынужден". Что вас вынуждает, Соломон? Пустопорожнее любопытство или сдающие нервы? Вас не красит ни то, ни другое".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Интересная формулировка — "вынужден". Что вас вынуждает, Соломон? Пустопорожнее любопытство или сдающие нервы? Вас не красит ни то, ни другое.
- guid: 3ec72150-aeed-4d7b-8923-1a3fa463aed2
  event: BNTRS_DLC2_Heinrix_311
  text: '"Примерно. И, на всякий случай, давайте проговорим следующее: ничего из того, что вы увидели, не должно оказаться в отчете маршалу".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: 'Примерно. И, на всякий случай, давайте проговорим следующее: ничего из того, что вы увидели, не должно оказаться в отчете маршалу.'
- guid: 8c1debc7-d01f-4fba-88bc-1b19f8fba77d
  event: BNTRS_DLC2_Heinrix_356
  text: '"Полагаю, исключение было сделано лишь для одного человека — не советую проверять границы дозволенного в свете новой информации".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Полагаю, исключение было сделано лишь для одного человека — не советую проверять границы дозволенного в свете новой информации.
- guid: 1d393b4d-8e80-4c97-99d5-5922deed0d84
  event: BNTRS_DLC2_Heinrix_61
  text: '"Учитывая историю со стражем Летуса, она, вероятно, планировала именно такой исход событий".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Учитывая историю со стражем Летуса, она, вероятно, планировала именно такой исход событий.
- guid: 631043d2-5a0c-432b-8551-d30d32b3cd6b
  event: BNTRS_DLC2_Heinrix_76
  text: '"Боюсь, после вашего празднества у Вольного Торговца многократно вырастут затраты на ремонт судна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Боюсь, после вашего празднества у Вольного Торговца многократно вырастут затраты на ремонт судна.
- guid: 19420dfe-bf94-4725-ae0b-05d9a2d8af2f
  event: BNTRS_DLC2_Heinrix_89
  text: '"Некоторые тайны могут кануть во мрак пустоты на века. Можно считать везением, что этот секрет династии все же был раскрыт".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Некоторые тайны могут кануть во мрак пустоты на века. Можно считать везением, что этот секрет династии все же был раскрыт.
- guid: 88f4ec37-fc99-44dd-8638-922b5482c336
  event: BNTRS_DLC2_Heinrix_94
  text: '"Едва ли процветание людей в интересах ксеноса. Подозреваю, дело в банальном стремлении навязать свое виденье мироустройства".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Едва ли процветание людей в интересах ксеноса. Подозреваю, дело в банальном стремлении навязать свое виденье мироустройства.
- guid: ccd71ff4-e927-4a59-b2d4-b70abfa3f66c
  event: BNTRS_DLC2_Heinrix_98
  text: '"Далеко не все преступники заслуживают привилегию искупления".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Далеко не все преступники заслуживают привилегию искупления.
- guid: b9394c23-42c5-4bd5-b57f-de05b61a2078
  event: BNTRS_DLC3_Heinrix_08
  text: '"Сомневаюсь, что меровцы придают уничтожению местной фауны сакральное значение. Судя по тому, что мне удалось наблюдать, смерть для них это что-то вроде ежедневной рутины".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Сомневаюсь, что меровцы придают уничтожению местной фауны сакральное значение. Судя по тому, что мне удалось наблюдать, смерть для них это что-то вроде ежедневной рутины.
- guid: 1b65f0b2-a0f0-4f03-bd73-76c80187add5
  event: BNTRS_DLC3_Heinrix_10
  text: '"Сигил говорит о том, что этот аколит служил в Ордо Еретикус. Что они тут делали?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Сигил говорит о том, что этот аколит служил в Ордо Еретикус. Что они тут делали?
- guid: e32c850d-2ff5-4fe8-8cd1-c3d517a8fa95
  event: BNTRS_DLC3_Heinrix_114
  text: '"Интересный выбор для состязания. Очень нестандартный для людей, которые считают себя потомками штрафного полка".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Интересный выбор для состязания. Очень нестандартный для людей, которые считают себя потомками штрафного полка.
- guid: 20616768-d845-4d63-ab50-ed7b91412695
  event: BNTRS_DLC3_Heinrix_120
  text: '"Вам стоит привыкнуть к тому, что в Просторе Коронус есть много вещей, о которых неизвестно даже Вольным Торговцам и их свитам".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вам стоит привыкнуть к тому, что в Просторе Коронус есть много вещей, о которых неизвестно даже Вольным Торговцам и их свитам.
- guid: 47a01923-131d-4686-9ec0-0e0b46e82302
  event: BNTRS_DLC3_Heinrix_17
  text: '"Успокойтесь, сенешаль. Я полагаю, что это лишь одна из крайне качественных иллюзий, коих здесь в избытке".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Успокойтесь, сенешаль. Я полагаю, что это лишь одна из крайне качественных иллюзий, коих здесь в избытке.
- guid: 9c23a5b1-7ce9-4d3b-b30d-becfc10bfdae
  event: BNTRS_DLC3_Heinrix_23
  text: '"Правильно ли я понимаю ситуацию: ксеносы спокойно проникли на одну из важнейших планет протектората фон Валанциус, чтобы забрать оттуда останки малатека, и никто этого даже не заметил?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: 'Правильно ли я понимаю ситуацию: ксеносы спокойно проникли на одну из важнейших планет протектората фон Валанциус, чтобы забрать оттуда останки малатека, и никто этого даже не заметил?'
- guid: 1dfd853e-1e7a-41b8-b681-966a6ae1eb52
  event: BNTRS_DLC3_Heinrix_31
  text: '"Вероятно, он достаточно уверен в собственной безнаказанности, чтобы не воспринимать Вольных Торговцев Простора Коронус как угрозу. Не могу понять, опрометчивость это, или признак крайнего могущества".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вероятно, он достаточно уверен в собственной безнаказанности, чтобы не воспринимать Вольных Торговцев Простора Коронус как угрозу. Не могу понять, опрометчивость это, или признак крайнего могущества.
- guid: f8db1c9a-696e-48f3-8375-a043f3f6bb4b
  event: BNTRS_DLC3_Heinrix_38
  text: '"Место, где сгинула легенда рода Вольных Торговцев… почему меня не удивляет, что именно отсюда по миру начала расползаться ксеноересь?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Место, где сгинула легенда рода Вольных Торговцев… почему меня не удивляет, что именно отсюда по миру начала расползаться ксеноересь?
- guid: 501041c9-21a0-418c-b75b-4dd796455ba4
  event: BNTRS_DLC3_Heinrix_39
  text: '"Хм... на постаментах нет ничего с истоками в Империуме. Подборка ксеноотродий, впрочем, поразительна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Хм... на постаментах нет ничего с истоками в Империуме. Подборка ксеноотродий, впрочем, поразительна.
- guid: d8161e03-6d41-4001-8eb2-72e8276699f5
  event: BNTRS_DLC3_Heinrix_47
  text: '"Я... не уверен, что кто-то из присутствующих сможет хоть как-то прокомментировать ваше, несомненно, мудрое высказывание".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я... не уверен, что кто-то из присутствующих сможет хоть как-то прокомментировать ваше, несомненно, мудрое высказывание.
- guid: f7b0f59e-6b33-4a95-b9cd-db99137b0cf2
  event: BNTRS_DLC3_Heinrix_54
  text: '"Идира права. Имматериум здесь... словно приглушен. И, надо полагать, источник этого внезапного безмолвия отнюдь не свят".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Идира права. Имматериум здесь... словно приглушен. И, надо полагать, источник этого внезапного безмолвия отнюдь не свят.
- guid: ab31deeb-1e5e-4b0f-8fca-ff57be2298c7
  event: BNTRS_DLC3_Heinrix_66
  text: '"Скрепите сердце, Леди Орселлио. Долг часто принуждает нас смотреть в бездну".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Скрепите сердце, Леди Орселлио. Долг часто принуждает нас смотреть в бездну.
- guid: 542f068a-9302-429a-bf84-3ac48bad40e1
  event: BNTRS_DLC3_Heinrix_84
  text: '"Сомневаюсь, что Сектор Бионика сумеет покрыть потребности всех и каждого в составе экипажа целого пустотного судна. Если бы это было целью Вольного Торговца, подобных отсеков понадобилось бы еще на полпалубы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Сомневаюсь, что Сектор Бионика сумеет покрыть потребности всех и каждого в составе экипажа целого пустотного судна. Если бы это было целью Вольного Торговца, подобных отсеков понадобилось бы еще на полпалубы.
- guid: d0af4421-15c5-4b94-8404-fda285b2ea4e
  event: BNTRS_DLC3_Heinrix_91
  text: '"Ничего не могу сказать. Но предложил бы не торопиться с выводами".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ничего не могу сказать. Но предложил бы не торопиться с выводами.
- guid: 28caa5e5-0871-407a-a523-57a1b0bac753
  event: BNTRS_DLC3_Heinrix_95
  text: '"Артизан Декабалус слишком ловко обращается со словами. Я бы не рекомендовал включаться в события на его стороне, не раскрыв полной подоплеки произошедшего".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Артизан Декабалус слишком ловко обращается со словами. Я бы не рекомендовал включаться в события на его стороне, не раскрыв полной подоплеки произошедшего.
- guid: 560b5131-6022-4aff-9cc7-859439e9357b
  event: BNTRS_DLC3_Heinrix_99
  text: '"Если ваш вердикт, магос, не расходится с действительностью, наилучшим исходом будет полная остановка использования мощностей платформы. Кто знает, как еретические эксперименты повлияли на свойства поставляемого прометия. Лично я предпочел бы не проверять".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Если ваш вердикт, магос, не расходится с действительностью, наилучшим исходом будет полная остановка использования мощностей платформы. Кто знает, как еретические эксперименты повлияли на свойства поставляемого прометия. Лично я предпочел бы не проверять.
- guid: b98adb3a-ec3b-46da-92fc-343e92506824
  event: BNTRS_PickUps_Heinrix_07
  text: '"Ваши боевые навыки и глубина веры впечатляют. Возможно, однажды вы пожелаете служить Ему на иной стезе..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ваши боевые навыки и глубина веры впечатляют. Возможно, однажды вы пожелаете служить Ему на иной стезе...
- guid: 7f685fe5-2b3e-43d7-8f3f-e7d817cdf33e
  event: BNTRS_PickUps_Heinrix_08
  text: '"Леди Кибелла, а не случалось ли вам демонстрировать особые... способности, недоступные обычным людям? Удивительные прозрения? Способность... влиять на чужой разум?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Леди Кибелла, а не случалось ли вам демонстрировать особые... способности, недоступные обычным людям? Удивительные прозрения? Способность... влиять на чужой разум?
- guid: e09c348f-d244-41ee-8e52-54beecf80352
  event: BNTRS_PickUps_Heinrix_107
  text: '"Флейтист как в воду канул. Скверно, это только подтверждает мои опасения, что с этим музыкантом дело нечисто".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Флейтист как в воду канул. Скверно, это только подтверждает мои опасения, что с этим музыкантом дело нечисто.
- guid: a918a9a1-6c39-4be7-8757-e1eb62fe36b8
  event: BNTRS_PickUps_Heinrix_121
  text: '"Желай они совершить святотатство, здесь все было бы изгажено. Нет, они просто искали тихое местечко. Умные подонки".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Желай они совершить святотатство, здесь все было бы изгажено. Нет, они просто искали тихое местечко. Умные подонки.
- guid: 1594d4ff-13db-4ad2-9981-4266b2e493bf
  event: BNTRS_PickUps_Heinrix_127
  text: '"Не стану перечислять, сколько именно заветов и законов Империума нарушает данное захоронение".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не стану перечислять, сколько именно заветов и законов Империума нарушает данное захоронение.
- guid: 3275fd5a-b4ae-4a15-9ab3-c29cc2889d28
  event: BNTRS_PickUps_Heinrix_128
  text: '"Приятно отметить, что Кровавая паутина не демонстрирует признаков ереси, в отличие от многих других культов смерти".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Приятно отметить, что Кровавая паутина не демонстрирует признаков ереси, в отличие от многих других культов смерти.
- guid: 493915b5-6e5d-44d1-88fc-f4edaccd2d5a
  event: BNTRS_PickUps_Heinrix_159
  text: '"Привилегия говорить что думаешь, не оглядываясь на дипломатию, — дар. Надеюсь, вы цените его".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Привилегия говорить что думаешь, не оглядываясь на дипломатию, — дар. Надеюсь, вы цените его.
- guid: 01910f28-21af-41ac-b0e3-1b7e1b507487
  event: BNTRS_PickUps_Heinrix_164
  text: '"Я бы тоже предпочел сначала восемь часов допрашивать нечисть с применением биомантии. Но надо быть благодарными Императору и за малое".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я бы тоже предпочел сначала восемь часов допрашивать нечисть с применением биомантии. Но надо быть благодарными Императору и за малое.
- guid: d481ab03-e24d-4da8-b8a5-3d3d8a14cc51
  event: BNTRS_PickUps_Heinrix_178
  text: '"Боюсь, мы оба позволили себе смешать долг и чувства. И я не отступлю — полагаю, как и вы".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Боюсь, мы оба позволили себе смешать долг и чувства. И я не отступлю — полагаю, как и вы.
- guid: febf2c98-ed93-4cb4-b90e-75937f8f814c
  event: BNTRS_PickUps_Heinrix_184
  text: '"Дружба — непозволительная роскошь для людей его положения и желанная уязвимость для Губительных сил".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Дружба — непозволительная роскошь для людей его положения и желанная уязвимость для Губительных сил.
- guid: 28496164-6d69-4764-bf46-c278ba696479
  event: BNTRS_PickUps_Heinrix_205
  text: '"На этом поле битвы нет крови, нет следов. Советую не поддаваться... кхм... истерии, охватившей нашего почтенного спутника. И молиться Императору".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: На этом поле битвы нет крови, нет следов. Советую не поддаваться... кхм... истерии, охватившей нашего почтенного спутника. И молиться Императору.
- guid: 24b7f6cf-2424-4b46-86af-1d71acef3508
  event: BNTRS_PickUps_Heinrix_233
  text: '"Не беспокойтесь, госпожа Тласс. Не вы одна это видите, не вам одной небезразлична жизнь Лорд-капитана... И не вы одна предприняли меры упреждения".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не беспокойтесь, госпожа Тласс. Не вы одна это видите, не вам одной небезразлична жизнь Лорд-капитана... И не вы одна предприняли меры упреждения.
- guid: dcad6719-1fea-4317-bfe7-a9afe0fd651d
  event: BNTRS_PickUps_Heinrix_24
  text: '"Благодарю. Я не подвергаю сомнению вашу лояльность, но метод выбора жертв, которые вы используете... заставляет меня быть осторожным".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодарю. Я не подвергаю сомнению вашу лояльность, но метод выбора жертв, которые вы используете... заставляет меня быть осторожным.
- guid: 780e0743-3bd9-4447-a514-50035a8534af
  event: BNTRS_PickUps_Heinrix_250
  text: '"Странное сравнение, игнорирующее массу деталей. Впрочем, оно вполне объясняется узостью специализации — и внимания".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Странное сравнение, игнорирующее массу деталей. Впрочем, оно вполне объясняется узостью специализации — и внимания.
- guid: 7b445537-34ce-4be1-b74a-c0d3038dd59c
  event: BNTRS_PickUps_Heinrix_288
  text: '"Не делайте вид, что что-либо смыслите в потерях, госпожа Кибелла. Ваш разум слишком искажен, чтобы быть способным на сопереживание. Вернитесь к своей службе".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не делайте вид, что что-либо смыслите в потерях, госпожа Кибелла. Ваш разум слишком искажен, чтобы быть способным на сопереживание. Вернитесь к своей службе.
- guid: 21b964e7-d70e-4cb6-a0de-adda2c65a832
  event: BNTRS_PickUps_Heinrix_295
  text: '"Ты оставила ее около поста вокс-оператора на мостике. Лучше забери ее, пока офицеру не влетело за распитие на рабочем месте".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты оставила ее около поста вокс-оператора на мостике. Лучше забери ее, пока офицеру не влетело за распитие на рабочем месте.
- guid: ddaafa4e-e246-4774-a35d-24b7a5b59b29
  event: BNTRS_PickUps_Heinrix_56
  text: '"На вашем месте я бы переживал не о кощунстве, а о том, в каких менее святотатственных местах они могут скрываться еще".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: На вашем месте я бы переживал не о кощунстве, а о том, в каких менее святотатственных местах они могут скрываться еще.
- guid: fc8595cb-0471-40f3-8afe-1ad28a845687
  event: BNTRS_PickUps_Heinrix_57
  text: '"Я нахожу подозрительным, что ячейкой генокульта командовал магус. Они занимают высокое место в их иерархии, но не наивысшее... если верить имеющимся у меня донесениям".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я нахожу подозрительным, что ячейкой генокульта командовал магус. Они занимают высокое место в их иерархии, но не наивысшее... если верить имеющимся у меня донесениям.
- guid: e4ff1467-3722-4441-9ea1-d6b44e7698a1
  event: BNTRS_PickUps_Heinrix_65
  text: '"Культы смерти нередко переходят черту. Они опасны... и полезны. Как и всякое оружие".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Культы смерти нередко переходят черту. Они опасны... и полезны. Как и всякое оружие.
- guid: 3b370aea-bf30-4b18-b170-e07645545d2c
  event: BNTRS_PickUps_Heinrix_69
  text: '"Не стоило оставлять в живых родню выродков. Неуместная сентиментальность".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не стоило оставлять в живых родню выродков. Неуместная сентиментальность.
- guid: 04d5b8f1-b991-4b65-b511-5dd56e97ecd2
  event: BNTRS_PickUps_Heinrix_77
  text: '"Сегодня я кое-что узнал о юморе Фенриса".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Сегодня я кое-что узнал о юморе Фенриса.
- guid: 59867898-e300-4353-b6a2-39d830249f29
  event: BNTRS_PickUps_Heinrix_92
  text: '"Скорее мудрость. Умному человеку стоит знать обо всем, что происходит в его доме, даже в темных его уголках".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Скорее мудрость. Умному человеку стоит знать обо всем, что происходит в его доме, даже в темных его уголках.
- guid: 1c8c327d-cc07-4ac8-a282-eac4890750e7
  event: BNTRS_PickUps_Heinrix_94
  text: '"Мятежники вроде него появляются с завидной регулярностью. Если не Немезит, то будет кто-то другой. Они... как плесень".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мятежники вроде него появляются с завидной регулярностью. Если не Немезит, то будет кто-то другой. Они... как плесень.
- guid: f9e72d55-0a6b-4f75-b4e3-14db9f3d3dfb
  event: BNTRS_Reactivity_DLC3_Heinrix_11
  text: '"Не рекомендовал бы вступать ни в какие в дебаты с господином Эоганном. Ни вам, уважаемый магос, ни кому либо еще на этом корабле".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не рекомендовал бы вступать ни в какие в дебаты с господином Эоганном. Ни вам, уважаемый магос, ни кому либо еще на этом корабле.
- guid: da001b01-932d-48c4-980b-2910cdeca5ce
  event: BNTRS_Reactivity_DLC3_Heinrix_18
  text: '"Тревожные слова. Особенно от кого-то с твоей... специализацией".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Тревожные слова. Особенно от кого-то с твоей... специализацией.
- guid: 634f441a-d775-4f62-9147-a43de24b52b7
  event: BNTRS_Reactivity_DLC3_Heinrix_29
  text: '"Опасный вопрос для кого-то, использующего покровительство Вольного Торговца для личной защиты от обвинений в ксеноереси, "шерин"".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Опасный вопрос для кого-то, использующего покровительство Вольного Торговца для личной защиты от обвинений в ксеноереси, "шерин".
- guid: 1f649ec9-a2da-420e-abc3-63053e87d8a1
  event: BNTRS_Reactivity_DLC3_Heinrix_33
  text: '"Не буду скрывать — ксенос, с которым мы имеем дело, не в первый раз появляется в летописях Инквизиции. Это опасный противник. Боюсь, мы даже не способны полноценно оценить, насколько именно опасный".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не буду скрывать — ксенос, с которым мы имеем дело, не в первый раз появляется в летописях Инквизиции. Это опасный противник. Боюсь, мы даже не способны полноценно оценить, насколько именно опасный.
- guid: 4f56b7c9-ac2f-44c2-b5f1-3265b94a9931
  event: BNTRS_Reactivity_DLC3_Heinrix_39
  text: '"Все так, однако я все еще не могу найти ответа на вопрос, почему Караул Смерти вообще присутствуют в Просторе Коронус. Не уверен, что когда-нибудь получу на этот вопрос ответ".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Все так, однако я все еще не могу найти ответа на вопрос, почему Караул Смерти вообще присутствуют в Просторе Коронус. Не уверен, что когда-нибудь получу на этот вопрос ответ.
- guid: 7aa5998d-1e49-4bbd-b29c-b52fe742c091
  event: BNTRS_Reactivity_DLC3_Heinrix_48
  text: '"Я с трудом могу доверять человеку, жизнь в котором поддерживалась на протяжении сотен лет неизвестными ксенотехнологиями. Охладите свой восторг, сенешаль".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я с трудом могу доверять человеку, жизнь в котором поддерживалась на протяжении сотен лет неизвестными ксенотехнологиями. Охладите свой восторг, сенешаль.
- guid: 607d9ee2-c93a-497d-98c9-72166a39a509
  event: BNTRS_Reactivity_DLC3_Heinrix_53
  text: '"Вся ситуация с возвращением Себериана была... проблематичной. Возвращение статуса кво — самое надежное разрешение этой ситуации".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вся ситуация с возвращением Себериана была... проблематичной. Возвращение статуса кво — самое надежное разрешение этой ситуации.
- guid: 186e05b9-5c83-437e-a3db-3e1e72220bab
  event: BNTRS_Reactivity_DLC3_Heinrix_63
  text: '"Поддерживаю эту меру, проктор. Возможно, нам стоит позже обсудить, как усилить меры безопасности — каждый со своей профессиональной стороны".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Поддерживаю эту меру, проктор. Возможно, нам стоит позже обсудить, как усилить меры безопасности — каждый со своей профессиональной стороны.
- guid: 54fc23ea-b8ec-4a9a-9baa-9cccdcfd0c41
  event: BNTRS_Reactivity_Heinrix_17
  text: '"Реверансы, красноречивые взгляды и даже Имморталиум... Давно я не видел, чтобы кто-то следовал в чувствах правилам этикета нобилите. Да еще столь самоотверженно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Реверансы, красноречивые взгляды и даже Имморталиум... Давно я не видел, чтобы кто-то следовал в чувствах правилам этикета нобилите. Да еще столь самоотверженно.
- guid: 6a6c9fef-f0a1-4d56-838a-b28d98c6c49f
  event: BNTRS_Reactivity_Heinrix_24
  text: '"Хейдари, остановись. Можешь думать об этом, если тебе так угодно, а вот селить в чужих головах подобные мысли — уволь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Хейдари, остановись. Можешь думать об этом, если тебе так угодно, а вот селить в чужих головах подобные мысли — уволь.
- guid: fe3bfc02-c440-461e-a4c7-7fb869858fd4
  event: BNTRS_Reactivity_Heinrix_27
  text: '"По крайней мере, этот брак не основан на ненависти, презрении и интригах. Неслыханная роскошь для большинства союзов нобилите".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: По крайней мере, этот брак не основан на ненависти, презрении и интригах. Неслыханная роскошь для большинства союзов нобилите.
- guid: adf69043-1cbe-47cf-92c4-3970cb20ca8c
  event: BNTRS_Reactivity_Heinrix_34
  text: '"Не могу точно сказать, в чем дело, но, сдается мне, я начал привлекать к себе больше напряженного внимания, чем обычно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не могу точно сказать, в чем дело, но, сдается мне, я начал привлекать к себе больше напряженного внимания, чем обычно.
- guid: 9451297e-ac10-4477-8c92-1a2b41b451af
  event: BNTRS_Reactivity_Heinrix_40
  text: '"Первый офицер Версериан. Мне претит сама мысль приказать человеку ваших лет и заслуг заткнуться. Давайте не доводить до ситуации, где я все-таки буду вынужден это сделать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Первый офицер Версериан. Мне претит сама мысль приказать человеку ваших лет и заслуг заткнуться. Давайте не доводить до ситуации, где я все-таки буду вынужден это сделать.
- guid: 87c8be08-6e1d-4f87-a63f-434011df6f51
  event: BNTRS_Reactivity_Heinrix_42
  text: '"Благодарю за вашу доброту, Леди-Навигатор. Возможно... это к лучшему для всех причастных".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодарю за вашу доброту, Леди-Навигатор. Возможно... это к лучшему для всех причастных.
- guid: ed4c5000-7753-4892-87df-25a8f32fc3a2
  event: BNTRS_Reactivity_Heinrix_44
  text: '"Я... в порядке. Немного... устал. Испытания последнего времени могут вымотать кого угодно. Меньше слушай увещевания варпа и сосредоточься на деле".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я... в порядке. Немного... устал. Испытания последнего времени могут вымотать кого угодно. Меньше слушай увещевания варпа и сосредоточься на деле.
- guid: 456c41ec-570a-418b-8412-cb189d586ee2
  event: BNTRS_Reactivity_Heinrix_46
  text: '"Я знаю! Знаю. Нет необходимости указывать мне... и вообще же, сестра, следите лучше за округой, а не за мной".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я знаю! Знаю. Нет необходимости указывать мне... и вообще же, сестра, следите лучше за округой, а не за мной.
- guid: dafedf9a-afa0-4e83-8d29-90a2c4130865
  event: BNTRS_Reactivity_Heinrix_47
  text: '"Абеляр. Давайте вы просто скажете мне то, что собирались сказать — это будет лучше, чем ваше молчаливое и весьма ощутимое осуждение".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Абеляр. Давайте вы просто скажете мне то, что собирались сказать — это будет лучше, чем ваше молчаливое и весьма ощутимое осуждение.
- guid: 6e98646c-00c0-4601-b7f9-d75309d3834e
  event: BNTRS_Reactivity_Heinrix_54
  text: '"Слушаю я вас, Первый офицер Версериан, и задаюсь вопросом: а постель Леди Теодоры вы так же бдительно охраняли?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: 'Слушаю я вас, Первый офицер Версериан, и задаюсь вопросом: а постель Леди Теодоры вы так же бдительно охраняли?'
- guid: 643149b0-8c19-482d-b668-64ce5c2756b9
  event: BNTRS_Reactivity_Heinrix_67
  text: '"Не приближайся к Лорд-капитану, ксенос. И даже не думай выкидывать никаких фортелей. Одно неверное движение, и..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не приближайся к Лорд-капитану, ксенос. И даже не думай выкидывать никаких фортелей. Одно неверное движение, и...
- guid: 1227c4fd-b40b-429a-9637-83dd53791925
  event: BNTRS_Reactivity_Heinrix_72
  text: '"Кхм. По крайней мере, поимей немного совести не вываливать столь бесстыжие предложения в присутствии... нашего "общего".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Кхм. По крайней мере, поимей немного совести не вываливать столь бесстыжие предложения в присутствии... нашего "общего.
- guid: a1b1f1b3-6deb-4fbd-9280-e16a0a4f5a17
  event: BNTRS_Reactivity_Heinrix_89
  text: '"Решила втереться в доверие к Вольному Торговцу? Очаровать? Не выйдет. Я за тобой слежу".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Решила втереться в доверие к Вольному Торговцу? Очаровать? Не выйдет. Я за тобой слежу.
- guid: 45e13ec4-45ad-46bd-8f18-cfff0a2c1f31
  event: BNTRS_Stressful_Heinrix_06
  text: '"Полагаю, вы имеете в виду мою небольшую просьбу, которую я адресовал Вигдис? В таком случае — нет. Не злоупотребляю. И довольно об этом".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Полагаю, вы имеете в виду мою небольшую просьбу, которую я адресовал Вигдис? В таком случае — нет. Не злоупотребляю. И довольно об этом.
- guid: 45805c9c-e6ea-4cc0-8471-bf7bdad5a702
  event: BNTRS_Stressful_Heinrix_116
  text: '"Заставить биоманта испытать приступ тошноты — это достижение, ксенос. Избавь меня от своих... восторгов".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Заставить биоманта испытать приступ тошноты — это достижение, ксенос. Избавь меня от своих... восторгов.
- guid: e1708457-b36a-4d52-b29a-c77a83b2955b
  event: BNTRS_Stressful_Heinrix_130
  text: '"Это ритуалы, принятые среди пилотов Имперских Рыцарей моего мира. Не могу не отметить, с какой дипломатичностью ты высказал подозрение, что я отклоняюсь от догм".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Это ритуалы, принятые среди пилотов Имперских Рыцарей моего мира. Не могу не отметить, с какой дипломатичностью ты высказал подозрение, что я отклоняюсь от догм.
- guid: 27f7c60b-ef09-4db4-a03e-62492511585c
  event: BNTRS_Stressful_Heinrix_136
  text: '"Вынужден отказаться от вашего щедрого предложения, магос. Я предпочитаю служить Золотому Трону с полным комплектом конечностей".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вынужден отказаться от вашего щедрого предложения, магос. Я предпочитаю служить Золотому Трону с полным комплектом конечностей.
- guid: 43d89526-d465-4624-afcc-d6f14fe4fbbf
  event: BNTRS_Stressful_Heinrix_154
  text: '"Благодарю, господин Ульфар, пребываю в добром здравии, чего и вам желаю. Рад, что мы с вами начали ладить".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодарю, господин Ульфар, пребываю в добром здравии, чего и вам желаю. Рад, что мы с вами начали ладить.
- guid: 12bf5b6c-6261-4b76-9935-cdb3eee0e443
  event: BNTRS_Stressful_Heinrix_172
  text: '"Просто делаю свое дело. Ничего личного".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Просто делаю свое дело. Ничего личного.
- guid: f8c4d066-ef96-473c-a335-38ffa61b83ec
  event: BNTRS_Stressful_Heinrix_24
  text: '"Страх — враг долга. Святая Инквизиция не вербует бесстрашных. Но тем, кто не в состоянии побороть свою слабость, она быстро находит замену. Посмертно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Страх — враг долга. Святая Инквизиция не вербует бесстрашных. Но тем, кто не в состоянии побороть свою слабость, она быстро находит замену. Посмертно.
- guid: 9f3b6a47-0577-4676-8b10-c96aa3e6252a
  event: BNTRS_Stressful_Heinrix_42
  text: '"Не сочтите мою осторожность за грубость, Леди Кассия. Обычно это я разгадываю тайные помыслы и чувства людей, а не наоборот".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не сочтите мою осторожность за грубость, Леди Кассия. Обычно это я разгадываю тайные помыслы и чувства людей, а не наоборот.
- guid: 093760fa-da93-4361-84d9-6b7804bef4db
  event: BNTRS_Stressful_Heinrix_55
  text: '"Для палубного офицера вы демонстрируете прекрасную физическую форму, господин Версериан. Полагаю, служба сенешаля весьма требовательна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Для палубного офицера вы демонстрируете прекрасную физическую форму, господин Версериан. Полагаю, служба сенешаля весьма требовательна.
- guid: b14045c0-534b-48e1-a2d3-4706820801fd
  event: BNTRS_Stressful_Heinrix_57
  text: '"Вы отличный боец, сестра, но если позволите — излишне импульсивный".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы отличный боец, сестра, но если позволите — излишне импульсивный.
- guid: 8b6680f3-1b66-4a1e-85da-42ce7056924b
  event: BNTRS_Stressful_Heinrix_59
  text: '"Леди Кассия, вас что-то тревожит?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Леди Кассия, вас что-то тревожит?
- guid: 1145c3e4-6572-4d1f-a18f-150069640d1d
  event: BNTRS_Stressful_Heinrix_61
  text: '"Идира, или прекрати прожигать меня взглядом, или скажи, в чем дело".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Идира, или прекрати прожигать меня взглядом, или скажи, в чем дело.
- guid: f9ef6c55-26cc-475f-aebd-e9b631f5ebae
  event: BNTRS_Stressful_Heinrix_63
  text: '"Госпожа Хейдари, давно планировал спросить — ваши люди еще сотрудничают с Наставниками?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Госпожа Хейдари, давно планировал спросить — ваши люди еще сотрудничают с Наставниками?
- guid: 24c0b02c-dee1-4af8-b595-6dd4ee5d3b2e
  event: BNTRS_Stressful_Heinrix_65
  text: '"Биология ксеносов отлична от человеческой. Хотел бы я иметь возможность на практике изучить, что доставляет наивысшую боль врагам Человечества..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Биология ксеносов отлична от человеческой. Хотел бы я иметь возможность на практике изучить, что доставляет наивысшую боль врагам Человечества...
- guid: a3252699-54e1-495d-917c-7f978f39991a
  event: BNTRS_Stressful_Heinrix_67
  text: '"Когда-то, еще в детстве, я был посвящен в некоторые таинства служения технологиям. У меня до сих пор есть вопросы, на которые вы, магос, могли бы дать ответ..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Когда-то, еще в детстве, я был посвящен в некоторые таинства служения технологиям. У меня до сих пор есть вопросы, на которые вы, магос, могли бы дать ответ...
- guid: 2209343f-aa41-4ebf-83f5-e73406acfa62
  event: BNTRS_Stressful_Heinrix_70
  text: '"Господин Ульфар, не соблаговолите ли..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Господин Ульфар, не соблаговолите ли...
- guid: 06215038-feee-42d4-b430-defcbd0cf7b1
  event: BNTRS_Stressful_Heinrix_71
  text: '"Подозреваю, что сражение бок о бок с людьми вызывает у тебя определенные трудности. Психологические или тактические".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Подозреваю, что сражение бок о бок с людьми вызывает у тебя определенные трудности. Психологические или тактические.
- guid: ea906641-e68e-4c9f-9c5e-42986d402ae3
  event: BNTRS_Stressful_Heinrix_76
  text: '"Профессиональный интерес, ничего более".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Профессиональный интерес, ничего более.
- guid: 6333205b-f64b-4bc7-bcfa-8a71698409cd
  event: BNTRS_Stressful_Heinrix_98
  text: '"Госпожа Хейдари, не уверен, что вы сочтете беседу со мной с глазу на глаз полезной для вас или вашего бизнеса. Приберегите свой шарм и деньги для другого информатора".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Госпожа Хейдари, не уверен, что вы сочтете беседу со мной с глазу на глаз полезной для вас или вашего бизнеса. Приберегите свой шарм и деньги для другого информатора.
- guid: 31b3cb11-1861-419a-a7e1-b7903ba43695
  event: BS_KTCStolenTithe_Heinrix_01
  text: '"Замечу лишь, что ксенотехнологии должны быть уничтожены, а не детально исследованы, Магос Эксплоратор".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Замечу лишь, что ксенотехнологии должны быть уничтожены, а не детально исследованы, Магос Эксплоратор.
- guid: bc980fb4-75c6-44d8-b79a-27c336852eb4
  event: BS_KTCStolenTithe_Heinrix_02
  text: '"Напоминаю, что уничтожение богохульных машинных модификаций — священный долг любого богобоязненного служителя Омниссии. Вы ведь в достаточной мере богобоязненны, генетор Фебрус?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Напоминаю, что уничтожение богохульных машинных модификаций — священный долг любого богобоязненного служителя Омниссии. Вы ведь в достаточной мере богобоязненны, генетор Фебрус?
- guid: 67693478-a153-4684-83d1-0dc899c5dbc9
  event: CH1_HeinrixFirstMeet_01
  text: '"Фон Валанциус... насколько мне известно, династию возглавляет досточтимая Теодора фон Валанциус — обстоятельства изменились?" {n}Хейнрикс внимательно следит за выражением вашего лица.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Фон Валанциус... насколько мне известно, династию возглавляет досточтимая Теодора фон Валанциус — обстоятельства изменились?
  - speaker: narrator
    text_clean: Хейнрикс внимательно следит за выражением вашего лица.
- guid: 49b249a4-599f-40eb-a91d-17d30b039008
  event: CH1_HeinrixFirstMeet_02
  text: '"Склонил к сотрудничеству". {n}Хейнрикс наклоняет голову и, хрустнув шеей, морщится.{/n} "Я способен влиять на живые тела. И нахожу, что дознаваемые куда охотнее делятся информацией, когда их кровь начинает закипать в жилах".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Склонил к сотрудничеству.
  - speaker: narrator
    text_clean: Хейнрикс наклоняет голову и, хрустнув шеей, морщится.
  - speaker: Heinrix van Calox
    text_clean: Я способен влиять на живые тела. И нахожу, что дознаваемые куда охотнее делятся информацией, когда их кровь начинает закипать в жилах.
- guid: d2398621-5b76-48f1-9d3c-bd03059f7927
  event: CH1_HeinrixFirstMeet_04
  text: '"Да". {n}Мужчина чуть отворачивается и прочищает горло. В помещении начинает заметно теплеть.{/n} "Судя по тому, что вы знаете, кто я, и не торопитесь меня прикончить, вы служите {g|Encyclopedia:Emperor}Императору{/g}, а не его врагам. Позвольте представиться — Хейнрикс ван Калокс, дознаватель высокочтимого Ордо Ксенос Инквизиции Императора. С кем имею честь?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Да.
  - speaker: narrator
    text_clean: Мужчина чуть отворачивается и прочищает горло. В помещении начинает заметно теплеть.
  - speaker: Heinrix van Calox
    text_clean: Судя по тому, что вы знаете, кто я, и не торопитесь меня прикончить, вы служите Императору, а не его врагам. Позвольте представиться — Хейнрикс ван Калокс, дознаватель высокочтимого Ордо Ксенос Инквизиции Императора. С кем имею честь?
- guid: 54d44cb7-ab9d-4ca1-a197-1cbea368b2c3
  event: CH1_HeinrixFirstMeet_05
  text: '"И в этом должно нам уподобиться {g|Encyclopedia:Emperor}Ему{/g}". {n}Мужчина кивает вам.{/n} "Приветствую верн{mf|ого|ую} слугу Владыки Человечества. Хейнрикс ван Калокс, дознаватель высокочтимого Ордо Ксенос Инквизиции Императора. С кем имею честь?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: И в этом должно нам уподобиться Ему.
  - speaker: narrator
    text_clean: Мужчина кивает вам.
  - speaker: Heinrix van Calox
    text_clean: Приветствую верного слугу Владыки Человечества. Хейнрикс ван Калокс, дознаватель высокочтимого Ордо Ксенос Инквизиции Императора. С кем имею честь?
- guid: 8ec9bb9c-a41a-431d-b105-6b03f9b581b4
  event: CH1_HeinrixFirstMeet_06
  text: '"Кхм! Смею предположить, Лорд-капитан. Если господин найдет возможность представиться как подобает и развеять наши сомнения..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Кхм! Смею предположить, Лорд-капитан. Если господин найдет возможность представиться как подобает и развеять наши сомнения...
    speaker_override: Abelard Werserian
- guid: 66ce624b-1f25-4465-a687-1f8b9a1709be
  event: CH1_HeinrixFirstMeet_07
  text: '{n}Мужчина переводит взгляд на Абеляра, а затем — опять на вас.{/n} "Сенешаль"? "Лорд-капитан"? Я имею честь разговаривать с {g|Encyclopedia:RogueTrader}Вольным Торговцем{/g}? Позвольте представиться — Хейнрикс ван Калокс, дознаватель Ордо Ксенос Инквизиции {g|Encyclopedia:Emperor}Императора{/g}. Признаться, я озадачен встречей со столь почтенной персоной в таком месте".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Мужчина переводит взгляд на Абеляра, а затем — опять на вас.
  - speaker: Heinrix van Calox
    text_clean: Сенешаль"? "Лорд-капитан"? Я имею честь разговаривать с Вольным Торговцем? Позвольте представиться — Хейнрикс ван Калокс, дознаватель Ордо Ксенос Инквизиции Императора. Признаться, я озадачен встречей со столь почтенной персоной в таком месте.
- guid: 2b9564a4-55e9-44f7-8a70-1920eedc0308
  event: CH1_HeinrixFirstMeet_08
  text: '{n}Мужчина оттягивает угол рта в едкой усмешке.{/n} "{g|Encyclopedia:RogueTrader}Вольный Торговец{/g}... Ваша Светлость, при всем почтении, право на колдовские силы дано мне силой, превосходящей вашу. Позвольте представиться: Хейнрикс ван Калокс, дознаватель Ордо Ксенос Инквизиции Императора, аколит высочайшего Лорд-инквизитора и его же милостью санкционированный {g|Encyclopedia:Psyker}псайкер{/g} на службе Империума. Если мы покончили с представлениями, позвольте со всем почтением поинтересоваться — какие же обстоятельства привели Вольного Торговца в стены этого монастыря, подвергшегося нашествию еретиков?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Мужчина оттягивает угол рта в едкой усмешке.
  - speaker: Heinrix van Calox
    text_clean: 'Вольный Торговец... Ваша Светлость, при всем почтении, право на колдовские силы дано мне силой, превосходящей вашу. Позвольте представиться: Хейнрикс ван Калокс, дознаватель Ордо Ксенос Инквизиции Императора, аколит высочайшего Лорд-инквизитора и его же милостью санкционированный псайкер на службе Империума. Если мы покончили с представлениями, позвольте со всем почтением поинтересоваться — какие же обстоятельства привели Вольного Торговца в стены этого монастыря, подвергшегося нашествию еретиков?'
- guid: 25dfff9a-2478-4704-90e7-484d2c49ffd9
  event: CH1_HeinrixFirstMeet_09
  text: '"Н-не надо меня тут инквизировать! Я под защитой Вольного Торговца!" {n}Идира с мольбой смотрит на вас.{/n}'
  speaker: Idira Tlass
  parts:
  - speaker: Idira Tlass
    text_clean: Н-не надо меня тут инквизировать! Я под защитой Вольного Торговца!
  - speaker: narrator
    text_clean: Идира с мольбой смотрит на вас.
- guid: f5209b78-794d-40bc-aee9-ef9a5da1c8dd
  event: CH1_HeinrixFirstMeet_10
  text: '{n}Хейнрикс суживает глаза.{/n} "Мне знакомо ваше имя... один из наследников Вольного Торговца Теодоры фон Валанциус, верно?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс суживает глаза.
  - speaker: Heinrix van Calox
    text_clean: Мне знакомо ваше имя... один из наследников Вольного Торговца Теодоры фон Валанциус, верно?
- guid: 812871e0-c838-4a36-9282-7407f422b752
  event: CH1_HeinrixFirstMeet_11
  text: '{n}Хейнрикс с видимым усилием отстраняется и отводит взгляд.{/n} "Умение вести светские беседы — не мой конек, признаю. Что привело вас в святилище {g|Encyclopedia:Omnissiah}Омниссии{/g}?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс с видимым усилием отстраняется и отводит взгляд.
  - speaker: Heinrix van Calox
    text_clean: Умение вести светские беседы — не мой конек, признаю. Что привело вас в святилище Омниссии?
- guid: fa44fea7-9b1c-41c3-b34b-5e53e3dac7e3
  event: CH1_HeinrixFirstMeet_12
  text: '"Прискорбная весть... мои соболезнования. И, полагаю, вы и есть наследни{mf|к|ца} священного Торгового Патента и высокого титула {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}. Что ж... что именно привело вас в святилище {g|Encyclopedia:Omnissiah}Омниссии{/g}?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Прискорбная весть... мои соболезнования. И, полагаю, вы и есть наследник священного Торгового Патента и высокого титула Вольного Торговца. Что ж... что именно привело вас в святилище Омниссии?
- guid: 14fec655-4aef-48a3-9dee-12d86ec9b067
  event: CH1_HeinrixFirstMeet_13
  text: '{n}Хейнрикс молча переваривает сказанное вами. Затем хмыкает и изрекает:{/n} "Тогда наша встреча весьма своевременна. Я реквизирую вас и вашу свиту для выполнения моей задачи".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'Хейнрикс молча переваривает сказанное вами. Затем хмыкает и изрекает:'
  - speaker: Heinrix van Calox
    text_clean: Тогда наша встреча весьма своевременна. Я реквизирую вас и вашу свиту для выполнения моей задачи.
- guid: 9a0dda96-c9b4-43f4-a8a5-8d7aec339550
  event: CH1_HeinrixFirstMeet_14
  text: '"Я прибыл на Райкад Минорис с заданием, выполнению которого помешало восстание. Губернатор убежден, что бунт подняла недовольная чернь, однако с самого начала я подозревал, что у истоков находится некто более опасный. Мой визит в монастырь и несколько неторопливых бесед с причастными к восстанию..." {n}Хейнрикс бросает взгляд на труп у своих ног.{/n} "...подтвердили мои опасения".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я прибыл на Райкад Минорис с заданием, выполнению которого помешало восстание. Губернатор убежден, что бунт подняла недовольная чернь, однако с самого начала я подозревал, что у истоков находится некто более опасный. Мой визит в монастырь и несколько неторопливых бесед с причастными к восстанию...
  - speaker: narrator
    text_clean: Хейнрикс бросает взгляд на труп у своих ног.
  - speaker: Heinrix van Calox
    text_clean: '...подтвердили мои опасения.'
- guid: 06956d5c-1361-431e-a8fe-55727dc9b634
  event: CH1_HeinrixFirstMeet_15
  text: '"Восстанием руководит некто под именем Заря. Судя по данным, прямо сейчас глава культистов находится здесь — в святилище древнего реактора. Учитывая проповеди о последнем восходе и особые усилия, предпринятые врагами Человечества по захвату монастыря, их цель — добраться до управляющего контура священного источника энергии и вызвать необратимые процессы. Иначе говоря — взорвать реактор, самостоятельно породив пресловутый "последний восход".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Восстанием руководит некто под именем Заря. Судя по данным, прямо сейчас глава культистов находится здесь — в святилище древнего реактора. Учитывая проповеди о последнем восходе и особые усилия, предпринятые врагами Человечества по захвату монастыря, их цель — добраться до управляющего контура священного источника энергии и вызвать необратимые процессы. Иначе говоря — взорвать реактор, самостоятельно породив пресловутый "последний восход.
