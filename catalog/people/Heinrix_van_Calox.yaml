  event: CH1_HeinrixFirstMeet_28
  text: '"Благодарю вас. К сожалению, люди губернатора оказались не готовы к местным опасностям..." {n}Дознаватель бросает взгляд на обмякшее тело в цветах губернаторской стражи и коротко вздыхает.{/n} "...а мои способности не позволяют извлекать обломки клинков из живота. Я рассчитываю, что свита Вольного Торговца лучше подготовлена к испытаниям, нежели обычные вояки из штаба".'
