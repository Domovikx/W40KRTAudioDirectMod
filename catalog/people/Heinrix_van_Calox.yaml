  event: RMNC_Heinrix_MainEvent_3_07
  text: '{n}Хейнрикс печально усмехается, переставляя одну из фигур на доске.{/n} "То, что и должно было. Прорыв. Осечка. Колдовские силы возобладали над тренировками и дисциплиной. Я сорвался. Я вышел из себя и..."'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс печально усмехается, переставляя одну из фигур на доске.
  - speaker: Heinrix van Calox
    text_clean: То, что и должно было. Прорыв. Осечка. Колдовские силы возобладали над тренировками и дисциплиной. Я сорвался. Я вышел из себя и...
- guid: e17d6ff1-2438-426a-b054-38659a2fcdff
  event: RMNC_Heinrix_MainEvent_3_08
  text: '{n}Он через силу втягивает воздух в легкие.{/n} "Я убил человека. Без намерения, без должной на то причины. Какой-то младший офицер обратился ко мне с какой-то глупостью... я сорвался. И позволил силам возобладать над волей. Он даже не успел закричать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Он через силу втягивает воздух в легкие.
  - speaker: Heinrix van Calox
    text_clean: Я убил человека. Без намерения, без должной на то причины. Какой-то младший офицер обратился ко мне с какой-то глупостью... я сорвался. И позволил силам возобладать над волей. Он даже не успел закричать.
- guid: dc2ec689-9369-4f1d-b2d9-145d6e9cbfb5
  event: RMNC_Heinrix_MainEvent_3_09
  text: '{n}Хейнрикс молчит несколько секунд.{/n} "Когда-то я был приставлен к тебе, чтобы искать в твоих деяниях и словах крупицы ереси... а теперь ты показываешь мне, как быть подлинным имперцем. Хорошо. Мы найдем способ".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс молчит несколько секунд.
  - speaker: Heinrix van Calox
    text_clean: Когда-то я был приставлен к тебе, чтобы искать в твоих деяниях и словах крупицы ереси... а теперь ты показываешь мне, как быть подлинным имперцем. Хорошо. Мы найдем способ.
- guid: f34048f8-c3a4-4123-bcdb-b52638175b4c
  event: RMNC_Heinrix_MainEvent_3_10
  text: '{n}На ваших глазах лед, сковавший ноги дознавателя, начинает расти: он покрывает колени мужчины, оборачивается морозным венцом вокруг ножек кресла и стола.{/n} "Срыв продолжается. Из меня сквозит варп-скверна. Я сдерживаю ее... насколько могу".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'На ваших глазах лед, сковавший ноги дознавателя, начинает расти: он покрывает колени мужчины, оборачивается морозным венцом вокруг ножек кресла и стола.'
  - speaker: Heinrix van Calox
    text_clean: Срыв продолжается. Из меня сквозит варп-скверна. Я сдерживаю ее... насколько могу.
- guid: 62703330-271e-434f-8351-b47f601fd6bc
  event: RMNC_Heinrix_MainEvent_3_11
  text: '"Младший офицер... что за нашивки на нем были?.. Не помню. Час назад или около того. Мне не спалось, и я решил занять себя делом... пошел в место, где в прошлый раз видел отметки..." {n}Хейнрикс сбивается, вновь с сипом втягивая в себя воздух.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Младший офицер... что за нашивки на нем были?.. Не помню. Час назад или около того. Мне не спалось, и я решил занять себя делом... пошел в место, где в прошлый раз видел отметки...
  - speaker: narrator
    text_clean: Хейнрикс сбивается, вновь с сипом втягивая в себя воздух.
- guid: d0a3e0ae-4700-4f38-8f20-cbe266298bd2
  event: RMNC_Heinrix_MainEvent_3_12
  text: '"Не в себе, да... Какой бы ход мы не сделали, он приводит к жертвам. Комморра. Ахиллеас. Эмелина..." {n}Хейнрикс умолкает на несколько секунд.{/n} "Ксавьер. Что он прятал на Ефрате? Что за игры втайне от собственных аколитов?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Не в себе, да... Какой бы ход мы не сделали, он приводит к жертвам. Комморра. Ахиллеас. Эмелина...
  - speaker: narrator
    text_clean: Хейнрикс умолкает на несколько секунд.
  - speaker: Heinrix van Calox
    text_clean: Ксавьер. Что он прятал на Ефрате? Что за игры втайне от собственных аколитов?
- guid: bb86cf90-c830-4ea1-8db0-55cff0ddbc31
  event: RMNC_Heinrix_MainEvent_3_13
  text: '{n}Его голос становится прерывистым, словно дознавателю не хватает воздуха.{/n} "Если бы я был внимательнее, собраннее... но нет. Я отвлекся. Решил, что я... что ты... не помешаем тому, что мне должно исполнять. Моей работе. Но вместо этого... я позволил себе потерять фокус. Ты вытеснила из моего сознания все то, что некогда занимало его без остатка".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Его голос становится прерывистым, словно дознавателю не хватает воздуха.
  - speaker: Heinrix van Calox
    text_clean: Если бы я был внимательнее, собраннее... но нет. Я отвлекся. Решил, что я... что ты... не помешаем тому, что мне должно исполнять. Моей работе. Но вместо этого... я позволил себе потерять фокус. Ты вытеснила из моего сознания все то, что некогда занимало его без остатка.
- guid: 1fdddc19-91e7-4ac8-b6e6-2ac6f8436902
  event: RMNC_Heinrix_MainEvent_3_14
  text: '"Цугцванг, {name}. Каждый... следующий... ход делает положение все хуже. И для меня... и для тех, кого я должен оберегать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Цугцванг, КЭП. Каждый... следующий... ход делает положение все хуже. И для меня... и для тех, кого я должен оберегать.
- guid: dfdc5c0d-1730-40c6-a727-178314221aaf
  event: RMNC_Heinrix_MainEvent_3_15
  text: '{n}Хейнрикс хрипло смеется.{/n} "Сейчас, минуту. Дай мне только обнять тебя..." {n}Он протягивает все еще холодные руки и прижимает вас к себе.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс хрипло смеется.
  - speaker: Heinrix van Calox
    text_clean: Сейчас, минуту. Дай мне только обнять тебя...
  - speaker: narrator
    text_clean: Он протягивает все еще холодные руки и прижимает вас к себе.
- guid: 5b8bf8a3-df85-4ac5-85b0-2b2e19ca84d2
  event: RMNC_Heinrix_MainEvent_3_16
  text: '{n}Хейнрикс притягивает вас к себе. Его руки все еще холодные, а тело трясет от мелкой дрожи.{/n} "Рядом. Мы рядом. Это все, что мне нужно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс притягивает вас к себе. Его руки все еще холодные, а тело трясет от мелкой дрожи.
  - speaker: Heinrix van Calox
    text_clean: Рядом. Мы рядом. Это все, что мне нужно.
- guid: 2ddea4f0-db09-439e-b3d8-67bf10a52f90
  event: RMNC_Heinrix_MainEvent_3_17
  text: '{n}Хейнрикс хрипло смеется, притягивая вас к себе.{/n} "Перестань. Иди ко мне".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс хрипло смеется, притягивая вас к себе.
  - speaker: Heinrix van Calox
    text_clean: Перестань. Иди ко мне.
- guid: 7fab7675-fe77-4973-b181-727c269c1ca6
  event: RMNC_Heinrix_MainEvent_3_18
  text: '"Закончить... начатое... да... остановить..." {n}Голос Хейнрикса становится слабее. Лед ползет по его телу, охватывая его целиком, сковывая его грудь, плечи, руки... с хриплым вздохом дознаватель замирает навсегда — с остекленевшим взглядом в пустоту и легкой, почти счастливой улыбкой на лице.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Закончить... начатое... да... остановить...
  - speaker: narrator
    text_clean: Голос Хейнрикса становится слабее. Лед ползет по его телу, охватывая его целиком, сковывая его грудь, плечи, руки... с хриплым вздохом дознаватель замирает навсегда — с остекленевшим взглядом в пустоту и легкой, почти счастливой улыбкой на лице.
- guid: 30bc64ea-0ec0-400c-abc5-d1a02ba7ae4b
  event: RMNC_Heinrix_MainEvent_3_19
  text: '"Нет. Нет, постой. Я в порядке. Относительно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Нет. Нет, постой. Я в порядке. Относительно.
- guid: daae0ee4-4493-4667-a219-710270564c53
  event: RMNC_Heinrix_MainEvent_3_20
  text: '"У меня крутятся твои слова в голове... о выборе, о долге, о том, что делать со своей жизнью. Считай это слабостью или духовным пороком, но я..." {n}Хейнрикс медлит, ему с трудом даются слова.{/n} "Я не хочу променять тот недолгий век, что мне остался, на служение тем, кто разменивает наши жизни как монету".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: У меня крутятся твои слова в голове... о выборе, о долге, о том, что делать со своей жизнью. Считай это слабостью или духовным пороком, но я...
  - speaker: narrator
    text_clean: Хейнрикс медлит, ему с трудом даются слова.
  - speaker: Heinrix van Calox
    text_clean: Я не хочу променять тот недолгий век, что мне остался, на служение тем, кто разменивает наши жизни как монету.
- guid: 995a9c84-ae47-46c7-b18d-ad85c3d2adcf
  event: RMNC_Heinrix_MainEvent_3_21
  text: '{n}Проходит, кажется, целая вечность. Внезапно вы понимаете — воздух больше не обжигает легкие, а тело под вашими руками становится податливее, словно застывшая кровь вновь начала течь по жилам. Вы слышите прерывистый, измученный вздох:{/n} "{name}? Что... произошло?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: 'Проходит, кажется, целая вечность. Внезапно вы понимаете — воздух больше не обжигает легкие, а тело под вашими руками становится податливее, словно застывшая кровь вновь начала течь по жилам. Вы слышите прерывистый, измученный вздох:'
  - speaker: Heinrix van Calox
    text_clean: КЭП? Что... произошло?
- guid: 23bf46ba-42d6-4b6c-b651-fe4219f6ce95
  event: RMNC_Heinrix_MainEvent_3_22
  text: '{n}Хейнрикс берет вас за руки.{/n} "Я не знал, что такое счастье, пока не обнял тебя в первый раз. Любой из нас может умереть в любой момент... и я не хочу провести время до этого момента в разлуке с тобой. Я оставляю Инквизицию. Я присягаю на вечную верность тебе, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс берет вас за руки.
  - speaker: Heinrix van Calox
    text_clean: Я не знал, что такое счастье, пока не обнял тебя в первый раз. Любой из нас может умереть в любой момент... и я не хочу провести время до этого момента в разлуке с тобой. Я оставляю Инквизицию. Я присягаю на вечную верность тебе, КЭП.
- guid: b905b0c2-9310-43f4-b91e-f710cd5b0500
  event: RMNC_Heinrix_StratingEvent_01
  text: '"Вольный Торговец". {n}Дознаватель слегка кланяется.{/n} "Я был несколько резок при первой встрече и хотел бы загладить вину, выразив благодарность за вашу помощь в электродинамической обители. Ваше появление было как нельзя своевременным".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вольный Торговец.
  - speaker: narrator
    text_clean: Дознаватель слегка кланяется.
  - speaker: Heinrix van Calox
    text_clean: Я был несколько резок при первой встрече и хотел бы загладить вину, выразив благодарность за вашу помощь в электродинамической обители. Ваше появление было как нельзя своевременным.
- guid: b21227a0-ec55-4e6b-aba9-daefdce7e899
  event: RMNC_Heinrix_StratingEvent_02
  text: '"Благодаря вам я сумел найти то, ради чего и прибыл в эту систему. Теперь, когда орудие скверны изъято у культа, я могу выполнить пожелание Лорд-инквизитора и отправиться вместе с вами на Футфол — когда вы закончите свои дела на Райкаде".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодаря вам я сумел найти то, ради чего и прибыл в эту систему. Теперь, когда орудие скверны изъято у культа, я могу выполнить пожелание Лорд-инквизитора и отправиться вместе с вами на Футфол — когда вы закончите свои дела на Райкаде.
- guid: cb9e5b7c-db68-403e-af8c-dc54954360bf
  event: RMNC_Heinrix_StratingEvent_03
  text: '"К сожалению, мое личное расследование зашло в тупик. Полагаю, придется задействовать сторонние ресурсы, чтобы продолжить поиски..." {n}Хейнрикс на глазах мрачнеет.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: К сожалению, мое личное расследование зашло в тупик. Полагаю, придется задействовать сторонние ресурсы, чтобы продолжить поиски...
  - speaker: narrator
    text_clean: Хейнрикс на глазах мрачнеет.
- guid: 0b503c04-7988-421f-8b17-58cd25fc42de
  event: RMNC_Heinrix_StratingEvent_04
  text: '"Это не..." {n}Хейнрикс с заметным усилием переводит дух и продолжает спокойнее.{/n} "Это не подарок, Лорд-капитан. Это редкое и ценное устройство, которое станет полезным инструментом в руках Вольного Торговца".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Это не...
  - speaker: narrator
    text_clean: Хейнрикс с заметным усилием переводит дух и продолжает спокойнее.
  - speaker: Heinrix van Calox
    text_clean: Это не подарок, Лорд-капитан. Это редкое и ценное устройство, которое станет полезным инструментом в руках Вольного Торговца.
- guid: 3cb284cc-d8e5-4e79-836d-26df09589203
  event: RMNC_Heinrix_StratingEvent_05
  text: '"Отнюдь. Толкователь — столь редкое и сложное творение Омниссии, что ни я, ни мои коллеги не посмели бы нарушить его целостность. Если желаете, передайте его своим техножрецам — пускай они удостоверятся, что никаких подслушивающих устройств в нем не находится".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Отнюдь. Толкователь — столь редкое и сложное творение Омниссии, что ни я, ни мои коллеги не посмели бы нарушить его целостность. Если желаете, передайте его своим техножрецам — пускай они удостоверятся, что никаких подслушивающих устройств в нем не находится.
- guid: a40a375f-51c5-437d-8f59-884a6f97b755
  event: RMNC_Heinrix_StratingEvent_06
  text: '"Премного благодарен." {n}Дознаватель отстраняется, все еще не сводя с вас взгляда — притворная покладистость ваших слов явно его не обманула.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Премного благодарен.
  - speaker: narrator
    text_clean: Дознаватель отстраняется, все еще не сводя с вас взгляда — притворная покладистость ваших слов явно его не обманула.
- guid: 6931df90-e731-447a-b027-2078582f17ab
  event: RMNC_Heinrix_StratingEvent_07
  text: '{n}Хейнрикс задирает одну бровь.{/n} "Вы находите мою заботу о вашей репутации забавной? Напрасно. Весьма напрасно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс задирает одну бровь.
  - speaker: Heinrix van Calox
    text_clean: Вы находите мою заботу о вашей репутации забавной? Напрасно. Весьма напрасно.
- guid: 2f7a6a51-b8d9-4ba5-a9e1-3d37aa072778
  event: RMNC_Heinrix_StratingEvent_08
  text: '{n}Глаза дознавателя вспыхивают при виде обломка. Он протягивает руку и берет оружие, при этом едва заметно морщась.{/n} "Да. Да, ошибки быть не может. Сколь мощное орудие разрушения..." {n}Хейнрикс поднимает на вас взгляд.{/n} "Почему вы решили расстаться с ним сейчас?"'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Глаза дознавателя вспыхивают при виде обломка. Он протягивает руку и берет оружие, при этом едва заметно морщась.
  - speaker: Heinrix van Calox
    text_clean: Да. Да, ошибки быть не может. Сколь мощное орудие разрушения...
  - speaker: narrator
    text_clean: Хейнрикс поднимает на вас взгляд.
  - speaker: Heinrix van Calox
    text_clean: Почему вы решили расстаться с ним сейчас?
- guid: 465c7c62-73a4-46d2-815b-98a8c4461441
  event: RMNC_Heinrix_StratingEvent_09
  text: '"Что?!" {n}Хейнрикс порывисто выдыхает, а затем сжимает переносицу двумя пальцами.{/n} "Что ж. Что ж. По крайней мере, объект скверны... если это действительно был он... уничтожен. Это удовлетворительный результат".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Что?!
  - speaker: narrator
    text_clean: Хейнрикс порывисто выдыхает, а затем сжимает переносицу двумя пальцами.
  - speaker: Heinrix van Calox
    text_clean: Что ж. Что ж. По крайней мере, объект скверны... если это действительно был он... уничтожен. Это удовлетворительный результат.
- guid: 081b1ffe-1f96-46f6-bfd2-d5e76986fad3
  event: RMNC_Heinrix_StratingEvent_10
  text: '"Мои миссии не всегда заканчиваются удачей. Увы". {n}Хейнрикс буравит вас взглядом еще несколько секунд, а затем отводит его.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Мои миссии не всегда заканчиваются удачей. Увы.
  - speaker: narrator
    text_clean: Хейнрикс буравит вас взглядом еще несколько секунд, а затем отводит его.
- guid: c1115eac-2fd4-4a0d-b645-6b040431f0f1
  event: RMNC_Heinrix_StratingEvent_11
  text: '"Хм. Полагаю, он может иметь отношение к объекту моих поисков. Благодарю вас, {name} — я изучу его позже".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Хм. Полагаю, он может иметь отношение к объекту моих поисков. Благодарю вас, КЭП — я изучу его позже.
- guid: b77eb21d-a730-4a97-a4ab-aace4f3acbfe
  event: RMNC_Heinrix_StratingEvent_12
  text: '"Почему же — именно для этого. И, полагаю, я уже занял у вас достаточно времени". {n}Хейнрикс несколько торопливо одергивает камзол.{/n} "В других обстоятельствах я бы и попросил о более обстоятельной беседе, однако вас ждут ваши дела".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Почему же — именно для этого. И, полагаю, я уже занял у вас достаточно времени.
  - speaker: narrator
    text_clean: Хейнрикс несколько торопливо одергивает камзол.
  - speaker: Heinrix van Calox
    text_clean: В других обстоятельствах я бы и попросил о более обстоятельной беседе, однако вас ждут ваши дела.
- guid: f577dc95-3f8f-4b6f-bb8c-406c42e38a60
  event: RMNC_Heinrix_StratingEvent_13
  text: '"Вы весьма прозорливы, {name}. Подобные вещи, попав в руки смертных, нередко делают их своими рабами. Я рад, что вы избежали этой участи".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы весьма прозорливы, КЭП. Подобные вещи, попав в руки смертных, нередко делают их своими рабами. Я рад, что вы избежали этой участи.
- guid: cf2a59d5-6f72-4f38-855a-a37cc4bf9fb7
  event: RMNC_Heinrix_StratingEvent_14
  text: '"Вы совершенно правы, {name}. Надеюсь, вы и в будущем будете сохранять подобное благоразумие".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Вы совершенно правы, КЭП. Надеюсь, вы и в будущем будете сохранять подобное благоразумие.
- guid: 862e486c-25a6-4db7-a00c-9797bfe9af0d
  event: RMNC_Heinrix_StratingEvent_15
  text: '"Еще кое-что. Когда-то Лорд-инквизитор передал мне этот предмет, явно рассчитывая, что я имею больше шансов оказаться на этом судне раньше его." {n}Хейнрикс извлекает на свет небольшой прибор, завернутый в бархатную ткань.{/n} "Я должен был вручить это устройство Леди Теодоре, однако в сложившихся обстоятельствах считаю необходимым предоставить его вам. Это Толкователь — священная машина, способная переводить языки отдаленных и утраченных миров на низкий готик. В определенной мере он справляется даже с ксеносскими языками — не без огрехов, но достаточно сносно".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Еще кое-что. Когда-то Лорд-инквизитор передал мне этот предмет, явно рассчитывая, что я имею больше шансов оказаться на этом судне раньше его.
  - speaker: narrator
    text_clean: Хейнрикс извлекает на свет небольшой прибор, завернутый в бархатную ткань.
  - speaker: Heinrix van Calox
    text_clean: Я должен был вручить это устройство Леди Теодоре, однако в сложившихся обстоятельствах считаю необходимым предоставить его вам. Это Толкователь — священная машина, способная переводить языки отдаленных и утраченных миров на низкий готик. В определенной мере он справляется даже с ксеносскими языками — не без огрехов, но достаточно сносно.
- guid: 8d3c58d0-286c-429f-b9c2-d12cc0c67584
  event: RMNC_Heinrix_StratingEvent_16
  text: '"Я... могу вас понять, Лорд-капитан. К сожалению, обычно откровенности я добиваюсь чем-то большим, чем цивилизованной беседой".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я... могу вас понять, Лорд-капитан. К сожалению, обычно откровенности я добиваюсь чем-то большим, чем цивилизованной беседой.
- guid: 5df0cee0-8505-4e68-afc4-725fabadfb99
  event: RMNC_Heinrix_StratingEvent_17
  text: '{n}Хейнрикс позволяет себе сдержанную улыбку.{/n} "Во избежание неловкой ситуации я сочту, что вы просто исполнили свой долг перед Святой Инквизицией".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс позволяет себе сдержанную улыбку.
  - speaker: Heinrix van Calox
    text_clean: Во избежание неловкой ситуации я сочту, что вы просто исполнили свой долг перед Святой Инквизицией.
- guid: c56d638b-8793-4ee0-b588-27ee1f63acb5
  event: RMNC_Heinrix_StratingEvent_18
  text: '"Возможно, я плохо изучил биографию ваших предшественников — в основном мой взгляд цеплялся за упоминания великих завоеваний и открытия новых миров, а не отметки о специфическом нраве вашей родословной".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Возможно, я плохо изучил биографию ваших предшественников — в основном мой взгляд цеплялся за упоминания великих завоеваний и открытия новых миров, а не отметки о специфическом нраве вашей родословной.
- guid: 551d7291-1509-49af-bc82-d4524e0fa254
  event: RMNC_Heinrix_StratingEvent_19
  text: '"После многих лет службы в Святом Ордосе мне привычно, что ко мне относятся с настороженностью".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: После многих лет службы в Святом Ордосе мне привычно, что ко мне относятся с настороженностью.
- guid: 65390e46-d1ac-40e3-b4f4-0eb9c52350ba
  event: RMNC_Heinrix_StratingEvent_20
  text: '"Все зависит от электромонахов, что пережили нападение. На их счастье культисты не успели серьезно осквернить святыни — в том числе и благодаря усилиям братства. Тем не менее, не удивлюсь, если местный Эксплораторский флот, узнав о событиях, захочет нанести визит с целью ревизии и очищения пострадавших корпусов".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Все зависит от электромонахов, что пережили нападение. На их счастье культисты не успели серьезно осквернить святыни — в том числе и благодаря усилиям братства. Тем не менее, не удивлюсь, если местный Эксплораторский флот, узнав о событиях, захочет нанести визит с целью ревизии и очищения пострадавших корпусов.
- guid: a088933e-4c18-4aec-a12b-5d2a337e9221
  event: RMNC_Heinrix_StratingEvent_22
  text: '"Заранее простите меня, если я нарушу какой-то протокол подобающего общения со столь значимой персоной, как ваша. Думаю, легкое волнение допустимо для тех, кого Лорд-капитан принимает в своем кабинете лично".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Заранее простите меня, если я нарушу какой-то протокол подобающего общения со столь значимой персоной, как ваша. Думаю, легкое волнение допустимо для тех, кого Лорд-капитан принимает в своем кабинете лично.
- guid: 57a47b43-9fc1-4fd8-b72e-7d17af5b1dd4
  event: RMNC_Heinrix_StratingEvent_23
  text: '"Я хотел бы оказать вам поддержку в решении ваших непосредственных проблем. Насколько мне известно, судно понесло существенные потери во время недавнего бунта и пострадало от действий культистов, вдобавок вы потеряли множество ценных офицеров. Вы в непростой ситуации. Я готов предложить помощь".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я хотел бы оказать вам поддержку в решении ваших непосредственных проблем. Насколько мне известно, судно понесло существенные потери во время недавнего бунта и пострадало от действий культистов, вдобавок вы потеряли множество ценных офицеров. Вы в непростой ситуации. Я готов предложить помощь.
- guid: 319feea9-1eaa-405f-b62e-59004952d22d
  event: RMNC_Heinrix_StratingEvent_24
  text: '"Я... оставлю ваше замечание без ответа, {name}. Пока мое подозрение о причинах подобной ремарки не превратилось в нечто более серьезное".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я... оставлю ваше замечание без ответа, КЭП. Пока мое подозрение о причинах подобной ремарки не превратилось в нечто более серьезное.
- guid: de33fc0d-7f2f-4652-b863-cb985ea6aec9
  event: RMNC_Heinrix_StratingEvent_25
  text: '"Подобная боязнь порой говорит о том, что человеку есть что скрывать. Невиновность ничего не доказывает — даже помыслы могут быть опасной ересью".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Подобная боязнь порой говорит о том, что человеку есть что скрывать. Невиновность ничего не доказывает — даже помыслы могут быть опасной ересью.
- guid: 020910b4-142b-4640-aef3-92e4ebf9ae68
  event: RMNC_Heinrix_StratingEvent_26
  text: '"Я..." {n}Хейнрикс внезапно умолкает. Затем отводит взгляд.{/n} "У вас нет на то причин".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я...
  - speaker: narrator
    text_clean: Хейнрикс внезапно умолкает. Затем отводит взгляд.
  - speaker: Heinrix van Calox
    text_clean: У вас нет на то причин.
- guid: e30039af-78d4-430c-9b7f-26d1a3bb3c66
  event: RMNC_Heinrix_StratingEvent_27
  text: '"Благодарю вас за уделенное мне время, {name}. Прошу полностью рассчитывать на мою помощь до тех пор, пока я нахожусь на борту вашего судна".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Благодарю вас за уделенное мне время, КЭП. Прошу полностью рассчитывать на мою помощь до тех пор, пока я нахожусь на борту вашего судна.
- guid: 4e612d9d-185f-4738-aafa-9845058aae29
  event: RMNC_Heinrix_StratingEvent_28
  text: '"В этом нет необходимости". {n}Дознаватель отвечает слишком поспешно, словно стремясь свернуть разговор побыстрее.{/n} "В другой ситуации я бы не отказался побеседовать с вами обстоятельнее... но вас ждут ваши подданные".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: В этом нет необходимости.
  - speaker: narrator
    text_clean: Дознаватель отвечает слишком поспешно, словно стремясь свернуть разговор побыстрее.
  - speaker: Heinrix van Calox
    text_clean: В другой ситуации я бы не отказался побеседовать с вами обстоятельнее... но вас ждут ваши подданные.
- guid: 723c15ab-3f6a-4041-ba81-a7779dc56e2a
  event: RMNC_Heinrix_StratingEvent_29
  text: '"Разумеется. У вас полно дел и обязанностей, которые не терпят отлагательств". {n}Дознаватель отвечает вам необычно поспешно.{/n}'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Разумеется. У вас полно дел и обязанностей, которые не терпят отлагательств.
  - speaker: narrator
    text_clean: Дознаватель отвечает вам необычно поспешно.
- guid: 520c8b3f-60f5-4b6b-83cd-af4d6dff323c
  event: RMNC_Heinrix_StratingEvent_30
  text: '{n}Хейнрикс закладывает руки за спину и чуть наклоняется вперед.{/n} "Лорд-капитан {name} фон Валанциус. При всем моем уважении — прекратите вести себя с аколитом Святой Инквизиции словно на светском приеме в кругу воздыхателей. Вы слишком легкомысленны для главы великой династии".'
  speaker: Heinrix van Calox
  parts:
  - speaker: narrator
    text_clean: Хейнрикс закладывает руки за спину и чуть наклоняется вперед.
  - speaker: Heinrix van Calox
    text_clean: Лорд-капитан КЭП фон Валанциус. При всем моем уважении — прекратите вести себя с аколитом Святой Инквизиции словно на светском приеме в кругу воздыхателей. Вы слишком легкомысленны для главы великой династии.
- guid: c86080d2-423d-4bd7-99ce-34f49f79c8e0
  event: RMNC_Heinrix_StratingEvent_31
  text: '"Пусть Толкователь служит династии фон Валанциус столь же верно, как до того служил аколитам Святого Ордоса".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Пусть Толкователь служит династии фон Валанциус столь же верно, как до того служил аколитам Святого Ордоса.
- guid: 813e8e94-5188-4549-b84a-0028dc6fae64
  event: RMNC_Regecide_BarksHeinrix_01
  text: '"Теперь, когда мы разобрались с расстановкой и основами игры, можно будет переходить к изучению дебютов... но уже в следующий раз. Благодарю за твое время и внимание, {name}".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Теперь, когда мы разобрались с расстановкой и основами игры, можно будет переходить к изучению дебютов... но уже в следующий раз. Благодарю за твое время и внимание, КЭП.
- guid: f0d6ea9b-6da1-455b-b5b6-bce4e5c6c0b4
  event: RMNC_Regecide_BarksHeinrix_02
  text: '"Ты удивительно быстро схватываешь. Похоже, ты действительно получаешь удовольствие от регицида!"'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты удивительно быстро схватываешь. Похоже, ты действительно получаешь удовольствие от регицида!
- guid: 37ae59be-96c6-4b97-9970-a1fab7bfc58e
  event: RMNC_Regecide_BarksHeinrix_03
  text: '"Ты постигла почти все премудрости игры, которые известны мне самому. Думаю, вскоре ты начнешь меня обыгрывать".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Ты постигла почти все премудрости игры, которые известны мне самому. Думаю, вскоре ты начнешь меня обыгрывать.
- guid: 4da2a335-03f5-4840-a17d-45f83661c309
  event: RMNC_Regecide_BarksHeinrix_04
  text: '"Полагаю, мы можем закончить с обучением. Теперь играть будем по-настоящему — без поддавков и скидок на неопытность".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Полагаю, мы можем закончить с обучением. Теперь играть будем по-настоящему — без поддавков и скидок на неопытность.
- guid: b70f5932-3f14-44c5-855a-f90b09521086
