- guid: 652f7a79-2240-43ba-b591-ddef54291849
  event: Companions_Interrogator_04
  text: '{n}Лицо Хейнрикса на мгновение рассекает саркастичная усмешка.{/n} "Обычно я интересуюсь у окружающих их прошлым, а не наоборот. Я с {g|Encyclopedia:KnightWorld}рыцарского мира{/g} Гвизорн III. Принадлежал к одной из ветвей дворянского дома — до тех пор, пока не обнаружились мои особые способности. После этого я был отправлен на {g|Encyclopedia:BlackShip}Черном корабле{/g} на Святую Терру, где прошел обучение и начал службу во славу {g|Encyclopedia:Imperium}Империума{/g}".'
