  event: CH1_HeinrixFirstMeet_26
  text: '"Я прибыл сюда с отрядом сопровождения, который был потерян в первом же открытом столкновении — монастырь буквально кишит еретиками. Люди, которых я реквизировал у губернатора, или пали в бою, или истекли кровью, или сбежали. Мне пришлось ограничиться отловом и пристрастными расспросами отдельных бунтовщиков. От них я и узнал то, что только что передал вам".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Я прибыл сюда с отрядом сопровождения, который был потерян в первом же открытом столкновении — монастырь буквально кишит еретиками. Люди, которых я реквизировал у губернатора, или пали в бою, или истекли кровью, или сбежали. Мне пришлось ограничиться отловом и пристрастными расспросами отдельных бунтовщиков. От них я и узнал то, что только что передал вам.
