  event: Companions_Interrogator_05
  text: '"Когда я прибыл на {g|Encyclopedia:HolyTerra}Святую Терру{/g} и был подвергнут испытаниями, то был признан подходящим материалом для становления санкционированным псайкером, способным подчинить свое проклятие собственной воле. Могу заверить, что адепты {g|Encyclopedia:AdeptusAstraTelepathica}Астра Телепатика{/g} не ошиблись в своей оценке".'
