- guid: 9289e441-38f9-4931-903f-98909c879e32
  event: CH1_HeinrixFirstMeet_24
  text: '"Вы знакомы с трудами инквизитора Аластара Искупителя? Не каждый аколит может гордиться подобным, не говоря уже о... менее посвященных". {n}Хейнрикс приподнимает бровь, внимательно изучая вышитый герб на одеяниях Кассии.{/n} "Простите мои манеры, Леди-Навигатор Орселлио. Большая честь".'
