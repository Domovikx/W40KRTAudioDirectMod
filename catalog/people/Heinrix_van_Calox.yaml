  text: '"Возможно, я недостаточно точно выразился..." {n}Хейнрикс чуть наклоняется вперед и в упор заглядывает вам в глаза.{/n} "В отсутствие Лорд-инквизитора я есть волеизъявление Священного Ордоса. Инквизиция не допустит свершения поганого предсказания, обещающего гибель целой планеты. И я не покину систему Райкад, пока подобная угроза не будет устранена".'
