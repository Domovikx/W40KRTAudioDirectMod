  event: Companions_Interrogator_02
  text: '"Конечно, нет. Команда Лорд-инквизитора включает в себя десятки людей — лучших из лучших, специалистов во многих областях и сферах. С некоторыми я знаком лично. Других не встречал ни разу в жизни".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
