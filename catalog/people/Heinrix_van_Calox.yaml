  event: Companions_Interrogator_85
  text: '{n}Лицо Хейнрикса застыло в непроницаемой каменной маске — кажется, словно перед вами изваяние, а не живой человек.{/n} "Лорд-капитан. Я благодарю за ваше содействие моей миссии. Благодаря Вольному Торговцу фон Валанциус Инквизиция остановила врагов Человечества — на сей раз даже тех, что скрывались в ее собственных рядах. Я более не претендую на ваше время и ресурсы".'
