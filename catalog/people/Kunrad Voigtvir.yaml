  text_original: '"Безумцы. Глупцы. Еретики. На этом судне тысячи и тысячи людей — тлетворные помыслы или навеянный варпом бред мог заронить скверну в любого из них. Тяжело это признавать, но подобный риск сопровождает нас всегда".'
