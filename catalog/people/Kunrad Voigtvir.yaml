phrases:
- guid: ca2ef6c0-f159-447d-96d3-164e4ab8bb84
  event: PRL_KunradIntroduction_01
  text_original: '"Прекрасное место для размышлений". {n}Взгляд приблизившегося к вам мужчины устремлен вниз — в глубины корабельного храма, раскинувшего свои своды на нижней палубе.{/n} "Отсюда открывается лучший вид на кафедральный собор. Завораживает, не правда ли? Свидетельство величия {g|Encyclopedia:Emperor}Бога-Императора{/g}, нашедшее безукоризненное воплощение".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Прекрасное место для размышлений.
  - speaker: narrator
    text_clean: Взгляд приблизившегося к вам мужчины устремлен вниз — в глубины корабельного храма, раскинувшего свои своды на нижней палубе.
  - speaker: Кунрад Войгтвир
    text_clean: Отсюда открывается лучший вид на кафедральный собор. Завораживает, не правда ли? Свидетельство величия Бога-Императора, нашедшее безукоризненное воплощение.
- guid: db5d2764-b932-490e-864c-a9196703b725
  event: PRL_KunradIntroduction_02
  text_original: '"Особенности {g|Encyclopedia:Imperium}имперских{/g} традиций. "Лорд-капитан" — священный титул, закрепленный в анналах {g|Encyclopedia:LexImperialis}Лекс Империалис{/g} с самого появления Вольных Торговцев на службе Бога-Императора, и не подлежит каким-либо изменениям".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Особенности имперских традиций. "Лорд-капитан" — священный титул, закрепленный в анналах Лекс Империалис с самого появления Вольных Торговцев на службе Бога-Императора, и не подлежит каким-либо изменениям.
- guid: 43cbd32b-0157-4e7b-a405-c7583c4a5f50
  event: PRL_KunradIntroduction_03
  text_original: '"Пожалуй, я воздержусь от обсуждений Лорд-капитана за ее спиной — тем более на ее судне. Кому как не мне знать, что шепотки привлекают особо пристальное внимание!" {n}Кунрад смеется и качает головой.{/n} "Достаточно будет сказать, что Ее Светлость — предержательница священного {g|Encyclopedia:Warrant}Торгового Патента{/g} и обладательница невероятной власти и привилегий. Даже при вашем особом положении — прошу, не вызывайте ее гнев непочтительностью или тугодумием. Леди Теодора терпеть не может оба этих качества".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Пожалуй, я воздержусь от обсуждений Лорд-капитана за ее спиной — тем более на ее судне. Кому как не мне знать, что шепотки привлекают особо пристальное внимание!
  - speaker: narrator
    text_clean: Кунрад смеется и качает головой.
  - speaker: Кунрад Войгтвир
    text_clean: Достаточно будет сказать, что Ее Светлость — предержательница священного Торгового Патента и обладательница невероятной власти и привилегий. Даже при вашем особом положении — прошу, не вызывайте ее гнев непочтительностью или тугодумием. Леди Теодора терпеть не может оба этих качества.
- guid: 0c1ed0ba-6657-4b0b-ba85-a55d8b8a523b
  event: PRL_KunradIntroduction_04
  text_original: '"Я вижу ваше изумление... да, вы правильно все поняли. Власть Леди Теодоры действительно превосходит власть тех, кому вы подчинялись ранее. Могущество Лорд-капитана настолько велико, что ей под силу совершить невероятное — изменить судьбу слуги {g|Encyclopedia:Imperium}Империума{/g}. Вашу судьбу".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Я вижу ваше изумление... да, вы правильно все поняли. Власть Леди Теодоры действительно превосходит власть тех, кому вы подчинялись ранее. Могущество Лорд-капитана настолько велико, что ей под силу совершить невероятное — изменить судьбу слуги Империума. Вашу судьбу.
- guid: d5c76593-ebff-4b4c-90e4-6b0466214d56
  event: PRL_KunradIntroduction_05
  text_original: '"Пускай ваше положение и отличалось от обычного служения одному из институтов {g|Encyclopedia:Imperium}Империума{/g}, отныне вас ждет другая судьба — избранная за вас Лорд-капитаном. Смиритесь с этой мыслью как можно скорее".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Пускай ваше положение и отличалось от обычного служения одному из институтов Империума, отныне вас ждет другая судьба — избранная за вас Лорд-капитаном. Смиритесь с этой мыслью как можно скорее.
- guid: 9e4c0e7f-8a1f-4bf4-b413-7161ab0877d6
  event: PRL_KunradIntroduction_06
  text_original: '{n}Мужчина удовлетворенно кивает, словно ваш ответ подтвердил какую-то его мысль.{/n} "Потому что таково предназначение храмов Бога-Императора — внушать трепет и преклонение. Ибо долг каждого из слуг Его — в безустанной службе, пока не представится возможность отдать самую жизнь за Повелителя Человечества". {n}Ваш собеседник вздыхает и поворачивается к вам.{/n}'
  parts:
  - speaker: narrator
    text_clean: Мужчина удовлетворенно кивает, словно ваш ответ подтвердил какую-то его мысль.
  - speaker: Кунрад Войгтвир
    text_clean: Потому что таково предназначение храмов Бога-Императора — внушать трепет и преклонение. Ибо долг каждого из слуг Его — в безустанной службе, пока не представится возможность отдать самую жизнь за Повелителя Человечества.
  - speaker: narrator
    text_clean: Ваш собеседник вздыхает и поворачивается к вам.
- guid: e920d58c-dab7-4a91-8e16-7173225cea40
  event: PRL_KunradIntroduction_07
  text_original: '{n}Мужчина бросает на вас сочувствующий взгляд.{/n} "Думаю, среди нас есть те, кто разделяет подобный сантимент. Однако в том и заключается наш долг, не так ли? Превозмогать низменные слабости и желания, дабы как можно лучше служить Богу-Императору, Повелителю Человечества". {n}Ваш собеседник качает головой и поворачивается к вам.{/n}'
  parts:
  - speaker: narrator
    text_clean: Мужчина бросает на вас сочувствующий взгляд.
  - speaker: Кунрад Войгтвир
    text_clean: Думаю, среди нас есть те, кто разделяет подобный сантимент. Однако в том и заключается наш долг, не так ли? Превозмогать низменные слабости и желания, дабы как можно лучше служить Богу-Императору, Повелителю Человечества.
  - speaker: narrator
    text_clean: Ваш собеседник качает головой и поворачивается к вам.
- guid: 171c5042-e1d8-4309-af8e-79cf44dec21a
  event: PRL_KunradIntroduction_08
  text_original: '{n}Мужчина поворачивается к вам и кланяется.{/n} "Прошу прощения. Я разыскивал вас вовсе не с целью досаждать незваным вниманием".'
  parts:
  - speaker: narrator
    text_clean: Мужчина поворачивается к вам и кланяется.
  - speaker: Кунрад Войгтвир
    text_clean: Прошу прощения. Я разыскивал вас вовсе не с целью досаждать незваным вниманием.
- guid: 031209d1-d587-470d-9ae1-5629138d657f
  event: PRL_KunradIntroduction_09
  text_original: '"Дозвольте представиться: Кунрад Войгтвир, Мастер шепотов на службе Ее Светлости {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} Теодоры фон Валанциус. К вашим услугам. Я еще не имел удовольствия общаться с вами лично..." {n}Кунрад склоняет голову и устремляет на вас внимательный взгляд.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: 'Дозвольте представиться: Кунрад Войгтвир, Мастер шепотов на службе Ее Светлости Вольного Торговца Теодоры фон Валанциус. К вашим услугам. Я еще не имел удовольствия общаться с вами лично...'
  - speaker: narrator
    text_clean: Кунрад склоняет голову и устремляет на вас внимательный взгляд.
- guid: ad883201-5fb5-4de9-850c-d9b5b07ea189
  event: PRL_KunradIntroduction_10
  text_original: '"Мое почтение, лорд-капитан..." {n}Кунрад смеривает вас взглядом, тонко улыбаясь.{/n} "Если точнее — лорд-капитан фон Валанциус, один из благословенного рода Вольных Торговцев на службе {g|Encyclopedia:Imperium}Империума Человечества{/g}. Вероятно, подобное родство оказалось для вас сюрпризом. Неудивительно — свидетельства этого были утрачены с поколениями, разделяющими вас и Лорд-капитана Теодору. Слуги Ее Светлости потратили немало сил, чтобы обнаружить и удостоверить эту кровную связь. Связь, делающую вас одн{mf|им|ой} из наследн{mf|иков|иц}".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, лорд-капитан...
  - speaker: narrator
    text_clean: Кунрад смеривает вас взглядом, тонко улыбаясь.
  - speaker: Кунрад Войгтвир
    text_clean: Если точнее — лорд-капитан фон Валанциус, один из благословенного рода Вольных Торговцев на службе Империума Человечества. Вероятно, подобное родство оказалось для вас сюрпризом. Неудивительно — свидетельства этого были утрачены с поколениями, разделяющими вас и Лорд-капитана Теодору. Слуги Ее Светлости потратили немало сил, чтобы обнаружить и удостоверить эту кровную связь. Связь, делающую вас одним из наследников.
- guid: 41a095af-1280-4b0d-a7d4-8a8ad2b1c5b8
  event: PRL_KunradIntroduction_11
  text_original: '"Мое почтение, комиссар. Отыскать вас было весьма непросто... учитывая участь ваших родителей и ваше взросление в {g|Encyclopedia:ScholaProgenium}Схола Прогениум{/g}. Наша встреча — настоящее провидение, не так ли?" {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, комиссар. Отыскать вас было весьма непросто... учитывая участь ваших родителей и ваше взросление в Схола Прогениум. Наша встреча — настоящее провидение, не так ли?
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: ce26ba77-7d37-4176-a13a-f5c7c7048dd6
  event: PRL_KunradIntroduction_12
  text_original: '"Мое почтение, лорд-капитан. Слава о ваших... достижениях в тенях целого сектора мне, разумеется, известна. Ваша предприимчивость и, простите за просторечный термин, живучесть выше всяких похвал. Словно сама судьба помогла вам оказаться здесь". {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, лорд-капитан. Слава о ваших... достижениях в тенях целого сектора мне, разумеется, известна. Ваша предприимчивость и, простите за просторечный термин, живучесть выше всяких похвал. Словно сама судьба помогла вам оказаться здесь.
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: b65904c7-2662-413c-9c58-e269b9cf1da3
  event: PRL_KunradIntroduction_13
  text_original: '"Мое глубочайшее почтение, герцог{mf||иня}. {g|Encyclopedia:Imperium}Имперское{/g} дворянство — давно провидение не приводило на борт этого судна столь высоких гостей!" {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое глубочайшее почтение, герцог. Имперское дворянство — давно провидение не приводило на борт этого судна столь высоких гостей!
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: cc8eab5a-17ae-49c7-b962-456a19afb7f8
  event: PRL_KunradIntroduction_14
  text_original: '"Мое почтение, генерал-лейтенант. {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g} — молот Бога-Императора, так ведь говорят? Что ж, судьба наверняка позволит вам сполна проявить свои полководческие таланты". {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, генерал-лейтенант. Астра Милитарум — молот Бога-Императора, так ведь говорят? Что ж, судьба наверняка позволит вам сполна проявить свои полководческие таланты.
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: 119aad60-41cd-4a09-8691-3a76b56a22e1
  event: PRL_KunradIntroduction_15
  text_original: '"Мое почтение, Ваше Преосвященство. Насколько мне известно, в вашем ведении находилось распределение ресурсов {g|Encyclopedia:AdeptusMinistorum}Адептус Министорум{/g}... весьма удачное совпадение с учетом того, куда в итоге привел ваш удел". {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, Ваше Преосвященство. Насколько мне известно, в вашем ведении находилось распределение ресурсов Адептус Министорум... весьма удачное совпадение с учетом того, куда в итоге привел ваш удел.
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: 08db96ea-05a7-4411-adce-541c9970130f
  event: PRL_KunradIntroduction_16
  text_original: '"Мое почтение, Лорд-капитан... хотя, пожалуй, на этом судне мне стоит избегать такого обращения к вам. При всем моем уважении, командор". {n}Кунрад тонко улыбается — то ли вам, то ли своим мыслям.{/n}'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, Лорд-капитан... хотя, пожалуй, на этом судне мне стоит избегать такого обращения к вам. При всем моем уважении, командор.
  - speaker: narrator
    text_clean: Кунрад тонко улыбается — то ли вам, то ли своим мыслям.
- guid: 17da523d-17ef-44e8-af52-6b043d1e7de9
  event: PRL_KunradIntroduction_17
  text_original: '{n}Кунрад серьезно кивает.{/n} "Я в курсе, лорд-капитан — было бы совершенно недопустимо пропустить подобный факт при составлении профиля. Вас постиг рок обладать ведьмовскими силами... и употреблять их на благо {g|Encyclopedia:Imperium}Империума{/g}. Воистину, вам выпал непростой жребий".'
  parts:
  - speaker: narrator
    text_clean: Кунрад серьезно кивает.
  - speaker: Кунрад Войгтвир
    text_clean: Я в курсе, лорд-капитан — было бы совершенно недопустимо пропустить подобный факт при составлении профиля. Вас постиг рок обладать ведьмовскими силами... и употреблять их на благо Империума. Воистину, вам выпал непростой жребий.
- guid: accfa543-e23f-44ff-935e-2a971fee8d18
  event: PRL_KunradIntroduction_18
  text_original: '{n}Кунрад виновато улыбается.{/n} "Боюсь, мне не удастся скрыть свою информированность о том, кто вы и каково ваше происхождение, лорд-капитан — как бы я ни пытался быть вежлив в своем обращении с вами и вашими желаниями. В конце концов, быть в курсе — моя прямая обязанность. Вдобавок... то, именем какого рода вы именовали себя раньше, уже не имеет особого значения".'
  parts:
  - speaker: narrator
    text_clean: Кунрад виновато улыбается.
  - speaker: Кунрад Войгтвир
    text_clean: Боюсь, мне не удастся скрыть свою информированность о том, кто вы и каково ваше происхождение, лорд-капитан — как бы я ни пытался быть вежлив в своем обращении с вами и вашими желаниями. В конце концов, быть в курсе — моя прямая обязанность. Вдобавок... то, именем какого рода вы именовали себя раньше, уже не имеет особого значения.
- guid: 60873fad-fef6-4218-bd80-fa7511abdbbb
  event: PRL_KunradIntroduction_19
  text_original: '"Для исполнения кровного долга, лорд-капитан. Каковы бы ни были ваши обязанности ранее, ныне они считаются утратившими свое значение. Приказом Лорд-капитана вы реквизированы для служения Вольному Торговцу в угодных Богу-Императору деяниях".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Для исполнения кровного долга, лорд-капитан. Каковы бы ни были ваши обязанности ранее, ныне они считаются утратившими свое значение. Приказом Лорд-капитана вы реквизированы для служения Вольному Торговцу в угодных Богу-Императору деяниях.
- guid: 9491c280-bac0-47e8-a876-ff16e30a95a7
  event: PRL_KunradIntroduction_20
  text_original: '{n}Мужчина бросает на вас заинтригованный взгляд.{/n} "Интересная точка зрения. Однако позвольте дать совет: ради вашего же благополучия вам надлежит облекать свои мысли в более богобоязненные формы. Подобная небрежность в словах некоторыми людьми может быть сочтена свидетельством недостаточного трепета перед Богом-Императором, Повелителем Человечества".'
  parts:
  - speaker: narrator
    text_clean: Мужчина бросает на вас заинтригованный взгляд.
  - speaker: Кунрад Войгтвир
    text_clean: 'Интересная точка зрения. Однако позвольте дать совет: ради вашего же благополучия вам надлежит облекать свои мысли в более богобоязненные формы. Подобная небрежность в словах некоторыми людьми может быть сочтена свидетельством недостаточного трепета перед Богом-Императором, Повелителем Человечества.'
- guid: 714446d0-b3c4-4e8b-91d3-a9899183b4d0
  event: PRL_KunradIntroduction_21
  text_original: '"Я понимаю. Но особенности моего ремесла делают меня прозорливым и способным зрить в корень — в отличие от миллионов богобоязненных и ревностных слуг Его. Поверьте, ваши слова легко истолковать иначе — особенно если к тому будет расположен разум вашего собеседника".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Я понимаю. Но особенности моего ремесла делают меня прозорливым и способным зрить в корень — в отличие от миллионов богобоязненных и ревностных слуг Его. Поверьте, ваши слова легко истолковать иначе — особенно если к тому будет расположен разум вашего собеседника.
- guid: 35579d48-4afe-4fad-a086-e9cd7a9e3928
  event: PRL_KunradIntroduction_22
  text_original: '"Похвально, весьма похвально. Однако очень и очень многие считают, что труд во славу Его начинается с радения над собственными словами. Помните об этом, когда вам представится привилегия вновь обсуждать Его с верными слугами {g|Encyclopedia:Imperium}Империума{/g}".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Похвально, весьма похвально. Однако очень и очень многие считают, что труд во славу Его начинается с радения над собственными словами. Помните об этом, когда вам представится привилегия вновь обсуждать Его с верными слугами Империума.
- guid: 5aaab80d-8194-46df-b514-038cba8f22c5
  event: PRL_KunradIntroduction_23
  text_original: '{n}Ваш собеседник слегка кланяется.{/n} "Счастлив угодить вам — ибо в том мой долг и перед династией Его избранников".'
  parts:
  - speaker: narrator
    text_clean: Ваш собеседник слегка кланяется.
  - speaker: Кунрад Войгтвир
    text_clean: Счастлив угодить вам — ибо в том мой долг и перед династией Его избранников.
- guid: 77defef7-67c8-4417-8e66-0bb4c5f2ec5c
  event: PRL_KunradIntroduction_24
  text_original: '{n}Ваш собеседник бросает на вас заинтересованный взгляд.{/n} "Ваше положение не сможет долго оберегать вас при подобных речах. Поостерегитесь — вас ждет куда более интересная и насыщенная судьба, чем быть казненн{mf|ым|ой} по обвинению в ереси".'
  parts:
  - speaker: narrator
    text_clean: Ваш собеседник бросает на вас заинтересованный взгляд.
  - speaker: Кунрад Войгтвир
    text_clean: Ваше положение не сможет долго оберегать вас при подобных речах. Поостерегитесь — вас ждет куда более интересная и насыщенная судьба, чем быть казненным по обвинению в ереси.
- guid: 69add308-40ee-479f-b427-76d8b7d92e70
  event: PRL_KunradIntroduction_25
  text_original: '{n}Ваш собеседник издает смешок, который умело маскирует под прочистку горла.{/n} "Прошу прощения. Ваши высказывания столь увлекли меня, что я забылся".'
  parts:
  - speaker: narrator
    text_clean: Ваш собеседник издает смешок, который умело маскирует под прочистку горла.
  - speaker: Кунрад Войгтвир
    text_clean: Прошу прощения. Ваши высказывания столь увлекли меня, что я забылся.
- guid: 059885b6-3a80-441e-afb2-f81a37f4d10d
  event: PRL_KunradIntroduction_26
  text_original: '"Буду с вами прямолинеен: можете забыть про свои титулы, кем бы они ни были даны и откуда бы ни происходили. С тех пор, как вас и другого претендента доставили на этот пустотный корабль, ваша судьба изменилась: вы несете бремя наследника династии и служите Лорд-капитану Теодоре фон Валанциус. Отныне вы делите династическое имя с Ее Светлостью. Носите его с честью".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: 'Буду с вами прямолинеен: можете забыть про свои титулы, кем бы они ни были даны и откуда бы ни происходили. С тех пор, как вас и другого претендента доставили на этот пустотный корабль, ваша судьба изменилась: вы несете бремя наследника династии и служите Лорд-капитану Теодоре фон Валанциус. Отныне вы делите династическое имя с Ее Светлостью. Носите его с честью.'
- guid: 1db2dd55-57c5-4d9b-bc09-8e436f2e690d
  event: PRL_KunradIntroduction_27
  text_original: '"Выражаясь простым языком, я — глава соглядатаев и информаторов, служащих на благо династии фон Валанциус. Я выявляю слабые звенья в свите и экипаже Леди Теодоры, а также выискиваю их в окружении ее конкурентов. Уязвимости, обнаруженные в наших рядах, я устраняю, в чужих — эксплуатирую".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Выражаясь простым языком, я — глава соглядатаев и информаторов, служащих на благо династии фон Валанциус. Я выявляю слабые звенья в свите и экипаже Леди Теодоры, а также выискиваю их в окружении ее конкурентов. Уязвимости, обнаруженные в наших рядах, я устраняю, в чужих — эксплуатирую.
- guid: f005ce77-7a04-4315-8869-a23e6932cd63
  event: PRL_KunradIntroduction_28
  text_original: '"Лорд-капитан и господин Эдельтрад фон Валанциус беседуют на смотровой площадке. Давайте присоединимся к ним".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Лорд-капитан и господин Эдельтрад фон Валанциус беседуют на смотровой площадке. Давайте присоединимся к ним.
- guid: 2691affc-215c-4302-9c14-f1e6745eef53
  event: PRL_KunradIntroduction_29
  text_original: '{n}Кунрад чуть пожимает плечом.{/n} "Да. И вскоре вы с ним познакомитесь".'
  parts:
  - speaker: narrator
    text_clean: Кунрад чуть пожимает плечом.
  - speaker: Кунрад Войгтвир
    text_clean: Да. И вскоре вы с ним познакомитесь.
- guid: 87c26401-b2a7-4f58-8ffc-fe274ceee8b0
  event: PRL_KunradIntroduction_30
  text_original: '"Мое почтение, Ваше Преосвященство. Судя по началу нашего разговора, вы придерживаетесь весьма... интересной точки зрения на деяния {g|Encyclopedia:AdeptusMinistorum}Адептус Министорум{/g}". {n}Кунрад лукаво улыбается, глядя вам в глаза.{/n} "Вы — человек удивительных талантов, раз до сих пор сохранили свой сан, лорд-капитан. Или же само провидение благоволит к вам".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мое почтение, Ваше Преосвященство. Судя по началу нашего разговора, вы придерживаетесь весьма... интересной точки зрения на деяния Адептус Министорум.
  - speaker: narrator
    text_clean: Кунрад лукаво улыбается, глядя вам в глаза.
  - speaker: Кунрад Войгтвир
    text_clean: Вы — человек удивительных талантов, раз до сих пор сохранили свой сан, лорд-капитан. Или же само провидение благоволит к вам.
- guid: 2ab9ec32-0648-4bc0-8349-4cacf5067909
  event: PRL_KunradIntroduction_31
  text_original: '"Разумеется. Я разыскал вас для того, чтобы пригласить на встречу с Леди Теодорой. Полагаю, у вас много вопросов к своей покровительнице. Уверен, у нее к вам — не меньше. Перелет выдался непростой, жаль, что вам так и не выдалось возможности поговорить раньше".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Разумеется. Я разыскал вас для того, чтобы пригласить на встречу с Леди Теодорой. Полагаю, у вас много вопросов к своей покровительнице. Уверен, у нее к вам — не меньше. Перелет выдался непростой, жаль, что вам так и не выдалось возможности поговорить раньше.
- guid: ef141c2e-4fee-4455-a7b2-66f4760e1741
  event: PRL_KunradReveal_01
  text_original: '"Осторожнее, осторожнее. Бережнее с наш{mf|им|ей} гост{mf|ем|ьей} — {mf|ему|ей} предстоит исполнить важную миссию в Камере {g|Encyclopedia:Warrant}Патента{/g}, а для этого {mf|ему|ей} следует быть жив{mf|ым|ой}". {n}Кунрад опускает взгляд на вас.{/n} "Вы вернулись к нам. Какая радость".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Осторожнее, осторожнее. Бережнее с нашим гостем — ему предстоит исполнить важную миссию в Камере Патента, а для этого ему следует быть живым.
  - speaker: narrator
    text_clean: Кунрад опускает взгляд на вас.
  - speaker: Кунрад Войгтвир
    text_clean: Вы вернулись к нам. Какая радость.
- guid: 0c6a011c-e39f-4e9f-ab88-72b47b4d63d5
  event: PRL_KunradReveal_02
  text_original: '{n}Кунрад склоняет голову набок.{/n} "Хм... Я могу поразмыслить об этом. После того, как ты сделаешь то, что мне от тебя нужно".'
  parts:
  - speaker: narrator
    text_clean: Кунрад склоняет голову набок.
  - speaker: Кунрад Войгтвир
    text_clean: Хм... Я могу поразмыслить об этом. После того, как ты сделаешь то, что мне от тебя нужно.
- guid: 61f58550-68bb-4bab-b572-78dad4ef8ffe
  event: PRL_KunradReveal_04
  text_original: '"Кажется, ты приложился головой при падении сильнее, чем я думал... неважно — от тебя требуется не так уж много. Всего лишь твоя кровь, которой ты можешь поделиться по собственному почину — или же я изолью ее из тебя".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Кажется, ты приложился головой при падении сильнее, чем я думал... неважно — от тебя требуется не так уж много. Всего лишь твоя кровь, которой ты можешь поделиться по собственному почину — или же я изолью ее из тебя.
- guid: cb12863f-edf7-4a2d-a7bd-3f81430a382f
  event: PRL_KunradReveal_05
  text_original: '"Какая проницательность, лорд-капитан. Я помогу тебе со следующей догадкой: ты мне нужен ради твоей крови. У тебя есть возможность поделиться ей добровольно — или я сам изолью ее из тебя".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: 'Какая проницательность, лорд-капитан. Я помогу тебе со следующей догадкой: ты мне нужен ради твоей крови. У тебя есть возможность поделиться ей добровольно — или я сам изолью ее из тебя.'
- guid: c6451676-9a9e-4db7-b458-3d3d58001895
  event: PRL_KunradReveal_07
  text_original: '"Мы в преддверии Камеры Патента — святая святых этого корабля. Там, за этими вратами, хранится реликвия, которая дает Теодоре всю ее власть — священный Торговый Патент. Есть только одна загвоздка — врата Камеры охраняет древнее устройство, которое откроет двери только истинному наследнику династии. Я рассчитывал справиться сам, но... неважно. Кровь Стражу поднесешь ты".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Мы в преддверии Камеры Патента — святая святых этого корабля. Там, за этими вратами, хранится реликвия, которая дает Теодоре всю ее власть — священный Торговый Патент. Есть только одна загвоздка — врата Камеры охраняет древнее устройство, которое откроет двери только истинному наследнику династии. Я рассчитывал справиться сам, но... неважно. Кровь Стражу поднесешь ты.
- guid: 6426e7bf-201b-4130-9593-5a33e245fc74
  event: PRL_KunradReveal_08
  text_original: '"Напротив — благословение варпа слишком возвысило меня над твоим родом, фон Валанциус. Страж отказался подчиниться... но ведь для этого же и существуют родственники, готовые помочь, не так ли?'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Напротив — благословение варпа слишком возвысило меня над твоим родом, фон Валанциус. Страж отказался подчиниться... но ведь для этого же и существуют родственники, готовые помочь, не так ли?
- guid: 8962691b-99f9-4f15-b360-d0827f7c7714
  event: PRL_KunradReveal_09
  text_original: '"Покладистый мальчик. Что ж, тогда ступай к Стражу на вратах Камеры Патента и исполни свою судьбу. Я надеялся, что скормлю машине Эдельтрада — в конце концов, именно он приглянулся Теодоре — но раз я не смог его раздобыть, сгодишься и ты".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Покладистый мальчик. Что ж, тогда ступай к Стражу на вратах Камеры Патента и исполни свою судьбу. Я надеялся, что скормлю машине Эдельтрада — в конце концов, именно он приглянулся Теодоре — но раз я не смог его раздобыть, сгодишься и ты.
- guid: 00a2d692-cabe-40da-b72e-0362ea627c10
  event: PRL_KunradReveal_10
  text_original: '"Боюсь, лорд-капитан фон Валанциус, у тебя нет выбора". {n}Кунрад извлекает на свет странное орудие — лезвие без рукоятки, на свету бликующее синим.{/n} "Если вздумаешь сопротивляться, я наглядно покажу тебе власть варпа над смертными. Знаешь, что? Пожалуй, мне даже доставит это определенное удовольствие".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Боюсь, лорд-капитан фон Валанциус, у тебя нет выбора.
  - speaker: narrator
    text_clean: Кунрад извлекает на свет странное орудие — лезвие без рукоятки, на свету бликующее синим.
  - speaker: Кунрад Войгтвир
    text_clean: Если вздумаешь сопротивляться, я наглядно покажу тебе власть варпа над смертными. Знаешь, что? Пожалуй, мне даже доставит это определенное удовольствие.
- guid: 958665ee-a30e-426e-9892-66068d7e47dd
  event: PRL_KunradReveal_12
  text_original: '"Сомневаюсь в этом, любезн{mf|ый|ая} лорд-капитан. Теперь — довольно болтовни. Исполни свою судьбу".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Сомневаюсь в этом, любезный лорд-капитан. Теперь — довольно болтовни. Исполни свою судьбу.
- guid: 0f4d14ff-f6e9-4f49-a646-33330694acf9
  event: PRL_KunradReveal_13
  text_original: '{n}Что-то — или ваш тон, или переполненные ядом слова — на мгновение лишают Кунрада выдержки: из под маски холодного профессионала сверкает исполненная ненависти ярость.{/n} "Убогость? Что ты знаешь об убогости, шавка Теодоры? Надеешься купить крупицу ее снисхождения своей собачьей верностью? О, мне знакомо это заблуждение — но, слава богам, больше оно надо мной не властно. Человечество может катиться в пропасть — я больше не служу смертным".'
  parts:
  - speaker: narrator
    text_clean: 'Что-то — или ваш тон, или переполненные ядом слова — на мгновение лишают Кунрада выдержки: из под маски холодного профессионала сверкает исполненная ненависти ярость.'
  - speaker: Кунрад Войгтвир
    text_clean: Убогость? Что ты знаешь об убогости, шавка Теодоры? Надеешься купить крупицу ее снисхождения своей собачьей верностью? О, мне знакомо это заблуждение — но, слава богам, больше оно надо мной не властно. Человечество может катиться в пропасть — я больше не служу смертным.
- guid: 9067231a-a2b1-4d8a-b8ec-a300c065311f
  event: PRL_KunradReveal_14
  text_original: '{n}Войгтвир колеблется секунду, а затем вытаскивает на свет странное орудие — лезвие без рукоятки, на свету бликующее синим.{/n} "Когда все будет завершено, я заставлю гордую суку фон Валанциус смотреть, как я стираю ее драгоценную династию и предаю ее в руки богов. И ты, лорд-капитан, будешь орудием, которым я свершу это благое деяние".'
  parts:
  - speaker: narrator
    text_clean: Войгтвир колеблется секунду, а затем вытаскивает на свет странное орудие — лезвие без рукоятки, на свету бликующее синим.
  - speaker: Кунрад Войгтвир
    text_clean: Когда все будет завершено, я заставлю гордую суку фон Валанциус смотреть, как я стираю ее драгоценную династию и предаю ее в руки богов. И ты, лорд-капитан, будешь орудием, которым я свершу это благое деяние.
- guid: 04fbc947-673e-4988-a46a-3be43f4720ba
  event: PRL_KunradReveal_15
  text_original: '"Почему? Потому что я выполняю приказ. Я долго готовился к тому, что происходит на корабле прямо сейчас. Остается только получить то, за чем меня отправили мои владыки. Торговый Патент".'
  parts:
  - speaker: Кунрад Войгтвир
    text_clean: Почему? Потому что я выполняю приказ. Я долго готовился к тому, что происходит на корабле прямо сейчас. Остается только получить то, за чем меня отправили мои владыки. Торговый Патент.
- guid: 1422c954-9156-4cc8-9496-37768a95e39a
  event: PRL_KunradUnpleasantNews_01
  text_original: '{n}Кунрад Войгтвир облегченно вздыхает, увидев вас.{/n} "Хвала провидению, с вами все в порядке..."'
  parts:
  - speaker: narrator
    text_clean: Кунрад Войгтвир облегченно вздыхает, увидев вас.
  - speaker: Кунрад Войгтвир
    text_clean: Хвала провидению, с вами все в порядке...
- guid: 3e99ad83-910e-49ee-a38a-f64a79a4ccbb
  event: PRL_KunradUnpleasantNews_02
  text_original: '"Я не получал сообщений из инженариума о сбоях в Поле Геллера... но связь была нестабильна еще полчаса назад, а сейчас воксы молчат. Какова бы ни была причина, последствия стремительно распространяются: я получаю отрывочные сведения со средних палуб, а с нижних отсеков в одностороннем порядке транслируют еретическую галиматью". {n}Кунрад медлит.{/n} "То, что безумцы уже проникли на офицерскую палубу, говорит о чем-то более подготовленном. Возможно, на корабле организованный бунт".'
