  text_original: '{n}Теодора бросает взгляд на Кунрада.{/n} "Эдельтрад — где он? Мне нужно знать, что он в порядке! Псайкер на корабле под возможным влиянием варпа может представлять большую угрозу себе и окружающим, чем целая рать помешанных с самодельным оружием!"'
