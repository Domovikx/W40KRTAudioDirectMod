  - speaker: Кунрад Войгтвир
    text_clean: 'Я не получал сообщений из инженариума о сбоях в Поле Геллера... но связь была нестабильна еще полчаса назад, а сейчас воксы молчат. Какова бы ни была причина, последствия стремительно распространяются: я получаю отрывочные сведения со средних палуб, а с нижних отсеков в одностороннем порядке транслируют еретическую галиматью.'
  - speaker: narrator
    text_clean: Кунрад медлит.
  - speaker: Кунрад Войгтвир
    text_clean: То, что безумцы уже проникли на офицерскую палубу, говорит о чем-то более подготовленном. Возможно, на корабле организованный бунт.
