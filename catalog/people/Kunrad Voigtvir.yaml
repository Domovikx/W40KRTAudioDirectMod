  text_original: '"Прежде всего нужно убедиться, что мостик и Святилище Навигатора в безопасности... и у меня есть способ это сделать одновременно". {n}Выражение лица Вольного Торговца меняется — в ее глазах вспыхивает недобрый огонек.{/n}'
