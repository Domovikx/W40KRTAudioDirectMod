name: Теодора фон Валанциус
gender: F
role: Вольный Торговец
age: ''
personality: властная, жёсткая, решительная
sound_keys:
- Theodora
total_phrases: 99
phrases:
- guid: 9343091e-7b25-47cd-a185-e93c89bf335f
  event: PRL_TheodoraChoice_01
  text: '{n}Ее взгляд спокоен — пугающе спокоен для кого-то, чье тело лижут языки пламени. Рука покоится на эфесе силового
    меча, а вторая поднята в приглашающем жесте.{/n} "Ты заплутал{mf||а}, {mf|мой наследник|моя наследница}?"'
  speaker: null
- guid: f72f20f6-c4bd-442d-aa22-27e0988b8a2a
  event: PRL_TheodoraChoice_02
  text: '{n}Арджента застывает словно каменное изваяние — а затем начинает поднимать оружие.{/n} "Наваждение... ведьмовское
    наваждение! Происки варпа!"'
  speaker: Sister Argenta
- guid: 94843f49-4a9d-4959-a7da-76856bc39613
  event: PRL_TheodoraChoice_03
  text: '"Сестра, опустите оружие!" {n}Несмотря на приказной тон, голос Абеляра звучит не слишком уверенно — старый офицер
    во все глаза смотрит на {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}, на его щеке дергается мускул.{/n} "Угроза Лорд-капитану
    — выходка, выходящая за всякие рамки..."'
  speaker: null
- guid: 3041af75-783c-4a5c-bcb6-d31ccc98eee2
  event: PRL_TheodoraChoice_04
  text: '"Вряд ли тебе известны пределы возможного, {name} — твой кругозор есть лишь крупица того, что видит и познает Вольный
    Торговец. Но я чувствую, что ты хотел{mf||а} бы разделить со мной эти знания. Эту власть над реальностью".'
  speaker: null
- guid: c2494085-cd75-4e38-aa61-6f496514fd82
  event: PRL_TheodoraChoice_05
  text: '"Боль — лишь отражение твоей слабости, {name}. Отринь слабость духа ради величия — это единственный путь к вершинам,
    которые достойны Вольного Торговца".'
  speaker: null
- guid: 6b842bb6-931d-4ca6-a729-21819c56624b
  event: PRL_TheodoraChoice_06
  text: '"Я — Вольный Торговец, {name}. Я везде, где требует быть моя воля. Хотел{mf||а} бы ты сейчас оказаться в другом месте?
    Безусловно. Но готов{mf||а} ли ты?"'
  speaker: null
- guid: a70f4e31-9793-4754-bb97-8cb132353174
  event: PRL_TheodoraChoice_07
  text: '{n}Глаза Теодоры глядят не мигая — словно змеиные очи. Под ее взглядом вы почти не чувствуете, как пламя опаляет
    вашу кожу, оставляя ожоги.{/n} "Я могу вывести тебя из этого огня, {name}. Указать дорогу. Избавить от боли. И дать оружие
    для войны с твоими врагами. Решай".'
  speaker: null
- guid: 7617433b-2914-407d-baf5-55fbe98bab03
  event: PRL_TheodoraChoice_08
  text: '"Не слушай это чудовище! {name}, если ты... если в сердце твоем лишь свет Его и вера твоя тверда — смело шагай в
    огонь! {g|Encyclopedia:Emperor}Император{/g} защитит. Не убоятся верные Его ни тьмы, ни лживых посулов. И не опалит пламя
    тех, кто несет огонь веры в душе!"'
  speaker: null
- guid: a96d6ee3-87e7-44c5-b901-27575b4a2177
  event: PRL_TheodoraChoice_09
  text: '"Катилась бы ты... Идем же за Леди Теодорой! Иначе задохнемся в этой преисподней!"'
  speaker: null
- guid: 7218f6f3-4544-47f1-9578-00ef114b6eb0
  event: PRL_TheodoraChoice_10
  text: '"Люди...!" {n}Абеляр оглядывается на кашляющих и растерянных людей рядом с вами.{/n} "{name}! Выжившие со средних
    палуб! Нужно помочь экипажу... вывести... найти обход..." {n}Сквозь рев пламени вы слышите далекие звуки — испуганные
    голоса, крики... но они проходят к вам словно сквозь водяную толщу, приглушенными и искаженными.{/n}'
  speaker: Abelard Werserian
- guid: 8d122d56-7284-4e7f-96e3-77b5cd3781bd
  event: PRL_TheodoraChoice_11
  text: '"Тогда опоздаем на встречу с Эде..." {n}Идира осекается и начинает тяжело кашлять. Ее ноги подкашиваются, кажется,
    она вот-вот упадет.{/n} "{name}, чего мы ждем?!"'
  speaker: Idira Tlass
- guid: ce7c95cb-8572-4614-967f-8bed79f72f9d
  event: PRL_TheodoraChoice_12
  text: '"Я укажу дорогу. Давай же, закрой глаза..."'
  speaker: null
- guid: d4096f27-75fb-4b2c-98c8-9be67be64866
  event: PRL_TheodoraFirstConversation_01
  text: '"Это иррационально, Леди Теодора". {n}Голос мужчины, облаченного в причудливое одеяние, звенит от напряжения. Его
    лицо, половина которого скрыта синт-кожей, искажено в гримасе недовольства и недоверия.{/n} "Ассимиляция в торговую структуру
    — политическое и экономическое самоубийство, буквально роспись в ереси!"'
  speaker: null
- guid: ca077a5e-9279-4ba6-b8d8-656f29ab853c
  event: PRL_TheodoraFirstConversation_02
  text: '{n}Высокая седовласая женщина в упор взирает на своего собеседника — киберглаз сверкает алым.{/n} "Тогда предложи
    иной вариант, который меня устроит. Я описала ситуацию — ничуть не хуже, чем мог бы описать ее мой сенешаль. Прими решение:
    что ты будешь делать с Айоном-VI, Эдельтрад?"'
  speaker: null
- guid: 383e557a-0c2a-4586-9cbe-b3ab94c189ce
  event: PRL_TheodoraFirstConversation_03
  text: '"Что это?" {n}Эдельтрад оборачивается на вас — в его взгляде читается недовольство.{/n} "Кто-то из вашей свиты, Теодора?
    Вы дозволяете им вмешиваться в ваши разговоры подобным образом?"'
  speaker: Edelthrad
- guid: e459411c-7474-4376-bf07-0fe585dbd40b
  event: PRL_TheodoraFirstConversation_04
  text: '"Я дозволяю вмешиваться в мои разговоры тем, кто может сказать что-то ценное. Сейчас узнаем, стоило ли". {n}Теодора
    склоняет голову набок. Ее губы расползаются в щучью улыбку.{/n} "Это {name}, втор{mf|ой|ая} кандидат{mf||ка} на звание
    моего преемника". {n}{g|Encyclopedia:RogueTrader}Вольный Торговец{/g} бросает на вас властный взгляд, хищный и тяжеловесный.{/n}
    "Шаг вперед, {name}".'
  speaker: Theodora von Valancius
- guid: d31d96e8-9df8-4137-bfdc-2bd2ff33220a
  event: PRL_TheodoraFirstConversation_05
  text: '"О, не сомневаюсь. Только готова ли я выбрать именно тебя? Ты появил{mf|ся|ась} на борту за несколько часов до варп-прыжка
    и пока никак не проявил{mf||а} себя — пока что я испытываю сомнения касательно твоей пригодности для роли Вольного Торговца".'
  speaker: null
- guid: 5ccaf22c-2b68-4ccd-a6ed-d050abced9f2
  event: PRL_TheodoraFirstConversation_06
  text: '"Вероятно. Вчера ты еще обычн{mf|ый|ая} слуга Империума, од{mf|ин|на} из миллионов ничем не отличающихся людей. Сегодня
    за тобой являются люди в цветах дома фон Валанциус и без объяснений и разговоров препровождают на шаттл и судно, которое
    отправляется в путешествие в далекий {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g}. Но такова природа моей позиции,
    {name}. Мое требование — священно, и не подлежит обсуждению. Мне нужны все, в ком есть хотя бы крупица крови династии,
    кем бы эти люди не оказались".'
  speaker: null
- guid: 33d3858d-e582-4ee1-b674-a8e8c80c5f0d
  event: PRL_TheodoraFirstConversation_07
  text: '"Разумеется. Некоторые еще не успели прибыть на корабль, однако одного из них ты имел{mf||а} удовольствие встретить
    лично. Эдельтрад может быть немного смущен масштабами тех обязанностей, которые потенциально будут возложены ему на плечи,
    однако... однако у меня хорошее предчувствие касательно его кандидатуры".'
  speaker: null
- guid: 239e990c-df87-4b9f-b807-781b5cd6be58
  event: PRL_TheodoraFirstConversation_08
  text: '{n}Теодора хмыкает.{/n} "Сдача предложенной инициативы, прискорбная покорность — даже учитывая твое подчиненное положение.
    Впрочем, эта болезнь одинакова для всех, кто привык к существованию в объятиях {g|Encyclopedia:Imperium}Империума{/g}.
    Нерушимая иерархия, бесспорное подчинение, лизоблюдство и стремление угодить... забудь об этом. С того момента, как за
    тобой явились мои посланцы, старые правила не имеют значения".'
  speaker: Theodora von Valancius
- guid: bc1460be-af77-4d12-958b-6e36cf8ff299
  event: PRL_TheodoraFirstConversation_09
  text: '{n}Теодора поднимает бровь.{/n} "Разумно... очень разумно. Однако гоняться за бесплотными созданиями может быть весьма
    долгим — и бесполезным — занятием".'
  speaker: Theodora von Valancius
- guid: 6b667194-f72a-44dc-adc5-c3369022cd9a
  event: PRL_TheodoraFirstConversation_10
  text: '"Несомненно, сопровождая их отбытие на планету пламенными вдохновляющими речами?" {n}Теодора устало вздыхает.{/n}
    "Я никогда не верила в силу пропаганды. Она годится только для самого дурного положения — когда люди должны умирать во
    чье-то имя, а не побеждать и добиваться своего".'
  speaker: Theodora von Valancius
- guid: 6aecc4cf-6833-42dd-89a6-edeb53952c37
  event: PRL_TheodoraFirstConversation_11
  text: '"Перекладываешь свои методы из старой жизни в новую плоскость?" {n}Теодора задирает бровь.{/n} "Преступный мир {g|Encyclopedia:Calixis}Каликсиса{/g}
    — не то же самое, что дикая планета на границе региона..."'
  speaker: Theodora von Valancius
- guid: e9526287-9a35-44d8-b35f-240db83ea8ce
  event: PRL_TheodoraFirstConversation_12
  text: '{n}Теодора издевательски смеется.{/n} "Как удобно! До тех пор, пока один из этих слуг не вообразит, что так{mf|ого|ую}
    госпо{mf|дина|жу} не столь уж и сложно сбросить, восстановив на {mf|его|ее} место кого-то более удобного".'
  speaker: Theodora von Valancius
- guid: 1b43b60d-3258-43e1-a540-c4148a4da86a
  event: PRL_TheodoraFirstConversation_13
  text: '"Перевозка, развертывание, вся волокита с {g|Encyclopedia:AdeptusAdministratum}Адептус Администратум{/g}... и все
    ради непредсказуемого результата. Люди, особенно плохо снаряженные и обученные, хрупки — особенно против малоизученного
    противника".'
  speaker: null
- guid: 32c5b857-fafb-452e-ab26-57a907605bd1
  event: PRL_TheodoraFirstConversation_14
  text: '{n}Теодора прищуривается.{/n} "Как именно ты собираешься обращать людей, мажущих голые тела собственным дерьмом и
    швыряющихся копьями при первом виде чужаков? Твое прошлое вмешивается в суждение о текущем — напрасно".'
  speaker: Theodora von Valancius
- guid: a3b446da-61c8-4e92-9b12-d0be2e3ff0ef
  event: PRL_TheodoraFirstConversation_15
  text: '"Феноменально... и сколько же, по-твоему, веков будет затухать и остывать этот огненный шар, чтобы на его поверхность
    можно было спустить геологические отряды? Если, конечно, он вообще будет остывать — это происходит далеко не всегда".'
  speaker: null
- guid: f0fbb053-0111-447c-a0fb-2d977f343d3d
  event: PRL_TheodoraFirstConversation_16
  text: '"М-м-м... личное вмешательство. Верный путь к тому, чтобы подставиться под удар". {n}Теодора рефлекторно касается
    одной из своих многочисленных {g|Encyclopedia:Augmentation}аугментаций{/g}.{/n} "Что скажешь, Эдельтрад? Тво{mf|й брат|я
    сестра} по колдовству не боится прикоснуться к опасности... в отличие от тебя".'
  speaker: Theodora von Valancius
- guid: 51f02437-69ac-45ce-9878-ab71a11fa16b
  event: PRL_TheodoraFirstConversation_17
  text: '{n}Плечи Теодоры опускаются. Она бросает на вас последний взгляд и отворачивается к Эдельтраду.{/n} "Что ж. Я разочарована.
    Не знаю, что насчет тех наследников, которых пока еще не доставили на корабль... но из присутствующих здесь особ я не
    вижу искры Вольного Торговца ни в одном".'
  speaker: null
- guid: a1236da4-4c20-4a47-8f61-713a29c745d2
  event: PRL_TheodoraFirstConversation_18
  text: '"Мое имя — Теодора фон Валанциус Массимо аф Скарус. Я — {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} на службе
    {g|Encyclopedia:Emperor}Бога-Императора{/g} Человечества, и мои права и свободы подтверждены святейшей реликвией — {g|Encyclopedia:Warrant}Торговым
    Патентом{/g}, коий хранится на этом самом корабле. Мне дарована честь вступать во тьму за пределами Империума и нести
    свет Человечества туда, где царствуют злобные и еретические силы, грозящие всем нам смертью и погибелью".'
  speaker: null
- guid: 26e17570-9f41-43b1-bad2-cc93d7910bf4
  event: PRL_TheodoraFirstConversation_19
  text: '"Прямолинейно. Мне нравится. Но тебе придется подождать. Прежде я хочу, чтобы ты уяснил{mf||а} себе кое-что".'
  speaker: null
- guid: e83726c7-939e-457a-b961-d3d9a69c0f3c
  event: PRL_TheodoraFirstConversation_20
  text: '{n}Теодора скупо улыбается.{/n} "Разъяснения. Роскошь, которую мало кто из нас может себе позволить. Я не разъясняла
    тебе детали того вопроса, который задала ранее — неспроста. За пределами {g|Encyclopedia:Imperium}Империума{/g} редко
    выпадает возможность получить данные о ситуации в избытке. Впрочем, сейчас — как раз такая возможность".'
  speaker: Theodora von Valancius
- guid: 3f9b42e1-5522-4533-9451-d77163e82205
  event: PRL_TheodoraFirstConversation_21
  text: '{n}Эдельтрад надменно вскидывает бровь.{/n} "Помимо {g|Encyclopedia:Xenos}ксеносов{/g} неизвестные планеты могут
    кишеть мириадом ужасов куда опаснее и сложнее для изничтожения. Полагаю, тебе, {name}, просто неизвестно о самом факте
    их существования".'
  speaker: Edelthrad
- guid: df6a01e9-372d-4466-bcce-20cfa7a066b8
  event: PRL_TheodoraFirstConversation_22
  text: '{n}Эдельтрад издает стрекочущий смешок.{/n} "Едва ли стоит доверять погонщикам безмозглых стад решение столь сложных
    задач — ресурсы могут быть истрачены в пропорции, геометрически обратной полученному результату... не так ли, {name}?"'
  speaker: Edelthrad
- guid: bad5eaad-2f55-49f2-b111-4b2834948ba0
  event: PRL_TheodoraFirstConversation_23
  text: '"Преступный мир Каликсиса?" {n}Эдельтрад изучает вас взглядом и поджимает губы, словно заметил нечто мерзкое.{/n}
    "Леди Теодора, вы весьма... экзотичны в том, кого приглашаете в свое общество. Или это возможность проверить свое семя
    на ересь и отсечь гниющую ветвь династического древа?"'
  speaker: Edelthrad
- guid: 5bb8817a-2a48-40b7-9c7a-54cac913c615
  event: PRL_TheodoraFirstConversation_24
  text: '{n}Эдельтрад вторит смеху Теодоры.{/n} "Расставаться с данной властью значит приглашать разгул ереси и опасного свободомыслия
    в свое окружение. Судя по лени в мышлении, ты, {name}, наверняка уже допустил{mf||а} это в своем домене".'
  speaker: Edelthrad
- guid: 30406ca1-07bc-41df-b163-ce3235de10e7
  event: PRL_TheodoraFirstConversation_25
  text: '"Ожидание может занять вечность. И, в конце концов, на подобной планете война может идти не против материального
    противника". {n}Эдельтрад взмахивает рукой.{/n} "Полки и армии не всегда решают затруднения, подобные описанным. Вряд
    ли, {name}, вам это известно".'
  speaker: Edelthrad
- guid: 8eaa53fe-39ee-4071-a6e8-e36849b0a321
  event: PRL_TheodoraFirstConversation_26
  text: '"Корабли, подобные нашему, способны покидать реальный мир и отправляться в варп — потустороннее измерение, полное
    жестоких и невообразимых сил. Проникая в него под защитой Поля Геллера, мы сокращаем маршруты, и расстояния, на преодоление
    которых обычному судну потребуются сотни лет, мы можем проскочить за месяц или неделю... порой за несколько дней или даже
    часов. Так Человечество распространилось по галактике. Так мы смогли построить Империум, раскинувшийся на миллионы звезд".'
  speaker: null
- guid: 05a914d3-ad0f-4cf1-b4ac-d697fd8ed927
  event: PRL_TheodoraFirstConversation_27
  text: '{n}Эдельтрад тонко улыбается.{/n} "Прискорбно видеть, что представитель {g|Encyclopedia:AdeptusMinistorum}Экклезиархии{/g}
    не видит грани между заблудшими душами и откровенными еретиками, чья участь — гореть в очищающем пламени {g|Encyclopedia:Emperor}Его{/g}".'
  speaker: Edelthrad
- guid: 42cef663-b488-45ec-9374-a5825f0f7c7a
  event: PRL_TheodoraFirstConversation_28
  text: '{n}Эдельтрад всем своим видом изображает вселенскую усталость.{/n} "Я не хочу даже комментировать подобное, с позволения
    сказать, предложение".'
  speaker: Edelthrad
- guid: 698a9fef-f849-4f36-9caf-beb22c0ff7d7
  event: PRL_TheodoraFirstConversation_29
  text: '"Душа псайкера — отверстые врата для Губительных сил". {n}Эдельтрад прожигает вас взглядом, цедя каждое слово сквозь
    зубы.{/n} "Едва ли подданн{mf|ый|ая} {g|Encyclopedia:Imperium}Империума{/g} надеж{mf|ен|на}, если сам{mf||а} приглашает
    скверну войти в чертог".'
  speaker: Edelthrad
- guid: 62c3c07e-8882-42f1-8901-2e8a9308c41a
  event: PRL_TheodoraFirstConversation_30
  text: '"Леди Теодора! Позвольте, разве я дал вам плохой ответ? Заветы {g|Encyclopedia:Emperor}Бога-Императора{/g} — то,
    что оберегает Человечество, и то, чему неукоснительно следует подчиняться каждому из нас. {name} не способ{mf|ен|на} даже
    запомнить простое правило, тогда как я..."'
  speaker: null
- guid: 19b0a064-d1f0-4ed3-a052-5c991c7d9edc
  event: PRL_TheodoraFirstConversation_31
  text: '{n}Выражение лица Теодоры становится кислым.{/n} "Еще од{mf|ин|на}... Пожалуй, формально это правильный ответ. Но
    не здесь. Не на фронтире. И не с теми ставками, с которыми играем мы".'
  speaker: null
- guid: cd93c2c6-82d4-4d00-baf1-3d8e8dc82d36
  event: PRL_TheodoraFirstConversation_32
  text: '{n}Эдельтрад тонко улыбается.{/n} "Леди Теодора, мне сложно понять ваше разочарование. Я с самого начала дал вам
    такой же — точнее, более развернутый и аргументированный — ответ. Заветы {g|Encyclopedia:Emperor}Бога-Императора{/g}..."'
  speaker: Edelthrad
- guid: 0a232f0d-58ba-4f1c-96b8-7196884c97a9
  event: PRL_TheodoraFirstConversation_33
  text: '"В таком случае я отправляюсь на..." {n}Вокс Теодоры снова оживает — на этот раз из него доносятся крики. Лорд-капитан
    застывает, прислушиваясь к передаче, затем кивает и вытаскивает оружие.{/n} "Мне доложили о волнениях на ближайших палубах.
    Сенешаль, если возникнет такая необходимость — прикройте новеньк{mf|ого|ую}". {n}Теодора бросает на вас взгляд.{/n} "Возможно,
    шанс проявить себя предоставится раньше, чем ты мог{mf||ла} бы подумать".'
  speaker: Theodora von Valancius
- guid: 392e46f0-63a2-4d95-a168-db102c700532
  event: PRL_TheodoraFirstConversation_34
  text: '{n}Эдельтрад бледнеет, его лицо искажается еще больше.{/n} "Дерзк{mf|ий|ая} ограниченн{mf|ый|ая} выскочка, да как
    ты смеешь..."'
  speaker: Edelthrad
- guid: 1f9a1822-35ec-4e2a-9262-4e2722c7df56
  event: PRL_TheodoraFirstConversation_35
  text: '"Эдельтрад". {n}Тон Теодоры заставляет мужчину умолкнуть.{/n} "Кажется, я дала тебе назначение на этом корабле. Так
    потрудись объяснить, почему же Старший Конгрегатор все еще торчит на офицерской палубе вместо того, чтобы проследовать
    на средние палубы и начать осмотр подотчетных отсеков?"'
  speaker: null
- guid: 92c4b3ce-2d17-449c-ab27-8b839296281c
  event: PRL_TheodoraFirstConversation_36
  text: '{n}Эдельтрад смотрит на вас с недоверием.{/n} "Даже в пастве Его существуют различия, {name}. Уясни себе это до того,
    как разоча..."'
  speaker: Edelthrad
- guid: 409d167c-8eea-4e0e-b0fa-558221354cc2
  event: PRL_TheodoraFirstConversation_37
  text: '{n}Эдельтрад склоняет голову.{/n} "Мне неугодно твое общество, {name} — и все же я вынужден мириться с подобной..."'
  speaker: Edelthrad
- guid: e654b8af-5108-459e-8e8c-2c8c565c5518
  event: PRL_TheodoraFirstConversation_38
  text: '{n}Воздух в помещении заметно холодеет. Эдельтрад смотрит на вас с хищным прищуром.{/n} "Попробуй, ничтожество. Я
    заинтригован мыслью, чем закончится твоя жалкая..."'
  speaker: null
- guid: baa3ed8d-638c-4f5f-a337-bc7c88d2d4f3
  event: PRL_TheodoraFirstConversation_39
  text: '{n}Теодора тонко улыбается.{/n} "Да... вот я и вижу проявления династической крови в твоих жилах. Жадность, рядящаяся
    в одежку гордости и самолюбия. Эдельтрад, что скажешь? Весьма отличающийся от твоего ответ, не правда ли".'
  speaker: Theodora von Valancius
- guid: 1cda6693-b434-4e0b-bb5e-559de4cf28eb
  event: PRL_TheodoraFirstConversation_40
  text: '{n}Эдельтрад бледнеет.{/n} "Возможно, я все еще незнаком со всеми нюансами службы на фронтире... но моя преданность
    {g|Encyclopedia:Emperor}Богу-Императору{/g} не допускает даже тени подобного хода мысли. Ересь, в каком бы обличье она
    не предстала, должна быть истреблена, и низменные стремления отринуты при этом деянии. Я знаю заветы — в отличие от наше{mf|го|й}
    ново{mf|го|й} знаком{mf|ца|ицы}".'
  speaker: Edelthrad
- guid: d696bfa4-08f7-474d-8ea7-c368a52cfe50
  event: PRL_TheodoraFirstConversation_41
  text: '{n}Теодора усмехается.{/n} "Основательно, хотя и самонадеянно. Мне многого стоило найти одного {g|Encyclopedia:Psyker}псайкера{/g},
    способного хорошо мне служить на протяжении многих лет, а ты говоришь о нескольких..."'
  speaker: Theodora von Valancius
- guid: 8bc359f3-4154-45a2-a97f-f74045fc3437
  event: PRL_TheodoraFirstConversation_42
  text: '{n}Эдельтрад смотрит на вас с теплотой змеи.{/n} "Санционированные псайкеры — редкое и ценное орудие {g|Encyclopedia:GoldenThrone}Золотого
    Трона{/g}. Или же ты, {name}, предполагал{mf||а} использовать еретиков, которые противны свету {g|Encyclopedia:Emperor}Бога-Императора{/g}?
    Весьма опрометчиво говорить о подобном в присутствии верных слуг Его".'
  speaker: Edelthrad
- guid: 99a2c933-0dc2-40b1-9919-ab94f53f266f
  event: PRL_TheodoraFirstConversation_43
  text: '"Я проложила маршрут до Райкада по требо..." {n}Теодора кривится. Бросает на вас пристальный взгляд и поводит плечом.{/n}
    "По очень специфической причине. Возможно, позже я раскрою тебе цели этого путешествия. Но не сейчас".'
  speaker: Theodora von Valancius
- guid: 0d4093e7-263a-41e3-b9f5-99fe6a8a511a
  event: PRL_TheodoraFirstConversation_44
  text: '"Кроме того..." {n}Теодора чуть улыбается.{/n} "Твоя {d|Encyclopedia:CharGen_MOT_GreatDeed}смелость{/d} прославила
    тебя намного больше, чем, вероятно, ты сам{mf||а} представляешь. Истинные подвиги навсегда остаются в летописи Империума
    и делают честь родословной фон Валанциус".'
  speaker: Theodora von Valancius
- guid: 0833a84d-94ad-415b-9775-beb2331f69ed
  event: PRL_TheodoraFirstConversation_45
  text: '"Кроме того..." {n}Теодора чуть склоняет голову.{/n} "Твои {d|Encyclopedia:CharGen_MOT_Mind}незаурядные умственные
    способности{/d} были отмечены в твоем профиле. Если ты найдешь способ проявить их на службе династии фон Валанциус...
    что ж. Тем лучше".'
  speaker: Theodora von Valancius
- guid: 7322410b-2c5a-48da-96d9-a823d2145549
  event: PRL_TheodoraFirstConversation_46
  text: '"Кроме того..." {n}Теодора чуть усмехается.{/n} "Даже сменив родовое имя, ты не избавишься от {d|Encyclopedia:CharGen_MOT_Glory}заработанной
    ранее славы{/d}. Надеюсь, она поможет тебе прославить и династию фон Валанциус, к коей ты отныне принадлежишь".'
  speaker: Theodora von Valancius
- guid: b5ce7cc6-b88e-4ce1-be2b-ab971fc21f5f
  event: PRL_TheodoraFirstConversation_47
  text: '{n}Теодора качает головой.{/n} "Нетерпение... мне нравятся нетерпеливые люди — они реже смиряются с обстоятельствами
    и чаще проявляют инициативу. Даже если я окончательно утвержу Эдельтрада в роли своего правопреемника, мне нужны верные
    советники. Твои навыки и знания, полученные в прежней жизни, могут быть бесценны здесь, в Просторе Коронус".'
  speaker: Theodora von Valancius
- guid: 38e20176-97ce-4a4d-9c16-81e3b7cd9831
  event: PRL_TheodoraFirstConversation_48
  text: '"Дальний — бесконечно дальний, как и ты. Однако он носит фамилию фон Валанциус, хотя и избегает пользоваться ей в
    открытую, и, технически, может являться моим наследником. Впрочем, эта перспектива для него закрыта. Войгтвир хорош на
    том посту, который занимает... по крайней мере, был хорош".'
  speaker: null
- guid: 36bf5a4a-bea9-48f2-ac9b-2102555d2c76
  event: PRL_TheodoraFirstConversation_49
  text: '{n}{g|Encyclopedia:Vox}Вокс{/g}, закрепленный на костюме Теодоры, внезапно оживает — до вас доносится только неразборчивый
    шум. Теодора морщится, касанием отключает передачу и властно кивает вам.{/n} "У меня есть некоторое время — до того, как
    {g|Encyclopedia:Navigator}Навигатор{/g} подаст сигнал к началу трансляции корабля из {g|Encyclopedia:Warp}варпа{/g}, и
    мое присутствие потребуется на мостике".'
  speaker: null
- guid: f84f19b0-471c-4e18-b280-50fa5b5ab97b
  event: PRL_TheodoraFirstConversation_50
  text: '"Все же одного права крови недостаточно, чтобы заработать высокую честь стать владельцем Торгового Патента. Тем не
    менее, твои способности и таланты могут быть весьма полезны — если не для роли Лорд-капитана, то для позиции его ближайшего
    соратника". {n}Теодора вздыхает и на мгновение задумчиво отводит взгляд.{/n} "Увы, даже подобные обязанности иногда оказываются
    не по силам тем, кто делит с тобой кровь. Кунрад Войгтвир безукоризненно служил множество лет, прежде чем совершил ошибку".'
  speaker: Theodora von Valancius
- guid: 9efc5a10-65cc-4e5d-a869-a72fa2880fe3
  event: PRL_TheodoraFirstConversation_51
  text: '"Некогда ты был{mf||а} комиссаром {g|Encyclopedia:AstraMilitarum}Имперской гвардии{/g}. Политическим офицером, не
    боявшимся смотреть в лицо смерти и отправлять на нее своих подчиненных. Решимость, вера, бескомпромиссность — все это
    дает тебе особую перспективу при взгляде на ситуации, где менее стойкий человек дрогнул бы духом. Поверь, в будущем у
    тебя будет достаточно ситуаций, когда стойкость в служении своему долгу — или интересам династии — окажется твоим козырем".'
  speaker: null
- guid: 622bdeb0-5cf5-42c3-81fd-7699ef72fa66
  event: PRL_TheodoraFirstConversation_52
  text: '"Когда-то ты и сам{mf||а} был{mf||а} Лорд-капитаном — на собственном корабле. Тебе известно все о том, как живет
    этот огромный монстр с тысячами людей экипажа. Тебе известно, как прихотливы могут быть {g|Encyclopedia:MachineSpirit}машинные
    духи{/g}, как слабовольна чернь с нижних палуб, как одно тактическое решение может повернуть исход сражения. Это бесценный
    опыт, которым обладают немногие и который в моем ремесле ценится бесконечно высоко".'
  speaker: null
- guid: 20e2fecf-1a2e-431d-bc1f-28e73811d51f
  event: PRL_TheodoraFirstConversation_53
  text: '"Твое дворянское положение означает, что власть — в самой твоей плоти и крови. Ты никогда не усомнишься в своей правоте,
    не проявишь слабость, не выдашь свое волнение или страх невольным жестом или словом — по крайней мере если тебя воспитывали
    с тем же тщанием, что и меня когда-то. Перед тобой будут пресмыкаться губернаторы, командующие, высокородные {g|Encyclopedia:Navigator}навигаторы{/g}
    и самодовольные лорды — нельзя допустить, чтобы они почувствовали слабину в том, кто стоит над ними".'
  speaker: null
- guid: 51e86d0e-ec97-4890-9888-11701070fe44
  event: PRL_TheodoraFirstConversation_54
  text: '"Твое прошлое едва ли можно назвать безукоризненным образцом достойного служения Империуму, однако..." {n}Теодора
    позволяет себе лукавую улыбку.{/n} "Меня интригует человек с подобной судьбой. Выжить и преуспеть между строк законов
    — достижение, которым мало кто может похвастаться в нашем кругу. Ты знаешь, как рисковать и срезать углы — поверь, у тебя
    найдется немало возможностей применить этот талант на службе династии".'
  speaker: Theodora von Valancius
- guid: 5915e605-67f3-4bb4-9e90-f95d8729512e
  event: PRL_TheodoraFirstConversation_55
  text: '"Служба в {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g} — испытание, живым из которого выходят очень немногие.
    Подняться в иерархии Имперской гвардии, стать командиром армии — свидетельство твоей прозорливости не только на поле боя,
    но и в хитросплетениях офицерских интриг. Поверь, окружение Вольного Торговца даст тебе немало шансов проявить и свои
    дипломатические навыки, и боевую подготовку".'
  speaker: null
- guid: 29da0d31-e6be-40f7-aea1-17bf76b3153c
  event: PRL_TheodoraFirstConversation_56
  text: '"Священник {g|Encyclopedia:AdeptusMinistorum}Адептус Министорум{/g}... не могла бы и подумать, что один из моего
    рода окажется в таком положении. Не надо изливать мне догмы Экклезиархии о скромности и служении — я прекрасно знаю, что
    подобные тебе ориентируются в логистических операциях не хуже зануд из {g|Encyclopedia:AdeptusAdministratum}Администратума{/g}.
    Когда торговые интересы прикрыты чаяниями о душах Человечества, любой твой поступок будет вызывать куда меньше вопросов,
    чем мог бы".'
  speaker: null
- guid: f519652e-a024-4c16-9330-5226d16ff5e1
  event: PRL_TheodoraFirstConversation_57
  text: '"В твоем профиле указано, что на тебе лежит печать колдовства... впрочем, колдовства санкционированного, дозволенного
    к служению Империуму. Я привычна к присутствию рядом со мной {g|Encyclopedia:Psyker}псайкеров{/g} — более того, я весьма
    ценю их уникальные способности. Возможно, поэтому я так заинтригована в кандидатуре Эдельтрада — колдун-Вольный Торговец
    может стать по настоящему великим. Однако псайкеры хрупки — и лучше у меня будет замена, если с Эделем что-то произойдет".'
  speaker: null
- guid: 310de460-419a-4324-9087-74de75ba37c8
  event: PRL_TheodoraFirstConversation_58
  text: '{n}Теодора изгибает бровь.{/n} "В каком законопаченном офицерском отсеке ты служил{mf||а}, если мне нужно объяснять
    подобные вещи?"'
  speaker: Theodora von Valancius
- guid: 6dcd64d5-f529-4319-b5ce-99bc3d0e0294
  event: PRL_TheodoraFirstConversation_59
  text: '{n}Теодора качает головой.{/n} "Иногда я забываю, что люди, не имевшие прямого доступа к корабельному мостику, могут
    не иметь ни малейшего представления о том, как наше судно путешествует среди звезд".'
  speaker: Theodora von Valancius
- guid: cd66c5b9-1e9a-4bca-92bb-36b89597a16b
  event: PRL_TheodoraFirstConversation_60
  text: '"К нам присоединил{mf|ся|ась} втор{mf|ой|ая} кандидат{mf||ка}". {n}Сухой женский голос и жгучее ощущение, что на
    вас смотрят, заставляет вас перевести взгляд на Теодору. {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} взирает на вас
    в упор, и взор ее подобен ей самой — хищен и тяжеловесен.{/n} "{name}, подойди и дай мне ответ".'
  speaker: null
- guid: dc458c63-6a71-4e34-9fa4-a80fb3b1c1b3
  event: PRL_TheodoraFirstConversation_61
  text: '"Смотри. Изучай. Впитывай. Тебе понадобится время, чтобы освоиться на корабле и в своем новом положении. Со временем
    я найду для тебя подходящий пост — так же, как я нашла позицию и для Эделя. До тех пор — считай себя моим помощником".'
  speaker: null
- guid: ee5b5871-2d0f-44f9-bf8e-1de9add422ef
  event: PRL_TheodoraFirstConversation_62
  text: '"Система Райкад, владения Вольного Торговца Винтерскейла — одного из моих коллег... и соперников. В {g|Encyclopedia:KoronusExpanse}Просторе
    Коронус{/g} есть еще два Вольных Торговца, и каждый из них располагает ресурсами, сопоставимыми с моими. Быть может, ты
    когда-нибудь поспособствуешь тому, чтобы превзойти их обоих в богатстве и величии".'
  speaker: null
- guid: afc69d39-599f-4451-93fc-0fddd0a41993
  event: PRL_TheodoraFirstConversation_63
  text: '"Вот как? Возможно, техноматы были неосторожны при обслуживании. Или же варп играет шутки с нами, невзирая на Поле
    Геллера. Или же истории про одержимый корабль все же имеют под собой основание". {n}Теодора беспечно смеется.{/n}'
  speaker: Theodora von Valancius
- guid: 82c663cc-400d-4eb2-b146-5c8b099cfb8a
  event: PRL_TheodoraFirstConversation_64
  text: '{n}Седовласый офицер бросает на Вольного Торговца взгляд, в котором читается осторожная укоризна.{/n} "Леди Теодора,
    ради Бога-Императора... неужели теперь и вы начнете повторять досужие слухи, что разносит необразованная чернь?"'
  speaker: null
- guid: de3521f5-361d-4173-89e7-62bdbae4cacb
  event: PRL_TheodoraFirstConversation_65
  text: '"Довольно, Абеляр! Подобная болтовня развлекает меня — Идира охотно пересказывает мне все, что нашептывают ее невидимые
    советники". {n}Теодора поворачивается к вам.{/n} "Этот корабль воистину древен. В нем достаточно потаенных уголков, вышедших
    из строя {g|Encyclopedia:Cogitator}когитаторов{/g} и выведенных из эксплуатации отсеков, чтобы неразумные люди начали
    болтать о призраках, обитающих в переборках и строящих козни пока еще живым людям".'
  speaker: Theodora von Valancius
- guid: 4ddf8dd4-0ff4-4c9e-ad7d-d53cbb32b647
  event: PRL_TheodoraFirstConversation_66
  text: '"Не задавать подобных вопросов. Мне не нужны подхалимы. Я сделаю необходимые выводы о твоей кандидатуре, когда тебе
    представится возможность проявить себя. Когда эта возможность появится — ведомо только Богу-Императору".'
  speaker: null
- guid: b9ce1a00-e981-4721-acb3-c56cb3d66a45
  event: PRL_TheodoraFirstConversation_67
  text: '"Пока ты думаешь над ответом, Эдельтрад, я хочу поговорить кое с кем другим. Может быть, мне дадут ответ интереснее,
    чем невразумительное мычание". {n}Теодора кивает в вашу сторону.{/n} "Подойди".'
  speaker: Theodora von Valancius
- guid: 350bb478-7c05-482e-98d4-0d586c809916
  event: PRL_TheodoraFirstConversation_68
  text: '"Только я решаю, как мне поступать с тем, что я обнаружу за пределами исследованной пустоты. Каждый мир, открытый
    мной, принадлежит мне вместе со всем, что на нем есть — ресурсами, людьми, сокровищами и тайнами. Я распоряжаюсь миллионами
    судеб, правлю множеством планет, владею богатствами, о которых не может помыслить ни один планетарный губернатор или командующий.
    И ты, {name} — од{mf|ин|на} из тех, в чьих жилах есть след крови фон Валанциус и кто может претендовать на получение этого
    наследства, когда придет время".'
  speaker: null
- guid: 3c033735-c790-4157-ae80-46fbf73c35b5
  event: PRL_TheodoraFirstConversation_69
  text: '"Представь себе гипотетическую ситуацию. Айон-VI. Новый мир на границе Простора Коронус. Высокая сейсмическая активность,
    регулярные изливы магмы, залежи метаморфических руд, перспективы широкомасштабной добычи. Мир населен аборигенами, поклоняющимися
    неким еретическим "подземным духам", которые защищают всех, кто приносит им жертвы. Казалось бы, выдумки. Но попытка установить
    рудные экстракторы провалилась уже во второй раз — команды добытчиков просто исчезли за одну ночь на поверхности планеты.
    Вопрос... что бы ты сделал{mf||а} с этим отравленным сокровищем?"'
  speaker: null
- guid: 870e7646-f0ce-478f-8321-0626a6f2b91e
  event: PRL_TheodoraFirstConversation_70
  text: '"Прошу меня простить, Леди Теодора. Ваше присутствие оказывает на меня столь ошеломляющий эффект, что я забыл о времени".
    {n}Эдельтрад церемонно откланивается и, не одарив вас ни взглядом более, разворачивается и удаляется.{/n}'
  speaker: Edelthrad
- guid: 153da55b-72ee-4fda-8abd-bf9747388de6
  event: PRL_TheodoraFirstConversation_71
  text: '{n}Теодора провожает взглядом удаляющегося наследника. Затем она поворачивается к вам.{/n} "Итак, {name}. Зачем ты
    здесь?"'
  speaker: Theodora von Valancius
- guid: 6d891359-53cd-479a-a199-d5c544c4fb15
  event: PRL_TheodoraFirstConversation_72
  text: '"Ты так долго охотил{mf|ся|ась} на нарушителей закона, что теперь повсюду их ищешь. Ожидая встретить на Айоне-VI
    лишь одну конкретную угрозу, ты окажешься бессил{mf|ен|ьна} перед другими врагами, которые могут оказаться и не людьми
    вовсе".'
  speaker: null
- guid: b1865828-d877-4c0e-b1c2-19aff22b8641
  event: PRL_TheodoraFirstConversation_73
  text: '"Ты был{mf||а} удостоен{mf||а} звания маршала Адептус Арбитес, а это не просто титул. За ним стоят десятилетия опасной
    службы, десятки вынесенных приговоров и образцовая верность Империуму. Твое знание законов и страх, что ты способ{mf|ен|на}
    внушать — это путь к поддержанию порядка в протекторате. Впрочем, не только подданные династии должны знать, сколь сурово
    правосудие, — многочисленных конкурентов, что покушаются на наши владения, тоже надо держать в узде".'
  speaker: null
- guid: 8532a7d9-03c4-46b1-b9b9-889e87b30faa
  event: PRL_TheodorasFate_01
  text: '"Не-е-ет!!" {n}Истошный вопль Идиры сотрясает стены. Женщина падает на колени, вздрагивая от рыданий.{/n} "Я... я
    не слышала, Лорд-капитан! Ничего не слышала! Ни шепотка, ни вздоха! Там было... было так громко! Почему я не предвидела?!"'
  speaker: null
- guid: abada903-ebd9-44f0-afe1-5066224cd195
  event: PRL_TheodorasFate_02
  text: '{n}Потрясенный Абеляр делает несколько шагов вперед, после чего тяжело опирается о край стола. Взгляд офицера прикован
    к бездыханному телу.{/n} "Лорд-капитан... да кто же посмел... неужели... крыса Войгтвир..."'
  speaker: null
- guid: 268d9256-cc73-41d0-aa3b-e6258394189b
  event: PRL_TheodorasFate_03
  text: '"Все могло решиться в пылу боя. Тем более здесь был Морт, он защищал бы Леди Теодору до последнего".'
  speaker: null
- guid: 669dd63c-f69f-43d0-be79-f34babffeb08
  event: PRL_TheodorasFate_04
  text: '{n}Сенешаль проводит рукой по лицу.{/n} "Сначала — предательство, теперь — убийство {g|Encyclopedia:RogueTrader}Вольного
    Торговца{/g}... и Морта!"'
  speaker: null
- guid: 941dc75d-b27a-452c-b7a1-5a18541328ed
  event: PRL_TheodorasFate_05
  text: '{n}Идира всхлипывает и поднимается на ноги, после чего начинает рассеянно оглядываться.{/n} "Я... могу посмотреть
    на вещи. Особым взглядом. Если найдется что-то... что-то, на чем может быть отпечаток убийцы... просто дайте мне этот
    предмет — и я попробую разглядеть тайны, что он скрывает!"'
  speaker: Idira Tlass
- guid: 1fe04930-db27-4433-822f-a87b0aef8936
  event: PRL_TheodorasFate_06
  text: '{n}Идира содрогается всем телом.{/n} "Это работает не так. Я могу попробовать прочитать память предметов... но мертвецы
    — совершенно другое. Для подобного нужна будет ее душа... после того, что мы видели на офицерской палубе, я не рискну
    искать ее в {g|Encyclopedia:Warp}варпе{/g}".'
  speaker: Idira Tlass
- guid: 4600d43a-b20c-4a5a-82a0-d5dc2470fba8
  event: PRL_TheodorasFate_07
  text: '{n}Идира зачерпывает пригоршню осколков и сжимает пальцы — так, что из ее сомкнутого кулака сочатся капли крови.{/n}
    "Я вижу... переливы, сияние, синие огни... лица... ближе... Леди Теодора... еще... Кунрад... еще... что это? Ай!" {n}Псайкер
    испугано встряхивает рукой.{/n} "Что-то темное... огромное... ох, недобрая это была вещь, {name}!"'
  speaker: Idira Tlass
- guid: 06545c2c-a9c5-401e-a923-77db8d71b5dc
  event: PRL_TheodorasFate_08
  text: '"Идира". {n}Абеляр протягивает руку и кладет ее на плечо мечущейся женщины.{/n} "Ты не вернешь ее. Оставь".'
  speaker: Abelard Werserian
- guid: 0879a541-6883-42ea-897d-470d3a03f045
  event: PRL_TheodorasFate_09
  text: '"Нет! Погодите! Давайте посмотрим, что мы можем найти..."'
  speaker: null
- guid: 6447cc04-76de-4d86-b0b5-c3a5f38fac8e
  event: PRL_TheodorasFate_10
  text: '"И ты так легко сдаешься, старик?! Ладно святоша, у нее сердца нет, но ты?! Как бы не так! Я докопаюсь до того, кто
    виновен в смерти Лорд-капитана! Докопаюсь и тогда..." {n}Идира сжимает кулаки.{/n} "Этот ублюдок пожалеет о том, что родился
    на свет!"'
  speaker: Idira Tlass
- guid: 81035145-5f24-453d-943c-fa45b0658651
  event: PRL_TheodorasFate_11
  text: '"Ведьмовская скверна..." {n}Вы так и не понимаете, кому был адресована реплика Ардженты — стеклянным осколкам или
    самой Идире.{/n}'
  speaker: null
- guid: e8aa6be1-5c49-4094-a0ad-bc8578657671
  event: PRL_TheodorasFate_12
  text: '{n}{g|Encyclopedia:AdeptaSororitas}Сестра Сороритас{/g} обводит открывшуюся картину взглядом, задержав его на теле
    архмилитанта.{/n} "{g|Encyclopedia:Emperor}Император{/g}, прими души верных..."'
  speaker: null
- guid: fed48113-aa7e-4219-9ace-53f1ddac9766
  event: PRL_TheodorasFate_13
  text: '"Как Морт мог оплошать? Архмилитант был выходцем с мира смерти, у него были молниеносные рефлексы..."'
  speaker: null
- guid: f919e4d4-4eda-4a20-9eea-54e299785de5
  event: PRL_TheodorasFate_14
  text: '"Да. Не терпится снова окунуться в горнило битвы!"'
  speaker: null
