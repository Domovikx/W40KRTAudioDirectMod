name: Соломон Антар
gender: M
role: Арбитр
age: ''
personality: суровый, справедливый, неподкупный
voice: eugene
gemini_voice: Orus
sound_keys:
- Solomorne
- Solomorn
total_phrases: 486
phrases:
- guid: 60c8bb02-40a3-4419-a863-57f365e6af4d
  event: ArbitesAfterSex_Solomorne_01
  text: '"Та штука, которую ты делал{mf||а} в самом конце... Не уверен, что это не нарушает закон".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 90c61f41-3942-4aa3-8cdb-1fdb21708121
  event: ArbitesAfterSex_Solomorne_02
  text: '"Приятно осознавать, что я еще в форме".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3f6f7d05-8c65-48ed-ace4-5f0e0e6ddd64
  event: ArbitesAfterSex_Solomorne_03
  text: '"Признаться, не думал, что назначение на корабль Вольного Торговца принесет такие приключения".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 29132f11-55a5-4942-8c3d-4482a98d7ce0
  event: ArbitesAfterSex_Solomorne_04
  text: '"Угнаться за тобой тяжелее, чем за самыми отпетыми преступниками Каликсиса".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0c640b8c-910c-47c5-8205-c5f7a20f4443
  event: BNTRS_Companion_DLC3_Solomorne_118
  text: '"Ты ведешь себя слишком самоуверенно для того, кто сам по уши в ереси, техножрец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3286f191-7a4a-4df9-ae9c-6b113baab30a
  event: BNTRS_Companion_DLC3_Solomorne_20
  text: '"Глейто — это верный и надежный инструмент поиска и наказания. Остальное не имеет значения".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cc90bc29-3dbb-4cec-a235-00d0005b2862
  event: BNTRS_Companion_DLC3_Solomorne_45
  text: '"Я слежу за тобой, еретек. Лишь протекция Вольного Торговца защищает тебя от правосудия Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c74a6bfa-8fc9-4552-a592-b3dec7419ca0
  event: BNTRS_DLC2_Solomorne_02
  text: '"А вы просите офицеров сдать оружие, потому что оно пугает чернь? Если нет, то вопрос закрыт".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 476ce948-3e51-4b76-bf7b-33a83d02e2f4
  event: BNTRS_DLC2_Solomorne_04
  text: '"Мой сон хранит Лекс Империалис, сестра. Пока я служу закону Его, я не знаю сомнений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2da0213d-3952-4e2c-993a-557e00075f13
  event: BNTRS_DLC2_Solomorne_06
  text: '"Вы как-то спросили, что я люблю читать, и я обещал поделиться книгами. Охотно обсужу с вами поправки в законах за
    прошлые два столетия — по-моему, этот период наиболее интересен".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6dcbb79c-808e-4116-9e60-d3a5e6702063
  event: BNTRS_DLC2_Solomorne_08
  text: '"Нет, господин дознаватель. Опасные для порядка нарушения я устраню сам, а более мелкие недостойны вашего внимания".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2f72899d-4b8f-4ac5-a1e5-c35886099cdc
  event: BNTRS_DLC2_Solomorne_10
  text: '"Не угадала: я просчитывал, насколько легко изолировать это место, если пьяная ведьма слетит с катушек".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 25a15b58-88b7-4fbf-a485-abd80efbe927
  event: BNTRS_DLC2_Solomorne_100
  text: '"Вам, Версериан, не приходило в голову, что есть вещи выше выгод династии? Торжество закона Императора и неотвратимость
    правосудия, например".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 94a90408-805c-47b3-bdc6-b6c56ddde640
  event: BNTRS_DLC2_Solomorne_110
  text: '"Вультур просчиталась, решив, что контроль над маршалом дает и власть над Лекс Империалис. Закон Императора нельзя
    ни обмануть, ни подкупить, ни исказить".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4cfee753-3b68-4455-bca7-32ad5a0a0470
  event: BNTRS_DLC2_Solomorne_112
  text: '"Они это сделают, но по своим причинам: избрание нового префекта ввергнет чиновников в бумажный кошмар. Администратум
    не захочет повторения ситуации".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 72b2a2bb-fdd5-4156-8f01-5a875f4bf7ad
  event: BNTRS_DLC2_Solomorne_115
  text: '"Арбитес понесли потери, и это не упрощает выбор. Пост должен занять достойный, а не вынужденная кандидатура".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ab9a1504-f6c7-4dbd-890f-8a7dea481861
  event: BNTRS_DLC2_Solomorne_118
  text: '"Я не обсуждаю приказы, ведьма, и без колебаний делаю то, что должно. Мне достаточно и того почета, что Вольный Торговец
    велел{mf||а} мне избрать маршала".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4a293892-8bb7-4972-b746-f4afa8c7665a
  event: BNTRS_DLC2_Solomorne_12
  text: '"Твоего обаяния не хватит даже на мой мизинец, торговка. Просто ты слишком мелкая преступница, чтобы арбитр тратил
    на тебя время".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a46b9940-38ab-4bae-8e67-62044b8e88a1
  event: BNTRS_DLC2_Solomorne_124
  text: '"Спасибо, Паскаль. Жаль, что в моей голове нет шестеренок, чтобы ты при необходимости мог туда залезть и починить,
    как чинишь Глейто".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: db2995c3-c78d-424b-a448-f9da3205fd20
  event: BNTRS_DLC2_Solomorne_133
  text: '"Об этом пока рано говорить, внутренний регламент Арбитес предусматривает довольно долгий переход в новый ранг. Многое
    может измениться к моменту, когда получу назначение".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f749ac9e-cdf8-45f0-8efe-e6ef416787a3
  event: BNTRS_DLC2_Solomorne_136
  text: '"Учитывая, как мало осталось арбитров в Просторе, вполне вероятно, что и для маршала найдется боевая миссия".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f98fd505-f0ce-4f55-af8a-45ff236ca51f
  event: BNTRS_DLC2_Solomorne_139
  text: '"Нет, Версериан, есть только закон Бога-Императора, и я подчиняюсь лишь ему. Странно, что вы хоть на миг могли подумать
    иначе".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8f8b04b0-5507-4e06-bf83-5868085a676d
  event: BNTRS_DLC2_Solomorne_14
  text: '"Потому что я не казню, надышавшись дурмана. Не делаю из приговора кровавую пляску. И мое право судить дано мне Империумом,
    а не подпалубной сектой".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 687b17ba-0815-47f9-b07a-3baa4deb22b4
  event: BNTRS_DLC2_Solomorne_16
  text: '"С той, из которой растут твои руки, выродок".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3b03d0bc-682f-4b32-a0f5-8ea561d69582
  event: BNTRS_DLC2_Solomorne_160
  text: '"Так выглядит множество миров Империума, Леди Кассия. Вам стоит поскорее к этому привыкнуть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 469bdca8-e625-475f-86a6-89806460ab4f
  event: BNTRS_DLC2_Solomorne_166
  text: '"Для тебя он и правда один — посмотреть, держа руки на виду, и почтительно отойти от священной десятины".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5880fdb1-d5dd-4b94-b5c7-7a8f357c916a
  event: BNTRS_DLC2_Solomorne_168
  text: '"Паскаль, ты последний, кого я бы хотел судить за хищение десятины. Только Вольный Торговец может забрать что-то
    отсюда ввиду своего статуса".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b2e054c1-d294-487a-b34e-f9e99cdbeee1
  event: BNTRS_DLC2_Solomorne_179
  text: '"Амбуллы. Эти твари ориентируются по вибрациям земли. Все на ящики, или мы станем легкой добычей!"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 01e4e73c-3eee-412b-be10-58e711292f45
  event: BNTRS_DLC2_Solomorne_18
  text: '"Ты прав. Металл долга в сердце, металл оружия в руках — ваши дары завершают облик правосудия".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 91fcc02e-7ce0-4482-afc7-d2b1044c543e
  event: BNTRS_DLC2_Solomorne_184
  text: '"Тебя скорее всего направят в архивы поднимать записи о техножреце, что устанавливал орудие. У тебя есть лишние лет
    десять жизни, Паскаль?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9b94ce67-4844-4553-bfcf-b728c04ae803
  event: BNTRS_DLC2_Solomorne_186
  text: '"Не сравнивай абсолют Лекса с инстинктами ксеносов. Закон Императора столь совершенен, что людям не дано его понять.
    Но всем дано следовать ему — не важно, добровольно или нет".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 54aee235-fb54-4e6f-a136-a4c99e11b012
  event: BNTRS_DLC2_Solomorne_188
  text: '"Это лишь выдержки из некоторых избранных параграфов. Сам Лекс настолько объемен, что даже все шпили Даргонуса не
    смогли бы его вместить".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d6155851-bc2d-400e-a1b6-efacaed50f14
  event: BNTRS_DLC2_Solomorne_19
  text: '"Вы кажетесь компетентным офицером, Версериан. Тем страннее, что вашим подчиненным не хватает дисциплины: вчера на
    мостик было допущено три посетителя сверх нормы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0833afd1-3387-441e-bc14-40848095df87
  event: BNTRS_DLC2_Solomorne_193
  text: '"Я встречал сотни таких, как ты, торговка. Капля власти, и вот уже ваши амбиции зашкаливают, а там и до нарушения
    Лекса недалеко. Не зарывайся — я слежу за тобой".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0801fde3-badd-435b-b245-9e341a1d8474
  event: BNTRS_DLC2_Solomorne_194
  text: '"Ты не представляешь, что несут еретики перед смертью. Глядя в дуло дробовика, они скажут что угодно, чтобы нагадить
    напоследок".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c889e46d-39e8-4be0-a2aa-508586e17abc
  event: BNTRS_DLC2_Solomorne_195
  text: '"Рад видеть, что ты воспряла духом. Мысли о незаконченном деле заметно мешают службе".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 72165d34-cf58-4d32-82c2-a47092495b8a
  event: BNTRS_DLC2_Solomorne_197
  text: '"Администратум — хребет Империума. Он скрепляет все воедино, не дает развалиться на части... Но будь я проклят, если
    не признаюсь, что был рад убраться из той очереди".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: de517159-0226-47e8-a63a-d50d2a20a73a
  event: BNTRS_DLC2_Solomorne_199
  text: '"Паскаль, не знаю, что за разногласия у тебя с соратниками-Механикус, но будь уверен — мы с Глейто разберемся с любым,
    кто поднимет на тебя мехадендрит".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 27c492c1-6d00-4580-ab05-14d54f37d74b
  event: BNTRS_DLC2_Solomorne_201
  text: '"Милосердие — ловушка для слабых духом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 34f51284-3525-49d4-801f-8f7c6aa963c5
  event: BNTRS_DLC2_Solomorne_203
  text: '"Хороший приговор — суровый и справедливый. Смерть не освобождает от ответственности".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3f8ef8f3-3aa4-4d19-a2e0-e39e5c773208
  event: BNTRS_DLC2_Solomorne_204
  text: '"Я стал перебирать в памяти все донесения о пропавших кораблях, что были за мою службу. И что-то выводы в свете новой
    информации меня не радуют..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6d99471e-c8de-4312-b046-61fae475d4c4
  event: BNTRS_DLC2_Solomorne_206
  text: '"Мое чувство прекрасного может тронуть лишь факт, что агромир выращивает ценные культуры, включенные в десятину.
    Но разные мерзкие культы почему-то растут быстрее и гуще".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a31c6fdb-8e2d-4e18-add2-5cc2e204069d
  event: BNTRS_DLC2_Solomorne_207
  text: '"Прими мои соболезнования, Паскаль. Виновные уже наказаны — пусть это послужит тебе утешением".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 46ac0288-6bdb-4aa1-871d-3d4825427bb7
  event: BNTRS_DLC2_Solomorne_208
  text: '"Знать, как всегда, думает о знати. А мои мысли занимают поставки от целой планеты, оружие и технологии, что теперь
    не получит Империум. Вот что тяжкий удар".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cd86f977-0639-4a79-8e96-971c1076ae67
  event: BNTRS_DLC2_Solomorne_21
  text: '"Ты могла бы стать арбитром, сестра. Почему наставники в Схола Прогениум направили тебя по иному пути?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fb32fd97-c4d2-4465-b312-d74a8af282e4
  event: BNTRS_DLC2_Solomorne_211
  text: '"В машинах не бывает вины — они сработали правильно. А вот люди... Как обычно подвели".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4cdfb324-3db8-4489-a1c6-67b8cc5683b9
  event: BNTRS_DLC2_Solomorne_212
  text: '"Ты только что оскорбила всех известных Человечеству змей, сестра".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6d79f078-3e4e-448a-bb28-97b016c3567e
  event: BNTRS_DLC2_Solomorne_214
  text: '"Я не могу передать омерзение от необходимости терпеть ксеноса, но Вольный Торговец в своем праве. Я стисну зубы
    и слова не скажу против положений священного Патента".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 603976cc-2ff5-4405-a4a3-0de55a46422e
  event: BNTRS_DLC2_Solomorne_215
  text: '"Впервые мы в чем-то согласны, ведьма. Я тоже в это не верю".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: eb6138fb-9356-478f-9f68-5f2f67f7ce17
  event: BNTRS_DLC2_Solomorne_216
  text: '"Ведьма была бомбой замедленного действия — рано или поздно из-за нее бы произошла катастрофа. Что же, одной проблемой
    меньше".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 74d71d3b-f194-4b0a-bc27-22ab116a2069
  event: BNTRS_DLC2_Solomorne_218
  text: '"Жестокий у вас дар, Леди-Навигатор, — я бы не хотел видеть гниль в людских душах, мне и того, что снаружи, с головой
    хватает".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 30d4fdb3-202a-414a-9295-92ce5555f9c6
  event: BNTRS_DLC2_Solomorne_219
  text: '"Обычных людей плен травмирует, истинно верующих — закаляет. А подобных тебе, культистка, делает только опаснее и
    безумней".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ce1cbcef-be9e-4e75-911f-f8f7c12dee86
  event: BNTRS_DLC2_Solomorne_221
  text: '"Ангел Императора... Будто сам наказующий перст Его воюет на нашей стороне".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6a256158-e916-4803-852e-18f78f45053f
  event: BNTRS_DLC2_Solomorne_224
  text: '"Глейто не чувствует страх, господин Ульфар. Или... вы это мне?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 64ee6661-8e9d-4e6e-830f-f018f94efc8a
  event: BNTRS_DLC2_Solomorne_225
  text: '"Ты уже приговорен за сотворенное с Даргонусом и сам факт своего существования, ксенос. То, что ты жив, — лишь отсрочка,
    не более".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 60574207-f60f-4ca6-9674-17fb0738bbff
  event: BNTRS_DLC2_Solomorne_227
  text: '"Ты виновен, Версериан, но меньше меня. Ты стар и во всем потакаешь Вольному Торговцу, я же... мне нет оправдания".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 829e4a42-e08d-470b-9afd-07e5af456509
  event: BNTRS_DLC2_Solomorne_228
  text: '"Пускай нападают. Проверим, чьи головы крепче сидят на плечах. Да, Глейто?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 75b7661e-a7c2-4b09-a1ef-ce5f0795681d
  event: BNTRS_DLC2_Solomorne_229
  text: '"Десятком местных выродков меньше. Немного — относительно преступлений этого места перед Человечеством. Но все равно
    приятно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2a051759-a977-442e-8c53-4265b8e0d049
  event: BNTRS_DLC2_Solomorne_23
  text: '"Видел несколько ваших полотен, Леди-Навигатор. Это какой-то хитрый шифр? Готов поклясться, в тех мазках нет никакого
    смысла".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8d052c66-4b85-4e6e-a333-73aa33d2009c
  event: BNTRS_DLC2_Solomorne_231
  text: '"Нет, Паскаль, радоваться смерти этого выродка — самое естественное, что только может быть в этой проклятой Императором
    дыре".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b9997b83-6a83-4805-98b5-8051adc3a44f
  event: BNTRS_DLC2_Solomorne_232
  text: '"Убив Вольного Торговца, ты преступила Лекс Империалис, сестра, и я должен был бы судить тебя, но... хорошо, что
    мне не пришлось".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1812847e-cd0e-46bf-8af5-99bc1dfcd205
  event: BNTRS_DLC2_Solomorne_233
  text: '"Скоморох-губернатор, скоморох-ксенос... Как же я, разорви меня варп, ненавижу драных шутов".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f854f6b0-d1cc-4665-964f-70e4ee698bc5
  event: BNTRS_DLC2_Solomorne_234
  text: '"Ты жив, сенешаль. Значит, дисциплина нашего отряда спасена. Единственная хорошая новость за последний час".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8b026279-0cc8-4751-b38d-be157a214cea
  event: BNTRS_DLC2_Solomorne_236
  text: '"Если Император будет благоволить нам, вывернем наизнанку и остальные части ксеносского скомороха".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3cf18edc-de1a-4e6e-b096-532700e1eaa6
  event: BNTRS_DLC2_Solomorne_237
  text: '"Их ошибка. Назад я не вернусь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: eb8837d8-e785-4fab-aff0-bbb39289e9ee
  event: BNTRS_DLC2_Solomorne_238
  text: '"Когда я искал Глейто, какой-то человек сказал мне, что город ксеносов необъятен и непостижим. Кажется, я ему в ярости
    голову свернул — ну, хотя бы не солгал перед смертью".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 62445e88-90d2-43d4-b114-b83fef38ecf2
  event: BNTRS_DLC2_Solomorne_240
  text: '"Мы должны исправить это, Паскаль, когда... если выберемся. Целиком полагаюсь на тебя".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c7e607fd-8508-4a1b-84f1-a003bc9a6cc1
  event: BNTRS_DLC2_Solomorne_241
  text: '"Ксеносский мясник не смог сломать вас, Леди-Навигатор. Ваша стойкость поражает".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 26287a3b-5323-4d45-8892-6c6f27de0e4f
  event: BNTRS_DLC2_Solomorne_243
  text: '"Вас жестоко пытали, господин дознаватель. Позвольте мне идти впереди и закрывать вас от ударов — вы слишком ценны,
    чтобы рисковать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e6a54306-79e7-453b-a149-4adbc6452f2c
  event: BNTRS_DLC2_Solomorne_245
  text: '"Ты еще можешь избавить нас от своего присутствия, ксенос, и напороться на клинок своих собратьев где-то в темном
    переулке. Если, конечно, твой вид хоть что-то знает о чести и виновности".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 25059c0e-940d-48ec-a319-6606e44f86e9
  event: BNTRS_DLC2_Solomorne_248
  text: '"В отличие от тебя я не бегу от долга. Так что сдавайся наконец и становись достойной подданной Империума".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 13c25c30-2edd-44a2-a176-5f53e49bf3f7
  event: BNTRS_DLC2_Solomorne_249
  text: '"Даже здесь ты сияешь, сестра. Не сдалась, не отчаялась... Мне стыдно, что я оказался слаб и не встал с тобой плечом
    к плечу с самого начала".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a95de4e3-67b5-4071-98dc-07204d6b2221
  event: BNTRS_DLC2_Solomorne_25
  text: '"Господин дознаватель, могу ли спросить, с какой целью вы недавно проверяли мое знание законов сектора?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4f2e330c-e533-4931-906a-9fb3e26ca136
  event: BNTRS_DLC2_Solomorne_251
  text: '"Трон меня разрази, какая же ты живучая, ведьма..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0d19fec9-8b2d-42b6-8e21-9b358624fc22
  event: BNTRS_DLC2_Solomorne_253
  text: '"Могу приказать Глейто укусить тебя, ведьма, тогда ты точно поймешь, что не спишь. Ну как, уже взбодрилась?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dce3b3a6-90d7-45fe-ab43-a2f96e37d696
  event: BNTRS_DLC2_Solomorne_254
  text: '"Экипаж ненавидит ксеноса. Обычно я пресекаю разговоры на постах, но только последняя сволочь не даст людям от души
    попроклинать нелюдя".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 043d7e89-c1c7-41e5-80e0-3de61a2f6558
  event: BNTRS_DLC2_Solomorne_255
  text: '"Навигаторы извлекли пользу для Империума из вашего нечестивого существования. Учитывая статус Навис Нобилите и прочие
    обстоятельства, я бы не назвал произошедшее нарушением Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a7aebd0e-afcb-46ab-9a98-aaebc5b6a48d
  event: BNTRS_DLC2_Solomorne_256
  text: '"С этим устройством ты не перестала быть ведьмой. Даже хуже — я затрудняюсь сказать, во что тебя превращает ксеносская
    удавка".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f938915f-fb08-44d4-bf2c-b21957fe83cb
  event: BNTRS_DLC2_Solomorne_257
  text: '"То дело на Даргонусе напомнило мне расследования на одном каликсийском мире-улье, Благочестии. Не сказать, чтобы
    я по ним скучал, однако идти по следу преступника — приятное занятие..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9d4f42f3-155e-4643-9799-2b072cecdb94
  event: BNTRS_DLC2_Solomorne_259
  text: '"Вот, значит, куда завели тебя твои поиски, Паскаль. Даже не знаю, тот ли ты еще человек, что латал Глейто, или уже
    кто-то совершенно иной".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7b19ca8c-d63b-450d-9792-5295b6bbf09b
  event: BNTRS_DLC2_Solomorne_261
  text: '"Это не суд, а фарс. Виновные давно скрылись, пока она давила трущобных крыс".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c8539d52-7c7b-4471-9b88-c94cdc996d1f
  event: BNTRS_DLC2_Solomorne_262
  text: '"Наглядное доказательство того, что над людьми должен стоять лишь закон Императора. Не закон человека, каким бы праведным
    он себя ни мнил".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2895e56a-c50b-42de-a886-3365c2e5dbc5
  event: BNTRS_DLC2_Solomorne_265
  text: '"Если не брать во внимание методы Чорда, она может обеспечить порядок, а он сейчас нужен станции больше регенераторов
    воздуха".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 114dea25-8545-4d93-bfc2-76a3493476c5
  event: BNTRS_DLC2_Solomorne_266
  text: '"Если Владайм идиот, то продолжит клянчить помощь у Вольного Торговца. Если нет — мы еще долго ничего от него не
    услышим".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 62ffe346-6648-4fbc-8bfa-38c026613de7
  event: BNTRS_DLC2_Solomorne_267
  text: '"Среди династии Чорда и припоминать-то толком некому — у Инцендии нет наследников. И потом, священный Патент, как
    ни удивительно, не запрещает Вольным Торговцам воевать друг с другом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c3178d71-58d6-4fa8-8184-bd09b6ac1698
  event: BNTRS_DLC2_Solomorne_268
  text: '"Если в наследниках Винтерскейла сильна его порченная кровь, то воцарится тот, кто переживет бойню за наследование".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 98d62825-64f0-48da-96d2-27789156471e
  event: BNTRS_DLC2_Solomorne_269
  text: '"Надеюсь, однажды вы попереубиваете друг друга, отродья. Должен же быть хоть какой-то толк в вашем существовании".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b10a5659-4ff6-4604-b91a-e2923791e162
  event: BNTRS_DLC2_Solomorne_27
  text: '"Каждый раз, как тебя вижу, рука к оружию тянется. Ничего личного, просто не привыкну, что ведьме дозволено жить".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fd3da71d-d28a-49a9-94be-c824a3a769af
  event: BNTRS_DLC2_Solomorne_270
  text: '"Тебе есть чему у него поучиться: не обязательно нести все, что приходит в голову, особенно — в твою голову, ведьма".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: eb23eb64-9f80-4198-9c96-dc2f3e11b903
  event: BNTRS_DLC2_Solomorne_271
  text: '"Святой Трон... Глейто, цель — Паскаль, частичное сопровождение и охрана. Если ты и убьешься о свое познание, то
    не в мою смену".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3e21808e-1d5e-4a81-bd23-6055c4c5b1c7
  event: BNTRS_DLC2_Solomorne_272
  text: '"Как удивительно осознавать, что Ангелы Императора смертны... Хотя, кто знает наверняка, что Бог Человечества уготовил
    для своих детей после смерти?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 395f35d4-b2ab-4628-9c56-3fd235755d2a
  event: BNTRS_DLC2_Solomorne_273
  text: '"Для бойца нет большей чести, чем погибнуть, исполняя долг. Никакого траура — только вечная слава".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b00d55d7-beb0-4c94-ad46-6f416b0ca309
  event: BNTRS_DLC2_Solomorne_275
  text: '"Он правильно сделал, что высунулся — вне своего проклятого города, с меньшими силами и на чужой территории он практически
    дал себя прикончить. Почаще бы нелюди так поддавались".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 802eabae-6dfc-48ec-a5f0-d5f3ec138980
  event: BNTRS_DLC2_Solomorne_276
  text: '"Ритуалов ухаживаний высокородных господ мне не понять, но я вижу определенную красоту в том, как все строго подчинено
    регламенту".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8cc855e7-3af1-44de-9edc-10eac34b28aa
  event: BNTRS_DLC2_Solomorne_277
  text: '"Знаете, как у нас говорят, господин дознаватель. Если промахнулись в первый раз, всегда есть другие патроны в магазине".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c9eb743c-1b94-48fa-9aa7-383c97f4639f
  event: BNTRS_DLC2_Solomorne_279
  text: '"Господин дознаватель, вынужден спросить прямо: Вольный Торговец и вы состоите в неслужебных отношениях?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d60de84f-1cb6-4109-a568-34c8d9bf1484
  event: BNTRS_DLC2_Solomorne_281
  text: '"Решила побыть у меня костью в горле, торговка? Уйми свою жадность, Вольный Торговец уже даровал{mf||а} тебе протекцию,
    не претендуй на большее".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ad4f9ebf-a23b-4282-832a-a2ec7c61b482
  event: BNTRS_DLC2_Solomorne_283
  text: '"Тень, щит, клинок, а теперь еще кто — фаворитка? Для покорного инструмента ты слишком стараешься занять место, неподобающее
    слуге".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 920ba08d-220f-4a1f-b89f-25d7b9988335
  event: BNTRS_DLC2_Solomorne_285
  text: '"Будьте тверже, Леди-Навигатор. Выродок хочет, чтобы вы боялись — не давайте ему этого удовольствия".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c34c5deb-3ecc-48c6-b1e7-931662d237b1
  event: BNTRS_DLC2_Solomorne_286
  text: '"Прекрати свои игры, ксенос. Вольный Торговец не так{mf|ой|ая}, как ты. И никогда не будет".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 114345b4-b48f-41fa-8a3c-fb45ffb1908d
  event: BNTRS_DLC2_Solomorne_29
  text: '"У тебя отличное тактическое мышление, и ты эффективно действуешь в бою. Ты могла бы достичь многого на службе Империуму,
    но растрачиваешь себя впустую".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1279a72e-c4f8-42a3-8f94-84df946a09d9
  event: BNTRS_DLC2_Solomorne_292
  text: '"Будьте уверены, моя текущая служба на корабле важна, и я исполняю ее со всем рвением".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d6cbd0d6-93f5-4dd5-b1fa-6877a8c4e598
  event: BNTRS_DLC2_Solomorne_294
  text: '"Ты всего лишь развлечение, экзотика сомнительного вида для недавно пришедшего к власти Вольного Торговца. Знай свое
    место".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2e1ad230-486d-43f2-aa4a-c24f5be9ce02
  event: BNTRS_DLC2_Solomorne_296
  text: '"Вольный Торговец и ксенос-предательница. Чем она заслужила жизнь и место в ближайшем кругу? Я просто отказываюсь
    понимать происходящее. Упади на нас небо, я и то бы был меньше растерян".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 758cdec2-7f99-4b0b-91b2-8aa35f1d7f2b
  event: BNTRS_DLC2_Solomorne_299
  text: '"Выше нос, торговка. Испытания закаляют — может, этот мир выбьет из тебя порок-другой".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 64b545f5-511b-422a-964c-1b57c7a146b0
  event: BNTRS_DLC2_Solomorne_300
  text: '"Может, дело в паранойе после многих лет службы, но я не люблю тишину. Особенно такую... Абсолютную".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bc3bffd3-ecf3-4df6-be12-99e0c2aa8919
  event: BNTRS_DLC2_Solomorne_301
  text: '"Сказал бы, что это удобное место для допроса псайкеров, но... Мне тут не по себе. Лучше бы нам убраться и забыть
    сюда дорогу".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fc3d20ae-fc72-4134-abf3-7a5ca5dacc38
  event: BNTRS_DLC2_Solomorne_302
  text: '"Уверен, арбитры уничтожают ксеносов на других шпилях. А я внесу свою лепту здесь — мы не допустим, чтобы Даргонус
    пал".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2dc92815-7d35-496a-bb4a-a657af5aa4c0
  event: BNTRS_DLC2_Solomorne_303
  text: '"Я наконец понял, зачем нужен ксенос в свите — чтобы было кому подойти и проверить, действительно ли эта дрянь мертва".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f928aae8-77bc-44ce-9e14-ea538f720804
  event: BNTRS_DLC2_Solomorne_304
  text: '"Злачное место. Не удивлюсь, если увижу здесь пару знакомых лиц из базы розыска. А вот они — точно удивятся, да,
    Глейто?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 18cbb5d7-b7f4-4137-809e-2dd251ae94bd
  event: BNTRS_DLC2_Solomorne_305
  text: '"Ну и местечко... Навевает воспоминания о моем первом карательном рейде. Чистый был штурм, только хибары еще долго
    горели".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4a12bb41-19b6-4715-a7f7-414cb65880b4
  event: BNTRS_DLC2_Solomorne_307
  text: '"У Глейто незначительные сбои при попытке сканировать здешние запахи — словно что-то влияет на его аугменты. Как
    же мне это не нравится..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bda382f5-0f14-4ef8-82da-07baf5a4c051
  event: BNTRS_DLC2_Solomorne_308
  text: '"Раз уж ты ведьма, то будь полезной: построй свои шепотки в шеренгу и научи их уже, Трон меня разрази, докладывать
    по форме".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e0e9442e-1265-44b9-bd81-012916e22cec
  event: BNTRS_DLC2_Solomorne_309
  text: '"Надеюсь, эта дрянь не затронет Глейто. Уж больно много в нем железа..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1200f0d7-a702-4959-a9cb-56bea88ed3db
  event: BNTRS_DLC2_Solomorne_31
  text: '"Ты не представляешь, какую опасность несешь, живя вне закона Империума. Ты играешь с огнем, и однажды поплатишься
    за каждый свершенный самосуд".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f2d75f1c-b2c6-4646-a193-839ea3273893
  event: BNTRS_DLC2_Solomorne_310
  text: '"Вот, значит, какова служба Инквизиции? Проклятые места, невообразимые ужасы, высокие ставки..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6ae82acd-a0d2-48df-b1da-389152a3449f
  event: BNTRS_DLC2_Solomorne_312
  text: '"Может, эта сомнительная операция выведет нас на преступников покрупнее. Тратить время на разборки обычных паразитов
    было бы зазорно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c84726bd-31ea-48b6-82d0-744c061a382d
  event: BNTRS_DLC2_Solomorne_313
  text: '"Дикая местность... Скверно. Лучше бы нижние уровни улья или чрево мануфакторума. К счастью, тут я могу положиться
    на инстинкты Глейто".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e40f44a0-38a8-44d7-80ad-2bbf758d5945
  event: BNTRS_DLC2_Solomorne_315
  text: '"Роскошь... Как часто высокопоставленные преступники прячутся за ней, как за броней. Вот только арбитры равнодушны
    к золоту во всех его проявлениях".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c77bda7e-4edd-4b9a-af8f-4bc8d739e66b
  event: BNTRS_DLC2_Solomorne_317
  text: '"Я всегда бдительнее, когда в поле зрения появляется знать. Чернь крадет у хозяина вилки, дворянин — грабит целые
    миры".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3fc34199-fa1e-4c3b-9ce2-4f1d7cd48945
  event: BNTRS_DLC2_Solomorne_318
  text: '"Тебя можно использовать вместо ищейки, торговка. Куда пойдешь ты, там наверняка будут и самые коррумпированные лица
    этого мира".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 497e5cd4-eeec-439e-9105-0ed49cbb3d23
  event: BNTRS_DLC2_Solomorne_319
  text: '"Паскаль, иногда я жалею, что в тебе нет какого протокола, чтобы вовремя остановить. Однажды твое познание встанет
    в цену, которую ты не сможешь заплатить".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 06f325c9-ab5f-4ed1-b05c-0a92996e03af
  event: BNTRS_DLC2_Solomorne_320
  text: '"Не стоит их жалеть — они стали орудием в руках врага. Ксеносы хотели пошатнуть наш боевой дух и, судя по вашим словам,
    добились цели".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7c0fdb58-9ace-4c06-a3d1-f88a6ed50780
  event: BNTRS_DLC2_Solomorne_321
  text: '"Закройте уши, пойте гимны... И идите вперед. Другого способа нет".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 02e067a7-b85e-4cc7-ae1f-fbedb2dd6354
  event: BNTRS_DLC2_Solomorne_322
  text: '"Ведьма права, что-то не так. Визоры Глейто реагируют на тени — такого быть не должно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 53e303b4-5c93-4259-b8dc-9dc365ff5724
  event: BNTRS_DLC2_Solomorne_323
  text: '"А ксеносы каждый раз меняют свои хваленые пути, когда сталкиваются с трудностями? Поэтому вы и падете перед упорством
    Человечества".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 25c82bd6-88ed-4e80-a837-962407a595b5
  event: BNTRS_DLC2_Solomorne_324
  text: '"Предварительная версия — мученическая смерть во взрыве, чтобы одолеть нечто ужасное или сокрыть это. Глейто уже
    обнаружил остаточный след взрывчатки".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4f340b21-5422-4fac-88e2-d2fd194c0ca1
  event: BNTRS_DLC2_Solomorne_325
  text: '"Я видел и более мерзкие деяния от обычных людей. Гадко знать, что в подлости и богохульстве человек превосходит
    генетических отродий".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1e9f3c91-eb65-4aae-ab30-fe61aee9583c
  event: BNTRS_DLC2_Solomorne_326
  text: '"Момент упущен, Версериан. Культистка уже мнила себя избранной из-за некоего шепота, а вкусив еще больше власти,
    она и не подумает останавливаться".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ed5b85a4-eb9a-4d3c-b358-8e31141a76a4
  event: BNTRS_DLC2_Solomorne_327
  text: '"Желание лично навести порядок похвально. Или говорит о критической некомпетентности ваших блюстителей, Версериан".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 73457d22-f4ae-4940-a49b-73637647bf90
  event: BNTRS_DLC2_Solomorne_328
  text: '"Я уверен, что образ священного Патента впечатляет куда сильнее, чем фарс с обливанием кровью, и Вольный Торговец
    изберет верный путь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2026658e-1d08-4644-b333-4326db4ffcbf
  event: BNTRS_DLC2_Solomorne_329
  text: '"Все будущие арбитры проходят через потерю родителей — это делает нас стойкими, приверженными лишь долгу. Тебя же
    кончина отца скорее еще больше сведет с ума".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6c57dc9d-71f8-41a3-bc89-60f9f7f1f1d0
  event: BNTRS_DLC2_Solomorne_33
  text: '"Как-то в Каликсисе видел заспиртованную голову друкари. Долго не верил, что существует что-то настолько мерзкое,
    и был неправ — живьем вы еще хуже".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9debf5e7-2ba6-4ff8-b396-610b920ae86c
  event: BNTRS_DLC2_Solomorne_330
  text: '"То, что Вольный Торговец решил{mf||а} взять что-то себе не означает, что я не отчитаюсь о потерях перед маршалом.
    Хочешь видеть свое имя в отчете отдельной строкой?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 99ac5f2d-4fd1-442b-b2bd-675cd5036d64
  event: BNTRS_DLC2_Solomorne_331
  text: '"Формально, пока я в свите, все изъятое Вольным Торговцем продолжает находиться под защитой арбитров... Во имя Трона,
    ну не спускать же мне на вас Глейто".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f37b2e2a-9cf9-4167-a097-f1d2bef8cf82
  event: BNTRS_DLC2_Solomorne_332
  text: '"Едва ли прогулку по тем руинам можно назвать приятной. Не нужен взгляд навигатора, чтобы сказать — от того проклятого
    места у всех душа не на месте".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4cdc4739-c5dd-425b-94ff-834a8d164e51
  event: BNTRS_DLC2_Solomorne_333
  text: '"Этот жест милосердия будет стоить сектору стабильности. Футфол стал объектом раздора — станция еще пожалеет, что
    не потерпела голод".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 738aea12-1188-4439-8d9f-28d52a6ffaf2
  event: BNTRS_DLC2_Solomorne_334
  text: '"Пока они не шепчут прирезать нас всех во сне, поводов для беспокойства не вижу".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a1c489db-32a4-40af-8d59-c0c0e0c87322
  event: BNTRS_DLC2_Solomorne_335
  text: '"Жара, влажность, агрессивная фауна — так и тянет спросить, что среди навигаторов считается уродливым и опасным".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7d48f54a-cba8-4e7b-be43-70c27e413dcd
  event: BNTRS_DLC2_Solomorne_336
  text: '"Ты слишком впечатлительна для той, у кого в голове дыра в варп. Или ты просто безумная? В твоей болтовне можно ногу
    сломать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5727710d-e1a8-4f8e-ad62-6a5b2c841179
  event: BNTRS_DLC2_Solomorne_337
  text: '"Кунрад Войгтвир... Он заработал себе уже несколько смертных приговоров. В этот раз он не улизнет от правосудия".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d935184f-6e44-4c70-9ecf-9e56a1087011
  event: BNTRS_DLC2_Solomorne_340
  text: '"Иногда мне кажется, будто часть того безобразного места забралась мне под кожу и никак не исчезнет. Та, что состоит
    из чистого отчаяния и ненависти".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8017c265-36e2-47fe-bdb2-73de115f9723
  event: BNTRS_DLC2_Solomorne_344
  text: '"Не пытайся меня поддеть — согласно Лекс Империалис я не в праве судить держател{mf|я|ьницу} священного Патента.
    Это четкое ограничение освобождает меня от пустых размышлений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b6f73696-9d45-4247-933d-322b197fa493
  event: BNTRS_DLC2_Solomorne_346
  text: '"Значит, мы идем одной дорогой, соратник".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9b7b12f8-1b26-4d27-b9df-99f638df04a2
  event: BNTRS_DLC2_Solomorne_348
  text: '"Ты ошибаешься, Паскаль. Есть запреты, которым следовать почетно. И никто не вправе наделять себя священным статусом,
    как бы велик ни был — это во власти одного Императора".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d8d3b9ef-593e-4e36-8898-425628e495ba
  event: BNTRS_DLC2_Solomorne_349
  text: '"Знатные дома часто воображают, что закон им не писан. Им достаточно легкого толчка, чтобы переступить черту. Уверен,
    вы понимаете, о чем я, Версериан".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 33a2f1f9-2abf-4ef2-b91e-2e9ebdcf447e
  event: BNTRS_DLC2_Solomorne_35
  text: '"Визоры Глейто в идеальном состоянии — техножрецам Каликсиса далеко до тебя, Паскаль. С меня ящик лучших священных
    масел".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 51657315-4a88-4cb4-968b-11eaf19ad5fb
  event: BNTRS_DLC2_Solomorne_350
  text: '"Если так хотите выяснить отношения с губернатором — вызовите его на дуэль, или что там дворяне делают. Больше никаких
    ложных обвинений и подтасовок документов Администратума, арбитрам и без вас есть чем заняться".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0aff6429-3196-4705-8fb5-7855b2c40386
  event: BNTRS_DLC2_Solomorne_351
  text: '"Ты совершила великое, сестра. Если кто и достоин ощутить светлый покой, то это ты".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c4f84c64-fa75-4600-ab00-fd633ce5c804
  event: BNTRS_DLC2_Solomorne_352
  text: '"Люди прогнали с Даргонуса твоих выродков пинками под зад, так что издевка неуместна".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dde472e0-c5ff-47d5-8c74-9ee763ed912e
  event: BNTRS_DLC2_Solomorne_353
  text: '"Я бы согласился, что на флагмане лучше, но ведь там в тенях рыщут больные убийцы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1baf6053-9dcc-4f04-9712-dbba73246e94
  event: BNTRS_DLC2_Solomorne_354
  text: '"Хочешь удовлетворить свои ненормальные потребности — проваливай с корабля и развлекайся. Торговка, хоть она и одной
    ногой в ереси, не будет тебе кормом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 04c66107-afa3-46b8-a64a-2bc2fc913c26
  event: BNTRS_DLC2_Solomorne_362
  text: '"У тебя что-то с визорами, Паскаль, вот и мерещится всякое. Я в порядке — полном".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 90793beb-146d-48c7-a8be-7340fac5aeb7
  event: BNTRS_DLC2_Solomorne_37
  text: '"Господин Ульфар, прошу не гневаться — иногда в вашем присутствии Глейто переходит в режим повышенной боеготовности.
    Так... быть не должно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 56d6d9f7-718f-432f-9bcc-67c8caf31dbf
  event: BNTRS_DLC2_Solomorne_39
  text: '"Лекс Империалис гласит: ксенос, принятый на службу держателем Священного Патента, должен: вести себя смиренно и
    подчиняться приказам..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6caaedf8-923f-448e-b9c4-eb55108ee792
  event: BNTRS_DLC2_Solomorne_42
  text: '"Господин Ульфар, пусть мне это будет стоить жизни, но скажу прямо — Глейто лучше любого волка, и даже слова Ангела
    Императора не изменят моего мнения".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 477e4be2-e338-4a4f-9078-9c4abed81ae2
  event: BNTRS_DLC2_Solomorne_44
  text: '"Это бы облегчило твое существование, ксенос, если бы служитель Лекса дал слабину и внял твоим гнилым речам. Но этого
    не будет".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 49d1114c-5ee3-4761-95ca-362ce90c822a
  event: BNTRS_DLC2_Solomorne_45
  text: '"Логово культистов, что устроили пародию на правосудие... Но одно у них не отнять — они и правда готовы умереть за
    Императора".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fb4283b4-bdb2-494a-9f37-3eb462fd0a5f
  event: BNTRS_DLC2_Solomorne_48
  text: '"Культистка мертва, текущий глава секты стар — у флагмана есть все шансы постепенно избавиться от ереси самосуда".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5037335e-a18e-4ae7-9604-db27aff42764
  event: BNTRS_DLC2_Solomorne_51
  text: '"Глейто, рядом. Если даже ведьма всполошилась, то впереди серьезные проблемы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bc29688b-cf0f-45e1-96b9-58ffac0cce9f
  event: BNTRS_DLC2_Solomorne_52
  text: '"У Глейто шкура покрылась инеем. В чем бы ни была проблема — давайте избавимся от нее. Быстро".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 53d33580-7c2b-47a4-97d3-0f09846eab56
  event: BNTRS_DLC2_Solomorne_53
  text: '"Возможно, чтобы безумцы не тревожили их. Зная, что ты на борту, я бы тут еще поставил ловушки с машинной искрой".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 080a3cdf-7948-4907-80ea-1f30dcf30f39
  event: BNTRS_DLC2_Solomorne_54
  text: '"Кому тут и стенать, так это душам почтенных мертвецов, что терпят соседство ксеносской дохлятины".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1ce857ed-5f18-4fae-b647-f3cf93e7a753
  event: BNTRS_DLC2_Solomorne_55
  text: '"Может, эти люди не еретики. Но то, чем они тут занимаются, — это насмешка над настоящим правосудием".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ab25c32d-aa6d-4310-8be5-8c56243847eb
  event: BNTRS_DLC2_Solomorne_56
  text: '"Нет здесь величия — тем, кто истинно несет правосудие Его, нет нужды скрываться во тьме".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4cb5773b-a9f2-4555-8781-47d2e0cd18e4
  event: BNTRS_DLC2_Solomorne_57
  text: '"В такие моменты я задумываюсь, как видит подобные места Глейто со всеми его сенсорами в носу — и тут же даю себе
    приказ думать о чем-то другом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4c73ebc7-e938-4bdd-8a63-cd1b83f6640d
  event: BNTRS_DLC2_Solomorne_58
  text: '"Не вижу ни одного священного кодекса Лекс Империалис. Как можно считать это место часовней, если здесь нет слов
    Его?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8c1f4811-faa2-4575-b59d-3526405bc62f
  event: BNTRS_DLC2_Solomorne_68
  text: '"Вольный Торговец достойно справил{mf|ся|ась} со всеми возникшими на миссии осложнениями и точно не нуждается в излишней
    опеке".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: eb041106-ee86-48d8-8de9-f7147b198831
  event: BNTRS_DLC2_Solomorne_83
  text: '"Отсталые миры тоже вызывают у меня отвращение, но если долг зовет — надо идти".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c4337bb6-0433-47ad-bf4e-b45c2cd04ed1
  event: BNTRS_DLC2_Solomorne_85
  text: '"Это феодальный мир, леди Кассия. Любой, кто сморкается в платок, а не в ладонь, может сойти за дворянина".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e56ee983-377b-4b5f-ae80-95f286b1af1a
  event: BNTRS_DLC3_Solomorne_103
  text: '"Сырость плохо влияет на металлические части Глейто. После этого места мне придется провести полную ревизию протоколов".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7fc15fee-8adc-400d-8b59-4d15d8637382
  event: BNTRS_DLC3_Solomorne_109
  text: '"Как представитель Адептус Арбитес и проктор Простора Коронус, я свидетельствую о том, что клятва будет занесена
    в официальный документ Адептус Администратум".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d587a908-6352-4072-badd-3a8317f6a114
  event: BNTRS_DLC3_Solomorne_113
  text: '"Версериан, не вмешивайтесь. Уверен, если бы жизни Вольного Торговца грозила настоящая опасность, он бы не решился
    на подобные действия".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bd06bf1c-f54a-4890-9f50-4a0f9f1bf4e2
  event: BNTRS_DLC3_Solomorne_126
  text: '"Не знаю насчет наблюдения, но ловушки точно расставлены кем-то разумным. И не лишенным стратегической жилки. Глейто,
    следить за периметром!"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 31a1210a-151b-4127-b23d-e7ec7dff9f54
  event: BNTRS_DLC3_Solomorne_128
  text: '"Мир-фронтир, уровень опасности — высокий, ранг десятины... Солюцио Терциус".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 53bd6ce3-9b65-41f6-87b1-41fa04b8f883
  event: BNTRS_DLC3_Solomorne_19
  text: '"Сколько служу Империуму, впервые вижу такое пламенное рвение у того, кто намеревается отправиться прямиком в пасть
    чудовища. С другой стороны, абсолютно все криминальные отбро... то есть, неблагонадежные элементы, мыслят совершенно одинаково.
    Не буду мешать тебе с этим".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c88bcda6-3066-4e3d-84b1-90a437d8e7a1
  event: BNTRS_DLC3_Solomorne_44
  text: '"Нахожу эту инициативу разумной. Хороший ксенос — мертвый ксенос, а полуживой все еще угроза, даже если превращен
    в статую. Если это состояние обратимо, твари вроде них способны доставить очень много проблем".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 46ae5523-71af-45fa-8473-cf8edabb6866
  event: BNTRS_DLC3_Solomorne_62
  text: '"На вашем месте я бы послушал Паскаля. Неправильно установленная аугментация может принести вред, а не пользу — я
    не раз становился свидетелем подобного".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e8f366a8-ce1d-4fdf-b057-ed29cf062a1f
  event: BNTRS_DLC3_Solomorne_75
  text: '"Страдания стоит лишь по-настоящему продуманная стратегия захвата. Те, кто попал сюда, совершили ошибку и понесли
    наказание".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a36a2c89-27a7-4e61-bc53-c3efc0d14782
  event: BNTRS_DLC3_Solomorne_87
  text: '"Бог-Император, пошли этим несчастным свое милосердие".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b36d99a4-021a-4905-ba43-422e1cb8ef38
  event: BNTRS_Reactivity_DLC3_Solomorne_07
  text: '"Появление черни на мостике — сомнительное пероприятие с точки зрения безопасности. Как и раздача аугментов простолюдинам.
    Каждый из них может оказаться преступником или безумцем с гранатой в руке".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e0af9779-8807-42fd-88aa-a7c0ec0ad4b0
  event: BNTRS_Reactivity_DLC3_Solomorne_12
  text: '"Всего раз в жизни мне приходилось сталкиваться с техножрецами подобного сана. Слуга Омниссии, носящий такой же титул,
    участвовал в создании Глейто".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 19af6069-d0c8-4250-9a77-cb7c9248c42e
  event: BNTRS_Reactivity_DLC3_Solomorne_28
  text: '"Согласно букве Лекс Империалис, отсутствие подтверждающего документа отнимает у Вольного Торговца право называться
    таковым. Статус миров, уже завоеванных династией, при этом... неоднозначен".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ce72fa3d-269c-48b8-b3ad-c5c3427df464
  event: BNTRS_Reactivity_DLC3_Solomorne_46
  text: '"Решение оставить Себериана было храбрым. Но нам все еще придется объяснять Адептус Аминистратум, каким образом в
    просторе существует два официальных Вольных Торговца фон Валанциус".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b6dc51e0-4480-4cde-ba2e-57ef1a5c8d90
  event: BNTRS_Reactivity_DLC3_Solomorne_49
  text: '"Появление второго Вольного Торговца серьезно пошатнуло иерархическую структуру на борту корабля. Требуется пересмотр
    субординации. Не уверен, что подходящий прецедент найдется в летописях достаточно быстро".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bf6e68ab-2c47-4e6b-bdce-888f6488b250
  event: BNTRS_Reactivity_DLC3_Solomorne_61
  text: '"Не часто увидишь благодарные толпы калек на мостике пустотного корабля. Такое поведение в Адептус Арбитес считается
    потенциально опасным. Внесу усиление дозоров в связи с новыми данными".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bad81c1f-ab6b-4c2f-a434-5f650f2488c0
  event: BNTRS_Reactivity_DLC3_Solomorne_70
  text: '"Меня беспокоит, что гвардейцы Заркова провели столь много времени без направляющей руки закона. Стоит задуматься
    о том, чтобы отправить на планету гарнизон блюстителей".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 027d6635-fd7b-45e2-9be9-51e142ab39fb
  event: BS_KTCStolenTithe_Solomorne_01
  text: '"Предлагаю переместиться в более уединенное место, где мы сможем предоставить вам материалы дела".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f719bf27-ed92-44e9-99f7-f66cd3dfe080
  event: BS_KTCStolenTithe_Solomorne_02
  text: '{n}Внушительного вида мужчина салютует вам. Его доспех безукоризненно отполирован, у ног сидит огромный кибермастиф.
    Лицо арбитра не выражает ничего, кроме невозмутимого бесстрастия, и только взгляд холоден и тяжел — как и полагается вершителю
    закона.{/n} "Проктор-взыскатель Соломон Антар. Приветствую вас от лица {g|Encyclopedia:AdeptusArbitesGlossary}Адептус
    Арбитес{/g}".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c355fc5b-ff18-47fa-9757-71e763e7ece0
  event: BS_KTCStolenTithe_Solomorne_03
  text: '"Благодарю, что ответили на мой запрос, Вольный Торговец. Я прибыл по поручению маршала Стракса, чтобы просить у
    вас помощи — необходимо взять на абордаж корабль еретика, укравшего десятину, казнить вора и вернуть священную подать
    под охрану арбитров. Вашей наградой станет вражеский фрегат "Бессердечный", который мы захватим во время миссии".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b50fa678-c47a-457a-ad17-213e5048a5ae
  event: BS_KTCStolenTithe_Solomorne_04
  text: '"Ваша предшественница заключила с нами официальный союз. Она выделила нам штаб на Даргонусе и неоднократно поддерживала
    в вопросах сбора и охраны {g|Encyclopedia:TitheGlossary}десятины{/g}. Мы, в свою очередь, оказывали Леди Теодоре помощь
    в вершении закона на подвластных ей мирах".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9aa5e9f4-63ea-46bb-9456-6ad333de4a1a
  event: BS_KTCStolenTithe_Solomorne_05
  text: '"С Райкада Минорис. Десятинный корабль отбыл незадолго до падения мира и перестал выходить на связь. Расследование
    показало, что судно ограбили и уничтожили. Я уже знаю имя и приблизительное местоположение преступника".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ef4eeea5-9c31-4d13-8be4-23c6dadca0a3
  event: BS_KTCStolenTithe_Solomorne_06
  text: '"Я предлагаю координаты места, где находится ваш будущий трофей и отряд арбитров, который значительно увеличит шансы
    на захват судна. Мы помогаем вам добыть корабль, вы — становитесь богаче и наследуете союз с {g|Encyclopedia:AdeptusArbitesGlossary}Арбитес{/g},
    заключенный Леди Теодорой. Вам судить, насколько это в ваших интересах".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7e41bb17-49c0-43df-bb2c-77b572da615a
  event: BS_KTCStolenTithe_Solomorne_07
  text: '"Не то чтобы я пытался торговаться с вами, но обещаю — если согласитесь помочь, увидите, насколько действительно
    внушительным Глейто может быть в деле".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b1320882-4711-4c5e-ae55-7a1567bb90ea
  event: BS_KTCStolenTithe_Solomorne_08
  text: '"Нет. Я все еще на миссии, и в ваше отсутствие я и мои подчиненные будем проверять вооружение и дорабатывать тактику
    штурма. Иначе говоря, полностью посвятим себя подготовке".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 714e527c-279f-4517-8581-97c285320ede
  event: BS_KTCStolenTithe_Solomorne_09
  text: '"Бессердечный" — это вражеский флагман. Его осквернили нечеловеческими технологиями, но вам под силу очистить его
    от ксеносской мерзости и вернуть на службу Империуму. Даже если вы не пожелаете владеть бывшим пиратским судном, покупатели
    выстроятся в очередь за ним".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b0da0fdc-ee9e-4249-b0bd-c37faf1368c1
  event: BS_KTCStolenTithe_Solomorne_10
  text: '"Он бывший капер и беглый псайкер. Одно время занимался {g|Encyclopedia:ColdTrade}Хладным торгом{/g} и поставкой
    наемников-нелюдей, но пиратские привычки не избыл и грабил подельников. В результате даже среди преступного отребья прослыл
    отморозком — а это надо постараться. Саргона коварен, жесток и непредсказуем".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e5e5427e-6ab4-4df2-ba7a-a6fdc3a7fae4
  event: BS_KTCStolenTithe_Solomorne_11
  text: '"Маршал Стракс сейчас не на Даргонусе, поэтому он поручил мне говорить от своего имени — иначе говоря, не терять
    времени в поимке еретика. Разумеется, он представится вам лично, когда вернется на ваш столичный мир".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 102b9842-a7b5-461c-93df-517a6af0b271
  event: BS_KTCStolenTithe_Solomorne_12
  text: '"Я обращался и получил отказ. Как он справедливо отметил, с момента сбора десятины ответственность за нее ложится
    на Адептус Арбитес. Также Вольный Торговец Винтерскейл отметил, что потеря мира — уже достаточный ущерб протекторату,
    и он не намерен тратить ресурсы на возвращение того, что ему больше не принадлежит".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8eb1ad96-059d-453c-a7da-11a85c816d61
  event: BS_KTCStolenTithe_Solomorne_13
  text: '"Я не разбираюсь в кораблях, но когда я допрашивал на Футфоле капитанов о "Бессердечном", они чуть ли слюной не давились,
    расписывая его достоинства".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 392f2419-e777-4930-a19d-0517a7a1f813
  event: BS_KTCStolenTithe_Solomorne_14
  text: '"Исключено. Десятина неприкосновенна и принадлежит Империуму. Ни один верный слуга Его не посмеет взять что-либо
    от священной подати".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 38c73e7f-f5f4-480d-8f18-92a8a3900bed
  event: BS_KTCStolenTithe_Solomorne_15
  text: '"Я не распоряжаюсь собой, Вольный Торговец. Однако, если миссия будет выполнена, маршал вряд ли откажет отрядить
    меня в ваше сопровождение".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ec8a0fec-898b-4530-a92b-38e7b1662f0e
  event: BS_KTCStolenTithe_Solomorne_16
  text: '{n}Не поведя и бровью, Соломон командует:{/n} "Глейто — голос. Не каждого кибермастифа приветствует Вольный Торговец
    лично, надо ответить на оказанную честь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 96e3625d-abde-4d34-8aa8-835ab07b7e8e
  event: BS_KTCStolenTithe_Solomorne_17
  text: '"Вскоре после падения Райкада Минорис я допросил наместника Футфола. Он дал исчерпывающую информацию о Саргоне и
    его корабле и предоставил арбитрам полный доступ к докам. Подозреваю, покладистость Токары исходит из вражды с Саргоной.
    Подонок жрет подонка — ничего нового".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 95fc536f-e521-40d4-a82e-04abef28f216
  event: BS_KTCStolenTithe_Solomorne_18
  text: '"Как скажете".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b26fa76a-cceb-43ab-8641-369135774667
  event: BS_KTCStolenTithe_Solomorne_19
  text: '"{d|Encyclopedia:CharGen_Arbitrator}Бывших арбитров{/d} не бывает, верно?" {n}Соломон уважительно кивает.{/n} "Не
    в обиду вашим навыкам — предпочитаю перестраховаться на стадии подготовки".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: b9b67ef5-8096-4124-8849-67bf58d0c1a5
  event: BS_KTCStolenTithe_Solomorne_20
  text: '"В подобных случаях договоренности обязывали нас обратиться к Леди Теодоре. Она выступала ключевым лицом в поддержании
    {g|Encyclopedia:LexImperialisGlossary}Лекс Империалис{/g} в Просторе Коронус".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bfab034f-bd45-41f2-a7af-dd2f4edc373b
  event: BS_KTCStolenTithe_Solomorne_21
  text: '"Отлично. У вас есть еще вопросы?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f8032604-1ca6-4410-b238-1f52d6c2ea35
  event: BS_KTCStolenTithe_Solomorne_22
  text: '"Капитан Саргона и его флагман "Бессердечный", скрывается в Ничейных мирах. Точное местоположение удастся определить
    только с помощью авгуров вашего флагмана, когда войдем в систему".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 03eded48-ac9b-492b-b495-dab59b5e7832
  event: BS_KTCStolenTithe_Solomorne_23
  text: '"Бессердечного" сопровождает небольшая флотилия — от нее надо избавиться, чтобы захватить фрегат. Ударные отряды
    Арбитес высадятся на верхнюю палубу, пока ваши абордажники займутся остальными отсеками. Мой отряд арбитров возьмет на
    себя самую сложную и опасную часть операции. Конечная цель — захват капитанского мостика, допрос и казнь Саргоны".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1b32cfd0-ec91-4d1a-bdd6-d83e0b161220
  event: BS_KTCStolenTithe_Solomorne_24
  text: '"Слышу слова истинн{mf|ого|ой} наследни{mf|ка|цы} Леди Теодоры. И обещание скорой расправы над еретиками"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a184a447-d48f-4291-8bf2-ae93e095f9e7
  event: BS_KTCStolenTithe_Solomorne_25
  text: '"Штейн — выгрузи последние данные, Брайс — голограмму". {n}Соломон передает вам инфопластину.{/n} "Здесь полное досье".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 61d36439-0e5d-4cfe-9340-160d4fab6629
  event: BS_KTCStolenTithe_Solomorne_26
  text: '"Принято". {n}Соломон кладет руку на холку мастифа и говорит скорее ему, чем вам:{/n} "Саргона уже мертвец — просто
    еще не знает об этом".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 2ee5e290-aca2-42fc-b0f7-493bb88ae85e
  event: BS_KTCStolenTithe_Solomorne_27
  text: '"Вы не только {d|Encyclopedia:BS_SolonornOnRaycadDecision}забрали мой отряд с умирающего мира{/d}, но еще и согласились
    встретиться. Это вселяет в меня силы — как вы выразились — "выпрашивать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7fb62ed0-94d2-48fc-bb52-56e337d31ffc
  event: BS_KTCStolenTithe_Solomorne_28
  text: '"ДК-1 означает, что я — командующий отрядом Дельта-Кси. Это одно из наших обозначений для штурмовых отрядов в Коронусе.
    ВТ-1 — это вы, Вольный Торговец и глава Вита-Тета. Для краткосрочной миссии таких обозначений достаточно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 100c56a6-c840-4f25-905b-5530c2689edb
  event: BS_KTCStolenTithe_Solomorne_29
  text: '"На миссии будут следующие позывные для связи по воксу: вы — ВТ-1, я — ДК-1. Также попрошу вас использовать язык
    жестов арбитес. Невербальные команды быстрее слов и позволяют застать врасплох противника. Короткий список здесь". {n}Соломон
    протягивает вам инфопластину.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 9707a9a8-9782-43e0-bf96-d0371693d72d
  event: BS_KTCStolenTithe_Solomorne_30
  text: '"Не мне судить Помазанника Императора. Тем более, его аргумент правомерен".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4609a83d-6880-4721-89ba-f32eda13268d
  event: BS_KTCStolenTithe_Solomorne_31
  text: '"Судно не было потеряно — его украли. Если бы не существовало возможностей преступить закон, то не было бы и Адептус
    Арбитес. В Каликсисе наши силы уже бы настигли еретика и предали его каре, но здесь арбитры не обладают такими ресурсами".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 230fe62e-1b1e-4564-9b9b-227b569e060c
  event: BS_KTCStolenTithe_Solomorne_32
  text: '"Однако мы все еще можем реквизировать суда. Вот только на Футфоле не нашлось корабля с достаточно мощными {g|Encyclopedia:Augur}авгурами{/g},
    чтобы обнаружить еретика. Ваш же флагман обладает продвинутыми технологиями и внушительной огневой силой. Даю слово, будь
    в доках подходящее судно, я бы не стал тревожить вас".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7d1e5f90-6e3a-4008-a5aa-540ba0456b13
  event: BS_KTCStolenTithe_Solomorne_33
  text: '"В вопросах штурма чем короче позывной, тем меньше шанс, что тебя пристрелят, пока его выговариваешь. Но воля ваша,
    Имперский орел".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 808b18cf-0f58-436a-835c-a28c1fb39efe
  event: BS_KTCStolenTithe_Solomorne_34
  text: '"Для вас все относительно просто: убивайте всех врагов на пути и не дайте убить себя. Саргону надо захватить живым
    для допроса, но этим займусь я с моим отрядом. И еще кое-что".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 810f5b8c-ad33-4493-8d5d-bfbc0e74e8c0
  event: CH2_JaeHasAnOfferForYou_Solomorne_01
  text: '"Слышал я об одной Хейдари с Футфола, мелкой хладной торговке". {n}Проктор чуть кивает сам себе.{/n} "Не стоишь моего
    времени".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c69efb05-b087-4e93-82db-bfc931c9505d
  event: CompanionDialogue_Solomorne_01
  text: '{n}Соломон чуть кивает вам в знак приветствия.{/n} "Вольный Торговец?"'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: a1ea53ce-2d66-4e24-b379-0e11922faee9
  event: CompanionDialogue_Solomorne_02
  text: '"Решил сделать исключение для Помазанни{mf|ка|цы} Императора, Глейто?" {n}Пес прижимает уши, ловя взгляд хозяина.{/n}
    "Ладно. Поздравляю с достижением, Вольный Торговец. Еще никому на моей памяти Глейто не позволял подобного".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6a619da1-ace0-4422-8adb-d7e0bfcdbf0d
  event: CompanionDialogue_Solomorne_03
  text: '"Предпочитаете лучше понимать, с кем путешествуете? Разумно". {n}Соломон смотрит на вас долгим внимательным взглядом.{/n}
    "Спрашивайте".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 43344192-34a9-4a0e-99db-f61a39cec0ad
  event: CompanionDialogue_Solomorne_04
  text: '"Порт Странник, Каликсис. Это врата в Коронус и монументальная станция, вечно облепленная кораблями и трещащая по
    швам от количества торгашей, паломников, наемников и преступников всех мастей. В сравнении с Портом Странник Футфол —
    безжизненный камень в пустоте".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 59690bfb-d142-4261-8bfa-f9728ec79291
  event: CompanionDialogue_Solomorne_05
  text: '"Как?" {n}Соломон эхом повторяет ваши слова, и на его губы ложится подобие мрачной усмешки.{/n} "Если коротко — Схола
    Прогениум. Но такой ответ вряд ли вас устроит. Мой отец был Арбитес, и весьма хорошим. Иначе бы его не нашли в переулке,
    изрешеченного пулями. Сослуживец отца сказал, что его убили из десяти разных оружий, и что минимум четверых ублюдков он
    успел забрать с собой".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: b833bd38-296c-4be5-9a83-0bdcddf7daba
  event: CompanionDialogue_Solomorne_06
  text: '"Меня почти сразу забрали в Схола Прогениум, там наставники выковали из меня арбитра. Я учился со всем рвением, потому
    что отец служил мне примером несгибаемого долга и достоинства. Единственное, в чем я не равнялся на него, была ненависть
    — он не прививал ее мне, она просто всегда была со мной". {n}В бесстрастном взгляде нет ни капли эмоций.{/n} "Я никогда
    не сомневался, что преступное отребье заслуживает лишь плахи. Убийство отца сделало мою ненависть кристально ясной, завершенной".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8a8887df-b4f6-4d82-b9cb-bb8907d050fd
  event: CompanionDialogue_Solomorne_07
  text: '"Этот вопрос лучше задать маршалу — я получил назначение, и это все, что мне известно. Но подозреваю, что дело в
    моем опыте: сбор десятины с полудиких миров, где живого Арбитес видели три поколения назад, разумно поручить ветерану".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 140b4a8e-8fe3-4572-9970-6b658b02c46d
  event: CompanionDialogue_Solomorne_08
  text: '{n}Соломон качает головой.{/n} "Он сделал, что мог, но вытащить из Глейто неизвестную друкарскую дрянь в полевых
    условиях не выйдет. Надо дотянуть до возвращения на флагман, иначе никак. Не знаю, выберемся ли мы, но на всякий случай
    я должен..."'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: faea44e8-be0e-4465-bc13-0fa1ae3bbd30
  event: CompanionDialogue_Solomorne_09
  text: '"Это точно не ссылка. Иначе бы ваше суждение можно было распространить на маршала и других арбитров в Просторе Коронус.
    Мы здесь потому, что Империуму нужна десятина, ни больше ни меньше".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 37e67cfa-0f41-4f63-8a80-2c30139415d2
  event: CompanionDialogue_Solomorne_10
  text: '"Вряд ли. Такова суть служебной собаки. Но будьте уверены — вы у Глейто на особом счету, раз он больше не точит об
    вашу руку клыки".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5d8523cc-24ef-4f92-a986-329851e077a8
  event: CompanionDialogue_Solomorne_100
  text: '"Кроме безупречного служения? Есть кое-что, о чем я много думал... О том, что Кредо уступает Лекс Империалис в близости
    к Богу-Императору. Я хочу, чтобы Его закон стал единственным столпом веры для арбитров. Хочу вести их не только как маршал,
    но и как проповедник".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2ee3c574-70c9-468f-8277-e0c82bff4a20
  event: CompanionDialogue_Solomorne_101
  text: '"Низложение маршала станет испытанием для духа Арбитес, но я верю, они справятся. Нас учили исполнять долг несмотря
    ни на что, и даже пока не избран новый глава, нас будет вести Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f262a05b-9992-4001-b2f3-e60c8e785483
  event: CompanionDialogue_Solomorne_102
  text: '"И в любом случае Арбитес больше никогда не станут вмешиваться в дела фон Валанциус". {n}Взгляд Соломона темнеет.{/n}
    "Другие династии отметят это, и почти наверняка откажутся подчиняться Адептус Арбитес. Нас ждут тяжелые времена".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4c2ee0dd-8758-4992-8051-7a86efe283d5
  event: CompanionDialogue_Solomorne_103
  text: '"Грегорас Стракс был выдающимся слугой Лекс Империалис, и я все еще не могу понять, почему он не распознал в Вультур
    врага".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 19ccb58e-3c9d-401f-9990-55b8985fe4a4
  event: CompanionDialogue_Solomorne_104
  text: '"Я склоняюсь к тому, что Стракс отдалился от Лекс Империалис. В букве закона Его все ответы и все решения, но Стракс
    стал нетверд в суждениях и начал внимать советам Вультур. Ослабление веры сделало его слепым и привело к закономерному
    и полному позора концу".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9a5382e7-b3b7-4079-8482-4a5c959ad081
  event: CompanionDialogue_Solomorne_105
  text: '"Думаю, Грегорас в конце концов оказался просто человеком. Он был заперт в Просторе, ему приходилось охранять всю
    десятину сектора — он нуждался в ком-то, чья мудрость облегчила бы его бремя".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5f4f0b4c-d02a-4fec-88f2-1567f858e224
  event: CompanionDialogue_Solomorne_106
  text: '"В его преступлении мне видится проблема серьезнее. Наставники в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g},
    не распознавшие в нем слабость, и даже сам Лорд-маршал Гореман, доверивший Страксу высокий ранг, — на них всех может лежать
    часть вины. Я больше не склонюсь перед старшими чинами Арбитес — каждый из них может оказаться недостойным".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: eb253e7b-f841-4eee-8561-7f971ffa8f0c
  event: CompanionDialogue_Solomorne_107
  text: '"Потребуются крепкие снаряды и мишени — Глейто неудержим, когда действует в полную силу". {n}Соломон приподнимает
    уголки губ.{/n} "Благодарю".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 71c122c0-9a2b-4abd-9a6a-c69057ebed07
  event: CompanionDialogue_Solomorne_108
  text: '"Я благодарен вам за то, что вы сохранили Грегорасу жизнь. Он бы предпочел казнь, но, как и все арбитры, он с полной
    ответственностью примет назначенное наказание. Я буду навещать своего бывшего командира — не хочу, чтобы он оставался
    наедине со своей виной".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d94ac78e-8ef4-4beb-a961-0d3539b7f5f1
  event: CompanionDialogue_Solomorne_109
  text: '"Согласен. Поговорим о другом?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1917c18f-2e30-4e1a-9f23-a86d8a5d2878
  event: CompanionDialogue_Solomorne_11
  text: '"Так и есть. Кодексы Лекс Империалис — моя молитва, и я верю, что служение каждого арбитра священно, поскольку приближает
    несовершенную реальность к тому, что высечено в Книге суда. К воле Бога-Императора".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 266f7dd9-b886-40d2-9f5c-143858552864
  event: CompanionDialogue_Solomorne_110
  text: '{n}Мрачно и торжественно Соломон поднимает железную ладонь.{/n} "Я клянусь, что больше никогда не подниму против
    вас оружия. А если наши взгляды на Лекс Империалис вновь разойдутся, я приду и сообщу об этом, чтобы вы немедленно решили
    мою судьбу".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b7aa03f3-dda6-4e17-9d9f-0ec8e2847741
  event: CompanionDialogue_Solomorne_111
  text: '"Арбитес в Просторе требуется реорганизация. Последние события показали, что мы не можем служить Лекс Империалис,
    как прежде — я использую опыт путешествий с вами, чтобы лилось меньше крови, как судей, так и обвиняемых. Та еще задача,
    ведь арбитры не знают, что такое искупление и милосердие".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7a6b59c1-6537-4036-9cde-7d09262162f3
  event: CompanionDialogue_Solomorne_112
  text: '{n}Соломон складывает руки на груди и возводит глаза к люменам на сводах.{/n} "Я, разрази меня Лекс, даже не знаю,
    с чего начать. Стракс оставил мне руины, и Арбитес придется компенсировать его позор и свою малую численность служением
    яростным и внушающим благоговейный ужас. Я перекую арбитров в новую элиту и начну писать Лекс Коронус — кровью тех, кто
    хоть в чем-то дерзнет не покориться нам".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 189d02c9-1294-4c53-8969-62eed1ab80cf
  event: CompanionDialogue_Solomorne_113
  text: '"Я решил, что не стоит лишний раз подвергать его операции: протокол, требовавший от него вести наблюдение, все равно
    остановлен. Может, однажды нам понадобится эта функция, но пока она деактивирована — и в бездну ее".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2fd7c3a1-63ac-491d-88d2-03cdb082d221
  event: CompanionDialogue_Solomorne_114
  text: '"Как и {d|Encyclopedia:CharGen_Arbitrator}любой арбитр{/d}, я знаю Инъюнкта Кардинал до последней запятой. Не было
    и дня, чтобы я не повторял священные положения от и до — они высечены в моей памяти так же четко, как на стенах крепостей
    Арбитес и на гильзах наших патронов. Я скорее свое имя забуду, чем хоть слово из Инъюнкта Кардинал".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: da605858-9491-4f83-91f2-e7f6fb87e83b
  event: CompanionDialogue_Solomorne_115
  text: '"{d|Encyclopedia:CharGen_Arbitrator}Вы сами прекрасно знаете{/d}, что такая команда бессмысленна, поскольку ставит
    кибермастифа в позицию, из которой сложнее атаковать врага. Или вы проверяете его аугменты? Что ж, как и положено, Глейто
    не реагирует на команду постороннего человека".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6309eafc-f099-4246-acf9-28317099610b
  event: CompanionDialogue_Solomorne_116
  text: '"Я... верно вас услышал? Вы хотите порвать наши отношения?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 48002466-78ef-48d6-b75c-3dcbfe2c940c
  event: CompanionDialogue_Solomorne_117
  text: '"Что ж, вы выразились предельно ясно. Вернемся к исключительно служебным отношениям".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c0ed543d-8908-4ee1-b826-28c7ed629466
  event: CompanionDialogue_Solomorne_118
  text: '"Нет". {n}Голос Соломона обретает резкость.{/n} "Потому что никаких отношений никогда и не было".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f2d36a88-c118-42ea-bfb3-4ed9e102ec4e
  event: CompanionDialogue_Solomorne_119
  text: '"Предательство в рядах арбитров надо было расследовать быстро и безжалостно — как раз задача для особого отряда по
    захвату преступников. Соратники вызволили меня из плена, и теперь уже я слушал вопли своих мучителей".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8d36008a-a868-4965-8804-037cacba9873
  event: CompanionDialogue_Solomorne_12
  text: '{n}Соломон немедленно ставит руку между вами и мордой пса.{/n} "Любую ответственность за действия кибермастифа несет
    хозяин. Наказывайте меня — и только меня".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 97297f38-10d5-4ba5-b2ed-c39105958cde
  event: CompanionDialogue_Solomorne_120
  text: '"Вольный Торговец. Перейду сразу к делу — мне известно, что у вас {d|Encyclopedia:MiniJealousyRomanceBroken}сменился
    любовный интерес{/d}". {n}Лицо Соломона непроницаемо, как стена из керамита.{/n} "Раз вы все решили, то вернемся к исключительно
    профессиональным отношениям, как и должно было быть с самого начала".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dae32408-bba2-4b24-9257-af146ddf6a9a
  event: CompanionDialogue_Solomorne_121
  text: '{n}Соломон морщится.{/n} "Глейто, разве ты не мог уважить Вольного Торговца менее глубоким укусом? Не вините его,
    это был стандартный предупредительный захват, тем более весьма чистый — понадобится всего десяток швов".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 88bd4e46-6720-4cdc-b710-b0285d365b10
  event: CompanionDialogue_Solomorne_122
  text: '{n}Соломон стоит, заложив большие пальцы за ремень, по-хозяйски осматривая мостик. При вашем приближении он непринужденно
    кивает.{/n} "Приветствую, Вольный Торговец. Докладываю: провел первичную инспекцию верхних палуб с Глейто — список нарушений
    оказался на пять страниц короче ожидаемого. Начинаю опасаться, что служителю {g|Encyclopedia:LexImperialisGlossary}Лекса{/g}
    будет нечем заняться на вашем судне".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: f449c74d-796d-4a1b-90e1-2f86eef8bceb
  event: CompanionDialogue_Solomorne_123
  text: '"То, что вы желаете во мне видеть — это изъян. Слабость, что сделала бы меня понятнее и проще. Но поверьте — вам
    не нужен такой человек в свите, как и Империум не нуждается в подобных слугах".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 81907a2a-e9cc-4874-b29c-1f6afcf270c1
  event: CompanionDialogue_Solomorne_124
  text: '"Верно. На вашем столичном мире действует Лекс Даргонус, написанный поколениями фон Валанциус. Но Лекс Империалис
    — последняя инстанция любых судебных споров. Он выше юридических установок любой планеты, поскольку исходит от самого
    Императора".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5d82acf2-5f82-487a-a82d-399dc83d88de
  event: CompanionDialogue_Solomorne_125
  text: '"Жизни человека не хватит не то чтобы запомнить — чтобы прочесть хотя бы часть закона Его. Но есть фундаментальные
    и неотъемлимые положения, известные каждому арбитру — это Инъюнкта Кардинал. Они высечены на стенах крепостей Арбитес
    и выгравированы на гильзах наших патронов. Мы цитируем их как непреложную истину и декламируем подобно боевым псалмам
    во время сражений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bef47458-9c66-4f6b-9734-3c62ab2d32cc
  event: CompanionDialogue_Solomorne_126
  text: '"Это бесполезная команда, Вольный Торговец, потому что кибермастиф всегда должен находиться в позиции, из которой
    эффективнее всего атаковать врага. Глейто может ползти или двигаться скрытно, если требует ситуация, но в любом случае
    он не отреагирует на приказ постороннего человека".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 185194f9-6313-449b-9f89-132742ad3eba
  event: CompanionDialogue_Solomorne_127
  text: '"Это требование нарушить не протокол взаимодействия с кибермастифом, но принципы Адептус Арбитес. Согласно им Глейто
    — оружие, а арбитры не используют вооружение для увеселения знатных особ".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 47b5d566-b879-4a08-8db1-e2523174407b
  event: CompanionDialogue_Solomorne_128
  text: '"Если бы мне давали трон каждый раз, когда я отвечаю отказом на мольбу, я бы мог купить ваш флагман". {n}Соломон
    потирает переносицу.{/n} "Ради вашей же сохранности — оставьте эту идею".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: af6f445d-14d8-4e55-8c9e-5bdd13033239
  event: CompanionDialogue_Solomorne_129
  text: '"Слышал, Глейто? Не часто тебя хвалят Вольные Торговцы. Голос!" {n}Кибермастиф издает громоподобный лай.{/n} "Будем
    считать, что Глейто выразил свое почтение и извинился".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d469d292-ce35-4504-818f-826247cc1545
  event: CompanionDialogue_Solomorne_13
  text: '"Напоминаю: Глейто — живое оружие. Если количество пальцев вас устраивает — не трогайте пса".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f2cab70b-5fd2-4df6-bb37-03443d376bd7
  event: CompanionDialogue_Solomorne_130
  text: '"Я могу только попросить вас больше не предпринимать попыток взамодействовать с Глейто... подобным образом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2733e876-000c-4e92-97e5-7acc3e35cde9
  event: CompanionDialogue_Solomorne_131
  text: '"Мы — служители закона Бога-Императора, воплощенного в {g|Encyclopedia:LexImperialisGlossary}Лекс Империалис{/g}.
    Адептус Арбитес следят за соблюдением порядка в масштабах Империума и несут беспощадную кару нарушителям".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0128772f-9b4e-4166-b999-15903bfb02ed
  event: CompanionDialogue_Solomorne_132
  text: '"На Даргонусе. Леди Теодора выделила для Адептус Арбитес верхний уровень в одном из шпилей — раньше его занимал благородный
    дом, вздумавший запустить руку в богатства вашей династии... Расквартировав нас в таком видном месте, ваша предшественница
    не только закрепила союз с Арбитес, но еще сделала красноречивый жест в сторону дворян. Умная была женщина, и суровая".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f12ffbae-2a5d-4eb4-a23a-36417a95adac
  event: CompanionDialogue_Solomorne_133
  text: '"Не пройду, если невиновность будет доказана предварительным расследованием, например. В остальных случаях убийство
    — это заурядное нарушение порядка. Моего вмешательства потребует разве что нападение на функционера {g|Encyclopedia:AdeptusAdministratumGlossary}Администратума{/g}
    или на другое важное лицо. Тогда я обязан принять меры".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1275428a-ae57-4899-96bb-82eb2699acaa
  event: CompanionDialogue_Solomorne_134
  text: '"Но если я выполняю миссию, то проигнорирую любой отвлекающий фактор. Потому что задачи Арбитес стоят выше банальных
    преступлений — мы собираем десятину, что питает военную мощь Империума и обеспечивает его власть на мирах. Размениваться
    на мелочи значит преступно пренебрегать временем и ресурсами, которые нам даны для служения абсолюту закона".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ad8fa94f-f0f6-4560-8119-d17818c87052
  event: CompanionDialogue_Solomorne_135
  text: '"Они, без сомнений, угроза Империуму номер один, и я не оставлю без пули еретика, попадись он мне. Однако подобными
    делами занимаются другие имперские силы — достаточно серьезные, чтобы не упоминать их вслух лишний раз".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7a7a823e-a9c9-4ca6-b57a-91af8593b7e8
  event: CompanionDialogue_Solomorne_136
  text: '"Я в вашем распоряжении".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 637acb8b-09a5-4ce0-9af6-1588c1ea03d5
  event: CompanionDialogue_Solomorne_137
  text: '"Невозможно — вы меня раскусили". {n}Соломон поднимает бровь.{/n} "Я действительно на одну сотую процента менее равнодушен,
    чем выгляжу".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 50658e3c-4155-4487-b136-7a56e39352fc
  event: CompanionDialogue_Solomorne_138
  text: '"Однажды я участвовал в рейде на банду мутантов — отличился в бою, был награжден и повышен до проктора". {n}Соломон
    выдерживает паузу.{/n} "Это все".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: df6149da-da64-44b2-94a2-a5d81ee4b466
  event: CompanionDialogue_Solomorne_139
  text: '"Тот рейд был скомпрометирован: врага предупредили об операции. Мы оказались в западне. Какой-то мутант решил отгрызть
    мне руку — это была ошибка. Освободиться я не мог, пришлось протолкнуть предплечье в осклизлое горло, ухватиться за рыхлое
    нутро и прикрыться выродком, как щитом. Пока тварь хрустела моими костями, и окатывала меня ихором и моей собственной
    кровью, я поливал огнем других мутантов. Вот такой небольшой маневр, который выиграл моему отряду несколько решающих секунд".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ae5e092c-f3a3-4317-8117-366367f6b310
  event: CompanionDialogue_Solomorne_14
  text: '{n}Арбитес невозмутимо отстегивает часть доспеха, обнажая предплечье.{/n} "Глейто, цель — ДК-1, предупредительная
    атака". {n}Кибермастиф немедленно впивается в руку хозяина, бешено мотая мордой, и окатывая вас брызгами горячей крови.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c1790af6-aba7-4550-8848-b236732979a6
  event: CompanionDialogue_Solomorne_140
  text: '"Сбор и охрана десятины. Но мы не закрываем глаза на прочие нарушения Лекс Империалис и действуем, насколько нам
    позволяют ограниченные ресурсы. Главным образом — малая численность. Здесь, в Коронусе, многие считают, что находятся
    слишком далеко от цивилизованной части Империума, чтобы соблюдать закон. Присутствие Адептус Арбитес помогает этим людям
    вспомнить, что Лекс Империалис действует везде, где есть хотя бы один человек".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 40c68dd8-5cf9-41e1-9dbf-33df6c0b0d9b
  event: CompanionDialogue_Solomorne_141
  text: '"Охотно верю. Трон Вольного Торговца не терпит слабаков и идиотов".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dd5f0bf4-fc48-477b-96de-7446b1353dae
  event: CompanionDialogue_Solomorne_142
  text: '"Едва ли такое слово применимо к арбитру, но доля истины в вашем замечании есть. Раз мы не в бою, я позволяю себе
    команду "вольно". Однако я по-прежнему бдителен и в полной боевой готовности".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a381610b-4e84-47bb-a439-7bab59a71f91
  event: CompanionDialogue_Solomorne_143
  text: '"Едва ли дело в везении: вы заключили союз с Арбитес, как и ваша предшественница. То, что я здесь — закономерный
    результат ваших решений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b6c1d3f8-70e1-4131-a84d-734613e9e16b
  event: CompanionDialogue_Solomorne_144
  text: '"Надеялся, что такой ответ отобьет у вас интерес. Я не могу ответить иначе как честно и исчерпывающе, а история та
    еще — про потерю конечностей и мерзких отродий. Вольному Торговцу такое может и не понравиться".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f72b5ba8-2dea-48e8-b63d-ab75a1ce7470
  event: CompanionDialogue_Solomorne_145
  text: '"Ладно". {n}Арбитр поднимает перед собой железную ладонь и медленно сжимает пальцы в кулак.{/n} "Вас когда-нибудь
    ели заживо? Меня — да".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5f02874b-6b92-4108-bf6b-be9e72327ceb
  event: CompanionDialogue_Solomorne_146
  text: '"Вы знаете, где найти меня, Вольный Торговец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4fe7b046-133a-4f86-b31c-789aa01b6d96
  event: CompanionDialogue_Solomorne_147
  text: '{n}Проктор отвечает вам прямым, бесстрастным взглядом.{/n} "Предположение, что я мог предотвратить исчезновение светила,
    звучит почти лестно. Однако я никогда не уклоняюсь от ответственности: пусть Император в час последнего суда определит
    мою степень вины в произошедшем".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 72d335c1-1179-45fb-93da-d1e37d99a515
  event: CompanionDialogue_Solomorne_148
  text: '"Хотите повторить подвиг? Не могу поручиться, что Глейто и в этот раз будет сидеть смирно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 72521f77-fe3a-48ad-81a6-ca9c29b25667
  event: CompanionDialogue_Solomorne_149
  text: '"Признаться, он меня приятно удивил. Я ожидал чего-то менее цивилизованного, учитывая, что Простор Коронус — это
    окраина Империума. Но Даргонус мог бы потягаться в статусе и стабильности с некоторыми мирами Каликсиса".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 41a2be4b-53b7-4541-b8d1-63d7b0db71ae
  event: CompanionDialogue_Solomorne_15
  text: '{n}Приладив броню на изорванную в мясо руку, Соломон сквозь зубы произносит:{/n} "Если на этом все, мне нужно в медотсек.
    После вас, разумеется".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7524f421-cb69-4a42-8a9e-96c6f0e1a65b
  event: CompanionDialogue_Solomorne_150
  text: '{n}Соломон склонился над Глейто, его пальцы ощупывают каждый шов на теле кибермастифа.{/n} "Уплотнения здесь и здесь...
    А тут что еще такое?" {n}Железный кулак обрушивается в пол, оставляя вмятину.{/n} "Ублюдочные отродья, распотрошить моего
    пса! Я... Гхм, Вольный Торговец? Вы… давно тут стоите?"'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 51e6bce6-6375-4d84-a49b-a8e6d724b09c
  event: CompanionDialogue_Solomorne_151
  text: '"Я так часто себе это повторяю, что перестал понимать смысл слов. Кстати, о словах..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6f946ce2-bfa4-4c95-9c15-232ae7648f42
  event: CompanionDialogue_Solomorne_152
  text: '"Начинаю думать, что вам нравится боль".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 1fe15b06-cdcc-4e90-9365-6ddc969d79d2
  event: CompanionDialogue_Solomorne_153
  text: '"Мне тоже. Привычнее, когда есть приказ и план, а мои собеседники — цели, требующие устранения. Но иногда приходится
    терпеть вот такие периоды затишья".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8f3c013a-da4b-4344-9739-e4f84a7ea0ad
  event: CompanionDialogue_Solomorne_154
  text: '{n}Соломон вскидывает бровь:{/n} "Вольный Торговец и арбитр — интересные у вас представления о "нормальном". Попробую
    поддержать беседу на уровне ожиданий".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 43304fb4-b2ae-43d8-ad95-6ab354eb3433
  event: CompanionDialogue_Solomorne_155
  text: '"Со слов отца — достойной женщиной со слабым здоровьем. Она не перенесла родов. Наверное, тот факт, что я не знал
    ее — единственное сожаление в моей жизни".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 26533021-8854-4403-a1f4-16e680c9d81e
  event: CompanionDialogue_Solomorne_156
  text: '{n}Из груди арбитра доносится тяжелый вздох. Спустя миг он уже столь же спокоен, как и всегда. Недрогнувшим голосом
    Соломон произносит:{/n} "Как... неудачно. Что же, я готов удовлетворить ваше любопытство, но прошу о приватности".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 803334cb-215f-4806-ba62-8f4ac56cb6a7
  event: CompanionDialogue_Solomorne_157
  text: '"Слушаюсь, отложим этот разговор". {n}Соломон не меняется в лице, только старается пореже встречаться с вами взглядом.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 9a15b760-e482-42d0-a8b9-cb76704b4015
  event: CompanionDialogue_Solomorne_158
  text: '"Обсудим. Что вас интересует?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9b79571a-bf1b-4c54-95a2-91076691a0bb
  event: CompanionDialogue_Solomorne_159
  text: '"Я не стану оспаривать суждения префекта, но..." {n}Соломон пристально смотрит вам в глаза.{/n} "Вам надо было принять
    решение по непростому вопросу, и вы это сделали. Взяли ответственность на себя. Я ценю в людях подобные качества".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: d529a2d1-604e-45be-b9cb-d4ffa397f0c2
  event: CompanionDialogue_Solomorne_16
  text: '"Слушаю".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0a787bd2-e585-4ab8-a725-b898292d029a
  event: CompanionDialogue_Solomorne_160
  text: '"Вы уже указали на это префекту, а я получил отметку в личном деле. Если этого недостаточно, и вы ждете от меня каких-то
    комментариев — я отвечу".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3911163a-243d-4e12-84be-cf4d53eb7592
  event: CompanionDialogue_Solomorne_161
  text: '{n}Соломон с достоинством поднимает подбородок.{/n} "Вы можете утверждать, что моя рекомендация была неверной, но
    я не заставлял вас принимать именно это решение. Мне больше нечего добавить".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: b8541983-48e1-485f-bbf7-4156da101b5f
  event: CompanionDialogue_Solomorne_162
  text: '"Вы правите целым протекторатом — мне бы и в голову не пришло судить о вас по одному инциденту. Если вам показалось,
    что я порицаю вас, так это у меня лицо такое. И голос. И выбор слов. Да, тяжело переключиться на обычную беседу после
    стольких лет, проведенных за допросами..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ec5bca37-36f4-4a77-9d70-92744327dc63
  event: CompanionDialogue_Solomorne_163
  text: '{n}Проктор выдерживает паузу, прежде чем ответить.{/n} "Помогать Вольному Торговцу, что осваивает новые миры во имя
    Бога-Императора — это именно то, зачем я здесь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 99ce0fda-e482-485e-95ec-9e47b8af22ec
  event: CompanionDialogue_Solomorne_164
  text: '{n}Соломон касается железными пальцами щеки.{/n} "Лучше бы вы прострелили мне ногу... Ах да, перечить не дозволено.
    Тогда благодарю, что преподали урок — он пойдет на пользу такому наглецу, как я".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 42e3e996-b68c-41d9-b792-b86239bed50a
  event: CompanionDialogue_Solomorne_165
  text: '{n}Соломон выглядит немного озадаченным вашим ответом.{/n} "Не мне учить Вольного Торговца жизни, но... В общем,
    вы можете на меня рассчитывать по части честности и непредвзятости".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 580c457e-6221-4100-a825-b86e87788319
  event: CompanionDialogue_Solomorne_166
  text: '"Не знаю. Это одна из тех паршивых ситуаций, когда только время покажет, насколько верно ты поступил".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ddc09567-3dd1-456d-8bc2-8a8bdd36c89e
  event: CompanionDialogue_Solomorne_167
  text: '{n}Арбитр замирает, на лбу выступают бисеринки пота.{/n} "Мне надо рассказать вам о своем прошлом, если, конечно,
    вы пожелаете выслушать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 089ed759-ca28-4d46-ae7c-633b94fcdc3f
  event: CompanionDialogue_Solomorne_168
  text: '"На вашем месте я бы стойко принял оценку префекта и вооружился горьким опытом Тассеры. Жизнь порой дает под дых
    так, что не увернуться, поэтому важно уметь держать удар".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4253861a-b1be-4ce4-acf4-d0ee19f5a2eb
  event: CompanionDialogue_Solomorne_169
  text: '"Еще я видел недавно ту девчонку, {d|Encyclopedia:CQ_LizzyOnBoardDecision}Мейв{/d}... Делает реверансы перед каждым
    встречным, улыбка до ушей. Раздражает страшно, но она определенно безобидна. Распознавать, кто не несет угрозу, и находить
    ему применение — тоже ценная способность".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9377e063-2795-48d0-b5b0-634f362d567f
  event: CompanionDialogue_Solomorne_17
  text: '"Уверен, Вольный Торговец может позволить себе лучшие импланты".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c0903180-b725-4b5c-ae8c-858523ac0618
  event: CompanionDialogue_Solomorne_170
  text: '"{d|Encyclopedia:CQ_LizzyServDecision}Вы сервиторизовали{/d} ту девицу, Мейв — суровое и правильное решение. Теперь
    враг не сможет вновь воспользоваться ее наивностью".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 42127d2e-5950-4aa2-8a56-e761a99ff7f9
  event: CompanionDialogue_Solomorne_171
  text: '"Могу поговорить с вами о чем-то еще".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4e3fc2ab-f56d-471b-b175-3c6a965ace29
  event: CompanionDialogue_Solomorne_172
  text: '"Наверное, ко мне применимо то, что зовут богатым послужным списком: расследования, подавление бунтов, карательные
    рейды. На моем счету десятки операций". {n}Соломон перечисляет сухо, без намека на гордость.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: eba56544-adec-411c-a3a5-9eb8bcfe6265
  event: CompanionDialogue_Solomorne_173
  text: '"Я был на миссии, и едва ли уделял внимание убогим забавам".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 14b29af0-b994-46d4-b3cd-2a412109e575
  event: CompanionDialogue_Solomorne_174
  text: '"Именно, и этим почти горжусь — какой арбитр опустится до того, чтобы праздно проводить время или, Трон упаси, танцевать?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9c51ac39-a186-4c28-8585-f30315e01dcf
  event: CompanionDialogue_Solomorne_175
  text: '"Сейчас, когда я вспоминаю Тассеру, то явно вижу лишь один момент радости — возвращение на корабль". {n}Соломон отвечает
    сдержаннее обычного, глядя куда-то поверх вашего плеча.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 1c36affd-4d06-4646-942f-84b3676d609a
  event: CompanionDialogue_Solomorne_176
  text: '"Хорошо, раз вы настаиваете, я подумаю еще раз... Вино разило брагой, прятки были покушением — ничего веселого в
    этом нет, прочие увеселения отдавали упадочностью и скудоумием. Вроде все".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e27b9ce2-568f-4101-a06e-c1b916a56c0a
  event: CompanionDialogue_Solomorne_177
  text: '"Хотя нет". {n}Проктор словно сам себя останавливает, подняв палец.{/n} "Мне было приятно увидеть ту аугментированную
    бестию на свободе — сам не знаю, почему".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e7cd4e6a-6207-41fb-9240-523488972b06
  event: CompanionDialogue_Solomorne_178
  text: '"Я точно не советчик в таких вопросах, и не мера весов. Может, просто вас уже сложно удивить — вы Вольный Торговец
    все-таки".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d50e090a-a440-487d-b091-2276c3bfb7fb
  event: CompanionDialogue_Solomorne_179
  text: '"Обязательно учтите это, если вам понадобится спутник на какой-то раут. Знаете, не пьющий, бдительный и умеющий прикрывать
    спину".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4171b1f2-1cb1-4f7d-811c-3947b65cd628
  event: CompanionDialogue_Solomorne_18
  text: '{n}Соломон одаривает вас долгим взглядом.{/n} "Нет".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 76c72d37-7340-4d9d-ba12-75af65607697
  event: CompanionDialogue_Solomorne_180
  text: '"Хорошо, я и сам искал разговора". {n}Ноздри Соломона раздуваются, взгляд беспокойно скользит по мостику.{/n} "Я
    должен рассказать о своем прошлом, чтобы окончательно закрыть всю эту ситуацию. Если вы, конечно, захотите выслушать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cd74b42c-0fae-4566-8037-c9b4554cd01b
  event: CompanionDialogue_Solomorne_181
  text: '"Нам определенно есть что обсудить".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 87014981-0dc5-4fb6-896b-01b7f5363627
  event: CompanionDialogue_Solomorne_182
  text: '"Есть у меня предположение, но… я пока сам в него не верю. Слишком маловероятно, слишком опасно. Однако я охотно
    выслушаю ваши мысли на счет происходящего".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 430943bc-3ce3-40c3-86f6-3e126226d6d7
  event: CompanionDialogue_Solomorne_183
  text: '"Глейто не домашнее животное, Вольный Торговец, подкармливать его бесполезно. Он ест только из моих рук и в строго
    отведенное время — иного дрессура не позволит. Исключает предумышленное отравление и другие попытки навредить кибермастифу.
    Одним словом — не тратьте время и мясо".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 61ae7a0d-1308-48da-8571-2fc1b3d818ad
  event: CompanionDialogue_Solomorne_184
  text: '"О том, что на самом деле толкнуло меня в бездну гнева". {n}Арбитр закрывает глаза, а когда открывает их снова, его
    голос звучит отстраненно и безжизненно.{/n} "В Каликсисе еще до получения ранга проктора я был в отряде с другим арбитром
    — Эммерсоном. Он был не просто соратником — мы одновременно попали в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g},
    вместе прошли подготовку, получили назначение на один мир-улей. Я считал его братом, и я убил его".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7843f123-d8e6-4c12-9f0f-9e6229efd965
  event: CompanionDialogue_Solomorne_185
  text: '"Помните, я рассказывал о миссии, на которой лишился руки? Эммерсон продался преступному синдикату и скомпрометировал
    тот рейд".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7420ac96-87b3-48ce-b781-a5098229748f
  event: CompanionDialogue_Solomorne_186
  text: '"Во время одного рейда мы попали в западню, потому что Эммерсон продался преступному синдикату и предал нас".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b67c96f5-3c7b-4dea-b75e-6ad933524f03
  event: CompanionDialogue_Solomorne_187
  text: '"Я был тяжело ранен в первой стычке, лежал еле живой. Остальные ушли на разведку, а Эммерсон остался охранять меня.
    Он не заметил, как я очнулся, — говорил по воксу. Все требовал повышения платы, а когда он стал диктовать наши координаты,
    я выстрелил ему в затылок". {n}Соломон кладет руку на голову кибермастифа.{/n} "Я решил, что живыми мы отсюда не выберемся,
    поэтому прицепил свой вокс с последним докладом к ошейнику Глейто и приказал ему возвращаться в штаб. Потом снова отключился,
    а пришел в себя уже в плену. Еретики пытали меня сутками напролет, но я продержался достаточно, чтобы дождаться Взыскателей".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: df5856c0-1e7b-4254-8616-9ee3522b6f91
  event: CompanionDialogue_Solomorne_188
  text: '"Особый отряд — специализируется на выслеживании и захвате опасных преступников. Они расследовали предательство Эммерсона
    и вышли на логово еретиков, где меня держали".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e154556e-949d-4fab-b689-0e42e661a1fc
  event: CompanionDialogue_Solomorne_189
  text: '"Я был рядом с трупом их связного — им надо было понять, как я раскрыл их и что еще знаю. Из меня выбивали ответы,
    долго и изощренно. А я молчал, потому что знал: начну говорить, и от меня тут же избавятся".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 95ea0487-301a-49ac-a53f-6b3be6dd9252
  event: CompanionDialogue_Solomorne_19
  text: '{n}Соломон кивает.{/n} "Разумное решение".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 3a148d14-067c-483b-bb4f-12f9e736acdb
  event: CompanionDialogue_Solomorne_190
  text: '"Я бы мог навешать вам на уши красивых словес о том, как перебирал в памяти Инъюнкта Кардинал или молился Императору,
    но... Я правда молился, и я хорошо подготовлен, чтобы терпеть боль, однако и у арбитра есть предел. Когда я почти сломался,
    мне помогла ненависть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 14e746d0-b8ee-4b87-a1f6-a7ea0b91fbd7
  event: CompanionDialogue_Solomorne_191
  text: '{n}Все тело Соломона напрягается, и Глейто тут же подается вперед, ища невидимую угрозу, но железная рука тянет ошейник
    на себя.{/n} "Я вспоминал лицо этого ублюдка, и душил в себе постыдное желание смерти снова и снова. Часы в агонии, часы
    в омуте чистой ярости".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e173a807-4810-4a2b-8d59-d8ef5ee2a3b8
  event: CompanionDialogue_Solomorne_192
  text: '"Я попал под следствие, но был оправдан и назначен на Благочестие, без Глейто. Самый коррумпированный мир-улей в
    Друзианской Марке, два года среди самых поганых представителей Человечества... Меня проверяли, и я прошел проверку — мне
    дали повышение, вернули Глейто, но после предательства Эммерсона я уже не был прежним".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 274b771b-3756-4d48-9697-d8c393556cbd
  event: CompanionDialogue_Solomorne_193
  text: '"Я знаю". {n}В словах нет ни гордости, ни вины, одна только отрешенность, граничащая с полным эмоциональным опустошением.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 66d56872-2f9a-4ce2-b81e-5f640718ddb6
  event: CompanionDialogue_Solomorne_20
  text: '"Нет. Не захотел. Одно время я сам не знал, что думаю о смерти отца. Точнее — старался не думать. Не интересовался
    ходом дела и не искал повода вернуться в Порт Странник: все равно Арбитес не получают назначения на родные миры. Но когда
    я покидал Каликсис, наше судно провело на станции несколько дней, и я позволил себе прийти туда, где убили отца. Немного
    постоял там и…" {n}Соломон задерживает на вас взгляд.{/n} "Ничего. Я просто знал, что другой арбитр довел расследование
    до конца, и мне здесь нечего делать".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 8a36c0e0-4ee5-4656-90e0-fa1dc977ae7c
  event: CompanionDialogue_Solomorne_21
  text: '"Может быть. Он был сухарем, иногда мы по нескольку дней и слова друг другу не говорили. Разговорчивее всего он становился,
    когда по ночам сидел за делами. Просто и скупо рассказывал мне, кто и почему продался, какую мерзость творят еретики на
    нижних уровнях ульев, ради каких низменных потребностей чернь вешает бригадиров... Мне хватило слышать и слушать, наблюдать
    и размышлять".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2e3e6fa5-ce60-4727-ab39-4fb08eb198f9
  event: CompanionDialogue_Solomorne_22
  text: '"Конечно, это правда. Я — арбитр во втором поколении, и мой отец мертвее некуда. Начинаю подозревать, что смерть
    при исполнении — это у нас потомственное, надо только предварительно обзавестись ребенком". {n}Если это и была шутка,
    на лице Соломона и мускул не дрогнул.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 087a7cb4-33c4-41ec-9c0d-edc3d6e1df1e
  event: CompanionDialogue_Solomorne_23
  text: '"Рожден? Я не верю в предопределенность. Но точно знаю, что судьба каждого человека — служить Империуму, а в моем
    случае Империум посчитал, что мне положен ранг Арбитеса, тяжелый дробовик и Глейто. Не знаю, чего еще желать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 21e25f06-7d62-4e9d-bc96-1bc14302b1bd
  event: CompanionDialogue_Solomorne_24
  text: '"Вас понял. Мой ответ был неуместным и неуважительным". {n}Соломон склоняет голову в знак смирения.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: ca4b60ab-4f67-4c65-86df-e3f005bbd11f
  event: CompanionDialogue_Solomorne_25
  text: '"Прежде я не бывал в свите Вольного Торговца. В остальном..." {n}Соломон окидывает мостик взглядом.{/n} "Я приспосабливаюсь
    быстрее, чем вы думаете. И пока Глейто со мной, я готов к любым перестановкам".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: abcf7063-e34b-4f93-9202-0f38827efdca
  event: CompanionDialogue_Solomorne_26
  text: '"Он передал мне сообщение — неожиданно душевное". {n}Соломон прикрывает глаза и почтительно цитирует ровным тоном:{/n}
    "Соломон Антар, ты вновь возведен в ранг проктора — впредь пусть и тени недостойности не ложится на твой мундир".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 45f385e1-3a4b-4d9e-8b6b-d0b3082c3d5d
  event: CompanionDialogue_Solomorne_27
  text: '{n}Каменное лицо Соломона чуть оживляется.{/n} "Слышал, Глейто? Тобой интересуется сам{mf||а} Вольный Торговец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b3485a99-1e0f-4c37-808a-12f7ae1864e6
  event: CompanionDialogue_Solomorne_28
  text: '"С первого до последнего слова? Вы явно плохо знаете маршала, поэтому просто поверьте мне".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 805e7ee1-d685-4344-b68c-53c60452fd08
  event: CompanionDialogue_Solomorne_29
  text: '"И не говорите. Я до сих пор потрясен его словами". {n}Если Соломон и испытывает некоторое потрясение, его лицо остается
    непроницаемым.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ad4fa390-dc3a-4a82-8d77-7bb1620a9e77
  event: CompanionDialogue_Solomorne_30
  text: '"Его серийный номер GL-80. На готике удобно прочесть как "Глейто". Многие называют своих кибермастифов внушительно
    — "Палач" или "Гром", но меня и такое имя устраивает".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 30a9f40e-6475-4cee-b515-fe28b314a93a
  event: CompanionDialogue_Solomorne_31
  text: '"Главным образом он действует как поддержка в бою. Обучен летальным и нелетальным способам захвата цели, способен
    оценивать обстановку и действовать соответствующе. Еще Глейто умеет вести слежку, распознавать элементарные улики. Он
    знает больше сотни команд и в целом..." {n}Соломон замолкает, задумчиво глядя на сидящего по струнке кибермастифа.{/n}
    "Он полезнее и исполнительнее большинства людей, которых я встречал".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: af1a8401-cf99-4ed6-ae15-5292058da9a8
  event: CompanionDialogue_Solomorne_32
  text: '"Более чем. Ваши слова вытащили меня из мрака, и я благодарен за это".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cae7bee3-62ca-4709-8a4d-c6e40cf97408
  event: CompanionDialogue_Solomorne_33
  text: '"Глейто — не питомец. Он инструмент правосудия. Как и я".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f2570c0d-ee96-4d5e-8796-59ea3b7293b8
  event: CompanionDialogue_Solomorne_34
  text: '"Моя вера пересилила разочарование и ненависть. Да, люди слабы и порочны, но не это важно. Главное, что буква закона
    Его совершенна, и она ведет меня — только она".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3af265ba-2224-40ee-bdbe-5682bc48a5a0
  event: CompanionDialogue_Solomorne_35
  text: '"Я много думал о духе закона Его, о том, чего бы сам Император хотел для нас. Если бы мне раньше кто-то сказал, что
    я буду о таком помышлять, я бы, может, и лицо ему разбил. Но теперь я не вижу в подобных мыслях ереси. Наоборот, они словно
    приближают меня к Императору".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6f4f512f-203e-4eba-ac72-e0e628d101a9
  event: CompanionDialogue_Solomorne_36
  text: '"Ненависть все еще клокочет у меня внутри, но теперь я могу дать ей выход — обрушить ее на преступную падаль и даже
    больше... Каждый сомневающийся, любой вольнодумец или хоть в чем-то ненадежный будет судим мной, как отпетый еретик. Только
    так я заставлю людей почитать Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 995ca72e-0f94-408e-b371-c5c8b24ccf6d
  event: CompanionDialogue_Solomorne_37
  text: '"До сих пор не приходилось. Я не провожу время в размышлениях о подобном — это, в лучшем случае, бесполезное занятие".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 210d5a51-5c2d-4d80-ab15-7da09a8d1c9a
  event: CompanionDialogue_Solomorne_38
  text: '"С любым оружием в руках закона. Только служение Лекс Империалис определяет мой "уровень".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9e81b04a-e984-49c5-9690-f881043a883a
  event: CompanionDialogue_Solomorne_39
  text: '"Мы поняли друг друга. Хорошо".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 106ac7eb-12ff-44b2-b0b6-300e1312b8d4
  event: CompanionDialogue_Solomorne_40
  text: '"Да. Дрессура и аугментации гарантируют, что Глейто будет принимать только те приказы, что исходят от меня или вышестоящего
    по чину. Кроме очевидных достоинств, это препятствует неразберихе, когда в миссии участвуют несколько Арбитес с кибермастифами".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4f92ad71-052d-4d6d-a197-0817eaca69e5
  event: CompanionDialogue_Solomorne_41
  text: '"Обычно кибермастифов лишают любых проявлений животной натуры, но Глейто — особый случай. Его подмодель берет за
    основу собачью верность, охотничьи и сторожевые инстинкты и возводит их в абсолют. Он не пес и не сервитор, а намного
    лучше: кибермастиф — живое оружие на службе закона".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b2ba4bc2-5f31-4230-ac4a-28e10767b23a
  event: CompanionDialogue_Solomorne_42
  text: '"Глейто, изготовка". {n}Кибермастиф немедленно принимает стойку, а Соломон начинает указывать на разные части пса.{/n}
    "Корпус — по большей части из металла, бронепластины закрывают жизненно важные части тела. Челюсть усилена — откусить
    ногу, что волос выдрать". {n}Он поворачивает морду Глейто, чтобы вам было лучше видно и без того огромные клыки.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fa396b06-dff7-4614-82c7-879853874e30
  event: CompanionDialogue_Solomorne_43
  text: '{n}Соломон треплет пса за холку, пристально глядя ему в глаза.{/n} "Я не знаю и десятой доли того, чем начинен Глейто,
    но поверьте — список внушительный. Взять хотя бы сенсоры в носу, которые делают из кибермастифа мини-лабораторию по анализу
    запахов". {n}Арбитес похлопывает пса по спине.{/n} "Все. Глейто, смирно".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 0e554297-937c-42cc-ad70-0e5241a5eafe
  event: CompanionDialogue_Solomorne_44
  text: '"Начиная от "убей", "охраняй" и так далее, заканчивая комплексными протоколами для охраны и патрулирования — то есть
    комбинациями паттернов поведения, по которым кибермастиф действует в зависимости от ситуации. Иначе говоря, мне не всегда
    надо контролировать Глейто — он способен оценивать обстановку и реагировать самостоятельно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 17b78c6c-2d9e-4a73-928d-cb3945737d9e
  event: CompanionDialogue_Solomorne_45
  text: '"Как скажете".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d21d0519-3457-42cf-957d-23d94aed2c85
  event: CompanionDialogue_Solomorne_46
  text: '"Самыми значительными. За пределами Коронуса мы не только собираем {g|Encyclopedia:TitheGlossary}десятину{/g}, но
    и следим, чтобы каждый мир подчинялся законам Его, и никто не посягал на имперскую власть. Продажные губернаторы, преступные
    синдикаты, мятежники — ежеминутно какая-то мразь пытается оторвать кусок от Империума. Мы уничтожаем любого, кто дерзнет
    преступить закон".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e416b498-adb8-45ba-9cd2-95ec43b0ddb9
  event: CompanionDialogue_Solomorne_47
  text: '"Вы понимаете". {n}Соломон шумно выдыхает.{/n} "Долго же это меня глодало... Наверное, мне просто надо было, чтобы
    другой человек озвучил мои собственные мысли. Спасибо".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: cc3aa569-6c6d-48d7-ae97-f4652c9cd872
  event: CompanionDialogue_Solomorne_48
  text: '{n}Соломон встречает вас, выпятив грудь, точно собирается на битву.{/n} "Благодарю, что нашли время поговорить о
    моем рапорте. Смею просить, чтобы этот разговор состоялся в приватной обстановке. Позвольте продолжить в вашем кабинете,
    Вольный Торговец".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 35bd5a8f-f45b-4eee-89f8-0cdb4a8c0d42
  event: CompanionDialogue_Solomorne_49
  text: '"О нем не беспокойтесь — Глейто полностью исправен. Недавно закончил проверять все протоколы, и он подхватывает приказы
    с полуслова. Не буду кривить душой — мне этого очень не хватало".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3c4ee89e-ab39-4d00-bc06-bd7cadeebdaf
  event: CompanionDialogue_Solomorne_50
  text: '"Может быть, вы правы". {n}Соломон задумчиво поправляет на Глейто совершенно ровно сидящий ошейник.{/n} "Может быть".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: e1e3e273-7998-4681-b0b5-c1b6eeb5ed0f
  event: CompanionDialogue_Solomorne_51
  text: '"Первое время я был не в себе, но стиснул зубы и стал читать катехизисы Лекс Империалис — с самого начала, как если
    бы вновь оказался в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g}. Каждый раз, чувствуя, что снова сорвусь,
    я запирался в каюте и перечислял положения Инъюнкта Кардинал, и это помогло".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f2d03a70-c734-40cd-97a3-2b5cadb6a381
  event: CompanionDialogue_Solomorne_52
  text: '"Хорошо. Самое время перевести тему".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b0bc0d2f-0f7e-4e9b-a777-0a2b912a5188
  event: CompanionDialogue_Solomorne_53
  text: '"Вы о проведенной вместе ночи? Думаю, нам не стоит придавать ей большего значения, чем она заслуживает".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f205d245-3e6c-4965-92e1-01da63937ddc
  event: CompanionDialogue_Solomorne_54
  text: '"Конечно, {name}". {n}Соломон невозмутим, но глаза его улыбаются.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 3f0ee87e-721f-436f-8776-4f581a575f31
  event: CompanionDialogue_Solomorne_55
  text: '"А разве между нами что-то происходит? Мне казалось, мы прояснили этот вопрос — я лгал, и между нами нет ничего кроме
    службы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cb314e3c-36ae-42e1-926b-27dd3241f5c1
  event: CompanionDialogue_Solomorne_56
  text: '"Как вы могли убедиться на Райкаде Минорис — весьма".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b0201e3e-a48a-48e5-bbf7-a30e084a4dc5
  event: CompanionDialogue_Solomorne_57
  text: '"Вы просто обезоруживаете меня такими словами". {n}Соломон отвечает тише обычного, точно это признание дается ему
    непросто.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 1615f157-bf49-4821-a526-69c11e8b6cf0
  event: CompanionDialogue_Solomorne_58
  text: '{n}Выпятив мощную челюсть, Соломон хмуро произносит:{/n} "Если такова ваша воля — все кончено. Я не смею требовать
    объяснений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 40c0540d-ea68-4925-ad15-179dc0cb6e50
  event: CompanionDialogue_Solomorne_59
  text: '"...особенное? Волнующее? Опасное?" {n}Приподняв бровь, проктор делает шаг и оказывается близко, слишком близко.{/n}
    "Нужны двое, чтобы ответить на этот вопрос. Я знаю, чего хочу". {n}Его взгляд скользит по вам.{/n} "А чего желаете вы?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7e486ae6-e39d-4095-af8f-ba24c946a8d2
  event: CompanionDialogue_Solomorne_60
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "Что будет, если я отвечу "Да"?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: cbdb8bd7-5f41-45d8-a059-0f70a5c8d90c
  event: CompanionDialogue_Solomorne_61
  text: '{n}Соломон почтительно кивает.{/n} "Как вам угодно".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 91b6087b-0238-4b75-bb6e-2ddd35fd278c
  event: CompanionDialogue_Solomorne_62
  text: '{n}Голос Соломона тих и серьезен.{/n} "Перед тем как я отвечу... Я слышал разговоры ваших офицеров, и мне кажется,
    что кое-чье сердце может быть разбито. Вы уверены, что после не сочтете это ошибкой?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8efe837d-5307-4df8-8295-c12e6b9bacdc
  event: CompanionDialogue_Solomorne_63
  text: '"Это все... не слишком известное мне пространство. Моя жизнь — служба, и на службе я куда чаще задаюсь вопросом "виновен
    ли этот человек", чем вопросом "как я отношусь к этому человеку". Я впервые испытываю к кому-то подобную тягу, так что
    прошу простить за неопытность".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d61d9c40-db78-4b3f-8d76-7e272501aaf5
  event: CompanionDialogue_Solomorne_64
  text: '"Это помешает службе — и моей, и вашей".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 2f1f6d5f-b58e-46f6-8b1b-afc797aa6a66
  event: CompanionDialogue_Solomorne_65
  text: '"Велики, и для многих в Коронусе это становится неприятным сюрпризом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ce05621c-7b13-4cfd-80c6-13d75e159161
  event: CompanionDialogue_Solomorne_66
  text: '"О ней и ее людях можно не беспокоиться — они ждут возможности отчитаться перед маршалом. Уж что-что, а терпеливо
    ждать они умеют". {n}Соломон немного понижает голос.{/n} "Я не сообщал Йегер о связи стража Летуса с леди Теодорой — ей
    ни к чему это знать".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 9daac29c-0fdd-4820-a7a7-49cc8b1428bc
  event: CompanionDialogue_Solomorne_67
  text: '"По меркам Арбитес я уже погряз в ереси, но знаете, меня не пугает их осуждение. Я служу Императору как никогда прежде,
    я больше не слеп и не скован, но бремя долга от осознания этого лишь сильнее давит на плечи. Так много надо сделать, чтобы
    защитить Коронус от бедствий и раздоров, и я сам возлагаю на себя эту миссию".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 65266d45-335a-47d9-bf84-0c43318023c3
  event: CompanionDialogue_Solomorne_68
  text: '"Ограничения в толковании Лекс Империалис — это поводок, который гарантирует, что слабые и недальновидные Арбитес
    не дадут маху. Я давно перерос рамки системы и вижу ее изъяны. И, если во имя порядка в Империуме, мне придется что-то
    сломать и выстроить заново, я это сделаю".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 21eb175a-757e-45c1-a9ed-a8f853aefd4d
  event: CompanionDialogue_Solomorne_69
  text: '"Раз уж вы подняли эту тему — вас беспокоит, что я нашел новый путь служения?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6aadb8ca-de22-4f46-9df6-9613ce4c8946
  event: CompanionDialogue_Solomorne_70
  text: '{n}Проктор прижимает к сердцу железную ладонь.{/n} "Для меня это много значит, Вольный Торговец — быть не только
    вашим спутником в странствиях, но и соратником в борьбе за новое толкование Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 75552cda-0a7a-458a-80a3-ba9e6220946e
  event: CompanionDialogue_Solomorne_71
  text: '"Я меняюсь, чтобы лучше служить Лексу, разве это не часть долга?" {n}Проктор переводит взгляд с вас на Глейто.{/n}
    "Не ожидал от вас подобных слов, учитывая... Нет, не важно. Вы сказали, что считали нужным".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 85081488-044c-418b-ac77-3f0824c65574
  event: CompanionDialogue_Solomorne_72
  text: '"Тогда тема закрыта".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 3a3367b3-68ba-465c-ba9c-fe3318ca6521
  event: CompanionDialogue_Solomorne_73
  text: '"Понимаю ход ваших мыслей: Летус выглядел выгребной ямой отчаяния и безумия, а раз за хранение десятины отвечают
    арбитры, то и вывод простой. Простой, но неверный. Попробуйте посмотреть с другой стороны: Лекс Империалис дает четкую
    директиву к действию, надо лишь следовать ей. Гвардейцы могли смиренно ждать, клерк — покаяться в незавершенной работе.
    Но они выбрали свои слабости и пороки. Так что на самом деле несет вред?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6c5c6071-e62e-438c-87b8-3e75c4b6f0ae
  event: CompanionDialogue_Solomorne_74
  text: '"Ваши действия говорят за себя лучше любых слов, но..." {n}Соломон смотрит вам прямо в глаза.{/n} "Будь я проклят,
    если не признаюсь, что рад услышать лично от вас о верности Лекс Империалис. Когда мир летит в бездну, я хочу знать, что
    мы сражаемся за одни идеалы".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 712256a5-960e-4fe0-8020-57b59fc0a1f5
  event: CompanionDialogue_Solomorne_75
  text: '"Арбитес выносят приговор и приводят его в исполнение на месте. Только высшие чины {g|Encyclopedia:HolyTerraGlossary}Терры{/g}
    и служители Инквизиции могут рассчитывать на привилегию суда, а в Просторе — Вольные Торговцы. Планетарные губернаторы,
    знать, духовенство — для арбитров все они равны перед законом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a699685d-303f-4a0e-abaa-b5cbf2927c99
  event: CompanionDialogue_Solomorne_76
  text: '"Не сомневайтесь, я больше не подведу вас. И в знак своей решимости я должен кое-что сделать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: be090b93-766c-4639-b2b3-5df61ac358dc
  event: CompanionDialogue_Solomorne_77
  text: '"Проверяете меня? Я не против". {n}Голос Соломона приобретает особую глубину, даже торжественность:{/n} "Лекс Империалис
    — это свод законов и слово самого Бога-Императора. Тысячелетиями Его указы собирались и хранились на {g|Encyclopedia:HolyTerraGlossary}Святой
    Терре{/g} в Зале Суда вместе с распоряжениями Верховных Лордов. Это одновременно и огромное собрание законов, и священное
    писание".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4688fb65-1202-41af-b5f1-703af4dff9b6
  event: CompanionDialogue_Solomorne_78
  text: '"Лучше. Иногда мне кажется, что я вот-вот сорвусь, но вспоминаю ваши слова, и голова проясняется".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ea657ae5-d990-464b-a2e6-1c014e773b8e
  event: CompanionDialogue_Solomorne_79
  text: '"Отвратительно". {n}Соломон поднимает к лицу слегка дрожащую железную ладонь и сжимает в кулак.{/n} "Но я не дам
    себе развалиться на куски — одной позорной слабости более чем достаточно".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: d959a87f-9075-4236-8df5-f5895e0d1510
  event: CompanionDialogue_Solomorne_80
  text: '{n}Соломон поглощен тем, что оттирает тряпицей кровь с аугментированной руки. Оторвав взгляд от импланта, он устало
    кивает.{/n} "Вольный Торговец?"'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 6d0878ca-2064-465c-8e74-ff9f38e236b2
  event: CompanionDialogue_Solomorne_81
  text: '"Для начала надо понять, как сами ксеносы выбираются отсюда — как просачиваются в Коронус, чтобы грабить, убивать
    и брать пленных. А когда мы это поймем, то надо будет пробиваться к выходу с боем — для этого уже сейчас надо искать умелых
    бойцов".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 28bd0660-2af1-431f-8e66-a2cea6c5b514
  event: CompanionDialogue_Solomorne_82
  text: '"Хотя последнее уже не актуально с тех пор, как Ангел Императора присоединился к вам. Какое еще боевое подкрепление
    можно желать, дредноут?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0104a47f-75ab-49a8-a5ff-8ab93363701c
  event: CompanionDialogue_Solomorne_83
  text: '"Не могу. Не потому что не доверяю вам, а потому что не хочу, чтобы мои суждения толкнули вас на опрометчивый поступок
    — возможно, враг именно этого и ждет. Мы должны отправиться к маршалу и расследовать это дело строго в рамках Лекс Империалис.
    Только так удастся избежать ошибки".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a81a215b-dda0-4285-8aa2-2042de6f586d
  event: CompanionDialogue_Solomorne_84
  text: '"Иногда я позволяю ему поиграть с трупами еретиков". {n}Соломон выдерживает паузу.{/n} "Шутка. Если вы спрашиваете
    про развлечения, то само это слово плохо применимо к служебной собаке Арбитес. Однако мне кажется, что Глейто с энтузиазмом
    воспринимает мои персональные тренировки. Ему нравится сопровождать меня в беге на долгие дистанции, и во время стрелковой
    практики он всегда ждет, что я дам ему приказ атаковать мишень".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: b47c822f-f05a-4d75-b272-d6e034d21f34
  event: CompanionDialogue_Solomorne_85
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "В таком случае мой ответ на ваш вопрос — да".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fb389619-48ce-419d-8d3d-b5baf2947c2a
  event: CompanionDialogue_Solomorne_86
  text: '"Этот приказ я исполню с удовольствием".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 473af26c-5954-4912-be30-d254a4631751
  event: CompanionDialogue_Solomorne_87
  text: '{n}Арбитес чуть кашляет.{/n} "Ладно, удовлетворю ваш интерес. Есть у меня одна особая тренировка, которая помогает
    оттачивать охотничьи инстинкты Глейто: я беру несколько гильз и прячу их в труднодоступных местах. Как-то раз после рейда
    на мануфакторум я устроил Глейто раздолье в заброшенном цехе, но с одной гильзой схитрил и закинул ее на потолочную балку.
    Тогда уже схитрил Глейто — сидел под балкой, пока я не подошел, прыгнул мне на плечи и забрался наверх. Раскроил мне когтем
    висок и чуть ключицу не сломал, но до гильзы добрался".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 00af0b89-a6f4-4c26-8605-7c3ca4787322
  event: CompanionDialogue_Solomorne_88
  text: '"Я редко ошибаюсь в таких вопросах, Вольный Торговец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b1194019-b6b9-44ce-9931-fdc67ca3704b
  event: CompanionDialogue_Solomorne_89
  text: '"Слушаюсь, Вольный Торговец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 347025fe-2fe4-48e6-8107-a64aec406032
  event: CompanionDialogue_Solomorne_90
  text: '"У нас нет доказательств, что это одни и те же наемники. Враг хорошо заметает следы, и нам тоже надо быть осторожными".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 555bf601-147f-4c83-891d-14851b9ed4f3
  event: CompanionDialogue_Solomorne_91
  text: '"Я пришел к тем же выводам. Саргона никогда не покушался на слишком большие куски: десятину Райкада ему было не проглотить
    — на него охотились бы не только Арбитес, но и преступники, желающие растащить подать на части. Саргона действовал по
    чьей-то указке и не боялся следствий".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a2b62474-bacc-4b25-a6f8-ea7298623b02
  event: CompanionDialogue_Solomorne_92
  text: '"Верно, поговорим лучше о другом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bcf2aead-9ecd-4e73-bf32-cdba31c73056
  event: CompanionDialogue_Solomorne_93
  text: '"Маршал может увидеть в таком решении знак, что союз между вашей династией и Арбитес будет разорван. Что я должен
    передать ему?"'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e181e118-9762-4b98-80d6-5bbd69579719
  event: CompanionDialogue_Solomorne_94
  text: '"Как прикажете". {n}Лицо проктора остается непроницаемым.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b60787c9-2ced-4ab3-97e9-06f221b78c2b
  event: CompanionDialogue_Solomorne_95
  text: '"Принято. Я покину флагман при первой же возможности и сообщу маршалу ваши слова. Прощайте, Вольный Торговец".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 82c3e3f6-6844-40f0-926a-da420f7e5f39
  event: CompanionDialogue_Solomorne_96
  text: '"Все, что оттачивает навыки и инстинкты Глейто и полезно при исполнении долга".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4f8366b5-ddf0-4b12-9f89-68d1152afc89
  event: CompanionDialogue_Solomorne_97
  text: '"Не умею? Да я танцевал". {n}Соломон говорит это таким голосом, каким иные признаются в страшной ереси.{/n} "Боюсь
    представить, что для вас значит веселье, если нашего танца на Тассере вам оказалось мало".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: b37dda54-6ac1-4a18-99b1-225cfcbaa4f9
  event: CompanionDialogue_Solomorne_98
  text: '"Понимаю. Этот суд был беспрецедентным, как и его финал".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 31d69f7b-0cb2-4a44-8093-273bc1e5e148
  event: CompanionDialogue_Solomorne_99
  text: '"Зависит от того, как много из нас окажутся неблагонадежными. Тщательное расследование выявит это, но даже если нас
    останется с десяток, мы все равно будем до последнего вздоха служить закону Его".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 70635284-2f18-4170-a155-401d0ac03471
  event: OfficialPropos_Solomorne_01
  text: '{n}Лицо Соломона непроницаемо. Он сверлит взглядом инфопластину в ваших руках. Наконец он с удивительной мягкостью
    произносит:{/n} "Полагаю, вы желаете объяснений".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 33cbba8f-95a0-4cdf-a0ab-1e70df5c5114
  event: OfficialPropos_Solomorne_02
  text: '"Если это не взаимно — скажите, я пойму. В противном случае — я приношу извинения за необдуманные слова и хочу забрать
    их назад".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a1b257c0-d3cf-4432-8643-ac295eac7807
  event: OfficialPropos_Solomorne_03
  text: '"Если это доставит вам удовольствие, я напрягусь и смогу выучить вторую". {n}Бросив на вас многозначительный взгляд,
    он добавляет:{/n} "Для вас я могу все что угодно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7622359c-f1d2-4ae2-8c50-35d55b953294
  event: OfficialPropos_Solomorne_04
  text: '"Поверьте, далеко не единственный". {n}Скупая, но от того не менее двусмысленная улыбка возникает на губах арбитра.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 50be2d41-e198-4ba3-8b80-4725b4cd20a4
  event: OfficialPropos_Solomorne_05
  text: '"Слава Императору нет. Но однажды мне довелось конвоировать в столицу сектора Каликсис некую персону особой важности.
    Сам губернатор ожидал его. Я провел восемь терранских месяцев в запечатанных покоях наедине с ним, пока корабль шел к
    Сцинтилле. Не знаю, кем он был, и какая важность вознесла его в ранг опекаемых Адептус Арбитис субъектов. Знаю лишь, что
    он очень любил играть на органе эту мелодию. Я запомнил ее".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6c95868a-f7f2-4054-a17c-9b278291206b
  event: OfficialPropos_Solomorne_06
  text: '{n}Не отрываясь от клавиш, Соломон изрекает:{/n} "По крайней мере вам весело. Уже неплохо".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9c8374ca-092e-4999-af64-846e521670d3
  event: OfficialPropos_Solomorne_07
  text: '"Все, что я делаю, я стараюсь делать хорошо". {n}Арбитр прищуривается, извлекая из инструмента прихотливый пассаж
    одной рукой и убрав за спину другую.{/n} "Даже идеально".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b3df8a1d-c3ed-40e4-95ea-5bb847de61e5
  event: OfficialPropos_Solomorne_08
  text: '"Не назвал бы себя опытным в этом вопросе. Прежде я не встречал людей, которые увлекали бы меня настолько сильно.
    Я просто предпочитаю говорить как есть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: f7f8fffb-e646-428f-8bea-baa5ef94c0c6
  event: OfficialPropos_Solomorne_09
  text: '{n}Арбитр недовольно прищуривается.{/n} "Глупая ошибка. Я работал в кают-компании на выделенном мне месте и банально
    забыл инфопластину, а Глейто — опознал его как мою важную собственность, потому перешел в режим охраны. И начал отгонять
    всех, кто мог на него посягнуть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 92fc046e-a2b5-4657-96f0-e84d03ef51fe
  event: OfficialPropos_Solomorne_10
  text: '{n}Отняв руку от клавиш, он привлекает вас к себе уверенным и сильным движением. Клавиши под весом вашего тела издают
    пронзительный вскрик. Соломон дарит вам белоснежную улыбку.{/n} "Я рад, что ты дал{mf||а} мне еще один шанс".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0b01eb02-6f18-4996-b689-7c4b8e63a42c
  event: OfficialPropos_Solomorne_11
  text: '{n}Искоса взглянув на вас и не прекращая играть, Соломон тихо произносит:{/n} "Раньше я ни для кого не играл. Это
    — мой знак внимания".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: ca2dea54-9a12-4b4b-9fd2-68dcb37100a2
  event: OfficialPropos_Solomorne_12
  text: '{n}Уголки рта Соломона чуть поднимаются.{/n} "Если вы имеете ввиду, что я показал себя растяпой — то полностью согласен.
    И рад, что извлеку этот урок из события, которое не повлекло трагедии".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a60aeaf4-a2b5-4b10-b1b5-8547d35dc398
  event: OfficialPropos_Solomorne_13
  text: '{n}Арбитр на миг застывает, на его губах возникает скупая, но дерзкая улыбка.{/n} "Я могу показать".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dad16078-8fec-4d5f-9707-e9a007eae4cc
  event: OfficialPropos_Solomorne_14
  text: '{n}Соломон кивает.{/n} "Намного больше. И намного значимее для меня. Не смею претендовать на официальный статус,
    но обещаю вам свои дружбу, верность, терпение..." {n}Арбитр хмыкает.{/n} "Говорю как идиот, верно? Вы мне просто очень
    нравитесь, {name}. И я хотел бы выражать это чувство открыто".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: ca543040-3424-44ae-874a-9ade0bddcb4f
  event: OfficialPropos_Solomorne_16
  text: '"Думаю, все же обязан. Чтобы между нами все было прозрачно".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6050e974-4d72-4413-a988-dfa6dde118ca
  event: OfficialPropos_Solomorne_17
  text: '{n}Соломон клятвенно поднимает сжатый кулак и качает головой.{/n} "Нет. Я не выведываю чужих тайн и не осуществляю
    тайного наблюдения. Лишь записываю то, что вижу. Хранить бдительность — мой долг".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 11d06807-617e-45a1-9924-3f84c4194b6d
  event: OfficialPropos_Solomorne_18
  text: '"Прошу простить. Это не повторится". {n}Напряженная поза Соломона чуть расслабляется, на лице возникает тень странного
    облегчения.{/n} "Разрешите идти".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 91e4ec1f-6686-48a6-906d-8df5b64c82f2
  event: OfficialPropos_Solomorne_19
  text: '{n}Арбитр победно прищуривается.{/n} "Согласен на звание хоть придворного органиста, если вы не попросите меня сыграть
    что-нибудь еще. Я знаю только эту композицию".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 84b2a590-cc54-487f-857d-eaf5b7930acf
  event: OfficialPropos_Solomorne_20
  text: '{n}Арбитр хранит долгую паузу, а затем решительно рубит:{/n} "Я свалял дурака той ночью. Между нами возникла близость,
    и это... возможно, это меня встревожило. Или я не был готов испытать сильное чувство. Но я его испытал — я думаю о вас
    и о том, что могло бы между нами быть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 095bbde1-13f3-436b-84b9-4c5b20cb6257
  event: OfficialPropos_Solomorne_21
  text: '"С ним все будет в порядке, Глейто {d|Encyclopedia:RMC_DogInjuredDecision}не получил серьезных ран{/d}. Благодарю,
    что вы не были с ним слишком суровы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7aa154db-4d69-4c4f-b168-c2d108a39212
  event: OfficialPropos_Solomorne_22
  text: '{n}Пока вы зачитываете идею совместно посетить священнослужение в реликварии, Соломон сохраняет каменное выражение
    лица. Мысль о романтическом свидании под витражами корабельного обсерваториума приветствует едва слышно скрипнувшими зубами.
    На строчке "может, бутылка хорошего амасека и перстень побогаче, реквизированный у какого-нибудь рвача-чинуши?" его глаз
    нервно дергается. Но стоит вам начать читать вслух строчки некоего пафосного — и явно откуда-то украденного, — признания
    в любви, как он громогласно фыркает, чудовищным усилием подавляет улыбку и заявляет:{/n} "Прошу вас. Я готов выглядеть
    в ваших глазах идиотом — я определенно это заслужил, — но оставьте мне хотя бы крохи самоуважения".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 669af65c-fb6a-43e6-8812-1e6639ee8754
  event: OfficialPropos_Solomorne_23
  text: '{n}Соломон вновь надолго задумывается, а затем с сомнением произносит:{/n} "Поди знай... Если я скажу, что вы — особенн{mf|ый|ая},
    это будет звучать банально, да? Но так и есть. Прежде я не встречал людей, подобных вам".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 83734272-96bc-4709-b009-890fd02f5039
  event: OfficialPropos_Solomorne_24
  text: '"На этой инфопластине — мой журнал наблюдений за вами и членами вашей свиты. В ней я фиксирую привычки, особенности
    характера, заслуживающие внимания факты. И, если говорить о вашей персоне... не только их. Думаю, вы уже обнаружили там
    записи иного характера — размышления о том, как можно было бы оказать знак внимания Вольному Торговцу". {n}Взгляд из-под
    чуть опущенных бровей можно было бы счесть лукавым в исполнении менее сурового человека.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: db44677c-7d11-4e3c-b784-3618aeb9967a
  event: OfficialPropos_Solomorne_25
  text: '"В дальнейшем я не повторю подобной глупости".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9bbf2ef5-c943-4846-930e-f3dce5931882
  event: OfficialPropos_Solomorne_26
  text: '{n}Соломон кисло изрекает:{/n} "Да, мне она тоже подарила... незабываемые ощущения".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: ccfa52cb-c200-4adf-8f36-f2745c6d20a0
  event: OfficialPropos_Solomorne_27
  text: '"Знаете, {name}, вам повезло, что Глейто не оттяпал вам руку, пока вы отбирали у него инфопластину. Уверен, ему было
    непросто решить, чья безопасность важнее — ваша или моих записей".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: fa36b7ca-126b-490b-a289-e7badd298a9a
  event: OfficialPropos_Solomorne_28
  text: '"Это было бы неслыханным коварством для арбитра. Боюсь, что вы переоцениваете мою находчивость". {n}По лицу Соломона
    сложно оценить искренность его слов.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: abc9a3c7-fcfb-4b3d-8210-42bca5123669
  event: RM_ArbitesFirstMeeting_Solomorne_01
  text: '{n}Могучего телосложения мужчина осматривает поле брани. Его лицо, волевое и бесстрастное, напоминает о статуях героев
    Империума. Задержавшись на вас взглядом, он поднимает вверх железный кулак:{/n} "Арбитры — периметр. Формация — сорок
    семь пятьдесят пять. Глейто — рядом".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 91ca152a-77cf-40ec-bfbd-2ec7e2b08f5e
  event: RM_ArbitesFirstMeeting_Solomorne_02
  text: '"{g|Encyclopedia:ProctorGlossary}Проктор-взыскатель{/g} Соломон Антар, {g|Encyclopedia:AdeptusArbitesGlossary}Адептус
    Арбитес{/g}. Назовите свое имя и цель пребывания на Райкаде Минорис". {n}Его голос звучит спокойно и ровно, но пальцы
    застыли на курке оружия.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: e21394e4-384b-4f7c-a992-a691773a1de2
  event: RM_ArbitesFirstMeeting_Solomorne_03
  text: '"Вольный Торговец? У Инцендии Чорда нет наследников, а преемников Каллигоса Винтерскейла я знаю наперечет".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 617d9bd8-dcb9-4906-900c-d7d4642b061e
  event: RM_ArbitesFirstMeeting_Solomorne_04
  text: '"Значит, Теодора фон Валанциус мертва. Я передам маршалу Страксу эту прискорбную весть".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4ce1a45f-7569-4808-8456-508016a2e6b8
  event: RM_ArbitesFirstMeeting_Solomorne_05
  text: '"Избавляемся от препятствий на пути официального расследования". {n}На каменном лице нет ни намека на улыбку.{/n}
    "Я прибыл с отрядом для расследования пропажи крайне ценного судна, но в процессе нас отвлекает мятежное отребье. Приходится
    попутно заниматься им".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: c1444632-c737-4cea-99ca-7d2dacc64193
  event: RM_ArbitesFirstMeeting_Solomorne_06
  text: '"Только то, что губернатор плохо справляется со своими обязанностями". {n}Арбитр говорит сухо, словно констатирует
    факт.{/n} "Бушует бунт планетарного масштаба, и от него разит безумием или того хуже — колдовством. Мятежники ослепляют
    себя и других и несут самый больной и нечестивый бред, какой я только слышал".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0d7546c9-7d8b-48e5-8632-f375c1ddaae9
  event: RM_ArbitesFirstMeeting_Solomorne_07
  text: '"О судне с десятиной". {n}Последнее слово мужчина произносит с особым нажимом.{/n} "Корабль, набитый планетарной
    податью за внушительный период, не выходит на связь с тех пор, как покинул Райкад Минорис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: d71f12d9-4592-4078-be15-825dcefeec11
  event: RM_ArbitesFirstMeeting_Solomorne_08
  text: '"Пробиваться с боем к дворцу Администратума и убедиться, что пожар или другое бедствие не уничтожило важные для следствия
    бумаги — надеюсь, у клерков хватило ума спасать в первую очередь записи, а не свои жизни. Если Император будет благоволить
    нам, мы успеем изъять важные данные или допросить выживших, а после нанесем визит губернатору — к нему накопились вопросы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a7b4ac62-4e50-47a2-9630-d547104a9f98
  event: RM_ArbitesFirstMeeting_Solomorne_09
  text: '"Вынужден отказать. Наша миссия и приказ маршала имеют высший приоритет, даже перед просьбой такой важной особы,
    как вы".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 50e919be-19f5-4c45-88c0-452e4d2b9d41
  event: RM_ArbitesFirstMeeting_Solomorne_10
  text: '"Арбитры, добить выживших". {n}Проктор тут же отщелкивает дымящуюся гильзу из патронника и перезаряжает оружие, возвращаясь
    в полную боеготовность.{/n} "Сейчас не лучшее время для разговоров. Мы стоим здесь, как живые мишени. Если вопросов больше
    нет — я отправляюсь дальше".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 7b6518a1-8661-42b6-b500-44fee26be5cf
  event: RM_ArbitesFirstMeeting_Solomorne_11
  text: '"Под подозрением все жители планеты, но губернатор Медина — особенно. Чтобы посягнуть на священную десятину, надо
    обладать информацией, ресурсами и властью, и губернатор подходит под такое описание".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a345e725-f02e-4dd2-9cdf-0f1310741854
  event: RM_ArbitesFirstMeeting_Solomorne_12
  text: '"Тем более на планете бунт. Очень удобно — сколько записей и важных свидетелей могут быть потеряны? Некоторые зовут
    подобное "прятать концы в воду". И мне не нравится, насколько хорошо эта фраза подходит к происходящему".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 5f7b594c-9651-48d2-b020-ec966153437a
  event: RM_ArbitesFirstMeeting_Solomorne_13
  text: '"Пусть Император присмотрит за нами, и это будет не последняя наша встреча".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8a37516d-ce8e-43d1-ab93-b307223b03eb
  event: RM_ArbitesFirstMeeting_Solomorne_14
  text: '{n}Соломон бьет кулаком в грудь и покорно произносит:{/n} "Я прошу меня простить и не судить по моему поведению о
    других арбитрах".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 28bb4ca2-fd94-4f7c-9895-dcd82cddb5f6
  event: RM_ArbitesFirstMeeting_Solomorne_15
  text: '{n}Лицо проктора на мгновение меняется, словно его пнули под дых.{/n} "Если Император не отнял мой разум, то Леди
    Теодора мертва, и ей наследовал{mf||а}... Неважно, {d|Encyclopedia:CharGen_Criminal}кем вы были{/d} — я буду подобающе
    относиться к владетел{mf|ю|ьнице} священного Патента, как должно всем арбитрам, включая маршала Стракса".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 45e5c29d-da18-4138-9bae-5dd15b9027b1
  event: RM_ArbitesFirstMeeting_Solomorne_16
  text: '{n}Огромный кибермастиф немедленно перестает скалиться в вашу сторону и замирает у ног хозяина. Только кровь густыми
    каплями падает с металлических клыков.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 372d9ba4-ac21-4b5f-b3f1-fec360ceadf3
  event: RM_ArbitesFirstMeeting_Solomorne_17
  text: '"Ресурсы, которые каждый мир должен отдавать на благо Империума. В случае Райкада Минорис это керамит и реагенты
    для взрывчатых веществ, добываемые на Райкади Филии, бронестекло, медицинские припасы, а также гвардейцы — живая десятина
    для назначения в имперские полки. В руках еретиков этот груз особенно опасен, поскольку его легко конвертировать в состояние
    или использовать в военных целях".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b7310498-4b97-45fb-860c-26f740ca0b9c
  event: RM_ArbitesFirstMeeting_Solomorne_18
  text: '"Далеко не каждый бунт требует внимания Арбитес. Пока я оцениваю обстановку — если ради расследования надо подавить
    мятеж, мы вмешаемся. Но лучше бы губернатору навести порядок. В конце концов, не для красоты он тут сидит".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b1bfc143-2337-4680-8e98-6312e72f8d4e
  event: RM_ArbitesFirstMeeting_Solomorne_19
  text: '"В этой стычке Глейто не показал и десятой доли того, на что способен". {n}Соломон треплет пса за холку.{/n} "Но
    он уверенно догоняет меня по числу убитых за сегодня еретиков".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 7a04e00b-9d56-4d69-b170-68226fbb970f
  event: RM_ArbitesFirstMeeting_Solomorne_20
  text: '"Значит, новой главой династии стал{mf||а} {mf|тот|та}, {d|Encyclopedia:CharGen_Arbitrator}кто большую часть жизни{/d}
    служил{mf||а} Лекс Империалис. Все же лучше получить хорошую и плохую новость, чем только плохую. Я передам маршалу Страксу
    обе".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0752ca51-2c40-4db6-bcfb-154dfe353469
  event: RM_ArbitesFirstMeeting_Solomorne_21
  text: '"Словами меня с места не сдвинешь. Разве что вы ответите на мой вопрос".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 9b0f4c75-86d9-4ae1-9005-66d1e12f356b
  event: RM_ArbitesFirstMeeting_Solomorne_22
  text: '{n}Соломон склоняет голову.{/n} "Ваша предшественница в свое время заключила союз с арбитрами — я чту это и более
    не смею вас задерживать".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 74f7e1fa-c0a1-4453-92fc-7598f5952c58
  event: Solomorn_RomanceFinalSolomorne_01
  text: '{n}Соломон осторожно берет его кончиками пальцев. Его взгляд наполнен теплом.{/n} "Спасибо, что сохранил{mf||а} его.
    Это мое... признание вины много для меня значило. Я сидел над этой жалкой парой строчек всю ночь".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 452d2c0b-7c07-4a47-8afb-95dc8965be2a
  event: Solomorn_RomanceFinalSolomorne_02
  text: '{n}Он переводит взгляд на вас.{/n} "Благодарю за отклонение прошения".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 858a54d1-8404-4689-ae82-a7401f4a3475
  event: Solomorn_RomanceFinalSolomorne_03
  text: '"Смотрю, как горит правосудие. Мое правосудие". {n}Соломон смотрит в пламя. Вид у него не скорбный, а скорее задумчивый.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 92ef9eca-e5ed-473f-999e-c67526bf4f6a
  event: Solomorn_RomanceFinalSolomorne_04
  text: '{n}Соломон ухмыляется.{/n} "Остроумно. Но грустно".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 9513e88d-3eea-433c-971f-350783bdb3c6
  event: Solomorn_RomanceFinalSolomorne_05
  text: '{n}Соломон вздыхает.{/n} "Я понимаю. Давай еще немного посидим, а потом пойдем". {n}Он кладет вашу ладонь в свою
    и надолго застывает.{/n}'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 64ce36a0-dac7-44e5-a1c3-ed6ababeb135
  event: Solomorn_RomanceFinalSolomorne_06
  text: '{n}Горько улыбнувшись, Соломон отвечает:{/n} "В это бывает сложно поверить, понимаю. Но я и впрямь обычный человек".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: da40f663-31b8-4c71-9af1-48262f5dcdb5
  event: Solomorn_RomanceFinalSolomorne_07
  text: '"Я устал быть орудием. Не орудием Лекс Империалис, а орудием конкретных людей. Они использовали меня против тебя
    много раз, и мне надоело".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: dd69fe75-0dc1-4bfe-b576-7a03904faa7f
  event: Solomorn_RomanceFinalSolomorne_08
  text: '{n}Он поворачивается к вам.{/n} "Слушай... Прости меня. Знаю, я и раньше приносил извинения, но сейчас все по-другому.
    Тогда мне было стыдно и гадко — что лгал, что обидел, — мне хотелось, чтобы ты меня наказал{mf||а}. А сейчас мне просто
    жаль и очень грустно, что я все это сделал".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: b46e4322-480d-4a46-9955-6aaa392d61d0
  event: Solomorn_RomanceFinalSolomorne_09
  text: '{n}Соломон поворачивается к вам, в его зрачках пляшут огни пожара.{/n} "Если ты не шутишь... Если ты не боишься,
    что пожалеешь об этих словах... Если я тебе правда нужен... То я согласен". {n}Он берет вашу ладонь в свои.{/n} "Я согласен
    быть твоим. Навсегда и во всем".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: f0fbcdd0-ad89-4a42-910f-f88e5bb09f61
  event: Solomorn_RomanceFinalSolomorne_10
  text: '{n}Соломон печально кивает.{/n} "Чистая правда".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: 9b02d7e5-01e2-4bcf-b04d-1673fb74cd9d
  event: Solomorn_RomanceFinalSolomorne_11
  text: '{n}Соломон неторопливо встает и протягивает вам руку.{/n} "Кажется, на Тассере я задолжал тебе танец".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: ca8bd4c9-1985-4ee8-8781-e17023f47389
  event: Solomorn_RomanceFinalSolomorne_12
  text: '"Когда мы были на Тассере, мне не стоило быть таким истуканом, и пригласить тебя на танец. Я исправляюсь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 6034fdfe-814d-408b-91cd-bc3bac83694e
  event: Solomorn_RomanceFinalSolomorne_13
  text: '"Когда мы были на Тассере, мне стоило меньше думать о том, что думают окружающие, и больше — о том, как не отдавить
    тебе ноги. Я исправляюсь".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8ae3e293-62d5-4ee9-986d-6e95d822cbcd
  event: Solomorn_RomanceFinalSolomorne_14
  text: '"Огонь, трагедия, крушение убеждений и иерархий, и мы посреди всего этого... Это все очень романтично, разве нет?"
    {n}Арбитр фыркает.{/n} "Надо будет добавить это в мою инфопластину".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 8a1f73fd-bad4-42fe-a425-afdf6c7c26d8
  event: Solomorn_RomanceFinalSolomorne_15
  text: '"Конечно". {n}Мягко улыбнувшись, Соломон обнимает вас за плечи.{/n}'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: a20a5e26-b612-449d-835d-4405854c5359
  event: Solomorn_RomanceFinalSolomorne_16
  text: '"Эта... печать величия на твоем лице. Каждый раз ты будто видел{mf||а} людей — даже меня, — насквозь. Читал{mf||а}
    их мотивы. Совершал{mf||а} подвиги, побеждал{mf||а}. И все в твоих словах и поступках превозносило тебя над обычными людьми,
    будто пьедестал сам рос под твоими ногами. Если взглянуть на многих Вольных Торговцев, то станет видно, насколько выродилась
    их порода, но ты..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: bef3a833-1554-449d-bc35-d4dfdb64d7d8
  event: Solomorn_RomanceFinalSolomorne_17
  text: '"И был{mf||а} чертовски прав{mf||а}. Но мне всегда говорили, что у меня особо толстая лобная кость. Оказывается,
    это — не всегда преимущество".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 0656eb9e-42fa-4529-a6f1-44232dfe6b89
  event: Solomorn_RomanceFinalSolomorne_18
  text: '"Именно ради таких как ты Император даровал династиям священные Патенты".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 4d78b172-4f9d-48a6-8b45-c289d64d443b
  event: Solomorn_RomanceFinalSolomorne_19
  text: '{n}Слегка улыбнувшись, он шепчет:{/n} "За всю жизнь я вряд ли говорил что-либо столь же безумное, но... Я, кажется,
    в тебя по уши влюблен".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 10d8d837-c803-4e39-b8e7-5a07a3f02755
  event: Solomorn_RomanceFinalSolomorne_20
  text: '{n}Соломон не отстраняется, его прикосновения бережны и полны затаенной силы.{/n} "Спасибо".'
  speaker: Соломон Антар
  gemini_voice: Orus
  gemini_text: null
- guid: e86ec0ca-647e-40bd-84ba-5fe14e9ded56
  event: Solomorn_RomanceFinalSolomorne_21
  text: '{n}Уставившись в пламя, он внезапно заходится смехом.{/n} "Знаешь, сначала ты так мне не понравил{mf|ся|ась}! Прямо
    очень — надменн{mf|ый|ая}, ведущ{mf|ий|ая} себя так, словно выше всех законов! Выскочка с чужими регалиями, да еще и не
    слишком-то умн{mf|ый|ая}..." {n}Взгляд арбитра туманится.{/n} "И где только были мои глаза..."'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
- guid: 164086d1-2755-4be8-946d-946fdfd4ee57
  event: Solomorn_RomanceFinalSolomorne_22
  text: '"Понадобилось время, чтобы я признал — есть редкие люди, которым правильно быть выше всех законов. Такие как ты".
    {n}Арбитр делает задумчивую паузу.{/n} "Встреться мы раньше, думаю, я бы посвятил жизнь служению тебе, а не Лекс Империалис".'
  speaker: null
  gemini_voice: Orus
  gemini_text: null
