- guid: 22f503f8-b952-4f4e-a338-e26f65c29bfd
  event: ''
  text: '{n}Теодора лишь пожимает плечами.{/n} "Патент нашей династии подписан кровью Императора. А написан — нашей. Кровью Вольных Торговцев фон Валанциус. Так было всегда".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора лишь пожимает плечами.
  - speaker: Theodora von Valancius
    text_clean: Патент нашей династии подписан кровью Императора. А написан — нашей. Кровью Вольных Торговцев фон Валанциус. Так было всегда.
- guid: 6cc79d36-2a30-46d5-a6a6-5753fe0ff7b6
  event: ''
  text: '{n}Теодора одобрительно кивает.{/n} "Да. Ты — Вольный Торговец. Я вижу".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора одобрительно кивает.
  - speaker: Theodora von Valancius
    text_clean: Да. Ты — Вольный Торговец. Я вижу.
- guid: f30d3000-7eea-4311-aed2-d246727a6216
  event: ''
  text: '"Это было забавно, но шутка затянулась". {n}Теодора нехорошо косится на дознавателя.{/n} "Очевидно, что {mf|сей|сия} ерети{mf|к|чка} пляшет под твою дудку. {mf|Его|Ее} слово против моего? Ты проиграл, не успев обнажить меч, Хейнрикс".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Это было забавно, но шутка затянулась.
  - speaker: narrator
    text_clean: Теодора нехорошо косится на дознавателя.
  - speaker: Theodora von Valancius
    text_clean: Очевидно, что сей еретик пляшет под твою дудку. Его слово против моего? Ты проиграл, не успев обнажить меч, Хейнрикс.
- guid: 9343091e-7b25-47cd-a185-e93c89bf335f
  event: PRL_TheodoraChoice_01
  text: '{n}Ее взгляд спокоен — пугающе спокоен для кого-то, чье тело лижут языки пламени. Рука покоится на эфесе силового меча, а вторая поднята в приглашающем жесте.{/n} "Ты заплутал{mf||а}, {mf|мой наследник|моя наследница}?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Ее взгляд спокоен — пугающе спокоен для кого-то, чье тело лижут языки пламени. Рука покоится на эфесе силового меча, а вторая поднята в приглашающем жесте.
  - speaker: Theodora von Valancius
    text_clean: Ты заплутал, мой наследник?
- guid: f72f20f6-c4bd-442d-aa22-27e0988b8a2a
  event: PRL_TheodoraChoice_02
  text: '{n}Арджента застывает словно каменное изваяние — а затем начинает поднимать оружие.{/n} "Наваждение... ведьмовское наваждение! Происки варпа!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента застывает словно каменное изваяние — а затем начинает поднимать оружие.
  - speaker: Sister Argenta
    text_clean: Наваждение... ведьмовское наваждение! Происки варпа!
- guid: 94843f49-4a9d-4959-a7da-76856bc39613
  event: PRL_TheodoraChoice_03
  text: '"Сестра, опустите оружие!" {n}Несмотря на приказной тон, голос Абеляра звучит не слишком уверенно — старый офицер во все глаза смотрит на {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}, на его щеке дергается мускул.{/n} "Угроза Лорд-капитану — выходка, выходящая за всякие рамки..."'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Сестра, опустите оружие!
  - speaker: narrator
    text_clean: Несмотря на приказной тон, голос Абеляра звучит не слишком уверенно — старый офицер во все глаза смотрит на Вольного Торговца, на его щеке дергается мускул.
  - speaker: Theodora von Valancius
    text_clean: Угроза Лорд-капитану — выходка, выходящая за всякие рамки...
- guid: 3041af75-783c-4a5c-bcb6-d31ccc98eee2
  event: PRL_TheodoraChoice_04
  text: '"Вряд ли тебе известны пределы возможного, {name} — твой кругозор есть лишь крупица того, что видит и познает Вольный Торговец. Но я чувствую, что ты хотел{mf||а} бы разделить со мной эти знания. Эту власть над реальностью".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Вряд ли тебе известны пределы возможного, КЭП — твой кругозор есть лишь крупица того, что видит и познает Вольный Торговец. Но я чувствую, что ты хотел бы разделить со мной эти знания. Эту власть над реальностью.
- guid: c2494085-cd75-4e38-aa61-6f496514fd82
  event: PRL_TheodoraChoice_05
  text: '"Боль — лишь отражение твоей слабости, {name}. Отринь слабость духа ради величия — это единственный путь к вершинам, которые достойны Вольного Торговца".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Боль — лишь отражение твоей слабости, КЭП. Отринь слабость духа ради величия — это единственный путь к вершинам, которые достойны Вольного Торговца.
- guid: 6b842bb6-931d-4ca6-a729-21819c56624b
  event: PRL_TheodoraChoice_06
  text: '"Я — Вольный Торговец, {name}. Я везде, где требует быть моя воля. Хотел{mf||а} бы ты сейчас оказаться в другом месте? Безусловно. Но готов{mf||а} ли ты?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Я — Вольный Торговец, КЭП. Я везде, где требует быть моя воля. Хотел бы ты сейчас оказаться в другом месте? Безусловно. Но готов ли ты?
- guid: a70f4e31-9793-4754-bb97-8cb132353174
  event: PRL_TheodoraChoice_07
  text: '{n}Глаза Теодоры глядят не мигая — словно змеиные очи. Под ее взглядом вы почти не чувствуете, как пламя опаляет вашу кожу, оставляя ожоги.{/n} "Я могу вывести тебя из этого огня, {name}. Указать дорогу. Избавить от боли. И дать оружие для войны с твоими врагами. Решай".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Глаза Теодоры глядят не мигая — словно змеиные очи. Под ее взглядом вы почти не чувствуете, как пламя опаляет вашу кожу, оставляя ожоги.
  - speaker: Theodora von Valancius
    text_clean: Я могу вывести тебя из этого огня, КЭП. Указать дорогу. Избавить от боли. И дать оружие для войны с твоими врагами. Решай.
- guid: 7617433b-2914-407d-baf5-55fbe98bab03
  event: PRL_TheodoraChoice_08
  text: '"Не слушай это чудовище! {name}, если ты... если в сердце твоем лишь свет Его и вера твоя тверда — смело шагай в огонь! {g|Encyclopedia:Emperor}Император{/g} защитит. Не убоятся верные Его ни тьмы, ни лживых посулов. И не опалит пламя тех, кто несет огонь веры в душе!"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Не слушай это чудовище! КЭП, если ты... если в сердце твоем лишь свет Его и вера твоя тверда — смело шагай в огонь! Император защитит. Не убоятся верные Его ни тьмы, ни лживых посулов. И не опалит пламя тех, кто несет огонь веры в душе!
- guid: a96d6ee3-87e7-44c5-b901-27575b4a2177
  event: PRL_TheodoraChoice_09
  text: '"Катилась бы ты... Идем же за Леди Теодорой! Иначе задохнемся в этой преисподней!"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Катилась бы ты... Идем же за Леди Теодорой! Иначе задохнемся в этой преисподней!
- guid: 7218f6f3-4544-47f1-9578-00ef114b6eb0
  event: PRL_TheodoraChoice_10
  text: '"Люди...!" {n}Абеляр оглядывается на кашляющих и растерянных людей рядом с вами.{/n} "{name}! Выжившие со средних палуб! Нужно помочь экипажу... вывести... найти обход..." {n}Сквозь рев пламени вы слышите далекие звуки — испуганные голоса, крики... но они проходят к вам словно сквозь водяную толщу, приглушенными и искаженными.{/n}'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: Люди...!
  - speaker: narrator
    text_clean: Абеляр оглядывается на кашляющих и растерянных людей рядом с вами.
  - speaker: Abelard Werserian
    text_clean: КЭП! Выжившие со средних палуб! Нужно помочь экипажу... вывести... найти обход...
  - speaker: narrator
    text_clean: Сквозь рев пламени вы слышите далекие звуки — испуганные голоса, крики... но они проходят к вам словно сквозь водяную толщу, приглушенными и искаженными.
- guid: 8d122d56-7284-4e7f-96e3-77b5cd3781bd
  event: PRL_TheodoraChoice_11
  text: '"Тогда опоздаем на встречу с Эде..." {n}Идира осекается и начинает тяжело кашлять. Ее ноги подкашиваются, кажется, она вот-вот упадет.{/n} "{name}, чего мы ждем?!"'
  speaker: Idira Tlass
  parts:
  - speaker: Idira Tlass
    text_clean: Тогда опоздаем на встречу с Эде...
  - speaker: narrator
    text_clean: Идира осекается и начинает тяжело кашлять. Ее ноги подкашиваются, кажется, она вот-вот упадет.
  - speaker: Idira Tlass
    text_clean: КЭП, чего мы ждем?!
- guid: ce7c95cb-8572-4614-967f-8bed79f72f9d
  event: PRL_TheodoraChoice_12
  text: '"Я укажу дорогу. Давай же, закрой глаза..."'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Я укажу дорогу. Давай же, закрой глаза...
- guid: d4096f27-75fb-4b2c-98c8-9be67be64866
  event: PRL_TheodoraFirstConversation_01
  text: '"Это иррационально, Леди Теодора". {n}Голос мужчины, облаченного в причудливое одеяние, звенит от напряжения. Его лицо, половина которого скрыта синт-кожей, искажено в гримасе недовольства и недоверия.{/n} "Ассимиляция в торговую структуру — политическое и экономическое самоубийство, буквально роспись в ереси!"'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Это иррационально, Леди Теодора.
  - speaker: narrator
    text_clean: Голос мужчины, облаченного в причудливое одеяние, звенит от напряжения. Его лицо, половина которого скрыта синт-кожей, искажено в гримасе недовольства и недоверия.
  - speaker: Seneschal (NPC)
    text_clean: Ассимиляция в торговую структуру — политическое и экономическое самоубийство, буквально роспись в ереси!
- guid: ca077a5e-9279-4ba6-b8d8-656f29ab853c
  event: PRL_TheodoraFirstConversation_02
  text: '{n}Высокая седовласая женщина в упор взирает на своего собеседника — киберглаз сверкает алым.{/n} "Тогда предложи иной вариант, который меня устроит. Я описала ситуацию — ничуть не хуже, чем мог бы описать ее мой сенешаль. Прими решение: что ты будешь делать с Айоном-VI, Эдельтрад?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Высокая седовласая женщина в упор взирает на своего собеседника — киберглаз сверкает алым.
  - speaker: Theodora von Valancius
    text_clean: 'Тогда предложи иной вариант, который меня устроит. Я описала ситуацию — ничуть не хуже, чем мог бы описать ее мой сенешаль. Прими решение: что ты будешь делать с Айоном-VI, Эдельтрад?'
- guid: 383e557a-0c2a-4586-9cbe-b3ab94c189ce
  event: PRL_TheodoraFirstConversation_03
  text: '"Что это?" {n}Эдельтрад оборачивается на вас — в его взгляде читается недовольство.{/n} "Кто-то из вашей свиты, Теодора? Вы дозволяете им вмешиваться в ваши разговоры подобным образом?"'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Что это?
  - speaker: narrator
    text_clean: Эдельтрад оборачивается на вас — в его взгляде читается недовольство.
  - speaker: Edelthrad
    text_clean: Кто-то из вашей свиты, Теодора? Вы дозволяете им вмешиваться в ваши разговоры подобным образом?
- guid: e459411c-7474-4376-bf07-0fe585dbd40b
  event: PRL_TheodoraFirstConversation_04
  text: '"Я дозволяю вмешиваться в мои разговоры тем, кто может сказать что-то ценное. Сейчас узнаем, стоило ли". {n}Теодора склоняет голову набок. Ее губы расползаются в щучью улыбку.{/n} "Это {name}, втор{mf|ой|ая} кандидат{mf||ка} на звание моего преемника". {n}{g|Encyclopedia:RogueTrader}Вольный Торговец{/g} бросает на вас властный взгляд, хищный и тяжеловесный.{/n} "Шаг вперед, {name}".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Я дозволяю вмешиваться в мои разговоры тем, кто может сказать что-то ценное. Сейчас узнаем, стоило ли.
  - speaker: narrator
    text_clean: Теодора склоняет голову набок. Ее губы расползаются в щучью улыбку.
  - speaker: Theodora von Valancius
    text_clean: Это КЭП, второй кандидат на звание моего преемника.
  - speaker: narrator
    text_clean: Вольный Торговец бросает на вас властный взгляд, хищный и тяжеловесный.
  - speaker: Theodora von Valancius
    text_clean: Шаг вперед, КЭП.
- guid: d31d96e8-9df8-4137-bfdc-2bd2ff33220a
  event: PRL_TheodoraFirstConversation_05
  text: '"О, не сомневаюсь. Только готова ли я выбрать именно тебя? Ты появил{mf|ся|ась} на борту за несколько часов до варп-прыжка и пока никак не проявил{mf||а} себя — пока что я испытываю сомнения касательно твоей пригодности для роли Вольного Торговца".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: О, не сомневаюсь. Только готова ли я выбрать именно тебя? Ты появился на борту за несколько часов до варп-прыжка и пока никак не проявил себя — пока что я испытываю сомнения касательно твоей пригодности для роли Вольного Торговца.
- guid: 5ccaf22c-2b68-4ccd-a6ed-d050abced9f2
  event: PRL_TheodoraFirstConversation_06
  text: '"Вероятно. Вчера ты еще обычн{mf|ый|ая} слуга Империума, од{mf|ин|на} из миллионов ничем не отличающихся людей. Сегодня за тобой являются люди в цветах дома фон Валанциус и без объяснений и разговоров препровождают на шаттл и судно, которое отправляется в путешествие в далекий {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g}. Но такова природа моей позиции, {name}. Мое требование — священно, и не подлежит обсуждению. Мне нужны все, в ком есть хотя бы крупица крови династии, кем бы эти люди не оказались".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Вероятно. Вчера ты еще обычный слуга Империума, один из миллионов ничем не отличающихся людей. Сегодня за тобой являются люди в цветах дома фон Валанциус и без объяснений и разговоров препровождают на шаттл и судно, которое отправляется в путешествие в далекий Простор Коронус. Но такова природа моей позиции, КЭП. Мое требование — священно, и не подлежит обсуждению. Мне нужны все, в ком есть хотя бы крупица крови династии, кем бы эти люди не оказались.
- guid: 33d3858d-e582-4ee1-b674-a8e8c80c5f0d
  event: PRL_TheodoraFirstConversation_07
  text: '"Разумеется. Некоторые еще не успели прибыть на корабль, однако одного из них ты имел{mf||а} удовольствие встретить лично. Эдельтрад может быть немного смущен масштабами тех обязанностей, которые потенциально будут возложены ему на плечи, однако... однако у меня хорошее предчувствие касательно его кандидатуры".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Разумеется. Некоторые еще не успели прибыть на корабль, однако одного из них ты имел удовольствие встретить лично. Эдельтрад может быть немного смущен масштабами тех обязанностей, которые потенциально будут возложены ему на плечи, однако... однако у меня хорошее предчувствие касательно его кандидатуры.
- guid: 239e990c-df87-4b9f-b807-781b5cd6be58
  event: PRL_TheodoraFirstConversation_08
  text: '{n}Теодора хмыкает.{/n} "Сдача предложенной инициативы, прискорбная покорность — даже учитывая твое подчиненное положение. Впрочем, эта болезнь одинакова для всех, кто привык к существованию в объятиях {g|Encyclopedia:Imperium}Империума{/g}. Нерушимая иерархия, бесспорное подчинение, лизоблюдство и стремление угодить... забудь об этом. С того момента, как за тобой явились мои посланцы, старые правила не имеют значения".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора хмыкает.
  - speaker: Theodora von Valancius
    text_clean: Сдача предложенной инициативы, прискорбная покорность — даже учитывая твое подчиненное положение. Впрочем, эта болезнь одинакова для всех, кто привык к существованию в объятиях Империума. Нерушимая иерархия, бесспорное подчинение, лизоблюдство и стремление угодить... забудь об этом. С того момента, как за тобой явились мои посланцы, старые правила не имеют значения.
- guid: bc1460be-af77-4d12-958b-6e36cf8ff299
  event: PRL_TheodoraFirstConversation_09
  text: '{n}Теодора поднимает бровь.{/n} "Разумно... очень разумно. Однако гоняться за бесплотными созданиями может быть весьма долгим — и бесполезным — занятием".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора поднимает бровь.
  - speaker: Theodora von Valancius
    text_clean: Разумно... очень разумно. Однако гоняться за бесплотными созданиями может быть весьма долгим — и бесполезным — занятием.
- guid: 6b667194-f72a-44dc-adc5-c3369022cd9a
  event: PRL_TheodoraFirstConversation_10
  text: '"Несомненно, сопровождая их отбытие на планету пламенными вдохновляющими речами?" {n}Теодора устало вздыхает.{/n} "Я никогда не верила в силу пропаганды. Она годится только для самого дурного положения — когда люди должны умирать во чье-то имя, а не побеждать и добиваться своего".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Несомненно, сопровождая их отбытие на планету пламенными вдохновляющими речами?
  - speaker: narrator
    text_clean: Теодора устало вздыхает.
  - speaker: Theodora von Valancius
    text_clean: Я никогда не верила в силу пропаганды. Она годится только для самого дурного положения — когда люди должны умирать во чье-то имя, а не побеждать и добиваться своего.
