  - speaker: Edelthrad
    text_clean: Едва ли подданный Империума надежен, если сам приглашает скверну войти в чертог.
- guid: 62c3c07e-8882-42f1-8901-2e8a9308c41a
  event: PRL_TheodoraFirstConversation_30
  text: '"Леди Теодора! Позвольте, разве я дал вам плохой ответ? Заветы {g|Encyclopedia:Emperor}Бога-Императора{/g} — то, что оберегает Человечество, и то, чему неукоснительно следует подчиняться каждому из нас. {name} не способ{mf|ен|на} даже запомнить простое правило, тогда как я..."'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Леди Теодора! Позвольте, разве я дал вам плохой ответ? Заветы Бога-Императора — то, что оберегает Человечество, и то, чему неукоснительно следует подчиняться каждому из нас. КЭП не способен даже запомнить простое правило, тогда как я...
