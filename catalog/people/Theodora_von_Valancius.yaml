  event: PRL_TheodoraFirstConversation_47
  text: '{n}Теодора качает головой.{/n} "Нетерпение... мне нравятся нетерпеливые люди — они реже смиряются с обстоятельствами и чаще проявляют инициативу. Даже если я окончательно утвержу Эдельтрада в роли своего правопреемника, мне нужны верные советники. Твои навыки и знания, полученные в прежней жизни, могут быть бесценны здесь, в Просторе Коронус".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора качает головой.
  - speaker: Theodora von Valancius
    text_clean: Нетерпение... мне нравятся нетерпеливые люди — они реже смиряются с обстоятельствами и чаще проявляют инициативу. Даже если я окончательно утвержу Эдельтрада в роли своего правопреемника, мне нужны верные советники. Твои навыки и знания, полученные в прежней жизни, могут быть бесценны здесь, в Просторе Коронус.
- guid: 38e20176-97ce-4a4d-9c16-81e3b7cd9831
  event: PRL_TheodoraFirstConversation_48
  text: '"Дальний — бесконечно дальний, как и ты. Однако он носит фамилию фон Валанциус, хотя и избегает пользоваться ей в открытую, и, технически, может являться моим наследником. Впрочем, эта перспектива для него закрыта. Войгтвир хорош на том посту, который занимает... по крайней мере, был хорош".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Дальний — бесконечно дальний, как и ты. Однако он носит фамилию фон Валанциус, хотя и избегает пользоваться ей в открытую, и, технически, может являться моим наследником. Впрочем, эта перспектива для него закрыта. Войгтвир хорош на том посту, который занимает... по крайней мере, был хорош.
- guid: 36bf5a4a-bea9-48f2-ac9b-2102555d2c76
  event: PRL_TheodoraFirstConversation_49
  text: '{n}{g|Encyclopedia:Vox}Вокс{/g}, закрепленный на костюме Теодоры, внезапно оживает — до вас доносится только неразборчивый шум. Теодора морщится, касанием отключает передачу и властно кивает вам.{/n} "У меня есть некоторое время — до того, как {g|Encyclopedia:Navigator}Навигатор{/g} подаст сигнал к началу трансляции корабля из {g|Encyclopedia:Warp}варпа{/g}, и мое присутствие потребуется на мостике".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Вокс, закрепленный на костюме Теодоры, внезапно оживает — до вас доносится только неразборчивый шум. Теодора морщится, касанием отключает передачу и властно кивает вам.
  - speaker: Theodora von Valancius
    text_clean: У меня есть некоторое время — до того, как Навигатор подаст сигнал к началу трансляции корабля из варпа, и мое присутствие потребуется на мостике.
- guid: f84f19b0-471c-4e18-b280-50fa5b5ab97b
  event: PRL_TheodoraFirstConversation_50
  text: '"Все же одного права крови недостаточно, чтобы заработать высокую честь стать владельцем Торгового Патента. Тем не менее, твои способности и таланты могут быть весьма полезны — если не для роли Лорд-капитана, то для позиции его ближайшего соратника". {n}Теодора вздыхает и на мгновение задумчиво отводит взгляд.{/n} "Увы, даже подобные обязанности иногда оказываются не по силам тем, кто делит с тобой кровь. Кунрад Войгтвир безукоризненно служил множество лет, прежде чем совершил ошибку".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Все же одного права крови недостаточно, чтобы заработать высокую честь стать владельцем Торгового Патента. Тем не менее, твои способности и таланты могут быть весьма полезны — если не для роли Лорд-капитана, то для позиции его ближайшего соратника.
  - speaker: narrator
    text_clean: Теодора вздыхает и на мгновение задумчиво отводит взгляд.
  - speaker: Theodora von Valancius
    text_clean: Увы, даже подобные обязанности иногда оказываются не по силам тем, кто делит с тобой кровь. Кунрад Войгтвир безукоризненно служил множество лет, прежде чем совершил ошибку.
- guid: 9efc5a10-65cc-4e5d-a869-a72fa2880fe3
  event: PRL_TheodoraFirstConversation_51
  text: '"Некогда ты был{mf||а} комиссаром {g|Encyclopedia:AstraMilitarum}Имперской гвардии{/g}. Политическим офицером, не боявшимся смотреть в лицо смерти и отправлять на нее своих подчиненных. Решимость, вера, бескомпромиссность — все это дает тебе особую перспективу при взгляде на ситуации, где менее стойкий человек дрогнул бы духом. Поверь, в будущем у тебя будет достаточно ситуаций, когда стойкость в служении своему долгу — или интересам династии — окажется твоим козырем".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Некогда ты был комиссаром Имперской гвардии. Политическим офицером, не боявшимся смотреть в лицо смерти и отправлять на нее своих подчиненных. Решимость, вера, бескомпромиссность — все это дает тебе особую перспективу при взгляде на ситуации, где менее стойкий человек дрогнул бы духом. Поверь, в будущем у тебя будет достаточно ситуаций, когда стойкость в служении своему долгу — или интересам династии — окажется твоим козырем.
- guid: 622bdeb0-5cf5-42c3-81fd-7699ef72fa66
  event: PRL_TheodoraFirstConversation_52
  text: '"Когда-то ты и сам{mf||а} был{mf||а} Лорд-капитаном — на собственном корабле. Тебе известно все о том, как живет этот огромный монстр с тысячами людей экипажа. Тебе известно, как прихотливы могут быть {g|Encyclopedia:MachineSpirit}машинные духи{/g}, как слабовольна чернь с нижних палуб, как одно тактическое решение может повернуть исход сражения. Это бесценный опыт, которым обладают немногие и который в моем ремесле ценится бесконечно высоко".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Когда-то ты и сам был Лорд-капитаном — на собственном корабле. Тебе известно все о том, как живет этот огромный монстр с тысячами людей экипажа. Тебе известно, как прихотливы могут быть машинные духи, как слабовольна чернь с нижних палуб, как одно тактическое решение может повернуть исход сражения. Это бесценный опыт, которым обладают немногие и который в моем ремесле ценится бесконечно высоко.
- guid: 20e2fecf-1a2e-431d-bc1f-28e73811d51f
  event: PRL_TheodoraFirstConversation_53
  text: '"Твое дворянское положение означает, что власть — в самой твоей плоти и крови. Ты никогда не усомнишься в своей правоте, не проявишь слабость, не выдашь свое волнение или страх невольным жестом или словом — по крайней мере если тебя воспитывали с тем же тщанием, что и меня когда-то. Перед тобой будут пресмыкаться губернаторы, командующие, высокородные {g|Encyclopedia:Navigator}навигаторы{/g} и самодовольные лорды — нельзя допустить, чтобы они почувствовали слабину в том, кто стоит над ними".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Твое дворянское положение означает, что власть — в самой твоей плоти и крови. Ты никогда не усомнишься в своей правоте, не проявишь слабость, не выдашь свое волнение или страх невольным жестом или словом — по крайней мере если тебя воспитывали с тем же тщанием, что и меня когда-то. Перед тобой будут пресмыкаться губернаторы, командующие, высокородные навигаторы и самодовольные лорды — нельзя допустить, чтобы они почувствовали слабину в том, кто стоит над ними.
- guid: 51e86d0e-ec97-4890-9888-11701070fe44
  event: PRL_TheodoraFirstConversation_54
  text: '"Твое прошлое едва ли можно назвать безукоризненным образцом достойного служения Империуму, однако..." {n}Теодора позволяет себе лукавую улыбку.{/n} "Меня интригует человек с подобной судьбой. Выжить и преуспеть между строк законов — достижение, которым мало кто может похвастаться в нашем кругу. Ты знаешь, как рисковать и срезать углы — поверь, у тебя найдется немало возможностей применить этот талант на службе династии".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Твое прошлое едва ли можно назвать безукоризненным образцом достойного служения Империуму, однако...
  - speaker: narrator
    text_clean: Теодора позволяет себе лукавую улыбку.
  - speaker: Theodora von Valancius
    text_clean: Меня интригует человек с подобной судьбой. Выжить и преуспеть между строк законов — достижение, которым мало кто может похвастаться в нашем кругу. Ты знаешь, как рисковать и срезать углы — поверь, у тебя найдется немало возможностей применить этот талант на службе династии.
- guid: 5915e605-67f3-4bb4-9e90-f95d8729512e
  event: PRL_TheodoraFirstConversation_55
  text: '"Служба в {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g} — испытание, живым из которого выходят очень немногие. Подняться в иерархии Имперской гвардии, стать командиром армии — свидетельство твоей прозорливости не только на поле боя, но и в хитросплетениях офицерских интриг. Поверь, окружение Вольного Торговца даст тебе немало шансов проявить и свои дипломатические навыки, и боевую подготовку".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Служба в Астра Милитарум — испытание, живым из которого выходят очень немногие. Подняться в иерархии Имперской гвардии, стать командиром армии — свидетельство твоей прозорливости не только на поле боя, но и в хитросплетениях офицерских интриг. Поверь, окружение Вольного Торговца даст тебе немало шансов проявить и свои дипломатические навыки, и боевую подготовку.
- guid: 29da0d31-e6be-40f7-aea1-17bf76b3153c
  event: PRL_TheodoraFirstConversation_56
  text: '"Священник {g|Encyclopedia:AdeptusMinistorum}Адептус Министорум{/g}... не могла бы и подумать, что один из моего рода окажется в таком положении. Не надо изливать мне догмы Экклезиархии о скромности и служении — я прекрасно знаю, что подобные тебе ориентируются в логистических операциях не хуже зануд из {g|Encyclopedia:AdeptusAdministratum}Администратума{/g}. Когда торговые интересы прикрыты чаяниями о душах Человечества, любой твой поступок будет вызывать куда меньше вопросов, чем мог бы".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Священник Адептус Министорум... не могла бы и подумать, что один из моего рода окажется в таком положении. Не надо изливать мне догмы Экклезиархии о скромности и служении — я прекрасно знаю, что подобные тебе ориентируются в логистических операциях не хуже зануд из Администратума. Когда торговые интересы прикрыты чаяниями о душах Человечества, любой твой поступок будет вызывать куда меньше вопросов, чем мог бы.
- guid: f519652e-a024-4c16-9330-5226d16ff5e1
  event: PRL_TheodoraFirstConversation_57
  text: '"В твоем профиле указано, что на тебе лежит печать колдовства... впрочем, колдовства санкционированного, дозволенного к служению Империуму. Я привычна к присутствию рядом со мной {g|Encyclopedia:Psyker}псайкеров{/g} — более того, я весьма ценю их уникальные способности. Возможно, поэтому я так заинтригована в кандидатуре Эдельтрада — колдун-Вольный Торговец может стать по настоящему великим. Однако псайкеры хрупки — и лучше у меня будет замена, если с Эделем что-то произойдет".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: В твоем профиле указано, что на тебе лежит печать колдовства... впрочем, колдовства санкционированного, дозволенного к служению Империуму. Я привычна к присутствию рядом со мной псайкеров — более того, я весьма ценю их уникальные способности. Возможно, поэтому я так заинтригована в кандидатуре Эдельтрада — колдун-Вольный Торговец может стать по настоящему великим. Однако псайкеры хрупки — и лучше у меня будет замена, если с Эделем что-то произойдет.
