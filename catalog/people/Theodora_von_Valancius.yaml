  text: '{n}Теодора тонко улыбается.{/n} "Да... вот я и вижу проявления династической крови в твоих жилах. Жадность, рядящаяся в одежку гордости и самолюбия. Эдельтрад, что скажешь? Весьма отличающийся от твоего ответ, не правда ли".'
