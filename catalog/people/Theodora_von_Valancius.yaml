  text: '"Эдельтрад". {n}Тон Теодоры заставляет мужчину умолкнуть.{/n} "Кажется, я дала тебе назначение на этом корабле. Так потрудись объяснить, почему же Старший Конгрегатор все еще торчит на офицерской палубе вместо того, чтобы проследовать на средние палубы и начать осмотр подотчетных отсеков?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Эдельтрад.
  - speaker: narrator
