  text: '{n}Эдельтрад смотрит на вас с теплотой змеи.{/n} "Санционированные псайкеры — редкое и ценное орудие {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}. Или же ты, {name}, предполагал{mf||а} использовать еретиков, которые противны свету {g|Encyclopedia:Emperor}Бога-Императора{/g}? Весьма опрометчиво говорить о подобном в присутствии верных слуг Его".'
