- guid: 4600d43a-b20c-4a5a-82a0-d5dc2470fba8
  event: PRL_TheodorasFate_07
  text: '{n}Идира зачерпывает пригоршню осколков и сжимает пальцы — так, что из ее сомкнутого кулака сочатся капли крови.{/n} "Я вижу... переливы, сияние, синие огни... лица... ближе... Леди Теодора... еще... Кунрад... еще... что это? Ай!" {n}Псайкер испугано встряхивает рукой.{/n} "Что-то темное... огромное... ох, недобрая это была вещь, {name}!"'
  speaker: Idira Tlass
  parts:
