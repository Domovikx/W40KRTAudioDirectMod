    text_clean: Итак, КЭП. Зачем ты здесь?
- guid: 6d891359-53cd-479a-a199-d5c544c4fb15
  event: PRL_TheodoraFirstConversation_72
  text: '"Ты так долго охотил{mf|ся|ась} на нарушителей закона, что теперь повсюду их ищешь. Ожидая встретить на Айоне-VI лишь одну конкретную угрозу, ты окажешься бессил{mf|ен|ьна} перед другими врагами, которые могут оказаться и не людьми вовсе".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Ты так долго охотился на нарушителей закона, что теперь повсюду их ищешь. Ожидая встретить на Айоне-VI лишь одну конкретную угрозу, ты окажешься бессилен перед другими врагами, которые могут оказаться и не людьми вовсе.
- guid: b1865828-d877-4c0e-b1c2-19aff22b8641
  event: PRL_TheodoraFirstConversation_73
  text: '"Ты был{mf||а} удостоен{mf||а} звания маршала Адептус Арбитес, а это не просто титул. За ним стоят десятилетия опасной службы, десятки вынесенных приговоров и образцовая верность Империуму. Твое знание законов и страх, что ты способ{mf|ен|на} внушать — это путь к поддержанию порядка в протекторате. Впрочем, не только подданные династии должны знать, сколь сурово правосудие, — многочисленных конкурентов, что покушаются на наши владения, тоже надо держать в узде".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Ты был удостоен звания маршала Адептус Арбитес, а это не просто титул. За ним стоят десятилетия опасной службы, десятки вынесенных приговоров и образцовая верность Империуму. Твое знание законов и страх, что ты способен внушать — это путь к поддержанию порядка в протекторате. Впрочем, не только подданные династии должны знать, сколь сурово правосудие, — многочисленных конкурентов, что покушаются на наши владения, тоже надо держать в узде.
- guid: 8532a7d9-03c4-46b1-b9b9-889e87b30faa
  event: PRL_TheodorasFate_01
  text: '"Не-е-ет!!" {n}Истошный вопль Идиры сотрясает стены. Женщина падает на колени, вздрагивая от рыданий.{/n} "Я... я не слышала, Лорд-капитан! Ничего не слышала! Ни шепотка, ни вздоха! Там было... было так громко! Почему я не предвидела?!"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Не-е-ет!!
  - speaker: narrator
    text_clean: Истошный вопль Идиры сотрясает стены. Женщина падает на колени, вздрагивая от рыданий.
  - speaker: Theodora von Valancius
    text_clean: Я... я не слышала, Лорд-капитан! Ничего не слышала! Ни шепотка, ни вздоха! Там было... было так громко! Почему я не предвидела?!
- guid: abada903-ebd9-44f0-afe1-5066224cd195
  event: PRL_TheodorasFate_02
  text: '{n}Потрясенный Абеляр делает несколько шагов вперед, после чего тяжело опирается о край стола. Взгляд офицера прикован к бездыханному телу.{/n} "Лорд-капитан... да кто же посмел... неужели... крыса Войгтвир..."'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Потрясенный Абеляр делает несколько шагов вперед, после чего тяжело опирается о край стола. Взгляд офицера прикован к бездыханному телу.
  - speaker: Theodora von Valancius
    text_clean: Лорд-капитан... да кто же посмел... неужели... крыса Войгтвир...
- guid: 268d9256-cc73-41d0-aa3b-e6258394189b
  event: PRL_TheodorasFate_03
  text: '"Все могло решиться в пылу боя. Тем более здесь был Морт, он защищал бы Леди Теодору до последнего".'
  speaker: Theodora von Valancius
  parts:
