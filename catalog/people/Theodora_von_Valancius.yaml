  text: '{n}Эдельтрад бледнеет.{/n} "Возможно, я все еще незнаком со всеми нюансами службы на фронтире... но моя преданность {g|Encyclopedia:Emperor}Богу-Императору{/g} не допускает даже тени подобного хода мысли. Ересь, в каком бы обличье она не предстала, должна быть истреблена, и низменные стремления отринуты при этом деянии. Я знаю заветы — в отличие от наше{mf|го|й} ново{mf|го|й} знаком{mf|ца|ицы}".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад бледнеет.
  - speaker: Edelthrad
    text_clean: Возможно, я все еще незнаком со всеми нюансами службы на фронтире... но моя преданность Богу-Императору не допускает даже тени подобного хода мысли. Ересь, в каком бы обличье она не предстала, должна быть истреблена, и низменные стремления отринуты при этом деянии. Я знаю заветы — в отличие от нашего нового знакомца.
