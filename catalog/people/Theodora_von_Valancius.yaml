  event: PRL_TheodorasFate_10
  text: '"И ты так легко сдаешься, старик?! Ладно святоша, у нее сердца нет, но ты?! Как бы не так! Я докопаюсь до того, кто виновен в смерти Лорд-капитана! Докопаюсь и тогда..." {n}Идира сжимает кулаки.{/n} "Этот ублюдок пожалеет о том, что родился на свет!"'
