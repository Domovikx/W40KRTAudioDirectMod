    text_clean: Эдельтрад тонко улыбается.
  - speaker: Edelthrad
    text_clean: Прискорбно видеть, что представитель Экклезиархии не видит грани между заблудшими душами и откровенными еретиками, чья участь — гореть в очищающем пламени Его.
