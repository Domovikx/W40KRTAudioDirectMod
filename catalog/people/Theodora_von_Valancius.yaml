  event: PRL_TheodoraFirstConversation_11
  text: '"Перекладываешь свои методы из старой жизни в новую плоскость?" {n}Теодора задирает бровь.{/n} "Преступный мир {g|Encyclopedia:Calixis}Каликсиса{/g} — не то же самое, что дикая планета на границе региона..."'
  speaker: Theodora von Valancius
