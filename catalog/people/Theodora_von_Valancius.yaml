  parts:
  - speaker: narrator
    text_clean: Эдельтрад вторит смеху Теодоры.
  - speaker: Edelthrad
    text_clean: Расставаться с данной властью значит приглашать разгул ереси и опасного свободомыслия в свое окружение. Судя по лени в мышлении, ты, КЭП, наверняка уже допустил это в своем домене.
- guid: 30406ca1-07bc-41df-b163-ce3235de10e7
  event: PRL_TheodoraFirstConversation_25
  text: '"Ожидание может занять вечность. И, в конце концов, на подобной планете война может идти не против материального противника". {n}Эдельтрад взмахивает рукой.{/n} "Полки и армии не всегда решают затруднения, подобные описанным. Вряд ли, {name}, вам это известно".'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Ожидание может занять вечность. И, в конце концов, на подобной планете война может идти не против материального противника.
  - speaker: narrator
    text_clean: Эдельтрад взмахивает рукой.
  - speaker: Edelthrad
    text_clean: Полки и армии не всегда решают затруднения, подобные описанным. Вряд ли, КЭП, вам это известно.
- guid: 8eaa53fe-39ee-4071-a6e8-e36849b0a321
  event: PRL_TheodoraFirstConversation_26
  text: '"Корабли, подобные нашему, способны покидать реальный мир и отправляться в варп — потустороннее измерение, полное жестоких и невообразимых сил. Проникая в него под защитой Поля Геллера, мы сокращаем маршруты, и расстояния, на преодоление которых обычному судну потребуются сотни лет, мы можем проскочить за месяц или неделю... порой за несколько дней или даже часов. Так Человечество распространилось по галактике. Так мы смогли построить Империум, раскинувшийся на миллионы звезд".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Корабли, подобные нашему, способны покидать реальный мир и отправляться в варп — потустороннее измерение, полное жестоких и невообразимых сил. Проникая в него под защитой Поля Геллера, мы сокращаем маршруты, и расстояния, на преодоление которых обычному судну потребуются сотни лет, мы можем проскочить за месяц или неделю... порой за несколько дней или даже часов. Так Человечество распространилось по галактике. Так мы смогли построить Империум, раскинувшийся на миллионы звезд.
- guid: 05a914d3-ad0f-4cf1-b4ac-d697fd8ed927
  event: PRL_TheodoraFirstConversation_27
  text: '{n}Эдельтрад тонко улыбается.{/n} "Прискорбно видеть, что представитель {g|Encyclopedia:AdeptusMinistorum}Экклезиархии{/g} не видит грани между заблудшими душами и откровенными еретиками, чья участь — гореть в очищающем пламени {g|Encyclopedia:Emperor}Его{/g}".'
