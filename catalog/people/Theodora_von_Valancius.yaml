  event: PRL_TheodoraFirstConversation_43
  text: '"Я проложила маршрут до Райкада по требо..." {n}Теодора кривится. Бросает на вас пристальный взгляд и поводит плечом.{/n} "По очень специфической причине. Возможно, позже я раскрою тебе цели этого путешествия. Но не сейчас".'
