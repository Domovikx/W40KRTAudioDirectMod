  event: PRL_TheodoraFirstConversation_12
  text: '{n}Теодора издевательски смеется.{/n} "Как удобно! До тех пор, пока один из этих слуг не вообразит, что так{mf|ого|ую} госпо{mf|дина|жу} не столь уж и сложно сбросить, восстановив на {mf|его|ее} место кого-то более удобного".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора издевательски смеется.
  - speaker: Theodora von Valancius
    text_clean: Как удобно! До тех пор, пока один из этих слуг не вообразит, что такого господина не столь уж и сложно сбросить, восстановив на его место кого-то более удобного.
- guid: 1b43b60d-3258-43e1-a540-c4148a4da86a
  event: PRL_TheodoraFirstConversation_13
  text: '"Перевозка, развертывание, вся волокита с {g|Encyclopedia:AdeptusAdministratum}Адептус Администратум{/g}... и все ради непредсказуемого результата. Люди, особенно плохо снаряженные и обученные, хрупки — особенно против малоизученного противника".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Перевозка, развертывание, вся волокита с Адептус Администратум... и все ради непредсказуемого результата. Люди, особенно плохо снаряженные и обученные, хрупки — особенно против малоизученного противника.
- guid: 32c5b857-fafb-452e-ab26-57a907605bd1
  event: PRL_TheodoraFirstConversation_14
  text: '{n}Теодора прищуривается.{/n} "Как именно ты собираешься обращать людей, мажущих голые тела собственным дерьмом и швыряющихся копьями при первом виде чужаков? Твое прошлое вмешивается в суждение о текущем — напрасно".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора прищуривается.
  - speaker: Theodora von Valancius
    text_clean: Как именно ты собираешься обращать людей, мажущих голые тела собственным дерьмом и швыряющихся копьями при первом виде чужаков? Твое прошлое вмешивается в суждение о текущем — напрасно.
- guid: a3b446da-61c8-4e92-9b12-d0be2e3ff0ef
  event: PRL_TheodoraFirstConversation_15
  text: '"Феноменально... и сколько же, по-твоему, веков будет затухать и остывать этот огненный шар, чтобы на его поверхность можно было спустить геологические отряды? Если, конечно, он вообще будет остывать — это происходит далеко не всегда".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Феноменально... и сколько же, по-твоему, веков будет затухать и остывать этот огненный шар, чтобы на его поверхность можно было спустить геологические отряды? Если, конечно, он вообще будет остывать — это происходит далеко не всегда.
- guid: f0fbb053-0111-447c-a0fb-2d977f343d3d
  event: PRL_TheodoraFirstConversation_16
  text: '"М-м-м... личное вмешательство. Верный путь к тому, чтобы подставиться под удар". {n}Теодора рефлекторно касается одной из своих многочисленных {g|Encyclopedia:Augmentation}аугментаций{/g}.{/n} "Что скажешь, Эдельтрад? Тво{mf|й брат|я сестра} по колдовству не боится прикоснуться к опасности... в отличие от тебя".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: М-м-м... личное вмешательство. Верный путь к тому, чтобы подставиться под удар.
  - speaker: narrator
    text_clean: Теодора рефлекторно касается одной из своих многочисленных аугментаций.
  - speaker: Theodora von Valancius
    text_clean: Что скажешь, Эдельтрад? Твой брат по колдовству не боится прикоснуться к опасности... в отличие от тебя.
- guid: 51f02437-69ac-45ce-9878-ab71a11fa16b
  event: PRL_TheodoraFirstConversation_17
  text: '{n}Плечи Теодоры опускаются. Она бросает на вас последний взгляд и отворачивается к Эдельтраду.{/n} "Что ж. Я разочарована. Не знаю, что насчет тех наследников, которых пока еще не доставили на корабль... но из присутствующих здесь особ я не вижу искры Вольного Торговца ни в одном".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Плечи Теодоры опускаются. Она бросает на вас последний взгляд и отворачивается к Эдельтраду.
  - speaker: Theodora von Valancius
    text_clean: Что ж. Я разочарована. Не знаю, что насчет тех наследников, которых пока еще не доставили на корабль... но из присутствующих здесь особ я не вижу искры Вольного Торговца ни в одном.
- guid: a1236da4-4c20-4a47-8f61-713a29c745d2
  event: PRL_TheodoraFirstConversation_18
  text: '"Мое имя — Теодора фон Валанциус Массимо аф Скарус. Я — {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} на службе {g|Encyclopedia:Emperor}Бога-Императора{/g} Человечества, и мои права и свободы подтверждены святейшей реликвией — {g|Encyclopedia:Warrant}Торговым Патентом{/g}, коий хранится на этом самом корабле. Мне дарована честь вступать во тьму за пределами Империума и нести свет Человечества туда, где царствуют злобные и еретические силы, грозящие всем нам смертью и погибелью".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Мое имя — Теодора фон Валанциус Массимо аф Скарус. Я — Вольный Торговец на службе Бога-Императора Человечества, и мои права и свободы подтверждены святейшей реликвией — Торговым Патентом, коий хранится на этом самом корабле. Мне дарована честь вступать во тьму за пределами Империума и нести свет Человечества туда, где царствуют злобные и еретические силы, грозящие всем нам смертью и погибелью.
- guid: 26e17570-9f41-43b1-bad2-cc93d7910bf4
  event: PRL_TheodoraFirstConversation_19
  text: '"Прямолинейно. Мне нравится. Но тебе придется подождать. Прежде я хочу, чтобы ты уяснил{mf||а} себе кое-что".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Прямолинейно. Мне нравится. Но тебе придется подождать. Прежде я хочу, чтобы ты уяснил себе кое-что.
- guid: e83726c7-939e-457a-b961-d3d9a69c0f3c
  event: PRL_TheodoraFirstConversation_20
  text: '{n}Теодора скупо улыбается.{/n} "Разъяснения. Роскошь, которую мало кто из нас может себе позволить. Я не разъясняла тебе детали того вопроса, который задала ранее — неспроста. За пределами {g|Encyclopedia:Imperium}Империума{/g} редко выпадает возможность получить данные о ситуации в избытке. Впрочем, сейчас — как раз такая возможность".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора скупо улыбается.
  - speaker: Theodora von Valancius
    text_clean: Разъяснения. Роскошь, которую мало кто из нас может себе позволить. Я не разъясняла тебе детали того вопроса, который задала ранее — неспроста. За пределами Империума редко выпадает возможность получить данные о ситуации в избытке. Впрочем, сейчас — как раз такая возможность.
- guid: 3f9b42e1-5522-4533-9451-d77163e82205
  event: PRL_TheodoraFirstConversation_21
  text: '{n}Эдельтрад надменно вскидывает бровь.{/n} "Помимо {g|Encyclopedia:Xenos}ксеносов{/g} неизвестные планеты могут кишеть мириадом ужасов куда опаснее и сложнее для изничтожения. Полагаю, тебе, {name}, просто неизвестно о самом факте их существования".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад надменно вскидывает бровь.
  - speaker: Edelthrad
    text_clean: Помимо ксеносов неизвестные планеты могут кишеть мириадом ужасов куда опаснее и сложнее для изничтожения. Полагаю, тебе, КЭП, просто неизвестно о самом факте их существования.
- guid: df6a01e9-372d-4466-bcce-20cfa7a066b8
  event: PRL_TheodoraFirstConversation_22
  text: '{n}Эдельтрад издает стрекочущий смешок.{/n} "Едва ли стоит доверять погонщикам безмозглых стад решение столь сложных задач — ресурсы могут быть истрачены в пропорции, геометрически обратной полученному результату... не так ли, {name}?"'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад издает стрекочущий смешок.
  - speaker: Edelthrad
    text_clean: Едва ли стоит доверять погонщикам безмозглых стад решение столь сложных задач — ресурсы могут быть истрачены в пропорции, геометрически обратной полученному результату... не так ли, КЭП?
- guid: bad5eaad-2f55-49f2-b111-4b2834948ba0
  event: PRL_TheodoraFirstConversation_23
  text: '"Преступный мир Каликсиса?" {n}Эдельтрад изучает вас взглядом и поджимает губы, словно заметил нечто мерзкое.{/n} "Леди Теодора, вы весьма... экзотичны в том, кого приглашаете в свое общество. Или это возможность проверить свое семя на ересь и отсечь гниющую ветвь династического древа?"'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Преступный мир Каликсиса?
  - speaker: narrator
    text_clean: Эдельтрад изучает вас взглядом и поджимает губы, словно заметил нечто мерзкое.
  - speaker: Edelthrad
    text_clean: Леди Теодора, вы весьма... экзотичны в том, кого приглашаете в свое общество. Или это возможность проверить свое семя на ересь и отсечь гниющую ветвь династического древа?
- guid: 5bb8817a-2a48-40b7-9c7a-54cac913c615
  event: PRL_TheodoraFirstConversation_24
  text: '{n}Эдельтрад вторит смеху Теодоры.{/n} "Расставаться с данной властью значит приглашать разгул ереси и опасного свободомыслия в свое окружение. Судя по лени в мышлении, ты, {name}, наверняка уже допустил{mf||а} это в своем домене".'
