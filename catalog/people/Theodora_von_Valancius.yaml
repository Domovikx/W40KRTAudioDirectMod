  text: '{n}Теодора усмехается.{/n} "Основательно, хотя и самонадеянно. Мне многого стоило найти одного {g|Encyclopedia:Psyker}псайкера{/g}, способного хорошо мне служить на протяжении многих лет, а ты говоришь о нескольких..."'
