  text: '{n}Идира содрогается всем телом.{/n} "Это работает не так. Я могу попробовать прочитать память предметов... но мертвецы — совершенно другое. Для подобного нужна будет ее душа... после того, что мы видели на офицерской палубе, я не рискну искать ее в {g|Encyclopedia:Warp}варпе{/g}".'
