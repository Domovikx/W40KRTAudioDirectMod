- guid: 698a9fef-f849-4f36-9caf-beb22c0ff7d7
  event: PRL_TheodoraFirstConversation_29
  text: '"Душа псайкера — отверстые врата для Губительных сил". {n}Эдельтрад прожигает вас взглядом, цедя каждое слово сквозь зубы.{/n} "Едва ли подданн{mf|ый|ая} {g|Encyclopedia:Imperium}Империума{/g} надеж{mf|ен|на}, если сам{mf||а} приглашает скверну войти в чертог".'
