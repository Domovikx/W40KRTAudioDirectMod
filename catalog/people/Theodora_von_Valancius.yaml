- guid: 6dcd64d5-f529-4319-b5ce-99bc3d0e0294
  event: PRL_TheodoraFirstConversation_59
  text: '{n}Теодора качает головой.{/n} "Иногда я забываю, что люди, не имевшие прямого доступа к корабельному мостику, могут не иметь ни малейшего представления о том, как наше судно путешествует среди звезд".'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Теодора качает головой.
  - speaker: Theodora von Valancius
    text_clean: Иногда я забываю, что люди, не имевшие прямого доступа к корабельному мостику, могут не иметь ни малейшего представления о том, как наше судно путешествует среди звезд.
- guid: cd66c5b9-1e9a-4bca-92bb-36b89597a16b
  event: PRL_TheodoraFirstConversation_60
  text: '"К нам присоединил{mf|ся|ась} втор{mf|ой|ая} кандидат{mf||ка}". {n}Сухой женский голос и жгучее ощущение, что на вас смотрят, заставляет вас перевести взгляд на Теодору. {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} взирает на вас в упор, и взор ее подобен ей самой — хищен и тяжеловесен.{/n} "{name}, подойди и дай мне ответ".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: К нам присоединился второй кандидат.
  - speaker: narrator
    text_clean: Сухой женский голос и жгучее ощущение, что на вас смотрят, заставляет вас перевести взгляд на Теодору. Вольный Торговец взирает на вас в упор, и взор ее подобен ей самой — хищен и тяжеловесен.
  - speaker: Theodora von Valancius
    text_clean: КЭП, подойди и дай мне ответ.
- guid: dc458c63-6a71-4e34-9fa4-a80fb3b1c1b3
  event: PRL_TheodoraFirstConversation_61
  text: '"Смотри. Изучай. Впитывай. Тебе понадобится время, чтобы освоиться на корабле и в своем новом положении. Со временем я найду для тебя подходящий пост — так же, как я нашла позицию и для Эделя. До тех пор — считай себя моим помощником".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Смотри. Изучай. Впитывай. Тебе понадобится время, чтобы освоиться на корабле и в своем новом положении. Со временем я найду для тебя подходящий пост — так же, как я нашла позицию и для Эделя. До тех пор — считай себя моим помощником.
- guid: ee5b5871-2d0f-44f9-bf8e-1de9add422ef
  event: PRL_TheodoraFirstConversation_62
  text: '"Система Райкад, владения Вольного Торговца Винтерскейла — одного из моих коллег... и соперников. В {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g} есть еще два Вольных Торговца, и каждый из них располагает ресурсами, сопоставимыми с моими. Быть может, ты когда-нибудь поспособствуешь тому, чтобы превзойти их обоих в богатстве и величии".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Система Райкад, владения Вольного Торговца Винтерскейла — одного из моих коллег... и соперников. В Просторе Коронус есть еще два Вольных Торговца, и каждый из них располагает ресурсами, сопоставимыми с моими. Быть может, ты когда-нибудь поспособствуешь тому, чтобы превзойти их обоих в богатстве и величии.
- guid: afc69d39-599f-4451-93fc-0fddd0a41993
  event: PRL_TheodoraFirstConversation_63
  text: '"Вот как? Возможно, техноматы были неосторожны при обслуживании. Или же варп играет шутки с нами, невзирая на Поле Геллера. Или же истории про одержимый корабль все же имеют под собой основание". {n}Теодора беспечно смеется.{/n}'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Вот как? Возможно, техноматы были неосторожны при обслуживании. Или же варп играет шутки с нами, невзирая на Поле Геллера. Или же истории про одержимый корабль все же имеют под собой основание.
  - speaker: narrator
    text_clean: Теодора беспечно смеется.
- guid: 82c663cc-400d-4eb2-b146-5c8b099cfb8a
  event: PRL_TheodoraFirstConversation_64
  text: '{n}Седовласый офицер бросает на Вольного Торговца взгляд, в котором читается осторожная укоризна.{/n} "Леди Теодора, ради Бога-Императора... неужели теперь и вы начнете повторять досужие слухи, что разносит необразованная чернь?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: narrator
    text_clean: Седовласый офицер бросает на Вольного Торговца взгляд, в котором читается осторожная укоризна.
  - speaker: Theodora von Valancius
    text_clean: Леди Теодора, ради Бога-Императора... неужели теперь и вы начнете повторять досужие слухи, что разносит необразованная чернь?
- guid: de3521f5-361d-4173-89e7-62bdbae4cacb
  event: PRL_TheodoraFirstConversation_65
  text: '"Довольно, Абеляр! Подобная болтовня развлекает меня — Идира охотно пересказывает мне все, что нашептывают ее невидимые советники". {n}Теодора поворачивается к вам.{/n} "Этот корабль воистину древен. В нем достаточно потаенных уголков, вышедших из строя {g|Encyclopedia:Cogitator}когитаторов{/g} и выведенных из эксплуатации отсеков, чтобы неразумные люди начали болтать о призраках, обитающих в переборках и строящих козни пока еще живым людям".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Довольно, Абеляр! Подобная болтовня развлекает меня — Идира охотно пересказывает мне все, что нашептывают ее невидимые советники.
  - speaker: narrator
    text_clean: Теодора поворачивается к вам.
  - speaker: Theodora von Valancius
    text_clean: Этот корабль воистину древен. В нем достаточно потаенных уголков, вышедших из строя когитаторов и выведенных из эксплуатации отсеков, чтобы неразумные люди начали болтать о призраках, обитающих в переборках и строящих козни пока еще живым людям.
- guid: 4ddf8dd4-0ff4-4c9e-ad7d-d53cbb32b647
  event: PRL_TheodoraFirstConversation_66
  text: '"Не задавать подобных вопросов. Мне не нужны подхалимы. Я сделаю необходимые выводы о твоей кандидатуре, когда тебе представится возможность проявить себя. Когда эта возможность появится — ведомо только Богу-Императору".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Не задавать подобных вопросов. Мне не нужны подхалимы. Я сделаю необходимые выводы о твоей кандидатуре, когда тебе представится возможность проявить себя. Когда эта возможность появится — ведомо только Богу-Императору.
- guid: b9ce1a00-e981-4721-acb3-c56cb3d66a45
  event: PRL_TheodoraFirstConversation_67
  text: '"Пока ты думаешь над ответом, Эдельтрад, я хочу поговорить кое с кем другим. Может быть, мне дадут ответ интереснее, чем невразумительное мычание". {n}Теодора кивает в вашу сторону.{/n} "Подойди".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Пока ты думаешь над ответом, Эдельтрад, я хочу поговорить кое с кем другим. Может быть, мне дадут ответ интереснее, чем невразумительное мычание.
  - speaker: narrator
    text_clean: Теодора кивает в вашу сторону.
  - speaker: Theodora von Valancius
    text_clean: Подойди.
- guid: 350bb478-7c05-482e-98d4-0d586c809916
  event: PRL_TheodoraFirstConversation_68
  text: '"Только я решаю, как мне поступать с тем, что я обнаружу за пределами исследованной пустоты. Каждый мир, открытый мной, принадлежит мне вместе со всем, что на нем есть — ресурсами, людьми, сокровищами и тайнами. Я распоряжаюсь миллионами судеб, правлю множеством планет, владею богатствами, о которых не может помыслить ни один планетарный губернатор или командующий. И ты, {name} — од{mf|ин|на} из тех, в чьих жилах есть след крови фон Валанциус и кто может претендовать на получение этого наследства, когда придет время".'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Только я решаю, как мне поступать с тем, что я обнаружу за пределами исследованной пустоты. Каждый мир, открытый мной, принадлежит мне вместе со всем, что на нем есть — ресурсами, людьми, сокровищами и тайнами. Я распоряжаюсь миллионами судеб, правлю множеством планет, владею богатствами, о которых не может помыслить ни один планетарный губернатор или командующий. И ты, КЭП — один из тех, в чьих жилах есть след крови фон Валанциус и кто может претендовать на получение этого наследства, когда придет время.
- guid: 3c033735-c790-4157-ae80-46fbf73c35b5
  event: PRL_TheodoraFirstConversation_69
  text: '"Представь себе гипотетическую ситуацию. Айон-VI. Новый мир на границе Простора Коронус. Высокая сейсмическая активность, регулярные изливы магмы, залежи метаморфических руд, перспективы широкомасштабной добычи. Мир населен аборигенами, поклоняющимися неким еретическим "подземным духам", которые защищают всех, кто приносит им жертвы. Казалось бы, выдумки. Но попытка установить рудные экстракторы провалилась уже во второй раз — команды добытчиков просто исчезли за одну ночь на поверхности планеты. Вопрос... что бы ты сделал{mf||а} с этим отравленным сокровищем?"'
  speaker: Theodora von Valancius
  parts:
  - speaker: Theodora von Valancius
    text_clean: Представь себе гипотетическую ситуацию. Айон-VI. Новый мир на границе Простора Коронус. Высокая сейсмическая активность, регулярные изливы магмы, залежи метаморфических руд, перспективы широкомасштабной добычи. Мир населен аборигенами, поклоняющимися неким еретическим "подземным духам", которые защищают всех, кто приносит им жертвы. Казалось бы, выдумки. Но попытка установить рудные экстракторы провалилась уже во второй раз — команды добытчиков просто исчезли за одну ночь на поверхности планеты. Вопрос... что бы ты сделал с этим отравленным сокровищем?
- guid: 870e7646-f0ce-478f-8321-0626a6f2b91e
  event: PRL_TheodoraFirstConversation_70
  text: '"Прошу меня простить, Леди Теодора. Ваше присутствие оказывает на меня столь ошеломляющий эффект, что я забыл о времени". {n}Эдельтрад церемонно откланивается и, не одарив вас ни взглядом более, разворачивается и удаляется.{/n}'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Прошу меня простить, Леди Теодора. Ваше присутствие оказывает на меня столь ошеломляющий эффект, что я забыл о времени.
  - speaker: narrator
    text_clean: Эдельтрад церемонно откланивается и, не одарив вас ни взглядом более, разворачивается и удаляется.
- guid: 153da55b-72ee-4fda-8abd-bf9747388de6
  event: PRL_TheodoraFirstConversation_71
  text: '{n}Теодора провожает взглядом удаляющегося наследника. Затем она поворачивается к вам.{/n} "Итак, {name}. Зачем ты здесь?"'
