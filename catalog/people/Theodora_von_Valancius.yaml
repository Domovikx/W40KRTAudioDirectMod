  event: PRL_TheodorasFate_05
  text: '{n}Идира всхлипывает и поднимается на ноги, после чего начинает рассеянно оглядываться.{/n} "Я... могу посмотреть на вещи. Особым взглядом. Если найдется что-то... что-то, на чем может быть отпечаток убийцы... просто дайте мне этот предмет — и я попробую разглядеть тайны, что он скрывает!"'
  speaker: Idira Tlass
