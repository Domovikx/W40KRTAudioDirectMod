    text_clean: Это утверждение ложно, но предсказуемо. Откровения Омниссии шокируют темный разум, не способный принять и понять их праведную суть.
- guid: 057dd908-7158-41cd-98cd-13a9e3f8972f
  event: Companions_Techpriest_106
  text: '"Плоть непостоянна, но металл крепок, как моя преданность".'
  speaker: Pasqal Haneumann
  parts:
