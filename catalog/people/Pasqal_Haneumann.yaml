  event: ''
  text: '{n}Паскаль негодующе взирает на вас.{/n} "Фиксирую святотатство! Сей подвижник веры не представлял угрозы, прекращение его жизненных функций было излишним".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль негодующе взирает на вас.
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую святотатство! Сей подвижник веры не представлял угрозы, прекращение его жизненных функций было излишним.
- guid: f6fcb8b6-6e34-45c9-82f1-310ee308b96f
  event: ''
  text: '"Догмат велит совершить последовательные ритуалы очищения и пересборки варп-секстанта. Этот ритуал долог и трудоемок".

    {n}Паскаль колеблется, перед тем, как продолжить.{/n} "Наша надежда — в том, чтобы обойти священный запрет на взаимодействие с проводниками Движущей Силы. Более быстрый и менее ортодоксальный путь".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Догмат велит совершить последовательные ритуалы очищения и пересборки варп-секстанта. Этот ритуал долог и трудоемок.
  - speaker: narrator
    text_clean: Паскаль колеблется, перед тем, как продолжить.
  - speaker: Pasqal Haneumann
    text_clean: Наша надежда — в том, чтобы обойти священный запрет на взаимодействие с проводниками Движущей Силы. Более быстрый и менее ортодоксальный путь.
- guid: fa4c1195-6ecd-4d8d-9a7a-920c04de651c
  event: ''
  text: '"Утверждение... потенциально истинно. Протоколы кибермастифа сложны для взлома и изменения, тем более..." {n}Паскаль обводит окружение тоскливым взглядом.{/n} "...в подобной примитивной культуре".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение... потенциально истинно. Протоколы кибермастифа сложны для взлома и изменения, тем более...
  - speaker: narrator
    text_clean: Паскаль обводит окружение тоскливым взглядом.
  - speaker: Pasqal Haneumann
    text_clean: '...в подобной примитивной культуре.'
- guid: fb9cd209-9e82-4495-9812-91d36cbfb1ef
  event: ''
  text: '"Запрос одобрен, как доктринально верный". {n}Паскаль склоняется над существом, и звук активировавшегося бура звучит гневно и яростно. Голос техножреца вскипает лавой, наполняется обещанием небесной кары.{/n} "Да будет прерван Цикл, да будут очищено скверное!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен, как доктринально верный.
  - speaker: narrator
    text_clean: Паскаль склоняется над существом, и звук активировавшегося бура звучит гневно и яростно. Голос техножреца вскипает лавой, наполняется обещанием небесной кары.
  - speaker: Pasqal Haneumann
    text_clean: Да будет прерван Цикл, да будут очищено скверное!
- guid: fff0ce1b-a192-43bd-8481-83f20dee49dc
  event: ''
  text: '{n}Паскаль застывает, но в визоре его вспыхивают зеленые искры. Вытянув руку к Тарзусу, он лязгающим голосом отвечает:{/n} "Да будет прерван Цикл!" {n}Вы понимаете, что слова Паскаля звучат и из его вокса, и из вокса Тарзуса. А затем все датчики на боевой упряжи палача ослепительно вспыхивают, и рев боли раненого бронированного левиафана оглушает вас.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль застывает, но в визоре его вспыхивают зеленые искры. Вытянув руку к Тарзусу, он лязгающим голосом отвечает:'
  - speaker: Pasqal Haneumann
    text_clean: Да будет прерван Цикл!
  - speaker: narrator
    text_clean: Вы понимаете, что слова Паскаля звучат и из его вокса, и из вокса Тарзуса. А затем все датчики на боевой упряжи палача ослепительно вспыхивают, и рев боли раненого бронированного левиафана оглушает вас.
- guid: d1eead0a-5759-424e-9c9c-cdccd7c3d32a
  event: BNTRS_AreaPeaceful_Pascal_6
  text: '"Проведен визуальный осмотр окружения. Металлическая обшивка бункера в полной сохранности и не имеет повреждений".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Проведен визуальный осмотр окружения. Металлическая обшивка бункера в полной сохранности и не имеет повреждений.
- guid: 7194355d-27a2-4e86-ae40-3ed872eda2df
  event: BNTRS_AreaStressful_Pasqal_10
  text: '"Не ведомый очевидной наживой, твой разум предсказуемо слаб и ленив. Пытливому разведчику очевидно, что мы приблизились к кладезю данных".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Не ведомый очевидной наживой, твой разум предсказуемо слаб и ленив. Пытливому разведчику очевидно, что мы приблизились к кладезю данных.
- guid: 1f2b0ca6-72d7-4f37-bfac-419588019435
  event: BNTRS_AreaStressful_Pasqal_104
  text: '"Благодарю тебя, Омниссия, что даруешь мне возможность воплотиться инфохищником, что следует за Знанием!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Благодарю тебя, Омниссия, что даруешь мне возможность воплотиться инфохищником, что следует за Знанием!
- guid: 2384d917-16b7-4392-9d06-61df85352101
  event: BNTRS_AreaStressful_Pasqal_110
  text: '"Зачем простолюдинам столько места? Это нерационально, они могут быть размещены значительно компактнее".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Зачем простолюдинам столько места? Это нерационально, они могут быть размещены значительно компактнее.
- guid: b66aafbb-7960-4f20-b29c-12beaef34844
  event: BNTRS_AreaStressful_Pasqal_120
  text: '"Пустотная станция — святыня Омниссии, что преграждает дорогу смерти и тьме к владыкам сей крепости. Так почему же вокс-каналы мертвы, а воздух не полнится священными бинарными ритмами?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Пустотная станция — святыня Омниссии, что преграждает дорогу смерти и тьме к владыкам сей крепости. Так почему же вокс-каналы мертвы, а воздух не полнится священными бинарными ритмами?
- guid: e5927a3c-dae4-4dd5-8430-6ebff474c6be
  event: BNTRS_AreaStressful_Pasqal_135
  text: '"Первичный осмотр судна указывает, что мои собратья-Эксплораторы уже провели здесь процедуру упокоения. Дальнейшее изучение нецелесообразно".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Первичный осмотр судна указывает, что мои собратья-Эксплораторы уже провели здесь процедуру упокоения. Дальнейшее изучение нецелесообразно.
- guid: ba121b88-e8f0-4b96-8542-559d5b047161
  event: BNTRS_AreaStressful_Pasqal_145
  text: '"Анархия в звездной гавани приведет к тому, что почтенные машинные духи летательных аппаратов взволнуются и оглохнут к литаниям успокоения. Следует быть осторожным с шаттлом, который мы используем для эвакуации".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Анархия в звездной гавани приведет к тому, что почтенные машинные духи летательных аппаратов взволнуются и оглохнут к литаниям успокоения. Следует быть осторожным с шаттлом, который мы используем для эвакуации.
- guid: faec7159-3b76-472e-a1a3-791bbb7d1266
  event: BNTRS_AreaStressful_Pasqal_149
  text: '"Фиксирую многочисленные потери среди боевых и гражданских единиц. С высокой вероятностью показатели могли быть ниже при более грамотном командовании".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую многочисленные потери среди боевых и гражданских единиц. С высокой вероятностью показатели могли быть ниже при более грамотном командовании.
- guid: 0e635cc4-9cf0-4031-9cdc-31d8d4db9ddf
  event: BNTRS_AreaStressful_Pasqal_162
  text: '"Фиксирую множественные структурные разрушения гробницы и гибель состава экспедиции. Инициирую расследование, чтобы выяснить была ли тому причиной вопиющая некомпетентность или чрезвычайная ситуация".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую множественные структурные разрушения гробницы и гибель состава экспедиции. Инициирую расследование, чтобы выяснить была ли тому причиной вопиющая некомпетентность или чрезвычайная ситуация.
- guid: 66b6b895-f969-4a77-b279-bf37d54db7d8
  event: BNTRS_AreaStressful_Pasqal_170
  text: '"Превышена предельно допустимая концентрация в воздухе токсичных веществ. Членам экипажа рекомендовано активировать респираторную защиту".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Превышена предельно допустимая концентрация в воздухе токсичных веществ. Членам экипажа рекомендовано активировать респираторную защиту.
- guid: fe5a11a6-d7db-4e63-9dfb-add655cb6e99
  event: BNTRS_AreaStressful_Pasqal_34
  text: '"Ты видела лишь один агромир, притом довольно запущенный, и решила, что весь Империум подобен ему? Комичное суждение".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Ты видела лишь один агромир, притом довольно запущенный, и решила, что весь Империум подобен ему? Комичное суждение.
- guid: 7c18db35-405d-4739-acdb-dbac1483bcd6
  event: BNTRS_AreaStressful_Pasqal_37
  text: '"Верфь Футфола — благословенное чудо многомощного Омниссии. Остальная станция — лишь избыточный довесок к ней".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Верфь Футфола — благословенное чудо многомощного Омниссии. Остальная станция — лишь избыточный довесок к ней.
- guid: abb84bad-697c-4aa2-bc86-7bdbde7ab08d
  event: BNTRS_AreaStressful_Pasqal_40
  text: '"Целое заведение, посвященное непродуктивным и паразитическим способам времяпрепровождения. Напрасная трата площади станции".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Целое заведение, посвященное непродуктивным и паразитическим способам времяпрепровождения. Напрасная трата площади станции.
- guid: 33974ee9-814d-4378-9d1f-b59ab688673c
  event: BNTRS_AreaStressful_Pasqal_46
  text: '"Разумное решение. Храмы Экклезиархии лишены критически важного для станции функционала. В отличие от капелл Механикус".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Разумное решение. Храмы Экклезиархии лишены критически важного для станции функционала. В отличие от капелл Механикус.
- guid: 305d27b5-952f-464d-89b9-f882e8afc393
  event: BNTRS_AreaStressful_Pasqal_5
  text: '"Восславьте ток Движущей силы, воссияйте в ноосферных нимбах сладостным светом ея, напитайте аугментику свою живостью ея, омойте императивы и энграммы свои чистотой ея".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Восславьте ток Движущей силы, воссияйте в ноосферных нимбах сладостным светом ея, напитайте аугментику свою живостью ея, омойте императивы и энграммы свои чистотой ея.
- guid: 15765189-0100-4a83-9b78-44aefdcd97f6
  event: BNTRS_AreaStressful_Pasqal_66
  text: '"Возглашаю псалом инфослужения, прославляя священный цех сей. Возглашаю вспомогательную литанию инициации благовещения. Омниссия знает все, постигает все".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Возглашаю псалом инфослужения, прославляя священный цех сей. Возглашаю вспомогательную литанию инициации благовещения. Омниссия знает все, постигает все.
- guid: 33addce5-9a89-4eec-9102-330789d8457a
  event: BNTRS_AreaStressful_Pasqal_70
  text: '"Протоколы служения машинным духам кощунственно нарушены. Ноосфера корабля переполнена инфонечистотами!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Протоколы служения машинным духам кощунственно нарушены. Ноосфера корабля переполнена инфонечистотами!
- guid: 782747d9-e264-4de4-9647-112e307b1b60
  event: BNTRS_AreaStressful_Pasqal_84
  text: '"Империум — великий механизм, а мы — шестерни в нем. И здесь расположен склад для самых скверных и проржавелых шестерней".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Империум — великий механизм, а мы — шестерни в нем. И здесь расположен склад для самых скверных и проржавелых шестерней.
- guid: 52d882eb-fbf7-49dc-a7f6-5c67a03fe420
  event: BNTRS_AreaStressful_Pasqal_91
  text: '"Столь нетипичная для мирянки осведомленность заслуживала бы одобрения, если бы не тот факт, что генетор Канассиан был отлучен около трех столетий назад".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Столь нетипичная для мирянки осведомленность заслуживала бы одобрения, если бы не тот факт, что генетор Канассиан был отлучен около трех столетий назад.
- guid: 70626657-87c8-4d0e-9d6e-ea0c1d718fce
  event: BNTRS_Chapter1_Pascal_01
  text: '"Святость монастыря Движущей Силы была нарушена, но обеты Омниссии восторжествовали. В дарах Его да обретется истинная сила".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Святость монастыря Движущей Силы была нарушена, но обеты Омниссии восторжествовали. В дарах Его да обретется истинная сила.
- guid: 0ec02b46-9fea-4a54-b0f7-1584ff220316
  event: BNTRS_Chapter1_Pascal_14
  text: '"Единица совершает умозаключения из доступной информации, содержащей погрешности. Результат... загрязнен".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единица совершает умозаключения из доступной информации, содержащей погрешности. Результат... загрязнен.
- guid: fed0508c-d9bc-4224-8bda-a835aaefc633
  event: BNTRS_Chapter1_Pascal_33
  text: '"Первичный приоритет — эвакуация Вольного Торговца с планеты. Вторичный приоритет — выживание свиты. Активирую протокол вычисленного самопожертвования".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Первичный приоритет — эвакуация Вольного Торговца с планеты. Вторичный приоритет — выживание свиты. Активирую протокол вычисленного самопожертвования.
- guid: c3510fb1-1239-43e4-a995-2c742b4dc324
  event: BNTRS_Chapter1_Pasqal_49
  text: '"Постигнув Истину, да укрой ее от профанного ума и реки чисто и бинарно".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Постигнув Истину, да укрой ее от профанного ума и реки чисто и бинарно.
- guid: 9aaf0790-9138-4b14-885c-6b81a3d12659
  event: BNTRS_Chapter1_Pasqal_51
  text: '"Флот Осознание и династию фон Валанциус связывает череда плодотворных соглашений. Данная единица рада способствовать укреплению продуктивной связи на основании совместного уничтожения еретиков".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Флот Осознание и династию фон Валанциус связывает череда плодотворных соглашений. Данная единица рада способствовать укреплению продуктивной связи на основании совместного уничтожения еретиков.
- guid: fa9b2f18-488d-4ad0-b9e0-831c81475739
  event: BNTRS_Chapter1_Pasqal_54
  text: '"Восстания мирян есть бунт неоптимальных инстинктов и желаний над предопределенной структурой. Случившееся есть результат недостаточной сервиторизации экипажа".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Восстания мирян есть бунт неоптимальных инстинктов и желаний над предопределенной структурой. Случившееся есть результат недостаточной сервиторизации экипажа.
- guid: e28df665-03a9-4727-8f14-fb0a58c4438a
  event: BNTRS_Chapter2_Pascal_113
  text: '"Прекращение жизненных функций единицы Идира Тласс значительно снизило риск возникновения аномалий на борту. Утилизация была оправдана".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Прекращение жизненных функций единицы Идира Тласс значительно снизило риск возникновения аномалий на борту. Утилизация была оправдана.
- guid: 8daec027-056a-4cfe-9be0-95ba68f52864
  event: BNTRS_Chapter2_Pascal_119
  text: '"Извещаю: все акты кощунственного воровства, попрания привилегий Адептус Механикус и мародерства будут каталогизированы для исполнения правосудия".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: 'Извещаю: все акты кощунственного воровства, попрания привилегий Адептус Механикус и мародерства будут каталогизированы для исполнения правосудия.'
- guid: 8133efbf-de76-4a9a-ab6e-7444538631a2
  event: BNTRS_Chapter2_Pascal_12
  text: '"Анализ рекомендует приготовить системы Простора к грядущим столкновениям с силами, доминирующими теперь на мире Райкад Минорис. Сценарий экспансивной конфронтации вероятен на 86%".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Анализ рекомендует приготовить системы Простора к грядущим столкновениям с силами, доминирующими теперь на мире Райкад Минорис. Сценарий экспансивной конфронтации вероятен на 86%.
- guid: bf396217-dfdb-4ce5-b4f9-90d6831de0f7
  event: BNTRS_Chapter2_Pascal_130
  text: '"Единицу не покидает ощущение, что принципы работы Администратума есть пародийное восприятие священного догмата "уподобься в служении механизму". Предтечи имели в виду не это!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единицу не покидает ощущение, что принципы работы Администратума есть пародийное восприятие священного догмата "уподобься в служении механизму". Предтечи имели в виду не это!
- guid: fbe90383-3b7a-4c8f-9e94-fbf47da60ed8
  event: BNTRS_Chapter2_Pascal_137
  text: '"Единица Хейнрикс ван Калокс не обладает допуском к данной информации".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единица Хейнрикс ван Калокс не обладает допуском к данной информации.
- guid: 04e88afc-a54e-4336-ac33-6878bd666caa
  event: BNTRS_Chapter2_Pascal_139
  text: '"Данное развитие событий маловероятно... но не исключено. Единица выражает сожаление о пострадавшем убранстве священной машины".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Данное развитие событий маловероятно... но не исключено. Единица выражает сожаление о пострадавшем убранстве священной машины.
- guid: 9d0eb7a6-2186-4c60-85ed-62cbb2e37647
  event: BNTRS_Chapter2_Pascal_142
  text: '"Прорицателей, зрящих грядущее в Имматериуме, отвергни. Лишь статистический анализ воистину чист".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Прорицателей, зрящих грядущее в Имматериуме, отвергни. Лишь статистический анализ воистину чист.
- guid: 265614fc-8728-4d2c-81b5-6a60a17a58d3
  event: BNTRS_Chapter2_Pascal_151
  text: '"Где человеком движет стремление к Знанию, угодное Омниссии, ксеносом движет болезненное любопытство к изобретению новых зловредств".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Где человеком движет стремление к Знанию, угодное Омниссии, ксеносом движет болезненное любопытство к изобретению новых зловредств.
- guid: 7ed19915-fe28-4ad9-afdc-b3ddc9885286
  event: BNTRS_Chapter2_Pascal_20
  text: '"Готовность мира Даргонус к сценарию конфронтации признана удовлетворительной. Подавляющий процент потерь приходится на легко заменяемую чернь, важные объекты производства понесли минимальный ущерб".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Готовность мира Даргонус к сценарию конфронтации признана удовлетворительной. Подавляющий процент потерь приходится на легко заменяемую чернь, важные объекты производства понесли минимальный ущерб.
- guid: b60df201-3610-42d2-b4a0-bb64c5835388
  event: BNTRS_Chapter2_Pascal_26
  text: '"Стойкость исполнения данной единицей ее обязанностей частично примиряет с нехваткой у нее чувства долга, достаточного, чтобы самостоятельно прервать свои жизненные функции".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Стойкость исполнения данной единицей ее обязанностей частично примиряет с нехваткой у нее чувства долга, достаточного, чтобы самостоятельно прервать свои жизненные функции.
- guid: 5ec7b887-4de2-48a1-9204-d678fad4a199
  event: BNTRS_Chapter2_Pascal_34
  text: '"Утверждение ложно. Данная единица имеет долгий срок службы и наблюдала планетарные катастрофы . Их статистическая значимость невелика в масштабах сектора. Утверждение загрязнено эмоциональным грузом скорби".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение ложно. Данная единица имеет долгий срок службы и наблюдала планетарные катастрофы. Их статистическая значимость невелика в масштабах сектора. Утверждение загрязнено эмоциональным грузом скорби.
- guid: 21e1d0a2-fd67-4682-a472-612645a5ef8f
  event: BNTRS_Chapter2_Pascal_37
  text: '"Профилактической сокращение излишков населения могло положительно сказаться на работоспособности станции. Анализ указывает, что под угрозой смерти находились наименее полезные единицы".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Профилактической сокращение излишков населения могло положительно сказаться на работоспособности станции. Анализ указывает, что под угрозой смерти находились наименее полезные единицы.
- guid: 101f5873-99c3-4887-950d-48dd458ec040
  event: BNTRS_Chapter2_Pascal_53
  text: '"В случае благоприятного развития сценария принесения жертвы твое тело не сгинет без цели, но будет подвергнуто священному анатомированию. Возрадуйся".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: В случае благоприятного развития сценария принесения жертвы твое тело не сгинет без цели, но будет подвергнуто священному анатомированию. Возрадуйся.
- guid: 1dbd76e6-2058-40aa-b5a4-be5cb84abf83
  event: BNTRS_Chapter2_Pascal_54
  text: '"Наблюдение осквернения, свершенного над мануфакторумами Кьявы Гамма порождает в моей когнитивной цепи... непродуктивные сигналы. Инициирую запуск мантры умиротворения и митигации духовного износа".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Наблюдение осквернения, свершенного над мануфакторумами Кьявы Гамма порождает в моей когнитивной цепи... непродуктивные сигналы. Инициирую запуск мантры умиротворения и митигации духовного износа.
- guid: 6ff50c01-034e-4043-9037-d62b1e6d256a
  event: BNTRS_Chapter2_Pascal_61
  text: '"Да утихнет дискордиальный ритм, звучащий в храме сем, да возвратятся параметры к оптимуму своему, да восстановлен будет священный алгоритм и продолжится в итерациях своих".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Да утихнет дискордиальный ритм, звучащий в храме сем, да возвратятся параметры к оптимуму своему, да восстановлен будет священный алгоритм и продолжится в итерациях своих.
- guid: 8c13a45b-9d4f-4d22-9392-10b5abbbb0ee
  event: BNTRS_Chapter2_Pascal_67
  text: '"Утрата значительная, но восполнимая. Гибель самого пустотного корабля — вот истинное горе для Империума. Священный храм Омниссии отныне стал пустой скорлупой, и машинные духи покинули его".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утрата значительная, но восполнимая. Гибель самого пустотного корабля — вот истинное горе для Империума. Священный храм Омниссии отныне стал пустой скорлупой, и машинные духи покинули его.
- guid: 474f999a-5365-4e2c-9947-695b281f34a4
  event: BNTRS_Chapter2_Pascal_69
  text: '"Имена техноэкипажа, несшего службу на пораженном порчей судне, вычеркнуты из поминальной свод-молитвы. Ввиду постыдного непротивления скверне им отказано в статусе страстотерпцев".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Имена техноэкипажа, несшего службу на пораженном порчей судне, вычеркнуты из поминальной свод-молитвы. Ввиду постыдного непротивления скверне им отказано в статусе страстотерпцев.
- guid: 1abcb175-4496-405d-9bf8-5cffebed6a01
  event: BNTRS_Chapter2_Pascal_99
  text: '"Священная машина, одержимая ирреальным бесом варпа, предсказывающим будущее... Хитроумное кощунство. Мерзкое, но... изощренное и талантливое".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Священная машина, одержимая ирреальным бесом варпа, предсказывающим будущее... Хитроумное кощунство. Мерзкое, но... изощренное и талантливое.
- guid: da076f2d-2e78-40b4-b21c-fcbe2730d35f
  event: BNTRS_Chapter3_Pascal_09
  text: '"Статус мученика дает единице Абеляр Версериан право испросить аугментации эмоциональной ингибиции. Единица будет испрашивать?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Статус мученика дает единице Абеляр Версериан право испросить аугментации эмоциональной ингибиции. Единица будет испрашивать?
- guid: 8f52bcd8-87bc-427c-b598-6c267a83637b
  event: BNTRS_Chapter3_Pascal_101
  text: '"Местные механизмы — уродливая скверноточивая аберрация священной Технологии. Но... возможно ли узреть в искривленном зеркале истинный облик того, что отражается в нем?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Местные механизмы — уродливая скверноточивая аберрация священной Технологии. Но... возможно ли узреть в искривленном зеркале истинный облик того, что отражается в нем?
- guid: 23234a79-8098-4a72-bd05-6368724e1d3a
  event: BNTRS_Chapter3_Pascal_104
  text: '"Мощь души данной единицы исходит не из плоти, что слаба и ущербна, но из металла, не знающего износа. Она может быть сломана, но не сломлена".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Мощь души данной единицы исходит не из плоти, что слаба и ущербна, но из металла, не знающего износа. Она может быть сломана, но не сломлена.
- guid: 4609ddff-eb81-407c-981e-ffc227c8dc37
  event: BNTRS_Chapter3_Pascal_24
  text: '"Надежда напрасна, мечтания преждевременны. Шансы на выживание возросли незначительно... пока что".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Надежда напрасна, мечтания преждевременны. Шансы на выживание возросли незначительно... пока что.
- guid: ff1207f2-4193-45cc-b261-23261e144611
  event: BNTRS_Chapter3_Pascal_28
  text: '"Метрические исчисления бесполезны — пространства ирреального постижимы лишь эмпирическим опытом, но не системным анализом".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Метрические исчисления бесполезны — пространства ирреального постижимы лишь эмпирическим опытом, но не системным анализом.
- guid: f05b2197-3289-438b-8356-646adc5be60b
  event: BNTRS_Chapter3_Pascal_41
  text: '"Причащенным Истинной плотью не страшны увечья, обрывающие существование простых слуг. Благость Омниссии дала мне шанс пережить страсти и воспрять к новому служению".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Причащенным Истинной плотью не страшны увечья, обрывающие существование простых слуг. Благость Омниссии дала мне шанс пережить страсти и воспрять к новому служению.
- guid: 29e6a0a4-d553-47be-98f1-b1ed7b704f8a
  event: BNTRS_Chapter3_Pascal_58
  text: '"Запись о сотрудничестве единицы Идира Тласс с ксеносами-пленителями занесена в каталог. Активирован протокол бдения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запись о сотрудничестве единицы Идира Тласс с ксеносами-пленителями занесена в каталог. Активирован протокол бдения.
- guid: 3d9506cb-ec51-4b20-bf93-8098644238d8
  event: BNTRS_Chapter3_Pascal_72
  text: '"Единица была свидетелем манипуляций, проводившихся над презренной воровкой в заточении, и выражает радость, что не весь объем Истинной плоти был утрачен ею".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единица была свидетелем манипуляций, проводившихся над презренной воровкой в заточении, и выражает радость, что не весь объем Истинной плоти был утрачен ею.
- guid: d26ef2f7-4d36-405d-bcdc-db536c6abd03
  event: BNTRS_Chapter3_Pascal_81
  text: '"Традиция ритуального пребывания в праздности, свойственная мирянам, признана фрустрирующей. Коэффициент полезности данной единицы падает. Фиксирую страдание".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Традиция ритуального пребывания в праздности, свойственная мирянам, признана фрустрирующей. Коэффициент полезности данной единицы падает. Фиксирую страдание.
- guid: 07d26c5e-5160-4cf8-9f51-483c901a3c4f
  event: BNTRS_Chapter3_Pascal_83
  text: '"Единица испытывает иррациональное чувство удовлетворения от смерти ксеноединицы Маражай. Природа феномена аномальна".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единица испытывает иррациональное чувство удовлетворения от смерти ксеноединицы Маражай. Природа феномена аномальна.
- guid: ea953831-9a83-4524-a67c-f87996958c27
  event: BNTRS_Chapter3_Pascal_95
  text: '"Новая единица чрезвычайно непредсказуема и опасна. Рекомендуется устранение во избежание предательства".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Новая единица чрезвычайно непредсказуема и опасна. Рекомендуется устранение во избежание предательства.
- guid: 7c5538f6-1e96-4559-8b44-ee19efa22852
  event: BNTRS_Chapter3_Pascal_98
  text: '"Функционирование данной единицы происходит на удовлетворительном уровне. Уровень сочувствия в коммуникационном посыле воровки... зафиксирован".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Функционирование данной единицы происходит на удовлетворительном уровне. Уровень сочувствия в коммуникационном посыле воровки... зафиксирован.
- guid: bc188a79-4f94-434e-a45e-f9b586a1988f
  event: BNTRS_Chapter3_Pascal_99
  text: '"Ксеновмешательство нарушило чистоту Истинной плоти, дарованной данной единице Омниссией. Ей предстоит долгая епитимья".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Ксеновмешательство нарушило чистоту Истинной плоти, дарованной данной единице Омниссией. Ей предстоит долгая епитимья.
- guid: b42abcfc-bbbe-4401-918a-481f53667e62
  event: BNTRS_Chapter4_Pascal_02
  text: '"Данная единица рассчитывает, что падение ксеносского судна не имело катастрофического характера. В этом случае на месте крушения могли остаться остатки, представляющие исследовательский интерес".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Данная единица рассчитывает, что падение ксеносского судна не имело катастрофического характера. В этом случае на месте крушения могли остаться остатки, представляющие исследовательский интерес.
- guid: 3c34058b-24d0-4b29-aeca-0ddb0471019a
  event: BNTRS_Chapter4_Pascal_11
  text: '"Замечание представителя убогого ксеновида, предпочитающего тактику беспорядочных атак куда попало и резни собственных союзников, не занесена в каталог ввиду низкой значимости".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Замечание представителя убогого ксеновида, предпочитающего тактику беспорядочных атак куда попало и резни собственных союзников, не занесена в каталог ввиду низкой значимости.
- guid: 20401a15-b4b2-477a-9b11-226f58e7c2a2
  event: BNTRS_Chapter4_Pascal_138
  text: '"Номос следует... изучить. Если единице ван Калоксу станет спокойнее, могу добавить, что изучение включает в себя и исследование методов умерщвления единицы Номос".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Номос следует... изучить. Если единице ван Калоксу станет спокойнее, могу добавить, что изучение включает в себя и исследование методов умерщвления единицы Номос.
- guid: 5ac694ae-6302-4378-a2f8-dcb430deb449
  event: BNTRS_Chapter4_Pascal_146
  text: '"Я призываю к спасению. Не совершайте ошибки своего наставника — не пытайтесь мне препятствовать. Лорд-инквизитор действовал издалека, у вас нет такой защиты".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я призываю к спасению. Не совершайте ошибки своего наставника — не пытайтесь мне препятствовать. Лорд-инквизитор действовал издалека, у вас нет такой защиты.
- guid: 5922ac35-1415-4b85-8acc-d95b1c3488c6
  event: BNTRS_Chapter4_Pascal_148
  text: '"Вопросы и сомнения более не мучат данную единицы. Фиксирую чистоту и цельность, хоть в местах, где отсечен был бунтующий дух, и остались шрамы".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Вопросы и сомнения более не мучат данную единицы. Фиксирую чистоту и цельность, хоть в местах, где отсечен был бунтующий дух, и остались шрамы.
- guid: a8f622b3-b990-4623-8d3e-f83473de7df7
  event: BNTRS_Chapter4_Pascal_151
  text: '"Полагаться на суждения других было ошибкой. Они лишь сдерживали мой потенциал. В одиночку я добьюсь большего! Прерывание не терпит сомнений!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Полагаться на суждения других было ошибкой. Они лишь сдерживали мой потенциал. В одиночку я добьюсь большего! Прерывание не терпит сомнений!
- guid: 7138dd7e-2ef6-4094-b4cb-61d35e8860f4
  event: BNTRS_Chapter4_Pascal_16
  text: '"Сколь чудовищен кощунственный износ, сколь высокий потенциал был утрачен. Фиксирую сигнал наивысшей скорби и обновляю ежедневные протоколы, занося в них рапсодильное моление на судьбу мира Ефрат-II".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Сколь чудовищен кощунственный износ, сколь высокий потенциал был утрачен. Фиксирую сигнал наивысшей скорби и обновляю ежедневные протоколы, занося в них рапсодильное моление на судьбу мира Ефрат-II.
- guid: 82b0141b-d647-49ef-9ae7-2381d7e465b4
  event: BNTRS_Chapter4_Pascal_161
  text: '"Сия печать чистоты, несущая бинарные шифры Деус Механикус, да послужит отметиной в честь победы над презренным Криком скверны. Да пребудет дух твоей брони в здравии и превозмогании".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Сия печать чистоты, несущая бинарные шифры Деус Механикус, да послужит отметиной в честь победы над презренным Криком скверны. Да пребудет дух твоей брони в здравии и превозмогании.
- guid: de9b2f9d-39ed-427c-b50e-9acd9ede0555
  event: BNTRS_Chapter4_Pascal_27
  text: '"Прогноз — значительное снижение человеческой массы приведет к падению эффективности верфи и товарообмена. Или... единица имела в виду что-то другое?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Прогноз — значительное снижение человеческой массы приведет к падению эффективности верфи и товарообмена. Или... единица имела в виду что-то другое?
- guid: 14e9f1ed-3b42-47ab-b4ed-48df82ee5570
  event: BNTRS_Chapter4_Pascal_42
  text: '"При всех достоинствах единицы трудно предположить, что его преемник будет менее эффективен на посту Вольного Торговца. Усопший демонстрировал высшее равнодушие к своим обязанностям".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: При всех достоинствах единицы трудно предположить, что его преемник будет менее эффективен на посту Вольного Торговца. Усопший демонстрировал высшее равнодушие к своим обязанностям.
- guid: 1c2a6ea0-5ab1-419e-b004-32a1caad8edc
  event: BNTRS_Chapter4_Pascal_52
  text: '"Я объявляю священные залы изысканий, оскверненные ксеносом Тервантьясом, подлежащими очистительной эрадикации. Кощунству, совершавшемуся в них, не должно быть постигнутым".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я объявляю священные залы изысканий, оскверненные ксеносом Тервантьясом, подлежащими очистительной эрадикации. Кощунству, совершавшемуся в них, не должно быть постигнутым.
- guid: a74b71a9-c8b1-41a5-961f-7a3485dc30ba
  event: BNTRS_Chapter4_Pascal_76
  text: '"Способность мирян делать далекоидущие выводы подвергнута сомнению. Футфол останется прежним".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Способность мирян делать далекоидущие выводы подвергнута сомнению. Футфол останется прежним.
- guid: 9eb4f6c2-3859-407e-85c8-38fac8c8692f
  event: BNTRS_Chapter5_Pascal_01
  text: '"Данный сектор полон древней ксеноскверны. Он не значится как исcледованный. Прогнозирую высокий потенциал разведки!"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Данный сектор полон древней ксеноскверны. Он не значится как исcледованный. Прогнозирую высокий потенциал разведки!
- guid: d8b0b3fb-f0d3-46ce-ba55-efaaa485c8c9
  event: BNTRS_Chapter5_Pascal_21
  text: '"Фиксирую статистическую иронию в факте того, что единицы, призванные для исполнения палаческих функций над адептами Прерывания Цикла были подвергнуты палаческому умерщвлению".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую статистическую иронию в факте того, что единицы, призванные для исполнения палаческих функций над адептами Прерывания Цикла были подвергнуты палаческому умерщвлению.
- guid: 1e939636-7039-4531-95bd-fd39e21baba6
  event: BNTRS_Companion_DLC3_Pascal_05
  text: '"Как главный технопровидец флагмана, я накладываю вето на любые процедуры священной аугментации, в которых задействованы субстанции ксенотического происхождения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Как главный технопровидец флагмана, я накладываю вето на любые процедуры священной аугментации, в которых задействованы субстанции ксенотического происхождения.
- guid: 48ec9bcf-7fc5-4ec9-a9ed-54850d1a17a1
  event: BNTRS_Companion_DLC3_Pascal_10
  text: '"Удивлен отсутствию использования присущих тебе примитивных эвристических методов. Уровень потенциальной опасности феномена пересмотрен в сторону повышения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Удивлен отсутствию использования присущих тебе примитивных эвристических методов. Уровень потенциальной опасности феномена пересмотрен в сторону повышения.
- guid: 0a5951a7-0d70-41b4-ab41-1cfe59333e1b
  event: BNTRS_Companion_DLC3_Pascal_106
  text: '"Открытое изучение артефактов ксенотического происхождения признается злонамеренным попранием границ инфогигиены. Настаиваю на немедленном изъятии всех образцов с последующей изоляцией в стазис-контейнерах".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Открытое изучение артефактов ксенотического происхождения признается злонамеренным попранием границ инфогигиены. Настаиваю на немедленном изъятии всех образцов с последующей изоляцией в стазис-контейнерах.
- guid: 7eb8743b-c362-4eb1-a764-fd243ec3f028
  event: BNTRS_Companion_DLC3_Pascal_117
  text: '"Я отвергаю праздные запросы и профанные инсинуации, изрекаемые генетором Фебрусом. Я чист перед Омниссией деяниями и помыслами. Можешь ли ты сказать то же про себя, манипулус?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я отвергаю праздные запросы и профанные инсинуации, изрекаемые генетором Фебрусом. Я чист перед Омниссией деяниями и помыслами. Можешь ли ты сказать то же про себя, манипулус?
- guid: dcbc1670-a261-4be1-b6ce-acd2da5849dc
  event: BNTRS_Companion_DLC3_Pascal_120
  text: '"Гипотетический акт заботы со стороны сервочерепа "Нунциус" засвидетельствован. Запрос на оперативное вмешательство категорически отвергается, поскольку оперируемый не готов претерпевать второй акт технокощунственных надругательств".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Гипотетический акт заботы со стороны сервочерепа "Нунциус" засвидетельствован. Запрос на оперативное вмешательство категорически отвергается, поскольку оперируемый не готов претерпевать второй акт технокощунственных надругательств.
- guid: 6c2e15be-65ac-4aca-bc91-096a03226132
  event: BNTRS_Companion_DLC3_Pascal_135
  text: '"Выражаю согласие, прискорбный паттерн нерациональной растраты потенциала и ресурсов действительно присущ Инквизиции. Также вношу ремарку — ценность некоторых знаний не оправдывает сопряженный с ними риск. Генетор Фебрус, ты знаешь это из первых рук".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Выражаю согласие, прискорбный паттерн нерациональной растраты потенциала и ресурсов действительно присущ Инквизиции. Также вношу ремарку — ценность некоторых знаний не оправдывает сопряженный с ними риск. Генетор Фебрус, ты знаешь это из первых рук.
- guid: 8ebee719-2fd8-4988-a2f5-390e0ca779a6
  event: BNTRS_Companion_DLC3_Pascal_27
  text: '"Генетор Фебрус, техноматы нескольких палуб рапортуют о спонтанных обесточиваниях малых систем корабля. Одновременно зарегистрирован приток Движущей Силы к твоей лаборатории. Как главный технопровидец судна, я запрашиваю разъяснений".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Генетор Фебрус, техноматы нескольких палуб рапортуют о спонтанных обесточиваниях малых систем корабля. Одновременно зарегистрирован приток Движущей Силы к твоей лаборатории. Как главный технопровидец судна, я запрашиваю разъяснений.
- guid: 7e90f667-fe6e-446a-a35d-759fbde03e14
  event: BNTRS_Companion_DLC3_Pascal_50
  text: '"Анализ ситуации произведен не корректно. Генетор Фебрус, ты не смог безоговорочно доказать свою позицию, пусть твои аргументы и создали мнимую видимость правоты. Я приостановил спор с целью агрегации информации, необходимой для искоренения твоих заблуждений".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Анализ ситуации произведен не корректно. Генетор Фебрус, ты не смог безоговорочно доказать свою позицию, пусть твои аргументы и создали мнимую видимость правоты. Я приостановил спор с целью агрегации информации, необходимой для искоренения твоих заблуждений.
- guid: d869f8f9-3e9b-48b8-90a6-c87adfa55da4
  event: BNTRS_DLC2_Pascal_123
  text: '"Поздравляю единицу Соломон с возвращением из дисфункции. Да будут обновлены протоколы служения, да не произойдет смены авторизованного владельца для тех-единицы Глейто".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Поздравляю единицу Соломон с возвращением из дисфункции. Да будут обновлены протоколы служения, да не произойдет смены авторизованного владельца для тех-единицы Глейто.
- guid: 38ea43fe-d36a-4cde-9349-4eb5317e9879
  event: BNTRS_DLC2_Pascal_158
  text: '"Связь между функционированием систем судна и контактом с органическими жидкостями существует только в воспаленном сознании мирянки".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Связь между функционированием систем судна и контактом с органическими жидкостями существует только в воспаленном сознании мирянки.
- guid: 3e694c85-a7a2-4ab1-acc5-ac26bfcd13b7
  event: BNTRS_DLC2_Pascal_167
  text: '"Запрашиваю разрешение на спасение ценных технологий из этого чрева энтропии и рассадника нарушений норм хранения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запрашиваю разрешение на спасение ценных технологий из этого чрева энтропии и рассадника нарушений норм хранения.
- guid: 12285796-a3d2-4676-b6d9-695d698affc3
  event: BNTRS_DLC2_Pascal_17
  text: '"Благословенные технологии, выкованные слугами Омниссии, есть величайший дар Адептус Арбитес и знак функционального союза между нами".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Благословенные технологии, выкованные слугами Омниссии, есть величайший дар Адептус Арбитес и знак функционального союза между нами.
- guid: 6d936545-8dfb-4300-9af1-d9790a091327
  event: BNTRS_DLC2_Pascal_172
  text: '"Фиксирую нарушение нормативов взаимодействия с объектами, категоризированными как "имперская десятина, взысканное"".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую нарушение нормативов взаимодействия с объектами, категоризированными как "имперская десятина, взысканное".
- guid: 092c95d0-a9c7-4e24-af6e-9a3589c5937d
  event: BNTRS_DLC2_Pascal_183
  text: '"Регистрирую неизвестные модификации мельта-орудия. Настаиваю на реквизировании объекта для установления допустимости спецификаций".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Регистрирую неизвестные модификации мельта-орудия. Настаиваю на реквизировании объекта для установления допустимости спецификаций.
- guid: c91109b8-8fa1-4cdb-88ef-8a8729e17375
  event: BNTRS_DLC2_Pascal_200
  text: '"Прогноз лояльности единицы Соломон подтвержден, повышаю ее приоритет. Инициирую обмен рукопожатием для завершения авторизации в более высоком статусе".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Прогноз лояльности единицы Соломон подтвержден, повышаю ее приоритет. Инициирую обмен рукопожатием для завершения авторизации в более высоком статусе.
- guid: 32912b59-cae1-4ce2-ac5b-b901e07c9243
  event: BNTRS_DLC2_Pascal_209
  text: '"Единица Кубис Дельфим признана ответственной за осквернение Кьявы Гамма. Скверна богохульной модификации низвергнула в мерзость еретеха множество невинных механизмов. Произошедшее признаю трагедией".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Единица Кубис Дельфим признана ответственной за осквернение Кьявы Гамма. Скверна богохульной модификации низвергнула в мерзость еретеха множество невинных механизмов. Произошедшее признаю трагедией.
- guid: 7e9b7df3-0860-4f05-a7b6-48c1ae99c128
  event: BNTRS_DLC2_Pascal_239
  text: '"Фиксирую хирургические вмешательства в тех-единицу Глейто с целью модификации. Выражаю максимальный уровень негодования и скорблю о машинной чистоте тех-единицы".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую хирургические вмешательства в тех-единицу Глейто с целью модификации. Выражаю максимальный уровень негодования и скорблю о машинной чистоте тех-единицы.
- guid: f3e865aa-491a-4be2-9f79-74f26e48e8bc
  event: BNTRS_DLC2_Pascal_260
  text: '"Я стал чем-то слишком большим и страшным, чтобы ты мог это представить. Но это не значит, что ты был обманут. Моя личность жива, как и мои симпатии к Глейто. И не только к нему".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я стал чем-то слишком большим и страшным, чтобы ты мог это представить. Но это не значит, что ты был обманут. Моя личность жива, как и мои симпатии к Глейто. И не только к нему.
- guid: 7a820a0d-2274-44ea-b878-34ba8584ca07
  event: BNTRS_DLC2_Pascal_36
  text: '"Запрос о свершении подношения принят. Запрашиваю вербальный обмен информацией — тема: достоинства тех-единицы Глейто относительно менее благословенных единиц".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: 'Запрос о свершении подношения принят. Запрашиваю вербальный обмен информацией — тема: достоинства тех-единицы Глейто относительно менее благословенных единиц.'
