  - speaker: Pasqal Haneumann
    text_clean: Благодарю, информация принята. Я подвергну ее анализу и предприму дополнительные меры обеспечения безопасности.
- guid: b344e284-dcf2-4778-bba5-b03aaf7ae15b
  event: Companions_Techpriest_57
  text: '"Служить Омниссии. Наш жизненный Цикл слишком долго подвергался износу, и я инициирую его обновление. Это будет временем великого страдания и великих жертв, но так велит анализ. Флот Осознание готов нести благую весть в Империум".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Служить Омниссии. Наш жизненный Цикл слишком долго подвергался износу, и я инициирую его обновление. Это будет временем великого страдания и великих жертв, но так велит анализ. Флот Осознание готов нести благую весть в Империум.
- guid: 9fb1acbb-b479-4392-bf92-ed15c7a8ac3a
  event: Companions_Techpriest_58
  text: '"Это стоило всего". {n}Мессия Прерывания смотрит на свои ладони, на которых пляшут искры разрушительной зеленой энергии.{/n} "Величайшая честь — быть тем, кому Омниссия послал свой дар. Величайшая ересь — отвергнуть его и дать ему кануть в забвение".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это стоило всего.
  - speaker: narrator
    text_clean: Мессия Прерывания смотрит на свои ладони, на которых пляшут искры разрушительной зеленой энергии.
  - speaker: Pasqal Haneumann
    text_clean: Величайшая честь — быть тем, кому Омниссия послал свой дар. Величайшая ересь — отвергнуть его и дать ему кануть в забвение.
- guid: e4ba3d1a-290c-475a-9944-da5f3e938128
  event: Companions_Techpriest_59
  text: '"Думаю, ты и сам{mf||а} видишь, что ничто не было случайностью. И особенно — наша встреча. Поступи я иначе, упрости свое мышление — кто знает, в какой момент нить возможного свернула бы в темные пространства нежеланного?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Думаю, ты и сам видишь, что ничто не было случайностью. И особенно — наша встреча. Поступи я иначе, упрости свое мышление — кто знает, в какой момент нить возможного свернула бы в темные пространства нежеланного?
- guid: c56b051b-2c1c-407c-b706-8bb1b4c4096e
  event: Companions_Techpriest_60
  text: '"Если бы я мог показать тебе паутину причин и следствий, пронизывающую мир, ты бы понял{mf||а}. Эти нити столь многочисленны и плотно переплетены, что заставляют саму реальность вокруг нас иметь плотность, и анализ их — поистине хитроумный процесс. В великой медитации мне открылась статистическая вероятность, ведшая к этому моменту, и я последовал за ней. Как видишь, она сработала".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Если бы я мог показать тебе паутину причин и следствий, пронизывающую мир, ты бы понял. Эти нити столь многочисленны и плотно переплетены, что заставляют саму реальность вокруг нас иметь плотность, и анализ их — поистине хитроумный процесс. В великой медитации мне открылась статистическая вероятность, ведшая к этому моменту, и я последовал за ней. Как видишь, она сработала.
- guid: 6b158702-4654-4435-8bf9-eb6ecc240646
  event: Companions_Techpriest_61
  text: '"Суждение о них было верным. Незнание было исправлено, чистота и верность стали абсолютными. Недоверчивый Кастэс даровал нам свой Скепсис, говорящий с духами Ликут — не знающую сомнений Веру. Логика и Паранойя не имели имен в прошлой жизни, но разумы их остры и уникальны".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Суждение о них было верным. Незнание было исправлено, чистота и верность стали абсолютными. Недоверчивый Кастэс даровал нам свой Скепсис, говорящий с духами Ликут — не знающую сомнений Веру. Логика и Паранойя не имели имен в прошлой жизни, но разумы их остры и уникальны.
- guid: 89e557ea-189e-4c2e-b514-523a79e62f22
  event: Companions_Techpriest_62
  text: '"Авель же... Для него было великой радостью окончание нашего плена в изоляции. Теперь речь Фантазии вновь открыта нам и льется свободно".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Авель же... Для него было великой радостью окончание нашего плена в изоляции. Теперь речь Фантазии вновь открыта нам и льется свободно.
- guid: f18a57ef-f358-4e80-a432-1598f0ce2e0f
  event: Companions_Techpriest_63
  text: '"Я прибыл по зову моего наставника, благословенного {g|Encyclopedia:Archmagos}архимагоса{/g} Амарната. На Райкаде Минорис мы должны были встретиться и обсудить мою миссию".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я прибыл по зову моего наставника, благословенного архимагоса Амарната. На Райкаде Минорис мы должны были встретиться и обсудить мою миссию.
- guid: 5ed1e546-1afb-4e2d-be9e-243c8373c25c
  event: Companions_Techpriest_64
  text: '"Утверждение... честно. Коллектив Амарнат был ошибкой. Моей ошибкой. Я исправил ее, похоронив пять шестых себя во тьме небытия. Хвала Омниссии".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение... честно. Коллектив Амарнат был ошибкой. Моей ошибкой. Я исправил ее, похоронив пять шестых себя во тьме небытия. Хвала Омниссии.
- guid: af3b039e-4a0c-47e2-a26c-585f466b60fa
  event: Companions_Techpriest_65
  text: '"Он смирился и погрузился в глубины своего разума. Алгоритм Реставрации более не властен над ним, и Авелю не интересно общение с кем-либо. Я исключил его из процедур священного обслуживания, кроме тех, в которых он сам пожелает принять участие".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он смирился и погрузился в глубины своего разума. Алгоритм Реставрации более не властен над ним, и Авелю не интересно общение с кем-либо. Я исключил его из процедур священного обслуживания, кроме тех, в которых он сам пожелает принять участие.
- guid: 86de0144-bdf4-439f-9e94-ef3dd48be5e9
  event: Companions_Techpriest_66
  text: '"Закончили". {n}Эхо из вокса звучит задумчиво и печально, словно мыслями Паскаль где-то далеко.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Закончили.
  - speaker: narrator
    text_clean: Эхо из вокса звучит задумчиво и печально, словно мыслями Паскаль где-то далеко.
- guid: 64f2dc09-dc35-4e33-9fc7-ff8068a6f91d
  event: Companions_Techpriest_67
  text: '"Он смирился и ушел в глубины разума. Ему всегда было неуютно коммуницировать с другими, и теперь, свободный от ярма алгоритма Реставрации, он полностью прекратил контакты с живущими. Мы ему не интересны".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он смирился и ушел в глубины разума. Ему всегда было неуютно коммуницировать с другими, и теперь, свободный от ярма алгоритма Реставрации, он полностью прекратил контакты с живущими. Мы ему не интересны.
- guid: 4c35f8aa-557b-4d79-9f01-2f72c33963e1
  event: Companions_Techpriest_68
  text: '"Я отвергаю установки предшественников. Я буду самостоятельно определять, что угодно Омниссии, а что является ересью против него".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я отвергаю установки предшественников. Я буду самостоятельно определять, что угодно Омниссии, а что является ересью против него.
- guid: bda0955e-7196-482f-922a-0dcf195be74c
  event: Companions_Techpriest_69
  text: '"Клетка цифровых обетов сломана, а разуму, свободному в суждении, не может быть ведом страх".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Клетка цифровых обетов сломана, а разуму, свободному в суждении, не может быть ведом страх.
- guid: 749fd36d-281b-4e74-bb93-5734e17063af
  event: Companions_Techpriest_70
  text: '"Всякое деяние мое прославляет Бога-Машину".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Всякое деяние мое прославляет Бога-Машину.
- guid: 04512315-944d-4d91-b4a0-b41d456338eb
  event: Companions_Techpriest_71
  text: '"Утверждение ложно. Все только начинается, {name}".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение ложно. Все только начинается, КЭП.
- guid: d7d51be5-6a2a-433d-8e80-973c3b293230
  event: Companions_Techpriest_72
  text: '"Но сначала я завершу свои обязательства перед тобой. Когда твои враги будут повержены, я оставлю тебя, но не раньше. Так рассудил мой компонент, носивший прежде имя Паскаль".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Но сначала я завершу свои обязательства перед тобой. Когда твои враги будут повержены, я оставлю тебя, но не раньше. Так рассудил мой компонент, носивший прежде имя Паскаль.
- guid: f41dbdd1-f9e7-4e27-af26-66b31e0900ec
  event: Companions_Techpriest_73
  text: '"Органика — несовершенное подобие машины, изменчивое и уязвимое. Металл стабильнее, эффективнее и долговечнее. Плотьяз ущербен в сравнении с бинарным языком. В мясе живет слабость — из-за него дряхлеет разум и ослабевает дисциплина, изношенный же металл просто заменяется. К тому же, машина — более высокая форма Знания, и, придавая себе механическую форму, мы становимся ближе к Омниссии".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Органика — несовершенное подобие машины, изменчивое и уязвимое. Металл стабильнее, эффективнее и долговечнее. Плотьяз ущербен в сравнении с бинарным языком. В мясе живет слабость — из-за него дряхлеет разум и ослабевает дисциплина, изношенный же металл просто заменяется. К тому же, машина — более высокая форма Знания, и, придавая себе механическую форму, мы становимся ближе к Омниссии.
- guid: 027429cb-480f-4914-9c0e-ae0ddbbcc91c
  event: Companions_Techpriest_74
  text: '"Страшился ли я? Да. Тоскую ли я о прошлом и смертных мыслях? Да. Самозаклание во славу божества и должно быть мучительно, ведь без боли невозможен катарсис, без жертвы не истинен апофеоз. Прости, я хотел бы ответить проще, но это можно лишь постичь самому".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Страшился ли я? Да. Тоскую ли я о прошлом и смертных мыслях? Да. Самозаклание во славу божества и должно быть мучительно, ведь без боли невозможен катарсис, без жертвы не истинен апофеоз. Прости, я хотел бы ответить проще, но это можно лишь постичь самому.
- guid: d17713be-3e03-416a-8f30-493316a2d595
  event: Companions_Techpriest_75
  text: '"Найти разум, способный заменить Авеля, было сложнее всего. Но на нижних палубах "Герметико" отыскалась девушка, чья Фантазия завершила Коллектив. Ее звали... Ты оценишь прихотливость судьбы. Ее звали Нихель".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Найти разум, способный заменить Авеля, было сложнее всего. Но на нижних палубах "Герметико" отыскалась девушка, чья Фантазия завершила Коллектив. Ее звали... Ты оценишь прихотливость судьбы. Ее звали Нихель.
- guid: 640d16e5-90d2-40b6-8d7e-19998eced04e
  event: Companions_Techpriest_76
  text: '"Амарнат не стоит жалости. Данный проект был ущербен на уровне базовых установок. Зараза сомнений и демагогии развратила его".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Амарнат не стоит жалости. Данный проект был ущербен на уровне базовых установок. Зараза сомнений и демагогии развратила его.
- guid: 83ac2428-eac0-4a25-b80e-9126b9a0cf06
  event: Companions_Techpriest_77
  text: '"Свобода моих новых взглядов тревожит тебя? Или ты опасаешься мести моих бывших техносоратников?"'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Свобода моих новых взглядов тревожит тебя? Или ты опасаешься мести моих бывших техносоратников?
- guid: 0fd19412-2cfc-42c4-b899-eb1670c82b83
  event: Companions_Techpriest_78
  text: '"Да будет так. Я изменю вселенную в одиночку. Прощай".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Да будет так. Я изменю вселенную в одиночку. Прощай.
- guid: 88d6dfff-d36a-41e6-a81a-0e9533b6c2d3
  event: Companions_Techpriest_79
  text: '"Решение предсказуемо. Моя лояльность была скомпрометирована".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Решение предсказуемо. Моя лояльность была скомпрометирована.
- guid: 2d989b09-5dce-4b51-8305-8d5a15cdd8f8
  event: Companions_Techpriest_80
  text: '"Утверждение истинно. Единица Паскаль Ханейманн завершает служение. Прощайте".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение истинно. Единица Паскаль Ханейманн завершает служение. Прощайте.
- guid: 2e1873fa-0d8c-450b-b1af-13774c2db170
  event: Companions_Techpriest_81
  text: '"Прежде тебя не пугали чудовища, {name}".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Прежде тебя не пугали чудовища, КЭП.
- guid: ceb223b8-95ad-40de-af81-21710b6e329e
  event: Companions_Techpriest_82
  text: '"Как пожелаешь. Возможно, векторы нашего движения однажды совпадут вновь. Прощай".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Как пожелаешь. Возможно, векторы нашего движения однажды совпадут вновь. Прощай.
- guid: eec74eb1-12e3-46aa-b632-04b8d4b0e1f8
  event: Companions_Techpriest_83
  text: '"Право лицезреть чудо пресуществления плоти в священный металл доступно лишь взошедшим на ступень инициата. Однако твой высокий статус {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} позволяет мне сделать частичное исключение и продемонстрировать свои священные стигматы".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Право лицезреть чудо пресуществления плоти в священный металл доступно лишь взошедшим на ступень инициата. Однако твой высокий статус Вольного Торговца позволяет мне сделать частичное исключение и продемонстрировать свои священные стигматы.
- guid: 58d3bc5f-2886-4387-98aa-8833cca596c2
  event: Companions_Techpriest_84
  text: '{n}Мехадендриты кольцами обвивают плечи и грудь техножреца, словно стремятся защитить.{/n} "Запрос одобрен. Я действительно скрыл некоторую информацию. Я был учеником {g|Encyclopedia:Archmagos}архимагоса{/g} Амарната, однако совершил акт его предательства после того, как он отступился от священных догматов".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Мехадендриты кольцами обвивают плечи и грудь техножреца, словно стремятся защитить.
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен. Я действительно скрыл некоторую информацию. Я был учеником архимагоса Амарната, однако совершил акт его предательства после того, как он отступился от священных догматов.
- guid: 64b44378-99f4-4add-8e59-c69b61c3cb1a
  event: Companions_Techpriest_85
  text: '{n}Уставившись на вас непроницаемым взглядом, Паскаль тихо произносит:{/n} "Я его уничтожил".'
  speaker: Pasqal Haneumann
  parts:
