  event: Companions_Techpriest_139
  text: '"Обнаруженные данные не поддаются прочтению. Они зашифрованы, но лишь частично, и я выдвигаю гипотезу, что херетек Деменц занимался их дешифровкой. Я приложу все усилия, чтобы извлечь больший объем данных. Информация, указывающая на единицу, определяемую как "увечный охотник", предположительно обладает критической значимостью".'
