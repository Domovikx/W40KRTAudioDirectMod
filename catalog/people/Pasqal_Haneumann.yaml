  text: '{n}Задумчивость, прежде посещавшая лица Паскаля, уступила место целеустремленной решимости.{/n} "{name}, благодарю тебя за помощь в {d|Encyclopedia:CompPasqal_Ego}разрешении вопроса{/d} о существовании Коллектива Амарнат. Я этого не забуду".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Задумчивость, прежде посещавшая лица Паскаля, уступила место целеустремленной решимости.
  - speaker: Pasqal Haneumann
    text_clean: КЭП, благодарю тебя за помощь в разрешении вопроса о существовании Коллектива Амарнат. Я этого не забуду.
- guid: 6eaef74f-17f9-405d-b33e-29fe337f0074
  event: Companions_Techpriest_37
  text: '"Он — божественный механизм, творец технологии. Вселенная сотворена механистичной, потому Омниссия властвует над ней. Знание — высшая форма, в которой он проявляется в мире... пока что. Однажды он воплотится в мире в абсолютной полноте своего величия".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он — божественный механизм, творец технологии. Вселенная сотворена механистичной, потому Омниссия властвует над ней. Знание — высшая форма, в которой он проявляется в мире... пока что. Однажды он воплотится в мире в абсолютной полноте своего величия.
- guid: 434ba2de-8b8b-4491-93db-17cd1469d9b3
  event: Companions_Techpriest_38
  text: '"От кредо, но не от Омниссии. Древние нормы устарели, броня стала тюрьмой. Катехизисы были написаны рукой смертных, а значит, во имя Деус Механикус, они могут быть отредактированы рукой смертного".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: От кредо, но не от Омниссии. Древние нормы устарели, броня стала тюрьмой. Катехизисы были написаны рукой смертных, а значит, во имя Деус Механикус, они могут быть отредактированы рукой смертного.
- guid: 90516811-f692-4e5a-82c9-9c2c04c02706
  event: Companions_Techpriest_39
  text: '"Форму запретов, установленных неведомыми старцами. Форму дерзновения, с которым эти запреты нарушаются. Форму следования догме или раскола. Форму следования Циклу и прерывания Цикла. В системе, имеющей два пути действия, схизма неизбежна. И лишь один из путей окажется верен, потому что истина дискретно отделена от не-истины". {n}Визор Паскаля будто проницает вас своим свечением.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Форму запретов, установленных неведомыми старцами. Форму дерзновения, с которым эти запреты нарушаются. Форму следования догме или раскола. Форму следования Циклу и прерывания Цикла. В системе, имеющей два пути действия, схизма неизбежна. И лишь один из путей окажется верен, потому что истина дискретно отделена от не-истины.
  - speaker: narrator
    text_clean: Визор Паскаля будто проницает вас своим свечением.
- guid: 1a94f6cd-d265-4705-bb34-393a0e674162
  event: Companions_Techpriest_40
  text: '"Амарнат не отрицал ни один конкретный запрет, но их кумулятивный эффект находил гнетущим. Комплекс жестких ограничений сузил пространство познания до закольцованной колеи, в которой разум обречен. И этот цикл повторений должен был быть разрушен. Потому его назвали Мессией Прерывания".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Амарнат не отрицал ни один конкретный запрет, но их кумулятивный эффект находил гнетущим. Комплекс жестких ограничений сузил пространство познания до закольцованной колеи, в которой разум обречен. И этот цикл повторений должен был быть разрушен. Потому его назвали Мессией Прерывания.
- guid: d9a054a0-1c7e-4221-8f57-1cf3e7c84cc0
  event: Companions_Techpriest_41
  text: '"Действовать. Амарнат определил проблему стагнации, но не решился на свершение перемен. Их свершу я. Один". {n}Дерзкая бодрость Паскаля отразилась и в движении мехадендритов, обретших грацию хищных змей.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Действовать. Амарнат определил проблему стагнации, но не решился на свершение перемен. Их свершу я. Один.
  - speaker: narrator
    text_clean: Дерзкая бодрость Паскаля отразилась и в движении мехадендритов, обретших грацию хищных змей.
- guid: 0737c501-369e-4c0e-876f-60fab4651335
  event: Companions_Techpriest_42
  text: '"При изучении разумов технобратьев Авеля, Тарзуса и Деменца я обнаружил аномальное сходство в том, согласно каким паттернам повреждена их память. То, что я считал следствием когнитивных особенностей, синаптических повреждений и искажения мусорным кодом, может быть результатом иного влияния. Фрагменты не поддающихся дешифровке данных в их массивах памяти загадочно... симметричны".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: При изучении разумов технобратьев Авеля, Тарзуса и Деменца я обнаружил аномальное сходство в том, согласно каким паттернам повреждена их память. То, что я считал следствием когнитивных особенностей, синаптических повреждений и искажения мусорным кодом, может быть результатом иного влияния. Фрагменты не поддающихся дешифровке данных в их массивах памяти загадочно... симметричны.
- guid: 25d37c99-2f39-4b5d-a1ba-c77c15628148
  event: Companions_Techpriest_43
  text: '"Но не все, что опасно, есть зло. Немногие осмелятся открыто заявить это, но часть наших знаний была обретена из скверных источников. Изучая творения ксеносов, мы постигали секреты мироздания, до которых они догадались, а мы — нет. Созерцая ересь, мы изобретали технологические решения по истреблению ее. Черпая из отравленного источника, мы проводили знание через фильтры и обретали Понимание".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Но не все, что опасно, есть зло. Немногие осмелятся открыто заявить это, но часть наших знаний была обретена из скверных источников. Изучая творения ксеносов, мы постигали секреты мироздания, до которых они догадались, а мы — нет. Созерцая ересь, мы изобретали технологические решения по истреблению ее. Черпая из отравленного источника, мы проводили знание через фильтры и обретали Понимание.
