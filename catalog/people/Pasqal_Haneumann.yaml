  event: Companions_Techpriest_49
  text: '"Стратегическая рекомендация: анализ показал, что сообщество нелюдей разобщено конфликтами. Манипуляция разногласиями ксеносов может привести к обретению временных союзников, обладающих техническими средствами для возвращения единицы {name} фон Валанциус в пространство реальности".'
