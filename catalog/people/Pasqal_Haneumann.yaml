    text_clean: Эхо варпа. Энергии Имматериума, просочившиеся в реальность и принявшие форму вокс-сигнала. Я обнаружил в архиве задокументированные случаи порчи, протекавшей сходным образом. Слушать пустоту — опасное ремесло.
