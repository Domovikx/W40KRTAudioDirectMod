    text_clean: Плоть непостоянна, но металл крепок, как моя преданность.
- guid: 677a1b97-b0c8-440a-839c-6071078a4ed5
  event: Companions_Techpriest_107
  text: '{n}Вокс-система издает болезненный треск, словно от ломающихся и перемалываемых костей.{/n} "Я молюсь, чтобы {g|Encyclopedia:Omnissiah}Омниссия{/g} дал нам мудрость искоренить разделившие нас диалектические заблуждения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Вокс-система издает болезненный треск, словно от ломающихся и перемалываемых костей.
  - speaker: Pasqal Haneumann
    text_clean: Я молюсь, чтобы Омниссия дал нам мудрость искоренить разделившие нас диалектические заблуждения.
- guid: b2497b1f-31e8-422f-bfd3-31d367b7bbc9
  event: Companions_Techpriest_108
  text: '"Он не отступался от веры в Омниссию. Он отступился от императивов древних. Но мудрость благословенного Амарната была столь очевидна, что заставляла многих усомниться в догматах вслед за ним". {n}Голос {g|Encyclopedia:Vox}вокс{/g}-системы наполняется разрозненными статическими шумами, перекрывающими речь техножреца.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он не отступался от веры в Омниссию. Он отступился от императивов древних. Но мудрость благословенного Амарната была столь очевидна, что заставляла многих усомниться в догматах вслед за ним.
  - speaker: narrator
    text_clean: Голос вокс-системы наполняется разрозненными статическими шумами, перекрывающими речь техножреца.
- guid: ae37947a-75c1-45e1-9006-d05388309635
  event: Companions_Techpriest_109
  text: '{n}Паскаль обнажает запястье. Под бледной, забывшей вкус солнца кожей переливаются зеленоватые светящиеся нити электрической татуировки.{/n} "Эта электу свидетельствует, что я являюсь {g|Encyclopedia:Magos}магосом{/g}, допущенным к таинствам многих сфер знания и имеющим право проводить служение в соборе-кузне".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль обнажает запястье. Под бледной, забывшей вкус солнца кожей переливаются зеленоватые светящиеся нити электрической татуировки.
  - speaker: Pasqal Haneumann
    text_clean: Эта электу свидетельствует, что я являюсь магосом, допущенным к таинствам многих сфер знания и имеющим право проводить служение в соборе-кузне.
- guid: b3b5f95f-7b44-4440-976e-4504f0285013
  event: Companions_Techpriest_11
  text: '"Лишь в Омниссию, что знает все и постигает все. В попытке приблизиться к нему я также готов постигать все, дабы познать все. Деус Механикус даровал нам один священный завет — Познание, все же прочие — рукотворные творения смертных".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Лишь в Омниссию, что знает все и постигает все. В попытке приблизиться к нему я также готов постигать все, дабы познать все. Деус Механикус даровал нам один священный завет — Познание, все же прочие — рукотворные творения смертных.
- guid: ea9bbfc3-6fe4-49bd-8a8c-855ca5ddd3d2
  event: Companions_Techpriest_110
  text: '"Даже те, кто взошел к мудрости Омниссии, продолжают нести в себе зерно несовершенства, рождаемое плотью. Но амбиции отдельно взятых индивидов малозначимы, когда дискуссия идет о вере и ритуале. Знание божественно, и всякий спор о том, как надлежит прикасаться к нему — это спор духа и веры".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Даже те, кто взошел к мудрости Омниссии, продолжают нести в себе зерно несовершенства, рождаемое плотью. Но амбиции отдельно взятых индивидов малозначимы, когда дискуссия идет о вере и ритуале. Знание божественно, и всякий спор о том, как надлежит прикасаться к нему — это спор духа и веры.
- guid: 2c833965-186f-4354-aea5-e374030976e3
  event: Companions_Techpriest_111
  text: '"Запрос одобрен. Тебе, посвященн{mf|ый брат|ая сестра}, я могу продемонстрировать свои священные стигматы".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен. Тебе, посвященный брат, я могу продемонстрировать свои священные стигматы.
- guid: ae55706a-0ab4-4620-a664-73cb9f84a10c
  event: Companions_Techpriest_112
  text: '"Более пессимистичный прогноз гласит, что флот Осознание погряз в мраке схизмы и в данный момент пребывает в агонии праведного самоочищения от греха".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Более пессимистичный прогноз гласит, что флот Осознание погряз в мраке схизмы и в данный момент пребывает в агонии праведного самоочищения от греха.
- guid: 7c75cadb-7701-4a22-af31-ae0d4bcd8932
  event: Companions_Techpriest_113
  text: '"Мой наставник выдвинул тезис, что мы впали в стагнацию. Что Ритуал стал клеткой душ, ложным почитанием {g|Encyclopedia:Omnissiah}Омниссии{/g}. Он желал прервать цикл бездумного повторения, так как видел в конце его неизменную гибель нашей веры и всего Человечества".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Мой наставник выдвинул тезис, что мы впали в стагнацию. Что Ритуал стал клеткой душ, ложным почитанием Омниссии. Он желал прервать цикл бездумного повторения, так как видел в конце его неизменную гибель нашей веры и всего Человечества.
- guid: b81018e0-1eab-40e6-8416-dee4abc807b5
  event: Companions_Techpriest_114
  text: '"В коммуникативном каталоге данное утверждение значится, как шутка, однако мне не до конца ясен ее смысл. Я нуждаюсь в уточняющей информации".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: В коммуникативном каталоге данное утверждение значится, как шутка, однако мне не до конца ясен ее смысл. Я нуждаюсь в уточняющей информации.
- guid: 995b04b7-b1dd-4b05-9e13-47f4038d6b71
  event: Companions_Techpriest_116
  text: '"Это утверждение истинно".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это утверждение истинно.
- guid: f0e83798-496c-4309-814e-a63bee7792a0
  event: Companions_Techpriest_117
  text: '"Утверждение истинно. Алгоритмические нарушения были зафиксированы, вследствие чего я дважды совершил причащение когитаторов корректирующими цифровыми обетами и исключил вероятность саботажа. Гипотеза — нарушение является следствием недовольства духов машин сего судна. Рекомендую провести процедуру ублажения почтенных духов во славу Омниссии и посланных Им ангелов стальных".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение истинно. Алгоритмические нарушения были зафиксированы, вследствие чего я дважды совершил причащение когитаторов корректирующими цифровыми обетами и исключил вероятность саботажа. Гипотеза — нарушение является следствием недовольства духов машин сего судна. Рекомендую провести процедуру ублажения почтенных духов во славу Омниссии и посланных Им ангелов стальных.
- guid: 7a297f82-f6dc-415e-ab8d-96b566edb16c
  event: Companions_Techpriest_118
  text: '"Я покаялся и передал в руки конклава информацию о разработках моего учителя. Смелых и анафематических исследованиях в запретных областях знания. С этими данными конклав мог призвать {g|Encyclopedia:Archmagos}архимагоса{/g} Амарната на суд и под страхом экскоммьюникато трайторис принудить к покаянию. Дальнейшая его судьба мне неизвестна".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я покаялся и передал в руки конклава информацию о разработках моего учителя. Смелых и анафематических исследованиях в запретных областях знания. С этими данными конклав мог призвать архимагоса Амарната на суд и под страхом экскоммьюникато трайторис принудить к покаянию. Дальнейшая его судьба мне неизвестна.
- guid: cd38040c-eb4d-4173-9482-9c3a1bba089e
  event: Companions_Techpriest_119
  text: '"Это суждение истинно. Однако я пошел на данный шаг из преданности к своему наставнику. Отринув осторожность, он вел нас к богохульной войне, в которой сам стал бы первой и главной жертвой. Я не желал становиться свидетелем его гибели и попытался принудить его к покорности".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это суждение истинно. Однако я пошел на данный шаг из преданности к своему наставнику. Отринув осторожность, он вел нас к богохульной войне, в которой сам стал бы первой и главной жертвой. Я не желал становиться свидетелем его гибели и попытался принудить его к покорности.
- guid: a1989076-1bde-44cc-8c70-0650e11d4328
  event: Companions_Techpriest_12
  text: '"Я не знал его, но мне кажется, он был достойным человеком. Девиз, звучавший из его уст, указывает, что он контактировал с моим наставником. Я сохранил его кортикальный имплант и поглотил информацию, хранившуюся в нем. Однако большие массивы памяти зашифрованы неизвестным мне кодом".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я не знал его, но мне кажется, он был достойным человеком. Девиз, звучавший из его уст, указывает, что он контактировал с моим наставником. Я сохранил его кортикальный имплант и поглотил информацию, хранившуюся в нем. Однако большие массивы памяти зашифрованы неизвестным мне кодом.
- guid: da4e118d-ec41-4d76-8591-debf450e0da2
  event: Companions_Techpriest_120
  text: '"Пока что я не смог добиться ответа, зачем Авель вызвал меня на Райкад Минорис, а также в каких отношениях он находится с благословенным Амарнатом и почему носит то же имя, что и я. Возможно, не все известные ему сведения почтенный Авель может в полной мере осознать и интерпретировать".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Пока что я не смог добиться ответа, зачем Авель вызвал меня на Райкад Минорис, а также в каких отношениях он находится с благословенным Амарнатом и почему носит то же имя, что и я. Возможно, не все известные ему сведения почтенный Авель может в полной мере осознать и интерпретировать.
- guid: d92736fe-293e-4d14-90f0-8dabbe22c2e3
  event: Companions_Techpriest_121
  text: '"Я желал вернуться к наставнику и разделить с ним его судьбу, но конклав признал меня раскаявшимся, после чего направил на станцию Алтарь-Темплум-Каликсис-Экс-17, где я должен был искупать прежние заблуждения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я желал вернуться к наставнику и разделить с ним его судьбу, но конклав признал меня раскаявшимся, после чего направил на станцию Алтарь-Темплум-Каликсис-Экс-17, где я должен был искупать прежние заблуждения.
- guid: 9af81c71-5494-4d59-87d1-fd876b35e996
  event: Companions_Techpriest_122
  text: '"Однако, как и все сакральное, наши {g|Encyclopedia:Augmentation}аугментации{/g} не должны быть опорочены взглядами профанов. Потому мы оставляем лишь самые грубые образцы на обозрении, в то время как более священные механизмы скрываются под нашими алыми робами".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Однако, как и все сакральное, наши аугментации не должны быть опорочены взглядами профанов. Потому мы оставляем лишь самые грубые образцы на обозрении, в то время как более священные механизмы скрываются под нашими алыми робами.
- guid: 8a954c86-6f0d-4e36-9da0-2a549988502b
  event: Companions_Techpriest_123
  text: '"Все, на чем лежит благословенная печать технологии, происходит из-под наших рук, и мы же следим, чтобы ритуалы эксплуатации соблюдались безукоризненно. Мы повсюду, мы — арматура Империума, скованная Марсом".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Все, на чем лежит благословенная печать технологии, происходит из-под наших рук, и мы же следим, чтобы ритуалы эксплуатации соблюдались безукоризненно. Мы повсюду, мы — арматура Империума, скованная Марсом.
- guid: bd846a3b-0469-44e9-91b0-5b11a08923da
  event: Companions_Techpriest_124
  text: '"Это утверждение ложно. Нашим братством движут предписания священного катехизиса. Личные амбиции иерархов не влияют на чистоту и безупречность их служения... Но перемены действительно страшат их. Им неведомо, как поступить, если Омниссия откроет им новые истины, и оттого они боятся утратить контроль".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это утверждение ложно. Нашим братством движут предписания священного катехизиса. Личные амбиции иерархов не влияют на чистоту и безупречность их служения... Но перемены действительно страшат их. Им неведомо, как поступить, если Омниссия откроет им новые истины, и оттого они боятся утратить контроль.
- guid: b0682038-e333-4d39-995b-aee6fcc077b7
  event: Companions_Techpriest_125
  text: '"Это утверждение истинно. То, что многие считают оковами на пути нашего постижения, является нашей броней, унаследованной от благословленных мудростью предтеч".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это утверждение истинно. То, что многие считают оковами на пути нашего постижения, является нашей броней, унаследованной от благословленных мудростью предтеч.
- guid: 2990b9d4-434b-4ad6-9495-eb07c89495f1
  event: Companions_Techpriest_126
  text: '{n}Вокс Паскаля сварливо каркает:{/n} "Как технопровидец корабля я принимаю заключение технического дознания. Как просвещенный служитель Омниссии — усомняюсь в нем. Паттерны сбоев складываются в более сложную картину, чем видится служителям более низкого звена. Посему было отдано распоряжение сообщать о новых инцидентах персонально данной единице".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Вокс Паскаля сварливо каркает:'
  - speaker: Pasqal Haneumann
    text_clean: Как технопровидец корабля я принимаю заключение технического дознания. Как просвещенный служитель Омниссии — усомняюсь в нем. Паттерны сбоев складываются в более сложную картину, чем видится служителям более низкого звена. Посему было отдано распоряжение сообщать о новых инцидентах персонально данной единице.
- guid: d08f1f09-2d9b-45a9-a5aa-a7b38ad2feb3
  event: Companions_Techpriest_127
  text: '"Этот почтенный храм-станция был основан в начале экспансии в Простор Коронус. Сейчас он является тыловым наблюдательным форпостом флота Осознание на орбите звезды Фурибундус".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Этот почтенный храм-станция был основан в начале экспансии в Простор Коронус. Сейчас он является тыловым наблюдательным форпостом флота Осознание на орбите звезды Фурибундус.
- guid: eb2ba9d6-4890-413e-8279-c6c12448daf2
  event: Companions_Techpriest_128
  text: '"Эксплораторам дарована привилегия быть более независимыми, чем иные наши техносоратники. Однако это создало нам славу нестабильных и плохо контролируемых смутьянов, опасно приблизившихся к вероотступничеству".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Эксплораторам дарована привилегия быть более независимыми, чем иные наши техносоратники. Однако это создало нам славу нестабильных и плохо контролируемых смутьянов, опасно приблизившихся к вероотступничеству.
- guid: 8f332308-08e3-4a79-a0b0-1e37aa14f089
  event: Companions_Techpriest_129
  text: '"Это — стабильный путь развития. Разумы различных индивидов не равны, дарованные им откровения не равны. Кто-то должен вести, кто-то — доверять ведущему. Всех нас ведет Омниссия, и, возможно, лишь благодаря его первым пророкам и дарованным ими запретам мы еще существуем".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Это — стабильный путь развития. Разумы различных индивидов не равны, дарованные им откровения не равны. Кто-то должен вести, кто-то — доверять ведущему. Всех нас ведет Омниссия, и, возможно, лишь благодаря его первым пророкам и дарованным ими запретам мы еще существуем.
- guid: 16df21f0-7d2c-4cf6-9f31-13750c2b58af
  event: Companions_Techpriest_13
  text: '"Информация о моем происхождении не имеет ценности. Я состою в рядах братства Эксплораторов и прибыл в {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g} более двух столетий назад. Предшествовавшие этому события малозначительны".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Информация о моем происхождении не имеет ценности. Я состою в рядах братства Эксплораторов и прибыл в Простор Коронус более двух столетий назад. Предшествовавшие этому события малозначительны.
- guid: 94b60587-53a5-4bbd-b13f-832497297d2d
  event: Companions_Techpriest_130
  text: '"Омниссия даровал нам высшую миссию — Поиск знания. Факт ее существования подтверждает, что не вся вселенная постигнута и квантифицирована разумом. Значит, никакой запрет не может считаться универсально актуальным. Все ограничения нуждаются в исключениях, но исключения отрицают нерушимость запретов".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Омниссия даровал нам высшую миссию — Поиск знания. Факт ее существования подтверждает, что не вся вселенная постигнута и квантифицирована разумом. Значит, никакой запрет не может считаться универсально актуальным. Все ограничения нуждаются в исключениях, но исключения отрицают нерушимость запретов.
- guid: 3d34284a-ce9c-4fc2-b8b4-759c4edde597
  event: Companions_Techpriest_131
  text: '"Понимание есть Истинный путь к Познанию. Понимание же может быть достигнуто лишь самостоятельно, но не принято как данность. Твой путь вызывает уважение".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Понимание есть Истинный путь к Познанию. Понимание же может быть достигнуто лишь самостоятельно, но не принято как данность. Твой путь вызывает уважение.
- guid: 7e317951-a2bd-4fd8-b256-da43cb4eeefd
  event: Companions_Techpriest_132
  text: '"Не поверие. Благодатная истина".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Не поверие. Благодатная истина.
- guid: bdaca253-29e5-48ee-b57b-daceae99cb5c
  event: Companions_Techpriest_133
  text: '"Но я видел иное. Знания, которые разъедали разум тех, кто пустил их в себя. И все равно я ищу их... почему? Может потому, что на самом деле на знании нет греха? Они опасны, да, но... не запретны, ибо созданы Омниссией".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Но я видел иное. Знания, которые разъедали разум тех, кто пустил их в себя. И все равно я ищу их... почему? Может потому, что на самом деле на знании нет греха? Они опасны, да, но... не запретны, ибо созданы Омниссией.
- guid: c44029fd-f4e5-4ef6-8a7b-e427be5f7f2e
  event: Companions_Techpriest_135
  text: '"Так велели поступить обеты безопасности".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Так велели поступить обеты безопасности.
- guid: a422389b-67ec-46c6-9a33-fe8b5c5c2ee0
  event: Companions_Techpriest_136
  text: '{n}Вокс-синтезатор издает звук, похожий на вздох.{/n} "Данное утверждение истинно. Мои... дальнейшие действия не определены. Я провожу точечную диагностику памяти херетека Деменца, хотя протоколы чистоты велят искоренить его богохульное знание. Меня не влекут запретные сведения, лишь данные, касающиеся благословенного Амарната".'
