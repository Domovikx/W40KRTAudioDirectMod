  text: '{n}Что-то древнее и бесконечно осведомленное взирает на вас из-под маски, которая прежде была лицом Паскаля Ханейманна. Глубоким, вибрирующим, словно провод под напряжением, голосом оно произносит:{/n} "Коллектив Амарнат не успел поблагодарить тебя за сотрудничество, {name} фон Валанциус. Твоя {d|Encyclopedia:CompPasqal_Amarnath}заслуга в свершении Реставрации{/d} не будет забыта".'
