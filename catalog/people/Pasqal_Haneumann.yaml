  event: Companions_Techpriest_137
  text: '"Успех частичен. Личность Деменца Ханейманна подтверждена. В когнитивных процессах наблюдается обширное влияние параноидальных мотиваций, которые, видимо, и привели к нарушению обетов. Но обширные блоки памяти повреждены запретными технологиями и пока не поддаются расшифровке".'
