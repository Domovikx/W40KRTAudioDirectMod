  event: Companions_Techpriest_143
  text: '"Великий вопрос — может ли знание быть грешно?" {n}Голос Паскаля металлизируется. Мехадендриты начинают плавно танцевать вокруг его худой фигуры, загадочно извиваясь.{/n} "Миряне успокаивают себя заблуждением, что знание — это просто информация. Что знание не опасно само по себе, опасны лишь дурные его носители".'
