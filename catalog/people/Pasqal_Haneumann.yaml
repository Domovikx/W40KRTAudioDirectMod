    text_clean: 'Уставившись на вас непроницаемым взглядом, Паскаль тихо произносит:'
  - speaker: Pasqal Haneumann
    text_clean: Я его уничтожил.
- guid: 5d798e3e-ae56-47c5-ac3b-bc0123c90790
  event: Companions_Techpriest_86
  text: '{n}Голос из вокс-синтезатора странно меняется, обретает мягкость и расцветает низкими теплыми нотами.{/n} "Они — мои младшие братья и проводники на пути {g|Encyclopedia:Omnissiah}Омниссии{/g}. Их {g|Encyclopedia:MachineSpirit}машинные духи{/g} сопряжены напрямую с моим неокортексом, они улавливают импульсы из моего подсознания. Но порой они действуют, опережая мою мысль — так Омниссия направляет меня к познанию".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Голос из вокс-синтезатора странно меняется, обретает мягкость и расцветает низкими теплыми нотами.
  - speaker: Pasqal Haneumann
    text_clean: Они — мои младшие братья и проводники на пути Омниссии. Их машинные духи сопряжены напрямую с моим неокортексом, они улавливают импульсы из моего подсознания. Но порой они действуют, опережая мою мысль — так Омниссия направляет меня к познанию.
- guid: 8b171a16-da5f-4ea8-9a30-8b40a973b09e
  event: Companions_Techpriest_87
  text: '"Священное братство разведчиков. Культ Механикус отправляет нас к границам известных секторов как исследователей и завоевателей. Мы — воины Кода, возвращающиеся на потерянные миры и посвятившие себя поиску утраченных знаний древних".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Священное братство разведчиков. Культ Механикус отправляет нас к границам известных секторов как исследователей и завоевателей. Мы — воины Кода, возвращающиеся на потерянные миры и посвятившие себя поиску утраченных знаний древних.
- guid: a53dc052-7ff8-4dc1-881c-22c6374f3cfc
  event: Companions_Techpriest_88
  text: '"Клад и секрет. Технология — это проявление божественности Омниссии в мире. Потому непосвященные имеют право прикасаться лишь к самым тривиальным и вульгарным ее проявлениям. Мы же допущены к священному катехизису эксплуатации и обслуживания".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Клад и секрет. Технология — это проявление божественности Омниссии в мире. Потому непосвященные имеют право прикасаться лишь к самым тривиальным и вульгарным ее проявлениям. Мы же допущены к священному катехизису эксплуатации и обслуживания.
- guid: 158190b8-bef3-44f8-a974-a3fd4427802d
  event: Companions_Techpriest_89
  text: '"Информация скудна. Его идентификационный код совпадает с моим, в его памяти хранятся данные, подтверждающие факт покушения. К несчастью, часть памяти повреждена импульсами, транслируемыми его боевой упряжью. Я готов утверждать, что он действительно был тем, кем назвался... и служил Деус Механикус с искренностью и рвением".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Информация скудна. Его идентификационный код совпадает с моим, в его памяти хранятся данные, подтверждающие факт покушения. К несчастью, часть памяти повреждена импульсами, транслируемыми его боевой упряжью. Я готов утверждать, что он действительно был тем, кем назвался... и служил Деус Механикус с искренностью и рвением.
- guid: de59ae52-8f60-4946-aafa-f010ed09ee84
  event: Companions_Techpriest_90
  text: '"Он впал в схизму, оспорил священные границы, проложенные для Знания. Благословенный Амарнат утверждал, что пределы дозволенного должны быть расширены, потому что, отказываясь от постижения в определенных областях, мы презреваем Седьмой {g|Encyclopedia:UniversalLaws}Универсальный Закон{/g} — Познание есть Ключ ко всему".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он впал в схизму, оспорил священные границы, проложенные для Знания. Благословенный Амарнат утверждал, что пределы дозволенного должны быть расширены, потому что, отказываясь от постижения в определенных областях, мы презреваем Седьмой Универсальный Закон — Познание есть Ключ ко всему.
- guid: 2ca3b6d6-9229-448d-9b78-51659dd1e99a
  event: Companions_Techpriest_91
  text: '"Учение благословенного Амарната расширилось, и информация о нем достигла конклава флота Осознание. Многие из нас внезапно пропали или получили серво-епитимью за незначительные проступки. Начался конфликт. Мой прогноз показал, что наше наиболее вероятное будущее — раскол и схизма, которая уничтожит флот Осознание. И тогда я отправился к конклаву".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Учение благословенного Амарната расширилось, и информация о нем достигла конклава флота Осознание. Многие из нас внезапно пропали или получили серво-епитимью за незначительные проступки. Начался конфликт. Мой прогноз показал, что наше наиболее вероятное будущее — раскол и схизма, которая уничтожит флот Осознание. И тогда я отправился к конклаву.
- guid: 887f74db-0cb5-44fb-a8ef-e0ef83517859
  event: Companions_Techpriest_92
  text: '"Меня призвало туда послание, шифрованное кодом благословенного Амарната. Оно было туманным и могло быть трактовано по разному. Но тот факт, что мы пребываем в опасности, и я должен прибыть на Райкад Минорис, был очевиден".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Меня призвало туда послание, шифрованное кодом благословенного Амарната. Оно было туманным и могло быть трактовано по разному. Но тот факт, что мы пребываем в опасности, и я должен прибыть на Райкад Минорис, был очевиден.
- guid: 45cbb4cf-3185-41af-af0b-78452d6310e2
  event: Companions_Techpriest_93
  text: '"Запрос одобрен. Я готов предоставить необходимую информацию".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен. Я готов предоставить необходимую информацию.
- guid: 1fffd377-4853-4ba2-a069-427585cb0774
  event: Companions_Techpriest_94
  text: '"Принято. Я вернусь к размышлениям над поисками благословенного Амарната".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Принято. Я вернусь к размышлениям над поисками благословенного Амарната.
- guid: 22e4d450-cb3d-48cf-876c-96c714ff7aad
  event: Companions_Techpriest_95
  text: '"Оценка его личности затруднена. Дух брата Авеля не таков, как у большинства людей. Техносоратники Шестерни зовут таких людей "тихими". Он обладает высоким интеллектом, однако не склонен к коммуникации".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Оценка его личности затруднена. Дух брата Авеля не таков, как у большинства людей. Техносоратники Шестерни зовут таких людей "тихими". Он обладает высоким интеллектом, однако не склонен к коммуникации.
- guid: 8b1da595-267b-4afe-a736-0566368828cc
  event: Companions_Techpriest_96
  text: '"Впрочем, есть и иная причина оберегать таинство Знания от простолюдинов — оно бывает опасно. Исковерканная отступниками мудрость Омниссии зовется "{g|Encyclopedia:Heretech}еретех{/g}", и одно соприкосновение с ней может исказить разум непосвященного. Другая опасность — Знание, непостижимо истолкованное и преобразованное ксеноразумом. Этот бич зовется "ксенотех".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Впрочем, есть и иная причина оберегать таинство Знания от простолюдинов — оно бывает опасно. Исковерканная отступниками мудрость Омниссии зовется "еретех", и одно соприкосновение с ней может исказить разум непосвященного. Другая опасность — Знание, непостижимо истолкованное и преобразованное ксеноразумом. Этот бич зовется "ксенотех.
- guid: d5d65216-1398-4a86-98f7-d445768bcf35
  event: Companions_Techpriest_97
  text: '"Он пребывал в перманентной агонии, но не был когнитивно дисфункционален. Желание немедленно ликвидировать объект, распознанный как греховный, отчасти продиктовано энграмматическими аугментами, получавшими императивы от боевой упряжи".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Он пребывал в перманентной агонии, но не был когнитивно дисфункционален. Желание немедленно ликвидировать объект, распознанный как греховный, отчасти продиктовано энграмматическими аугментами, получавшими императивы от боевой упряжи.
- guid: 53904c2d-8cc8-4e85-b57e-353bab2dfca5
  event: Companions_Techpriest_98
  text: '"Информация отсутствует. Выдвигаю гипотезу, что покушение было инициировано врагом доктрины благословенного Амарната. Допускаю, что целью покушения был я, но убийцы были введены в заблуждение нашими с Тарзусом идентичными идентификаторами".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Информация отсутствует. Выдвигаю гипотезу, что покушение было инициировано врагом доктрины благословенного Амарната. Допускаю, что целью покушения был я, но убийцы были введены в заблуждение нашими с Тарзусом идентичными идентификаторами.
- guid: 5fc82a7f-b872-4307-8049-0a27237a9f23
  event: Companions_Techpriest_99
  text: '"Я не был осведомлен, насколько популярно учение благословенного Амарната в кругах Эксплораторов. Флот Осознание масштабен, на его периферии его идеи могли обладать большим числом сторонников, чем в материнской эскадре".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я не был осведомлен, насколько популярно учение благословенного Амарната в кругах Эксплораторов. Флот Осознание масштабен, на его периферии его идеи могли обладать большим числом сторонников, чем в материнской эскадре.
