  text: '"Гипотеза: наблюдаемая реальность является сложной оптической иллюзией, выстроенной с использованием извращенного ксенознания". {n}Паскаль с силой проводит {g|Encyclopedia:Mechadendrite}мехадендритом{/g} по ближайшему участку стены. На камне остается глубокая царапина.{/n} "Уровень имитации: экстремально высокий. Гипотеза не объясняет наблюдаемый эффект пространственно-временого парадокса".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: 'Гипотеза: наблюдаемая реальность является сложной оптической иллюзией, выстроенной с использованием извращенного ксенознания.'
  - speaker: narrator
    text_clean: Паскаль с силой проводит мехадендритом по ближайшему участку стены. На камне остается глубокая царапина.
  - speaker: Pasqal Haneumann
    text_clean: 'Уровень имитации: экстремально высокий. Гипотеза не объясняет наблюдаемый эффект пространственно-временого парадокса.'
