  text: '{n}Паскаль искоса смотрит на вас, и в голосе его вокс-синтезатора возникает потусторонняя глубина.{/n} "Конечно, вера опасна. Вера — прерогатива духа, а разум без духа есть враг всего сущего. Без веры ничто не имеет смысла — ни устремления, ни ограничения. Но вера может принимать разные формы".'
