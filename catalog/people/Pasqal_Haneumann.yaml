- guid: 00c45ef6-6509-4ab7-9a4d-ef94e1f1b419
  event: ''
  text: '"Во славу {g|Encyclopedia:Omnissiah}Омниссии{/g}, да уснет дух сей машины, чтобы пробудиться вновь и служить". {n}Паскаль осторожно касается короны сервитора, деактивируя один из ее сегментов.{/n} "Да будет погружен во тьму внешний контур невральной связи". {n}Еще одно касание, несколько огоньков на короне гаснет.{/n} "Да умолкнет узел командного отклика".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Во славу Омниссии, да уснет дух сей машины, чтобы пробудиться вновь и служить.
  - speaker: narrator
    text_clean: Паскаль осторожно касается короны сервитора, деактивируя один из ее сегментов.
  - speaker: Pasqal Haneumann
    text_clean: Да будет погружен во тьму внешний контур невральной связи.
  - speaker: narrator
    text_clean: Еще одно касание, несколько огоньков на короне гаснет.
  - speaker: Pasqal Haneumann
    text_clean: Да умолкнет узел командного отклика.
- guid: 05953a7e-a9b8-492a-a5c8-7be23311f2c1
  event: ''
  text: '"Благодарю тебя за путь, что мы прошли". {n}Паскаль склоняется в поклоне, и кажется, что его худые плечи опускаются целую вечность с тех высот, на которые воспарил его разум.{/n} "И сожалею о том, что случилось с Теодорой".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Благодарю тебя за путь, что мы прошли.
  - speaker: narrator
    text_clean: Паскаль склоняется в поклоне, и кажется, что его худые плечи опускаются целую вечность с тех высот, на которые воспарил его разум.
  - speaker: Pasqal Haneumann
    text_clean: И сожалею о том, что случилось с Теодорой.
- guid: 071b401b-f6aa-4e87-8dc3-7fae53cdb020
  event: ''
  text: '{n}Паскаль смиренно склоняется перед мужчиной, из {g|Encyclopedia:Vox}вокса{/g} раздается трель бинарных сигналов, на которую ваш собеседник отвечает исполненным достоинства благословляющим жестом. Обернувшись к вам, техножрец произносит:{/n} "Чин Претора Электроида — знак высокого статуса в братстве электрожрецов. Аудиенция у него — большая честь".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль смиренно склоняется перед мужчиной, из вокса раздается трель бинарных сигналов, на которую ваш собеседник отвечает исполненным достоинства благословляющим жестом. Обернувшись к вам, техножрец произносит:'
  - speaker: Pasqal Haneumann
    text_clean: Чин Претора Электроида — знак высокого статуса в братстве электрожрецов. Аудиенция у него — большая честь.
- guid: 08d2fe2a-82e8-402e-bd6f-a05602793baa
  event: ''
  text: '"Идентификатор принят. Священный сан магоса подтвержден. Статус субъекта ожидает валидации". {n}Паскаль сухо кивает техножрецу как равному, после чего издает переливчатую трель лингва-технис.{/n} "Магос Паскаль Ханейманн, главный технопровидец флагмана фон Валанциус". {n}В хрипе вокса Паскаля звучит плохо скрываемый вызов.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Идентификатор принят. Священный сан магоса подтвержден. Статус субъекта ожидает валидации.
  - speaker: narrator
    text_clean: Паскаль сухо кивает техножрецу как равному, после чего издает переливчатую трель лингва-технис.
  - speaker: Pasqal Haneumann
    text_clean: Магос Паскаль Ханейманн, главный технопровидец флагмана фон Валанциус.
  - speaker: narrator
    text_clean: В хрипе вокса Паскаля звучит плохо скрываемый вызов.
- guid: 09e14687-1085-4d21-a451-e516449447c9
  event: ''
  text: '"Благодать {g|Encyclopedia:Omnissiah}Омниссии{/g} не касалась данного объекта. Этот механизм не был осквернен, но изначально рожден ущербным и противоестественным. Кощунственное железо". {n}Паскаль неторопливо извлекает инфопластину.{/n} "Начинаю логирование наблюдений. Да не встанет страх на пути Познания".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Благодать Омниссии не касалась данного объекта. Этот механизм не был осквернен, но изначально рожден ущербным и противоестественным. Кощунственное железо.
  - speaker: narrator
    text_clean: Паскаль неторопливо извлекает инфопластину.
  - speaker: Pasqal Haneumann
    text_clean: Начинаю логирование наблюдений. Да не встанет страх на пути Познания.
- guid: 0b85c004-fdef-47c6-bbf6-aa78599817bc
  event: ''
  text: '"Зафиксировано бого... Отмена. Прогноз указывает на неизбежность конфронтации. Необходимость в ведении протокола отсутствует". {n}Паскаль поудобнее перехватывает оружие. Визор окрашивается багрянцем, и на груди Вортена возникает пятнышко прицельного лазера.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Зафиксировано бого... Отмена. Прогноз указывает на неизбежность конфронтации. Необходимость в ведении протокола отсутствует.
  - speaker: narrator
    text_clean: Паскаль поудобнее перехватывает оружие. Визор окрашивается багрянцем, и на груди Вортена возникает пятнышко прицельного лазера.
- guid: 14438b3e-5801-4d63-b1e0-fdf2b53d3d62
  event: ''
  text: '"Фиксирую высокий уровень здравомыслия в озвученном решении". {n}Паскаль едва заметно кланяется.{/n} "Последствия сбоя и нерелевантных решений генетора Фебруса будут немедленно устранены, а функционирование машинных духов корабля — оптимизировано согласно священным протоколам".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Фиксирую высокий уровень здравомыслия в озвученном решении.
  - speaker: narrator
    text_clean: Паскаль едва заметно кланяется.
  - speaker: Pasqal Haneumann
    text_clean: Последствия сбоя и нерелевантных решений генетора Фебруса будут немедленно устранены, а функционирование машинных духов корабля — оптимизировано согласно священным протоколам.
- guid: 1a19c3b5-2a81-43dd-83a5-e4751b129186
  event: ''
  text: '{n}Паскаль на мгновение замирает. Когда он наконец начинает говорить, видно, как он выбирает слова и колеблется — нечто очень нехарактерное для магоса Ханейманна.{/n} "Окно вероятностей велико, мы не можем быть уверены, с чем имеем дело, пока не завершим исчисления. Однако есть риск, что все, что мы наблюдали на корабле — проявления Изуверского Интеллекта".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль на мгновение замирает. Когда он наконец начинает говорить, видно, как он выбирает слова и колеблется — нечто очень нехарактерное для магоса Ханейманна.
  - speaker: Pasqal Haneumann
    text_clean: Окно вероятностей велико, мы не можем быть уверены, с чем имеем дело, пока не завершим исчисления. Однако есть риск, что все, что мы наблюдали на корабле — проявления Изуверского Интеллекта.
- guid: 1a8a8f2e-6a15-4ed9-a347-a5186ac1a7d0
  event: ''
  text: '{n}Паскаль холодно вещает:{/n} "Единица Ульфар утверждает, что являлась лишь инструментом в чужих руках. Данное утверждение занесено в архив. Да обретет каждый инструмент внимание, сообразное функции его".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль холодно вещает:'
  - speaker: Pasqal Haneumann
    text_clean: Единица Ульфар утверждает, что являлась лишь инструментом в чужих руках. Данное утверждение занесено в архив. Да обретет каждый инструмент внимание, сообразное функции его.
- guid: 1b281e08-d7f8-4264-b44b-8c76039e40f5
  event: ''
  text: '{n}Паскаль поясняет с непонятной гордостью:{/n} "Технобрат Авель посвятил вам малую арию. Это произведение отличается высоким уровнем акустической гармонии и хорошо подходит для использования в качестве девиза, вспомогательного идентификатора или эпитафии".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль поясняет с непонятной гордостью:'
  - speaker: Pasqal Haneumann
    text_clean: Технобрат Авель посвятил вам малую арию. Это произведение отличается высоким уровнем акустической гармонии и хорошо подходит для использования в качестве девиза, вспомогательного идентификатора или эпитафии.
- guid: 1baed1d8-962d-4594-bc07-a5cdc6334057
  event: ''
  text: '"Запрос одобрен". {n}Паскаль ретиво распускает мехадендриты, и все они устремляются к монстру. Взвизгнувший бур глубоко врезается в броню, клешня со смачными щелчками отрывает куски пронизанного нитями проводки мяса. Тварь хрипит и бьется, но не может сбежать от безжалостного аутопсиста. Собранные образцы отправляются в портативный анализатор на силовой установке, а визор техножреца издает щелчки, запечатлевая процесс вскрытия на пикт-изображениях.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен.
  - speaker: narrator
    text_clean: Паскаль ретиво распускает мехадендриты, и все они устремляются к монстру. Взвизгнувший бур глубоко врезается в броню, клешня со смачными щелчками отрывает куски пронизанного нитями проводки мяса. Тварь хрипит и бьется, но не может сбежать от безжалостного аутопсиста. Собранные образцы отправляются в портативный анализатор на силовой установке, а визор техножреца издает щелчки, запечатлевая процесс вскрытия на пикт-изображениях.
- guid: 24275929-368b-435b-83ec-f9e7b0d1334b
  event: ''
  text: '{n}Паскаль снова яростно выбивает дробь на клавишах. На малом вид-скрине появляется надпись:{/n} "{name}, ты провоцируешь духа машины. Необходимо прекратить и перейти к ритуальному обслуживанию".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль снова яростно выбивает дробь на клавишах. На малом вид-скрине появляется надпись:'
  - speaker: Pasqal Haneumann
    text_clean: КЭП, ты провоцируешь духа машины. Необходимо прекратить и перейти к ритуальному обслуживанию.
- guid: 2723eb8b-147b-4b61-8e03-83a637029265
  event: ''
  text: '"Я отказываюсь". {n}Паскаль предостерегающе поднимает {g|Encyclopedia:Mechadendrite}мехадендрит{/g}.{/n} "Решение ведет к неразрешимому конфликту, сотрудничество невозможно".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я отказываюсь.
  - speaker: narrator
    text_clean: Паскаль предостерегающе поднимает мехадендрит.
  - speaker: Pasqal Haneumann
    text_clean: Решение ведет к неразрешимому конфликту, сотрудничество невозможно.
- guid: 2727a0fe-5f52-445d-9bd0-afdea623fc6f
  event: ''
  text: '{n}Вокс издает шорох, похожий на смешок.{/n} "Благодатна и желанна для Эксплоратора миссия рекогносцировки. Счастьем служением переполняется инфодуша того, кто разведывает, анализирует, картографирует". {n}Паскаль опускает взгляд.{/n} "Для меня было бы честью высадиться с вами".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Вокс издает шорох, похожий на смешок.
  - speaker: Pasqal Haneumann
    text_clean: Благодатна и желанна для Эксплоратора миссия рекогносцировки. Счастьем служением переполняется инфодуша того, кто разведывает, анализирует, картографирует.
  - speaker: narrator
    text_clean: Паскаль опускает взгляд.
  - speaker: Pasqal Haneumann
    text_clean: Для меня было бы честью высадиться с вами.
- guid: 27514bbd-7e4e-4b57-b60f-515d4483b95c
  event: ''
  text: '{n}Паскаль, все еще сражающийся со своей замолчавшей вокс-системой, быстро оттарабанивает что-то по клавишам когитатора и указывает вам на самый маленький вид-скрин. Там написано следующее:{/n} "Запрашиваю указания. Опция один — завершить комплементат-ритуал (изгонит сущность Номос). Опция два — остановить ритуал, провести вместо него причащение (умилостивит сущность Номос)".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Паскаль, все еще сражающийся со своей замолчавшей вокс-системой, быстро оттарабанивает что-то по клавишам когитатора и указывает вам на самый маленький вид-скрин. Там написано следующее:'
  - speaker: Pasqal Haneumann
    text_clean: Запрашиваю указания. Опция один — завершить комплементат-ритуал (изгонит сущность Номос). Опция два — остановить ритуал, провести вместо него причащение (умилостивит сущность Номос).
- guid: 2ca15eb9-5361-4b4b-8e93-119650d1e24a
  event: ''
  text: '{n}Паскаль прерывает вас бесконечно властным жестом мехадендрита.{/n} "Не стоит. Это лишь наш спор. Наша дилемма".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль прерывает вас бесконечно властным жестом мехадендрита.
  - speaker: Pasqal Haneumann
    text_clean: Не стоит. Это лишь наш спор. Наша дилемма.
- guid: 3315d479-d9d9-44bb-a31f-b0d9fe3f9c62
  event: ''
  text: '"Активирую режим ожидания". {n}Паскаль начинает негромко гудеть, читая бинарную молитву.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Активирую режим ожидания.
  - speaker: narrator
    text_clean: Паскаль начинает негромко гудеть, читая бинарную молитву.
- guid: 38fa2f2e-82af-4724-8ab6-75f9a93fc936
  event: ''
  text: '"Лорд-капитан!" {n}Паскаль замирает, а затем, уже спокойнее, продолжает:{/n} "Прошу вас. Вы разгневаете машинный дух до того, как мы сможем снять ограничения".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Лорд-капитан!
  - speaker: narrator
    text_clean: 'Паскаль замирает, а затем, уже спокойнее, продолжает:'
  - speaker: Pasqal Haneumann
    text_clean: Прошу вас. Вы разгневаете машинный дух до того, как мы сможем снять ограничения.
- guid: 3d8fd5d9-5358-42d9-a7db-bfa91ee6348c
  event: ''
  text: '"Машинные духи не благоволят тебе. Позволь мне умилостивить их надлежащим образом". {n}Паскаль склоняется над когитатором и погружается в работу.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Машинные духи не благоволят тебе. Позволь мне умилостивить их надлежащим образом.
  - speaker: narrator
    text_clean: Паскаль склоняется над когитатором и погружается в работу.
- guid: 440ad55b-43c6-4ff0-a70e-b2b9d855560f
  event: ''
  text: '{n}Паскаль запрокидывает голову, и мощь, переполнявшая его голос, выплескивается вовне. Голос техножреца гремит на весь корабль, подхваченный каждым вокс-динамиком каждой палубы.{/n} "Однажды я нарушил заветы Омниссии. Преступил границы, проложенные для познания. Я содеял грех. Все мы содеяли".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль запрокидывает голову, и мощь, переполнявшая его голос, выплескивается вовне. Голос техножреца гремит на весь корабль, подхваченный каждым вокс-динамиком каждой палубы.
  - speaker: Pasqal Haneumann
    text_clean: Однажды я нарушил заветы Омниссии. Преступил границы, проложенные для познания. Я содеял грех. Все мы содеяли.
- guid: 47798c71-9caf-4fe5-a835-6fd0eceaca89
  event: ''
  text: '"Утверждение ложно. В моем архиве не зарегистрированы встречи с данной единицей, как и архивные обращения касательно ее. Я... просто знаю. И скорблю". {n}Паскаль касается бледной кожи сервитора, покрытой чернильными закорючками.{/n} "Дикари начертали на нем благословенную инструкцию по уходу и ремонту. Гипотеза — не осознавая истинного назначения сей литании, они воспринимали ее как волшебное заклинание, несущее здоровье".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Утверждение ложно. В моем архиве не зарегистрированы встречи с данной единицей, как и архивные обращения касательно ее. Я... просто знаю. И скорблю.
  - speaker: narrator
    text_clean: Паскаль касается бледной кожи сервитора, покрытой чернильными закорючками.
  - speaker: Pasqal Haneumann
    text_clean: Дикари начертали на нем благословенную инструкцию по уходу и ремонту. Гипотеза — не осознавая истинного назначения сей литании, они воспринимали ее как волшебное заклинание, несущее здоровье.
