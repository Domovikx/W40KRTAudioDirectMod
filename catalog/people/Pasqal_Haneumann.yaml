- guid: 271bb1c8-f571-4a48-87e5-1df5bf831110
  event: Companions_Techpriest_105
  text: '"Это утверждение ложно, но предсказуемо. Откровения Омниссии шокируют темный разум, не способный принять и понять их праведную суть".'
