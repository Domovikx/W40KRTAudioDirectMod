  text: '"Реверсивный анализ указывает, что диверсия была предсказуема. Директивы взаимодействия с ксенорасами предупреждают о склонности нелюдей к нарушению контрактов. Данные о ненадежности единицы Ирлиэт внесены в архив". {n}Голос Паскаля сух и равнодушен, но буровой мехадендрит разражается грозным рычанием.{/n}'
