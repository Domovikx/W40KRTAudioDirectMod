  event: Companions_Techpriest_144
  text: '"Это — истина. Мы, Эксплораторы, — саперы Познания. Мы идем по неизведанной территории, превращая ее в жизненное пространство, пока не достигаем точки, за которую двигаться нельзя. Наши останки станут сигналом для последователей — дальше пути нет. Теперь их долг — развиваться в отвоеванном нами пространстве и искать способы прорваться дальше. Неудача не должна останавливать нас, ибо неудача — приемлемый результат".'
