  text: '"Утверждение ложно. Соседство и взаимодействие ксеноаугментов со священным металлом Бога-Машины вело к алгоритмическим парадоксам и проистекающему из них богохульству. Омниссия очищает и защищает". {n}Мехадендрит решительно клацает клешнями.{/n}'
