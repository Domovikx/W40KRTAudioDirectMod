  parts:
  - speaker: Pasqal Haneumann
    text_clean: Данное место взывает к Омниссии об акте очистительного и благостного ксеноцида. Пространственная дисгармония, наблюдаемая здесь, указывает на его анафематическую природу. Впрочем...
