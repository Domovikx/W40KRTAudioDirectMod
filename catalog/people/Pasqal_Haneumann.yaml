- guid: 3569c4f1-e323-4346-8f4f-475a7cb54346
  event: CH1_Haneumann_FirstMeeting_06
  text: '{n}Идира пристально смотрит на техножреца, жуя губу. Затем наклоняется к вам.{/n} "Странно голоса про него толкуют... разное... спутанное... словно и про разных людей совершенно... но угрозы от него вам нет. Даже если после этих фейерверков и не особо верится".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Идира пристально смотрит на техножреца, жуя губу. Затем наклоняется к вам.
  - speaker: Pasqal Haneumann
    text_clean: Странно голоса про него толкуют... разное... спутанное... словно и про разных людей совершенно... но угрозы от него вам нет. Даже если после этих фейерверков и не особо верится.
- guid: 237280c2-48b2-4a4c-8d68-6fcd7543253d
  event: CH1_Haneumann_FirstMeeting_07
  text: '"Мои сопровождающие получили приказ от своего командира остановить движение и дождаться соединения с вашей группой. А затем, ввиду своей некомпетентности, дали себя убить. Это прискорбно осложнило мою задачу". {n}Если в голосе техножреца и было сочувствие погибшим, ни одна ее нотка не прозвучала в сухих словах из вокс-системы.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Мои сопровождающие получили приказ от своего командира остановить движение и дождаться соединения с вашей группой. А затем, ввиду своей некомпетентности, дали себя убить. Это прискорбно осложнило мою задачу.
  - speaker: narrator
    text_clean: Если в голосе техножреца и было сочувствие погибшим, ни одна ее нотка не прозвучала в сухих словах из вокс-системы.
- guid: f048eea5-ef98-4983-9338-06caee304edb
  event: CH1_Haneumann_FirstMeeting_08
  text: '"Омниссия даровал мне откровение. Дух сей машины умирал, но желал свершить пользу, ибо таков его замысел. Я почувствовал это и... обратился к нему. Мне неведомо, как я это сделал — лишь последовал наитию. Понимание, дарованное Омниссией, не было перманентным, оно оставило меня". {n}Техножрец выглядит потрясенным.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Омниссия даровал мне откровение. Дух сей машины умирал, но желал свершить пользу, ибо таков его замысел. Я почувствовал это и... обратился к нему. Мне неведомо, как я это сделал — лишь последовал наитию. Понимание, дарованное Омниссией, не было перманентным, оно оставило меня.
  - speaker: narrator
    text_clean: Техножрец выглядит потрясенным.
- guid: c0dac73c-b94d-47da-8916-3790ff648882
  event: CH1_Haneumann_FirstMeeting_09
  text: '{n}Вокруг открытого глаза техножреца появляются слабые морщинки, словно под маской-респиратором он улыбается.{/n} "Прерывание жизненных функций — феномен неизбежный, а потому незначимый. Доктрина служения отвергает страх смерти".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Вокруг открытого глаза техножреца появляются слабые морщинки, словно под маской-респиратором он улыбается.
  - speaker: Pasqal Haneumann
    text_clean: Прерывание жизненных функций — феномен неизбежный, а потому незначимый. Доктрина служения отвергает страх смерти.
- guid: 78cdf865-cf28-40c2-ae6e-43467f6eeb7c
  event: CH1_Haneumann_FirstMeeting_10
  text: '"Принято. Прогнозирую успешное взаимовыгодное сотрудничество".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Принято. Прогнозирую успешное взаимовыгодное сотрудничество.
- guid: a0bd63e9-60a6-481f-aca9-8fd30c65168e
  event: CH1_Haneumann_FirstMeeting_11
  text: '{n}Из-под местами тлеющего алого облачения доносится трель — это бинарная речь, священный язык {g|Encyclopedia:AdeptusMechanicus}Адептус Механикус{/g}. Двоичный гимн перерастает в синтезированный {g|Encyclopedia:Vox}вокс-системой{/g} голос, подобный степному грому:{/n} "Ни шагу вперед".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Из-под местами тлеющего алого облачения доносится трель — это бинарная речь, священный язык Адептус Механикус. Двоичный гимн перерастает в синтезированный вокс-системой голос, подобный степному грому:'
  - speaker: Pasqal Haneumann
    text_clean: Ни шагу вперед.
- guid: b355b5be-1515-4c38-8e25-73a6bac4c090
  event: CH1_Haneumann_FirstMeeting_12
  text: '{n}Дикое сине-зеленое сияние угасает во взгляде техножреца. Он опускает руку, и механика на вас перестает погибать от неведомой пагубы.{/n} "Конвой получил приказ встретить вас. Более он нефункционален, потому предлагаю продолжить продвижение к точке рандеву с солдатами губернатора совместно". {n}Техножрец решительно устремляет взор вперед, {g|Encyclopedia:Mechadendrite}щупальца-мехадендриты{/g} грациозно вздымаются вокруг его сгорбленной фигуры, подсвеченной костром из догорающих останков машины.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Дикое сине-зеленое сияние угасает во взгляде техножреца. Он опускает руку, и механика на вас перестает погибать от неведомой пагубы.
  - speaker: Pasqal Haneumann
    text_clean: Конвой получил приказ встретить вас. Более он нефункционален, потому предлагаю продолжить продвижение к точке рандеву с солдатами губернатора совместно.
  - speaker: narrator
    text_clean: Техножрец решительно устремляет взор вперед, щупальца-мехадендриты грациозно вздымаются вокруг его сгорбленной фигуры, подсвеченной костром из догорающих останков машины.
- guid: 1e9bf1ae-0f54-4ee2-80b9-a0ef82034ca9
  event: CH1_Haneumann_FirstMeeting_13
  text: '{n}Скрипя зубами, сенешаль выдавливает:{/n} "Вольный Торговец {name} фон Валанциус приветствует тебя, почтенный техножрец, и милостиво дозволяет пребывать в е{mf|го|е} обществе".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Скрипя зубами, сенешаль выдавливает:'
  - speaker: Pasqal Haneumann
    text_clean: Вольный Торговец КЭП фон Валанциус приветствует тебя, почтенный техножрец, и милостиво дозволяет пребывать в его обществе.
- guid: 5f96de84-09c1-4a6e-9014-8b2b8cc10d2a
  event: CH1_Haneumann_FirstMeeting_15
  text: '{n}Визор техножреца фокусируется на вашем облачении, внимательно изучает символы на нем.{/n} "Я идентифицирую вас как представител{mf|я|ьницу} высшего сословия, принадлежащ{mf|его|ую} к династии Вольных Торговцев фон Валанциус. Необходимость конфронтации не зафиксирована".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Визор техножреца фокусируется на вашем облачении, внимательно изучает символы на нем.
  - speaker: Pasqal Haneumann
    text_clean: Я идентифицирую вас как представителя высшего сословия, принадлежащего к династии Вольных Торговцев фон Валанциус. Необходимость конфронтации не зафиксирована.
- guid: 8061f761-d6d7-470c-8f1d-b98ae0b3dfd1
  event: CH1_Haneumann_FirstMeeting_16
  text: '"Алтарь-Темплум-Каликсис... мне знакомо это название. Станция отмечена на звездных картах Дома Орселлио в системе Фурибундус, недалеко от пустотной колонии Футфол. Дабы оказаться здесь, вы проделали долгий путь, почтенный магос".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Алтарь-Темплум-Каликсис... мне знакомо это название. Станция отмечена на звездных картах Дома Орселлио в системе Фурибундус, недалеко от пустотной колонии Футфол. Дабы оказаться здесь, вы проделали долгий путь, почтенный магос.
- guid: 03145e7c-8f74-4446-b1fc-c571a14eff49
  event: CH1_Haneumann_FirstMeeting_17
  text: '{n}Лицо техножреца суровеет, и он загадочно добавляет:{/n} "Устами владыки Омниссия вручает мне алгоритм исправления ошибок и торжествования в служении. И я исправлю, и я восторжествую".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Лицо техножреца суровеет, и он загадочно добавляет:'
  - speaker: Pasqal Haneumann
    text_clean: Устами владыки Омниссия вручает мне алгоритм исправления ошибок и торжествования в служении. И я исправлю, и я восторжествую.
- guid: 9821af3f-587d-443f-8538-044cc8b447ad
  event: CH1_Haneumann_FirstMeeting_18
  text: '"Трон Святый... из чего сделан этот служитель Омниссии? Из адамантиума?... Проклятье!" {n}Абеляр хватается за голову, его глазной имплант захлебывается волной помех.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Трон Святый... из чего сделан этот служитель Омниссии? Из адамантиума?... Проклятье!
  - speaker: narrator
    text_clean: Абеляр хватается за голову, его глазной имплант захлебывается волной помех.
- guid: 76a56d02-7ad1-4186-8a92-4166af0a5fd4
  event: CH1_Haneumann_FirstMeeting_19
  text: '{n}Худая рука поднимается, преграждая вам путь, и ваш вокс-приемник заходится в болезненном вое, а машинная экипировка начинает искрить. Сверкающий силовой топор техножреца изрыгает облако благословенных искр, а визор яростно сияет голубым и зеленым.{/n} "Бегите, ибо я — смерть".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Худая рука поднимается, преграждая вам путь, и ваш вокс-приемник заходится в болезненном вое, а машинная экипировка начинает искрить. Сверкающий силовой топор техножреца изрыгает облако благословенных искр, а визор яростно сияет голубым и зеленым.
  - speaker: Pasqal Haneumann
    text_clean: Бегите, ибо я — смерть.
- guid: 96f61ff9-5ea2-4811-9e3a-0f42a94693fd
  event: CH1_Haneumann_FirstMeeting_Kibellah_01
  text: '{n}Кибелла удивленно смотрит на жреца в алом.{/n} "Странно слышать слова эти из уст того, кто не принадлежит к Кровавой паутине... Мы так схожи".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Кибелла удивленно смотрит на жреца в алом.
  - speaker: Pasqal Haneumann
    text_clean: Странно слышать слова эти из уст того, кто не принадлежит к Кровавой паутине... Мы так схожи.
- guid: 42e23d29-3116-4518-8032-f17f404843ad
  event: Companions_Techpriest_01
  text: '{n}Закутанный в алую рясу {g|Encyclopedia:TechPriest}техножрец{/g} приветствует вас негромким голосом, синтезированным вокс-системой:{/n} "Омниссия знает все, постигает все, {name}". {n}{g|Encyclopedia:Mechadendrite}Мехадендриты{/g}, растущие из спины техножреца, нацеливаются на вас, будто с любопытством рассматривая.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: 'Закутанный в алую рясу техножрец приветствует вас негромким голосом, синтезированным вокс-системой:'
  - speaker: Pasqal Haneumann
    text_clean: Омниссия знает все, постигает все, КЭП.
  - speaker: narrator
    text_clean: Мехадендриты, растущие из спины техножреца, нацеливаются на вас, будто с любопытством рассматривая.
- guid: c2485e9d-4dd3-491a-84fe-bcd9bf16cffa
  event: Companions_Techpriest_02
  text: '"Омниссия знает все, постигает все, {name}".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Омниссия знает все, постигает все, КЭП.
- guid: 75a53679-7705-4d0b-af45-3fd4b0fb1c64
  event: Companions_Techpriest_03
  text: '"Принято".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Принято.
- guid: 2f16515d-bf66-4160-aa26-95a79a7c7fc2
  event: Companions_Techpriest_04
  text: '"Отчасти. Голосовой модулятор был имплантирован мне вместе с респираторной очистительной системой. Но есть и иная причина — готик не является родным для меня языком. Я привык мыслить и излагать суждения на {g|Encyclopedia:LinguaTechnis}лингва-технис{/g}. Бинарный язык информативнее, эргономичнее и менее подвержен ошибочному восприятию".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Отчасти. Голосовой модулятор был имплантирован мне вместе с респираторной очистительной системой. Но есть и иная причина — готик не является родным для меня языком. Я привык мыслить и излагать суждения на лингва-технис. Бинарный язык информативнее, эргономичнее и менее подвержен ошибочному восприятию.
- guid: c85a0a04-d312-4097-b7d1-88f2c7e0e33e
  event: Companions_Techpriest_05
  text: '"Я ошибался, предполагая, что под именем Авель Ханейманн скрывается благословенный архимагос Амарнат. Однако, он явно как-то связан с почтенным Авелем, и я намерен выяснить суть этой связи".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я ошибался, предполагая, что под именем Авель Ханейманн скрывается благословенный архимагос Амарнат. Однако, он явно как-то связан с почтенным Авелем, и я намерен выяснить суть этой связи.
- guid: 03a4485b-4910-49ac-8f3a-1e1818431ccc
  event: Companions_Techpriest_06
  text: '"Я удивлен. Твое суждение ошибочно, я запрашиваю подтверждения приказа".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я удивлен. Твое суждение ошибочно, я запрашиваю подтверждения приказа.
- guid: 11d4d6dd-b7d0-4db2-9b1d-a31610addd1a
  event: Companions_Techpriest_07
  text: '"Предполагаю, что под этим именем скрывается благословенный Амарнат. Это имя — знак для меня. Его нахождение в руках еретиков категорически неприемлемо. Канон безопасности технологии велит приложить все усилия, чтобы освободить высокопоставленного носителя знания".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Предполагаю, что под этим именем скрывается благословенный Амарнат. Это имя — знак для меня. Его нахождение в руках еретиков категорически неприемлемо. Канон безопасности технологии велит приложить все усилия, чтобы освободить высокопоставленного носителя знания.
- guid: 38aa7940-3855-4d52-b010-2f5d6947ad44
  event: Companions_Techpriest_08
  text: '"Принято. Я продолжу свою деятельность в автономном статусе. Пусть Омниссия дарует тебе ясность пути". {n}В голосе Паскаля не звучит даже намека на какую-либо эмоцию.{/n}'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Принято. Я продолжу свою деятельность в автономном статусе. Пусть Омниссия дарует тебе ясность пути.
  - speaker: narrator
    text_clean: В голосе Паскаля не звучит даже намека на какую-либо эмоцию.
- guid: 3dafd414-9552-46f7-a334-17f13b9e1eb9
  event: Companions_Techpriest_09
  text: '"Принято. Шутка будет занесена в коммуникативный каталог".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Принято. Шутка будет занесена в коммуникативный каталог.
- guid: 17fc48a5-a8ae-4ddf-bfc7-1102f12d2cd4
  event: Companions_Techpriest_10
  text: '{n}Мехадендриты распластываются, словно крылья, за плечами техножреца.{/n} "Запрос одобрен, я не имею категорических запретов на разглашение данной информации".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Мехадендриты распластываются, словно крылья, за плечами техножреца.
  - speaker: Pasqal Haneumann
    text_clean: Запрос одобрен, я не имею категорических запретов на разглашение данной информации.
- guid: e639845a-5b78-479d-af18-9497d5be2781
  event: Companions_Techpriest_100
  text: '"Испытываю обеспокоенность касательно судьбы архимагоса Амарната. По данным Оптикона-22, он пропал после инцидента на механическом ковчеге "Герметико". Информация о данном корабле и его гибели удалена из архивов. Допускаю, что инцидент на корабле, сокрытие данных и покушение являются частями единого заговора".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Испытываю обеспокоенность касательно судьбы архимагоса Амарната. По данным Оптикона-22, он пропал после инцидента на механическом ковчеге "Герметико". Информация о данном корабле и его гибели удалена из архивов. Допускаю, что инцидент на корабле, сокрытие данных и покушение являются частями единого заговора.
- guid: 39e77968-dbb1-4171-92d2-373064bf69b3
  event: Companions_Techpriest_101
  text: '"Я продолжу изучение памяти блаженного мученика с приличествующим почтением".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: Pasqal Haneumann
    text_clean: Я продолжу изучение памяти блаженного мученика с приличествующим почтением.
- guid: af90b7e0-7524-47bc-8454-b156e3b8d394
  event: Companions_Techpriest_102
  text: '"Информация об инцидентах обнаружена в каталоге. Инциденты признаны незначимыми. Техническое дознание постановило, что наиболее вероятной причиной сбоев были грех кощунственной халатности, допущенный в процессе обряда лоботомирования. Сие постыдное небрежение дает теням мыслей и воспоминаний сервитора затаиться в уголках его разума, посвященного служению".'
  speaker: Pasqal Haneumann
  parts:
