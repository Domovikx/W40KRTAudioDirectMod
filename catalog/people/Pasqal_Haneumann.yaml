  event: Companions_Techpriest_46
  text: '{n}Шипение вокса похоже на мученический хрип.{/n} "Осуществляю постижение. Принципы работы ксеноаугментов чужды освященному Деус Механикус канону, но... квантифицируемы. Они кормятся моими кровью и зарядом моей силовой катушки, словно паразиты, я же кормлюсь их тайной и вынашиваю в себе новое понимание. Это болезненно. Это необходимо".'
