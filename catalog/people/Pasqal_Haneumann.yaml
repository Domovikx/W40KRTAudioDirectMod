  event: Companions_Techpriest_50
  text: '"Данное место взывает к Омниссии об акте очистительного и благостного ксеноцида. Пространственная дисгармония, наблюдаемая здесь, указывает на его анафематическую природу. Впрочем..." {n}Вокс некоторое время тихо шипит.{/n} "Полное истребление не рекомендовано. Носители технических знаний должны быть отловлены и подвергнуты допросу и вивисекции перед утилизацией".'
