  parts:
  - speaker: Pasqal Haneumann
    text_clean: 'Стратегическая рекомендация: анализ показал, что сообщество нелюдей разобщено конфликтами. Манипуляция разногласиями ксеносов может привести к обретению временных союзников, обладающих техническими средствами для возвращения единицы КЭП фон Валанциус в пространство реальности.'
