- guid: 3418b589-4a62-42aa-97fa-eb1303cac07e
  event: Companions_Techpriest_104
  text: '{n}Паскаль взирает на вас с уважением. Похоже, он удивлен, что вы распознали назначение вживленных в его тело аугментаций.{/n} "К тебе Омниссия тоже был щедр. Он даровал тебе понимание".'
  speaker: Pasqal Haneumann
  parts:
  - speaker: narrator
    text_clean: Паскаль взирает на вас с уважением. Похоже, он удивлен, что вы распознали назначение вживленных в его тело аугментаций.
