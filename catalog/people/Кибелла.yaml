    text_clean: '...непросто было осознать свою власть. Ведь я — не просто ткач. Я — лучшая из них. Избранная. В моей воле устанавливать правила, потому что я достаточно сильна, чтобы удержаться на нити Паутины без наставлений того, кто уже с Неумирающим!'
