  event: RMNC_Kibellah_FinalLabyrinth_14
  text: '{n}Вы вместе выходите из переплетений лабиринта. На мгновение руки Кибеллы бросаются к вашим, пальцы сплетаются в безмолвном приветствии — а затем отдергиваются назад, к лицу девушки. В приглушенном свете мелькает кинжал, вспарывающий аккуратные стежки. Кибелла взирает на вас обновленным взглядом:{/n} "Моя любовь..."'
  speaker: Кибелла
