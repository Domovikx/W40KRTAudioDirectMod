  event: RMNC_Kibellah_StartingEvent_RitualFight_19
  text: '{n}Кибелла выпрямляется и, убрав оружие, коротко кланяется.{/n} "Лабиринт принял тебя. Отныне нас связывает танец, что мы свершили среди переплетений линий и разумов".'
  speaker: Кибелла
  parts:
