  event: Companions_Kibellah_142
  text: '{n}Кибелла качает головой.{/n} "Нам должно остановить то, что протянуло между нами нить. Что мутит рассудок. Лишает мысли холода. Сбивает... с троп лабиринта..." {n}Ее пальцы дергаются, словно силясь отыскать нож.{/n} "Висирь... говорил..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла качает головой.
  - speaker: Кибелла
    text_clean: Нам должно остановить то, что протянуло между нами нить. Что мутит рассудок. Лишает мысли холода. Сбивает... с троп лабиринта...
  - speaker: narrator
    text_clean: Ее пальцы дергаются, словно силясь отыскать нож.
  - speaker: Кибелла
    text_clean: Висирь... говорил...
- guid: 2d0f3a33-e16e-458d-8557-b269a981105d
  event: Companions_Kibellah_143
  text: '"Тем сильнее моя горечь, что знаю я: хоть мой разум безустанно язвит тревога о тебе, твой же заботят иные тревоги. Об иной душе. С кем ты связал{mf||а} себя подобно нам с тобой".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: 'Тем сильнее моя горечь, что знаю я: хоть мой разум безустанно язвит тревога о тебе, твой же заботят иные тревоги. Об иной душе. С кем ты связал себя подобно нам с тобой.'
- guid: bb744b59-28dd-44c7-a359-2a4a96694b57
  event: Companions_Kibellah_144
  text: '{n}Кибелла склоняет голову на бок.{/n} "То, что ты называешь загадочностью, есть лишь разница в мирах, которым мы принадлежим. Ты вступил в мой лабиринт, а я стала твоей тенью. И все же... Мы непонятны друг другу, как и наши обычаи, и ритуалы. Едва ли то, что произошло на офицерской палубе, было тебе понятно во всей своей глубине".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла склоняет голову на бок.
  - speaker: Кибелла
    text_clean: То, что ты называешь загадочностью, есть лишь разница в мирах, которым мы принадлежим. Ты вступил в мой лабиринт, а я стала твоей тенью. И все же... Мы непонятны друг другу, как и наши обычаи, и ритуалы. Едва ли то, что произошло на офицерской палубе, было тебе понятно во всей своей глубине.
