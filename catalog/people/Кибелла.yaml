    text_clean: 'Вы вместе выходите из переплетений лабиринта. На мгновение руки Кибеллы бросаются к вашим, пальцы сплетаются в безмолвном приветствии — а затем отдергиваются назад, к лицу девушки. В приглушенном свете мелькает кинжал, вспарывающий аккуратные стежки. Кибелла взирает на вас обновленным взглядом:'
