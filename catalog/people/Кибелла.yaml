  event: Companions_Kibellah_17
  text: '{n}Вопрос застает Кибеллу врасплох.{/n} "Я... Второй ткач культа. Копье в дланях Неумирающего. Твоя тень, и щит, и клинок".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Вопрос застает Кибеллу врасплох.
  - speaker: Кибелла
