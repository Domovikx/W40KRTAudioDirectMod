  event: Companions_Kibellah_153
  text: '"Изворотливая Вил''Джай не ровня тебе — ни душой, ни помыслами. Ее пустые речи и нелепые деяния — цветная скорлупа, что не в силах спрятать изъязвленные остатки нетвердой веры".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Изворотливая Вил'Джай не ровня тебе — ни душой, ни помыслами. Ее пустые речи и нелепые деяния — цветная скорлупа, что не в силах спрятать изъязвленные остатки нетвердой веры.
- guid: 3f1efc32-d044-45c2-99c3-ef7d393bc3ad
  event: Companions_Kibellah_154
  text: '"Вил''Маражай... как мог{mf||ла} ты принять его в ряды своих верных? Он уже запустил когти в твою душу. Я чувствую его скверну в тебе. Вырви эту потаенную иглу, через которую он изопьет твою душу до дна".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вил'Маражай... как мог ты принять его в ряды своих верных? Он уже запустил когти в твою душу. Я чувствую его скверну в тебе. Вырви эту потаенную иглу, через которую он изопьет твою душу до дна.
- guid: dbda47c6-918c-4f22-a288-e2de99f56d70
  event: Companions_Kibellah_155
  text: '"Виновница нашего заточения, Вил''Ирлиэт! Твоя связь с ней — одна из причин того, что мы не узрели предательства! И ей ты доверяешь свою тень? Ей ты позволяешь дышать тем же воздухом, что дышим мы?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Виновница нашего заточения, Вил'Ирлиэт! Твоя связь с ней — одна из причин того, что мы не узрели предательства! И ей ты доверяешь свою тень? Ей ты позволяешь дышать тем же воздухом, что дышим мы?
