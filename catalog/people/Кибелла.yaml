- guid: 886ad4f6-c9a7-44ba-a19a-ee7c188dd9df
  event: RMNC_Kibellah_StartingEvent_RitualFight_14
  text: '"Мой путь в служении Неумирающему извилист и сложен. Любое сознание исполнено слабостей, и только постоянное оттачивание его способно закалить разум и внимание. Я представляю себе Завет Паутины в виде лабиринта, полного тупиков и переплетений ходов. Погружаясь в транс, боевой или духовный, я прохожу этот путь. Теперь ты будешь со мной, когда я войду в лабиринт вновь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мой путь в служении Неумирающему извилист и сложен. Любое сознание исполнено слабостей, и только постоянное оттачивание его способно закалить разум и внимание. Я представляю себе Завет Паутины в виде лабиринта, полного тупиков и переплетений ходов. Погружаясь в транс, боевой или духовный, я прохожу этот путь. Теперь ты будешь со мной, когда я войду в лабиринт вновь.
- guid: e05556f4-0700-4fe3-b63c-4d3cdd4fb36d
  event: RMNC_Kibellah_StartingEvent_RitualFight_15
  text: '"Быть может, ты сочтешь это странным. Ты живешь в мире столь далеком от меня, что подобные ритуалы кажутся тебе нелепыми". {n}Она позволяет себе чуть улыбнуться уголками губ, в обычно отстраненных глазах вспыхивает искра смущенного любопытства.{/n} "Думаю, твои ритуалы я бы сочла не менее причудливыми".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Быть может, ты сочтешь это странным. Ты живешь в мире столь далеком от меня, что подобные ритуалы кажутся тебе нелепыми.
  - speaker: narrator
    text_clean: Она позволяет себе чуть улыбнуться уголками губ, в обычно отстраненных глазах вспыхивает искра смущенного любопытства.
  - speaker: Кибелла
    text_clean: Думаю, твои ритуалы я бы сочла не менее причудливыми.
- guid: edd78c30-a582-4b36-8ff6-31a75017992f
  event: RMNC_Kibellah_StartingEvent_RitualFight_16
  text: '"Принять участие в вашей церемонии?" {n}Кибелла задумывается, а затем почтительно кланяется.{/n} "Я... "верну любезность" — так у вас, наверху, говорят? Я буду ждать приглашения".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Принять участие в вашей церемонии?
  - speaker: narrator
    text_clean: Кибелла задумывается, а затем почтительно кланяется.
  - speaker: Кибелла
    text_clean: Я... "верну любезность" — так у вас, наверху, говорят? Я буду ждать приглашения.
- guid: 02a0aa52-3d52-4d52-a0f1-58738f7342fd
  event: RMNC_Kibellah_StartingEvent_RitualFight_17
  text: '{n}Кибелла прищуривается.{/n} "Твой мир чужд мне, Домин''{name}. Но знание его позволит мне лучше служить тебе — и Неумирающему. Дозволь же мне взглянуть на один из ритуалов, что наполняют твою жизнь. Я буду благодарна".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла прищуривается.
  - speaker: Кибелла
    text_clean: Твой мир чужд мне, Домин'КЭП. Но знание его позволит мне лучше служить тебе — и Неумирающему. Дозволь же мне взглянуть на один из ритуалов, что наполняют твою жизнь. Я буду благодарна.
- guid: 97a30340-a50c-4ff4-99d7-406b134bb5fa
  event: RMNC_Kibellah_StartingEvent_RitualFight_18
  text: '{n}Кивок в ответ.{/n} "Мы останемся на своих тропах".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кивок в ответ.
  - speaker: Кибелла
