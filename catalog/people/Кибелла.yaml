- guid: faaf4261-8007-4069-b7e9-5160d500ad34
  event: RMNC_Kibellah_StartingEvent_RitualFight_13
  text: '{n}Кибелла вздергивает подбородок.{/n} "Понять... меня? Зачем, Домин''{name}? Моя участь предопределена, роли назначены, каждому из нас должно служить Неумирающему как предназначено..." {n}Кибелла колеблется. На секунду ее бровь изгибается в заломе.{/n} "Впрочем, если ты действительно желаешь знать..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла вздергивает подбородок.
  - speaker: Кибелла
    text_clean: Понять... меня? Зачем, Домин'КЭП? Моя участь предопределена, роли назначены, каждому из нас должно служить Неумирающему как предназначено...
  - speaker: narrator
    text_clean: Кибелла колеблется. На секунду ее бровь изгибается в заломе.
