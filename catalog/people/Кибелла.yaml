  event: RMNC_Kibellah_FinalLabyrinth_32
  text: '{n}Кибелла пронзительно вскрикивает. Вскинув руку к горлу, словно задыхаясь — или пытаясь удавить желание напасть? — она выгибается дугой... а затем вы и сами не замечаете, как она покидает ваши покои.{/n}'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла пронзительно вскрикивает. Вскинув руку к горлу, словно задыхаясь — или пытаясь удавить желание напасть? — она выгибается дугой... а затем вы и сами не замечаете, как она покидает ваши покои.
- guid: 30791b5e-55f7-4447-be37-a3a48de2cf43
  event: RMNC_Kibellah_StartingEvent_RitualFight_01
  text: '{n}Кибелла причудливо двигается в подобии разминки, движения которой следуют некоему таинственному узору.{/n} "Готов{mf||а} ли ты вступить в лабиринт, Домин''{name}?"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла причудливо двигается в подобии разминки, движения которой следуют некоему таинственному узору.
  - speaker: Кибелла
    text_clean: Готов ли ты вступить в лабиринт, Домин'КЭП?
- guid: 09f3c468-9e63-48a8-a916-fb6fad3de3c2
  event: RMNC_Kibellah_StartingEvent_RitualFight_02
  text: '"Ты — вершитель{mf||ница} воли Неумирающего, но... Я гляжу на места, где проходит твоя жизнь, и удивляюсь. Кажется, стезя твоя менее строга и требовательна к мыслям и деяниям. Вокруг нас много..." {n}Она задумывается.{/n} "...блеска".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты — вершитель воли Неумирающего, но... Я гляжу на места, где проходит твоя жизнь, и удивляюсь. Кажется, стезя твоя менее строга и требовательна к мыслям и деяниям. Вокруг нас много...
  - speaker: narrator
    text_clean: Она задумывается.
  - speaker: Кибелла
    text_clean: '...блеска.'
- guid: 547bb746-9e69-448f-aade-b93c80326535
  event: RMNC_Kibellah_StartingEvent_RitualFight_04
  text: '{n}Кибелла извлекает на свет полуизогнутый клинок и протягивает его вам.{/n} "Твое оружие для ритуала. Взгляни на линии на полу: переступать ты можешь лишь там, где есть разрывы. Прочее знать не нужно". {n}Она отрывисто кланяется и принимает стойку.{/n} "Вступи же в лабиринт, Домин''{name}!"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла извлекает на свет полуизогнутый клинок и протягивает его вам.
  - speaker: Кибелла
    text_clean: 'Твое оружие для ритуала. Взгляни на линии на полу: переступать ты можешь лишь там, где есть разрывы. Прочее знать не нужно.'
  - speaker: narrator
    text_clean: Она отрывисто кланяется и принимает стойку.
  - speaker: Кибелла
    text_clean: Вступи же в лабиринт, Домин'КЭП!
- guid: 45138d55-51dd-4a7b-b77c-183e1764e808
  event: RMNC_Kibellah_StartingEvent_RitualFight_05
  text: '"Ритуал связывания, Домин''{name}. Наши судьбы сплелись волей Неумирающего, однако мне нужно ввести тебя в мой мысленный лабиринт. Пускай блуждания в нем в поисках ответов на вопросы — моя участь, но образ твой должен быть в его переплетениях, ибо я — твоя тень, и присутствие твое поможет мне чувствовать угрозы, нависшие над повелител{mf|ем|ьницей}".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ритуал связывания, Домин'КЭП. Наши судьбы сплелись волей Неумирающего, однако мне нужно ввести тебя в мой мысленный лабиринт. Пускай блуждания в нем в поисках ответов на вопросы — моя участь, но образ твой должен быть в его переплетениях, ибо я — твоя тень, и присутствие твое поможет мне чувствовать угрозы, нависшие над повелителем.
- guid: ecab1286-2576-4acf-b532-e03ac530e629
  event: RMNC_Kibellah_StartingEvent_RitualFight_06
  text: '"Наставления идущему. Символ головоломки, разгадать которую можно лишь в своем сознании, следуя ее извивам. Я едва ли по настоящему нуждаюсь в этих линиях на полу, однако для тебя... для тебя они станут путеводной нитью".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Наставления идущему. Символ головоломки, разгадать которую можно лишь в своем сознании, следуя ее извивам. Я едва ли по настоящему нуждаюсь в этих линиях на полу, однако для тебя... для тебя они станут путеводной нитью.
- guid: ffbb5d8e-8d84-470e-9a9f-6d805f601eb4
  event: RMNC_Kibellah_StartingEvent_RitualFight_07
  text: '{n}Дыхание Кибеллы ровное, а в ее торжественном выражении лица не изменилось ровным счетом ничего.{/n} "Отныне ты на тропе. Отныне твоя тень ступает в лабиринте, и мой взор видит, когда тебе грозит опасность". {n}Ее губы продолжают шевелиться, но взгляд опускается и блуждает по полу, словно следуя изгибам начертанных линий.{/n}'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Дыхание Кибеллы ровное, а в ее торжественном выражении лица не изменилось ровным счетом ничего.
  - speaker: Кибелла
    text_clean: Отныне ты на тропе. Отныне твоя тень ступает в лабиринте, и мой взор видит, когда тебе грозит опасность.
  - speaker: narrator
    text_clean: Ее губы продолжают шевелиться, но взгляд опускается и блуждает по полу, словно следуя изгибам начертанных линий.
- guid: 430ddbbb-cf01-4252-9d7c-c5a9eda2b4d0
  event: RMNC_Kibellah_StartingEvent_RitualFight_08
  text: '"Благодарю тебя, Домин''{name}. Верь мне, когда я говорю, что это было важно. Для меня. Для нашей связи".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Благодарю тебя, Домин'КЭП. Верь мне, когда я говорю, что это было важно. Для меня. Для нашей связи.
- guid: 1ccf2630-052d-4ccf-bc46-936908ade762
  event: RMNC_Kibellah_StartingEvent_RitualFight_10
  text: '"Это не забава и не "артефакт", Домин''{name}. Твое непонимание не означает бессмысленность происходящего".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Это не забава и не "артефакт", Домин'КЭП. Твое непонимание не означает бессмысленность происходящего.
- guid: d658f37e-ef64-4fbc-904c-6e2c8fb996e0
  event: RMNC_Kibellah_StartingEvent_RitualFight_11
  text: '{n}Кибелла бросает на вас настороженный взгляд.{/n} "Тебе нет нужды пытаться понять происходящее. Ты принял{mf||а} участие в ритуале. Этого достаточно".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла бросает на вас настороженный взгляд.
  - speaker: Кибелла
    text_clean: Тебе нет нужды пытаться понять происходящее. Ты принял участие в ритуале. Этого достаточно.
