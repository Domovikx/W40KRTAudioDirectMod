  event: Companions_Kibellah_151
  text: '"Вени''Кассия... я видела, как она взирает на тебя. Как ты взираешь на нее. Ты жаждешь ее трепетной души... зачем? Потому что ее легко сломить?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вени'Кассия... я видела, как она взирает на тебя. Как ты взираешь на нее. Ты жаждешь ее трепетной души... зачем? Потому что ее легко сломить?
- guid: e223ab7d-16a8-4d57-ab3b-43641770ac0d
  event: Companions_Kibellah_152
  text: '"Вени''Хейнрикс приставлен к тебе как страж — ты надеешься затуманить его разум, усыпить бдительность? Подобные ритуалы недостойны тебя, Домин''{name}!"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вени'Хейнрикс приставлен к тебе как страж — ты надеешься затуманить его разум, усыпить бдительность? Подобные ритуалы недостойны тебя, Домин'КЭП!
