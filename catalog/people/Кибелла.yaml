  event: Companions_Kibellah_19
  text: '{n}Кибелла настороженно наблюдает за тем, как вы оскверняете свою плоть.{/n} "Довольно". {n}Черный клинок исчезает из ваших рук.{/n} "Священный ритуал ты превратил{mf||а} в осмеяние — пускай. Завет Паутины велит не держать зла. Но и участвовать в подобном я не желаю".'
