  - speaker: Кибелла
    text_clean: Но Висирь даже в помыслах не бывал в месте столь отравленном, как это...
- guid: 4647ffca-1890-4129-a47b-ed1bf0c5c2d5
  event: Companions_Kibellah_15
  text: '{n}Кибелла поднимает руку с черепом до уровня ваших глаз и щелкает костяной челюстью.{/n} "Выродок. Бывший враг твой. Вечный враг Его. Мой нынешний спутник-в-тенях и трофей. Раньше ты знал{mf||а} его под именем Немезит, но мне показалось, что "Немо" подходит ему больше".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла поднимает руку с черепом до уровня ваших глаз и щелкает костяной челюстью.
  - speaker: Кибелла
    text_clean: Выродок. Бывший враг твой. Вечный враг Его. Мой нынешний спутник-в-тенях и трофей. Раньше ты знал его под именем Немезит, но мне показалось, что "Немо" подходит ему больше.
