  event: Companions_Kibellah_156
  text: '"Тогда следуй за мной, Домин''{name}".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тогда следуй за мной, Домин'КЭП.
- guid: 9ab4ebb2-bc0d-47d6-bb5c-28d9e09af4b1
  event: Companions_Kibellah_16
  text: '"Да сокроет Неумирающий шаги твои от слуха неверных".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Да сокроет Неумирающий шаги твои от слуха неверных.
