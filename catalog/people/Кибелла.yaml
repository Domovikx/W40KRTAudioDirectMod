  event: Companions_Kibellah_149
  text: '{n}Кибелла стискивает кулаки.{/n} "Заповеди Кровавой паутины дают нам цель и предназначение пред Ним! Как можно помыслить..." {n}Она стонет словно от боли.{/n} "Но Висирь даже в помыслах не бывал в месте столь отравленном, как это..."'
