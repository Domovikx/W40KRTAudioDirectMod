  event: RMNC_Kibellah_FinalLabyrinth_10
  text: '"Когда я только вступила в твой мир, мир неги и роскоши, меня спутывали обеты, наставления..." {n}Кибелла движется с особой, хищной грацией.{/n} "Все, что есть удел ткачей Кровавой паутины. Понадобилось время, чтобы понять: эти оковы не для меня. Они для тех, кто боится таких, как мы. Боится тех, кто выше. Сильнее. Я — не ровня этим ничтожествам".'
