  event: Companions_Kibellah_146
  text: '{n}Кибелла задумывается. В глазах ее вспыхивает огонек любопытства.{/n} "Я бы не отказалась узнать твой мир лучше. Взглянуть на ваши ритуалы, Домин''{name}. Вместе с тобой".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла задумывается. В глазах ее вспыхивает огонек любопытства.
  - speaker: Кибелла
    text_clean: Я бы не отказалась узнать твой мир лучше. Взглянуть на ваши ритуалы, Домин'КЭП. Вместе с тобой.
