  text: '"...и тем лучшим клинком я буду слуге Неумирающего". {n}Кибелла склоняет голову на несколько секунд.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: '...и тем лучшим клинком я буду слуге Неумирающего.'
  - speaker: narrator
    text_clean: Кибелла склоняет голову на несколько секунд.
- guid: fe031451-8353-4826-9cf1-40ac39a95ffd
  event: ''
  text: '"Я смогла восстановить транс, изгнать чуждые мысли. Но само это событие тревожит меня". {n}Она умолкает на несколько секунд.{/n} "Ты... дорог{mf||а} мне. Больше, чем я думала изначально. Но мой долг — служить Неумирающему. Быть может..." {n}Кибелла запинается, а потом пристально смотрит вам в глаза.{/n} "...твое присутствие в моих мыслях, в моем лабиринте... неугодно Завету?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я смогла восстановить транс, изгнать чуждые мысли. Но само это событие тревожит меня.
  - speaker: narrator
    text_clean: Она умолкает на несколько секунд.
  - speaker: Кибелла
    text_clean: Ты... дорог мне. Больше, чем я думала изначально. Но мой долг — служить Неумирающему. Быть может...
  - speaker: narrator
    text_clean: Кибелла запинается, а потом пристально смотрит вам в глаза.
  - speaker: Кибелла
    text_clean: '...твое присутствие в моих мыслях, в моем лабиринте... неугодно Завету?'
- guid: 70dbde85-7cb1-4149-b183-af658e22fcf0
  event: BNTRS_Companion_DLC3_Kibellah_18
  text: '"Я не ищу в вере пользы для тела, алый жрец. Я укрепляю силу собственной души и взращиваю волю, умерщвляя плоть и отказываясь от ее соблазнов".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я не ищу в вере пользы для тела, алый жрец. Я укрепляю силу собственной души и взращиваю волю, умерщвляя плоть и отказываясь от ее соблазнов.
- guid: cf67c246-2bb6-478e-a2eb-6342a84809c0
  event: BNTRS_Companion_DLC3_Kibellah_43
  text: '"Череп друга, что ты носишь с собой, жрец. Это твое вечное напоминание о Неумирающем, не так ли?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Череп друга, что ты носишь с собой, жрец. Это твое вечное напоминание о Неумирающем, не так ли?
- guid: 0e69c376-48d0-465c-8927-6b8709124dbc
  event: BNTRS_Companion_DLC3_Kibellah_88
  text: '"Ты присутствуешь в святилище, не в мясницком зале. Прояви же уважение к нашим святыням".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты присутствуешь в святилище, не в мясницком зале. Прояви же уважение к нашим святыням.
- guid: a824d818-08c1-443c-949d-abc26106a62d
  event: BNTRS_DLC2_Kibellah_128
  text: '"Амик''Соломон был не прав: Домин стоит выше закона, ибо исполняет волю Неумирающего. Потому Он и прошептал имя слуги своего".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: 'Амик''Соломон был не прав: Домин стоит выше закона, ибо исполняет волю Неумирающего. Потому Он и прошептал имя слуги своего.'
- guid: ef35f854-0a1c-463b-a56f-353f6927abf5
  event: BNTRS_DLC2_Kibellah_13
  text: '"Мы оба убиваем по велению Неумирающего. Почему же ты так решительно отвергаешь наше сходство, Амик''Соломон?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мы оба убиваем по велению Неумирающего. Почему же ты так решительно отвергаешь наше сходство, Амик'Соломон?
- guid: 1fe66ff6-efdd-4e48-8fe9-bf1085bb4cf9
  event: BNTRS_DLC2_Kibellah_157
  text: '"Этот корабль должно напитать кровью врагов Домин, ибо такова воля Его. Кровавая паутина оплетет его нутро. Отсечет нити отступников".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Этот корабль должно напитать кровью врагов Домин, ибо такова воля Его. Кровавая паутина оплетет его нутро. Отсечет нити отступников.
- guid: b56b245f-1688-48a8-bf3c-3937781b738d
  event: BNTRS_DLC2_Kibellah_164
  text: '"Их кровавый танец больше похож на марш. И все же я чувствую родство в том, как мы казним неугодных Неумирающему".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Их кровавый танец больше похож на марш. И все же я чувствую родство в том, как мы казним неугодных Неумирающему.
- guid: 7bfb18e5-7ee1-4e33-9873-0d184053d48f
  event: BNTRS_DLC2_Kibellah_182
  text: '"Не думала, что соглашусь с тобой, Вил''Джай. Неважно, куда клонятся чаши весов, если Неумирающий шепчет иначе. Ты — живое тому доказательство".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Не думала, что соглашусь с тобой, Вил'Джай. Неважно, куда клонятся чаши весов, если Неумирающий шепчет иначе. Ты — живое тому доказательство.
- guid: f3552c63-baa5-415b-b020-20eef5d4fa29
  event: BNTRS_DLC2_Kibellah_220
  text: '"Не тебе, Амик''Соломон, рассуждать о боли. Своей ты позволил поглотить себя и стать гневом. Моя же боль всегда — точило для духа".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Не тебе, Амик'Соломон, рассуждать о боли. Своей ты позволил поглотить себя и стать гневом. Моя же боль всегда — точило для духа.
- guid: 976940b2-a454-4d67-a6d8-bbbd929b772e
  event: BNTRS_DLC2_Kibellah_284
  text: '"Ты радеешь, чтобы рядом с Домин не было недостойного. Того, кто бы предал или обманул. Только потому я прощаю тебе слова, что чернят нашу священную связь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты радеешь, чтобы рядом с Домин не было недостойного. Того, кто бы предал или обманул. Только потому я прощаю тебе слова, что чернят нашу священную связь.
- guid: 0e794c8d-26c2-40d2-9a97-ec5b66629eb7
  event: BNTRS_DLC2_Kibellah_32
  text: '"Ты видишь угрозу в моих ритуалах. Но на самом деле твой главный враг — это страх. Я не боюсь ступать по лезвию закона, которому ты поклоняешься. Или против него. Если это значит оставаться верной Неумирающему".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты видишь угрозу в моих ритуалах. Но на самом деле твой главный враг — это страх. Я не боюсь ступать по лезвию закона, которому ты поклоняешься. Или против него. Если это значит оставаться верной Неумирающему.
- guid: 3b52b66d-b76f-49b9-87c4-0c8abfb37835
  event: BNTRS_DLC2_Kibellah_339
  text: '"Нить предателя извивается, словно змея. Но теперь двое священных палачей идут по следу его. Неумирающий получит черную душу еретика для своего суда, клянусь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Нить предателя извивается, словно змея. Но теперь двое священных палачей идут по следу его. Неумирающий получит черную душу еретика для своего суда, клянусь.
- guid: 6088c6a5-4d03-45e9-b7a6-52c81ba6df81
  event: BNTRS_DLC2_Kibellah_357
  text: '"Мое сердце будет спокойно, раз Амик''Соломон и его зверь стерегут сон Домин. И что Вил''Джай не пробралась змеей в те священные палаты".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мое сердце будет спокойно, раз Амик'Соломон и его зверь стерегут сон Домин. И что Вил'Джай не пробралась змеей в те священные палаты.
- guid: 42227614-e196-429c-bfe9-169f7c6ff6d3
  event: BNTRS_DLC2_Kibellah_95
  text: '"Сытая жизнь туманит ум и развращает дух. Испытания — вот, что делает подданных Домин сильнее".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Сытая жизнь туманит ум и развращает дух. Испытания — вот, что делает подданных Домин сильнее.
- guid: 0b590fbb-a3c1-40dc-90fd-115c3c57758a
  event: BNTRS_DLC2_Kibellah_97
  text: '"Тот, кто обрывает чужие нити по собственному разумению, ставит свою волю превыше воли Неумирающего. И однажды шепот Его станет громом над их головами".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тот, кто обрывает чужие нити по собственному разумению, ставит свою волю превыше воли Неумирающего. И однажды шепот Его станет громом над их головами.
- guid: af03c3ea-cf19-4ced-99db-9a7400f8e16b
  event: BNTRS_DLC3_Kibellah_07
  text: '"Охота священна для этих мест. Я с благовением исполню этот ритуал, чтобы почтить Его замысел".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Охота священна для этих мест. Я с благовением исполню этот ритуал, чтобы почтить Его замысел.
- guid: 4008af6a-e6f6-433a-8d9a-1857f0d96534
  event: BNTRS_DLC3_Kibellah_116
  text: '"Взгляд Неумирающего не обращается к тем, кто избегает страданий. И не дарит откровение тем, кто боится пролить кровь ради него".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Взгляд Неумирающего не обращается к тем, кто избегает страданий. И не дарит откровение тем, кто боится пролить кровь ради него.
- guid: cac9d63a-1297-4ce5-862f-c259408e4105
  event: BNTRS_DLC3_Kibellah_122
  text: '"Эти солдаты несут свой долг перед Неумирающим долгие столетия. Их молитвы схожи с нашими, как нити разных паутин, ведущих к одной Ткачихе".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Эти солдаты несут свой долг перед Неумирающим долгие столетия. Их молитвы схожи с нашими, как нити разных паутин, ведущих к одной Ткачихе.
- guid: 8685d809-1bbe-4c43-a671-38f28f1586f5
  event: BNTRS_DLC3_Kibellah_28
  text: '"Они — истинные сыны Неумирающего. Даже в столь плачевном положении их души кричат в дарованной Им ярости, а тела... застыли, скованные муками. Скорбная участь для самоотверженных и доблестных воинов, Домин. Негоже оставлять их, не даровав избавления".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Они — истинные сыны Неумирающего. Даже в столь плачевном положении их души кричат в дарованной Им ярости, а тела... застыли, скованные муками. Скорбная участь для самоотверженных и доблестных воинов, Домин. Негоже оставлять их, не даровав избавления.
- guid: 3d263dfa-6335-4a19-9074-6c5534548df7
  event: BNTRS_DLC3_Kibellah_42
  text: '"Все эти создания, и неразумные, и чужаки, отмечены Неумирающим, но балансируют на грани между жизнью и смертью, обреченные на вечную пытку полусуществования. Тот, кто превратил их в это, насмехается над законами бытия. Сколь велико мое желание исправить это..."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Все эти создания, и неразумные, и чужаки, отмечены Неумирающим, но балансируют на грани между жизнью и смертью, обреченные на вечную пытку полусуществования. Тот, кто превратил их в это, насмехается над законами бытия. Сколь велико мое желание исправить это...
- guid: fc9e4892-6626-4ef7-9f97-16d662831ddf
  event: BNTRS_DLC3_Kibellah_60
  text: '"Кровавая паутина превозносит как умение прервать жизнь, так и искусство продолжить ее во благо служения Неумирающему".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Кровавая паутина превозносит как умение прервать жизнь, так и искусство продолжить ее во благо служения Неумирающему.
- guid: b2256fc7-13a1-4fd1-b221-d97750724245
  event: BNTRS_DLC3_Kibellah_65
  text: '"Лишь здесь, рядом с пролитой кровью, свершается спасение, Вени''Кассия."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Лишь здесь, рядом с пролитой кровью, свершается спасение, Вени'Кассия.
- guid: b613f1de-385a-4699-af23-f0656fa5cde7
  event: BNTRS_DLC3_Kibellah_88
  text: '"Ты молишься за людей, Амик''Соломон, хотя знаешь, что Неумирающий придет за ними в тот момент, когда это потребуется. Сколь... сентиментальное поведение".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты молишься за людей, Амик'Соломон, хотя знаешь, что Неумирающий придет за ними в тот момент, когда это потребуется. Сколь... сентиментальное поведение.
- guid: 6dac2039-0012-4623-b6e3-086b31e2b038
  event: BNTRS_MGZ_Kibellah_01
  text: '"Слишком много пустоты. Кажется, будто в любой миг она оторвет тебя от земли и унесет в себя".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Слишком много пустоты. Кажется, будто в любой миг она оторвет тебя от земли и унесет в себя.
- guid: 02bd4942-7553-4e04-9707-2196f0b5c65e
  event: BNTRS_MGZ_Kibellah_02
  text: '"Столица смердит святотатством — слишком многие здесь ушли прежде, чем Неумирающий того пожелал".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Столица смердит святотатством — слишком многие здесь ушли прежде, чем Неумирающий того пожелал.
- guid: 4cafa046-c053-4b87-867b-32c381d89d60
  event: BNTRS_MGZ_Kibellah_03
  text: '"Возможно, Неумирающий послал нас, чтобы принести последний дар Его милости тем, кто выжил".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Возможно, Неумирающий послал нас, чтобы принести последний дар Его милости тем, кто выжил.
- guid: 8c5fabbc-67db-4e1f-bc81-cab11e97837a
  event: BNTRS_MGZ_Kibellah_04
  text: '"Их язык насилия — богохульная пародия искусства Кровавой паутины. Через порезы и проколы мы обращаемся к Неумирающему, а они — кривляются пред ликом небытия".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Их язык насилия — богохульная пародия искусства Кровавой паутины. Через порезы и проколы мы обращаемся к Неумирающему, а они — кривляются пред ликом небытия.
- guid: a2998c85-fcd6-4ecb-a17c-a746857ba109
  event: BNTRS_MGZ_Kibellah_05
  text: '"Неумирающий не заботится о душах ксеносов, и потому посмертие их ужасно".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий не заботится о душах ксеносов, и потому посмертие их ужасно.
- guid: 9f8cba44-f145-494e-9cd9-9ff889c65519
  event: BNTRS_MGZ_Kibellah_06
  text: '"Святость храма заключена не в высоте его сводов, но в щедрости жертв, возносимых в нем".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Святость храма заключена не в высоте его сводов, но в щедрости жертв, возносимых в нем.
- guid: c25a209b-13e8-40e2-b48e-522607cda297
  event: BNTRS_MGZ_Kibellah_07
  text: '"Хорошее место. Похоже на грузовую магистраль флагмана. Почти дом".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Хорошее место. Похоже на грузовую магистраль флагмана. Почти дом.
- guid: b1aefa7a-d20e-4c29-a00a-9c695829a481
  event: BNTRS_MGZ_Kibellah_08
  text: '"Сколь бы ни разнился канон, которому мы следуем, здесь он сходится в одно. Пойдем вершить его вместе как сестры".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Сколь бы ни разнился канон, которому мы следуем, здесь он сходится в одно. Пойдем вершить его вместе как сестры.
- guid: 1df2f576-12c6-41fa-a208-cd9f61ea1f3a
  event: BNTRS_MGZ_Kibellah_09
  text: '"Я никогда не думала, что подобное буйство жизни может существовать где-то. Почему Неумирающий не позволяет ему быть в пустоте, где обретаемся мы?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я никогда не думала, что подобное буйство жизни может существовать где-то. Почему Неумирающий не позволяет ему быть в пустоте, где обретаемся мы?
- guid: 8c24f6b1-8a0e-4650-80ab-36dee1c6f1b4
  event: BNTRS_MGZ_Kibellah_10
  text: '"Хозяева этого места заслужили такой почет? Они — избранные слуги Неумирающего?.. Или они восславляют себя, а не Его?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Хозяева этого места заслужили такой почет? Они — избранные слуги Неумирающего?.. Или они восславляют себя, а не Его?
- guid: 7b64d389-601e-49d4-95bb-f6d077565cd3
  event: BNTRS_MGZ_Kibellah_11
  text: '"Эта роскошь прижимает к земле, как гравитационная хватка сего мира. Золоченное ярмо".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Эта роскошь прижимает к земле, как гравитационная хватка сего мира. Золоченное ярмо.
- guid: cf447b6d-4c2b-443b-9939-031cd40aeb3a
  event: BNTRS_MGZ_Kibellah_12
  text: '"Ткачам иногда приходится навещать этот отсек и забирать лишних, растрачивающих ресурс отсека".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ткачам иногда приходится навещать этот отсек и забирать лишних, растрачивающих ресурс отсека.
- guid: 6e9736ea-c699-4f65-8719-e4b57e8feabd
  event: BNTRS_MGZ_Kibellah_13
  text: '"Неумирающий не отпускает души верных от себя. А Домин''Теодора — слишком священная особа, чтобы не отыскать путь к Его Трону".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий не отпускает души верных от себя. А Домин'Теодора — слишком священная особа, чтобы не отыскать путь к Его Трону.
- guid: a259416b-84c5-484c-a300-89deebdc901d
  event: BNTRS_MGZ_Kibellah_14
  text: '"Священные отступники от истинного облика Человека. Так странно понимать, что Неумирающий даровал привилегии неприкосновенности подобным... слугам Его".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Священные отступники от истинного облика Человека. Так странно понимать, что Неумирающий даровал привилегии неприкосновенности подобным... слугам Его.
- guid: 5f049f2d-26b7-4b4c-860f-ae04810a1aa4
  event: BNTRS_MGZ_Kibellah_15
  text: '"Это правда. Большинство грешников невозможно исправить, лишь поработить или убить. Как тебя".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Это правда. Большинство грешников невозможно исправить, лишь поработить или убить. Как тебя.
- guid: 14152c3a-1eb2-42db-9a3e-ad88d1271101
  event: BNTRS_MGZ_Kibellah_16
  text: '"Вени''Хейнрикс прав. Шепоты Его утихли, а расклад Таро, что я сделала, был смутен и запутан. Что-то идет".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вени'Хейнрикс прав. Шепоты Его утихли, а расклад Таро, что я сделала, был смутен и запутан. Что-то идет.
- guid: b44393ce-f34d-47e6-85d6-20c1c5e8a00e
  event: BNTRS_MGZ_Kibellah_17
  text: '"Возможно, Неумирающий не забрал его вовремя, и он занимает не свое место. Мы скоро узнаем".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Возможно, Неумирающий не забрал его вовремя, и он занимает не свое место. Мы скоро узнаем.
- guid: 605600b7-944d-46e3-87c8-c013f1604582
  event: BNTRS_MGZ_Kibellah_18
  text: '"Я слышу шепоты, но не Его... Нечто спит во мраке. Или делает вид, что спит".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я слышу шепоты, но не Его... Нечто спит во мраке. Или делает вид, что спит.
- guid: d706c018-d8c2-4f49-9077-8124e676dcee
  event: BNTRS_PickUps_Kibellah_02
  text: '"Нет горя в том, чтобы ступить на нить служения Ему рано. Горе — ступить на нее слишком поздно. Не жалей меня".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Нет горя в том, чтобы ступить на нить служения Ему рано. Горе — ступить на нее слишком поздно. Не жалей меня.
- guid: 07367fac-faa1-429b-be29-e53e0c31649a
  event: BNTRS_PickUps_Kibellah_04
  text: '"Возможно, в них ты видишь упрек своей аскезе? Моя броня покрыта патиной и пылью, твоя — сверкает. Ты чтишь себя, я — просто орудие".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Возможно, в них ты видишь упрек своей аскезе? Моя броня покрыта патиной и пылью, твоя — сверкает. Ты чтишь себя, я — просто орудие.
- guid: f88bc351-fa87-4e40-ab5c-355a9ac34056
  event: BNTRS_PickUps_Kibellah_06
  text: '"Чтобы служить Неумирающему, должно отсечь лишнее. Ты зришь самоотречение. Ты зришь долг".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Чтобы служить Неумирающему, должно отсечь лишнее. Ты зришь самоотречение. Ты зришь долг.
- guid: ad75a79f-8767-438c-8a16-5fa292afe518
  event: BNTRS_PickUps_Kibellah_09
  text: '"Я слышу, к чему ты клонишь, и мне не нравятся твои подозрения. Предупреждаю — если ты желаешь наречь благодать Неумирающего грехом псайкерства, ты ответишь за это кровью".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я слышу, к чему ты клонишь, и мне не нравятся твои подозрения. Предупреждаю — если ты желаешь наречь благодать Неумирающего грехом псайкерства, ты ответишь за это кровью.
- guid: 6b005185-19ad-4e5d-af2a-05a2f94ab638
  event: BNTRS_PickUps_Kibellah_10
  text: '"Так говоришь ты. А на деле желаешь, чтобы иным стало лишь имя того, кто отдает мне приказы. Но я уже тень Домин".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Так говоришь ты. А на деле желаешь, чтобы иным стало лишь имя того, кто отдает мне приказы. Но я уже тень Домин.
- guid: 107c1a4f-d297-4ea5-8648-27c20506c6f9
  event: BNTRS_PickUps_Kibellah_106
  text: '"Твоя тревога напрасна. Если Неумирающий прошепчет твое имя, Домин не будет тебя забирать. Тебя заберу я, и сделаю это с почтением".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твоя тревога напрасна. Если Неумирающий прошепчет твое имя, Домин не будет тебя забирать. Тебя заберу я, и сделаю это с почтением.
- guid: ddbc8fce-f6b8-4956-9ade-5a1afb485970
  event: BNTRS_PickUps_Kibellah_115
  text: '"Я слышу голоса мертвецов... Так явно, словно они стоят за спиной".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я слышу голоса мертвецов... Так явно, словно они стоят за спиной.
- guid: 8b60b3b5-404c-44b7-8376-1e1121ce21e8
  event: BNTRS_PickUps_Kibellah_122
  text: '"Костям ушедших должно служить живым: в обрядах, в гаданиях, оберегами. Отчего они пылятся здесь, утаенные от взоров?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: 'Костям ушедших должно служить живым: в обрядах, в гаданиях, оберегами. Отчего они пылятся здесь, утаенные от взоров?'
- guid: 222a1f81-22a5-47b2-bb7a-7ccde314b9e8
  event: BNTRS_PickUps_Kibellah_13
  text: '"Не переступай черты, или будешь наказана за богохульство, ведьма. На мне лежит благословение Неумирающего, а не порча, которой запятнана ты".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Не переступай черты, или будешь наказана за богохульство, ведьма. На мне лежит благословение Неумирающего, а не порча, которой запятнана ты.
- guid: d3cb4f3c-da6e-497b-8ced-e93e6c99fcfb
  event: BNTRS_PickUps_Kibellah_136
  text: '"Смерть прошептала множество имен, но на наших... осеклась. Не здесь. Не сейчас. Не сегодня".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Смерть прошептала множество имен, но на наших... осеклась. Не здесь. Не сейчас. Не сегодня.
- guid: 8a38f035-b47c-4e4a-8f30-e92cdcfd0e67
  event: BNTRS_PickUps_Kibellah_14
  text: '"В кошмарах я бодрствую. А благословенный шепот Его сопровождает меня всю жизнь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: В кошмарах я бодрствую. А благословенный шепот Его сопровождает меня всю жизнь.
- guid: ca4a2f62-add4-4100-b521-3b009205e6fe
  event: BNTRS_PickUps_Kibellah_142
  text: '"Люди с верхних палуб сторонятся этих мест. Но как можно жить на флагмане и отворачиваться от его нутра, дающего жизнь?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Люди с верхних палуб сторонятся этих мест. Но как можно жить на флагмане и отворачиваться от его нутра, дающего жизнь?
- guid: 890f97c9-e5be-4722-a830-446324f5f7b6
  event: BNTRS_PickUps_Kibellah_152
  text: '"Тьма и аварийные огни мне привычнее зарева светила. Следуй за мной, Домин. Я проведу нас".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тьма и аварийные огни мне привычнее зарева светила. Следуй за мной, Домин. Я проведу нас.
- guid: b1e0e9e4-6385-47f0-8c18-93f8b981aa8b
  event: BNTRS_PickUps_Kibellah_155
  text: '"Души Райкада Минорис... Они никогда не попадут к Неумирающему — их имена искажены навеки, он не сможет их вымолвить".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Души Райкада Минорис... Они никогда не попадут к Неумирающему — их имена искажены навеки, он не сможет их вымолвить.
- guid: 76fdb148-693b-4ecb-a1df-f857e85b24b4
  event: BNTRS_PickUps_Kibellah_158
  text: '"Губернатор Медина скверно послужил живым. Печально думать, как он будет служить Неумирающему, когда Он призовет своего слугу".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Губернатор Медина скверно послужил живым. Печально думать, как он будет служить Неумирающему, когда Он призовет своего слугу.
- guid: a4c00c7f-9039-4a6e-8db4-1b432f584318
  event: BNTRS_PickUps_Kibellah_16
  text: '"Всякий зрит лишь то, что ведает. А ты ведаешь только ядовитую сладость порока".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Всякий зрит лишь то, что ведает. А ты ведаешь только ядовитую сладость порока.
- guid: 53a6b7c4-6f0c-4ab7-987b-7e53f0ceb284
  event: BNTRS_PickUps_Kibellah_162
  text: '"Неумирающий назвал имя Домин''Теодоры. Он всего лишь выбрал тебя, чтобы исполнить Его волю. Прочее неважно".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий назвал имя Домин'Теодоры. Он всего лишь выбрал тебя, чтобы исполнить Его волю. Прочее неважно.
- guid: 3fec64b4-69f4-4122-bac6-f3cae623f1b6
  event: BNTRS_PickUps_Kibellah_163
  text: '"Вил''Маражая должно было убить. Но не так. Не на потеху ксеносам, не по их правилам".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вил'Маражая должно было убить. Но не так. Не на потеху ксеносам, не по их правилам.
- guid: 82000bb2-348f-4173-bfb6-03396d93553f
  event: BNTRS_PickUps_Kibellah_166
  text: '"Без личины Вил''Джай мне нравится больше. Но гниль без маски — все еще гниль".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Без личины Вил'Джай мне нравится больше. Но гниль без маски — все еще гниль.
- guid: 418f504f-8e0b-4af3-bccd-d366c4135442
  event: BNTRS_PickUps_Kibellah_168
  text: '"Я помню как ты помогала им убирать трупы из моей клетки, Вени''Идира. Ты выглядела... умиротворенной".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я помню как ты помогала им убирать трупы из моей клетки, Вени'Идира. Ты выглядела... умиротворенной.
- guid: 0194a2b9-cba2-4686-85c4-2882db525cef
  event: BNTRS_PickUps_Kibellah_17
  text: '"Твои тело и дух крепки несмотря на годы. Чем закаляешь ты их, Амик''Абеляр?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твои тело и дух крепки несмотря на годы. Чем закаляешь ты их, Амик'Абеляр?
- guid: 4ac20a36-2a3a-4787-902e-87bd7c9bd44f
  event: BNTRS_PickUps_Kibellah_171
  text: '"Я рада, что благословенный Ангел зрел мои мучения. Умереть на твоих глазах — честь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я рада, что благословенный Ангел зрел мои мучения. Умереть на твоих глазах — честь.
- guid: 13c35e03-6c72-47dd-883b-d0418e70fc49
  event: BNTRS_PickUps_Kibellah_172
  text: '"Твой клан заплатил кровью за нападение на Домин. Неси память об этом".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твой клан заплатил кровью за нападение на Домин. Неси память об этом.
- guid: 77f917ec-8bba-4351-a9bc-b7afc437a0b5
  event: BNTRS_PickUps_Kibellah_174
  text: '"Красный жрец, даруй мне крови своей. Через гадание я узнаю, не зреет ли на флагмане скверна, как на судне подобных тебе".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Красный жрец, даруй мне крови своей. Через гадание я узнаю, не зреет ли на флагмане скверна, как на судне подобных тебе.
- guid: 6f64555c-cc49-4543-bde1-3dbe457cc601
  event: BNTRS_PickUps_Kibellah_177
  text: '"Вени''Хейнрикс, моя нить неразрывна с Домин. Я {mf|его|ее} тень, и связь наша нерушима. Отступи".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вени'Хейнрикс, моя нить неразрывна с Домин. Я его тень, и связь наша нерушима. Отступи.
- guid: a09dd18d-978c-43fc-bb97-d5ea74f4deb8
  event: BNTRS_PickUps_Kibellah_179
  text: '"Домин даровал{mf||а} тебе шанс, потому что {mf|его|ее} разум затуманен чувствами. Я не обременена ими и без заминки оборву твою жизнь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Домин даровал тебе шанс, потому что его разум затуманен чувствами. Я не обременена ими и без заминки оборву твою жизнь.
- guid: 0b885061-2861-4afb-b5f5-090ce3dfdf05
  event: BNTRS_PickUps_Kibellah_181
  text: '"Простолюдинам не следовало перечить воле Амик''Абеляра. У каждого свое место на флагмане, своя ноша, которую присуждает Неумирающий".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Простолюдинам не следовало перечить воле Амик'Абеляра. У каждого свое место на флагмане, своя ноша, которую присуждает Неумирающий.
- guid: 0dc45f3b-f99e-4900-b7a2-4f040f2184cd
  event: BNTRS_PickUps_Kibellah_183
  text: '"Вот что случается, когда идешь против воли Неумирающего. Эвейн пытался спасти того, чье имя уже прозвучало".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вот что случается, когда идешь против воли Неумирающего. Эвейн пытался спасти того, чье имя уже прозвучало.
- guid: 0e92021b-235a-487e-8b1b-7f5d8935a945
  event: BNTRS_PickUps_Kibellah_186
  text: '"Вил''Ирлиэт мертва, кровавый долг уплачен. Завет Паутины соблюден".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вил'Ирлиэт мертва, кровавый долг уплачен. Завет Паутины соблюден.
- guid: 94139086-d134-4288-b23f-5a8101906e6c
  event: BNTRS_PickUps_Kibellah_189
  text: '"Мне не нужна твоя жалость. Ни сейчас, ни когда-либо еще".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мне не нужна твоя жалость. Ни сейчас, ни когда-либо еще.
- guid: e8a37e79-199c-45f0-ac64-e341503ea66e
  event: BNTRS_PickUps_Kibellah_19
  text: '"Вера ведет тебя по твоей нити, как меня — по моей. Мы обе служим Ему. Почему же в твоем взгляде, обращенном ко мне, столько беспокойства, Амик''Арджента?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вера ведет тебя по твоей нити, как меня — по моей. Мы обе служим Ему. Почему же в твоем взгляде, обращенном ко мне, столько беспокойства, Амик'Арджента?
- guid: e80cfb69-86a4-4a22-8cb0-fb1bb5915ca7
  event: BNTRS_PickUps_Kibellah_191
  text: '"Я благодарна, Амик''Абеляр. Надеюсь, ксеносу не под силу обмануть ваше чутье, как он обманул мое".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я благодарна, Амик'Абеляр. Надеюсь, ксеносу не под силу обмануть ваше чутье, как он обманул мое.
- guid: 1f51b9b6-cf3f-44aa-84aa-098525685304
  event: BNTRS_PickUps_Kibellah_192
  text: '"Домин оказывает великую милость Вил''Маражаю. Но она сгинет в темной бездне без проблеска благодарности".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Домин оказывает великую милость Вил'Маражаю. Но она сгинет в темной бездне без проблеска благодарности.
- guid: 8f127a64-fe9b-4a34-bd7e-1d16b2894f77
  event: BNTRS_PickUps_Kibellah_194
  text: '"Домин пытается постичь, как выглядят пределы низости и порока? Поэтому Вил''Джай позволено жить?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Домин пытается постичь, как выглядят пределы низости и порока? Поэтому Вил'Джай позволено жить?
- guid: 20db1d33-fb55-4de3-abc0-09adf4cbea56
  event: BNTRS_PickUps_Kibellah_196
  text: '"Янус полон цветов и ароматов, но я не буду по нему скучать. Палубы флагмана мне ближе, чем эта необузданная зелень".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Янус полон цветов и ароматов, но я не буду по нему скучать. Палубы флагмана мне ближе, чем эта необузданная зелень.
- guid: b6402122-ff5a-461a-832f-d193006ef668
  event: BNTRS_PickUps_Kibellah_199
  text: '"Что за таинства применяют служители Администратума, чтобы умерщвлять дух тех, кто посещает храм их культа? Я хочу поведать о них Висирю".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Что за таинства применяют служители Администратума, чтобы умерщвлять дух тех, кто посещает храм их культа? Я хочу поведать о них Висирю.
- guid: 5f7093e6-38cb-4550-8307-619d988b643b
  event: BNTRS_PickUps_Kibellah_201
  text: '"Ксеносы, что напали на Даргонус, не уважают смерть. Они издеваются над ней, превращают акт убийства в насмешку".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ксеносы, что напали на Даргонус, не уважают смерть. Они издеваются над ней, превращают акт убийства в насмешку.
- guid: be38f979-1a9a-4020-a49c-a75807cb1bf0
  event: BNTRS_PickUps_Kibellah_204
  text: '"Разум туманен, глаз слеп, а ухо глухо. Но кровь не врет. Ангел Его сразил демонов. А уж своих или наших — не важно".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Разум туманен, глаз слеп, а ухо глухо. Но кровь не врет. Ангел Его сразил демонов. А уж своих или наших — не важно.
- guid: 99fd6f82-0a24-4d9b-9cd4-891a4158dec9
  event: BNTRS_PickUps_Kibellah_207
  text: '"Кровь вела Амик''Ардженту с рождения. Кровь же привела ее к сокровенному. Благословенны идущие по нити твердо!"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Кровь вела Амик'Ардженту с рождения. Кровь же привела ее к сокровенному. Благословенны идущие по нити твердо!
- guid: c1672fec-b225-480e-bdff-cdbeeacbbcbe
  event: BNTRS_PickUps_Kibellah_209
  text: '"Благодать можно насаждать среди черни столь прямо, как это делает Инцендия Чорда? И Домин имеет право поступать так же?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Благодать можно насаждать среди черни столь прямо, как это делает Инцендия Чорда? И Домин имеет право поступать так же?
- guid: 1a6ff442-fb82-4b70-b5fd-6bd5bc2ef28d
  event: BNTRS_PickUps_Kibellah_21
  text: '"Скажи, Вени''Кассия. Ты... правда видишь свет Неумирающего во тьме меж звезд? Каков он?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Скажи, Вени'Кассия. Ты... правда видишь свет Неумирающего во тьме меж звезд? Каков он?
- guid: 672e9ac0-91ce-419c-a4ac-b88ba13a2a63
  event: BNTRS_PickUps_Kibellah_212
  text: '"Наши шаги теперь звучат особенно громко. Ужас, поселившийся в сердцах ксеносов, умножает их громоподобное эхо".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Наши шаги теперь звучат особенно громко. Ужас, поселившийся в сердцах ксеносов, умножает их громоподобное эхо.
- guid: f7341564-c91e-4cdf-9c70-524404e3b99a
  event: BNTRS_PickUps_Kibellah_216
  text: '"Единственный танец, которому ты можешь меня научить — горизонтальная пляска, которую ты станцуешь со вскрытым горлом, лежа на палубе".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Единственный танец, которому ты можешь меня научить — горизонтальная пляска, которую ты станцуешь со вскрытым горлом, лежа на палубе.
- guid: 76e64ccf-abb8-4af8-93c1-6a2d6bc01e78
  event: BNTRS_PickUps_Kibellah_217
  text: '"Надеюсь, то, что Домин привечает ксеноса в своей свите — изощренная ловушка для нее".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Надеюсь, то, что Домин привечает ксеноса в своей свите — изощренная ловушка для нее.
- guid: d9d3cc0d-e180-4a0a-9f59-65b00c3d9f5e
  event: BNTRS_PickUps_Kibellah_220
  text: '"Я многажды молилась, чтобы это случилось. Но в этом проклятом месте Его нет".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я многажды молилась, чтобы это случилось. Но в этом проклятом месте Его нет.
- guid: 99982051-d4e4-491a-833d-ee24cb77e248
  event: BNTRS_PickUps_Kibellah_221
  text: '"Изнеженная жизнь губит. Испытания — закаляют. Вени''Кассии стоит восхвалить Неумирающего за выпавшие на ее долю страдания".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Изнеженная жизнь губит. Испытания — закаляют. Вени'Кассии стоит восхвалить Неумирающего за выпавшие на ее долю страдания.
- guid: f955b2be-f8c3-4d71-90a0-f8962d34e597
  event: BNTRS_PickUps_Kibellah_225
  text: '"Я щит, клинок, тень — ничто из этого не обладает "личными чувствами".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я щит, клинок, тень — ничто из этого не обладает "личными чувствами.
- guid: 273a3d12-4c0d-49c2-96c1-541ff0d4d677
  event: BNTRS_PickUps_Kibellah_228
  text: '"Наша связь не нарушилась. Она стала такой, какая должна быть. И больше я не скажу тебе ничего".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Наша связь не нарушилась. Она стала такой, какая должна быть. И больше я не скажу тебе ничего.
- guid: 60e20317-4e04-4b2a-9a37-23928cb20d9c
  event: BNTRS_PickUps_Kibellah_23
  text: '"Я знаю, что ты наблюдаешь за мной, Вени''Хейнрикс. Не как друг, но как страж. Я не против".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я знаю, что ты наблюдаешь за мной, Вени'Хейнрикс. Не как друг, но как страж. Я не против.
- guid: 61b61c95-4e17-4f3d-92e6-3c1c713c6ff7
  event: BNTRS_PickUps_Kibellah_235
  text: '"То, что сотворил жрец в красном... Я чувствовала волю Неумирающего. Он обрек дух машины, как я обрекаю души людей".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: То, что сотворил жрец в красном... Я чувствовала волю Неумирающего. Он обрек дух машины, как я обрекаю души людей.
- guid: b5e18186-eedf-4914-861a-3b5284ee38cc
  event: BNTRS_PickUps_Kibellah_238
  text: '"Ни то, ни другое... И все сразу. Я не знаю. Это — нить, ведущая во мрак".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ни то, ни другое... И все сразу. Я не знаю. Это — нить, ведущая во мрак.
- guid: 38429367-2b63-43cd-9b3f-06071d5d2007
  event: BNTRS_PickUps_Kibellah_242
  text: '"Амик''Абеляр, есть техники и средства, которые помогают забывать. Я могу..."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Амик'Абеляр, есть техники и средства, которые помогают забывать. Я могу...
- guid: e4031ee2-954d-4e65-9180-45a6382c0acd
  event: BNTRS_PickUps_Kibellah_245
  text: '"Быть может, до этого ты смотрела на иную Кибеллу".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Быть может, до этого ты смотрела на иную Кибеллу.
- guid: 34cfe890-88c7-4b79-b51c-e2fb9db3519d
  event: BNTRS_PickUps_Kibellah_246
  text: '"Никакие стены не укроют от яростного приговора Его, когда ересь восстания захлестнула целый мир".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Никакие стены не укроют от яростного приговора Его, когда ересь восстания захлестнула целый мир.
- guid: 9433c8ce-995a-4b42-b299-63dded35f5e7
  event: BNTRS_PickUps_Kibellah_249
  text: '"Здесь почти как в палатах плазмадвигателя на флагмане. Смертоносные всполохи машинной искры, запах паленой плоти — и нити, которые должно оборвать".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Здесь почти как в палатах плазмадвигателя на флагмане. Смертоносные всполохи машинной искры, запах паленой плоти — и нити, которые должно оборвать.
- guid: b7a04b2c-c6d4-4db0-af0e-aee70f78eeb3
  event: BNTRS_PickUps_Kibellah_25
  text: '"Темные силы пожирают тебя, Вени''Идира, терзают душу. Я могла бы научить тебя техникам, что очищают разум..."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Темные силы пожирают тебя, Вени'Идира, терзают душу. Я могла бы научить тебя техникам, что очищают разум...
- guid: 05d24ea1-1304-410c-a775-bf04c8828d22
  event: BNTRS_PickUps_Kibellah_252
  text: '"Твоя душа уже сияет, Амик''Арджента. Но если Смерть призовет тебя раньше меня, я сохраню твой прах для самого снежного мира".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твоя душа уже сияет, Амик'Арджента. Но если Смерть призовет тебя раньше меня, я сохраню твой прах для самого снежного мира.
- guid: 25250ce2-71b8-4f78-8ee6-afba391e6ce8
  event: BNTRS_PickUps_Kibellah_254
  text: '"Для следующих Завету темнота есть союзник. Покров, что скрывает ткача от врагов Его. Но здесь... здесь она и есть враг".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Для следующих Завету темнота есть союзник. Покров, что скрывает ткача от врагов Его. Но здесь... здесь она и есть враг.
- guid: 7935b5e3-c705-485b-90a1-a039c4350056
  event: BNTRS_PickUps_Kibellah_255
  text: '"Ангел смерти, ты из благословленного опасностями мира, что взращивает могучих воинов. Похоже ли сие место на твою родину?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ангел смерти, ты из благословленного опасностями мира, что взращивает могучих воинов. Похоже ли сие место на твою родину?
- guid: d4ca4565-906a-463e-bdb7-1d79108c53e3
  event: BNTRS_PickUps_Kibellah_257
  text: '"Вот, значит, настолько огромно... небо. Неудивительно, что здесь вспыхнул мятеж. Как можно поддерживать порядок там, где нет ни отсеков, ни переборок?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вот, значит, настолько огромно... небо. Неудивительно, что здесь вспыхнул мятеж. Как можно поддерживать порядок там, где нет ни отсеков, ни переборок?
- guid: 0a63f262-bfbc-4f8d-9551-05bfd334aa28
  event: BNTRS_PickUps_Kibellah_260
  text: '"Боль — мой учитель, мой ритуальный кинжал. Она отсекает страхи и желания. Как резец, ограняет волю и рефлексы. Для чего избегать ее? Не понимаю".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Боль — мой учитель, мой ритуальный кинжал. Она отсекает страхи и желания. Как резец, ограняет волю и рефлексы. Для чего избегать ее? Не понимаю.
- guid: 831894e0-7266-4662-9a62-a1390b922440
  event: BNTRS_PickUps_Kibellah_261
  text: '"Неумирающий послал нас в ответ на молитвы монахов. Им должно блюсти обеты, нам — лить кровь еретиков. Замысел Его да будет исполнен".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий послал нас в ответ на молитвы монахов. Им должно блюсти обеты, нам — лить кровь еретиков. Замысел Его да будет исполнен.
- guid: fc290fef-df3e-4eef-884d-ed411f187c19
  event: BNTRS_PickUps_Kibellah_262
  text: '"Станция, взрастившая навигатора, мертва. Теперь флагман Домин твой дом, и пути назад нет".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Станция, взрастившая навигатора, мертва. Теперь флагман Домин твой дом, и пути назад нет.
- guid: da885968-b95f-46ca-9b59-535e357c311b
  event: BNTRS_PickUps_Kibellah_265
  text: '"Зреть смерть мира было сродни откровению. Я возношу благодарность Неумирающему за возможность свидетельствовать сие".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Зреть смерть мира было сродни откровению. Я возношу благодарность Неумирающему за возможность свидетельствовать сие.
- guid: 8fc957be-a894-45ff-8857-2f4a85a04b2a
  event: BNTRS_PickUps_Kibellah_266
  text: '"Футфол получил пропитание лишь благодаря милости Домин. Так люди научились полагаться на чужое сострадание — урок беспомощности".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Футфол получил пропитание лишь благодаря милости Домин. Так люди научились полагаться на чужое сострадание — урок беспомощности.
- guid: 307357ba-e5f6-468c-a332-3dd8f789cbfc
  event: BNTRS_PickUps_Kibellah_268
  text: '"Мы заслужили это право жертвами и служением. И покорно примем смерть, если Домин решит, что ткачи более не нужны флагману".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мы заслужили это право жертвами и служением. И покорно примем смерть, если Домин решит, что ткачи более не нужны флагману.
- guid: 725cfa57-2fe9-4160-9a05-1e6c700108a9
  event: BNTRS_PickUps_Kibellah_269
  text: '"Есть лишь один чистый путь узнать грядущее — это знаки, что Неумирающий шлет через Таро. Все прочее — ложь Архиврага".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Есть лишь один чистый путь узнать грядущее — это знаки, что Неумирающий шлет через Таро. Все прочее — ложь Архиврага.
- guid: 49baf332-962c-49fe-822c-53e93c06eba0
  event: BNTRS_PickUps_Kibellah_27
  text: '"Твоя вера в Него — дерзкая ложь. Ты не ведаешь аскезы, упиваешься наслаждениями. В твоем сердце нет места для жертвы во имя Неумирающего".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твоя вера в Него — дерзкая ложь. Ты не ведаешь аскезы, упиваешься наслаждениями. В твоем сердце нет места для жертвы во имя Неумирающего.
- guid: d0c07fd9-6a4f-44bc-a532-c1c00d8d79ed
  event: BNTRS_PickUps_Kibellah_270
  text: '"Ты лишь оттянула неизбежную смерть в когтях варпа, Вени''Идира. Ты могла попросить избавления, но не стала. Почему?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты лишь оттянула неизбежную смерть в когтях варпа, Вени'Идира. Ты могла попросить избавления, но не стала. Почему?
- guid: fc9d4474-9d59-4f9c-8484-0a940c0e1305
  event: BNTRS_PickUps_Kibellah_273
  text: '"Мне ведомо, что некоторые скорбят о Вени''Идире. Это неправильно. Она умерла человеком. До того, как скверна пожрала ее душу".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мне ведомо, что некоторые скорбят о Вени'Идире. Это неправильно. Она умерла человеком. До того, как скверна пожрала ее душу.
- guid: f9fa4bd8-fe4c-4572-a685-cef20f08b434
  event: BNTRS_PickUps_Kibellah_276
  text: '"Среди тех красных жрецов были выжившие — хорошо. Они разнесут весть о том, что перечащим воле Домин уготована смерть".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Среди тех красных жрецов были выжившие — хорошо. Они разнесут весть о том, что перечащим воле Домин уготована смерть.
- guid: e4db9e3e-e742-41cc-8818-34b037bae5c5
  event: BNTRS_PickUps_Kibellah_277
  text: '"Неумирающий так давно шепчет его имя, что оно каленым прутом выжжено в моем разуме. Но скоро душа еретика отправится на суровый суд Его".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий так давно шепчет его имя, что оно каленым прутом выжжено в моем разуме. Но скоро душа еретика отправится на суровый суд Его.
- guid: 5e6f5bd1-1c11-4960-9a39-dd6eaf9253c4
  event: BNTRS_PickUps_Kibellah_278
  text: '"Бессмысленный обряд. Домин уже коронован{mf||а} смертью предшественницы, и трон {mf|его|ее} — это флагман".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Бессмысленный обряд. Домин уже коронован смертью предшественницы, и трон его — это флагман.
- guid: 38095b81-b464-4720-8d23-690bbbaa0e6d
  event: BNTRS_PickUps_Kibellah_279
  text: '"Ты вновь с нами, красный жрец, и рвешься в бой. Отрадно видеть, что не только тело твое, но и воля — из прочнейшего металла".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты вновь с нами, красный жрец, и рвешься в бой. Отрадно видеть, что не только тело твое, но и воля — из прочнейшего металла.
- guid: 306ad85a-2c57-4dfb-b49c-3e8c75ce5df5
  event: BNTRS_PickUps_Kibellah_282
  text: '"Нет, Вил''Ирлиэт. В отличие от тебя я никогда не предам волю Домин".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Нет, Вил'Ирлиэт. В отличие от тебя я никогда не предам волю Домин.
- guid: bdbfe692-ad15-475c-96c0-ce49a7874193
  event: BNTRS_PickUps_Kibellah_283
  text: '"Любого замыслившего зло против Амик''Абеляра должно предать смерти. Казнь да научит подданных, как следует обращаться с первым советником Домин".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Любого замыслившего зло против Амик'Абеляра должно предать смерти. Казнь да научит подданных, как следует обращаться с первым советником Домин.
- guid: 2bb50932-5ca8-4fe4-a689-265a157791ca
  event: BNTRS_PickUps_Kibellah_286
  text: '"Помыслы Висиря тоже бывали туманны, но я всегда без сомнений следовала слову его. Мне жаль, что сия благодать не досталась тебе, Вени''Хейнрикс".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Помыслы Висиря тоже бывали туманны, но я всегда без сомнений следовала слову его. Мне жаль, что сия благодать не досталась тебе, Вени'Хейнрикс.
- guid: b717d203-02e1-4e8e-96c8-dc7dfa4aaee0
  event: BNTRS_PickUps_Kibellah_287
  text: '"Путь истинного служения есть путь потерь. Пусть события на Фтоне не ослабят твою решимость, Вени''Хенрикс".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Путь истинного служения есть путь потерь. Пусть события на Фтоне не ослабят твою решимость, Вени'Хенрикс.
- guid: 974eace6-dd6f-49a8-aaf3-adb7ce5c2249
  event: BNTRS_PickUps_Kibellah_289
  text: '"У ксеносов нет душ. Но это не значит, что им неведомы страдания. Пускай же напьются вдоволь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: У ксеносов нет душ. Но это не значит, что им неведомы страдания. Пускай же напьются вдоволь.
- guid: 14bcd014-d2bf-4391-8dbb-dd2eb871e0f7
  event: BNTRS_PickUps_Kibellah_29
  text: '"Я слежу за тобой, Вил''Маражай. И жду, пока Неумирающий прошепчет твое имя".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я слежу за тобой, Вил'Маражай. И жду, пока Неумирающий прошепчет твое имя.
- guid: 2af833ec-0e78-483b-b1cf-6ef979072245
  event: BNTRS_PickUps_Kibellah_290
  text: '"Я всегда рада песням твоим, ибо они умерщвляют дух не хуже самоистязаний. Приступай, я... готова".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я всегда рада песням твоим, ибо они умерщвляют дух не хуже самоистязаний. Приступай, я... готова.
- guid: 8499b4de-15af-4995-939b-d8b1ba6aa430
  event: BNTRS_PickUps_Kibellah_291
  text: '"Наставник... Наша последняя схватка — твой финальный урок. Раны, что ты оставил — прощальный дар. Я буду лелеять их. До тех пор, пока Неумирающий не призовет меня".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Наставник... Наша последняя схватка — твой финальный урок. Раны, что ты оставил — прощальный дар. Я буду лелеять их. До тех пор, пока Неумирающий не призовет меня.
- guid: 40384707-ab0a-4802-96ab-30d394e9f6f2
  event: BNTRS_PickUps_Kibellah_31
  text: '"Ты облачился в металл, жрец. Он обманет старость, но не смерть".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты облачился в металл, жрец. Он обманет старость, но не смерть.
- guid: 31c27703-10da-484c-92b5-edd9b6f19820
  event: BNTRS_PickUps_Kibellah_33
  text: '"Благословенный Ангел, я с почтением подношу тебе эту кровь, взятую в праведном бою".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Благословенный Ангел, я с почтением подношу тебе эту кровь, взятую в праведном бою.
- guid: 7d4d3056-8aa0-4af0-baa5-d31d2f56919b
  event: BNTRS_PickUps_Kibellah_35
  text: '"Ранее мой путь не пересекался с подобными тебе, Вил''Ирлиэт. Теперь я могу наблюдать за врагом вблизи. Изучать слабости. Я рада".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ранее мой путь не пересекался с подобными тебе, Вил'Ирлиэт. Теперь я могу наблюдать за врагом вблизи. Изучать слабости. Я рада.
- guid: 13037cd9-338d-410a-80ad-78b6924e4e2d
  event: BNTRS_PickUps_Kibellah_38
  text: '"Меня будоражит лишь один вопрос: нужен ли тебе язык, чтобы служить Домин?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: 'Меня будоражит лишь один вопрос: нужен ли тебе язык, чтобы служить Домин?'
- guid: 4d94a102-6998-4385-bf07-fc10097f19a3
  event: BNTRS_PickUps_Kibellah_40
  text: '"Ты изменяешь свое тело, чтобы оно отражало твою преданность. Я — свое. Шрамы на моей коже складываются в молитвы, мучения — в истовую веру".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты изменяешь свое тело, чтобы оно отражало твою преданность. Я — свое. Шрамы на моей коже складываются в молитвы, мучения — в истовую веру.
- guid: d196c91f-b8ed-4c38-8828-9a366408eb1a
  event: BNTRS_PickUps_Kibellah_42
  text: '"Еще нет, благословенный Ангел. Еще нет".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Еще нет, благословенный Ангел. Еще нет.
- guid: 8e2e0b03-65f6-4fa5-a720-ce827a3de870
  event: BNTRS_PickUps_Kibellah_44
  text: '"Ты дорожишь долгой жизнью, но она пуста. Потому ты нетверда в своих путях, а я ступаю одной нитью. За отведенный мне миг я могу свершить больше, чем ты — за столетия".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты дорожишь долгой жизнью, но она пуста. Потому ты нетверда в своих путях, а я ступаю одной нитью. За отведенный мне миг я могу свершить больше, чем ты — за столетия.
- guid: 2108aa7c-bf2f-4d57-a308-6c888135252d
  event: BNTRS_PickUps_Kibellah_51
  text: '"Души, что терзали Вени''Заккари... Они отвергли смерть? Или Неумирающий все же принял их в свои длани?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Души, что терзали Вени'Заккари... Они отвергли смерть? Или Неумирающий все же принял их в свои длани?
- guid: fc79fd19-b0bb-4fa8-b803-36b9c752f8f1
  event: BNTRS_PickUps_Kibellah_67
  text: '"Мы придаем значение разному, Вени''Кассия. Аскеза — наш путь совершенствования. Подвиги веры — наше золото, начертанные на стенах молитвы — наши фрески".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мы придаем значение разному, Вени'Кассия. Аскеза — наш путь совершенствования. Подвиги веры — наше золото, начертанные на стенах молитвы — наши фрески.
- guid: 1b9fc490-1226-464f-ab35-3224ab6b2ac6
  event: BNTRS_PickUps_Kibellah_80
  text: '"Я тоже рада биться плечом к плечу с достойной служительницей Его. Хоть обычно я и охочусь в одиночестве".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я тоже рада биться плечом к плечу с достойной служительницей Его. Хоть обычно я и охочусь в одиночестве.
- guid: 4614df39-79bc-4549-bab6-959a1d9306ff
  event: BNTRS_PickUps_Kibellah_96
  text: '"До последнего вздоха Немезит следовал уготованной ему стезе. Не будь он орудием искаженной воли, я бы признала в нем... достойного".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: До последнего вздоха Немезит следовал уготованной ему стезе. Не будь он орудием искаженной воли, я бы признала в нем... достойного.
- guid: 62c8516a-f6d0-4bf4-9c37-4800bc1b14cf
  event: BNTRS_Reactivity_DLC3_Kibellah_05
  text: '"Завет Кровавой паутины учит, что боль есть скрижали Неумирающего, что высечены на коже и разуме его верного слуги. Тебе не стоит искать избавления от нее, Амик''Абеляр".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Завет Кровавой паутины учит, что боль есть скрижали Неумирающего, что высечены на коже и разуме его верного слуги. Тебе не стоит искать избавления от нее, Амик'Абеляр.
- guid: 368aa146-d547-4f08-b857-02fa978c39b8
  event: BNTRS_Reactivity_DLC3_Kibellah_16
  text: '"Рядом с новым жрецом в алой робе ходит смерть, я чувствую это. Слово Неумирающего касалось его слуха, как коснулось моего. Но было ли оно услышано?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Рядом с новым жрецом в алой робе ходит смерть, я чувствую это. Слово Неумирающего касалось его слуха, как коснулось моего. Но было ли оно услышано?
- guid: 5038d0eb-bed4-4428-975b-55071b6b993d
  event: BNTRS_Reactivity_DLC3_Kibellah_57
  text: '"Неумирающий прошептал имя Амик''Себериана многие циклы назад и находится рядом с ним было... мучительно. Но твое еще с тобой, Амик''Абеляр, и тебе рано печалиться".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Неумирающий прошептал имя Амик'Себериана многие циклы назад и находится рядом с ним было... мучительно. Но твое еще с тобой, Амик'Абеляр, и тебе рано печалиться.
- guid: 229413d0-1cf2-4606-a659-122bd7342f8f
  event: BNTRS_Reactivity_DLC3_Kibellah_72
  text: '"Люди, что умервщляют плоть жизнью, полной лишений, следуют пути Неумирающего, знают они о том или нет. Законы и правила лишь отдалят их от искренности служения".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Люди, что умервщляют плоть жизнью, полной лишений, следуют пути Неумирающего, знают они о том или нет. Законы и правила лишь отдалят их от искренности служения.
- guid: 73b32463-2a12-4fdd-98a9-78ce654edac5
  event: BNTRS_Reactivity_Kibellah_01
  text: '"Свидетельствовать клятве благословенного Ангела Его — великий дар. Свидетельствовать клятве неизбывного мщения — величайший".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Свидетельствовать клятве благословенного Ангела Его — великий дар. Свидетельствовать клятве неизбывного мщения — величайший.
- guid: 31d4132b-f51c-4fed-8aec-fbe5f19ad65e
  event: BNTRS_Reactivity_Kibellah_02
  text: '"Их смерти делают крепче нить, ведущую на волю. Это все, что мне нужно знать".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Их смерти делают крепче нить, ведущую на волю. Это все, что мне нужно знать.
- guid: cff239c3-c1b4-4b02-bce7-51ac896956b2
  event: BNTRS_Reactivity_Kibellah_03
  text: '"Паутина кровоточит в знак скорби о Домин''Теодоре. Мы почитали подательницу жизни. Мы принесли щедрые жертвы, чтобы путь ее к Неумирающему был легок".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Паутина кровоточит в знак скорби о Домин'Теодоре. Мы почитали подательницу жизни. Мы принесли щедрые жертвы, чтобы путь ее к Неумирающему был легок.
- guid: feec0d57-c57c-4e1e-b4a4-d920347e9144
  event: BNTRS_Reactivity_Kibellah_04
  text: '"Твой дом мертв — правильным будет и тебе последовать за ним".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Твой дом мертв — правильным будет и тебе последовать за ним.
- guid: bfdb9d8d-83b9-45f0-a8d8-a80f6c8cbe14
  event: BNTRS_Reactivity_Kibellah_05
  text: '"Две нити связал долг. Такие узы крепче любых чувств, что восхваляют миряне".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Две нити связал долг. Такие узы крепче любых чувств, что восхваляют миряне.
- guid: a5d7e5f0-2b8a-43e1-af08-057dbd0488d2
  event: BNTRS_Reactivity_Kibellah_06
  text: '"Ты одержала славную победу — позволь я отворю кровь на шрамах твоих, дабы боль укрепила тебя для грядущих битв".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты одержала славную победу — позволь я отворю кровь на шрамах твоих, дабы боль укрепила тебя для грядущих битв.
- guid: ec35fca5-0171-4d40-9c4f-4768f30d6085
  event: BNTRS_Reactivity_Kibellah_07
  text: '"Я благодарна Неумирающему за возможность убить этого нелюдя многократно... Поэтичное возмездие за то, что он сделал со мной".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я благодарна Неумирающему за возможность убить этого нелюдя многократно... Поэтичное возмездие за то, что он сделал со мной.
- guid: 8a90a9de-c528-4e50-a16a-e646f9ccef77
  event: BNTRS_Reactivity_Kibellah_08
  text: '"Никто не бессмертен, сенешаль. Неумирающий прошепчет имя каждого".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Никто не бессмертен, сенешаль. Неумирающий прошепчет имя каждого.
- guid: ce9e73d7-aef4-4e4f-80a9-90b216637703
  event: BNTRS_Reactivity_Kibellah_09
  text: '"Я унесу в сердце темную память об этом месте. Месте, где не звучит Его шепот. Где нет надежды".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я унесу в сердце темную память об этом месте. Месте, где не звучит Его шепот. Где нет надежды.
- guid: 6bb2d7d8-5311-4238-ab37-d04cc72e06c0
  event: BNTRS_Reactivity_Kibellah_10
  text: '"Деяния Домин отбрасывает тень на всех нас. Они не смогли жить в {mf|его|ее} сгустившейся тени. Мы — тверже, мы останемся с {mf|ним|ней}... Пока Неумирающий не даст знак".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Деяния Домин отбрасывает тень на всех нас. Они не смогли жить в его сгустившейся тени. Мы — тверже, мы останемся с ним... Пока Неумирающий не даст знак.
- guid: 40b1bc33-e5fa-452c-a062-eb73e5850dbb
  event: BNTRS_Reactivity_Kibellah_11
  text: '"Я разложила Его Таро, и расклад сулит опасность. Подумай тщательно, куда ты влечешь Домин, ксенос".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я разложила Его Таро, и расклад сулит опасность. Подумай тщательно, куда ты влечешь Домин, ксенос.
- guid: 595589f6-8744-44c4-a864-315d4d59c2a7
  event: BNTRS_Reactivity_Kibellah_12
  text: '"Если ты прав, то почему мне чудится, что с Его губ вот-вот сорвется твое имя..."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Если ты прав, то почему мне чудится, что с Его губ вот-вот сорвется твое имя...
- guid: 4353d2a1-dd62-4520-9921-0740a8b5a2cc
  event: BNTRS_Reactivity_Kibellah_13
  text: '"Страдание очищает. Плоть умерщвляемая закаляет дух, и Футфол восстанет обескровленный, но преображенный".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Страдание очищает. Плоть умерщвляемая закаляет дух, и Футфол восстанет обескровленный, но преображенный.
- guid: 74cc6c6a-b908-4b28-918b-2dea13361e7c
  event: BNTRS_Reactivity_Kibellah_14
  text: '"Не тревожься о них. Мы пока не знаем их имен, но Неумирающий ведает имя каждого".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Не тревожься о них. Мы пока не знаем их имен, но Неумирающий ведает имя каждого.
- guid: 4b5d9c0e-0b0a-4f7f-9898-524f9472b135
  event: CH1_CassiaScared_Kibellah_01
  text: '"В сем искаженном теле жила душа, что постигла истинный долг. Да укрепит меня в служении чешуя праведника, обагренная кровью". {n}Кибелла тремя ритуальными надрезами отделяет кусочек навигаторской плоти и прячет его в одежде под сердцем.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: В сем искаженном теле жила душа, что постигла истинный долг. Да укрепит меня в служении чешуя праведника, обагренная кровью.
  - speaker: narrator
    text_clean: Кибелла тремя ритуальными надрезами отделяет кусочек навигаторской плоти и прячет его в одежде под сердцем.
- guid: a76a788e-fb21-4473-8b2b-c21ba96edb94
  event: CH1_HeinrixFirstMeet_Kibellah_01
  text: '{n}Воительница отвечает холодным взглядом.{/n} "Я — тень Домин. Если он{mf||а} скажет, я буду защищать тебя. Если велит — отведу к Неумирающему".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Воительница отвечает холодным взглядом.
  - speaker: Кибелла
    text_clean: Я — тень Домин. Если он скажет, я буду защищать тебя. Если велит — отведу к Неумирающему.
- guid: 369ebe0e-a54e-4f23-aafb-13892e7e8c04
  event: CH2_JaeHasAnOfferForYou_Kibellah_01
  text: '{n}Кибелла презрительно щурится.{/n} "Твое ремесло — ересь. От каждого слова и жеста твоего веет пороком. И лишь пороком ты торговать и можешь".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла презрительно щурится.
  - speaker: Кибелла
    text_clean: Твое ремесло — ересь. От каждого слова и жеста твоего веет пороком. И лишь пороком ты торговать и можешь.
- guid: d90f9200-36c9-4187-a4c8-054b0c17647b
  event: CH2_MarazhaiHelloAgain_Kibellah_01
  text: '"Ты упустил один титул, ксенос. Самый последний и истинный — "Мертвец".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты упустил один титул, ксенос. Самый последний и истинный — "Мертвец.
- guid: 43cd30f6-3c13-4aa4-a916-9194dcda6aac
  event: CH2_Yrliet_BaseDialogue_Kibellah_01
  text: '"Домин, но это же... ксенос. Завет Кровавой паутины предостерегает от их лживости и порочной натуры. Призывает уничтожать, лишь завидя. Ибо она — враг Неумирающего, и движут ею лишь темные цели".'
  speaker: Йрлиет Ланаэвисс
  parts:
  - speaker: Йрлиет Ланаэвисс
    text_clean: Домин, но это же... ксенос. Завет Кровавой паутины предостерегает от их лживости и порочной натуры. Призывает уничтожать, лишь завидя. Ибо она — враг Неумирающего, и движут ею лишь темные цели.
- guid: 101afceb-2b1c-4c1e-ac83-d874745e9dee
  event: CH2_Yrliet_BaseDialogue_Kibellah_02
  text: '"Твои попытки устрашить меня столь же бесплодны, как и ложь, что сочится из твоих уст. Лишь милость Домин отделяет мой клинок от твоего горла, нелюдь".'
  speaker: Йрлиет Ланаэвисс
  parts:
  - speaker: Йрлиет Ланаэвисс
    text_clean: Твои попытки устрашить меня столь же бесплодны, как и ложь, что сочится из твоих уст. Лишь милость Домин отделяет мой клинок от твоего горла, нелюдь.
- guid: 10d57e3c-8f2a-4215-be3e-dc22b364d9b1
  event: CH2_Yrliet_BaseDialogue_Kibellah_03
  text: '"Спесивый нелюдь слышит слова, но не видит клинка, что за ним таится. Хорошо. Неосторожный и самоуверенный враг — неопасный враг".'
  speaker: Йрлиет Ланаэвисс
  parts:
  - speaker: Йрлиет Ланаэвисс
    text_clean: Спесивый нелюдь слышит слова, но не видит клинка, что за ним таится. Хорошо. Неосторожный и самоуверенный враг — неопасный враг.
- guid: f3e6eee1-f663-4ec1-ac3a-03fb634459d4
  event: Companions_Kibellah_1
  text: '"Домин''{name}". {n}Кибелла откладывает окровавленный кинжал, которым только что обновляла едва зажившие раны на теле.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Домин'КЭП.
  - speaker: narrator
    text_clean: Кибелла откладывает окровавленный кинжал, которым только что обновляла едва зажившие раны на теле.
- guid: 9c4cfb49-0424-402c-a19f-cedeed13f747
  event: Companions_Kibellah_10
  text: '"Сетовать на веленье судьбы — равно что сечь океан пустоты за бортом флагмана. Среди звезд, среди жизни и смерти слово твое — мне приказ. Достойно принять его — долг мой перед тобой и Неумирающим".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Сетовать на веленье судьбы — равно что сечь океан пустоты за бортом флагмана. Среди звезд, среди жизни и смерти слово твое — мне приказ. Достойно принять его — долг мой перед тобой и Неумирающим.
- guid: 7855b9d8-84be-4c6c-ae09-72a6c57f1449
  event: Companions_Kibellah_100
  text: '"Священн{mf|ый|ая} цар{mf|ь|ица}, что избавил{mf||а} ковчег от проклятия твоего существования, Немо, почтил{mf||а} нас визитом". {n}Искаженный череп в руках Кибеллы сверкает начищенной бледностью кости. В пустых глазницах застыл вопрос, ответ на который возможно узнать, лишь познав смерть.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Священный царь, что избавил ковчег от проклятия твоего существования, Немо, почтил нас визитом.
  - speaker: narrator
    text_clean: Искаженный череп в руках Кибеллы сверкает начищенной бледностью кости. В пустых глазницах застыл вопрос, ответ на который возможно узнать, лишь познав смерть.
- guid: 6a0ffc23-9572-4b52-92a3-b5c61dd58718
  event: Companions_Kibellah_101
  text: '"Мы все плывем по кровавому потоку великой реки, что зовется судьбой. Жизнь не дается и не отбирается случайно. Если я вижу врага Человечества — мой клинок отсекает нить его жизни от бытия. Я не ожидаю знака высшей воли. Я и есть воля Его и вершу то, что должно".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Мы все плывем по кровавому потоку великой реки, что зовется судьбой. Жизнь не дается и не отбирается случайно. Если я вижу врага Человечества — мой клинок отсекает нить его жизни от бытия. Я не ожидаю знака высшей воли. Я и есть воля Его и вершу то, что должно.
- guid: 603aa7a8-7e54-42b8-a5e9-9e06cbee81f0
  event: Companions_Kibellah_102
  text: '"То не жажда, но долг. Убийства не доставляют нам наслаждения. Они — лишь инструмент исполнения Его воли".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: То не жажда, но долг. Убийства не доставляют нам наслаждения. Они — лишь инструмент исполнения Его воли.
- guid: 9f443763-5085-4968-9915-c9b2e17ac2de
  event: Companions_Kibellah_103
  text: '"Говорят, она была одной из многих. Рожденная в пустоте. Подданная Домин. Почитающая не жизнь, но смерть, и гонимая за это. Говорят, она спасла флагман от вторжения {g|Encyclopedia:ChaosGlossary}Архиврага{/g} во время варп-перелета, собрав вокруг себя служителей Его. И чтобы трагедии не повторилось, они начали плесть Кровавую паутину. Говорят, она была сильной женщиной с несгибаемой волей, но за годы ее сердце окаменело. И Неумирающий прошептал ее имя тому, кто стал первым Висирем Кровавой паутины".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Говорят, она была одной из многих. Рожденная в пустоте. Подданная Домин. Почитающая не жизнь, но смерть, и гонимая за это. Говорят, она спасла флагман от вторжения Архиврага во время варп-перелета, собрав вокруг себя служителей Его. И чтобы трагедии не повторилось, они начали плесть Кровавую паутину. Говорят, она была сильной женщиной с несгибаемой волей, но за годы ее сердце окаменело. И Неумирающий прошептал ее имя тому, кто стал первым Висирем Кровавой паутины.
- guid: 3864d189-b960-4bc4-88e5-19ae5a32b22d
  event: Companions_Kibellah_104
  text: '"Смерть давно нашептывает о кончине Вил''Маражая. Его жизнь в твоих руках, а смерть — в моих. Отдай приказ, и нить его судьбы оборвется сегодня же после отбоя".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Смерть давно нашептывает о кончине Вил'Маражая. Его жизнь в твоих руках, а смерть — в моих. Отдай приказ, и нить его судьбы оборвется сегодня же после отбоя.
- guid: 3155ec50-5799-45a4-ab07-86dca5698edc
  event: Companions_Kibellah_105
  text: '"Я твой клинок, Домин''{name}. И я служу верно".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я твой клинок, Домин'КЭП. И я служу верно.
- guid: 27ff3d32-e7cb-4862-936a-c7dfc412cfd4
  event: Companions_Kibellah_106
  text: '"Ткачи высекали летописи былого в камне, что украшал стены храма смерти. Но судьба, и время, и рок стерли наше прошлое, как стирает из бытия часть галактики взрыв звезды".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ткачи высекали летописи былого в камне, что украшал стены храма смерти. Но судьба, и время, и рок стерли наше прошлое, как стирает из бытия часть галактики взрыв звезды.
- guid: eb79ee0c-453d-4626-aae4-600e00cf0c66
  event: Companions_Kibellah_107
  text: '"Вести и направлять. Паству, что жаждет познать Неумирающего, но страшится смерти. Учеников, что ищут ответы в смерти, а сами не умеют жить. Защищать тех, кто никогда не знал о существовании Кровавой паутины. Кто знал, и был благодарен. И даже тех, кто всегда ненавидел нас. Видеть грядущее. Слышать прошлое. Принимать настоящее. И плести паутину из веры и крови настолько прочную, что ни один враг не в силах будет рассечь. Таково бремя Висиря, таков завет Матери-паучихи".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Вести и направлять. Паству, что жаждет познать Неумирающего, но страшится смерти. Учеников, что ищут ответы в смерти, а сами не умеют жить. Защищать тех, кто никогда не знал о существовании Кровавой паутины. Кто знал, и был благодарен. И даже тех, кто всегда ненавидел нас. Видеть грядущее. Слышать прошлое. Принимать настоящее. И плести паутину из веры и крови настолько прочную, что ни один враг не в силах будет рассечь. Таково бремя Висиря, таков завет Матери-паучихи.
- guid: f73fb81d-5225-4303-9fe2-5eb10f6d9f6a
  event: Companions_Kibellah_108
  text: '"В юношестве мы зашивали себе глаза и месяцы бродили по отсекам. Голодая. Выживая. Погибая. У тех, кто проходил испытание тьмой, чувства обострялись до предела. Мы были... счастливы. Ибо благословлены Им. Когда мы стали старше и взяли в руки оружие, наставники принялись испытывать нас болью, и ядами, и тяжестью лживых слов. Со временем наши тела перестали чувствовать боль. Кровь — реагировать на токсины. А разум — на провокации. Мы были покойны. Ибо смогли отбросить лишнее, чтобы верно служить Ему".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: В юношестве мы зашивали себе глаза и месяцы бродили по отсекам. Голодая. Выживая. Погибая. У тех, кто проходил испытание тьмой, чувства обострялись до предела. Мы были... счастливы. Ибо благословлены Им. Когда мы стали старше и взяли в руки оружие, наставники принялись испытывать нас болью, и ядами, и тяжестью лживых слов. Со временем наши тела перестали чувствовать боль. Кровь — реагировать на токсины. А разум — на провокации. Мы были покойны. Ибо смогли отбросить лишнее, чтобы верно служить Ему.
- guid: 0fc8bedf-b318-4fc3-861e-ffd07a45b019
  event: Companions_Kibellah_109
  text: '"В день совершеннолетия ко всем ткачам приходит великое испытание — год непрерывного бдения. Мы проводим его в нескончаемой молитве Неумирающему, и когда голод и прочие низменные чувства отступают... приходит истинное осознание себя и своего места в этом мире. Место между нежизнью и несмертью. Мы были горды. Ибо Он принял нас полностью, а мы приняли Его".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: В день совершеннолетия ко всем ткачам приходит великое испытание — год непрерывного бдения. Мы проводим его в нескончаемой молитве Неумирающему, и когда голод и прочие низменные чувства отступают... приходит истинное осознание себя и своего места в этом мире. Место между нежизнью и несмертью. Мы были горды. Ибо Он принял нас полностью, а мы приняли Его.
- guid: 938a19b7-1c57-426c-9709-2b1fbf06c3a1
  event: Companions_Kibellah_11
  text: '{n}Тонкая игла аккуратно проходит между веком и глазным яблоком. Непринужденно, словно поправляя столовый прибор во время обеда, Кибелла придерживает вашу руку.{/n} "Важно закалять плоть, а не калечить".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Тонкая игла аккуратно проходит между веком и глазным яблоком. Непринужденно, словно поправляя столовый прибор во время обеда, Кибелла придерживает вашу руку.
  - speaker: Кибелла
    text_clean: Важно закалять плоть, а не калечить.
- guid: f132e11c-232f-44e8-91ae-ce24ba3b799e
  event: Companions_Kibellah_110
  text: '"Можешь сам{mf||а} проверить". {n}Кибелла снимает с пояса и разворачивает небольшой кожаный сверток с орудиями для пыток.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Можешь сам проверить.
  - speaker: narrator
    text_clean: Кибелла снимает с пояса и разворачивает небольшой кожаный сверток с орудиями для пыток.
- guid: b05c3439-aace-4da2-90df-8a8a503db173
  event: Companions_Kibellah_111
  text: '"Привязанность есть слабость. А слабость ведет к преждевременной гибели, неугодной Неумирающему. Смерть должна пожинать души лишь тогда, когда приходит отведенное им время. Иногда встречаются люди, не ткачи, с которыми наши дороги сходятся и расходятся. Но то лишь временный спутник. Как... соратники из твоей свиты. Нити наших судеб переплелись, но однажды каждый пойдет своей стезей вновь".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Привязанность есть слабость. А слабость ведет к преждевременной гибели, неугодной Неумирающему. Смерть должна пожинать души лишь тогда, когда приходит отведенное им время. Иногда встречаются люди, не ткачи, с которыми наши дороги сходятся и расходятся. Но то лишь временный спутник. Как... соратники из твоей свиты. Нити наших судеб переплелись, но однажды каждый пойдет своей стезей вновь.
- guid: 36830411-446a-4b5d-ae34-b34c291fe0f5
  event: Companions_Kibellah_112
  text: '{n}Сверток с инструментами исчезает.{/n} "Мне приятно, что ты принимаешь на веру мои слова".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Сверток с инструментами исчезает.
  - speaker: Кибелла
    text_clean: Мне приятно, что ты принимаешь на веру мои слова.
- guid: 034b18ba-0e30-4e06-b2d0-43faa6a2da62
  event: Companions_Kibellah_113
  text: '"Ты снова хочешь ворошить былое? Прошлому должно оставаться в прошлом". {n}Кибелла поджимает губы.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Ты снова хочешь ворошить былое? Прошлому должно оставаться в прошлом.
  - speaker: narrator
    text_clean: Кибелла поджимает губы.
- guid: dbd35b88-24ef-4b68-a3e8-4b584be12f55
  event: Companions_Kibellah_114
  text: '"Инструменты, закаляющие плоть. Если пренебрегать практиками самоистязания, тело слабеет, и чувствительность может вернуться. А с ней лавиной накроет боль всех пережитых ран... И ты сойдешь с ума быстрее, чем Неумирающий прошепчет твое имя".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Инструменты, закаляющие плоть. Если пренебрегать практиками самоистязания, тело слабеет, и чувствительность может вернуться. А с ней лавиной накроет боль всех пережитых ран... И ты сойдешь с ума быстрее, чем Неумирающий прошепчет твое имя.
- guid: b28dd445-5ff1-4830-bcb1-637130a110ed
  event: Companions_Kibellah_115
  text: '{n}Кибелла вскидывает бровь, наблюдая, как багровое пятно расходится по одеянию.{/n} "Ты наш{mf|ел|ла} интересное применение сему инструменту. И все же он послужил орудием закалки".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла вскидывает бровь, наблюдая, как багровое пятно расходится по одеянию.
  - speaker: Кибелла
    text_clean: Ты нашел интересное применение сему инструменту. И все же он послужил орудием закалки.
- guid: 0fd0aebd-f3ac-413f-aaf5-75f9738ca75f
  event: Companions_Kibellah_116
  text: '{n}Тень мрачной меланхолии касается ее лица.{/n} "Я совсем не помню детские годы. Висирь говорит, на то повлияли тренировки и травмы, полученные в боях. И что так происходит со всеми высшими ткачами. Все, что я помню, связывает меня лишь с культом Кровавой паутины и моими собратьями".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Тень мрачной меланхолии касается ее лица.
  - speaker: Кибелла
    text_clean: Я совсем не помню детские годы. Висирь говорит, на то повлияли тренировки и травмы, полученные в боях. И что так происходит со всеми высшими ткачами. Все, что я помню, связывает меня лишь с культом Кровавой паутины и моими собратьями.
- guid: 99766e1f-8dec-4322-9566-9a49b2d9f613
  event: Companions_Kibellah_117
  text: '"Я..." {n}Девушка поджимает губы и отводит взгляд.{/n} "...все еще помню нашу первую встречу, Домин. Словно она была вчера. Каждый день, проведенный в храме Неумирающего. Каждое напутствие Висиря. Каждую душу, сопровожденную по другую сторону. Каждую... смерть тела и каждое воскрешение".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Я...
  - speaker: narrator
    text_clean: Девушка поджимает губы и отводит взгляд.
  - speaker: Кибелла
    text_clean: '...все еще помню нашу первую встречу, Домин. Словно она была вчера. Каждый день, проведенный в храме Неумирающего. Каждое напутствие Висиря. Каждую душу, сопровожденную по другую сторону. Каждую... смерть тела и каждое воскрешение.'
- guid: 466bfed6-a77f-4b11-a08d-44136eb7f52d
  event: Companions_Kibellah_118
  text: '{n}Черные цепи на теле Кибеллы выглядят как украшение, нежели инструмент пыток. Схватившись за их сплетение, девушка с силой дергает несколько раз, натягивая кожу до предела.{/n} "Все еще не рвется. Хорошо".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Черные цепи на теле Кибеллы выглядят как украшение, нежели инструмент пыток. Схватившись за их сплетение, девушка с силой дергает несколько раз, натягивая кожу до предела.
  - speaker: Кибелла
    text_clean: Все еще не рвется. Хорошо.
- guid: be197bc5-b414-4f3e-91ad-96e18f849730
  event: Companions_Kibellah_119
  text: '"Разве не чувствуя ничего, можно получить что-то?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Разве не чувствуя ничего, можно получить что-то?
- guid: 943c57e3-dd88-4bf3-b6de-6751899a0629
  event: Companions_Kibellah_12
  text: '"Сколь бы прочным ни был клинок, как бы верно ни служил госпо{mf|дину|же}, когда время его подходит — он отправляется в ножны".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Сколь бы прочным ни был клинок, как бы верно ни служил господину, когда время его подходит — он отправляется в ножны.
- guid: af4021a5-0258-4685-8397-42d0b6f40344
  event: Companions_Kibellah_120
  text: '{n}Аккуратно перевязывая раны, Кибелла кивает:{/n} "Достаточно. Мое тело не чувствует боли, но это не значит, что ему не нужен отдых. Благодарю за помощь с практикой, Домин''{name}. Сегодня ты стал{mf||а} понимать Завет Паутины чуть лучше".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Аккуратно перевязывая раны, Кибелла кивает:'
  - speaker: Кибелла
    text_clean: Достаточно. Мое тело не чувствует боли, но это не значит, что ему не нужен отдых. Благодарю за помощь с практикой, Домин'КЭП. Сегодня ты стал понимать Завет Паутины чуть лучше.
- guid: 43264f1f-ad20-45d4-9267-5ef83dc5d145
  event: Companions_Kibellah_121
  text: '"Остались ли у тебя еще вопросы?"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Остались ли у тебя еще вопросы?
- guid: 86c61582-c858-479e-b60c-22f23842e7c7
  event: Companions_Kibellah_122
  text: '"Бессмысленно бояться своей тени, ибо она есть твое отражение".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Бессмысленно бояться своей тени, ибо она есть твое отражение.
- guid: 03e2aa42-b9c3-469a-856c-af224c46e3be
  event: Companions_Kibellah_123
  text: '"Тридцать четыре. Раньше их было больше, но некоторые сгинули во тьме веков. Великая утрата для Кровавой паутины".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тридцать четыре. Раньше их было больше, но некоторые сгинули во тьме веков. Великая утрата для Кровавой паутины.
- guid: 8694e696-58ee-4cba-8a4a-2e059a7df735
  event: Companions_Kibellah_124
  text: '"Когда братья и сестры отправляются по другую сторону, нас переполняет радость. Ибо души их прежде остальных попадают в ласковые длани Неумирающего и могут служить Ему так, как не можем мы".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Когда братья и сестры отправляются по другую сторону, нас переполняет радость. Ибо души их прежде остальных попадают в ласковые длани Неумирающего и могут служить Ему так, как не можем мы.
- guid: a1a7d236-d31c-4a0d-a6b0-f8a7683b56ae
  event: Companions_Kibellah_125
  text: '"Это священная реликвия, передающаяся в культе множество поколений. Лишь Висирю, Первому ткачу, и правой руке его, ткачу второму, дозволено обучаться и использовать сакральные карты в гаданиях. Чтобы направлять путь. Чтобы читать в сплетениях нитей судьбы возможные исходы".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Это священная реликвия, передающаяся в культе множество поколений. Лишь Висирю, Первому ткачу, и правой руке его, ткачу второму, дозволено обучаться и использовать сакральные карты в гаданиях. Чтобы направлять путь. Чтобы читать в сплетениях нитей судьбы возможные исходы.
- guid: 8404049e-34ca-43ae-93bc-98ce7d9ac218
  event: Companions_Kibellah_126
  text: '"Только мы решаем, как встретить конец своего пути. И я уже решила: не здесь. Не сейчас".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: 'Только мы решаем, как встретить конец своего пути. И я уже решила: не здесь. Не сейчас.'
- guid: 3fb26ef7-2a1f-4963-b917-6eff6af6616e
  event: Companions_Kibellah_127
  text: '"Пока что карты молчат. Попробуем в другой раз".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Пока что карты молчат. Попробуем в другой раз.
- guid: 425b41b8-9d63-44bc-be3a-c06a91943b71
  event: Companions_Kibellah_128
  text: '"Познай врага своего, чтобы одержать победу в битве. Познай соратника, чтобы одержать победу в войне".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Познай врага своего, чтобы одержать победу в битве. Познай соратника, чтобы одержать победу в войне.
- guid: 7ad4f57d-bda7-40b5-86c2-4a8a02f1107a
  event: Companions_Kibellah_129
  text: '"Гончая" — третья карта в раскладе. И тоже перевернута. Кто-то выбрал тебя своей жертвой и гонит по полю капканов. "Потерянное дитя" говорит, что в один из капканов ты прыгнешь по собственной воле, поверив тому, кто отчаялся".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Гончая" — третья карта в раскладе. И тоже перевернута. Кто-то выбрал тебя своей жертвой и гонит по полю капканов. "Потерянное дитя" говорит, что в один из капканов ты прыгнешь по собственной воле, поверив тому, кто отчаялся.
- guid: 5007b584-52a6-4b5f-ad0e-4639413f6151
  event: Companions_Kibellah_13
  text: '"Тенью твоей, следующей в отдалении, и щитом незримым останусь до той поры, пока Неумирающий не протянет ко мне длань. Тогда я окончу служение в чертогах жизни, чтобы продолжить его в посмертии".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тенью твоей, следующей в отдалении, и щитом незримым останусь до той поры, пока Неумирающий не протянет ко мне длань. Тогда я окончу служение в чертогах жизни, чтобы продолжить его в посмертии.
- guid: e92efa71-df69-4c04-895d-5da46b9780c8
  event: Companions_Kibellah_130
  text: '"Тщеславие затмило мой разум. Я думала, раз стала Вторым ткачом культа, раз Неумирающий благоволил мне, раз я сильна... то знаю все. Это мое наказание за гордыню и глупость".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Тщеславие затмило мой разум. Я думала, раз стала Вторым ткачом культа, раз Неумирающий благоволил мне, раз я сильна... то знаю все. Это мое наказание за гордыню и глупость.
- guid: 364d8491-c587-4880-88fb-610ef910ab9e
  event: Companions_Kibellah_131
  text: '{n}Кибелла смотрит на вас пристально. В глазах читается неуверенность, но она быстро сменяется холодной убежденностью.{/n} "Посмотрим. "Бог-Император". Перевернутый "Ассасин". Перевернутая "Луна". "Проповедник".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла смотрит на вас пристально. В глазах читается неуверенность, но она быстро сменяется холодной убежденностью.
  - speaker: Кибелла
    text_clean: Посмотрим. "Бог-Император". Перевернутый "Ассасин". Перевернутая "Луна". "Проповедник.
- guid: af513b47-fbed-4bd9-a1a7-e97aa7f06cc5
  event: Companions_Kibellah_132
  text: '{n}Девушка сгребает карты, тревожно поглядывая на вас.{/n} "Это все, что я вижу, Домин. Но это не значит, что нет чего-то еще. Меня тревожат знамения грядущего. Но изменить судьбу мы не в силах. Остается лишь... ждать. И готовиться к неизбежному".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Девушка сгребает карты, тревожно поглядывая на вас.
  - speaker: Кибелла
    text_clean: Это все, что я вижу, Домин. Но это не значит, что нет чего-то еще. Меня тревожат знамения грядущего. Но изменить судьбу мы не в силах. Остается лишь... ждать. И готовиться к неизбежному.
- guid: 83d0948a-4a52-4687-bfbe-0599e66f933d
  event: Companions_Kibellah_133
  text: '"Спрашивай, Домин''{name}".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Спрашивай, Домин'КЭП.
- guid: ada5a7f3-9886-4ac5-9fdb-062596b84f3d
  event: Companions_Kibellah_134
  text: '{n}Кибелла молчит. С поджатых губ слетает горькая усмешка.{/n} "Ты"... как странно это звучит, зная, что нас было сотворено множество. Уверен{mf||а} ли ты, что говоришь с той, с кем был{mf||а} близ{mf|ок|ка}? Может, ее тело осталось там, в клетке ксеноса. Где мы умирали и восставали к нечестивой жизни снова и снова..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла молчит. С поджатых губ слетает горькая усмешка.
  - speaker: Кибелла
    text_clean: Ты"... как странно это звучит, зная, что нас было сотворено множество. Уверен ли ты, что говоришь с той, с кем был близок? Может, ее тело осталось там, в клетке ксеноса. Где мы умирали и восставали к нечестивой жизни снова и снова...
- guid: a1531a4b-7aec-4b58-8121-ab72efa6516b
  event: Companions_Kibellah_135
  text: '"И сейчас, когда мне так нужна Кровавая паутина... моя семья, моя опора... она далека от меня. Не сразу я осознала этот холод, окутавший плечи и не спадающий с тех пор, как мы оказались в Темном городе — холод одиночества. Все вокруг мне чуждо и противно моей сути..."'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: И сейчас, когда мне так нужна Кровавая паутина... моя семья, моя опора... она далека от меня. Не сразу я осознала этот холод, окутавший плечи и не спадающий с тех пор, как мы оказались в Темном городе — холод одиночества. Все вокруг мне чуждо и противно моей сути...
- guid: 6f55d9be-3f40-452c-97a2-948e0f599591
  event: Companions_Kibellah_136
  text: '{n}Кибелла вдруг вздергивает подбородок — ее темный взор устремлен на вас.{/n} "...но ты — ты не ощущаешь этого леденящего ужаса, так? Твой мир и мир ксеносов не так уж различны? Полные притворства и масок, скрывающих фальшивые устремления и жажду наслаждений..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла вдруг вздергивает подбородок — ее темный взор устремлен на вас.
  - speaker: Кибелла
    text_clean: '...но ты — ты не ощущаешь этого леденящего ужаса, так? Твой мир и мир ксеносов не так уж различны? Полные притворства и масок, скрывающих фальшивые устремления и жажду наслаждений...'
- guid: 7534bec9-9797-4c76-88e5-a2d04328e950
  event: Companions_Kibellah_137
  text: '{n}Культистка обнажает зубы в оскале — зверином, безумном.{/n} "Я видела тех, кого ты зовешь слугами Его! Ни одна из тех душ не трепещет ежечасно от мысли о долге пред Ним! Пустые разговоры и бесплодные утехи — вот ради чего они гнут спины!"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Культистка обнажает зубы в оскале — зверином, безумном.
  - speaker: Кибелла
    text_clean: Я видела тех, кого ты зовешь слугами Его! Ни одна из тех душ не трепещет ежечасно от мысли о долге пред Ним! Пустые разговоры и бесплодные утехи — вот ради чего они гнут спины!
- guid: 96663ac6-478b-404a-8319-3d7bd1156713
  event: Companions_Kibellah_138
  text: '"А в себе ли ты, Домин''{name}?! Мы заточены в живом кошмаре, попирающем все, что свято! Откуда мне знать, что скверна ксеносов не отравила и тебя?!"'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: А в себе ли ты, Домин'КЭП?! Мы заточены в живом кошмаре, попирающем все, что свято! Откуда мне знать, что скверна ксеносов не отравила и тебя?!
- guid: b0eb0c26-d25e-4715-a9c2-1a021a0d82cf
  event: Companions_Kibellah_139
  text: '{n}Кибелла заходится гортанным хохотом.{/n} "Вот оно что! Твой верный клинок повысил голос в разговоре с тобой — и твоя вера в меня уже мертва!"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла заходится гортанным хохотом.
  - speaker: Кибелла
    text_clean: Вот оно что! Твой верный клинок повысил голос в разговоре с тобой — и твоя вера в меня уже мертва!
- guid: bdd72e9a-c0cf-4840-b2e0-d75064b1df10
  event: Companions_Kibellah_14
  text: '{n}Немигающий взгляд изучает ваше лицо.{/n} "Даже мудрейшие из царей и цариц ошибаются — так говорит Завет Паутины. Как и то, что следует сначала принять решение, и только потом отдавать приказ".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Немигающий взгляд изучает ваше лицо.
  - speaker: Кибелла
    text_clean: Даже мудрейшие из царей и цариц ошибаются — так говорит Завет Паутины. Как и то, что следует сначала принять решение, и только потом отдавать приказ.
- guid: 6336344d-6f92-42ac-94b2-51af018577a1
  event: Companions_Kibellah_140
  text: '"Завет Паутины учит не сомневаться в себе и участи, Им уготованной. Не ведать страха. Не сожалеть. Я... почти сошла с верной нити. Но ты, Домин''{name}, мне не позволил{mf||а}. Прими мою благодарность".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Завет Паутины учит не сомневаться в себе и участи, Им уготованной. Не ведать страха. Не сожалеть. Я... почти сошла с верной нити. Но ты, Домин'КЭП, мне не позволил. Прими мою благодарность.
- guid: d40d844c-3dab-4363-bcf1-6862a2756312
  event: Companions_Kibellah_141
  text: '{n}Спустя несколько тягостных секунд тишины она с шипением выпускает воздух сквозь сжатые зубы. Медленно на ее лице вместо гнева проявляется усталость. Отчаяние. Наконец, она едва слышно изрекает:{/n} "Наша связь, Домин''{name}. Наша связь была ошибкой. Я не выдерживаю это испытание, поскольку ход помыслов моих нарушен пустыми тревогами".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Спустя несколько тягостных секунд тишины она с шипением выпускает воздух сквозь сжатые зубы. Медленно на ее лице вместо гнева проявляется усталость. Отчаяние. Наконец, она едва слышно изрекает:'
  - speaker: Кибелла
    text_clean: Наша связь, Домин'КЭП. Наша связь была ошибкой. Я не выдерживаю это испытание, поскольку ход помыслов моих нарушен пустыми тревогами.
