  event: Companions_Kibellah_18
  text: '{n}Кибелла замолкает, чуть ведет головой и медленно, завороженно достает из ножен черный кинжал.{/n} "Смерть шепчет мне: Домин''{name} досто{mf|ин|йна} нести знаки Его. Скажи, желаешь ли ты почтить плоть свою Его дарами?" {n}Встревоженные взгляды офицеров обращаются к клинку в руках культистки смерти.{/n}'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла замолкает, чуть ведет головой и медленно, завороженно достает из ножен черный кинжал.
  - speaker: Кибелла
