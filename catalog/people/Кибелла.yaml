- guid: 00d9c6dd-8aca-4cca-b03b-b20fd674ed6e
  event: ''
  text: '{n}Кибелла отступает, ее рука соскальзывает и повисает плетью. Едва слышно она выговаривает.{/n} "Я могу понять. Может, тому расстоянию, что между нами, не дано быть пересеченным. Ступай же".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла отступает, ее рука соскальзывает и повисает плетью. Едва слышно она выговаривает.
  - speaker: Кибелла
    text_clean: Я могу понять. Может, тому расстоянию, что между нами, не дано быть пересеченным. Ступай же.
- guid: 0233365e-6c8b-4c04-926c-caa4f23fbbb0
  event: ''
  text: '{n}Кибелла грустно качает головой.{/n} "Я не верю тебе, Домин. Ты выдаешь за знание надежду".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла грустно качает головой.
  - speaker: Кибелла
    text_clean: Я не верю тебе, Домин. Ты выдаешь за знание надежду.
- guid: 03376f7b-82f3-4718-a410-a4d9dd65052b
  event: ''
  text: '{n}Кибелла бросает долгий взгляд в визор Паскаля и вопросительно поднимает бровь. Техножрец отвечает длительным молчанием, а затем скрипит:{/n} "Благодарю за содействие. Запрос отклонен. Катехизис велит свершить сие рукой уполномоченной единицы".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Кибелла бросает долгий взгляд в визор Паскаля и вопросительно поднимает бровь. Техножрец отвечает длительным молчанием, а затем скрипит:'
  - speaker: Кибелла
    text_clean: Благодарю за содействие. Запрос отклонен. Катехизис велит свершить сие рукой уполномоченной единицы.
- guid: 06292d7a-25e3-4116-ab0f-03ae36ee0f49
  event: ''
  text: '{n}Под маской смерти вам удается разглядеть едва заметную улыбку Кибеллы. Она вручает вам чарку и, нашептывая слова молитвы, начинает водить пальцем по дну.{/n} "Смотри же, Домин''{name}. В кровавых узорах пролитой крови... что видят твои прозревшие глаза?" {n}Кибелла привлекает ваше внимание к начертанным символам.{/n}'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Под маской смерти вам удается разглядеть едва заметную улыбку Кибеллы. Она вручает вам чарку и, нашептывая слова молитвы, начинает водить пальцем по дну.
  - speaker: Кибелла
    text_clean: Смотри же, Домин'КЭП. В кровавых узорах пролитой крови... что видят твои прозревшие глаза?
  - speaker: narrator
    text_clean: Кибелла привлекает ваше внимание к начертанным символам.
- guid: 06c34da3-d797-4904-9468-593e07d7cf61
  event: ''
  text: '{n}Кибелла гордо вскидывает голову.{/n} "Мы слишком долго прозябали в забвении нижних палуб, скрывая себя и верша Его волю в тенях. Хватит! Отныне мы станем багряной рукой направлять дрожащие души. Мы, священные слуги Его, облачимся в золото и почтение, {d|Encyclopedia:CompKibellah_Distortion}коего заслуживаем{/d}, ибо презирающие нас — презирают Его! И будем служить тебе, Домин''{name}, не из теней, но сияя. Такова новая Кровавая паутина".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла гордо вскидывает голову.
  - speaker: Кибелла
    text_clean: Мы слишком долго прозябали в забвении нижних палуб, скрывая себя и верша Его волю в тенях. Хватит! Отныне мы станем багряной рукой направлять дрожащие души. Мы, священные слуги Его, облачимся в золото и почтение, коего заслуживаем, ибо презирающие нас — презирают Его! И будем служить тебе, Домин'КЭП, не из теней, но сияя. Такова новая Кровавая паутина.
- guid: 07d00cd1-0962-49ac-b33f-0091148c96b2
  event: ''
  text: '{n}Кибелла неуловимым движением приближается к вам и запечатлевает поцелуй на ваших губах, после чего столь же стремительно отстраняется. В глазах ее блуждает теплый огонек.{/n} "Милость Паутины ведет нас рука об руку, Домин''{name}. Смерть будет нам наградой за нить, пройденную с честью".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла неуловимым движением приближается к вам и запечатлевает поцелуй на ваших губах, после чего столь же стремительно отстраняется. В глазах ее блуждает теплый огонек.
  - speaker: Кибелла
    text_clean: Милость Паутины ведет нас рука об руку, Домин'КЭП. Смерть будет нам наградой за нить, пройденную с честью.
- guid: 0dac70af-5ea1-403d-a209-c55377b5ecff
  event: ''
  text: '{n}Кибелла зажмуривается.{/n} "Я надеялась... что ты окажешься сильнее меня..." {n}Девушка издает всхлип, словно сдается под тяготой взваленного на нее бремени решения.{/n} "Завет Паутины требует жертвы, что я не в силах принести..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла зажмуривается.
  - speaker: Кибелла
    text_clean: Я надеялась... что ты окажешься сильнее меня...
  - speaker: narrator
    text_clean: Девушка издает всхлип, словно сдается под тяготой взваленного на нее бремени решения.
  - speaker: Кибелла
    text_clean: Завет Паутины требует жертвы, что я не в силах принести...
- guid: 0f793cf5-e48e-42a8-9bea-0bfe65930a87
  event: ''
  text: '"Нечто большее. Благословение Его". {n}Кибелла улыбается в ответ, мягко и успокаивающе.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Нечто большее. Благословение Его.
  - speaker: narrator
    text_clean: Кибелла улыбается в ответ, мягко и успокаивающе.
- guid: 1009e12b-4025-4b9a-afc3-5936505bb12e
  event: ''
  text: '{n}Кибелла резко поворачивается к вам.{/n} "Мы здесь, дабы расплатиться с Неумирающим. Нам дано имя, и человек, и прошлое. Я... знаю, что должно быть исполнено. Но почему в груди болит рана, которую не видит глаз? Отчего впервые в жизни я не могу решиться оборвать нить? Все это время я блуждала в лабиринте, но ответ так и не пришел ко мне. Что мне делать, Домин? Как покончить с Нааки Эрэбис?"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла резко поворачивается к вам.
  - speaker: Кибелла
    text_clean: Мы здесь, дабы расплатиться с Неумирающим. Нам дано имя, и человек, и прошлое. Я... знаю, что должно быть исполнено. Но почему в груди болит рана, которую не видит глаз? Отчего впервые в жизни я не могу решиться оборвать нить? Все это время я блуждала в лабиринте, но ответ так и не пришел ко мне. Что мне делать, Домин? Как покончить с Нааки Эрэбис?
- guid: 1323efa7-a53e-4d76-849b-18ccc503c83c
  event: ''
  text: '{n}Кибелла принимается с остервенением обновлять стигматы на руке. Не отрываясь от кровавого рисунка, она шепчет:{/n} "Ты все еще мо{mf|й|я} Домин, но решение твое... противно моей душе".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Кибелла принимается с остервенением обновлять стигматы на руке. Не отрываясь от кровавого рисунка, она шепчет:'
  - speaker: Кибелла
    text_clean: Ты все еще мой Домин, но решение твое... противно моей душе.
- guid: 149098c8-ed64-4d78-825c-bd76f43afe22
  event: ''
  text: '"Что?.. Да, но это неважно". {n}Кибелла равнодушно смотрит на кровавую дыру в боку.{/n} "Этой пуле не суждено было оборвать мою нить, ведь она была твоей".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Что?.. Да, но это неважно.
  - speaker: narrator
    text_clean: Кибелла равнодушно смотрит на кровавую дыру в боку.
  - speaker: Кибелла
    text_clean: Этой пуле не суждено было оборвать мою нить, ведь она была твоей.
- guid: 15d483ce-2fe5-4ea3-9882-0c6b82353ee8
  event: ''
  text: '{n}Кибелла вытягивает палец, увенчанный металлическим когтем, в сторону преподобного Адальберта.{/n} "Гадание указало, что ты стоишь подле врага — Немезита. Молви правду пред лицом Домин и Неумирающего".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла вытягивает палец, увенчанный металлическим когтем, в сторону преподобного Адальберта.
  - speaker: Кибелла
    text_clean: Гадание указало, что ты стоишь подле врага — Немезита. Молви правду пред лицом Домин и Неумирающего.
- guid: 1d4dad7e-bd7b-4c99-8756-b739758a25cb
  event: ''
  text: '{n}Кибелла недолго всматривается в лицо незнакомца и отворачивается:{/n} "Я не знаю тебя. Смерть не видит тебя".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Кибелла недолго всматривается в лицо незнакомца и отворачивается:'
  - speaker: Кибелла
    text_clean: Я не знаю тебя. Смерть не видит тебя.
- guid: 1f1636f0-1639-43b6-bd0f-18bc336b6d4d
  event: ''
  text: '"Быть может, то, что между нами, не столь тяжким бременем легло тебе на сердце, Домин''{name}..." {n}Кибелла облизывает губы, которые расползаются в злой ухмылке.{/n} "Ведь я не единственная, с кем ты связан{mf||а}".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Быть может, то, что между нами, не столь тяжким бременем легло тебе на сердце, Домин'КЭП...
  - speaker: narrator
    text_clean: Кибелла облизывает губы, которые расползаются в злой ухмылке.
  - speaker: Кибелла
    text_clean: Ведь я не единственная, с кем ты связан.
- guid: 1fc313ec-12b7-46d4-b577-13aeace3173d
  event: ''
  text: '"Сие требуется всегда, но время и цель назначает Неумирающий". {n}Кибелла отвечает с достоинством, явно не замечая зловещей двусмысленности своих слов.{/n}'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Сие требуется всегда, но время и цель назначает Неумирающий.
  - speaker: narrator
    text_clean: Кибелла отвечает с достоинством, явно не замечая зловещей двусмысленности своих слов.
- guid: 21861986-d7af-45cb-9313-2447a61272ad
  event: ''
  text: '"И снова ты стал{mf||а} свидетел{mf|ем|ьницей} моей истины, Домин''{name}". {n}Кибелла не смотрит на вас — взгляд ее словно устремлен внутрь себя и никуда одновременно.{/n} "Свет обретен. Мы совершили еще один круг к истине, что скрывается в глубинах нашей связи".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: И снова ты стал свидетелем моей истины, Домин'КЭП.
  - speaker: narrator
    text_clean: Кибелла не смотрит на вас — взгляд ее словно устремлен внутрь себя и никуда одновременно.
  - speaker: Кибелла
    text_clean: Свет обретен. Мы совершили еще один круг к истине, что скрывается в глубинах нашей связи.
- guid: 2362c8cd-7ec1-4bc9-8b24-89e4867ffd8e
  event: ''
  text: '{n}Кибелла улыбается вам, с ресниц капают слезы.{/n} "Я... знала, что таким будет ответ. Лабиринт не таит разгадку всех тайн — некоторые надо искать в других. В тебе. Ты — мой ответ и благословение... Быть собой".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла улыбается вам, с ресниц капают слезы.
  - speaker: Кибелла
    text_clean: Я... знала, что таким будет ответ. Лабиринт не таит разгадку всех тайн — некоторые надо искать в других. В тебе. Ты — мой ответ и благословение... Быть собой.
- guid: 23ff1a7c-5000-42b2-99d5-54b44094befe
  event: ''
  text: '{n}Кибелла бросает на вас мимолетный взгляд.{/n} "Что ж... проводи меня".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла бросает на вас мимолетный взгляд.
  - speaker: Кибелла
    text_clean: Что ж... проводи меня.
- guid: 244b7159-9611-4f93-9c95-f24ee2731485
  event: ''
  text: '{n}Кибелла цедит сквозь зубы:{/n} "Ты воспользовался моим доверием, чтобы сделать из меня инструмент! Конечно, теперь я не вижу себе иной судьбы, но это не значит, что так было предопределено!"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Кибелла цедит сквозь зубы:'
  - speaker: Кибелла
    text_clean: Ты воспользовался моим доверием, чтобы сделать из меня инструмент! Конечно, теперь я не вижу себе иной судьбы, но это не значит, что так было предопределено!
- guid: 257f6669-d3ec-4ee9-acf9-9f2c3790ec8a
  event: ''
  text: '{n}Кибелла склоняет голову, рассматривая вас.{/n} "Нечто", Домин''{name}?"'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла склоняет голову, рассматривая вас.
  - speaker: Кибелла
    text_clean: Нечто", Домин'КЭП?
- guid: 263d56f7-46b0-45f5-9541-b5c30229e953
  event: ''
  text: '{n}Кибелла мрачно взирает на трупы.{/n} "Я осталась одна. Но что это меняет, Домин? Я — разбитое зеркало, насмешка. Когда ты поймешь это, то сам{mf||а} прогонишь меня. Но, похоже, еще не сегодня".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла мрачно взирает на трупы.
  - speaker: Кибелла
    text_clean: Я осталась одна. Но что это меняет, Домин? Я — разбитое зеркало, насмешка. Когда ты поймешь это, то сам прогонишь меня. Но, похоже, еще не сегодня.
- guid: 27210b9d-39e5-4973-84b3-d473f7d8badb
  event: ''
  text: '{n}Кибелла растягивает губы в улыбке. Она медленно кладет руку вам на плечо.{/n} "Я... разделяю твой трепет, Домин''{name}".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла растягивает губы в улыбке. Она медленно кладет руку вам на плечо.
  - speaker: Кибелла
    text_clean: Я... разделяю твой трепет, Домин'КЭП.
- guid: 2a6b0087-84bd-49e6-b8dc-78465c9306d6
  event: ''
  text: '{n}Кибелла едва слышно шепчет:{/n} "Много людей, внимание Домин, первое посещение дворца... Они нервничают. Нужно дать этим людям время. Дать привыкнуть к обстановке, к... твоему присутствию. Пусть разойдутся по зале, отведают яств. Мы поговорим с каждым отдельно".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: 'Кибелла едва слышно шепчет:'
  - speaker: Кибелла
    text_clean: Много людей, внимание Домин, первое посещение дворца... Они нервничают. Нужно дать этим людям время. Дать привыкнуть к обстановке, к... твоему присутствию. Пусть разойдутся по зале, отведают яств. Мы поговорим с каждым отдельно.
- guid: 2c17cecd-6fb5-4685-abc9-59b448291b90
  event: ''
  text: '{n}Кибелла прикрывает глаза.{/n} "Идеал..." {n}Она отворачивается к пропасти, глядя вниз, рассматривая улицы.{/n} "Все это время я считала, что моя стезя — благословение, дарованное мне и открывающее путь к совершенству. Но оказавшись здесь... взглянув на мир с высоты..."'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла прикрывает глаза.
  - speaker: Кибелла
    text_clean: Идеал...
  - speaker: narrator
    text_clean: Она отворачивается к пропасти, глядя вниз, рассматривая улицы.
  - speaker: Кибелла
    text_clean: Все это время я считала, что моя стезя — благословение, дарованное мне и открывающее путь к совершенству. Но оказавшись здесь... взглянув на мир с высоты...
- guid: 2cf3c630-985d-46f8-8ff6-e6fc32a1960e
  event: ''
  text: '{n}Кибелла удивленно моргает и поднимает взгляд на вас. Стрельнув глазами в стороны, она, похоже, понимает, что вы имели в виду... и неожиданно звонкий, искренний смех разносится по помещению, заставляя окружающих нервно вздрогнуть.{/n} "Выходит, что так, Домин''{name}! Не буду и впредь смущать твоих подданных".'
  speaker: Кибелла
  parts:
  - speaker: narrator
    text_clean: Кибелла удивленно моргает и поднимает взгляд на вас. Стрельнув глазами в стороны, она, похоже, понимает, что вы имели в виду... и неожиданно звонкий, искренний смех разносится по помещению, заставляя окружающих нервно вздрогнуть.
  - speaker: Кибелла
    text_clean: Выходит, что так, Домин'КЭП! Не буду и впредь смущать твоих подданных.
- guid: 2d2e74b5-383b-4ffb-a610-d50e9ffe3f46
  event: ''
  text: '"Идем же". {n}Кибелла тихо шепчет.{/n} "Я услышала... и увидела все, что хотела".'
  speaker: Кибелла
  parts:
  - speaker: Кибелла
    text_clean: Идем же.
  - speaker: narrator
    text_clean: Кибелла тихо шепчет.
