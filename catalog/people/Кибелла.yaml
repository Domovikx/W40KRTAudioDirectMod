  event: Companions_Kibellah_150
  text: '{n}Кибелла умолкает. По ее лицу пробегает тень жестокой усмешки.{/n} "Все грехи, что я совершу пред Кровавой паутиной, скроют тени Комморры, и я выйду отсюда очищенной. Сильной. Непорочной". {n}Она бросает на вас настороженный взгляд.{/n} "Оставь меня, Домин''{name}. Мне нужно пройти лабиринт с твоими словами в душе".'
