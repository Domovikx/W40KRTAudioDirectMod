- guid: 24144b50-2c17-4f2b-afbd-d121d8621ded
  event: DeathCultIntroduction_06
  text: '"Души предателей станут твоим даром Ему". {n}Острый клинок скользит по губам Кибеллы, и от одного его вида пленники сотрясаются нервной дрожью.{/n} "Твое право — приказать свершить казнь и смертью неверных связать нас через Него. Ибо Бог-Император, Неумирающий Император, и есть смерть. Ибо Неумирающий и есть долг".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Души предателей станут твоим даром Ему.
  - speaker: narrator
    text_clean: Острый клинок скользит по губам Кибеллы, и от одного его вида пленники сотрясаются нервной дрожью.
  - speaker: Кибелла
    text_clean: Твое право — приказать свершить казнь и смертью неверных связать нас через Него. Ибо Бог-Император, Неумирающий Император, и есть смерть. Ибо Неумирающий и есть долг.
- guid: 18c7625d-c208-4691-8031-6591416527f9
  event: DeathCultIntroduction_07
  text: '"Завет Паутины учит нас читать сердца людей и нити грядущего. Когда нутро человека переполняется скверной и ядом, мы понимаем — время пришло. Три освобождающих удара. Три отповеди. Один клинок. Так мы служим Неумирающему. Так мы служим тебе и флагману".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Завет Паутины учит нас читать сердца людей и нити грядущего. Когда нутро человека переполняется скверной и ядом, мы понимаем — время пришло. Три освобождающих удара. Три отповеди. Один клинок. Так мы служим Неумирающему. Так мы служим тебе и флагману.
- guid: eb67949b-ceba-4d1b-a8b7-5c1f76f095ce
  event: DeathCultIntroduction_08
  text: '"С именем твоим на устах". {n}Отточенным движением служители культа делают два тонких надреза в уголках губ, скрепляя данное обещание словом и кровью.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: С именем твоим на устах.
  - speaker: narrator
    text_clean: Отточенным движением служители культа делают два тонких надреза в уголках губ, скрепляя данное обещание словом и кровью.
