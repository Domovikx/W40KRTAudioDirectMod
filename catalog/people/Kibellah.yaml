- guid: 2ee73413-54dc-4489-a474-eb088ce8b16c
  event: DeathCultIntroduction_10
  text: '{n}Два звонких хлопка ладоней эхом отражаются от древних стен палубы. Шепот стихает.{/n} "Мы — нити, протянутые во мраке. И здесь, чтоб служить тебе. Если свой долг мы исполним, отступившись от таинств сакрального смертоубийства... Мы отступимся".'
  speaker: null
