  event: RMNC_Kibellah_StartingEvent_RitualFight_14
  text: '"Мой путь в служении Неумирающему извилист и сложен. Любое сознание исполнено слабостей, и только постоянное оттачивание его способно закалить разум и внимание. Я представляю себе Завет Паутины в виде лабиринта, полного тупиков и переплетений ходов. Погружаясь в транс, боевой или духовный, я прохожу этот путь. Теперь ты будешь со мной, когда я войду в лабиринт вновь".'
  speaker: null
