  event: Companions_Kibellah_22
  text: '"Зев". "Галактика". Перевернутый "Монстр". "Палач". {n}Кибеллу передергивает от лежащего перед ней расклада.{/n} "Грядет неизбежное... и скоро Простор содрогнется. Ты станешь причиной тому. Не началом, но завершением. В глазах одних — смертью. В глазах других — силой. Для третьих станешь знамением. Но может случиться и так... что ты вовсе исчезнешь".'
  speaker: null
  parts:
