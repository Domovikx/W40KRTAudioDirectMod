  event: Companions_Kibellah_27
  text: '{n}Кибелла недоуменно хмурится.{/n} "Неумирающий Император и есть смерть. Мы служим Ему, а значит, мы служим смерти. Это не сравнение, не титул, не прихоть. Так есть. И никто не в силах изменить неизменное".'
