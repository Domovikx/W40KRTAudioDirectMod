    text_clean: Неумирающий Император велел нам сплетать кровавую паутину вокруг чад Его, и мы сплетали. Мы здесь, чтобы плести ее впредь.
  - speaker: narrator
    text_clean: 'Трагический шепот доносится из-под масок культистов: "Плести... впредь".'
- guid: f130a45c-01cd-4eb6-bc3a-897bea224bf7
  event: DeathCultIntroduction_02
  text: '"Когда благословение смерти настигло Домин''Теодору, нас не было рядом. Потеря владычицы покрыла позором Кровавую паутину. Прежде чем предстать перед тобой, мы были обязаны вернуть свою честь. Выследить предателей. Разрезать их от глотки до паха и омыть кровью еретиков переборки флагмана в священном ритуале очищения".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Когда благословение смерти настигло Домин'Теодору, нас не было рядом. Потеря владычицы покрыла позором Кровавую паутину. Прежде чем предстать перед тобой, мы были обязаны вернуть свою честь. Выследить предателей. Разрезать их от глотки до паха и омыть кровью еретиков переборки флагмана в священном ритуале очищения.
- guid: fad69b1c-f2ea-44bc-9e4e-b67fe93cb5e5
  event: DeathCultIntroduction_03
  text: '"Задушить в себе желание обладать тем, что никогда тебе не принадлежало — вот стезя следующих Завету. Однако..." {n}Голос Кибеллы остается спокоен, но вы замечаете, как оживились служители культа. Внимание и щедрость Вольного Торговца им явно польстили.{/n} "Кровавая паутина не смеет оскорблять влады{mf|ку|чицу} отказом".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Задушить в себе желание обладать тем, что никогда тебе не принадлежало — вот стезя следующих Завету. Однако...
  - speaker: narrator
    text_clean: Голос Кибеллы остается спокоен, но вы замечаете, как оживились служители культа. Внимание и щедрость Вольного Торговца им явно польстили.
  - speaker: Кибелла
    text_clean: Кровавая паутина не смеет оскорблять владыку отказом.
- guid: eaa52193-67be-470e-8fb7-c73fd9fe1df4
  event: DeathCultIntroduction_04
  text: '{n}Недоумение прорастает во взоре служительницы.{/n} "Мы действуем согласно Его замыслу. Если Его знаки указали нам на человека — мы забираем его... Мы покорны. Разве должно быть иначе?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Недоумение прорастает во взоре служительницы.
  - speaker: Кибелла
    text_clean: Мы действуем согласно Его замыслу. Если Его знаки указали нам на человека — мы забираем его... Мы покорны. Разве должно быть иначе?
- guid: 1da7d993-7782-48d3-bd80-7fa264c9ed07
  event: DeathCultIntroduction_05
  text: '"В Кровавой паутине я — Второй ткач. Подобного звания удостаивается лишь тот, кто сопроводит на другую сторону больше душ, чем..." {n}Кибелла осекается. Тонкие пальцы углубляются в свежую рану на руке, а затем чертят на губах символ, похожий на замок.{/n} "Нет большей нескромности, чем говорить о собственных деяниях. Я здесь, чтобы стать твоей тенью, а не хвастаться".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: В Кровавой паутине я — Второй ткач. Подобного звания удостаивается лишь тот, кто сопроводит на другую сторону больше душ, чем...
