    text_clean: Кровавая паутина сплетает нитями веры отсеки корабля — таково наше служение Домини из рода фон Валанциус. Неумирающий повелел им бороздить пустоту на корабле, и долгом нашим стало беречь эту бесценную реликвию — твой бесценный род и ковчег, что стал домом сего рода. Великая реликвия из крови и адамантиума.
- guid: a57990dc-3861-42fe-a130-e2ef005eea97
  event: Companions_Kibellah_21
  text: '"Кровью, потом, слезами и волей служителей Неумирающего мы ткем гобелен равновесия из душ твоих подданных. Вот почему. Тех, кто только ступил на нить Паутины, мы зовем малыми ткачами. Тех, кто давно служит Ему — ткачами. Семь самых верных последователей Его, старшие ткачи, получили семь уникальных рангов: Висирь, он же Первый ткач. Кибелла — Второй ткач. Ио — Третий ткач. Есть еще четверо".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: 'Кровью, потом, слезами и волей служителей Неумирающего мы ткем гобелен равновесия из душ твоих подданных. Вот почему. Тех, кто только ступил на нить Паутины, мы зовем малыми ткачами. Тех, кто давно служит Ему — ткачами. Семь самых верных последователей Его, старшие ткачи, получили семь уникальных рангов: Висирь, он же Первый ткач. Кибелла — Второй ткач. Ио — Третий ткач. Есть еще четверо.'
