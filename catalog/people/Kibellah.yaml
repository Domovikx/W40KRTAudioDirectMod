- guid: 2e157122-aff3-4ef2-ad5c-90cab8a0f4da
  event: DeathCultIntroduction_18
  text: '"Человечество существует лишь благодаря жертве Неумирающего. Он защищает нас от ужасов, что таятся во тьме, и потому каждый обязан служить Ему. И каждый должен..." {n}Кибелла произносит это с нажимом.{/n} "...умереть во славу Его. Поступить иначе — значит растратить впустую жизнь, дарованную Неумирающим. Стать вором. Мы помогаем людям понять это, помогаем им жить и умереть правильно".'
  speaker: Kibellah
  parts:
