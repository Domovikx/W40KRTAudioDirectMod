  event: Companions_Kibellah_20
  text: '"Кровавая паутина сплетает нитями веры отсеки корабля — таково наше служение Домини из рода фон Валанциус. Неумирающий повелел им бороздить пустоту на корабле, и долгом нашим стало беречь эту бесценную реликвию — твой бесценный род и ковчег, что стал домом сего рода. Великая реликвия из крови и адамантиума".'
  speaker: null
