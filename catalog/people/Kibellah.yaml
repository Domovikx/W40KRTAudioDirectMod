    text_clean: Кибелла недоуменно хмурится.
  - speaker: Кибелла
    text_clean: Неумирающий Император и есть смерть. Мы служим Ему, а значит, мы служим смерти. Это не сравнение, не титул, не прихоть. Так есть. И никто не в силах изменить неизменное.
- guid: 28bdfecb-9689-46bb-b887-a83166e3ee6e
  event: Companions_Kibellah_28
  text: '"Истину говорить нетрудно".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Истину говорить нетрудно.
- guid: ffc72996-1acc-47f2-bfef-19f5753635ba
  event: Companions_Kibellah_29
  text: '{n}Брови Кибеллы неодобрительно хмурятся.{/n} "Я лишь Его возмездное копье — не ведьма, не колдунья, не провидица. Во мне нет особых сил, но на мне лежит Его Благословение. Я не повелеваю завесой, меня направляет шепот Его. Вера моя. Завет Паутины. Прошу, не смущай более мой разум подобными замечаниями".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Брови Кибеллы неодобрительно хмурятся.
  - speaker: Кибелла
    text_clean: Я лишь Его возмездное копье — не ведьма, не колдунья, не провидица. Во мне нет особых сил, но на мне лежит Его Благословение. Я не повелеваю завесой, меня направляет шепот Его. Вера моя. Завет Паутины. Прошу, не смущай более мой разум подобными замечаниями.
- guid: 26b0bba2-c941-4279-8dcc-3df8dd17509d
  event: Companions_Kibellah_3
  text: '"Пойдем же, Домин". {n}С мрачной решимостью Кибелла чертит стальным когтем линию, пересекающую лицо пополам, и молча ступает вперед.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Пойдем же, Домин.
  - speaker: narrator
    text_clean: С мрачной решимостью Кибелла чертит стальным когтем линию, пересекающую лицо пополам, и молча ступает вперед.
- guid: 7e2c90f0-6038-4565-b629-c7cd13f572c4
  event: Companions_Kibellah_30
  text: '"С помощью крови и {g|Encyclopedia:ImperialTarotGlossary}Его священных карт{/g} я совершаю гадания, пытаясь расслышать, что шепчет Неумирающий". {n}В голосе Кибеллы звучат трепет и почтение.{/n} "Его Таро — не ответ, но вопрос, который я задаю бесконечности. Вопрос, на который мироздание отвечает своим вопросом. И в этой беседе без ответов мне открываются сотни исходов. Все они — правда. И все они — лишь видение. Что действительно. Что непременно будет... Я знаю и не знаю одновременно".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: С помощью крови и Его священных карт я совершаю гадания, пытаясь расслышать, что шепчет Неумирающий.
  - speaker: narrator
    text_clean: В голосе Кибеллы звучат трепет и почтение.
  - speaker: Кибелла
    text_clean: Его Таро — не ответ, но вопрос, который я задаю бесконечности. Вопрос, на который мироздание отвечает своим вопросом. И в этой беседе без ответов мне открываются сотни исходов. Все они — правда. И все они — лишь видение. Что действительно. Что непременно будет... Я знаю и не знаю одновременно.
- guid: f961b1d5-1ee8-4b16-8e39-439bbbc66986
  event: Companions_Kibellah_31
  text: '"Завет Паутины учит говорить за себя деяниями, не словами. Я привыкла молчать о себе, ибо в культе все и так обо мне знают. Спрашивай — я попробую ответить так, чтобы удовлетворить твою жажду познания".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Завет Паутины учит говорить за себя деяниями, не словами. Я привыкла молчать о себе, ибо в культе все и так обо мне знают. Спрашивай — я попробую ответить так, чтобы удовлетворить твою жажду познания.
- guid: 971fec64-a1e0-4d5f-8fff-cc6584008e7f
  event: Companions_Kibellah_32
  text: '"Спрашивай карты, Домин''{name}. А я буду слушать". {n}Кибелла бережно вынимает колоду имперских Таро. Черный клинок мелькает перед глазами, и темная кровь, струящаяся с ладони культистки, окропляет карты. Кибелла закрывает глаза... и прислушивается.{/n}'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Спрашивай карты, Домин'КЭП. А я буду слушать.
  - speaker: narrator
    text_clean: Кибелла бережно вынимает колоду имперских Таро. Черный клинок мелькает перед глазами, и темная кровь, струящаяся с ладони культистки, окропляет карты. Кибелла закрывает глаза... и прислушивается.
- guid: 3bf8b434-4e7e-42fc-9722-00be75b14dc3
  event: Companions_Kibellah_33
  text: '"Нет".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Нет.
- guid: d374fcfa-6b46-48bf-8aa9-b8f1174adf42
  event: Companions_Kibellah_34
  text: '"Не испытав боль, физическую или душевную, невозможно осознать ценность тела и духа. Боль уходит, и остается опыт. Опыт оттачивается, подобно клинку, и становится мастерством. Я никогда не жалела о стезе, по которой мне было суждено пройти".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Не испытав боль, физическую или душевную, невозможно осознать ценность тела и духа. Боль уходит, и остается опыт. Опыт оттачивается, подобно клинку, и становится мастерством. Я никогда не жалела о стезе, по которой мне было суждено пройти.
- guid: 2d6ec83f-fbdb-4f5e-8dd7-1db74dea89fe
  event: Companions_Kibellah_35
  text: '"Попадая в культ, мы отрекаемся от прошлого. И обретаем новых братьев и сестер. Я видела ужас, и боль, и сомнения в глазах тех, кому Неумирающий прошептал знакомые имена. Для некоторых... Забвение является благом, сравнимым с даром смерти".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Попадая в культ, мы отрекаемся от прошлого. И обретаем новых братьев и сестер. Я видела ужас, и боль, и сомнения в глазах тех, кому Неумирающий прошептал знакомые имена. Для некоторых... Забвение является благом, сравнимым с даром смерти.
- guid: d7380c4d-b52d-46db-9efd-70db0f49c138
  event: Companions_Kibellah_36
  text: '"Если ты ставишь перед собой великую цель служения Неумирающему, будь готов заплатить великую цену. Чувства. Кровь. Жизнь. Смерть. Память. На пути к становлению Его разящим копьем каждый теряет что-то из того, чем больше всего дорожит. Некоторые — теряют все. Но и обретают все".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Если ты ставишь перед собой великую цель служения Неумирающему, будь готов заплатить великую цену. Чувства. Кровь. Жизнь. Смерть. Память. На пути к становлению Его разящим копьем каждый теряет что-то из того, чем больше всего дорожит. Некоторые — теряют все. Но и обретают все.
- guid: 02811f15-6389-424c-bdd2-7a6b79a5eb2a
  event: Companions_Kibellah_37
  text: '"Невозможно выковать клинок, не используя молота и закалки, как невозможно быть Лорд-капитаном и не проливать крови врагов и подданных своих. У каждого свой молот и своя наковальня".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Невозможно выковать клинок, не используя молота и закалки, как невозможно быть Лорд-капитаном и не проливать крови врагов и подданных своих. У каждого свой молот и своя наковальня.
- guid: 6762e92a-77bf-440a-896e-aa7423dbffe8
  event: Companions_Kibellah_38
  text: '"Истязаю?.." {n}Кибелла вздымает тонкую бровь.{/n} "Я несу на себе сакральные знаки служения Неумирающему. Стигматы, подаренные самой смертью. Мой долг — лелеять кровоточащие дары Его, когда иные лелеют пустое богатство или бессмысленную красоту. В каждом символе — смысл служения Ему. В каждой капле крови — благословение, дарованное Им. Отказаться от них значит отвернуться от самого Неумирающего".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Истязаю?..
  - speaker: narrator
    text_clean: Кибелла вздымает тонкую бровь.
  - speaker: Кибелла
    text_clean: Я несу на себе сакральные знаки служения Неумирающему. Стигматы, подаренные самой смертью. Мой долг — лелеять кровоточащие дары Его, когда иные лелеют пустое богатство или бессмысленную красоту. В каждом символе — смысл служения Ему. В каждой капле крови — благословение, дарованное Им. Отказаться от них значит отвернуться от самого Неумирающего.
- guid: a7ccd6d0-e786-468c-b2bb-6d0bb2229d0a
  event: Companions_Kibellah_39
  text: '"Моя история совсем не такая красочная, как твоя".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Моя история совсем не такая красочная, как твоя.
- guid: 62743ea7-7a43-46a3-8746-52d1c5cdc996
  event: Companions_Kibellah_4
  text: '"Паутина моей души была рассечена на сотни нитей. Каждый раз, погибая, я теряла нечто важное. Незримое. Но когда осталась одна Кибелла, одна я... паутина начала сплетаться вновь. Ее узор уже никогда не будет прежним, но она хранит в себе память Кибеллы. Мою память".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Паутина моей души была рассечена на сотни нитей. Каждый раз, погибая, я теряла нечто важное. Незримое. Но когда осталась одна Кибелла, одна я... паутина начала сплетаться вновь. Ее узор уже никогда не будет прежним, но она хранит в себе память Кибеллы. Мою память.
- guid: 6fb4c8cd-555d-471f-82d5-0b0917783b3b
  event: Companions_Kibellah_40
  text: '"Готик, на котором мы говорим внутри культа, немного отличается от того, что звучит на верхних палубах. "Домин" означает "податель{mf||ница} жизни". "Цар{mf|ь|ица} ковчега". "Солнце, не отбрасывающее теней". Это титул, который Мать-паучиха дала Вольному Торговцу, позволившему ей основать культ Кровавой паутины. Мы используем и другие. Например, "Вени" значит "повелевающий {g|Encyclopedia:WarpGlossary}Имматериумом{/g}" или "страж вуали". "Вил" — "тот, кому пора отправиться по другую сторону". "Амик" — "тот, на кого можно положиться в бою".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Готик, на котором мы говорим внутри культа, немного отличается от того, что звучит на верхних палубах. "Домин" означает "податель жизни". "Царь ковчега". "Солнце, не отбрасывающее теней". Это титул, который Мать-паучиха дала Вольному Торговцу, позволившему ей основать культ Кровавой паутины. Мы используем и другие. Например, "Вени" значит "повелевающий Имматериумом" или "страж вуали". "Вил" — "тот, кому пора отправиться по другую сторону". "Амик" — "тот, на кого можно положиться в бою.
- guid: b1bfedca-547f-4626-8244-59b889eb68e0
  event: Companions_Kibellah_41
  text: '"Нельзя одарить благом того, кто не готов принимать". {n}Кинжал исчезает.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Нельзя одарить благом того, кто не готов принимать.
  - speaker: narrator
    text_clean: Кинжал исчезает.
- guid: 88ce6685-f84c-4f96-afdb-92248e52c669
  event: Companions_Kibellah_42
  text: '"Я уже давно не чувствую боли. Но твое тело точно будет страдать. Прими эту боль, сживись с ней, и она станет твоим спасением даже в самые темные дни".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я уже давно не чувствую боли. Но твое тело точно будет страдать. Прими эту боль, сживись с ней, и она станет твоим спасением даже в самые темные дни.
- guid: f8dbe6da-d1b8-4802-a04e-50b189955fc5
  event: Companions_Kibellah_43
  text: '"Однажды, когда была юна. Среди приближенных Домин''Теодоры Висирь узрел змея, готовившегося впиться ядовитыми клыками в ее горло. Мне было велено того змея вычислить. И отсечь душу от тела. Я наблюдала. Несколько недель из теней, воздуховодных шахт, толпы безликих слуг. И когда отыскала змею — отсекла ей голову и вернулась в храм. Не думаю, что Домин''Теодора видела меня. Но три ритуальных надреза ей подсказали, что смерть угодна Ему. В тот цикл с верхних палуб нам прислали множество яств. Мы раздали их голодающим".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Однажды, когда была юна. Среди приближенных Домин'Теодоры Висирь узрел змея, готовившегося впиться ядовитыми клыками в ее горло. Мне было велено того змея вычислить. И отсечь душу от тела. Я наблюдала. Несколько недель из теней, воздуховодных шахт, толпы безликих слуг. И когда отыскала змею — отсекла ей голову и вернулась в храм. Не думаю, что Домин'Теодора видела меня. Но три ритуальных надреза ей подсказали, что смерть угодна Ему. В тот цикл с верхних палуб нам прислали множество яств. Мы раздали их голодающим.
- guid: 90c9e8dd-a42e-450a-870c-3537a52ed67c
  event: Companions_Kibellah_44
  text: '"Я выслушаю его послание, и сама приму решение. Смерть забирает свое — так или иначе. Но в моих силах отсрочить приговор".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я выслушаю его послание, и сама приму решение. Смерть забирает свое — так или иначе. Но в моих силах отсрочить приговор.
- guid: 7d46c8a4-1422-450b-9918-df4d846e6b36
  event: Companions_Kibellah_45
  text: '"Если Неумирающий пожелает взять в длань твою душу, он возьмет мою вместе с твоей. Но умрешь ты не от моей руки — не в этом мой долг".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Если Неумирающий пожелает взять в длань твою душу, он возьмет мою вместе с твоей. Но умрешь ты не от моей руки — не в этом мой долг.
- guid: 56459be8-1d9e-4ceb-87f5-a36c63a07bea
  event: Companions_Kibellah_46
  text: '"Перед смертью равны и цари, и отверженные. Если на то будет воля Неумирающего — я сопровожу тебя к нему, Домин''{name}".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Перед смертью равны и цари, и отверженные. Если на то будет воля Неумирающего — я сопровожу тебя к нему, Домин'КЭП.
- guid: 038bfcb2-22aa-4ffa-93f0-3908e09ac748
  event: Companions_Kibellah_47
  text: '"Но не мы. Наши нити переплетены навечно, Домин''{name}, ибо мою службу тебе прервет лишь Неумирающий".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Но не мы. Наши нити переплетены навечно, Домин'КЭП, ибо мою службу тебе прервет лишь Неумирающий.
- guid: a7141df0-c821-47cd-b4ff-3f512dc1bc5f
  event: Companions_Kibellah_48
  text: '"Арлекин". Перевернутый "Мученик". "Меч". "Инквизитор". {n}Кибелла задумчиво смотрит на карты.{/n} "Герой из забытых легенд скрывает за маской лицо — он актер, и публика любит его. Сила слов вдохновенных раздует из искр пожар. В нем я вижу... кипящую кровь. И как плавится маска. Под пепелищем из лживых надежд она упокоится. И в своей же игре будет обставлен тот, кто сам мухлевал".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Арлекин". Перевернутый "Мученик". "Меч". "Инквизитор.
  - speaker: narrator
    text_clean: Кибелла задумчиво смотрит на карты.
  - speaker: Кибелла
    text_clean: Герой из забытых легенд скрывает за маской лицо — он актер, и публика любит его. Сила слов вдохновенных раздует из искр пожар. В нем я вижу... кипящую кровь. И как плавится маска. Под пепелищем из лживых надежд она упокоится. И в своей же игре будет обставлен тот, кто сам мухлевал.
- guid: 074cd2e1-a6e6-4843-b7d6-1d801927d6d0
  event: Companions_Kibellah_49
  text: '{n}На обычно непроницаемом лице вы видите тревожное смятение.{/n} "Я... встречу смерть. Дважды. Уже очень скоро. В первый раз она не заберет никого, а во второй... Чей-то путь оборвется, неся перемены для множества жизней. Они могут стать благодатью или проклятьем. Это все, что я вижу".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: На обычно непроницаемом лице вы видите тревожное смятение.
  - speaker: Кибелла
    text_clean: Я... встречу смерть. Дважды. Уже очень скоро. В первый раз она не заберет никого, а во второй... Чей-то путь оборвется, неся перемены для множества жизней. Они могут стать благодатью или проклятьем. Это все, что я вижу.
- guid: 19411d14-19d9-4282-a790-c2518ba27c56
  event: Companions_Kibellah_5
  text: '{n}Кибелла стискивает трясущиеся руки в кулаки, стараясь унять постыдную дрожь.{/n} "Висирь говорил нам: умерев лишь раз, вы не познаете истины. И мы умирали множество раз... Мы так думали. Но то была ложь. Самообман. Мы никогда не отправлялись на другую сторону по-настоящему. А здесь..."'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла стискивает трясущиеся руки в кулаки, стараясь унять постыдную дрожь.
  - speaker: Кибелла
    text_clean: 'Висирь говорил нам: умерев лишь раз, вы не познаете истины. И мы умирали множество раз... Мы так думали. Но то была ложь. Самообман. Мы никогда не отправлялись на другую сторону по-настоящему. А здесь...'
- guid: 712bf512-c395-4f83-9b17-8cd756643f75
  event: Companions_Kibellah_50
  text: '"Первая карта — "Юный воин". Она означает неопытность, путь становления. Карта вторая — "Расколотый мир". Перевернута. Извилистым и тернистым будет тот путь, но на нем соберешь ты соратников и отыщешь то, что утрачено".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Первая карта — "Юный воин". Она означает неопытность, путь становления. Карта вторая — "Расколотый мир". Перевернута. Извилистым и тернистым будет тот путь, но на нем соберешь ты соратников и отыщешь то, что утрачено.
- guid: 607b9eb6-99d6-42c8-8d3d-976d3fe31c0f
  event: Companions_Kibellah_51
  text: '"Сколько себя помню, я всегда жила по Завету Паутины. Делала то, что велено. И не умею иначе. Но, быть может... это и оказалось уязвимым местом в доспехах моей души. Я обдумаю сказанное тобой, Домин''{name}".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Сколько себя помню, я всегда жила по Завету Паутины. Делала то, что велено. И не умею иначе. Но, быть может... это и оказалось уязвимым местом в доспехах моей души. Я обдумаю сказанное тобой, Домин'КЭП.
- guid: 599a021d-9416-4ba4-9255-c91229fed3b7
  event: Companions_Kibellah_52
  text: '{n}Кибелла бросает на вас взгляд — неожиданно растерянный и ранимый. Впрочем, иллюзия держится всего мгновение.{/n} "Благодарю, Домин''{name}. Я тоже отпускаю тебя. Ступай на свою стезю. Я же попробую отыскать ту, что предназначена мне".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла бросает на вас взгляд — неожиданно растерянный и ранимый. Впрочем, иллюзия держится всего мгновение.
  - speaker: Кибелла
    text_clean: Благодарю, Домин'КЭП. Я тоже отпускаю тебя. Ступай на свою стезю. Я же попробую отыскать ту, что предназначена мне.
- guid: 64bd7cbf-5b55-4919-a92d-162a7ea486e0
  event: Companions_Kibellah_53
  text: '{n}Кибелла со всхлипом втягивает воздух, ее взгляд наполняется холодом.{/n} "Бежишь от бремени, Домин''{name}? Недостойно... но будь по-твоему — я более не обременю тебя своими мыслями!"'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла со всхлипом втягивает воздух, ее взгляд наполняется холодом.
  - speaker: Кибелла
    text_clean: Бежишь от бремени, Домин'КЭП? Недостойно... но будь по-твоему — я более не обременю тебя своими мыслями!
- guid: 9335caa8-cf2a-4a80-a622-57273b721df3
  event: Companions_Kibellah_54
  text: '"Мне нужно вернуться в лабиринт. Исполнить танец, сплести новые нити, что напомнят о Кровавой паутине и восстановят мой дух..." {n}Кибелла бросает на вас взгляд. На ее губах появляется тень мягкой улыбки.{/n} "Я пройду его сама. Прости, но мне нужно побыть с собой, Домин''{name}".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Мне нужно вернуться в лабиринт. Исполнить танец, сплести новые нити, что напомнят о Кровавой паутине и восстановят мой дух...
  - speaker: narrator
    text_clean: Кибелла бросает на вас взгляд. На ее губах появляется тень мягкой улыбки.
  - speaker: Кибелла
    text_clean: Я пройду его сама. Прости, но мне нужно побыть с собой, Домин'КЭП.
- guid: 0c342b73-fe1e-423b-b2bf-bf7f9aacb3fa
  event: Companions_Kibellah_55
  text: '{n}Кибелла ждет. И ждет. И ждет. Наконец, она едва слышно вздыхает.{/n} "Я знала. Тебе тоже тягостна эта связь. Я освобождаю тебя от нее. Ступай на свою стезю. А я попытаюсь отыскать собственную в тумане, окутавшем мой разум".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла ждет. И ждет. И ждет. Наконец, она едва слышно вздыхает.
  - speaker: Кибелла
    text_clean: Я знала. Тебе тоже тягостна эта связь. Я освобождаю тебя от нее. Ступай на свою стезю. А я попытаюсь отыскать собственную в тумане, окутавшем мой разум.
- guid: 6ce49e4a-0f47-4f93-adf5-ad8e9891ef78
  event: Companions_Kibellah_56
  text: '"Что ж..." {n}Из голоса Кибеллы пропадает жизнь — девушка звучит словно сервитор с сохранным речевым аппаратом, бубнящий записанную фразу.{/n} "Я твоя тень, и твой клинок, и твой щит. Но я более... не твоя".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Что ж...
  - speaker: narrator
    text_clean: Из голоса Кибеллы пропадает жизнь — девушка звучит словно сервитор с сохранным речевым аппаратом, бубнящий записанную фразу.
  - speaker: Кибелла
    text_clean: Я твоя тень, и твой клинок, и твой щит. Но я более... не твоя.
- guid: 750a6f91-5e45-44f6-a0c6-cb1ebf18ae4c
  event: Companions_Kibellah_57
  text: '{n}Кибелла прикасается к вашей груди.{/n} "Идем же. Откроем друг другу наши души".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла прикасается к вашей груди.
  - speaker: Кибелла
    text_clean: Идем же. Откроем друг другу наши души.
- guid: f844fa41-dac6-4073-ae5f-3e387f2b7a7c
  event: Companions_Kibellah_58
  text: '{n}Кибелла отступает, не давая к себе прикоснуться.{/n} "Прошу тебя..." {n}Ее голос переполнен болью.{/n}'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла отступает, не давая к себе прикоснуться.
  - speaker: Кибелла
    text_clean: Прошу тебя...
  - speaker: narrator
    text_clean: Ее голос переполнен болью.
- guid: ac981edb-4d6c-44b4-add0-cf29bae2c9ff
  event: Companions_Kibellah_59
  text: '{n}Кибелла приникает к вам, отдаваясь поцелую без остатка. Ее руки скользят по вашему лицу, когда она отстраняется от вас и бросает опаляющий сердце взгляд.{/n} "Все мои мысли лишь о тебе, Домин''{name}".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла приникает к вам, отдаваясь поцелую без остатка. Ее руки скользят по вашему лицу, когда она отстраняется от вас и бросает опаляющий сердце взгляд.
  - speaker: Кибелла
    text_clean: Все мои мысли лишь о тебе, Домин'КЭП.
- guid: 767d883e-d094-4b13-b9ff-bb15dff8a3d8
  event: Companions_Kibellah_6
  text: '{n}Время, проведенное в Темном городе, отпечаталось на лике Кибеллы мрачной маской несмерти: кожа посинела, словно у трупа, а священные стигматы, с яростью вскрытые клинком в момент умопомрачения, разбухли и воспалились.{/n} "Я... могу сражаться. Не бойся вынуть сей клинок из ножен, когда он понадобится".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Время, проведенное в Темном городе, отпечаталось на лике Кибеллы мрачной маской несмерти: кожа посинела, словно у трупа, а священные стигматы, с яростью вскрытые клинком в момент умопомрачения, разбухли и воспалились.'
  - speaker: Кибелла
    text_clean: Я... могу сражаться. Не бойся вынуть сей клинок из ножен, когда он понадобится.
- guid: d9265c6a-561e-4e7e-931c-7e791428a2ea
  event: Companions_Kibellah_60
  text: '{n}Бледное лицо Кибеллы каменеет, в глазах застывает суровая жесткость.{/n} "Ибо в этом воля Его. Ибо в этом мой долг. Я... помню".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Бледное лицо Кибеллы каменеет, в глазах застывает суровая жесткость.
  - speaker: Кибелла
    text_clean: Ибо в этом воля Его. Ибо в этом мой долг. Я... помню.
- guid: 09e11938-7023-4328-bd1b-fb122a326e90
  event: Companions_Kibellah_61
  text: '"Боль не властна над моим телом. Одним выстрелом меня не сломить. И все же..." {n}Кибелла прикладывает ладонь к месту, где недавно зияла рана.{/n} "Раньше, оказавшись между нежизнью и несмертью, я была спокойна. Ибо разум мой был полон решимости и смирения. Но когда Немезит нажал на курок, я вдруг осознала..."'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Боль не властна над моим телом. Одним выстрелом меня не сломить. И все же...
  - speaker: narrator
    text_clean: Кибелла прикладывает ладонь к месту, где недавно зияла рана.
  - speaker: Кибелла
    text_clean: Раньше, оказавшись между нежизнью и несмертью, я была спокойна. Ибо разум мой был полон решимости и смирения. Но когда Немезит нажал на курок, я вдруг осознала...
- guid: 2469e631-d675-401d-bb9b-397e46ef14da
  event: Companions_Kibellah_62
  text: '{n}Кибелла смотрит вам прямо в глаза.{/n} "...насколько близка длань Неумирающего и холодно ее прикосновение. Я подумала, что могу отправиться на другую сторону, не закончив свое служение, и разгневалась на... Него. А затем — на себя. Воистину, все мы грешны перед Ним".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла смотрит вам прямо в глаза.
  - speaker: Кибелла
    text_clean: '...насколько близка длань Неумирающего и холодно ее прикосновение. Я подумала, что могу отправиться на другую сторону, не закончив свое служение, и разгневалась на... Него. А затем — на себя. Воистину, все мы грешны перед Ним.'
- guid: 13ba06a7-2756-4597-89ac-431289167793
  event: Companions_Kibellah_63
  text: '{n}Кибелла хмурится.{/n} "... что успела немногое. Благо, что я несла пастве своей — пылинка в песочных часах вечности. Мне захотелось... жить. Плести дальше Кровавую паутину. Столь эгоистичное желание порочит Завет".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла хмурится.
  - speaker: Кибелла
    text_clean: '... что успела немногое. Благо, что я несла пастве своей — пылинка в песочных часах вечности. Мне захотелось... жить. Плести дальше Кровавую паутину. Столь эгоистичное желание порочит Завет.'
- guid: 75c1731d-2ca6-4485-bceb-deecb7c924eb
  event: Companions_Kibellah_64
  text: '{n}Кибелла делает глубокий вдох.{/n} "...что меня обуревает ярость. Я хотела жить. Не ради Завета Паутины и Неумирающего. Ради себя".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла делает глубокий вдох.
  - speaker: Кибелла
    text_clean: '...что меня обуревает ярость. Я хотела жить. Не ради Завета Паутины и Неумирающего. Ради себя.'
- guid: eafe4aa8-5e7e-47ac-8748-6e6006c23e0e
  event: Companions_Kibellah_65
  text: '"Я буду трудиться усерднее, дабы оправдать твое доверие".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я буду трудиться усерднее, дабы оправдать твое доверие.
- guid: 0a2dc77a-ef22-4a14-b314-138a80522f5c
  event: Companions_Kibellah_66
  text: '"Следующему разу я не позволю случиться". {n}Кибелла стискивает в руках череп "Немо", и стальные когти врезаются в кость со скрипом.{/n}'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Следующему разу я не позволю случиться.
  - speaker: narrator
    text_clean: Кибелла стискивает в руках череп "Немо", и стальные когти врезаются в кость со скрипом.
- guid: 96f5cb61-2507-4091-9e84-5e23fa292e0b
  event: Companions_Kibellah_67
  text: '"Много лет я совершенствовала тело и дух в сакральных ритуалах. Переправила на другую сторону сотни душ. Охота на Немезита — не первая для меня. Однако впервые после того, как враг повержен, я..." {n}Каждое слово дается ей с трудом.{/n} "Почувствовала себя опустошенной. И вопрос, что созрел в моем сознании во время охоты, утяжелил груз пустоты".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Много лет я совершенствовала тело и дух в сакральных ритуалах. Переправила на другую сторону сотни душ. Охота на Немезита — не первая для меня. Однако впервые после того, как враг повержен, я...
  - speaker: narrator
    text_clean: Каждое слово дается ей с трудом.
  - speaker: Кибелла
    text_clean: Почувствовала себя опустошенной. И вопрос, что созрел в моем сознании во время охоты, утяжелил груз пустоты.
- guid: f6c60088-f9bb-4e25-ae28-6bb869e3a076
  event: Companions_Kibellah_68
  text: '{n}Кибелла отводит взгляд.{/n} "...что могу больше никогда не увидеть твоего лица, Домин''{name}".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла отводит взгляд.
  - speaker: Кибелла
    text_clean: '...что могу больше никогда не увидеть твоего лица, Домин''КЭП.'
- guid: 592dae80-6571-4208-b337-b0e12c9a2d68
  event: Companions_Kibellah_69
  text: '"И впервые за годы я почувствовала боль. Это смутило меня. И смущает сейчас. Раны плоти затянутся, но если закровоточит душа, твой клинок станет ненадежен. Недостоин быть подле тебя".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: И впервые за годы я почувствовала боль. Это смутило меня. И смущает сейчас. Раны плоти затянутся, но если закровоточит душа, твой клинок станет ненадежен. Недостоин быть подле тебя.
- guid: db6abe33-32b7-4399-b503-b399c94ef081
  event: Companions_Kibellah_7
  text: '"Я слышала лишь о том, как проклятый мясник из рода ксеносов хвастался очередным краденным солнцем. Истина это или очередная ложь врагов Неумирающего? Мне неизвестно".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я слышала лишь о том, как проклятый мясник из рода ксеносов хвастался очередным краденным солнцем. Истина это или очередная ложь врагов Неумирающего? Мне неизвестно.
- guid: f6a2d4a5-8d10-4d70-979e-280db4cc9f03
  event: Companions_Kibellah_70
  text: '"Я познала одиннадцать смертей и воскрешений. Но истины не открылось. Стало... лишь больше вопросов. Где начинаюсь я и кончаюсь я? Неужели можно столь легко вырвать душу из дланей Неумирающего и возвратить в тело? Если смерть есть не начало, не конец, не путь... то что есть смерть?"'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я познала одиннадцать смертей и воскрешений. Но истины не открылось. Стало... лишь больше вопросов. Где начинаюсь я и кончаюсь я? Неужели можно столь легко вырвать душу из дланей Неумирающего и возвратить в тело? Если смерть есть не начало, не конец, не путь... то что есть смерть?
- guid: d3fbd2aa-6673-442c-905f-0ee5968917c5
  event: Companions_Kibellah_71
  text: '"Я долго молилась, и в шепоте Его жаждала обрести успокоение. Но, жалея себя, я проявила слабость пред Ним, и молчание было ответом. Потому терзающий разум вопрос я задаю тебе. Ответь, Домин: в чем видишь ты предназначение ткачей Кровавой паутины?"'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: 'Я долго молилась, и в шепоте Его жаждала обрести успокоение. Но, жалея себя, я проявила слабость пред Ним, и молчание было ответом. Потому терзающий разум вопрос я задаю тебе. Ответь, Домин: в чем видишь ты предназначение ткачей Кровавой паутины?'
- guid: a6a9914d-9780-42d0-ae9c-cf41eb2f31be
  event: Companions_Kibellah_72
  text: '"Когда мне надо излить мысли или скоротать часы одиночества, я обращаюсь к нему. В смерти он стал мудрее, чем был при жизни".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Когда мне надо излить мысли или скоротать часы одиночества, я обращаюсь к нему. В смерти он стал мудрее, чем был при жизни.
- guid: 56d3a6e9-2dbc-47b0-8aa6-10d9e72d7b63
  event: Companions_Kibellah_73
  text: '"Невозможно, Домин. Я — твой щит. Я нужна для этого".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Невозможно, Домин. Я — твой щит. Я нужна для этого.
- guid: ba7bc37a-5962-4903-b765-b6a0fc3ed359
  event: Companions_Kibellah_74
  text: '"Значит, я — инструмент, отрекшийся от себя и всего мира ради служения цели, избранной другими".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Значит, я — инструмент, отрекшийся от себя и всего мира ради служения цели, избранной другими.
- guid: d68d9bdf-9190-4f7f-86d6-b5b2a7328aed
  event: Companions_Kibellah_75
  text: '"Значит, я — самопровозглашенная судья, и палач, и кумир. И судьба моя в том, чтобы держать стадо в страхе и послушании".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Значит, я — самопровозглашенная судья, и палач, и кумир. И судьба моя в том, чтобы держать стадо в страхе и послушании.
- guid: d2e8a64e-a679-4e1f-b46a-b2b5a473ef84
  event: Companions_Kibellah_76
  text: '"Я с детства шла указанной мне стезей. Делала, что велено. Искала истину в чужих словах, а затем повторяла ее своим голосом. Я никогда не подвергала сомнению свою судьбу... Пока не появился ты, Немо". {n}Кибелла почти ласково скребет металлическими когтями по черепу в руках.{/n}'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Я с детства шла указанной мне стезей. Делала, что велено. Искала истину в чужих словах, а затем повторяла ее своим голосом. Я никогда не подвергала сомнению свою судьбу... Пока не появился ты, Немо.
  - speaker: narrator
    text_clean: Кибелла почти ласково скребет металлическими когтями по черепу в руках.
- guid: e402fa07-f15d-457c-8944-60e6cb345ab7
  event: Companions_Kibellah_77
  text: '"И не мне". {n}Голос Кибеллы глух.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: И не мне.
  - speaker: narrator
    text_clean: Голос Кибеллы глух.
- guid: dd47a8e7-c677-48d8-b969-0d2efc07226f
  event: Companions_Kibellah_78
  text: '"Прошу, просто ответь".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Прошу, просто ответь.
- guid: c1991467-2e58-49b0-a11f-08b22e72751f
  event: Companions_Kibellah_79
  text: '"Значит, я — живое оружие чужой воли, закаленное на наковальне Завета молотом долга".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Значит, я — живое оружие чужой воли, закаленное на наковальне Завета молотом долга.
- guid: afbb15c8-4d96-490f-b780-b5a9ac0ddd92
  event: Companions_Kibellah_8
  text: '{n}Кибелла кивает и закрывает глаза.{/n} "...Гончие Твои, бегущие по кровавому следу врагов Твоих. Не убоимся встретить конец, ибо с ним встретим мы и Тебя".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла кивает и закрывает глаза.
  - speaker: Кибелла
    text_clean: '...Гончие Твои, бегущие по кровавому следу врагов Твоих. Не убоимся встретить конец, ибо с ним встретим мы и Тебя.'
- guid: aa4a44f4-5001-4340-b25c-28ac6d242c39
  event: Companions_Kibellah_80
  text: '"Значит, я — пастырь, ведущий людей за идеей, которую они даже не в силах осмыслить".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Значит, я — пастырь, ведущий людей за идеей, которую они даже не в силах осмыслить.
- guid: a9ac5159-6bf6-4874-a655-92b3478262c3
  event: Companions_Kibellah_81
  text: '"Я могла оказаться на месте Немезита, а он — на моем, стоило нитям судьбы сплестись чуть иначе. Лишь разность идей отличает нас". {n}Взгляд ее стал задумчивый и глубокий.{/n} "Спасибо за разговор, Домин''{name}. Пусть на время, но он заполнил пустоту, что гложет душу. Как запечатать ее навсегда... мне еще предстоит выяснить. И да поможет Завет Паутины найти верный путь".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я могла оказаться на месте Немезита, а он — на моем, стоило нитям судьбы сплестись чуть иначе. Лишь разность идей отличает нас.
  - speaker: narrator
    text_clean: Взгляд ее стал задумчивый и глубокий.
  - speaker: Кибелла
    text_clean: Спасибо за разговор, Домин'КЭП. Пусть на время, но он заполнил пустоту, что гложет душу. Как запечатать ее навсегда... мне еще предстоит выяснить. И да поможет Завет Паутины найти верный путь.
- guid: 0e43356d-31aa-4969-8a7d-7030b89e7893
  event: Companions_Kibellah_82
  text: '{n}Кибелла изгибает губы в улыбке.{/n} "Домин''{name}... позволь поблагодарить тебя за откровение, что мы разделили наедине. Пускай души наши закрыты друг от друга... но тела звучат в унисон".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла изгибает губы в улыбке.
  - speaker: Кибелла
    text_clean: Домин'КЭП... позволь поблагодарить тебя за откровение, что мы разделили наедине. Пускай души наши закрыты друг от друга... но тела звучат в унисон.
- guid: 01f43b73-386b-4aed-9b22-d739ce73a216
  event: Companions_Kibellah_83
  text: '"Я ждала твоих вопросов, Домин. Спрашивай".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я ждала твоих вопросов, Домин. Спрашивай.
- guid: 1725af6b-0a3c-4b06-a117-72125d44b900
  event: Companions_Kibellah_84
  text: '"На то была воля Неумирающего. Но прежде — воля твоя, Домин''{name}. Ты благословил{mf||а} меня на охоту, чтобы я привела тебя к Немезиту. Я сделала то, что должен был сделать твой клинок. И охота увенчалась успехом".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: На то была воля Неумирающего. Но прежде — воля твоя, Домин'КЭП. Ты благословил меня на охоту, чтобы я привела тебя к Немезиту. Я сделала то, что должен был сделать твой клинок. И охота увенчалась успехом.
- guid: 41be6395-8abe-4d0d-89ae-001f1f16ec8f
  event: Companions_Kibellah_85
  text: '"Может, то был морок от ритуальной эссенции. Может — воля Неумирающего. Я... тоже чувствовала нить между нами. Иногда мне казалось, что я чувствую тебя рядом. И от этого становилось спокойно".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Может, то был морок от ритуальной эссенции. Может — воля Неумирающего. Я... тоже чувствовала нить между нами. Иногда мне казалось, что я чувствую тебя рядом. И от этого становилось спокойно.
- guid: 08f67f10-96f9-4734-9411-8e18cb308c02
  event: Companions_Kibellah_86
  text: '"Если считаешь, что я должна быть наказана... Я принимаю твой гнев".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Если считаешь, что я должна быть наказана... Я принимаю твой гнев.
- guid: ce2235ba-e250-47a0-9c29-b3c1ca9f2dd0
  event: Companions_Kibellah_87
  text: '{n}Уголок рта Кибеллы едва дергается.{/n} "Я принимаю наказание. И благодарю за сохраненную жизнь. Ибо я еще надеюсь послужить тебе".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Уголок рта Кибеллы едва дергается.
  - speaker: Кибелла
    text_clean: Я принимаю наказание. И благодарю за сохраненную жизнь. Ибо я еще надеюсь послужить тебе.
- guid: 6b8e342b-099f-49f0-8534-de6f4bbcf99e
  event: Companions_Kibellah_88
  text: '"Я лишь исполняла волю Его". {n}Голос звучит бесстрастно, но тонкая полуулыбка выдает, что девушке приятны ваши слова.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я лишь исполняла волю Его.
  - speaker: narrator
    text_clean: Голос звучит бесстрастно, но тонкая полуулыбка выдает, что девушке приятны ваши слова.
- guid: 0b10adb9-6044-4a54-83f6-455d6fbb0209
  event: Companions_Kibellah_89
  text: '"Нет. Один из приспешников лжегероя сбежал, и нет мне за то прощения".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Нет. Один из приспешников лжегероя сбежал, и нет мне за то прощения.
- guid: 8eda67ea-fe32-42a9-835d-c633b95575c3
  event: Companions_Kibellah_9
  text: '"Висирь учил, что культистами смерти зовут нам подобных — священных убийц, проливающих кровь во имя Его по всему Империуму. Также учил он, что не бывает двух одинаковых культов смерти, как не бывает двух идентичных звезд. Я поведаю тебе о Кровавой паутине, но за все культы смерти говорить не смогу".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Висирь учил, что культистами смерти зовут нам подобных — священных убийц, проливающих кровь во имя Его по всему Империуму. Также учил он, что не бывает двух одинаковых культов смерти, как не бывает двух идентичных звезд. Я поведаю тебе о Кровавой паутине, но за все культы смерти говорить не смогу.
- guid: 09bc3484-3610-4fd0-aaa6-7cae7601ed75
  event: Companions_Kibellah_90
  text: '{n}В глазах Кибеллы поблескивает азарт.{/n} "То была славная слежка. Добыча угодила в кровавые сети и встретила конец — как и должно быть".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: В глазах Кибеллы поблескивает азарт.
  - speaker: Кибелла
    text_clean: То была славная слежка. Добыча угодила в кровавые сети и встретила конец — как и должно быть.
- guid: 8b0bba89-44be-4b61-9ce9-da873b96cd6a
  event: Companions_Kibellah_91
  text: '"Мне... стыдно. За то, что я говорила. За то, как вела себя. За свои сомнения. Теперь, когда я вновь вижу звезды в иллюминаторах, чувствую биение корабельного сердца, дышу терпким воздухом нижних палуб... Мой разум просветлел. Я — это я. Кибелла, слуга Неумирающего. Твой клинок и твой щит. Сие останется неизменно — отныне и впредь. Я... останусь неизменна".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Мне... стыдно. За то, что я говорила. За то, как вела себя. За свои сомнения. Теперь, когда я вновь вижу звезды в иллюминаторах, чувствую биение корабельного сердца, дышу терпким воздухом нижних палуб... Мой разум просветлел. Я — это я. Кибелла, слуга Неумирающего. Твой клинок и твой щит. Сие останется неизменно — отныне и впредь. Я... останусь неизменна.
- guid: 88468aa0-3670-4bd6-a8a5-f959b0e6240d
  event: Companions_Kibellah_92
  text: '"Тогда нам нужно уединиться. В твоих покоях никто не потревожит нас. Идем".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Тогда нам нужно уединиться. В твоих покоях никто не потревожит нас. Идем.
- guid: 82cb2fbd-3721-428f-907c-d7de96a79aa5
  event: Companions_Kibellah_93
  text: '"Домин''{name}. Священн{mf|ый|ая} цар{mf|ь|ица} ковчега, мо{mf|й|я} защитни{mf|к|ца} и {mf|друг|подруга}". {n}Кибелла стоит, уверенно расправив плечи. Темные глаза сияют ярче звезд.{/n} "Чем Висирь Кровавой паутины, твоя тень, твой щит, твой клинок, может служить тебе?"'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Домин'КЭП. Священный царь ковчега, мой защитник и друг.
  - speaker: narrator
    text_clean: Кибелла стоит, уверенно расправив плечи. Темные глаза сияют ярче звезд.
  - speaker: Кибелла
    text_clean: Чем Висирь Кровавой паутины, твоя тень, твой щит, твой клинок, может служить тебе?
- guid: c9742a05-136a-4058-a5ef-d430032ec85f
  event: Companions_Kibellah_94
  text: '{n}Губы Кибеллы кривятся в мрачной полуулыбке.{/n} "Я — твоя тень, Домин''{name}. Куда бы ты ни направил{mf|ся|ась}, я всегда буду следовать за тобой. Я вижу твои деяния. Я слышу твои молитвы. Но я жду. Когда Неумирающий прошепчет твое имя, мои клинки освободят тебя от тяжести твоих грехов. Но пока Он молчит, я — твой меч. И твой щит, Домин. Так было. Так будет".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Губы Кибеллы кривятся в мрачной полуулыбке.
  - speaker: Кибелла
    text_clean: Я — твоя тень, Домин'КЭП. Куда бы ты ни направился, я всегда буду следовать за тобой. Я вижу твои деяния. Я слышу твои молитвы. Но я жду. Когда Неумирающий прошепчет твое имя, мои клинки освободят тебя от тяжести твоих грехов. Но пока Он молчит, я — твой меч. И твой щит, Домин. Так было. Так будет.
- guid: f1d114c0-9de6-4b91-b0df-9bf8046dad14
  event: Companions_Kibellah_95
  text: '{n}Кибелла оценивающе смотрит на вас.{/n} "Ты извест{mf|ен|на} своим талантом к рукопашной схватке. Тело твое закалено, и, может быть, тебе удастся освоить некоторые наши приемы. Но наше искусство — не только набор движений. Это еще и умение отдаться танцу смерти без остатка. Дабы сражаться как мы, тебе пришлось бы опустошить себя. Начать с чистого листа, отвергнув не только титул Домин, но и память о прошлом".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла оценивающе смотрит на вас.
  - speaker: Кибелла
    text_clean: Ты известен своим талантом к рукопашной схватке. Тело твое закалено, и, может быть, тебе удастся освоить некоторые наши приемы. Но наше искусство — не только набор движений. Это еще и умение отдаться танцу смерти без остатка. Дабы сражаться как мы, тебе пришлось бы опустошить себя. Начать с чистого листа, отвергнув не только титул Домин, но и память о прошлом.
- guid: fc449ce2-daf3-47d3-8811-af43363da1f7
  event: Companions_Kibellah_96
  text: '"Да будет так". {n}Кибелла смиренно ожидает, пока вы обнажаете подходящий участок тела. В умелых руках культистки заточенный клинок нежно рассекает кожу, и сакральный символ начинает мучительно жечь и кровоточить.{/n} "Береги Его дар, Домин''{name}. Обновляй своей рукой под молитвы Ему. И однажды да снизойдет благодать".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Да будет так.
  - speaker: narrator
    text_clean: Кибелла смиренно ожидает, пока вы обнажаете подходящий участок тела. В умелых руках культистки заточенный клинок нежно рассекает кожу, и сакральный символ начинает мучительно жечь и кровоточить.
  - speaker: Кибелла
    text_clean: Береги Его дар, Домин'КЭП. Обновляй своей рукой под молитвы Ему. И однажды да снизойдет благодать.
- guid: 78f854dc-3d80-45ec-bcfa-f586f43bb758
  event: Companions_Kibellah_97
  text: '{n}Потерянный взгляд Кибеллы бродит по временному пристанищу, пока обескровленные губы шепчут слова молитвы Неумирающему, запинаясь на каждом слове.{/n} "Ибо мы — клинки Твои, закаленные кровью и тьмою. Ибо мы крылья Твои, сломленные, лишенные оперения. В час, когда разольется кровь рекою смерти, огради нас от слабости. Выжги страх и отчаяние, порочащие наши ду..." {n}— Кибелла запинается, и руки ее начинают дрожать, —{/n} "Наши души, что Тебе предназначены".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Потерянный взгляд Кибеллы бродит по временному пристанищу, пока обескровленные губы шепчут слова молитвы Неумирающему, запинаясь на каждом слове.
  - speaker: Кибелла
    text_clean: Ибо мы — клинки Твои, закаленные кровью и тьмою. Ибо мы крылья Твои, сломленные, лишенные оперения. В час, когда разольется кровь рекою смерти, огради нас от слабости. Выжги страх и отчаяние, порочащие наши ду...
  - speaker: narrator
    text_clean: — Кибелла запинается, и руки ее начинают дрожать, —
  - speaker: Кибелла
    text_clean: Наши души, что Тебе предназначены.
- guid: b0d684b4-deef-4e0f-841d-10e7344db8d9
  event: Companions_Kibellah_98
  text: '"Одни ненавидят нас и боятся, называют убийцами и жнецами. Иные величают танцорами Смерти, что души усопших проводят в мир после жизни. И те и другие правы. И те и другие ошибаются. Мы — слуги {g|Encyclopedia:EmperorGlossary}Неумирающего Императора{/g}. Когда Он шепчет, что душе праведника или мученика пора в его благословенные длани — мы забираем ее. Когда Он шепчет, что нечестивцам пора познать гнев его — мы пожинаем. Так мы поддерживаем порядок на корабле. Незримые, ведомые волей Смерти".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Одни ненавидят нас и боятся, называют убийцами и жнецами. Иные величают танцорами Смерти, что души усопших проводят в мир после жизни. И те и другие правы. И те и другие ошибаются. Мы — слуги Неумирающего Императора. Когда Он шепчет, что душе праведника или мученика пора в его благословенные длани — мы забираем ее. Когда Он шепчет, что нечестивцам пора познать гнев его — мы пожинаем. Так мы поддерживаем порядок на корабле. Незримые, ведомые волей Смерти.
- guid: 1cc26a0d-0ded-4c39-a28c-a5486091f0a1
  event: Companions_Kibellah_99
  text: '{n}Кибелла мягко качает головой.{/n} "Шепот смерти невозможно спутать ни с шепотом звезд, ни с шепотом скверны. Он честен. Чист. Непреклонен. Только высшие ткачи способны слышать Неумирающего и передавать волю Его. Для того они множество лет закаляют тело, и душу, и все свои чувства. Если тебе так спокойнее, можешь называть то, что мы слышим... провидением Его".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла мягко качает головой.
  - speaker: Кибелла
    text_clean: Шепот смерти невозможно спутать ни с шепотом звезд, ни с шепотом скверны. Он честен. Чист. Непреклонен. Только высшие ткачи способны слышать Неумирающего и передавать волю Его. Для того они множество лет закаляют тело, и душу, и все свои чувства. Если тебе так спокойнее, можешь называть то, что мы слышим... провидением Его.
- guid: 1276e206-0c32-4a60-9433-347f4bce6be4
  event: Companions_Kibellah_ArbitesReaction_01
  text: '"Амик''Соломон, страж законов. Ты держишься так близко к нему, потому что страшишься его приговоров? Напрасно. Лишь Неумирающий может судить тебя".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Амик'Соломон, страж законов. Ты держишься так близко к нему, потому что страшишься его приговоров? Напрасно. Лишь Неумирающий может судить тебя.
- guid: 57fcd5d5-39fe-41c0-b6e0-9780ceaaeef7
  event: Companions_Kibellah_ArbitesReaction_02
  text: '"Домин". {n}Кибелла вздергивает подбородок, ее глаза черны, как сама бездна.{/n} "Мне ведомо, что {d|Encyclopedia:MiniJealousyRomanceBroken}ты решил{mf||а} связать себя с иной нитью{/d}. Что ж, я покоряюсь твоей воле и отныне буду довольствоваться ролью лишь клинка и тени — единственных нерушимых уз, что мне дозволены".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Домин.
  - speaker: narrator
    text_clean: Кибелла вздергивает подбородок, ее глаза черны, как сама бездна.
  - speaker: Кибелла
