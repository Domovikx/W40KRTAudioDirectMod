- guid: a85bceb6-8f57-428f-be0a-0133a9aae58c
  event: DeathCultIntroduction_01
  text: '{n}Рослая девушка выступает вперед, и ропот офицеров стихает, но вы все равно не слышите звука ее шагов. Приглушенный свет {g|Encyclopedia:Lumen}люменов{/g} играет тенями на маске, скрывающей ее лицо.{/n} "Неумирающий Император велел нам сплетать кровавую паутину вокруг чад Его, и мы сплетали. Мы здесь, чтобы плести ее впредь". {n}Трагический шепот доносится из-под масок культистов: "Плести... впредь".{/n}'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Рослая девушка выступает вперед, и ропот офицеров стихает, но вы все равно не слышите звука ее шагов. Приглушенный свет люменов играет тенями на маске, скрывающей ее лицо.
