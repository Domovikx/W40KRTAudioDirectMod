- guid: 4594d19d-1f61-49ce-8cf3-658c6cea7105
  event: DeathCultIntroduction_20
  text: '"Наше учение и наш закон. Философия и образ жизни, боевое искусство и догма веры. Завет — это и есть Кровавая паутина".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Наше учение и наш закон. Философия и образ жизни, боевое искусство и догма веры. Завет — это и есть Кровавая паутина.
- guid: 1f487c85-98f7-47bc-9278-aba7bc2ff070
  event: DeathCultIntroduction_21
  text: '"Мы скорбим, что вызвали твой гнев, Домин. И надеемся, что однажды ты поймешь — в служении нашем нет греха перед Ним и перед экипажем сего корабля".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Мы скорбим, что вызвали твой гнев, Домин. И надеемся, что однажды ты поймешь — в служении нашем нет греха перед Ним и перед экипажем сего корабля.
- guid: d73dc918-e1c3-4b27-89d2-2fb714a25ffa
  event: DeathCultIntroduction_22
  text: '"Домин''{name} фон Валанциус, смерть прошептала твое имя". {n}Длинный палец с металлическим когтем указывает на вас, и за костяными глазницами вы различаете мрачный взгляд убийцы.{/n} "Мы отрекаемся от Домин''Теодоры. Мы отрекаемся от данной ей клятвы". {n}Девушка достает изогнутый хищный клинок, и в тот же миг в руках у замерших фигур появляются такие же.{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Домин'КЭП фон Валанциус, смерть прошептала твое имя.
  - speaker: narrator
    text_clean: Длинный палец с металлическим когтем указывает на вас, и за костяными глазницами вы различаете мрачный взгляд убийцы.
  - speaker: Кибелла
    text_clean: Мы отрекаемся от Домин'Теодоры. Мы отрекаемся от данной ей клятвы.
  - speaker: narrator
    text_clean: Девушка достает изогнутый хищный клинок, и в тот же миг в руках у замерших фигур появляются такие же.
- guid: a0a08a1b-b2df-4fc6-9522-18a4b9bb75be
  event: DeathCultIntroduction_23
  text: '{n}Воины культа беспокойно переглядываются.{/n} "Запретить нам служить тебе и Ему через Завет Паутины — все равно что бросить меч к ногам врага в пылу битвы".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Воины культа беспокойно переглядываются.
  - speaker: Кибелла
    text_clean: Запретить нам служить тебе и Ему через Завет Паутины — все равно что бросить меч к ногам врага в пылу битвы.
- guid: b3fbc303-e6ed-426c-ae3c-48a23988b933
  event: DeathCultIntroduction_24
  text: '"И дарим свою кровь, свою смерть — тебе". {n}Лезвия свистят в воздухе, и алые капли окропляют залу. Почтительно склонив голову, девушка протягивает вам увесистый сверток, и остальные головы склоняются следом. По пальцам струится кровь, но никого из служителей культа это не тревожит.{/n} "Смерть прошептала твое имя. Следующие Завету Паутины присягают ново{mf|му|й} владыке и приносят положенные дары".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: И дарим свою кровь, свою смерть — тебе.
  - speaker: narrator
    text_clean: Лезвия свистят в воздухе, и алые капли окропляют залу. Почтительно склонив голову, девушка протягивает вам увесистый сверток, и остальные головы склоняются следом. По пальцам струится кровь, но никого из служителей культа это не тревожит.
  - speaker: Кибелла
    text_clean: Смерть прошептала твое имя. Следующие Завету Паутины присягают новому владыке и приносят положенные дары.
- guid: b89c9c3e-9fc5-47ef-bcaa-05b0f66cc59e
  event: DeathCultIntroduction_25
  text: '"Мы — ткачи. Служители культа Кровавой паутины, что оплетает нитями веры отсеки твоего флагмана. Незримые клинки возмездия, что служат Неумирающему Императора. Проводники тех, кому пора на другую сторону". {n}Вновь слышится ропот собравшихся: "Культисты смерти!.."{/n}'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Мы — ткачи. Служители культа Кровавой паутины, что оплетает нитями веры отсеки твоего флагмана. Незримые клинки возмездия, что служат Неумирающему Императора. Проводники тех, кому пора на другую сторону.
  - speaker: narrator
    text_clean: 'Вновь слышится ропот собравшихся: "Культисты смерти!.."'
- guid: 6af3f68a-8b3a-46b9-abf8-529099c181d8
  event: DeathCultIntroduction_26
  text: '"Как и велит Завет Паутины. Как того требует честь".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Как и велит Завет Паутины. Как того требует честь.
- guid: 6b87a479-8a32-4608-a9f3-fcceba81e6ef
  event: DeathCultIntroduction_27
  text: '"Мы не жаждем их смерти, не ищем во тьме. Они сами находят нас". {n}Кибелла прикрывает глаза и делает глубокий вдох.{/n} "И мы направляем их в посмертии, если {g|Encyclopedia:ImperialTarotGlossary}Его священное Таро{/g} укажет, что Император желает принять этих мучеников".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Мы не жаждем их смерти, не ищем во тьме. Они сами находят нас.
  - speaker: narrator
    text_clean: Кибелла прикрывает глаза и делает глубокий вдох.
  - speaker: Кибелла
    text_clean: И мы направляем их в посмертии, если Его священное Таро укажет, что Император желает принять этих мучеников.
- guid: af66ae78-c884-4903-a84b-278cf26049ef
  event: DeathCultIntroduction_CultistLine
  text: '"Мы провинились? Ошиблись?" {n}Напряженные шепоты служителей культа заполняют залу.{/n} "Как нам отныне служить Ему? Как?.."'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Мы провинились? Ошиблись?
  - speaker: narrator
    text_clean: Напряженные шепоты служителей культа заполняют залу.
  - speaker: Кибелла
    text_clean: Как нам отныне служить Ему? Как?..
- guid: 4e1877cd-44dd-46f6-b94a-e88a5b5129d8
  event: DeathCultIntroduction_Demonline
  text: '{n}Звон в ушах оглушает вас на мгновение. Вы моргаете — и секунда тянется дольше декады лет. Волнующий обольстительный {d|Encyclopedia:Prologue_CutByKnife}шепот{/d} щекочет мозг изнутри:{/n} "Как интересно... Праведные убийцы, считающие себя орудием высшей воли, блуждающие в тумане слепой веры. Упивающиеся насилием и зовущие кровожадность благочестием танцоры на нитях, под которыми раскинулась бездна скверны и падения. Чуть толкни их, и они полетят вниз... Ты бы мог{mf||ла} столкнуть их. О да".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Звон в ушах оглушает вас на мгновение. Вы моргаете — и секунда тянется дольше декады лет. Волнующий обольстительный шепот щекочет мозг изнутри:'
  - speaker: Кибелла
    text_clean: Как интересно... Праведные убийцы, считающие себя орудием высшей воли, блуждающие в тумане слепой веры. Упивающиеся насилием и зовущие кровожадность благочестием танцоры на нитях, под которыми раскинулась бездна скверны и падения. Чуть толкни их, и они полетят вниз... Ты бы мог столкнуть их. О да.
- guid: 9b659c24-db9b-40c7-855f-dcb8862bf8af
  event: RMNC_AfterSex_BarksKibellah_01
  text: '"Твоя страсть не знает предела. Как мне сравняться в пылкости с тобой? Я найду ответ..."'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Твоя страсть не знает предела. Как мне сравняться в пылкости с тобой? Я найду ответ...
- guid: ad31ed9d-0a9e-485e-9593-3e9c8501b43e
  event: RMNC_AfterSex_BarksKibellah_02
  text: '"Нам должно вернуться в обыденный мир. Как же я хочу остаться с тобой дольше..."'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Нам должно вернуться в обыденный мир. Как же я хочу остаться с тобой дольше...
- guid: 60f30137-acb5-4ee8-8626-b061bb0b2d59
  event: RMNC_AfterSex_BarksKibellah_03
  text: '"Ха. Сидение на троне не лишило тебя гибкости... Приятное открытие".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Ха. Сидение на троне не лишило тебя гибкости... Приятное открытие.
- guid: 07e201ae-16da-4388-9e69-5e1edf8f25cf
  event: RMNC_AfterSex_BarksKibellah_04
  text: '"Я бы могла вечно наблюдать за тобой, опутанн{mf|ым|ой} негой после страсти..."'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Я бы могла вечно наблюдать за тобой, опутанным негой после страсти...
- guid: 0d9659ad-f1d9-4f4c-95bf-0534942e00ed
  event: RMNC_AfterSex_BarksKibellah_05
  text: '"В близости ты... не так{mf|ой|ая}, как я ожидала. Я открываю новые грани тебя..."'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: В близости ты... не такой, как я ожидала. Я открываю новые грани тебя...
- guid: b7aaf654-704c-43a0-a46d-242d80e2ed2a
  event: RMNC_Kibellah_FinalLabyrinth_01
  text: '{n}В мягком полумраке покоев Кибелла выглядит чуждо: узкая, угловатая плеть, вторгшаяся в царство полутонов и баюкающего сумрака.{/n} "Домин''{name}. Пришло время нам покинуть лабиринт".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'В мягком полумраке покоев Кибелла выглядит чуждо: узкая, угловатая плеть, вторгшаяся в царство полутонов и баюкающего сумрака.'
  - speaker: Кибелла
    text_clean: Домин'КЭП. Пришло время нам покинуть лабиринт.
- guid: 3ede9105-7681-46b9-8ee0-bc60ede256b9
  event: RMNC_Kibellah_FinalLabyrinth_02
  text: '"Конец одного пути. Начало другого. Блуждая в лабиринте в поисках ответов, я лишь запутала себя. Разгадка же... была в тебе. Время нам вместе выйти оттуда, куда я завела нас. Но я более не верю себе — лабиринт слишком привычен мне... слишком знаком. Ты будешь мо{mf|им|ей} проводни{mf|ком|цей}".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Конец одного пути. Начало другого. Блуждая в лабиринте в поисках ответов, я лишь запутала себя. Разгадка же... была в тебе. Время нам вместе выйти оттуда, куда я завела нас. Но я более не верю себе — лабиринт слишком привычен мне... слишком знаком. Ты будешь моим проводником.
- guid: 741b236d-652e-4197-b9c9-f545c691336a
  event: RMNC_Kibellah_FinalLabyrinth_03
  text: '"Ты столь легко читаешь мою душу, Домин''{name}? Или красуешься перед той, что доверилась тебе?" {n}Кибелла негромко смеется.{/n}'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Ты столь легко читаешь мою душу, Домин'КЭП? Или красуешься перед той, что доверилась тебе?
  - speaker: narrator
    text_clean: Кибелла негромко смеется.
- guid: b7dec33d-b0ee-41c8-be60-330c3324f501
  event: RMNC_Kibellah_FinalLabyrinth_04
  text: '"Я долго искала выход из того, во что превратилась моя жизнь, когда в ней появил{mf|ся|ась} ты". {n}Кибелла вздыхает и нежно улыбается вам.{/n} "И осознала, что... не способна сделать это одна. В этот раз проводни{mf|ком|цей} будешь ты. Прошу... выведи меня из лабиринта. Когда мы освободимся из ловушки, в которую я завела нас... Мы сможем взглянуть в грядущее".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Я долго искала выход из того, во что превратилась моя жизнь, когда в ней появился ты.
  - speaker: narrator
    text_clean: Кибелла вздыхает и нежно улыбается вам.
  - speaker: Кибелла
    text_clean: И осознала, что... не способна сделать это одна. В этот раз проводником будешь ты. Прошу... выведи меня из лабиринта. Когда мы освободимся из ловушки, в которую я завела нас... Мы сможем взглянуть в грядущее.
- guid: a6196ffd-9102-41e8-bd34-fefbddc80a84
  event: RMNC_Kibellah_FinalLabyrinth_05
  text: '{n}Кибелла негромко смеется — ее голос напоминает мурлыканье крупной кошки.{/n} "Этот лабиринт... я хочу навсегда уйти из него. Уйти из рамок, которые стали мне — нам обоим — слишком тесны. Идем со мной. Наша новая жизнь не может начаться, пока наши тени мечутся в стенах ловушки, куда я завела нас".'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла негромко смеется — ее голос напоминает мурлыканье крупной кошки.
  - speaker: Кибелла
    text_clean: Этот лабиринт... я хочу навсегда уйти из него. Уйти из рамок, которые стали мне — нам обоим — слишком тесны. Идем со мной. Наша новая жизнь не может начаться, пока наши тени мечутся в стенах ловушки, куда я завела нас.
- guid: eb50b996-e283-4e79-a56b-7be2dabed7b4
  event: RMNC_Kibellah_FinalLabyrinth_06
  text: '{n}Кибелла, кажется, обращается в статую.{/n} "Что? Но, Домин''{name}..."'
  speaker: Kibellah
  parts:
  - speaker: narrator
    text_clean: Кибелла, кажется, обращается в статую.
  - speaker: Кибелла
    text_clean: Что? Но, Домин'КЭП...
- guid: 7f5074b4-23a8-4efa-a98f-156ef4a07626
  event: RMNC_Kibellah_FinalLabyrinth_07
  text: '"Вечность в объятиях той, что поприветствует каждого из нас".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Вечность в объятиях той, что поприветствует каждого из нас.
- guid: 96f0332d-94b5-4ac6-ada0-6c70435be871
  event: RMNC_Kibellah_FinalLabyrinth_08
  text: '"В день, когда я ступила на верхнюю палубу... когда попала в твой мир... Я была ослеплена. Блеск твоего царства поразил меня. И чем дольше я оставалась подле тебя, тем сильнее было это смятение. Нить Паутины уходила из-под моих ног. Предназначение покидало меня. И все же... я продолжала искать. Я знала, что мне не нужно отказываться от своего прошлого, чтобы окунуться в будущее".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: В день, когда я ступила на верхнюю палубу... когда попала в твой мир... Я была ослеплена. Блеск твоего царства поразил меня. И чем дольше я оставалась подле тебя, тем сильнее было это смятение. Нить Паутины уходила из-под моих ног. Предназначение покидало меня. И все же... я продолжала искать. Я знала, что мне не нужно отказываться от своего прошлого, чтобы окунуться в будущее.
- guid: 0854d7e2-48ee-480e-b915-2d6f9432c021
  event: RMNC_Kibellah_FinalLabyrinth_09
  text: '"Когда я вступила в твой мир, он ослепил меня. Я сохраняла маску спокойствия и стойкости, но любой ткач Кровавой паутины был бы смущен тем царством, что ему открылось. Когда мысли о тебе начали смущать мой разум и отвращать от Завета Паутины, я поняла. Наша связь разрезает нити между мной и моим предназначением".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Когда я вступила в твой мир, он ослепил меня. Я сохраняла маску спокойствия и стойкости, но любой ткач Кровавой паутины был бы смущен тем царством, что ему открылось. Когда мысли о тебе начали смущать мой разум и отвращать от Завета Паутины, я поняла. Наша связь разрезает нити между мной и моим предназначением.
- guid: 8dcb7c8a-61b3-482d-a0a1-e8b8f269cd09
  event: RMNC_Kibellah_FinalLabyrinth_10
  text: '"Когда я только вступила в твой мир, мир неги и роскоши, меня спутывали обеты, наставления..." {n}Кибелла движется с особой, хищной грацией.{/n} "Все, что есть удел ткачей Кровавой паутины. Понадобилось время, чтобы понять: эти оковы не для меня. Они для тех, кто боится таких, как мы. Боится тех, кто выше. Сильнее. Я — не ровня этим ничтожествам".'
  speaker: Kibellah
  parts:
  - speaker: Кибелла
    text_clean: Когда я только вступила в твой мир, мир неги и роскоши, меня спутывали обеты, наставления...
  - speaker: narrator
    text_clean: Кибелла движется с особой, хищной грацией.
  - speaker: Кибелла
    text_clean: 'Все, что есть удел ткачей Кровавой паутины. Понадобилось время, чтобы понять: эти оковы не для меня. Они для тех, кто боится таких, как мы. Боится тех, кто выше. Сильнее. Я — не ровня этим ничтожествам.'
- guid: fb815438-94de-4322-81ab-1322f231ef84
  event: RMNC_Kibellah_FinalLabyrinth_11
  text: '"...Завет Паутины для меня — весь мир, но для тебя — столь же странная и чуждая реальность, как верхние палубы для ткача. Когда я осознала это... После того, как ты бережно вел{mf||а} меня, не мешая самой отыскать новую стезю, не вмешиваясь, не довлея... Я увидела начало ее. Милость Паутины — вот имя учения, о котором не ведал Висирь. Оно — мое. И твое".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: '...Завет Паутины для меня — весь мир, но для тебя — столь же странная и чуждая реальность, как верхние палубы для ткача. Когда я осознала это... После того, как ты бережно вел меня, не мешая самой отыскать новую стезю, не вмешиваясь, не довлея... Я увидела начало ее. Милость Паутины — вот имя учения, о котором не ведал Висирь. Оно — мое. И твое.'
- guid: 86eb81d9-72d5-438a-9f6a-c26c2ab4c735
  event: RMNC_Kibellah_FinalLabyrinth_12
  text: '"...я искала... примеряла маски... пыталась найти новую стезю. Ту, что примет тебя и не будет противна мне. Однако истина в том, что мое прошлое — это я. Кровавая паутина — мой дом и моя участь. Все, что я знаю о вселенной... И я не готова расстаться с ней. Если бы я согласилась на это, твоя Кибелла исчезла бы. Ибо паутина идет сквозь меня и питает мою душу и разум. Так будет всегда".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: '...я искала... примеряла маски... пыталась найти новую стезю. Ту, что примет тебя и не будет противна мне. Однако истина в том, что мое прошлое — это я. Кровавая паутина — мой дом и моя участь. Все, что я знаю о вселенной... И я не готова расстаться с ней. Если бы я согласилась на это, твоя Кибелла исчезла бы. Ибо паутина идет сквозь меня и питает мою душу и разум. Так будет всегда.'
