- guid: 351937a7-7397-46ad-9b53-aedf49971660
  event: Companions_Kibellah_23
  text: '"Завет Паутины есть знание, есть искусство, которое передается от одного поколения ткачей Кровавой паутины к другому. Не каждому культисту смерти хватает отведенного Неумирающим времени, чтобы полностью постичь его. Завет есть образ жизни и сам жизненный путь — от первого вдоха и до встречи с Неумирающим. Ему невозможно научить, ты долж{mf|ен|на} жить по Завету. Только тогда ты поймешь".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Завет Паутины есть знание, есть искусство, которое передается от одного поколения ткачей Кровавой паутины к другому. Не каждому культисту смерти хватает отведенного Неумирающим времени, чтобы полностью постичь его. Завет есть образ жизни и сам жизненный путь — от первого вдоха и до встречи с Неумирающим. Ему невозможно научить, ты должен жить по Завету. Только тогда ты поймешь.
