- guid: cc8f23f0-d559-4721-a027-d11bdac60af2
  event: DeathCultIntroduction_14
  text: '"Домин''{name}... распознал{mf||а} нашу суть. Для культа Кровавой паутины одно это — великая честь. Множество лет мы сплетаем нитями веры отсеки этого корабля. Мы храним величайшую реликвию — {g|Encyclopedia:ImperialTarotGlossary}Его Таро{/g}, посредством которого Он посылает нам свои благословенные откровения. Мы подчиняемся шепоту Неумирающего. В этом есть наше служение Ему. В этом есть наше служение тебе".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Домин'КЭП... распознал нашу суть. Для культа Кровавой паутины одно это — великая честь. Множество лет мы сплетаем нитями веры отсеки этого корабля. Мы храним величайшую реликвию — Его Таро, посредством которого Он посылает нам свои благословенные откровения. Мы подчиняемся шепоту Неумирающего. В этом есть наше служение Ему. В этом есть наше служение тебе.
- guid: cdcd6ba0-a0c5-4cf0-90b9-61cfb1c150df
  event: DeathCultIntroduction_15
  text: '"Безмолвный приговор" — орудие смерти, что даровано тебе волей Неумирающего. Кибелла — имя той, кому суждено стать твоим щитом и тенью. Души предателей — дар, что через Завет Паутины будет очищен для Него".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Безмолвный приговор" — орудие смерти, что даровано тебе волей Неумирающего. Кибелла — имя той, кому суждено стать твоим щитом и тенью. Души предателей — дар, что через Завет Паутины будет очищен для Него.
- guid: 240fadab-795e-4c12-a706-d305c23a9456
  event: DeathCultIntroduction_16
  text: '"Изменники, дерзнувшие предать сво{mf|его|ю} госпо{mf|дина|жу}. Они ликовали с именем Кунрада Войгтвира на устах, но отправятся на другую сторону, шепча лишь твое".'
  speaker: null
  parts:
  - speaker: Кибелла
    text_clean: Изменники, дерзнувшие предать своего господина. Они ликовали с именем Кунрада Войгтвира на устах, но отправятся на другую сторону, шепча лишь твое.
- guid: d0006550-c5e4-4232-99ab-e99a41afeb32
  event: DeathCultIntroduction_17
  text: '"Отступники, что предпочли опорочить честь своих семей. Предатели, соблазненные Последним восходом. Лишь кровь смоет память о позоре их предательства".'
  speaker: null
  parts:
