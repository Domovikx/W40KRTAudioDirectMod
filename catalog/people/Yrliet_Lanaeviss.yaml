    text_clean: Очнись, элантах.
  - speaker: narrator
    text_clean: Мелодичный голос эльдарки вырывает вас из объятий дремы, и ее любопытный взгляд тут же упирается в ваше заспанное лицо.
- guid: a7205c5c-e05f-410d-bf08-28dc60afb092
  event: Companions_Ranger_84
  text: '"Напрасно, элантах, ведь я могу о себе позаботиться... Впрочем, судя по выражению твоего лица, моя медитация привела тебя в замешательство — но только от незнания".'
