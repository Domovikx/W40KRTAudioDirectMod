  event: RMNC_Yrliet_StartingEventYrliet_13
  text: '"Элантах, пойми меня: мон-кай привлекательными я не нахожу. Одна мысль о телесной близости с твоими сородичами..." {n}Ирлиэт громко выдыхает, стараясь сохранить внутренее спокойствие.{/n}'
