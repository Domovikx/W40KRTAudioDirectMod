  - speaker: Yrliet Lanaeviss
    text_clean: Напрасно, элантах, ведь я могу о себе позаботиться... Впрочем, судя по выражению твоего лица, моя медитация привела тебя в замешательство — но только от незнания.
- guid: c0feb5a0-0625-4754-918b-8e30185c6258
  event: Companions_Ranger_85
  text: '"Моя медитация... это и есть погружение — погружение в себя, свой внутренний мир. Чтобы поговорить с самим собой, но без слов. Или залечить раны, что не видно обычным взором". {n}Ирлиэт неуверенно хмурится.{/n} "Это сложно объяснить даже на языке детей Азуриана — так много смыслов и переливов в одном его звучании. А уж язык мон-кай слишком скуп и неловок. Нет... чтобы все осознать, погружение нужно увидеть".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Моя медитация... это и есть погружение — погружение в себя, свой внутренний мир. Чтобы поговорить с самим собой, но без слов. Или залечить раны, что не видно обычным взором.
