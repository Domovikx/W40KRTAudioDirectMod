- guid: e903faa3-c487-421f-a625-03f4cb765c9a
  event: Companions_Ranger_86
  text: '"Что? Нет, я так не думаю. Впрочем..." {n}Ирлиэт склоняет голову и с сомнением осматривает вас с головы до ног.{/n} "Быть может у тебя, элантах, и хватило бы на это внутренних сил. Однако медитация требует долгих практик, сдержанности и самодисциплины. А главное — умелого проводника, что сможет направить твой разум".'
