  event: RMNC_Yrliet_StartingEventYrliet_16
  text: '{n}Ирлиэт не выглядит удивленной. Слегка разочарованной — может быть.{/n} "Тогда что насчет моей просьбы, элантах? Так и позволишь своим собратьям докучать мне?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт не выглядит удивленной. Слегка разочарованной — может быть.
  - speaker: Yrliet Lanaeviss
    text_clean: Тогда что насчет моей просьбы, элантах? Так и позволишь своим собратьям докучать мне?
- guid: f24b20dc-de87-47ef-98ad-8c62ce6fee20
  event: RMNC_Yrliet_StartingEventYrliet_17
  text: '{n}Ирлиэт хмурится, глядя на вас, но лишь слегка.{/n} "Ожидать твоей помощи было ошибкой. Я сама разберусь со своей проблемой, коль мои слова не находят ответа".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт хмурится, глядя на вас, но лишь слегка.
  - speaker: Yrliet Lanaeviss
    text_clean: Ожидать твоей помощи было ошибкой. Я сама разберусь со своей проблемой, коль мои слова не находят ответа.
- guid: f91d173e-862c-41d3-a056-b05eba5c9916
  event: RMNC_Yrliet_StartingEventYrliet_18
  text: '{n}Словно не веря услышанному, Ирлиэт осторожно склоняет голову набок и вглядывается в ваши глаза.{/n} "Я... принимаю твои слова, элантах. И все же..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Словно не веря услышанному, Ирлиэт осторожно склоняет голову набок и вглядывается в ваши глаза.
  - speaker: Yrliet Lanaeviss
    text_clean: Я... принимаю твои слова, элантах. И все же...
- guid: c72cbd99-1673-421f-a34b-91c69de71d6d
  event: RMNC_Yrliet_StartingEventYrliet_19
  text: '"И все же..." {n}Ирлиэт касается камня душ, и лицо ее кривится в неподдельном отвращении.{/n} "Выходка одной из них переполнила чашу моего терпения. Она посмела приблизиться ко мне... заговорить... и, коснувшись руки, предложить уединиться, возжелав... возжелав... Кей-морагх! Одно воспоминание об этом вызывает бурю в моей душе!"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И все же...
  - speaker: narrator
    text_clean: Ирлиэт касается камня душ, и лицо ее кривится в неподдельном отвращении.
  - speaker: Yrliet Lanaeviss
    text_clean: Выходка одной из них переполнила чашу моего терпения. Она посмела приблизиться ко мне... заговорить... и, коснувшись руки, предложить уединиться, возжелав... возжелав... Кей-морагх! Одно воспоминание об этом вызывает бурю в моей душе!
- guid: f1c153bc-55a5-4139-aed8-1bc1db98c7a4
  event: RMNC_Yrliet_StartingEventYrliet_20
  text: '"Когда-то эмоции низвергли мой народ с пьедестала правителей галактики, элантах. Потакание своим слабостям — или глупостям — не делает твой вид более привлекательным".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Когда-то эмоции низвергли мой народ с пьедестала правителей галактики, элантах. Потакание своим слабостям — или глупостям — не делает твой вид более привлекательным.
- guid: acc7a8b3-bac9-44f0-a5f2-40f4f3fd0ba2
  event: RMNC_Yrliet_StartingEventYrliet_21
  text: '"Твои слова согревают душу". {n}Эльдарка кивает и ненадолго погружается в свои мысли.{/n} "Что ж, я пойду. Не забудь о данном обещании".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твои слова согревают душу.
  - speaker: narrator
    text_clean: Эльдарка кивает и ненадолго погружается в свои мысли.
  - speaker: Yrliet Lanaeviss
    text_clean: Что ж, я пойду. Не забудь о данном обещании.
- guid: 05e1353c-7539-41c5-a886-82ccdafe2c51
  event: RMNC_Yrliet_StartingEventYrliet_22
  text: '"Ограниченность разума и простота души... Каждый день я словно в западне, окруженная стаей диких животных". {n}Прикрыв глаза, она едва слышно добавляет:{/n} "Я готова заплатить эту цену ради того, чтобы отыскать собратьев. Но всему есть предел".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ограниченность разума и простота души... Каждый день я словно в западне, окруженная стаей диких животных.
  - speaker: narrator
    text_clean: 'Прикрыв глаза, она едва слышно добавляет:'
  - speaker: Yrliet Lanaeviss
    text_clean: Я готова заплатить эту цену ради того, чтобы отыскать собратьев. Но всему есть предел.
- guid: 074d90fe-b6ef-4968-9cf7-d523dad53713
  event: RMNC_Yrliet_StartingEventYrliet_23
  text: '{n}Прикрыв глаза, она едва слышно добавляет:{/n} "За ничтожный шанс спасти собратьев... Я готова заплатить эту цену. Но всему есть предел".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: 'Прикрыв глаза, она едва слышно добавляет:'
  - speaker: Yrliet Lanaeviss
    text_clean: За ничтожный шанс спасти собратьев... Я готова заплатить эту цену. Но всему есть предел.
- guid: 35825ffa-3023-49e0-99c6-bc7f6c277bd8
  event: RMNC_Yrliet_StartingEventYrliet_24
  text: '"Если бы они хоть немного желали познать мою натуру, то давно бежали бы в страхе от того, кто идет по Пути изгоя. Но они лишь пытаются меня спровоцировать. Задеть. Нет. Мон-кай движут подсознательные инстинкты — вам важно выживание, размножение, сохранение вида, истребление тех, кто представляет для вас опасность... Это не плохо и не хорошо. Так есть".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Если бы они хоть немного желали познать мою натуру, то давно бежали бы в страхе от того, кто идет по Пути изгоя. Но они лишь пытаются меня спровоцировать. Задеть. Нет. Мон-кай движут подсознательные инстинкты — вам важно выживание, размножение, сохранение вида, истребление тех, кто представляет для вас опасность... Это не плохо и не хорошо. Так есть.
- guid: 531e73a2-3d51-41a9-acde-981c206ad63f
  event: RMNC_Yrliet_StartingEventYrliet_25
  text: '{n}Ирлиэт замирает в невольном изумлении.{/n} "Гниющия сердцевина рождает погибель целого. Теперь я вижу, откуда произрастает уродливая сущность твоих слуг. Нам нет смысла и дальше обсуждать случившееся".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт замирает в невольном изумлении.
  - speaker: Yrliet Lanaeviss
    text_clean: Гниющия сердцевина рождает погибель целого. Теперь я вижу, откуда произрастает уродливая сущность твоих слуг. Нам нет смысла и дальше обсуждать случившееся.
- guid: f187dc3b-9f38-4f4b-9917-f79d510d2a86
  event: RMNC_Yrliet_StartingEventYrliet_26
  text: '{n}Ирлиэт задумывается и коротко кивает — скорее себе, чем вам.{/n} "Твой вид чувствителен к истине. Я буду напоминать себе об этом".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт задумывается и коротко кивает — скорее себе, чем вам.
  - speaker: Yrliet Lanaeviss
    text_clean: Твой вид чувствителен к истине. Я буду напоминать себе об этом.
- guid: 6c240f5e-6c80-4f4f-a82d-decd9d387e46
  event: RMNC_Yrliet_StartingEventYrliet_27
  text: '"Что я вижу?" {n}Ирлиэт бросает на вас задумчивый взгляд.{/n} "Твои слова полнятся жаждой познания чужой души. Мне они... нравятся. Но сможешь ли ты осознать мой ответ?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что я вижу?
  - speaker: narrator
    text_clean: Ирлиэт бросает на вас задумчивый взгляд.
  - speaker: Yrliet Lanaeviss
