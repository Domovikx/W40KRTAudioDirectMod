  event: Companions_Ranger_104
  text: '{n}Ирлиэт издает тихий смешок и смахивает со лба огненную прядь.{/n} "Надо же, я думала, что уже изучила тебя, {name}. А ты все так же пол{mf|он|на} сюрпризов".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт издает тихий смешок и смахивает со лба огненную прядь.
  - speaker: Yrliet Lanaeviss
    text_clean: Надо же, я думала, что уже изучила тебя, КЭП. А ты все так же полон сюрпризов.
- guid: 6a6167d0-36f3-432d-93e0-9c6b834da59d
  event: Companions_Ranger_105
  text: '"Мы с тобой, элантах, смотрим на этот мир совершенно по-разному. И я вижу много больше его граней, и глубже смыслы, и ярче цвета... Но чтобы облечь всю истину этого мира в скупой язык, привычный твоему слуху, мне понадобится время. Позже я сама приду к тебе с ответом".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мы с тобой, элантах, смотрим на этот мир совершенно по-разному. И я вижу много больше его граней, и глубже смыслы, и ярче цвета... Но чтобы облечь всю истину этого мира в скупой язык, привычный твоему слуху, мне понадобится время. Позже я сама приду к тебе с ответом.
- guid: a6d1e8ef-5b7e-4b43-b732-9f45dc605121
  event: Companions_Ranger_106
  text: '{n}Ирлиэт с некоторым удивлением смотрит на вас, а затем осторожно отвечает:{/n} "{name}... Наши народы слишком разнятся между собой. То, что трогает наши души, вряд ли произведет больше впечатление на твоих сородичей. Как и я нахожу неуклюжей и примитивной вашу концепцию принесения вещественных даров".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: 'Ирлиэт с некоторым удивлением смотрит на вас, а затем осторожно отвечает:'
  - speaker: Yrliet Lanaeviss
    text_clean: КЭП... Наши народы слишком разнятся между собой. То, что трогает наши души, вряд ли произведет больше впечатление на твоих сородичей. Как и я нахожу неуклюжей и примитивной вашу концепцию принесения вещественных даров.
- guid: 84721a66-c979-412d-8562-e32cf8993904
  event: Companions_Ranger_107
  text: '{n}Отрешенный взгляд Ирлиэт скользит по вашей шее.{/n} "Сколь велика пропасть между нами. Когда-то я стремилась прочь от уз и оков мира-корабля. Ты же добровольно позволил{mf||а} Темному оставить на тебе свою отметину — не только в душе, но и на теле".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Отрешенный взгляд Ирлиэт скользит по вашей шее.
  - speaker: Yrliet Lanaeviss
    text_clean: Сколь велика пропасть между нами. Когда-то я стремилась прочь от уз и оков мира-корабля. Ты же добровольно позволил Темному оставить на тебе свою отметину — не только в душе, но и на теле.
- guid: 26a81716-b0c2-404b-af04-fe1d35ec2aa5
  event: Companions_Ranger_108
  text: '"Я пыталась научиться доверию к тебе, элантах. Какими бы ни были твои мотивы, ты не отвернул{mf|ся|ась} от меня, помога{mf|л|ла} искать собратьев. Но отчаяние пожирало меня изнутри. Человеческие путешествия сквозь царство Той, Что Жаждет, истощили мою душу, а наши попытки спасти детей Крудараха растворились и стали ничем в вечно холодной тьме космоса. И даже когда я узрела частицу Крудараха в твоих покоях, я хотела верить, что ты ни при чем. Хотела, но... поддалась эмоциям. Страху. Обреченности. Скорби. Я боялась, что Сай''лантреш доберется до меня раньше, чем я доберусь до истины".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я пыталась научиться доверию к тебе, элантах. Какими бы ни были твои мотивы, ты не отвернулся от меня, помогал искать собратьев. Но отчаяние пожирало меня изнутри. Человеческие путешествия сквозь царство Той, Что Жаждет, истощили мою душу, а наши попытки спасти детей Крудараха растворились и стали ничем в вечно холодной тьме космоса. И даже когда я узрела частицу Крудараха в твоих покоях, я хотела верить, что ты ни при чем. Хотела, но... поддалась эмоциям. Страху. Обреченности. Скорби. Я боялась, что Сай'лантреш доберется до меня раньше, чем я доберусь до истины.
- guid: 3ed15ddb-e826-436d-b420-755fc4eca15e
  event: Companions_Ranger_109
  text: '{n}Понимающий кивок служит коротким ответом.{/n} "Как и я тебе, элантах. Чтобы склеить хрупкие осколки былого... Необходимо окунуться в омут со страхами. Пройти путями сомнений и укротить бушующий жар обиды. Под силу ли это нам? Что ж... Ты уже сделал{mf||а} первый шаг мне навстречу, элантах. И я отвечу вторым".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Понимающий кивок служит коротким ответом.
  - speaker: Yrliet Lanaeviss
    text_clean: Как и я тебе, элантах. Чтобы склеить хрупкие осколки былого... Необходимо окунуться в омут со страхами. Пройти путями сомнений и укротить бушующий жар обиды. Под силу ли это нам? Что ж... Ты уже сделал первый шаг мне навстречу, элантах. И я отвечу вторым.
- guid: 597ab8fb-b1e4-4901-8919-96c8495dfaa3
  event: Companions_Ranger_11
  text: '"Первым Путем, что я прошла, был Путь пробуждения. С ним я обрела способность не только смотреть, но и видеть, а видя — замечать". {n}Эльдарка делает паузу.{/n} "Моим вторым путем мог стать Путь воина, но я выбрала иначе. Ибо умение видеть манило меня за пределы родного мира. И пусть не все были довольны этим решением, но я встала на Путь изгоя. Обрела свободу выбирать, осмыслять, задавать вопросы там, где другие лишь склоняют головы перед словами провидца, диктующего волю судьбы. И я буду следовать своему Пути, пока не достигну вершин".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Первым Путем, что я прошла, был Путь пробуждения. С ним я обрела способность не только смотреть, но и видеть, а видя — замечать.
  - speaker: narrator
    text_clean: Эльдарка делает паузу.
  - speaker: Yrliet Lanaeviss
    text_clean: Моим вторым путем мог стать Путь воина, но я выбрала иначе. Ибо умение видеть манило меня за пределы родного мира. И пусть не все были довольны этим решением, но я встала на Путь изгоя. Обрела свободу выбирать, осмыслять, задавать вопросы там, где другие лишь склоняют головы перед словами провидца, диктующего волю судьбы. И я буду следовать своему Пути, пока не достигну вершин.
- guid: 793b02f3-dbeb-4de5-8584-c5e99a195ef1
  event: Companions_Ranger_110
  text: '"Под бережным присмотром моих сородичей он мог бы вновь обрести свободу. Быть может, даже пробудиться от многовекового сна. Мог бы... но мы этого {d|Encyclopedia:Ch2_JanusEldarEliminated} уже не узнаем{/d}". {n}Тонкие брови эльдарки чуть вздрагивают, и она отворачивается.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
