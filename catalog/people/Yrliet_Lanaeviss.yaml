name: Yrliet Lanaeviss
sound_keys:
- Yrliet
- Ranger
total_phrases: 329
phrases:
- guid: 7313b69a-9729-44e4-91c3-a9d8f378f3f3
  event: BNTRS_AreaPeaceful_Yrliet_11
  text: '"Мертвый камень в обрамлении уродливого металла. Я бы никогда не смогла жить в подобном доме, как это делают мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мертвый камень в обрамлении уродливого металла. Я бы никогда не смогла жить в подобном доме, как это делают мон-кай.
- guid: 6d544106-7e64-4ccc-a070-ee00aabcfb18
  event: BNTRS_AreaStressful_Yrliet_123
  text: '"Твои предсказания и есть цепь, что душит волю свободного создания. Умолкни, мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твои предсказания и есть цепь, что душит волю свободного создания. Умолкни, мон-кай.
- guid: e4c4c0b7-ef28-484c-98ae-5618268af11d
  event: BNTRS_AreaStressful_Yrliet_131
  text: '"Я не могу разобрать ни слова... но скверна, что пронзает воздух вместе с этими звуками, почти осязаема".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я не могу разобрать ни слова... но скверна, что пронзает воздух вместе с этими звуками, почти осязаема.
- guid: c0b00027-76f2-4329-87ff-18fab6f79dd6
  event: BNTRS_AreaStressful_Yrliet_132
  text: '"Погибший мир...'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Погибший мир...
- guid: fbd8c719-c43f-440d-81b3-d07b327d2f4f
  event: BNTRS_AreaStressful_Yrliet_137
  text: '"Эти мон-кай и правда тратят свою короткую жизнь на копошение в мусоре? Почему бы не избрать другой Путь? Обрясть иного себя?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Эти мон-кай и правда тратят свою короткую жизнь на копошение в мусоре? Почему бы не избрать другой Путь? Обрясть иного себя?
- guid: 47e10f5e-0f60-4075-b2ce-a864c22ae4e3
  event: BNTRS_AreaStressful_Yrliet_14
  text: '"Полагаю, "до последнего ксеноса" — это лишь мон-кайская фигура речи, не так ли?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Полагаю, "до последнего ксеноса" — это лишь мон-кайская фигура речи, не так ли?
- guid: 3f7873d6-6c5a-4c57-a474-f8ed343461c6
  event: BNTRS_AreaStressful_Yrliet_169
  text: '"Я тоже чувствую, как за нами наблюдают. Словно хищник, притаившийся в засаде. Сотни хищников".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я тоже чувствую, как за нами наблюдают. Словно хищник, притаившийся в засаде. Сотни хищников.
- guid: 24e08fb4-fef0-4bdb-8b8b-42679459615f
  event: BNTRS_AreaStressful_Yrliet_19
  text: '"На этом мире печать усталости и истязаний. Слишком явный почерк моих темных кузенов, чтобы не быть ловушкой".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: На этом мире печать усталости и истязаний. Слишком явный почерк моих темных кузенов, чтобы не быть ловушкой.
- guid: 61de17da-2aa5-4bbb-80f0-720d6f2bb461
  event: BNTRS_AreaStressful_Yrliet_33
  text: '"Это место отличается от других поселений мон-кай, что я видела".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Это место отличается от других поселений мон-кай, что я видела.
- guid: b647aaa9-fe6c-4a40-a7f0-d45196cc2120
  event: BNTRS_AreaStressful_Yrliet_49
  text: '"Малое в большом, железное в каменном. Я вижу в этом месте два слоя, две идеи, и одна — мелочная, изворотливая — пожрала другую".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Малое в большом, железное в каменном. Я вижу в этом месте два слоя, две идеи, и одна — мелочная, изворотливая — пожрала другую.
- guid: 914606fa-a4c5-415e-82c7-5c40d57c046e
  event: BNTRS_AreaStressful_Yrliet_61
  text: '"Какой занятный муравейник. Без нелепой претензии на грандиозность ваши норы смотрятся лучше. Естественнее".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Какой занятный муравейник. Без нелепой претензии на грандиозность ваши норы смотрятся лучше. Естественнее.
- guid: 9a14cfda-40aa-4905-a9e0-145779309af2
  event: BNTRS_AreaStressful_Yrliet_69
  text: '"Иногда твои речи напоминают предсказания наших провидцев, мон-кай. Весьма отдаленно, ибо едва ли ваши прорицатели могут сравниться с нашими".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Иногда твои речи напоминают предсказания наших провидцев, мон-кай. Весьма отдаленно, ибо едва ли ваши прорицатели могут сравниться с нашими.
- guid: 7a570acf-19c4-4d2b-b5b4-6b185809f904
  event: BNTRS_AreaStressful_Yrliet_94
  text: '"Некоторое время я считала эти леса своим домом... Но все равно чувствую себя здесь чужой".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Некоторое время я считала эти леса своим домом... Но все равно чувствую себя здесь чужой.
- guid: 38b36a3b-dfc5-46bd-898f-21916226b757
  event: BNTRS_Chapter2_Yrliet_04
  text: '"Скверна, что запятнала погибший корабль, могла отпечататься на душах твоих слуг, элантах. Надеюсь, они позаботились об очищающих ритуалах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Скверна, что запятнала погибший корабль, могла отпечататься на душах твоих слуг, элантах. Надеюсь, они позаботились об очищающих ритуалах.
- guid: 50e4e22a-f76d-4099-b942-8316da5165c0
  event: BNTRS_Chapter2_Yrliet_07
  text: '"Ловушка на замерзшем мире — жестокий силок для ничего не подозревающих жертв. Невинные, привлеченные сигналом, расплачивались за свое милосердие гибелью".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ловушка на замерзшем мире — жестокий силок для ничего не подозревающих жертв. Невинные, привлеченные сигналом, расплачивались за свое милосердие гибелью.
- guid: cb1a3c8b-925a-4943-9b99-fa631dda23c1
  event: BNTRS_Chapter2_Yrliet_118
  text: '"Твои глаза видят отблески Ша''эиль, а душа всегда открыта тому, что за вуалью... Отчего же твои способности пугают мон-кай меньше, чем способности усмиренной?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твои глаза видят отблески Ша'эиль, а душа всегда открыта тому, что за вуалью... Отчего же твои способности пугают мон-кай меньше, чем способности усмиренной?
- guid: 8185ce8f-2a79-4504-834f-932a72b94d09
  event: BNTRS_Chapter2_Yrliet_135
  text: '"Мон-кай так полагаются на обрывки бумаги... Словно каждое слово, написанное вашей рукой, имеет незримую силу".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай так полагаются на обрывки бумаги... Словно каждое слово, написанное вашей рукой, имеет незримую силу.
- guid: eac026b6-00a4-45ce-a1be-32ce1d3d19de
  event: BNTRS_Chapter2_Yrliet_149
  text: '"Разве мон-кай не считают, что тяготы закаляют? Ты можешь использовать меня как точильный камень для своего духа, но нечистоты речей впредь оставляй при себе".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Разве мон-кай не считают, что тяготы закаляют? Ты можешь использовать меня как точильный камень для своего духа, но нечистоты речей впредь оставляй при себе.
- guid: 3ee2f1eb-7775-44a3-84fa-e31359bfb239
  event: BNTRS_Chapter2_Yrliet_150
  text: '"Странствие в компании мон-кай весьма... необычно. И познавательно".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Странствие в компании мон-кай весьма... необычно. И познавательно.
- guid: 00c49f5a-d579-45b3-ae6c-b7251b9539a4
  event: BNTRS_Chapter2_Yrliet_18
  text: '"Впервые видела я рейд Темных так близко... Удивительно, что твой мир сумел пережить его, элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Впервые видела я рейд Темных так близко... Удивительно, что твой мир сумел пережить его, элантах.
- guid: 7a2b036b-8f79-4993-841c-083b4641d8f7
  event: BNTRS_Chapter2_Yrliet_49
  text: '"Что может знать о красоте мон-кай, чье проклятое око убивает все живое? Беды постигли Лилэтан из-за скверны подобной той, что ты несешь в себе".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что может знать о красоте мон-кай, чье проклятое око убивает все живое? Беды постигли Лилэтан из-за скверны подобной той, что ты несешь в себе.
- guid: eb2b8b05-bcd0-463d-b6c8-efeee0e0fd66
  event: BNTRS_Chapter2_Yrliet_51
  text: '"Покинуть Лилэтан — тяжелое решение. Но Путь ведет меня дальше... на поиски братьев и сестер. Чтобы найти их, я пойду на любую жертву".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Покинуть Лилэтан — тяжелое решение. Но Путь ведет меня дальше... на поиски братьев и сестер. Чтобы найти их, я пойду на любую жертву.
- guid: da50646c-d7f8-4159-afa6-8cf8fc696e5e
  event: BNTRS_Chapter2_Yrliet_59
  text: '"Уже второй мир во владениях элантах, на который мон-кай допустили проникновение скверны. Меня... пугает ваше небрежение".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Уже второй мир во владениях элантах, на который мон-кай допустили проникновение скверны. Меня... пугает ваше небрежение.
- guid: 1e0525fe-3a57-40de-83b6-6080fcbe9d3c
  event: BNTRS_Chapter2_Yrliet_65
  text: '"Я слышала рассказы от своих собратьев-изгоев... мрачные истории о Великом пожирателе. Боюсь, то были его посланцы — предвестники бури, от которой нет спасения".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я слышала рассказы от своих собратьев-изгоев... мрачные истории о Великом пожирателе. Боюсь, то были его посланцы — предвестники бури, от которой нет спасения.
- guid: c2a41e27-d7ef-43eb-8886-7a16350fbc1d
  event: BNTRS_Chapter2_Yrliet_72
  text: '"Судно, преисполненное скверной из-за вуали... Печальное и предостерегающее зрелище. Никто не достоин подобной участи — ни дети Азуриана, ни твой вид, элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Судно, преисполненное скверной из-за вуали... Печальное и предостерегающее зрелище. Никто не достоин подобной участи — ни дети Азуриана, ни твой вид, элантах.
- guid: 310d512f-14ee-4247-91c5-4b3531ceac90
  event: BNTRS_Chapter2_Yrliet_88
  text: '"Вы следуете опасной тропой, что ведет за вуаль. Для борьбы с силами, которые невозможно приручить. Какие бы распри не одолевали твой род... его судьба незавидна".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вы следуете опасной тропой, что ведет за вуаль. Для борьбы с силами, которые невозможно приручить. Какие бы распри не одолевали твой род... его судьба незавидна.
- guid: 73e9de67-4056-4383-844c-08ba23a6ee38
  event: BNTRS_Chapter3_Yrliet_111
  text: '"Аребенниан в Комморре... В движение пришли великие силы, раз Темный город посетил страшнейший из Арлекинов".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Аребенниан в Комморре... В движение пришли великие силы, раз Темный город посетил страшнейший из Арлекинов.
- guid: bfed82fb-ec5e-4109-8765-9c6db49ca7b0
  event: BNTRS_Chapter3_Yrliet_115
  text: '"Аребенниан суть смертоносная тайна, что приходит из глубин Паутины и приносит с собой дурные вести о грядущих катастрофах. Я молю богов, чтобы наш путь более не пересекся с ним".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Аребенниан суть смертоносная тайна, что приходит из глубин Паутины и приносит с собой дурные вести о грядущих катастрофах. Я молю богов, чтобы наш путь более не пересекся с ним.
- guid: 44adf959-0139-4377-9fb1-be8b1ed6f09a
  event: BNTRS_Chapter3_Yrliet_126
  text: '"Я — не узница, обреченная биться за своего пленителя. В отличие от тебя, кровожадный полузверь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я — не узница, обреченная биться за своего пленителя. В отличие от тебя, кровожадный полузверь.
- guid: e62faf14-01e1-49af-ac52-33328692a6df
  event: BNTRS_Chapter3_Yrliet_129
  text: '"Время не терпит, элантах. Чем быстрее мы отправимся на встречу с выжившими с Крудараха, тем больше у них шансов избежать очередной беды..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Время не терпит, элантах. Чем быстрее мы отправимся на встречу с выжившими с Крудараха, тем больше у них шансов избежать очередной беды...
- guid: 43848fbe-f67f-439c-b551-cc303779d61d
  event: BNTRS_Chapter3_Yrliet_140
  text: '"Я не буду просить тебя о снисхождении, седовласый — ведь я тоже не доверилась чужаку. Но элантах... оказал{mf|ся|ась} лучше нас обоих".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я не буду просить тебя о снисхождении, седовласый — ведь я тоже не доверилась чужаку. Но элантах... оказался лучше нас обоих.
- guid: 0cd317af-e16f-40cf-83a2-96634516b10c
  event: BNTRS_Chapter3_Yrliet_141
  text: '"Послушай. Мне... жаль, что твой последователь оказался преда..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Послушай. Мне... жаль, что твой последователь оказался преда...
- guid: 429f2e71-3724-4638-ac51-2ce7d17abdcd
  event: BNTRS_Chapter3_Yrliet_144
  text: '"Думаешь, после всего, через что я прошла, твои слова испугают меня, мон-кай?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Думаешь, после всего, через что я прошла, твои слова испугают меня, мон-кай?
- guid: 16573339-bb7f-4180-8852-e670ce692c76
  event: BNTRS_Chapter3_Yrliet_146
  text: '"Я слышу в твоем голосе... понимание? Ясно. Ты тоже совершила ошибку, достойную гибели — и избежала ее".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я слышу в твоем голосе... понимание? Ясно. Ты тоже совершила ошибку, достойную гибели — и избежала ее.
- guid: e052aafb-e5f5-4958-945d-6aec0b32e36b
  event: BNTRS_Chapter3_Yrliet_21
  text: '"Наш побег — спектакль, которому дали ход силы много выше нашего помощника. И я бы хотела знать цену, которую мы должны за это заплатить".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Наш побег — спектакль, которому дали ход силы много выше нашего помощника. И я бы хотела знать цену, которую мы должны за это заплатить.
- guid: 4772efd1-dd98-41e7-ab84-fc10bb0c70cd
  event: BNTRS_Chapter3_Yrliet_27
  text: '"Комморра — это лабиринт, найти выход из которого не всегда под силу даже его обитателям. Но нас направлял Аребенниан — один из властителей Паутины. Он точно знал, куда подтолкнуть своих актеров".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Комморра — это лабиринт, найти выход из которого не всегда под силу даже его обитателям. Но нас направлял Аребенниан — один из властителей Паутины. Он точно знал, куда подтолкнуть своих актеров.
- guid: 6dc75dc5-fe0f-4907-98e9-6071489baa1f
  event: BNTRS_Chapter3_Yrliet_35
  text: '"Значит, ты отправила предшественницу элантах навстречу смерти. Ту самую мон-кай, что, возможно, виновна в гибели Крудараха. Я благодарю тебя".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Значит, ты отправила предшественницу элантах навстречу смерти. Ту самую мон-кай, что, возможно, виновна в гибели Крудараха. Я благодарю тебя.
- guid: f8104ce5-056a-43eb-b279-ed575607b93e
  event: BNTRS_Chapter3_Yrliet_76
  text: '"Мон-кай считают достойным весельем держать разумных существ в клетках и глумиться над ними вместо того, чтобы предать быстрой смерти? Что ж, я не удивлена".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай считают достойным весельем держать разумных существ в клетках и глумиться над ними вместо того, чтобы предать быстрой смерти? Что ж, я не удивлена.
- guid: bf1cb9f2-2804-44f9-8aa5-3492acdd6cc7
  event: BNTRS_Chapter3_Yrliet_86
  text: '"Мой темный кузен получил то, что заслужил. Предавший... отыщет в пути своем лишь предательство".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мой темный кузен получил то, что заслужил. Предавший... отыщет в пути своем лишь предательство.
- guid: 2bfa40d6-7db2-42d6-ade2-ba305f3b61d9
  event: BNTRS_Chapter3_Yrliet_91
  text: '"Твое присутствие наполняет меня неудержимым гневом..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твое присутствие наполняет меня неудержимым гневом...
- guid: 0f64d981-c568-4775-9ce5-a98f04d6a1d1
  event: BNTRS_Chapter4_Yrliet_108
  text: '"Трехокие мон-кай поколениями измывались над душами детей Азуриана ради своих низких амбиций. Что это, как не свидетельство духовного убожества?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Трехокие мон-кай поколениями измывались над душами детей Азуриана ради своих низких амбиций. Что это, как не свидетельство духовного убожества?
- guid: bb71fac2-dec7-4d2f-93f9-9ba0fb0f687f
  event: BNTRS_Chapter4_Yrliet_12
  text: '"Мон-кай не ценят жизни собратьев и потому способны жертвовать сотнями и тысячами в одном бою. На этом построено их военное искусство... если его можно так назвать".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай не ценят жизни собратьев и потому способны жертвовать сотнями и тысячами в одном бою. На этом построено их военное искусство... если его можно так назвать.
- guid: 2263b817-8559-45b2-9447-c23c6aab44ef
  event: BNTRS_Chapter4_Yrliet_121
  text: '"Вы сами порождаете врата для сил Сай''лантреш... и делаете это под личиной помощи Человечеству. Почему, ища спасения от одной беды, вы обращаетесь к иной?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вы сами порождаете врата для сил Сай'лантреш... и делаете это под личиной помощи Человечеству. Почему, ища спасения от одной беды, вы обращаетесь к иной?
- guid: b468183e-c11f-48d6-96fd-0d2908d465c0
  event: BNTRS_Chapter4_Yrliet_127
  text: '"Вместо гемункульского творения ты вверила свою душу тому, что за вуалью... Так ступай же по своему проклятому Пути без страха — твоя судьба была предначертана с самого начала".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вместо гемункульского творения ты вверила свою душу тому, что за вуалью... Так ступай же по своему проклятому Пути без страха — твоя судьба была предначертана с самого начала.
- guid: 5bef99b0-cb69-4ec2-8c47-193adb6cb15a
  event: BNTRS_Chapter4_Yrliet_135
  text: '"Эти твари будут скрестись в стенки твоего сознания каждый раз, как корабль окажется за вуалью. Если ты вновь дашь им повод... помни о цене ошибки".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Эти твари будут скрестись в стенки твоего сознания каждый раз, как корабль окажется за вуалью. Если ты вновь дашь им повод... помни о цене ошибки.
- guid: a9b6fc7b-bba6-4640-b59c-723e0bbba7a1
  event: BNTRS_Chapter4_Yrliet_144
  text: '"Ты говоришь о Номосе, Темный. Он — гость элантаха, как и мы с тобой. Возможно, более почетный, потому не бери в голову даже мысль о том, чтобы изучить его одним из ваших методов, если не хочешь навлечь на себя праведный гнев".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты говоришь о Номосе, Темный. Он — гость элантаха, как и мы с тобой. Возможно, более почетный, потому не бери в голову даже мысль о том, чтобы изучить его одним из ваших методов, если не хочешь навлечь на себя праведный гнев.
- guid: 5a971ed1-5d07-49ce-a7f6-80095184efbf
  event: BNTRS_Chapter4_Yrliet_163
  text: '"Я отыскала провидцев Крудараха... но вместо облегчения и покоя истина об их судьбе наполнила мое сердце горечью".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я отыскала провидцев Крудараха... но вместо облегчения и покоя истина об их судьбе наполнила мое сердце горечью.
- guid: 3950b616-dba7-494c-a294-d5897e4c88fc
  event: BNTRS_Chapter4_Yrliet_167
  text: '"Мои ошибки вывели меня на дорогу, ведущую в бездну. Если такова плата за истину... я шагну во тьму не страшась".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мои ошибки вывели меня на дорогу, ведущую в бездну. Если такова плата за истину... я шагну во тьму не страшась.
- guid: aec3474a-b2ee-47bb-b141-febbc6308d46
  event: BNTRS_Chapter4_Yrliet_168
  text: '"Крударах пал, его останки скрыты во мраке Простора. Все, что мне теперь остается — последовать за {mf|тем|той}, кто позволил мне пройти этот путь до конца".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Крударах пал, его останки скрыты во мраке Простора. Все, что мне теперь остается — последовать за тем, кто позволил мне пройти этот путь до конца.
- guid: e7a86cdd-0097-480a-9319-ebb03342d939
  event: BNTRS_Chapter4_Yrliet_172
  text: '"Пытаешься вновь отравить мой дух, Темный? Напрасно — твои ядовитые стрелы бьют мимо цели".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Пытаешься вновь отравить мой дух, Темный? Напрасно — твои ядовитые стрелы бьют мимо цели.
- guid: 604bcd4a-a191-4e9d-961f-e0350d38f360
  event: BNTRS_Chapter4_Yrliet_44
  text: '"Если потомки павшей придут за элантахом, кровавый цикл продолжится. Жизнь за жизнью. Поколение за поколением. Пока одна сторона не перестанет существовать".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Если потомки павшей придут за элантахом, кровавый цикл продолжится. Жизнь за жизнью. Поколение за поколением. Пока одна сторона не перестанет существовать.
- guid: 1edcbe18-e38e-48d7-ad2c-12d9acd9bfde
  event: BNTRS_Chapter4_Yrliet_53
  text: '"Разве не было там одного из твоих единоверцев? Остерегайся. Твои собратья замешаны в делах мастера плоти".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Разве не было там одного из твоих единоверцев? Остерегайся. Твои собратья замешаны в делах мастера плоти.
- guid: 87aa5485-612c-4ac8-b84e-ec11817d66fe
  event: BNTRS_Chapter4_Yrliet_84
  text: '"Ваша иерархия запутанна и нелогична. Почему элантах, правящий собственным кораблем и мирами, должен подчиняться тому, кто, словно вредитель, занял чужое место?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ваша иерархия запутанна и нелогична. Почему элантах, правящий собственным кораблем и мирами, должен подчиняться тому, кто, словно вредитель, занял чужое место?
- guid: 4c6e072c-8c48-46b7-a835-774a1913e776
  event: BNTRS_Chapter4_Yrliet_90
  text: '"Знатные семьи с твоего главного мира ищут любой повод, чтобы уничтожить друг друга, элантах. Но лидеры должны стремиться к единению народа".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Знатные семьи с твоего главного мира ищут любой повод, чтобы уничтожить друг друга, элантах. Но лидеры должны стремиться к единению народа.
- guid: 7a887fc8-68d3-4d7a-a75b-b9945b3d627c
  event: BNTRS_Chapter5_Yrliet_08
  text: '"Я только раз в жизни сходилась в бою с огиром. Древние создания, которым должно было остаться в прошлом. Их пробуждение в эти времена... тревожный знак".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я только раз в жизни сходилась в бою с огиром. Древние создания, которым должно было остаться в прошлом. Их пробуждение в эти времена... тревожный знак.
- guid: f2ab5155-b921-4b23-9f0d-d8698f4a6909
  event: BNTRS_Companion_DLC3_Yrliet_06
  text: '"Я питала слабую надежду, что тобой не будут вершиться надругательства над телами братьев, но нет, низменную человеческую природу не изменить".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я питала слабую надежду, что тобой не будут вершиться надругательства над телами братьев, но нет, низменную человеческую природу не изменить.
- guid: 9de62284-55d8-4a65-8fa2-4a67e82e4a98
  event: BNTRS_Companion_DLC3_Yrliet_105
  text: '"Не надейся узреть душу Лилэтан. Ты умен для мон-кай, но твое сердце столь же черство, как у твоих сородичей".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Не надейся узреть душу Лилэтан. Ты умен для мон-кай, но твое сердце столь же черство, как у твоих сородичей.
- guid: bce27d96-91dc-47b7-aabd-dbe614a5c915
  event: BNTRS_Companion_DLC3_Yrliet_145
  text: '"Желаешь что-то спросить, железный философ?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Желаешь что-то спросить, железный философ?
- guid: bd372d21-be8c-4884-ba2c-dc7af5a16ed9
  event: BNTRS_Companion_DLC3_Yrliet_37
  text: '"Ты произносишь слова нашей речи почти правильно, но все еще путаешься в интонациях. Немногие из людей могут освоить наш язык. Зачем это тебе?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты произносишь слова нашей речи почти правильно, но все еще путаешься в интонациях. Немногие из людей могут освоить наш язык. Зачем это тебе?
- guid: 7e442859-8954-4ce3-b84c-8d053d325638
  event: BNTRS_Companion_DLC3_Yrliet_58
  text: '"Твой разум жаждет познаний, а в словах нет ненависти, присущей собратьям. Это... необычно. Твое неравнодушие однажды обернется пожаром, что спалит тебя дотла, железный мудрец".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твой разум жаждет познаний, а в словах нет ненависти, присущей собратьям. Это... необычно. Твое неравнодушие однажды обернется пожаром, что спалит тебя дотла, железный мудрец.
- guid: 9d6dc863-11ed-42d4-a29b-dc3c625e7213
  event: BNTRS_DLC2_Yrliet_105
  text: '"Суды мон-кай так фальшивы... Темные кузены хотя бы честны в своих амбициях и не дают ложного чувства, что обвиняемый может спастись".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Суды мон-кай так фальшивы... Темные кузены хотя бы честны в своих амбициях и не дают ложного чувства, что обвиняемый может спастись.
- guid: a6349abd-e2ed-4e1a-8ee6-efcd56c84d1b
  event: BNTRS_DLC2_Yrliet_116
  text: '"Смогут ли мон-кай почерпнуть из трагедии мудрость и встать на новый путь? Порой потрясения — это не конец, а повод к обновлению".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Смогут ли мон-кай почерпнуть из трагедии мудрость и встать на новый путь? Порой потрясения — это не конец, а повод к обновлению.
- guid: a6fe0e3e-fa70-4415-a84e-91ddefcc8cb2
  event: BNTRS_DLC2_Yrliet_131
  text: '"Его путь был заблуждением от начала и до конца. Хоть элантах и протянул{mf||а} ему руку, чтобы вывести на новую тропу, но любая помощь бесплодна, если ее не желают".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Его путь был заблуждением от начала и до конца. Хоть элантах и протянул ему руку, чтобы вывести на новую тропу, но любая помощь бесплодна, если ее не желают.
- guid: bbcc76db-0aae-4002-ac67-9e28e1ed610c
  event: BNTRS_DLC2_Yrliet_140
  text: '"Ты напрасно тратишь слова. Он — тень воли вашего бога-на-троне. Слепое орудие. И никогда не поймет, почему мы следуем за элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты напрасно тратишь слова. Он — тень воли вашего бога-на-троне. Слепое орудие. И никогда не поймет, почему мы следуем за элантах.
- guid: c7e3332d-453e-4906-9b5f-28fcb53cf075
  event: BNTRS_DLC2_Yrliet_175
  text: '"И здесь правители мон-кай хранят отобранные у своего народа богатства? То, что я представляла себе хранилищем великих артефактов, оказалось... свалкой".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И здесь правители мон-кай хранят отобранные у своего народа богатства? То, что я представляла себе хранилищем великих артефактов, оказалось... свалкой.
- guid: 7faacae8-018f-4850-8012-5617caf4f4f6
  event: BNTRS_DLC2_Yrliet_185
  text: '"Неужели только угроза смерти способна заставить вас соблюдать собственные законы? То, что иные разумные существа понимают интуитивно, вы насаждаете насилием".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Неужели только угроза смерти способна заставить вас соблюдать собственные законы? То, что иные разумные существа понимают интуитивно, вы насаждаете насилием.
- guid: 9d3c04be-1823-4fab-8d53-79657e4cbf29
  event: BNTRS_DLC2_Yrliet_246
  text: '"Мой вид знает то, что тебе недоступно — искупление. И то, что мертвым не исправить своих ошибок".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мой вид знает то, что тебе недоступно — искупление. И то, что мертвым не исправить своих ошибок.
- guid: ca87fe40-4f61-4f06-b745-07fc9fe4a62d
  event: BNTRS_DLC2_Yrliet_295
  text: '"Знает ли элантах, что ты думаешь о {mf|его|ее} решениях? О, я вижу. Тебе не хватает смелости высказать все {mf|ему|ей} в лицо. И ты выбрал иную жертву. Но мне безразлична гниль твоих слов".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Знает ли элантах, что ты думаешь о его решениях? О, я вижу. Тебе не хватает смелости высказать все ему в лицо. И ты выбрал иную жертву. Но мне безразлична гниль твоих слов.
- guid: cd409fb5-b2c2-40e5-82e8-d59d62ee5bf6
  event: BNTRS_DLC2_Yrliet_314
  text: '"Даже твой несчастный зверь, которого мон-кай превратили в оружие, может стать добычей. Ступай осторожно и не гневи Лилэтан".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Даже твой несчастный зверь, которого мон-кай превратили в оружие, может стать добычей. Ступай осторожно и не гневи Лилэтан.
- guid: 457ffb48-3ca2-47f9-b2dd-54a7895e2cf3
  event: BNTRS_DLC2_Yrliet_363
  text: '"Позволь ему скорбеть об утерянном, железный мон-кай. И не душить свое сердце. Только приняв боль можно двигаться дальше".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Позволь ему скорбеть об утерянном, железный мон-кай. И не душить свое сердце. Только приняв боль можно двигаться дальше.
- guid: cf12843f-fadc-4872-8703-69b338996a1e
  event: BNTRS_DLC2_Yrliet_40
  text: '"И вновь ты пытаешься заковать в свое писание то, что не постичь разуму. Вместо вопросов — ненависть. Вместо познания — добровольные оковы. Как же ваш вид страшится свободы..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И вновь ты пытаешься заковать в свое писание то, что не постичь разуму. Вместо вопросов — ненависть. Вместо познания — добровольные оковы. Как же ваш вид страшится свободы...
- guid: c54ded54-d015-4e55-889c-b997e72a0596
  event: BNTRS_DLC2_Yrliet_43
  text: '"Твои усилия по установлению порядка приводят лишь к большей разрухе. Если бы ты принял мир таким неидеальным, какой он есть... Это бы облегчило твое существование".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твои усилия по установлению порядка приводят лишь к большей разрухе. Если бы ты принял мир таким неидеальным, какой он есть... Это бы облегчило твое существование.
- guid: 69931164-2414-4fdd-a61f-6c136978d44a
  event: BNTRS_DLC2_Yrliet_47
  text: '"Там, где азуриани радуются сходству, вы находите лишь горечь. Я никогда не пойму вашего стремления быть разобщенными".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Там, где азуриани радуются сходству, вы находите лишь горечь. Я никогда не пойму вашего стремления быть разобщенными.
- guid: aa7d6637-84f4-410b-bc33-79864d26d698
  event: BNTRS_DLC2_Yrliet_50
  text: '"Ты не радеешь за справедливую участь себе подобным, мон-кай. А желаешь, чтобы право судить и казнить было лишь у тебя и таких, как ты. Палачей".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты не радеешь за справедливую участь себе подобным, мон-кай. А желаешь, чтобы право судить и казнить было лишь у тебя и таких, как ты. Палачей.
- guid: 87b4f094-ab70-4b77-aa4d-c963a78f293c
  event: BNTRS_DLC2_Yrliet_65
  text: '"Что не взять силой, то можно получить хитроумием. Тот мон-кай был скалой снаружи, но оставил бреши внутри".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что не взять силой, то можно получить хитроумием. Тот мон-кай был скалой снаружи, но оставил бреши внутри.
- guid: f794110b-c9aa-4a98-80f1-abb3444da7b8
  event: BNTRS_DLC2_Yrliet_93
  text: '"Повторят ли мон-кай свою ошибку и продолжат держать ресурсы взаперти, или дадут им течь свободно, наполняя миры жизнью?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Повторят ли мон-кай свою ошибку и продолжат держать ресурсы взаперти, или дадут им течь свободно, наполняя миры жизнью?
- guid: ba16eee5-ac01-4ebf-8da9-103d48ea8f25
  event: BNTRS_DLC3_Yrliet_01
  text: '"Элантах, будь осторожен. То, что ждет внутри, голодно. И оно, будто зверь, чует наше приближение".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах, будь осторожен. То, что ждет внутри, голодно. И оно, будто зверь, чует наше приближение.
- guid: 870e8d2d-4d9b-4bf2-8331-dbedf59a3752
  event: BNTRS_DLC3_Yrliet_100
  text: '"Море злится. Мон-кай вгрызлись в самое сердце планеты и забирают ее силы. Когда она устанет от их жадности, это место будет обречено".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Море злится. Мон-кай вгрызлись в самое сердце планеты и забирают ее силы. Когда она устанет от их жадности, это место будет обречено.
- guid: a2d5bdcb-b082-4854-b722-07b4d9beef9b
  event: BNTRS_DLC3_Yrliet_118
  text: '"Ты о том, как выглядят их попытки жить в гармонии с окружающей их природой? Что ж. Это и вправду забавно. И жалко".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты о том, как выглядят их попытки жить в гармонии с окружающей их природой? Что ж. Это и вправду забавно. И жалко.
- guid: cff36a60-b1f5-48ec-84cd-c1f66589145e
  event: BNTRS_DLC3_Yrliet_125
  text: '"Эта планета прекрасна в своей первозданности, но она не жалует незванных гостей. Я чувствую, как жадно нечто в ее глубинах наблюдает за нами".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Эта планета прекрасна в своей первозданности, но она не жалует незванных гостей. Я чувствую, как жадно нечто в ее глубинах наблюдает за нами.
- guid: eb2a9a3d-7e49-4c43-856e-80b155b90beb
  event: BNTRS_DLC3_Yrliet_21
  text: '"Мертвая материя, частично превращенная в фантомы, застывшая вне круговорота времени. Сколь странная тяга к накопительству... Для чего этот огир окружает себя всеми этими предметами?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мертвая материя, частично превращенная в фантомы, застывшая вне круговорота времени. Сколь странная тяга к накопительству... Для чего этот огир окружает себя всеми этими предметами?
- guid: f5806094-6a98-4a29-9551-56739a8af939
  event: BNTRS_DLC3_Yrliet_30
  text: '"Слишком много значения вы придаете раскрашенным тряпкам и кускам металла. Так ли наполнено смыслом стремление положить жизнь за безделицу? Радуйся, что на этой платформе не выставлены тела тех, чьи имена ты назвал".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Слишком много значения вы придаете раскрашенным тряпкам и кускам металла. Так ли наполнено смыслом стремление положить жизнь за безделицу? Радуйся, что на этой платформе не выставлены тела тех, чьи имена ты назвал.
- guid: b76621f6-ec15-4ed3-aba5-516428f2d14a
  event: BNTRS_DLC3_Yrliet_35
  text: '"Моя душа не слышит криков, ведьма. Лишь... тишину. Лишенную надежды и жизни. Холод вечности, предвещающий беду".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Моя душа не слышит криков, ведьма. Лишь... тишину. Лишенную надежды и жизни. Холод вечности, предвещающий беду.
- guid: 24046457-df13-4c58-b227-aebf82b485a4
  event: BNTRS_DLC3_Yrliet_56
  text: '"Западня, наполненная мерзкими технологиями огиров! Сколь беспеч{mf|н|на} и слеп{mf||а} ты был{mf||а}, элантах, ступив в эти чертоги. Впрочем, даже мои глаза не распознали ловушку, расставленную древним врагом, а твой род обмануть стократ проще".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Западня, наполненная мерзкими технологиями огиров! Сколь беспечн и слеп ты был, элантах, ступив в эти чертоги. Впрочем, даже мои глаза не распознали ловушку, расставленную древним врагом, а твой род обмануть стократ проще.
- guid: 7347bb84-336e-4dc6-bd1e-cf618c5881e1
  event: BNTRS_DLC3_Yrliet_70
  text: '"Здесь стало спокойнее и тише... но в воздухе витает иной дух. Дух жадности. Дух жажды обладания излишеством".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Здесь стало спокойнее и тише... но в воздухе витает иной дух. Дух жадности. Дух жажды обладания излишеством.
- guid: e0da8ec7-d4fa-4644-8b0b-8dac10fc3f32
  event: BNTRS_DLC3_Yrliet_85
  text: '"Ты, искаженный мон-кай, удивляешь меня больше прочих. Я не верю своим глазам, но... Ты и вправду не отличаешь одних своих братьев от других?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты, искаженный мон-кай, удивляешь меня больше прочих. Я не верю своим глазам, но... Ты и вправду не отличаешь одних своих братьев от других?
- guid: 8980184c-2d12-4870-abe1-0d733cde115f
  event: BNTRS_DLC3_Yrliet_94
  text: '"Боль и неутолимая жадность к жизни... Это корабль все больше напоминает мне истинное отражение природы мон-каев".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Боль и неутолимая жадность к жизни... Это корабль все больше напоминает мне истинное отражение природы мон-каев.
- guid: ae622fd9-fd12-48bc-b922-95ea3dcf7783
  event: BNTRS_PickUps_Yrliet_101
  text: '"Ты видела неизбежность, зрящая Ша''эиль. Тень Пожирателя. Утешай себя тем, что едва ли доживешь до дня, как она тебя настигнет".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты видела неизбежность, зрящая Ша'эиль. Тень Пожирателя. Утешай себя тем, что едва ли доживешь до дня, как она тебя настигнет.
- guid: edb9123a-3839-462c-9fa3-a3d5c691a27b
  event: BNTRS_PickUps_Yrliet_103
  text: '"Из-за этого проклятье и пало на нашу расу. Из-за неумения сдержать свое больное любопытство".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Из-за этого проклятье и пало на нашу расу. Из-за неумения сдержать свое больное любопытство.
- guid: baf44103-4281-4e91-b77e-771c745a85d6
  event: BNTRS_PickUps_Yrliet_126
  text: '"Дитя Азуриана, обреченное провести вечность в одиночестве среди праха мон-кай... Не мне осуждать выбор твоего пути. Но душа моя скорбит — слышишь ли ты ее плач?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Дитя Азуриана, обреченное провести вечность в одиночестве среди праха мон-кай... Не мне осуждать выбор твоего пути. Но душа моя скорбит — слышишь ли ты ее плач?
- guid: 7566973d-7ba3-4c5e-97a2-f69cedc2d83b
  event: BNTRS_PickUps_Yrliet_180
  text: '"Каждый на судне почему-то считает элантах неразумным дитя. Если ты и правда ценишь {mf|его|ее}, то признай, что {mf|он|она} сам{mf||а} творит свой путь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Каждый на судне почему-то считает элантах неразумным дитя. Если ты и правда ценишь его, то признай, что он сам творит свой путь.
- guid: b7b57266-d441-4393-baf2-b11fd23e5660
  event: BNTRS_PickUps_Yrliet_197
  text: '"Лилэтан вздыхает с облегчением каждый раз, когда мон-кай перестает осквернять его своим присутствием".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Лилэтан вздыхает с облегчением каждый раз, когда мон-кай перестает осквернять его своим присутствием.
- guid: 4a16c984-c3f5-4712-8c32-b970dd44146c
  event: BNTRS_PickUps_Yrliet_202
  text: '"Их питает не смерть, а страдания. Они цепляются за жизнь, обреченные давным давно".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Их питает не смерть, а страдания. Они цепляются за жизнь, обреченные давным давно.
- guid: 26ebe73a-75dc-4170-9d64-2c11512f7199
  event: BNTRS_PickUps_Yrliet_206
  text: '"Вся эта чудовищная мощь и тела, и духа настолько груба, что мне до сих пор не верится в то, что он не сломал себя".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вся эта чудовищная мощь и тела, и духа настолько груба, что мне до сих пор не верится в то, что он не сломал себя.
- guid: 39e5c0be-9813-4775-b41d-f37bc5570490
  event: BNTRS_PickUps_Yrliet_281
  text: '"Знаю, ты жаждешь меня убить. Нацелишь ли ты клинок в мое сердце, когда я повернусь к тебе спиной?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Знаю, ты жаждешь меня убить. Нацелишь ли ты клинок в мое сердце, когда я повернусь к тебе спиной?
- guid: d2bb03c6-3dae-43c7-b86e-8ee715c81774
  event: BNTRS_PickUps_Yrliet_36
  text: '"К несчастью, мне не впервой сталкиваться с мон-кай. И по опыту лет больших, чем твоя жизнь, могу сказать — ты не отличаешься от прочих".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: К несчастью, мне не впервой сталкиваться с мон-кай. И по опыту лет больших, чем твоя жизнь, могу сказать — ты не отличаешься от прочих.
- guid: 2f6f8679-379e-405b-b4f8-a1e6374eb8e7
  event: BNTRS_PickUps_Yrliet_43
  text: '"Твоя жизнь коротка, но ты все равно стремишься к смерти. Словно догорающая комета, падающая на звезду".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твоя жизнь коротка, но ты все равно стремишься к смерти. Словно догорающая комета, падающая на звезду.
- guid: 2a094c6a-7e6f-4342-b05b-8c4c3af08bc9
  event: BNTRS_PickUps_Yrliet_53
  text: '"Та, Что Жаждет не любит выпускать жертв из своей хватки. Лучше не думай об их судьбе".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Та, Что Жаждет не любит выпускать жертв из своей хватки. Лучше не думай об их судьбе.
- guid: e8baa839-e06d-4fb4-8168-c52219115c53
  event: BNTRS_PickUps_Yrliet_98
  text: '"Вы, мон-кай, одинаково жутки в своем самоотречении, какой бы путь ни избрали".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вы, мон-кай, одинаково жутки в своем самоотречении, какой бы путь ни избрали.
- guid: 82d93a39-8ee3-4844-8076-888a1d5690e7
  event: BNTRS_Reactivity_DLC3_Yrliet_32
  text: '"Мон-кай придают так много значения вещам, которые сами же наделили значимостью... и теперь исчезновение такого предмета холодит ваши сердца смертным ужасом".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай придают так много значения вещам, которые сами же наделили значимостью... и теперь исчезновение такого предмета холодит ваши сердца смертным ужасом.
- guid: b5d9e5e0-e5a6-48ee-b31c-6c09adbb27dc
  event: BNTRS_Reactivity_DLC3_Yrliet_56
  text: '"Ты думаешь о том, что и твое время близко к исходу, не так ли? И все же твои слова исполнены покоя... удивительно".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты думаешь о том, что и твое время близко к исходу, не так ли? И все же твои слова исполнены покоя... удивительно.
- guid: ec301c7b-fe44-403a-b5c2-e148d52010c7
  event: BNTRS_Reactivity_DLC3_Yrliet_66
  text: '"Мон-кай, что пришли благодарить элантах за заботу об их телах, были искренни. Но я не стала бы называть чувство раба, что ласкается к руке своего хозяина ради куска еды, красивым".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай, что пришли благодарить элантах за заботу об их телах, были искренни. Но я не стала бы называть чувство раба, что ласкается к руке своего хозяина ради куска еды, красивым.
- guid: a72229bd-47b0-4755-8ae5-cebe0d59cbf2
  event: BNTRS_Reactivity_Yrliet_103
  text: '"Вон она — гордыня мон-кай. Ты считаешь, что без наставлений элантах погрязнет во тьме. Но душа {mf|его|ее} сияет столь ярко, что разгонит любой мрак, и потому я не страшусь твоих слов".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вон она — гордыня мон-кай. Ты считаешь, что без наставлений элантах погрязнет во тьме. Но душа его сияет столь ярко, что разгонит любой мрак, и потому я не страшусь твоих слов.
- guid: b751483b-053e-452a-976b-d3af31b437ab
  event: BNTRS_Reactivity_Yrliet_19
  text: '"Ритуалы, что проводят элантах и зрящая Ша''эиль... В них нет дикости, присущей мон-кай. Мне почти нравится наблюдать, как расцветают их чувства".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ритуалы, что проводят элантах и зрящая Ша'эиль... В них нет дикости, присущей мон-кай. Мне почти нравится наблюдать, как расцветают их чувства.
- guid: d6aa807d-195b-4d21-b3a0-7f5e28d72aba
  event: BNTRS_Reactivity_Yrliet_26
  text: '"Делаешь вид, что беспокоишься о долге и владениях элантаха, но я... знаю. Тебя волнует и печалит союз без истинных чувств".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Делаешь вид, что беспокоишься о долге и владениях элантаха, но я... знаю. Тебя волнует и печалит союз без истинных чувств.
- guid: edd7d7ae-8bb6-4c83-ada1-659d6e94299a
  event: BNTRS_Reactivity_Yrliet_33
  text: '"Чувства к элантах мешают тебе править корабль сквозь Ша''эиль. Соберись, трехокая! Твоя слабость может стоить нам жизней... и не только их".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Чувства к элантах мешают тебе править корабль сквозь Ша'эиль. Соберись, трехокая! Твоя слабость может стоить нам жизней... и не только их.
- guid: df71568a-22f8-4e1d-be66-b29f45d5504b
  event: BNTRS_Reactivity_Yrliet_63
  text: '"Мой народ лишен предубеждений мон-кай, но... Разве можно испытывать страсть к тому, кто с тобой нечестен?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мой народ лишен предубеждений мон-кай, но... Разве можно испытывать страсть к тому, кто с тобой нечестен?
- guid: f2c8f5a6-c0b7-4cb9-b728-d4a66107ac1b
  event: BNTRS_Reactivity_Yrliet_75
  text: '"Тебе стоило бы бояться не злых языков, а того, кем элантах станет, если не сойдет с выбранного пути. Обычаи Темных язвят душу... и открывают тайны, которым лучше остаться неузнанными".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Тебе стоило бы бояться не злых языков, а того, кем элантах станет, если не сойдет с выбранного пути. Обычаи Темных язвят душу... и открывают тайны, которым лучше остаться неузнанными.
- guid: 90de6d05-d3ad-4a6a-8fc5-db6ec359f497
  event: BNTRS_Reactivity_Yrliet_81
  text: '"Что тебе нужно от элантах, Темный? Почему пожираешь {mf|его|ее} глазами, словно замышляешь зло?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что тебе нужно от элантах, Темный? Почему пожираешь его глазами, словно замышляешь зло?
- guid: 0335b39f-a139-473b-92b1-c23de19095f8
  event: BNTRS_Reactivity_Yrliet_90
  text: '"Что за примитивные мысли в роятся в твоей голове, мон-кай? Ты — живое доказательство того, как прост ваш вид. Но, кажется, элантах отличается от вас..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что за примитивные мысли в роятся в твоей голове, мон-кай? Ты — живое доказательство того, как прост ваш вид. Но, кажется, элантах отличается от вас...
- guid: 8473553d-9a08-4c5b-80c8-aa4d55f0fa6c
  event: BNTRS_Reactivity_Yrliet_91
  text: '"Довольно пристальных взглядов, мон-кай. Твои силы язвят душу, подобно стрелам Курноса".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Довольно пристальных взглядов, мон-кай. Твои силы язвят душу, подобно стрелам Курноса.
- guid: 50e68405-85d2-463f-abef-15fcad68cedd
  event: BNTRS_Reactivity_Yrliet_95
  text: '"Я жалею только об одной упущенной возможности — возможности избавить от тебя этот мир еще при первой нашей встрече".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я жалею только об одной упущенной возможности — возможности избавить от тебя этот мир еще при первой нашей встрече.
- guid: 432476dd-02c3-4a20-aca7-f8f1a4950803
  event: BNTRS_Stressful_Yrliet_108
  text: '"Ты необычайно проницательна для мон-кай, еще и со столь вздорным характером. Пожалуй, мне тоже стоит к тебе присмотреться".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты необычайно проницательна для мон-кай, еще и со столь вздорным характером. Пожалуй, мне тоже стоит к тебе присмотреться.
- guid: d68318ac-150b-4b42-97a8-ed58b3a41655
  event: BNTRS_Stressful_Yrliet_126
  text: '"Возможно... Если бы элантах не принял{mf||а} меня в свой круг, я бы стала подобной тебе и окончательно потеряла себя. Но теперь у меня есть надежда, так что оставь свои праздные речи... кузен".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Возможно... Если бы элантах не принял меня в свой круг, я бы стала подобной тебе и окончательно потеряла себя. Но теперь у меня есть надежда, так что оставь свои праздные речи... кузен.
- guid: a1354023-7524-4e50-875a-9750104c9418
  event: BNTRS_Stressful_Yrliet_146
  text: '"Мы чтили Ваула, кузнеца и искусника. Но он не похож на ваше уродливое божество — он не пытался заменить наши души на скульптуры из призрачной кости".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мы чтили Ваула, кузнеца и искусника. Но он не похож на ваше уродливое божество — он не пытался заменить наши души на скульптуры из призрачной кости.
- guid: 4f91d1d0-de57-4ba6-838d-633e5335e590
  event: BNTRS_Stressful_Yrliet_164
  text: '"Как ты уродлив внутри, мон-кай... Нет, просто кровожадное чудовище, проклятье, насланное твоим народом на более просвещенные расы".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Как ты уродлив внутри, мон-кай... Нет, просто кровожадное чудовище, проклятье, насланное твоим народом на более просвещенные расы.
- guid: f50d04c8-3b2b-4217-bd2a-ccd8c5cbda1a
  event: BNTRS_Stressful_Yrliet_165
  text: '"Не тяжело ли тебе нести груз прожитых лет, седой воин? Не выйдет ли так, что рука подведет тебя в бою?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Не тяжело ли тебе нести груз прожитых лет, седой воин? Не выйдет ли так, что рука подведет тебя в бою?
- guid: ca7c0ad5-cb69-44bc-aeb5-1578edada7bf
  event: BNTRS_Stressful_Yrliet_167
  text: '"Значит, ты правда веришь, что твой бог сидит где-то на троне из золота и приглядывает за тобой?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Значит, ты правда веришь, что твой бог сидит где-то на троне из золота и приглядывает за тобой?
- guid: ace2b565-362d-4b64-b6e2-8048b081fc51
  event: BNTRS_Stressful_Yrliet_169
  text: '"Рядом с тобой моей душе неспокойно, Зрящая Ша''эиль. Дело в твоем третьем оке? Или есть что-то еще?.. В любом случае — не стоит подходить ближе".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Рядом с тобой моей душе неспокойно, Зрящая Ша'эиль. Дело в твоем третьем оке? Или есть что-то еще?.. В любом случае — не стоит подходить ближе.
- guid: 4e5e388e-1e56-4b9c-be7b-5e124755624d
  event: BNTRS_Stressful_Yrliet_171
  text: '"Я вижу, как ты украдкой смотришь на меня, мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я вижу, как ты украдкой смотришь на меня, мон-кай.
- guid: 324a1351-b8a6-41ae-898b-c84dc5bcaa57
  event: BNTRS_Stressful_Yrliet_173
  text: '"Мон-кай совсем не знают страха и благоразумия, раз допускают связанных с великим врагом в свои круги".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мон-кай совсем не знают страха и благоразумия, раз допускают связанных с великим врагом в свои круги.
- guid: 4743a9ed-2598-45b4-b392-532e53fa84b8
  event: BNTRS_Stressful_Yrliet_175
  text: '"Разве сделки с моими собратьями не считаются среди мон-кай предательством? Или алчность настолько тебя ослепила, что ты не боишься возмездия?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Разве сделки с моими собратьями не считаются среди мон-кай предательством? Или алчность настолько тебя ослепила, что ты не боишься возмездия?
- guid: 0c241e61-5dbd-4f55-ae6a-ac960585a9fb
  event: BNTRS_Stressful_Yrliet_177
  text: '"То, что произошло с тобой, Маражай... справедливо. В моем сердце нет для тебя жалости".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: То, что произошло с тобой, Маражай... справедливо. В моем сердце нет для тебя жалости.
- guid: 203dfae0-80bf-43d6-a5ab-9cdc7840aa24
  event: BNTRS_Stressful_Yrliet_179
  text: '"Ты заменил железом свое тело, но жадность не изжить холодом металла. Перестань смотреть на мое снаряжение с такой алчностью, мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты заменил железом свое тело, но жадность не изжить холодом металла. Перестань смотреть на мое снаряжение с такой алчностью, мон-кай.
- guid: 828c3210-40e9-412f-90d0-9e48e621b04d
  event: BNTRS_Stressful_Yrliet_18
  text: '"Страхи мон-кай — не моя забота. И даже захоти я их успокоить — ваш вид никогда не перестанет бояться тех, кто стоит выше".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Страхи мон-кай — не моя забота. И даже захоти я их успокоить — ваш вид никогда не перестанет бояться тех, кто стоит выше.
- guid: 3bb30e34-af50-4add-8369-e0dd3bc86eeb
  event: BNTRS_Stressful_Yrliet_181
  text: '"Ты больше похож на дикого зверя, нежели представителя своего вида".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты больше похож на дикого зверя, нежели представителя своего вида.
- guid: b7333bf0-3035-40b6-979e-d80ccf3b36c8
  event: BNTRS_Stressful_Yrliet_36
  text: '"Как часто ограниченные, мелочные создания жалеют других, считая их удел хуже своего. Не знаю, трогательно это или омерзительно?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Как часто ограниченные, мелочные создания жалеют других, считая их удел хуже своего. Не знаю, трогательно это или омерзительно?
- guid: c3beb724-ce21-419d-8f87-07cb95548f61
  event: BNTRS_Stressful_Yrliet_54
  text: '"Наивное дитя, ты для мон-кай такое же чудовище, что и прочие твоего вида. Если бы не третье око, что зрит Ша''эиль, нить твоей судьбы оборвалась бы еще при рождении".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Наивное дитя, ты для мон-кай такое же чудовище, что и прочие твоего вида. Если бы не третье око, что зрит Ша'эиль, нить твоей судьбы оборвалась бы еще при рождении.
- guid: bcc1705a-2167-4ca6-969d-f392f474186a
  event: BNTRS_Stressful_Yrliet_72
  text: '"Азуриани умеют адаптироваться. Вы немного замедляете меня, слегка мешаетесь в бою... но это терпимо".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Азуриани умеют адаптироваться. Вы немного замедляете меня, слегка мешаетесь в бою... но это терпимо.
- guid: ad821da4-57b7-44aa-b3d8-fb876c1e36f3
  event: BNTRS_Stressful_Yrliet_90
  text: '"Что за уничижительное сравнение, мон-кай. Ты — зов Сай''лантреш в телесной оболочке, что в любой момент может разорвать вуаль. Мы похожи так же, как снежные вершины и грязь под ногами".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Что за уничижительное сравнение, мон-кай. Ты — зов Сай'лантреш в телесной оболочке, что в любой момент может разорвать вуаль. Мы похожи так же, как снежные вершины и грязь под ногами.
- guid: be8c742a-2c93-4b5a-83a9-488f8f5d2f29
  event: CH2_Yrliet_BaseDialogue_01
  text: '{n}Перед вами причудливое создание, лишь отдаленно напоминающее обычного человека. Вытянутое тело, тонкие конечности, острые черты — каждая деталь в облике выглядит противоестественно и чуждо. Создание поворачивает к вам голову.{/n} "Ирлиэт Ланэвисс приветствует тебя, элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Перед вами причудливое создание, лишь отдаленно напоминающее обычного человека. Вытянутое тело, тонкие конечности, острые черты — каждая деталь в облике выглядит противоестественно и чуждо. Создание поворачивает к вам голову.
  - speaker: Yrliet Lanaeviss
    text_clean: Ирлиэт Ланэвисс приветствует тебя, элантах.
- guid: 48887377-774a-40ba-895d-837182eac56a
  event: CH2_Yrliet_BaseDialogue_02
  text: '"Глядите-ка, ксеносы, что б их ажи сожрали, уже ходят среди людей!" {n}Джай склоняет голову набок.{/n} "Вы разве не мните себя выше того? Но только сути это не меняет — в подружки к Вьятт затесалась ксенос, а не мутант".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Глядите-ка, ксеносы, что б их ажи сожрали, уже ходят среди людей!
  - speaker: narrator
    text_clean: Джай склоняет голову набок.
  - speaker: Yrliet Lanaeviss
    text_clean: Вы разве не мните себя выше того? Но только сути это не меняет — в подружки к Вьятт затесалась ксенос, а не мутант.
- guid: 2c4341a4-0a13-4982-bf7f-e277d32025ee
  event: CH2_Yrliet_BaseDialogue_03
  text: '{n}Хейнрикс бросает несколько слов на странном языке — вроде и мелодичном, но в исполнении дознавателя звучащем угловато и странно. Встретив пристальный взгляд незнакомки, Хейнрикс поворачивается к вам.{/n} "У меня печальная новость, {name}. Создание перед нами — не мутант, как предполагают местные, а представительница рода {g|Encyclopedia:Aeldari}эльдаров{/g} — одна из сонма врагов Человечества. Тебе не следует верить ей. И даже говорить с ней дольше самого необходимого".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Хейнрикс бросает несколько слов на странном языке — вроде и мелодичном, но в исполнении дознавателя звучащем угловато и странно. Встретив пристальный взгляд незнакомки, Хейнрикс поворачивается к вам.
  - speaker: Yrliet Lanaeviss
    text_clean: У меня печальная новость, КЭП. Создание перед нами — не мутант, как предполагают местные, а представительница рода эльдаров — одна из сонма врагов Человечества. Тебе не следует верить ей. И даже говорить с ней дольше самого необходимого.
- guid: 158938cf-81ea-473f-b90c-cc7ad8bcc6d7
  event: CH2_Yrliet_BaseDialogue_04
  text: '"Тебе незачем уродовать мой язык, мон-кай — я владею вашим в достаточной мере, чтобы вести разговор с элантах без переводчика. И коль разгадал ты мой путь, то и я буду пряма в своих речах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Тебе незачем уродовать мой язык, мон-кай — я владею вашим в достаточной мере, чтобы вести разговор с элантах без переводчика. И коль разгадал ты мой путь, то и я буду пряма в своих речах.
- guid: e058fab0-93dd-48bc-9f61-d407379949ec
  event: CH2_Yrliet_BaseDialogue_05
  text: '"{name}, при всем моем уважении... вы уверены в правильности такого поступка? Нам ничего не известно о том, что это за ксенос и зачем она втерлась в доверие к губернатору. Насколько я вижу, она не слишком стремится нам помочь — и все же, по какой-то явно темной причине, согласилась участвовать в расследовании..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: КЭП, при всем моем уважении... вы уверены в правильности такого поступка? Нам ничего не известно о том, что это за ксенос и зачем она втерлась в доверие к губернатору. Насколько я вижу, она не слишком стремится нам помочь — и все же, по какой-то явно темной причине, согласилась участвовать в расследовании...
- guid: 00f27f3d-a4b9-4e35-a67c-4a394691a906
  event: CH2_Yrliet_BaseDialogue_06
  text: '"Ох ты ж... либо ты самая тупая ксеносиха на свете, либо храбрее целого полка Имперской гвардии. Скорее всего — и то, и другое одновременно, раз говоришь с {mf|его|ее} благородием Вольным Торговцем в таком тоне!"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ох ты ж... либо ты самая тупая ксеносиха на свете, либо храбрее целого полка Имперской гвардии. Скорее всего — и то, и другое одновременно, раз говоришь с его благородием Вольным Торговцем в таком тоне!
- guid: 975e9c35-6e1c-482f-aa1f-ed797a4f0660
  event: CH2_Yrliet_BaseDialogue_07
  text: '"Я здесь — по воле правительницы этих людей. Твои приказы ничтожны для меня, элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я здесь — по воле правительницы этих людей. Твои приказы ничтожны для меня, элантах.
- guid: fcef50af-2d88-497b-983e-8bcdd508146f
  event: CH2_Yrliet_BaseDialogue_08
  text: '"Почтение среди моего народа завоевывают величием, элантах. Лишь единицы твоего вида достойны нашего уважения. Я не буду менять своей дороги в угоду твоей — но ты еще можешь заслужить то отношение, которого просит твоя душа".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Почтение среди моего народа завоевывают величием, элантах. Лишь единицы твоего вида достойны нашего уважения. Я не буду менять своей дороги в угоду твоей — но ты еще можешь заслужить то отношение, которого просит твоя душа.
- guid: c2cd4e74-a130-4811-a679-c2fbd72909a6
  event: CH2_Yrliet_BaseDialogue_09
  text: '{n}Ирлиэт едва заметно склоняет голову.{/n} "Я изгнала тень сомнения из твоих мыслей касательно моей природы. Теперь же ответь на мой вопрос — зачем ты обратил{mf|ся|ась} ко мне?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт едва заметно склоняет голову.
  - speaker: Yrliet Lanaeviss
    text_clean: Я изгнала тень сомнения из твоих мыслей касательно моей природы. Теперь же ответь на мой вопрос — зачем ты обратился ко мне?
- guid: 89ce3a1a-0862-4a23-9de3-d519cdb32063
  event: CH2_Yrliet_BaseDialogue_10
  text: '"Ты недостаточно долго прожила среди людей, раз считаешь, что угрозы еще больше расположат меня к тебе. Решение за вами, Вольный Торговец, но уверяю — я усыплю вашего карманного ксеноса при первом же признаке его неповиновения".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты недостаточно долго прожила среди людей, раз считаешь, что угрозы еще больше расположат меня к тебе. Решение за вами, Вольный Торговец, но уверяю — я усыплю вашего карманного ксеноса при первом же признаке его неповиновения.
- guid: 80046cb9-2902-4b26-8b38-c06626c7bb61
  event: CH2_Yrliet_BaseDialogue_11
  text: '"Воистину так, элантах. Моя рука отвела смерть, что грозила правительнице этих людей, и я же помогла тебе в борьбе с безумцами".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Воистину так, элантах. Моя рука отвела смерть, что грозила правительнице этих людей, и я же помогла тебе в борьбе с безумцами.
- guid: 39eab94c-66c7-4af9-8f68-772b1e1ac18e
  event: CH2_Yrliet_BaseDialogue_12
  text: '"А ты и не просишь о помощи, элантах — лишь задаешь вопросы, ответы на которые неважны или скрыты тенями. Изучи место. Говори с теми, кто знает..." {n}Ирлиэт медлит и чуть тише добавляет.{/n} "Пустяк для тебя и непреодолимая преграда для меня, коль один облик мой внушает страх и подозрения. Когда узнаешь что-то — поведай мне. Быть может, тогда мои ответы пригодятся в твоих поисках".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: А ты и не просишь о помощи, элантах — лишь задаешь вопросы, ответы на которые неважны или скрыты тенями. Изучи место. Говори с теми, кто знает...
  - speaker: narrator
    text_clean: Ирлиэт медлит и чуть тише добавляет.
  - speaker: Yrliet Lanaeviss
    text_clean: Пустяк для тебя и непреодолимая преграда для меня, коль один облик мой внушает страх и подозрения. Когда узнаешь что-то — поведай мне. Быть может, тогда мои ответы пригодятся в твоих поисках.
- guid: 5dad60b8-1cf2-4f48-ad20-dbc2cf0de0a6
  event: CH2_Yrliet_BaseDialogue_13
  text: '"Этот мир в беде. Я хочу избавить его от ненужных страданий".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Этот мир в беде. Я хочу избавить его от ненужных страданий.
- guid: 5a1217b4-64d9-4235-bad4-182d6cc382cc
  event: CH2_Yrliet_BaseDialogue_14
  text: '"Лишь то, что они грозят сложившемуся порядку вещей. Погибнет правительница — и этот мир окажется в опасности".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Лишь то, что они грозят сложившемуся порядку вещей. Погибнет правительница — и этот мир окажется в опасности.
- guid: 020e663f-dead-43eb-ba18-54b9f2b1a6f4
  event: CH2_Yrliet_BaseDialogue_15
  text: '{n}Ирлиэт молчит несколько секунд, ее взгляд устремлен куда-то мимо вас. Медленно, растягивая слова, она отвечает:{/n} "Так и быть. Я пойду с тобой".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: 'Ирлиэт молчит несколько секунд, ее взгляд устремлен куда-то мимо вас. Медленно, растягивая слова, она отвечает:'
  - speaker: Yrliet Lanaeviss
    text_clean: Так и быть. Я пойду с тобой.
- guid: 2d8ccd46-6cd0-4a8a-aa9f-a494bb5dcd08
  event: CH2_Yrliet_BaseDialogue_16
  text: '"Мир, что ты зовешь "Янусом", когда-то был сотворен волей моего народа. У меня гораздо больше причин находиться на Лилэтан, чем у любого из вас".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мир, что ты зовешь "Янусом", когда-то был сотворен волей моего народа. У меня гораздо больше причин находиться на Лилэтан, чем у любого из вас.
- guid: c3c5e9bd-eeb3-4cb3-961d-e5e1faf5f057
  event: CH2_Yrliet_BaseDialogue_17
  text: '"Я готова, элантах. В путь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я готова, элантах. В путь.
- guid: 4e0633a0-6d8b-42cf-856c-b69866a2f124
  event: CH2_Yrliet_BaseDialogue_18
  text: '"Гнев Лилэтан, выплеснутый наружу..." {n}Ирлиэт осекается.{/n} "На протяжении столетий этот мир сопротивлялся зверствам, что учиняли над ним бездушные машины и беспечные создания. Однако то, о чем поведал тебе машинный человек — нечто иное, нечто более страшное. Сама планета противится некому злу, гнездящемуся в ее колыбели".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Гнев Лилэтан, выплеснутый наружу...
  - speaker: narrator
    text_clean: Ирлиэт осекается.
  - speaker: Yrliet Lanaeviss
    text_clean: На протяжении столетий этот мир сопротивлялся зверствам, что учиняли над ним бездушные машины и беспечные создания. Однако то, о чем поведал тебе машинный человек — нечто иное, нечто более страшное. Сама планета противится некому злу, гнездящемуся в ее колыбели.
- guid: 8a94e83b-ba5d-40a6-8592-b9c314de1328
  event: CH2_Yrliet_BaseDialogue_19
  text: '"Я была свидетельницей тому, как пленных под покровом тьмы доставляли к задним дверям, но что стало с ними потом — то мне неведомо. И не мое то дело, что сотворяют тебе подобные со своими сородичами..." {n}Ирлиэт прикасается к блестящему камню на груди, словно проверяет, на месте ли он.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я была свидетельницей тому, как пленных под покровом тьмы доставляли к задним дверям, но что стало с ними потом — то мне неведомо. И не мое то дело, что сотворяют тебе подобные со своими сородичами...
  - speaker: narrator
    text_clean: Ирлиэт прикасается к блестящему камню на груди, словно проверяет, на месте ли он.
- guid: 30d96492-ac7b-496f-97fc-1d8cfdc300d2
  event: CH2_Yrliet_BaseDialogue_20
  text: '"Этот мир был чист, пока твои соплеменники не осквернили его своим присутствием. У Лилэтан нет подобных сил — что-то другое повлияло на твоих сородичей".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Этот мир был чист, пока твои соплеменники не осквернили его своим присутствием. У Лилэтан нет подобных сил — что-то другое повлияло на твоих сородичей.
- guid: 7e1c3b50-b523-460d-9069-130ac5f82868
  event: CH2_Yrliet_BaseDialogue_21
  text: '{n}Ирлиэт смотрит на останки в ваших руках с нескрываемым изумлением, которое сменяется гневом.{/n} "Ты прав{mf||а}, элантах! О, Муаран, какая низость! И это цена твоей судьбы? Цена твоего пути?!" {n}Разъяренная женщина бросает на вас взгляд и тут же отворачивается.{/n} "Забери это... прошу тебя..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт смотрит на останки в ваших руках с нескрываемым изумлением, которое сменяется гневом.
  - speaker: Yrliet Lanaeviss
    text_clean: Ты прав, элантах! О, Муаран, какая низость! И это цена твоей судьбы? Цена твоего пути?!
  - speaker: narrator
    text_clean: Разъяренная женщина бросает на вас взгляд и тут же отворачивается.
  - speaker: Yrliet Lanaeviss
    text_clean: Забери это... прошу тебя...
- guid: 0967bf7c-6e57-4cb0-8ad9-ae6999edb34b
  event: CH2_Yrliet_BaseDialogue_22
  text: '"Потому что такова твоя природа. Элантах, чужестран{mf|ец|ка} из тьмы среди звезд. Ты спустил{mf|ся|ась} сюда на огненных крыльях машины в темное время, когда воздух планеты пропитан кровью и болью... будешь ли ты т{mf|ем|ой}, кто принесет ей покой?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Потому что такова твоя природа. Элантах, чужестранец из тьмы среди звезд. Ты спустился сюда на огненных крыльях машины в темное время, когда воздух планеты пропитан кровью и болью... будешь ли ты тем, кто принесет ей покой?
- guid: ac3202b7-5e88-4038-8cb9-be6f826973b8
  event: CH2_Yrliet_BaseDialogue_23
  text: '{n}Хейнрикс неодобрительно хмыкает.{/n} "Опрометчиво".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Хейнрикс неодобрительно хмыкает.
  - speaker: Yrliet Lanaeviss
    text_clean: Опрометчиво.
- guid: 965baad2-e6bb-45fe-9c9f-115896a93851
  event: CH2_Yrliet_BaseDialogue_24
  text: '"Я не могу не напомнить вам, господин ван Калокс, что Патент удостоверяет священное право Вольных Торговцев в случае необходимости вести дела с ксеносами. Если вдруг ваша выдающаяся память вас подвела".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я не могу не напомнить вам, господин ван Калокс, что Патент удостоверяет священное право Вольных Торговцев в случае необходимости вести дела с ксеносами. Если вдруг ваша выдающаяся память вас подвела.
- guid: 8037792b-84a9-4966-9af5-aa7e19f69747
  event: CH2_Yrliet_BaseDialogue_25
  text: '"Чья-то злая воля, направляющая твоих соплеменников на путь насилия".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Чья-то злая воля, направляющая твоих соплеменников на путь насилия.
- guid: ed9e5b4e-2f83-4cfd-bc60-7245afba715e
  event: CH2_Yrliet_BaseDialogue_26
  text: '"Элантах... все то, что ты рассказал{mf||а} мне, будит сомнения и трепет в моей душе. Прошу, дай мне время подумать о том, что скрывается за твоими находками. Не тревожь меня более..." {n}Ирлиэт отворачивается от вас, явно снедаемая тяжелыми мыслями.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах... все то, что ты рассказал мне, будит сомнения и трепет в моей душе. Прошу, дай мне время подумать о том, что скрывается за твоими находками. Не тревожь меня более...
  - speaker: narrator
    text_clean: Ирлиэт отворачивается от вас, явно снедаемая тяжелыми мыслями.
- guid: 22c2b4a4-fdda-4254-957f-d9835674f69a
  event: CH2_Yrliet_BaseDialogue_27
  text: '"Мои суждения и решения — лишь для меня одной, мон-кай. Коль наше единение с тво{mf|им|ей} повелител{mf|ем|ьницей} приведет к миру на Лилэтан — значит, сей путь верный. Не вставай на нем, если тебе дорого твое дыхание".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мои суждения и решения — лишь для меня одной, мон-кай. Коль наше единение с твоим повелителем приведет к миру на Лилэтан — значит, сей путь верный. Не вставай на нем, если тебе дорого твое дыхание.
- guid: a41b133d-f276-427b-86f5-384ffa405af4
  event: CH2_Yrliet_BaseDialogue_28
  text: '{n}Ирлиэт взирает на вас своими странными глазами с выражением, которое удивительно сложно прочесть. Наконец она едва заметно ведет высокой бровью.{/n} "Я встречала подобных тебе. Жизнь вела тебя дорогой, что дает познания, выходящие за пределы обыденного существования вашего вида".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт взирает на вас своими странными глазами с выражением, которое удивительно сложно прочесть. Наконец она едва заметно ведет высокой бровью.
  - speaker: Yrliet Lanaeviss
    text_clean: Я встречала подобных тебе. Жизнь вела тебя дорогой, что дает познания, выходящие за пределы обыденного существования вашего вида.
- guid: 9ccd8475-1ef4-45d4-9883-e55f111c3ab7
  event: CH2_Yrliet_BaseDialogue_29
  text: '"Воистину, кровь в моих жилах и материя моей души чужды вашим — я из тех, кого твои сородичи зовут ксеносами. Я явила себя твоим собратьям, чтобы принести мир на Лилэтан и помочь правительнице против ее врагов. Будешь ли ты говорить со мной, как с равной, или мы ступим под тень Каэла Менша Кхейна?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Воистину, кровь в моих жилах и материя моей души чужды вашим — я из тех, кого твои сородичи зовут ксеносами. Я явила себя твоим собратьям, чтобы принести мир на Лилэтан и помочь правительнице против ее врагов. Будешь ли ты говорить со мной, как с равной, или мы ступим под тень Каэла Менша Кхейна?
- guid: d3665166-f62f-4639-8bb3-d740dee6e53f
  event: CH2_Yrliet_BaseDialogue_30
  text: '"В словах твоих звенит страх. Ты знаешь, кто я, и потому я более не могу ступать затененной тропой — время раскрыться".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: В словах твоих звенит страх. Ты знаешь, кто я, и потому я более не могу ступать затененной тропой — время раскрыться.
- guid: 6a62841b-3eec-4409-a1cb-8fecfbbc1a18
  event: CH2_Yrliet_BaseDialogue_31
  text: '"Нужна ли иная причина, чтобы прийти на помощь страждущим?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Нужна ли иная причина, чтобы прийти на помощь страждущим?
- guid: e0017839-88af-4b85-9e5f-f6c3ca2fd9f7
  event: CH2_Yrliet_BaseDialogue_32
  text: '{n}Ирлиэт смотрит словно сквозь вас.{/n} "Элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт смотрит словно сквозь вас.
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах.
- guid: 9af04654-2e9d-4bf0-a01a-0bf7d3aec762
  event: Companions_Ranger_01
  text: '{n}Ирлиэт изящно склоняет голову, подкрепляя приветствие замысловатым жестом тонких пальцев.{/n} "Элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт изящно склоняет голову, подкрепляя приветствие замысловатым жестом тонких пальцев.
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах.
- guid: 5db3d5e3-5b5f-492a-8c8f-a9f26299ef5b
  event: Companions_Ranger_02
  text: '"Неужто змеиный яд сочится из твоих уст? Мы, {g|Encyclopedia:Asuryani}Дети Азуриана{/g}, знакомы с искусством ведения войны. Мы не налетчики, не палачи и прежде всего — не глупцы! Когда {g|Encyclopedia:Craftworld}мир-корабль{/g} терзает бедствие, его обитатели не станут начинать войну против всех {g|Encyclopedia:MonKeigh}мон-кай{/g} сектора. Если ты ищешь врагов — ищи в ином месте".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Неужто змеиный яд сочится из твоих уст? Мы, Дети Азуриана, знакомы с искусством ведения войны. Мы не налетчики, не палачи и прежде всего — не глупцы! Когда мир-корабль терзает бедствие, его обитатели не станут начинать войну против всех мон-кай сектора. Если ты ищешь врагов — ищи в ином месте.
- guid: 6bf331e6-e508-4b8b-87cc-6815a6f9775e
  event: Companions_Ranger_03
  text: '"Как пожелаешь, элантах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Как пожелаешь, элантах.
- guid: b5e6c019-299a-4551-b72d-ef318ec18747
  event: Companions_Ranger_04
  text: '{n}Ирлиэт качает головой.{/n} "Мысли {g|Encyclopedia:MonKeigh}мон-кай{/g} столь юрки и непостоянны, что смущают и путают даже своих хозяев. Поразительно".'
  speaker: Yrliet Lanaeviss
  parts:
