  event: Companions_Ranger_78
  text: '"Разумная мысль, пришедшая, однако, слишком поздно в твою любопытную голову". {n}Ирлиэт расслабляет руки, открывает глаза и смотрит на вас с осуждением.{/n} "Своего ты добил{mf|ся|ась} — твое шумное присутствие вырвало меня из погружения. Так говори, чего ты хотел{mf||а}?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Разумная мысль, пришедшая, однако, слишком поздно в твою любопытную голову.
  - speaker: narrator
    text_clean: Ирлиэт расслабляет руки, открывает глаза и смотрит на вас с осуждением.
