  event: Companions_Ranger_70
  text: '{n}Ирлиэт печально качает головой.{/n} "Увы, мой кузен впал в немилость архонта. Но даже так... не думаю, что Маражай раскрыл бы мне истину. По крайне мере до того, как его темная душа напитается моими страданиями".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт печально качает головой.
