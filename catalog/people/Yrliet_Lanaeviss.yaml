    text_clean: Что мы здесь делаем, элантах? Мы свернули с нашего Пути — время вернуться назад, на Янус!
- guid: 0c9c605b-72ac-4008-b63f-3693f9070819
  event: Companions_Ranger_76
  text: '"Древний и могущественный {g|Encyclopedia:Drukhari}друкари{/g}, имя которому — Асдрубаэль Вект. Глава кабала Черного Сердца и властитель всего рода друкари. Для темных собратьев он подобен живому богу... Как твой {g|Encyclopedia:Emperor}Император{/g}, восседающий на Золотом Троне, Вект восседает на троне из тьмы и страданий, удерживая разрозненные кланы Комморры от самоуничтожения. На твоем месте, элантах, я бы никогда не возжелала с ним встречи".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Древний и могущественный друкари, имя которому — Асдрубаэль Вект. Глава кабала Черного Сердца и властитель всего рода друкари. Для темных собратьев он подобен живому богу... Как твой Император, восседающий на Золотом Троне, Вект восседает на троне из тьмы и страданий, удерживая разрозненные кланы Комморры от самоуничтожения. На твоем месте, элантах, я бы никогда не возжелала с ним встречи.
