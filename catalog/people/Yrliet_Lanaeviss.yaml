  - speaker: Yrliet Lanaeviss
    text_clean: Признаюсь, твоя несдержанность меня разочаровывает. С каждым днем ты становишься все более примитивным, похожим на прочих мон-кай. Не позволяй своей животной натуре взять верх — я вижу, в тебе есть нечто большее.
