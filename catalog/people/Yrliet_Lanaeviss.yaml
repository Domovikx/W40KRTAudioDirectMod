  event: Companions_Ranger_79
  text: '"Верно". {n}Ирлиэт приподнимает тонкие брови.{/n} "Иногда меня удивляет глубина твоих познаний об обычаях моего народа, элантах. Но даже если ты просто умеешь слушать — это уже возвышает тебя над миллиардами прочих мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
