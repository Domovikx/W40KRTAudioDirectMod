  event: Companions_Ranger_80
  text: '"Клянусь светом звезд, мон-кай!" {n}Ирлиэт распахивает глаза — от безмятежности на ее лице не остается и следа.{/n} "Ты назойливее стаи мелких кровопийц, что преследуют своих жертв средь лесов Лилэтан. Говори — что тебе нужно?"'
  speaker: Yrliet Lanaeviss
