    text_clean: Под бережным присмотром моих сородичей он мог бы вновь обрести свободу. Быть может, даже пробудиться от многовекового сна. Мог бы... но мы этого уже не узнаем.
  - speaker: narrator
    text_clean: Тонкие брови эльдарки чуть вздрагивают, и она отворачивается.
- guid: 1cbb7c55-44da-4917-be26-80e141e0cd6e
  event: Companions_Ranger_111
  text: '"Элантах". {n}Ирлиэт чуть склоняется над вами и долго — непривычно долго — всматривается в глаза. Медленно кивает. И отстраняется.{/n} "Вижу, ты решил{mf||а} {d|Encyclopedia:MiniJealousyRomanceBroken}связать свою судьбу{/d} с иной душой. Мне… понятен твой выбор. Он естественен. И я его принимаю". {n}Скрестив руки на груди, она выпрямляется.{/n} "Ты хотел{mf||а} обсудить еще что-то?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах.
  - speaker: narrator
    text_clean: Ирлиэт чуть склоняется над вами и долго — непривычно долго — всматривается в глаза. Медленно кивает. И отстраняется.
  - speaker: Yrliet Lanaeviss
    text_clean: Вижу, ты решил связать свою судьбу с иной душой. Мне… понятен твой выбор. Он естественен. И я его принимаю.
  - speaker: narrator
    text_clean: Скрестив руки на груди, она выпрямляется.
  - speaker: Yrliet Lanaeviss
    text_clean: Ты хотел обсудить еще что-то?
- guid: 8ad9f1ff-69c4-49f4-b768-413a87104b38
  event: Companions_Ranger_12
  text: '"{g|Encyclopedia:Asuryani}Дети Азуриана{/g} искали на Лилэтан спасения после того, как погиб наш {g|Encyclopedia:Craftworld}мир-корабль{/g}, наш Крударах. Я прибыла позже, разыскивая следы моих собратьев и пытаясь узнать судьбу моего дома. Собратья мои узрели губительное невежество твоего племени и начали сплетать собственную паутину интриг, в которой и я играла роль — в качестве помощницы Вистенцы Вьятт. А затем — явил{mf|ся|ась} ты".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Дети Азуриана искали на Лилэтан спасения после того, как погиб наш мир-корабль, наш Крударах. Я прибыла позже, разыскивая следы моих собратьев и пытаясь узнать судьбу моего дома. Собратья мои узрели губительное невежество твоего племени и начали сплетать собственную паутину интриг, в которой и я играла роль — в качестве помощницы Вистенцы Вьятт. А затем — явился ты.
- guid: 8511b9e9-b4f4-43a6-be71-7c2598a298c9
  event: Companions_Ranger_13
  text: '"Слова правды звучат как музыка. Так у нас говорят".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Слова правды звучат как музыка. Так у нас говорят.
- guid: bbac1d08-c32f-4687-b2da-780944fff922
  event: Companions_Ranger_14
  text: '"Следом за мон-кай по имени Каллигос Винтерскейл. Даже червь может навредить раненному тигру, занеся инфекцию в уже зияющую рану. А раны моего народа... кровоточат с гибели Крудараха. Душам моих собратьев необходима припарка, надежда. А не занесенный меч палача".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Следом за мон-кай по имени Каллигос Винтерскейл. Даже червь может навредить раненному тигру, занеся инфекцию в уже зияющую рану. А раны моего народа... кровоточат с гибели Крудараха. Душам моих собратьев необходима припарка, надежда. А не занесенный меч палача.
- guid: f3789c45-02b5-4612-8548-5e5286beb384
  event: Companions_Ranger_15
  text: '{n}Ирлиэт хмурится.{/n} "Мои сородичи {d|Encyclopedia:Ch2_JanusEldarGovern}остались править миром из теней{/d}, и мне это не по душе. Нам не должно искать власти над иными племенами. Судьба Крудараха, путь в {g|Encyclopedia:Webway}Паутину{/g} — вот что должно волновать их, а не игры во власть. Однако на их судьбу я могу повлиять не более, чем на разразившийся шторм. Могу лишь жалеть, что они выбрали такой путь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт хмурится.
  - speaker: Yrliet Lanaeviss
    text_clean: Мои сородичи остались править миром из теней, и мне это не по душе. Нам не должно искать власти над иными племенами. Судьба Крудараха, путь в Паутину — вот что должно волновать их, а не игры во власть. Однако на их судьбу я могу повлиять не более, чем на разразившийся шторм. Могу лишь жалеть, что они выбрали такой путь.
- guid: 63b38669-daf0-4b74-99c0-18d2ce97551d
  event: Companions_Ranger_16
  text: '"Лилэтан очищается от скверны, что принесли ему {d|Encyclopedia:Ch2_JanusVistenzaDead}служители{/d} {g|Encyclopedia:Sailanthresh}Сай''лантреш{/g}. Сады и птицы, звери и люди — многие сгинули безвозвратно, и многие поражены скверной слишком сильно, чтоб исцелиться. Но Лилэтан сильнее. Мир будет жить".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Лилэтан очищается от скверны, что принесли ему служители Сай'лантреш. Сады и птицы, звери и люди — многие сгинули безвозвратно, и многие поражены скверной слишком сильно, чтоб исцелиться. Но Лилэтан сильнее. Мир будет жить.
- guid: 02500eda-6a1a-489c-be81-760c51d495d8
  event: Companions_Ranger_17
  text: '"Крударах нельзя описать на вашем языке. Его можно только спеть — облачить в вязь мелодии, изящной и сложной, как его энергетическая сеть, {g|Encyclopedia:InfinityCircuit}Контур бесконечности{/g}. Его можно увидеть в золотых переливах солнца, ощутить в дуновении звездных ветров. Хоть он и был миром рукотворным, но столь же живым, как настоящие планеты".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Крударах нельзя описать на вашем языке. Его можно только спеть — облачить в вязь мелодии, изящной и сложной, как его энергетическая сеть, Контур бесконечности. Его можно увидеть в золотых переливах солнца, ощутить в дуновении звездных ветров. Хоть он и был миром рукотворным, но столь же живым, как настоящие планеты.
- guid: 00fac960-92be-4f06-86b8-f127c57b55ed
  event: Companions_Ranger_18
  text: '"Но я должна смотреть ясно и видеть не только свет, но и тени. Мне хочется помнить лишь прекрасную сторону Крудараха, но у него была и темная. Мой мир слишком долго провел в изоляции. Он стал подобен озеру, вода в котором застоялась. Там, где нет движения и обновления, даже сладчайшие порывы жизни пропитываются затхлостью. Кто знает..." {n}Ирлиэт тяжело вздыхает.{/n} "...Кто знает, быть может, не будь этой затхлости, будь наши старшие не столь слепы в своих догматах, а молодые — чуть смелее, может быть... Тогда Крударах был бы жив и сейчас?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Но я должна смотреть ясно и видеть не только свет, но и тени. Мне хочется помнить лишь прекрасную сторону Крудараха, но у него была и темная. Мой мир слишком долго провел в изоляции. Он стал подобен озеру, вода в котором застоялась. Там, где нет движения и обновления, даже сладчайшие порывы жизни пропитываются затхлостью. Кто знает...
  - speaker: narrator
    text_clean: Ирлиэт тяжело вздыхает.
  - speaker: Yrliet Lanaeviss
    text_clean: '...Кто знает, быть может, не будь этой затхлости, будь наши старшие не столь слепы в своих догматах, а молодые — чуть смелее, может быть... Тогда Крударах был бы жив и сейчас?'
- guid: d341ae22-a4b0-4241-bcfb-aaee7843b52a
  event: Companions_Ranger_19
  text: '"Это тайна, мрачная, как вздох последнего бессмертного, глубокая, как темные океанские воды. И я мало что могу поведать, ибо была далеко... На миссии вместе с отрядом. В назначенный срок мы вернулись, но не нашли Крударах в его звездной гавани. Прошло уже столько ходов — столько "стандартных лет", как говорят у вас, — но я помню этот миг, словно он случился сегодня. Память об утрате всегда сильнее памяти об обретении, особенно когда теряешь нечто столь великое, как дом. Мир".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Это тайна, мрачная, как вздох последнего бессмертного, глубокая, как темные океанские воды. И я мало что могу поведать, ибо была далеко... На миссии вместе с отрядом. В назначенный срок мы вернулись, но не нашли Крударах в его звездной гавани. Прошло уже столько ходов — столько "стандартных лет", как говорят у вас, — но я помню этот миг, словно он случился сегодня. Память об утрате всегда сильнее памяти об обретении, особенно когда теряешь нечто столь великое, как дом. Мир.
- guid: 1ef91687-14c7-4da5-bb24-b8263f7ceff2
  event: Companions_Ranger_20
  text: '"Мы искали, звали, смотрели — но видели лишь пустоту и эхо эха большой беды. Бессчетные дни миновали, прежде чем я оказалась на Лилэтан и нашла там нескольких сородичей — беглецов, чудом добравшихся до мира наших предков. Но их рассказ едва ли был плодом желанной истины. Те, кто готов был говорить со мной — а таковых было мало, ибо в глазах их я была блудной дочерью, отринувшей достойные Пути — лепетали о страшной болезни, что растеклась черными нитями боли по путям {g|Encyclopedia:InfinityCircuit}Контура бесконечности{/g}, умерщвляя мир целыми сегментами. Те, кто выжил — бежали в страхе и скитались меж звезд, пока теплый свет Лилэтан не позвал некоторых из них".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мы искали, звали, смотрели — но видели лишь пустоту и эхо эха большой беды. Бессчетные дни миновали, прежде чем я оказалась на Лилэтан и нашла там нескольких сородичей — беглецов, чудом добравшихся до мира наших предков. Но их рассказ едва ли был плодом желанной истины. Те, кто готов был говорить со мной — а таковых было мало, ибо в глазах их я была блудной дочерью, отринувшей достойные Пути — лепетали о страшной болезни, что растеклась черными нитями боли по путям Контура бесконечности, умерщвляя мир целыми сегментами. Те, кто выжил — бежали в страхе и скитались меж звезд, пока теплый свет Лилэтан не позвал некоторых из них.
- guid: 49e99753-f8c9-4248-81fd-f0a61f45e6c5
  event: Companions_Ranger_21
  text: '"Однако мон-кай Ахиллеас... с ним творилось неладное. Он пропадал ночами, и один раз я проследила за ним. Ахиллеас связывался с Маражаем через артефакт, транслирующий приказы хозяина. Так я узнала, что обожженный мон-кай собирается вскоре предать тебя... А это значило, что я могла упустить единственную нить, ведущую к истине о судьбе моего дома. Я... не могла больше ждать. Я убила Ахиллеаса, забрала артефакт и потребовала у Маражая ответов. Он намекнул мне, где искать правду. Ну а дальше тебе и так все известно".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Однако мон-кай Ахиллеас... с ним творилось неладное. Он пропадал ночами, и один раз я проследила за ним. Ахиллеас связывался с Маражаем через артефакт, транслирующий приказы хозяина. Так я узнала, что обожженный мон-кай собирается вскоре предать тебя... А это значило, что я могла упустить единственную нить, ведущую к истине о судьбе моего дома. Я... не могла больше ждать. Я убила Ахиллеаса, забрала артефакт и потребовала у Маражая ответов. Он намекнул мне, где искать правду. Ну а дальше тебе и так все известно.
- guid: 1b93fa69-9a74-4698-9399-67e0d3abc6b2
  event: Companions_Ranger_22
  text: '"Мне было суждено разделить твою участь, элантах, и сгинуть в гниющем подбрюшье Темного города. Однако мастер плоти распорядился иначе. Его искаженный разум задался вопросом: возможно ли "спасти" {g|Encyclopedia:Asuryani}Дитя Азуриана{/g} от взгляда {g|Encyclopedia:Sailanthresh}Той, Что Жаждет{/g}, методом усердного перевоспитания. Заменить влияние {g|Encyclopedia:SpiritStone}камня души{/g} на дурманящий привкус боли, коим питаются последователи темных путей".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: 'Мне было суждено разделить твою участь, элантах, и сгинуть в гниющем подбрюшье Темного города. Однако мастер плоти распорядился иначе. Его искаженный разум задался вопросом: возможно ли "спасти" Дитя Азуриана от взгляда Той, Что Жаждет, методом усердного перевоспитания. Заменить влияние камня души на дурманящий привкус боли, коим питаются последователи темных путей.'
- guid: e1e544c0-f231-49d1-9997-b45fc4189998
  event: Companions_Ranger_23
  text: '"Комморра... Этот город перемалывает волю сильнейших и истязает любого, кто попал в его сети. Глупцы здесь гибнут первыми, ну а те, кто оказался прозорливей... Все равно сгинут следом. Я здесь впервые, но немногим {g|Encyclopedia:Asuryani}Детям Азуриана{/g} удавалось покинуть Темный город, не лишившись части души. Так что же ты хочешь узнать?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Комморра... Этот город перемалывает волю сильнейших и истязает любого, кто попал в его сети. Глупцы здесь гибнут первыми, ну а те, кто оказался прозорливей... Все равно сгинут следом. Я здесь впервые, но немногим Детям Азуриана удавалось покинуть Темный город, не лишившись части души. Так что же ты хочешь узнать?
- guid: baf8933c-92e0-4aa7-80d3-ba5dc4571297
  event: Companions_Ranger_24
  text: '"Я не нуждаюсь в твоем сочувствии, элантах". {n}Ирлиэт безразлично скользит взглядом по мостику, но уголки ее губ предательски тянутся вверх, а взгляд смягчается.{/n} "К тому же ни мон-кай, ни мои темные сородичи так и не нашли тлеющий скелет Крудараха. Быть может... еще не все потеряно. Быть может, утраченное еще можно вернуть".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я не нуждаюсь в твоем сочувствии, элантах.
  - speaker: narrator
    text_clean: Ирлиэт безразлично скользит взглядом по мостику, но уголки ее губ предательски тянутся вверх, а взгляд смягчается.
  - speaker: Yrliet Lanaeviss
    text_clean: К тому же ни мон-кай, ни мои темные сородичи так и не нашли тлеющий скелет Крудараха. Быть может... еще не все потеряно. Быть может, утраченное еще можно вернуть.
- guid: 05ebc96c-e313-49a2-b23c-9f3d31bac484
  event: Companions_Ranger_25
  text: '"Позволь дать тебе совет напоследок: остерегайся внимания Аребенниана, элантах, пока он к тебе добр. А если разгневаешь... Беги прочь, скрывайся и молись о спасении. Ибо служитель Смеющегося бога всегда настигает свою жертву".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: 'Позволь дать тебе совет напоследок: остерегайся внимания Аребенниана, элантах, пока он к тебе добр. А если разгневаешь... Беги прочь, скрывайся и молись о спасении. Ибо служитель Смеющегося бога всегда настигает свою жертву.'
- guid: 14cd73fe-f729-4e9e-a5fc-0ec048cc8c4b
  event: Companions_Ranger_26
  text: '{n}Ирлиэт склоняет голову.{/n} "Мы различны, как сияние звезд и отблеск света в дождевой луже, но враг у нас один. В твердости наша сила".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт склоняет голову.
  - speaker: Yrliet Lanaeviss
    text_clean: Мы различны, как сияние звезд и отблеск света в дождевой луже, но враг у нас один. В твердости наша сила.
- guid: bf92fed7-76c7-4d6a-b71e-72b2889e57bc
  event: Companions_Ranger_27
  text: '"Это — наживка, которой враг поманит тебя, заставляя приближаться. Шаг за шагом. Будь осторож{mf|ен|на}, элантах — может, намерения твои и благи, но дорога, по которой они ведут — опасна".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Это — наживка, которой враг поманит тебя, заставляя приближаться. Шаг за шагом. Будь осторожен, элантах — может, намерения твои и благи, но дорога, по которой они ведут — опасна.
- guid: ab8c9564-1c72-4afd-966d-e126fd3f84f3
  event: Companions_Ranger_28
  text: '"В таком случае ты получил{mf||а} ответ... {g|Encyclopedia:MonKeigh}мон-кай{/g}".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: В таком случае ты получил ответ... мон-кай.
- guid: 014d3635-5156-464a-a22f-014be703ea34
  event: Companions_Ranger_29
  text: '"Значит, Путь ведет меня дальше, прочь от твоего рода. К добру ли или к злу — узнаю, лишь двинувшись в дорогу. Прощай, элантах". {n}Лицо эльдарки не выражает ничего, кроме холодной надменности.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Значит, Путь ведет меня дальше, прочь от твоего рода. К добру ли или к злу — узнаю, лишь двинувшись в дорогу. Прощай, элантах.
  - speaker: narrator
    text_clean: Лицо эльдарки не выражает ничего, кроме холодной надменности.
- guid: b0408d24-907b-43ac-800c-2e06b7072e30
  event: Companions_Ranger_30
  text: '"Темный город выпустил нас из терновых объятий. Раны тела будут залечены, но что насчет ран души?" {n}Ирлиэт касается алого камня, инкрустированного в нагрудник.{/n} "Крударах пал, и с его гибелью на осколки разбились хрупкие жизни миллионов {g|Encyclopedia:Asuryani}Детей Азуриана{/g}. Разрозненные по этой части галактики, гонимые {g|Encyclopedia:MonKeigh}мон-кай{/g}, преследуемые Темными, плененные слугами Той, Что Жаждет..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Темный город выпустил нас из терновых объятий. Раны тела будут залечены, но что насчет ран души?
  - speaker: narrator
    text_clean: Ирлиэт касается алого камня, инкрустированного в нагрудник.
  - speaker: Yrliet Lanaeviss
    text_clean: Крударах пал, и с его гибелью на осколки разбились хрупкие жизни миллионов Детей Азуриана. Разрозненные по этой части галактики, гонимые мон-кай, преследуемые Темными, плененные слугами Той, Что Жаждет...
- guid: 94256a23-5891-410e-9e3b-dc1ea17b273a
  event: Companions_Ranger_31
  text: '{n}Пускай тонкие черты Ирлиэт и остались прежними, глубокая синева вокруг глаз и потускневший взгляд делают ее похожей на живой труп. {g|Encyclopedia:Aeldari}Эльдарка{/g} выглядит иссушенной, загнанной, мрачной... Однако при вашем приближении привычная резкость во взгляде сменяется едва заметной надеждой.{/n} "Ты вернул{mf|ся|ась} из тьмы, элантах? Невредим{mf|ый|ая}".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Пускай тонкие черты Ирлиэт и остались прежними, глубокая синева вокруг глаз и потускневший взгляд делают ее похожей на живой труп. Эльдарка выглядит иссушенной, загнанной, мрачной... Однако при вашем приближении привычная резкость во взгляде сменяется едва заметной надеждой.
  - speaker: Yrliet Lanaeviss
    text_clean: Ты вернулся из тьмы, элантах? Невредимый.
- guid: 1174771e-9b89-4499-af49-8ab5537b2a59
  event: Companions_Ranger_32
  text: '"Твоя жалость ранит острее, чем клинки кабалита". {n}Ирлиэт чуть отстраняется, потупив взор, но головы не склоняет.{/n} "Я... оступилась. Почти потеряла свой Путь во тьме Темного города, пытаясь достичь того, что до конца не осознавала. Отчаяние затмило мой разум, но ты, элантах, не позволил{mf||а} ему прорасти в моей душе, словно сорному семени. За это... прими мою благодарность".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Твоя жалость ранит острее, чем клинки кабалита.
  - speaker: narrator
    text_clean: Ирлиэт чуть отстраняется, потупив взор, но головы не склоняет.
  - speaker: Yrliet Lanaeviss
    text_clean: Я... оступилась. Почти потеряла свой Путь во тьме Темного города, пытаясь достичь того, что до конца не осознавала. Отчаяние затмило мой разум, но ты, элантах, не позволил ему прорасти в моей душе, словно сорному семени. За это... прими мою благодарность.
- guid: ca1f5ab7-e7d9-4cbb-9e12-6267910f10d7
  event: Companions_Ranger_33
  text: '"Мои сородичи, должно быть, {d|Encyclopedia:Ch2_JanusEldarAllies}продолжают искать дорогу{/d} в {g|Encyclopedia:Webway}Паутину{/g}. Пусть дух Лилэтан поможет им в этом — за вратами лежит спасение, а может, и знания о судьбе Крудараха и иных выживших".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мои сородичи, должно быть, продолжают искать дорогу в Паутину. Пусть дух Лилэтан поможет им в этом — за вратами лежит спасение, а может, и знания о судьбе Крудараха и иных выживших.
- guid: 78e0f5ab-210f-441b-9380-47f419a091ea
  event: Companions_Ranger_34
  text: '"Некоторые, как и Муаран, уверяют — виной всему племя {g|Encyclopedia:MonKeigh}мон-кай{/g}. Однако истина мне до сих пор неведома. Но я надеюсь — о, надеюсь и молю богов, — что однажды она мне откроется!"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Некоторые, как и Муаран, уверяют — виной всему племя мон-кай. Однако истина мне до сих пор неведома. Но я надеюсь — о, надеюсь и молю богов, — что однажды она мне откроется!
- guid: 4e3a2207-e04a-46e2-ab2f-42bb31b6a356
  event: Companions_Ranger_35
  text: '"Мое тело уже исцелилось". {n}Ирлиэт благодарно кивает.{/n} "Душевные раны... однажды затянутся тоже. Ибо страдания есть часть нашей жизни, как и любовь, и страх, и жажда знаний. Пути помогают {g|Encyclopedia:Asuryani}Детям Азуриана{/g} вынести любое душевное потрясение, и ты, элантах, не позволил{mf||а} мне сойти с моего. За это... прими мою благодарность".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мое тело уже исцелилось.
  - speaker: narrator
    text_clean: Ирлиэт благодарно кивает.
  - speaker: Yrliet Lanaeviss
    text_clean: Душевные раны... однажды затянутся тоже. Ибо страдания есть часть нашей жизни, как и любовь, и страх, и жажда знаний. Пути помогают Детям Азуриана вынести любое душевное потрясение, и ты, элантах, не позволил мне сойти с моего. За это... прими мою благодарность.
- guid: 2d51d315-391c-446c-8529-7218ee1a05ba
  event: Companions_Ranger_36
  text: '"Ты говоришь о том, что осознать не в силах, элантах. {g|Encyclopedia:SpiritStone}Путеводные камни{/g} не просто диковинные украшения моего народа. Они — нечто больше..." {n}Ирлиэт прикрывает глаза и неосознанно касается алого кристалла на груди.{/n} "С рождения и до последнего вздоха камень души принадлежит лишь своему хозяину, являясь вечным напоминанием о том, что все мы смертны. Ибо он есть первое пристанище разума и последнее пристанище духа, что так жаждет поглотить {g|Encyclopedia:Sailanthresh}Сай''лантреш{/g}".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты говоришь о том, что осознать не в силах, элантах. Путеводные камни не просто диковинные украшения моего народа. Они — нечто больше...
  - speaker: narrator
    text_clean: Ирлиэт прикрывает глаза и неосознанно касается алого кристалла на груди.
  - speaker: Yrliet Lanaeviss
    text_clean: С рождения и до последнего вздоха камень души принадлежит лишь своему хозяину, являясь вечным напоминанием о том, что все мы смертны. Ибо он есть первое пристанище разума и последнее пристанище духа, что так жаждет поглотить Сай'лантреш.
- guid: c4472362-7f67-4219-85e6-0f529a05b6e4
  event: Companions_Ranger_37
  text: '{n}Ирлиэт встречает вопрос испытующим взглядом.{/n} "Праздное любопытство заложено в природу {g|Encyclopedia:MonKeigh}мон-кай{/g}? Или же ты пытаешься выведать слабые места моего народа, дабы уничтожить еще один мир Детей Азуриана? Прости, элантах, но сейчас я не готова окунуть тебя в омут глубочайших тайн моих сородичей".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт встречает вопрос испытующим взглядом.
  - speaker: Yrliet Lanaeviss
    text_clean: Праздное любопытство заложено в природу мон-кай? Или же ты пытаешься выведать слабые места моего народа, дабы уничтожить еще один мир Детей Азуриана? Прости, элантах, но сейчас я не готова окунуть тебя в омут глубочайших тайн моих сородичей.
- guid: 009d9002-ed20-480a-b496-0448e48d40b1
  event: Companions_Ranger_38
  text: '"Объяснять подобное тебе, элантах, равно что петь птицам о красоте глубинных вод и кораллового леса. Твое ограниченное представление о мире едва ли вместит в сознании изгибы бесконечных шпилей из {g|Encyclopedia:Wraithbone}психокости{/g}, сладостный дурман цветущего сада под кристаллическим куполом или хрустальное журчание ручья, пронзающего насквозь мир. И все это на одном корабле, что сияет подобно очередной звезде на бархатном полотне космоса".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Объяснять подобное тебе, элантах, равно что петь птицам о красоте глубинных вод и кораллового леса. Твое ограниченное представление о мире едва ли вместит в сознании изгибы бесконечных шпилей из психокости, сладостный дурман цветущего сада под кристаллическим куполом или хрустальное журчание ручья, пронзающего насквозь мир. И все это на одном корабле, что сияет подобно очередной звезде на бархатном полотне космоса.
- guid: 1207d154-1602-4b68-abec-b5b77414c81a
  event: Companions_Ranger_39
  text: '"Память {g|Encyclopedia:MonKeigh}мон-кай{/g} столь же скоротечна, как и ваш век". {n}Ирлиэт склоняет голову, горестно потешаясь над вопросом.{/n} "Твоя предшественница поразила Крударах скверной, неподвластной даже силам предков, единенных с {g|Encyclopedia:InfinityCircuit}Контуром Бесконечности{/g}. А пока умирающий мир бился в предсмертной агонии, Темные пленили бежавших Детей Азуриана, отбирая провидцев для безумных экспериментов гемункула".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Память мон-кай столь же скоротечна, как и ваш век.
  - speaker: narrator
    text_clean: Ирлиэт склоняет голову, горестно потешаясь над вопросом.
  - speaker: Yrliet Lanaeviss
    text_clean: Твоя предшественница поразила Крударах скверной, неподвластной даже силам предков, единенных с Контуром Бесконечности. А пока умирающий мир бился в предсмертной агонии, Темные пленили бежавших Детей Азуриана, отбирая провидцев для безумных экспериментов гемункула.
- guid: 6c8e60e4-93bd-4eb5-aad3-349e7805e47c
  event: Companions_Ranger_40
  text: '"Вечный круговорот жизни и смерти. Место упокоения предков и бесконечный источник их мудрости". {n}Тонкие пальцы Ирлиэт сплетают в воздухе замысловатые узоры.{/n} "Когда {g|Encyclopedia:Asuryani}Дитя Азуриана{/g} погибает, его дух перемещается в путеводный камень, а по возвращении на {g|Encyclopedia:Craftworld}мир-корабль{/g} помещается в {g|Encyclopedia:InfinityCircuit}Контур бесконечности{/g}, где становится одним целым с душами тех, кто был до нас".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вечный круговорот жизни и смерти. Место упокоения предков и бесконечный источник их мудрости.
  - speaker: narrator
    text_clean: Тонкие пальцы Ирлиэт сплетают в воздухе замысловатые узоры.
  - speaker: Yrliet Lanaeviss
    text_clean: Когда Дитя Азуриана погибает, его дух перемещается в путеводный камень, а по возвращении на мир-корабль помещается в Контур бесконечности, где становится одним целым с душами тех, кто был до нас.
- guid: 46fb5d53-2515-4b17-96eb-c87bec156f83
  event: Companions_Ranger_41
  text: '"Темный город пронизывают миллионы шпилей, и внутри любого из них могут таиться врата в {g|Encyclopedia:Webway}Паутину{/g}. Они — единственный выход из этого места. И непреодолимое препятствие для того, кто не знает, как с ними управиться. Я — знаю. И помогу тебе, если ты того пожелаешь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Темный город пронизывают миллионы шпилей, и внутри любого из них могут таиться врата в Паутину. Они — единственный выход из этого места. И непреодолимое препятствие для того, кто не знает, как с ними управиться. Я — знаю. И помогу тебе, если ты того пожелаешь.
- guid: f2f2368d-5f8b-4e8d-b348-ba9334b75bf5
  event: Companions_Ranger_42
  text: '"И это говорит мне бабочка, что сама трепыхается в сетях Темного города". {n}Печальная полуулыбка касается тонких губ эльдарки.{/n} "Я буду рядом, элантах. И поддержу тебя в предстоящих испытаниях, если ты того пожелаешь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И это говорит мне бабочка, что сама трепыхается в сетях Темного города.
  - speaker: narrator
    text_clean: Печальная полуулыбка касается тонких губ эльдарки.
  - speaker: Yrliet Lanaeviss
    text_clean: Я буду рядом, элантах. И поддержу тебя в предстоящих испытаниях, если ты того пожелаешь.
- guid: 1aa13b17-87a1-4817-a097-afe4f942eaea
  event: Companions_Ranger_43
  text: '"Я оказалась в Темном городе, ступая по спутанным тропам из правды и лжи. И пусть истина распустилась передо мной уродливым бутоном, оцарапавшим душу шипами, я отыскала ответы на заданные вопросы". {n}Слова Ирлиэт звучат тихо, почти невесомо.{/n} "Кто вернулся из тьмы {g|Encyclopedia:Webway}Паутины{/g} — уже не станет прежним. Но изменились лишь мы, а мир вокруг все так же незыблем. Эта мысль придает мне сил".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я оказалась в Темном городе, ступая по спутанным тропам из правды и лжи. И пусть истина распустилась передо мной уродливым бутоном, оцарапавшим душу шипами, я отыскала ответы на заданные вопросы.
  - speaker: narrator
    text_clean: Слова Ирлиэт звучат тихо, почти невесомо.
  - speaker: Yrliet Lanaeviss
    text_clean: Кто вернулся из тьмы Паутины — уже не станет прежним. Но изменились лишь мы, а мир вокруг все так же незыблем. Эта мысль придает мне сил.
- guid: 01c8e597-3367-4ae5-a4ec-8d50271a3a2e
  event: Companions_Ranger_44
  text: '"Если ты так беспокоишься о моем мире, элантах, почему не отправил{mf|ся|ась} искать ответы со мной? Быть может, тогда Эклендиль остался бы жив". {n}Глаза {g|Encyclopedia:Aeldari}эльдарки{/g} вспыхивают недобрым огнем, а бледные губы вытягиваются в тонкую линию.{/n} "Я нашла его умирающим в тисках очередного орудия пыток. И Эклендиль раскрыл мне печальную судьбу нашего мира".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Если ты так беспокоишься о моем мире, элантах, почему не отправился искать ответы со мной? Быть может, тогда Эклендиль остался бы жив.
  - speaker: narrator
    text_clean: Глаза эльдарки вспыхивают недобрым огнем, а бледные губы вытягиваются в тонкую линию.
  - speaker: Yrliet Lanaeviss
    text_clean: Я нашла его умирающим в тисках очередного орудия пыток. И Эклендиль раскрыл мне печальную судьбу нашего мира.
- guid: 0ed32e03-0854-48e1-8219-ff2942a45f3a
  event: Companions_Ranger_45
  text: '{n}Взгляд Ирлиэт темнеет.{/n} "К чему этот вопрос? Праздное любопытство? Или нечто иное? Не обращай свои мысли к {g|Encyclopedia:Sailanthresh}Сай''лантреш{/g}, что бы тобой ни двигало! Она — погибель. Она — голод. Она — враг всего благого, что есть во вселенной. Она враг {g|Encyclopedia:Aeldari}эльдарам{/g}. И тебе — надеюсь — тоже". {n}Последнюю фразу Ирлиэт произносит с нажимом, испытующе глядя на вас.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Взгляд Ирлиэт темнеет.
  - speaker: Yrliet Lanaeviss
    text_clean: К чему этот вопрос? Праздное любопытство? Или нечто иное? Не обращай свои мысли к Сай'лантреш, что бы тобой ни двигало! Она — погибель. Она — голод. Она — враг всего благого, что есть во вселенной. Она враг эльдарам. И тебе — надеюсь — тоже.
  - speaker: narrator
    text_clean: Последнюю фразу Ирлиэт произносит с нажимом, испытующе глядя на вас.
- guid: fda3e525-8f12-4383-b6d4-0cb9268de019
  event: Companions_Ranger_46
  text: '{n}Боль сковала сердце эльдарки, отразившись печалью в глазах.{/n} "Неизлечимая. Непостижимая. Болезнь искажала Крударах и все, к чему прикасалась, избегая встречи лишь с душами наших предков. Никто так и не сумел опознать природу проклятия, и потому, отчаявшись сохранить свой мир, мои собратья решили просто бежать прочь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Боль сковала сердце эльдарки, отразившись печалью в глазах.
  - speaker: Yrliet Lanaeviss
    text_clean: Неизлечимая. Непостижимая. Болезнь искажала Крударах и все, к чему прикасалась, избегая встречи лишь с душами наших предков. Никто так и не сумел опознать природу проклятия, и потому, отчаявшись сохранить свой мир, мои собратья решили просто бежать прочь.
- guid: ee55903d-d6b4-4ee1-9ef9-db511216f7d2
  event: Companions_Ranger_47
  text: '"Ты можешь попробовать".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты можешь попробовать.
- guid: 155a9842-04a0-4847-84ed-eaea96b51b87
  event: Companions_Ranger_48
  text: '"Элантах". {n}Ирлиэт исполняет изящный жест, приглашающий к беседе.{/n} "Надеюсь, твои путешествия оказались плодотворными?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Элантах.
  - speaker: narrator
    text_clean: Ирлиэт исполняет изящный жест, приглашающий к беседе.
  - speaker: Yrliet Lanaeviss
    text_clean: Надеюсь, твои путешествия оказались плодотворными?
- guid: 8df66cad-f0cc-495c-8c71-bcb662b96a5b
  event: Companions_Ranger_49
  text: '{n}Кристалл в нагруднике Ирлиэт наливается алым свечением, и каждый вздох эльдарки становится беспокойнее предыдущего.{/n} "Я приняла роль палача, дабы сохранить камень души при себе взамен на чужие страдания. Выжидала, молилась о милости Азуриана... И надеялась лишь сбежать до того, как камень треснет от потока боли и ужаса, обуявшего мою душу. До того, как эксперимент завершится".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Кристалл в нагруднике Ирлиэт наливается алым свечением, и каждый вздох эльдарки становится беспокойнее предыдущего.
  - speaker: Yrliet Lanaeviss
    text_clean: Я приняла роль палача, дабы сохранить камень души при себе взамен на чужие страдания. Выжидала, молилась о милости Азуриана... И надеялась лишь сбежать до того, как камень треснет от потока боли и ужаса, обуявшего мою душу. До того, как эксперимент завершится.
- guid: 1a284743-67dd-4be0-9db1-4de0d60354ae
  event: Companions_Ranger_50
  text: '"Не существует иных городов, элантах. Темный город бескраен — он есть сплетение множества кошмарных царств, подчиненных одному властителю. Бесконечное переплетение измерений, вечно меняющихся и вечно неизменных. Тебе не осознать его темного величия, ибо даже моей жизни не хватит, чтобы посетить все уголки Темного города и прилегающих к нему царств. Впрочем, куда бы ты ни пош{mf|ел|ла}, вокруг тебя ждет лишь смерть".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Не существует иных городов, элантах. Темный город бескраен — он есть сплетение множества кошмарных царств, подчиненных одному властителю. Бесконечное переплетение измерений, вечно меняющихся и вечно неизменных. Тебе не осознать его темного величия, ибо даже моей жизни не хватит, чтобы посетить все уголки Темного города и прилегающих к нему царств. Впрочем, куда бы ты ни пошел, вокруг тебя ждет лишь смерть.
- guid: d2b47051-7357-4353-beb6-26d825c26756
  event: Companions_Ranger_51
  text: '"Но есть ли у меня ответы, которых ты жаждешь?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Но есть ли у меня ответы, которых ты жаждешь?
- guid: 135e71b6-0828-41f5-ac8a-c8225fba5f56
  event: Companions_Ranger_52
  text: '{n}Ирлиэт приподнимает подбородок и сразу становится как будто еще выше.{/n} "Слуги {g|Encyclopedia:Sailanthresh}Той, Что Жаждет{/g} учуяли мою душу за толстыми стенами и за тонкой пеленой, что отгораживает ваши хрупкие жизни от ярости, бушующей за бортом. {g|Encyclopedia:Asuryani}Дитя Азуриана{/g}, проникшая за пелену... на расстоянии вытянутой лапы... за слабым барьером из ненадежной технологии мон-кай... Это слишком соблазнительная добыча для чудовищ, служащих Сай''лантреш".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт приподнимает подбородок и сразу становится как будто еще выше.
  - speaker: Yrliet Lanaeviss
    text_clean: Слуги Той, Что Жаждет учуяли мою душу за толстыми стенами и за тонкой пеленой, что отгораживает ваши хрупкие жизни от ярости, бушующей за бортом. Дитя Азуриана, проникшая за пелену... на расстоянии вытянутой лапы... за слабым барьером из ненадежной технологии мон-кай... Это слишком соблазнительная добыча для чудовищ, служащих Сай'лантреш.
- guid: 66971f1f-5dd0-4700-b9d5-5fc4d6670a42
  event: Companions_Ranger_53
  text: '"Ненависть душит змеей, а страх жгучим ядом разливается по телу, ибо избранный Путь ведет меня лишь тропами неудачи. Я не могу ни сдержать свое горе, ни обуздать свой гнев... Но и свернуть с Пути я также не в силах". {n}Ирлиэт сдавленно всхлипывает, бросает горестный взгляд, и лицо ее вновь становится неумолимым.{/n} "Прости мой скоротечный гнев, элантах. Когда ускользает воля, душа трепещет от необузданных эмоций. Но я приму смирение сердца, ибо лишь так клейменный Изгой может помочь собратьям, потерявшимся во тьме".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ненависть душит змеей, а страх жгучим ядом разливается по телу, ибо избранный Путь ведет меня лишь тропами неудачи. Я не могу ни сдержать свое горе, ни обуздать свой гнев... Но и свернуть с Пути я также не в силах.
  - speaker: narrator
    text_clean: Ирлиэт сдавленно всхлипывает, бросает горестный взгляд, и лицо ее вновь становится неумолимым.
  - speaker: Yrliet Lanaeviss
    text_clean: Прости мой скоротечный гнев, элантах. Когда ускользает воля, душа трепещет от необузданных эмоций. Но я приму смирение сердца, ибо лишь так клейменный Изгой может помочь собратьям, потерявшимся во тьме.
- guid: cc425cc6-6c6b-4cb4-9462-1cf04acbc375
  event: Companions_Ranger_54
  text: '"То, как Крударах наткнулся среди звезд на корабль мон-кай и был заражен неизлечимой скверной, с которой не справилась даже воля предков. Как совет принял решение собрать на челноки тех, кто остался, и рассыпаться по галактике в поисках спасения. И как сами провидцы направили наш мир навстречу гибели".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: То, как Крударах наткнулся среди звезд на корабль мон-кай и был заражен неизлечимой скверной, с которой не справилась даже воля предков. Как совет принял решение собрать на челноки тех, кто остался, и рассыпаться по галактике в поисках спасения. И как сами провидцы направили наш мир навстречу гибели.
- guid: 73641b12-38e5-4154-8069-3b95010a755f
  event: Companions_Ranger_55
  text: '"Я {d|Encyclopedia:YrlietQ1_ManagedHerself}убила{/d} его" {n}, — бесстрастно произносит Ирлиэт и больше не добавляет ни слова.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я убила его
  - speaker: narrator
    text_clean: ', — бесстрастно произносит Ирлиэт и больше не добавляет ни слова.'
- guid: 428eee3d-99de-4596-a1fd-a4f9725336cf
  event: Companions_Ranger_56
  text: '"Путь сквозь скопление звезд, что вы, мон-кай, зовете {g|Encyclopedia:KoronusExpanse}Простором{/g}, для Крудараха избрал совет провидцев. И Эклендиль был в их числе". {n}Дыхание Ирлиэт сбивается от прилива ярости, заставляя грудь вздыматься гораздо чаще.{/n} "Предзнаменования темного будущего сулили провидцам их же видения. Но от них отмахнулись, презрели... И моя душа до сих пор в смятении — почему".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Путь сквозь скопление звезд, что вы, мон-кай, зовете Простором, для Крудараха избрал совет провидцев. И Эклендиль был в их числе.
  - speaker: narrator
    text_clean: Дыхание Ирлиэт сбивается от прилива ярости, заставляя грудь вздыматься гораздо чаще.
  - speaker: Yrliet Lanaeviss
    text_clean: Предзнаменования темного будущего сулили провидцам их же видения. Но от них отмахнулись, презрели... И моя душа до сих пор в смятении — почему.
- guid: 933b8bd9-c5f5-4300-9933-5965c327038d
  event: Companions_Ranger_57
  text: '"Эклендиль пожелал остаться на Лилэтан, вместе с Муараном и нашими собратьями. Быть может, это и к лучшему — звезды сей части галактики слишком недружелюбны к Детям Азуриана".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Эклендиль пожелал остаться на Лилэтан, вместе с Муараном и нашими собратьями. Быть может, это и к лучшему — звезды сей части галактики слишком недружелюбны к Детям Азуриана.
- guid: 3506e462-4cb5-4596-9149-66e592b1114c
  event: Companions_Ranger_58
  text: '"Как только Эклендиль наберется сил, то покинет Лилэтан сквозь врата {g|Encyclopedia:Webway}Паутины{/g}. Не спрашивай, куда уведет его Путь — он идет собственной дорогой судьбы, и пусть так и будет".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Как только Эклендиль наберется сил, то покинет Лилэтан сквозь врата Паутины. Не спрашивай, куда уведет его Путь — он идет собственной дорогой судьбы, и пусть так и будет.
- guid: 2c2de453-2ff1-42d7-ab48-47944adcf89e
  event: Companions_Ranger_59
  text: '"Если ты так беспокоишься о моем мире, элантах, почему {d|Encyclopedia:YrlietQ1_ManagedHerself}не отправил{mf|ся|ась} искать ответы со мной{/d}?" {n}Глаза {g|Encyclopedia:Aeldari}эльдарки{/g} вспыхивают недобрым огнем, а бледные губы вытягиваются в тонкую линию.{/n} "Я нашла Эклендиля умирающим в тисках очередного орудия пыток, и он раскрыл мне печальную судьбу нашего мира".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Если ты так беспокоишься о моем мире, элантах, почему {d|Encyclopedia:YrlietQ1_ManagedHerself}не отправился искать ответы со мной{/d}?
  - speaker: narrator
    text_clean: Глаза эльдарки вспыхивают недобрым огнем, а бледные губы вытягиваются в тонкую линию.
  - speaker: Yrliet Lanaeviss
    text_clean: Я нашла Эклендиля умирающим в тисках очередного орудия пыток, и он раскрыл мне печальную судьбу нашего мира.
- guid: e329b27b-815c-4247-b74c-fa62971cd077
  event: Companions_Ranger_60
  text: '{n}Понимающий кивок служит коротким ответом.{/n} "Чтобы принять того, кто однажды предал доверие... Необходимо окунуться в омут со страхами. Пройти путями сомнений и укротить бушующий жар обиды. Под силу ли это нам? Что ж... Ты уже сделал{mf||а} первый шаг мне навстречу, элантах. И я отвечу вторым".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Понимающий кивок служит коротким ответом.
  - speaker: Yrliet Lanaeviss
    text_clean: Чтобы принять того, кто однажды предал доверие... Необходимо окунуться в омут со страхами. Пройти путями сомнений и укротить бушующий жар обиды. Под силу ли это нам? Что ж... Ты уже сделал первый шаг мне навстречу, элантах. И я отвечу вторым.
- guid: b793f8d6-eb0c-412c-906e-1ab72dc244c0
  event: Companions_Ranger_61
  text: '"И все же ни отдых, ни наше с тобой примирение не в силах заглушить смятение моей души. Крударах утерян, мы в западне, а истина по-прежнему сокрыта во тьме. Что стало с моими собратьями? Что стало с моим миром? И почему темный кузен рассказал меньше, чем знает". {n}Изумрудный взгляд темнеет, проникая, кажется, в глубины души.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И все же ни отдых, ни наше с тобой примирение не в силах заглушить смятение моей души. Крударах утерян, мы в западне, а истина по-прежнему сокрыта во тьме. Что стало с моими собратьями? Что стало с моим миром? И почему темный кузен рассказал меньше, чем знает.
  - speaker: narrator
    text_clean: Изумрудный взгляд темнеет, проникая, кажется, в глубины души.
- guid: 586f5491-e095-4934-a0b0-924a6ba46242
  event: Companions_Ranger_62
  text: '{n}Ирлиэт несколько мгновений взирает на вас молча.{/n} "Как смеешь ты говорить о Лилэтан, который ты обрекаешь на гибель {d|Encyclopedia:Ch2_JanusVistenzaAlive}своим бездействием{/d}? Правительница {g|Encyclopedia:MonKeigh}мон-кай{/g} еще жива... а значит, продолжает отравлять Мировой дух и служить проклятой {g|Encyclopedia:Sailanthresh}Сай''лантреш{/g}. Когда ты исполнишь то, что должно? Мы умеем ждать, но даже мое терпение подходит к концу".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт несколько мгновений взирает на вас молча.
  - speaker: Yrliet Lanaeviss
    text_clean: Как смеешь ты говорить о Лилэтан, который ты обрекаешь на гибель своим бездействием? Правительница мон-кай еще жива... а значит, продолжает отравлять Мировой дух и служить проклятой Сай'лантреш. Когда ты исполнишь то, что должно? Мы умеем ждать, но даже мое терпение подходит к концу.
- guid: fc511e85-7776-4ace-998b-bfe6f060f511
  event: Companions_Ranger_63
  text: '"После смерти души {g|Encyclopedia:Asuryani}Детей Азуриана{/g} перемещаются в камни, а те в свою очередь становятся частью Контура бесконечности на {g|Encyclopedia:Craftworld}мире-корабле{/g}, продолжая служить своему народу и после телесной жизни. И нет преступления страшнее, чем навредить путеводному камню и обречь бессмертную душу Дитя Азуриана на вечные муки в чреве Той, Что Жаждет".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: После смерти души Детей Азуриана перемещаются в камни, а те в свою очередь становятся частью Контура бесконечности на мире-корабле, продолжая служить своему народу и после телесной жизни. И нет преступления страшнее, чем навредить путеводному камню и обречь бессмертную душу Дитя Азуриана на вечные муки в чреве Той, Что Жаждет.
- guid: c78fa66f-7034-47b4-a1af-28b7b627c237
  event: Companions_Ranger_64
  text: '"Мы нуждаемся в путеводных камнях так же отчаянно, как тьма нуждается в свете звезд, а {g|Encyclopedia:MonKeigh}мон-кай{/g} — в глотке воздуха. И потому вынуждены скитаться по галактике в поисках старых миров, что подарили бы очередному миру-кораблю надежду на дальнейшее существование. Одно сердце мон-кай — одна ваша жизнь. Один путеводный камень — одна сохраненная душа Дитя Азуриана".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мы нуждаемся в путеводных камнях так же отчаянно, как тьма нуждается в свете звезд, а мон-кай — в глотке воздуха. И потому вынуждены скитаться по галактике в поисках старых миров, что подарили бы очередному миру-кораблю надежду на дальнейшее существование. Одно сердце мон-кай — одна ваша жизнь. Один путеводный камень — одна сохраненная душа Дитя Азуриана.
- guid: 735a507f-1c6b-4941-bb5a-52f98672c1ba
  event: Companions_Ranger_65
  text: '"Контур бесконечности не только защищает ушедших от взора {g|Encyclopedia:Sailanthresh}Той, Что Жаждет{/g}, но и позволяет их душам питать своими силами мир-корабль. Наставлять оставшихся, делиться знаниями... А в минуты великой нужды и возвращаться обратно, чтобы биться бок о бок с теми, кто остался..." {n}Ирлиэт осекается. Изумрудные глаза опасно блестят в свете люменов.{/n} "Это все, что тебе дозволено знать, элантах. Будь благодар{mf|ен|на} и не проси о большем".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Контур бесконечности не только защищает ушедших от взора Той, Что Жаждет, но и позволяет их душам питать своими силами мир-корабль. Наставлять оставшихся, делиться знаниями... А в минуты великой нужды и возвращаться обратно, чтобы биться бок о бок с теми, кто остался...
  - speaker: narrator
    text_clean: Ирлиэт осекается. Изумрудные глаза опасно блестят в свете люменов.
  - speaker: Yrliet Lanaeviss
    text_clean: Это все, что тебе дозволено знать, элантах. Будь благодарен и не проси о большем.
- guid: 3be2bdf4-426b-42c1-b742-eefa21dc6f14
  event: Companions_Ranger_66
  text: '"{g|Encyclopedia:Craftworld}Мир-корабль{/g} — это и крепость, и ковчег, и дом для миллионов эльдаров. На нем умещаются и врата {g|Encyclopedia:Webway}Паутины{/g}, соединяющие многочисленные миры собратьев. И армады машин Ваула, что сокрушают врагов извне. Все мы можем быть воинами, и гнев наш ужасен, если враг подбирается слишком близко. Но в мирное время каждый собрат идет своим Путем, оставаясь под защитой тех, кто ступает Путями Воинов и Провидцев".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Мир-корабль — это и крепость, и ковчег, и дом для миллионов эльдаров. На нем умещаются и врата Паутины, соединяющие многочисленные миры собратьев. И армады машин Ваула, что сокрушают врагов извне. Все мы можем быть воинами, и гнев наш ужасен, если враг подбирается слишком близко. Но в мирное время каждый собрат идет своим Путем, оставаясь под защитой тех, кто ступает Путями Воинов и Провидцев.
- guid: 45692d8a-f3b0-40fe-9362-839b4388325e
  event: Companions_Ranger_67
  text: '"Спрашиваешь — почему? Могла ли я верить {g|Encyclopedia:MonKeigh}мон-кай{/g}, элантах? После слов Муарана о том, что твой вид атаковал {g|Encyclopedia:Craftworld}Крударах{/g}? После того, как я узрела частицу Крудараха в твоих покоях?" {n}Взгляд Ирлиэт полнится болью.{/n} "Я видела, как сердца мон-кай полнятся ненавистью ко мне и моим собратьям. И как безразлич{mf|ен|на} к бедам моего народа ты. Что еще мне оставалось? Из двух горестей я выбрала ту, что ближе мне по родству крови".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Спрашиваешь — почему? Могла ли я верить мон-кай, элантах? После слов Муарана о том, что твой вид атаковал Крударах? После того, как я узрела частицу Крудараха в твоих покоях?
  - speaker: narrator
    text_clean: Взгляд Ирлиэт полнится болью.
  - speaker: Yrliet Lanaeviss
    text_clean: Я видела, как сердца мон-кай полнятся ненавистью ко мне и моим собратьям. И как безразличен к бедам моего народа ты. Что еще мне оставалось? Из двух горестей я выбрала ту, что ближе мне по родству крови.
- guid: d4a0d371-8d65-46bb-b611-d559c7d7f1f1
  event: Companions_Ranger_68
  text: '"И потому в день, когда мой темный кузен атаковал Даргонус, я попыталась его найти. В суматохе ускользнула от чужого внимания, блуждала средь улиц города, словно тень, преследующая хозяина. Напрасно. Я вернулась во дворец в смятении. Выжидала, пока свежие раны утихнут, а бдительность окружающих мон-кай растает, словно туман по утру. Но я все еще сомневалась — быть может, мне стоило поговорить с тобой открыто?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И потому в день, когда мой темный кузен атаковал Даргонус, я попыталась его найти. В суматохе ускользнула от чужого внимания, блуждала средь улиц города, словно тень, преследующая хозяина. Напрасно. Я вернулась во дворец в смятении. Выжидала, пока свежие раны утихнут, а бдительность окружающих мон-кай растает, словно туман по утру. Но я все еще сомневалась — быть может, мне стоило поговорить с тобой открыто?
- guid: 0558f809-7721-4da7-87c7-20bc3d58b3d5
  event: Companions_Ranger_69
  text: '"Едва ли мои слова утешат тебя, элантах, но я убила предателя. Боюсь, Темные оставили слишком много шрамов в его хрупкой душе. Твой преданный мон-кай сломался... И я даровала ему быструю смерть. Вне позора предательства".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Едва ли мои слова утешат тебя, элантах, но я убила предателя. Боюсь, Темные оставили слишком много шрамов в его хрупкой душе. Твой преданный мон-кай сломался... И я даровала ему быструю смерть. Вне позора предательства.
