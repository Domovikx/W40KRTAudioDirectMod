  parts:
  - speaker: narrator
    text_clean: Эльдарка собирается с духом и вытягивается, словно струна хрупкой изысканной лиры. Ее рука все еще по привычке тянется к расколотому камню душ.
  - speaker: Yrliet Lanaeviss
    text_clean: Поначалу я думала, что встреча с тобой принесет моей душе лишь боль и проклятие...
- guid: 8c509ba5-8cb4-4fe3-a18c-86e4ec28a83f
  event: RMNC_Yrliet_OnePathForBoth_07
  text: '"Думаешь — зачем я вообще тебе все это говорю? Наверное, переняла привычку людей болтать без умолку". {n}Ирлиэт негромко усмехается, но взгляд ее вдруг становится серьезным и проницательным.{/n} "Я здесь, чтобы сказать тебе, {name}... Я ни о чем не жалею. Ни о встрече с тобой, ни о том, что случилось с моим камнем душ. О том, насколько богаче и ярче стала моя душа рядом с тобой, известно лишь звездам".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Думаешь — зачем я вообще тебе все это говорю? Наверное, переняла привычку людей болтать без умолку.
  - speaker: narrator
    text_clean: Ирлиэт негромко усмехается, но взгляд ее вдруг становится серьезным и проницательным.
  - speaker: Yrliet Lanaeviss
    text_clean: Я здесь, чтобы сказать тебе, КЭП... Я ни о чем не жалею. Ни о встрече с тобой, ни о том, что случилось с моим камнем душ. О том, насколько богаче и ярче стала моя душа рядом с тобой, известно лишь звездам.
- guid: 40110c1c-0a28-4fac-9113-b13eb99f0336
  event: RMNC_Yrliet_OnePathForBoth_08
  text: '"Я давно уже научилась различать саркастичные нотки в говоре людей, {name}. Но ты прав{mf||а} — выбора у тебя действительно нет".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я давно уже научилась различать саркастичные нотки в говоре людей, КЭП. Но ты прав — выбора у тебя действительно нет.
- guid: 5799ef7b-1ad4-4565-b58e-7ef8610ab76b
  event: RMNC_Yrliet_OnePathForBoth_09
  text: '{n}Ирлиэт тихонько смеется.{/n} "Пожалуй. Все потому, что я осознала нечто действительно важное — души моих предков с Алайтока случайно разбили мой камень. Они не желали зла — лишь оберегали дитя, что пережило множество тягот на пути Изгоя. И они... действительно помогли мне, {name}. Я снова могу погружаться в свой мир и медитировать!"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт тихонько смеется.
  - speaker: Yrliet Lanaeviss
    text_clean: Пожалуй. Все потому, что я осознала нечто действительно важное — души моих предков с Алайтока случайно разбили мой камень. Они не желали зла — лишь оберегали дитя, что пережило множество тягот на пути Изгоя. И они... действительно помогли мне, КЭП. Я снова могу погружаться в свой мир и медитировать!
- guid: 443067ce-4b56-488e-8052-8a1d5c7a1891
  event: RMNC_Yrliet_OnePathForBoth_10
  text: '"Ты меня отвергаешь? Сейчас?" {n}Ирлиэт замирает, и странное выражение вырисовывается на ее тонком лице.{/n} "Что ж. Похоже, я все еще слишком плохо понимаю людей. Но я уважаю твои желания, как и ты все это время старал{mf|ся|ась} уважать мои".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Ты меня отвергаешь? Сейчас?
  - speaker: narrator
    text_clean: Ирлиэт замирает, и странное выражение вырисовывается на ее тонком лице.
  - speaker: Yrliet Lanaeviss
    text_clean: Что ж. Похоже, я все еще слишком плохо понимаю людей. Но я уважаю твои желания, как и ты все это время старался уважать мои.
- guid: 850f32b0-4325-4839-992f-46526f30245e
  event: RMNC_Yrliet_OnePathForBoth_11
  text: '{n}Ирлиэт тепло улыбается и подзывает вас ближе обычного — но все еще не касается кожи.{/n} "Тогда закрывай глаза, {name}. И слушай мой голос..."'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт тепло улыбается и подзывает вас ближе обычного — но все еще не касается кожи.
  - speaker: Yrliet Lanaeviss
    text_clean: Тогда закрывай глаза, КЭП. И слушай мой голос...
- guid: 71fc69f8-0ed1-43e9-97d3-8efe8d56957b
  event: RMNC_Yrliet_OnePathForBoth_12
  text: '{n}Вы закрываете глаза и погружаетесь в бесконечность... А когда снова открываете их — дивная дорога без конца и края предстает перед вашим взором.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Вы закрываете глаза и погружаетесь в бесконечность... А когда снова открываете их — дивная дорога без конца и края предстает перед вашим взором.
- guid: 2ba9fd4a-5c57-454c-b1a3-63b6e593e7f4
  event: RMNC_Yrliet_OnePathForBoth_13
  text: '{n}Ирлиэт понимающе кивает и протягивает вам руку.{/n} "Тогда я бы хотела вновь увидеть сияние твоего мира, {name}. Человеческие эмоции... иные. Словно далекие звезды. И столь же завораживающие".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт понимающе кивает и протягивает вам руку.
  - speaker: Yrliet Lanaeviss
    text_clean: Тогда я бы хотела вновь увидеть сияние твоего мира, КЭП. Человеческие эмоции... иные. Словно далекие звезды. И столь же завораживающие.
- guid: 5628022c-3f27-4f05-9309-82af185cca66
  event: RMNC_Yrliet_OnePathForBoth_14
  text: '{n}Смех Ирлиэт мягок и нежен, словно все тяготы ее судьбы растаяли в лучах местного светила.{/n} "Я боялась, что мой мир зачахнет. Превратится в пустыню или порастет сорной травой... Но он изменился. Кажется, в лучшую сторону".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Смех Ирлиэт мягок и нежен, словно все тяготы ее судьбы растаяли в лучах местного светила.
  - speaker: Yrliet Lanaeviss
    text_clean: Я боялась, что мой мир зачахнет. Превратится в пустыню или порастет сорной травой... Но он изменился. Кажется, в лучшую сторону.
- guid: 0017dd2f-987b-4d96-9096-b17111ab8c8a
  event: RMNC_Yrliet_OnePathForBoth_15
  text: '{n}Ирлиэт устремляет свой взор вперед — туда, где не видно ни края пути, ни его предела. А затем обращает его к вам — теплый, пронизанный восторгом и благодарностью. Она протягивает вам руку и тихо, едва слышно произносит.{/n} "Нам пора, {name}".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт устремляет свой взор вперед — туда, где не видно ни края пути, ни его предела. А затем обращает его к вам — теплый, пронизанный восторгом и благодарностью. Она протягивает вам руку и тихо, едва слышно произносит.
  - speaker: Yrliet Lanaeviss
    text_clean: Нам пора, КЭП.
- guid: 6e8c086a-3bf4-4392-a3bd-869830700dc3
  event: RMNC_Yrliet_OnePathForBoth_16
  text: '"Теперь ты видел{mf||а}, что у меня на душе. И знаешь мои истинные мысли и желания. Что же ты ответишь на них, {name}? Позволишь пройти с тобой путь длиною в жизнь?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Теперь ты видел, что у меня на душе. И знаешь мои истинные мысли и желания. Что же ты ответишь на них, КЭП? Позволишь пройти с тобой путь длиною в жизнь?
- guid: 690bb767-1f2b-483c-abd3-87aa5c2b562c
  event: RMNC_Yrliet_OnePathForBoth_17
  text: '{n}Ирлиэт улыбается вам.{/n} "Твой ответ греет мою душу подобно лучам восходящей звезды, {name}. Впредь, если ты захочешь снова попрактиковаться в медитации — зови меня в любое время".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт улыбается вам.
  - speaker: Yrliet Lanaeviss
    text_clean: Твой ответ греет мою душу подобно лучам восходящей звезды, КЭП. Впредь, если ты захочешь снова попрактиковаться в медитации — зови меня в любое время.
- guid: b7d1b4fe-4418-445e-8597-bab42e9cda17
  event: RMNC_Yrliet_OnePathForBoth_18
  text: '"Но вскоре, познав тебя лучше, я поменяла свое мнение. Не о мон-к... не о твоем виде. Но о тебе, {name}. Все то, что произошло с Крударахом. Все то, что случилось с моими собратьями. И что осталось в Комморре... Все это я смогла пережить лишь благодаря тому, что Азуриан свел наши пути".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Но вскоре, познав тебя лучше, я поменяла свое мнение. Не о мон-к... не о твоем виде. Но о тебе, КЭП. Все то, что произошло с Крударахом. Все то, что случилось с моими собратьями. И что осталось в Комморре... Все это я смогла пережить лишь благодаря тому, что Азуриан свел наши пути.
- guid: a8e84de0-735d-48a7-bb48-e7ffec18b9be
  event: RMNC_Yrliet_OnePathForBoth_19
  text: '"Туда, куда укажет твоя душа, {name}. Это — мой Путь, но он идет бок о бок с твоим — а значит, тебе выбирать, куда направить свои стремления и чаяния".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Туда, куда укажет твоя душа, КЭП. Это — мой Путь, но он идет бок о бок с твоим — а значит, тебе выбирать, куда направить свои стремления и чаяния.
- guid: dbe830f6-7bdd-4667-b5bd-999056171f34
  event: RMNC_Yrliet_StartingEventYrliet_01
  text: '"Удели мне крупицу своего времени, элантах". {n}Ирлиэт возникает у трона беззвучно, на лице — маска усталости и гнева.{/n}'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Удели мне крупицу своего времени, элантах.
  - speaker: narrator
    text_clean: Ирлиэт возникает у трона беззвучно, на лице — маска усталости и гнева.
- guid: fe384829-df20-45cb-b4a8-7bb5587de3a0
  event: RMNC_Yrliet_StartingEventYrliet_02
  text: '"Нет. Таковыми вас делает ограниченность разума и простота души. А все остальное — лишь следствие этих пороков".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Нет. Таковыми вас делает ограниченность разума и простота души. А все остальное — лишь следствие этих пороков.
- guid: 838331de-814b-4b07-9869-167c53daf97b
  event: RMNC_Yrliet_StartingEventYrliet_03
  text: '"Видит Азуриан, мне нет дела до любопытных взглядов мон-кай — я свыклась с ними еще под сенью цветущих садов Лилэтан. Они осыпают меня проклятиями издалека, следят за мной, осеняют знамениями... Пускай. Что взять с примитивных существ, наделенных некрепким разумом?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Видит Азуриан, мне нет дела до любопытных взглядов мон-кай — я свыклась с ними еще под сенью цветущих садов Лилэтан. Они осыпают меня проклятиями издалека, следят за мной, осеняют знамениями... Пускай. Что взять с примитивных существ, наделенных некрепким разумом?
- guid: 925bbd7c-8fcb-4140-b951-818fd6870a89
  event: RMNC_Yrliet_StartingEventYrliet_04
  text: '{n}Тело Ирлиэт бьет мелкая дрожь — так сильно ее переполняют эмоции.{/n} "Попробуй представить, элантах, что тебя возжелал дикий зверь. Это... мерзко. Гадко. Противно настолько, что приводит в дрожь саму душу".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Тело Ирлиэт бьет мелкая дрожь — так сильно ее переполняют эмоции.
  - speaker: Yrliet Lanaeviss
    text_clean: Попробуй представить, элантах, что тебя возжелал дикий зверь. Это... мерзко. Гадко. Противно настолько, что приводит в дрожь саму душу.
- guid: 731c752a-879c-4074-9962-aff4d59b0dec
  event: RMNC_Yrliet_StartingEventYrliet_05
  text: '"Именно так я и поступлю, мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Именно так я и поступлю, мон-кай.
- guid: c3173ee9-a61f-4a0b-abc3-dbfa438e30f4
  event: RMNC_Yrliet_StartingEventYrliet_06
  text: '"Она уже мертва, элантах. Я не позволила подобному остаться без воздаяния и сама лишила ее жизни".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Она уже мертва, элантах. Я не позволила подобному остаться без воздаяния и сама лишила ее жизни.
- guid: 26e7900e-b36a-4b52-83d9-be8accb98fcc
  event: RMNC_Yrliet_StartingEventYrliet_07
  text: '"Я прошла Путем пробуждения, элантах. И научилась видеть то, что сокрыто. И слышать то, что не было сказано. Оказавшись на Лилэтан, я наблюдала достаточно за твоими сородичами, чтобы познать истинную сущность мон-кай. Не думаю, что ты расскажешь мне что-то новое". {n}Окинув мимолетным взглядом офицеров мостика, эльдарка устало вздыхает.{/n} "Впрочем, протестовать я не стану. На всем корабле лишь разговоры с тобой могут скрасить мое одиночество".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я прошла Путем пробуждения, элантах. И научилась видеть то, что сокрыто. И слышать то, что не было сказано. Оказавшись на Лилэтан, я наблюдала достаточно за твоими сородичами, чтобы познать истинную сущность мон-кай. Не думаю, что ты расскажешь мне что-то новое.
  - speaker: narrator
    text_clean: Окинув мимолетным взглядом офицеров мостика, эльдарка устало вздыхает.
  - speaker: Yrliet Lanaeviss
    text_clean: Впрочем, протестовать я не стану. На всем корабле лишь разговоры с тобой могут скрасить мое одиночество.
- guid: 835b3469-eab2-4e86-a3e9-8b5820726a49
  event: RMNC_Yrliet_StartingEventYrliet_08
  text: '"И так и должно быть. Ты можешь хотя бы отдаленно понять мои чувства, элантах... чего не скажешь о твоих примитивных сородичах".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: И так и должно быть. Ты можешь хотя бы отдаленно понять мои чувства, элантах... чего не скажешь о твоих примитивных сородичах.
- guid: a3dbee92-60f0-46b0-aa58-8963ef53b4d7
  event: RMNC_Yrliet_StartingEventYrliet_09
  text: '"Я дала шанс нашим совместным странствиям, элантах. Если твои помыслы на мой счет были... иными" {n}, — Ирлиэт морщится, -{/n} "Отвергни их".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я дала шанс нашим совместным странствиям, элантах. Если твои помыслы на мой счет были... иными
  - speaker: narrator
    text_clean: ', — Ирлиэт морщится, -'
  - speaker: Yrliet Lanaeviss
    text_clean: Отвергни их.
- guid: 538182fa-f0fb-4f32-a2a4-5de5770fc8c8
  event: RMNC_Yrliet_StartingEventYrliet_10
  text: '"Тогда держи своих слуг на поводке покороче, мон-кай".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Тогда держи своих слуг на поводке покороче, мон-кай.
- guid: 0b8ca0d4-804c-4cc7-8921-3ea5fc80b91a
  event: RMNC_Yrliet_StartingEventYrliet_11
  text: '"Я здесь, стою пред тобой, именно для того, чтобы этого не повторилось впредь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я здесь, стою пред тобой, именно для того, чтобы этого не повторилось впредь.
- guid: 5650c0ca-20f5-4fae-ac72-83c93facb629
  event: RMNC_Yrliet_StartingEventYrliet_12
  text: '{n}Ирлиэт медленно кивает.{/n} "Обычно мон-кай злятся, когда кто-то портит их собственность. Я рада, что мы пришли к пониманию".'
  speaker: Yrliet Lanaeviss
  parts:
