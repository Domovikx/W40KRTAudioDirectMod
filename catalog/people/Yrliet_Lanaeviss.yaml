    text_clean: Ирлиэт качает головой.
  - speaker: Yrliet Lanaeviss
    text_clean: Мысли мон-кай столь юрки и непостоянны, что смущают и путают даже своих хозяев. Поразительно.
- guid: 6384812e-8237-4320-b025-3dc9a8f91f28
  event: Companions_Ranger_05
  text: '"Боюсь, твой век слишком скоротечен, а память слаба, чтобы вместить все мои знания. Мой народ правил звездами, когда твой еще не имел имени. Но многое из наших песен и историй было утрачено, украдено у нас {g|Encyclopedia:Sailanthresh}Той, Что Жаждет{/g}. Я могу сказать тебе, что {g|Encyclopedia:Asuryani}Дети Азуриана{/g} жили, творили, перебирали звезды, как жемчужины на нитке — пока Сай''лантреш не погубила нашу великую империю в своих страшных объятьях".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Боюсь, твой век слишком скоротечен, а память слаба, чтобы вместить все мои знания. Мой народ правил звездами, когда твой еще не имел имени. Но многое из наших песен и историй было утрачено, украдено у нас Той, Что Жаждет. Я могу сказать тебе, что Дети Азуриана жили, творили, перебирали звезды, как жемчужины на нитке — пока Сай'лантреш не погубила нашу великую империю в своих страшных объятьях.
- guid: 64ed3673-66c9-49a0-a5e4-2c941b3d2d08
  event: Companions_Ranger_06
  text: '"Разные ветви {g|Encyclopedia:Aeldari}Эльдари{/g} избрали разные пути к спасению. Мои предки выбрали вечную дорогу сквозь звездную тьму — жизнь на {g|Encyclopedia:Craftworld}мирах-кораблях{/g} вместо настоящих миров. Мы спасли многие чудеса прежних дней... но далеко не все. Ты видел{mf||а} на Лилэтан — даже мы не всегда можем совладать с вратами, поставленными нашими древними". {n}Немного помолчав, Ирлиэт добавляет:{/n} "Это история Детей Азуриана. Есть ветви, избравшие иной путь, темный и страшный. Но о них я не хочу тебе рассказывать. Это наша темная грань, у твоих сородичей их тоже немало".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Разные ветви Эльдари избрали разные пути к спасению. Мои предки выбрали вечную дорогу сквозь звездную тьму — жизнь на мирах-кораблях вместо настоящих миров. Мы спасли многие чудеса прежних дней... но далеко не все. Ты видел на Лилэтан — даже мы не всегда можем совладать с вратами, поставленными нашими древними.
  - speaker: narrator
    text_clean: 'Немного помолчав, Ирлиэт добавляет:'
  - speaker: Yrliet Lanaeviss
    text_clean: Это история Детей Азуриана. Есть ветви, избравшие иной путь, темный и страшный. Но о них я не хочу тебе рассказывать. Это наша темная грань, у твоих сородичей их тоже немало.
- guid: 10ca113e-ba60-459d-96bd-5fa18cfe626a
  event: Companions_Ranger_07
  text: '"О чем ты желаешь говорить?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: О чем ты желаешь говорить?
- guid: a292a2b7-c6ca-46db-9a06-5e57c3968418
  event: Companions_Ranger_08
  text: '{n}Тень пробегает по лицу Ирлиэт.{/n} "Эта рана все еще кровоточит. Но ты можешь задать свои вопросы. Я отвечу как смогу".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Тень пробегает по лицу Ирлиэт.
  - speaker: Yrliet Lanaeviss
    text_clean: Эта рана все еще кровоточит. Но ты можешь задать свои вопросы. Я отвечу как смогу.
- guid: ae46e0a4-94cb-4e0f-be9f-76ddceed989b
  event: Companions_Ranger_09
  text: '"Я шла своим Путем", {n}— Ирлиэт произносит фразу почти нараспев, наполняя каждое слово сакральным смыслом.{/n} — "Знаешь ли ты, что такое Путь для {g|Encyclopedia:Asuryani}Детей Азуриана{/g}? Это больше, чем просто избранное — как вы это называете — ремесло. Путь — это то, как каждый из нас движется по лабиринту существования — внутри и снаружи, в душе и в жизни. Это не только дорога, но и крепость. Он защищает нас от {g|Encyclopedia:Sailanthresh}Той, Что Жаждет{/g} — сбейся с Пути, и угодишь в ее темные объятья".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я шла своим Путем,
  - speaker: narrator
    text_clean: — Ирлиэт произносит фразу почти нараспев, наполняя каждое слово сакральным смыслом.
  - speaker: Yrliet Lanaeviss
    text_clean: — "Знаешь ли ты, что такое Путь для Детей Азуриана? Это больше, чем просто избранное — как вы это называете — ремесло. Путь — это то, как каждый из нас движется по лабиринту существования — внутри и снаружи, в душе и в жизни. Это не только дорога, но и крепость. Он защищает нас от Той, Что Жаждет — сбейся с Пути, и угодишь в ее темные объятья".
- guid: 4547a28e-12d9-415b-bea1-1b6912fdeeb2
  event: Companions_Ranger_10
  text: '"Я словно в брюхе сталекрылой птицы — холодной и мертвой, но упрямо несущейся сквозь мрак. В ней нет жизни — ни ее света, ни ее красоты. Но... пусть твой корабль не достоин зваться даже подобием {g|Encyclopedia:Craftworld}мира-корабля{/g}, я чувствую странное удовлетворение. Мы, {g|Encyclopedia:Asuryani}Дети Азуриана{/g}, рождаемся и живем на мирах-кораблях. Снова оказаться на движущемся мире, пусть даже таком, как твой, — для меня великая радость".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Я словно в брюхе сталекрылой птицы — холодной и мертвой, но упрямо несущейся сквозь мрак. В ней нет жизни — ни ее света, ни ее красоты. Но... пусть твой корабль не достоин зваться даже подобием мира-корабля, я чувствую странное удовлетворение. Мы, Дети Азуриана, рождаемся и живем на мирах-кораблях. Снова оказаться на движущемся мире, пусть даже таком, как твой, — для меня великая радость.
- guid: cf99383c-ee44-4d9a-9b51-bc3679f10334
  event: Companions_Ranger_100
  text: '{n}Некоторое время эльдарка задумчиво молчит.{/n} "Делиться переживаниями духа и разума, пытаться понять друг друга — действительно не тот путь, по котором нам суждено с тобой пройти. Ты все еще видишь во мне опасность и чуждость, элантах. И я не могу тебя в этом винить. Я... понимаю. И принимаю твой ответ".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Некоторое время эльдарка задумчиво молчит.
  - speaker: Yrliet Lanaeviss
    text_clean: Делиться переживаниями духа и разума, пытаться понять друг друга — действительно не тот путь, по котором нам суждено с тобой пройти. Ты все еще видишь во мне опасность и чуждость, элантах. И я не могу тебя в этом винить. Я... понимаю. И принимаю твой ответ.
- guid: a0053b70-1e56-41d2-ac5c-36cd3f3adb20
  event: Companions_Ranger_101
  text: '"С удовольствием, {name}. Непознанные глубины чьего мира мы посетим на сей раз?"'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: С удовольствием, КЭП. Непознанные глубины чьего мира мы посетим на сей раз?
- guid: 0f497d97-ebf7-451c-b203-786b4471eb74
  event: Companions_Ranger_102
  text: '"Вместе делить тишину, исследуя новые глубины твоего мира? Я согласна, {name}. Ибо моя душа также жаждет познаний и отдыха".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Вместе делить тишину, исследуя новые глубины твоего мира? Я согласна, КЭП. Ибо моя душа также жаждет познаний и отдыха.
- guid: 9c80c3c4-406d-4c5e-b621-b487fb2b7aa0
  event: Companions_Ranger_103
  text: '{n}Легкая улыбка касается тонких губ.{/n} "Я разгадала тебя, {name}. Знала, что ты это скажешь".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Легкая улыбка касается тонких губ.
  - speaker: Yrliet Lanaeviss
