    text_clean: Ирлиэт взирает на вас сверху вниз.
  - speaker: Yrliet Lanaeviss
    text_clean: Это твое истинное желание, элантах?
- guid: 5e711cfd-b89f-460b-bcd8-ca9f2dc96d98
  event: Companions_Ranger_74
  text: '"У Изгоев, с кем меня свел Путь, была поговорка, я попробую перевести ее для тебя. "Летя со скалы, хватайся за побеги и не спрашивай, сорняк их выпустил или благородный розовый куст". {n}На лице Ирлиэт мелькает странное выражение, похожее на ухмылку. Затем она добавляет серьезнее:{/n} "Ты — побег, за который я ухватилась, элантах. Потому что лечу со скалы. Мой родной мир исчез, сородичи мертвы или скрываются неизвестно где. Объединившись с тобой, мне, быть может, удастся взрастить побег желанной истины".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
