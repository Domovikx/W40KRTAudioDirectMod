  event: Companions_Ranger_71
  text: '{n}Ирлиэт обрывает вас резким жестом.{/n} "Я не желаю говорить о подобном с {g|Encyclopedia:MonKeigh}мон-кай{/g}. Мы — лишь попутчики, временно ступающие по одному звездному пути. Не пытайся залезть мне под кожу, все равно ничего не выйдет".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Ирлиэт обрывает вас резким жестом.
  - speaker: Yrliet Lanaeviss
    text_clean: Я не желаю говорить о подобном с мон-кай. Мы — лишь попутчики, временно ступающие по одному звездному пути. Не пытайся залезть мне под кожу, все равно ничего не выйдет.
- guid: 51fadda6-1ab7-4b13-bd73-618077d1b4ea
  event: Companions_Ranger_72
  text: '"Наши корабли никогда не прокладывают курс за вуалью. И я... я никогда не путешествовала так, как это делаете вы, {g|Encyclopedia:MonKeigh}мон-кай{/g}. Признаюсь, элантах, для меня это было... внове". {n}В голос Ирлиэт прокрадываются виноватые нотки.{/n} "Я утратила спокойствие духа, позволила смятению проникнуть в сердце и почти отступилась с Пути. Моя секундная ошибка привлекла внимание Той, Что Жаждет, и я призвала все свои силы и познания, дабы в медитации достичь баланса и укрыть свою душу за нерушимой стеной выдержки. Будущие путешествия за вуалью будут все еще сложны для меня... но я скреплю сердце и не дам гончим Сай''лантреш вновь взять мой след".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: Yrliet Lanaeviss
    text_clean: Наши корабли никогда не прокладывают курс за вуалью. И я... я никогда не путешествовала так, как это делаете вы, мон-кай. Признаюсь, элантах, для меня это было... внове.
