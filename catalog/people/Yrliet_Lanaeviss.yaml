    text_clean: 'Элантах, пойми меня: мон-кай привлекательными я не нахожу. Одна мысль о телесной близости с твоими сородичами...'
  - speaker: narrator
    text_clean: Ирлиэт громко выдыхает, стараясь сохранить внутренее спокойствие.
- guid: 401b39c9-a75c-4c29-a39c-0c19cdf468f4
  event: RMNC_Yrliet_StartingEventYrliet_14
  text: '{n}После недолгих раздумий она коротко кивает:{/n} "Чтобы облечь всю истину этого мира в скупой язык, привычный твоему слуху, мне понадобится время. Позже я сама приду к тебе с ответом".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: 'После недолгих раздумий она коротко кивает:'
  - speaker: Yrliet Lanaeviss
    text_clean: Чтобы облечь всю истину этого мира в скупой язык, привычный твоему слуху, мне понадобится время. Позже я сама приду к тебе с ответом.
- guid: df781859-57aa-412f-baa7-8ff2d5700d1a
  event: RMNC_Yrliet_StartingEventYrliet_15
  text: '{n}Тонкие пальцы складываются в странном жесте, словно эльдарка расплетает невидимую нить.{/n} "Наш разговор лишь подтверждает мои слова, элантах: мон-кай и дети Азуриана отличны друг от друга как ночь и день. Эльдары не просто видят мир иначе — мы видим больше, чем любой мон-кай способен осознать".'
  speaker: Yrliet Lanaeviss
  parts:
  - speaker: narrator
    text_clean: Тонкие пальцы складываются в странном жесте, словно эльдарка расплетает невидимую нить.
  - speaker: Yrliet Lanaeviss
    text_clean: 'Наш разговор лишь подтверждает мои слова, элантах: мон-кай и дети Азуриана отличны друг от друга как ночь и день. Эльдары не просто видят мир иначе — мы видим больше, чем любой мон-кай способен осознать.'
