  event: Companions_Ranger_92
  text: '{n}Вам кажется, что на строгом лице эльдарки проскальзывает тень улыбки.{/n} "Почти сразу, как принял{mf||а} решение составить мне компанию. Не беспокойся, твое громкое дыхание не потревожило моего погружения".'
