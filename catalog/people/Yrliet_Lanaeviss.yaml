  text: '{n}Ирлиэт прикрывает глаза, предаваясь воспоминаниям, но все еще продолжает наблюдать за вами.{/n} "Должна заметить, элантах, во время медитации разум не покидает тела — и часть его остается бдеть и следить за происходящим вовне. Так что я слышала каждое твое слово. И видела все, что ты делаешь".'
