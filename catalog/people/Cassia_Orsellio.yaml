  event: Companions_Navigator_154
  text: '"Вы не впервые мне об этом говорите. Будь то жестокая шутка или сомнения вашей души, в этот раз я не стану спасать то, что от нас осталось". {n}Кассия отворачивается, и тоска тяжелым камнем обрушивается на ваши плечи.{/n} "Уходите. Я не желаю видеть вас прямо сейчас. Может, позже мы снова поговорим".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы не впервые мне об этом говорите. Будь то жестокая шутка или сомнения вашей души, в этот раз я не стану спасать то, что от нас осталось.
