  event: RMNC_Cassia_StartingEventCassia_05
  text: '"Или же им претит мое присутствие". {n}Сохраняя учтиво-отчужденное выражение, Кассия коротко кивает.{/n} "В таком случае я тоже должна откланяться — проверить Санктум Навис после ритуала единения и подготовить палаты к предстоящему варп-прыжку. Благодарю за компанию, {name}".'
