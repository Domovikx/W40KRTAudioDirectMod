- guid: 90e2bfa7-213d-40cb-a610-51d48cff9559
  event: ''
  text: '"Еще я хотела сказать, что прочитала множество книг. И что мои познания не ограничиваются одним лишь искусством навигирования, мне близко и множество других учений. История Империума, например, или..." {n}Кассия неловко пожимает плечами.{/n} "Навигаторы с детства привычны иметь дело с варпом. Если вам вдруг понадобится помощь... в смысле консультация или совет... Я многое знаю, так что можете смело ко мне обращаться". {n}Леди-Навигатор нервно теребит прядь белоснежных волос, продолжая одновременно горделиво держать подбородок и избегать вашего взгляда.{/n}'
