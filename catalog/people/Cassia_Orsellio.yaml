  event: Companions_Navigator_140
  text: '"Одна из граней имморталиума есть предложение дружбы. Если ваш друг намерен принять лишь ее, по традиции он должен обозначить это в личной беседе с дарителем".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Одна из граней имморталиума есть предложение дружбы. Если ваш друг намерен принять лишь ее, по традиции он должен обозначить это в личной беседе с дарителем.
- guid: 8cc9b075-e946-4e7b-b526-2b269a616dbb
  event: Companions_Navigator_141
  text: '"В таком случае традиции велят ему сохранить дар в знак уважения к акту инициации ритуала. В остальном же ваш друг должен игнорировать произошедшее. Порой бездействие... красноречивее любого отказа".'
  speaker: Cassia Orsellio
