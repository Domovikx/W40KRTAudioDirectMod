  event: ''
  text: '{n}Кассия неуверенно хмурит брови.{/n} "Раз вы так говорите... я прислушаюсь к вашим словам".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия неуверенно хмурит брови.
  - speaker: Cassia Orsellio
    text_clean: Раз вы так говорите... я прислушаюсь к вашим словам.
- guid: 0e2b3e9e-e2b1-421c-84bf-b43285288477
  event: ''
  text: '"Словно... бездонное синее море..." {n}Кассия ошарашенно озирается по сторонам, переводя взгляд с одного ксеноса на другого.{/n} "Я... не думала, что кто-то вообще способен источать столь глубокий цвет. Хотела бы я его перекрасить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Словно... бездонное синее море...
  - speaker: narrator
    text_clean: Кассия ошарашенно озирается по сторонам, переводя взгляд с одного ксеноса на другого.
  - speaker: Cassia Orsellio
    text_clean: Я... не думала, что кто-то вообще способен источать столь глубокий цвет. Хотела бы я его перекрасить.
