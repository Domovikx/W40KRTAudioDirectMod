  event: Companions_Navigator_23
  text: '{n}Кассия касается нагрудника в области Атласа.{/n} "{d|Encyclopedia:CassiaQ2_HarlequinsClearSoulstone}Ксеносам удалось освободить наших предков{/d} из заточения в Камне Душ. Память и мудрость тех, кто был до нас, послужат Дому, позволив возвести на руинах настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный свет Императора".'
  speaker: Cassia Orsellio
