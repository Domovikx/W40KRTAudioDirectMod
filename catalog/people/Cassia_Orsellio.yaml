  event: Companions_Navigator_74
  text: '"{name}?" {n}Тонкая фигура Кассии на мгновение напрягается, в глазах проскальзывает незнакомое выражение.{/n} "Позвольте отблагодарить династию фон Валанциус за помощь, которой удостоился Дом Орселлио. И лично вас. Незаменимые жизненные уроки, что я получила во время совместных странствий, позволили мне стать той, кем мне суждено было стать".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: КЭП?
  - speaker: narrator
    text_clean: Тонкая фигура Кассии на мгновение напрягается, в глазах проскальзывает незнакомое выражение.
  - speaker: Cassia Orsellio
    text_clean: Позвольте отблагодарить династию фон Валанциус за помощь, которой удостоился Дом Орселлио. И лично вас. Незаменимые жизненные уроки, что я получила во время совместных странствий, позволили мне стать той, кем мне суждено было стать.
