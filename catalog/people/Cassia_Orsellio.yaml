  text: '{n}Навигатор приходит в движение: чуть подняв голову, он приоткрывает обычные глаза. Его третье око плотно сомкнуто — лишь блестящая черная капля выкатывается из-под век, оставляя на лице угольную дорожку.{/n} "У вас... мало времени..." {n}Голос доносится из {g|Encyclopedia:Vox}вокс{/g}-решетки в основании причудливого кресла. Вы так и не понимаете, как Навигатор воспроизводит человеческую речь.{/n}'
