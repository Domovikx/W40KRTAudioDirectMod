  parts:
  - speaker: narrator
    text_clean: Леди-Навигатор увлеченно изучает пыльные книги, которые другие офицеры — по лености ли или скудности ума — обделяют вниманием. Лишь когда вы подходите ближе, Кассия поднимает глаза, вздрагивает и прячет за спиной потрепанный томик.
  - speaker: Cassia Orsellio
    text_clean: Лорд-капитан? Простите, я... не заметила, как вы вошли.
- guid: 5ac6e843-1c21-4e97-9c34-4f4f93d1d1ca
  event: RMNC_Cassia_StartingEventCassia_04
  text: '"Не знала, что имперскому навигатору требуется разрешение на подобное. Впредь постараюсь следовать самобытным правилам вашего корабля более... внимательно". {n}Кассия отводит укоризненный взгляд, но продолжает держать подбородок высоко и с достоинством.{/n} "Не смею более смущать вас своим присутствием".'
  speaker: Cassia Orsellio
