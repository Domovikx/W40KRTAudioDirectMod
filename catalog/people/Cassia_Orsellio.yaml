  text: '{n}Взгляд Кассии мрачнеет, и вас почему-то бросает в дрожь.{/n} "Мой долг перед Домом — передать навигаторский ген Орселлио своим потомкам. Я выйду замуж... за навигатора другого рода. И заведу детей. Продолжу династию... А когда варп извратит мое тело окончательно, Кассия Орселлио исчезнет из этого мира, оставив после себя лишь имя да трон Новатора. В этом случае... разве есть у нас с вами будущее?"'
