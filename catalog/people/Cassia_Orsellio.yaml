- guid: 058ce8b2-61ac-400a-b075-2b3024aa04b9
  event: RMNC_Cassia_StartingEventCassia_08
  text: '"По сравнению с Эурак-V ваш корабль — бескрайний мир, наполненный незнакомыми мне красками. Однако обилие пестрых оттенков порой утомляет взор — на мостике и палубах так... шумно. В поисках спокойного места мне посчастливилось наткнуться на сей островок безмятежности, заполненный редкими книгами и почти лишенный цветов".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: По сравнению с Эурак-V ваш корабль — бескрайний мир, наполненный незнакомыми мне красками. Однако обилие пестрых оттенков порой утомляет взор — на мостике и палубах так... шумно. В поисках спокойного места мне посчастливилось наткнуться на сей островок безмятежности, заполненный редкими книгами и почти лишенный цветов.
