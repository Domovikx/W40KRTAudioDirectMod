  event: Companions_Navigator_76
  text: '"Не думаю, что к нам присоединится действующий Великий Регент. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и моя семья едва ли станет рисковать". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n} "Я передам приглашение Навис Маджорис, нашим лучшим навигаторам. Быть может, Регент отправит в экспедицию кого-то из них".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не думаю, что к нам присоединится действующий Великий Регент. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и моя семья едва ли станет рисковать.
