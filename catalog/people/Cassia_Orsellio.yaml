    text_clean: Кассия молча кивает навигатору и подзывает к себе.
  - speaker: Cassia Orsellio
    text_clean: Нас осталось двое, а потому сосредоточься. Загляни в себя. Услышь зов предков сквозь Атлас, как слышу его я. Взгляни моими глазами на то, что я видела. Одолжи мне свою силу, и вместе... вместе мы поможем Дому Орселлио.
- guid: fff1cc07-ec00-494b-ba26-55f0ee5cb43e
  event: ''
  text: '"Мне... неловко просить о подобном. Но в прошлый раз я приметила занятную книгу на полках вашей личной библиотеки. Увесистый томик в потертом золоченом переплете с символом Адептус Министорум... "Житие святой Вистерии", кажется". {n}Кассия взмахивает рукой в сторону полок, и атласный платок выскальзывает из ее пальцев.{/n} "Ох..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Мне... неловко просить о подобном. Но в прошлый раз я приметила занятную книгу на полках вашей личной библиотеки. Увесистый томик в потертом золоченом переплете с символом Адептус Министорум... "Житие святой Вистерии", кажется.
  - speaker: narrator
    text_clean: Кассия взмахивает рукой в сторону полок, и атласный платок выскальзывает из ее пальцев.
  - speaker: Cassia Orsellio
    text_clean: Ох...
- guid: 548fb8da-9cdc-4efe-80fe-13530175e1d0
  event: BNTRS_AreaPeaceful_Cassia_2
  text: '"Цвета этого места полнятся вспышками боли — ярко-алыми, багрово-черными, предсмертно-серыми... калейдоскоп отчаяния и безумия..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Цвета этого места полнятся вспышками боли — ярко-алыми, багрово-черными, предсмертно-серыми... калейдоскоп отчаяния и безумия...
- guid: 25594892-aefb-4e33-b4df-e580fca3763c
  event: BNTRS_AreaPeaceful_Cassia_7
  text: '"Темно-зеленое, мрачное и душное заполнило все вокруг густым туманом... Те, кто здесь, вымотаны, истощены, растеряны".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Темно-зеленое, мрачное и душное заполнило все вокруг густым туманом... Те, кто здесь, вымотаны, истощены, растеряны.
- guid: 91325592-fa75-45f4-b73f-fdba54572720
  event: BNTRS_AreaStressful_Cassia_115
  text: '"Я... тоже чувствую, как что-то приближается. Но не вижу цветов. Весь мир поблек, как только мы ступили на эту палубу".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... тоже чувствую, как что-то приближается. Но не вижу цветов. Весь мир поблек, как только мы ступили на эту палубу.
- guid: e5d3bb8f-6239-4722-a83a-8a2c61798cf1
  event: BNTRS_AreaStressful_Cassia_134
  text: '"Я... я готова, Арджента. Пока тут ты и Лорд-капитан — я готова на многое".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... я готова, Арджента. Пока тут ты и Лорд-капитан — я готова на многое.
- guid: 1aedaeea-9f8a-4dfd-bf27-5b37c9c8760b
  event: BNTRS_AreaStressful_Cassia_144
  text: '"Я уверена, что судно для столь важной персоны, как Лорд-капитан, дожидается нас на положенном месте. Разве чернь не должна знать свое место в очереди на спасение?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я уверена, что судно для столь важной персоны, как Лорд-капитан, дожидается нас на положенном месте. Разве чернь не должна знать свое место в очереди на спасение?
- guid: ccc5c772-f321-4255-9b1a-24109f62b936
  event: BNTRS_AreaStressful_Cassia_158
  text: '"Сколько праведных слуг Империума пали здесь от орудия, призванного служить им в борьбе с неверными? Сбиты в полете, без возможности защититься, исполнить свою миссию..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сколько праведных слуг Империума пали здесь от орудия, призванного служить им в борьбе с неверными? Сбиты в полете, без возможности защититься, исполнить свою миссию...
- guid: 672542f8-1b1c-46f6-88bd-6f7d5e5311a3
  event: BNTRS_AreaStressful_Cassia_16
  text: '"Дядя учил меня, что нужно во всем быть первым. Глядя на Вольного Торговца... теперь я в этом сомневаюсь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Дядя учил меня, что нужно во всем быть первым. Глядя на Вольного Торговца... теперь я в этом сомневаюсь.
- guid: ce55ae37-de72-4167-abbe-2447807a1599
  event: BNTRS_AreaStressful_Cassia_24
  text: '"Вы правы, сестра. Море Душ способно потопить даже самых умелых пустотников, ибо нет обманчивей ощущения, чем обузданный варп".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы правы, сестра. Море Душ способно потопить даже самых умелых пустотников, ибо нет обманчивей ощущения, чем обузданный варп.
- guid: de996b7f-392c-4ba6-b9fb-5c1fce177015
  event: BNTRS_AreaStressful_Cassia_3
  text: '"Давно я не видела столь умиротворенной картины — ни яркого всплеска, ни пестрых красок... Лишь чистое, белое полотно".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Давно я не видела столь умиротворенной картины — ни яркого всплеска, ни пестрых красок... Лишь чистое, белое полотно.
- guid: b42f8525-37eb-4eb0-8e23-a8ed13b048c5
  event: BNTRS_AreaStressful_Cassia_41
  text: '"Как здесь... пестро. В воздухе витают все оттенки, какие только можно вообразить!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как здесь... пестро. В воздухе витают все оттенки, какие только можно вообразить!
- guid: 5f7b4e88-2599-4d60-a19a-23941e273322
  event: BNTRS_AreaStressful_Cassia_54
  text: '"Твои слова окутаны едкой зеленой дымкой, но сквозь нее пробивается теплый желтый свет... Ты правда ему рада, да?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твои слова окутаны едкой зеленой дымкой, но сквозь нее пробивается теплый желтый свет... Ты правда ему рада, да?
- guid: 1865ed1c-6a88-4f63-8b10-097dfba616cc
  event: BNTRS_AreaStressful_Cassia_58
  text: '"Почему твои воспоминания об этом такие синие? И чем дальше — тем темнее и темнее..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Почему твои воспоминания об этом такие синие? И чем дальше — тем темнее и темнее...
- guid: 36c2cb53-ef8d-4a96-8617-b7d169599fa3
  event: BNTRS_AreaStressful_Cassia_65
  text: '"Твои чувства не обманывают тебя: я зрю оттенки падали и смерти в огненных всполохах мануфакторума. Этот огромный пласталевый зверь гниет заживо".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: 'Твои чувства не обманывают тебя: я зрю оттенки падали и смерти в огненных всполохах мануфакторума. Этот огромный пласталевый зверь гниет заживо.'
- guid: 14537744-b2a5-4d2c-b091-ca4426de5a0f
  event: BNTRS_AreaStressful_Cassia_71
  text: '"Я тоже это чувствую! Обычно машины источают едва различимые цвета... Прямо как ваше тело, магос. Но в этом месте... все оттенки смешались в грязь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я тоже это чувствую! Обычно машины источают едва различимые цвета... Прямо как ваше тело, магос. Но в этом месте... все оттенки смешались в грязь.
- guid: 1f211b26-8cea-461a-93c4-74d333e3bb0f
  event: BNTRS_AreaStressful_Cassia_76
  text: '"Ваш разум окутала сизая дымка, мастер ван Калокс. Тяжелый цвет... для тяжелых дум, полагаю?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваш разум окутала сизая дымка, мастер ван Калокс. Тяжелый цвет... для тяжелых дум, полагаю?
- guid: 9df039f4-a1fb-420a-818c-5c3aee706b10
  event: BNTRS_AreaStressful_Cassia_79
  text: '"Соглашусь с господином Версерианом. Это место напоминает технические отсеки Эурак-V — все цвета такие... грязные".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Соглашусь с господином Версерианом. Это место напоминает технические отсеки Эурак-V — все цвета такие... грязные.
- guid: 6df26699-a4cf-484c-be7d-9362c0fea681
  event: BNTRS_AreaStressful_Cassia_8
  text: '"Твои краски столь ярки, сестра Арджента. Ненависть, питающая твои слова и порывы, пылает заревом сверхновой!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твои краски столь ярки, сестра Арджента. Ненависть, питающая твои слова и порывы, пылает заревом сверхновой!
- guid: cc72d879-7998-4ca8-b5f6-890b17d6fabd
  event: BNTRS_AreaStressful_Cassia_89
  text: '"Я видела Райкади Филию лишь на расстоянии, когда мне удавалось попасть в обсерваторию. Как странно оказаться здесь самой!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я видела Райкади Филию лишь на расстоянии, когда мне удавалось попасть в обсерваторию. Как странно оказаться здесь самой!
- guid: 394d5050-809b-4f05-a695-de925bb168af
  event: BNTRS_AreaStressful_Cassia_90
  text: '"Столько зелени я не видела даже в нашем арборетуме... О, этот цветок! Я читала о нем в одном из трудов генетора Канассиана".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Столько зелени я не видела даже в нашем арборетуме... О, этот цветок! Я читала о нем в одном из трудов генетора Канассиана.
- guid: 371d1222-9afb-4d80-8966-2bdf20fbba14
  event: BNTRS_AreaStressful_Cassia_96
  text: '"Какое роскошное поместье! В архивах Дома я видела пикты наших старинных усадеб — это место очень на них похоже".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Какое роскошное поместье! В архивах Дома я видела пикты наших старинных усадеб — это место очень на них похоже.
- guid: 529b8a66-2c5a-4b3b-a82a-e67e4c2e8f96
  event: BNTRS_Chapter1_Cassia_05
  text: '"Твои речи сияют золотом и янтарем, сестра. Когда-нибудь я научусь веровать в правоту своих слов с той же силой, что и ты".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твои речи сияют золотом и янтарем, сестра. Когда-нибудь я научусь веровать в правоту своих слов с той же силой, что и ты.
- guid: 4b5a451c-010d-4ea3-9a9d-985f98958a1f
  event: BNTRS_Chapter1_Cassia_07
  text: '"Господин Винтерскейл так верил в своего друга, что добровольно ринулся навстречу опасности! Это... благородный поступок".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Господин Винтерскейл так верил в своего друга, что добровольно ринулся навстречу опасности! Это... благородный поступок.
- guid: f24ac15c-03ad-46b4-b909-05e08bc09ffb
  event: BNTRS_Chapter1_Cassia_16
  text: '"Если бы каждый был наделен даром зрить мир как я, подобное бы никогда не случилось. Но глаза обычных людей слепы к оттенкам, что скрываются в чужих душах".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Если бы каждый был наделен даром зрить мир как я, подобное бы никогда не случилось. Но глаза обычных людей слепы к оттенкам, что скрываются в чужих душах.
- guid: 26229c9b-3a23-4a20-98b9-f25fc5093ae5
  event: BNTRS_Chapter1_Cassia_18
  text: '"Я впервые за пределами станции... здесь столь... ярко? Вместо палитры — ужасная мазня цветов".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я впервые за пределами станции... здесь столь... ярко? Вместо палитры — ужасная мазня цветов.
- guid: 13a425ee-570a-49cf-af06-dcd24cbbf027
  event: BNTRS_Chapter1_Cassia_21
  text: '"Вам не кажется, что свита Вольного Торговца должна быть больше? Где почетная гвардия? Герольды и глашатаи?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вам не кажется, что свита Вольного Торговца должна быть больше? Где почетная гвардия? Герольды и глашатаи?
- guid: ef92356a-e1be-4764-91da-2ec8b15db479
  event: BNTRS_Chapter1_Cassia_25
  text: '"Я исполню долг, к которому меня готовили все эти годы. Пускай мое становление... и прошло при багровых тонах".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я исполню долг, к которому меня готовили все эти годы. Пускай мое становление... и прошло при багровых тонах.
- guid: 08ce1dd3-0726-4b69-ac9a-09473498e2e5
  event: BNTRS_Chapter1_Cassia_28
  text: '"Станцию можно воздвигнуть снова. Слуги... заменимы. И лишь моя жизнь — главное для тех, кто ждет моего возвращения... И тех, кто жаждет меня убить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Станцию можно воздвигнуть снова. Слуги... заменимы. И лишь моя жизнь — главное для тех, кто ждет моего возвращения... И тех, кто жаждет меня убить.
- guid: 5f21123b-6011-4607-a68b-d17ace412396
  event: BNTRS_Chapter1_Cassia_32
  text: '"Цвета... я никогда не видела таких цветов... Они меняются, перетекают друг в друга... Ах! Выжигают... сетчатку..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Цвета... я никогда не видела таких цветов... Они меняются, перетекают друг в друга... Ах! Выжигают... сетчатку...
- guid: 420f1e20-2fd4-4620-b727-6b5c1475d0b8
  event: BNTRS_Chapter1_Cassia_43
  text: '"Я... не против сопровождать Лорд-капитана. Познание внешнего мира — бесценный опыт, которого лишены те из нас, кто страшится покинуть стены Навис Санктум".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... не против сопровождать Лорд-капитана. Познание внешнего мира — бесценный опыт, которого лишены те из нас, кто страшится покинуть стены Навис Санктум.
- guid: 8d9ee5aa-8aab-4067-acd2-6170ba15c092
  event: BNTRS_Chapter1_Cassia_53
  text: '"С вашим появлением цвета вокруг полнятся сталью и всполохами алых лент, почтенный магос. На станции моего Дома тоже были техножрецы, но цвета их душ... всегда оставались угрюмы".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: С вашим появлением цвета вокруг полнятся сталью и всполохами алых лент, почтенный магос. На станции моего Дома тоже были техножрецы, но цвета их душ... всегда оставались угрюмы.
- guid: 6e9fc427-8167-48b1-9665-9069b123c478
  event: BNTRS_Chapter2_Cassia_01
  text: '"Вас окружают невыносимо тяжелые цвета, мастер ван Калокс... Словно их зачерпнули из глубокого забытого колодца. Это... из-за Черного корабля, так ведь?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вас окружают невыносимо тяжелые цвета, мастер ван Калокс... Словно их зачерпнули из глубокого забытого колодца. Это... из-за Черного корабля, так ведь?
- guid: 7875df7a-df75-4d3f-8a36-70ac823110c2
  event: BNTRS_Chapter2_Cassia_101
  text: '"Вы говорите о том, что происходило на Кьяве Гамма, почтенный магос? Я читала о подобном... Но читать и узреть собственными глазами — очень разные вещи".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы говорите о том, что происходило на Кьяве Гамма, почтенный магос? Я читала о подобном... Но читать и узреть собственными глазами — очень разные вещи.
- guid: 2e2448fd-eb89-4f6a-a128-82b832f9c53b
  event: BNTRS_Chapter2_Cassia_108
  text: '"Когда по кораблю блуждали слухи о появлении Теодоры фон Валанциус... Я видела множество всполохов желтого. Ваши люди надеялись, что это правда".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Когда по кораблю блуждали слухи о появлении Теодоры фон Валанциус... Я видела множество всполохов желтого. Ваши люди надеялись, что это правда.
- guid: 54e0ffb7-1995-4201-8ecb-d936369527ed
  event: BNTRS_Chapter2_Cassia_11
  text: '"Вся моя жизнь за секунды сгинула в кошмаре Имматериума. Это... не то, что возможно осознать и принять за столь короткое время".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вся моя жизнь за секунды сгинула в кошмаре Имматериума. Это... не то, что возможно осознать и принять за столь короткое время.
- guid: 6a2fe814-aff8-4d43-a99e-b0b014cb482d
  event: BNTRS_Chapter2_Cassia_115
  text: '"Может быть, в момент смерти она обрекла покой, которого была лишена при жизни. По крайней мере, мне хотелось бы в это верить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Может быть, в момент смерти она обрекла покой, которого была лишена при жизни. По крайней мере, мне хотелось бы в это верить.
- guid: 23cf8eda-d85a-4acb-aa5d-9b6a67f6907d
  event: BNTRS_Chapter2_Cassia_117
  text: '"С тех пор, как Идиры не стало, я вижу, как угасают цвета на палубах. Меньше оттенков, от которых болят глаза... Но и больше серого безразличия".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: С тех пор, как Идиры не стало, я вижу, как угасают цвета на палубах. Меньше оттенков, от которых болят глаза... Но и больше серого безразличия.
- guid: d1a271b4-9b2c-4237-b957-91e2866bb275
  event: BNTRS_Chapter2_Cassia_128
  text: '"Служители Адептус Администратум такие... блеклые. Словно сама жизнь во всей ее яркости и великолепии покинула их сердца".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Служители Адептус Администратум такие... блеклые. Словно сама жизнь во всей ее яркости и великолепии покинула их сердца.
- guid: e94bebba-3e55-4939-900b-628b035369dd
  event: BNTRS_Chapter2_Cassia_144
  text: '"Мастер ван Калокс, ваше молчание сочится темно-багровым. Вы можете скрыть свою ярость от иных взоров, но не моего".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Мастер ван Калокс, ваше молчание сочится темно-багровым. Вы можете скрыть свою ярость от иных взоров, но не моего.
- guid: 6377a535-3e5d-4e61-8621-81b867970129
  event: BNTRS_Chapter2_Cassia_17
  text: '"Но то, что случилось на улицах ульев... О, багрово-сизые шрамы еще нескоро сотрутся с душ тех, кто пережил сей кошмар".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Но то, что случилось на улицах ульев... О, багрово-сизые шрамы еще нескоро сотрутся с душ тех, кто пережил сей кошмар.
- guid: c5a4e747-9001-459a-b2f6-159f5a1a0448
  event: BNTRS_Chapter2_Cassia_24
  text: '"Навигатор Ханн — благородная душа. Страшно представить, какому испытанию подвергся его дух в том злополучном странствии... И все же он исполнил свой долг".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Навигатор Ханн — благородная душа. Страшно представить, какому испытанию подвергся его дух в том злополучном странствии... И все же он исполнил свой долг.
- guid: 9de5eaf0-f1a3-451f-9700-9567b57f3a90
  event: BNTRS_Chapter2_Cassia_31
  text: '"Величественное зрелище. Словно огромной кистью все цвета мира смазали с холста реальности".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Величественное зрелище. Словно огромной кистью все цвета мира смазали с холста реальности.
- guid: 2e5a05e7-c40f-4798-b044-c927dd949704
  event: BNTRS_Chapter2_Cassia_35
  text: '"Во мне тлела надежда, что Эурак-V еще можно спасти... Однако теперь мой дом потерян. Навсегда".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Во мне тлела надежда, что Эурак-V еще можно спасти... Однако теперь мой дом потерян. Навсегда.
- guid: ad97a2e4-202a-4b83-b681-e61048cc5215
  event: BNTRS_Chapter2_Cassia_48
  text: '"Печально, что прекрасный и изобильный Янус одолевали столь тяжкие беды. Сей мир... очень красив".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Печально, что прекрасный и изобильный Янус одолевали столь тяжкие беды. Сей мир... очень красив.
- guid: 6e60fcbb-51a3-44db-8a3b-bc6ccc2a8170
  event: BNTRS_Chapter2_Cassia_63
  text: '"Те существа, что обретались на "Йесевоне"... Никогда не слышала об подобных ксеносах. Их психическая тень в варпе... просто чудовищна".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Те существа, что обретались на "Йесевоне"... Никогда не слышала об подобных ксеносах. Их психическая тень в варпе... просто чудовищна.
- guid: 608d1271-5560-4dd6-ad31-1735cd7baa4f
  event: BNTRS_Chapter2_Cassia_74
  text: '"Эмоции, искаженные влиянием варпа, едки и омерзительны на вид. Архивраг нарочно извращает цвета, делает их невыносимыми... для тех, кто еще не погряз в скверне".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Эмоции, искаженные влиянием варпа, едки и омерзительны на вид. Архивраг нарочно извращает цвета, делает их невыносимыми... для тех, кто еще не погряз в скверне.
- guid: be7b60e8-d2bf-424c-8cba-76b004d2682d
  event: BNTRS_Chapter2_Cassia_79
  text: '"Твоя решимость сияет всеми оттенками золота, сестра! Такие пламенные слова и столь истовая вера в них... Что невозможно смотреть, не щурясь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твоя решимость сияет всеми оттенками золота, сестра! Такие пламенные слова и столь истовая вера в них... Что невозможно смотреть, не щурясь.
- guid: 7c26649b-a186-401a-979b-0a659bed5049
  event: BNTRS_Chapter2_Cassia_85
  text: '"Дом Орселлио... доставил излишние хлопоты Лорд-капитану. Продолжая служить на флагмане фон Валанциус, я искуплю сею досадную ошибку".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Дом Орселлио... доставил излишние хлопоты Лорд-капитану. Продолжая служить на флагмане фон Валанциус, я искуплю сею досадную ошибку.
- guid: d42726dd-e7ed-4ddd-95ca-c7309bf7103c
  event: BNTRS_Chapter2_Cassia_87
  text: '"Меня гнетут мысли о будущем Дома Орселлио. Ненависть и недоверие, копившиеся годами... вновь и вновь приводят к кровопролитию".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Меня гнетут мысли о будущем Дома Орселлио. Ненависть и недоверие, копившиеся годами... вновь и вновь приводят к кровопролитию.
- guid: aa629ba5-a26d-4dec-9a46-55ea9ea73e32
  event: BNTRS_Chapter3_Cassia_08
  text: '"Ваши искренние облегчение и радость — словно яркая картина в этом ужасном месте, отрада для моих очей. Я тоже... тоже счастлива видеть вас, Абеляр".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши искренние облегчение и радость — словно яркая картина в этом ужасном месте, отрада для моих очей. Я тоже... тоже счастлива видеть вас, Абеляр.
- guid: 0d7d1c85-5eba-466d-92c0-4a1aae5cee7a
  event: BNTRS_Chapter3_Cassia_103
  text: '"Вы прошли через многое, почтенный магос — и все же калейдоскоп ваших цветов ярок и пестр. Подобно разбитому витражу..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы прошли через многое, почтенный магос — и все же калейдоскоп ваших цветов ярок и пестр. Подобно разбитому витражу...
- guid: cf7ca10d-a1f3-4074-b10e-ec1d72d89500
  event: BNTRS_Chapter3_Cassia_108
  text: '"Раз мы убили воинов, что почитались на арене... нас должны бояться. Но почему я чувствую багровый кровожадности вокруг нас?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Раз мы убили воинов, что почитались на арене... нас должны бояться. Но почему я чувствую багровый кровожадности вокруг нас?
- guid: 5824d55c-6abc-40a2-928e-7036c12195a4
  event: BNTRS_Chapter3_Cassia_114
  text: '"Этот пестрый ксенос... его цвета отличаются от цветов его сородичей. Они словно... вывернуты наизнанку".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Этот пестрый ксенос... его цвета отличаются от цветов его сородичей. Они словно... вывернуты наизнанку.
- guid: 9889437b-1d3f-46ec-82a3-4718971ffa83
  event: BNTRS_Chapter3_Cassia_131
  text: '"Твои цвета, и без того пронзительные, словно сошли с ума... Разве ты не боялась, что буря в сердце способна поглотить тебя без остатка?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твои цвета, и без того пронзительные, словно сошли с ума... Разве ты не боялась, что буря в сердце способна поглотить тебя без остатка?
- guid: 864e2aa3-2fb4-48a8-b67a-5102c766abce
  event: BNTRS_Chapter3_Cassia_137
  text: '"Не думаю, что ее вела ненависть к людям. Раньше мне было сложно разобрать цвета ксеносов, но теперь... я понимаю. Ирлиэт душило отчаяние".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не думаю, что ее вела ненависть к людям. Раньше мне было сложно разобрать цвета ксеносов, но теперь... я понимаю. Ирлиэт душило отчаяние.
- guid: dab89026-2040-480a-b9fc-aaf40ded564f
  event: BNTRS_Chapter3_Cassia_15
  text: '"Ахиллеасом правит багровое и сизое... Неужели ваше порицание настолько сломило его?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ахиллеасом правит багровое и сизое... Неужели ваше порицание настолько сломило его?
- guid: cd24df07-870e-4d5a-aea7-826fb581d532
  event: BNTRS_Chapter3_Cassia_25
  text: '"Каждый из нас стал жертвой сей бездны. Цвета каждого... были нарушены. Загрязнены. Мы оставили здесь куда больше, чем кровь и плоть".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Каждый из нас стал жертвой сей бездны. Цвета каждого... были нарушены. Загрязнены. Мы оставили здесь куда больше, чем кровь и плоть.
- guid: 5475e379-1ff2-445e-a1fb-5ae6a26fbb10
  event: BNTRS_Chapter3_Cassia_31
  text: '"Да, я вижу. Где была круговерть цветов, теперь единство. Но разве тебя это не пугает? Ты как будто уже не картина, а просто... росчерк кисти".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Да, я вижу. Где была круговерть цветов, теперь единство. Но разве тебя это не пугает? Ты как будто уже не картина, а просто... росчерк кисти.
- guid: 2ff7fa96-7c8f-4005-b501-bd6c292f7cc2
  event: BNTRS_Chapter3_Cassia_43
  text: '"Почти... сломило. Если бы не Вольный Торговец, я наверняка бы сошла с ума".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Почти... сломило. Если бы не Вольный Торговец, я наверняка бы сошла с ума.
- guid: ae269507-9ec6-4c6b-be1d-0c69ec42ce6e
  event: BNTRS_Chapter3_Cassia_44
  text: '"Я так хочу снова увидеть настоящее солнце! Эти отвратительные, болезненные светила над головой мутят мне разум..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я так хочу снова увидеть настоящее солнце! Эти отвратительные, болезненные светила над головой мутят мне разум...
- guid: 138120cc-5d41-4dc0-9628-64e5777c38b2
  event: BNTRS_Chapter3_Cassia_47
  text: '"Неужели даже в этом месте я не заслуживаю вашей правды, Мастер ван Калокс? Я же вижу... каждый всполох алого, возникающий при ваших движениях".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Неужели даже в этом месте я не заслуживаю вашей правды, Мастер ван Калокс? Я же вижу... каждый всполох алого, возникающий при ваших движениях.
- guid: 8ac2ca7c-3b75-417b-ade4-fd56d9a829ee
  event: BNTRS_Chapter3_Cassia_48
  text: '"Твое поведение — и цвета — изменились. Стали чище... честнее".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твое поведение — и цвета — изменились. Стали чище... честнее.
- guid: c0cf4817-b68b-43f4-ba43-44ec60e3aaba
  event: BNTRS_Chapter3_Cassia_63
  text: '"Не кутайся в синее, Идира. Каждому из нас выпали свои испытания, с которыми мы... мы боролись как могли".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не кутайся в синее, Идира. Каждому из нас выпали свои испытания, с которыми мы... мы боролись как могли.
- guid: d4f5fc0a-f7f7-4741-a5f3-b6745075e69e
  event: BNTRS_Chapter3_Cassia_67
  text: '"В какой-то мере. Отверзая навигаторское око, я расчищу дорогу от тех, кто попытается нас остановить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В какой-то мере. Отверзая навигаторское око, я расчищу дорогу от тех, кто попытается нас остановить.
- guid: c41509b3-0389-41e3-9ac5-43583f956cf3
  event: BNTRS_Chapter3_Cassia_74
  text: '"Я все еще вспоминаю церемонию Магнэ Ацессио... Великолепное торжество, но столь много фальшивых цветов..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я все еще вспоминаю церемонию Магнэ Ацессио... Великолепное торжество, но столь много фальшивых цветов...
- guid: 9c583949-6439-4e12-a02b-31fbfa0f63f9
  event: BNTRS_Chapter4_Cassia_09
  text: '"Сколько их уцелевших собратьев еще бродит во мраке средь звезд?.. Кораблям Человечества нужно опасаться возмездия тех, кто отчаялся выжить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сколько их уцелевших собратьев еще бродит во мраке средь звезд?.. Кораблям Человечества нужно опасаться возмездия тех, кто отчаялся выжить.
- guid: e0e4299e-53e5-43fc-bed0-11f3eb33e16e
  event: BNTRS_Chapter4_Cassia_100
  text: '"Я верю, ты не оставишь ни единого пятна на лике Простора. Серебристое сияние твоей души выжигает скверну дотла подобно звезде, рассекающей тьму!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я верю, ты не оставишь ни единого пятна на лике Простора. Серебристое сияние твоей души выжигает скверну дотла подобно звезде, рассекающей тьму!
- guid: 09da45ea-22d6-4954-9602-d4d7405914fa
  event: BNTRS_Chapter4_Cassia_105
  text: '"Наконец... тайна Атласа раскрыта. То, что я столько лет носила в своей груди, получило свое объяснение... как и мои особые силы".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Наконец... тайна Атласа раскрыта. То, что я столько лет носила в своей груди, получило свое объяснение... как и мои особые силы.
- guid: 48d72c52-3755-452e-ab4d-b9510a32aa5e
  event: BNTRS_Chapter4_Cassia_109
  text: '"Тисифона сделала все, чтобы Дом служил Богу-Императору и направлял Человечество во тьме средь звезд. Эта цель в ее глазах... оправдывала любые жертвы — и среди ксеносов, и среди ее же подчиненных".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Тисифона сделала все, чтобы Дом служил Богу-Императору и направлял Человечество во тьме средь звезд. Эта цель в ее глазах... оправдывала любые жертвы — и среди ксеносов, и среди ее же подчиненных.
- guid: a721b129-6562-4dfb-903a-1dcc9be385ab
  event: BNTRS_Chapter4_Cassia_111
  text: '"Арлекины — пугающие создания. Я не могу разобрать в пестрой мешанине их цветов истинных оттенков — словно все их существование есть одна затянувшаяся шутка".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Арлекины — пугающие создания. Я не могу разобрать в пестрой мешанине их цветов истинных оттенков — словно все их существование есть одна затянувшаяся шутка.
- guid: f48fc16c-ce02-48ff-85f9-58c63a1d070e
  event: BNTRS_Chapter4_Cassia_129
  text: '"В штормах варпа мы полагаемся на свет Бога-Императора. Нечестивым ксеносам не дано понять, что значит истинная вера".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В штормах варпа мы полагаемся на свет Бога-Императора. Нечестивым ксеносам не дано понять, что значит истинная вера.
- guid: 10be5407-daba-4e84-adb9-e11445739322
  event: BNTRS_Chapter4_Cassia_153
  text: '"Краски в твой душе изменились. Они буйствуют водоворотом многоцветий... Притягательно и жутко одновременно".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Краски в твой душе изменились. Они буйствуют водоворотом многоцветий... Притягательно и жутко одновременно.
- guid: 9f4dd9c3-d019-4aeb-8f3f-241f540b567d
  event: BNTRS_Chapter4_Cassia_18
  text: '"Ваши цвета поблекли, почтенный магос. Скрепите сердце — в вас достаточно сил, чтобы пережить и эту утрату".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши цвета поблекли, почтенный магос. Скрепите сердце — в вас достаточно сил, чтобы пережить и эту утрату.
- guid: 600ddd5c-6cfd-4be9-bee6-92d6e6d2f9f8
  event: BNTRS_Chapter4_Cassia_33
  text: '"Футфол потряс меня в тот день, когда я впервые ступила на него... И вновь ошеломил преображенным. Отчего приведение к благочестию... так пугает?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Футфол потряс меня в тот день, когда я впервые ступила на него... И вновь ошеломил преображенным. Отчего приведение к благочестию... так пугает?
- guid: cf4a8126-f28b-4b19-8242-c48995d6ad50
  event: BNTRS_Chapter4_Cassia_49
  text: '"Отчего гемункул устроил себе логово посреди лесов Кетца Темера? Разве друкари не боятся реального мира?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Отчего гемункул устроил себе логово посреди лесов Кетца Темера? Разве друкари не боятся реального мира?
- guid: 8aa9aba2-e7b1-43e2-a46f-da5b4e823515
  event: BNTRS_Chapter4_Cassia_61
  text: '"Не понимаю. Почему некоторые спутники предпочли покинуть Вольного Торговца? Мы... что-то делаем не так?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не понимаю. Почему некоторые спутники предпочли покинуть Вольного Торговца? Мы... что-то делаем не так?
- guid: 04b785d8-6e4b-4699-bf60-8988dea64f40
  event: BNTRS_Chapter4_Cassia_64
  text: '"Возможно, вам бы присутствие там было бы нипочем, могучий Ульфар. Но я бы, скорее всего, лишилась бы собственных очей при взгляде на бушующие там цвета..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Возможно, вам бы присутствие там было бы нипочем, могучий Ульфар. Но я бы, скорее всего, лишилась бы собственных очей при взгляде на бушующие там цвета...
- guid: d32decec-582a-4f58-824d-6a2ecd4376da
  event: BNTRS_Chapter4_Cassia_75
  text: '"Обезглавлена династия Вольных Торговцев... Кто же придет на смену Каллигосу Винтерскейлу?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Обезглавлена династия Вольных Торговцев... Кто же придет на смену Каллигосу Винтерскейлу?
- guid: 5f8ecb32-f81c-4291-a682-032a8ecfafcf
  event: BNTRS_Chapter4_Cassia_95
  text: '"Ваши слова... окружают грязные цвета, Абеляр. Не позволяйте чужому яду отравить свою душу — на вас это совсем не похоже".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши слова... окружают грязные цвета, Абеляр. Не позволяйте чужому яду отравить свою душу — на вас это совсем не похоже.
- guid: 7f9a2d4e-237f-4173-b9c6-57594b3ce614
  event: BNTRS_Chapter4_Cassia_98
  text: '"Тебя словно окутывает невесомое серебристое облако, сестра. В его объятиях... и я чувствую умиротворение".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Тебя словно окутывает невесомое серебристое облако, сестра. В его объятиях... и я чувствую умиротворение.
- guid: 7b1a5dc0-a029-49c3-92d1-624627b048f1
  event: BNTRS_Chapter5_Cassia_06
  text: '"Здесь почти нет цветов, только чернильный мрак... Это плохое место. В нем много смерти".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Здесь почти нет цветов, только чернильный мрак... Это плохое место. В нем много смерти.
- guid: 1eef6380-97c0-4009-a81d-ab8d9fa6023f
  event: BNTRS_Companion_DLC3_Cassia_31
  text: '"Средоточие болезненного ржавого в вашей ауре... это вина, генетор. И горечь этой вины разъедает мои глаза, против воли навлекая на них слезы".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Средоточие болезненного ржавого в вашей ауре... это вина, генетор. И горечь этой вины разъедает мои глаза, против воли навлекая на них слезы.
- guid: f40ecd0f-b370-4cc4-a234-df94d0a0074a
  event: BNTRS_Companion_DLC3_Cassia_54
  text: '"Ох... благодарю! Признаться, я тоже наблюдала за вами в библиотеке — не ожидала, что техножрец вашего сана будет интересоваться мирской литературой. Я была бы рада обменяться с вами рекомендациями и обсудить прочитанное".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ох... благодарю! Признаться, я тоже наблюдала за вами в библиотеке — не ожидала, что техножрец вашего сана будет интересоваться мирской литературой. Я была бы рада обменяться с вами рекомендациями и обсудить прочитанное.
- guid: 25371d19-8e57-4ea1-b4d0-fbc97083cb70
  event: BNTRS_Companion_DLC3_Cassia_72
  text: '"Благодарю, генетор Фебрус. Я больше волнуюсь о вас — на части было разделено не только ваше тело, но и цвета... Они иные, словно что-то надломилось и никак не соберется вновь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Благодарю, генетор Фебрус. Я больше волнуюсь о вас — на части было разделено не только ваше тело, но и цвета... Они иные, словно что-то надломилось и никак не соберется вновь.
- guid: 229800ed-8f97-429e-9999-daf6a90af33a
  event: BNTRS_DLC2_Cassia_05
  text: '"Проктор, слуги доставили в мои покои три дюжины кодексов с законами разных миров Простора Коронус... Я не вполне понимаю, что значит этот ваш жест".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Проктор, слуги доставили в мои покои три дюжины кодексов с законами разных миров Простора Коронус... Я не вполне понимаю, что значит этот ваш жест.
- guid: fb500a2b-b9e3-4f7a-ba5a-77b1cc784109
  event: BNTRS_DLC2_Cassia_101
  text: '"Меня должным образом готовили к тому, чтобы выносить решения в спорных ситуациях. Но этот суд... был бы настоящим вызовом. Не только для меня, но и для моего покойного наставника Теобальда".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Меня должным образом готовили к тому, чтобы выносить решения в спорных ситуациях. Но этот суд... был бы настоящим вызовом. Не только для меня, но и для моего покойного наставника Теобальда.
- guid: 0fa20782-2ed2-48f5-beb3-5c2cf56f846e
  event: BNTRS_DLC2_Cassia_113
  text: '"Мне всегда казалось, что у слуг Администратума чернильные сердца и их не волнует власть. Однако им не чужды интриги знати".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Мне всегда казалось, что у слуг Администратума чернильные сердца и их не волнует власть. Однако им не чужды интриги знати.
- guid: 674d046b-7628-46bb-8fbe-4793715da2e1
  event: BNTRS_DLC2_Cassia_114
  text: '"Кто же теперь станет новым маршалом Простора? Полагаю, после боя в суде кандидатов осталось не так много..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Кто же теперь станет новым маршалом Простора? Полагаю, после боя в суде кандидатов осталось не так много...
- guid: 5dad1b02-6354-4059-abb2-794a6cb0f72c
  event: BNTRS_DLC2_Cassia_130
  text: '"Цвета проктора всегда были непреклонны. Он не смог бы жить, если бы смешал свои оттенки с серостью".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Цвета проктора всегда были непреклонны. Он не смог бы жить, если бы смешал свои оттенки с серостью.
- guid: e3133cb7-3f37-459b-8567-e35e515f6737
  event: BNTRS_DLC2_Cassia_149
  text: '"В библиотеке Лорд-капитана я нашла мемуары величайшего квартермейстера династии фон Валанциус — Сильверто де Йоно. Его хитроумные тактики помогут нам при абордаже".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В библиотеке Лорд-капитана я нашла мемуары величайшего квартермейстера династии фон Валанциус — Сильверто де Йоно. Его хитроумные тактики помогут нам при абордаже.
- guid: 2e8ba89e-0668-441c-b161-1617e97e115a
  event: BNTRS_DLC2_Cassia_159
  text: '"В детстве я зачитывалась летописями феодального мира Эрбенн-II. Рыцари в сияющих доспехах верхом на дивных скакунах сражались с врагами человечества, а потом пировали... Но на этом мире только серость. И грязь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В детстве я зачитывалась летописями феодального мира Эрбенн-II. Рыцари в сияющих доспехах верхом на дивных скакунах сражались с врагами человечества, а потом пировали... Но на этом мире только серость. И грязь.
- guid: 95981eeb-9011-4329-a14b-43f7a64c91fd
  event: BNTRS_DLC2_Cassia_163
  text: '"Вот как действуют слуги закона? Такая слаженность, такое обилие алого и золотого..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вот как действуют слуги закона? Такая слаженность, такое обилие алого и золотого...
- guid: 3d0f1e22-edce-4568-9b05-2caba7d9f466
  event: BNTRS_DLC2_Cassia_173
  text: '"Все здесь сочится бледно-зеленым. Этот оттенок... душит, словно цепь, стиснувшая горло".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Все здесь сочится бледно-зеленым. Этот оттенок... душит, словно цепь, стиснувшая горло.
- guid: 80814619-324a-4c26-b8fa-3b4925262237
  event: BNTRS_DLC2_Cassia_205
  text: '"Ваши оттенки мрачнеют, проктор. В следующий раз нам стоит задержаться на планете вроде Януса. Богатая флора агромира способна тронуть даже ваше... чувство прекрасного".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши оттенки мрачнеют, проктор. В следующий раз нам стоит задержаться на планете вроде Януса. Богатая флора агромира способна тронуть даже ваше... чувство прекрасного.
- guid: c84f7066-416f-4354-83c1-bcbf70bb032a
  event: BNTRS_DLC2_Cassia_24
  text: '"Ваши цвета наливаются свинцом, когда вы рассуждаете о картинах. Не утруждайтесь, проктор. Искусство просто... не для вас".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши цвета наливаются свинцом, когда вы рассуждаете о картинах. Не утруждайтесь, проктор. Искусство просто... не для вас.
- guid: 4065c3f0-536a-423b-be12-a467e21cb6f2
  event: BNTRS_DLC2_Cassia_242
  text: '"С первой встречи вы считали меня слабой, хрупкой... Что ж, проктор. Вы ошиблись".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: С первой встречи вы считали меня слабой, хрупкой... Что ж, проктор. Вы ошиблись.
- guid: d4570d77-d852-40d2-8500-f87c7e78f161
  event: BNTRS_DLC2_Cassia_289
  text: '"Оставьте его, сенешаль. Цвета господина проктора... Ему и так тяжело".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Оставьте его, сенешаль. Цвета господина проктора... Ему и так тяжело.
- guid: 7e6b49f1-a684-454b-8289-c4e5c0635ee5
  event: BNTRS_DLC2_Cassia_298
  text: '"Ирлиэт для Лорда-капитана не привычка и не ошибка. А нечто... большее. Не думаю, что мы сможем когда-нибудь их понять".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ирлиэт для Лорда-капитана не привычка и не ошибка. А нечто... большее. Не думаю, что мы сможем когда-нибудь их понять.
- guid: 1ea6c45d-4df1-42b9-9fd0-31f0b596564d
  event: BNTRS_DLC2_Cassia_63
  text: '"Ошибка маршала привела к падению всех Арбитес в Коронусе. Как глава Дома, я извлеку урок из этой истории".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ошибка маршала привела к падению всех Арбитес в Коронусе. Как глава Дома, я извлеку урок из этой истории.
- guid: 477568e4-74d7-4735-b92c-97cfaa47e046
  event: BNTRS_DLC2_Cassia_71
  text: '""Бессердечный" пылал всеми оттенками ужаса при попытке броситься в Имматериум... Наш триумф стоил дорого. Это... важный урок".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: '"Бессердечный" пылал всеми оттенками ужаса при попытке броситься в Имматериум... Наш триумф стоил дорого. Это... важный урок.'
- guid: f1b62886-64ef-4a40-813d-52792a9805e4
  event: BNTRS_DLC2_Cassia_78
  text: '"Я мечтала побывать на феодальном мире, сошедшем со страниц героических летописей. Но теперь... я мечтаю поскорее забыть об этом месте".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я мечтала побывать на феодальном мире, сошедшем со страниц героических летописей. Но теперь... я мечтаю поскорее забыть об этом месте.
- guid: fac6226f-38d4-43c6-88e5-29288935ac34
  event: BNTRS_DLC2_Cassia_84
  text: '"Не верится, что губернатор Тассеры так легко обманул своих подданных. Неужели манеры подставного правителя не вызвали подозрений?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не верится, что губернатор Тассеры так легко обманул своих подданных. Неужели манеры подставного правителя не вызвали подозрений?
- guid: eafd0e99-5814-4f98-ad65-4362e0c49332
  event: BNTRS_DLC3_Cassia_02
  text: '"Эти цвета поразительно напоминают переливы, которые я встречала у некоторых хищников. Только ярче и страннее. Они будто... заманивают нас ближе".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Эти цвета поразительно напоминают переливы, которые я встречала у некоторых хищников. Только ярче и страннее. Они будто... заманивают нас ближе.
- guid: 2558327b-31a7-43bc-9d27-ab7e3ca5632e
  event: BNTRS_DLC3_Cassia_131
  text: '"Это место обманчиво. За прозрачными белыми мазками прячутся всполохи чего-то огромного, опасного и хищного. Здесь... не по себе".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Это место обманчиво. За прозрачными белыми мазками прячутся всполохи чего-то огромного, опасного и хищного. Здесь... не по себе.
- guid: 70fa58b8-c17d-4cce-92c4-7633b930faec
  event: BNTRS_DLC3_Cassia_22
  text: '"О нет, эти вещи не мертвы. Каждая из них окружена слабыми отголосками цветов, как своих собственных, так и привнесенных кем-то... кто был до. Все они несут в себе истории, частью которых являются, и все они были дороги кому-то, не сейчас и не здесь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: О нет, эти вещи не мертвы. Каждая из них окружена слабыми отголосками цветов, как своих собственных, так и привнесенных кем-то... кто был до. Все они несут в себе истории, частью которых являются, и все они были дороги кому-то, не сейчас и не здесь.
- guid: ce776d72-fbb4-4f3e-8798-f6253bc3816d
  event: BNTRS_DLC3_Cassia_32
  text: '"Очень примечательная подборка геральдических символов и родовых артефактов священных династий. Интересно, как давно реликвии... хранятся в этом странном месте".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Очень примечательная подборка геральдических символов и родовых артефактов священных династий. Интересно, как давно реликвии... хранятся в этом странном месте.
- guid: 32dc15e1-57d7-4cc8-a38d-d26e65f374b2
  event: BNTRS_DLC3_Cassia_64
  text: '"Краски этого места столь ярки и монохромны, что слепят мне глаза. Прошу вас, давайте не будем задерживаться!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Краски этого места столь ярки и монохромны, что слепят мне глаза. Прошу вас, давайте не будем задерживаться!
- guid: e6ccdf24-c3a1-4b27-8e2c-ff31a81f1fae
  event: BNTRS_DLC3_Cassia_71
  text: '"Алые краски сменяются черными, глубокими, точно бездонный провал. То, что говорит Ирлиэт... поразительно точное описание того, что вижу я".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Алые краски сменяются черными, глубокими, точно бездонный провал. То, что говорит Ирлиэт... поразительно точное описание того, что вижу я.
- guid: 849d4ac5-3852-44bd-b9fc-08557d2f6236
  event: BNTRS_DLC3_Cassia_78
  text: '"Я... а... Джай, о ком же... ахем. Не думаю, что опускаться до прозрачных уничижительных намеков достойно свиты Лорд-капитана!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... а... Джай, о ком же... ахем. Не думаю, что опускаться до прозрачных уничижительных намеков достойно свиты Лорд-капитана!
- guid: 4cbaec8e-60dd-437d-97b7-aed213f40742
  event: BNTRS_DLC3_Cassia_79
  text: '"Здесь стало люднее. И запах крови... Ах, прошу прощения, мне немного дурно".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Здесь стало люднее. И запах крови... Ах, прошу прощения, мне немного дурно.
- guid: 9710e948-3e6f-4672-b638-75e6afee53be
  event: BNTRS_PickUps_Cassia_05
  text: '"Багрянец и золото пылают в твоей душе кровавым закатом. Но остальные краски... выцвели".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Багрянец и золото пылают в твоей душе кровавым закатом. Но остальные краски... выцвели.
- guid: 81bce542-fe6e-4e85-b305-f4336bad3d60
  event: BNTRS_PickUps_Cassia_111
  text: '"Твое присутствие расплескало по душам астропатов мириады оттенков ужаса... Нам не стоит задерживаться".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твое присутствие расплескало по душам астропатов мириады оттенков ужаса... Нам не стоит задерживаться.
- guid: 5da700df-b861-4ac0-b455-799c8fac8d00
  event: BNTRS_PickUps_Cassia_112
  text: '"Как необычно. Для меня Имматериум состоит из цветов, но для астропатов, обитающих в этой капелле, он — музыка".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как необычно. Для меня Имматериум состоит из цветов, но для астропатов, обитающих в этой капелле, он — музыка.
- guid: b719867c-732b-456f-ba7f-8a1edd2ea180
  event: BNTRS_PickUps_Cassia_140
  text: '"Нам правда... необходимо здесь находиться? Я не уверена от чего меня больше мутит, от этих ужасных цветов или запаха..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Нам правда... необходимо здесь находиться? Я не уверена от чего меня больше мутит, от этих ужасных цветов или запаха...
- guid: 969a907b-b39d-42b4-afb1-8c950689dbc6
  event: BNTRS_PickUps_Cassia_144
  text: '"Алый, черный, синий и серый... Все смешалось в уродливый грязный вихрь. Ярость и отчаяние отравили отсек".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Алый, черный, синий и серый... Все смешалось в уродливый грязный вихрь. Ярость и отчаяние отравили отсек.
- guid: c9da5f72-7e11-463f-a478-356d385c7709
  event: BNTRS_PickUps_Cassia_157
  text: '"Стоит закрыть глаза, и безумные цвета поглощенного ересью мира жгут веки. Ужасное зрелище".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Стоит закрыть глаза, и безумные цвета поглощенного ересью мира жгут веки. Ужасное зрелище.
- guid: dbb0400f-8f09-4737-bfdf-0cd6cf454468
  event: BNTRS_PickUps_Cassia_160
  text: '"Столь дерзкое суждение о вышестоящем из уст простолюдин... Прошу прощения, я хотела сказать, что поражена смелостью вашей мысли".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Столь дерзкое суждение о вышестоящем из уст простолюдин... Прошу прощения, я хотела сказать, что поражена смелостью вашей мысли.
- guid: f6927473-50b3-4827-8aca-051e9ad61c49
  event: BNTRS_PickUps_Cassia_173
  text: '"Я... буду считать это сочувствием, а не угрозой".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... буду считать это сочувствием, а не угрозой.
- guid: 1081238b-ef3b-44e7-9705-a1a38d1642de
  event: BNTRS_PickUps_Cassia_208
  text: '"Преподобный Иеробор писал, что "С каждого спросится по силам его, каждому воздастся по заслугам его". Мне страшно представить даже ее воздаяние".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Преподобный Иеробор писал, что "С каждого спросится по силам его, каждому воздастся по заслугам его". Мне страшно представить даже ее воздаяние.
- guid: b962ccf5-a37f-4617-ba60-3600b6b5c8c1
  event: BNTRS_PickUps_Cassia_22
  text: '"Среди бесконечного ужаса Океана Душ далекий свет Его подобен… пылающему сердцу. И пока оно бьется во тьме, я знаю, что смогу отыскать путь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Среди бесконечного ужаса Океана Душ далекий свет Его подобен… пылающему сердцу. И пока оно бьется во тьме, я знаю, что смогу отыскать путь.
- guid: 4d21d921-ec81-4448-94c0-5b4d20cef4aa
  event: BNTRS_PickUps_Cassia_222
  text: '"Подобная оценка жизни неуместна, груба... но не лишена истины. Герои моих любимых романов превозмогают тяготы — настал и мой черед".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Подобная оценка жизни неуместна, груба... но не лишена истины. Герои моих любимых романов превозмогают тяготы — настал и мой черед.
- guid: ffcbc5e4-57bd-4feb-9351-6ad4042b85ec
  event: BNTRS_PickUps_Cassia_227
  text: '"В цвета твоей души вернулась упорядоченность. Тебе... легче от того, что ваша связь с Лорд-капитаном нарушилась?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В цвета твоей души вернулась упорядоченность. Тебе... легче от того, что ваша связь с Лорд-капитаном нарушилась?
- guid: 255fa2b4-2cec-4cdb-9dbd-442bda4f6c83
  event: BNTRS_PickUps_Cassia_244
  text: '"Кибелла, я никогда не видела у нее таких цветов. Это... страх? Смятение?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Кибелла, я никогда не видела у нее таких цветов. Это... страх? Смятение?
- guid: ac8e7851-f053-4f17-937a-1fd56ab8dd23
  event: BNTRS_PickUps_Cassia_258
  text: '"Полагаю, дело не в размерах территории, а в компетентности губернатора. Он даже не прислал за нами подобающий кортеж!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Полагаю, дело не в размерах территории, а в компетентности губернатора. Он даже не прислал за нами подобающий кортеж!
- guid: e562d6f7-9b0e-4f81-b458-56546d853db5
  event: BNTRS_PickUps_Cassia_259
  text: '"Даже в эпицентре антрацитово-багровой бури ты, Кибелла, излучаешь ровное серебристое сияние. Физическая боль для тебя — мимолетный всполох. Почему?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Даже в эпицентре антрацитово-багровой бури ты, Кибелла, излучаешь ровное серебристое сияние. Физическая боль для тебя — мимолетный всполох. Почему?
- guid: 8464ed5e-02fe-4313-be59-6651bbf90f91
  event: BNTRS_PickUps_Cassia_263
  text: '"Как странно, твои речи мрачны, но в душе виден всполох радости. Ты так приветствуешь меня?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как странно, твои речи мрачны, но в душе виден всполох радости. Ты так приветствуешь меня?
- guid: 8acab8e8-316c-4964-bd84-7ef06f0ac7af
  event: BNTRS_PickUps_Cassia_285
  text: '"Пролитая кровь благородных господ — большое несчастье. Однако суровое решение Лорд-капитана надолго отобьет у этих бесчестных интриганов желание вредить верным слугам Лорд-капитана".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Пролитая кровь благородных господ — большое несчастье. Однако суровое решение Лорд-капитана надолго отобьет у этих бесчестных интриганов желание вредить верным слугам Лорд-капитана.
- guid: ed1b2f8d-a052-48d0-84d3-e1c623aced82
  event: BNTRS_PickUps_Cassia_66
  text: '"Разве столь ценным служителям Императора пристойно ютиться в столь убогой обители?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Разве столь ценным служителям Императора пристойно ютиться в столь убогой обители?
- guid: f1cb2822-c2b2-417e-a3e4-fccc4858a5a4
  event: BNTRS_PickUps_Cassia_79
  text: '"Я чувствую странную схожесть между нами. Нас обеих вырастили наши... Дома. Для великой цели".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я чувствую странную схожесть между нами. Нас обеих вырастили наши... Дома. Для великой цели.
- guid: 857506a9-24dd-44a2-8b04-740f94145273
  event: BNTRS_PickUps_Cassia_90
  text: '"То, что Вольный Торговец нисходит в обители убогих серфов — какая-то традиция? В моем Доме такое не принято".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: То, что Вольный Торговец нисходит в обители убогих серфов — какая-то традиция? В моем Доме такое не принято.
- guid: 75db4bff-c0df-488c-83b8-97deb4017cab
  event: BNTRS_PickUps_Cassia_99
  text: '"Когда многорукое чудовище смотрело на меня, я видела... нечто. Огромную черную тень за пределами его взгляда. В ней не было цветов... вовсе".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Когда многорукое чудовище смотрело на меня, я видела... нечто. Огромную черную тень за пределами его взгляда. В ней не было цветов... вовсе.
- guid: c5681cfc-3c87-4f8d-8fe3-9c863e6e6273
  event: BNTRS_Reactivity_Cassia_101
  text: '"Я вижу серебристо-синее сияние вокруг Лорд-капитана и Ирлиэт. Эти цвета... ни на что не похожи. Словно бы их чувства на ином, непознанном уровне".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я вижу серебристо-синее сияние вокруг Лорд-капитана и Ирлиэт. Эти цвета... ни на что не похожи. Словно бы их чувства на ином, непознанном уровне.
- guid: 6add1c69-3dd5-4f6d-8096-12f79b80739c
  event: BNTRS_Reactivity_Cassia_14
  text: '"Отчего ты столь подозрительно улыбаешься? Твои цвета... причудливо пляшут, когда я рядом".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Отчего ты столь подозрительно улыбаешься? Твои цвета... причудливо пляшут, когда я рядом.
- guid: 9d8126e5-ed83-458b-8647-29a8da6e2132
  event: BNTRS_Reactivity_Cassia_29
  text: '"Ну что вы, почтенный магос. Союз Дома Орселлио и династии фон Валанциус — великое событие. Беспокоятся о нем лишь завистники, а друзья — дарят поддержку".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ну что вы, почтенный магос. Союз Дома Орселлио и династии фон Валанциус — великое событие. Беспокоятся о нем лишь завистники, а друзья — дарят поддержку.
- guid: a1716008-a69f-4f67-bef3-22123220ee43
  event: BNTRS_Reactivity_Cassia_31
  text: '"Я вижу твои пестрые всполохи... Спрашивай же. Прежде ты не молчала ни из вежливости, ни из жалости".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я вижу твои пестрые всполохи... Спрашивай же. Прежде ты не молчала ни из вежливости, ни из жалости.
- guid: ecdc774c-e238-412b-972d-4ac9ca24d423
  event: BNTRS_Reactivity_Cassia_37
  text: '"Цвета Лорд-капитана и Мастера ван Калокса меняются, стоит им оказаться рядом".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Цвета Лорд-капитана и Мастера ван Калокса меняются, стоит им оказаться рядом.
- guid: 324e6049-c6a1-49c9-a260-5f3fc7d54dc5
  event: BNTRS_Reactivity_Cassia_41
  text: '"Теперь я знаю, что значит выражение "красивая пара". Мне жаль, что этой изящной картине не суждено было быть воплощенной на холсте реальности".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Теперь я знаю, что значит выражение "красивая пара". Мне жаль, что этой изящной картине не суждено было быть воплощенной на холсте реальности.
- guid: 91f02e98-f4e7-49b0-b2b3-0cbd9db258dd
  event: BNTRS_Reactivity_Cassia_49
  text: '"Джай... ведет себя немного демонстративно в вопросах ее связи с Лорд-капитаном. Необычное поведение для принцессы. Похоже, у знати на Ифрите совсем другие порядки".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Джай... ведет себя немного демонстративно в вопросах ее связи с Лорд-капитаном. Необычное поведение для принцессы. Похоже, у знати на Ифрите совсем другие порядки.
- guid: 968e8d7c-dc11-47fd-a8b1-688f5dc05ff9
  event: BNTRS_Reactivity_Cassia_58
  text: '"Твои цвета стали темнее и мрачнее. Отчего в тебе столько скорби?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Твои цвета стали темнее и мрачнее. Отчего в тебе столько скорби?
- guid: 6154fdbd-7e62-4c60-a2e5-bfa0f2f60b34
  event: BNTRS_Reactivity_Cassia_65
  text: '"Сестра Арджента, скажи мне. Как призвать сердце к смирению, когда его одолевают... ревность и сомнения?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сестра Арджента, скажи мне. Как призвать сердце к смирению, когда его одолевают... ревность и сомнения?
- guid: 5d3e8ce5-a7c5-4ea1-8911-2afc1e7adb9f
  event: BNTRS_Reactivity_Cassia_70
  text: '"Вовсе нет! Просто я... всегда мечтала стать для кого-то единственной и неповторимой. Но жизнь научила, что мы не всегда получаем желаемое".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вовсе нет! Просто я... всегда мечтала стать для кого-то единственной и неповторимой. Но жизнь научила, что мы не всегда получаем желаемое.
- guid: 1405e007-c52c-4a9b-8d7c-05292e294b47
  event: BNTRS_Reactivity_Cassia_76
  text: '"Палубы корабля окутывались тревожным желтым и испуганным зеленым, когда меж людей ступал Маражай... но теперь те же цвета заполоняют все вокруг, когда Лорд-капитан появляется на мостике. Меня... пугает эта перемена".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Палубы корабля окутывались тревожным желтым и испуганным зеленым, когда меж людей ступал Маражай... но теперь те же цвета заполоняют все вокруг, когда Лорд-капитан появляется на мостике. Меня... пугает эта перемена.
- guid: bb2afa34-3362-4af6-a836-bf750b947ca0
  event: BNTRS_Reactivity_Cassia_92
  text: '"Ох, я... извини. Твои цвета недавно вдруг потускнели, и теперь мне почти не больно на них смотреть. Это... из-за Лорд-капитана, верно? Хм. Молчание — тоже ответ".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ох, я... извини. Твои цвета недавно вдруг потускнели, и теперь мне почти не больно на них смотреть. Это... из-за Лорд-капитана, верно? Хм. Молчание — тоже ответ.
- guid: 608b8261-2434-4a95-92a9-ddfa98c0c598
  event: BNTRS_Reactivity_DLC3_Cassia_04
  text: '"А я гадала, от чего эти яркие вспышки в тумане, что укутывают вас каждый раз, когда вы покидаете мостик. Их действительно стало меньше".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: А я гадала, от чего эти яркие вспышки в тумане, что укутывают вас каждый раз, когда вы покидаете мостик. Их действительно стало меньше.
- guid: ee6e6118-dba9-46d3-be28-3f6ed4792d9d
  event: BNTRS_Reactivity_DLC3_Cassia_30
  text: '"Я чувствую смятение вокруг. Будто на огромный холст выплеснули полный флакон краски. Это из-за Патента, знаю. Но к чему такое волнение? Разве сама кровь Вольного Торговца не священна?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я чувствую смятение вокруг. Будто на огромный холст выплеснули полный флакон краски. Это из-за Патента, знаю. Но к чему такое волнение? Разве сама кровь Вольного Торговца не священна?
- guid: cc85afa8-e855-45bd-b8a7-218c4989319a
  event: BNTRS_Reactivity_DLC3_Cassia_52
  text: '"То, что господин Себериан остался там... Я понимаю, почему Лорд-капитан так поступил{mf||а} со своим предком. Великим правителям прошлого... лучше оставаться в прошлом".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: То, что господин Себериан остался там... Я понимаю, почему Лорд-капитан так поступил со своим предком. Великим правителям прошлого... лучше оставаться в прошлом.
- guid: fa985514-7d26-4d31-ad26-af8184b6db6c
  event: BNTRS_Reactivity_DLC3_Cassia_64
  text: '"Шествие на палубе было окрашено столь яркими цветами, хоть и состояло из безродной черни. Этот контраст кажется необычным и даже... красивым. Смогут ли передать его мои краски?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Шествие на палубе было окрашено столь яркими цветами, хоть и состояло из безродной черни. Этот контраст кажется необычным и даже... красивым. Смогут ли передать его мои краски?
- guid: 74f88aac-fb26-40c6-92bd-5f4cc219678e
  event: BNTRS_Stressful_Cassia_04
  text: '"Не беспокойтесь, со мной мои навигаторские силы. Статистически говоря, у вас куда больше шансов погибнуть в бою. Ох, то есть, это не совсем то, что я хотела сказать..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не беспокойтесь, со мной мои навигаторские силы. Статистически говоря, у вас куда больше шансов погибнуть в бою. Ох, то есть, это не совсем то, что я хотела сказать...
- guid: 0dbec5a4-3f89-4407-8ac9-419e3776c7ff
  event: BNTRS_Stressful_Cassia_114
  text: '"Ты — черное пятно, что словно кровавая катастрофа тянет к себе безвольный взор. Я хочу отвернуться... но то, как искажена твоя душа, пугает и завораживает".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ты — черное пятно, что словно кровавая катастрофа тянет к себе безвольный взор. Я хочу отвернуться... но то, как искажена твоя душа, пугает и завораживает.
- guid: 3829b304-1d00-4013-ac72-b86eeb973851
  event: BNTRS_Stressful_Cassia_134
  text: '"Познание есть ключ ко всему", не так ли, почтенный магос? Я научилась сей мудрости у ваших собратьев, и она уже не раз меня выручала".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Познание есть ключ ко всему", не так ли, почтенный магос? Я научилась сей мудрости у ваших собратьев, и она уже не раз меня выручала.
- guid: ad27230b-de0e-44c4-a9b5-f379eec498dd
  event: BNTRS_Stressful_Cassia_152
  text: '"Благодарю тебя, Ульфар. Ценно знать, что я заслуживаю доверия Космического волка. И еще ценнее видеть это в пестрых всполохах, что окружают твою яркую душу".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Благодарю тебя, Ульфар. Ценно знать, что я заслуживаю доверия Космического волка. И еще ценнее видеть это в пестрых всполохах, что окружают твою яркую душу.
- guid: e6f91a4c-8ae0-4dd7-bc7a-924df587dfb5
  event: BNTRS_Stressful_Cassia_170
  text: '"Могу ответить тебе тем же. Сияние твоей души ослепляет мой взор — до слез и боли в висках. Нам лучше... держаться на расстоянии".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Могу ответить тебе тем же. Сияние твоей души ослепляет мой взор — до слез и боли в висках. Нам лучше... держаться на расстоянии.
- guid: 6f5165bc-6edf-4445-8fed-37c481d69b2b
  event: BNTRS_Stressful_Cassia_22
  text: '"О, думаю, ты смогла бы. В тебе есть и золотой свет, и серебряный, и алый — один из них позвал бы тебя обратно в этот мир".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: О, думаю, ты смогла бы. В тебе есть и золотой свет, и серебряный, и алый — один из них позвал бы тебя обратно в этот мир.
- guid: 65993516-7093-4285-a19e-ed05317b9b4b
  event: BNTRS_Stressful_Cassia_37
  text: '"Я вижу волнение и страх прислуги подле меня. Но вы... Как у вас получается заглушать их цвета одними словами? Их темные оттенки сразу растворяются, и наступает смирение".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я вижу волнение и страх прислуги подле меня. Но вы... Как у вас получается заглушать их цвета одними словами? Их темные оттенки сразу растворяются, и наступает смирение.
- guid: a76c2b13-c383-40c5-85dc-059ab3ef7852
  event: BNTRS_Stressful_Cassia_39
  text: '"Сестра Арджента, подле меня ты непрестанно кутаешься в зеленовато-серый туман. Тебя тревожу я? Или то, что я могу за ним разглядеть?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сестра Арджента, подле меня ты непрестанно кутаешься в зеленовато-серый туман. Тебя тревожу я? Или то, что я могу за ним разглядеть?
- guid: 2cfc7a34-93c6-4e8a-807f-59371ea2e4d3
  event: BNTRS_Stressful_Cassia_41
  text: '"Чем больше вы стараетесь сокрыть от меня свои цвета, мастер ван Калокс, тем отчетливей я их вижу. Если вам столь неприятен мой взор — просто скажите".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Чем больше вы стараетесь сокрыть от меня свои цвета, мастер ван Калокс, тем отчетливей я их вижу. Если вам столь неприятен мой взор — просто скажите.
- guid: 4d5d2d63-74ba-4b2a-9208-c107bdd9e314
  event: BNTRS_Stressful_Cassia_43
  text: '"Иногда я задаюсь вопросом — насколько мы по-разному ощущаем варп?"'
  speaker: Cassia Orsellio
  parts:
