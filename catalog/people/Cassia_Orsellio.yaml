    text_clean: Удивительно... Ваше сердце, почтенный магос, сияет пестрым калейдоскопом красок, хоть и сотворено из металла.
- guid: 4e5bc77c-4aa5-442c-870f-f9aa6128a6eb
  event: BNTRS_Stressful_Cassia_51
  text: '"Тебе необязательно скрывать пепельные тени одиночества за вихрями ярких красок, Ульфар".'
