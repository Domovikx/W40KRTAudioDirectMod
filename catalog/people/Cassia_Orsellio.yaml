- guid: 68ad4ad7-ef0c-43cb-98c4-86b404466ff6
  event: Companions_Navigator_06
  text: '"Это сложно описать словами... Поймите, каждый навигатор воспринимает {g|Encyclopedia:Warp}варп{/g} по-особенному. Мой учитель, Великий Регент Ааронто, всегда описывал свои путешествия через Имматериум как странствие по бескрайнему лесу со множеством тропок. И я, ассистируя в первых полетах, пыталась следовать его примеру — безуспешно. Лес не открывался мне".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Это сложно описать словами... Поймите, каждый навигатор воспринимает варп по-особенному. Мой учитель, Великий Регент Ааронто, всегда описывал свои путешествия через Имматериум как странствие по бескрайнему лесу со множеством тропок. И я, ассистируя в первых полетах, пыталась следовать его примеру — безуспешно. Лес не открывался мне.
- guid: 84544474-97d1-4389-8e58-9ccb34e54e4e
  event: Companions_Navigator_07
  text: '"Не имею намерения возражать, Лорд-капитан".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не имею намерения возражать, Лорд-капитан.
- guid: f61f384f-4bc7-4971-8182-7ba936f5a1f7
  event: Companions_Navigator_08
  text: '"Спасибо, что выслушали". {n}Кассия чуть улыбается и благодарно кивает.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Спасибо, что выслушали.
  - speaker: narrator
    text_clean: Кассия чуть улыбается и благодарно кивает.
- guid: 33892058-a271-4930-82ab-820cff24cde6
  event: Companions_Navigator_09
  text: '"Когда же на Эурак-V синий лед моей души заставил сердце Фелека остановиться... Я сразу все поняла. И лгать себе было уже бессмысленно".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Когда же на Эурак-V синий лед моей души заставил сердце Фелека остановиться... Я сразу все поняла. И лгать себе было уже бессмысленно.
- guid: 08b1c42d-6e11-48a9-b653-49de144835b7
  event: Companions_Navigator_10
  text: '"Свинцовая мгла отныне не тяготит Сестру битвы. Арджента высвободила ее, и мгла стала тенью, без которой не может существовать свет. Чистым оттенком, единственным столпом спокойствия, что остался в бушующем пламени ее души. Огонь пылает золотом и алыми... К добру или к худу — мне узнать не под силу".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Свинцовая мгла отныне не тяготит Сестру битвы. Арджента высвободила ее, и мгла стала тенью, без которой не может существовать свет. Чистым оттенком, единственным столпом спокойствия, что остался в бушующем пламени ее души. Огонь пылает золотом и алыми... К добру или к худу — мне узнать не под силу.
- guid: cfeef248-6e1f-413f-a467-fcffb0739012
  event: Companions_Navigator_100
  text: '"Так... говорит Великий Регент". {n}Кассия старается не встречаться с вами взглядом.{/n} "Ничего еще не решено. Некоторых в Доме окутывает непроглядная серая туча при мысли о том, что я стану {g|Encyclopedia:Novator}новатором{/g}. Но еще больших опутывают свинцово-сизые оковы. Они считают, что я не готова к подобной ноше".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Так... говорит Великий Регент.
  - speaker: narrator
    text_clean: Кассия старается не встречаться с вами взглядом.
  - speaker: Cassia Orsellio
    text_clean: Ничего еще не решено. Некоторых в Доме окутывает непроглядная серая туча при мысли о том, что я стану новатором. Но еще больших опутывают свинцово-сизые оковы. Они считают, что я не готова к подобной ноше.
- guid: 11c2ee0b-ff98-4ab9-98f5-67b0d80a4f50
  event: Companions_Navigator_101
  text: '"Мне жаль, что я не смогла разглядеть помыслов Ирлиэт сквозь призму собственных сил, Лорд-капитан. Но, кажется, теперь я начинаю понимать намерения ксеносов чуточку лучше. Их ложь, их страхи, их ярость... Цвета Ирлиэт отныне сплетаются в моих глазах нитями единого гобелена, пестрящего чуждыми эмоциями".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Мне жаль, что я не смогла разглядеть помыслов Ирлиэт сквозь призму собственных сил, Лорд-капитан. Но, кажется, теперь я начинаю понимать намерения ксеносов чуточку лучше. Их ложь, их страхи, их ярость... Цвета Ирлиэт отныне сплетаются в моих глазах нитями единого гобелена, пестрящего чуждыми эмоциями.
- guid: 378062e3-8d7a-4ace-a736-d7ab2a88c248
  event: Companions_Navigator_102
  text: '"Джай подобна драгоценному камню: чем ярче подле нее сияют люди, тем отчетливее она повторяет в своих гранях мириады пестрящих отблесков. Все они — части Джай, и ни один из них — не она. За покровом цветастых шалей я не могу разобрать ее истинных цветов. Сколько бы раз ни срывала оттенок за оттенком, под одним цветом каждый раз оказывается другой".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: 'Джай подобна драгоценному камню: чем ярче подле нее сияют люди, тем отчетливее она повторяет в своих гранях мириады пестрящих отблесков. Все они — части Джай, и ни один из них — не она. За покровом цветастых шалей я не могу разобрать ее истинных цветов. Сколько бы раз ни срывала оттенок за оттенком, под одним цветом каждый раз оказывается другой.'
- guid: fa3f3bde-3e69-4f59-9e34-a1126b19a6be
  event: Companions_Navigator_103
  text: '{n}Нечеловеческие зрачки сужаются в рубиновых глазах Кассии, и пол начинает плыть под вашими ногами.{/n} "Вы были в своем праве, Лорд-капитан. То, что представители Дома Орселлио позволили себе сотворить на мире-столице Вольного Торговца... Попросту недопустимо".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Нечеловеческие зрачки сужаются в рубиновых глазах Кассии, и пол начинает плыть под вашими ногами.
  - speaker: Cassia Orsellio
    text_clean: Вы были в своем праве, Лорд-капитан. То, что представители Дома Орселлио позволили себе сотворить на мире-столице Вольного Торговца... Попросту недопустимо.
- guid: cca16cef-eaf7-4c1f-9c39-33d5132744e9
  event: Companions_Navigator_104
  text: '"Отнюдь, Лорд-капитан. Одна мысль о произошедшем стягивает горло серо-синей удавкой. Осознавать вновь и вновь, сколь отчаянно подданные тебя ненавидят..." {n}К горлу подступает удушливый ком, и Кассия испуганно проводит ладонью над вашим плечом, словно сбрасывая осевший пепел. Становится легче.{/n} "Простите, Лорд-капитан. Мне не стоит омрачать ваши цвета своими переживаниями".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Отнюдь, Лорд-капитан. Одна мысль о произошедшем стягивает горло серо-синей удавкой. Осознавать вновь и вновь, сколь отчаянно подданные тебя ненавидят...
  - speaker: narrator
    text_clean: К горлу подступает удушливый ком, и Кассия испуганно проводит ладонью над вашим плечом, словно сбрасывая осевший пепел. Становится легче.
  - speaker: Cassia Orsellio
    text_clean: Простите, Лорд-капитан. Мне не стоит омрачать ваши цвета своими переживаниями.
- guid: 735dce49-8842-42fa-9093-52db60f165fc
  event: Companions_Navigator_105
  text: '"Сестра Арджента сияет подобно путеводной звезде, наделяя окружающих необъяснимой решительностью. Однако я вижу, как за ее спиной клубится темная, уродливая мгла, столь явно оттеняющая ее сияние. Она тяготит Сестру битвы, тянет вниз... Но едва ли Арджента сама это замечает".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сестра Арджента сияет подобно путеводной звезде, наделяя окружающих необъяснимой решительностью. Однако я вижу, как за ее спиной клубится темная, уродливая мгла, столь явно оттеняющая ее сияние. Она тяготит Сестру битвы, тянет вниз... Но едва ли Арджента сама это замечает.
- guid: 1c0bb480-7328-407c-b094-7e1d16373950
  event: Companions_Navigator_106
  text: '"Джай продолжает кутаться в пестрые краски привычных масок, меняет цвета по желанию, словно одежды. Но глубоко внутри ее сердца трепещет пугливый росток цвета дымчатой лилии. Грязный, опаленный, присыпанный пеплом... Зато настоящий. Кто знает, быть может, однажды Джай и позволит ему прорасти".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Джай продолжает кутаться в пестрые краски привычных масок, меняет цвета по желанию, словно одежды. Но глубоко внутри ее сердца трепещет пугливый росток цвета дымчатой лилии. Грязный, опаленный, присыпанный пеплом... Зато настоящий. Кто знает, быть может, однажды Джай и позволит ему прорасти.
- guid: 457f72c6-c9ba-4057-9ac9-0d4d2dcf78ea
  event: Companions_Navigator_107
  text: '"Лик Ульфара озаряет пожар восходящего солнца, столь жаркое пламя сияет — аж больно смотреть. Но стоит пожару утихнуть, хоть на секунду, и тут же подложка из блеклой серости и мерзко-зеленой дымки окутывает его плечи. Никто вокруг этого не замечает..." {n}Кассия взмахивает ладонью, сбрасывая невидимую шаль с собственных плеч.{/n} "Но я вижу".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Лик Ульфара озаряет пожар восходящего солнца, столь жаркое пламя сияет — аж больно смотреть. Но стоит пожару утихнуть, хоть на секунду, и тут же подложка из блеклой серости и мерзко-зеленой дымки окутывает его плечи. Никто вокруг этого не замечает...
  - speaker: narrator
    text_clean: Кассия взмахивает ладонью, сбрасывая невидимую шаль с собственных плеч.
  - speaker: Cassia Orsellio
    text_clean: Но я вижу.
- guid: 7ccf7150-6707-45c6-80e3-de7628e6d5af
  event: Companions_Navigator_108
  text: '"Пепелище в душе Ульфара впитало блеклую серость, оставив после себя лишь угольные разводы. Они рвутся наружу, смазывают оттенки... И потускневшее золото уже не сияет столь ярко".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Пепелище в душе Ульфара впитало блеклую серость, оставив после себя лишь угольные разводы. Они рвутся наружу, смазывают оттенки... И потускневшее золото уже не сияет столь ярко.
- guid: 2ffbe0f0-ecd7-49ea-8b8a-ac863ead541b
  event: Companions_Navigator_109
  text: '"Уважаемый магос Ханейманн раздроблен, словно стекла прекрасного витража, рассыпавшиеся цветной мозаикой от удара. Яркие и манящие, его оттенки смешались в полнейшем беспорядке... Признаюсь, меня это озадачивает. Обычно сердца служителей Омниссии наполнены лишь алым и сталью".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Уважаемый магос Ханейманн раздроблен, словно стекла прекрасного витража, рассыпавшиеся цветной мозаикой от удара. Яркие и манящие, его оттенки смешались в полнейшем беспорядке... Признаюсь, меня это озадачивает. Обычно сердца служителей Омниссии наполнены лишь алым и сталью.
- guid: a385c998-ee61-49c5-b19c-098016ece797
  event: Companions_Navigator_11
  text: '"Сенешаль Версериан один из немногих, на чьи цвета приятно смотреть". {n}Строгий взгляд Кассии чуть теплеет.{/n} "Когда сенешаль говорит, вокруг разрастается кристальная прозрачность неба. Когда гневится — сгущаются синие тучи. Ну а в редкие минуты радости чистый отсвет розового заката лелеет душу тех, кто его окружает. Из всей вашей свиты, Лорд-капитан, я бы доверила свою жизнь лишь ему".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сенешаль Версериан один из немногих, на чьи цвета приятно смотреть.
  - speaker: narrator
    text_clean: Строгий взгляд Кассии чуть теплеет.
  - speaker: Cassia Orsellio
    text_clean: Когда сенешаль говорит, вокруг разрастается кристальная прозрачность неба. Когда гневится — сгущаются синие тучи. Ну а в редкие минуты радости чистый отсвет розового заката лелеет душу тех, кто его окружает. Из всей вашей свиты, Лорд-капитан, я бы доверила свою жизнь лишь ему.
- guid: d48da8ae-302b-4006-9695-dc85d37d35c5
  event: Companions_Navigator_110
  text: '"Цветные осколки витража взмыли вверх, окутав магоса Ханнеймана вихрем пестрящих домыслов. Серебряный отблеск металла уже не скрывает волнения. Как и алая роба не скрывает сомнений".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Цветные осколки витража взмыли вверх, окутав магоса Ханнеймана вихрем пестрящих домыслов. Серебряный отблеск металла уже не скрывает волнения. Как и алая роба не скрывает сомнений.
- guid: 90c81bfe-0881-4fd7-9f9d-6cc42a6b3127
  event: Companions_Navigator_111
  text: '"За мыслями цвета вороненой стали, за блеклым холодом сизых эмоций... В душе господина ван Калокса тлеет янтарный уголек — столь теплый и яркий, что хочется к нему прикоснуться". {n}Кассия завороженно смотрит вдаль, словно перед ней стоите не вы. Опомнившись, она опускает взгляд.{/n} "Печально, что господин дознаватель собственными руками топит его в бездонной синеве долга. Печально... Но я его понимаю".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: За мыслями цвета вороненой стали, за блеклым холодом сизых эмоций... В душе господина ван Калокса тлеет янтарный уголек — столь теплый и яркий, что хочется к нему прикоснуться.
  - speaker: narrator
    text_clean: Кассия завороженно смотрит вдаль, словно перед ней стоите не вы. Опомнившись, она опускает взгляд.
  - speaker: Cassia Orsellio
    text_clean: Печально, что господин дознаватель собственными руками топит его в бездонной синеве долга. Печально... Но я его понимаю.
- guid: 8c57a943-c36d-428a-80fb-60f52e85b7ba
  event: Companions_Navigator_112
  text: '"Эмоции Идиры подобны водовороту — яркие, необузданные, окутывающие фигуру, словно чудный калейдоскоп из пестрых оттенков... И столь же опасные, как завихрения варп-шторма. За бурей цветов от моего взора сокрыта истина, что именно правит этой женщиной — собственная воля? Или же..." {n}Кассия мнется.{/n} "Или же Имматериум, Лорд-капитан".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Эмоции Идиры подобны водовороту — яркие, необузданные, окутывающие фигуру, словно чудный калейдоскоп из пестрых оттенков... И столь же опасные, как завихрения варп-шторма. За бурей цветов от моего взора сокрыта истина, что именно правит этой женщиной — собственная воля? Или же...
  - speaker: narrator
    text_clean: Кассия мнется.
  - speaker: Cassia Orsellio
    text_clean: Или же Имматериум, Лорд-капитан.
- guid: df9e01f6-d371-40c4-b9c4-86fabe746306
  event: Companions_Navigator_113
  text: '"Идира... Пестрая пелена спала, и я наконец-то вижу за ней человека. Но что от него осталось? Бледная, бесцветная оболочка". {n}Рубиновые глаза полны сочувствия и печали.{/n} "Ее цвета тают на глазах, но я не в силах это остановить... Никто не в силах. Вскоре от псайкерши останется лишь серая тень".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Идира... Пестрая пелена спала, и я наконец-то вижу за ней человека. Но что от него осталось? Бледная, бесцветная оболочка.
  - speaker: narrator
    text_clean: Рубиновые глаза полны сочувствия и печали.
  - speaker: Cassia Orsellio
    text_clean: Ее цвета тают на глазах, но я не в силах это остановить... Никто не в силах. Вскоре от псайкерши останется лишь серая тень.
- guid: 0a9cead4-f6e4-4ad8-bafc-9f118818c127
  event: Companions_Navigator_114
  text: '"Постарайтесь не растерять небесно-голубой покров надежды, Лорд-капитан. Ибо рядом с вами светлее становятся и цвета других".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Постарайтесь не растерять небесно-голубой покров надежды, Лорд-капитан. Ибо рядом с вами светлее становятся и цвета других.
- guid: 7182fd33-8180-453c-bf8b-65362674afc3
  event: Companions_Navigator_115
  text: '{n}Удрученное молчание повисает в воздухе. Наконец Леди-Навигатор произносит:{/n} "Правда, Лорд-капитан. Признаться, меня уже многие годы преследуют странные фигуры — во снах, во время видений и прозрения варпа. Они тянутся ко мне, изнемогают, что-то кричат, но слов я не слышу. А одна из фигур, самая устрашающая, все время стоит поодаль и лишь осудительно смотрит".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: 'Удрученное молчание повисает в воздухе. Наконец Леди-Навигатор произносит:'
  - speaker: Cassia Orsellio
    text_clean: Правда, Лорд-капитан. Признаться, меня уже многие годы преследуют странные фигуры — во снах, во время видений и прозрения варпа. Они тянутся ко мне, изнемогают, что-то кричат, но слов я не слышу. А одна из фигур, самая устрашающая, все время стоит поодаль и лишь осудительно смотрит.
- guid: 97115ebd-5048-49d2-9f2c-950a02941b75
  event: Companions_Navigator_116
  text: '"Силы постепенно возвращаются ко мне, Лорд-капитан. И я вновь могу контролировать тело и мысли". {n}Кассия прикладывает руку к чуть сияющему {d|Encyclopedia:Ch3_CassiaAmuletLeft}артефакту под кожей{/d}.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Силы постепенно возвращаются ко мне, Лорд-капитан. И я вновь могу контролировать тело и мысли.
  - speaker: narrator
    text_clean: Кассия прикладывает руку к чуть сияющему артефакту под кожей.
- guid: 2fd11167-9ccb-458e-b44a-da411f7d3dde
  event: Companions_Navigator_117
  text: '"И все же вы не оставили меня во тьме, хоть и могли. Не лишили жизни, хоть ваше сердце и сжали антрацитовые тиски, а разум укутался в пунцовые сети". {n}Кассия отводит взгляд, стараясь прикрыть жгучий стыд всполохом растрепанных волос.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: И все же вы не оставили меня во тьме, хоть и могли. Не лишили жизни, хоть ваше сердце и сжали антрацитовые тиски, а разум укутался в пунцовые сети.
  - speaker: narrator
    text_clean: Кассия отводит взгляд, стараясь прикрыть жгучий стыд всполохом растрепанных волос.
- guid: 79cc21b3-7c11-4e90-becd-2cc9c6be5c14
  event: Companions_Navigator_118
  text: '"О чем вы говорите, Лорд-капитан?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: О чем вы говорите, Лорд-капитан?
- guid: cdda8caa-003b-4190-8bdb-47cf87ce4098
  event: Companions_Navigator_119
  text: '"Один из мудрейших экклезиархов сказал однажды, что все мы играем свои роли, незабвенно служа Императору. Иногда роли меняются, но вера — вера всегда остается" {n}Кассия чуть улыбается.{/n} "Слова Джай часто пестрили сомнительными красками, однако каждое произнесенное слово о Нем сияло белизной веры".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Один из мудрейших экклезиархов сказал однажды, что все мы играем свои роли, незабвенно служа Императору. Иногда роли меняются, но вера — вера всегда остается
  - speaker: narrator
    text_clean: Кассия чуть улыбается.
  - speaker: Cassia Orsellio
    text_clean: Слова Джай часто пестрили сомнительными красками, однако каждое произнесенное слово о Нем сияло белизной веры.
- guid: 425f9cc1-29ac-4802-a725-199d6454083c
  event: Companions_Navigator_12
  text: '"Как единственный глас династии на этом корабле — почту за честь. Покуда ваши вопросы учтивы, я отвечу на каждый из них".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как единственный глас династии на этом корабле — почту за честь. Покуда ваши вопросы учтивы, я отвечу на каждый из них.
- guid: 10297ca7-ab65-43dc-a6b6-d0fd17b184c3
  event: Companions_Navigator_120
  text: '"Вдобавок..." {n}Кассия медлит несколько секунд и отводит взгляд.{/n} "Мне известно, что низшие слуги Империума могут находить нашу внешность... отталкивающей. Ген {g|Encyclopedia:Navigator}навигатора{/g} искажает черты, привычные взору плебса, а величие нашей роли неподвластно их скудным умам..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вдобавок...
  - speaker: narrator
    text_clean: Кассия медлит несколько секунд и отводит взгляд.
  - speaker: Cassia Orsellio
    text_clean: Мне известно, что низшие слуги Империума могут находить нашу внешность... отталкивающей. Ген навигатора искажает черты, привычные взору плебса, а величие нашей роли неподвластно их скудным умам...
- guid: 3bf35f57-eafa-4a9e-857a-577948bfce99
  event: Companions_Navigator_121
  text: '"Это объясняет, почему чистые оттенки Сестры битвы были замутнены болотной жижей. Одна мысль о том, какие последствия имели ее деяния, приводит меня в ужас".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Это объясняет, почему чистые оттенки Сестры битвы были замутнены болотной жижей. Одна мысль о том, какие последствия имели ее деяния, приводит меня в ужас.
- guid: e83a37bc-2640-4469-92ad-4bef797b01cf
  event: Companions_Navigator_122
  text: '"Простите, Лорд-капитан. Я должна была узреть земельный оттенок предательства, скрипящий на ее зубах". {n}Кассия виновато поджимает губы.{/n} "Но цвета ксеносов такие... такие едкие. Разнообразие оттенков сводит с ума, стоит лишь задержать на них взгляд".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Простите, Лорд-капитан. Я должна была узреть земельный оттенок предательства, скрипящий на ее зубах.
  - speaker: narrator
    text_clean: Кассия виновато поджимает губы.
  - speaker: Cassia Orsellio
    text_clean: Но цвета ксеносов такие... такие едкие. Разнообразие оттенков сводит с ума, стоит лишь задержать на них взгляд.
- guid: 09e90ddf-de29-483b-8352-ea34f79229f1
  event: Companions_Navigator_123
  text: '"Возможно ли словами описать счастье быть свободной?" {n}Кассия устало улыбается, осматривая раны, что сама себе нанесла.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Возможно ли словами описать счастье быть свободной?
  - speaker: narrator
    text_clean: Кассия устало улыбается, осматривая раны, что сама себе нанесла.
- guid: 009ce164-cfd2-466f-a5e1-09dcee471643
  event: Companions_Navigator_123
  text: '"Возможно ли словами описать счастье быть свободной?" {n}Кассия прикладывает руку к месту, где {d|Encyclopedia:Ch3_CassiaAmuletBroken}еще недавно сиял артефакт{/d}, и мягко улыбается.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Возможно ли словами описать счастье быть свободной?
  - speaker: narrator
    text_clean: Кассия прикладывает руку к месту, где еще недавно сиял артефакт, и мягко улыбается.
- guid: 617f6eb6-9cb5-488f-b074-d07408788bb0
  event: Companions_Navigator_124
  text: '"Вы дали мне сил сбросить с души гнет оков, насланных коварством Фелека. Разрушить темницу собственных страхов. И я желаю отплатить вам тем же". {n}Кассия протягивает руку к вашему лбу, останавливаясь на полпути.{/n} "Скинуть с плеч увядающий пурпур этого места. Разорвать удушающе-бурый ошейник... Если, конечно, вы мне позволите".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы дали мне сил сбросить с души гнет оков, насланных коварством Фелека. Разрушить темницу собственных страхов. И я желаю отплатить вам тем же.
  - speaker: narrator
    text_clean: Кассия протягивает руку к вашему лбу, останавливаясь на полпути.
  - speaker: Cassia Orsellio
    text_clean: Скинуть с плеч увядающий пурпур этого места. Разорвать удушающе-бурый ошейник... Если, конечно, вы мне позволите.
- guid: 16e3c768-0347-4928-99b0-fe39c92517fd
  event: Companions_Navigator_125
  text: '"Где-то посреди Темного города, я полагаю. Говорят, человеческому разуму не осознать границы сего места, ибо величайшие ульи Империума на его фоне кажутся песчинками. Попасть сюда можно лишь через древние эльдарские врата — Врата Паутины... Вы и сами понимаете, что это для нас значит".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Где-то посреди Темного города, я полагаю. Говорят, человеческому разуму не осознать границы сего места, ибо величайшие ульи Империума на его фоне кажутся песчинками. Попасть сюда можно лишь через древние эльдарские врата — Врата Паутины... Вы и сами понимаете, что это для нас значит.
- guid: c70510e8-649b-4a41-a8e2-601160df6a5c
  event: Companions_Navigator_126
  text: '{n}Кассия отдергивает руку, словно ошпаренная.{/n} "Простите, я думала, раз вы мне помогли... Н-не важно. Забудьте об этом".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия отдергивает руку, словно ошпаренная.
  - speaker: Cassia Orsellio
    text_clean: Простите, я думала, раз вы мне помогли... Н-не важно. Забудьте об этом.
- guid: 9a188f08-d105-4daf-8ef1-077b9cffd290
  event: Companions_Navigator_127
  text: '"Я подумала ровно о том же. Но разве подобное предположение не слишком безумно даже для навигатора? Или я просто схожу с ума, подобно негодным отпрыскам моего рода?" {n}Отчаяние сквозит в словах Кассии. Заглядывая вам в глаза, она словно ждет опровержение собственных опасений.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я подумала ровно о том же. Но разве подобное предположение не слишком безумно даже для навигатора? Или я просто схожу с ума, подобно негодным отпрыскам моего рода?
  - speaker: narrator
    text_clean: Отчаяние сквозит в словах Кассии. Заглядывая вам в глаза, она словно ждет опровержение собственных опасений.
- guid: 112d0db8-21cc-4d64-b01b-ce044bdb27a7
  event: Companions_Navigator_128
  text: '"Тогда..." {n}Кассия облегченно выдыхает.{/n} "Тогда я приложу все усилия, дабы избавиться от этого проклятого наваждения".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Тогда...
  - speaker: narrator
    text_clean: Кассия облегченно выдыхает.
  - speaker: Cassia Orsellio
    text_clean: Тогда я приложу все усилия, дабы избавиться от этого проклятого наваждения.
- guid: 517a59a0-b41e-4861-9689-125e9bff2b0c
  event: Companions_Navigator_129
  text: '{n}Лицо Кассии кривится в секундной гримасе.{/n} "Я не желаю более продолжать эту тему".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Лицо Кассии кривится в секундной гримасе.
  - speaker: Cassia Orsellio
    text_clean: Я не желаю более продолжать эту тему.
- guid: db0d889b-ec4e-4172-ab7e-2e9c29e46854
  event: Companions_Navigator_13
  text: '"О да! Навигаторы Дома прибыли в {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g} относительно недавно — всего двести восемь лет назад. До того множество веков наши предки во славу Императора расширяли пределы владений Человечества, прокладывая маршруты в самые разные уголки галактики".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: О да! Навигаторы Дома прибыли в Простор Коронус относительно недавно — всего двести восемь лет назад. До того множество веков наши предки во славу Императора расширяли пределы владений Человечества, прокладывая маршруты в самые разные уголки галактики.
- guid: 852b6a0c-9c3b-4247-8f3f-d3ef5f4c63e5
  event: Companions_Navigator_130
  text: '"Вы весьма проницательны. Мой прародитель действительно проложил сей маршрут, спасаясь от врагов Человечества. Говорят, его вел сам {g|Encyclopedia:Emperor}Император{/g}, ибо {g|Encyclopedia:Warp}варп{/g} изверг судно без единой потери". {n}Кассия медлит, но тихо добавляет:{/n} "К сожалению, из уст тех, кто рассказывает эту версию истории, извергается ядовито-зеленая спесь. Я думаю, Калейн Орселлио просто был умелым навигатором".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы весьма проницательны. Мой прародитель действительно проложил сей маршрут, спасаясь от врагов Человечества. Говорят, его вел сам Император, ибо варп изверг судно без единой потери.
  - speaker: narrator
    text_clean: 'Кассия медлит, но тихо добавляет:'
  - speaker: Cassia Orsellio
    text_clean: К сожалению, из уст тех, кто рассказывает эту версию истории, извергается ядовито-зеленая спесь. Я думаю, Калейн Орселлио просто был умелым навигатором.
- guid: 7e0447e3-d62a-4eef-a4eb-1956cc3fba1a
  event: Companions_Navigator_131
  text: '"Любовь моя, рядом с вами мой мир наполняется удивительным калейдоскопом красок". {n}Чарующая улыбка касается нежных губ.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Любовь моя, рядом с вами мой мир наполняется удивительным калейдоскопом красок.
  - speaker: narrator
    text_clean: Чарующая улыбка касается нежных губ.
- guid: 69de394d-8ed5-4233-a7c9-210abedb2f18
  event: Companions_Navigator_132
  text: '"Дому понадобится какое-то время на восстановление, но оставшись без главного Атласа... и своего главного страха — меня — кланы Дома смогут примириться вновь. Быть может, даже найдут способ вернуться на ту злосчастную планету посреди варп-шторма и уничтожить эльдарский камень... Или использовать его силу. Но я все же надеюсь, что Атлас Звездных Путей сгинет вместе с нынешним поколением навигаторов Дома Орселлио. И для нашего... их Дома наступит новая эра".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Дому понадобится какое-то время на восстановление, но оставшись без главного Атласа... и своего главного страха — меня — кланы Дома смогут примириться вновь. Быть может, даже найдут способ вернуться на ту злосчастную планету посреди варп-шторма и уничтожить эльдарский камень... Или использовать его силу. Но я все же надеюсь, что Атлас Звездных Путей сгинет вместе с нынешним поколением навигаторов Дома Орселлио. И для нашего... их Дома наступит новая эра.
- guid: e9268358-44f9-4be4-a0d7-602e1257af11
  event: Companions_Navigator_133
  text: '"Н-нет? Нет, я так не думаю". {n}Кассия неуверенно мнется на месте, не находясь, что еще ответить.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Н-нет? Нет, я так не думаю.
  - speaker: narrator
    text_clean: Кассия неуверенно мнется на месте, не находясь, что еще ответить.
- guid: 60b1dfb8-361e-45e5-80b9-bd7b2e6e56d9
  event: Companions_Navigator_134
  text: '"Разве же я могу отвечать за чувства и интенции другого человека?" {n}Кассия старается держаться безразлично, однако брови ее заинтригованно приподнимаются.{/n} "Но раз уж вы спросили... Я считаю, ваш друг должен осознать всю серьезность сего ритуала. Имморталиум — многогранный подарок, он не может означать что-то одно. Готов ли ваш друг принять все его стороны? Только одну? Или же... не принять вовсе?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Разве же я могу отвечать за чувства и интенции другого человека?
  - speaker: narrator
    text_clean: Кассия старается держаться безразлично, однако брови ее заинтригованно приподнимаются.
  - speaker: Cassia Orsellio
    text_clean: Но раз уж вы спросили... Я считаю, ваш друг должен осознать всю серьезность сего ритуала. Имморталиум — многогранный подарок, он не может означать что-то одно. Готов ли ваш друг принять все его стороны? Только одну? Или же... не принять вовсе?
- guid: b5d84cf4-39a8-4266-b2ae-b6bc6098aff7
  event: Companions_Navigator_135
  text: '"П-правда?" {n}Кассия склоняет голову на бок и скромно улыбается, хоть в ее глазах вы и читаете легкое разочарование.{/n} "Ну а я в свою очередь с удовольствием принимаю вашу. И надеюсь, что особая связь между нами и нашими династиями продержится не одно столетие".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: П-правда?
  - speaker: narrator
    text_clean: Кассия склоняет голову на бок и скромно улыбается, хоть в ее глазах вы и читаете легкое разочарование.
  - speaker: Cassia Orsellio
    text_clean: Ну а я в свою очередь с удовольствием принимаю вашу. И надеюсь, что особая связь между нами и нашими династиями продержится не одно столетие.
- guid: eee08553-f453-48fc-904c-fbb55a5649c1
  event: Companions_Navigator_136
  text: '"Если вам так угодно, Лорд-капитан".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Если вам так угодно, Лорд-капитан.
