- guid: b723b1aa-d959-4733-9e27-ea6e504ecfc7
  event: RMNC_Cassia_StartingEventCassia_06
  text: '"Что вы, ни в коей мере". {n}Девушка благосклонно кивает своему молчаливому слуге.{/n} "Просто Уве и в одиночку прекрасно справляется. Он уже привык к моим... моим капризам и предпочтениям".'
