  event: ''
  text: '"Какой интересный... сборник. Прошу, расскажите нам больше!" {n}Кассия робко подается вперед, и историк, мягко улыбаясь, показывает ей несколько блеклых страниц.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Какой интересный... сборник. Прошу, расскажите нам больше!
  - speaker: narrator
    text_clean: Кассия робко подается вперед, и историк, мягко улыбаясь, показывает ей несколько блеклых страниц.
- guid: 1d096c79-a2e3-4c3f-9525-84c7a4ffd614
  event: ''
  text: '"Ах!.." {n}Кассия щурится и быстро отводит взгляд.{/n} "Желтый, красный, лиловый, оранжевый, синий... Дикие цвета, готовые выжечь глаза. Но там, где заканчиваются пестрые маски, остается лишь бесцветная пустота".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ах!..
  - speaker: narrator
    text_clean: Кассия щурится и быстро отводит взгляд.
  - speaker: Cassia Orsellio
    text_clean: Желтый, красный, лиловый, оранжевый, синий... Дикие цвета, готовые выжечь глаза. Но там, где заканчиваются пестрые маски, остается лишь бесцветная пустота.
