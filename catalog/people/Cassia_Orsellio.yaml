  event: Companions_Navigator_69
  text: '{n}Несколько секунд Кассия испытующе смотрит вам в глаза, затем коротко кивает и отводит взгляд.{/n} "Какой разговор?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Несколько секунд Кассия испытующе смотрит вам в глаза, затем коротко кивает и отводит взгляд.
  - speaker: Cassia Orsellio
    text_clean: Какой разговор?
- guid: 58938003-a873-4f5e-b817-ec76c2cc9114
  event: Companions_Navigator_70
  text: '{n}Кассия коротко кивает.{/n} "А мой Атлас... намного сильнее прочих. Атлас самой Тисифоны — так всю жизнь шептались за моей спиной, хоть наверняка никто и не знал. А я... всегда подозревала. Просто не хотела признаваться самой себе".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия коротко кивает.
  - speaker: Cassia Orsellio
    text_clean: А мой Атлас... намного сильнее прочих. Атлас самой Тисифоны — так всю жизнь шептались за моей спиной, хоть наверняка никто и не знал. А я... всегда подозревала. Просто не хотела признаваться самой себе.
