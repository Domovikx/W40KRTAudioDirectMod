  event: Companions_Navigator_149
  text: '{n}Кассия понимающе улыбается.{/n} "В таком случае, Лорд-капитан, я бы хотела провести немного времени наедине. И обдумать... случившееся".'
  speaker: Cassia Orsellio
  parts:
