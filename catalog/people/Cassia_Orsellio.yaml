  text: '{n}Когда прохладная ладонь Леди Кассии согревается в ваших руках, девушка неловко высвобождает ее, стараясь не задеть вас острыми когтями.{/n} "Я... С вашего позволения, Лорд-капитан, я бы хотела провести немного времени наедине. И обдумать... случившееся".'
