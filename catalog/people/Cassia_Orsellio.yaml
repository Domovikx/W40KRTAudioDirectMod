  event: Companions_Navigator_71
  text: '{n}Кассия улыбается — намного ярче и теплее, чем обычно.{/n} "Я благодарна судьбе, что у меня есть {mf|друг|подруга}, с котор{mf|ым|ой} я могу делиться своими мыслями".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия улыбается — намного ярче и теплее, чем обычно.
  - speaker: Cassia Orsellio
    text_clean: Я благодарна судьбе, что у меня есть друг, с которым я могу делиться своими мыслями.
- guid: 7721cf94-3b3b-45d4-933a-09e7ec4ecf81
  event: Companions_Navigator_72
  text: '"Некоторые навигаторы моего Дома не раз пытались меня убить!" {n}Серебристые брови девушки гневно хмурятся, затем она печально вздыхает.{/n} "Однако истории о жестокости Тисифоны... Я начинаю думать — а что, если все они правдивы? И я стану для своих подданных новым мучителем?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Некоторые навигаторы моего Дома не раз пытались меня убить!
  - speaker: narrator
    text_clean: Серебристые брови девушки гневно хмурятся, затем она печально вздыхает.
  - speaker: Cassia Orsellio
    text_clean: Однако истории о жестокости Тисифоны... Я начинаю думать — а что, если все они правдивы? И я стану для своих подданных новым мучителем?
- guid: 5a2a73d8-8530-4821-8e07-941588bf51e1
  event: Companions_Navigator_73
  text: '"Я не... Я имела в виду..." {n}Сердце пропускает удар, жар окутывает плечи, горло и грудь, голову туманит — уже знакомое влияние сил Кассии пьянит ваш разум больше обычного.{/n} "Мне... спокойно в вашей компании". {n}Кассия отводит взгляд, бледные щеки наливаются легким румянцем.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я не... Я имела в виду...
  - speaker: narrator
    text_clean: Сердце пропускает удар, жар окутывает плечи, горло и грудь, голову туманит — уже знакомое влияние сил Кассии пьянит ваш разум больше обычного.
