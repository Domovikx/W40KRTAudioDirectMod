  event: CH1_CassiaScared_01
  text: '{n}Теобальд харкает синеватой кровью — бронепластина на его груди пробита в нескольких местах, а вместо живота — месиво из металла и кишок. Когда белесые глаза {g|Encyclopedia:Navigator}навигатора{/g} находят Кассию, он едва слышно хрипит:{/n} "Теперь... это твоя ноша, Дитя... Выживи. Вернись в лоно Дома, как... как того требует твое предназначение..."'
  speaker: Cassia Orsellio
