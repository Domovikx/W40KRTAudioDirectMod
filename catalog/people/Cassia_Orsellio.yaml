- guid: 00074f46-4e59-4dcd-b118-d535a7673eba
  event: ''
  text: '{n}Кассия сдержанно улыбается.{/n} "В золотистых всполохах ваших мыслей я предвидела этот ответ".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия сдержанно улыбается.
  - speaker: Cassia Orsellio
    text_clean: В золотистых всполохах ваших мыслей я предвидела этот ответ.
- guid: 006b1484-616b-4271-b3c8-7471b04522d8
  event: ''
  text: '"О чем это вы? Я — Кассия Орселлио, одна из наследников Дома Орселлио. Я не чудовище, и уж тем более никого никогда не мучала! Да я... я всю жизнь прожила на Эурак-V, в обществе Теобальда и Фелека. И до сего дня оба пребывали в добром здравии!" {n}Кассия гневно кивает в сторону Фелека.{/n} "И теперь я об этом жалею. Вижу, вас окутали ядовито-зелелые кольца обмана. Фелек солгал вам... Так же, как лгал и мне все это время".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: О чем это вы? Я — Кассия Орселлио, одна из наследников Дома Орселлио. Я не чудовище, и уж тем более никого никогда не мучала! Да я... я всю жизнь прожила на Эурак-V, в обществе Теобальда и Фелека. И до сего дня оба пребывали в добром здравии!
  - speaker: narrator
    text_clean: Кассия гневно кивает в сторону Фелека.
  - speaker: Cassia Orsellio
    text_clean: И теперь я об этом жалею. Вижу, вас окутали ядовито-зелелые кольца обмана. Фелек солгал вам... Так же, как лгал и мне все это время.
- guid: 02c372a2-f8af-4624-8ad6-453621db14f3
  event: ''
  text: '"Безумный Навигатор!" {n}Кассия прикрывает руками губы, словно смутившись собственного выкрика.{/n} "Мне доводилось читать о нем и его изысканиях... пускай его считали безумцем, но именно его теоретические выкладки привели к поиску — и обнаружению — безопасного маршрута между Каликсисом и Простором Коронус..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Безумный Навигатор!
  - speaker: narrator
    text_clean: Кассия прикрывает руками губы, словно смутившись собственного выкрика.
  - speaker: Cassia Orsellio
    text_clean: Мне доводилось читать о нем и его изысканиях... пускай его считали безумцем, но именно его теоретические выкладки привели к поиску — и обнаружению — безопасного маршрута между Каликсисом и Простором Коронус...
- guid: 05b30866-1a25-4b97-b4de-6a2f28c93d7e
  event: ''
  text: '{n}Кассия взволнованно прикладывает тонкие пальцы к губам и опускает взгляд.{/n} "Я... особенно рада вашему возвращению, Лорд-капитан. Надеюсь, у вас найдется минутка... когда вы покончите с делами..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия взволнованно прикладывает тонкие пальцы к губам и опускает взгляд.
  - speaker: Cassia Orsellio
    text_clean: Я... особенно рада вашему возвращению, Лорд-капитан. Надеюсь, у вас найдется минутка... когда вы покончите с делами...
- guid: 062ea631-f60b-4d46-9207-2d2b239a52f9
  event: ''
  text: '"Я... вижу это в ваших цветах. Нежные, теплые оттенки... И яркие всполохи, когда вы вот так смотрите на меня, {name}. Я тоже... тоже чувствую себя рядом с вами счастливой! И потому боюсь привыкнуть к этому чувству. Цвета счастья... слишком быстротечны". {n}Кассия дарит вам нежный взгляд и неуверенную улыбку.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... вижу это в ваших цветах. Нежные, теплые оттенки... И яркие всполохи, когда вы вот так смотрите на меня, КЭП. Я тоже... тоже чувствую себя рядом с вами счастливой! И потому боюсь привыкнуть к этому чувству. Цвета счастья... слишком быстротечны.
  - speaker: narrator
    text_clean: Кассия дарит вам нежный взгляд и неуверенную улыбку.
- guid: 06eaf346-e04a-4ea3-a45b-68296ff40457
  event: ''
  text: '"Я не знаю, что ждет нас в будущем. Но я готова рискнуть... и узнать это вместе с вами, любовь моя". {n}Кассия накрывает вашу ладонь своей, и ноги ее предательски подкашиваются.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я не знаю, что ждет нас в будущем. Но я готова рискнуть... и узнать это вместе с вами, любовь моя.
  - speaker: narrator
    text_clean: Кассия накрывает вашу ладонь своей, и ноги ее предательски подкашиваются.
- guid: 078dedad-2406-434b-a6f3-2626f1d54cfe
  event: ''
  text: '{n}Кассия испуганно отступает, обнимая себя за плечи и избегая вашего взгляда.{/n} "Простите... Простите меня, {name}. Я правда... не желала вам зла".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия испуганно отступает, обнимая себя за плечи и избегая вашего взгляда.
  - speaker: Cassia Orsellio
    text_clean: Простите... Простите меня, КЭП. Я правда... не желала вам зла.
