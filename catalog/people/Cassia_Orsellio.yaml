  event: Companions_Navigator_152
  text: '"Прямо... здесь? Вы уверены?" {n}Кассия смущенно оглядывается по сторонам.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Прямо... здесь? Вы уверены?
  - speaker: narrator
