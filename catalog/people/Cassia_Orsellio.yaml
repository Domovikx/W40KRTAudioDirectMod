    text_clean: Иногда я задаюсь вопросом — насколько мы по-разному ощущаем варп?
- guid: 31c93418-2c25-4240-91ea-588e4ea260c9
  event: BNTRS_Stressful_Cassia_45
  text: '"За пестрыми красками твоей души мне видятся совсем иные оттенки. Меньше золота и серебра, и все больше..."'
  speaker: Cassia Orsellio
  parts:
