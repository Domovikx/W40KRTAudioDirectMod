  event: Companions_Navigator_139
  text: '"Вы... не знаете, что такое имморталиум?" {n}Кассия чуть разочарованно склоняет голову.{/n} "У него существует и другое название — "бессмертный цветок". Живое растение, способное столетия обитать в пустоте космоса. Это... символ начала и старинный ритуал. Отправная точка, в которой зарождаются отношения двух особ, отличные от вежливого безразличия".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы... не знаете, что такое имморталиум?
