  event: Companions_Navigator_14
  text: '{n}Девушка резко втягивает воздух, между бровей на секунду возникает морщинка.{/n} "Жизнь дана {g|Encyclopedia:Navigator}навигатору{/g} лишь для служения Дому. Каждый вздох, каждое слово, каждое деяние наше — во благо и преуспеяние его. Взирая на меня, не видя Дома, вы видите лишь тень преходящего. Если вам важно лишь это — спрашивайте".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Девушка резко втягивает воздух, между бровей на секунду возникает морщинка.
