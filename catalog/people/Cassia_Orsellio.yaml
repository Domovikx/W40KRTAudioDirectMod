  text: '{n}Каждое слово набатом отдается в голове — словно их подхватывают {d|Encyclopedia:Prologue_CutByKnife}мириады голосов{/d}, звенящих в ваших ушах. На мгновение вы теряете ориентацию в пространстве — кажется, словно этот нечестивый хор пытается опутать вас звучанием, не предназначенным для этого мира.{/n}'
