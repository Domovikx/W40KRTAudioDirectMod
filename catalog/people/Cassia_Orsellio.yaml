  event: BNTRS_Stressful_Cassia_60
  text: '"И снова вы прочли мое настроение, словно открытую книгу, мастер ван Калокс. Мои глаза... им все еще больно от пестрого калейдоскопа красок, которыми полнится мир".'
  speaker: Cassia Orsellio
  parts:
