- guid: 9b21e432-3622-43bb-9efa-fc3c95fb5c4e
  event: RMNC_Cassia_StartingEventCassia_07
  text: '"На этом корабле обитают люди куда более несдержанные и опасные для окружающих. И куда менее преданные Богу-Императору, нежели герольд Навис Нобилите". {n}Кассия вскидывает голову и выпрямляется во весь рост.{/n} "Но я и без слов вижу оттенки бурого беспокойства, что вихрем трепещут вокруг ваших подданных, когда я рядом. Не будь я привычна к подобной реакции... сочла бы и их поведение, и ваш вопрос оскорбительными".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: На этом корабле обитают люди куда более несдержанные и опасные для окружающих. И куда менее преданные Богу-Императору, нежели герольд Навис Нобилите.
