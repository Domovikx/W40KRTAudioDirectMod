- guid: 49a90a89-d548-490a-a388-16d9d7d52b30
  event: Companions_Navigator_143
  text: '{n}Леди-Навигатор загадочно щурится.{/n} "Я бы выбрала то, что вызывает у одариваемого особый отклик в душе. То, о чем он или она часто говорит... или мечтает".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Леди-Навигатор загадочно щурится.
  - speaker: Cassia Orsellio
    text_clean: Я бы выбрала то, что вызывает у одариваемого особый отклик в душе. То, о чем он или она часто говорит... или мечтает.
- guid: 2e8145f5-3cf8-4ab1-89fa-ef7922d4679c
  event: Companions_Navigator_144
  text: '"Я вижу эмоции людей в пестрых оттенках, что окружают их естество, Лорд-капитан. И все понимаю. Однако же мне пришлась по нраву эта игра. Надеюсь... и вам тоже".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я вижу эмоции людей в пестрых оттенках, что окружают их естество, Лорд-капитан. И все понимаю. Однако же мне пришлась по нраву эта игра. Надеюсь... и вам тоже.
- guid: 8ca23ef4-3cc0-486c-a8e3-9de400cdf6da
  event: Companions_Navigator_145
  text: '"Простите, {name}, но та ночь... никак не выходит из головы. Мне нужно еще немного времени, чтобы собраться с мыслями. Прошу, не торопите меня столь настойчиво".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Простите, КЭП, но та ночь... никак не выходит из головы. Мне нужно еще немного времени, чтобы собраться с мыслями. Прошу, не торопите меня столь настойчиво.
