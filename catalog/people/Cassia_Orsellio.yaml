- guid: c80c87e8-4341-45bf-bbb0-285bf0a3533b
  event: Companions_Navigator_138
  text: '"Тогда, по правилам ритуала, ему следует преподнести в ответ дар не менее ценный по вкладу душевному или материальному. И если вам... вашему другу интересно, традиции требуют делать это через третье лицо. Таким образом даритель и одариваемый сохраняют баланс в отношениях".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Тогда, по правилам ритуала, ему следует преподнести в ответ дар не менее ценный по вкладу душевному или материальному. И если вам... вашему другу интересно, традиции требуют делать это через третье лицо. Таким образом даритель и одариваемый сохраняют баланс в отношениях.
