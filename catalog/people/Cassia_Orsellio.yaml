  event: ''
  text: '{n}Кассия аккуратно накрывает вашу ладонь своей и с облегчением выдыхает.{/n} "Вы живы... Слава Императору, вы живы, {name}".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия аккуратно накрывает вашу ладонь своей и с облегчением выдыхает.
  - speaker: Cassia Orsellio
    text_clean: Вы живы... Слава Императору, вы живы, КЭП.
- guid: 0a6b2830-ec01-47e8-b27b-6b67a7192b7c
  event: ''
  text: '{n}Кассия кривится, словно от кислого фрукта.{/n} "Твои подданные искусно перекрашивают обременяющую их карминовую тайну в золотое сияние веры. Ответ без вопроса. Вопрос — без ответа".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия кривится, словно от кислого фрукта.
  - speaker: Cassia Orsellio
    text_clean: Твои подданные искусно перекрашивают обременяющую их карминовую тайну в золотое сияние веры. Ответ без вопроса. Вопрос — без ответа.
- guid: 0d662175-b50e-4138-b3a3-dbecb4ed4186
  event: ''
  text: '{n}Кассия рассматривает пленницу с неожиданным высокомерием во взгляде.{/n} "Ярчайшая душа... Ржавая злоба, золотая вера и жажда власти, укрывающая все это в благородный пурпур. Эта женщина невероятно опасна, Лорд-капитан". {n}Она делает шаг вперед, прикасаясь к повязке, скрывающей третье око.{/n} "Вы будете честны, как подобает наследнице фон Валанциус, или мне взглянуть на вашу суть... более пристально?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия рассматривает пленницу с неожиданным высокомерием во взгляде.
  - speaker: Cassia Orsellio
    text_clean: Ярчайшая душа... Ржавая злоба, золотая вера и жажда власти, укрывающая все это в благородный пурпур. Эта женщина невероятно опасна, Лорд-капитан.
  - speaker: narrator
    text_clean: Она делает шаг вперед, прикасаясь к повязке, скрывающей третье око.
  - speaker: Cassia Orsellio
    text_clean: Вы будете честны, как подобает наследнице фон Валанциус, или мне взглянуть на вашу суть... более пристально?
