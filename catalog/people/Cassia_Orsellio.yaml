- guid: 9cbaa882-0f39-4c6f-88e8-c994322fcf53
  event: Companions_Navigator_16
  text: '"Отнюдь. Согласно хроникам Дома, я родилась на одном из миров Орселлио. Вирт... Иртви... О, как же..." {n}Кассия растерянно потирает висок.{/n} "Прошу меня простить, Лорд-капитан, воспоминания о детстве слишком расплывчаты. Иногда во сне я вижу пестрых птиц, что гнездились в саду. Или слуг в пурпурных ливреях. Или синий туман, что стелился над низиной за нашим дворцом... Но все подернуто розовой дымкой — быть может, эти картины рисует мое воображение, а не истинная память".'
