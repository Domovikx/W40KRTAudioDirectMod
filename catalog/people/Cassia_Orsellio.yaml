  event: BNTRS_Stressful_Cassia_53
  text: '"Меня учили, что ксеносы — богомерзкие создания. Но вот ты не выглядишь ужасающе. Скорее... необычно. Как и я".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Меня учили, что ксеносы — богомерзкие создания. Но вот ты не выглядишь ужасающе. Скорее... необычно. Как и я.
