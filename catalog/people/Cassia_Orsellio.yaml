  event: Companions_Navigator_75
  text: '"...и объединяющие тысячи миров Империума. Дом Орселлио связан торговыми пактами с Домами Галлиатис, Хортинер, Дротус и..." {n}Кассия умолкает на секунду.{/n} "На вашей шее затягивается синий узел, Лорд-капитан. Вижу, мой ответ не удовлетворяет вашу жажду познания. Что именно вы хотите услышать?"'
