  event: Companions_Navigator_142
  text: '"Что вы, конечно, нет!" {n}Кассия почти вскрикивает, но тут же смущенно отводит взгляд.{/n} "Имморталиум — это символ начала. Отправная точка, в которой зарождаются отношения двух особ, отличные от вежливого безразличия. Пока что это лишь семя, которое вашему другу предстоит взрастить. А вырастет из него ядовитый плющ или прекрасный цветок — покажет лишь время".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Что вы, конечно, нет!
