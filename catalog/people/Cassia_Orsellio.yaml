  text: '{n}Тело Навигатора взрывается движением: резкий рывок вперед, назад, снова вперед — под хруст костей и треск раздираемой кожи. Все же сращение с сидением оказывается крепче этих бешеных порывов: мутант остается на своем месте, до предела подавшись вперед в своих многослойных одеяниях, медленно окрашивающихся багровым. Жаберные решетки разрываются, образуя два уродливых визжащих рта-провала.{/n} "Падите на колени, смертные, и узрите последний восход!"'
