  event: ''
  text: '{n}Кассия мрачнеет.{/n} "На этой станции злословцам скармливают их собственные языки и за меньшую дерзость. А затем отправляют в шлю..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия мрачнеет.
  - speaker: Cassia Orsellio
    text_clean: На этой станции злословцам скармливают их собственные языки и за меньшую дерзость. А затем отправляют в шлю...
- guid: 0efc80e7-7a44-4c6c-ac8f-a90121298fb8
  event: ''
  text: '{n}Кассия прикрывает ладонью лицо, словно прячась от палящего солнца. Но вы понимаете, что она пытается скрыть смятение.{/n} "И правда. Я прежде никогда не касалась воды".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия прикрывает ладонью лицо, словно прячась от палящего солнца. Но вы понимаете, что она пытается скрыть смятение.
  - speaker: Cassia Orsellio
    text_clean: И правда. Я прежде никогда не касалась воды.
- guid: 0f389cf9-6269-4b4e-b0a0-ab09a0d3e31f
  event: ''
  text: '"Лорд-капитан". {n}Кассия учтиво кивает.{/n} "Встретив вас на Эурак-V, я и не подозревала, что однажды окажусь на пороге великой битвы. Обуревает ли мое сердце сизый трепет сомнений и страха? Пожалуй. Хотела бы я повернуть время вспять?" {n}Горькая улыбка касается губ Леди-Навигатора.{/n} "Никогда".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Лорд-капитан.
  - speaker: narrator
    text_clean: Кассия учтиво кивает.
  - speaker: Cassia Orsellio
    text_clean: Встретив вас на Эурак-V, я и не подозревала, что однажды окажусь на пороге великой битвы. Обуревает ли мое сердце сизый трепет сомнений и страха? Пожалуй. Хотела бы я повернуть время вспять?
  - speaker: narrator
    text_clean: Горькая улыбка касается губ Леди-Навигатора.
  - speaker: Cassia Orsellio
    text_clean: Никогда.
- guid: 0f5bd5f8-58ed-46a4-8720-4e527a90d06a
  event: ''
  text: '"Ваша доброта не знает границ, {name}". {n}Кассия опускает серебряные ресницы.{/n} "Я постараюсь не доставлять вам более хлопот..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваша доброта не знает границ, КЭП.
  - speaker: narrator
    text_clean: Кассия опускает серебряные ресницы.
  - speaker: Cassia Orsellio
    text_clean: Я постараюсь не доставлять вам более хлопот...
- guid: 10b6fb6a-e3d8-45d5-b410-97eb2339e715
  event: ''
  text: '{n}Кассия с трудом фокусирует на вас взгляд. Непривычное выражение отпечатывается на ее бледном вытянутом лице — жесткое, уверенное, властное. С таким же встретила вас Теодора фон Валанциус в первую встречу.{/n} "А себя вы в силах спасти из этого места, Лорд-капитан?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия с трудом фокусирует на вас взгляд. Непривычное выражение отпечатывается на ее бледном вытянутом лице — жесткое, уверенное, властное. С таким же встретила вас Теодора фон Валанциус в первую встречу.
  - speaker: Cassia Orsellio
    text_clean: А себя вы в силах спасти из этого места, Лорд-капитан?
- guid: 11e57e3d-eaef-4196-9705-c82d14dfbe9e
  event: ''
  text: '"Какой позор..." {n}Кассия прикрывает глаза ладонью, и исходящая от нее ярость стискивает ваше сердце.{/n} "Все эти годы Дом Орселлио строил свое величие на лжи и предательстве... Не только собственного рода, но и Империума!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Какой позор...
  - speaker: narrator
    text_clean: Кассия прикрывает глаза ладонью, и исходящая от нее ярость стискивает ваше сердце.
  - speaker: Cassia Orsellio
    text_clean: Все эти годы Дом Орселлио строил свое величие на лжи и предательстве... Не только собственного рода, но и Империума!
- guid: 13e84039-c97d-4953-b8b8-8fd92fcb8fd6
  event: ''
  text: '{n}Кассия задумчиво кивает.{/n} "Пришло время самого важного урока, Лорд-капитан. Благодаря вам я здесь — и ко всему готова".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия задумчиво кивает.
  - speaker: Cassia Orsellio
    text_clean: Пришло время самого важного урока, Лорд-капитан. Благодаря вам я здесь — и ко всему готова.
- guid: 144b41b1-923b-4f23-96ca-db71ed8c6fa9
  event: ''
  text: '{n}Кассия наслаждается каждым глотком свежего воздуха, чуть опустив веки и прислушиваясь к пению птиц, скрытых от вашего взора кронами деревьев. Когда кончики ваших пальцев едва заметно соприкасаются, Кассия вздрагивает... но не отводит руки. В смущенном молчании несколько минут проносятся считанными секундами, и девушка чуть отстраняется.{/n} "Здесь... умиротворенно, не находите?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия наслаждается каждым глотком свежего воздуха, чуть опустив веки и прислушиваясь к пению птиц, скрытых от вашего взора кронами деревьев. Когда кончики ваших пальцев едва заметно соприкасаются, Кассия вздрагивает... но не отводит руки. В смущенном молчании несколько минут проносятся считанными секундами, и девушка чуть отстраняется.
  - speaker: Cassia Orsellio
    text_clean: Здесь... умиротворенно, не находите?
- guid: 1a50dc06-fd29-4295-b735-d5a46c27861c
  event: ''
  text: '"Ты правда готова пожертвовать пестрыми оттенками свой души, дабы избавиться от проклятия, что тебя тяготит?" {n}Кассия опускает взгляд и прикладывает ладонь к Атласу в своей груди.{/n} "Если... если это и правда возможно... если это то, чего ты хочешь..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ты правда готова пожертвовать пестрыми оттенками свой души, дабы избавиться от проклятия, что тебя тяготит?
  - speaker: narrator
    text_clean: Кассия опускает взгляд и прикладывает ладонь к Атласу в своей груди.
  - speaker: Cassia Orsellio
    text_clean: Если... если это и правда возможно... если это то, чего ты хочешь...
- guid: 1a65743c-9202-48d1-b4e9-dc3918a55205
  event: ''
  text: '"Ваши цвета, Лорд-инквизитор, столь же насыщенны, сколь и многогранны. Никогда не встречала подобных вам — незамутненные оттенки перетекают из одного в другой... удивительная гармония. Удивительная и... пугающая". {n}Кассия вскидывает подбородок и сдержанно кивает.{/n} "То, что человек подобного статуса и талантов следит за благополучием Дома Навис Нобилите — большая честь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Ваши цвета, Лорд-инквизитор, столь же насыщенны, сколь и многогранны. Никогда не встречала подобных вам — незамутненные оттенки перетекают из одного в другой... удивительная гармония. Удивительная и... пугающая.
  - speaker: narrator
    text_clean: Кассия вскидывает подбородок и сдержанно кивает.
  - speaker: Cassia Orsellio
    text_clean: То, что человек подобного статуса и талантов следит за благополучием Дома Навис Нобилите — большая честь.
