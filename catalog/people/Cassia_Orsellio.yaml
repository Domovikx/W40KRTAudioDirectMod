- guid: 458f31be-4262-419e-abf5-787e5ea935cf
  event: Companions_Navigator_77
  text: '{n}Кассия чуть расслабляет плечи.{/n} "Благодарю за понимание, Вольный Торговец. А теперь позвольте откланяться — я начну подготовку к путешествию. Когда будете готовы, оправляйтесь в систему..." {n}Рубиновые глаза расширяются от удивления.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия чуть расслабляет плечи.
  - speaker: Cassia Orsellio
    text_clean: Благодарю за понимание, Вольный Торговец. А теперь позвольте откланяться — я начну подготовку к путешествию. Когда будете готовы, оправляйтесь в систему...
  - speaker: narrator
    text_clean: Рубиновые глаза расширяются от удивления.
- guid: dae47f72-2b3a-4e75-b139-433ef5d935f9
  event: Companions_Navigator_78
  text: '"{name} фон Валанциус... Сие имя навсегда останется в архивах Дома Орселлио многовековой истории Империума. Ибо в переломный момент именно вы повлияли на судьбу нашего рода в Просторе... К добру или к худу". {n}Кассия коротко, но учтиво кивает.{/n} "Мы не всегда сходились во взглядах, однако сложно переоценить вклад вашей династии в разрешение внутренних конфликтов Дома Орселлио. Как новатор... я выражаю вам нашу благодарность".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: КЭП фон Валанциус... Сие имя навсегда останется в архивах Дома Орселлио многовековой истории Империума. Ибо в переломный момент именно вы повлияли на судьбу нашего рода в Просторе... К добру или к худу.
  - speaker: narrator
    text_clean: Кассия коротко, но учтиво кивает.
  - speaker: Cassia Orsellio
    text_clean: Мы не всегда сходились во взглядах, однако сложно переоценить вклад вашей династии в разрешение внутренних конфликтов Дома Орселлио. Как новатор... я выражаю вам нашу благодарность.
- guid: bab3f632-5dae-4ea9-b00d-1d1451e0f50a
  event: Companions_Navigator_79
  text: '{n}Хрупкая фигура, более похожая на отголосок живого человека, испуганно озирается по сторонам. Спутанные волосы всклокоченным облаком окутывают осунувшееся лицо Кассии, а дрожащие руки поспешно размазывают кровавую слезу по щеке.{/n} "{name}, какое облегчение вновь говорить с вами. Во тьме сего места ваша душа сияет подобно золоту солнца".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Хрупкая фигура, более похожая на отголосок живого человека, испуганно озирается по сторонам. Спутанные волосы всклокоченным облаком окутывают осунувшееся лицо Кассии, а дрожащие руки поспешно размазывают кровавую слезу по щеке.
  - speaker: Cassia Orsellio
    text_clean: КЭП, какое облегчение вновь говорить с вами. Во тьме сего места ваша душа сияет подобно золоту солнца.
- guid: d6bf5b4d-dd0f-472a-bafd-f30fee958032
  event: Companions_Navigator_80
  text: '"Вам ли не знать, сколь утомителен и долог процесс престолонаследия". {n}Кассия громко вздыхает.{/n} "Пока весь Дом готовится к Большому Совету, на котором и пройдет официальная церемония передачи титула от покойной Тисифоны ко мне... я решила остаться подле вас. Еще чуть-чуть насладиться беспечной свободой. Ибо как только долг призовет, нам будет суждено попрощаться".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вам ли не знать, сколь утомителен и долог процесс престолонаследия.
  - speaker: narrator
    text_clean: Кассия громко вздыхает.
  - speaker: Cassia Orsellio
    text_clean: Пока весь Дом готовится к Большому Совету, на котором и пройдет официальная церемония передачи титула от покойной Тисифоны ко мне... я решила остаться подле вас. Еще чуть-чуть насладиться беспечной свободой. Ибо как только долг призовет, нам будет суждено попрощаться.
- guid: 68f54177-f1a4-4122-b0e7-e998d45f4557
  event: Companions_Navigator_81
  text: '"Думаете?" {n}Кассия смущенно опускает взгляд.{/n} "Даже навигаторам непросто совладать с ужасами Моря Душ. То, что я узрела в завихрениях варпа... сложно описать словами. Каждое путешествие меняет нас. Понемногу. Иногда это отражается на нашей внешности..." {n}Кассия выставляет ладонь с вытянутыми фалангами и бритвенно-острыми когтями.{/n} "...иногда — меняет наши души".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Думаете?
  - speaker: narrator
    text_clean: Кассия смущенно опускает взгляд.
  - speaker: Cassia Orsellio
    text_clean: Даже навигаторам непросто совладать с ужасами Моря Душ. То, что я узрела в завихрениях варпа... сложно описать словами. Каждое путешествие меняет нас. Понемногу. Иногда это отражается на нашей внешности...
  - speaker: narrator
    text_clean: Кассия выставляет ладонь с вытянутыми фалангами и бритвенно-острыми когтями.
  - speaker: Cassia Orsellio
    text_clean: '...иногда — меняет наши души.'
- guid: a6972331-78a4-403f-9f7a-efef32c3a420
  event: Companions_Navigator_88
  text: '"Признаться, странно не ощущать более давящую тяжесть на сердце. Порой я радуюсь обретенной свободе, а порой..." {n}Кассия прикрывает рубиновые глаза.{/n} "... чувствую себя опустошенной. Словно вместе с Атласом пропала и часть меня".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Признаться, странно не ощущать более давящую тяжесть на сердце. Порой я радуюсь обретенной свободе, а порой...
  - speaker: narrator
    text_clean: Кассия прикрывает рубиновые глаза.
  - speaker: Cassia Orsellio
    text_clean: '... чувствую себя опустошенной. Словно вместе с Атласом пропала и часть меня.'
- guid: 8b9086b3-499f-4224-8586-8e70ee9d9241
  event: Companions_Navigator_89
  text: '"{g|Encyclopedia:Emperor}Император{/g} ниспослал мне дар — помимо жизни обыденной зрить жизнь внутреннюю. Вам не дано знать, что фрукт изгнил внутри, пока лезвие не разделит его пополам. Я же вижу гниль издалека — она клубится болотной жижей, стекая по спелому плоду. Злость и скука, печаль и радость — все, что люди хранят внутри, вырисовывается на холсте моего мира своими красками".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Император ниспослал мне дар — помимо жизни обыденной зрить жизнь внутреннюю. Вам не дано знать, что фрукт изгнил внутри, пока лезвие не разделит его пополам. Я же вижу гниль издалека — она клубится болотной жижей, стекая по спелому плоду. Злость и скука, печаль и радость — все, что люди хранят внутри, вырисовывается на холсте моего мира своими красками.
- guid: 1dd7a777-38bf-4583-a387-f86332d83245
  event: Companions_Navigator_90
  text: '"Впрочем, незачем еще больше кутаться в оттенки сумерек, Вольный Торговец. Я — это все еще я".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Впрочем, незачем еще больше кутаться в оттенки сумерек, Вольный Торговец. Я — это все еще я.
- guid: 7f8dceb3-cc66-4551-a497-5d99ce489bae
  event: Companions_Navigator_91
  text: '"Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна". {n}Кассия горько смеется.{/n} "Не волнуйтесь, Вольный Торговец, мой Дом более не доставит вам проблем. Пока мне удается поддерживать внутри династии хрупкое перемирие, подернутое сизой дымкой. Ну а что будет дальше... покажет время".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна.
  - speaker: narrator
    text_clean: Кассия горько смеется.
  - speaker: Cassia Orsellio
    text_clean: Не волнуйтесь, Вольный Торговец, мой Дом более не доставит вам проблем. Пока мне удается поддерживать внутри династии хрупкое перемирие, подернутое сизой дымкой. Ну а что будет дальше... покажет время.
- guid: 5e2a3a36-c26a-454e-9d67-0b58925dda54
  event: Companions_Navigator_92
  text: '"Пожалуй, если под мощью вы подразумеваете бесценные знания. Что касается особых сил, дарованных душами ксеносов... Навигаторам Орселлио придется вновь столкнуться с ограничениями собственного тела и духа. Однако меня не пугает подобное, ибо наш род и наш ген никогда не были слабы. Дом Орселлио справится, и вскоре мы воспрянем вновь, окутанные золотом и белизной!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Пожалуй, если под мощью вы подразумеваете бесценные знания. Что касается особых сил, дарованных душами ксеносов... Навигаторам Орселлио придется вновь столкнуться с ограничениями собственного тела и духа. Однако меня не пугает подобное, ибо наш род и наш ген никогда не были слабы. Дом Орселлио справится, и вскоре мы воспрянем вновь, окутанные золотом и белизной!
- guid: bdef2272-dfa3-47c0-81d2-6e15045e258c
  event: Companions_Navigator_93
  text: '{n}Скулы Кассии вспыхивают красным, когда до нее доходит смысл собственных слов.{/n} "Я... лишь хотела поделиться статистикой, собранной Эксплоратором Литием-Тета Квондом. Чтобы убедить вас..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Скулы Кассии вспыхивают красным, когда до нее доходит смысл собственных слов.
  - speaker: Cassia Orsellio
    text_clean: Я... лишь хотела поделиться статистикой, собранной Эксплоратором Литием-Тета Квондом. Чтобы убедить вас...
- guid: c7a4b9f2-8eb0-401a-aaea-dee302bb8640
  event: Companions_Navigator_94
  text: '"Вы... правы. Свита следует по вашим следам, куда бы вы ни отправились. Быть может, мне стоит перенять у вас подобный образ правления династией". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы... правы. Свита следует по вашим следам, куда бы вы ни отправились. Быть может, мне стоит перенять у вас подобный образ правления династией.
  - speaker: narrator
    text_clean: Кассия устало потирает нагрудник в месте, где находится Атлас.
- guid: 8a499a7a-1967-4265-bc0a-8c9d81c63635
  event: Companions_Navigator_95
  text: '"И все же я не думаю, что Великий Регент почтит нас своим присутствием. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и моя семья едва ли станет рисковать... И потому я передам приглашение Навис Маджорис, нашим лучшим навигаторам. Быть может, Регент отправит в экспедицию кого-то из них".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: И все же я не думаю, что Великий Регент почтит нас своим присутствием. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и моя семья едва ли станет рисковать... И потому я передам приглашение Навис Маджорис, нашим лучшим навигаторам. Быть может, Регент отправит в экспедицию кого-то из них.
- guid: da0c7736-3891-4d22-932b-0b9fa6bb5dce
  event: Companions_Navigator_96
  text: '"...Провидение Орселлио. Надо же. Быть может, страницы истории лгут? И вовсе не Калейн Орселлио подарил ее звездам название? В любом случае, именно из этой системы Тисифона начала свой путь, и мы отправимся по ее давно забытым следам".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: '...Провидение Орселлио. Надо же. Быть может, страницы истории лгут? И вовсе не Калейн Орселлио подарил ее звездам название? В любом случае, именно из этой системы Тисифона начала свой путь, и мы отправимся по ее давно забытым следам.'
- guid: 5fbb7678-addb-4d3e-b29f-e4ecf14aa9d9
  event: Companions_Navigator_97
  text: '{n}Кассия прячет растерянную улыбку за краешком шали.{/n} "Я... Вы слишком добры ко мне, Лорд-капитан. Позвольте в ответ отметить и ваши... красивые..." {n}Паника и растерянность перебивает ваше дыхание, отражаясь зеркалом в глазах Кассии.{/n} "Плечи? Да, плечи... Кхм. Прошу, сменим тему".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия прячет растерянную улыбку за краешком шали.
  - speaker: Cassia Orsellio
    text_clean: Я... Вы слишком добры ко мне, Лорд-капитан. Позвольте в ответ отметить и ваши... красивые...
  - speaker: narrator
    text_clean: Паника и растерянность перебивает ваше дыхание, отражаясь зеркалом в глазах Кассии.
  - speaker: Cassia Orsellio
    text_clean: Плечи? Да, плечи... Кхм. Прошу, сменим тему.
- guid: 63b06006-661d-464e-9dd5-2fcae4b2bc23
  event: Companions_Navigator_98
  text: '"Лорд-капитан?" {n}Леди-Навигатор вздергивает подбородок. Усталый взгляд скользит по лицам, ни на одном не останавливаясь.{/n} "Ваш корабль пестрит причудливыми оттенками. Это так... утомляет".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Лорд-капитан?
  - speaker: narrator
    text_clean: Леди-Навигатор вздергивает подбородок. Усталый взгляд скользит по лицам, ни на одном не останавливаясь.
  - speaker: Cassia Orsellio
    text_clean: Ваш корабль пестрит причудливыми оттенками. Это так... утомляет.
- guid: 6f8e0923-7a23-4706-844b-5d52935ef967
  event: Companions_Navigator_99
  text: '"{mf|Любезный друг|Любезная подруга}, сегодня нефритовый и золотой сияют вокруг вас особенно ярко". {n}Кассия одаривает вас мягкой улыбкой.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Любезный друг, сегодня нефритовый и золотой сияют вокруг вас особенно ярко.
  - speaker: narrator
    text_clean: Кассия одаривает вас мягкой улыбкой.
- guid: c684c5e3-746a-46ee-b9d8-77bc334bdb8e
  event: Companions_Navigator_ArbitesReaction_01
  text: '"Господин Антар окутан густым золотом, но, подобно солнцу ледяных миров, его сияние не греет, отливая стальным блеском непоколебимости. Порой я замечаю и вспышки иного цвета... Словно металлический панцирь — лишь ширма, а внутри, в глубине, буйствует алое пламя".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Господин Антар окутан густым золотом, но, подобно солнцу ледяных миров, его сияние не греет, отливая стальным блеском непоколебимости. Порой я замечаю и вспышки иного цвета... Словно металлический панцирь — лишь ширма, а внутри, в глубине, буйствует алое пламя.
- guid: 58a8ce32-1e6f-4fe5-9e35-8cf79929e488
  event: Companions_Navigator_ArbitesReaction_02
  text: '"Сердце проктора змеится медно-огненными разводами, словно недавно что-то прорвалось наружу — гнев, ярость, боль?.. — и оставило на нем неизгладимый след. Прежний серо-стальной ореол... исчез, был вытеснен новой палитрой, и теперь в истекающей красками душе проявляются новые оттенки — естественные, пульсирующие в такт сердцебиению. Эта трансформация... завораживает!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сердце проктора змеится медно-огненными разводами, словно недавно что-то прорвалось наружу — гнев, ярость, боль?.. — и оставило на нем неизгладимый след. Прежний серо-стальной ореол... исчез, был вытеснен новой палитрой, и теперь в истекающей красками душе проявляются новые оттенки — естественные, пульсирующие в такт сердцебиению. Эта трансформация... завораживает!
- guid: 3c3313f7-2db2-49b0-95d9-c49b73be805f
  event: PRL_NavigatorLast_01
  text: '"Поступь его громка, ибо бремя надежд чужих несет он! Отворите свои сердца, и в душу вашу вложу я мириады слов и смыслов, каждый из которых значит спасение во мне!" {n}Навигатор с визгливым хохотом мечется в своем кресле, а затем резко оседает. Его лицо залито черно-красным: угольная жижа из-под третьего века из струйки превратилась в настоящий поток и мешается с кровью из носа, а сам глаз взбухает лиловым.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Поступь его громка, ибо бремя надежд чужих несет он! Отворите свои сердца, и в душу вашу вложу я мириады слов и смыслов, каждый из которых значит спасение во мне!
    speaker_override: Generic Male NPC
  - speaker: narrator
    text_clean: 'Навигатор с визгливым хохотом мечется в своем кресле, а затем резко оседает. Его лицо залито черно-красным: угольная жижа из-под третьего века из струйки превратилась в настоящий поток и мешается с кровью из носа, а сам глаз взбухает лиловым.'
- guid: 9188c3e6-fc4e-4611-8211-0129fc1efab6
  event: PRL_NavigatorLast_02
  text: '{n}Навигатор не отвечает ей. Из под его опущенных век текут кровавые и черные слезы, а вокс в основании кресла сквозит статикой, прерываемый только отголосками потустороннего смеха.{/n}'
