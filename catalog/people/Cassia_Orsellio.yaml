  event: Companions_Navigator_153
  text: '"Для нас? Или же для вас, {name}?" {n}Гордо поведя плечом, Кассия устремляет взгляд рубиновых глаз прямо на вас.{/n} "Я что же, была для вас просто игрушкой?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Для нас? Или же для вас, КЭП?
  - speaker: narrator
    text_clean: Гордо поведя плечом, Кассия устремляет взгляд рубиновых глаз прямо на вас.
  - speaker: Cassia Orsellio
