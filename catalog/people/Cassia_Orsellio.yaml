  event: Companions_Navigator_158
  text: '"Я... понимаю". {n}Рубиновые глаза сияют еще ярче в обрамлении едва сдерживаемых слез.{/n} "Вижу, как ваши цвета рядом со мной тускнеют". {n}Девушка опускает взгляд.{/n} "Уходите. Позвольте мне побыть в одиночестве".'
