    text_clean: Кассия касается нагрудника в области Атласа.
  - speaker: Cassia Orsellio
    text_clean: Ксеносам удалось освободить наших предков из заточения в Камне Душ. Память и мудрость тех, кто был до нас, послужат Дому, позволив возвести на руинах настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный свет Императора.
- guid: 29f6ed0d-794e-46d5-9cae-3d081b070522
  event: Companions_Navigator_24
  text: '"Свобода и созидание". {n}Отчего-то голос Кассии полнится печалью.{/n} "Будущим поколениям Дома Орселлио придется вновь {d|Encyclopedia:CassiaQ2_BrokenAtlas}положиться на собственные силы и благородную кровь{/d}, позабыв о проклятой мощи ксеноартефакта. Изнурительный труд, но подданные это понимают. Мы... справимся".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Свобода и созидание.
  - speaker: narrator
    text_clean: Отчего-то голос Кассии полнится печалью.
  - speaker: Cassia Orsellio
    text_clean: Будущим поколениям Дома Орселлио придется вновь положиться на собственные силы и благородную кровь, позабыв о проклятой мощи ксеноартефакта. Изнурительный труд, но подданные это понимают. Мы... справимся.
- guid: ae37eea4-0629-4f56-aec6-dda48fbf1dbb
  event: Companions_Navigator_25
  text: '"Предатели в рядах Дома не смирятся так просто с {d|Encyclopedia:CassiaQ2_SavedAtlas}решением оставить Атлас{/d}. Тем более теперь, когда правду о его создании уже невозможно скрыть — все же навигаторы Орселлио связаны со мной, ну а я связана с ними". {n}Кассия касается нагрудника в области Атласа.{/n} "И все же я не оставлю попыток объединить Дом. Пока раскол истощает нас изнутри, представители прочих династий Навис Нобилите захотят разорвать нас на части. Но я им этого не позволю".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Предатели в рядах Дома не смирятся так просто с решением оставить Атлас. Тем более теперь, когда правду о его создании уже невозможно скрыть — все же навигаторы Орселлио связаны со мной, ну а я связана с ними.
  - speaker: narrator
    text_clean: Кассия касается нагрудника в области Атласа.
  - speaker: Cassia Orsellio
    text_clean: И все же я не оставлю попыток объединить Дом. Пока раскол истощает нас изнутри, представители прочих династий Навис Нобилите захотят разорвать нас на части. Но я им этого не позволю.
- guid: 4b09f169-656c-4a37-b24f-297a9a363f38
  event: Companions_Navigator_26
  text: '{n}Кассия опускает руку, стараясь скрыть разочарование.{/n} "Конечно. Я более никогда не перекрашу ваши цвета против воли".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия опускает руку, стараясь скрыть разочарование.
  - speaker: Cassia Orsellio
    text_clean: Конечно. Я более никогда не перекрашу ваши цвета против воли.
- guid: 874dad17-9287-499b-b03c-5ef47d2221dd
  event: Companions_Navigator_27
  text: '"Так... так ведь гораздо лучше, не правда ли?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Так... так ведь гораздо лучше, не правда ли?
- guid: 0217118d-54a9-472d-a53f-d368856ee35c
  event: Companions_Navigator_28
  text: '"Об остальном не беспокойтесь — я есть кровь Дома Орселлио. Его наследница. И я справлюсь с любыми потрясениями, лишь бы вернуться обратно в Простор".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Об остальном не беспокойтесь — я есть кровь Дома Орселлио. Его наследница. И я справлюсь с любыми потрясениями, лишь бы вернуться обратно в Простор.
- guid: 1f3aafd6-da4a-4d72-8e6a-b70c431de252
  event: Companions_Navigator_29
  text: '"Разумеется. Я постараюсь ответить на все ваши вопросы".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Разумеется. Я постараюсь ответить на все ваши вопросы.
- guid: 801ebfd1-0f78-4f95-bf69-2f3191846154
  event: Companions_Navigator_30
  text: '"В отличие от остальных, ее образ начал проявляться все четче — утонченные черты старческого лица, длинные белые волосы, горящие алым глазницы... и третье око. Око навигатора". {n}Плечи Кассии содрогаются от нахлынувших воспоминаний.{/n} "Однажды старуха сорвалась с места и принялась душить меня прямо во время варп-перелета! Слава милости Его, в тот момент мне удалось прогнать ее на задворки сознания. Однако старуха лишь обозлилась".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В отличие от остальных, ее образ начал проявляться все четче — утонченные черты старческого лица, длинные белые волосы, горящие алым глазницы... и третье око. Око навигатора.
  - speaker: narrator
    text_clean: Плечи Кассии содрогаются от нахлынувших воспоминаний.
  - speaker: Cassia Orsellio
    text_clean: Однажды старуха сорвалась с места и принялась душить меня прямо во время варп-перелета! Слава милости Его, в тот момент мне удалось прогнать ее на задворки сознания. Однако старуха лишь обозлилась.
- guid: ae29fdce-76c6-40be-94a3-0c0e5c09e021
  event: Companions_Navigator_31
  text: '"Я стала все чаще видеть ее в тенях, на краю зрения, в собственном отражении... И во тьме клетки гемункула меня поджидала именно она — я это точно знаю!" {n}Кассия обреченно вздыхает, прикрывая глаза ладонью.{/n} "Теперь... вы знаете мою последнюю тайну, Лорд-капитан. Думаете, я схожу с ума?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я стала все чаще видеть ее в тенях, на краю зрения, в собственном отражении... И во тьме клетки гемункула меня поджидала именно она — я это точно знаю!
  - speaker: narrator
    text_clean: Кассия обреченно вздыхает, прикрывая глаза ладонью.
  - speaker: Cassia Orsellio
    text_clean: Теперь... вы знаете мою последнюю тайну, Лорд-капитан. Думаете, я схожу с ума?
- guid: 4a593d3d-8577-4cf3-bd2d-ea8f2b9bd6cb
  event: Companions_Navigator_32
  text: '{n}Кассия неуверенно качает головой.{/n} "У меня есть предположение. Но оно слишком... слишком безумное даже для меня".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия неуверенно качает головой.
  - speaker: Cassia Orsellio
    text_clean: У меня есть предположение. Но оно слишком... слишком безумное даже для меня.
- guid: eb38ada6-d089-4d17-b51f-7a33191efd44
  event: Companions_Navigator_33
  text: '"Она — это я, Лорд-капитан". {n}Взгляд Кассии устремляется в сторону, словно ожидая вашего осуждения.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Она — это я, Лорд-капитан.
  - speaker: narrator
    text_clean: Взгляд Кассии устремляется в сторону, словно ожидая вашего осуждения.
- guid: 344e62ed-1146-4dde-8b3c-8c1dad902965
  event: Companions_Navigator_34
  text: '"Я бы не раскрыла сию тайну чужаку, но вы, {name}... уже не раз меня выручали". {n}Кассия прикрывает глаза и касается нагрудника в области сердца.{/n} "Атлас Звездных Путей есть священный артефакт Дома Орселлио — он помогает нашим навигаторам прокладывать маршруты сквозь {g|Encyclopedia:Warp}варп{/g}. Сколько я себя помню, кристалл... то есть Атлас... всегда был во мне. Придавал мне сил. Но другие... Я заметила, как предателей во дворце душили пепельные призраки отчаяния, когда мы встретились лицом к лицу. Могу поклясться, призраки тянулись к их собственным Атласам".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я бы не раскрыла сию тайну чужаку, но вы, КЭП... уже не раз меня выручали.
  - speaker: narrator
    text_clean: Кассия прикрывает глаза и касается нагрудника в области сердца.
  - speaker: Cassia Orsellio
    text_clean: Атлас Звездных Путей есть священный артефакт Дома Орселлио — он помогает нашим навигаторам прокладывать маршруты сквозь варп. Сколько я себя помню, кристалл... то есть Атлас... всегда был во мне. Придавал мне сил. Но другие... Я заметила, как предателей во дворце душили пепельные призраки отчаяния, когда мы встретились лицом к лицу. Могу поклясться, призраки тянулись к их собственным Атласам.
- guid: 972ce4ff-bfd0-4013-ae13-d22ed1f9c710
  event: Companions_Navigator_35
  text: '"Позволить артефакту Фелека и дальше сдерживать силы было разумным решением. Я больше... не желаю никому вредить".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Позволить артефакту Фелека и дальше сдерживать силы было разумным решением. Я больше... не желаю никому вредить.
- guid: 7b2ada16-a2db-4c16-b928-98e66e38240f
  event: Companions_Navigator_36
  text: '"Друкари Маражай..." {n}Плечи Кассии непроизвольно вздрагивают.{/n} "Оттенки эльдаров всегда слишком яркие, дурманящие сознание... Но у этого ксеноса вместо сердца я вижу лишь клубящуюся тьму. Нет, тысячи ее оттенков! От аспидно-черного тумана до полночной темноты беззвездного неба. Я... предпочитаю не заглядывать в сумрак его цветов, ибо боюсь, Лорд-капитан, что он поглотит меня без остатка".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Друкари Маражай...
  - speaker: narrator
    text_clean: Плечи Кассии непроизвольно вздрагивают.
  - speaker: Cassia Orsellio
    text_clean: Оттенки эльдаров всегда слишком яркие, дурманящие сознание... Но у этого ксеноса вместо сердца я вижу лишь клубящуюся тьму. Нет, тысячи ее оттенков! От аспидно-черного тумана до полночной темноты беззвездного неба. Я... предпочитаю не заглядывать в сумрак его цветов, ибо боюсь, Лорд-капитан, что он поглотит меня без остатка.
- guid: 35aa4d15-31ec-425a-bc15-b7be13494724
  event: Companions_Navigator_37
  text: '"И пусть мои глаза кровоточат от его сияния, я вижу, как Ирлиэт растворяется в белизне скорби при разговорах о доме. И как пунцовые всполохи накаляются в воздухе при упоминании о ее предательстве".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: И пусть мои глаза кровоточат от его сияния, я вижу, как Ирлиэт растворяется в белизне скорби при разговорах о доме. И как пунцовые всполохи накаляются в воздухе при упоминании о ее предательстве.
- guid: b2302ba3-5039-4dfd-9599-50a80050005b
  event: Companions_Navigator_38
  text: '"Прошу, не здесь",{n} — почти шепчет Кассия. —{/n} "Разве дворянам не положено обсуждать подобные вещи вдали от слуг?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Прошу, не здесь,
  - speaker: narrator
    text_clean: — почти шепчет Кассия. —
  - speaker: Cassia Orsellio
    text_clean: Разве дворянам не положено обсуждать подобные вещи вдали от слуг?
- guid: bc23cf67-18c4-44fc-8968-c570d57947b8
  event: Companions_Navigator_39
  text: '"Мое пребывание на станции было посвящено неустанной подготовке к исполнению моего долга. Астромансия, астрография, нумерология, история Дома и {g|Encyclopedia:Imperium}Империума{/g}, и множество других дисциплин — много лет десятки наставников готовили меня к тому, что предназначено судьбой. А единожды в год на станцию прибывал Великий Регент Ааронто. Он передавал под мое управление свое прекрасное судно, чтобы помимо теории я могла овладеть и практическими аспектами нашего искусства".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Мое пребывание на станции было посвящено неустанной подготовке к исполнению моего долга. Астромансия, астрография, нумерология, история Дома и Империума, и множество других дисциплин — много лет десятки наставников готовили меня к тому, что предназначено судьбой. А единожды в год на станцию прибывал Великий Регент Ааронто. Он передавал под мое управление свое прекрасное судно, чтобы помимо теории я могла овладеть и практическими аспектами нашего искусства.
- guid: e8617dc6-8506-479e-96d3-4096b176aa8d
  event: Companions_Navigator_40
  text: '"Раз уж об этом зашла речь, Лорд-капитан — почему вы не следуете этой доброй традиции? На ваших палубах столь пестро... я хотела сказать — шумно. Чернь не только разговаривает, но иногда еще и кричит или поет. Зачем вы дозволяете подобную разнузданность? Разве {g|Encyclopedia:RogueTrader}Вольные Торговцы{/g} не благородных кровей?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Раз уж об этом зашла речь, Лорд-капитан — почему вы не следуете этой доброй традиции? На ваших палубах столь пестро... я хотела сказать — шумно. Чернь не только разговаривает, но иногда еще и кричит или поет. Зачем вы дозволяете подобную разнузданность? Разве Вольные Торговцы не благородных кровей?
- guid: b2aa9df2-91a2-4787-935f-c3354c552d63
  event: Companions_Navigator_41
  text: '"Жизнью? О, если бы вы могли оказаться на моем месте и наблюдать этот калейдоскоп..." {n}Кассия устало прикрывает глаза.{/n} "Каждый голос — вспышка цвета. Каждый диалог — мерцающее сияние. Каждая ссора — безудержное мельтешение пестрых пятен..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Жизнью? О, если бы вы могли оказаться на моем месте и наблюдать этот калейдоскоп...
  - speaker: narrator
    text_clean: Кассия устало прикрывает глаза.
  - speaker: Cassia Orsellio
    text_clean: Каждый голос — вспышка цвета. Каждый диалог — мерцающее сияние. Каждая ссора — безудержное мельтешение пестрых пятен...
- guid: 9a80414f-7006-4ab8-b0a4-2ed3d0e52712
  event: Companions_Navigator_42
  text: '"Возможно, сейчас вид мой не внушает вам ужас, однако когда-нибудь это изменится. Ген {g|Encyclopedia:Navigator}навигатора{/g} нестабилен — со временем мое тело будет меняться. И как именно — ведомо, быть может, лишь {g|Encyclopedia:Emperor}Богу-Императору{/g}..." {n}Кассия с неподдельным испугом прижимает пальцы к губам, словно запоздало останавливая вырвавшиеся слова.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Возможно, сейчас вид мой не внушает вам ужас, однако когда-нибудь это изменится. Ген навигатора нестабилен — со временем мое тело будет меняться. И как именно — ведомо, быть может, лишь Богу-Императору...
  - speaker: narrator
    text_clean: Кассия с неподдельным испугом прижимает пальцы к губам, словно запоздало останавливая вырвавшиеся слова.
- guid: c4191e6f-ecd1-4259-bb17-a82ea7ba42be
  event: Companions_Navigator_43
  text: '"Отчего же? Вас смущает необходимость оставаться со мной наедине?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Отчего же? Вас смущает необходимость оставаться со мной наедине?
- guid: 91185c1b-83e8-4ea1-a210-d9e10c9d7184
  event: Companions_Navigator_44
  text: '{n}Кассия удивленно моргает — вопрос явно застал ее врасплох.{/n} "Однажды регент подарил мне птицу с солнечной планеты. Я пыталась с ней подружиться и заставить петь, но она почему-то не хотела и быстро умерла. Наставники слишком уважали мой долг перед Домом, чтобы тратить драгоценное время на досужие разговоры. Помимо них на станции были лишь слуги, но им же вырезают голосовые связки, чтобы не нарушали обет безмолвия".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия удивленно моргает — вопрос явно застал ее врасплох.
  - speaker: Cassia Orsellio
    text_clean: Однажды регент подарил мне птицу с солнечной планеты. Я пыталась с ней подружиться и заставить петь, но она почему-то не хотела и быстро умерла. Наставники слишком уважали мой долг перед Домом, чтобы тратить драгоценное время на досужие разговоры. Помимо них на станции были лишь слуги, но им же вырезают голосовые связки, чтобы не нарушали обет безмолвия.
- guid: 9291eda7-3836-441d-9445-a9cb28de9b53
  event: Companions_Navigator_45
  text: '"{name}, какая удача, что вы пришли! Признаться, я и сама искала встречи. После событий на Даргонусе... мои плечи окутала антрацитово-серая мантия. Я долго размышляла о нашей первой встрече и о том, что произошло после. Не терпится сбросить этот утомительный цвет".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: КЭП, какая удача, что вы пришли! Признаться, я и сама искала встречи. После событий на Даргонусе... мои плечи окутала антрацитово-серая мантия. Я долго размышляла о нашей первой встрече и о том, что произошло после. Не терпится сбросить этот утомительный цвет.
- guid: d4bdae72-3957-4603-b756-ccc0f9c584d7
  event: Companions_Navigator_46
  text: '"Обо мне?" {n}Кассия чуть склоняет голову.{/n} "Что ж, это возможно. Что вам угодно узнать?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Обо мне?
  - speaker: narrator
    text_clean: Кассия чуть склоняет голову.
  - speaker: Cassia Orsellio
    text_clean: Что ж, это возможно. Что вам угодно узнать?
- guid: 56f319a3-1799-45a9-9e04-a988dfcc3571
  event: Companions_Navigator_47
  text: '"Но все изменилось, когда я подобрала свой ключ к этой тайне. Видите ли, всю свою жизнь я скрашивала редкие минуты свободного времени живописью — если вы помните, в моих палатах была мастерская. Стоило мне представить варп в виде пустого холста, как меня захлестнуло неописуемое чувство... я водила кистью, погружаясь все глубже в собственную картину. В переливах красок мне мерещились образы — и что-то внутри подсказывало, на какой стоит откликнуться, а который оставить позади. Я очнулась спустя несколько дней — когда переход был благополучно завершен".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Но все изменилось, когда я подобрала свой ключ к этой тайне. Видите ли, всю свою жизнь я скрашивала редкие минуты свободного времени живописью — если вы помните, в моих палатах была мастерская. Стоило мне представить варп в виде пустого холста, как меня захлестнуло неописуемое чувство... я водила кистью, погружаясь все глубже в собственную картину. В переливах красок мне мерещились образы — и что-то внутри подсказывало, на какой стоит откликнуться, а который оставить позади. Я очнулась спустя несколько дней — когда переход был благополучно завершен.
- guid: 19b0fe18-4fd8-4dd0-bada-b90c17c7e722
  event: Companions_Navigator_48
  text: '"Я не стыжусь своей внешности! И мне не нужно чье-либо одобрение!" {n}Кассия отводит взгляд, но заметно расслабляет плечи и скулы.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я не стыжусь своей внешности! И мне не нужно чье-либо одобрение!
  - speaker: narrator
    text_clean: Кассия отводит взгляд, но заметно расслабляет плечи и скулы.
- guid: c185d781-af5a-40e7-8aed-2227f0d3cfdb
  event: Companions_Navigator_49
  text: '"Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как наивно вверилась вам. И все же... Наше с вами сотрудничество помогает сдерживать не только врагов Дома Орселлио, но и моих собственных людей. Немногие осмелятся открыто выступить против Навигатора Вольного Торговца. Так что... Пожалуй, я продолжу и далее править ваш корабль сквозь Океан Душ — пока судьба ведет нас одним путем".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как наивно вверилась вам. И все же... Наше с вами сотрудничество помогает сдерживать не только врагов Дома Орселлио, но и моих собственных людей. Немногие осмелятся открыто выступить против Навигатора Вольного Торговца. Так что... Пожалуй, я продолжу и далее править ваш корабль сквозь Океан Душ — пока судьба ведет нас одним путем.
- guid: 321f4d3a-d768-4305-8847-030d3f7b1acd
  event: Companions_Navigator_50
  text: '{n}Кассия осекается, бледные щеки розовеют смущенным румянцем.{/n} "Вы преступаете границы приличий, Лорд-капитан!"'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия осекается, бледные щеки розовеют смущенным румянцем.
  - speaker: Cassia Orsellio
    text_clean: Вы преступаете границы приличий, Лорд-капитан!
- guid: 8fbebbe0-0ff4-4930-abd6-29753df52eb0
  event: Companions_Navigator_51
  text: '"Не смею препятствовать".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Не смею препятствовать.
- guid: c4cd94d9-b446-49dc-87f2-8e34bb835cee
  event: Companions_Navigator_52
  text: '"Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как глуха была к нуждам собственного Дома. Но вы — вы раскрыли мне глаза. Как будущий {g|Encyclopedia:Novator}новатор{/g} я обязана набраться мудрости, дабы вернуть Дому Орселлио былое могущество. И неважно, какой будет цена". {n}Кассия касается места, куда инкрустирован Атлас.{/n} "Благодарю. И почту за честь и далее править ваш корабль сквозь Океан Душ — пока нужды наших династий ведут нас одним путем".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как глуха была к нуждам собственного Дома. Но вы — вы раскрыли мне глаза. Как будущий новатор я обязана набраться мудрости, дабы вернуть Дому Орселлио былое могущество. И неважно, какой будет цена.
  - speaker: narrator
    text_clean: Кассия касается места, куда инкрустирован Атлас.
  - speaker: Cassia Orsellio
    text_clean: Благодарю. И почту за честь и далее править ваш корабль сквозь Океан Душ — пока нужды наших династий ведут нас одним путем.
- guid: cd315d06-49a8-49fd-9486-56a27407cdd0
  event: Companions_Navigator_53
  text: '{n}Кассия медленно кивает.{/n} "Отверстое око {g|Encyclopedia:Navigator}навигатора{/g} несет погибель для каждого, кто будет озарен пагубным сиянием {g|Encyclopedia:Warp}варпа{/g}, и потому есть символ нашего могущества. Мы — путеводные звезды Человечества, удостоенные особого дара, и одна из обязанностей, что вменяют нам — оберегать свое око даже от сторонних взглядов, что могут нести зло".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия медленно кивает.
  - speaker: Cassia Orsellio
    text_clean: Отверстое око навигатора несет погибель для каждого, кто будет озарен пагубным сиянием варпа, и потому есть символ нашего могущества. Мы — путеводные звезды Человечества, удостоенные особого дара, и одна из обязанностей, что вменяют нам — оберегать свое око даже от сторонних взглядов, что могут нести зло.
- guid: 2881f25e-e0b4-4f0f-b81d-b41e87804f2d
  event: Companions_Navigator_54
  text: '{n}Кассия благосклонно кивает.{/n} "Уверена, вы скорейшим образом исправите этот недочет".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия благосклонно кивает.
  - speaker: Cassia Orsellio
    text_clean: Уверена, вы скорейшим образом исправите этот недочет.
- guid: 2ca37bc2-53dd-4bed-a08e-4bacbf827c5e
  event: Companions_Navigator_55
  text: '"Я — часть Дома Орселлио, древней династии {g|Encyclopedia:NavisNobilite}Навис Нобилите{/g}. Испокон веков наш род служил во благо познания, раздвигая пределы безвестной мглы. В Атласе Звездных Путей хранятся две тысячи восемьсот сорок три маршрута, охватывающих сектора Сегментум Обскурус и простирающихся от {g|Encyclopedia:KoronusExpanse}Простора Коронус{/g} до {g|Encyclopedia:HolyTerra}Святой Терры{/g}..."'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я — часть Дома Орселлио, древней династии Навис Нобилите. Испокон веков наш род служил во благо познания, раздвигая пределы безвестной мглы. В Атласе Звездных Путей хранятся две тысячи восемьсот сорок три маршрута, охватывающих сектора Сегментум Обскурус и простирающихся от Простора Коронус до Святой Терры...
- guid: 93abfdad-cbca-4626-9718-4053edeb0327
  event: Companions_Navigator_56
  text: '{n}Девушка растерянно замирает.{/n} "Ваши слова звучат... удивительно кощунственно. Если долг правителя диктует необходимость насилия, разве не является обязанностью отправление его? Я поразмыслю над вашим ответом в уединении".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Девушка растерянно замирает.
  - speaker: Cassia Orsellio
    text_clean: Ваши слова звучат... удивительно кощунственно. Если долг правителя диктует необходимость насилия, разве не является обязанностью отправление его? Я поразмыслю над вашим ответом в уединении.
- guid: bc4fd9a8-0140-41d6-a073-ba7e5ef51b3e
  event: Companions_Navigator_57
  text: '{n}Кассия виновато хмурится.{/n} "Прошу меня простить, Лорд-капитан. Я была уверена, что это — святая традиция, скрепленная древними обетами повиновения... Вероятно, это не первый сюрприз, что ожидает меня за стенами Эурак-V".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия виновато хмурится.
  - speaker: Cassia Orsellio
    text_clean: Прошу меня простить, Лорд-капитан. Я была уверена, что это — святая традиция, скрепленная древними обетами повиновения... Вероятно, это не первый сюрприз, что ожидает меня за стенами Эурак-V.
- guid: e54107b7-6f74-48eb-b9ba-763c9f9149ee
  event: Companions_Navigator_58
  text: '"И, наконец, мое злоключение окончится..." {n}Навигатор облегченно вздыхает.{/n} "Прощайте, Вольный Торговец. Надеюсь, наши пути не пересекутся боле".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: И, наконец, мое злоключение окончится...
  - speaker: narrator
    text_clean: Навигатор облегченно вздыхает.
  - speaker: Cassia Orsellio
    text_clean: Прощайте, Вольный Торговец. Надеюсь, наши пути не пересекутся боле.
- guid: 4734e241-ee40-4aa4-9df2-e17c7078b531
  event: Companions_Navigator_59
  text: '"Что вы хотите этим сказать? Считаете, потомок великого Дома Орселлио скверно справляется с обязанностью править ваш корабль сквозь Океан Душ?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Что вы хотите этим сказать? Считаете, потомок великого Дома Орселлио скверно справляется с обязанностью править ваш корабль сквозь Океан Душ?
- guid: 945a61eb-0727-4a53-8a03-fc9a2fb08c07
  event: Companions_Navigator_60
  text: '"Что ж. В любом случае... Благодарю вас за наши совместные странствия. Бесценный опыт, что мне удалось приобрести, я обязательно пущу на благо Дома Орселлио". {n}Девушка медлит пару секунд.{/n} "Надеюсь, однажды мы встретимся вновь".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Что ж. В любом случае... Благодарю вас за наши совместные странствия. Бесценный опыт, что мне удалось приобрести, я обязательно пущу на благо Дома Орселлио.
  - speaker: narrator
    text_clean: Девушка медлит пару секунд.
  - speaker: Cassia Orsellio
    text_clean: Надеюсь, однажды мы встретимся вновь.
- guid: d0dad52f-9272-4aa1-bb55-e76deb66cc08
  event: Companions_Navigator_61
  text: '"Сотрудничестве?" {n}Кассия презрительно кривится.{/n} "Вы {d|Encyclopedia:Ch1_CassiaTakenByForce}обязали меня служить{/d} на сем корабле под страхом смерти. А теперь избавляетесь, как от наскучившей игрушки?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Сотрудничестве?
  - speaker: narrator
    text_clean: Кассия презрительно кривится.
  - speaker: Cassia Orsellio
    text_clean: Вы обязали меня служить на сем корабле под страхом смерти. А теперь избавляетесь, как от наскучившей игрушки?
- guid: b568b60b-db34-4db6-8e77-fe3265ca7fb3
  event: Companions_Navigator_62
  text: '"Прошу... Прошу простить мне подобное поведение, {name}. Когда я вижу столь тяжелые цвета, мне сразу хочется их перекрасить. Разогнать. Я уже говорила, что не в силах это контролировать, просто... Почему-то именно сейчас мне показалось, что все получится".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Прошу... Прошу простить мне подобное поведение, КЭП. Когда я вижу столь тяжелые цвета, мне сразу хочется их перекрасить. Разогнать. Я уже говорила, что не в силах это контролировать, просто... Почему-то именно сейчас мне показалось, что все получится.
- guid: 1a88f76b-c5eb-4606-8328-bc56388c4141
  event: Companions_Navigator_63
  text: '"Я... приношу глубочайшие извинения, Лорд-капитан. Я не желала вам навредить или оскорбить. Подобное более не повторится".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я... приношу глубочайшие извинения, Лорд-капитан. Я не желала вам навредить или оскорбить. Подобное более не повторится.
- guid: c53b1c5b-111f-4fcd-96e4-a1cbc191e227
  event: Companions_Navigator_64
  text: '"Слишком... много красок. Цвета пестрят, перебивают друг друга, сливаются в единую волну. Она вот-вот захлестнет!.." {n}Леди-Навигатор прикрывает глаза руками, словно от света палящей звезды.{/n} "Простите, но сейчас я не в силах утолить ваш интерес. Быть может, позже".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Слишком... много красок. Цвета пестрят, перебивают друг друга, сливаются в единую волну. Она вот-вот захлестнет!..
  - speaker: narrator
    text_clean: Леди-Навигатор прикрывает глаза руками, словно от света палящей звезды.
  - speaker: Cassia Orsellio
    text_clean: Простите, но сейчас я не в силах утолить ваш интерес. Быть может, позже.
- guid: 4f774048-9198-4e9f-ab07-feac1caf55d5
  event: Companions_Navigator_65
  text: '"Вы?" {n}Кассия удивленно моргает, а затем о чем-то задумывается.{/n} "Будьте столь любезны, Лорд-капитан".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы?
  - speaker: narrator
    text_clean: Кассия удивленно моргает, а затем о чем-то задумывается.
  - speaker: Cassia Orsellio
    text_clean: Будьте столь любезны, Лорд-капитан.
- guid: 32915b21-4599-49c8-9582-31f1ddb2fee9
  event: Companions_Navigator_66
  text: '"Читать цвета ксеносов для меня мучительное испытание. Слишком... больно зрить неисчерпаемую палитру красок, что источает Ирлиэт. Ее оттенки яркие, ослепляющие, неестественные... И очень, очень опасные, Лорд-капитан. Я бы никогда не доверилась существу, столь явно кричащему о своей чуждости человеческому восприятию".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Читать цвета ксеносов для меня мучительное испытание. Слишком... больно зрить неисчерпаемую палитру красок, что источает Ирлиэт. Ее оттенки яркие, ослепляющие, неестественные... И очень, очень опасные, Лорд-капитан. Я бы никогда не доверилась существу, столь явно кричащему о своей чуждости человеческому восприятию.
- guid: 2cd2e43d-6d22-43e9-96ea-f921d4df72ae
  event: Companions_Navigator_67
  text: '{n}Кассия взволнованно прикрывает ладонью рот.{/n} "Я... сделала что-то не так? Глупый вопрос, конечно, я сделала что-то не то. Вновь. Вы правы, мне лучше вернуться в лоно дома и продолжить свое обучение... Прощайте".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия взволнованно прикрывает ладонью рот.
  - speaker: Cassia Orsellio
    text_clean: Я... сделала что-то не так? Глупый вопрос, конечно, я сделала что-то не то. Вновь. Вы правы, мне лучше вернуться в лоно дома и продолжить свое обучение... Прощайте.
- guid: 505db81c-bfa3-43d6-a53b-54fe01a21ca7
  event: Companions_Navigator_68
  text: '"{name}!" {n}Сдержанно улыбаясь, Кассия взмахивает рукой в знак приветствия.{/n} "Словами не передать, как тоскливо на мостике без наших высоких бесед".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: КЭП!
  - speaker: narrator
    text_clean: Сдержанно улыбаясь, Кассия взмахивает рукой в знак приветствия.
  - speaker: Cassia Orsellio
    text_clean: Словами не передать, как тоскливо на мостике без наших высоких бесед.
