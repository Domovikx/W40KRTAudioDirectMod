  text: '{n}Кассия отстраняется, и на лице ее отпечатывается скорбное выражение — словно что-то внутри надломилось.{/n} "Я люблю вас... Но совершенно не так, как об этом рассказывали книги. Ибо я не знала, что любовь может не только возвысить, но и разбить тебя вдребезги, уничтожить, перемолоть, оставить после одни шрамы".'
