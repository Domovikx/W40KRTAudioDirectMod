  event: Companions_Navigator_147
  text: '"Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна". {n}Кассия горько смеется.{/n} "Не волнуйтесь, Вольный Торговец, мой Дом более не доставит вам проблем. Как вы и сказали — мой Атлас отныне стал моим же щитом".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна.
