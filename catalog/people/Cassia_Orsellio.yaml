    text_clean: За пестрыми красками твоей души мне видятся совсем иные оттенки. Меньше золота и серебра, и все больше...
- guid: c2c9990d-8c67-4b1e-8cfa-3f0c094290b9
  event: BNTRS_Stressful_Cassia_47
  text: '"Если бы люди видели в тебе то же, что вижу я... Они бы боялись твоего вида еще больше".'
  speaker: Cassia Orsellio
  parts:
