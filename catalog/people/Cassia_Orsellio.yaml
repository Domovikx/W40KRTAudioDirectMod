  event: RMNC_Cassia_CassiaFirstStep_05
  text: '"Время, проведенное с вами, стало лучшим в моей жизни, {name}. Вы освободили меня от оков страха и отвращения к самой себе. Я... более не отвожу взгляд от зеркала, не стыжусь собственных сил и не намерена скрываться от мира в коконе, что ранее сама же и возвела".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Время, проведенное с вами, стало лучшим в моей жизни, КЭП. Вы освободили меня от оков страха и отвращения к самой себе. Я... более не отвожу взгляд от зеркала, не стыжусь собственных сил и не намерена скрываться от мира в коконе, что ранее сама же и возвела.
