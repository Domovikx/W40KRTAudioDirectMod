- guid: b4123efb-2af5-4bca-af6f-a91a1f6b1cae
  event: Companions_Navigator_167
  text: '"Кибелла омыта ярким, как свежая кровь, багрянцем, и он лишь пронзительнее из-за объятий непроницаемой тьмы. Но эти тяжелые тени не таят в себе зла — они бесстрастны, мрачны, строги... и неумолимо поглощают слабые вспышки иных красок".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Кибелла омыта ярким, как свежая кровь, багрянцем, и он лишь пронзительнее из-за объятий непроницаемой тьмы. Но эти тяжелые тени не таят в себе зла — они бесстрастны, мрачны, строги... и неумолимо поглощают слабые вспышки иных красок.
- guid: ce63bc64-3840-4434-990a-80759305b52b
  event: Companions_Navigator_168
  text: '"Полотно души Кибеллы превратилось в поле боя: я вижу, как всполохи ядовито-зеленых сомнений порождают все новые краски сожалений, гордости и жестокости. Они разрушают прежнюю антрацитово-алую палитру, смешиваясь во все более мутные и пугающие цвета".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: 'Полотно души Кибеллы превратилось в поле боя: я вижу, как всполохи ядовито-зеленых сомнений порождают все новые краски сожалений, гордости и жестокости. Они разрушают прежнюю антрацитово-алую палитру, смешиваясь во все более мутные и пугающие цвета.'
- guid: 5ef30a0e-9a32-4dd8-878d-e2848d4722eb
  event: Companions_Navigator_169
  text: '"Вот и вы, Лорд-капитан". {n}Как только вы подходите ближе, горклый привкус разочарования проявляется на языке, сводя скулы.{/n} "{d|Encyclopedia:MiniJealousyRomanceBroken}Слышала, вы связали себя{/d}… определенными узами с другим членом свиты. Жаль, что вам не хватило духу прежде поставить точку в наших отношениях. Я бы… все поняла". {n}Кассия приподнимает подбородок, и дрожь в ее голосе отступает.{/n} "Но давайте оставим прошлое в прошлом. Чем навигатор может служить своему капитану?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вот и вы, Лорд-капитан.
  - speaker: narrator
    text_clean: Как только вы подходите ближе, горклый привкус разочарования проявляется на языке, сводя скулы.
  - speaker: Cassia Orsellio
    text_clean: Слышала, вы связали себя… определенными узами с другим членом свиты. Жаль, что вам не хватило духу прежде поставить точку в наших отношениях. Я бы… все поняла.
  - speaker: narrator
    text_clean: Кассия приподнимает подбородок, и дрожь в ее голосе отступает.
  - speaker: Cassia Orsellio
    text_clean: Но давайте оставим прошлое в прошлом. Чем навигатор может служить своему капитану?
- guid: 67b18141-17db-4805-99e6-24090b9047be
  event: Companions_Navigator_17
  text: '"В артефакте гемункула была лишь непроглядная тьма, но улицы Темного города не намного светлее — я почти слепну от боли в его иссиня-черной дымке". {n}Кассия хмурится, рассматривая пляшущие в углах тени.{/n} "Сгустки бурого и темно-зеленого смешиваются с оседающим пеплом отчаяния, вплетаясь в гобелен из всех оттенков тьмы".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: В артефакте гемункула была лишь непроглядная тьма, но улицы Темного города не намного светлее — я почти слепну от боли в его иссиня-черной дымке.
  - speaker: narrator
    text_clean: Кассия хмурится, рассматривая пляшущие в углах тени.
  - speaker: Cassia Orsellio
    text_clean: Сгустки бурого и темно-зеленого смешиваются с оседающим пеплом отчаяния, вплетаясь в гобелен из всех оттенков тьмы.
- guid: b64ab0fc-9f7d-47c0-a327-d99a5593c196
  event: Companions_Navigator_18
  text: '"Вы... правы. Было бы эгоистично и слишком непочтительно к обеим нашим династиям поступить иначе. Я передам приглашение Дому". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вы... правы. Было бы эгоистично и слишком непочтительно к обеим нашим династиям поступить иначе. Я передам приглашение Дому.
  - speaker: narrator
    text_clean: Кассия устало потирает нагрудник в месте, где находится Атлас.
- guid: 95b874da-5724-47ab-8f7f-9a2b4fdc9592
  event: Companions_Navigator_19
  text: '"Как во главе протектората стоит {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}, так навигаторским Домом заправляет великий {g|Encyclopedia:Novator}новатор{/g}. Именно новатор решает, с кем заключать союзы и какой путь уготован его династии. В нашем Доме..." {n}Губы девушки едва заметно кривятся.{/n} "...сейчас происходит передача власти преемнику, а стабильность Дома поддерживает Великий Регент Ааронто Орселлио".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Как во главе протектората стоит Вольный Торговец, так навигаторским Домом заправляет великий новатор. Именно новатор решает, с кем заключать союзы и какой путь уготован его династии. В нашем Доме...
  - speaker: narrator
    text_clean: Губы девушки едва заметно кривятся.
  - speaker: Cassia Orsellio
    text_clean: '...сейчас происходит передача власти преемнику, а стабильность Дома поддерживает Великий Регент Ааронто Орселлио.'
- guid: c11e1b67-5bbc-4124-9b47-8ff812447be5
  event: Companions_Navigator_20
  text: '"{name}? Как славно, что вы почтили меня своим присутствием. Я как раз вспоминала путешествие во дворец Атласа... Точнее, к миру ксеносов". {n}Кассия прикрывает рот ладонью и тихо смеется.{/n} "Воспоминания о столь отчаянном поступке окутали мой разум гаммой оттенков. Но когда я думаю, сколь многим ради меня и Дома Орселлио рискнули вы — лазурная шаль сразу же окутывает плечи, а в душе загораются всполохи янтаря. Прошу, примите мою искреннюю благодарность".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: КЭП? Как славно, что вы почтили меня своим присутствием. Я как раз вспоминала путешествие во дворец Атласа... Точнее, к миру ксеносов.
  - speaker: narrator
    text_clean: Кассия прикрывает рот ладонью и тихо смеется.
  - speaker: Cassia Orsellio
    text_clean: Воспоминания о столь отчаянном поступке окутали мой разум гаммой оттенков. Но когда я думаю, сколь многим ради меня и Дома Орселлио рискнули вы — лазурная шаль сразу же окутывает плечи, а в душе загораются всполохи янтаря. Прошу, примите мою искреннюю благодарность.
- guid: f7aea799-8141-4d60-b966-cf06be607e7a
  event: Companions_Navigator_21
  text: '"Вокруг вас сгустились бурые тучи. Они несут былую боль. И... сомнения?" {n}Словно в трансе Кассия тянется к вашему плечу и едва касается его кончиками пальцев. Странное облегчение нисходит на вас — словно легкие полностью раскрылись, и вы впервые за долгое время можете вдохнуть полной грудью. Заметив ваше выражение, девушка испуганно одергивает руку.{/n}'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Вокруг вас сгустились бурые тучи. Они несут былую боль. И... сомнения?
  - speaker: narrator
    text_clean: Словно в трансе Кассия тянется к вашему плечу и едва касается его кончиками пальцев. Странное облегчение нисходит на вас — словно легкие полностью раскрылись, и вы впервые за долгое время можете вдохнуть полной грудью. Заметив ваше выражение, девушка испуганно одергивает руку.
- guid: fb94676e-6a75-4d6e-9c70-4b9c93a8bf6c
  event: Companions_Navigator_22
  text: '{n}Кассия касается нагрудника в области Атласа.{/n} "{d|Encyclopedia:CassiaQ2_NaviClearSoulstone}Силами Дома Орселлио{/d} души наших предков освободились из оков артефакта ксеносов. Их память и мудрость послужат Дому, позволив возвести на руинах настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный свет Императора".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия касается нагрудника в области Атласа.
  - speaker: Cassia Orsellio
    text_clean: Силами Дома Орселлио души наших предков освободились из оков артефакта ксеносов. Их память и мудрость послужат Дому, позволив возвести на руинах настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный свет Императора.
