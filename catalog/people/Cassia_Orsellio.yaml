  event: Companions_Navigator_157
  text: '{n}Кассия смущенно отводит глаза.{/n} "Мне немногое ведомо о том, как... сходятся обычные пары. Книги, которые я читала, обходили эту сторону жизни молчанием. Быть может, стихотворение, идущее от сердца? Впрочем, не уверена, что Джай любит стихи".'
  speaker: Cassia Orsellio
  parts:
  - speaker: narrator
    text_clean: Кассия смущенно отводит глаза.
  - speaker: Cassia Orsellio
