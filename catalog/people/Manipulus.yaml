  event: ManipulusFirstMeet_Manipulus_19
  text: '"Я боюсь, что моя трактовка будет лишена изящества, которым была пронизана его {g|Encyclopedia:LinguaTechnis}лингва-технис{/g}. Но, если грубо суммировать, Нунциус польщен вашим вниманием и фиксирует данный момент как значимый".'
