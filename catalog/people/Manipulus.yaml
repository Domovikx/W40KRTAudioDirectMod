- guid: 5daf45dd-f138-4a8b-804d-974b392fe777
  event: ManipulusFirstMeet_Argenta_01
  text: '{n}Арджента поднимает брови.{/n} "Но ведь он не отвечает тебе? Какая странная причуда!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента поднимает брови.
  - speaker: Sister Argenta
    text_clean: Но ведь он не отвечает тебе? Какая странная причуда!
- guid: c33bb79c-a604-4f8f-9c17-266a81ba0762
  event: ManipulusFirstMeet_Cassia_01
  text: '"Я не вижу каких-либо цветов, исходящих от Нунциуса... Общаться с сервочерепами как с живыми — это некая сакральная практика техножрецов?"'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Я не вижу каких-либо цветов, исходящих от Нунциуса... Общаться с сервочерепами как с живыми — это некая сакральная практика техножрецов?
- guid: 447688f6-c0a8-4423-bd22-da47bbd097cb
  event: ManipulusFirstMeet_Heinrix_01
  text: '"Генетор Фебрус, я надеюсь, что вы понимаете неординарность подобного заявления в адрес сервочерепа?" {n}Хейнрикс с недобрым интересом рассматривает Нунциуса.{/n} "Надеюсь, все дело в вашей персональной сентиментальности, а не присутствии в вашем инструменте ереси".'
  speaker: Heinrix van Calox
  parts:
  - speaker: Heinrix van Calox
    text_clean: Генетор Фебрус, я надеюсь, что вы понимаете неординарность подобного заявления в адрес сервочерепа?
  - speaker: narrator
    text_clean: Хейнрикс с недобрым интересом рассматривает Нунциуса.
  - speaker: Heinrix van Calox
    text_clean: Надеюсь, все дело в вашей персональной сентиментальности, а не присутствии в вашем инструменте ереси.
- guid: fd6cd76b-b64b-4897-a40a-1e441f71f2de
  event: ManipulusFirstMeet_Idira_01
  text: '"Хе, да уж, тот еще балабол! Может у пузатого господина тоже в голове голосочки? Уверена, что мои друзья из-за дверки с радостью составят им компанию".'
  speaker: Idira Tlass
  parts:
  - speaker: Idira Tlass
    text_clean: Хе, да уж, тот еще балабол! Может у пузатого господина тоже в голове голосочки? Уверена, что мои друзья из-за дверки с радостью составят им компанию.
- guid: 7e65e911-672c-4367-904c-8bcd2408a240
  event: ManipulusFirstMeet_Kibellah_01
  text: '"В Кровавой паутине тоже говорят со своими ушедшими братьями и сестрами. Однако ответом нам всегда служит молчание, дарованное {g|Encyclopedia:EmperorGlossary}Неумирающим{/g}."'
  speaker: Kibellah
  parts:
  - speaker: Kibellah
    text_clean: В Кровавой паутине тоже говорят со своими ушедшими братьями и сестрами. Однако ответом нам всегда служит молчание, дарованное Неумирающим.
- guid: 17aea373-c1d5-4cf0-85de-0418ca4143ca
  event: ManipulusFirstMeet_Manipulus_01
  text: '{n}Техножрец мерно выдыхает и открывает глаз.{/n} "Ты прав, Нунциус, я рискую утомить {g|Encyclopedia:RogueTraderGlossary}Вольного Торговца{/g} своими пространными размышлениями. Однако же я не оставлю семантический анализ моего изречения без ответа – я залогирую твои тезисы для дальнейших дебатов. А теперь пора воздать почести".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Техножрец мерно выдыхает и открывает глаз.
  - speaker: Manipulus
    text_clean: Ты прав, Нунциус, я рискую утомить Вольного Торговца своими пространными размышлениями. Однако же я не оставлю семантический анализ моего изречения без ответа – я залогирую твои тезисы для дальнейших дебатов. А теперь пора воздать почести.
- guid: 95020426-e00b-4160-b44c-3b9590f3d1a4
  event: ManipulusFirstMeet_Manipulus_02
  text: '{n}Техножрец меняет угол парения своего туловища — попытка изобразить поклон.{/n} "Вольный Торговец, ваши чертоги полнятся священным металлом, а техножрецы достойно блюдут таинства аугментации, благословенного союза плоти и феррум санктум. Созерцание сего наполняет мои гальванические витки благостью. Я, {g|Encyclopedia:Genetor}генетор{/g} экстремис, Эоганн Фебрус, приветствую вас и благодарю за возможность почтить даром эксплуатации эти древние механизмы".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Техножрец меняет угол парения своего туловища — попытка изобразить поклон.
  - speaker: Manipulus
    text_clean: Вольный Торговец, ваши чертоги полнятся священным металлом, а техножрецы достойно блюдут таинства аугментации, благословенного союза плоти и феррум санктум. Созерцание сего наполняет мои гальванические витки благостью. Я, генетор экстремис, Эоганн Фебрус, приветствую вас и благодарю за возможность почтить даром эксплуатации эти древние механизмы.
- guid: 378b7c4c-ae8d-4863-ac9c-578f1e308ddf
  event: ManipulusFirstMeet_Manipulus_03
  text: '"Верно, абсолютно верно! Я редко встречал столь прозорливых собеседников среди мирян". {n}Глаза {g|Encyclopedia:Manipulus}манипулуса{/g} загораются. В похвале не читается ни нотки сарказма или покровительства — Эоганн искренне рад, словно гордый наставник, хвалящий ученика за проницательность.{/n} "Инициирую почтительный запрос на аудиенцию — я обязан выяснить, какие еще познания скрывает столь богатый разум".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Верно, абсолютно верно! Я редко встречал столь прозорливых собеседников среди мирян.
  - speaker: narrator
    text_clean: Глаза манипулуса загораются. В похвале не читается ни нотки сарказма или покровительства — Эоганн искренне рад, словно гордый наставник, хвалящий ученика за проницательность.
  - speaker: Manipulus
    text_clean: Инициирую почтительный запрос на аудиенцию — я обязан выяснить, какие еще познания скрывает столь богатый разум.
- guid: e078676a-ba13-4693-995c-ddedee6044ee
  event: ManipulusFirstMeet_Manipulus_04
  text: '"Бдение над верной эксплуатацией восстановленных мной технологий — мой священный долг. Помимо этого, Алтарь-Темплум-Каликсис-Экс-17 — закрытая обитель. В ее стенах можно обрести многие мудрости, но, кажется, я исчерпал их запас. Теория закладывает основу для изысканий, но лишь практика способна открыть врата Познания. Мы с Нунциусом всегда были в первую очередь практиками".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Бдение над верной эксплуатацией восстановленных мной технологий — мой священный долг. Помимо этого, Алтарь-Темплум-Каликсис-Экс-17 — закрытая обитель. В ее стенах можно обрести многие мудрости, но, кажется, я исчерпал их запас. Теория закладывает основу для изысканий, но лишь практика способна открыть врата Познания. Мы с Нунциусом всегда были в первую очередь практиками.
- guid: 892eeef9-aba2-4f27-988b-a4b15f9d0c26
  event: ManipulusFirstMeet_Manipulus_05
  text: '"Нунциус — мой дражайший коллега. Его рвение, пытливый ум и умение разносторонне взглянуть на проблему неоценимы для наших исследований. К тому же он сам весьма разговорчив".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нунциус — мой дражайший коллега. Его рвение, пытливый ум и умение разносторонне взглянуть на проблему неоценимы для наших исследований. К тому же он сам весьма разговорчив.
- guid: d9a067a3-8696-4496-8fb9-a43e6d3fdc0d
  event: ManipulusFirstMeet_Manipulus_06
  text: '"Я приношу извинения, Вольный Торговец. Я забываю, что речь Нунциуса может быть затруднительна к восприятию мирянами".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я приношу извинения, Вольный Торговец. Я забываю, что речь Нунциуса может быть затруднительна к восприятию мирянами.
- guid: 5bcb1e9a-0641-48fc-80cf-8d756b1acaee
  event: ManipulusFirstMeet_Manipulus_07
  text: '"Если вычленить лишь саму суть, то гальваническая батарея не только отдает Движущую Силу, но и позволяет мне забирать ее, а после — перераспределять туда, куда укажет воля Омниссии. Например, для пробуждения вашей реликвии мне пришлось обесточить один из не критических для производства малых цехов в обители Алтарь-Темплум".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Если вычленить лишь саму суть, то гальваническая батарея не только отдает Движущую Силу, но и позволяет мне забирать ее, а после — перераспределять туда, куда укажет воля Омниссии. Например, для пробуждения вашей реликвии мне пришлось обесточить один из не критических для производства малых цехов в обители Алтарь-Темплум.
- guid: 90ee0106-d2c1-48bd-9e77-7f879e9b1bbe
  event: ManipulusFirstMeet_Manipulus_08
  text: '"Благодарность принята, но мое служение еще не окончено".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Благодарность принята, но мое служение еще не окончено.
- guid: 463c662c-44f7-4cd6-a385-708df58a779f
  event: ManipulusFirstMeet_Manipulus_09
  text: '"Почти. Смиренно молю выслушать мое прошение".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Почти. Смиренно молю выслушать мое прошение.
- guid: 5d6eafce-1bb9-44d3-8cd8-39f78b7fc0ad
  event: ManipulusFirstMeet_Manipulus_10
  text: '"Духовенство обители Алтарь-Темплум-Каликсис-Экс-17 в благодарность за вести о священном археотехе просит принять в сопровождение магоса Эоганна Фебруса и единицу Нунциус. Я испрашиваю дозволения на использование наших навыков и знаний на благо династии фон Валанциус, включая, но не ограничиваясь, уходом за духами машин Сектора Бионика и экспериментами, служащими на благо делу Познания".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Духовенство обители Алтарь-Темплум-Каликсис-Экс-17 в благодарность за вести о священном археотехе просит принять в сопровождение магоса Эоганна Фебруса и единицу Нунциус. Я испрашиваю дозволения на использование наших навыков и знаний на благо династии фон Валанциус, включая, но не ограничиваясь, уходом за духами машин Сектора Бионика и экспериментами, служащими на благо делу Познания.
- guid: 43a29de1-81d4-45d8-8809-1f619e7ff3bf
  event: ManipulusFirstMeet_Manipulus_11
  text: '"Это мое кредо. Неопровержимый факт, что определял мое бытие сколько я себя помню, а помню я весьма многое. Я посвятил себя таинствам плоти и металла, тому, как одно единяется с другим, как они живут в содружестве и погибают. Машины, подобные той, что я вернул к жизни, хорошо знакомы мне — я обучу ваших техножрецов литаниям обслуживания и эксплуатации и открою секреты командных рун, чтобы они могли оперировать ей сами".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Это мое кредо. Неопровержимый факт, что определял мое бытие сколько я себя помню, а помню я весьма многое. Я посвятил себя таинствам плоти и металла, тому, как одно единяется с другим, как они живут в содружестве и погибают. Машины, подобные той, что я вернул к жизни, хорошо знакомы мне — я обучу ваших техножрецов литаниям обслуживания и эксплуатации и открою секреты командных рун, чтобы они могли оперировать ей сами.
- guid: 03b9d564-db4a-4d29-a672-9537fca9c758
  event: ManipulusFirstMeet_Manipulus_12
  text: '"Прекрасное наблюдение! Моя техническая дезигнация — манипулус". {n}Его {g|Encyclopedia:Mechadendrite}мехадендриты{/g} оживают, указывая на аугментированный живот.{/n} "А здесь находится гальваническая батарея, вместилище Движущей Силы, она... Нет, долго, не наглядно. Демонстрирую!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Прекрасное наблюдение! Моя техническая дезигнация — манипулус.
  - speaker: narrator
