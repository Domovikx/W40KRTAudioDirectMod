- guid: 012d9f5a-f954-4b88-bd03-a6cf47305113
  event: ''
  text: '{n}Манипулус экспрессивно вскидывает многочисленные конечности, едва не скатываясь в воду.{/n} "Вольный Торговец, я нахожу удручающим юмор, построенный на вольном трактовании лингва технис! Со всем почтением, призываю вас относиться к словам моего коллеги более вдумчиво!"'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус экспрессивно вскидывает многочисленные конечности, едва не скатываясь в воду.
  - speaker: Manipulus
    text_clean: Вольный Торговец, я нахожу удручающим юмор, построенный на вольном трактовании лингва технис! Со всем почтением, призываю вас относиться к словам моего коллеги более вдумчиво!
- guid: 16942787-4698-4b90-b4c8-8f2b5a5b7ab7
  event: ''
  text: '"И снова ложный тезис. Я полагаю, причина в том, что образец изначально перенастроил инструмент таким образом, чтобы защитить от несанкционированного воздействия. Это было бы... разумно с точки зрения рационального ума?" {n}Манипулус изо всех сил старается подавить предательскую дрожь в голосе.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: И снова ложный тезис. Я полагаю, причина в том, что образец изначально перенастроил инструмент таким образом, чтобы защитить от несанкционированного воздействия. Это было бы... разумно с точки зрения рационального ума?
  - speaker: narrator
    text_clean: Манипулус изо всех сил старается подавить предательскую дрожь в голосе.
- guid: 19fb8020-c7ed-4562-83b0-d15e7c3c8373
  event: ''
  text: '{n}Манипулус награждает женщину оценивающим взглядом, словно прикидывая, достойным ли собеседником она является. В конце концов он произносит:{/n} "Не желаю ни подтверждать, ни опровергать это утверждение".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Манипулус награждает женщину оценивающим взглядом, словно прикидывая, достойным ли собеседником она является. В конце концов он произносит:'
  - speaker: Manipulus
    text_clean: Не желаю ни подтверждать, ни опровергать это утверждение.
- guid: 2102a8d5-8a5e-4c75-b90a-e92f8718e6fc
  event: ''
  text: '"...таковы повседневные ритуалы, которые нужно соблюдать для сохранения функциональности организма". {n}Манипулус завершает речь, удивленно глядя на своего костяного спутника.{/n} "Нунциус, в мои аудиальные алгоритмы вкралась ошибка, или я слышу храп?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: '...таковы повседневные ритуалы, которые нужно соблюдать для сохранения функциональности организма.'
  - speaker: narrator
    text_clean: Манипулус завершает речь, удивленно глядя на своего костяного спутника.
  - speaker: Manipulus
    text_clean: Нунциус, в мои аудиальные алгоритмы вкралась ошибка, или я слышу храп?
- guid: 3a87e8df-137b-46ca-ad95-bc473f827669
  event: ''
  text: '{n}Манипулус удивительно похоже копирует манеру Паскаля в ответе, с ехидцей косясь на своего оппонента.{/n} "Запрос принят, Вольный Торговец".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус удивительно похоже копирует манеру Паскаля в ответе, с ехидцей косясь на своего оппонента.
  - speaker: Manipulus
    text_clean: Запрос принят, Вольный Торговец.
- guid: 524c342a-59d7-4d79-8b7a-0246dbf3ddf2
  event: ''
  text: '"То есть Адептус Администратум стремятся повысить эффективность аграрных производств, одновременно с этим накладывая вето на исследование и санацию генетических отклонений местных флоры и фауны?" {n}Манипулус скептически приподнимает бровь.{/n} "Решение противоречиво на уровне базиса. Что тому виной, недостаток компетенций или намеренный саботаж?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: То есть Адептус Администратум стремятся повысить эффективность аграрных производств, одновременно с этим накладывая вето на исследование и санацию генетических отклонений местных флоры и фауны?
  - speaker: narrator
    text_clean: Манипулус скептически приподнимает бровь.
  - speaker: Manipulus
    text_clean: Решение противоречиво на уровне базиса. Что тому виной, недостаток компетенций или намеренный саботаж?
- guid: 5715f9f3-b5de-438b-b617-feb10edf88c2
  event: ''
  text: '{n}Манипулус без спешки сканирует ауспексом каждый изгиб корпуса машины.{/n} "Эргономика... далека от священных канонов СШК. Очевидно, перед нами образец технологий ксеносов. Да, Нунциус, я конкретизирую — ксеносы принадлежат к виду друкари. Если моя гипотеза верна, богохульное устройство управляется с помощью ноцицептивных систем живого донора. Иными словами, машина питается чужой агонией".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус без спешки сканирует ауспексом каждый изгиб корпуса машины.
  - speaker: Manipulus
    text_clean: Эргономика... далека от священных канонов СШК. Очевидно, перед нами образец технологий ксеносов. Да, Нунциус, я конкретизирую — ксеносы принадлежат к виду друкари. Если моя гипотеза верна, богохульное устройство управляется с помощью ноцицептивных систем живого донора. Иными словами, машина питается чужой агонией.
- guid: 57e5cd10-20db-4d5f-a144-025c64ee3e31
  event: ''
  text: '"Примечательно, что семантическая вместимость третьей категории охватывает крайне широкий диапазон... сущностей". {n}Манипулус едва заметно улыбается.{/n} "Дальновидность Флота Осознание действительно велика".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Примечательно, что семантическая вместимость третьей категории охватывает крайне широкий диапазон... сущностей.
  - speaker: narrator
    text_clean: Манипулус едва заметно улыбается.
  - speaker: Manipulus
    text_clean: Дальновидность Флота Осознание действительно велика.
- guid: 5c9de6a6-93e7-45ea-a624-af3e75e929a0
  event: ''
  text: '{n}Манипулус лукаво улыбается.{/n} "{name}, позвольте раскрыть вам тайну. Не каждый факт, что провозглашается неопровержимым, является таковым на самом деле. Давайте проверим ваше утверждение на прочность вместе, как подобает коллегам".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус лукаво улыбается.
  - speaker: Manipulus
    text_clean: КЭП, позвольте раскрыть вам тайну. Не каждый факт, что провозглашается неопровержимым, является таковым на самом деле. Давайте проверим ваше утверждение на прочность вместе, как подобает коллегам.
- guid: 63edd955-0ba5-4ceb-b1ac-af87a7508a10
  event: ''
  text: '{n}Манипулус устало поднимает на вас взгляд.{/n} "Всякой вещи в этом мире есть предел, Вольный Торговец. Увы, моему терпению тоже. В таком состоянии я... я... не способен владеть своими эмоциями достаточно хорошо. Простите меня".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус устало поднимает на вас взгляд.
  - speaker: Manipulus
    text_clean: Всякой вещи в этом мире есть предел, Вольный Торговец. Увы, моему терпению тоже. В таком состоянии я... я... не способен владеть своими эмоциями достаточно хорошо. Простите меня.
- guid: 670f2003-71b8-4f6b-9ae1-9e8273cb023f
  event: ''
  text: '{n}Манипулус протягивает к зловонным водам тонкий щуп ауспекс-анализатора.{/n} "Поразительно! Образцы органики в воде столь разнообразны, что по ним можно, фигурально выражаясь, понять, чем живет весь Футфол".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус протягивает к зловонным водам тонкий щуп ауспекс-анализатора.
  - speaker: Manipulus
    text_clean: Поразительно! Образцы органики в воде столь разнообразны, что по ним можно, фигурально выражаясь, понять, чем живет весь Футфол.
- guid: 7090d3d7-56b8-4ea6-aaaa-8dc141897d0d
  event: ''
  text: '{n}Манипулус с трудом фокусирует на вас мутный взгляд.{/n} "Сколь причудлива жизнь, Вольный Торговец. Я превратился из экспериментатора в подопытного... Мой досточтимый коллега придал мне этот неполноценный облик, чтобы пересаживать меня в заготовленные им образцы. Он пытается доказать, что его навыки генетики и аугментации превосходят мои. Пока что он доказал лишь свою мелочность и несостоятельность".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус с трудом фокусирует на вас мутный взгляд.
  - speaker: Manipulus
    text_clean: Сколь причудлива жизнь, Вольный Торговец. Я превратился из экспериментатора в подопытного... Мой досточтимый коллега придал мне этот неполноценный облик, чтобы пересаживать меня в заготовленные им образцы. Он пытается доказать, что его навыки генетики и аугментации превосходят мои. Пока что он доказал лишь свою мелочность и несостоятельность.
- guid: 73ca86a7-bae1-449e-8ea6-fde0020b7256
  event: ''
  text: '{n}Манипулус зеркально повторяет ваши действия, опустошая свой кубок.{/n} "Регистрирую усиление каталитических процессов в печени и острую реакцию периферического сосудистого русла. Процессы торможения в нервной системе угнетены". {n}Техножрец озадаченно поднимает бровь.{/n} "Возможно, это своего рода премедикация для лучшего усвоения питательных веществ?" {n}Он переводит взгляд на парящий рядом сервочереп.{/n} "Не понимаю, что тебя столь развеселило, Нунциус".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус зеркально повторяет ваши действия, опустошая свой кубок.
  - speaker: Manipulus
    text_clean: Регистрирую усиление каталитических процессов в печени и острую реакцию периферического сосудистого русла. Процессы торможения в нервной системе угнетены.
  - speaker: narrator
    text_clean: Техножрец озадаченно поднимает бровь.
  - speaker: Manipulus
    text_clean: Возможно, это своего рода премедикация для лучшего усвоения питательных веществ?
  - speaker: narrator
    text_clean: Он переводит взгляд на парящий рядом сервочереп.
  - speaker: Manipulus
    text_clean: Не понимаю, что тебя столь развеселило, Нунциус.
- guid: 73ecce50-1bb5-4a6f-84b1-9f38e41238e0
  event: ''
  text: '"Видишь, Нунциус, я неоднократно говорил, что твои высказывания способны понять исключительно те, кто обладает незаурядными когнитивными способностями". {n}Манипулус явно удовлетворен результатом вашего "общения" с безмолвным собеседником.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Видишь, Нунциус, я неоднократно говорил, что твои высказывания способны понять исключительно те, кто обладает незаурядными когнитивными способностями.
  - speaker: narrator
    text_clean: Манипулус явно удовлетворен результатом вашего "общения" с безмолвным собеседником.
- guid: 7939d3af-6c13-45f7-9f06-3138ec0cc2f8
  event: ''
  text: '{n}Манипулус невольно хватается за живот.{/n} "Смею уверить вас, что доля профанных технологий во мне значительно преувеличена моим дражайшим коллегой. Они отсутствуют. К тому же, собственный корпус был бы совершенно неоптимальным местом для их хранения..."'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус невольно хватается за живот.
  - speaker: Manipulus
    text_clean: Смею уверить вас, что доля профанных технологий во мне значительно преувеличена моим дражайшим коллегой. Они отсутствуют. К тому же, собственный корпус был бы совершенно неоптимальным местом для их хранения...
- guid: 7bd08855-43d3-4616-b70a-e01772bd265c
  event: ''
  text: '"Завершение жизненного цикла Оптикона-22 прошло в высшей степени достойным образом, я не могу этого отрицать". {n}Манипулус слегка кивает.{/n} "Однако же смерть, пусть и достойная, несет с собой печаль. Почтим же память павшего гальваническим гимном". {n}Вокс Эоганна проигрывает торжественно-скорбную двоичную мелодию.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Завершение жизненного цикла Оптикона-22 прошло в высшей степени достойным образом, я не могу этого отрицать.
  - speaker: narrator
    text_clean: Манипулус слегка кивает.
  - speaker: Manipulus
    text_clean: Однако же смерть, пусть и достойная, несет с собой печаль. Почтим же память павшего гальваническим гимном.
  - speaker: narrator
    text_clean: Вокс Эоганна проигрывает торжественно-скорбную двоичную мелодию.
- guid: 7d455520-dbbc-4bc8-9981-df19f1bf6944
  event: ''
  text: '"Не могу быть уверенным в том, что время и место выбраны удачно, Вольный Торговец". {n}Манипулус с важным видом качает головой.{/n} "Разве готовы миряне воспринять учение Биологис здесь и сейчас? Посмотрите на них. Мудрость постигается в размышлении; их же мысли заняты совершенно иным".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Не могу быть уверенным в том, что время и место выбраны удачно, Вольный Торговец.
  - speaker: narrator
    text_clean: Манипулус с важным видом качает головой.
  - speaker: Manipulus
    text_clean: Разве готовы миряне воспринять учение Биологис здесь и сейчас? Посмотрите на них. Мудрость постигается в размышлении; их же мысли заняты совершенно иным.
- guid: 8a1bcfd8-22aa-4122-8f51-e7ef6905a23c
  event: ''
  text: '"Я навсегда покончу с тобой и твоими лживыми изречениями". {n}Манипулус благодарно кивает вам и склоняется над консолью удерживающей машины, знаком призывая вас отойти. Через несколько минут потоки шипящей плазмы, вырвавшиеся из сердца установки, оставляют от пленника лишь лужицу пузырящегося шлака.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я навсегда покончу с тобой и твоими лживыми изречениями.
  - speaker: narrator
    text_clean: Манипулус благодарно кивает вам и склоняется над консолью удерживающей машины, знаком призывая вас отойти. Через несколько минут потоки шипящей плазмы, вырвавшиеся из сердца установки, оставляют от пленника лишь лужицу пузырящегося шлака.
- guid: 93674d98-46e7-4f9e-917f-8fa75f25e07b
  event: ''
  text: '"Трансформации настолько удивительные, что звучат почти... отрадно". {n}Манипулус даже не пытается скрыть печаль.{/n} "Жаль осознавать, что это с высокой степенью вероятности лишь иллюзия, смущающая наши умы".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Трансформации настолько удивительные, что звучат почти... отрадно.
  - speaker: narrator
    text_clean: Манипулус даже не пытается скрыть печаль.
  - speaker: Manipulus
    text_clean: Жаль осознавать, что это с высокой степенью вероятности лишь иллюзия, смущающая наши умы.
- guid: 9467c6c4-31b2-413e-b6b4-a3a28de0d3c7
  event: ''
  text: '"Я... приношу вам извинения, гемункул. Уровень и глубина ваших знаний несопоставимы с моими, и я зря подвергал сомнению данный факт". {n}Манипулус смотрит в пол, избегая поднимать взгляд.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я... приношу вам извинения, гемункул. Уровень и глубина ваших знаний несопоставимы с моими, и я зря подвергал сомнению данный факт.
  - speaker: narrator
    text_clean: Манипулус смотрит в пол, избегая поднимать взгляд.
- guid: a97cc826-6033-44a2-82d8-431bfe4ac7ae
  event: ''
  text: '"Мои нервные синапсы достаточно экранированы, чтобы на их функционирование не влияли помехи, однако Нунциус... " {n}Манипулус тревожно хмурится.{/n} "...Не столь резистентен к деструктивным воздействиям извне".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мои нервные синапсы достаточно экранированы, чтобы на их функционирование не влияли помехи, однако Нунциус...
  - speaker: narrator
    text_clean: Манипулус тревожно хмурится.
  - speaker: Manipulus
    text_clean: '...Не столь резистентен к деструктивным воздействиям извне.'
- guid: b51edada-9cd1-4556-aabc-32359bfefd5b
  event: ''
  text: '{n}Манипулус стремительно нависает над Атилиусом, с любопытством рассматривая череп и совершенно не обращая внимания на вытянувшееся лицо префектуса.{/n} "Должен заметить, это исключительно сохранный ксенологический образец. Вольный Торговец, обратите внимание на уплощенную кромку резцов, сглаженные надбровные дуги, отсутствие третьей пары моляров, характерное для эльда... Что, Нунциус?" {n}Эоганн резко замолкает.{/n} "Да, я и впрямь увлекся, прости".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус стремительно нависает над Атилиусом, с любопытством рассматривая череп и совершенно не обращая внимания на вытянувшееся лицо префектуса.
  - speaker: Manipulus
    text_clean: Должен заметить, это исключительно сохранный ксенологический образец. Вольный Торговец, обратите внимание на уплощенную кромку резцов, сглаженные надбровные дуги, отсутствие третьей пары моляров, характерное для эльда... Что, Нунциус?
  - speaker: narrator
    text_clean: Эоганн резко замолкает.
  - speaker: Manipulus
    text_clean: Да, я и впрямь увлекся, прости.
- guid: b7ff3b6f-4cb6-42ba-8f9d-45f344768b25
  event: ''
  text: '"Мой коллега Нунциус весьма заинтересовен в том, чтобы обсудить с почтенными коллегами из числа Магос Биологис достигнутые ими результаты... И я горячо поддерживаю его инициативу". {n}Манипулус пытливо всматривается в Вистенцу.{/n} "Ведь метагеномное изыскание проводится под эгидой Культа Механикус, верно?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мой коллега Нунциус весьма заинтересовен в том, чтобы обсудить с почтенными коллегами из числа Магос Биологис достигнутые ими результаты... И я горячо поддерживаю его инициативу.
  - speaker: narrator
    text_clean: Манипулус пытливо всматривается в Вистенцу.
  - speaker: Manipulus
    text_clean: Ведь метагеномное изыскание проводится под эгидой Культа Механикус, верно?
- guid: b87a0f96-0503-4f7b-81db-424b4b029c13
  event: ''
  text: '"Рискну предположить, что контекст высказывания Нунциуса интерпретирован вами неверно". {n}Манипулус озадаченно смыкает и размыкает мехадендриты.{/n} "Во всяком случае, мой коллега точно не произносил ничего подобного".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Рискну предположить, что контекст высказывания Нунциуса интерпретирован вами неверно.
  - speaker: narrator
    text_clean: Манипулус озадаченно смыкает и размыкает мехадендриты.
  - speaker: Manipulus
    text_clean: Во всяком случае, мой коллега точно не произносил ничего подобного.
- guid: bcbdf4c9-688d-4102-8708-bb5a763ddf96
  event: ''
  text: '"То же, что и со мной. Его подключили к опытному образцу, чтобы заставить говорить. Он стоически вынес это истязание, не проронив ни слова". {n}Манипулус прикрывает глаза истончившимися, почти прозрачными веками.{/n} "Тервантьяс хотел, чтобы я видел... весь процесс от начала и до конца".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: То же, что и со мной. Его подключили к опытному образцу, чтобы заставить говорить. Он стоически вынес это истязание, не проронив ни слова.
  - speaker: narrator
    text_clean: Манипулус прикрывает глаза истончившимися, почти прозрачными веками.
  - speaker: Manipulus
    text_clean: Тервантьяс хотел, чтобы я видел... весь процесс от начала и до конца.
- guid: be1f6ffb-fcb7-4929-a340-c06a86104b7e
  event: ''
  text: '"Мою лабораторию. Точнее, уже бывшую лабораторию. Согласно координатам, она находится на темной стороне планеты, в пятом сегменте северного полушария". {n}Манипулус произносит каждое слово до безжизненности выверенно. Его речь, обычно богатая на оттенки, кажется бесцветным подобием самой себя.{/n} "Рекомендую взять с собой достаточно мощные {g|Encyclopedia:Lumen}люмены{/g}, Ваша Светлость. Боюсь, уровень инсоляции на поверхности вряд ли вас удовлетворит".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мою лабораторию. Точнее, уже бывшую лабораторию. Согласно координатам, она находится на темной стороне планеты, в пятом сегменте северного полушария.
  - speaker: narrator
    text_clean: Манипулус произносит каждое слово до безжизненности выверенно. Его речь, обычно богатая на оттенки, кажется бесцветным подобием самой себя.
  - speaker: Manipulus
    text_clean: Рекомендую взять с собой достаточно мощные люмены, Ваша Светлость. Боюсь, уровень инсоляции на поверхности вряд ли вас удовлетворит.
- guid: bf0bab8d-fed9-4b01-8509-28dcf4013b17
  event: ''
  text: '"Ложь!" {n}Манипулус отзывается с неожиданной горячностью.{/n} "Если разум ксеноса столь ограничен, что он {d|Encyclopedia:Ch3_TalkWithHaemunculusAboutNuncius}не может вести диалог{/d} с таким видным мыслителем, как Нунциус, это совершенно точно не вина Нунциуса".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ложь!
  - speaker: narrator
    text_clean: Манипулус отзывается с неожиданной горячностью.
  - speaker: Manipulus
    text_clean: Если разум ксеноса столь ограничен, что он не может вести диалог с таким видным мыслителем, как Нунциус, это совершенно точно не вина Нунциуса.
- guid: d82b959d-e89d-45d4-8c66-fdd1b0aaefa3
  event: ''
  text: '"Истребляй причину, а не симптоматику, как гласит древняя мудрость Магос Биологис". {n}Манипулус задумчиво касается подбородка одним из мехадендритов.{/n} "Нунциус, много ли ты знаешь мирян, способных целенаправленно истязать духа машины?" {n}Выслушав безмолвный ответ сервочерепа, он кивает.{/n} "Солидарен, коллега. Мы явно имеем дело с попыткой саботажа".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Истребляй причину, а не симптоматику, как гласит древняя мудрость Магос Биологис.
  - speaker: narrator
    text_clean: Манипулус задумчиво касается подбородка одним из мехадендритов.
  - speaker: Manipulus
    text_clean: Нунциус, много ли ты знаешь мирян, способных целенаправленно истязать духа машины?
  - speaker: narrator
    text_clean: Выслушав безмолвный ответ сервочерепа, он кивает.
  - speaker: Manipulus
    text_clean: Солидарен, коллега. Мы явно имеем дело с попыткой саботажа.
- guid: e362ea83-e1aa-4717-aa9c-1df470dbd3b4
  event: ''
  text: '{n}Манипулус хлопает себя по лбу.{/n} "Естественно. Основные критерии эксперимента — воспроизводимость и консистентность. Один неудачный опыт — и я готов сдаться? Абсурд! Неужели нужно заменить увечные объекты на здоровых? Критерии отбора определенно требуют пересмотра".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Манипулус хлопает себя по лбу.
  - speaker: Manipulus
    text_clean: Естественно. Основные критерии эксперимента — воспроизводимость и консистентность. Один неудачный опыт — и я готов сдаться? Абсурд! Неужели нужно заменить увечные объекты на здоровых? Критерии отбора определенно требуют пересмотра.
- guid: 77eb5781-b828-4330-b6e4-d1c9549a77ce
  event: CompanionDialogue_Manipulus_01
  text: '"Вольный Торговец, вы как раз вовремя! Я готов обсудить с вами интереснейший эксперимент, который мы провели в Секторе Бионика... и на прочих палубах корабля".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Вольный Торговец, вы как раз вовремя! Я готов обсудить с вами интереснейший эксперимент, который мы провели в Секторе Бионика... и на прочих палубах корабля.
- guid: 62d3a23c-da9e-40d4-a876-9dd6e87939f1
  event: CompanionDialogue_Manipulus_02
  text: '{n}Помедлив, Эоганн ворчит:{/n} "Я готов на это грубое нарушение привилегии приватности, если это развеет ваши сомнения насчет моего коллеги". {n}Он подключает череп к инфопластине и произносит:{/n} "Доступ к логам санкционирован".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Помедлив, Эоганн ворчит:'
  - speaker: Manipulus
    text_clean: Я готов на это грубое нарушение привилегии приватности, если это развеет ваши сомнения насчет моего коллеги.
  - speaker: narrator
    text_clean: 'Он подключает череп к инфопластине и произносит:'
  - speaker: Manipulus
    text_clean: Доступ к логам санкционирован.
- guid: 3f8f9b91-7a30-4cba-98b5-071333be848f
  event: CompanionDialogue_Manipulus_03
  text: '"Эта благословенная крепость-храм хранит в себе множество тайн. Я провел в ней десятилетия, но до сих пор не уверен, что познал их все! Однако духовенство станции не зря славится своей закрытостью — они весьма нехотя идут на контакт с мирянами и даже с иными техножрецами. Нам с Нунциусом повезло, что наши навыки оказались востребованны и мы смогли прильнуть к этому фонтану мудрости".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Эта благословенная крепость-храм хранит в себе множество тайн. Я провел в ней десятилетия, но до сих пор не уверен, что познал их все! Однако духовенство станции не зря славится своей закрытостью — они весьма нехотя идут на контакт с мирянами и даже с иными техножрецами. Нам с Нунциусом повезло, что наши навыки оказались востребованны и мы смогли прильнуть к этому фонтану мудрости.
- guid: cda6565f-43ff-4b9a-b71a-81cc7258fd88
  event: CompanionDialogue_Manipulus_04
  text: '"Нет, не все. Одеяния {g|Encyclopedia:TechPriest}техножрецов{/g} часто разнятся от миру к миру — они пронизаны символизмом, отражающим принципы конкретной ветви технодуховенства. Красный — цвет {g|Encyclopedia:MarsGlossary}Марса{/g}, он присутствует в одеяниях каждого мира как дань уважения Красной Планете. Белый символизирует чистоту машин и священную аугментику".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нет, не все. Одеяния техножрецов часто разнятся от миру к миру — они пронизаны символизмом, отражающим принципы конкретной ветви технодуховенства. Красный — цвет Марса, он присутствует в одеяниях каждого мира как дань уважения Красной Планете. Белый символизирует чистоту машин и священную аугментику.
- guid: bd674545-23df-4e41-99f7-ef69f3b0c21d
  event: CompanionDialogue_Manipulus_05
  text: '"Я посвятил свою жизнь множеству вопросов — благам слияния органики и машины, поиску ценности в их раздельном бытии, возможности продления функционирования плоти путями генетики и алхимии. Бог-Машина совершенен во всех своих проявлениях — это истина и неопровержимый факт. Но мне кажется, что попытки уподобиться Ему исключительно через {g|Encyclopedia:AugmentationGlossary}аугментику{/g}, пусть и благие в своей праведности, но не до конца отражают Его замысел. Ведь органическое тело — не что иное, как биологическая машина, чьи части можно заменять и улучшать путем генетической трансмутации".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я посвятил свою жизнь множеству вопросов — благам слияния органики и машины, поиску ценности в их раздельном бытии, возможности продления функционирования плоти путями генетики и алхимии. Бог-Машина совершенен во всех своих проявлениях — это истина и неопровержимый факт. Но мне кажется, что попытки уподобиться Ему исключительно через аугментику, пусть и благие в своей праведности, но не до конца отражают Его замысел. Ведь органическое тело — не что иное, как биологическая машина, чьи части можно заменять и улучшать путем генетической трансмутации.
- guid: 5563ac4e-8587-449f-9983-bc303ddc731e
  event: CompanionDialogue_Manipulus_06
  text: '"Вольный Торговец. Я... я не понимаю. Омниссия даровал мне откровение, но я не чувствую благодарности, лишь тяжесть и боль. Было бы ересью взмолиться к Нему с просьбой забрать это знание? Да, пожалуй. Не Нунциус нуждается в починке. Нет, вовсе не он..." {n}Он смотрит на серворчереп будто впервые.{/n} "Мне нужно время, чтобы осознать, убедиться, что я не ошибся, и это не очередное наваждение Комморры. Мы вернемся к этому разговору позже, а сейчас, пожалуйста, оставьте меня".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Вольный Торговец. Я... я не понимаю. Омниссия даровал мне откровение, но я не чувствую благодарности, лишь тяжесть и боль. Было бы ересью взмолиться к Нему с просьбой забрать это знание? Да, пожалуй. Не Нунциус нуждается в починке. Нет, вовсе не он...
  - speaker: narrator
    text_clean: Он смотрит на серворчереп будто впервые.
  - speaker: Manipulus
    text_clean: Мне нужно время, чтобы осознать, убедиться, что я не ошибся, и это не очередное наваждение Комморры. Мы вернемся к этому разговору позже, а сейчас, пожалуйста, оставьте меня.
- guid: 9f64c19a-f1a7-4ae1-88cd-5da8756621e8
  event: CompanionDialogue_Manipulus_07
  text: '{n}Эоганн вежливо улыбается.{/n} "Если в моем распоряжении будет подходящий источник Движущей Силы для перераспределения, я смогу оживить {g|Encyclopedia:Lumen}люмены{/g} на всей палубе, Вольный Торговец. Однако я надеюсь, что это не единственное применение, которые вы найдете моим талантам".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн вежливо улыбается.
  - speaker: Manipulus
    text_clean: Если в моем распоряжении будет подходящий источник Движущей Силы для перераспределения, я смогу оживить люмены на всей палубе, Вольный Торговец. Однако я надеюсь, что это не единственное применение, которые вы найдете моим талантам.
- guid: 70def697-9dd4-420d-8d23-8b87baf2c251
  event: CompanionDialogue_Manipulus_08
  text: '"Моя физическая целостность восстановлена. Мне пришлось пристально изучить свою плоть и аугменты, очищая от ксеносской скверны все, что было мне подвластно... Но боюсь, что окончательно исторгнуть мерзость я смогу лишь проведя очистительные ритуалы на судне под сенью святой машинерии Сектора Бионика. Я подозреваю, что еще многие мои импланты осквернены, но, по крайней мере, я функционален. Однако мой разум в смятении — порок иррациональности застилает мысли, словно саван. Но я отгоню его — ведь поддаться значит признать победу ксеноса. Не быть тому!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Моя физическая целостность восстановлена. Мне пришлось пристально изучить свою плоть и аугменты, очищая от ксеносской скверны все, что было мне подвластно... Но боюсь, что окончательно исторгнуть мерзость я смогу лишь проведя очистительные ритуалы на судне под сенью святой машинерии Сектора Бионика. Я подозреваю, что еще многие мои импланты осквернены, но, по крайней мере, я функционален. Однако мой разум в смятении — порок иррациональности застилает мысли, словно саван. Но я отгоню его — ведь поддаться значит признать победу ксеноса. Не быть тому!
- guid: 569dcd69-e17a-4862-b28f-bf2b05646b22
  event: CompanionDialogue_Manipulus_09
  text: '"А я — свое. Вопросы, которые задает человек могут сказать о нем больше, чем то, что он говорит про себя сам".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: А я — свое. Вопросы, которые задает человек могут сказать о нем больше, чем то, что он говорит про себя сам.
- guid: bb219eb9-7f28-4e3b-8804-c53caaa77246
  event: CompanionDialogue_Manipulus_10
  text: '{n}Эоганн добродушно посмеивается.{/n} "Считать, что все техножрецы говорят исключительно подобно машинам — распространенное заблуждение среди мирян. Пусть мы и стремимся к тождеству с Омниссией, мы все еще часть рода человеческого. Как именно добиваться тождества — выбор каждого посвященного в духовенство Марса, во многом зависящий от личных особенностей, практических соображений и трактовок догматов веры. Безусловно, многие уподобляют свою речь машинной или даже предпочитает не использовать плотьяз вовсе — так им проще вступать в контакт с {g|Encyclopedia:MachineSpirit}машинными духами{/g}".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн добродушно посмеивается.
  - speaker: Manipulus
    text_clean: Считать, что все техножрецы говорят исключительно подобно машинам — распространенное заблуждение среди мирян. Пусть мы и стремимся к тождеству с Омниссией, мы все еще часть рода человеческого. Как именно добиваться тождества — выбор каждого посвященного в духовенство Марса, во многом зависящий от личных особенностей, практических соображений и трактовок догматов веры. Безусловно, многие уподобляют свою речь машинной или даже предпочитает не использовать плотьяз вовсе — так им проще вступать в контакт с машинными духами.
- guid: 1853220f-6309-4424-92f4-4d1132b5a69f
  event: CompanionDialogue_Manipulus_100
  text: '"Сан {g|Encyclopedia:Genetor}генетора{/g} наделяет меня правом изучать их гнусную анатомию и повадки с целью поиска уязвимостей. Я лично препарировал не один образец и даже сохранил определенные части с целью дальнейшего изучения. С теми же целями я веду поиск и изучение их технологий. Орудия врагов не зазорно применять против них самих, что бы ни говорили некоторые узколобые коллеги!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Сан генетора наделяет меня правом изучать их гнусную анатомию и повадки с целью поиска уязвимостей. Я лично препарировал не один образец и даже сохранил определенные части с целью дальнейшего изучения. С теми же целями я веду поиск и изучение их технологий. Орудия врагов не зазорно применять против них самих, что бы ни говорили некоторые узколобые коллеги!
- guid: 413d6497-3147-4f37-897f-48e7c4b7df5e
  event: CompanionDialogue_Manipulus_101
  text: '"Я ценю вашу сдержанность, Вольный Торговец. Как правило, данное утверждение в мой адрес звучит не в виде вопроса, а обвинения. Я не буду пытаться вас убеждать в своей праведности, но я озвучу несколько фактов, на основе которых вы сами сможете прийти к собственному выводу".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я ценю вашу сдержанность, Вольный Торговец. Как правило, данное утверждение в мой адрес звучит не в виде вопроса, а обвинения. Я не буду пытаться вас убеждать в своей праведности, но я озвучу несколько фактов, на основе которых вы сами сможете прийти к собственному выводу.
- guid: 40d1a7e2-f4f8-44ae-9b2a-bbc46bd1ddf0
  event: CompanionDialogue_Manipulus_102
  text: '"Я бы сказал, мифических. Объект моих изысканий — некая древняя необычайно развитая ксеноцивилизация. Некоторые из {g|Encyclopedia:AdeptusMechanicusGlossary}технодуховенства{/g} зовут их нефилимехами, считая их первыми творениями Омниссии. Иные называют их железными анафемами, считая их порождениями Изуверского Интеллекта. Посвященные же знают их как "некронов", и поверьте, длань Бога-Машины не касалась этих чудовищных созданий".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я бы сказал, мифических. Объект моих изысканий — некая древняя необычайно развитая ксеноцивилизация. Некоторые из технодуховенства зовут их нефилимехами, считая их первыми творениями Омниссии. Иные называют их железными анафемами, считая их порождениями Изуверского Интеллекта. Посвященные же знают их как "некронов", и поверьте, длань Бога-Машины не касалась этих чудовищных созданий.
- guid: 0bd9600d-2e37-4759-9cfa-3618af0adae5
  event: CompanionDialogue_Manipulus_103
  text: '"Есть неконсистентности, которые я обнаружил в своих поисках. Колонии-призраки со свежими следами, подходящими под описания этих ксеносов из различных источников. Экспедии Адептус Механикус, что ныряли в обсидиановые руины и не возвращались. Пробелы в репозиториях знаний отдельных миров, словно кто-то пытался утаить информацию. Все это — необъяснимые случайности по отдельности, но если проанализировать совокупную частоту событий, системы, где они происходили, и сопоставить с тем немногим, что мне известно, то можно найти определенные паттерны. Древние ксеносы проявляют активность".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Есть неконсистентности, которые я обнаружил в своих поисках. Колонии-призраки со свежими следами, подходящими под описания этих ксеносов из различных источников. Экспедии Адептус Механикус, что ныряли в обсидиановые руины и не возвращались. Пробелы в репозиториях знаний отдельных миров, словно кто-то пытался утаить информацию. Все это — необъяснимые случайности по отдельности, но если проанализировать совокупную частоту событий, системы, где они происходили, и сопоставить с тем немногим, что мне известно, то можно найти определенные паттерны. Древние ксеносы проявляют активность.
- guid: cdb1119a-cef7-4ac0-8fee-f877a0961a3b
  event: CompanionDialogue_Manipulus_104
  text: '"Я думал, что мне удастся принести пользу Империуму, сотворив настоящих праведников. Но я не учел, что у каждого человека в Империуме уже есть своя роль и функция. Как части машины, работающие сообразно своему предназначению, люди, что выполняют свою функцию — уже праведны. Это неопровержимый факт. Попытка собрать из них что-то новое лишает их функциональности и, соответственно, духовной чистоты. Я сотворил грех изобретения, но с людьми — за что уже назначил себе соответствующую епитимью".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я думал, что мне удастся принести пользу Империуму, сотворив настоящих праведников. Но я не учел, что у каждого человека в Империуме уже есть своя роль и функция. Как части машины, работающие сообразно своему предназначению, люди, что выполняют свою функцию — уже праведны. Это неопровержимый факт. Попытка собрать из них что-то новое лишает их функциональности и, соответственно, духовной чистоты. Я сотворил грех изобретения, но с людьми — за что уже назначил себе соответствующую епитимью.
- guid: 19aab17a-fbe9-469c-a3c6-1128ed8af202
  event: CompanionDialogue_Manipulus_105
  text: '{n}Его улыбку сложно прочитать.{/n} "Интересный вопрос. Отвечу на него другим вопросом: смог бы я рассказать о подобной встрече мирян{mf|ину|ке}, не нарушив обеты, данные {g|Encyclopedia:CultMechanicus}Культу Механикус{/g}? Этот вопрос не требует ответа, это лишь пища для размышлений".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Его улыбку сложно прочитать.
  - speaker: Manipulus
    text_clean: 'Интересный вопрос. Отвечу на него другим вопросом: смог бы я рассказать о подобной встрече мирянину, не нарушив обеты, данные Культу Механикус? Этот вопрос не требует ответа, это лишь пища для размышлений.'
- guid: 194f7b13-0623-47c5-92cf-55ad07cffc05
  event: CompanionDialogue_Manipulus_106
  text: '"В этом вся ее прелесть — я не знаю!" {n}Эоганн говорит это восторженно, словно незнание чего-либо для него интересная диковинка.{/n} "Кхм, позвольте конкретизировать. В нее входят объекты преимущественно правильных формы — кубы, сферы, цилиндры — изготовленные из неизвестного черного камня или металла. Многие покрыты глифами или орнаментами, которые невозможно расшифровать. Занимательные безделушки, за изучением которых я провел годы, но так и не продвинулся дальше шатких теорий, которые невозможно подтвердить опытным путем".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: В этом вся ее прелесть — я не знаю!
  - speaker: narrator
    text_clean: Эоганн говорит это восторженно, словно незнание чего-либо для него интересная диковинка.
  - speaker: Manipulus
    text_clean: Кхм, позвольте конкретизировать. В нее входят объекты преимущественно правильных формы — кубы, сферы, цилиндры — изготовленные из неизвестного черного камня или металла. Многие покрыты глифами или орнаментами, которые невозможно расшифровать. Занимательные безделушки, за изучением которых я провел годы, но так и не продвинулся дальше шатких теорий, которые невозможно подтвердить опытным путем.
- guid: 11390786-580d-4eca-b517-e9463b299df3
  event: CompanionDialogue_Manipulus_107
  text: '"С интересом жду какую новую тему для обсуждения вы выдвинете".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: С интересом жду какую новую тему для обсуждения вы выдвинете.
- guid: 660ba038-42bd-43fc-b6d0-702ca44e628a
  event: CompanionDialogue_Manipulus_108
  text: '"Я перебрал бесчетное количество комбинаций возможных действий, обстоятельств и вероятностей. К сожалению, пока что самым надежным и прогнозируемым ответом является самоустранение. Заметьте, я не предлагаю им воспользоваться".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я перебрал бесчетное количество комбинаций возможных действий, обстоятельств и вероятностей. К сожалению, пока что самым надежным и прогнозируемым ответом является самоустранение. Заметьте, я не предлагаю им воспользоваться.
- guid: de071527-2b63-4c42-a1ce-d43dc052d3d3
  event: CompanionDialogue_Manipulus_109
  text: '"Впрочем, если отринуть пессиместичные прогнозы и исходить из гипотезы, что бегство отсюда вообще возможно, то лучшая ставка — воспользоваться сварами ксеносов. За время бытия объектом экспериментов гемункула, я сделал вывод, что гордыня и зависть свойственны не только ему, но и всему его проклятому виду в целом. Нет вопроса будет ли он плести интриги — вопрос лишь в том, когда их паутина утащит его на дно. Гипотетически, это и будет нашим шансом".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Впрочем, если отринуть пессиместичные прогнозы и исходить из гипотезы, что бегство отсюда вообще возможно, то лучшая ставка — воспользоваться сварами ксеносов. За время бытия объектом экспериментов гемункула, я сделал вывод, что гордыня и зависть свойственны не только ему, но и всему его проклятому виду в целом. Нет вопроса будет ли он плести интриги — вопрос лишь в том, когда их паутина утащит его на дно. Гипотетически, это и будет нашим шансом.
- guid: d3d930a8-4655-4bed-b66f-5a0f46d5ab69
  event: CompanionDialogue_Manipulus_11
  text: '"Я могу лишь поощрить подобное стремление к познания! Спрашивайте".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я могу лишь поощрить подобное стремление к познания! Спрашивайте.
- guid: b2ec6f8d-db26-4b9c-b921-415f4fb66c48
  event: CompanionDialogue_Manipulus_110
  text: '"И это нас объединяет. Искренний ответ, не каждый владыка готов признаться, что боится чего-либо".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: И это нас объединяет. Искренний ответ, не каждый владыка готов признаться, что боится чего-либо.
- guid: ace38019-c8a7-4b91-b24b-223f1c242276
  event: CompanionDialogue_Manipulus_111
  text: '"Ведь именно она побуждает нас на поступки, которые придают жизни смысл и достоинство. Вы смелый человек, Вольный Торговец".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ведь именно она побуждает нас на поступки, которые придают жизни смысл и достоинство. Вы смелый человек, Вольный Торговец.
- guid: 1e7a59a3-d567-4a1e-bc84-8858ef9971e1
  event: CompanionDialogue_Manipulus_112
  text: '"Ведь она так коротка, зачем вмещать в нее еще страхи и сожаления? Это ответ человека, укорененного в реальности и жадного до жизни".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ведь она так коротка, зачем вмещать в нее еще страхи и сожаления? Это ответ человека, укорененного в реальности и жадного до жизни.
- guid: 3de61847-516e-4d53-9bd4-33db308d8d63
  event: CompanionDialogue_Manipulus_113
  text: '"Амбиции, подкрепленные волей часто преодолевают грань возможного. Мне было бы интересно узреть тот момент, когда вы их воплотите".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Амбиции, подкрепленные волей часто преодолевают грань возможного. Мне было бы интересно узреть тот момент, когда вы их воплотите.
- guid: cc9aeddb-2982-4e4f-9e46-e11746f2f7cc
  event: CompanionDialogue_Manipulus_114
  text: '"Благодарю, что потешили мое любопытство. Теперь ваш черед задавать тему беседы".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Благодарю, что потешили мое любопытство. Теперь ваш черед задавать тему беседы.
- guid: 946d6a70-d16d-4ac8-bfc3-b41fd5f331ad
  event: CompanionDialogue_Manipulus_115
  text: '"Дражайший коллега говорит, что не собирается покидать меня. Боюсь, что мы с ним неразлучны. Если Нунциус вам импонирует, уверены ли вы, что не готовы потерпеть мое присутствие на судне хотя бы ради его общества?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Дражайший коллега говорит, что не собирается покидать меня. Боюсь, что мы с ним неразлучны. Если Нунциус вам импонирует, уверены ли вы, что не готовы потерпеть мое присутствие на судне хотя бы ради его общества?
- guid: 655cb2ac-ce6b-46ce-af3e-485aa6f901e0
  event: CompanionDialogue_Manipulus_116
  text: '"Факт первый. Мой интерес к ксеносам легко принять за симпатию. Это не так. Они мне симпатичны не больше, чем кадавр, что подвергается вивисекции, дабы узнать какая хворь оборвала его существование. Они — объекты, чье изучение дает ответ на простой вопрос: как их можно уничтожить наиболее эффективно?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: 'Факт первый. Мой интерес к ксеносам легко принять за симпатию. Это не так. Они мне симпатичны не больше, чем кадавр, что подвергается вивисекции, дабы узнать какая хворь оборвала его существование. Они — объекты, чье изучение дает ответ на простой вопрос: как их можно уничтожить наиболее эффективно?'
- guid: 9a1de88d-0ff1-4aac-ac9b-49e1f071dff6
  event: CompanionDialogue_Manipulus_117
  text: '"Факт второй. Некоторые виды ксеносов обладают технологической сноровкой. Их оружие и артефакты имеют деструктивные и утилитарные свойства, которые способны возвысить мощь Империума. Изучая сии свойства я нахожу способы транслировать их на технологии, ниспосланные нам Богом-Машиной. Грех изобретения не свершается — я уподобляю эти изыскания созданию новых производственных паттернов".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Факт второй. Некоторые виды ксеносов обладают технологической сноровкой. Их оружие и артефакты имеют деструктивные и утилитарные свойства, которые способны возвысить мощь Империума. Изучая сии свойства я нахожу способы транслировать их на технологии, ниспосланные нам Богом-Машиной. Грех изобретения не свершается — я уподобляю эти изыскания созданию новых производственных паттернов.
- guid: fa8fd9a0-cef7-4f56-8d9d-9024bb7363e6
  event: CompanionDialogue_Manipulus_118
  text: '"Факт третий, заключительный. Мои изыскания направлены исключительно на благо Поиска знания и усиление Империума. Пусть моим штудиям и присуща определенная дерзость, я чту догмы и следую праведным алгоритмам Культа Механикус. За сим презентация моей позиции окончена".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Факт третий, заключительный. Мои изыскания направлены исключительно на благо Поиска знания и усиление Империума. Пусть моим штудиям и присуща определенная дерзость, я чту догмы и следую праведным алгоритмам Культа Механикус. За сим презентация моей позиции окончена.
- guid: b3b0b580-2dd1-484f-81ad-75832eba9e06
  event: CompanionDialogue_Manipulus_119
  text: '"Может быть мой подход в корне неверен или эти объекты не функциональны. А может быть они просто не хотят, чтобы кто-либо выведал их тайны? Загадка! До чего же стимулирующая загадка!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Может быть мой подход в корне неверен или эти объекты не функциональны. А может быть они просто не хотят, чтобы кто-либо выведал их тайны? Загадка! До чего же стимулирующая загадка!
- guid: d2e51448-559d-427e-bfad-0613ef2e4df6
  event: CompanionDialogue_Manipulus_12
  text: '"Сложный вопрос, а потому интересный! Аугментация с точки зрения Культа Механикус является безусловным благом — плоть слаба и, заменяя ее, мы становимся ближе к Омниссии. Но это благо также является величайшей привилегией. Каждый аугмент — рукотворное чудо, славящее Бога-Машину и не каждый мирянин достоин подобного благословения".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Сложный вопрос, а потому интересный! Аугментация с точки зрения Культа Механикус является безусловным благом — плоть слаба и, заменяя ее, мы становимся ближе к Омниссии. Но это благо также является величайшей привилегией. Каждый аугмент — рукотворное чудо, славящее Бога-Машину и не каждый мирянин достоин подобного благословения.
- guid: 53bd4a0b-7946-44e3-b252-8bfeb101f71c
  event: CompanionDialogue_Manipulus_120
  text: '"Все остальные коммуникационные потребности успешно закрывает мой дражайший коллега".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Все остальные коммуникационные потребности успешно закрывает мой дражайший коллега.
- guid: 7d701d7a-2212-4f35-afd2-a981926016ab
  event: CompanionDialogue_Manipulus_121
  text: '{n}Эоганн растерянно смотрит на сервочереп у себя в руках, потом за плечо{/n}. "Но... Как же... Нет. Не может быть. Ведь я слышу его". {n}Его губы дрожат, пальцы то сжимаются, то разжимаются. Он выглядит жалко, потерянно. Приложив пальцы к вискам он зажмуривается, мучительно пытаясь что-то вспомнить. Вдруг глаза распахиваются и раздается сдавленный стон. Он ошарашенно смотрит на вас.{/n}'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн растерянно смотрит на сервочереп у себя в руках, потом за плечо
  - speaker: Manipulus
    text_clean: . "Но... Как же... Нет. Не может быть. Ведь я слышу его".
  - speaker: narrator
    text_clean: Его губы дрожат, пальцы то сжимаются, то разжимаются. Он выглядит жалко, потерянно. Приложив пальцы к вискам он зажмуривается, мучительно пытаясь что-то вспомнить. Вдруг глаза распахиваются и раздается сдавленный стон. Он ошарашенно смотрит на вас.
- guid: fba1f3b6-5fac-4026-835a-606d131e45d4
  event: CompanionDialogue_Manipulus_122
  text: '"Что? Это невообразимо! Должно быть проклятый ксенос нарушил целостность логов. Нунциус, что он с тобой сделал?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Что? Это невообразимо! Должно быть проклятый ксенос нарушил целостность логов. Нунциус, что он с тобой сделал?
- guid: 22c8134f-060f-4dc5-ab64-3343b6de3959
  event: CompanionDialogue_Manipulus_123
  text: '"А под ними вглубь луны лабиринтом вбуриваются архивы и лаборатории, где многие мудрецы культивируют знания и проводят эксперименты во имя постижения замысла {g|Encyclopedia:OmnissiahGlossary}Бога-Машины{/g}. В них я и Нунциус провели свои отрочество и зрелость, прежде чем получили дозволение покинуть кельи, сменив их на каюты экспедиционных судов и шатры полевых лагерей. Я скучаю по дому, но не жалею, что покинул его, ибо стагнация — враг Познания".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: А под ними вглубь луны лабиринтом вбуриваются архивы и лаборатории, где многие мудрецы культивируют знания и проводят эксперименты во имя постижения замысла Бога-Машины. В них я и Нунциус провели свои отрочество и зрелость, прежде чем получили дозволение покинуть кельи, сменив их на каюты экспедиционных судов и шатры полевых лагерей. Я скучаю по дому, но не жалею, что покинул его, ибо стагнация — враг Познания.
- guid: d88ab62c-258f-47f4-9d96-7c9f063810ba
  event: CompanionDialogue_Manipulus_124
  text: '"Жить на Стигии VIII — значит принимать на себя определенную стигму. Определенные... теологические разногласия зачастую приводят к конфликтам с нашими собратьями. Черный цвет символизирует нашу осторожность и инаковость, а красным мы подчеркиваем чистоту веры в {g|Encyclopedia:OmnissiahGlossary}Омниссию{/g} и общность с остальным Культом Механикус".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Жить на Стигии VIII — значит принимать на себя определенную стигму. Определенные... теологические разногласия зачастую приводят к конфликтам с нашими собратьями. Черный цвет символизирует нашу осторожность и инаковость, а красным мы подчеркиваем чистоту веры в Омниссию и общность с остальным Культом Механикус.
- guid: 1025833a-53be-4537-9672-6dedbb6d8e83
  event: CompanionDialogue_Manipulus_125
  text: '{n}Эоганн смотрит на Нунциуса, после чего кивает.{/n} "Духовенство Стигии VIII весьма настойчиво в делах аквизиции образцов ксеносских технологий. Наша доктрина подразумевает, что любые методы получения преимущества над врагами человечества оправданы, покуда они не переходят за грань ереси. Как вы догадываетесь, где именно проходит эта грань — объект вековых дебатов и раздрая".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн смотрит на Нунциуса, после чего кивает.
  - speaker: Manipulus
    text_clean: Духовенство Стигии VIII весьма настойчиво в делах аквизиции образцов ксеносских технологий. Наша доктрина подразумевает, что любые методы получения преимущества над врагами человечества оправданы, покуда они не переходят за грань ереси. Как вы догадываетесь, где именно проходит эта грань — объект вековых дебатов и раздрая.
- guid: 2794fb3c-ad13-4e26-bfbe-09aa65059526
  event: CompanionDialogue_Manipulus_126
  text: '{n}Эоганн пренебрежительно машет ладонью.{/n} "Всякие склоки о трактовке древних догм, которые непременно возникают в любом месте, где столкнутся хотя бы два техножреца. Погружаться в них будучи мирян{mf|ином|кой} — лишь наживать головную боль на пустом месте".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн пренебрежительно машет ладонью.
  - speaker: Manipulus
    text_clean: Всякие склоки о трактовке древних догм, которые непременно возникают в любом месте, где столкнутся хотя бы два техножреца. Погружаться в них будучи мирянином — лишь наживать головную боль на пустом месте.
- guid: 45515566-fdc1-43bf-81b9-6a0bb1b0ab0a
  event: CompanionDialogue_Manipulus_127
  text: '"Это ведет к тому, что мы зачастую вынуждены прибегать к определенной скрытности, что лишь усиливает подозрения в адрес нашего мира. Но ради победы {g|Encyclopedia:ImperiumGlossary}Империума{/g} мы готовы жить с этой стигмой — это неопровержимый факт".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Это ведет к тому, что мы зачастую вынуждены прибегать к определенной скрытности, что лишь усиливает подозрения в адрес нашего мира. Но ради победы Империума мы готовы жить с этой стигмой — это неопровержимый факт.
- guid: 3f198998-e6a0-4d1f-ab3d-31ea77502f91
  event: CompanionDialogue_Manipulus_128
  text: '{n}Пауза. Взгляд техножреца смягчается.{/n} "Он также добавляет, что мысль о работе с кем-либо, кроме меня, вызывает у него отторжение и негодование. Коэффицент ценности наших отношений крайне высок в его каталоге".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Пауза. Взгляд техножреца смягчается.
  - speaker: Manipulus
    text_clean: Он также добавляет, что мысль о работе с кем-либо, кроме меня, вызывает у него отторжение и негодование. Коэффицент ценности наших отношений крайне высок в его каталоге.
- guid: b43f80ff-6e72-4ca4-965f-9ac9cf758b4b
  event: CompanionDialogue_Manipulus_129
  text: '{n}Повернувшись к вам, он расплывается в улыбке.{/n} "Вольный Торговец, как видите, наше {d|Encyclopedia:Ch4_EogunnFinalMadness}единение с коллегой{/d} уже приносит свои плоды. Есть нюансы триасомии, которые нам предстоит доработать, но, как вы знаете, мне даже проще экспериментировать на себе. Мне сложно описать ту экзальтацию, что я испытываю от воссоединения с дражайшим коллегой! Он жив благодаря вам!" {n}Манипулус довольно указывает на пустую точку в пространстве.{/n}'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Повернувшись к вам, он расплывается в улыбке.
  - speaker: Manipulus
    text_clean: Вольный Торговец, как видите, наше единение с коллегой уже приносит свои плоды. Есть нюансы триасомии, которые нам предстоит доработать, но, как вы знаете, мне даже проще экспериментировать на себе. Мне сложно описать ту экзальтацию, что я испытываю от воссоединения с дражайшим коллегой! Он жив благодаря вам!
  - speaker: narrator
    text_clean: Манипулус довольно указывает на пустую точку в пространстве.
- guid: a381c1e3-c993-4c07-96de-0cbe6d84ab32
  event: CompanionDialogue_Manipulus_13
  text: '{n}Эоганн улыбается.{/n} "Если моя физиономия вызывает у вас антипатию, вам не обязательно это прятать за обтекаемыми формулировками. Однако же я буду отвечать исходя из гипотезы, что ваш вопрос искренний. Мое лицо так выглядит, потому что таковы мои предпочтения. Вокс-решетка практична, но есть что-то в том, чтобы проговаривать мысли вслух использую органический речевой аппарат. Считайте это моей блажью. К тому же, внешность обманчива — я экстенсивно имплантирован внутри, и вполне способен изъясняться на {g|Encyclopedia:LinguaTechnis}Лингва Технис{/g} и бинарике".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн улыбается.
  - speaker: Manipulus
    text_clean: Если моя физиономия вызывает у вас антипатию, вам не обязательно это прятать за обтекаемыми формулировками. Однако же я буду отвечать исходя из гипотезы, что ваш вопрос искренний. Мое лицо так выглядит, потому что таковы мои предпочтения. Вокс-решетка практична, но есть что-то в том, чтобы проговаривать мысли вслух использую органический речевой аппарат. Считайте это моей блажью. К тому же, внешность обманчива — я экстенсивно имплантирован внутри, и вполне способен изъясняться на Лингва Технис и бинарике.
- guid: 183ae8c3-a9ec-4164-8e98-517eb60d807a
  event: CompanionDialogue_Manipulus_130
  text: '"Я много размышлял об этом — неужели смерть и ужас определяют наше бытие с самого начала? Некий фатум, как клинок, занесенный с зачатия, который управляет нашей жизнью. {g|Encyclopedia:RogueTraderGlossary}Вольный Торговец{/g} — боитесь ли вы смерти?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я много размышлял об этом — неужели смерть и ужас определяют наше бытие с самого начала? Некий фатум, как клинок, занесенный с зачатия, который управляет нашей жизнью. Вольный Торговец — боитесь ли вы смерти?
- guid: a97c9b13-f169-4f50-95fe-51e5539b96e1
  event: CompanionDialogue_Manipulus_131
  text: '"Отнюдь. Но это то, что было у меня на уме, когда вы подошли, и я счел это любопытной темой для обсуждения".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Отнюдь. Но это то, что было у меня на уме, когда вы подошли, и я счел это любопытной темой для обсуждения.
- guid: cbd86a1f-080a-416d-a6b1-c423b1e3ae91
  event: CompanionDialogue_Manipulus_132
  text: '"Ни в коем случае. Всего лишь приглашение к дискуссии. Способ узнать вас лучше".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ни в коем случае. Всего лишь приглашение к дискуссии. Способ узнать вас лучше.
- guid: dc2a4555-5b88-443b-8e55-20d733984572
  event: CompanionDialogue_Manipulus_14
  text: '"Их великое множество и большинство из них обладают довольно эзотерическими функциями, которые сложно объяснить мирян{mf|ину|ке}. Самый очевидный — гальваническая батарея". {n}Техножрец гулко хлопает по металлическому животу.{/n} "Мой корпус весьма увесист, так что его поддерживает антигравитационное ядро. Естественно, {g|Encyclopedia:Mechadendrite}мехадендриты{/g}, алембик с алхимическим синтезатором, вспомогательные когитаторы, око с магнификаторами и анализаторами, дыхательный..."'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Их великое множество и большинство из них обладают довольно эзотерическими функциями, которые сложно объяснить мирянину. Самый очевидный — гальваническая батарея.
  - speaker: narrator
    text_clean: Техножрец гулко хлопает по металлическому животу.
  - speaker: Manipulus
    text_clean: Мой корпус весьма увесист, так что его поддерживает антигравитационное ядро. Естественно, мехадендриты, алембик с алхимическим синтезатором, вспомогательные когитаторы, око с магнификаторами и анализаторами, дыхательный...
- guid: 1b945791-9052-4b59-a581-88f528818de4
  event: CompanionDialogue_Manipulus_15
  text: '"Мой дражайший коллега невероятно польщен вниманием. Прошу, спрашивайте".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мой дражайший коллега невероятно польщен вниманием. Прошу, спрашивайте.
- guid: f424548f-891c-4f4a-9634-a97ae88222f6
  event: CompanionDialogue_Manipulus_16
  text: '"Он мой дражайший коллега и незаменимый ассистент".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Он мой дражайший коллега и незаменимый ассистент.
- guid: 5dcf0b40-c736-41fb-a003-d442b8b1043b
  event: CompanionDialogue_Manipulus_17
  text: '"Прекрасный вопрос! Это довольно сложно объяснить мирян{mf|ину|ке}, но я попытаюсь. Если говорить совсем грубо, Нунциус помогает мне думать. Он представляет из себя необычайно сложную сеть алгоритмов, которые дополняют мои собственные. Они содержат противоречащие точки зрения, которые ищут изъяны в моих рассуждениях, и информацию, которую мне полезнее не держать в голове, поэтому я делегирую ее ему. Он весьма уникален".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Прекрасный вопрос! Это довольно сложно объяснить мирянину, но я попытаюсь. Если говорить совсем грубо, Нунциус помогает мне думать. Он представляет из себя необычайно сложную сеть алгоритмов, которые дополняют мои собственные. Они содержат противоречащие точки зрения, которые ищут изъяны в моих рассуждениях, и информацию, которую мне полезнее не держать в голове, поэтому я делегирую ее ему. Он весьма уникален.
- guid: c47793ab-03a8-4aab-a5d1-5682befaa044
  event: CompanionDialogue_Manipulus_18
  text: '{n}Эоганн задыхается от возмущения.{/n} "Вы действительно буднично спрашиваете меня, не попрал ли я одну из главных заповедей Омниссии, словно просите одолжить у меня стилус? Нет, тысячу раз нет! Да и разве можно сотворить подобное лишь из одного {g|Encyclopedia:ServoSkulls}сервочерепа{/g}? Злобный разум подобного калибра требует вместилище весьма немалого когитационного потенциала! Я глубоко возмущен этой инсинуацией и одновременно польщен вашими представлениями о моих навыках".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн задыхается от возмущения.
  - speaker: Manipulus
    text_clean: Вы действительно буднично спрашиваете меня, не попрал ли я одну из главных заповедей Омниссии, словно просите одолжить у меня стилус? Нет, тысячу раз нет! Да и разве можно сотворить подобное лишь из одного сервочерепа? Злобный разум подобного калибра требует вместилище весьма немалого когитационного потенциала! Я глубоко возмущен этой инсинуацией и одновременно польщен вашими представлениями о моих навыках.
- guid: dcd4c4c9-d04b-4cfc-99c3-ffd7292f56de
  event: CompanionDialogue_Manipulus_19
  text: '"Мой дражайший коллега просит передать, что не разделяет моих сильных эмоций и смиренно просит прощения за этот всплеск. Он также клянется Богом-Машиной, что создан по всем канонам священной инженерии и не является кощунственным извращением Его замысла".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мой дражайший коллега просит передать, что не разделяет моих сильных эмоций и смиренно просит прощения за этот всплеск. Он также клянется Богом-Машиной, что создан по всем канонам священной инженерии и не является кощунственным извращением Его замысла.
- guid: 01274982-124f-4aba-8216-165ae82a0fe9
  event: CompanionDialogue_Manipulus_20
  text: '"Мы делили келью со времен нашего послушничества на Стигии VIII. С того момента минуло 138 планетарных цикла и 72 суток. Пусть это не совсем точно в темпоральном смысле, но можно сказать, что мы были вместе всю мою жизнь". {n}Губы Эоганна трогает теплая улыбка.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мы делили келью со времен нашего послушничества на Стигии VIII. С того момента минуло 138 планетарных цикла и 72 суток. Пусть это не совсем точно в темпоральном смысле, но можно сказать, что мы были вместе всю мою жизнь.
  - speaker: narrator
    text_clean: Губы Эоганна трогает теплая улыбка.
- guid: 84f4118a-1edf-430f-89d6-6e29cf4d8fa6
  event: CompanionDialogue_Manipulus_21
  text: '"Нунциус передает, что оставит канал для запросов о его биографии и личностных качествах открытым для вас, Вольный Торговец".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нунциус передает, что оставит канал для запросов о его биографии и личностных качествах открытым для вас, Вольный Торговец.
- guid: aa16a829-586c-4ec3-a363-d40ca92ac2d1
  event: CompanionDialogue_Manipulus_22
  text: '"Я возьму на себя интерпретацию его слов, но заранее прошу простить за то, что не смогу сравняться по элегантности слога с дражайшим коллегой".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я возьму на себя интерпретацию его слов, но заранее прошу простить за то, что не смогу сравняться по элегантности слога с дражайшим коллегой.
- guid: 295f29ac-43f9-46f7-916e-74def8c5d178
  event: CompanionDialogue_Manipulus_23
  text: '{n}Прислушавшись к Нунциусу не менее, чем на минуту, Эоганн торжественно произносит:{/n} "Да".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Прислушавшись к Нунциусу не менее, чем на минуту, Эоганн торжественно произносит:'
  - speaker: Manipulus
    text_clean: Да.
- guid: 752b3d25-a68d-4619-adb2-a758bb70133d
  event: CompanionDialogue_Manipulus_24
  text: '{n}Несколько раз кивнув сервочерепу, Эоганн говорит:{/n} "Ваша презумпция ошибочна. Нунциус весьма словоохоч и имеет сильное мнение по любой мыслимой теме, которое не стесняется высказывать при первой возможности. К сожалению, вы, будучи мирян{mf|ином|кой}, не способны услышать его пламенные декларации и остроумные замечания. Нунциус категоризирует данный факт как прискорбный".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Несколько раз кивнув сервочерепу, Эоганн говорит:'
  - speaker: Manipulus
    text_clean: Ваша презумпция ошибочна. Нунциус весьма словоохоч и имеет сильное мнение по любой мыслимой теме, которое не стесняется высказывать при первой возможности. К сожалению, вы, будучи мирянином, не способны услышать его пламенные декларации и остроумные замечания. Нунциус категоризирует данный факт как прискорбный.
- guid: 2eaa9e16-987b-40bb-8bbd-e5279a4e6a89
  event: CompanionDialogue_Manipulus_25
  text: '{n}Эоганн морщится.{/n} "Да, Нунциус, я передам все как есть. Он говорит, что я обладаю незаурядным умом и превосходными прикладными навыками, однако моя, кхм, "взбалмошность", поразительным образом сочетающаяся с "упрямством на грани закостенелости", сдерживала бы мое развитие, если бы не его чуткие советы и справедливая критика".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн морщится.
  - speaker: Manipulus
    text_clean: Да, Нунциус, я передам все как есть. Он говорит, что я обладаю незаурядным умом и превосходными прикладными навыками, однако моя, кхм, "взбалмошность", поразительным образом сочетающаяся с "упрямством на грани закостенелости", сдерживала бы мое развитие, если бы не его чуткие советы и справедливая критика.
- guid: 37733c1e-a95d-48fc-8e43-cd6de4f88280
  event: CompanionDialogue_Manipulus_26
  text: '{n}Прислушавшись к серочерепу, Эоганн недовольно надувает щеки.{/n} "Нунциус, это возмутительно! Наше партнерство совершенно равнозначно, держи свое смутьянство при себе и не путай Вольного Торговца!"'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Прислушавшись к серочерепу, Эоганн недовольно надувает щеки.
  - speaker: Manipulus
    text_clean: Нунциус, это возмутительно! Наше партнерство совершенно равнозначно, держи свое смутьянство при себе и не путай Вольного Торговца!
- guid: aaebcf36-cab6-4942-821e-149be5dfdfc3
  event: CompanionDialogue_Manipulus_27
  text: '{n}Эоганн, прислушавшись, поднимает брови:{/n} "Не может быть — так часто? Да, Нунциус, я буду признателен, если ты поможешь следить за моим лексиконом. Лишь держи свой снисходительный тон в узде".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Эоганн, прислушавшись, поднимает брови:'
  - speaker: Manipulus
    text_clean: Не может быть — так часто? Да, Нунциус, я буду признателен, если ты поможешь следить за моим лексиконом. Лишь держи свой снисходительный тон в узде.
- guid: 172b27b5-eedb-4f3e-81d5-62b8e215ae12
  event: CompanionDialogue_Manipulus_28
  text: '"Нунциус утверждает, что данный разговор стимулировал и обогатил его".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нунциус утверждает, что данный разговор стимулировал и обогатил его.
- guid: cf9b0982-3f90-4339-9946-ca3058fbcd1d
  event: CompanionDialogue_Manipulus_29
  text: '{n}Эоганн азартно потирает руки.{/n} "Великолепно! Давно у меня не было хорошего оппонента!" {n}Он бросает быстрый взгляд в сторону Нунциуса.{/n} "Не считая моего дражайшего коллеги, конечно же".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн азартно потирает руки.
  - speaker: Manipulus
    text_clean: Великолепно! Давно у меня не было хорошего оппонента!
  - speaker: narrator
    text_clean: Он бросает быстрый взгляд в сторону Нунциуса.
  - speaker: Manipulus
    text_clean: Не считая моего дражайшего коллеги, конечно же.
- guid: e3e013b5-8b24-412d-9c28-aeb8fd2f905d
  event: CompanionDialogue_Manipulus_30
  text: '"Итак, к теме. Никогда не понимал почему данный вопрос выдается некоторыми мыслителями за глубокий, когда ответ на него весьма тривиален. Смысл жизни определяется положением человека в иерархии Империума и местом его дислокации, но так или иначе сводится к поддержке функционирования системы".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Итак, к теме. Никогда не понимал почему данный вопрос выдается некоторыми мыслителями за глубокий, когда ответ на него весьма тривиален. Смысл жизни определяется положением человека в иерархии Империума и местом его дислокации, но так или иначе сводится к поддержке функционирования системы.
- guid: ec80b1d8-c542-431a-ad9f-b0f583617a3a
  event: CompanionDialogue_Manipulus_31
  text: '"Блестяще! Вы ухватили самую суть и емко ее сформулировали. Нунциус, запомни формулировку Вольного Торговца, я приобщу ее к каталогу своих доводов. Верно ли я понимаю, что мы пришли к консенсусу?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Блестяще! Вы ухватили самую суть и емко ее сформулировали. Нунциус, запомни формулировку Вольного Торговца, я приобщу ее к каталогу своих доводов. Верно ли я понимаю, что мы пришли к консенсусу?
- guid: 8aeb9f95-6b12-4b8c-b8b0-3de25f04a736
  event: CompanionDialogue_Manipulus_32
  text: '"Подобное заявление может выдвинуть лишь Вольный Торговец. Неужели вы считате, что ваша уникальная позиция помазанни{mf|ка|цы} {g|Encyclopedia:EmperorGlossary}Императора{/g}, дарующая вам небывалые свободы, так легко транслируется на остальных?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Подобное заявление может выдвинуть лишь Вольный Торговец. Неужели вы считате, что ваша уникальная позиция помазанника Императора, дарующая вам небывалые свободы, так легко транслируется на остальных?
- guid: 0c0e36ce-4e40-4d41-aae0-c62dfb187d5a
  event: CompanionDialogue_Manipulus_33
  text: '"Весьма блеклый взгляд на существование. Изволите конкретизировать его, чтобы я понял вашу точку зрения лучше?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Весьма блеклый взгляд на существование. Изволите конкретизировать его, чтобы я понял вашу точку зрения лучше?
- guid: 17d42cd1-be9a-42fe-a1e8-4c53c6848121
  event: CompanionDialogue_Manipulus_34
  text: '{n}Эоганн почтительно склоняет голову.{/n} "Это взаимно".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн почтительно склоняет голову.
  - speaker: Manipulus
    text_clean: Это взаимно.
- guid: 0db618a3-a9c2-4f5d-9c37-b6789351dc7b
  event: CompanionDialogue_Manipulus_35
  text: '"С вашей точки зрения я путаю причину и следствие. Вера, являясь наивысшей директивой, наполняет смыслом любые действия. Омниссия знает все, постигает все, и мы делаем смыслом своей жизни уподобление ему. Ваши аргументы импонируют мне и даруют благодатную почву для размышлений".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: С вашей точки зрения я путаю причину и следствие. Вера, являясь наивысшей директивой, наполняет смыслом любые действия. Омниссия знает все, постигает все, и мы делаем смыслом своей жизни уподобление ему. Ваши аргументы импонируют мне и даруют благодатную почву для размышлений.
- guid: 7bf11729-9d70-4817-8f49-f5a0fe569961
  event: CompanionDialogue_Manipulus_36
  text: '"Как любопытно, мы разошлись с вами на разнице между частным и общим. Я рассматривал смысл жизни как глобальное понятие в рамках социума, а вы решили идти от индивида. Но рассуждения о том как эти два понятия соотносятся — тема для отдельного обсуждения".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Как любопытно, мы разошлись с вами на разнице между частным и общим. Я рассматривал смысл жизни как глобальное понятие в рамках социума, а вы решили идти от индивида. Но рассуждения о том как эти два понятия соотносятся — тема для отдельного обсуждения.
- guid: 48a05519-b3e8-4c03-8f21-253231dd1d0a
  event: CompanionDialogue_Manipulus_37
  text: '"Радикальная позиция, которую кто-либо иной мог бы счесть еретической. Но доля истины в ней, пожалуй, есть — человек может сделать своим смыслом жизни отступничество. Однако можно поспорить, что подавление бунта — одна из функций системы, а потому, парадоксально, бунтовщики дают ей возможность проявлять сию функцию, обеспечивая ее функционирование".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Радикальная позиция, которую кто-либо иной мог бы счесть еретической. Но доля истины в ней, пожалуй, есть — человек может сделать своим смыслом жизни отступничество. Однако можно поспорить, что подавление бунта — одна из функций системы, а потому, парадоксально, бунтовщики дают ей возможность проявлять сию функцию, обеспечивая ее функционирование.
- guid: 92d22abf-b987-4c4f-a7ff-86cb33be4b8f
  event: CompanionDialogue_Manipulus_38
  text: '"Принять абсурдность бытия, отринуть попытки его категоризировать и тем самым обрести душевное равновесие. Весьма уникальный взгляд на мир, спорящий примерно со всеми догмами Империума". {n}На губах Эоганна бунтарская улыбка.{/n} "Мне интересно пропустить эту точку зрения через себя".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Принять абсурдность бытия, отринуть попытки его категоризировать и тем самым обрести душевное равновесие. Весьма уникальный взгляд на мир, спорящий примерно со всеми догмами Империума.
  - speaker: narrator
    text_clean: На губах Эоганна бунтарская улыбка.
  - speaker: Manipulus
    text_clean: Мне интересно пропустить эту точку зрения через себя.
- guid: 4bbee036-3db6-4bb9-8cbb-8566c935c1aa
  event: CompanionDialogue_Manipulus_39
  text: '"То есть с вашей точки зрения жизнь лишена внутренней ценности или цели. Когда я пытаюсь пропустить через себя эту идею, я чувствую себя потерянно, словно мои гальванические контуры опустели и даже Движущая Сила не может восполнить эту утрату. Пожалуй, я хочу еще поисследовать это состояние".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: То есть с вашей точки зрения жизнь лишена внутренней ценности или цели. Когда я пытаюсь пропустить через себя эту идею, я чувствую себя потерянно, словно мои гальванические контуры опустели и даже Движущая Сила не может восполнить эту утрату. Пожалуй, я хочу еще поисследовать это состояние.
- guid: da646276-0eb6-4f41-9377-1a2fef51c558
  event: CompanionDialogue_Manipulus_40
  text: '{n}Помолчав, манипулус передает:{/n} "Дражайший коллега обвиняет меня в излишнем упрощении. Он считает, что, пытаясь донести свою точку зрения, я пренебрег многими нюансами, заложенными вами в вопрос, и тем самым сам выдал банальный ответ. Но общий посыл он считает верным, пусть и полным изъянов".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Помолчав, манипулус передает:'
  - speaker: Manipulus
    text_clean: Дражайший коллега обвиняет меня в излишнем упрощении. Он считает, что, пытаясь донести свою точку зрения, я пренебрег многими нюансами, заложенными вами в вопрос, и тем самым сам выдал банальный ответ. Но общий посыл он считает верным, пусть и полным изъянов.
- guid: 1deb89a1-e026-4d61-a678-becaf0f3d67c
  event: CompanionDialogue_Manipulus_41
  text: '"Не смею перечить. О чем же вы хотели говорить?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Не смею перечить. О чем же вы хотели говорить?
- guid: 1a1f7ca8-552c-4dfb-9e7c-2fbc18684d7c
  event: CompanionDialogue_Manipulus_42
  text: '"Провидение Омниссии не свело нас. Этот храм весьма велик и нет ничего удивительного в том, что двое ученых мужей ни разу не столкнулись друг с другом. В конце концов, каждый из нас благословлен своей функцией и выполнять ее — одинокий труд".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Провидение Омниссии не свело нас. Этот храм весьма велик и нет ничего удивительного в том, что двое ученых мужей ни разу не столкнулись друг с другом. В конце концов, каждый из нас благословлен своей функцией и выполнять ее — одинокий труд.
- guid: 9125e1b5-c133-45b0-8e92-13f333b47a34
  event: CompanionDialogue_Manipulus_43
  text: '{n}Обернувшись к Нунциусу, Эоганн приподнимает брови.{/n} "Неужели? Мой дражайший коллега утверждает, что однажды мы с магосом Ханейманном миновали друг друга в служебной перемычке 91-Р. Почтенный магос пожурил меня за какую-то незначительную халатность в облике моих аугментов, после чего, обменявшись мнениями, мы разошлись. Видимо, я счел это событие малозначимым, и оно ускользнуло из моей памяти".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Обернувшись к Нунциусу, Эоганн приподнимает брови.
  - speaker: Manipulus
    text_clean: Неужели? Мой дражайший коллега утверждает, что однажды мы с магосом Ханейманном миновали друг друга в служебной перемычке 91-Р. Почтенный магос пожурил меня за какую-то незначительную халатность в облике моих аугментов, после чего, обменявшись мнениями, мы разошлись. Видимо, я счел это событие малозначимым, и оно ускользнуло из моей памяти.
- guid: 41494581-d72e-45fa-a64c-8b12de0341ff
  event: CompanionDialogue_Manipulus_44
  text: '"К сожалению, доктрина изоляции и несговорчивость некоторых коллег застопорили мои поиски, и я воспользовался возможностью примкнуть к вашей свите".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: К сожалению, доктрина изоляции и несговорчивость некоторых коллег застопорили мои поиски, и я воспользовался возможностью примкнуть к вашей свите.
- guid: f449c15d-86e2-499d-b197-8682c972bb62
  event: CompanionDialogue_Manipulus_45
  text: '{n}Эоганн бросает за плечо:{/n} "Нет, Нунциус, я не пытался ничего скрыть от Вольного Торговца. Лишь думал, что дрязги техножрецов {mf|ему|ей} будут не слишком интересны".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Эоганн бросает за плечо:'
  - speaker: Manipulus
    text_clean: Нет, Нунциус, я не пытался ничего скрыть от Вольного Торговца. Лишь думал, что дрязги техножрецов ему будут не слишком интересны.
- guid: f7055bf7-5e56-42d0-839f-3c10418e733e
  event: CompanionDialogue_Manipulus_46
  text: '"Я верю, что истина лежит посередине между этими двумя путями и оба они ведут к моей ультимативной цели, магнум опус — бросить вызов смерти как феномену, уподобив человечество неизбывности {g|Encyclopedia:OmnissiahGlossary}Омниссии{/g}".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я верю, что истина лежит посередине между этими двумя путями и оба они ведут к моей ультимативной цели, магнум опус — бросить вызов смерти как феномену, уподобив человечество неизбывности Омниссии.
- guid: a3d75a07-ef2f-4ee7-851e-d5406bc96408
  event: CompanionDialogue_Manipulus_47
  text: '"У нас возникли разногласия с архихимиком обители, Тэклой-Парадигма-13. Она упрямо отказывалась понимать важность моих трудов и не санкционировала доступ к сакрариуму алхимических реагентов. Так как ее аргументы были невалидны, а теоретическая база ущербна, я решил пренебречь ее запретом и санкционировал себя самостоятельно".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: У нас возникли разногласия с архихимиком обители, Тэклой-Парадигма-13. Она упрямо отказывалась понимать важность моих трудов и не санкционировала доступ к сакрариуму алхимических реагентов. Так как ее аргументы были невалидны, а теоретическая база ущербна, я решил пренебречь ее запретом и санкционировал себя самостоятельно.
- guid: 7aedbf6e-4fbd-43f7-91ef-efcfb06a6014
  event: CompanionDialogue_Manipulus_48
  text: '"Я действовал осмотрительно, так что коллега не узнала о моей реквизиции реагентов, пока не застопорилась работа в одной из капелл биологис, где произошел прискорбный инцидент с группой {g|Encyclopedia:Servitor}сервиторов{/g}, на которых я экспериментировал. Такой сырбор всего лишь из-за пары контролируемых мутаций!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я действовал осмотрительно, так что коллега не узнала о моей реквизиции реагентов, пока не застопорилась работа в одной из капелл биологис, где произошел прискорбный инцидент с группой сервиторов, на которых я экспериментировал. Такой сырбор всего лишь из-за пары контролируемых мутаций!
- guid: 2a8d830b-8d91-4aa7-b78e-28ff737ab4e9
  event: CompanionDialogue_Manipulus_49
  text: '"Если бы Тэкла-Парадигма-13 с таким же рвением подходила к исследованиям, с каким она подошла к усложнению моей жизни на станции, из нее мог бы выйти толк. Увы. Я решил покинуть обитель при первой же возможности, чтобы не ставить под риск наши с Нунциусом труды. Этой возможностью оказались вы".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Если бы Тэкла-Парадигма-13 с таким же рвением подходила к исследованиям, с каким она подошла к усложнению моей жизни на станции, из нее мог бы выйти толк. Увы. Я решил покинуть обитель при первой же возможности, чтобы не ставить под риск наши с Нунциусом труды. Этой возможностью оказались вы.
- guid: 4f3a1b29-ce82-4edf-9d50-f2ee3c51b6ea
  event: CompanionDialogue_Manipulus_50
  text: '"Большинство мирян, потерявших конечности или органы, в лучшем случае удостаиваются простейших протезов. Исключение составляют те, кто занимает ключевые для Империума роли или чья служба не может нестись без замены органики на более эффективные аналоги".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Большинство мирян, потерявших конечности или органы, в лучшем случае удостаиваются простейших протезов. Исключение составляют те, кто занимает ключевые для Империума роли или чья служба не может нестись без замены органики на более эффективные аналоги.
- guid: a2afc19d-96a9-4e14-a03d-308471f1bcb1
  event: CompanionDialogue_Manipulus_51
  text: '"И, естественно, есть исключительные люди, вроде Вольных Торговцев, которые могут позволить себе самые лучшие импланты по мановению руки... или при ее утрате". {n}Эоганн воздевает палец.{/n} "Только задумайтесь — вы {mf|один|одна} из неисчислимых миллиардов людей, кто смог{mf||ла} стать статистической невероятностью. Разве можно углядеть в этой метафизической математике что-то иное, чем промысел Бога-Машины?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: И, естественно, есть исключительные люди, вроде Вольных Торговцев, которые могут позволить себе самые лучшие импланты по мановению руки... или при ее утрате.
  - speaker: narrator
    text_clean: Эоганн воздевает палец.
  - speaker: Manipulus
    text_clean: Только задумайтесь — вы один из неисчислимых миллиардов людей, кто смог стать статистической невероятностью. Разве можно углядеть в этой метафизической математике что-то иное, чем промысел Бога-Машины?
- guid: d0f7874e-f920-4bb7-894c-fb9535e1c25e
  event: CompanionDialogue_Manipulus_52
  text: '{n}Эоганн смотрит на Нунциуса и прерывается.{/n} "Дражайший коллега намекает, что мой ответ становится утомительным. Если вам будет любопытно, я готов попытаться составить трактат о своем устройстве, но более сложной задачей будет придать ему удобоваримую для мирян{mf|ина|ки} форму..."'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн смотрит на Нунциуса и прерывается.
  - speaker: Manipulus
    text_clean: Дражайший коллега намекает, что мой ответ становится утомительным. Если вам будет любопытно, я готов попытаться составить трактат о своем устройстве, но более сложной задачей будет придать ему удобоваримую для мирянина форму...
- guid: 9efba759-ab7e-4d91-9e92-3c690048f124
  event: CompanionDialogue_Manipulus_53
  text: '"Я веду свои поиски не один десяток лет, и у меня скопилась скромная коллекция объектов, принадлежавших им, но назначение большинства из них мне так и не удалось постичь. Многие считают, что некроны давно сгинули, оставив после себя лишь руины из черного камня, но я так не думаю. Они все еще существуют, и они ближе, чем кажется".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я веду свои поиски не один десяток лет, и у меня скопилась скромная коллекция объектов, принадлежавших им, но назначение большинства из них мне так и не удалось постичь. Многие считают, что некроны давно сгинули, оставив после себя лишь руины из черного камня, но я так не думаю. Они все еще существуют, и они ближе, чем кажется.
- guid: 5a535ca6-7e9c-44d0-bf9d-f2ed169bbce7
  event: CompanionDialogue_Manipulus_54
  text: '"Рабочий производит или обрабатывает ресурс, солдат уничтожает врагов, губернатор обеспечивает порядок и поставку десятины. Смысл моей жизни — продвигать Поиск Знаний, выполняя свою функцию, дарованную мне Омниссией. Как я и говорил, весьма банальный вопрос".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Рабочий производит или обрабатывает ресурс, солдат уничтожает врагов, губернатор обеспечивает порядок и поставку десятины. Смысл моей жизни — продвигать Поиск Знаний, выполняя свою функцию, дарованную мне Омниссией. Как я и говорил, весьма банальный вопрос.
- guid: b9e52fcb-6e74-4658-afc8-8599d3fb3ffd
  event: CompanionDialogue_Manipulus_55
  text: '"Безусловно. В этом можно усмотреть цинизм, но я лишь срезаю лишнее. Люди — непростые существа, я могу часами распространяться про нюансы устройства организма и сознания, приводить размышления теософов и философов. Но это не имеет значения — покуда человек выполняет свою функцию, его жизнь имеет смысл".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Безусловно. В этом можно усмотреть цинизм, но я лишь срезаю лишнее. Люди — непростые существа, я могу часами распространяться про нюансы устройства организма и сознания, приводить размышления теософов и философов. Но это не имеет значения — покуда человек выполняет свою функцию, его жизнь имеет смысл.
- guid: c99206d5-bee4-4767-9532-a6cde71f83ab
  event: CompanionDialogue_Manipulus_56
  text: '"Вы — квинтэссенция воли Империума. Ваш смысл — расширять его и укреплять его мощь там, куда не могут дотянуться прочие подданые. Вы не исследуете фронтир. Вы и есть фронтир".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Вы — квинтэссенция воли Империума. Ваш смысл — расширять его и укреплять его мощь там, куда не могут дотянуться прочие подданые. Вы не исследуете фронтир. Вы и есть фронтир.
- guid: ab48f986-5c67-4e8f-b430-2d8ebac5a85d
  event: CompanionDialogue_Manipulus_57
  text: '"Ваша техника ведения дискуссии весьма... неконвенциональна. В таком случае предлагаю на этом закончить — вы уже подали мне достаточно пищи для размышлений". {n}Эоганн задумчиво покручивает пистон на бороде.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ваша техника ведения дискуссии весьма... неконвенциональна. В таком случае предлагаю на этом закончить — вы уже подали мне достаточно пищи для размышлений.
  - speaker: narrator
    text_clean: Эоганн задумчиво покручивает пистон на бороде.
- guid: d6f21e76-e854-4c96-ae41-f5b9d1afcccc
  event: CompanionDialogue_Manipulus_58
  text: '{n}Эоганн задумчиво покручивает пистон на бороде.{/n} "Благодарю за интересную дискуссию, Вольный Торговец".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн задумчиво покручивает пистон на бороде.
  - speaker: Manipulus
    text_clean: Благодарю за интересную дискуссию, Вольный Торговец.
- guid: 5cb77c06-927c-453f-8fde-ec396c218fbd
  event: CompanionDialogue_Manipulus_59
  text: '{n}Эоганн силится что-то сказать, оглядывается на Нунциуса и склоняет голову.{/n} "Естественно, Вольный Торговец, я признаю поражение".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн силится что-то сказать, оглядывается на Нунциуса и склоняет голову.
  - speaker: Manipulus
    text_clean: Естественно, Вольный Торговец, я признаю поражение.
- guid: 03353836-0c00-47bc-af04-56838acb48c8
  event: CompanionDialogue_Manipulus_60
  text: '"К сожалению, после инцидента в Секторе Бионика, коллега находится в плачевном состоянии. Я слышал, что Вивисектор Мартинакс лично занимается его врачеванием, прогнозируя скорое восстановление, если тому будет благоволить Омниссия. Как только вам доложат о восстановлении функциональности генетора, мы вернемся к этому разговору".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: К сожалению, после инцидента в Секторе Бионика, коллега находится в плачевном состоянии. Я слышал, что Вивисектор Мартинакс лично занимается его врачеванием, прогнозируя скорое восстановление, если тому будет благоволить Омниссия. Как только вам доложат о восстановлении функциональности генетора, мы вернемся к этому разговору.
- guid: 85df235f-04ac-4975-aeee-61be9d3ddc20
  event: CompanionDialogue_Manipulus_61
  text: '{n}Эоганн о чем-то тихо перешептывается с сервочерепом. Поймав ваш взгляд, техножрец печально улыбается.{/n} "Вольный Торговец, не беспокойтесь — мой разум все еще ясен, насколько это возможно. Но привычки трудно искоренить, даже такие как общение с фигментом собственного воображения. Я все еще помню о судьбе Нунциуса и знаю, что я должен сделать". {n}Он прикрывает глаз и шепчет:{/n} "Омниссия, дай мне сил..."'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн о чем-то тихо перешептывается с сервочерепом. Поймав ваш взгляд, техножрец печально улыбается.
  - speaker: Manipulus
    text_clean: Вольный Торговец, не беспокойтесь — мой разум все еще ясен, насколько это возможно. Но привычки трудно искоренить, даже такие как общение с фигментом собственного воображения. Я все еще помню о судьбе Нунциуса и знаю, что я должен сделать.
  - speaker: narrator
    text_clean: 'Он прикрывает глаз и шепчет:'
  - speaker: Manipulus
    text_clean: Омниссия, дай мне сил...
- guid: 73abcb58-ff02-4a69-a3ca-a89e8704267f
  event: CompanionDialogue_Manipulus_62
  text: '"Для меня же ключевым аспектом Бога-Машины является его всесведущесть. Я собираю мудрость, в том числе из общения с мирянами — для этого конвенциональный низкий готик пока что оказывается наиболее пригодным. Впрочем, это не исключает того, что я способен говорить на всех бинарных диалектах Марса, если того требуют обстоятельства".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Для меня же ключевым аспектом Бога-Машины является его всесведущесть. Я собираю мудрость, в том числе из общения с мирянами — для этого конвенциональный низкий готик пока что оказывается наиболее пригодным. Впрочем, это не исключает того, что я способен говорить на всех бинарных диалектах Марса, если того требуют обстоятельства.
- guid: a4824cfc-ad57-4678-b8fd-fc5e59405519
  event: CompanionDialogue_Manipulus_63
  text: '"Эксперимент необходимо повторить. Выделить несколько контрольных групп, соотнести все факторы и тщательно зафиксировать результаты. Нельзя отвергать гипотезу после единичного провала — нужно собрать доказательную базу. Этого требует Путь познания, ведь Омниссия благоволит стойкому разуму и готовности идти на жертвы. Лишь исчерпав все возможности и изучив весь спектр данных, я буду готов признать поражение".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Эксперимент необходимо повторить. Выделить несколько контрольных групп, соотнести все факторы и тщательно зафиксировать результаты. Нельзя отвергать гипотезу после единичного провала — нужно собрать доказательную базу. Этого требует Путь познания, ведь Омниссия благоволит стойкому разуму и готовности идти на жертвы. Лишь исчерпав все возможности и изучив весь спектр данных, я буду готов признать поражение.
- guid: e941f684-4a9e-4b0f-8571-7acb3ebe61dc
  event: CompanionDialogue_Manipulus_64
  text: '"Я хочу отблагодарить вас, коллега. Вы помогли мне совладать с вышедшей из под контроля ситуацией и осознать свои ошибки — это дорогого стоит. Я думал использовать данный имплант в ходе эксперимента, но счел его слишком ценным, чтобы тратить на мирян. Прошу, примите его в дар". {n}Манипулус кланяется, преподнося вам сверток.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я хочу отблагодарить вас, коллега. Вы помогли мне совладать с вышедшей из под контроля ситуацией и осознать свои ошибки — это дорогого стоит. Я думал использовать данный имплант в ходе эксперимента, но счел его слишком ценным, чтобы тратить на мирян. Прошу, примите его в дар.
  - speaker: narrator
    text_clean: Манипулус кланяется, преподнося вам сверток.
- guid: f51becb2-0d5d-405d-9d7d-194190fb375d
  event: CompanionDialogue_Manipulus_65
  text: '"Вольный Торговец, какой дискуссией вы почтите нас с Нунциусом сегодня?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Вольный Торговец, какой дискуссией вы почтите нас с Нунциусом сегодня?
- guid: 0544318d-bc87-4a40-8e5a-e8c2e5dde84f
  event: CompanionDialogue_Manipulus_66
  text: '"Я нахожу наши беседы стимулирующими — буду ждать вашего возвращения".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я нахожу наши беседы стимулирующими — буду ждать вашего возвращения.
- guid: 357c64d8-5d92-4e44-ab66-099b770951c9
  event: CompanionDialogue_Manipulus_67
  text: '"Да. После обработки всех вводных, включая ваши неоценимый вклад в результат эксперимента, мы провели пространные дебаты с моим дражайшим коллегой. Мой когнитивный ступор наконец-то разрешен".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Да. После обработки всех вводных, включая ваши неоценимый вклад в результат эксперимента, мы провели пространные дебаты с моим дражайшим коллегой. Мой когнитивный ступор наконец-то разрешен.
- guid: fcfb5d3b-8ee8-421b-9623-7f912402ec9b
  event: CompanionDialogue_Manipulus_68
  text: '"Как вы и распорядились, за ним ухаживают в Секторе Бионика. Его когнитивные функции почти полностью отказали и лишь милость Омниссии удерживает его от полной потери мобильности. Триасомата проводит свои дни склонившись в молитве — по крайней мере мы так предполагаем, ведь блаженный утратил все речевые навыки. Он выглядит... умиротворенным".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Как вы и распорядились, за ним ухаживают в Секторе Бионика. Его когнитивные функции почти полностью отказали и лишь милость Омниссии удерживает его от полной потери мобильности. Триасомата проводит свои дни склонившись в молитве — по крайней мере мы так предполагаем, ведь блаженный утратил все речевые навыки. Он выглядит... умиротворенным.
- guid: 71a737fd-ce2d-4998-bd65-2f752e8156fa
  event: CompanionDialogue_Manipulus_69
  text: '"Ему была предоставлена "почетная" должность на верхних палубах. Высшие офицеры находят его нечленораздельный лепет и блаженную улыбку забавными и пытаются провоцировать "чучелко", как они его называют. Впрочем, Омниссия милостив и лишил Триасомату не только когнитивных, но и почти всех моторных функций. Он сутками стоит на месте, задрав голову на каменный лик Императора, не замечая издевок этих... мирян". {n}Последнее слово Эоганн злобно выплевывает.{/n}'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ему была предоставлена "почетная" должность на верхних палубах. Высшие офицеры находят его нечленораздельный лепет и блаженную улыбку забавными и пытаются провоцировать "чучелко", как они его называют. Впрочем, Омниссия милостив и лишил Триасомату не только когнитивных, но и почти всех моторных функций. Он сутками стоит на месте, задрав голову на каменный лик Императора, не замечая издевок этих... мирян.
  - speaker: narrator
    text_clean: Последнее слово Эоганн злобно выплевывает.
- guid: b738b54e-6696-44f0-868f-54f38254de9b
  event: CompanionDialogue_Manipulus_70
  text: '"Пройдя сервиторизацию, он был распределен на нижние палубы, где возобновил службу династии. Многие миряне в своей наивности воспринимают его "возвращение" как чудо Бога-Императора, подносят ему дары и вешают примитивные обереги на панцирь. Естественно, став инструментом Омниссии, он лишь умеет следовать заложенным в него протоколам старания и даже не подозревает о существовании этих... обрядов. Это неопровержимый факт".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Пройдя сервиторизацию, он был распределен на нижние палубы, где возобновил службу династии. Многие миряне в своей наивности воспринимают его "возвращение" как чудо Бога-Императора, подносят ему дары и вешают примитивные обереги на панцирь. Естественно, став инструментом Омниссии, он лишь умеет следовать заложенным в него протоколам старания и даже не подозревает о существовании этих... обрядов. Это неопровержимый факт.
- guid: 11a74d37-1ca0-482d-a40a-79217f356fc9
  event: CompanionDialogue_Manipulus_71
  text: '{n}Эоганн улыбается.{/n} "Возможно. Но это то, во что я искренне верю. Рассудить нас сможет лишь самый бесстрастный судья — время".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн улыбается.
  - speaker: Manipulus
    text_clean: Возможно. Но это то, во что я искренне верю. Рассудить нас сможет лишь самый бесстрастный судья — время.
- guid: 3c5cfc67-fb5d-4a76-ba6a-373b748e9f51
  event: CompanionDialogue_Manipulus_72
  text: '{n}Эоганн вздымает палец.{/n} "Именно. У человека всегда есть выбор, из чего формировать себя — сожалений о допущенных ошибках или опыта, что он из них извлек. Истинной мудрости способны достичь лишь те, кто выбирает второе".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн вздымает палец.
  - speaker: Manipulus
    text_clean: Именно. У человека всегда есть выбор, из чего формировать себя — сожалений о допущенных ошибках или опыта, что он из них извлек. Истинной мудрости способны достичь лишь те, кто выбирает второе.
- guid: c6ab53a9-e5bb-45e9-b370-e5a4388f58a3
  event: CompanionDialogue_Manipulus_73
  text: '"Мы смогли достичь консенсуса по корню проблемы — остальным можно пренебречь. Не все мои выводы его устраивают, но в этом нет беды — у нас с ним общий путь, но способы постигать у каждого свои".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Мы смогли достичь консенсуса по корню проблемы — остальным можно пренебречь. Не все мои выводы его устраивают, но в этом нет беды — у нас с ним общий путь, но способы постигать у каждого свои.
- guid: 0d7666c7-adfb-4f17-b9a6-3024b295bead
  event: CompanionDialogue_Manipulus_74
  text: '{n}Эоганн смотрит на вас отрешенно.{/n} "Да, давно пора. Я лишь прошу о привилегии приватности — это признание дается мне с трудом, и довериться с ним я могу только вам".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн смотрит на вас отрешенно.
  - speaker: Manipulus
    text_clean: Да, давно пора. Я лишь прошу о привилегии приватности — это признание дается мне с трудом, и довериться с ним я могу только вам.
- guid: bb1629be-9680-4a1b-90a5-f6dbfeeba81b
  event: CompanionDialogue_Manipulus_75
  text: '"Его отказ ремонтировать Нунциуса — возмутителен и нарушает обеты, данные им перед лицом Бога-Машины. Я немедленно призову его на мостик, в надежде, что он не посмеет юлить в присутствии Вольного Торговца!"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Его отказ ремонтировать Нунциуса — возмутителен и нарушает обеты, данные им перед лицом Бога-Машины. Я немедленно призову его на мостик, в надежде, что он не посмеет юлить в присутствии Вольного Торговца!
- guid: b29e4608-2d6a-4e91-99ce-7e08714883a2
  event: CompanionDialogue_Manipulus_76
  text: '{n}Эоганн без Нунциуса смотрится непривычно и одиноко. Его взгляд печален, но знакомая умиротворенная улыбка вновь на месте.{/n} "За жизнь мы претерпеваем множество потерь и лишений, но разве не любопытно как некоторые из них имеют свойство задерживаться? Каждый носит в себе фантомов былого, но не всякий способен не дать им поглотить себя полностью. Я рад, что мне наконец-то {d|Encyclopedia:Ch4_EogunnFinalAcceptance}

    удалось примириться{/d} со своими".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн без Нунциуса смотрится непривычно и одиноко. Его взгляд печален, но знакомая умиротворенная улыбка вновь на месте.
  - speaker: Manipulus
    text_clean: За жизнь мы претерпеваем множество потерь и лишений, но разве не любопытно как некоторые из них имеют свойство задерживаться? Каждый носит в себе фантомов былого, но не всякий способен не дать им поглотить себя полностью. Я рад, что мне наконец-то удалось примириться со своими.
- guid: dfa3b34a-226d-47bf-9796-2d9362547cdd
  event: CompanionDialogue_Manipulus_77
  text: '{n}Эоганн погружен в молитву. Над его плечом парит Нунциус, теперь уже настоящий — форма черепа несколько неправильная из-за перенесенных трансмутаций, но безошибочно человеческая.{/n} "Ошибки — они формируют нас, даря знания одним и обрекая других. Но неправильно думать, что лишь наши собственные ошибки влияют на нас — иногда чужие оказываются столь же поучительны или фатальны. Мои погубили Нунциуса, но они же {d|Encyclopedia:Ch4_EogunnFinalService}вернули меня на путь чистоты помыслов и деяний{/d}. Я скорблю и испытываю благодарность. Таков неизбежный дуализм бытия".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн погружен в молитву. Над его плечом парит Нунциус, теперь уже настоящий — форма черепа несколько неправильная из-за перенесенных трансмутаций, но безошибочно человеческая.
  - speaker: Manipulus
    text_clean: Ошибки — они формируют нас, даря знания одним и обрекая других. Но неправильно думать, что лишь наши собственные ошибки влияют на нас — иногда чужие оказываются столь же поучительны или фатальны. Мои погубили Нунциуса, но они же вернули меня на путь чистоты помыслов и деяний. Я скорблю и испытываю благодарность. Таков неизбежный дуализм бытия.
- guid: c1679f5b-cf86-4694-a18d-c429f89dd585
  event: CompanionDialogue_Manipulus_78
  text: '{n}Эоганн оживленно беседует сам с собой, даже не оборачиваясь на сервочереп-пустышку за плечом.{/n} "Нет, Нунциус, я уверен, что масштабирование эксперимента возможно даже без надежной материальной базы ксеносских реликвий. Оставь цинизм при себе. Триасомия неизбежна как новая практика".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн оживленно беседует сам с собой, даже не оборачиваясь на сервочереп-пустышку за плечом.
  - speaker: Manipulus
    text_clean: Нет, Нунциус, я уверен, что масштабирование эксперимента возможно даже без надежной материальной базы ксеносских реликвий. Оставь цинизм при себе. Триасомия неизбежна как новая практика.
- guid: cfcc46af-01e8-47df-895c-8acb9a7e7e80
  event: CompanionDialogue_Manipulus_79
  text: '"Вероятно, вас интересует мой прогресс по изготовлению обещанного вам оружия. Имея возможность сфокусироваться на изучении артефакта, я смог модифицировать плазменное ружье, раскрыв его истинный потенциал с помощью... неконвенциональных методик. Я надеюсь, что данное творение вам угодит".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Вероятно, вас интересует мой прогресс по изготовлению обещанного вам оружия. Имея возможность сфокусироваться на изучении артефакта, я смог модифицировать плазменное ружье, раскрыв его истинный потенциал с помощью... неконвенциональных методик. Я надеюсь, что данное творение вам угодит.
- guid: 082e9018-5248-4b3a-b5ba-ee5904f58bc4
  event: CompanionDialogue_Manipulus_80
  text: '"Прискорбный вывод. Вы в своем праве, но я дерзну удостовериться — не был ли он сделан поспешно? Неужели мои познания и навыки исчерпали свой потенциал?"'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Прискорбный вывод. Вы в своем праве, но я дерзну удостовериться — не был ли он сделан поспешно? Неужели мои познания и навыки исчерпали свой потенциал?
- guid: 681d53a7-a48f-4ee3-8b5c-05f92a467e5e
  event: CompanionDialogue_Manipulus_81
  text: '{n}Эоганн восторженно вздымает палец.{/n} "А, так значит я стал объектом вашего эксперимента! Весьма редкое событие, весьма. Надеюсь, что результат вас удовлетворил".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн восторженно вздымает палец.
  - speaker: Manipulus
    text_clean: А, так значит я стал объектом вашего эксперимента! Весьма редкое событие, весьма. Надеюсь, что результат вас удовлетворил.
- guid: 2cfc2624-db89-421a-ace1-1c3e448d2636
  event: CompanionDialogue_Manipulus_82
  text: '{n}Эоганн учтиво меняет угол парения корпуса в поклоне.{/n} "Я покину судно при первой возможности. Мой путь Познания вновь сменил свою траекторию — такое случается. Вы стали важной вехой в нем, Вольный Торговец, и я надеюсь, что вы со временем обретете многие мудрости, которые не смог постичь я сам".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн учтиво меняет угол парения корпуса в поклоне.
  - speaker: Manipulus
    text_clean: Я покину судно при первой возможности. Мой путь Познания вновь сменил свою траекторию — такое случается. Вы стали важной вехой в нем, Вольный Торговец, и я надеюсь, что вы со временем обретете многие мудрости, которые не смог постичь я сам.
- guid: 430fc4c3-eaa7-4994-98d0-1ab437d1f63f
  event: CompanionDialogue_Manipulus_83
  text: '"Но разве можно поистине познать чужую суть? Ведь завесь из слов часто скрывает смыслы, которые невозможно обнаружить за один краткий разговор. С другой стороны, все величайшие труды о людском естестве начинались с малого. Спрашивайте, Вольный Торговец".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Но разве можно поистине познать чужую суть? Ведь завесь из слов часто скрывает смыслы, которые невозможно обнаружить за один краткий разговор. С другой стороны, все величайшие труды о людском естестве начинались с малого. Спрашивайте, Вольный Торговец.
- guid: e661ebf1-8efc-420b-af47-e3b1e1a379af
  event: CompanionDialogue_Manipulus_84
  text: '"Стигия VIII — {g|Encyclopedia:ForgeWorldGlossary}мир-кузня{/g}, расположенный на одной из лун газового гиганта в бинарной звездной системе Вулканис. Величественное место! Могучие {g|Encyclopedia:Manufactorum}мануфакторумы{/g} оплетают мир от горизонта до горизонта, исторгая из себя вооружение и технику, для армий Сегментум Соляр — образцы и паттерны, которым нет равных в галактике. Исполинские титаны Легио Онорум вздымаются над когортами скитариев, готовящихся к сопровождению бессчетных экспедиций, охочих до знаний и утерянных технологий".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Стигия VIII — мир-кузня, расположенный на одной из лун газового гиганта в бинарной звездной системе Вулканис. Величественное место! Могучие мануфакторумы оплетают мир от горизонта до горизонта, исторгая из себя вооружение и технику, для армий Сегментум Соляр — образцы и паттерны, которым нет равных в галактике. Исполинские титаны Легио Онорум вздымаются над когортами скитариев, готовящихся к сопровождению бессчетных экспедиций, охочих до знаний и утерянных технологий.
- guid: 4584964c-2116-4564-ab2c-1b16deeb43df
  event: CompanionDialogue_Manipulus_85
  text: '"Возможно по мне этого не скажешь, но я странник и пилигрим. Мы с Нунциусом возглавляли исследовательские экспедиции, с целью поиска реликвий и артефактов и продвижения Поиска Знаний. Я также старался учиться у коллег при любой удобной возможности, развивая свою компетенцию в генетике, герметике и аугметике. Мы посетили не один мир, плавали не на одном судне и не раз запачкали руки, как буквально, так и фигурально".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Возможно по мне этого не скажешь, но я странник и пилигрим. Мы с Нунциусом возглавляли исследовательские экспедиции, с целью поиска реликвий и артефактов и продвижения Поиска Знаний. Я также старался учиться у коллег при любой удобной возможности, развивая свою компетенцию в генетике, герметике и аугметике. Мы посетили не один мир, плавали не на одном судне и не раз запачкали руки, как буквально, так и фигурально.
- guid: a4ffe962-b288-48d5-b49c-af8e03728fee
  event: CompanionDialogue_Manipulus_86
  text: '"Я пришел к выводу, что единственным верным решением в контексте данного эксперимента было не проводить его вовсе. Мои методы были верны, а намерения — благие, но я цеплялся за гипотезу до последнего, несмотря на аргументы Нунциуса и объективную реальность. Я пытался выжать пользу из людей, словно разряд из угасающей батареи. Но если батарея иссякла, как бы хорошо и долго она ни служила до этого, разве не рациональнее утилизировать ее и заменить на новую? Праведность — это свойство этих людей, но не их основная функция. Теперь я это понимаю".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я пришел к выводу, что единственным верным решением в контексте данного эксперимента было не проводить его вовсе. Мои методы были верны, а намерения — благие, но я цеплялся за гипотезу до последнего, несмотря на аргументы Нунциуса и объективную реальность. Я пытался выжать пользу из людей, словно разряд из угасающей батареи. Но если батарея иссякла, как бы хорошо и долго она ни служила до этого, разве не рациональнее утилизировать ее и заменить на новую? Праведность — это свойство этих людей, но не их основная функция. Теперь я это понимаю.
- guid: 1ad5fa6d-312c-4b64-aa7a-5333aaa6f6db
  event: CompanionDialogue_Manipulus_87
  text: '"Ересь. Как часто в наш с Нунциусом адрес звучало это весьма серьезное обвинение. Чаще всего оно — лишь орудие, которым власть имущие выносят приговор всему, чего не понимают или попросту не желают видеть. Ваши методы зачастую неконвенциональны и это не нравится тем, кто считает, что вы покушаетесь на установленный порядок вещей. Но разве не затем Вольному Торговцу даны баснословные полномочия, чтобы обуздывать те владения, которые не мог бы покорить человек никогда не выходящий за рамки? Мы живем с вами в воистину абсурдные времена".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Ересь. Как часто в наш с Нунциусом адрес звучало это весьма серьезное обвинение. Чаще всего оно — лишь орудие, которым власть имущие выносят приговор всему, чего не понимают или попросту не желают видеть. Ваши методы зачастую неконвенциональны и это не нравится тем, кто считает, что вы покушаетесь на установленный порядок вещей. Но разве не затем Вольному Торговцу даны баснословные полномочия, чтобы обуздывать те владения, которые не мог бы покорить человек никогда не выходящий за рамки? Мы живем с вами в воистину абсурдные времена.
- guid: d0985bd2-f015-43e2-8165-8f1c8464de5f
  event: CompanionDialogue_Manipulus_88
  text: '"Я предпочел систематизировать полученный опыт и извлечь из него пользу. Тервантьяс, при всей свой никчемности, продемонстрировал на мне несколько интересных техник вивисекции, сепарации органов и сращивания тканей. Я думаю, что смогу их повторить и даже улучшить. Мало-помалу подобная рациональная переработка пережитых пыток позволяет мне восстанавливаться от потрясения, которое перенес мой разум".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я предпочел систематизировать полученный опыт и извлечь из него пользу. Тервантьяс, при всей свой никчемности, продемонстрировал на мне несколько интересных техник вивисекции, сепарации органов и сращивания тканей. Я думаю, что смогу их повторить и даже улучшить. Мало-помалу подобная рациональная переработка пережитых пыток позволяет мне восстанавливаться от потрясения, которое перенес мой разум.
- guid: c87b39dd-a6b0-4491-bb86-57bf8dbfffa5
  event: CompanionDialogue_Manipulus_89
  text: '{n}Эоганн фыркает.{/n} "Череп мутанта, с которым госпожа Кибелла решила установить фамильярные отношения — вульгарное анатомическое пособие и ничего более. Эти беседы, пожалуй, можно охарактеризовать как примитивный способ медитации, где индивидуум проецирует свое душевное состояние и мысли на какой-то неодушевленный объект и тем самым совершает определенную интроспекцию. Нунциус же содержит в себе машинный дух, которым, как мы знаем, обладает всякое творение Омниссии, и являет собой весьма эрудированный и комплексный конструкт".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн фыркает.
  - speaker: Manipulus
    text_clean: Череп мутанта, с которым госпожа Кибелла решила установить фамильярные отношения — вульгарное анатомическое пособие и ничего более. Эти беседы, пожалуй, можно охарактеризовать как примитивный способ медитации, где индивидуум проецирует свое душевное состояние и мысли на какой-то неодушевленный объект и тем самым совершает определенную интроспекцию. Нунциус же содержит в себе машинный дух, которым, как мы знаем, обладает всякое творение Омниссии, и являет собой весьма эрудированный и комплексный конструкт.
- guid: cd77f99c-4dc7-4048-81db-06d1f31e8216
  event: CompanionDialogue_Manipulus_90
  text: '"Какой абсурд! Мой кибернетический спутник — лишь вспомогательный инструмент. Он гораздо менее утончен, чем Нунциус, и не обладает его выдающимися коммуникативными навыками и острым умом".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Какой абсурд! Мой кибернетический спутник — лишь вспомогательный инструмент. Он гораздо менее утончен, чем Нунциус, и не обладает его выдающимися коммуникативными навыками и острым умом.
- guid: d51620c6-c057-4b17-a471-90ba81b07245
  event: CompanionDialogue_Manipulus_91
  text: '{n}Эоганн парит, обсессивно осматривая Нунциуса. {g|Encyclopedia:ServoSkulls}Сервочереп{/g} лежит у него в руках с потухшим глазом и замершими манипуляторами. Судя по всему, манипулус проводит ремонтные ритуалы над спутником.{/n} "Мясник. Техногубитель! Проклятый ксенос возомнил себя сведущим в делах священной инженерии! Омниссия, даруй мне ясность мысли и охлади праведный гнев в моих синапсах! Что ксенос может знать о таинствах машинных духов? Его убогий разум не способен постичь важности ритуалов обслуживания, он не может уразуметь, что машины — не бездушные куски металла. Вольный Торговец, я настаиваю на ампутации кощунственных дланей этого поразительного в своей посредственности невежды при первой возможности!"'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн парит, обсессивно осматривая Нунциуса. Сервочереп лежит у него в руках с потухшим глазом и замершими манипуляторами. Судя по всему, манипулус проводит ремонтные ритуалы над спутником.
  - speaker: Manipulus
    text_clean: Мясник. Техногубитель! Проклятый ксенос возомнил себя сведущим в делах священной инженерии! Омниссия, даруй мне ясность мысли и охлади праведный гнев в моих синапсах! Что ксенос может знать о таинствах машинных духов? Его убогий разум не способен постичь важности ритуалов обслуживания, он не может уразуметь, что машины — не бездушные куски металла. Вольный Торговец, я настаиваю на ампутации кощунственных дланей этого поразительного в своей посредственности невежды при первой возможности!
- guid: e7a8d043-c6b7-428f-8d45-d9ef3b026afe
  event: CompanionDialogue_Manipulus_92
  text: '"Прошу, не бередите рану, Вольный Торговец. То, что это профанное исчадие сотворило с Нунциусом ранило меня куда глубже, чем все его лезвия, глумившиеся над моим телом! Я совершаю диагностическое бдение над мои дражайшим коллегой — мне нужно завершить протоколы пурификации, чтобы избыть любую скверну, что могла проникнуть в него. Впрочем, пока что прогнозы оптимистичные — целостность когито-контуров не нарушена, фунционал соответствует предписанному".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Прошу, не бередите рану, Вольный Торговец. То, что это профанное исчадие сотворило с Нунциусом ранило меня куда глубже, чем все его лезвия, глумившиеся над моим телом! Я совершаю диагностическое бдение над мои дражайшим коллегой — мне нужно завершить протоколы пурификации, чтобы избыть любую скверну, что могла проникнуть в него. Впрочем, пока что прогнозы оптимистичные — целостность когито-контуров не нарушена, фунционал соответствует предписанному.
- guid: 43662163-28c4-4174-a810-2a6b9ff76fe5
  event: CompanionDialogue_Manipulus_93
  text: '"И {d|Encyclopedia:Ch3_TalkWithHaemunculusAboutNuncius}вы ему поверили?{/d} Ксенос не смог разобраться в устройстве моих имплантов, окрестив их "примитивными поделками", пытаясь скрыть позор невежества за оскорблениями. Что уж говорить о невероятно утонченных технологиях, которыми пронизан Нунциус! Я вскрывал, ксеносов подобных ему, Вольный Торговец — само их естество пронизанно ложью".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: И вы ему поверили? Ксенос не смог разобраться в устройстве моих имплантов, окрестив их "примитивными поделками", пытаясь скрыть позор невежества за оскорблениями. Что уж говорить о невероятно утонченных технологиях, которыми пронизан Нунциус! Я вскрывал, ксеносов подобных ему, Вольный Торговец — само их естество пронизанно ложью.
- guid: b027c319-dcb1-4e56-a746-00278a76136f
  event: CompanionDialogue_Manipulus_94
  text: '{n}Эоганн с тяжелым вздохом опускает руки с сервочерепом и смотрит вам в глаза.{/n} "Вольный Торговец, вы знаете, что я крайне высокого мнения о ваших интеллектуальных способностях и личностных качествах. Но вы все еще мирян{mf|ин|ка}. Вы не постигали мистерии Бога-Машины. Вы не изучали эзотерические таинства коммуникации с {g|Encyclopedia:MachineSpirit}машинными духами{/g}. Вам не ведомы принципы священной инженерии и герметических протоколов аугментации. Моя вера для вас — непостижимое уравнение. Нунциус — единственный в своем роде конструкт, его нельзя постичь просто заглянув в..."'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн с тяжелым вздохом опускает руки с сервочерепом и смотрит вам в глаза.
  - speaker: Manipulus
    text_clean: Вольный Торговец, вы знаете, что я крайне высокого мнения о ваших интеллектуальных способностях и личностных качествах. Но вы все еще мирянин. Вы не постигали мистерии Бога-Машины. Вы не изучали эзотерические таинства коммуникации с машинными духами. Вам не ведомы принципы священной инженерии и герметических протоколов аугментации. Моя вера для вас — непостижимое уравнение. Нунциус — единственный в своем роде конструкт, его нельзя постичь просто заглянув в...
- guid: 94cd165c-da0b-4997-8665-08845795df00
  event: CompanionDialogue_Manipulus_95
  text: '{n}Эоганн резко замолкает, обернувшись за плечо, словно прислушивается к кому-то. Обычно за этим плечом парит его дражайший коллега. Спустя пару мгновений техножрец кивает пустому месту.{/n} "Ты прав, Нунциус, я слишком строг к Вольному Торговцу. Давление этого места плохо на мне сказывается, мне стоит брать пример с твоей выдержки. Я принесу извинения, а после ты поможешь тебя починить".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Эоганн резко замолкает, обернувшись за плечо, словно прислушивается к кому-то. Обычно за этим плечом парит его дражайший коллега. Спустя пару мгновений техножрец кивает пустому месту.
  - speaker: Manipulus
    text_clean: Ты прав, Нунциус, я слишком строг к Вольному Торговцу. Давление этого места плохо на мне сказывается, мне стоит брать пример с твоей выдержки. Я принесу извинения, а после ты поможешь тебя починить.
- guid: c2967557-459c-471a-b06c-a8b2eff32f59
  event: CompanionDialogue_Manipulus_96
  text: '"С моим дражайшим коллегой, Нунциусом, с кем же еще я могу..."'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: С моим дражайшим коллегой, Нунциусом, с кем же еще я могу...
- guid: ffdcd2ba-d0fa-4ea2-b43e-0ca334497a42
  event: CompanionDialogue_Manipulus_97
  text: '{n}Не отрываясь от осмотра Нунциуса, Эоганн кивает.{/n} "Вольный Торговец?"'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Не отрываясь от осмотра Нунциуса, Эоганн кивает.
  - speaker: Manipulus
    text_clean: Вольный Торговец?
- guid: a05d41f3-b29a-42a2-8b04-a7a400fa5b16
  event: CompanionDialogue_Manipulus_98
  text: '"Нет, Вольный Торговец, я дал вам обет. Мой разум слишком стар и истерзан. Во мне больше нет сил бежать — Амсанкт ждет".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нет, Вольный Торговец, я дал вам обет. Мой разум слишком стар и истерзан. Во мне больше нет сил бежать — Амсанкт ждет.
- guid: c4faf621-07e6-497e-8f9e-67aed9a7333d
  event: CompanionDialogue_Manipulus_99
  text: '{n}Глаз Эоганна закрыт, а руки сложены домиком на животе. На лице выражение глубокого умиротворения. Не открывая глаз, он произносит:{/n} "{g|Encyclopedia:Magos}Магос{/g} биологис Эвристий Окто-Рубедо рек: "Всяк организм, порожденный естественно, плотью от плоти, ведает страх. Но высший трепет у особи органической неизменно вызывает угроза аннигиляции".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: 'Глаз Эоганна закрыт, а руки сложены домиком на животе. На лице выражение глубокого умиротворения. Не открывая глаз, он произносит:'
  - speaker: Manipulus
    text_clean: 'Магос биологис Эвристий Окто-Рубедо рек: "Всяк организм, порожденный естественно, плотью от плоти, ведает страх. Но высший трепет у особи органической неизменно вызывает угроза аннигиляции.'
- guid: a8ef0abc-fa19-4584-a7b5-f0012da70ad6
  event: Companions_Navigator_ManipulusReaction_01
  text: '"Разум генетора Фебруса столь многогранен... Лазурь, кобальт, индиго — как же велика его тяга осмыслить устройство сего мира! Но где-то внутри, в самом естестве синевы, прячется тягостное чувство, заключенное в кокон из терракоты. Оно почти ускользает от взора, но впитывает в себя все прочие оттенки — и рано или поздно поглотит их все, без остатка".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Разум генетора Фебруса столь многогранен... Лазурь, кобальт, индиго — как же велика его тяга осмыслить устройство сего мира! Но где-то внутри, в самом естестве синевы, прячется тягостное чувство, заключенное в кокон из терракоты. Оно почти ускользает от взора, но впитывает в себя все прочие оттенки — и рано или поздно поглотит их все, без остатка.
- guid: 471d6657-d3ec-41cb-9c54-2ce47392bca9
  event: 'Companions_Navigator_ManipulusReaction_02

    '
  text: '"Таящиеся в сердце почтенного манипулуса алые, черные и белесые сполохи сокрушили свою темницу. Геометрия узоров, сплетаемых ими в размышлениях ученого мужа, будоражит взор. Однако... в них нет ни стройности, ни успокоения. Словно узорам постоянно чего-то недостает, и они тотчас сменяются на новые — столь же неполноценные и столь же... безумные? Это зрелище в равной степени тревожит и очаровывает".'
  speaker: Cassia Orsellio
  parts:
  - speaker: Cassia Orsellio
    text_clean: Таящиеся в сердце почтенного манипулуса алые, черные и белесые сполохи сокрушили свою темницу. Геометрия узоров, сплетаемых ими в размышлениях ученого мужа, будоражит взор. Однако... в них нет ни стройности, ни успокоения. Словно узорам постоянно чего-то недостает, и они тотчас сменяются на новые — столь же неполноценные и столь же... безумные? Это зрелище в равной степени тревожит и очаровывает.
- guid: 91ad2e20-ed5f-4878-9910-7c396bf2ab15
  event: ManipulusFirstMeet_Abelard_01
  text: '{n}Абеляр ошеломленно качает головой.{/n} "Сервочереп ваш... коллега? В таком случае инфопластина — мой адъютант!"'
  speaker: Abelard Werserian
  parts:
  - speaker: narrator
    text_clean: Абеляр ошеломленно качает головой.
  - speaker: Abelard Werserian
    text_clean: Сервочереп ваш... коллега? В таком случае инфопластина — мой адъютант!
- guid: 8e4dd5f0-0f4f-445f-841b-0d381465c621
  event: ManipulusFirstMeet_Abelard_02
  text: '{n}Сенешаль озадаченно прочищает горло.{/n} "Я... возьму красноречие господина Нунциуса на заметку".'
  speaker: Abelard Werserian
  parts:
