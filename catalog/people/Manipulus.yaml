- guid: 632dcb94-c687-429f-b06a-60ff82a3d0fc
  event: ManipulusFirstMeet_Manipulus_21
  text: '{n}Его неаугментированный глаз закрыт, а губы расслаблены в умиротворенной улыбке. Сложив руки на аугментированном брюхе, техножрец с упоением втягивает пронизанный озоном и священными маслами воздух.{/n} "Один мудрец молвил, что Духа Машины невозможно узреть. И он был прав, ибо {g|Encyclopedia:OmnissiahGlossary}Омниссия{/g} в бескрайней мудрости сокрыл свои творения даже от взглядов вернейших слуг. Но разве верующий может познать естество машины лишь через око органическое или стальное? Нет. Ведь пар, исторгающий запах священных масел — дыхание Духа, грохот суставов и стержней — биение его сердца, а Движущая Сила — ток его крови".'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Его неаугментированный глаз закрыт, а губы расслаблены в умиротворенной улыбке. Сложив руки на аугментированном брюхе, техножрец с упоением втягивает пронизанный озоном и священными маслами воздух.
  - speaker: Manipulus
    text_clean: Один мудрец молвил, что Духа Машины невозможно узреть. И он был прав, ибо Омниссия в бескрайней мудрости сокрыл свои творения даже от взглядов вернейших слуг. Но разве верующий может познать естество машины лишь через око органическое или стальное? Нет. Ведь пар, исторгающий запах священных масел — дыхание Духа, грохот суставов и стержней — биение его сердца, а Движущая Сила — ток его крови.
- guid: d8aebc5e-0ba4-43ed-afda-f00cde83ff51
  event: ManipulusFirstMeet_Manipulus_22
  text: '"Я уже передал основные ритуалы эксплуатации квалифицированному контингенту Сектора Бионика. Если вы откажете нам с Нунциусом, то мы задержимся ровно настолько, чтобы передать остальные знания, после чего покинем ваше судно. Процедуры аугментации смогут свершаться без моего участия".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Я уже передал основные ритуалы эксплуатации квалифицированному контингенту Сектора Бионика. Если вы откажете нам с Нунциусом, то мы задержимся ровно настолько, чтобы передать остальные знания, после чего покинем ваше судно. Процедуры аугментации смогут свершаться без моего участия.
