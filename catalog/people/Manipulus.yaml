  event: ManipulusFirstMeet_Manipulus_28
  text: '{n}Он вонзает мехадендрит в аугментированную руку одного из стоящих рядом техноматов. Энергия змеится по хромовой клешне в батарею, вокс техномата надрывно хрипит, после чего его имплант повисает плетью. Убедившись, что вы увидели эффект, Эоганн перекачивает энергию обратно в аугмент и тот вновь оживает.{/n} "Вопросы?"'
  speaker: Manipulus
  parts:
  - speaker: narrator
    text_clean: Он вонзает мехадендрит в аугментированную руку одного из стоящих рядом техноматов. Энергия змеится по хромовой клешне в батарею, вокс техномата надрывно хрипит, после чего его имплант повисает плетью. Убедившись, что вы увидели эффект, Эоганн перекачивает энергию обратно в аугмент и тот вновь оживает.
