  text: '{n}Техножрец выглядит ошеломленным.{/n} "Вы думаете я посмел бы расхаживать с анафемой, богомерзкой пародией на людской разум, величайшей ересью против Омниссии? Абсурд!"'
  speaker: Manipulus
