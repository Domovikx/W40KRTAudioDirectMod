  text: '{n}Вокс Паскаля издает бинарную трель, торжественную и подавляющую.{/n} "Таинство обслуживания технореликвии совершено корректно, подтверждено. Инициирован протокол обмена священными регалиями". {n}Взгляд техножреца впивается в робу Эоганна.{/n} "Фиксирую принадлежность данной благодатной техноединицы к клиру {g|Encyclopedia:ForgeWorldGlossary}мира-кузни{/g} Стигия VIII". {n}В синем оптическом аугменте мелькает схожая с подозрительным прищуром алая искра.{/n} "Запрашиваю подтверждение информированности о нормативах действующего на данном судне катехизиса обслуживания и безопасности".'
