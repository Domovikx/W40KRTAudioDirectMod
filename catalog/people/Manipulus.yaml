    text_clean: Вопросы?
- guid: f258f837-a559-40e0-b205-8d19415979f7
  event: ManipulusFirstMeet_Manipulus_29
  text: '"Иными словами, позвольте мне и Нунциусу остаться на судне и сопровождать вас. Мы сведущи в аугметике, генетике, алхимии, анатомии людской и мерзновенных {g|Encyclopedia:XenosGlossary}ксеносов{/g}, таинствах Движущей Силы и пресвятой инженерии. Данные области познания могут быть применены и для устранения единиц, чьи воззрения не способствуют продуктивным дебатам".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Иными словами, позвольте мне и Нунциусу остаться на судне и сопровождать вас. Мы сведущи в аугметике, генетике, алхимии, анатомии людской и мерзновенных ксеносов, таинствах Движущей Силы и пресвятой инженерии. Данные области познания могут быть применены и для устранения единиц, чьи воззрения не способствуют продуктивным дебатам.
- guid: 3a2380d4-45f1-4c72-832c-a04e15f2f4a5
  event: ManipulusFirstMeet_Manipulus_30
  text: '"Младший лексмеханик Карр-Айн, оператор вспомогательного терминала 289-0 нижних цехов Алтаря-Темплум-Каликсис-Экс-17. Прагматик и бюрократ, видевший мир исключительно сквозь призму статистики, бесконечные парады расхода и прихода — его мало что интересовало, кроме учета клапанов и вентилей. Но, между делом, он ронял подобные жемчужины мудрости, сам того не замечая. Я же считал своим долгом их подбирать".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Младший лексмеханик Карр-Айн, оператор вспомогательного терминала 289-0 нижних цехов Алтаря-Темплум-Каликсис-Экс-17. Прагматик и бюрократ, видевший мир исключительно сквозь призму статистики, бесконечные парады расхода и прихода — его мало что интересовало, кроме учета клапанов и вентилей. Но, между делом, он ронял подобные жемчужины мудрости, сам того не замечая. Я же считал своим долгом их подбирать.
