  event: ManipulusFirstMeet_Manipulus_15
  text: '{n}На губах Эоганна играет слабая улыбка.{/n} "Отклонено с благодарностью и почтением. На техноединицу Нунциус распространен статус личного инструментария богоискания, подразумевающая привилегию приватности. В том числе от вторжения равных в статусе духовных лиц".'
