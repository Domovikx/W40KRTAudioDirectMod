  text: '"Естественно, я не явился с пустыми руками — я хотел бы преподнести вам этот аугмент. Теперь, когда машинный дух имплантационного трона бодрствует, я смогу благословить им вас или кого-то из вашей свиты, будь на то воля Вольного Торговца".'
