  event: ManipulusFirstMeet_Manipulus_17
  text: '"Напал?" {n}Эоганн озадаченно подкручивает болт на бороде.{/n} "Я лишь использовал его как наглядное пособие для безобидной демонстрации, проведенный в контролируемых условиях. Более того, в процессе я выявил несколько неисправностей в его аугментах и исправил их. Уверяю вас, что органические компоненты пострадали незначительно".'
