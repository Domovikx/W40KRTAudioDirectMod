    text_clean: Техножрец выглядит ошеломленным.
  - speaker: Manipulus
    text_clean: Вы думаете я посмел бы расхаживать с анафемой, богомерзкой пародией на людской разум, величайшей ересью против Омниссии? Абсурд!
