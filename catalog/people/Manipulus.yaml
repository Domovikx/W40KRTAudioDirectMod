  event: ManipulusFirstMeet_Manipulus_25
  text: '{n}Вернув самообладание, Эоганн вздевает палец:{/n} "Я чту Алое Соглашение Марса и клянусь перед лицом всезнающего и всевидящего Бога-Машины, что Нунциус не является порождением техноереси. Если я лгу, то пусть меня сразит электро-магнитный пульс Его гнева, а Движущая Сила покинет мои члены вовеки веков!"'
  speaker: Manipulus
  parts:
