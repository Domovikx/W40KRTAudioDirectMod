- guid: fffecab1-91b2-4ef4-8e28-856775def21e
  event: ManipulusFirstMeet_Manipulus_13
  text: '"С радостью подтверждаю протокол обмена священными регалиями и приветствую брата во служении." {n}В голосе Эоганна не слышно напряжения — скорее непонятный азарт.{/n} "Обеты, принятые в этом храме, мне известны, и я обещаю уважать их. Запрашиваю у досточтимого коллеги встречу для обмена знаниями и дискуссию о ценностях".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: С радостью подтверждаю протокол обмена священными регалиями и приветствую брата во служении.
  - speaker: narrator
    text_clean: В голосе Эоганна не слышно напряжения — скорее непонятный азарт.
  - speaker: Manipulus
