  event: ManipulusFirstMeet_Manipulus_26
  text: '"Нунциус — невероятно утонченное творение священных алгоритмов, сопряженных с моими собственными. Мирянину сложно уразуметь как они работают, но ни один из них не нарушает заповеди Омниссии".'
  speaker: Manipulus
  parts:
  - speaker: Manipulus
    text_clean: Нунциус — невероятно утонченное творение священных алгоритмов, сопряженных с моими собственными. Мирянину сложно уразуметь как они работают, но ни один из них не нарушает заповеди Омниссии.
