  event: ManipulusFirstMeet_Manipulus_14
  text: '{n}Сложив руки на животе, техножрец обращается к Нунциусу:{/n} "Скепсис неоспоримо является одним из инструментов Познания, дражайший коллега. Он бережет нас от многих ересей, не позволяя эго и тщеславию затмевать разум на пути служения. Но, как видишь, Нунциус, не в каждой ситуации он оправдан". {n}Помолчав, Эоганн кивает.{/n} "Вольный Торговец, Нунциус констатирует, что вы — человек редкой проницательности и предусмотрительности. Я фиксирую это как неоспоримый факт и благодарю за гостеприимство".'
