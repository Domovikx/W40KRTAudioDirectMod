  - speaker: Seneschal (NPC)
    text_clean: '...я мог бы лишиться всей своей семьи, казненной по ложному обвинению! Я и не представлял, насколько уязвимы Версерианы, когда я — сенешаль самого Лорд-капитана — вдали от дома.'
- guid: de4ddfba-5a35-43d9-b0a6-60a6f683fc8c
  event: Companions_Seneschal_56
  text: '"Что ж, Лорд-капитан..." {n}Абеляр чуть медлит, на его лице — печать прожитых лет, в эту минуту проступившая особенно явно.{/n} "Позвольте выразить свое сожаление, что семья Версериан {d|Encyclopedia:CompAbelard_Q2_KilledFamily}не оправдала{/d} возложенных на нее обязательств и оказанного доверия. Надеюсь, дворянский род, который в будущем займет ее место, проявит себя лучше, чем моя кровь".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Что ж, Лорд-капитан...
  - speaker: narrator
    text_clean: Абеляр чуть медлит, на его лице — печать прожитых лет, в эту минуту проступившая особенно явно.
  - speaker: Seneschal (NPC)
    text_clean: Позвольте выразить свое сожаление, что семья Версериан не оправдала возложенных на нее обязательств и оказанного доверия. Надеюсь, дворянский род, который в будущем займет ее место, проявит себя лучше, чем моя кровь.
- guid: c73a1023-3cc8-409c-b514-721efe0e5893
  event: Companions_Seneschal_57
  text: '"Я не могу опекать свой род, словно они малые дети. Когда-то я подобным образом попытался опекать вас... и быстро выяснил, что у вас есть своя голова на плечах и свои суждения — пускай я и не всегда с ними соглашаюсь. Нет, мой долг — быть подле вас. Быть сенешалем".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Я не могу опекать свой род, словно они малые дети. Когда-то я подобным образом попытался опекать вас... и быстро выяснил, что у вас есть своя голова на плечах и свои суждения — пускай я и не всегда с ними соглашаюсь. Нет, мой долг — быть подле вас. Быть сенешалем.
- guid: a98fa809-f3d5-4200-b177-ddfedfbdda7b
  event: Companions_Seneschal_58
  text: '"Лорд-капитан..." {n}Старый офицер поднимает густые брови в непритворном изумлении — и облегчении.{/n} "Не знаю, за какие мои заслуги вы столь снисходительны к старику... но я не буду перечить приказу Вольного Торговца — тем более что даже желания такого не имею! Ох, только бы вот успеть вам нового сенешаля на смену себе воспитать..."'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан...
  - speaker: narrator
    text_clean: Старый офицер поднимает густые брови в непритворном изумлении — и облегчении.
  - speaker: Seneschal (NPC)
    text_clean: Не знаю, за какие мои заслуги вы столь снисходительны к старику... но я не буду перечить приказу Вольного Торговца — тем более что даже желания такого не имею! Ох, только бы вот успеть вам нового сенешаля на смену себе воспитать...
