- guid: baa82cce-fa6e-4d27-9174-f2b5cdc872ce
  event: Companions_Seneschal_52
  text: '{n}Сенешаль берет в руки инфопластину. Его нахмуренные брови сходятся на переносице. {/n}"Боюсь мне неизвестно, как найти тайники, но кое-чем я все же могу помочь". {n}Абеляр протягивает инфопластину вам.{/n} "Этот числовой код ваша предшественница использовала для дезактивации некоторых систем защиты на своей службе. Если я знал Леди Теодору достаточно хорошо, то могу быть уверенным, что свои тайники она оставила под надежной защитой — в этом случае, код пригодится и вам".'
