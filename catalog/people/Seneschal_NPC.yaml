  event: ''
  text: '{n}Сенешаль перехватывает оружие поудобнее и громыхает:{/n} "Лишь один человек может восседать на троне Вольного Торговца, и имя {mf|ему|ей} — {name} фон Валанциус. Жалким подделкам, крамольным ксеносам и врагам Человечества место у его подножья, в луже крови, под пятой владыки династии!"'
  speaker: Seneschal (NPC)
