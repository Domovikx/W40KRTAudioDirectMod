  event: ''
  text: '"Именем Помазанника Императора Себериана фон Валанциуса, я, сенешаль династии Лария Войгтвир, приговариваю тебя, предатель, к смертной казни". {n}Сенешаль выговаривает каждое слово глухо, механически двигая челюстью.{/n} "По воле Бога-Императора да свершится правосудие". {n}Реальность тонет во вспышках выстрелов, разрывающих вашу плоть, и последнее, что вы видите перед наступлением темноты — исполненный злобы и отчаяния взгляд Ларии.{/n}'
  speaker: Seneschal (NPC)
