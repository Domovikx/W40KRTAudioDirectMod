  - speaker: narrator
    text_clean: Во взгляде Абеляра читается невиданный вами раньше холод, однако его голос и выражение лица не выдают ничего, кроме почтения к своему владыке.
- guid: 7ac4006e-6682-4719-9978-5fd86e183a37
  event: Companions_Seneschal_48
  text: '{n}Сенешаль вздыхает.{/n} "При Леди Теодоре я неоднократно исполнял роль управителя торгового протектората. При этом я находился на Даргонусе, а не в странствиях с Вольным Торговцем. Если это возможно... после того, как непосредственная потребность в моем присутствии будет исчерпана... я бы хотел вернуться к той позиции. Присматривать за торговым протекторатом на мире-столице, попутно главенствуя над родом Версериан — и своим авторитетом помогая им возвыситься".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Сенешаль вздыхает.
  - speaker: Seneschal (NPC)
    text_clean: При Леди Теодоре я неоднократно исполнял роль управителя торгового протектората. При этом я находился на Даргонусе, а не в странствиях с Вольным Торговцем. Если это возможно... после того, как непосредственная потребность в моем присутствии будет исчерпана... я бы хотел вернуться к той позиции. Присматривать за торговым протекторатом на мире-столице, попутно главенствуя над родом Версериан — и своим авторитетом помогая им возвыситься.
- guid: 1e5734d1-f10f-4d8d-84f2-00007ed99abc
  event: Companions_Seneschal_49
  text: '"Но таков мой долг перед Вольным Торговцем — неусыпно нести вахту подле Лорд-капитана, служить опорой в самые темные времена — для вас и для меня". {n}Абеляр выпрямляется и смотрит вам в глаза с мрачной убежденностью.{/n} "Я {d|Encyclopedia:CompAbelard_Q1_OldWays}не отступлюсь от своей роли{/d}, чтобы не происходило. Не сомневайтесь во мне. Семья Версериан сделает выводы из произошедшего и, если наша кровь чего-то стоит, будет готова к новым испытаниям без моей опеки".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Но таков мой долг перед Вольным Торговцем — неусыпно нести вахту подле Лорд-капитана, служить опорой в самые темные времена — для вас и для меня.
