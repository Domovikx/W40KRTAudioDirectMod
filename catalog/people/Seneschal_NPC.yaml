- guid: 45194a0b-84fc-4890-9277-e8fa91d92fa7
  event: ''
  text: '"Лорд-капитан, без хормейстера астропаты Даргонуса существенно потеряют силу. Нельзя казнить мастера Праса без достойной замены". {n}Сенешаль хмурится.{/n} "За одним из миров Чорда числится давний долг, который можно взыскать опытным астропатом. Мы можем затребовать выплату, но тогда та планета останется почти без средств связи".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан, без хормейстера астропаты Даргонуса существенно потеряют силу. Нельзя казнить мастера Праса без достойной замены.
  - speaker: narrator
