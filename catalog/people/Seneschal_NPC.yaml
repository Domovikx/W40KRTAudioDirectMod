    text_clean: Благоразумное стремление, Лорд-капитан. Готов посвятить вас во все интересующие вас нюансы.
- guid: 0cebd36c-76b5-441f-822a-9e03f32d3538
  event: Companions_Seneschal_30
  text: '"Возможно, {g|Encyclopedia:AdeptusAstartes}Ангел Императора{/g} сможет рассказать вам о чем-то, что ему стало известно за время заточения в этих стенах. Узнайте, что у него на уме... только постарайтесь не злить — нрав у Ульфара поистине крутой!"'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Возможно, Ангел Императора сможет рассказать вам о чем-то, что ему стало известно за время заточения в этих стенах. Узнайте, что у него на уме... только постарайтесь не злить — нрав у Ульфара поистине крутой!
- guid: 8bc6d6cb-af97-4466-a49e-7807aee0e480
  event: Companions_Seneschal_31
  text: '"Возможно, {g|Encyclopedia:Xenos}ксенос{/g} Ирлиэт сможет что-то поведать вам о том, что это за место. В конце концов, она каким-то образом родственна тем, кто здесь обитает... и повинна в том, что мы с вами находимся здесь сейчас". {n}Абеляр умолкает, однако в его глазах легко прочитать все, что он думает о возвращении эльдарки в ряды ваших спутников.{/n}'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Возможно, ксенос Ирлиэт сможет что-то поведать вам о том, что это за место. В конце концов, она каким-то образом родственна тем, кто здесь обитает... и повинна в том, что мы с вами находимся здесь сейчас.
