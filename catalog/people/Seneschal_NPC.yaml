  text: '{n}Голос Абеляра немного смягчается.{/n} "У вас нет выбора, {name}. Вы — объявленн{mf|ый|ая} наследни{mf|к|ца} Вольного Торговца, и ваша судьба предопределена. Кроме того..." {n}Сенешаль понижает голос.{/n} "Если Кунрад решил избавиться от всех кандидатов, то его убийцы должны все еще быть там... ждать. Едва ли им хватит дерзости напасть на вас, если вы будете облечены мантией Вольного Торговца. Но стоит вам сойти с корабля в статусе обычного слуги Императора..."'
