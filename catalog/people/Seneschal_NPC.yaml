    text_clean: При вашем приближении Абеляр распрямляет спину и болезненно кряхтит, когда в его спине что-то хрустит.
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан. К вашим услугам.
    speaker_override: Abelard Werserian
- guid: dfaa5802-539f-406b-b374-fbf270422857
  event: Companions_Seneschal_19
  text: '"Интересно, кто донес эту новость". {n}Абеляр презрительно фыркает.{/n} "Впрочем, мне от вас скрывать нечего. В последнее время рулевые все чаще сбиваются с курсов, а рапорты не перестают противоречить друг другу. Беспорядки не прекратились и после разжалований, так что я лично взялся провести расследование".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Интересно, кто донес эту новость.
