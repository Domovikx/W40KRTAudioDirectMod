- guid: db5b96de-e0c9-4317-8d90-6df89244641d
  event: Companions_Seneschal_22
  text: '{n}Абеляр багровеет от ярости, но неимоверным усилием воли он берет себя в руки.{/n} "Прискорбно слышать это от вас. После всех лет службы при {g|Encyclopedia:RogueTrader}Вольном Торговце{/g} фон Валанциус... вероятно, умение Леди Теодоры ценить верность не передается в крови. Всего наилучшего, {name} — при первой возможности я покину пустотный корабль и вернусь в семейное имение на Даргонусе".'
