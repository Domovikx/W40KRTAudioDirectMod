  event: Companions_Seneschal_53
  text: '{n}На мгновение взгляд Абеляра становится пустым, будто обращенным внутрь себя. Затем он пару раз моргает и удивленно произносит:{/n} "Хмм. Нет. Определенно нет. Ничего такого не припомню".'
  speaker: Seneschal (NPC)
  parts:
