  text: '{n}Сенешаль придает своему лицу самый суровый вид и зычно провозглашает:{/n} "Гвардеец, перед тобой — Вольный Торговец {name} фон Валанциус, волей Императора правитель{mf||ница} миллионов подданных и владетель{mf||ница} множества планет — включая Летус. С этого момента ты будешь выказывать {mf|Его|Ее} Светлости подобающее почтение и беспрекословно выполнишь любой приказ".'
