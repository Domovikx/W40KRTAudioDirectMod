  text: '"Лорд-капитан..." {n}Сенешаль тщательно подбирает слова.{/n} "Не просто сообщать об этом, но за время вашего отсутствия на Даргонусе вспыхнула череда бунтов среди черни. Виновными в организации мятежей, подрыве экономики столицы, а также... заговоре против вас были признаны члены моей семьи".'
