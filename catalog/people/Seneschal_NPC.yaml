- guid: d2ae8950-e1a4-49a0-ac0c-98d549515ea9
  event: Companions_Seneschal_43
  text: '"Если вы успокаиваете себя мыслью, что мы больше не услышим о Кунраде, то совершенно напрасно. Вы разрушили его планы, тщательно подготовленное и выпестованное предательство. Он обязательно попробует нанести вам удар, пользуясь своими контактами и знаниями протектората. Вопрос только в том, сможете ли вы, Лорд-капитан, предугадать его следующие шаги".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Если вы успокаиваете себя мыслью, что мы больше не услышим о Кунраде, то совершенно напрасно. Вы разрушили его планы, тщательно подготовленное и выпестованное предательство. Он обязательно попробует нанести вам удар, пользуясь своими контактами и знаниями протектората. Вопрос только в том, сможете ли вы, Лорд-капитан, предугадать его следующие шаги.
