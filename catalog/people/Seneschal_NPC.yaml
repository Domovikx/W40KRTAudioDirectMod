  event: Companions_Seneschal_33
  text: '"Хейнрикс наверняка мог бы что-то рассказать вам о нашем узилище... но его судьба нам до сих пор неизвестна".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Хейнрикс наверняка мог бы что-то рассказать вам о нашем узилище... но его судьба нам до сих пор неизвестна.
- guid: 09e3d8cd-3b05-4178-9468-782b84d0ef9a
  event: Companions_Seneschal_34
  text: '"Нет, Лорд-капитан, и, поверьте, я бы хотел оставаться в этом блаженном неведении до своего последнего дня. Даже знание того, что это... эта... бездна вообще существует, отравляет мое сознание".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Нет, Лорд-капитан, и, поверьте, я бы хотел оставаться в этом блаженном неведении до своего последнего дня. Даже знание того, что это... эта... бездна вообще существует, отравляет мое сознание.
- guid: 6328ee13-386d-422c-ba6a-8d22dae5abba
  event: Companions_Seneschal_35
  text: '"Вы говорили с Хейнриксом? После его вызволения из плена он едва ли обменялся со мной десятком слов, но вряд ли будет отмалчиваться, если знает о чем-то, что может нам помочь!"'
  speaker: Seneschal (NPC)
