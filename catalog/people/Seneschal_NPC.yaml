    text_clean: Четырежды отец, и, если эти сведения еще не устарели — одиннадцатикратный дед. Моя семья живет на Даргонусе. Никто из детей не выказал рвения или способностей к корабельной службе, и я не стал настаивать, чтобы они шли по моим стопам.
