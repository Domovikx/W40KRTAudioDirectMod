- guid: 5a9a8f7b-e91b-4263-8a19-5491c227acfb
  event: Companions_Seneschal_18
  text: '{n}При вашем приближении Абеляр распрямляет спину и болезненно кряхтит, когда в его спине что-то хрустит.{/n} "Лорд-капитан. К вашим услугам".'
  speaker: Seneschal (NPC)
  parts:
