  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Офицером Навис Империалис,
  - speaker: narrator
    text_clean: — с гордостью отвечает Абеляр.
  - speaker: Seneschal (NPC)
    text_clean: Не знаю, уместно ли здесь слово "был" — это судьба и суть жизни, а не работа. Я был счастлив служить Лорд-капитану Теодоре. Но душой и разумом я все еще имперский офицер.
- guid: d061a035-c7a2-4b37-9db5-7b886a118221
  event: Companions_Seneschal_06
  text: '"До недавнего времени Простор Коронус едва ли можно было назвать имперским регионом. С прибытием {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g} ситуация изменилась, но ненамного. Считайте, что здесь действуют свои порядки, более радикальные, но допускающие нестандартный подход там, где он сулит победу. Коронус не зря считается территорией Вольных Торговцев. Только у них достаточно военных сил, дерзости и прав, дарованных {g|Encyclopedia:Warrant}Патентом{/g}, чтобы пережить прыжок в неисследованную часть Простора. А в случае удачного исхода — удержать то, что сумели завоевать на фронтире".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: До недавнего времени Простор Коронус едва ли можно было назвать имперским регионом. С прибытием Лорд-инквизитора ситуация изменилась, но ненамного. Считайте, что здесь действуют свои порядки, более радикальные, но допускающие нестандартный подход там, где он сулит победу. Коронус не зря считается территорией Вольных Торговцев. Только у них достаточно военных сил, дерзости и прав, дарованных Патентом, чтобы пережить прыжок в неисследованную часть Простора. А в случае удачного исхода — удержать то, что сумели завоевать на фронтире.
- guid: fcd07ee3-d47c-4d98-9b4e-f1198057b4bf
  event: Companions_Seneschal_07
  text: '"В первую очередь вам следует с уважением относиться к официальным представителям Империума — пусть Простор и окраина, он все же относится к территории {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}. Появление {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g} привело к тому, что Простор Коронус стал менее диким и неконтролируемым регионом... к вящему расстройству некоторых индивидов, привыкших к местному беспределу".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: В первую очередь вам следует с уважением относиться к официальным представителям Империума — пусть Простор и окраина, он все же относится к территории Золотого Трона. Появление Лорд-инквизитора привело к тому, что Простор Коронус стал менее диким и неконтролируемым регионом... к вящему расстройству некоторых индивидов, привыкших к местному беспределу.
- guid: 8385d363-4512-4f8a-b446-a7ce96fed36a
  event: Companions_Seneschal_08
  text: '"Если говорить о "ничейной" территории, коей является {g|Encyclopedia:Footfall}Футфол{/g}... среди того отребья, который обретается на этой горстке астероидов, есть три фракции, имеющие относительно большое влияние в секторе. Первая — {g|Encyclopedia:KasballicaMission}Миссия Касбаллики{/g}. Организованная преступность в самом первозданном виде, имеющая влияние на Наместника Футфола и связи с Вольным Торговцем Винтерскейл. Вторая — ответвление нашей сиятельной Экклезиархии, {g|Encyclopedia:Drusians}последователи{/g} святого Друза. Активно наращивают силы, пользуясь влиянием на Торговца Чорда. Наконец, третьи — Эксплораторы, крыло {g|Encyclopedia:AdeptusMechanicus}Адептус Механикус{/g}. Готовы умирать и убивать за тайны древней технологической ереси, что скрыта меж звезд Простора Коронус".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Если говорить о "ничейной" территории, коей является Футфол... среди того отребья, который обретается на этой горстке астероидов, есть три фракции, имеющие относительно большое влияние в секторе. Первая — Миссия Касбаллики. Организованная преступность в самом первозданном виде, имеющая влияние на Наместника Футфола и связи с Вольным Торговцем Винтерскейл. Вторая — ответвление нашей сиятельной Экклезиархии, последователи святого Друза. Активно наращивают силы, пользуясь влиянием на Торговца Чорда. Наконец, третьи — Эксплораторы, крыло Адептус Механикус. Готовы умирать и убивать за тайны древней технологической ереси, что скрыта меж звезд Простора Коронус.
- guid: b822ea3b-33b5-405f-9eb7-039d4d839e75
  event: Companions_Seneschal_09
  text: '"Решение далось мне нелегко. Но в этом предложении я увидел возможность служить интересам Человечества даже более эффективно, чем в Навис Империалис. Не мне рассказывать вам, сколь удивительной особой была Лорд-капитан Теодора. Я увидел в ней настоящего лидера и созидательную силу, создавшую свой протекторат среди опасностей и дикости {g|Encyclopedia:KoronusExpanse}Простора{/g}.'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Решение далось мне нелегко. Но в этом предложении я увидел возможность служить интересам Человечества даже более эффективно, чем в Навис Империалис. Не мне рассказывать вам, сколь удивительной особой была Лорд-капитан Теодора. Я увидел в ней настоящего лидера и созидательную силу, создавшую свой протекторат среди опасностей и дикости Простора.
- guid: b2a90a50-ad6d-4062-96cd-97743bfc8fd5
  event: Companions_Seneschal_10
  text: '"Что?" {n}— Абеляр, кажется, теряет дар речи.{/n} "Лорд-капитан, любые подозрения о неподобающих неуставных чувствах или отношениях совершенно беспочвенны и почти оскорбительны!" {n}Он хмурится и добавляет:{/n} "Совершенно беспочвенны".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Что?
  - speaker: narrator
    text_clean: — Абеляр, кажется, теряет дар речи.
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан, любые подозрения о неподобающих неуставных чувствах или отношениях совершенно беспочвенны и почти оскорбительны!
  - speaker: narrator
    text_clean: 'Он хмурится и добавляет:'
  - speaker: Seneschal (NPC)
    text_clean: Совершенно беспочвенны.
- guid: ec59225e-1bcd-42c0-9328-1547286b9d07
  event: Companions_Seneschal_11
  text: '"Разумеется".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Разумеется.
- guid: cd40f599-f313-4a36-a31f-fba3ad0afcff
  event: Companions_Seneschal_12
  text: '"Вам необходимо как можно скорее воспитать в себе настоящего {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} и восстановить контроль над протекторатом фон Валанциус. Все — от этого корабля до самых дальних ваших планет — должно работать, как части одной машины, благословленной лучшими {g|Encyclopedia:TechPriest}техножрецами{/g}. Ситуация у вас не самая завидная, тем бдительнее надо быть! Даже малый недосмотр может вырасти в огромную проблему, так что будьте внимательны и строги — и к себе, и к другим!"'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Вам необходимо как можно скорее воспитать в себе настоящего Вольного Торговца и восстановить контроль над протекторатом фон Валанциус. Все — от этого корабля до самых дальних ваших планет — должно работать, как части одной машины, благословленной лучшими техножрецами. Ситуация у вас не самая завидная, тем бдительнее надо быть! Даже малый недосмотр может вырасти в огромную проблему, так что будьте внимательны и строги — и к себе, и к другим!
- guid: 8338184a-4a7e-43b5-9527-9d0f0024df2a
  event: Companions_Seneschal_13
  text: '"Лорд-капитан!" {n}Абеляр по-уставному отдает честь.{/n}'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан!
  - speaker: narrator
    text_clean: Абеляр по-уставному отдает честь.
- guid: c61e757e-a122-4914-8eaf-14dc7e779d59
  event: Companions_Seneschal_14
  text: '"Я встретил Лорд-капитана Теодору во время миссии: части Имперского флота оказывали поддержку армии {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} на одном из приграничных миров. Наше знакомство выдалось... непростым. Взаимодействия с гражданскими никогда не были моим коньком. Каково же было мое удивление, когда, уже после завершения операции, я получил направление покинуть службу на флоте и присоединиться к личному совету Вольного Торговца".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: 'Я встретил Лорд-капитана Теодору во время миссии: части Имперского флота оказывали поддержку армии Вольного Торговца на одном из приграничных миров. Наше знакомство выдалось... непростым. Взаимодействия с гражданскими никогда не были моим коньком. Каково же было мое удивление, когда, уже после завершения операции, я получил направление покинуть службу на флоте и присоединиться к личному совету Вольного Торговца.'
- guid: 3957f29f-ea1b-4d86-84a6-0025d12405c1
  event: Companions_Seneschal_15
  text: '"Можно сказать, что среди командования не нашлось тех, кто готов был бы препятствовать желаниям {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}, рискуя своим положением и отношениями с Теодорой". {n}Абеляр усмехается.{/n} "Лорд-капитан обладала определенными связями во {g|Encyclopedia:ImperialNavy}Флоте{/g} — связи, которые она использовала для запроса помощи при конфликте на пограничном мире и которые позволили ей сделать мне предложение, итогом которого стало мое присутствие в ее свите".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Можно сказать, что среди командования не нашлось тех, кто готов был бы препятствовать желаниям Вольного Торговца, рискуя своим положением и отношениями с Теодорой.
  - speaker: narrator
    text_clean: Абеляр усмехается.
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан обладала определенными связями во Флоте — связи, которые она использовала для запроса помощи при конфликте на пограничном мире и которые позволили ей сделать мне предложение, итогом которого стало мое присутствие в ее свите.
- guid: b8f6d3a9-7d0d-4bf7-ba2b-657851e4881f
  event: Companions_Seneschal_16
  text: '{n}Под вашим выразительно-пристальным взглядом Абеляр едва заметно тушуется.{/n} "Флот — древнее учреждение, со своими неписанными законами и правилами. Порой, в пылу официального брифинга или неформальной беседы, я нарушал эти правила, настаивая на своем. Бывает непросто подобрать слова, в точности выражающие мое отношение к ситуации или поступкам других и при этом не звучащие чересчур едко или вызывающе. Многие в командовании были склонны считать мою манеру общения... чрезмерной для человека моего ранга".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Под вашим выразительно-пристальным взглядом Абеляр едва заметно тушуется.
  - speaker: Seneschal (NPC)
    text_clean: Флот — древнее учреждение, со своими неписанными законами и правилами. Порой, в пылу официального брифинга или неформальной беседы, я нарушал эти правила, настаивая на своем. Бывает непросто подобрать слова, в точности выражающие мое отношение к ситуации или поступкам других и при этом не звучащие чересчур едко или вызывающе. Многие в командовании были склонны считать мою манеру общения... чрезмерной для человека моего ранга.
