  text: '{n}Почуяв паузу в рассказе, Абеляр сонно встряхивает головой.{/n} "А? Прошу прощения, Ваша Светлость, я... задумался. Весьма увлекательно, весьма. Вижу, что с историей у вас и правда все блистательно, а значит, мое присутствие тут не требуется!" {n}Сенешаль поспешно пятится к выходу.{/n}'
  speaker: Seneschal (NPC)
