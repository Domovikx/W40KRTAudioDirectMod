  event: Companions_Seneschal_54
  text: '{n}Абеляр, прищурившись, долго смотрит вам в лицо, а затем тихо произносит:{/n} "Девушке, которая мне нравилась, я дарил янусские лилии, но этот сорт давно вымер... Остался лишь в моей памяти. Спросите кого другого, Ваша Светлость. Я слишком стар, чтобы помнить, как обаять девушек". {n}Насупившись, сенешаль отводит взгляд.{/n}'
