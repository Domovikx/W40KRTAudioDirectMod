    text_clean: Я... не видел ее, Лорд-капитан. Но иногда... иногда словно слышу ее смех на отдалении. Или как будто чувствую, что руки касаются — как она делала, когда пыталась отвлечь от горестных раздумий... Но я отличаю явь от миража. Боюсь, теперь придется просто научиться жить с этим призраком, который является только мне. Видением ушедшего.
- guid: d575556d-8416-4f87-a979-9a1204d03d96
  event: Companions_Seneschal_37
  text: '"Никак нет, Лорд-капитан. Я в здравом уме и памяти, служу династии фон Валанциус!" {n}Абеляр пытается придать своему голосу обычную строгость и крепость, но выходит это у него немного наигранно.{/n}'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Никак нет, Лорд-капитан. Я в здравом уме и памяти, служу династии фон Валанциус!
  - speaker: narrator
    text_clean: Абеляр пытается придать своему голосу обычную строгость и крепость, но выходит это у него немного наигранно.
- guid: ce781b6d-9a50-4523-8fec-f62a0a468196
  event: Companions_Seneschal_38
  text: '"Так точно, Лорд-капитан. Процедуры омоложения в очередной раз обратили время вспять, и не спрашивайте, сколько именно иголок в меня воткнули наши хирургеоны. Однако я исцелился от старческих недугов... Ну, большей их части. Нельзя избегать смерть вечно — каждый раз она откусывает от меня кусочек за кусочком".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Так точно, Лорд-капитан. Процедуры омоложения в очередной раз обратили время вспять, и не спрашивайте, сколько именно иголок в меня воткнули наши хирургеоны. Однако я исцелился от старческих недугов... Ну, большей их части. Нельзя избегать смерть вечно — каждый раз она откусывает от меня кусочек за кусочком.
- guid: 2b2d7902-0f52-47a2-b496-794b2576fb9c
  event: Companions_Seneschal_39
  text: '"Вольные Торговцы, подобные вам, также являются слугами {g|Encyclopedia:Imperium}Империума{/g}. Они наделены особыми правами и полномочиями, обладают огромной властью на своих территориях и пользуются безоговорочным уважением в других частях Простора. Наиболее могущественные из них — Каллигос Винтерскейл и Инцендия Бастаал-Чорда. Будьте осторожнее при контакте с любым из них".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Вольные Торговцы, подобные вам, также являются слугами Империума. Они наделены особыми правами и полномочиями, обладают огромной властью на своих территориях и пользуются безоговорочным уважением в других частях Простора. Наиболее могущественные из них — Каллигос Винтерскейл и Инцендия Бастаал-Чорда. Будьте осторожнее при контакте с любым из них.
- guid: da75986c-0107-4f81-8e2a-fe75c1485143
  event: Companions_Seneschal_40
  text: '"Трагедия с кораблем флота Даргонуса лишь подтверждает мои опасения: Кунрад не оставил попыток навредить вам и, вероятно, завершить свою миссию. Мастер шепотов по-прежнему распоряжается инструментами, которые он создал своими руками и которые скрыты в глубинах протектората фон Валанциус. Любой ваш подданный может быть агентом Мастера шепотов, который действует в его интересах. Остерегайтесь, Лорд-капитан".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: 'Трагедия с кораблем флота Даргонуса лишь подтверждает мои опасения: Кунрад не оставил попыток навредить вам и, вероятно, завершить свою миссию. Мастер шепотов по-прежнему распоряжается инструментами, которые он создал своими руками и которые скрыты в глубинах протектората фон Валанциус. Любой ваш подданный может быть агентом Мастера шепотов, который действует в его интересах. Остерегайтесь, Лорд-капитан.'
- guid: b47ebc49-cf86-4a5d-bab3-5f31109d23b3
  event: Companions_Seneschal_41
  text: '"Благодарю за честь. Но вынужден отказаться. Я старый военный и верю в важность порядка во всем, в том числе — в субординации. Вы — Лорд-капитан, мой непосредственный командующий. Я не готов обращаться к вам никак иначе, кроме как с соблюдением полагающегося устава".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Благодарю за честь. Но вынужден отказаться. Я старый военный и верю в важность порядка во всем, в том числе — в субординации. Вы — Лорд-капитан, мой непосредственный командующий. Я не готов обращаться к вам никак иначе, кроме как с соблюдением полагающегося устава.
- guid: 547ed3da-44f2-45c8-a81d-b52e18d0dc80
  event: Companions_Seneschal_42
  text: '"Это тема для официального брифинга, а не обычной беседы, но я попробую ответить кратко — и, если позволите, своими словами". {n}Абеляр набирает в грудь воздуха и начинает.{/n} "{g|Encyclopedia:KoronusExpanse}Простор Коронус{/g} значительно удален от сердца Империума. Это значит, что здешние {g|Encyclopedia:Warp}варп{/g}-пути приходят в негодность за считанные месяцы, маршруты регулярно подвергаются нападениям разнообразного сброда, а в единственном крупном порту бок о бок швартуются пиратские посудины и имперские фрегаты".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Это тема для официального брифинга, а не обычной беседы, но я попробую ответить кратко — и, если позволите, своими словами.
