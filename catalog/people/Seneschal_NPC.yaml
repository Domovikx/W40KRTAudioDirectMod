    text_clean: В здравии и силах, Лорд-капитан! Осталось только найти выход — живым — из этой преисподней, вернуть вас на ваш корабль, и тогда на ваш вопрос я отвечу "великолепно"!
- guid: d74cc214-b3fa-4fbe-be07-3a2198b9c76b
  event: Companions_Seneschal_28
  text: '"Сожалею, но нет... если бы в нашем распоряжении был наш корабль и экипаж, мы могли бы оказаться в безопасности за его стенами, отправиться на разведку боем, в конце-концов сложить свои головы в битве с ксеносами, как то и подобает слугам {g|Encyclopedia:Emperor}Бога-Императора{/g}!.. Однако мы лишены наших обычных возможностей. Остается полагаться только на наше оружие и смекалку".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Сожалею, но нет... если бы в нашем распоряжении был наш корабль и экипаж, мы могли бы оказаться в безопасности за его стенами, отправиться на разведку боем, в конце-концов сложить свои головы в битве с ксеносами, как то и подобает слугам Бога-Императора!.. Однако мы лишены наших обычных возможностей. Остается полагаться только на наше оружие и смекалку.
