  event: Companions_Seneschal_44
  text: '"Я вдовец", {n}— чинно отвечает Абеляр.{/n} "Четырежды отец, и, если эти сведения еще не устарели — одиннадцатикратный дед. Моя семья живет на Даргонусе. Никто из детей не выказал рвения или способностей к корабельной службе, и я не стал настаивать, чтобы они шли по моим стопам".'
