  text: '{n}Абеляр порывается что-то сказать, но в последний момент останавливает себя. Морщинки на его лбу разглаживаются.{/n} "Я понимаю, Лорд-Капитан. Что ж, в таком случае — забудьте то, о чем я сказал. Мое место — подле Лорд-капитана, ибо таков мой долг сенешаля".'
