- guid: fd5b7400-9562-46b6-b168-0e25f5ee2b30
  event: Companions_Seneschal_55
  text: '"Лорд-капитан! Дозвольте еще раз изъявить свою благодарность за вашу помощь. Если бы не ваше вмешательство..." {n}Абеляр потрясенно качает головой.{/n} "...я мог бы лишиться всей своей семьи, казненной по ложному обвинению! Я и не представлял, насколько уязвимы Версерианы, когда я — сенешаль само{mf|го|й} Лорд-капитана — вдали от дома".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Лорд-капитан! Дозвольте еще раз изъявить свою благодарность за вашу помощь. Если бы не ваше вмешательство...
  - speaker: narrator
