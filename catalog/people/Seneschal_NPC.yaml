- guid: 42491e9b-cf0a-4496-91ec-0ca45a4e7bd6
  event: Companions_Seneschal_32
  text: '"Если вас так уж интересует это Богом-Императором проклятое место, то почему бы вам не спросить своего нового спутника?" {n}Абеляр смотрит на вас с едва скрываемым раздражением.{/n} "Ваше решение о том, чтобы присоединить его к своей свите, должно принести хотя бы какую-то пользу нашему положению".'
