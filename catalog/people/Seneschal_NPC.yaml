    text_clean: Абеляр медлит, ему явно неловко.
  - speaker: Seneschal (NPC)
    text_clean: Как патриарх семьи Версериан, я несу ответственность перед своей родной кровью. Да, мой долг — служить сенешалем Вольному Торговцу, и я ни в коей мере не намерен отступаться от этой роли, если я вас устраиваю так же, как устраивал Леди Теодору. Однако если бы у меня была возможность принять более деятельное участие в семейных делах и притом продолжать служить роду фон Валанциус...
- guid: dcf36b59-d40e-4127-b444-664930cef0d2
  event: Companions_Seneschal_51
  text: '{n}Тень печальной улыбки мелькает и сразу тает на лице сенешаля.{/n} "Для Вольного Торговца разумно иметь тайники, в которых можно сберечь важную информацию. И совершенно неразумно делиться их координатами даже с самыми приближенными лицами".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Тень печальной улыбки мелькает и сразу тает на лице сенешаля.
