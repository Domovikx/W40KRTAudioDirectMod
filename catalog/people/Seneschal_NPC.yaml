  event: ''
  text: '{n}Сенешаль ежится.{/n} "Чудовище из кошмара, столь жуткое, что мой разум отказывается удерживать в себе его образ. Мясо, металл и много игл... Оно меня ело. Саму мою душу! И съело бы целиком, если бы не насытилось прежде другой своей добычей".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Сенешаль ежится.
  - speaker: Seneschal (NPC)
    text_clean: Чудовище из кошмара, столь жуткое, что мой разум отказывается удерживать в себе его образ. Мясо, металл и много игл... Оно меня ело. Саму мою душу! И съело бы целиком, если бы не насытилось прежде другой своей добычей.
