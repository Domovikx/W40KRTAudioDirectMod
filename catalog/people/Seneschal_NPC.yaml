- guid: 2fe7132b-c9b4-4ed5-b5d6-b9a5b39a01a0
  event: ''
  text: '{n}Сенешаль едва заметно наклоняется к вам и говорит тихо — так, чтобы только вы могли слышать его.{/n} "Лорд-капитан, Гапраки — все или только некоторые — замешаны, но полагаю, что не они стоят за заговором против вас. Гален Гапрак мог быть лишь марионеткой в руках опытного кукловода. Именно его следует обличить, чтобы не допустить дальнейшего разрастания еретической заразы".'
  speaker: Seneschal (NPC)
