  text: '"Медикарии едва спасли вас — к счастью, один из лекарей вспомнил о давно законсервированной и забытой аугмент-станции. Благословение {g|Encyclopedia:Omnissiah}Омниссии{/g} спасло вам жизнь — часть внутренних органов пришлось заменить на {g|Encyclopedia:Augmentation}импланты{/g}. Хорошая новость — теперь мы располагаем функционирующей операционной для установки аугментаций любой сложности". {n}Сенешаль бормочет себе под нос.{/n} "Клянусь, иногда мне кажется, что отсеки на этом судне отрастают сами собой..."'
