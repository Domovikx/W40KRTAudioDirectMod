  - speaker: Seneschal (NPC)
    text_clean: Впрочем, мне от вас скрывать нечего. В последнее время рулевые все чаще сбиваются с курсов, а рапорты не перестают противоречить друг другу. Беспорядки не прекратились и после разжалований, так что я лично взялся провести расследование.
- guid: 6851643e-abe4-425a-b057-eeb651ff4044
  event: Companions_Seneschal_20
  text: '"Каково же было мое удивление, когда я обнаружил, что Леди-Навигатор лично правит записи в бортовом журнале, а офицеры хранят молчание по ее указу. Я немедля потребовал прекратить это безобразие и отчитал леди Кассию на глазах у офицеров. Она отреагировала на мои слова молчанием, а после быстро удалилась". {n}Абеляр глубоко вздыхает.{/n} "Не следовало мне этого делать. Я ведь даже не узнал, что ей двигало".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Каково же было мое удивление, когда я обнаружил, что Леди-Навигатор лично правит записи в бортовом журнале, а офицеры хранят молчание по ее указу. Я немедля потребовал прекратить это безобразие и отчитал леди Кассию на глазах у офицеров. Она отреагировала на мои слова молчанием, а после быстро удалилась.
  - speaker: narrator
