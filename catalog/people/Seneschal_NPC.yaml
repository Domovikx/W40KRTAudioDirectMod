  event: ''
  text: '{n}Сенешаль набирает полную грудь воздуха.{/n} "Пред вами {mf|Его|Ее} Светлость {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} {name} фон Валанциус, наследни{mf|к|ца} величайшего протектората {g|Encyclopedia:KoronusExpanse}Простора Коронус{/g} и держатель{mf||ница} священного {g|Encyclopedia:Warrant}Патента{/g}. Позвольте заметить, этикет Нобилите требует от его милости навигатора представиться первым, однако ввиду сложившихся на станции, кхм, обстоятельств, {mf|Его|Ее} Светлость Вольный Торговец готов{mf||а} закрыть на вашу враждебность глаза. Лишь в этот раз".'
