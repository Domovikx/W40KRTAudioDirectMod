- guid: c0fc3c14-b85c-4eac-a401-327f79541119
  event: Companions_Seneschal_36
  text: '{n}Абеляр медлит. Наконец, вздохнув, опускает голову.{/n} "Я... не видел ее, Лорд-капитан. Но иногда... иногда словно слышу ее смех на отдалении. Или как будто чувствую, что руки касаются — как она делала, когда пыталась отвлечь от горестных раздумий... Но я отличаю явь от миража. Боюсь, теперь придется просто научиться жить с этим призраком, который является только мне. Видением ушедшего".'
  speaker: Seneschal (NPC)
  parts:
  - speaker: narrator
    text_clean: Абеляр медлит. Наконец, вздохнув, опускает голову.
