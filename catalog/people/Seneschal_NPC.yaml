- guid: 5ce318dd-d937-4a96-a485-3d1930c30ca5
  event: Companions_Seneschal_26
  text: '"Боюсь, Лорд-капитан, без серьезного вмешательства опытного оздоровителя мне эту слабость не одолеть самому. Святый Трон, как же тяжело быть бессильным стариком! Всегда надеялся, что не доживу до дней, когда спина и руки будут отказывать, а вот же ж..."'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Боюсь, Лорд-капитан, без серьезного вмешательства опытного оздоровителя мне эту слабость не одолеть самому. Святый Трон, как же тяжело быть бессильным стариком! Всегда надеялся, что не доживу до дней, когда спина и руки будут отказывать, а вот же ж...
