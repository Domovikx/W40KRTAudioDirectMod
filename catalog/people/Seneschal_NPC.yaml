  event: ''
  text: '"Вы безумны. И {g|Encyclopedia:Grox}грокс{/g} знает, что еще выкините. Я не могу допустить, чтобы во время осады дворца по нему разгуливали сумасшедшие". {n}Сенешаль отточенным движением снимает с бедра лазпистолет.{/n}'
