- guid: b883abcb-301b-44e9-9fca-b1f2b918b221
  event: Companions_Seneschal_50
  text: '"Сказать вам по правде, Лорд-капитан, вся эта ситуация заставила меня задуматься..." {n}Абеляр медлит, ему явно неловко.{/n} "Как патриарх семьи Версериан, я несу ответственность перед своей родной кровью. Да, мой долг — служить сенешалем Вольному Торговцу, и я ни в коей мере не намерен отступаться от этой роли, если я вас устраиваю так же, как устраивал Леди Теодору. Однако если бы у меня {d|Encyclopedia:CompAbelard_Q1_NewWays}была возможность{/d} принять более деятельное участие в семейных делах и притом продолжать служить роду фон Валанциус..."'
  speaker: Seneschal (NPC)
  parts:
  - speaker: Seneschal (NPC)
    text_clean: Сказать вам по правде, Лорд-капитан, вся эта ситуация заставила меня задуматься...
