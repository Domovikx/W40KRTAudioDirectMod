name: Кассия Орселлио
gender: F
role: Навигатор
age: ''
personality: ранимая, застенчивая, аристократичная
sound_keys:
- Cassia
- Navigator
total_phrases: 440
phrases:
- guid: 548fb8da-9cdc-4efe-80fe-13530175e1d0
  event: BNTRS_AreaPeaceful_Cassia_2
  text: '"Цвета этого места полнятся вспышками боли — ярко-алыми, багрово-черными, предсмертно-серыми... калейдоскоп отчаяния
    и безумия..."'
  speaker: null
- guid: 25594892-aefb-4e33-b4df-e580fca3763c
  event: BNTRS_AreaPeaceful_Cassia_7
  text: '"Темно-зеленое, мрачное и душное заполнило все вокруг густым туманом... Те, кто здесь, вымотаны, истощены, растеряны".'
  speaker: null
- guid: 91325592-fa75-45f4-b73f-fdba54572720
  event: BNTRS_AreaStressful_Cassia_115
  text: '"Я... тоже чувствую, как что-то приближается. Но не вижу цветов. Весь мир поблек, как только мы ступили на эту палубу".'
  speaker: null
- guid: e5d3bb8f-6239-4722-a83a-8a2c61798cf1
  event: BNTRS_AreaStressful_Cassia_134
  text: '"Я... я готова, Арджента. Пока тут ты и Лорд-капитан — я готова на многое".'
  speaker: null
- guid: 1aedaeea-9f8a-4dfd-bf27-5b37c9c8760b
  event: BNTRS_AreaStressful_Cassia_144
  text: '"Я уверена, что судно для столь важной персоны, как Лорд-капитан, дожидается нас на положенном месте. Разве чернь
    не должна знать свое место в очереди на спасение?"'
  speaker: null
- guid: ccc5c772-f321-4255-9b1a-24109f62b936
  event: BNTRS_AreaStressful_Cassia_158
  text: '"Сколько праведных слуг Империума пали здесь от орудия, призванного служить им в борьбе с неверными? Сбиты в полете,
    без возможности защититься, исполнить свою миссию..."'
  speaker: null
- guid: 672542f8-1b1c-46f6-88bd-6f7d5e5311a3
  event: BNTRS_AreaStressful_Cassia_16
  text: '"Дядя учил меня, что нужно во всем быть первым. Глядя на Вольного Торговца... теперь я в этом сомневаюсь".'
  speaker: null
- guid: ce55ae37-de72-4167-abbe-2447807a1599
  event: BNTRS_AreaStressful_Cassia_24
  text: '"Вы правы, сестра. Море Душ способно потопить даже самых умелых пустотников, ибо нет обманчивей ощущения, чем обузданный
    варп".'
  speaker: null
- guid: de996b7f-392c-4ba6-b9fb-5c1fce177015
  event: BNTRS_AreaStressful_Cassia_3
  text: '"Давно я не видела столь умиротворенной картины — ни яркого всплеска, ни пестрых красок... Лишь чистое, белое полотно".'
  speaker: null
- guid: b42f8525-37eb-4eb0-8e23-a8ed13b048c5
  event: BNTRS_AreaStressful_Cassia_41
  text: '"Как здесь... пестро. В воздухе витают все оттенки, какие только можно вообразить!"'
  speaker: null
- guid: 5f7b4e88-2599-4d60-a19a-23941e273322
  event: BNTRS_AreaStressful_Cassia_54
  text: '"Твои слова окутаны едкой зеленой дымкой, но сквозь нее пробивается теплый желтый свет... Ты правда ему рада, да?"'
  speaker: null
- guid: 1865ed1c-6a88-4f63-8b10-097dfba616cc
  event: BNTRS_AreaStressful_Cassia_58
  text: '"Почему твои воспоминания об этом такие синие? И чем дальше — тем темнее и темнее..."'
  speaker: null
- guid: 36c2cb53-ef8d-4a96-8617-b7d169599fa3
  event: BNTRS_AreaStressful_Cassia_65
  text: '"Твои чувства не обманывают тебя: я зрю оттенки падали и смерти в огненных всполохах мануфакторума. Этот огромный
    пласталевый зверь гниет заживо".'
  speaker: null
- guid: 14537744-b2a5-4d2c-b091-ca4426de5a0f
  event: BNTRS_AreaStressful_Cassia_71
  text: '"Я тоже это чувствую! Обычно машины источают едва различимые цвета... Прямо как ваше тело, магос. Но в этом месте...
    все оттенки смешались в грязь".'
  speaker: null
- guid: 1f211b26-8cea-461a-93c4-74d333e3bb0f
  event: BNTRS_AreaStressful_Cassia_76
  text: '"Ваш разум окутала сизая дымка, мастер ван Калокс. Тяжелый цвет... для тяжелых дум, полагаю?"'
  speaker: null
- guid: 9df039f4-a1fb-420a-818c-5c3aee706b10
  event: BNTRS_AreaStressful_Cassia_79
  text: '"Соглашусь с господином Версерианом. Это место напоминает технические отсеки Эурак-V — все цвета такие... грязные".'
  speaker: null
- guid: 6df26699-a4cf-484c-be7d-9362c0fea681
  event: BNTRS_AreaStressful_Cassia_8
  text: '"Твои краски столь ярки, сестра Арджента. Ненависть, питающая твои слова и порывы, пылает заревом сверхновой!"'
  speaker: null
- guid: cc72d879-7998-4ca8-b5f6-890b17d6fabd
  event: BNTRS_AreaStressful_Cassia_89
  text: '"Я видела Райкади Филию лишь на расстоянии, когда мне удавалось попасть в обсерваторию. Как странно оказаться здесь
    самой!"'
  speaker: null
- guid: 394d5050-809b-4f05-a695-de925bb168af
  event: BNTRS_AreaStressful_Cassia_90
  text: '"Столько зелени я не видела даже в нашем арборетуме... О, этот цветок! Я читала о нем в одном из трудов генетора
    Канассиана".'
  speaker: null
- guid: 371d1222-9afb-4d80-8966-2bdf20fbba14
  event: BNTRS_AreaStressful_Cassia_96
  text: '"Какое роскошное поместье! В архивах Дома я видела пикты наших старинных усадеб — это место очень на них похоже".'
  speaker: null
- guid: 529b8a66-2c5a-4b3b-a82a-e67e4c2e8f96
  event: BNTRS_Chapter1_Cassia_05
  text: '"Твои речи сияют золотом и янтарем, сестра. Когда-нибудь я научусь веровать в правоту своих слов с той же силой,
    что и ты".'
  speaker: null
- guid: 4b5a451c-010d-4ea3-9a9d-985f98958a1f
  event: BNTRS_Chapter1_Cassia_07
  text: '"Господин Винтерскейл так верил в своего друга, что добровольно ринулся навстречу опасности! Это... благородный поступок".'
  speaker: null
- guid: f24ac15c-03ad-46b4-b909-05e08bc09ffb
  event: BNTRS_Chapter1_Cassia_16
  text: '"Если бы каждый был наделен даром зрить мир как я, подобное бы никогда не случилось. Но глаза обычных людей слепы
    к оттенкам, что скрываются в чужих душах".'
  speaker: null
- guid: 26229c9b-3a23-4a20-98b9-f25fc5093ae5
  event: BNTRS_Chapter1_Cassia_18
  text: '"Я впервые за пределами станции... здесь столь... ярко? Вместо палитры — ужасная мазня цветов".'
  speaker: null
- guid: 13a425ee-570a-49cf-af06-dcd24cbbf027
  event: BNTRS_Chapter1_Cassia_21
  text: '"Вам не кажется, что свита Вольного Торговца должна быть больше? Где почетная гвардия? Герольды и глашатаи?"'
  speaker: null
- guid: ef92356a-e1be-4764-91da-2ec8b15db479
  event: BNTRS_Chapter1_Cassia_25
  text: '"Я исполню долг, к которому меня готовили все эти годы. Пускай мое становление... и прошло при багровых тонах".'
  speaker: null
- guid: 08ce1dd3-0726-4b69-ac9a-09473498e2e5
  event: BNTRS_Chapter1_Cassia_28
  text: '"Станцию можно воздвигнуть снова. Слуги... заменимы. И лишь моя жизнь — главное для тех, кто ждет моего возвращения...
    И тех, кто жаждет меня убить".'
  speaker: null
- guid: 5f21123b-6011-4607-a68b-d17ace412396
  event: BNTRS_Chapter1_Cassia_32
  text: '"Цвета... я никогда не видела таких цветов... Они меняются, перетекают друг в друга... Ах! Выжигают... сетчатку..."'
  speaker: null
- guid: 420f1e20-2fd4-4620-b727-6b5c1475d0b8
  event: BNTRS_Chapter1_Cassia_43
  text: '"Я... не против сопровождать Лорд-капитана. Познание внешнего мира — бесценный опыт, которого лишены те из нас, кто
    страшится покинуть стены Навис Санктум".'
  speaker: null
- guid: 8d9ee5aa-8aab-4067-acd2-6170ba15c092
  event: BNTRS_Chapter1_Cassia_53
  text: '"С вашим появлением цвета вокруг полнятся сталью и всполохами алых лент, почтенный магос. На станции моего Дома тоже
    были техножрецы, но цвета их душ... всегда оставались угрюмы".'
  speaker: null
- guid: 6e9fc427-8167-48b1-9665-9069b123c478
  event: BNTRS_Chapter2_Cassia_01
  text: '"Вас окружают невыносимо тяжелые цвета, мастер ван Калокс... Словно их зачерпнули из глубокого забытого колодца.
    Это... из-за Черного корабля, так ведь?"'
  speaker: null
- guid: 7875df7a-df75-4d3f-8a36-70ac823110c2
  event: BNTRS_Chapter2_Cassia_101
  text: '"Вы говорите о том, что происходило на Кьяве Гамма, почтенный магос? Я читала о подобном... Но читать и узреть собственными
    глазами — очень разные вещи".'
  speaker: null
- guid: 2e2448fd-eb89-4f6a-a128-82b832f9c53b
  event: BNTRS_Chapter2_Cassia_108
  text: '"Когда по кораблю блуждали слухи о появлении Теодоры фон Валанциус... Я видела множество всполохов желтого. Ваши
    люди надеялись, что это правда".'
  speaker: null
- guid: 54e0ffb7-1995-4201-8ecb-d936369527ed
  event: BNTRS_Chapter2_Cassia_11
  text: '"Вся моя жизнь за секунды сгинула в кошмаре Имматериума. Это... не то, что возможно осознать и принять за столь короткое
    время".'
  speaker: null
- guid: 6a2fe814-aff8-4d43-a99e-b0b014cb482d
  event: BNTRS_Chapter2_Cassia_115
  text: '"Может быть, в момент смерти она обрекла покой, которого была лишена при жизни. По крайней мере, мне хотелось бы
    в это верить".'
  speaker: null
- guid: 23cf8eda-d85a-4acb-aa5d-9b6a67f6907d
  event: BNTRS_Chapter2_Cassia_117
  text: '"С тех пор, как Идиры не стало, я вижу, как угасают цвета на палубах. Меньше оттенков, от которых болят глаза...
    Но и больше серого безразличия".'
  speaker: null
- guid: d1a271b4-9b2c-4237-b957-91e2866bb275
  event: BNTRS_Chapter2_Cassia_128
  text: '"Служители Адептус Администратум такие... блеклые. Словно сама жизнь во всей ее яркости и великолепии покинула их
    сердца".'
  speaker: null
- guid: e94bebba-3e55-4939-900b-628b035369dd
  event: BNTRS_Chapter2_Cassia_144
  text: '"Мастер ван Калокс, ваше молчание сочится темно-багровым. Вы можете скрыть свою ярость от иных взоров, но не моего".'
  speaker: null
- guid: 6377a535-3e5d-4e61-8621-81b867970129
  event: BNTRS_Chapter2_Cassia_17
  text: '"Но то, что случилось на улицах ульев... О, багрово-сизые шрамы еще нескоро сотрутся с душ тех, кто пережил сей кошмар".'
  speaker: null
- guid: c5a4e747-9001-459a-b2f6-159f5a1a0448
  event: BNTRS_Chapter2_Cassia_24
  text: '"Навигатор Ханн — благородная душа. Страшно представить, какому испытанию подвергся его дух в том злополучном странствии...
    И все же он исполнил свой долг".'
  speaker: null
- guid: 9de5eaf0-f1a3-451f-9700-9567b57f3a90
  event: BNTRS_Chapter2_Cassia_31
  text: '"Величественное зрелище. Словно огромной кистью все цвета мира смазали с холста реальности".'
  speaker: null
- guid: 2e5a05e7-c40f-4798-b044-c927dd949704
  event: BNTRS_Chapter2_Cassia_35
  text: '"Во мне тлела надежда, что Эурак-V еще можно спасти... Однако теперь мой дом потерян. Навсегда".'
  speaker: null
- guid: ad97a2e4-202a-4b83-b681-e61048cc5215
  event: BNTRS_Chapter2_Cassia_48
  text: '"Печально, что прекрасный и изобильный Янус одолевали столь тяжкие беды. Сей мир... очень красив".'
  speaker: null
- guid: 6e60fcbb-51a3-44db-8a3b-bc6ccc2a8170
  event: BNTRS_Chapter2_Cassia_63
  text: '"Те существа, что обретались на "Йесевоне"... Никогда не слышала об подобных ксеносах. Их психическая тень в варпе...
    просто чудовищна".'
  speaker: null
- guid: 608d1271-5560-4dd6-ad31-1735cd7baa4f
  event: BNTRS_Chapter2_Cassia_74
  text: '"Эмоции, искаженные влиянием варпа, едки и омерзительны на вид. Архивраг нарочно извращает цвета, делает их невыносимыми...
    для тех, кто еще не погряз в скверне".'
  speaker: null
- guid: be7b60e8-d2bf-424c-8cba-76b004d2682d
  event: BNTRS_Chapter2_Cassia_79
  text: '"Твоя решимость сияет всеми оттенками золота, сестра! Такие пламенные слова и столь истовая вера в них... Что невозможно
    смотреть, не щурясь".'
  speaker: null
- guid: 7c26649b-a186-401a-979b-0a659bed5049
  event: BNTRS_Chapter2_Cassia_85
  text: '"Дом Орселлио... доставил излишние хлопоты Лорд-капитану. Продолжая служить на флагмане фон Валанциус, я искуплю
    сею досадную ошибку".'
  speaker: null
- guid: d42726dd-e7ed-4ddd-95ca-c7309bf7103c
  event: BNTRS_Chapter2_Cassia_87
  text: '"Меня гнетут мысли о будущем Дома Орселлио. Ненависть и недоверие, копившиеся годами... вновь и вновь приводят к
    кровопролитию".'
  speaker: null
- guid: aa629ba5-a26d-4dec-9a46-55ea9ea73e32
  event: BNTRS_Chapter3_Cassia_08
  text: '"Ваши искренние облегчение и радость — словно яркая картина в этом ужасном месте, отрада для моих очей. Я тоже...
    тоже счастлива видеть вас, Абеляр".'
  speaker: null
- guid: 0d7d1c85-5eba-466d-92c0-4a1aae5cee7a
  event: BNTRS_Chapter3_Cassia_103
  text: '"Вы прошли через многое, почтенный магос — и все же калейдоскоп ваших цветов ярок и пестр. Подобно разбитому витражу..."'
  speaker: null
- guid: cf7ca10d-a1f3-4074-b10e-ec1d72d89500
  event: BNTRS_Chapter3_Cassia_108
  text: '"Раз мы убили воинов, что почитались на арене... нас должны бояться. Но почему я чувствую багровый кровожадности
    вокруг нас?"'
  speaker: null
- guid: 5824d55c-6abc-40a2-928e-7036c12195a4
  event: BNTRS_Chapter3_Cassia_114
  text: '"Этот пестрый ксенос... его цвета отличаются от цветов его сородичей. Они словно... вывернуты наизнанку".'
  speaker: null
- guid: 9889437b-1d3f-46ec-82a3-4718971ffa83
  event: BNTRS_Chapter3_Cassia_131
  text: '"Твои цвета, и без того пронзительные, словно сошли с ума... Разве ты не боялась, что буря в сердце способна поглотить
    тебя без остатка?"'
  speaker: null
- guid: 864e2aa3-2fb4-48a8-b67a-5102c766abce
  event: BNTRS_Chapter3_Cassia_137
  text: '"Не думаю, что ее вела ненависть к людям. Раньше мне было сложно разобрать цвета ксеносов, но теперь... я понимаю.
    Ирлиэт душило отчаяние".'
  speaker: null
- guid: dab89026-2040-480a-b9fc-aaf40ded564f
  event: BNTRS_Chapter3_Cassia_15
  text: '"Ахиллеасом правит багровое и сизое... Неужели ваше порицание настолько сломило его?"'
  speaker: null
- guid: cd24df07-870e-4d5a-aea7-826fb581d532
  event: BNTRS_Chapter3_Cassia_25
  text: '"Каждый из нас стал жертвой сей бездны. Цвета каждого... были нарушены. Загрязнены. Мы оставили здесь куда больше,
    чем кровь и плоть".'
  speaker: null
- guid: 5475e379-1ff2-445e-a1fb-5ae6a26fbb10
  event: BNTRS_Chapter3_Cassia_31
  text: '"Да, я вижу. Где была круговерть цветов, теперь единство. Но разве тебя это не пугает? Ты как будто уже не картина,
    а просто... росчерк кисти".'
  speaker: null
- guid: 2ff7fa96-7c8f-4005-b501-bd6c292f7cc2
  event: BNTRS_Chapter3_Cassia_43
  text: '"Почти... сломило. Если бы не Вольный Торговец, я наверняка бы сошла с ума".'
  speaker: null
- guid: ae269507-9ec6-4c6b-be1d-0c69ec42ce6e
  event: BNTRS_Chapter3_Cassia_44
  text: '"Я так хочу снова увидеть настоящее солнце! Эти отвратительные, болезненные светила над головой мутят мне разум..."'
  speaker: null
- guid: 138120cc-5d41-4dc0-9628-64e5777c38b2
  event: BNTRS_Chapter3_Cassia_47
  text: '"Неужели даже в этом месте я не заслуживаю вашей правды, Мастер ван Калокс? Я же вижу... каждый всполох алого, возникающий
    при ваших движениях".'
  speaker: null
- guid: 8ac2ca7c-3b75-417b-ade4-fd56d9a829ee
  event: BNTRS_Chapter3_Cassia_48
  text: '"Твое поведение — и цвета — изменились. Стали чище... честнее".'
  speaker: null
- guid: c0cf4817-b68b-43f4-ba43-44ec60e3aaba
  event: BNTRS_Chapter3_Cassia_63
  text: '"Не кутайся в синее, Идира. Каждому из нас выпали свои испытания, с которыми мы... мы боролись как могли".'
  speaker: null
- guid: d4f5fc0a-f7f7-4741-a5f3-b6745075e69e
  event: BNTRS_Chapter3_Cassia_67
  text: '"В какой-то мере. Отверзая навигаторское око, я расчищу дорогу от тех, кто попытается нас остановить".'
  speaker: null
- guid: c41509b3-0389-41e3-9ac5-43583f956cf3
  event: BNTRS_Chapter3_Cassia_74
  text: '"Я все еще вспоминаю церемонию Магнэ Ацессио... Великолепное торжество, но столь много фальшивых цветов..."'
  speaker: null
- guid: 9c583949-6439-4e12-a02b-31fbfa0f63f9
  event: BNTRS_Chapter4_Cassia_09
  text: '"Сколько их уцелевших собратьев еще бродит во мраке средь звезд?.. Кораблям Человечества нужно опасаться возмездия
    тех, кто отчаялся выжить".'
  speaker: null
- guid: e0e4299e-53e5-43fc-bed0-11f3eb33e16e
  event: BNTRS_Chapter4_Cassia_100
  text: '"Я верю, ты не оставишь ни единого пятна на лике Простора. Серебристое сияние твоей души выжигает скверну дотла подобно
    звезде, рассекающей тьму!"'
  speaker: null
- guid: 09da45ea-22d6-4954-9602-d4d7405914fa
  event: BNTRS_Chapter4_Cassia_105
  text: '"Наконец... тайна Атласа раскрыта. То, что я столько лет носила в своей груди, получило свое объяснение... как и
    мои особые силы".'
  speaker: null
- guid: 48d72c52-3755-452e-ab4d-b9510a32aa5e
  event: BNTRS_Chapter4_Cassia_109
  text: '"Тисифона сделала все, чтобы Дом служил Богу-Императору и направлял Человечество во тьме средь звезд. Эта цель в
    ее глазах... оправдывала любые жертвы — и среди ксеносов, и среди ее же подчиненных".'
  speaker: null
- guid: a721b129-6562-4dfb-903a-1dcc9be385ab
  event: BNTRS_Chapter4_Cassia_111
  text: '"Арлекины — пугающие создания. Я не могу разобрать в пестрой мешанине их цветов истинных оттенков — словно все их
    существование есть одна затянувшаяся шутка".'
  speaker: null
- guid: f48fc16c-ce02-48ff-85f9-58c63a1d070e
  event: BNTRS_Chapter4_Cassia_129
  text: '"В штормах варпа мы полагаемся на свет Бога-Императора. Нечестивым ксеносам не дано понять, что значит истинная вера".'
  speaker: null
- guid: 10be5407-daba-4e84-adb9-e11445739322
  event: BNTRS_Chapter4_Cassia_153
  text: '"Краски в твой душе изменились. Они буйствуют водоворотом многоцветий... Притягательно и жутко одновременно".'
  speaker: null
- guid: 9f4dd9c3-d019-4aeb-8f3f-241f540b567d
  event: BNTRS_Chapter4_Cassia_18
  text: '"Ваши цвета поблекли, почтенный магос. Скрепите сердце — в вас достаточно сил, чтобы пережить и эту утрату".'
  speaker: null
- guid: 600ddd5c-6cfd-4be9-bee6-92d6e6d2f9f8
  event: BNTRS_Chapter4_Cassia_33
  text: '"Футфол потряс меня в тот день, когда я впервые ступила на него... И вновь ошеломил преображенным. Отчего приведение
    к благочестию... так пугает?"'
  speaker: null
- guid: cf4a8126-f28b-4b19-8242-c48995d6ad50
  event: BNTRS_Chapter4_Cassia_49
  text: '"Отчего гемункул устроил себе логово посреди лесов Кетца Темера? Разве друкари не боятся реального мира?"'
  speaker: null
- guid: 8aa9aba2-e7b1-43e2-a46f-da5b4e823515
  event: BNTRS_Chapter4_Cassia_61
  text: '"Не понимаю. Почему некоторые спутники предпочли покинуть Вольного Торговца? Мы... что-то делаем не так?"'
  speaker: null
- guid: 04b785d8-6e4b-4699-bf60-8988dea64f40
  event: BNTRS_Chapter4_Cassia_64
  text: '"Возможно, вам бы присутствие там было бы нипочем, могучий Ульфар. Но я бы, скорее всего, лишилась бы собственных
    очей при взгляде на бушующие там цвета..."'
  speaker: null
- guid: d32decec-582a-4f58-824d-6a2ecd4376da
  event: BNTRS_Chapter4_Cassia_75
  text: '"Обезглавлена династия Вольных Торговцев... Кто же придет на смену Каллигосу Винтерскейлу?"'
  speaker: null
- guid: 5f8ecb32-f81c-4291-a682-032a8ecfafcf
  event: BNTRS_Chapter4_Cassia_95
  text: '"Ваши слова... окружают грязные цвета, Абеляр. Не позволяйте чужому яду отравить свою душу — на вас это совсем не
    похоже".'
  speaker: null
- guid: 7f9a2d4e-237f-4173-b9c6-57594b3ce614
  event: BNTRS_Chapter4_Cassia_98
  text: '"Тебя словно окутывает невесомое серебристое облако, сестра. В его объятиях... и я чувствую умиротворение".'
  speaker: null
- guid: 7b1a5dc0-a029-49c3-92d1-624627b048f1
  event: BNTRS_Chapter5_Cassia_06
  text: '"Здесь почти нет цветов, только чернильный мрак... Это плохое место. В нем много смерти".'
  speaker: null
- guid: 1eef6380-97c0-4009-a81d-ab8d9fa6023f
  event: BNTRS_Companion_DLC3_Cassia_31
  text: '"Средоточие болезненного ржавого в вашей ауре... это вина, генетор. И горечь этой вины разъедает мои глаза, против
    воли навлекая на них слезы".'
  speaker: null
- guid: f40ecd0f-b370-4cc4-a234-df94d0a0074a
  event: BNTRS_Companion_DLC3_Cassia_54
  text: '"Ох... благодарю! Признаться, я тоже наблюдала за вами в библиотеке — не ожидала, что техножрец вашего сана будет
    интересоваться мирской литературой. Я была бы рада обменяться с вами рекомендациями и обсудить прочитанное".'
  speaker: null
- guid: 25371d19-8e57-4ea1-b4d0-fbc97083cb70
  event: BNTRS_Companion_DLC3_Cassia_72
  text: '"Благодарю, генетор Фебрус. Я больше волнуюсь о вас — на части было разделено не только ваше тело, но и цвета...
    Они иные, словно что-то надломилось и никак не соберется вновь".'
  speaker: null
- guid: 229800ed-8f97-429e-9999-daf6a90af33a
  event: BNTRS_DLC2_Cassia_05
  text: '"Проктор, слуги доставили в мои покои три дюжины кодексов с законами разных миров Простора Коронус... Я не вполне
    понимаю, что значит этот ваш жест".'
  speaker: null
- guid: fb500a2b-b9e3-4f7a-ba5a-77b1cc784109
  event: BNTRS_DLC2_Cassia_101
  text: '"Меня должным образом готовили к тому, чтобы выносить решения в спорных ситуациях. Но этот суд... был бы настоящим
    вызовом. Не только для меня, но и для моего покойного наставника Теобальда".'
  speaker: null
- guid: 0fa20782-2ed2-48f5-beb3-5c2cf56f846e
  event: BNTRS_DLC2_Cassia_113
  text: '"Мне всегда казалось, что у слуг Администратума чернильные сердца и их не волнует власть. Однако им не чужды интриги
    знати".'
  speaker: null
- guid: 674d046b-7628-46bb-8fbe-4793715da2e1
  event: BNTRS_DLC2_Cassia_114
  text: '"Кто же теперь станет новым маршалом Простора? Полагаю, после боя в суде кандидатов осталось не так много..."'
  speaker: null
- guid: 5dad1b02-6354-4059-abb2-794a6cb0f72c
  event: BNTRS_DLC2_Cassia_130
  text: '"Цвета проктора всегда были непреклонны. Он не смог бы жить, если бы смешал свои оттенки с серостью".'
  speaker: null
- guid: e3133cb7-3f37-459b-8567-e35e515f6737
  event: BNTRS_DLC2_Cassia_149
  text: '"В библиотеке Лорд-капитана я нашла мемуары величайшего квартермейстера династии фон Валанциус — Сильверто де Йоно.
    Его хитроумные тактики помогут нам при абордаже".'
  speaker: null
- guid: 2e8ba89e-0668-441c-b161-1617e97e115a
  event: BNTRS_DLC2_Cassia_159
  text: '"В детстве я зачитывалась летописями феодального мира Эрбенн-II. Рыцари в сияющих доспехах верхом на дивных скакунах
    сражались с врагами человечества, а потом пировали... Но на этом мире только серость. И грязь".'
  speaker: null
- guid: 95981eeb-9011-4329-a14b-43f7a64c91fd
  event: BNTRS_DLC2_Cassia_163
  text: '"Вот как действуют слуги закона? Такая слаженность, такое обилие алого и золотого..."'
  speaker: null
- guid: 3d0f1e22-edce-4568-9b05-2caba7d9f466
  event: BNTRS_DLC2_Cassia_173
  text: '"Все здесь сочится бледно-зеленым. Этот оттенок... душит, словно цепь, стиснувшая горло".'
  speaker: null
- guid: 80814619-324a-4c26-b8fa-3b4925262237
  event: BNTRS_DLC2_Cassia_205
  text: '"Ваши оттенки мрачнеют, проктор. В следующий раз нам стоит задержаться на планете вроде Януса. Богатая флора агромира
    способна тронуть даже ваше... чувство прекрасного".'
  speaker: null
- guid: c84f7066-416f-4354-83c1-bcbf70bb032a
  event: BNTRS_DLC2_Cassia_24
  text: '"Ваши цвета наливаются свинцом, когда вы рассуждаете о картинах. Не утруждайтесь, проктор. Искусство просто... не
    для вас".'
  speaker: null
- guid: 4065c3f0-536a-423b-be12-a467e21cb6f2
  event: BNTRS_DLC2_Cassia_242
  text: '"С первой встречи вы считали меня слабой, хрупкой... Что ж, проктор. Вы ошиблись".'
  speaker: null
- guid: d4570d77-d852-40d2-8500-f87c7e78f161
  event: BNTRS_DLC2_Cassia_289
  text: '"Оставьте его, сенешаль. Цвета господина проктора... Ему и так тяжело".'
  speaker: null
- guid: 7e6b49f1-a684-454b-8289-c4e5c0635ee5
  event: BNTRS_DLC2_Cassia_298
  text: '"Ирлиэт для Лорда-капитана не привычка и не ошибка. А нечто... большее. Не думаю, что мы сможем когда-нибудь их понять".'
  speaker: null
- guid: 1ea6c45d-4df1-42b9-9fd0-31f0b596564d
  event: BNTRS_DLC2_Cassia_63
  text: '"Ошибка маршала привела к падению всех Арбитес в Коронусе. Как глава Дома, я извлеку урок из этой истории".'
  speaker: null
- guid: 477568e4-74d7-4735-b92c-97cfaa47e046
  event: BNTRS_DLC2_Cassia_71
  text: '""Бессердечный" пылал всеми оттенками ужаса при попытке броситься в Имматериум... Наш триумф стоил дорого. Это...
    важный урок".'
  speaker: null
- guid: f1b62886-64ef-4a40-813d-52792a9805e4
  event: BNTRS_DLC2_Cassia_78
  text: '"Я мечтала побывать на феодальном мире, сошедшем со страниц героических летописей. Но теперь... я мечтаю поскорее
    забыть об этом месте".'
  speaker: null
- guid: fac6226f-38d4-43c6-88e5-29288935ac34
  event: BNTRS_DLC2_Cassia_84
  text: '"Не верится, что губернатор Тассеры так легко обманул своих подданных. Неужели манеры подставного правителя не вызвали
    подозрений?"'
  speaker: null
- guid: eafd0e99-5814-4f98-ad65-4362e0c49332
  event: BNTRS_DLC3_Cassia_02
  text: '"Эти цвета поразительно напоминают переливы, которые я встречала у некоторых хищников. Только ярче и страннее. Они
    будто... заманивают нас ближе".'
  speaker: null
- guid: 2558327b-31a7-43bc-9d27-ab7e3ca5632e
  event: BNTRS_DLC3_Cassia_131
  text: '"Это место обманчиво. За прозрачными белыми мазками прячутся всполохи чего-то огромного, опасного и хищного. Здесь...
    не по себе".'
  speaker: null
- guid: 70fa58b8-c17d-4cce-92c4-7633b930faec
  event: BNTRS_DLC3_Cassia_22
  text: '"О нет, эти вещи не мертвы. Каждая из них окружена слабыми отголосками цветов, как своих собственных, так и привнесенных
    кем-то... кто был до. Все они несут в себе истории, частью которых являются, и все они были дороги кому-то, не сейчас
    и не здесь".'
  speaker: null
- guid: ce776d72-fbb4-4f3e-8798-f6253bc3816d
  event: BNTRS_DLC3_Cassia_32
  text: '"Очень примечательная подборка геральдических символов и родовых артефактов священных династий. Интересно, как давно
    реликвии... хранятся в этом странном месте".'
  speaker: null
- guid: 32dc15e1-57d7-4cc8-a38d-d26e65f374b2
  event: BNTRS_DLC3_Cassia_64
  text: '"Краски этого места столь ярки и монохромны, что слепят мне глаза. Прошу вас, давайте не будем задерживаться!"'
  speaker: null
- guid: e6ccdf24-c3a1-4b27-8e2c-ff31a81f1fae
  event: BNTRS_DLC3_Cassia_71
  text: '"Алые краски сменяются черными, глубокими, точно бездонный провал. То, что говорит Ирлиэт... поразительно точное
    описание того, что вижу я".'
  speaker: null
- guid: 849d4ac5-3852-44bd-b9fc-08557d2f6236
  event: BNTRS_DLC3_Cassia_78
  text: '"Я... а... Джай, о ком же... ахем. Не думаю, что опускаться до прозрачных уничижительных намеков достойно свиты Лорд-капитана!"'
  speaker: null
- guid: 4cbaec8e-60dd-437d-97b7-aed213f40742
  event: BNTRS_DLC3_Cassia_79
  text: '"Здесь стало люднее. И запах крови... Ах, прошу прощения, мне немного дурно".'
  speaker: null
- guid: 9710e948-3e6f-4672-b638-75e6afee53be
  event: BNTRS_PickUps_Cassia_05
  text: '"Багрянец и золото пылают в твоей душе кровавым закатом. Но остальные краски... выцвели".'
  speaker: null
- guid: 81bce542-fe6e-4e85-b305-f4336bad3d60
  event: BNTRS_PickUps_Cassia_111
  text: '"Твое присутствие расплескало по душам астропатов мириады оттенков ужаса... Нам не стоит задерживаться".'
  speaker: null
- guid: 5da700df-b861-4ac0-b455-799c8fac8d00
  event: BNTRS_PickUps_Cassia_112
  text: '"Как необычно. Для меня Имматериум состоит из цветов, но для астропатов, обитающих в этой капелле, он — музыка".'
  speaker: null
- guid: b719867c-732b-456f-ba7f-8a1edd2ea180
  event: BNTRS_PickUps_Cassia_140
  text: '"Нам правда... необходимо здесь находиться? Я не уверена от чего меня больше мутит, от этих ужасных цветов или запаха..."'
  speaker: null
- guid: 969a907b-b39d-42b4-afb1-8c950689dbc6
  event: BNTRS_PickUps_Cassia_144
  text: '"Алый, черный, синий и серый... Все смешалось в уродливый грязный вихрь. Ярость и отчаяние отравили отсек".'
  speaker: null
- guid: c9da5f72-7e11-463f-a478-356d385c7709
  event: BNTRS_PickUps_Cassia_157
  text: '"Стоит закрыть глаза, и безумные цвета поглощенного ересью мира жгут веки. Ужасное зрелище".'
  speaker: null
- guid: dbb0400f-8f09-4737-bfdf-0cd6cf454468
  event: BNTRS_PickUps_Cassia_160
  text: '"Столь дерзкое суждение о вышестоящем из уст простолюдин... Прошу прощения, я хотела сказать, что поражена смелостью
    вашей мысли".'
  speaker: null
- guid: f6927473-50b3-4827-8aca-051e9ad61c49
  event: BNTRS_PickUps_Cassia_173
  text: '"Я... буду считать это сочувствием, а не угрозой".'
  speaker: null
- guid: 1081238b-ef3b-44e7-9705-a1a38d1642de
  event: BNTRS_PickUps_Cassia_208
  text: '"Преподобный Иеробор писал, что "С каждого спросится по силам его, каждому воздастся по заслугам его". Мне страшно
    представить даже ее воздаяние".'
  speaker: null
- guid: b962ccf5-a37f-4617-ba60-3600b6b5c8c1
  event: BNTRS_PickUps_Cassia_22
  text: '"Среди бесконечного ужаса Океана Душ далекий свет Его подобен… пылающему сердцу. И пока оно бьется во тьме, я знаю,
    что смогу отыскать путь".'
  speaker: null
- guid: 4d21d921-ec81-4448-94c0-5b4d20cef4aa
  event: BNTRS_PickUps_Cassia_222
  text: '"Подобная оценка жизни неуместна, груба... но не лишена истины. Герои моих любимых романов превозмогают тяготы —
    настал и мой черед".'
  speaker: null
- guid: ffcbc5e4-57bd-4feb-9351-6ad4042b85ec
  event: BNTRS_PickUps_Cassia_227
  text: '"В цвета твоей души вернулась упорядоченность. Тебе... легче от того, что ваша связь с Лорд-капитаном нарушилась?"'
  speaker: null
- guid: 255fa2b4-2cec-4cdb-9dbd-442bda4f6c83
  event: BNTRS_PickUps_Cassia_244
  text: '"Кибелла, я никогда не видела у нее таких цветов. Это... страх? Смятение?"'
  speaker: null
- guid: ac8e7851-f053-4f17-937a-1fd56ab8dd23
  event: BNTRS_PickUps_Cassia_258
  text: '"Полагаю, дело не в размерах территории, а в компетентности губернатора. Он даже не прислал за нами подобающий кортеж!"'
  speaker: null
- guid: e562d6f7-9b0e-4f81-b458-56546d853db5
  event: BNTRS_PickUps_Cassia_259
  text: '"Даже в эпицентре антрацитово-багровой бури ты, Кибелла, излучаешь ровное серебристое сияние. Физическая боль для
    тебя — мимолетный всполох. Почему?"'
  speaker: null
- guid: 8464ed5e-02fe-4313-be59-6651bbf90f91
  event: BNTRS_PickUps_Cassia_263
  text: '"Как странно, твои речи мрачны, но в душе виден всполох радости. Ты так приветствуешь меня?"'
  speaker: null
- guid: 8acab8e8-316c-4964-bd84-7ef06f0ac7af
  event: BNTRS_PickUps_Cassia_285
  text: '"Пролитая кровь благородных господ — большое несчастье. Однако суровое решение Лорд-капитана надолго отобьет у этих
    бесчестных интриганов желание вредить верным слугам Лорд-капитана".'
  speaker: null
- guid: ed1b2f8d-a052-48d0-84d3-e1c623aced82
  event: BNTRS_PickUps_Cassia_66
  text: '"Разве столь ценным служителям Императора пристойно ютиться в столь убогой обители?"'
  speaker: null
- guid: f1cb2822-c2b2-417e-a3e4-fccc4858a5a4
  event: BNTRS_PickUps_Cassia_79
  text: '"Я чувствую странную схожесть между нами. Нас обеих вырастили наши... Дома. Для великой цели".'
  speaker: null
- guid: 857506a9-24dd-44a2-8b04-740f94145273
  event: BNTRS_PickUps_Cassia_90
  text: '"То, что Вольный Торговец нисходит в обители убогих серфов — какая-то традиция? В моем Доме такое не принято".'
  speaker: null
- guid: 75db4bff-c0df-488c-83b8-97deb4017cab
  event: BNTRS_PickUps_Cassia_99
  text: '"Когда многорукое чудовище смотрело на меня, я видела... нечто. Огромную черную тень за пределами его взгляда. В
    ней не было цветов... вовсе".'
  speaker: null
- guid: c5681cfc-3c87-4f8d-8fe3-9c863e6e6273
  event: BNTRS_Reactivity_Cassia_101
  text: '"Я вижу серебристо-синее сияние вокруг Лорд-капитана и Ирлиэт. Эти цвета... ни на что не похожи. Словно бы их чувства
    на ином, непознанном уровне".'
  speaker: null
- guid: 6add1c69-3dd5-4f6d-8096-12f79b80739c
  event: BNTRS_Reactivity_Cassia_14
  text: '"Отчего ты столь подозрительно улыбаешься? Твои цвета... причудливо пляшут, когда я рядом".'
  speaker: null
- guid: 9d8126e5-ed83-458b-8647-29a8da6e2132
  event: BNTRS_Reactivity_Cassia_29
  text: '"Ну что вы, почтенный магос. Союз Дома Орселлио и династии фон Валанциус — великое событие. Беспокоятся о нем лишь
    завистники, а друзья — дарят поддержку".'
  speaker: null
- guid: a1716008-a69f-4f67-bef3-22123220ee43
  event: BNTRS_Reactivity_Cassia_31
  text: '"Я вижу твои пестрые всполохи... Спрашивай же. Прежде ты не молчала ни из вежливости, ни из жалости".'
  speaker: null
- guid: ecdc774c-e238-412b-972d-4ac9ca24d423
  event: BNTRS_Reactivity_Cassia_37
  text: '"Цвета Лорд-капитана и Мастера ван Калокса меняются, стоит им оказаться рядом".'
  speaker: null
- guid: 324e6049-c6a1-49c9-a260-5f3fc7d54dc5
  event: BNTRS_Reactivity_Cassia_41
  text: '"Теперь я знаю, что значит выражение "красивая пара". Мне жаль, что этой изящной картине не суждено было быть воплощенной
    на холсте реальности".'
  speaker: null
- guid: 91f02e98-f4e7-49b0-b2b3-0cbd9db258dd
  event: BNTRS_Reactivity_Cassia_49
  text: '"Джай... ведет себя немного демонстративно в вопросах ее связи с Лорд-капитаном. Необычное поведение для принцессы.
    Похоже, у знати на Ифрите совсем другие порядки".'
  speaker: null
- guid: 968e8d7c-dc11-47fd-a8b1-688f5dc05ff9
  event: BNTRS_Reactivity_Cassia_58
  text: '"Твои цвета стали темнее и мрачнее. Отчего в тебе столько скорби?"'
  speaker: null
- guid: 6154fdbd-7e62-4c60-a2e5-bfa0f2f60b34
  event: BNTRS_Reactivity_Cassia_65
  text: '"Сестра Арджента, скажи мне. Как призвать сердце к смирению, когда его одолевают... ревность и сомнения?"'
  speaker: null
- guid: 5d3e8ce5-a7c5-4ea1-8911-2afc1e7adb9f
  event: BNTRS_Reactivity_Cassia_70
  text: '"Вовсе нет! Просто я... всегда мечтала стать для кого-то единственной и неповторимой. Но жизнь научила, что мы не
    всегда получаем желаемое".'
  speaker: null
- guid: 1405e007-c52c-4a9b-8d7c-05292e294b47
  event: BNTRS_Reactivity_Cassia_76
  text: '"Палубы корабля окутывались тревожным желтым и испуганным зеленым, когда меж людей ступал Маражай... но теперь те
    же цвета заполоняют все вокруг, когда Лорд-капитан появляется на мостике. Меня... пугает эта перемена".'
  speaker: null
- guid: bb2afa34-3362-4af6-a836-bf750b947ca0
  event: BNTRS_Reactivity_Cassia_92
  text: '"Ох, я... извини. Твои цвета недавно вдруг потускнели, и теперь мне почти не больно на них смотреть. Это... из-за
    Лорд-капитана, верно? Хм. Молчание — тоже ответ".'
  speaker: null
- guid: 608b8261-2434-4a95-92a9-ddfa98c0c598
  event: BNTRS_Reactivity_DLC3_Cassia_04
  text: '"А я гадала, от чего эти яркие вспышки в тумане, что укутывают вас каждый раз, когда вы покидаете мостик. Их действительно
    стало меньше".'
  speaker: null
- guid: ee6e6118-dba9-46d3-be28-3f6ed4792d9d
  event: BNTRS_Reactivity_DLC3_Cassia_30
  text: '"Я чувствую смятение вокруг. Будто на огромный холст выплеснули полный флакон краски. Это из-за Патента, знаю. Но
    к чему такое волнение? Разве сама кровь Вольного Торговца не священна?"'
  speaker: null
- guid: cc85afa8-e855-45bd-b8a7-218c4989319a
  event: BNTRS_Reactivity_DLC3_Cassia_52
  text: '"То, что господин Себериан остался там... Я понимаю, почему Лорд-капитан так поступил{mf||а} со своим предком. Великим
    правителям прошлого... лучше оставаться в прошлом".'
  speaker: null
- guid: fa985514-7d26-4d31-ad26-af8184b6db6c
  event: BNTRS_Reactivity_DLC3_Cassia_64
  text: '"Шествие на палубе было окрашено столь яркими цветами, хоть и состояло из безродной черни. Этот контраст кажется
    необычным и даже... красивым. Смогут ли передать его мои краски?"'
  speaker: null
- guid: 74f88aac-fb26-40c6-92bd-5f4cc219678e
  event: BNTRS_Stressful_Cassia_04
  text: '"Не беспокойтесь, со мной мои навигаторские силы. Статистически говоря, у вас куда больше шансов погибнуть в бою.
    Ох, то есть, это не совсем то, что я хотела сказать..."'
  speaker: null
- guid: 0dbec5a4-3f89-4407-8ac9-419e3776c7ff
  event: BNTRS_Stressful_Cassia_114
  text: '"Ты — черное пятно, что словно кровавая катастрофа тянет к себе безвольный взор. Я хочу отвернуться... но то, как
    искажена твоя душа, пугает и завораживает".'
  speaker: null
- guid: 3829b304-1d00-4013-ac72-b86eeb973851
  event: BNTRS_Stressful_Cassia_134
  text: '"Познание есть ключ ко всему", не так ли, почтенный магос? Я научилась сей мудрости у ваших собратьев, и она уже
    не раз меня выручала".'
  speaker: null
- guid: ad27230b-de0e-44c4-a9b5-f379eec498dd
  event: BNTRS_Stressful_Cassia_152
  text: '"Благодарю тебя, Ульфар. Ценно знать, что я заслуживаю доверия Космического волка. И еще ценнее видеть это в пестрых
    всполохах, что окружают твою яркую душу".'
  speaker: null
- guid: e6f91a4c-8ae0-4dd7-bc7a-924df587dfb5
  event: BNTRS_Stressful_Cassia_170
  text: '"Могу ответить тебе тем же. Сияние твоей души ослепляет мой взор — до слез и боли в висках. Нам лучше... держаться
    на расстоянии".'
  speaker: null
- guid: 6f5165bc-6edf-4445-8fed-37c481d69b2b
  event: BNTRS_Stressful_Cassia_22
  text: '"О, думаю, ты смогла бы. В тебе есть и золотой свет, и серебряный, и алый — один из них позвал бы тебя обратно в
    этот мир".'
  speaker: null
- guid: 65993516-7093-4285-a19e-ed05317b9b4b
  event: BNTRS_Stressful_Cassia_37
  text: '"Я вижу волнение и страх прислуги подле меня. Но вы... Как у вас получается заглушать их цвета одними словами? Их
    темные оттенки сразу растворяются, и наступает смирение".'
  speaker: null
- guid: a76c2b13-c383-40c5-85dc-059ab3ef7852
  event: BNTRS_Stressful_Cassia_39
  text: '"Сестра Арджента, подле меня ты непрестанно кутаешься в зеленовато-серый туман. Тебя тревожу я? Или то, что я могу
    за ним разглядеть?"'
  speaker: null
- guid: 2cfc7a34-93c6-4e8a-807f-59371ea2e4d3
  event: BNTRS_Stressful_Cassia_41
  text: '"Чем больше вы стараетесь сокрыть от меня свои цвета, мастер ван Калокс, тем отчетливей я их вижу. Если вам столь
    неприятен мой взор — просто скажите".'
  speaker: null
- guid: 4d5d2d63-74ba-4b2a-9208-c107bdd9e314
  event: BNTRS_Stressful_Cassia_43
  text: '"Иногда я задаюсь вопросом — насколько мы по-разному ощущаем варп?"'
  speaker: null
- guid: 31c93418-2c25-4240-91ea-588e4ea260c9
  event: BNTRS_Stressful_Cassia_45
  text: '"За пестрыми красками твоей души мне видятся совсем иные оттенки. Меньше золота и серебра, и все больше..."'
  speaker: null
- guid: c2c9990d-8c67-4b1e-8cfa-3f0c094290b9
  event: BNTRS_Stressful_Cassia_47
  text: '"Если бы люди видели в тебе то же, что вижу я... Они бы боялись твоего вида еще больше".'
  speaker: null
- guid: 0ac16dfa-2669-4726-81a9-d5ae1a4c8709
  event: BNTRS_Stressful_Cassia_49
  text: '"Удивительно... Ваше сердце, почтенный магос, сияет пестрым калейдоскопом красок, хоть и сотворено из металла".'
  speaker: null
- guid: 4e5bc77c-4aa5-442c-870f-f9aa6128a6eb
  event: BNTRS_Stressful_Cassia_51
  text: '"Тебе необязательно скрывать пепельные тени одиночества за вихрями ярких красок, Ульфар".'
  speaker: null
- guid: 7778d328-d49a-4b52-961d-418dd0aee845
  event: BNTRS_Stressful_Cassia_53
  text: '"Меня учили, что ксеносы — богомерзкие создания. Но вот ты не выглядишь ужасающе. Скорее... необычно. Как и я".'
  speaker: null
- guid: 69f84a7a-a919-4c50-a80d-0ccf36561d28
  event: BNTRS_Stressful_Cassia_60
  text: '"И снова вы прочли мое настроение, словно открытую книгу, мастер ван Калокс. Мои глаза... им все еще больно от пестрого
    калейдоскопа красок, которыми полнится мир".'
  speaker: null
- guid: b911a21f-21d1-4d47-b595-d7a32f9edace
  event: BNTRS_Stressful_Cassia_80
  text: '"Обычно — цветной пандемониум, но сейчас... твои цвета поблекли. Ты боишься меня, Идира? Или того, что я могу увидеть
    в тебе?"'
  speaker: null
- guid: f36c3706-a432-4fda-8315-0a388c2a57ac
  event: BNTRS_Stressful_Cassia_96
  text: '"Зачем бы я стала это делать? Я прозреваю цвета, клубящиеся в душах людей — их маскам не обмануть мой взор".'
  speaker: null
- guid: 0c77dad3-b883-4808-aae6-2152c57ded1f
  event: CH1_CassiaScared_01
  text: '{n}Теобальд харкает синеватой кровью — бронепластина на его груди пробита в нескольких местах, а вместо живота —
    месиво из металла и кишок. Когда белесые глаза {g|Encyclopedia:Navigator}навигатора{/g} находят Кассию, он едва слышно
    хрипит:{/n} "Теперь... это твоя ноша, Дитя... Выживи. Вернись в лоно Дома, как... как того требует твое предназначение..."'
  speaker: null
- guid: 622cdce1-af1e-4521-bfc2-02bc49fe3ae2
  event: CH1_CassiaScared_02
  text: '"Нет... Не бросай меня одну в этом иссиня-буром тумане! Очнись! Это приказ твоей госпожи, слышишь?" {n}Кассия растерянно
    смотрит на тело навигатора — и вам становится необъяснимо тоскливо и одиноко.{/n}'
  speaker: Cassia Orsellio
- guid: 9bf9116b-6705-4a8a-baba-7ff6af8bdf74
  event: CH1_CassiaScared_03
  text: '{n}Абеляр отдает честь павшему.{/n} "Славный был прозреватель {g|Encyclopedia:Warp}варпа{/g} — боролся за госпожу
    до конца".'
  speaker: Abelard Werserian
- guid: 024d3442-50c4-487d-a340-0cc435a3bb0c
  event: CH1_CassiaScared_04
  text: '"О, Теобальд..." {n}Кровавые слезы вновь окрашивают белую кожу Леди-Навигатора, но в этот раз ее силы не заставляют
    присутствующих рыдать вместе с ней.{/n}'
  speaker: null
- guid: 1742319d-ede4-4e52-b00f-b791999e38c0
  event: CH1_CassiaScared_05
  text: '"Прошу, Дитя, не упрямьтесь. Помните о долге перед Домом, и путь эти мысли предают вам сил".'
  speaker: null
- guid: cc1c705e-5129-4809-ace9-07b415a165ab
  event: CH1_CassiaScared_06
  text: '"Что... что вы намереваетесь со мной сделать?"'
  speaker: null
- guid: 668191fd-9c67-4bfd-8f70-451baa9dd4c0
  event: CH1_CassiaScared_07
  text: '"И после этого мне приходится доверять Дитя... вам?" {n}Старик шипит сквозь остатки зубов.{/n} "Очень уж похоже на
    проделки Фелека, и вы повелись на них! Или, быть может, знали обо всем заранее". {n}Теобальд бессильно сжимает кулаки.{/n}
    "Ничего, Регент Ааронто придумает, как избавить Дитя от сего проклятья".'
  speaker: null
- guid: a038ddaf-9e2f-4060-9551-71fb6974e60d
  event: CH1_CassiaScared_08
  text: '"Довольно, Дитя не заслуживает подобных страданий!"'
  speaker: null
- guid: 1cce7e72-b036-4c6c-a6b0-ef1285eea26b
  event: CH1_CassiaScared_09
  text: '"Заключаете невыгодную сделку, когда вторая сторона в отчаянии... Как я и думал, в вас нет и капли чести". {n}Теобальд
    брезгливо отводит взгляд рыбьих глаз и обращается к Кассии:{/n} "Дитя, пусть сей поступок будет вам уроком. Жестоким уроком,
    но для достижения целей Дома вам придется временно смириться с подобным положением дел. Помните — главное добраться до
    Регента Ааронто".'
  speaker: null
- guid: b75dcea1-b634-44ab-9ffc-8715c0294256
  event: CH1_CassiaScared_10
  text: '"Не беспокойтесь, Дитя. Ваши люди готовы погибнуть за вас в любую минуту — хоть под градом выстрелов, хоть на разрушенной
    станции. И так будет всегда".'
  speaker: null
- guid: d20ffbe0-8794-48de-9579-7c541d5878d9
  event: CH1_CassiaScared_11
  text: '{n}Кассия обреченно качает головой.{/n}'
  speaker: Cassia Orsellio
- guid: f909d2ae-c5d8-4074-b07b-63603d4886c4
  event: CH1_CassiaScared_12
  text: '{n}Вы пытаетесь дотронуться до камня в шее Кассии, однако неизвестная сила не позволяет вам даже коснуться его —
    пальцы застывают в миллиметре от кожи, словно невидимая броня покрывает теперь шею девушки. Камень начинает быстро нагреваться,
    обжигая нежную кожу девушки.{/n} "Хватит... Хватит, прошу!"'
  speaker: null
- guid: 338859ef-f61e-46bb-b1fa-732928cd06f5
  event: CH1_CassiaScared_13
  text: '"Как низко может пасть человек в погоне за властью... Ты правда так сильно меня ненавидел, Фелек?" {n}Рубиновые глаза
    Кассии наполняются кровавыми слезами, когда она всматривается в лицо предателя. Ваше сердце наполняется невыносимой тоской.{/n}'
  speaker: null
- guid: ef0dcf44-5ea2-4a2a-8420-04fe9283fab5
  event: CH1_CassiaScared_14
  text: '"Я не... Раньше я никогда..." {n}Кассия почти шепчет, однако быстро собирается с духом и, подняв голову, спокойно
    произносит:{/n} "Я сделала то, что должно делать с изменниками Дома Орселлио. Можете не волноваться, Вольный Торговец
    — над жизнями обычных людей у меня нет подобной власти".'
  speaker: Cassia Orsellio
- guid: 8e37fce3-89d3-443a-bbc5-f8e20c53c049
  event: CH1_CassiaScared_15
  text: '"Слова срываются с ваших уст и обжигают окружающих ядовито-зелеными всполохами, но после оседают в вашей собственной
    душе серым пеплом. Знаете, чем больше пепла в чьем-то сердце, тем быстрее он сам теряет человечность".'
  speaker: null
- guid: c9595b1f-7339-4d50-912b-c351d99642e1
  event: CH1_CassiaScared_16
  text: '"Мне незачем вам врать. Но вы ведь все равно не поверите — без доказательств. Впрочем, я читала труды Фергюса-Клеона,
    и мне понятен ход ваших мыслей. Недоверие — естественное защитное поведение большинства существ, поэтому меня оно не оскорбляет".'
  speaker: null
- guid: 0fb9d429-af6c-4521-bdb5-c255fdf0cd7e
  event: CH1_CassiaScared_17
  text: '{n}Девушка хмурится.{/n} "Вокруг вас танцуют алые всполохи — это надежда на боль и битвы. Но мой дар не поможет вам
    в этом".'
  speaker: null
- guid: be958093-6c5a-423d-b699-7cc7110729f1
  event: CH1_CassiaScared_18
  text: '"Мне не нужны ваши сожаления! Я... Я просто хочу, чтобы все стало так, как было раньше". {n}Кассия с тоскою осматривает
    разрушения вокруг.{/n}'
  speaker: Cassia Orsellio
- guid: 4bab12ca-c65c-4af0-8ee7-4c9f07692f44
  event: CH1_CassiaScared_19
  text: '"А если я откажусь?" {n}Приподняв дрожащий подбородок, Кассия смеряет вас взглядом.{/n}'
  speaker: null
- guid: 2c78d014-bca3-49e4-ae4e-7fe97a78d899
  event: CH1_CassiaScared_20
  text: '"Но это мой..." {n}Кассия медлит, подбирая подходящее слово.{/n} "Мой... дом".'
  speaker: Cassia Orsellio
- guid: 28cd3c5d-6482-4c0d-8041-3f4e88dfc6f0
  event: CH1_CassiaScared_21
  text: '{n}Теобальд вновь харкает синеватой кровью, замазывая бронепластину на груди, но все еще держится на ногах.{/n} "Очнитесь,
    моя госпожа. Священное Дитя... Все уже кончено. Все позади".'
  speaker: null
- guid: 3f7ac936-075b-4eae-8ae2-2dc1ed92b11a
  event: CH1_CassiaScared_22
  text: '"Что... что произошло?" {n}Взгляд алых глаз касается вашего лица.{/n} "Вы. Я вас помню. Вы прибыли, чтобы спасти
    нас?"'
  speaker: null
- guid: 5885b0f7-f67e-4a3a-aa70-3dc29aeca633
  event: CH1_CassiaScared_23
  text: '"Дитя, прошу, выслушайте меня очень внимательно. В последний раз". {n}Старик сгибается от боли и приглушенно хрипит.{/n}
    "Вам предстоит отправиться в путь с {mf|этим|этой} {mf|господином|госпожой}, дабы воссоединиться с Домом и регентом в
    Просторе Коронус. Я... не смогу сопровождать вас в этих странствиях". {n}Очередная порция синей крови стекает по лицу
    старика — теперь уже из уха и носа.{/n}'
  speaker: null
- guid: 99f2b1ce-8a77-46c7-930d-b3c1609819e1
  event: CH1_CassiaScared_24
  text: '"Нет... Не смей и ты бросить меня одну в этом иссиня-буром тумане! Ты идешь со мной — это приказ твоей госпожи, слышишь?"
    {n}Вас обдает жаром чужого отчаяния. Руки потеют, а сердце вдруг застывает от приступа страха.{/n}'
  speaker: null
- guid: 94dda90d-9782-47d9-a733-0b79f2cda8e6
  event: CH1_CassiaScared_25
  text: '"Боюсь, моя госпожа, это единственный ваш приказ, что я посмею нарушить. Я — Хранитель Эурак-V. И, увы, уже не проживу
    дольше дня. А потому позвольте послужить вам в последний раз так, как того требует долг перед Домом Орселлио. Я останусь
    на станции и уничтожу тайны, что она хранит".'
  speaker: null
- guid: 86a89877-d020-4ff3-8fe9-d4b8ea57cbca
  event: CH1_CassiaScared_26
  text: '"Объяснитесь, что все это значит? Предательство? Саботаж?!"'
  speaker: null
- guid: 235062e0-6bcd-48e1-a26b-6ad528027428
  event: CH1_CassiaScared_27
  text: '"Э-э-э, нет. Хватит. Достаточно. Краник уже пора перекрыть". {n}Идира с нарочитой деловитостью размазывает накатившие
    на глаза слезы.{/n}'
  speaker: Idira Tlass
- guid: 523ebab2-0a8d-4cfb-a751-84e429ad5eb8
  event: CH1_CassiaScared_28
  text: '{n}Кассия приходит в себя и с ужасом оглядывается по сторонам.{/n} "Теобальд! Нет... Не бросай меня одну в этом иссиня-буром
    тумане! Очнись! Это приказ твоей госпожи, слышишь?" {n}Девушка гневно смеряет вас взглядом — и вы чувствуете закипающую
    в собственной груди ненависть.{/n} "Что вы наделали..."'
  speaker: Cassia Orsellio
- guid: 894d590d-a8ed-46c5-b940-bc7b81c5f6ea
  event: CH1_CassiaScared_29
  text: '"Утрата наставника — прискорбное событие. Возглашаю мантру утешения духовного страдания". {n}В воксе Паскаля возникает
    странная вибрация, мягкая и увещевающая, совсем не похожая на обычный его сухой тон.{/n}'
  speaker: null
- guid: e4ee4f97-0692-44af-bfaa-a3ddfd5772cf
  event: CH1_CassiaScared_30
  text: '{n}Внезапно Кассия хватается за нагрудник в области сердца и кривится от боли. {d|Encyclopedia:Ch1_CassiaAmuletOn}Камень{/d},
    ярко вспыхнувший под тонкой кожей ее белой шеи, странным образом резонирует с ее силами. Не в силах произнести и слова,
    девушка пытается выдрать камень острыми когтями — но тщетно.{/n} "Я... что вы со мной сделали? Что вживили в шею? Мои
    силы словно иссякшая чаша. Тени вокруг сгустились... Что происходит? Помогите... Помогите же избавиться от этой ноши!"'
  speaker: null
- guid: ce9b9eba-dbeb-43dc-86c5-9a306e1bb70b
  event: CH1_CassiaScared_31
  text: '{n}Кассия удивленно моргает.{/n} "Немногие осмеливаются говорить мне подобное. Вы отличаетесь от обычных людей".'
  speaker: Cassia Orsellio
- guid: 375988d6-617a-4260-b60e-43f5be384cc6
  event: CH1_CassiaScared_32
  text: '"Позвольте, но как же мои слуги? Эурак-V еще полон людей, верных Дому Орселлио!"'
  speaker: null
- guid: b302c177-0a6b-4f76-92d2-5e899d3285eb
  event: CH1_CassiaScared_33
  text: '{n}Некоторое время Леди-Навигатор обдумывает ваши слова.{/n}'
  speaker: null
- guid: a9923b78-2546-4786-96a3-65dabeca8a26
  event: CH1_CassiaScared_34
  text: '"Боюсь, вы не оставляете мне выбора, Лорд-капитан. Я согласна. Отведите же меня на ваше судно".'
  speaker: null
- guid: 5f9df338-0478-4a0f-8fff-0058b066346d
  event: CH1_CassiaScared_35
  text: '"Я... как {g|Encyclopedia:Navigator}Леди-Навигатор{/g} Дома Орселлио, принимаю вашу протекцию. Пожалуйста, отведите
    меня на ваш корабль — я больше не в силах здесь оставаться".'
  speaker: null
- guid: 59c5584e-37a1-414b-bca4-937c4e4d0f1b
  event: CH1_CassiaScared_36
  text: '{n}Кассия сдержанно кивает.{/n} "Сопровождать {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} в странствиях — честь
    для любого {g|Encyclopedia:Navigator}навигатора{/g}. Идемте же. Я больше не вынесу мертвенно-бледных теней, что окутывают
    тела павших".'
  speaker: Cassia Orsellio
- guid: aeb575e7-9d0f-43da-b21a-46aab51ec5e1
  event: CH1_CassiaScared_37
  text: '{n}Теобальд Орселлио медленно кивает.{/n} "Не страшитесь грядущего, Дитя. Вы готовы править любое судно, я знаю это,
    потому что сам вас учил. А более достойной компании, чем Вольный Торговец, сложно и представить. И помните, ваша безопасность
    — самое главное. Доберитесь до Великого Регента и исполните свое предназначение".'
  speaker: null
- guid: 1e244751-d156-48c0-8d45-ed9183ce430a
  event: Companions_Navigator_01
  text: '"Несомненно! В следующий раз я именно так и поступлю!"'
  speaker: null
- guid: 8ff9438c-6875-4161-b280-be7ce9abff16
  event: Companions_Navigator_02
  text: '"Приветствую, {name}. Помощь, что вы оказываете Дому Орселлио, поистине неоценима". {n}Кассия осторожно улыбается.{/n}
    "О чем поведем беседу на сей раз?"'
  speaker: Cassia Orsellio
- guid: 76a73b07-6bea-4961-81c7-95fd412ebe82
  event: Companions_Navigator_03
  text: '"Лишь вам я готова признаться — бытие {g|Encyclopedia:Novator}новатора{/g} пугает меня и претит. Как могу я управляться
    целым Домом, если даже собственные силы мне не подвластны?! Я... Я лишь благодарна, что вы всегда были рядом и подсказывали
    мне верный путь. Благодарю, Вольный Торговец. И почту за честь и далее править ваш корабль сквозь Океан Душ — пока вы
    не решите обратного.'
  speaker: null
- guid: a6d33748-4c42-4cfb-a38c-56f53706f66d
  event: Companions_Navigator_04
  text: '"Тогда сопроводите меня — и я отвечу на ваши вопросы".'
  speaker: null
- guid: fb3ab1a6-f9fa-425c-8724-94239a425d87
  event: Companions_Navigator_05
  text: '"Дозволяю, Лорд-капитан".'
  speaker: null
- guid: 68ad4ad7-ef0c-43cb-98c4-86b404466ff6
  event: Companions_Navigator_06
  text: '"Это сложно описать словами... Поймите, каждый навигатор воспринимает {g|Encyclopedia:Warp}варп{/g} по-особенному.
    Мой учитель, Великий Регент Ааронто, всегда описывал свои путешествия через Имматериум как странствие по бескрайнему лесу
    со множеством тропок. И я, ассистируя в первых полетах, пыталась следовать его примеру — безуспешно. Лес не открывался
    мне".'
  speaker: null
- guid: 84544474-97d1-4389-8e58-9ccb34e54e4e
  event: Companions_Navigator_07
  text: '"Не имею намерения возражать, Лорд-капитан".'
  speaker: null
- guid: f61f384f-4bc7-4971-8182-7ba936f5a1f7
  event: Companions_Navigator_08
  text: '"Спасибо, что выслушали". {n}Кассия чуть улыбается и благодарно кивает.{/n}'
  speaker: Cassia Orsellio
- guid: 33892058-a271-4930-82ab-820cff24cde6
  event: Companions_Navigator_09
  text: '"Когда же на Эурак-V синий лед моей души заставил сердце Фелека остановиться... Я сразу все поняла. И лгать себе
    было уже бессмысленно".'
  speaker: null
- guid: 08b1c42d-6e11-48a9-b653-49de144835b7
  event: Companions_Navigator_10
  text: '"Свинцовая мгла отныне не тяготит Сестру битвы. Арджента высвободила ее, и мгла стала тенью, без которой не может
    существовать свет. Чистым оттенком, единственным столпом спокойствия, что остался в бушующем пламени ее души. Огонь пылает
    золотом и алыми... К добру или к худу — мне узнать не под силу".'
  speaker: null
- guid: cfeef248-6e1f-413f-a467-fcffb0739012
  event: Companions_Navigator_100
  text: '"Так... говорит Великий Регент". {n}Кассия старается не встречаться с вами взглядом.{/n} "Ничего еще не решено. Некоторых
    в Доме окутывает непроглядная серая туча при мысли о том, что я стану {g|Encyclopedia:Novator}новатором{/g}. Но еще больших
    опутывают свинцово-сизые оковы. Они считают, что я не готова к подобной ноше".'
  speaker: Cassia Orsellio
- guid: 11c2ee0b-ff98-4ab9-98f5-67b0d80a4f50
  event: Companions_Navigator_101
  text: '"Мне жаль, что я не смогла разглядеть помыслов Ирлиэт сквозь призму собственных сил, Лорд-капитан. Но, кажется, теперь
    я начинаю понимать намерения ксеносов чуточку лучше. Их ложь, их страхи, их ярость... Цвета Ирлиэт отныне сплетаются в
    моих глазах нитями единого гобелена, пестрящего чуждыми эмоциями".'
  speaker: null
- guid: 378062e3-8d7a-4ace-a736-d7ab2a88c248
  event: Companions_Navigator_102
  text: '"Джай подобна драгоценному камню: чем ярче подле нее сияют люди, тем отчетливее она повторяет в своих гранях мириады
    пестрящих отблесков. Все они — части Джай, и ни один из них — не она. За покровом цветастых шалей я не могу разобрать
    ее истинных цветов. Сколько бы раз ни срывала оттенок за оттенком, под одним цветом каждый раз оказывается другой".'
  speaker: null
- guid: fa3f3bde-3e69-4f59-9e34-a1126b19a6be
  event: Companions_Navigator_103
  text: '{n}Нечеловеческие зрачки сужаются в рубиновых глазах Кассии, и пол начинает плыть под вашими ногами.{/n} "Вы были
    в своем праве, Лорд-капитан. То, что представители Дома Орселлио позволили себе сотворить на мире-столице Вольного Торговца...
    Попросту недопустимо".'
  speaker: null
- guid: cca16cef-eaf7-4c1f-9c39-33d5132744e9
  event: Companions_Navigator_104
  text: '"Отнюдь, Лорд-капитан. Одна мысль о произошедшем стягивает горло серо-синей удавкой. Осознавать вновь и вновь, сколь
    отчаянно подданные тебя ненавидят..." {n}К горлу подступает удушливый ком, и Кассия испуганно проводит ладонью над вашим
    плечом, словно сбрасывая осевший пепел. Становится легче.{/n} "Простите, Лорд-капитан. Мне не стоит омрачать ваши цвета
    своими переживаниями".'
  speaker: null
- guid: 735dce49-8842-42fa-9093-52db60f165fc
  event: Companions_Navigator_105
  text: '"Сестра Арджента сияет подобно путеводной звезде, наделяя окружающих необъяснимой решительностью. Однако я вижу,
    как за ее спиной клубится темная, уродливая мгла, столь явно оттеняющая ее сияние. Она тяготит Сестру битвы, тянет вниз...
    Но едва ли Арджента сама это замечает".'
  speaker: null
- guid: 1c0bb480-7328-407c-b094-7e1d16373950
  event: Companions_Navigator_106
  text: '"Джай продолжает кутаться в пестрые краски привычных масок, меняет цвета по желанию, словно одежды. Но глубоко внутри
    ее сердца трепещет пугливый росток цвета дымчатой лилии. Грязный, опаленный, присыпанный пеплом... Зато настоящий. Кто
    знает, быть может, однажды Джай и позволит ему прорасти".'
  speaker: null
- guid: 457f72c6-c9ba-4057-9ac9-0d4d2dcf78ea
  event: Companions_Navigator_107
  text: '"Лик Ульфара озаряет пожар восходящего солнца, столь жаркое пламя сияет — аж больно смотреть. Но стоит пожару утихнуть,
    хоть на секунду, и тут же подложка из блеклой серости и мерзко-зеленой дымки окутывает его плечи. Никто вокруг этого не
    замечает..." {n}Кассия взмахивает ладонью, сбрасывая невидимую шаль с собственных плеч.{/n} "Но я вижу".'
  speaker: Cassia Orsellio
- guid: 7ccf7150-6707-45c6-80e3-de7628e6d5af
  event: Companions_Navigator_108
  text: '"Пепелище в душе Ульфара впитало блеклую серость, оставив после себя лишь угольные разводы. Они рвутся наружу, смазывают
    оттенки... И потускневшее золото уже не сияет столь ярко".'
  speaker: null
- guid: 2ffbe0f0-ecd7-49ea-8b8a-ac863ead541b
  event: Companions_Navigator_109
  text: '"Уважаемый магос Ханейманн раздроблен, словно стекла прекрасного витража, рассыпавшиеся цветной мозаикой от удара.
    Яркие и манящие, его оттенки смешались в полнейшем беспорядке... Признаюсь, меня это озадачивает. Обычно сердца служителей
    Омниссии наполнены лишь алым и сталью".'
  speaker: null
- guid: a385c998-ee61-49c5-b19c-098016ece797
  event: Companions_Navigator_11
  text: '"Сенешаль Версериан один из немногих, на чьи цвета приятно смотреть". {n}Строгий взгляд Кассии чуть теплеет.{/n}
    "Когда сенешаль говорит, вокруг разрастается кристальная прозрачность неба. Когда гневится — сгущаются синие тучи. Ну
    а в редкие минуты радости чистый отсвет розового заката лелеет душу тех, кто его окружает. Из всей вашей свиты, Лорд-капитан,
    я бы доверила свою жизнь лишь ему".'
  speaker: null
- guid: d48da8ae-302b-4006-9695-dc85d37d35c5
  event: Companions_Navigator_110
  text: '"Цветные осколки витража взмыли вверх, окутав магоса Ханнеймана вихрем пестрящих домыслов. Серебряный отблеск металла
    уже не скрывает волнения. Как и алая роба не скрывает сомнений".'
  speaker: null
- guid: 90c81bfe-0881-4fd7-9f9d-6cc42a6b3127
  event: Companions_Navigator_111
  text: '"За мыслями цвета вороненой стали, за блеклым холодом сизых эмоций... В душе господина ван Калокса тлеет янтарный
    уголек — столь теплый и яркий, что хочется к нему прикоснуться". {n}Кассия завороженно смотрит вдаль, словно перед ней
    стоите не вы. Опомнившись, она опускает взгляд.{/n} "Печально, что господин дознаватель собственными руками топит его
    в бездонной синеве долга. Печально... Но я его понимаю".'
  speaker: Cassia Orsellio
- guid: 8c57a943-c36d-428a-80fb-60f52e85b7ba
  event: Companions_Navigator_112
  text: '"Эмоции Идиры подобны водовороту — яркие, необузданные, окутывающие фигуру, словно чудный калейдоскоп из пестрых
    оттенков... И столь же опасные, как завихрения варп-шторма. За бурей цветов от моего взора сокрыта истина, что именно
    правит этой женщиной — собственная воля? Или же..." {n}Кассия мнется.{/n} "Или же Имматериум, Лорд-капитан".'
  speaker: Cassia Orsellio
- guid: df9e01f6-d371-40c4-b9c4-86fabe746306
  event: Companions_Navigator_113
  text: '"Идира... Пестрая пелена спала, и я наконец-то вижу за ней человека. Но что от него осталось? Бледная, бесцветная
    оболочка". {n}Рубиновые глаза полны сочувствия и печали.{/n} "Ее цвета тают на глазах, но я не в силах это остановить...
    Никто не в силах. Вскоре от псайкерши останется лишь серая тень".'
  speaker: null
- guid: 0a9cead4-f6e4-4ad8-bafc-9f118818c127
  event: Companions_Navigator_114
  text: '"Постарайтесь не растерять небесно-голубой покров надежды, Лорд-капитан. Ибо рядом с вами светлее становятся и цвета
    других".'
  speaker: null
- guid: 7182fd33-8180-453c-bf8b-65362674afc3
  event: Companions_Navigator_115
  text: '{n}Удрученное молчание повисает в воздухе. Наконец Леди-Навигатор произносит:{/n} "Правда, Лорд-капитан. Признаться,
    меня уже многие годы преследуют странные фигуры — во снах, во время видений и прозрения варпа. Они тянутся ко мне, изнемогают,
    что-то кричат, но слов я не слышу. А одна из фигур, самая устрашающая, все время стоит поодаль и лишь осудительно смотрит".'
  speaker: null
- guid: 97115ebd-5048-49d2-9f2c-950a02941b75
  event: Companions_Navigator_116
  text: '"Силы постепенно возвращаются ко мне, Лорд-капитан. И я вновь могу контролировать тело и мысли". {n}Кассия прикладывает
    руку к чуть сияющему {d|Encyclopedia:Ch3_CassiaAmuletLeft}артефакту под кожей{/d}.{/n}'
  speaker: Cassia Orsellio
- guid: 2fd11167-9ccb-458e-b44a-da411f7d3dde
  event: Companions_Navigator_117
  text: '"И все же вы не оставили меня во тьме, хоть и могли. Не лишили жизни, хоть ваше сердце и сжали антрацитовые тиски,
    а разум укутался в пунцовые сети". {n}Кассия отводит взгляд, стараясь прикрыть жгучий стыд всполохом растрепанных волос.{/n}'
  speaker: Cassia Orsellio
- guid: 79cc21b3-7c11-4e90-becd-2cc9c6be5c14
  event: Companions_Navigator_118
  text: '"О чем вы говорите, Лорд-капитан?"'
  speaker: null
- guid: cdda8caa-003b-4190-8bdb-47cf87ce4098
  event: Companions_Navigator_119
  text: '"Один из мудрейших экклезиархов сказал однажды, что все мы играем свои роли, незабвенно служа Императору. Иногда
    роли меняются, но вера — вера всегда остается" {n}Кассия чуть улыбается.{/n} "Слова Джай часто пестрили сомнительными
    красками, однако каждое произнесенное слово о Нем сияло белизной веры".'
  speaker: Cassia Orsellio
- guid: 425f9cc1-29ac-4802-a725-199d6454083c
  event: Companions_Navigator_12
  text: '"Как единственный глас династии на этом корабле — почту за честь. Покуда ваши вопросы учтивы, я отвечу на каждый
    из них".'
  speaker: null
- guid: 10297ca7-ab65-43dc-a6b6-d0fd17b184c3
  event: Companions_Navigator_120
  text: '"Вдобавок..." {n}Кассия медлит несколько секунд и отводит взгляд.{/n} "Мне известно, что низшие слуги Империума могут
    находить нашу внешность... отталкивающей. Ген {g|Encyclopedia:Navigator}навигатора{/g} искажает черты, привычные взору
    плебса, а величие нашей роли неподвластно их скудным умам..."'
  speaker: Cassia Orsellio
- guid: 3bf35f57-eafa-4a9e-857a-577948bfce99
  event: Companions_Navigator_121
  text: '"Это объясняет, почему чистые оттенки Сестры битвы были замутнены болотной жижей. Одна мысль о том, какие последствия
    имели ее деяния, приводит меня в ужас".'
  speaker: null
- guid: e83a37bc-2640-4469-92ad-4bef797b01cf
  event: Companions_Navigator_122
  text: '"Простите, Лорд-капитан. Я должна была узреть земельный оттенок предательства, скрипящий на ее зубах". {n}Кассия
    виновато поджимает губы.{/n} "Но цвета ксеносов такие... такие едкие. Разнообразие оттенков сводит с ума, стоит лишь задержать
    на них взгляд".'
  speaker: Cassia Orsellio
- guid: 09e90ddf-de29-483b-8352-ea34f79229f1
  event: Companions_Navigator_123
  text: '"Возможно ли словами описать счастье быть свободной?" {n}Кассия устало улыбается, осматривая раны, что сама себе
    нанесла.{/n}'
  speaker: Cassia Orsellio
- guid: 009ce164-cfd2-466f-a5e1-09dcee471643
  event: Companions_Navigator_123
  text: '"Возможно ли словами описать счастье быть свободной?" {n}Кассия прикладывает руку к месту, где {d|Encyclopedia:Ch3_CassiaAmuletBroken}еще
    недавно сиял артефакт{/d}, и мягко улыбается.{/n}'
  speaker: Cassia Orsellio
- guid: 617f6eb6-9cb5-488f-b074-d07408788bb0
  event: Companions_Navigator_124
  text: '"Вы дали мне сил сбросить с души гнет оков, насланных коварством Фелека. Разрушить темницу собственных страхов. И
    я желаю отплатить вам тем же". {n}Кассия протягивает руку к вашему лбу, останавливаясь на полпути.{/n} "Скинуть с плеч
    увядающий пурпур этого места. Разорвать удушающе-бурый ошейник... Если, конечно, вы мне позволите".'
  speaker: Cassia Orsellio
- guid: 16e3c768-0347-4928-99b0-fe39c92517fd
  event: Companions_Navigator_125
  text: '"Где-то посреди Темного города, я полагаю. Говорят, человеческому разуму не осознать границы сего места, ибо величайшие
    ульи Империума на его фоне кажутся песчинками. Попасть сюда можно лишь через древние эльдарские врата — Врата Паутины...
    Вы и сами понимаете, что это для нас значит".'
  speaker: null
- guid: c70510e8-649b-4a41-a8e2-601160df6a5c
  event: Companions_Navigator_126
  text: '{n}Кассия отдергивает руку, словно ошпаренная.{/n} "Простите, я думала, раз вы мне помогли... Н-не важно. Забудьте
    об этом".'
  speaker: Cassia Orsellio
- guid: 9a188f08-d105-4daf-8ef1-077b9cffd290
  event: Companions_Navigator_127
  text: '"Я подумала ровно о том же. Но разве подобное предположение не слишком безумно даже для навигатора? Или я просто
    схожу с ума, подобно негодным отпрыскам моего рода?" {n}Отчаяние сквозит в словах Кассии. Заглядывая вам в глаза, она
    словно ждет опровержение собственных опасений.{/n}'
  speaker: null
- guid: 112d0db8-21cc-4d64-b01b-ce044bdb27a7
  event: Companions_Navigator_128
  text: '"Тогда..." {n}Кассия облегченно выдыхает.{/n} "Тогда я приложу все усилия, дабы избавиться от этого проклятого наваждения".'
  speaker: Cassia Orsellio
- guid: 517a59a0-b41e-4861-9689-125e9bff2b0c
  event: Companions_Navigator_129
  text: '{n}Лицо Кассии кривится в секундной гримасе.{/n} "Я не желаю более продолжать эту тему".'
  speaker: null
- guid: db0d889b-ec4e-4172-ab7e-2e9c29e46854
  event: Companions_Navigator_13
  text: '"О да! Навигаторы Дома прибыли в {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g} относительно недавно — всего
    двести восемь лет назад. До того множество веков наши предки во славу Императора расширяли пределы владений Человечества,
    прокладывая маршруты в самые разные уголки галактики".'
  speaker: null
- guid: 852b6a0c-9c3b-4247-8f3f-d3ef5f4c63e5
  event: Companions_Navigator_130
  text: '"Вы весьма проницательны. Мой прародитель действительно проложил сей маршрут, спасаясь от врагов Человечества. Говорят,
    его вел сам {g|Encyclopedia:Emperor}Император{/g}, ибо {g|Encyclopedia:Warp}варп{/g} изверг судно без единой потери".
    {n}Кассия медлит, но тихо добавляет:{/n} "К сожалению, из уст тех, кто рассказывает эту версию истории, извергается ядовито-зеленая
    спесь. Я думаю, Калейн Орселлио просто был умелым навигатором".'
  speaker: Cassia Orsellio
- guid: 7e0447e3-d62a-4eef-a4eb-1956cc3fba1a
  event: Companions_Navigator_131
  text: '"Любовь моя, рядом с вами мой мир наполняется удивительным калейдоскопом красок". {n}Чарующая улыбка касается нежных
    губ.{/n}'
  speaker: null
- guid: 69de394d-8ed5-4233-a7c9-210abedb2f18
  event: Companions_Navigator_132
  text: '"Дому понадобится какое-то время на восстановление, но оставшись без главного Атласа... и своего главного страха
    — меня — кланы Дома смогут примириться вновь. Быть может, даже найдут способ вернуться на ту злосчастную планету посреди
    варп-шторма и уничтожить эльдарский камень... Или использовать его силу. Но я все же надеюсь, что Атлас Звездных Путей
    сгинет вместе с нынешним поколением навигаторов Дома Орселлио. И для нашего... их Дома наступит новая эра".'
  speaker: null
- guid: e9268358-44f9-4be4-a0d7-602e1257af11
  event: Companions_Navigator_133
  text: '"Н-нет? Нет, я так не думаю". {n}Кассия неуверенно мнется на месте, не находясь, что еще ответить.{/n}'
  speaker: Cassia Orsellio
- guid: 60b1dfb8-361e-45e5-80b9-bd7b2e6e56d9
  event: Companions_Navigator_134
  text: '"Разве же я могу отвечать за чувства и интенции другого человека?" {n}Кассия старается держаться безразлично, однако
    брови ее заинтригованно приподнимаются.{/n} "Но раз уж вы спросили... Я считаю, ваш друг должен осознать всю серьезность
    сего ритуала. Имморталиум — многогранный подарок, он не может означать что-то одно. Готов ли ваш друг принять все его
    стороны? Только одну? Или же... не принять вовсе?"'
  speaker: Cassia Orsellio
- guid: b5d84cf4-39a8-4266-b2ae-b6bc6098aff7
  event: Companions_Navigator_135
  text: '"П-правда?" {n}Кассия склоняет голову на бок и скромно улыбается, хоть в ее глазах вы и читаете легкое разочарование.{/n}
    "Ну а я в свою очередь с удовольствием принимаю вашу. И надеюсь, что особая связь между нами и нашими династиями продержится
    не одно столетие".'
  speaker: Cassia Orsellio
- guid: eee08553-f453-48fc-904c-fbb55a5649c1
  event: Companions_Navigator_136
  text: '"Если вам так угодно, Лорд-капитан".'
  speaker: null
- guid: a3e564b1-ba6a-4af7-b54e-ff643891d271
  event: Companions_Navigator_137
  text: '"Подарках?" {n}Кассия быстро отводит взгляд и сцепляет пальцы в замок.{/n} "Что вы имеете в виду?"'
  speaker: Cassia Orsellio
- guid: c80c87e8-4341-45bf-bbb0-285bf0a3533b
  event: Companions_Navigator_138
  text: '"Тогда, по правилам ритуала, ему следует преподнести в ответ дар не менее ценный по вкладу душевному или материальному.
    И если вам... вашему другу интересно, традиции требуют делать это через третье лицо. Таким образом даритель и одариваемый
    сохраняют баланс в отношениях".'
  speaker: null
- guid: 7d4daf7d-8c1b-4e1f-91e7-5d19fb216e2c
  event: Companions_Navigator_139
  text: '"Вы... не знаете, что такое имморталиум?" {n}Кассия чуть разочарованно склоняет голову.{/n} "У него существует и
    другое название — "бессмертный цветок". Живое растение, способное столетия обитать в пустоте космоса. Это... символ начала
    и старинный ритуал. Отправная точка, в которой зарождаются отношения двух особ, отличные от вежливого безразличия".'
  speaker: Cassia Orsellio
- guid: 88299657-6b7e-4f37-814c-903611e3ede9
  event: Companions_Navigator_14
  text: '{n}Девушка резко втягивает воздух, между бровей на секунду возникает морщинка.{/n} "Жизнь дана {g|Encyclopedia:Navigator}навигатору{/g}
    лишь для служения Дому. Каждый вздох, каждое слово, каждое деяние наше — во благо и преуспеяние его. Взирая на меня, не
    видя Дома, вы видите лишь тень преходящего. Если вам важно лишь это — спрашивайте".'
  speaker: null
- guid: 6a3eb954-e969-4a60-8a57-54edce221e93
  event: Companions_Navigator_140
  text: '"Одна из граней имморталиума есть предложение дружбы. Если ваш друг намерен принять лишь ее, по традиции он должен
    обозначить это в личной беседе с дарителем".'
  speaker: null
- guid: 8cc9b075-e946-4e7b-b526-2b269a616dbb
  event: Companions_Navigator_141
  text: '"В таком случае традиции велят ему сохранить дар в знак уважения к акту инициации ритуала. В остальном же ваш друг
    должен игнорировать произошедшее. Порой бездействие... красноречивее любого отказа".'
  speaker: null
- guid: 3933d5f1-9571-44fc-991b-c31321b4c03d
  event: Companions_Navigator_142
  text: '"Что вы, конечно, нет!" {n}Кассия почти вскрикивает, но тут же смущенно отводит взгляд.{/n} "Имморталиум — это символ
    начала. Отправная точка, в которой зарождаются отношения двух особ, отличные от вежливого безразличия. Пока что это лишь
    семя, которое вашему другу предстоит взрастить. А вырастет из него ядовитый плющ или прекрасный цветок — покажет лишь
    время".'
  speaker: Cassia Orsellio
- guid: 49a90a89-d548-490a-a388-16d9d7d52b30
  event: Companions_Navigator_143
  text: '{n}Леди-Навигатор загадочно щурится.{/n} "Я бы выбрала то, что вызывает у одариваемого особый отклик в душе. То,
    о чем он или она часто говорит... или мечтает".'
  speaker: null
- guid: 2e8145f5-3cf8-4ab1-89fa-ef7922d4679c
  event: Companions_Navigator_144
  text: '"Я вижу эмоции людей в пестрых оттенках, что окружают их естество, Лорд-капитан. И все понимаю. Однако же мне пришлась
    по нраву эта игра. Надеюсь... и вам тоже".'
  speaker: null
- guid: 8ca23ef4-3cc0-486c-a8e3-9de400cdf6da
  event: Companions_Navigator_145
  text: '"Простите, {name}, но та ночь... никак не выходит из головы. Мне нужно еще немного времени, чтобы собраться с мыслями.
    Прошу, не торопите меня столь настойчиво".'
  speaker: null
- guid: 6a9fb8d4-4858-447a-b2fa-e60a908e1224
  event: Companions_Navigator_146
  text: '"Мой скромный дар пришелся вам по душе?" {n}Кассия сдержано улыбается, заметив сияющий кулон на вашей шее.{/n} "Я
    рада".'
  speaker: Cassia Orsellio
- guid: 7417f677-f756-48a0-a9d7-a94b27678923
  event: Companions_Navigator_147
  text: '"Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна". {n}Кассия горько смеется.{/n} "Не
    волнуйтесь, Вольный Торговец, мой Дом более не доставит вам проблем. Как вы и сказали — мой Атлас отныне стал моим же
    щитом".'
  speaker: Cassia Orsellio
- guid: 1bc48daa-e21e-45d2-b7fb-a5d50b20fffd
  event: Companions_Navigator_148
  text: '{n}Кассия тепло улыбается и чуть опускает ресницы.{/n} "Разве могла я отказаться от свободы? И шанса пройти уготованный
    мне судьбою путь вместе с вами?"'
  speaker: Cassia Orsellio
- guid: a84f17c5-dfea-4a04-9c92-11e80a9741be
  event: Companions_Navigator_149
  text: '{n}Кассия понимающе улыбается.{/n} "В таком случае, Лорд-капитан, я бы хотела провести немного времени наедине. И
    обдумать... случившееся".'
  speaker: Cassia Orsellio
- guid: afc8a9ed-7a76-4ef8-beea-7f9710596b95
  event: Companions_Navigator_15
  text: '"Мне было приятно ваше общество, {name}. Благодарю за беседу".'
  speaker: null
- guid: a58322c9-664d-40ae-a514-499ddfa1284d
  event: Companions_Navigator_150
  text: '{n}Неловко ускользая взглядом, Кассия скрывает залитое румянцем лицо за пологом серебристых волос.{/n} "Я... С вашего
    позволения, Лорд-капитан, я бы хотела провести немного времени наедине. И обдумать... случившееся".'
  speaker: null
- guid: b334096b-789f-4dcb-b7eb-dd066b5f55b5
  event: Companions_Navigator_151
  text: '{n}Когда прохладная ладонь Леди Кассии согревается в ваших руках, девушка неловко высвобождает ее, стараясь не задеть
    вас острыми когтями.{/n} "Я... С вашего позволения, Лорд-капитан, я бы хотела провести немного времени наедине. И обдумать...
    случившееся".'
  speaker: null
- guid: caff9647-e023-44a9-8a39-ccd6e28e92aa
  event: Companions_Navigator_152
  text: '"Прямо... здесь? Вы уверены?" {n}Кассия смущенно оглядывается по сторонам.{/n}'
  speaker: Cassia Orsellio
- guid: 34349497-5160-4069-8c8b-390c970a8a9f
  event: Companions_Navigator_153
  text: '"Для нас? Или же для вас, {name}?" {n}Гордо поведя плечом, Кассия устремляет взгляд рубиновых глаз прямо на вас.{/n}
    "Я что же, была для вас просто игрушкой?"'
  speaker: null
- guid: 9dac79fd-77cb-4a6e-add7-e44406e9d266
  event: Companions_Navigator_154
  text: '"Вы не впервые мне об этом говорите. Будь то жестокая шутка или сомнения вашей души, в этот раз я не стану спасать
    то, что от нас осталось". {n}Кассия отворачивается, и тоска тяжелым камнем обрушивается на ваши плечи.{/n} "Уходите. Я
    не желаю видеть вас прямо сейчас. Может, позже мы снова поговорим".'
  speaker: Cassia Orsellio
- guid: 95943359-1ba3-41de-91b9-93c23c097112
  event: Companions_Navigator_156
  text: '"Предупреждаю вас, Лорд-капитан. Следующая шутка может стать последней".'
  speaker: null
- guid: ee0b302f-80cd-456f-87e7-cea8f28a0801
  event: Companions_Navigator_157
  text: '{n}Кассия смущенно отводит глаза.{/n} "Мне немногое ведомо о том, как... сходятся обычные пары. Книги, которые я
    читала, обходили эту сторону жизни молчанием. Быть может, стихотворение, идущее от сердца? Впрочем, не уверена, что Джай
    любит стихи".'
  speaker: Cassia Orsellio
- guid: c6a0eb3f-95e4-4029-b9ab-1897a145205d
  event: Companions_Navigator_158
  text: '"Я... понимаю". {n}Рубиновые глаза сияют еще ярче в обрамлении едва сдерживаемых слез.{/n} "Вижу, как ваши цвета
    рядом со мной тускнеют". {n}Девушка опускает взгляд.{/n} "Уходите. Позвольте мне побыть в одиночестве".'
  speaker: null
- guid: ef0ba736-b9e4-4892-a5f1-ffa9a037e2ac
  event: Companions_Navigator_159
  text: '"Конечно. От личных дел к делам насущным".'
  speaker: null
- guid: 9cbaa882-0f39-4c6f-88e8-c994322fcf53
  event: Companions_Navigator_16
  text: '"Отнюдь. Согласно хроникам Дома, я родилась на одном из миров Орселлио. Вирт... Иртви... О, как же..." {n}Кассия
    растерянно потирает висок.{/n} "Прошу меня простить, Лорд-капитан, воспоминания о детстве слишком расплывчаты. Иногда
    во сне я вижу пестрых птиц, что гнездились в саду. Или слуг в пурпурных ливреях. Или синий туман, что стелился над низиной
    за нашим дворцом... Но все подернуто розовой дымкой — быть может, эти картины рисует мое воображение, а не истинная память".'
  speaker: Cassia Orsellio
- guid: e7792c14-5b6a-4696-a6f1-f37056cff851
  event: Companions_Navigator_160
  text: '"Ах {name}". {n}Кассия загадочно улыбается.{/n} "Будете слишком часто приглашать меня на "литературные" вечера, и
    слуги быстро поймут, что к чему".'
  speaker: Cassia Orsellio
- guid: af98ede3-d3f9-45e0-98db-edc0f5b1af89
  event: Companions_Navigator_161
  text: '{n}Горячее дыхание почти обжигает вашу кожу.{/n} "Заниматься подобным у всех на глазах... неприемлемо". {n}Кассия
    не отстраняется, лишь склоняет голову набок, позволяя прильнуть к ее нетерпеливым губам.{/n}'
  speaker: Cassia Orsellio
- guid: d077e844-5262-4b0c-b44a-c9f418684778
  event: Companions_Navigator_162
  text: '{n}Скулы Кассии обдает жаром предательского румянца.{/n} "Дозволяю, Лорд-капитан".'
  speaker: null
- guid: ab522583-3edd-4691-beb7-3d4cb26df118
  event: Companions_Navigator_163
  text: '{n}Кассия растерянно хмурится.{/n} "Ах, вот оно что... Прошу прощения, я поняла вас превратно".'
  speaker: Cassia Orsellio
- guid: 691df4c9-d180-4b62-8f75-0aaa88235706
  event: Companions_Navigator_165
  text: '"Вот как..." {n}Кассия вскидывает чуть дрожащий подбородок, и сложная гамма чувств отражается в ее алых глазах.{/n}
    "По правилам этикета вы не должны сообщать мне об этом лично. Так я хотя бы могла сохранить лицо".'
  speaker: Cassia Orsellio
- guid: 2da52b80-a5d8-4168-8b6d-57813ab587e3
  event: Companions_Navigator_166
  text: '{n}Девушка отводит взгляд и с достоинством поправляет налобное украшение.{/n} "С вашего позволения, я бы хотела провести
    немного времени наедине".'
  speaker: null
- guid: b4123efb-2af5-4bca-af6f-a91a1f6b1cae
  event: Companions_Navigator_167
  text: '"Кибелла омыта ярким, как свежая кровь, багрянцем, и он лишь пронзительнее из-за объятий непроницаемой тьмы. Но эти
    тяжелые тени не таят в себе зла — они бесстрастны, мрачны, строги... и неумолимо поглощают слабые вспышки иных красок".'
  speaker: null
- guid: ce63bc64-3840-4434-990a-80759305b52b
  event: Companions_Navigator_168
  text: '"Полотно души Кибеллы превратилось в поле боя: я вижу, как всполохи ядовито-зеленых сомнений порождают все новые
    краски сожалений, гордости и жестокости. Они разрушают прежнюю антрацитово-алую палитру, смешиваясь во все более мутные
    и пугающие цвета".'
  speaker: null
- guid: 5ef30a0e-9a32-4dd8-878d-e2848d4722eb
  event: Companions_Navigator_169
  text: '"Вот и вы, Лорд-капитан". {n}Как только вы подходите ближе, горклый привкус разочарования проявляется на языке, сводя
    скулы.{/n} "{d|Encyclopedia:MiniJealousyRomanceBroken}Слышала, вы связали себя{/d}… определенными узами с другим членом
    свиты. Жаль, что вам не хватило духу прежде поставить точку в наших отношениях. Я бы… все поняла". {n}Кассия приподнимает
    подбородок, и дрожь в ее голосе отступает.{/n} "Но давайте оставим прошлое в прошлом. Чем навигатор может служить своему
    капитану?"'
  speaker: Cassia Orsellio
- guid: 67b18141-17db-4805-99e6-24090b9047be
  event: Companions_Navigator_17
  text: '"В артефакте гемункула была лишь непроглядная тьма, но улицы Темного города не намного светлее — я почти слепну от
    боли в его иссиня-черной дымке". {n}Кассия хмурится, рассматривая пляшущие в углах тени.{/n} "Сгустки бурого и темно-зеленого
    смешиваются с оседающим пеплом отчаяния, вплетаясь в гобелен из всех оттенков тьмы".'
  speaker: Cassia Orsellio
- guid: b64ab0fc-9f7d-47c0-a327-d99a5593c196
  event: Companions_Navigator_18
  text: '"Вы... правы. Было бы эгоистично и слишком непочтительно к обеим нашим династиям поступить иначе. Я передам приглашение
    Дому". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n}'
  speaker: Cassia Orsellio
- guid: 95b874da-5724-47ab-8f7f-9a2b4fdc9592
  event: Companions_Navigator_19
  text: '"Как во главе протектората стоит {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}, так навигаторским Домом заправляет
    великий {g|Encyclopedia:Novator}новатор{/g}. Именно новатор решает, с кем заключать союзы и какой путь уготован его династии.
    В нашем Доме..." {n}Губы девушки едва заметно кривятся.{/n} "...сейчас происходит передача власти преемнику, а стабильность
    Дома поддерживает Великий Регент Ааронто Орселлио".'
  speaker: null
- guid: c11e1b67-5bbc-4124-9b47-8ff812447be5
  event: Companions_Navigator_20
  text: '"{name}? Как славно, что вы почтили меня своим присутствием. Я как раз вспоминала путешествие во дворец Атласа...
    Точнее, к миру ксеносов". {n}Кассия прикрывает рот ладонью и тихо смеется.{/n} "Воспоминания о столь отчаянном поступке
    окутали мой разум гаммой оттенков. Но когда я думаю, сколь многим ради меня и Дома Орселлио рискнули вы — лазурная шаль
    сразу же окутывает плечи, а в душе загораются всполохи янтаря. Прошу, примите мою искреннюю благодарность".'
  speaker: Cassia Orsellio
- guid: f7aea799-8141-4d60-b966-cf06be607e7a
  event: Companions_Navigator_21
  text: '"Вокруг вас сгустились бурые тучи. Они несут былую боль. И... сомнения?" {n}Словно в трансе Кассия тянется к вашему
    плечу и едва касается его кончиками пальцев. Странное облегчение нисходит на вас — словно легкие полностью раскрылись,
    и вы впервые за долгое время можете вдохнуть полной грудью. Заметив ваше выражение, девушка испуганно одергивает руку.{/n}'
  speaker: null
- guid: fb94676e-6a75-4d6e-9c70-4b9c93a8bf6c
  event: Companions_Navigator_22
  text: '{n}Кассия касается нагрудника в области Атласа.{/n} "{d|Encyclopedia:CassiaQ2_NaviClearSoulstone}Силами Дома Орселлио{/d}
    души наших предков освободились из оков артефакта ксеносов. Их память и мудрость послужат Дому, позволив возвести на руинах
    настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный свет Императора".'
  speaker: Cassia Orsellio
- guid: 771b046c-f8a4-455d-a054-6fe86070a69c
  event: Companions_Navigator_23
  text: '{n}Кассия касается нагрудника в области Атласа.{/n} "{d|Encyclopedia:CassiaQ2_HarlequinsClearSoulstone}Ксеносам удалось
    освободить наших предков{/d} из заточения в Камне Душ. Память и мудрость тех, кто был до нас, послужат Дому, позволив
    возвести на руинах настоящего крепкий фундамент для будущих поколений. Я верую в это так же, как верую в божественный
    свет Императора".'
  speaker: Cassia Orsellio
- guid: 29f6ed0d-794e-46d5-9cae-3d081b070522
  event: Companions_Navigator_24
  text: '"Свобода и созидание". {n}Отчего-то голос Кассии полнится печалью.{/n} "Будущим поколениям Дома Орселлио придется
    вновь {d|Encyclopedia:CassiaQ2_BrokenAtlas}положиться на собственные силы и благородную кровь{/d}, позабыв о проклятой
    мощи ксеноартефакта. Изнурительный труд, но подданные это понимают. Мы... справимся".'
  speaker: null
- guid: ae37eea4-0629-4f56-aec6-dda48fbf1dbb
  event: Companions_Navigator_25
  text: '"Предатели в рядах Дома не смирятся так просто с {d|Encyclopedia:CassiaQ2_SavedAtlas}решением оставить Атлас{/d}.
    Тем более теперь, когда правду о его создании уже невозможно скрыть — все же навигаторы Орселлио связаны со мной, ну а
    я связана с ними". {n}Кассия касается нагрудника в области Атласа.{/n} "И все же я не оставлю попыток объединить Дом.
    Пока раскол истощает нас изнутри, представители прочих династий Навис Нобилите захотят разорвать нас на части. Но я им
    этого не позволю".'
  speaker: Cassia Orsellio
- guid: 4b09f169-656c-4a37-b24f-297a9a363f38
  event: Companions_Navigator_26
  text: '{n}Кассия опускает руку, стараясь скрыть разочарование.{/n} "Конечно. Я более никогда не перекрашу ваши цвета против
    воли".'
  speaker: Cassia Orsellio
- guid: 874dad17-9287-499b-b03c-5ef47d2221dd
  event: Companions_Navigator_27
  text: '"Так... так ведь гораздо лучше, не правда ли?"'
  speaker: null
- guid: 0217118d-54a9-472d-a53f-d368856ee35c
  event: Companions_Navigator_28
  text: '"Об остальном не беспокойтесь — я есть кровь Дома Орселлио. Его наследница. И я справлюсь с любыми потрясениями,
    лишь бы вернуться обратно в Простор".'
  speaker: null
- guid: 1f3aafd6-da4a-4d72-8e6a-b70c431de252
  event: Companions_Navigator_29
  text: '"Разумеется. Я постараюсь ответить на все ваши вопросы".'
  speaker: null
- guid: 801ebfd1-0f78-4f95-bf69-2f3191846154
  event: Companions_Navigator_30
  text: '"В отличие от остальных, ее образ начал проявляться все четче — утонченные черты старческого лица, длинные белые
    волосы, горящие алым глазницы... и третье око. Око навигатора". {n}Плечи Кассии содрогаются от нахлынувших воспоминаний.{/n}
    "Однажды старуха сорвалась с места и принялась душить меня прямо во время варп-перелета! Слава милости Его, в тот момент
    мне удалось прогнать ее на задворки сознания. Однако старуха лишь обозлилась".'
  speaker: null
- guid: ae29fdce-76c6-40be-94a3-0c0e5c09e021
  event: Companions_Navigator_31
  text: '"Я стала все чаще видеть ее в тенях, на краю зрения, в собственном отражении... И во тьме клетки гемункула меня поджидала
    именно она — я это точно знаю!" {n}Кассия обреченно вздыхает, прикрывая глаза ладонью.{/n} "Теперь... вы знаете мою последнюю
    тайну, Лорд-капитан. Думаете, я схожу с ума?"'
  speaker: Cassia Orsellio
- guid: 4a593d3d-8577-4cf3-bd2d-ea8f2b9bd6cb
  event: Companions_Navigator_32
  text: '{n}Кассия неуверенно качает головой.{/n} "У меня есть предположение. Но оно слишком... слишком безумное даже для
    меня".'
  speaker: Cassia Orsellio
- guid: eb38ada6-d089-4d17-b51f-7a33191efd44
  event: Companions_Navigator_33
  text: '"Она — это я, Лорд-капитан". {n}Взгляд Кассии устремляется в сторону, словно ожидая вашего осуждения.{/n}'
  speaker: null
- guid: 344e62ed-1146-4dde-8b3c-8c1dad902965
  event: Companions_Navigator_34
  text: '"Я бы не раскрыла сию тайну чужаку, но вы, {name}... уже не раз меня выручали". {n}Кассия прикрывает глаза и касается
    нагрудника в области сердца.{/n} "Атлас Звездных Путей есть священный артефакт Дома Орселлио — он помогает нашим навигаторам
    прокладывать маршруты сквозь {g|Encyclopedia:Warp}варп{/g}. Сколько я себя помню, кристалл... то есть Атлас... всегда
    был во мне. Придавал мне сил. Но другие... Я заметила, как предателей во дворце душили пепельные призраки отчаяния, когда
    мы встретились лицом к лицу. Могу поклясться, призраки тянулись к их собственным Атласам".'
  speaker: Cassia Orsellio
- guid: 972ce4ff-bfd0-4013-ae13-d22ed1f9c710
  event: Companions_Navigator_35
  text: '"Позволить артефакту Фелека и дальше сдерживать силы было разумным решением. Я больше... не желаю никому вредить".'
  speaker: null
- guid: 7b2ada16-a2db-4c16-b928-98e66e38240f
  event: Companions_Navigator_36
  text: '"Друкари Маражай..." {n}Плечи Кассии непроизвольно вздрагивают.{/n} "Оттенки эльдаров всегда слишком яркие, дурманящие
    сознание... Но у этого ксеноса вместо сердца я вижу лишь клубящуюся тьму. Нет, тысячи ее оттенков! От аспидно-черного
    тумана до полночной темноты беззвездного неба. Я... предпочитаю не заглядывать в сумрак его цветов, ибо боюсь, Лорд-капитан,
    что он поглотит меня без остатка".'
  speaker: null
- guid: 35aa4d15-31ec-425a-bc15-b7be13494724
  event: Companions_Navigator_37
  text: '"И пусть мои глаза кровоточат от его сияния, я вижу, как Ирлиэт растворяется в белизне скорби при разговорах о доме.
    И как пунцовые всполохи накаляются в воздухе при упоминании о ее предательстве".'
  speaker: null
- guid: b2302ba3-5039-4dfd-9599-50a80050005b
  event: Companions_Navigator_38
  text: '"Прошу, не здесь",{n} — почти шепчет Кассия. —{/n} "Разве дворянам не положено обсуждать подобные вещи вдали от слуг?"'
  speaker: null
- guid: bc23cf67-18c4-44fc-8968-c570d57947b8
  event: Companions_Navigator_39
  text: '"Мое пребывание на станции было посвящено неустанной подготовке к исполнению моего долга. Астромансия, астрография,
    нумерология, история Дома и {g|Encyclopedia:Imperium}Империума{/g}, и множество других дисциплин — много лет десятки наставников
    готовили меня к тому, что предназначено судьбой. А единожды в год на станцию прибывал Великий Регент Ааронто. Он передавал
    под мое управление свое прекрасное судно, чтобы помимо теории я могла овладеть и практическими аспектами нашего искусства".'
  speaker: null
- guid: e8617dc6-8506-479e-96d3-4096b176aa8d
  event: Companions_Navigator_40
  text: '"Раз уж об этом зашла речь, Лорд-капитан — почему вы не следуете этой доброй традиции? На ваших палубах столь пестро...
    я хотела сказать — шумно. Чернь не только разговаривает, но иногда еще и кричит или поет. Зачем вы дозволяете подобную
    разнузданность? Разве {g|Encyclopedia:RogueTrader}Вольные Торговцы{/g} не благородных кровей?"'
  speaker: null
- guid: b2aa9df2-91a2-4787-935f-c3354c552d63
  event: Companions_Navigator_41
  text: '"Жизнью? О, если бы вы могли оказаться на моем месте и наблюдать этот калейдоскоп..." {n}Кассия устало прикрывает
    глаза.{/n} "Каждый голос — вспышка цвета. Каждый диалог — мерцающее сияние. Каждая ссора — безудержное мельтешение пестрых
    пятен..."'
  speaker: Cassia Orsellio
- guid: 9a80414f-7006-4ab8-b0a4-2ed3d0e52712
  event: Companions_Navigator_42
  text: '"Возможно, сейчас вид мой не внушает вам ужас, однако когда-нибудь это изменится. Ген {g|Encyclopedia:Navigator}навигатора{/g}
    нестабилен — со временем мое тело будет меняться. И как именно — ведомо, быть может, лишь {g|Encyclopedia:Emperor}Богу-Императору{/g}..."
    {n}Кассия с неподдельным испугом прижимает пальцы к губам, словно запоздало останавливая вырвавшиеся слова.{/n}'
  speaker: Cassia Orsellio
- guid: c4191e6f-ecd1-4259-bb17-a82ea7ba42be
  event: Companions_Navigator_43
  text: '"Отчего же? Вас смущает необходимость оставаться со мной наедине?"'
  speaker: null
- guid: 91185c1b-83e8-4ea1-a210-d9e10c9d7184
  event: Companions_Navigator_44
  text: '{n}Кассия удивленно моргает — вопрос явно застал ее врасплох.{/n} "Однажды регент подарил мне птицу с солнечной планеты.
    Я пыталась с ней подружиться и заставить петь, но она почему-то не хотела и быстро умерла. Наставники слишком уважали
    мой долг перед Домом, чтобы тратить драгоценное время на досужие разговоры. Помимо них на станции были лишь слуги, но
    им же вырезают голосовые связки, чтобы не нарушали обет безмолвия".'
  speaker: Cassia Orsellio
- guid: 9291eda7-3836-441d-9445-a9cb28de9b53
  event: Companions_Navigator_45
  text: '"{name}, какая удача, что вы пришли! Признаться, я и сама искала встречи. После событий на Даргонусе... мои плечи
    окутала антрацитово-серая мантия. Я долго размышляла о нашей первой встрече и о том, что произошло после. Не терпится
    сбросить этот утомительный цвет".'
  speaker: null
- guid: d4bdae72-3957-4603-b756-ccc0f9c584d7
  event: Companions_Navigator_46
  text: '"Обо мне?" {n}Кассия чуть склоняет голову.{/n} "Что ж, это возможно. Что вам угодно узнать?"'
  speaker: Cassia Orsellio
- guid: 56f319a3-1799-45a9-9e04-a988dfcc3571
  event: Companions_Navigator_47
  text: '"Но все изменилось, когда я подобрала свой ключ к этой тайне. Видите ли, всю свою жизнь я скрашивала редкие минуты
    свободного времени живописью — если вы помните, в моих палатах была мастерская. Стоило мне представить варп в виде пустого
    холста, как меня захлестнуло неописуемое чувство... я водила кистью, погружаясь все глубже в собственную картину. В переливах
    красок мне мерещились образы — и что-то внутри подсказывало, на какой стоит откликнуться, а который оставить позади. Я
    очнулась спустя несколько дней — когда переход был благополучно завершен".'
  speaker: null
- guid: 19b0fe18-4fd8-4dd0-bada-b90c17c7e722
  event: Companions_Navigator_48
  text: '"Я не стыжусь своей внешности! И мне не нужно чье-либо одобрение!" {n}Кассия отводит взгляд, но заметно расслабляет
    плечи и скулы.{/n}'
  speaker: Cassia Orsellio
- guid: c185d781-af5a-40e7-8aed-2227f0d3cfdb
  event: Companions_Navigator_49
  text: '"Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как наивно вверилась вам. И все
    же... Наше с вами сотрудничество помогает сдерживать не только врагов Дома Орселлио, но и моих собственных людей. Немногие
    осмелятся открыто выступить против Навигатора Вольного Торговца. Так что... Пожалуй, я продолжу и далее править ваш корабль
    сквозь Океан Душ — пока судьба ведет нас одним путем".'
  speaker: null
- guid: 321f4d3a-d768-4305-8847-030d3f7b1acd
  event: Companions_Navigator_50
  text: '{n}Кассия осекается, бледные щеки розовеют смущенным румянцем.{/n} "Вы преступаете границы приличий, Лорд-капитан!"'
  speaker: Cassia Orsellio
- guid: 8fbebbe0-0ff4-4930-abd6-29753df52eb0
  event: Companions_Navigator_51
  text: '"Не смею препятствовать".'
  speaker: null
- guid: c4cd94d9-b446-49dc-87f2-8e34bb835cee
  event: Companions_Navigator_52
  text: '"Как же наивно я ступала по стопам человека, взрастившего меня в золотой клетке. И как глуха была к нуждам собственного
    Дома. Но вы — вы раскрыли мне глаза. Как будущий {g|Encyclopedia:Novator}новатор{/g} я обязана набраться мудрости, дабы
    вернуть Дому Орселлио былое могущество. И неважно, какой будет цена". {n}Кассия касается места, куда инкрустирован Атлас.{/n}
    "Благодарю. И почту за честь и далее править ваш корабль сквозь Океан Душ — пока нужды наших династий ведут нас одним
    путем".'
  speaker: Cassia Orsellio
- guid: cd315d06-49a8-49fd-9486-56a27407cdd0
  event: Companions_Navigator_53
  text: '{n}Кассия медленно кивает.{/n} "Отверстое око {g|Encyclopedia:Navigator}навигатора{/g} несет погибель для каждого,
    кто будет озарен пагубным сиянием {g|Encyclopedia:Warp}варпа{/g}, и потому есть символ нашего могущества. Мы — путеводные
    звезды Человечества, удостоенные особого дара, и одна из обязанностей, что вменяют нам — оберегать свое око даже от сторонних
    взглядов, что могут нести зло".'
  speaker: Cassia Orsellio
- guid: 2881f25e-e0b4-4f0f-b81d-b41e87804f2d
  event: Companions_Navigator_54
  text: '{n}Кассия благосклонно кивает.{/n} "Уверена, вы скорейшим образом исправите этот недочет".'
  speaker: Cassia Orsellio
- guid: 2ca37bc2-53dd-4bed-a08e-4bacbf827c5e
  event: Companions_Navigator_55
  text: '"Я — часть Дома Орселлио, древней династии {g|Encyclopedia:NavisNobilite}Навис Нобилите{/g}. Испокон веков наш род
    служил во благо познания, раздвигая пределы безвестной мглы. В Атласе Звездных Путей хранятся две тысячи восемьсот сорок
    три маршрута, охватывающих сектора Сегментум Обскурус и простирающихся от {g|Encyclopedia:KoronusExpanse}Простора Коронус{/g}
    до {g|Encyclopedia:HolyTerra}Святой Терры{/g}..."'
  speaker: null
- guid: 93abfdad-cbca-4626-9718-4053edeb0327
  event: Companions_Navigator_56
  text: '{n}Девушка растерянно замирает.{/n} "Ваши слова звучат... удивительно кощунственно. Если долг правителя диктует необходимость
    насилия, разве не является обязанностью отправление его? Я поразмыслю над вашим ответом в уединении".'
  speaker: null
- guid: bc4fd9a8-0140-41d6-a073-ba7e5ef51b3e
  event: Companions_Navigator_57
  text: '{n}Кассия виновато хмурится.{/n} "Прошу меня простить, Лорд-капитан. Я была уверена, что это — святая традиция, скрепленная
    древними обетами повиновения... Вероятно, это не первый сюрприз, что ожидает меня за стенами Эурак-V".'
  speaker: Cassia Orsellio
- guid: e54107b7-6f74-48eb-b9ba-763c9f9149ee
  event: Companions_Navigator_58
  text: '"И, наконец, мое злоключение окончится..." {n}Навигатор облегченно вздыхает.{/n} "Прощайте, Вольный Торговец. Надеюсь,
    наши пути не пересекутся боле".'
  speaker: null
- guid: 4734e241-ee40-4aa4-9df2-e17c7078b531
  event: Companions_Navigator_59
  text: '"Что вы хотите этим сказать? Считаете, потомок великого Дома Орселлио скверно справляется с обязанностью править
    ваш корабль сквозь Океан Душ?"'
  speaker: null
- guid: 945a61eb-0727-4a53-8a03-fc9a2fb08c07
  event: Companions_Navigator_60
  text: '"Что ж. В любом случае... Благодарю вас за наши совместные странствия. Бесценный опыт, что мне удалось приобрести,
    я обязательно пущу на благо Дома Орселлио". {n}Девушка медлит пару секунд.{/n} "Надеюсь, однажды мы встретимся вновь".'
  speaker: null
- guid: d0dad52f-9272-4aa1-bb55-e76deb66cc08
  event: Companions_Navigator_61
  text: '"Сотрудничестве?" {n}Кассия презрительно кривится.{/n} "Вы {d|Encyclopedia:Ch1_CassiaTakenByForce}обязали меня служить{/d}
    на сем корабле под страхом смерти. А теперь избавляетесь, как от наскучившей игрушки?"'
  speaker: Cassia Orsellio
- guid: b568b60b-db34-4db6-8e77-fe3265ca7fb3
  event: Companions_Navigator_62
  text: '"Прошу... Прошу простить мне подобное поведение, {name}. Когда я вижу столь тяжелые цвета, мне сразу хочется их перекрасить.
    Разогнать. Я уже говорила, что не в силах это контролировать, просто... Почему-то именно сейчас мне показалось, что все
    получится".'
  speaker: null
- guid: 1a88f76b-c5eb-4606-8328-bc56388c4141
  event: Companions_Navigator_63
  text: '"Я... приношу глубочайшие извинения, Лорд-капитан. Я не желала вам навредить или оскорбить. Подобное более не повторится".'
  speaker: null
- guid: c53b1c5b-111f-4fcd-96e4-a1cbc191e227
  event: Companions_Navigator_64
  text: '"Слишком... много красок. Цвета пестрят, перебивают друг друга, сливаются в единую волну. Она вот-вот захлестнет!.."
    {n}Леди-Навигатор прикрывает глаза руками, словно от света палящей звезды.{/n} "Простите, но сейчас я не в силах утолить
    ваш интерес. Быть может, позже".'
  speaker: null
- guid: 4f774048-9198-4e9f-ab07-feac1caf55d5
  event: Companions_Navigator_65
  text: '"Вы?" {n}Кассия удивленно моргает, а затем о чем-то задумывается.{/n} "Будьте столь любезны, Лорд-капитан".'
  speaker: Cassia Orsellio
- guid: 32915b21-4599-49c8-9582-31f1ddb2fee9
  event: Companions_Navigator_66
  text: '"Читать цвета ксеносов для меня мучительное испытание. Слишком... больно зрить неисчерпаемую палитру красок, что
    источает Ирлиэт. Ее оттенки яркие, ослепляющие, неестественные... И очень, очень опасные, Лорд-капитан. Я бы никогда не
    доверилась существу, столь явно кричащему о своей чуждости человеческому восприятию".'
  speaker: null
- guid: 2cd2e43d-6d22-43e9-96ea-f921d4df72ae
  event: Companions_Navigator_67
  text: '{n}Кассия взволнованно прикрывает ладонью рот.{/n} "Я... сделала что-то не так? Глупый вопрос, конечно, я сделала
    что-то не то. Вновь. Вы правы, мне лучше вернуться в лоно дома и продолжить свое обучение... Прощайте".'
  speaker: Cassia Orsellio
- guid: 505db81c-bfa3-43d6-a53b-54fe01a21ca7
  event: Companions_Navigator_68
  text: '"{name}!" {n}Сдержанно улыбаясь, Кассия взмахивает рукой в знак приветствия.{/n} "Словами не передать, как тоскливо
    на мостике без наших высоких бесед".'
  speaker: null
- guid: 36ad9b17-e600-4c73-b5e0-12ed1f846fdc
  event: Companions_Navigator_69
  text: '{n}Несколько секунд Кассия испытующе смотрит вам в глаза, затем коротко кивает и отводит взгляд.{/n} "Какой разговор?"'
  speaker: null
- guid: 58938003-a873-4f5e-b817-ec76c2cc9114
  event: Companions_Navigator_70
  text: '{n}Кассия коротко кивает.{/n} "А мой Атлас... намного сильнее прочих. Атлас самой Тисифоны — так всю жизнь шептались
    за моей спиной, хоть наверняка никто и не знал. А я... всегда подозревала. Просто не хотела признаваться самой себе".'
  speaker: Cassia Orsellio
- guid: 94634c48-82ed-469a-9c84-bff005808e8f
  event: Companions_Navigator_71
  text: '{n}Кассия улыбается — намного ярче и теплее, чем обычно.{/n} "Я благодарна судьбе, что у меня есть {mf|друг|подруга},
    с котор{mf|ым|ой} я могу делиться своими мыслями".'
  speaker: Cassia Orsellio
- guid: 7721cf94-3b3b-45d4-933a-09e7ec4ecf81
  event: Companions_Navigator_72
  text: '"Некоторые навигаторы моего Дома не раз пытались меня убить!" {n}Серебристые брови девушки гневно хмурятся, затем
    она печально вздыхает.{/n} "Однако истории о жестокости Тисифоны... Я начинаю думать — а что, если все они правдивы? И
    я стану для своих подданных новым мучителем?"'
  speaker: null
- guid: 5a2a73d8-8530-4821-8e07-941588bf51e1
  event: Companions_Navigator_73
  text: '"Я не... Я имела в виду..." {n}Сердце пропускает удар, жар окутывает плечи, горло и грудь, голову туманит — уже знакомое
    влияние сил Кассии пьянит ваш разум больше обычного.{/n} "Мне... спокойно в вашей компании". {n}Кассия отводит взгляд,
    бледные щеки наливаются легким румянцем.{/n}'
  speaker: Cassia Orsellio
- guid: c48ea758-68fe-46cd-98ac-1a785a1fda39
  event: Companions_Navigator_74
  text: '"{name}?" {n}Тонкая фигура Кассии на мгновение напрягается, в глазах проскальзывает незнакомое выражение.{/n} "Позвольте
    отблагодарить династию фон Валанциус за помощь, которой удостоился Дом Орселлио. И лично вас. Незаменимые жизненные уроки,
    что я получила во время совместных странствий, позволили мне стать той, кем мне суждено было стать".'
  speaker: null
- guid: b8ba12f7-d852-4eb8-93b8-0da59b9e3c4c
  event: Companions_Navigator_75
  text: '"...и объединяющие тысячи миров Империума. Дом Орселлио связан торговыми пактами с Домами Галлиатис, Хортинер, Дротус
    и..." {n}Кассия умолкает на секунду.{/n} "На вашей шее затягивается синий узел, Лорд-капитан. Вижу, мой ответ не удовлетворяет
    вашу жажду познания. Что именно вы хотите услышать?"'
  speaker: Cassia Orsellio
- guid: 414ca2ce-5d0b-431c-abe2-65947668d361
  event: Companions_Navigator_76
  text: '"Не думаю, что к нам присоединится действующий Великий Регент. После случившегося на Даргонусе весь Дом Орселлио
    трепещет перед вами, и моя семья едва ли станет рисковать". {n}Кассия устало потирает нагрудник в месте, где находится
    Атлас.{/n} "Я передам приглашение Навис Маджорис, нашим лучшим навигаторам. Быть может, Регент отправит в экспедицию кого-то
    из них".'
  speaker: Cassia Orsellio
- guid: 458f31be-4262-419e-abf5-787e5ea935cf
  event: Companions_Navigator_77
  text: '{n}Кассия чуть расслабляет плечи.{/n} "Благодарю за понимание, Вольный Торговец. А теперь позвольте откланяться —
    я начну подготовку к путешествию. Когда будете готовы, оправляйтесь в систему..." {n}Рубиновые глаза расширяются от удивления.{/n}'
  speaker: Cassia Orsellio
- guid: dae47f72-2b3a-4e75-b139-433ef5d935f9
  event: Companions_Navigator_78
  text: '"{name} фон Валанциус... Сие имя навсегда останется в архивах Дома Орселлио многовековой истории Империума. Ибо в
    переломный момент именно вы повлияли на судьбу нашего рода в Просторе... К добру или к худу". {n}Кассия коротко, но учтиво
    кивает.{/n} "Мы не всегда сходились во взглядах, однако сложно переоценить вклад вашей династии в разрешение внутренних
    конфликтов Дома Орселлио. Как новатор... я выражаю вам нашу благодарность".'
  speaker: Cassia Orsellio
- guid: bab3f632-5dae-4ea9-b00d-1d1451e0f50a
  event: Companions_Navigator_79
  text: '{n}Хрупкая фигура, более похожая на отголосок живого человека, испуганно озирается по сторонам. Спутанные волосы
    всклокоченным облаком окутывают осунувшееся лицо Кассии, а дрожащие руки поспешно размазывают кровавую слезу по щеке.{/n}
    "{name}, какое облегчение вновь говорить с вами. Во тьме сего места ваша душа сияет подобно золоту солнца".'
  speaker: null
- guid: d6bf5b4d-dd0f-472a-bafd-f30fee958032
  event: Companions_Navigator_80
  text: '"Вам ли не знать, сколь утомителен и долог процесс престолонаследия". {n}Кассия громко вздыхает.{/n} "Пока весь Дом
    готовится к Большому Совету, на котором и пройдет официальная церемония передачи титула от покойной Тисифоны ко мне...
    я решила остаться подле вас. Еще чуть-чуть насладиться беспечной свободой. Ибо как только долг призовет, нам будет суждено
    попрощаться".'
  speaker: Cassia Orsellio
- guid: 68f54177-f1a4-4122-b0e7-e998d45f4557
  event: Companions_Navigator_81
  text: '"Думаете?" {n}Кассия смущенно опускает взгляд.{/n} "Даже навигаторам непросто совладать с ужасами Моря Душ. То, что
    я узрела в завихрениях варпа... сложно описать словами. Каждое путешествие меняет нас. Понемногу. Иногда это отражается
    на нашей внешности..." {n}Кассия выставляет ладонь с вытянутыми фалангами и бритвенно-острыми когтями.{/n} "...иногда
    — меняет наши души".'
  speaker: Cassia Orsellio
- guid: a6972331-78a4-403f-9f7a-efef32c3a420
  event: Companions_Navigator_88
  text: '"Признаться, странно не ощущать более давящую тяжесть на сердце. Порой я радуюсь обретенной свободе, а порой..."
    {n}Кассия прикрывает рубиновые глаза.{/n} "... чувствую себя опустошенной. Словно вместе с Атласом пропала и часть меня".'
  speaker: Cassia Orsellio
- guid: 8b9086b3-499f-4224-8586-8e70ee9d9241
  event: Companions_Navigator_89
  text: '"{g|Encyclopedia:Emperor}Император{/g} ниспослал мне дар — помимо жизни обыденной зрить жизнь внутреннюю. Вам не
    дано знать, что фрукт изгнил внутри, пока лезвие не разделит его пополам. Я же вижу гниль издалека — она клубится болотной
    жижей, стекая по спелому плоду. Злость и скука, печаль и радость — все, что люди хранят внутри, вырисовывается на холсте
    моего мира своими красками".'
  speaker: null
- guid: 1dd7a777-38bf-4583-a387-f86332d83245
  event: Companions_Navigator_90
  text: '"Впрочем, незачем еще больше кутаться в оттенки сумерек, Вольный Торговец. Я — это все еще я".'
  speaker: null
- guid: 7f8dceb3-cc66-4551-a497-5d99ce489bae
  event: Companions_Navigator_91
  text: '"Что ж, до сих пор у них ничего не вышло. И ваша заслуга в том весьма огромна". {n}Кассия горько смеется.{/n} "Не
    волнуйтесь, Вольный Торговец, мой Дом более не доставит вам проблем. Пока мне удается поддерживать внутри династии хрупкое
    перемирие, подернутое сизой дымкой. Ну а что будет дальше... покажет время".'
  speaker: Cassia Orsellio
- guid: 5e2a3a36-c26a-454e-9d67-0b58925dda54
  event: Companions_Navigator_92
  text: '"Пожалуй, если под мощью вы подразумеваете бесценные знания. Что касается особых сил, дарованных душами ксеносов...
    Навигаторам Орселлио придется вновь столкнуться с ограничениями собственного тела и духа. Однако меня не пугает подобное,
    ибо наш род и наш ген никогда не были слабы. Дом Орселлио справится, и вскоре мы воспрянем вновь, окутанные золотом и
    белизной!"'
  speaker: null
- guid: bdef2272-dfa3-47c0-81d2-6e15045e258c
  event: Companions_Navigator_93
  text: '{n}Скулы Кассии вспыхивают красным, когда до нее доходит смысл собственных слов.{/n} "Я... лишь хотела поделиться
    статистикой, собранной Эксплоратором Литием-Тета Квондом. Чтобы убедить вас..."'
  speaker: null
- guid: c7a4b9f2-8eb0-401a-aaea-dee302bb8640
  event: Companions_Navigator_94
  text: '"Вы... правы. Свита следует по вашим следам, куда бы вы ни отправились. Быть может, мне стоит перенять у вас подобный
    образ правления династией". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n}'
  speaker: Cassia Orsellio
- guid: 8a499a7a-1967-4265-bc0a-8c9d81c63635
  event: Companions_Navigator_95
  text: '"И все же я не думаю, что Великий Регент почтит нас своим присутствием. После случившегося на Даргонусе весь Дом
    Орселлио трепещет перед вами, и моя семья едва ли станет рисковать... И потому я передам приглашение Навис Маджорис, нашим
    лучшим навигаторам. Быть может, Регент отправит в экспедицию кого-то из них".'
  speaker: null
- guid: da0c7736-3891-4d22-932b-0b9fa6bb5dce
  event: Companions_Navigator_96
  text: '"...Провидение Орселлио. Надо же. Быть может, страницы истории лгут? И вовсе не Калейн Орселлио подарил ее звездам
    название? В любом случае, именно из этой системы Тисифона начала свой путь, и мы отправимся по ее давно забытым следам".'
  speaker: null
- guid: 5fbb7678-addb-4d3e-b29f-e4ecf14aa9d9
  event: Companions_Navigator_97
  text: '{n}Кассия прячет растерянную улыбку за краешком шали.{/n} "Я... Вы слишком добры ко мне, Лорд-капитан. Позвольте
    в ответ отметить и ваши... красивые..." {n}Паника и растерянность перебивает ваше дыхание, отражаясь зеркалом в глазах
    Кассии.{/n} "Плечи? Да, плечи... Кхм. Прошу, сменим тему".'
  speaker: Cassia Orsellio
- guid: 63b06006-661d-464e-9dd5-2fcae4b2bc23
  event: Companions_Navigator_98
  text: '"Лорд-капитан?" {n}Леди-Навигатор вздергивает подбородок. Усталый взгляд скользит по лицам, ни на одном не останавливаясь.{/n}
    "Ваш корабль пестрит причудливыми оттенками. Это так... утомляет".'
  speaker: null
- guid: 6f8e0923-7a23-4706-844b-5d52935ef967
  event: Companions_Navigator_99
  text: '"{mf|Любезный друг|Любезная подруга}, сегодня нефритовый и золотой сияют вокруг вас особенно ярко". {n}Кассия одаривает
    вас мягкой улыбкой.{/n}'
  speaker: Cassia Orsellio
- guid: c684c5e3-746a-46ee-b9d8-77bc334bdb8e
  event: Companions_Navigator_ArbitesReaction_01
  text: '"Господин Антар окутан густым золотом, но, подобно солнцу ледяных миров, его сияние не греет, отливая стальным блеском
    непоколебимости. Порой я замечаю и вспышки иного цвета... Словно металлический панцирь — лишь ширма, а внутри, в глубине,
    буйствует алое пламя".'
  speaker: null
- guid: 58a8ce32-1e6f-4fe5-9e35-8cf79929e488
  event: Companions_Navigator_ArbitesReaction_02
  text: '"Сердце проктора змеится медно-огненными разводами, словно недавно что-то прорвалось наружу — гнев, ярость, боль?..
    — и оставило на нем неизгладимый след. Прежний серо-стальной ореол... исчез, был вытеснен новой палитрой, и теперь в истекающей
    красками душе проявляются новые оттенки — естественные, пульсирующие в такт сердцебиению. Эта трансформация... завораживает!"'
  speaker: null
- guid: 3c3313f7-2db2-49b0-95d9-c49b73be805f
  event: PRL_NavigatorLast_01
  text: '"Поступь его громка, ибо бремя надежд чужих несет он! Отворите свои сердца, и в душу вашу вложу я мириады слов и
    смыслов, каждый из которых значит спасение во мне!" {n}Навигатор с визгливым хохотом мечется в своем кресле, а затем резко
    оседает. Его лицо залито черно-красным: угольная жижа из-под третьего века из струйки превратилась в настоящий поток и
    мешается с кровью из носа, а сам глаз взбухает лиловым.{/n}'
  speaker: null
- guid: 9188c3e6-fc4e-4611-8211-0129fc1efab6
  event: PRL_NavigatorLast_02
  text: '{n}Навигатор не отвечает ей. Из под его опущенных век текут кровавые и черные слезы, а вокс в основании кресла сквозит
    статикой, прерываемый только отголосками потустороннего смеха.{/n}'
  speaker: null
- guid: c7349119-5c98-4f28-8d2e-d30992e43e8a
  event: PRL_NavigatorLast_03
  text: '{n}Каждое слово набатом отдается в голове — словно их подхватывают {d|Encyclopedia:Prologue_CutByKnife}мириады голосов{/d},
    звенящих в ваших ушах. На мгновение вы теряете ориентацию в пространстве — кажется, словно этот нечестивый хор пытается
    опутать вас звучанием, не предназначенным для этого мира.{/n}'
  speaker: null
- guid: 5c267bb7-fae4-4ff0-80e1-9c01de65a9d8
  event: PRL_NavigatorLast_04
  text: '{n}Навигатор приходит в движение: чуть подняв голову, он приоткрывает обычные глаза. Его третье око плотно сомкнуто
    — лишь блестящая черная капля выкатывается из-под век, оставляя на лице угольную дорожку.{/n} "У вас... мало времени..."
    {n}Голос доносится из {g|Encyclopedia:Vox}вокс{/g}-решетки в основании причудливого кресла. Вы так и не понимаете, как
    Навигатор воспроизводит человеческую речь.{/n}'
  speaker: null
- guid: 2f6e6387-4082-471d-af30-caace7207bba
  event: PRL_NavigatorLast_05
  text: '{n}Сенешаль откашливается.{/n} "Господин Веспиадас..."'
  speaker: null
- guid: 09db881f-227b-4004-8b2c-e7dbb39718c6
  event: PRL_NavigatorLast_06
  text: '{n}Идира морщится.{/n} "Ранен. Вымотан. Или сражается с неисчислимыми ужасами варпа, ломящимися ему в голову. Любой
    из вариантов — выбирай".'
  speaker: Idira Tlass
- guid: 68d1b3c9-78fb-40af-ab74-37055adcfc89
  event: PRL_NavigatorLast_07
  text: '{n}Тело Навигатора взрывается движением: резкий рывок вперед, назад, снова вперед — под хруст костей и треск раздираемой
    кожи. Все же сращение с сидением оказывается крепче этих бешеных порывов: мутант остается на своем месте, до предела подавшись
    вперед в своих многослойных одеяниях, медленно окрашивающихся багровым. Жаберные решетки разрываются, образуя два уродливых
    визжащих рта-провала.{/n} "Падите на колени, смертные, и узрите последний восход!"'
  speaker: null
- guid: f062b2a8-6e08-4f13-b3cf-2ca319d4341c
  event: PRL_NavigatorLast_08
  text: '{n}Идира испуганно взвизгивает.{/n} "Чужой! Чужой в чужом теле!"'
  speaker: Idira Tlass
- guid: 6fc3dfd8-b3e5-48c6-82de-ac653135043b
  event: PRL_NavigatorLast_09
  text: '"Бегите... бегите отсюда, пока я еще в силах..." {n}Вокс хрипит, едва извергая из себя вымученные слова.{/n} "Я могу
    удерживать... вторжение... но недолго. Нужно начинать трансляцию... покинуть варп... но только с помощью Главного кормчего..."'
  speaker: null
- guid: 42fb39e4-3336-4c0c-8397-8389d484e430
  event: PRL_NavigatorLast_10
  text: '{n}Навигатор прерывисто вздыхает.{/n} "Бегите. Святилище будет закрыто. Я удержу... удержусь... пока не получу сигнал
    от Главного кормчего. После чего приступлю к трансляции. Так что... бегите. Бегите!"'
  speaker: null
- guid: b331db50-8758-4da7-b9df-1d6f2bb50aaf
  event: PRL_NavigatorLast_11
  text: '"Предел..." {n}Тело Навигатора вновь начинает биться, рты-жабры разеваются в безумном хохоте.{/n} "Падите ниц перед
    взошествием нового чемпиона! Лишь свершится обряд, и эта скорлупа лопнет, а тысячи пастей примут жертву, что принесет
    Пределу рассвета тот, что несет сумерки и отмечен волей богов!"'
  speaker: null
- guid: dc15a24c-e2b9-4562-9d1a-201d6407dc77
  event: PRL_NavigatorLast_12
  text: '{n}Навигатор — вернее, то, что настойчиво рвется в его тело — извергает из себя издевательский гогот.{/n} "Поступь
    того, что несет сумерки, скрыта волей его владык. Вырви глаза свои, ибо более не нужны они той, что станет слугой чемпиона!"'
  speaker: null
- guid: 8fa03b01-1f2b-4917-9e38-fa3787ee60df
  event: PRL_NavigatorLast_13
  text: '"Обряд... принесет жертву... ох, чует мое сердце, Кунрад не успокоился, получив отпор у Камеры Патента!"'
  speaker: null
- guid: 5f3970ee-88c9-44af-a972-3181655e9770
  event: PRL_NavigatorLast_14
  text: '"Что? Кунрад предал Леди Теодору?!" {n}Идира хватается за голову.{/n} "Да как же так! Да он же... как собака был
    верен! Я ничего не слышала, клянусь!"'
  speaker: Idira Tlass
- guid: c6c70206-99b1-4526-9414-1cc2daba86e7
  event: PRL_NavigatorLast_15
  text: '{n}Сенешаль окидывает фигуру в кресле взглядом.{/n} "Корабль может начать трансляцию только при поддержке Главного
    кормчего... если он еще жив. Попытаться стоит: нужно добраться до мостика. А чтобы добраться до мостика — нужна поддержка.
    Единственный вариант — пробиваться на офицерскую, на встречу с Эдельтрадом и его людьми. Думаю, там же будет Леди Теодора
    — она точно услышала этот призыв, который сервочереп передал раньше".'
  speaker: null
- guid: 41a8197d-203c-4620-8562-a73e5f393506
  event: PRL_NavigatorLast_16
  text: '{n}Идира протягивает было руку к Навигатору, но в последнее мгновение отдергивает ее.{/n} "Веспиадас... удачи. И
    спасибо".'
  speaker: Idira Tlass
- guid: d6fc78b9-3c73-439f-83f6-abc470d7d6b1
  event: PRL_NavigatorLast_17
  text: '"Кажется, господин Веспиадас еще жив..." {n}Сенешаль содрогается при виде растянутой кожи и темных отметин на лице
    создания в кресле.{/n} "Служки мертвы... но камера, хвала Императору, все же не открыта варпу. Что ж, у нас есть шанс
    выйти отсюда живыми..."'
  speaker: null
- guid: d4df654a-54a8-41bd-a249-a0386c84115e
  event: PRL_NavigatorLast_18
  text: '"Нельзя! Только благодаря господину Веспиадасу мы еще и живы. Падет он — сгинет весь корабль целиком!" {n}Женщина
    тяжело переводит дух.{/n} "Дай ему выполнить свой долг. Ясно же, что это последнее, что он сможет сделать... если успеет..."'
  speaker: null
- guid: bf3fc6fb-f2e4-4175-97ef-b436b7f816ef
  event: RMNC_AfterSex_BarksCassia_01
  text: '"Мои силы чуть не вышли из-под контроля, когда мы... ну... Как неловко!"'
  speaker: null
- guid: 3487a666-5153-41f9-930a-37cb717d61a9
  event: RMNC_AfterSex_BarksCassia_02
  text: '"Какое... волнующее чувство. Вы кружите мне голову, а я и не желаю сопротивляться!"'
  speaker: null
- guid: efc1782f-f01c-41bd-8486-b53eb0c64010
  event: RMNC_AfterSex_BarksCassia_03
  text: '"{name}, ваша спина и шея!.. Позвольте нанести на них мазь. Впрочем, мне показалось, или вам нравятся мои когти?.."'
  speaker: null
- guid: bf693b70-b36f-45f1-88ab-4abcc92e8e1b
  event: RMNC_AfterSex_BarksCassia_04
  text: '"В ваших объятиях так горячо... Я чувствую себя свободной делать то, что мне нравится. И как мне нравится..."'
  speaker: null
- guid: 1d3f64af-2c3e-45c1-a742-5279c352fba3
  event: RMNC_AfterSex_BarksCassia_05
  text: '"Хотела бы я побыть с вами еще немного, но долг... зовет нас обоих. До следующего отбоя".'
  speaker: null
- guid: 2f15629e-c989-411f-a78a-17b14c69da32
  event: RMNC_Cassia_CassiaFirsNight_01
  text: '{n}В потоке нахлынувших эмоций вы чувствуете каждый поцелуй, каждое прикосновение в несколько раз острее — и Кассия
    замечает это. Она тянется к вашей шее, прикусывает ее, и острые когти чувственно скользят по вашей спине, оставляя чуть
    саднящие царапины.{/n} "Я люблю вас, {name}".'
  speaker: null
- guid: 9638e6cf-f2a8-4782-b442-154f445dc138
  event: RMNC_Cassia_CassiaFirsNight_02
  text: '"Замолчи и целуй меня, {name}". {n}Кассия притягивает вас к себе, и золотое свечение прозрачной вуалью накрывает
    обоих. Мурашки на коже искрят бирюзой нетерпения, и бабочки разных цветов возникают из кораллового тумана вожделения и
    растворяются меж ваших тел.{/n}'
  speaker: Cassia Orsellio
- guid: 14a3cb3c-4a5f-42d2-a7d2-6e8ee9fc71ff
  event: RMNC_Cassia_CassiaFirsNight_03
  text: '"Не может быть!" {n}Кассия испуганно отпрядывает, дрожа всем телом.{/n} "Это... все из-за меня! Вы проводили со мной
    слишком много времени. Я знала... знала, что моя сила может вам навредить. Вам больно? Скажите же! О Бог-Император, что
    же мне делать?" {n}Бледно-желтая петля все туже сжимается на горле Кассии, и вокруг ее головы беспорядочно мечутся всполохи
    красного и темно-синего.{/n}'
  speaker: Cassia Orsellio
- guid: 91bc1bb0-2678-4d5d-ac5f-6d878dfc5ce1
  event: RMNC_Cassia_CassiaFirsNight_04
  text: '"Но, {name}..." {n}Голубоватый туман окутывает фигуру Кассии. "Успокаивается", — неожиданно ясно понимаете вы.{/n}'
  speaker: null
- guid: db86c9c2-4d36-4535-afb1-8e14c3f0bb2a
  event: RMNC_Cassia_CassiaFirstStep_01
  text: '"Вы все еще работаете, {name}? Отбой прозвучал несколько часов назад, вы так переутомитесь". {n}Кассия обеспокоенно
    вглядывается в ваше лицо, но взгляд ее быстро смягчается.{/n}'
  speaker: Cassia Orsellio
- guid: d5f270c5-c376-4201-aec2-e7b56fdd478e
  event: RMNC_Cassia_CassiaFirstStep_02
  text: '{n}Кассия изящно кивает.{/n} "И боюсь, ее причина сейчас прямо передо мной".'
  speaker: Cassia Orsellio
- guid: 9f950877-1fc2-4409-b163-1279777cac0d
  event: RMNC_Cassia_CassiaFirstStep_03
  text: '"Пусть эта ночь послужит моим ответом..."'
  speaker: null
- guid: a7d9bee0-2075-45d8-ac07-aae2b3f9f4e2
  event: RMNC_Cassia_CassiaFirstStep_04
  text: '{n}Кассия перехватывает ваше лицо ладонями, прежде чем вы успеваете наклониться.{/n} "Постойте, {name}. Мне нужно
    сказать вам кое-что очень важное".'
  speaker: Cassia Orsellio
- guid: 3c09e6a5-0352-447a-877c-4f6ae88e02df
  event: RMNC_Cassia_CassiaFirstStep_05
  text: '"Время, проведенное с вами, стало лучшим в моей жизни, {name}. Вы освободили меня от оков страха и отвращения к самой
    себе. Я... более не отвожу взгляд от зеркала, не стыжусь собственных сил и не намерена скрываться от мира в коконе, что
    ранее сама же и возвела".'
  speaker: null
- guid: 02602558-9f91-4cdd-8c56-daedf14dd39a
  event: RMNC_Cassia_CassiaFirstStep_06
  text: '"Что? Нет, глупый, конечно же нет!" {n}Кассия заливается звонким смехом, словно бы вы сказали самую нелепую вещь
    в этой жизни.{/n}'
  speaker: Cassia Orsellio
- guid: 94f4c81d-5b53-4548-b9cb-dcee6b2fec36
  event: RMNC_Cassia_CassiaFirstStep_07
  text: '"Вы показали мне мир без прикрас — таким, какой он есть на самом деле. Жестоким, неизведанным, противоречивым...
    И полным самых прекрасных вещей!" {n}В порыве Кассия хватает вашу руку и прижимает к себе.{/n} "И я осознала, что жизнь
    вовсе не похожа на книги. И каждый пишет свою собственную историю — так, как может. Чернилами, кровью, красками на холсте
    или лезвием в воздухе..."'
  speaker: null
- guid: e139f1e7-b33c-469c-8bca-61b37a097cf3
  event: RMNC_Cassia_CassiaFirstStep_08
  text: '"И я хочу... сияние Трона, как я хочу написать свою историю вместе с вами!" {n}Кассия умолкает, задержав дыхание,
    и безмолвный вопрос застывает в ее глазах.{/n}'
  speaker: Cassia Orsellio
- guid: 28468432-b147-4cc1-b6e5-fd295e0295d7
  event: RMNC_Cassia_CassiaFirstStep_09
  text: '{n}Кассия наклоняется к вашему уху и обжигает жарким дыханием.{/n} "Вы обещаете любить меня... до самой смерти?"'
  speaker: Cassia Orsellio
- guid: 4f87332f-e3be-428b-8634-b09b2e849ce7
  event: RMNC_Cassia_CassiaFirstStep_10
  text: '{n}Кассия долго смотрит на вас, а затем ее губы, дрожа, расходятся в сладкой улыбке.{/n} "Сегодня особенная ночь,
    {name}. Так пусть она запомнится навсегда".'
  speaker: Cassia Orsellio
- guid: 574b967e-171a-4ad3-970f-c9587ded9a14
  event: RMNC_Cassia_CassiaFirstStep_11
  text: '"Пускай их. Мне больше нет дел о том, что шепчут за моей спиной. Пока вы рядом...". {n}Кассия нежно касается вашей
    щеки и застывает в нерешительности.{/n}'
  speaker: Cassia Orsellio
- guid: 07da4028-501e-4011-9d99-cafa3732d98a
  event: RMNC_Cassia_OurFuture_01
  text: '{n}Кассия отстраняется, и на лице ее отпечатывается скорбное выражение — словно что-то внутри надломилось.{/n} "Я
    люблю вас... Но совершенно не так, как об этом рассказывали книги. Ибо я не знала, что любовь может не только возвысить,
    но и разбить тебя вдребезги, уничтожить, перемолоть, оставить после одни шрамы".'
  speaker: Cassia Orsellio
- guid: 542ddd5a-550f-4ad9-81b1-5047f3146a4e
  event: RMNC_Cassia_OurFuture_02
  text: '"Но знаете, {name}, я ни о чем не жалею. И никогда не забуду бесценных мгновений, что мы провели вместе". {n}Девушка
    глубоко вздыхает и дарит свою последнюю ласковую улыбку.{/n} "Мне больше нечего вам сказать, {name}. Увидимся... позже".'
  speaker: null
- guid: 960f4b02-9987-4591-85fc-0411d4627447
  event: RMNC_Cassia_OurFuture_03
  text: '{n}Кассия любуется великолепием витражей, освещенных неярким сиянием люменов. Лицо ее задумчиво и спокойно — словно
    все переживания разом оставили попытки истерзать ее душу.{/n} "{name}? Не ожидала встретить вас здесь в этот час..."'
  speaker: Cassia Orsellio
- guid: 8ddf1ffa-aedb-457e-9da2-f8f7e9ec1655
  event: RMNC_Cassia_OurFuture_04
  text: '{n}Кассия отвечает вам страстно, впервые поддавшись чувствам без страха или сомнений.{/n} "Я люблю вас, {name}. Сопроводите
    меня в свои покои. Сейчас же".'
  speaker: Cassia Orsellio
- guid: 110899b1-0c57-4784-8cf0-6f87d857cd1c
  event: RMNC_Cassia_OurFuture_05
  text: '{n}Кассия вновь устремляет взор на витраж.{/n} "Я часто прихожу сюда. Посмотреть на человека, подарившего Человечеству
    новые звезды. Судьба Вольных Торговцев чем-то сродни навигаторской... Только более славная и героическая, нежели неотвратимо
    печальная".'
  speaker: Cassia Orsellio
- guid: ee27803c-4765-4d37-b5bb-e96f291ca0e5
  event: RMNC_Cassia_OurFuture_06
  text: '"Ах, {name}!" {n}Кассия бросается в ваши объятия и крепко прижимает к себе, словно опасаясь, что вы исчезнете.{/n}
    "Поцелуйте меня, сейчас же!"'
  speaker: Cassia Orsellio
- guid: c76aa087-ea2e-489b-ab80-67a6e69d4d50
  event: RMNC_Cassia_OurFuture_07
  text: '"Я... все понимаю. И потому спрошу прямо — в последний раз. Вы примете меня, зная, что отношения сгорят дотла, едва
    успев начаться?"'
  speaker: null
- guid: f7190ac3-e633-4255-8122-923ff7cd8623
  event: RMNC_Cassia_OurFuture_08
  text: '"Вам и не нужно. Теперь я точно знаю, чего хочу..." {n}Кассия обхватывает вашу шею руками, и когти ее нежно щекочут
    затылок.{/n} "Вас, {name}. Здесь и сейчас".'
  speaker: Cassia Orsellio
- guid: 84b0e04e-1f25-4668-b919-0899a31ce642
  event: RMNC_Cassia_OurFuture_09
  text: '"Не вы ли говорили о любви здесь и сейчас, {name}?" {n}Кассия чуть подается вперед, но не осмеливается к вам прикоснуться.{/n}'
  speaker: Cassia Orsellio
- guid: 85408653-4a66-46af-b6e5-ef01eabd17cb
  event: RMNC_Cassia_OurFuture_10
  text: '{n}Взгляд Кассии мрачнеет, и вас почему-то бросает в дрожь.{/n} "Мой долг перед Домом — передать навигаторский ген
    Орселлио своим потомкам. Я выйду замуж... за навигатора другого рода. И заведу детей. Продолжу династию... А когда варп
    извратит мое тело окончательно, Кассия Орселлио исчезнет из этого мира, оставив после себя лишь имя да трон Новатора.
    В этом случае... разве есть у нас с вами будущее?"'
  speaker: null
- guid: cd6d90ef-d57a-47b1-b779-1984a18fa38a
  event: RMNC_Cassia_OurFuture_11
  text: '"Лишь совсем немного". {n}Кассия лукаво улыбается.{/n} "Но больше не собираюсь".'
  speaker: Cassia Orsellio
- guid: 918315fa-8664-4ede-9b20-2edd49651964
  event: RMNC_Cassia_OurFuture_12
  text: '"Это правда". {n}Кассия тепло улыбается в ответ на ваше замечание.{/n} "Однако в компании некоторых приятно и помолчать".'
  speaker: Cassia Orsellio
- guid: 5f7289cb-3483-4495-b67b-6f3fad42aaa4
  event: RMNC_Cassia_OurFuture_13
  text: '"Вскоре мне тоже предстоит стать той, кто поведет за собой тысячи жизней великой навигаторской династии — новатором.
    И от последствий моего правления будут зависеть миллиарды человеческих жизней по всему Простору... быть может даже Империуму".'
  speaker: null
- guid: 4a3bee92-2111-41e8-abd9-d31058c7a6c4
  event: RMNC_Cassia_StartingEventCassia_01
  text: '{n}Кассия удивленно взмахивает ресницами, и щеки ее заливает нежный румянец.{/n} "Подобные слова, Лорд-капитан, могут
    быть истолкованы слишком превратно. Вам следует ознакомиться с некоторыми трудами из собственной библиотеки, чтобы понимать,
    как достойно вести разговор с леди".'
  speaker: Cassia Orsellio
- guid: c3d644b9-d05a-43b5-b529-c7b98f6e8101
  event: RMNC_Cassia_StartingEventCassia_02
  text: '{n}Кассия хмурится, и щеки ее бледнеют больше обычного.{/n} "Лорд-капитан, что вы... себе позволяете? Говорить подобное
    человеку, с которым вы едва знакомы? Это... возмутительно. Непристойно. Вам следовало бы поближе ознакомиться с некоторыми
    трудами из своей библиотеки, чтобы понимать, как достойно вести себя с леди".'
  speaker: Cassia Orsellio
- guid: 0ea22786-8275-428e-b337-957d206e33ef
  event: RMNC_Cassia_StartingEventCassia_03
  text: '{n}Леди-Навигатор увлеченно изучает пыльные книги, которые другие офицеры — по лености ли или скудности ума — обделяют
    вниманием. Лишь когда вы подходите ближе, Кассия поднимает глаза, вздрагивает и прячет за спиной потрепанный томик.{/n}
    "Лорд-капитан? Простите, я... не заметила, как вы вошли".'
  speaker: null
- guid: 5ac6e843-1c21-4e97-9c34-4f4f93d1d1ca
  event: RMNC_Cassia_StartingEventCassia_04
  text: '"Не знала, что имперскому навигатору требуется разрешение на подобное. Впредь постараюсь следовать самобытным правилам
    вашего корабля более... внимательно". {n}Кассия отводит укоризненный взгляд, но продолжает держать подбородок высоко и
    с достоинством.{/n} "Не смею более смущать вас своим присутствием".'
  speaker: Cassia Orsellio
- guid: 6ca6a97c-52b4-4527-aa44-533734d3022b
  event: RMNC_Cassia_StartingEventCassia_05
  text: '"Или же им претит мое присутствие". {n}Сохраняя учтиво-отчужденное выражение, Кассия коротко кивает.{/n} "В таком
    случае я тоже должна откланяться — проверить Санктум Навис после ритуала единения и подготовить палаты к предстоящему
    варп-прыжку. Благодарю за компанию, {name}".'
  speaker: null
- guid: b723b1aa-d959-4733-9e27-ea6e504ecfc7
  event: RMNC_Cassia_StartingEventCassia_06
  text: '"Что вы, ни в коей мере". {n}Девушка благосклонно кивает своему молчаливому слуге.{/n} "Просто Уве и в одиночку прекрасно
    справляется. Он уже привык к моим... моим капризам и предпочтениям".'
  speaker: null
- guid: 9b21e432-3622-43bb-9efa-fc3c95fb5c4e
  event: RMNC_Cassia_StartingEventCassia_07
  text: '"На этом корабле обитают люди куда более несдержанные и опасные для окружающих. И куда менее преданные Богу-Императору,
    нежели герольд Навис Нобилите". {n}Кассия вскидывает голову и выпрямляется во весь рост.{/n} "Но я и без слов вижу оттенки
    бурого беспокойства, что вихрем трепещут вокруг ваших подданных, когда я рядом. Не будь я привычна к подобной реакции...
    сочла бы и их поведение, и ваш вопрос оскорбительными".'
  speaker: Cassia Orsellio
- guid: 058ce8b2-61ac-400a-b075-2b3024aa04b9
  event: RMNC_Cassia_StartingEventCassia_08
  text: '"По сравнению с Эурак-V ваш корабль — бескрайний мир, наполненный незнакомыми мне красками. Однако обилие пестрых
    оттенков порой утомляет взор — на мостике и палубах так... шумно. В поисках спокойного места мне посчастливилось наткнуться
    на сей островок безмятежности, заполненный редкими книгами и почти лишенный цветов".'
  speaker: null
- guid: 27f05874-fec8-4270-8600-e6523d4c8c68
  event: RMNC_Cassia_StartingEventCassia_09
  text: '"Ах, это..." {n}Кассия осторожно протягивает сборник произведений кадианского флотоводца и поэта Аэлия Квинта.{/n}
    "Я приметила занимательный экземпляр на полках библиотеки — все рассказы в сей книге изложены методом стихосложения. Это
    так... красиво и удивительно!"'
  speaker: Cassia Orsellio
- guid: 565d1c3b-328f-43d1-a4ea-c7e2023b0ee7
  event: RMNC_Cassia_StartingEventCassia_10
  text: '{n}Повисает неловкая тишина, и навигатор хмурится, поджимая бледные губы.{/n} "Лорд-капитан, будьте любезны объясниться
    — отчего вы сейчас докучаете мне своими расспросами? Интересуетесь настроением, нуждами, обсуждаете книги? Ведете себя
    так, будто можете испытывать хоть каплю симпатии к такой, как я!"'
  speaker: null
- guid: 0c738185-269d-42b0-98b6-c99cf40962c0
  event: RMNC_Cassia_StartingEventCassia_11
  text: '"Ваши служки несколько нерасторопны в вопросах ухода за Навис Нобилите, но вполне сносны. Благодарю за заботу".'
  speaker: null
- guid: 25d4d802-1948-4de4-9470-006303065959
  event: RMNC_Cassia_StartingEventCassia_12
  text: '"Я не... я..." {n}Бледное лицо заливает стыдливый румянец, но Кассия быстро берет себя в руки:{/n} "Простите мне
    столь досадную оплошность, Лорд-капитан. Иногда книги завлекают меня настолько, что я теряюсь среди страниц, позабыв о
    реальном мире. Вы что-то хотели?"'
  speaker: null
- guid: b0f57cba-f914-482d-b180-9c3f1f38eb63
  event: RMNC_Cassia_StartingEventCassia_13
  text: '{n}Кассия вздрагивает, но лицо ее остается непроницаемым.{/n} "Я лишь пыталась быть вежливой и поддержать беседу.
    Но вы правы, {name}, мы отнюдь не друзья. И этот разговор порядком затянулся. Позвольте же откланяться — меня ждут дела
    в Санктум Навис". {n}Сохраняя учтиво-отчужденное выражение, Кассия разворачивается и покидает комнату, не удостаивая вас
    прощальным взглядом.{/n}'
  speaker: Cassia Orsellio
- guid: 9e844340-31ec-46ef-b5d6-45b3ba434546
  event: RMNC_Cassia_StartingEventCassia_14
  text: '"Правда? Я... я не знала. То есть, я и не могла знать, ведь мы с вами впервые беседуем в обстановке столь..." {n}Кассия
    обводит взглядом комнату и чуть заметно смущается.{/n} "...уединенной. Надо же, когда я только нашла это место, здесь
    было полно офицеров. И почему они все ушли?"'
  speaker: Cassia Orsellio
- guid: 349c434c-aa86-4fcf-8d5b-cef5ad9b8635
  event: RMNC_Cassia_StartingEventCassia_15
  text: '"Над вашими... кем? Ах, понятно. Вы уже считаете меня членом своей команды. Да. Да, я... постараюсь не подвести вас,
    Лорд-капитан" {n}Сохраняя учтиво-отчужденное выражение, Кассия коротко кивает.{/n} "А теперь позвольте откланяться — мне
    нужно закончить дела в Санктум Навис".'
  speaker: null
- guid: c6f7fa07-ccea-4d49-85c4-40c2ebf77e2e
  event: RMNC_Cassia_StartingEventCassia_16
  text: '"Не стоит недооценивать навигаторов Дома Орселлио, Лорд-капитан. Легкое недомогание окутывает мои плечи белесо-сизой
    шалью, однако это ни в коей мере не помешает мне исполнять свой долг перед Человечеством. И перед вами". {n}Кассия отвечает
    сдержанно и подчеркнуто учтиво, аккуратно выстраивая между вами ледяную стену.{/n}'
  speaker: Cassia Orsellio
- guid: b265c18b-6e58-4ba7-bca0-3f9746443ec0
  event: RMNC_Cassia_StartingEventCassia_17
  text: '{n}Кассия на секунду задумывается и коротко кивает.{/n} "В таком случае я тоже должна откланяться — проверить Санктум
    Навис после ритуала единения и подготовить палаты к предстоящему варп-прыжку. Благодарю за компанию, {name}".'
  speaker: Cassia Orsellio
- guid: 78a6ea6a-29b6-40b7-934f-aeeac913ef71
  event: RMNC_Cassia_StartingEventCassia_18
  text: '{n}Испугавшись собственных слов, Кассия прикрывает рот ладонью, бледнеет, вспыхивает, снова бледнеет, и смущенно
    скрывает лицо за завесой снежных волос.{/n} "Прошу... меня извинить. Леди-Навигатору не пристало вести себя столь неподобающим
    образом".'
  speaker: null
- guid: 1f306f19-6857-4ca3-a368-93466762b52c
  event: RMNC_Cassia_StartingEventCassia_19
  text: '"При этом же я чувствую небывалое волнение и... нетерпение. Наконец я оказалась за пределами привычных стен — в мире,
    который видела лишь на страницах книг. Один ваш корабль полон чудных артефактов и занятных вещиц. А сколько еще всего
    за его пределами! Наверное... мой восторг кажется вам детской нелепостью? И в душе вы потешаетесь надо мной".'
  speaker: null
- guid: 4d1e6c5d-76ab-4d68-bfb0-99655396ad34
  event: RMNC_Cassia_StartingEventCassia_20
  text: '"Да, я... понимаю. И еще раз прошу прощения". {n}Прикрыв пылающее лицо, Кассия стремительно покидает комнату.{/n}'
  speaker: null
- guid: b92e93eb-c1a8-47f5-abcf-69c4b86d7cdb
  event: RMNC_Cassia_StartingEventCassia_21
  text: '{n}Строгость на лице девушки обнажается глубокой усталостью.{/n} "Простите, {name}. Сейчас я и сама себя не понимаю.
    Ваши слова и внимание напомнили мне о жизни на станции. О Теобальде и Фелеке. Не понимаю... Они были просто хранителями
    Эурак-V, так почему от воспоминаний об этих двоих я испытываю странную тяжесть... вот здесь?" {n}Кассия растерянно касается
    нагрудника.{/n}'
  speaker: Cassia Orsellio
- guid: 85c8468d-80cb-4988-9e12-2fef824f3966
  event: RMNC_Cassia_StartingEventCassia_22
  text: '"Конечно, на Эурак-V тоже было обширное книгохранилище, вот только большинство трудов в нем посвящалось разного рода
    учениям. Лишь в редкие минуты отдыха мне было дозволено предаваться забвению на страницах литературы художественной".
    {n}Кассия бережно смахивает пыль с обложки узкой когтистой ладонью, и взгляд ее полнится тоской от воспоминаний об утерянном
    доме.{/n}'
  speaker: Cassia Orsellio
- guid: 848b3a15-139c-4ae2-a898-06caa7dbd33c
  event: RMNC_Cassia_StartingEventCassia_23
  text: '"Лорд-капитан?" {n}Кассия удивленно поднимает глаза-рубины, вглядывается в пустоту за вашими плечами.{/n} "Вокруг
    вас вспыхивает и затухает столь много цветастых искр. Отнюдь не капля — целое море эмоций! Так много, что мне с трудом
    удается разобрать белоснежную честность ваших слов".'
  speaker: Cassia Orsellio
- guid: c33b1df8-2920-4cc6-a440-d92bf59e3d5f
  event: RMNC_Cassia_StartingEventCassia_24
  text: '"В таком случае... позвольте и мне откланяться".

    {n}Сохраняя учтиво-отчужденное выражение, Кассия коротко кивает и покидает комнату.{/n}'
  speaker: null
