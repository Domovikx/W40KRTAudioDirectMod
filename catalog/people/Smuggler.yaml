  event: Companions_Smugler_119
  text: '"Предлагаете мне... стать вашим вассалом, шерин?" {n}Тлеющие угли в глазах Джай разгораются новыми искрами.{/n} "Но вы же не надеетесь обзавестись лишь новым псом, о шерин? Ибо вокруг вас и так слишком много тех, кто готов спать у ног, кормиться с рук и грызть глотки врагам. А я... я стану вашим вассалом, {name}. Если же и правда вам нужна".'
