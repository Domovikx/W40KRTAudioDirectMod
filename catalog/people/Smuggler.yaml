  event: Companions_Smugler_50
  text: '{n}Джай смеется просто, заразительно и легко, как никогда прежде.{/n} "Ну, тогда решено, {name}! С сегодняшнего дня я поплыву навстречу избранной мною судьбе. Ах, как завораживающе — наблюдать, куда же несут тебя волны..."'
