    text_clean: Как я и обещала ранее, мои ребята станут вашими глазами и ушами по всему Простору, дайте им только время, шерин. Ну а на Даргонус уже спешит помощница официального имперского представителя Джай Хейдари, дабы предоставить вашим людям и вам, о владыка миров, товары редчайшего мастерства и происхождения.
