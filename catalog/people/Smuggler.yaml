- guid: 58adcca7-0d55-4782-8118-47e9ac794b96
  event: Companions_Smugler_71
  text: '{n}Джай задумчиво кивает.{/n} "Я не сомневаюсь в том, что, рано или поздно, вам придется иметь дело с ксеносами. В тот час, шерин, вы возблагодарите {g|Encyclopedia:Emperor}Великого{/g} за то, что он послал меня вам!"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай задумчиво кивает.
  - speaker: Контрабандист
    text_clean: Я не сомневаюсь в том, что, рано или поздно, вам придется иметь дело с ксеносами. В тот час, шерин, вы возблагодарите Великого за то, что он послал меня вам!
- guid: 685e408f-9c3d-4a8b-bd1e-159af02339d0
  event: Companions_Smugler_72
  text: '"Предательство — это когда ты бьешь своих в спину. Я же использую врагов, чтобы обогатить {g|Encyclopedia:Imperium}Империум{/g}. Деньги вращают жернова войны, и коль слуги Императора должны вести войну и днем и ночью даже здесь, на границе пустоты и вдали от {g|Encyclopedia:HolyTerra}Святой Терры{/g}, им как никогда нужен презренный металл — в карманах и в обороте".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Предательство — это когда ты бьешь своих в спину. Я же использую врагов, чтобы обогатить Империум. Деньги вращают жернова войны, и коль слуги Императора должны вести войну и днем и ночью даже здесь, на границе пустоты и вдали от Святой Терры, им как никогда нужен презренный металл — в карманах и в обороте.
- guid: 192f3542-767c-4db5-a177-30f3e7315d72
  event: Companions_Smugler_73
  text: '"Слава Императору, что мы с вами понимаем друг друга с полуслова".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Слава Императору, что мы с вами понимаем друг друга с полуслова.
- guid: 0f970af9-562d-42c2-a753-7fe737067eed
  event: Companions_Smugler_74
  text: '"И все же, шерин... все же вы завели себе ручного ксеноса". {n}Джай медленно качает головой с укоризненной улыбкой.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: И все же, шерин... все же вы завели себе ручного ксеноса.
  - speaker: narrator
    text_clean: Джай медленно качает головой с укоризненной улыбкой.
- guid: 3b38ac85-3fe6-4aad-8374-f8daca6498d4
  event: Companions_Smugler_75
  text: '"Простите меня, шерин. Я... не испытываю теплых чувств к тем, с кем делю рынок. Тем более что до меня им..." {n}Джай фыркает и небрежно отмахивается.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Простите меня, шерин. Я... не испытываю теплых чувств к тем, с кем делю рынок. Тем более что до меня им...
  - speaker: narrator
    text_clean: Джай фыркает и небрежно отмахивается.
- guid: 2818c144-b819-4660-9900-874e714ac840
  event: Companions_Smugler_76
  text: '"Как новенькие, шерин". {n}Джай иронично кривится, потирая блеклый {g|Encyclopedia:Augmentation}аугмент{/g}, заменяющий горло и легкие. Словно не веря тому, что тот {d|Encyclopedia:Ch3_JaeWasInCommoragh}снова стал частью ее тела{/d}.{/n} "Нет, правда. Дышать могу, кровью больше не харкаю в лицо кому ни попадя... Одним словом, шерин, выручил{mf||а} ты меня снова. Спасибо... Уж я постараюсь отплатить добром за добро".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Как новенькие, шерин.
  - speaker: narrator
    text_clean: Джай иронично кривится, потирая блеклый аугмент, заменяющий горло и легкие. Словно не веря тому, что тот снова стал частью ее тела.
  - speaker: Контрабандист
    text_clean: Нет, правда. Дышать могу, кровью больше не харкаю в лицо кому ни попадя... Одним словом, шерин, выручил ты меня снова. Спасибо... Уж я постараюсь отплатить добром за добро.
- guid: 609e1d50-434f-4af1-a820-a2695b126118
  event: Companions_Smugler_77
  text: '{n}Джай увлеченно сравнивает записи в золоченной инфопластине и свежие отчеты с {g|Encyclopedia:Footfall}Футфола{/g}. Завидев вас, женщина с улыбкой откладывает и то, и другое.{/n} "Ах, шерин! Нелегок труд имперского представителя, а когда он еще и {g|Encyclopedia:ColdTrade}хладной торговлей{/g} промышляет по совместительству... Ух! Пикантные ощущения. Словно все сразу сделались тебе и союзниками, и врагами. Ну а как вы поживаете, свет очей моих?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай увлеченно сравнивает записи в золоченной инфопластине и свежие отчеты с Футфола. Завидев вас, женщина с улыбкой откладывает и то, и другое.
  - speaker: Контрабандист
    text_clean: Ах, шерин! Нелегок труд имперского представителя, а когда он еще и хладной торговлей промышляет по совместительству... Ух! Пикантные ощущения. Словно все сразу сделались тебе и союзниками, и врагами. Ну а как вы поживаете, свет очей моих?
- guid: ed158505-6f2f-48b1-a1f0-c83f1d8234e5
  event: Companions_Smugler_78
  text: '"Ты похож{mf||а} на одного моего знакомого, {name}. Тот имел лавку с товарами, но вечно завидовал своему соседу, потому что его лавка приносила больше. Тогда мой знакомый убил соседа и отобрал его лавку, только товары соседские ему не понравились — и он заменил их на свои. В итоге лавка соседа так и не стала приносит ему больше прибыли".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Ты похож на одного моего знакомого, КЭП. Тот имел лавку с товарами, но вечно завидовал своему соседу, потому что его лавка приносила больше. Тогда мой знакомый убил соседа и отобрал его лавку, только товары соседские ему не понравились — и он заменил их на свои. В итоге лавка соседа так и не стала приносит ему больше прибыли.
- guid: da6bfe83-5f88-4036-add2-58193e5b7fb0
  event: Companions_Smugler_79
  text: '"Допустим, "ажи" — так я зову всякого злодея и подонка, ибо "ажи" есть и зло, и враг, и ничтожный червь, недостойный даже лишней мысли. Или же "ашмаг" — глупец, и младший брат, и слепой, что не разбирает дороги и без чужого наставления упадет в яму. "Шерин" же... "шерин" есть друг, и товарищ, и сосед в боевом построении — как мы с вами, {name}".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Допустим, "ажи" — так я зову всякого злодея и подонка, ибо "ажи" есть и зло, и враг, и ничтожный червь, недостойный даже лишней мысли. Или же "ашмаг" — глупец, и младший брат, и слепой, что не разбирает дороги и без чужого наставления упадет в яму. "Шерин" же... "шерин" есть друг, и товарищ, и сосед в боевом построении — как мы с вами, КЭП.
- guid: 920c59a5-356d-4feb-bb1b-2c8338356f02
  event: Companions_Smugler_81
  text: '"Доверяю ли я Двойняшкам-Ловкачам? Помилуй Великий! Проходимцы Футфола не зря прозвали подобным образом сих бесноватых ашмагов, ибо за их "ловкостью" скрываются вещи куда более интригующие, чем могли бы подумать граждане совестливые и прямодушные". {n}Воспоминания о товарищах заставляют глаза торговки сиять чуть ярче обычного.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Доверяю ли я Двойняшкам-Ловкачам? Помилуй Великий! Проходимцы Футфола не зря прозвали подобным образом сих бесноватых ашмагов, ибо за их "ловкостью" скрываются вещи куда более интригующие, чем могли бы подумать граждане совестливые и прямодушные.
  - speaker: narrator
    text_clean: Воспоминания о товарищах заставляют глаза торговки сиять чуть ярче обычного.
- guid: aabcb9d7-3991-4f29-9788-7217648f9bbf
  event: Companions_Smugler_82
  text: '"С другой стороны, именно за это я и держу их подле. Кор и Торра хорошо знают, чья именно рука вытащила их из выгребной ямы, гордо именуемой Теневыми Кварталами Футфола. И кто все это время подкармливал их ненасытного зверя, именуемого жаждой наживы? Нет, они не предадут меня хотя бы потому, что знают — отныне я в вашей свите, шерин. А уж настолько большой кусок сладкого имперского рулета они просто не в силах упустить".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: С другой стороны, именно за это я и держу их подле. Кор и Торра хорошо знают, чья именно рука вытащила их из выгребной ямы, гордо именуемой Теневыми Кварталами Футфола. И кто все это время подкармливал их ненасытного зверя, именуемого жаждой наживы? Нет, они не предадут меня хотя бы потому, что знают — отныне я в вашей свите, шерин. А уж настолько большой кусок сладкого имперского рулета они просто не в силах упустить.
- guid: eb6f737d-1c17-472f-9439-a4eafceb3ee4
  event: Companions_Smugler_83
  text: '"Нет?" {n}Cо вздохом искреннего разочарования женщина отстраняется, заправляя непослушный локон за ухо.{/n} "Похоже, ажи затуманили мой разум, шерин. Или это был ваш пронзительный взгляд? В любом случае, я лишь хотела отблагодарить за помощь и подарить кое-что еще, помимо сего скромного дара". {n}В руках Джай появляется небольшой сверток, явно подготовленный заранее.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Нет?
  - speaker: narrator
    text_clean: Cо вздохом искреннего разочарования женщина отстраняется, заправляя непослушный локон за ухо.
  - speaker: Контрабандист
    text_clean: Похоже, ажи затуманили мой разум, шерин. Или это был ваш пронзительный взгляд? В любом случае, я лишь хотела отблагодарить за помощь и подарить кое-что еще, помимо сего скромного дара.
  - speaker: narrator
    text_clean: В руках Джай появляется небольшой сверток, явно подготовленный заранее.
- guid: f7fd4ac6-6384-4811-bc5f-a562eee1fcad
  event: Companions_Smugler_84
  text: '"О, я абсолютно точно не против, шерин". {n}Под приглушенные охи окружающих Джай жадно впивается в ваши губы.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О, я абсолютно точно не против, шерин.
  - speaker: narrator
    text_clean: Под приглушенные охи окружающих Джай жадно впивается в ваши губы.
- guid: 0ba4392b-3ab3-4f59-8f65-32edcd4ecb35
  event: Companions_Smugler_85
  text: '"Если это принесет покой вашему сердцу, шерин, мы так и поступим". {n}Холод аугмента касается вашей ладони, и Джай уводит вас прочь с капитанского мостика.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Если это принесет покой вашему сердцу, шерин, мы так и поступим.
  - speaker: narrator
    text_clean: Холод аугмента касается вашей ладони, и Джай уводит вас прочь с капитанского мостика.
- guid: 33754f03-b2f4-41c3-9e6c-51abc6f17bfc
  event: Companions_Smugler_86
  text: '{n}Джай отстраняется и почти обиженно вздыхает.{/n} "Вы же не подумали, что я таким образом пытаюсь откупиться, шерин? Вот, держите: скромный дар в благодарность за проявленную заботу. И пусть Великий и дальше оберегает пути, по которым вы ходите".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай отстраняется и почти обиженно вздыхает.
  - speaker: Контрабандист
    text_clean: 'Вы же не подумали, что я таким образом пытаюсь откупиться, шерин? Вот, держите: скромный дар в благодарность за проявленную заботу. И пусть Великий и дальше оберегает пути, по которым вы ходите.'
- guid: f255e6a6-e2a8-40da-972b-a7fd9d6c0a76
  event: Companions_Smugler_87
  text: '{n}Бровь торговки изгибается в непритворном изумлении, спустя несколько секунд она аккуратно отвечает, потупив взор.{/n} "У Вольного Торговца не бывает друзей, о шерин. Только слуги, для которых воля госпо{mf|дина|жи} — нерушимый закон. И партнеры, для которых благосклонность венценосн{mf|ого|ой} есть высшая награда за совместные труды. Ну что вы так смотрите? Разве есть друзья у Солнца, сияющего над {g|Encyclopedia:HolyTerra}священной Террой{/g}?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Бровь торговки изгибается в непритворном изумлении, спустя несколько секунд она аккуратно отвечает, потупив взор.
  - speaker: Контрабандист
    text_clean: У Вольного Торговца не бывает друзей, о шерин. Только слуги, для которых воля господина — нерушимый закон. И партнеры, для которых благосклонность венценосного есть высшая награда за совместные труды. Ну что вы так смотрите? Разве есть друзья у Солнца, сияющего над священной Террой?
- guid: fde27e5b-efa7-4d0f-aaa6-e2acd2a0315b
  event: Companions_Smugler_88
  text: '"Впрочем, вы вольны называть наши отношения так, как вам больше нравится, шерин. Все же слова — это просто слова. Однако как вы позаботились обо мне, так и я хочу позаботиться о вас... Чуть сверх оговоренного. Вот, держите: скромный дар в благодарность за помощь. И пусть Великий и дальше оберегает пути, по которым вы ходите".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'Впрочем, вы вольны называть наши отношения так, как вам больше нравится, шерин. Все же слова — это просто слова. Однако как вы позаботились обо мне, так и я хочу позаботиться о вас... Чуть сверх оговоренного. Вот, держите: скромный дар в благодарность за помощь. И пусть Великий и дальше оберегает пути, по которым вы ходите.'
- guid: 6491d249-0777-4466-a169-f35c70a11a48
  event: Companions_Smugler_89
  text: '"Но спасибо на добром слове. Приятно знать, что мои солдатские словечки не отпугнули тебя". {n}Джай снова ухмыляется, в этот раз совсем по-доброму.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Но спасибо на добром слове. Приятно знать, что мои солдатские словечки не отпугнули тебя.
  - speaker: narrator
    text_clean: Джай снова ухмыляется, в этот раз совсем по-доброму.
- guid: 71c11125-8e12-4847-a2fe-80e64122201d
  event: Companions_Smugler_91
  text: '"Да много чего было, шерин, всего и не припомнишь". {n}Солдафонский тон вдруг сменяется знакомый медовым голосом.{/n} "Про Простор я тебе всю правду, как есть, рассказала. Про {g|Encyclopedia:Footfall}Футфол{/g} и Владайма... Про то, как дела у нас ведутся. Не пойми неправильно, свет моих уставших очей, я в этой жизни не люблю две вещи: на прошлое оборачиваться, и когда в душу без спросу лезут".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Да много чего было, шерин, всего и не припомнишь.
  - speaker: narrator
    text_clean: Солдафонский тон вдруг сменяется знакомый медовым голосом.
  - speaker: Контрабандист
    text_clean: 'Про Простор я тебе всю правду, как есть, рассказала. Про Футфол и Владайма... Про то, как дела у нас ведутся. Не пойми неправильно, свет моих уставших очей, я в этой жизни не люблю две вещи: на прошлое оборачиваться, и когда в душу без спросу лезут.'
- guid: c8f51659-c94d-4cb8-9bd5-205076726d16
  event: Companions_Smugler_92
  text: '"А что, думаешь, это так сложно? Однажды нам с товарищами довелось тайком проникнуть на территорию верхнего города в поисках добротной питейной, где обретались сильные местного мира. В другой раз наш полк бросили на защиту высших шпилей мира-улья... И я все поняла. Увидела, как можно жить тем, кто родился с бриллиантовой ложкой во рту, а не походной лопаткой в заднице".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: А что, думаешь, это так сложно? Однажды нам с товарищами довелось тайком проникнуть на территорию верхнего города в поисках добротной питейной, где обретались сильные местного мира. В другой раз наш полк бросили на защиту высших шпилей мира-улья... И я все поняла. Увидела, как можно жить тем, кто родился с бриллиантовой ложкой во рту, а не походной лопаткой в заднице.
- guid: 558b2e42-220b-4edd-a4aa-271dcca3b294
  event: Companions_Smugler_93
  text: '"Клянусь отцом-забулдыгой, что сдал меня в карьеры, и еще одиннадцатью несуществующими братьями и сестрами, шерин!"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Клянусь отцом-забулдыгой, что сдал меня в карьеры, и еще одиннадцатью несуществующими братьями и сестрами, шерин!
- guid: e017931f-1207-4af0-a821-c142d28d2008
  event: Companions_Smugler_94
  text: '{n}Джай безразлично пожимает плечами.{/n} "Ребята с {g|Encyclopedia:Footfall}Футфола{/g} — вот моя единственная семья, шерин. Двойняшки-Ловкачи да прочий сброд. Простые в общении, преданные, как собаки... И порой тупые, как навершие изношенного меча".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай безразлично пожимает плечами.
  - speaker: Контрабандист
    text_clean: Ребята с Футфола — вот моя единственная семья, шерин. Двойняшки-Ловкачи да прочий сброд. Простые в общении, преданные, как собаки... И порой тупые, как навершие изношенного меча.
- guid: 8f92767e-07ab-475c-8015-5b9152f335dd
