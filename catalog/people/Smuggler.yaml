    text_clean: Джай с патетическим вздохом разводит руками.
- guid: 35504040-5b86-49af-8cd2-4e7e59f697e3
  event: Companions_Smugler_40
  text: '"В отличие от Вольных Торговцев, которым священные {g|Encyclopedia:Warrant}Патенты{/g} помогают обходить даже законы Великого, агенты Касбаллики привыкли скрываться и заметать следы. Никто не хочет привлекать к себе лишнее внимание кого б то ни было... тем более что у Простора теперь в комендантах один из воинов {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: В отличие от Вольных Торговцев, которым священные Патенты помогают обходить даже законы Великого, агенты Касбаллики привыкли скрываться и заметать следы. Никто не хочет привлекать к себе лишнее внимание кого б то ни было... тем более что у Простора теперь в комендантах один из воинов Золотого Трона.
- guid: 24325797-5099-4f9e-9361-07254c39e484
  event: Companions_Smugler_41
  text: '"В общем, шерин, я на своей шкуре испытала то, что болтают ваши офицеры — что в присутствии взволнованной Орселлио любой несчастный теряет голову и становится охвачен ажи. Ох, и неприятно же это... помню только, что забились все по углам и верещали как сирены сигнальные. Ну а Кассия... Кассия, кажется, была смущена состоянием наших одежд, которые, как вы понимаете, были весьма скудны в тот момент. Не успела я в себя прийти, как бедняжки уже и след простыл. Вышло, право, неловко... А прибить я обещала одну из девок, которую, на свою беду, сама же зазвала: эта кассха под шумок увела у меня набитый кисет отменного {g|Encyclopedia:Lho}лхо{/g}!"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'В общем, шерин, я на своей шкуре испытала то, что болтают ваши офицеры — что в присутствии взволнованной Орселлио любой несчастный теряет голову и становится охвачен ажи. Ох, и неприятно же это... помню только, что забились все по углам и верещали как сирены сигнальные. Ну а Кассия... Кассия, кажется, была смущена состоянием наших одежд, которые, как вы понимаете, были весьма скудны в тот момент. Не успела я в себя прийти, как бедняжки уже и след простыл. Вышло, право, неловко... А прибить я обещала одну из девок, которую, на свою беду, сама же зазвала: эта кассха под шумок увела у меня набитый кисет отменного лхо!'
- guid: 64e64c33-fb0d-431d-80c1-3e38853fef19
  event: Companions_Smugler_42
  text: '"{g|Encyclopedia:KoronusExpanse}Простор Коронус{/g}... каково название, а?" {n}Джай деланно прищуривается от удовольствия.{/n} "Но не в эту окраину я бежала изначально, шерин. Нет, в Простор Коронус меня позже привели слухи о небывалой свободе, коей щедро наделены все, кто выжил в этих краях. Тут все дороги открыты — и в святые, и в богатеи, и в вершители чужих судеб, да куда душа изволит. Здесь окупаются старания тех, кто не привык возлежать ленно и сетовать на жизнь, а вместо того трудится денно и нощно на благо — души ли, славы иль казны своей. Я из таких. И здесь я нашла свое благословение".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Простор Коронус... каково название, а?
  - speaker: narrator
    text_clean: Джай деланно прищуривается от удовольствия.
  - speaker: Контрабандист
    text_clean: Но не в эту окраину я бежала изначально, шерин. Нет, в Простор Коронус меня позже привели слухи о небывалой свободе, коей щедро наделены все, кто выжил в этих краях. Тут все дороги открыты — и в святые, и в богатеи, и в вершители чужих судеб, да куда душа изволит. Здесь окупаются старания тех, кто не привык возлежать ленно и сетовать на жизнь, а вместо того трудится денно и нощно на благо — души ли, славы иль казны своей. Я из таких. И здесь я нашла свое благословение.
- guid: 2a2c2e69-731d-4742-a957-067cb8d7a205
  event: Companions_Smugler_43
  text: '{n}Темные глаза Джай чуть расширяются от удивления.{/n} "О шерин, благодарю вас за проявленную милость! Я буду смиренно ждать, пока вы не направите свой корабль в сторону Даргонуса! Меркатум Табула Официале... Ах, звучит почти так же величественно, как Торговый Патент!"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Темные глаза Джай чуть расширяются от удивления.
  - speaker: Контрабандист
    text_clean: О шерин, благодарю вас за проявленную милость! Я буду смиренно ждать, пока вы не направите свой корабль в сторону Даргонуса! Меркатум Табула Официале... Ах, звучит почти так же величественно, как Торговый Патент!
- guid: f7b626cb-5e91-4bac-881f-05b5ffeab279
  event: Companions_Smugler_44
  text: '"Все просто, шерин. {g|Encyclopedia:KasballicaMission}Касбаллика{/g} заправляет теневым рынком {g|Encyclopedia:Imperium}Империума{/g}, предоставляя всем, кто может оплатить их услуги, доступ к особым товарам. Да, я сейчас говорю в том числе и о ксеноартефактах — оружии, технологиях... иногда даже отдельных видах, ммм, живых существ".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Все просто, шерин. Касбаллика заправляет теневым рынком Империума, предоставляя всем, кто может оплатить их услуги, доступ к особым товарам. Да, я сейчас говорю в том числе и о ксеноартефактах — оружии, технологиях... иногда даже отдельных видах, ммм, живых существ.
- guid: 41ddc65b-4245-4903-9506-26db4b79a73c
  event: Companions_Smugler_45
  text: '"Древняя преступная организация, берущая начало с первых поселенцев сектора Каликсис. Ей заправляют теневые кланы, возглавляемые преступными баронами. Перейдете им дорогу — и рискуете нажить врагов по всему Простору Коронус. Или даже {g|Encyclopedia:Imperium}Империуму{/g}. Ну а исполнители — просто бесстыдные, алчные до наживы мрази".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Древняя преступная организация, берущая начало с первых поселенцев сектора Каликсис. Ей заправляют теневые кланы, возглавляемые преступными баронами. Перейдете им дорогу — и рискуете нажить врагов по всему Простору Коронус. Или даже Империуму. Ну а исполнители — просто бесстыдные, алчные до наживы мрази.
- guid: 9277bc02-9959-4076-8ef9-c99d5d61e460
  event: Companions_Smugler_46
  text: '"Почему бы и нет. Вам решать, шерин".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Почему бы и нет. Вам решать, шерин.
- guid: 028a012e-9453-414e-8649-29207f5a1580
  event: Companions_Smugler_47
  text: '"Убедила отца, что хочу лично проводить ревизию импортируемых товаров — надо же ума набираться, чтобы род не опозорить. В порту познакомилась с торговцами, миссионерами, солдатами. Слушала их рассказы, изучала карты, узнала, какие документы нужно подделать, чтобы покинуть планету. Слово здесь, монета там — и вот я уже в железном брюхе корабля, спешу в Пустоту за новой жизнью".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Убедила отца, что хочу лично проводить ревизию импортируемых товаров — надо же ума набираться, чтобы род не опозорить. В порту познакомилась с торговцами, миссионерами, солдатами. Слушала их рассказы, изучала карты, узнала, какие документы нужно подделать, чтобы покинуть планету. Слово здесь, монета там — и вот я уже в железном брюхе корабля, спешу в Пустоту за новой жизнью.
- guid: 5f9ae28b-23c4-407e-aff5-33fb633ab935
  event: Companions_Smugler_48
  text: '"О шерин, светило десятка миров и миллиардов подданных! Пришли потолковать с Джай Хейдари о душевной сладости? Или вести речи с торговым представителем {g|Encyclopedia:Imperium}Империума{/g}?" {n}Джай держится непреклонно еще пару секунд, а затем разливается сладким смехом по мостику.{/n} "Ну как, {name}, подходит мне личина одной из самых могущественных людей в {g|Encyclopedia:KoronusExpanse}Просторе{/g}?"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О шерин, светило десятка миров и миллиардов подданных! Пришли потолковать с Джай Хейдари о душевной сладости? Или вести речи с торговым представителем Империума?
  - speaker: narrator
    text_clean: Джай держится непреклонно еще пару секунд, а затем разливается сладким смехом по мостику.
  - speaker: Контрабандист
    text_clean: Ну как, КЭП, подходит мне личина одной из самых могущественных людей в Просторе?
- guid: 2d2bc63d-cc38-4ac1-8bc1-03a5767b9736
  event: Companions_Smugler_49
  text: '"Считайте, что это отпечаток моего ремесла. Вот это..." {n}— Механическая ладонь Джай сжимается в кулак. — {/n} "{g|Encyclopedia:Xenos}Ксеносы{/g}. Тупоголовые орки... Эх, кто ж знал, что на обломки имперского рейдера позарились не только мы? А это сокровище..."{n} — Джай касается драгоценного шейного {g|Encyclopedia:Augmentation}импланта{/g}.{/n} "...я получила в награду за хорошую жизнь. Слишком торопилась в "Адептус Амасекус" после того, как Великий благословил меня безмерным богатством. За две подворотни меня и подстерег ничтожный ашмаг, позавидовавший чужой удаче". {n}Женщина проводит большим пальцем поперек шеи.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Считайте, что это отпечаток моего ремесла. Вот это...
  - speaker: narrator
    text_clean: — Механическая ладонь Джай сжимается в кулак. —
  - speaker: Контрабандист
    text_clean: Ксеносы. Тупоголовые орки... Эх, кто ж знал, что на обломки имперского рейдера позарились не только мы? А это сокровище...
  - speaker: narrator
    text_clean: — Джай касается драгоценного шейного импланта.
  - speaker: Контрабандист
    text_clean: '...я получила в награду за хорошую жизнь. Слишком торопилась в "Адептус Амасекус" после того, как Великий благословил меня безмерным богатством. За две подворотни меня и подстерег ничтожный ашмаг, позавидовавший чужой удаче.'
  - speaker: narrator
