  text: '"Истина открылась мне, шерин: Империум таит слишком много возможностей даже для таких, как я. Главное — знать, кому на лапу вовремя дать, кого послать, кого припугнуть, ну а кому задницу подлизать приятным словечком. Знаешь, меня все командование любило — достану им то, достану это... Ну, так вот Касбаллика меня и заприметила".'
