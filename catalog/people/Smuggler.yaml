- guid: fdb1343a-47c2-44da-a0f1-f35e9c157464
  event: Companions_Smugler_11
  text: '"Ни в коем случае, шерин, я не расстанусь с сим сокровищем — Великий тому свидетель, а также все звезды Простора, что россыпью жемчуга сияют во тьме галактики! Однако же к вам у меня остался один вопрос..." {n}Джай заговорщически улыбается, подается вперед и под косые взгляды офицеров бесстыже заглядывает в глаза, ожидая ответа.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Ни в коем случае, шерин, я не расстанусь с сим сокровищем — Великий тому свидетель, а также все звезды Простора, что россыпью жемчуга сияют во тьме галактики! Однако же к вам у меня остался один вопрос...
