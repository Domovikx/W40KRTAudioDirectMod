- guid: f1b22c08-a581-49e4-a4ab-b05c4544c1fd
  event: Companions_Smugler_123
  text: '"Но всему в этом мире есть предел, шерин. И уже-совсем-не-девочка окрепла, связалась с {g|Encyclopedia:KasballicaMission}Касбалликой{/g}, накопила себе порядком золотишка и даже почти регулярно баловалась излишествами... Пока однажды чуть не поплатилась за хорошую жизнь головой, когда покровители девочки попали под внутреннее расследование Оффицио Префектум и Департменто Муниторум".'
