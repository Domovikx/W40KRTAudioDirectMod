- guid: c306e76f-ecb4-4d25-ae70-a7fb23c5d379
  event: Companions_Smugler_51
  text: '"И это говорите мне вы, {name}?" {n}Джай иронично изгибает бровь.{/n} "Я устала строчить бесконечные контракты и соглашения, отсиживаясь на Футфоле. Занимаюсь этим последние... сколько лет? А там, меж звезд, ты всегда на острие ножа. Ничто так не щекочет нервы, как напряжение от полетов сквозь {g|Encyclopedia:Warp}варп{/g} или ожидание опасности за каждым углом на планете. На Футфоле я начала костенеть и глупеть, шерин. Я этого не хочу".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: И это говорите мне вы, КЭП?
  - speaker: narrator
    text_clean: Джай иронично изгибает бровь.
  - speaker: Контрабандист
    text_clean: Я устала строчить бесконечные контракты и соглашения, отсиживаясь на Футфоле. Занимаюсь этим последние... сколько лет? А там, меж звезд, ты всегда на острие ножа. Ничто так не щекочет нервы, как напряжение от полетов сквозь варп или ожидание опасности за каждым углом на планете. На Футфоле я начала костенеть и глупеть, шерин. Я этого не хочу.
- guid: 62d5c8ac-4e37-4e66-9252-67650f33b5fb
  event: Companions_Smugler_52
  text: '"По сравнению с оборванцами с Футфола? Возможно. По сравнению с вами?" {n}Джай изгибает бровь.{/n} "Будь то деньги или власть — мне еще есть куда стремиться. Я могла бы купить один из астероидов Футфола, но не планету. Могла бы подмять часть банд из теневых кварталов, но не Владайма! Так что, отвечая на ваш вопрос — нет, я не считаю себя богатой. Недостаточно".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: По сравнению с оборванцами с Футфола? Возможно. По сравнению с вами?
