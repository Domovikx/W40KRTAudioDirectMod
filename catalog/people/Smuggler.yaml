  text: '"Капрал Хейдари к бою готова, {mf|сэр|мэм}!" {n}Джай салютует, но дурацкая выходка только портит ей настроение.{/n} "Нажралась я достаточно дерьма в Астра Милитарум, шерин. Да и напоминаний о стычках с {g|Encyclopedia:Xenos}ксеносами{/g} и еретиками на моем теле достаточно. Вот только... бывших гвардейцев не бывает. Эта собачья жизнь глубоко во мне засела. Зато я прекрасно помню, каково это — быть маленькой, дрожащей, ничего не значащей пешкой. И потому больше ценю то, что имею".'
