- guid: a0d7a8aa-6ddc-4d8c-9612-2c9e1f962759
  event: Companions_Smugler_69
  text: '"Хищные, жестокие, опасные твари. Ксеносы обычно не цацкаются с людьми — для них мы развлечение, способ развеять скуку, товар... Но иногда некоторые из них выходят на связь — через своих людей. Не обманывайте себя мыслью о том, что, раз вы не видите ксеносов среди нас, то вы в безопасности. Эти ажи столь же хитры, сколь и кровожадны: они искусно пользуются шпионами и предателями среди нашего числа, подчиняют своей воле тех, кто не польстился на награду, превращают в бездушных марионеток тех, кто выстоял против их посулов... Меня хранит {g|Encyclopedia:Emperor}Император{/g} и потому я до сих пор не повторила судьбу многих своих коллег, расставшихся с жизнью из-за долговязых мерзавцев".'
  speaker: null
