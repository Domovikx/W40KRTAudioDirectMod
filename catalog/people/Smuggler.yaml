  event: Companions_Smugler_115
  text: '{n}Искры в темных глазах на мгновение затухают.{/n} "Моя банда то еще пустотное чудовище, шерин, — на одной шее сразу три головы растут! Так что безвременная кончина Кора никак нашим с вами делам не помешает". {n}Джай отводит взгляд и продолжает непривычно сухо.{/n} "Двойняшку его немного жаль — Торра с младых ногтей вместе с братом во все переделки вляпывается. И выкарабкивается. А в этот раз...".'
