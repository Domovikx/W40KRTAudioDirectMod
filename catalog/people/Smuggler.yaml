  text: '"О, шерин. Несколькими словами вам удалось заставить мое сердце трепетать подобно певчей птице, угодившей в силок умелого охотника. Неужели вам со мной весело? Возможно, вы даже считаете меня... забавной? Всякая девушка мечтает услышать, что из нее выйдет славная игрушка и достойное развлечение". {n}Джай добавляет в голос ровно столько сарказма, чтобы вы его заметили. И столько же шутливой иронии в манящий изгиб улыбки.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
