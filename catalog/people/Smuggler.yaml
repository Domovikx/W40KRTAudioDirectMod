  event: Companions_Smugler_114
  text: '{n}Джай благодарно кивает.{/n} "Ну, тогда решено, {name}! С сегодняшнего дня я поплыву навстречу избранной мною судьбе. Ах, как завораживающе — наблюдать, куда же несут тебя волны..."'
