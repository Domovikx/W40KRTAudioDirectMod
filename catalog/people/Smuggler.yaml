    text_clean: Ослепительно улыбаясь вам, Джай воркует голоском трепещущей монашки, в котором лишь изредка прорезаются смешливые нотки.
- guid: 629b7c0e-6098-4188-af13-8f6b94d2f9e2
  event: Companions_Smugler_173
  text: '"О! Как вы суровы и беспощадны! Неужели вы можете убить человека из одной только ревности? А двух или трех?.. Как страшны Вольные Торговцы, мое сердце трепещет. И какое счастье, что вам не придется проливать кровь невинных, ведомых любовью — ведь ни один из них не вправе претендовать на меня. Все они изнывают от страсти на почтительном расстоянии, угрызаясь и проклиная свою жестокую судьбу".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О! Как вы суровы и беспощадны! Неужели вы можете убить человека из одной только ревности? А двух или трех?.. Как страшны Вольные Торговцы, мое сердце трепещет. И какое счастье, что вам не придется проливать кровь невинных, ведомых любовью — ведь ни один из них не вправе претендовать на меня. Все они изнывают от страсти на почтительном расстоянии, угрызаясь и проклиная свою жестокую судьбу.
