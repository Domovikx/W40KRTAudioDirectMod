  event: Companions_Smugler_16
  text: '"Благодарю, шерин. Впрочем, главные из них — чтение и письмо. Возможно, вам это невдомек, но для миллиардов имперцев это непостижимая наука — без которой, впрочем, они прекрасно обходятся на своих пожизненных постах на заводах, плантациях и сборочных линиях. Я? Я не для того удрала с Ифрита, чтобы обречь себя на подобное прозябание. И именно грамотность открыла мне дорогу к скопированным приказам, фальшивым подписям, подложным документам... всему тому, что заставляет вращать бюрократические машины в верном направлении".'
