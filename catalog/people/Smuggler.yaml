    text_clean: Нажралась я достаточно дерьма в Астра Милитарум, шерин. Да и напоминаний о стычках с ксеносами и еретиками на моем теле достаточно. Вот только... бывших гвардейцев не бывает. Эта собачья жизнь глубоко во мне засела. Зато я прекрасно помню, каково это — быть маленькой, дрожащей, ничего не значащей пешкой. И потому больше ценю то, что имею.
- guid: 087e1734-6fa6-4826-be63-9c61c30e98f7
  event: Companions_Smugler_37
  text: '"Пожалуй, эта тема себя исчерпала".'
