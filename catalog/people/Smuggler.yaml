  event: Companions_Smugler_172
  text: '"Вы посягаете на сокровища моей души, мои маленькие секреты. Как иначе я могу уберечь их от столь могущественно{mf|го|й} грабител{mf|я|ьницы}, как Вольный Торговец? Не посмею же я вам отказать!" {n}Ослепительно улыбаясь вам, Джай воркует голоском трепещущей монашки, в котором лишь изредка прорезаются смешливые нотки.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
