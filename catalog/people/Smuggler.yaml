  event: Companions_Smugler_62
  text: '"И снова вы, шерин, балуете меня блеском своего присутствия! Решили вновь потешить душу жемчугом моего красноречия? Или желаете обсудить деловые вопросы с новоиспеченной держательницей Меркатум Табула Официале?" {n}Улыбка Джай сияет ярче самой лучезарной звезды.{/n}'
