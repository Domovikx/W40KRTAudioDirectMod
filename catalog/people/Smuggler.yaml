  event: Companions_Smugler_12
  text: '"Сладость ваших губ, шерин, дурманит разум сильнее каликсийского вина в жаркий день. Но вы же не думали, что я отпущу вас вот так просто?" {n}Персиковый румянец играет на щеках контрабандистки, а глаза разгораются ярче обычного, когда Джай протягивает вам небольшой сверток.{/n} "Скромный дар в благодарность за проявленную заботу. И пусть Великий и дальше оберегает пути, по которым вы ходите".'
