    text_clean: Джай благодарно кивает.
  - speaker: Контрабандист
    text_clean: Ну, тогда решено, КЭП! С сегодняшнего дня я поплыву навстречу избранной мною судьбе. Ах, как завораживающе — наблюдать, куда же несут тебя волны...
