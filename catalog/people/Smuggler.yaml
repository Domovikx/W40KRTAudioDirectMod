  event: Companions_Smugler_117
  text: '"Так Вигдис все же прослушивает мою {g|Encyclopedia:Vox}вокс-линию{/g}..." {n}Джай криво ухмыляется и пожимает плечами.{/n} "Не угрожала я вашему {g|Encyclopedia:Navigator}Навигатору{/g}, и в мыслях не было. Я просто отдыхала — в хорошей компании из ароматного {g|Encyclopedia:Amasec}амасека{/g}, душистого лхо и нескольких новых приятелей с верхних палуб... И тут в самый разгар веселья к нам залетает Леди-Навигатор и с порога несет что-то о том, что у нее раскалывается голова от пестрых всплесков из нашей каюты".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Так Вигдис все же прослушивает мою вокс-линию...
