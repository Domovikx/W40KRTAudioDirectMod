- guid: d2acdc92-ae99-4abd-a8e5-5a464c6669d0
  event: Companions_Smugler_127
  text: '{n}Джай прикрывает глаза, погружаясь в омут воспоминаний.{/n} "Затем за девочкой пришли слуги {g|Encyclopedia:Emperor}Его{/g} и забрали в Девятнадцатый Ифритский полк, представляешь? Конечно, его смели в первую же вылазку, но девочка выжила — Великий оградил! А что же дальше? Служба в {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g}, много, просто до жопы много труда. И битв. И сделок... Новых возможностей и мутных связей".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай прикрывает глаза, погружаясь в омут воспоминаний.
  - speaker: Контрабандист
    text_clean: Затем за девочкой пришли слуги Его и забрали в Девятнадцатый Ифритский полк, представляешь? Конечно, его смели в первую же вылазку, но девочка выжила — Великий оградил! А что же дальше? Служба в Астра Милитарум, много, просто до жопы много труда. И битв. И сделок... Новых возможностей и мутных связей.
- guid: d246dda0-c99c-48ce-9ac3-78ba85f7dedf
  event: Companions_Smugler_128
  text: '"Да ла-а-адно, шерин? А мне кажется, ты был{mf||а} вполне готов{mf||а} поверить в мою отточенную временем актерскую игру".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Да ла-а-адно, шерин? А мне кажется, ты был вполне готов поверить в мою отточенную временем актерскую игру.
- guid: 5db4ac3b-7e37-4d78-804a-091f2eb6edb4
  event: Companions_Smugler_129
  text: '"Да, я слегка увлеклась, шерин. Признаю за собой этот грех".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Да, я слегка увлеклась, шерин. Признаю за собой этот грех.
- guid: 4a9139a3-fc0c-4852-a4d2-905254e34a01
  event: Companions_Smugler_13
  text: '"Будто у меня был выбор, шерин!" {n}Джай смеется искренне, без стеснения.{/n} "Нет, я все еще мыслю здраво".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Будто у меня был выбор, шерин!
  - speaker: narrator
    text_clean: Джай смеется искренне, без стеснения.
  - speaker: Контрабандист
    text_clean: Нет, я все еще мыслю здраво.
- guid: 8985996f-53dc-4eb6-a2f1-435e70d9e861
  event: Companions_Smugler_130
  text: '"Не сомневаюсь, что вы — великолепн{mf|ый|ая} собеседни{mf|к|ца}, шерин. Я запомню ваше приглашение и обязательно воспользуюсь им... когда проголодаюсь".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Не сомневаюсь, что вы — великолепный собеседник, шерин. Я запомню ваше приглашение и обязательно воспользуюсь им... когда проголодаюсь.
- guid: b5caedef-9914-4e7a-b836-353bc5a4b39b
  event: Companions_Smugler_131
  text: '"Я понимаю. Это просто маленькая забава, шерин. Не могу же я просто ответить: "О, вы мне тоже нравитесь, {name}". Эти слова сухи и скучны, как трапеза пустотного караванщика. Они недостойны нас с вами".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'Я понимаю. Это просто маленькая забава, шерин. Не могу же я просто ответить: "О, вы мне тоже нравитесь, КЭП". Эти слова сухи и скучны, как трапеза пустотного караванщика. Они недостойны нас с вами.'
- guid: a35aa9d7-876e-4c72-9c04-d806f8e0aed0
  event: Companions_Smugler_132
  text: '"Ну конечно! Это же очевидно!" {n}Смех Джай звенит, словно ручей с бесценной водой в ее жарком и очень, очень изысканном в вопросах ухаживания миром.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Ну конечно! Это же очевидно!
  - speaker: narrator
    text_clean: Смех Джай звенит, словно ручей с бесценной водой в ее жарком и очень, очень изысканном в вопросах ухаживания миром.
- guid: 81e2cad0-47c9-4222-9900-ab81c6ada35d
  event: Companions_Smugler_133
  text: '"О нет, только не смертоубийство во имя моей любви. Я не могу отвергнуть столь пылк{mf|ого|ую} поклонни{mf|ка|цу}, так зло надругаться над искренней страстью было бы грехом в глазах Великого!"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О нет, только не смертоубийство во имя моей любви. Я не могу отвергнуть столь пылкого поклонника, так зло надругаться над искренней страстью было бы грехом в глазах Великого!
- guid: ffe16ebc-3714-4ac0-a4cb-c1b6ec365412
  event: Companions_Smugler_134
  text: '"...сейчас отправятся вместе со мной к ажи". {n}Джай весело хохочет.{/n} "Я поняла, шерин".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: '...сейчас отправятся вместе со мной к ажи.'
  - speaker: narrator
    text_clean: Джай весело хохочет.
  - speaker: Контрабандист
    text_clean: Я поняла, шерин.
- guid: 46725b58-eebe-4c5d-bf1c-9301dab65171
  event: Companions_Smugler_135
  text: '"Тогда помолчим вместе об этом прекрасном чувстве, шерин".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Тогда помолчим вместе об этом прекрасном чувстве, шерин.
- guid: fce315df-670c-413d-a79d-4561042526dc
  event: Companions_Smugler_136
  text: '"Я — лишь хрупкий цветок в вашей сильной руке, шерин. Я могу лишь дарить вам данный мне Великим аромат, пока не наскучу. Отбросьте меня прочь, и пусть палящий зной обратит меня в иссушенный саркофаг для чувства, что некогда было между нами".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Я — лишь хрупкий цветок в вашей сильной руке, шерин. Я могу лишь дарить вам данный мне Великим аромат, пока не наскучу. Отбросьте меня прочь, и пусть палящий зной обратит меня в иссушенный саркофаг для чувства, что некогда было между нами.
- guid: 5f07a00a-9bd6-400b-a65b-5db839cb7081
  event: Companions_Smugler_137
  text: '"Джай Хейдари ведет дела с опасными людьми, переменчивыми людьми. Такими, как Вольный Торговец. Не будь она понятлива, жизнь ее стала бы горше, чем дым лхо, вылетающий из старческих уст".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Джай Хейдари ведет дела с опасными людьми, переменчивыми людьми. Такими, как Вольный Торговец. Не будь она понятлива, жизнь ее стала бы горше, чем дым лхо, вылетающий из старческих уст.
- guid: 19776111-2684-47cd-9f72-e0348b88c2f6
  event: Companions_Smugler_138
  text: '"Да. Лишиться меня, оставить себе лишь воспоминания о Джай Хейдари — звучит действительно ужасно. Кто захотел бы носить на сердце печать столь ужасных сожалений?"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Да. Лишиться меня, оставить себе лишь воспоминания о Джай Хейдари — звучит действительно ужасно. Кто захотел бы носить на сердце печать столь ужасных сожалений?
- guid: ac9a8bb3-d298-412f-b070-a48dff8970e5
  event: Companions_Smugler_139
  text: '"Нравится — не то слово, которым описывают танец на лезвии клинка, шерин. Раньше это было приятной забавой, но... искренность, которая возникла между нами столь внезапным образом — она опасна для меня. Теперь, находясь подле вас, я ступаю по бритвенной кромке сабли и молюсь Великому, чтобы острие не рассекло мое сердце на две кровоточащих половины. Так много власти надо мной оказалось в ваших руках, шерин".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Нравится — не то слово, которым описывают танец на лезвии клинка, шерин. Раньше это было приятной забавой, но... искренность, которая возникла между нами столь внезапным образом — она опасна для меня. Теперь, находясь подле вас, я ступаю по бритвенной кромке сабли и молюсь Великому, чтобы острие не рассекло мое сердце на две кровоточащих половины. Так много власти надо мной оказалось в ваших руках, шерин.
- guid: 10472c41-974d-425e-8e0b-8e6c3aaf993b
  event: Companions_Smugler_140
  text: '"Спросите розу, нравится ли ей каждое утро получать поцелуи солнца. Спросите бархан, нравится ли ему чувствовать ласковые и игривые касания ветра. Спросите и услышите мой ответ, шерин".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Спросите розу, нравится ли ей каждое утро получать поцелуи солнца. Спросите бархан, нравится ли ему чувствовать ласковые и игривые касания ветра. Спросите и услышите мой ответ, шерин.
- guid: 6ed0bff4-bd0f-44ae-8abd-ffb7412364fa
  event: Companions_Smugler_141
  text: '"Но если чувства в вашей душе обратились в пожар, что сжигает изнутри..." {n}Джай подмигивает вам.{/n} "...Можете выразить их, подарив что-нибудь своей скромной слуге".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Но если чувства в вашей душе обратились в пожар, что сжигает изнутри...
  - speaker: narrator
    text_clean: Джай подмигивает вам.
  - speaker: Контрабандист
    text_clean: '...Можете выразить их, подарив что-нибудь своей скромной слуге.'
- guid: 768fb1b1-ad7f-4caa-b0b1-65dcc26e143e
  event: Companions_Smugler_142
  text: '{n}Джай загадочно прикладывает палец к губам.{/n} "Тише, шерин, не вспугните удивительное чувство, что шелковой нитью томления сплетает меж нами узор страсти. Скоро".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай загадочно прикладывает палец к губам.
  - speaker: Контрабандист
    text_clean: Тише, шерин, не вспугните удивительное чувство, что шелковой нитью томления сплетает меж нами узор страсти. Скоро.
- guid: 7cc9cfc9-5c18-45a3-a94d-7b5d189e223f
  event: Companions_Smugler_143
  text: '"Как видите, я умею быть благодарной и щедрой. И вы, уверена, тоже". {n}Джай с намеком подмигивает вам.{/n} "Обещаю, что и в будущем всякий ваш дар буду принимать с почтением и трепетом".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Как видите, я умею быть благодарной и щедрой. И вы, уверена, тоже.
  - speaker: narrator
    text_clean: Джай с намеком подмигивает вам.
  - speaker: Контрабандист
    text_clean: Обещаю, что и в будущем всякий ваш дар буду принимать с почтением и трепетом.
- guid: b3bb3145-3023-451a-9306-e522a7439bc5
  event: Companions_Smugler_144
  text: '"Как прикажете, шерин. Не смею перечить воле грозно{mf|го|й} заклинател{mf|я|ьницы} чудовищ бюрократии Администратума".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Как прикажете, шерин. Не смею перечить воле грозного заклинателя чудовищ бюрократии Администратума.
- guid: 88de19dd-2afb-48d3-99ea-daa78e3e5e4a
  event: Companions_Smugler_145
  text: '"Как вы позаботились обо мне, так и я хочу позаботиться о вас... Чуть сверх оговоренного. Вот, держите: скромный дар в благодарность за помощь. И пусть Великий и дальше оберегает пути, по которым вы ходите".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'Как вы позаботились обо мне, так и я хочу позаботиться о вас... Чуть сверх оговоренного. Вот, держите: скромный дар в благодарность за помощь. И пусть Великий и дальше оберегает пути, по которым вы ходите.'
- guid: 1f34874a-2988-4082-8cf5-1cd7cee0060e
  event: Companions_Smugler_146
  text: '"Шерин, я не могу вам отказать. И не желаю этого".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Шерин, я не могу вам отказать. И не желаю этого.
- guid: a28a7211-06ad-49d4-8e10-638f691190d8
  event: Companions_Smugler_147
  text: '"Вы увидите меня в нем, шерин. И вы увидите меня без него".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Вы увидите меня в нем, шерин. И вы увидите меня без него.
- guid: 9b04ee59-b614-4cf4-a1b9-3bf89cb7bb5d
  event: Companions_Smugler_148
  text: '{n}Печально улыбнувшись, Джай кивает.{/n} "Я понимаю. Прости, что обманула твое доверие. И спасибо, что позволял{mf||а} обманывать тебя так долго".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Печально улыбнувшись, Джай кивает.
  - speaker: Контрабандист
    text_clean: Я понимаю. Прости, что обманула твое доверие. И спасибо, что позволял обманывать тебя так долго.
- guid: 1ddac683-dde2-4c52-82f1-8615ddc713a6
  event: Companions_Smugler_149
  text: '{n}Лицо Джай становится серьезным.{/n} "Прости, но — нет. Мы не приносили клятв над водой, я не обещала держать свое сердце открытым нараспашку перед тобой. У меня есть и будут свое прошлое и своя жизнь, и я не вижу оснований, по которым ты мог{mf||ла} бы претендовать на них. Но я обещаю, что не наврежу тебе своими тайнами".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Лицо Джай становится серьезным.
  - speaker: Контрабандист
    text_clean: Прости, но — нет. Мы не приносили клятв над водой, я не обещала держать свое сердце открытым нараспашку перед тобой. У меня есть и будут свое прошлое и своя жизнь, и я не вижу оснований, по которым ты мог бы претендовать на них. Но я обещаю, что не наврежу тебе своими тайнами.
- guid: 3a94cdbf-93a7-4621-a102-b2e0b806ec82
  event: Companions_Smugler_15
  text: '"Только не нужно так на меня смотреть, шерин! Заговоры высоких господ, интриги {g|Encyclopedia:Footfall}футфольских{/g} ублюдков, тайны ксеноартефактов, раболепие перед зажравшейся Экклезиархией... Все сгинуло, словно сон, за пределами сего места! В горячке боя за собственную жизнь, когда рвешь душу в клочья, а тело в кровь... Разве не простительно быть самой собой, шерин?" {n}Джай смотрит на вас отчаянно, почти почти умоляюще.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Только не нужно так на меня смотреть, шерин! Заговоры высоких господ, интриги футфольских ублюдков, тайны ксеноартефактов, раболепие перед зажравшейся Экклезиархией... Все сгинуло, словно сон, за пределами сего места! В горячке боя за собственную жизнь, когда рвешь душу в клочья, а тело в кровь... Разве не простительно быть самой собой, шерин?
  - speaker: narrator
    text_clean: Джай смотрит на вас отчаянно, почти почти умоляюще.
- guid: b074be81-f63c-4b25-ba70-b8f79c2e31f2
  event: Companions_Smugler_150
  text: '{n}Устало вздохнув, Джай устремляет на вас твердый взор.{/n} "Ну, Твоя Светлость, спрашивай. Я отвечу как есть, жопой крутить не буду".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Устало вздохнув, Джай устремляет на вас твердый взор.
  - speaker: Контрабандист
    text_clean: Ну, Твоя Светлость, спрашивай. Я отвечу как есть, жопой крутить не буду.
- guid: f9ab2b3c-a647-4a88-95c3-87cccd8b4588
  event: Companions_Smugler_151
  text: '"Опасаешься, что теперь я буду плеваться на палубе и крыть твоих офицеров отборной бранью? Не стоит, шерин. Мне куда больше нравится быть в глазах окружающих принцессой, чем дезертиршей. Перед остальными я продолжу играть роль, но ты ведь хотел{mf||а} потолковать начистоту, вот я и не лицедействую".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Опасаешься, что теперь я буду плеваться на палубе и крыть твоих офицеров отборной бранью? Не стоит, шерин. Мне куда больше нравится быть в глазах окружающих принцессой, чем дезертиршей. Перед остальными я продолжу играть роль, но ты ведь хотел потолковать начистоту, вот я и не лицедействую.
- guid: 895ae085-4dc6-4255-831f-fa9f8f088987
  event: Companions_Smugler_152
  text: '"Что же, это было предсказуемо. Вольного Торговца устроит компания контрабандистки, но {mf|ему|ей} не по чину терпеть в свите простолюдинку и дезертиршу. Постараюсь впредь не оскорблять твой величественный взор своей скромной персоной".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Что же, это было предсказуемо. Вольного Торговца устроит компания контрабандистки, но ему не по чину терпеть в свите простолюдинку и дезертиршу. Постараюсь впредь не оскорблять твой величественный взор своей скромной персоной.
- guid: bfc68532-e070-4585-9546-bc6527a36303
  event: Companions_Smugler_153
  text: '"Правда?" {n}Джай недоверчиво смотрит на вас.{/n} "Тогда ты очень, очень странн{mf|ый|ая}. А я — очень везучая. Хвала Великому". {n}Нервный смешок вырывается из груди Джай, заставляя ее слегка покраснеть.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Правда?
  - speaker: narrator
