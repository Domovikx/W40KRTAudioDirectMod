- guid: 509f45fb-f542-4dbb-9735-98da6bcc4ea4
  event: Companions_Smugler_38
  text: '"Арджента..." {n}Щеки контрабандистки наливаются румянцем.{/n} "Что может быть прекраснее Сестры битвы, озаряющей одним лишь своим присутствием темные уголки таких потерянных душ, как моя? Но увы, увы, остатки разума шепчут мне, что несчастной Джай остается лишь любоваться сиянием этого ангела, не испытывая надежды когда-нибудь коснуться ее крыльев".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Арджента...
  - speaker: narrator
    text_clean: Щеки контрабандистки наливаются румянцем.
  - speaker: Контрабандист
    text_clean: Что может быть прекраснее Сестры битвы, озаряющей одним лишь своим присутствием темные уголки таких потерянных душ, как моя? Но увы, увы, остатки разума шепчут мне, что несчастной Джай остается лишь любоваться сиянием этого ангела, не испытывая надежды когда-нибудь коснуться ее крыльев.
- guid: fa7107aa-ca56-4d79-bbd0-09e59a8a33e2
  event: Companions_Smugler_39
  text: '"На Футфоле каждый третий — из касбаллитов, но это не значит, что весь этот гнилой сброд действует сообща — меня не единожды подставляли конкуренты. Однако к клиентам {g|Encyclopedia:KasballicaMission}Касбаллика{/g} благосклонна — если есть чем платить, вам раздобудут, организуют, транспортируют все, что пожелаете. Клиент всегда прав, если клиент не крыса. В противном случае..." {n}Джай с патетическим вздохом разводит руками.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: На Футфоле каждый третий — из касбаллитов, но это не значит, что весь этот гнилой сброд действует сообща — меня не единожды подставляли конкуренты. Однако к клиентам Касбаллика благосклонна — если есть чем платить, вам раздобудут, организуют, транспортируют все, что пожелаете. Клиент всегда прав, если клиент не крыса. В противном случае...
