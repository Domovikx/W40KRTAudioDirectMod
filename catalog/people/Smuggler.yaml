  text: '"И что же ты хочешь услышать, шерин? Сказку о прекрасной принцессе? Балладу о королеве разбойников?" {n}Джай кривится от собственных слов и грубо, по-солдатски, сплевывает под ноги.{/n} "Как тебе такая сказочка, шерин: жила-была девочка на куске камня, покрытом песком, в сердце которого таились несметные богатства для слуг {g|Encyclopedia:Imperium}Империума{/g}. И до шестнадцати лет эта девочка, надрывая легкие и спину, своими ручонками гребла блага для тех, кого никогда не видела и кто никогда о ней не узнает. А затем..."'
