  text: '"Конечно же нет, шерин". {n}Голос Джай полон веселого энтузиазма ровно настолько же, что и мгновение назад.{/n} "Это будет слишком быстро. В предвкушении и игре таится одна из главных сладостей страсти. Это тонкое искусство — взогнать ее, словно кипящий прометий, но освободить прежде, чем грянет взрыв. Но и награда за это восхитительна. Я слишком ценю ваше общество, шерин, чтобы оставить это блюдо неиспробованным и жадно наброситься сразу на десерт. А вы — достаточно цените меня?"'
