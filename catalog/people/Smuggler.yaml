- guid: ac8f5cb0-0de3-4e97-ae97-e5df81d00550
  event: Companions_Smugler_01
  text: '{n}Джай широко улыбается, демонстрируя жемчужные зубы.{/n} "Позвольте поблагодарить еще раз за помощь с грузом, шерин. Я уверена, что ашмаги, что увели мой товар, так просто это дело не оставят, и я еще услышу о них и их происках. Так что, шерин, давайте договоримся: я приглядываю за вашей спиной, а вы, сделайте милость, поглядывайте за моей". {n}Женщина мелодично смеется.{/n} "Что ж, шутки в сторону — с чем вы пришли?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Джай широко улыбается, демонстрируя жемчужные зубы.
  - speaker: Контрабандист
    text_clean: 'Позвольте поблагодарить еще раз за помощь с грузом, шерин. Я уверена, что ашмаги, что увели мой товар, так просто это дело не оставят, и я еще услышу о них и их происках. Так что, шерин, давайте договоримся: я приглядываю за вашей спиной, а вы, сделайте милость, поглядывайте за моей.'
  - speaker: narrator
    text_clean: Женщина мелодично смеется.
  - speaker: Контрабандист
    text_clean: Что ж, шутки в сторону — с чем вы пришли?
- guid: ae501a05-6d60-4388-b5d3-b0ecec655b3f
  event: Companions_Smugler_02
  text: '"Да хранит вас {g|Encyclopedia:Emperor}Великий{/g}! Заскучали без наших бесед, шерин?" {n}Джай приветливо улыбается, перекатывая золотую монету по костяшкам аугментированных пальцев.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Да хранит вас Великий! Заскучали без наших бесед, шерин?
  - speaker: narrator
    text_clean: Джай приветливо улыбается, перекатывая золотую монету по костяшкам аугментированных пальцев.
- guid: 2c45da50-b677-4e84-bce1-fc873b4f429d
  event: Companions_Smugler_03
  text: '"Вот и славно. Ни к чему портить наши продуктивные отношения, м?" {n}Джай сладко улыбается, однако от вас не укрывается нервный тик, на секунду исказивший ее черты.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Вот и славно. Ни к чему портить наши продуктивные отношения, м?
  - speaker: narrator
    text_clean: Джай сладко улыбается, однако от вас не укрывается нервный тик, на секунду исказивший ее черты.
- guid: 3d5adcbb-8428-474f-abf7-ad394a04bbb6
  event: Companions_Smugler_04
  text: '"Хм". {n}Девушка едва пожимает плечами. Она не выглядит удивленной, скорее разочарованной и... напуганной?{/n} "В таком случае мне не остается ничего, кроме как отправиться паковать вещи. Жаль, {name}, очень жаль. Прощайте".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Хм.
  - speaker: narrator
    text_clean: Девушка едва пожимает плечами. Она не выглядит удивленной, скорее разочарованной и... напуганной?
  - speaker: Контрабандист
    text_clean: В таком случае мне не остается ничего, кроме как отправиться паковать вещи. Жаль, КЭП, очень жаль. Прощайте.
- guid: e282712e-ca3c-4514-92f5-c9536aca9106
  event: Companions_Smugler_05
  text: '"Не было сказано слов правдивей, чем ваши — я куда примечательнее каких-то торгашей с {g|Encyclopedia:Footfall}Футфола{/g}!" {n}Джай исполняет изящный и несколько экзотичный реверанс.{/n} "Позвольте же представиться как следует — Джай Амира Фатхрин Тамери аш Ифрит, двенадцатая дочь повелителя Ифрита, дальнего мира на краю {g|Encyclopedia:Imperium}Империума{/g}".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Не было сказано слов правдивей, чем ваши — я куда примечательнее каких-то торгашей с Футфола!
  - speaker: narrator
    text_clean: Джай исполняет изящный и несколько экзотичный реверанс.
  - speaker: Контрабандист
    text_clean: Позвольте же представиться как следует — Джай Амира Фатхрин Тамери аш Ифрит, двенадцатая дочь повелителя Ифрита, дальнего мира на краю Империума.
- guid: 7cc1ae4a-3175-4d4c-8eb8-62de4b5d242f
  event: Companions_Smugler_06
  text: '"На {g|Encyclopedia:Footfall}Футфоле{/g} это несложно. С год поработала на старину Кристо — отважный был воин, погиб в стычке с орками — затем переняла его дела. Когда есть голова на плечах и {g|Encyclopedia:Emperor}Великий{/g} в душе, нужные связи появляются быстро. Со временем собрала рядом верных и честных людей, и после нескольких удачных контрактов нас приметила Касбаллика. А вскоре я совсем осела на Футфоле и начала делиться мудростью с подопечными да подчиненными — самой мне руки марать расхотелось".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: На Футфоле это несложно. С год поработала на старину Кристо — отважный был воин, погиб в стычке с орками — затем переняла его дела. Когда есть голова на плечах и Великий в душе, нужные связи появляются быстро. Со временем собрала рядом верных и честных людей, и после нескольких удачных контрактов нас приметила Касбаллика. А вскоре я совсем осела на Футфоле и начала делиться мудростью с подопечными да подчиненными — самой мне руки марать расхотелось.
- guid: 8038f374-c0d7-498d-9fe9-2ca80e1e3aef
  event: Companions_Smugler_07
  text: '"Когда-то я и мечтать не смела о том, чтоб стать наместником этой вечно рассыпающейся на шестеренки станции. Но теперь... Теперь же, шерин, я почти уверена, что с грамотой торгового представителя Джай Хейдари может превратить {g|Encyclopedia:Footfall}Футфол{/g} в жемчужину среди миров и станций Простора! Конечно, на моем пути все еще лежит небольшой бархан в виде Владайма... Но куда уж старому верблюду угнаться за молодой антилопой".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Когда-то я и мечтать не смела о том, чтоб стать наместником этой вечно рассыпающейся на шестеренки станции. Но теперь... Теперь же, шерин, я почти уверена, что с грамотой торгового представителя Джай Хейдари может превратить Футфол в жемчужину среди миров и станций Простора! Конечно, на моем пути все еще лежит небольшой бархан в виде Владайма... Но куда уж старому верблюду угнаться за молодой антилопой.
- guid: adc341b5-9c25-4886-bad9-4fa646ca0f42
  event: Companions_Smugler_08
  text: '"Как по мне, то теневая сторона и есть настоящий {g|Encyclopedia:KoronusExpanse}Простор Коронус{/g}... но что именно вы жаждете слышать, шерин?"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Как по мне, то теневая сторона и есть настоящий Простор Коронус... но что именно вы жаждете слышать, шерин?
- guid: e7bd5bae-2a1f-4bc5-b2c2-17c020b04542
  event: Companions_Smugler_09
  text: '"Пожалуй... Я действительно осознала могущество тех, кто скрывается в ослепительном сиянии подобных вам светил, шерин. Стать ли мне тенью, что поддерживает свет и порядок в обход закостенелых законов? Не очередной пешкой {g|Encyclopedia:KasballicaMission}Миссии Касбаллика{/g}, а полноправным Теневым Бароном Простора? Силой куда более могущественной и устрашающей, чем скромный торгаш-наместник?"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Пожалуй... Я действительно осознала могущество тех, кто скрывается в ослепительном сиянии подобных вам светил, шерин. Стать ли мне тенью, что поддерживает свет и порядок в обход закостенелых законов? Не очередной пешкой Миссии Касбаллика, а полноправным Теневым Бароном Простора? Силой куда более могущественной и устрашающей, чем скромный торгаш-наместник?
- guid: d89df4ae-2faa-4824-b861-808ebe6240ee
  event: Companions_Smugler_10
  text: '"И вкус тот слаще меда и пикантнее аромата разгоряченных тел, шерин!" {n}Джай заговорщически улыбается, подается вперед и под косые взгляды офицеров бесстыже заглядывает в глаза, ожидая ответа.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: И вкус тот слаще меда и пикантнее аромата разгоряченных тел, шерин!
  - speaker: narrator
    text_clean: Джай заговорщически улыбается, подается вперед и под косые взгляды офицеров бесстыже заглядывает в глаза, ожидая ответа.
- guid: 90e7be16-0d30-43e9-8f8b-e17df0a368e6
  event: Companions_Smugler_100
  text: '"Это еще время покажет, шерин" {n}, — абсолютно беззлобно отвечает Джай, пожимая плечами.{/n} "Я многому в жизни обучалась не сразу. И этому обучусь".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Это еще время покажет, шерин
  - speaker: narrator
    text_clean: ', — абсолютно беззлобно отвечает Джай, пожимая плечами.'
  - speaker: Контрабандист
    text_clean: Я многому в жизни обучалась не сразу. И этому обучусь.
- guid: e8101348-4969-491b-ab1b-7b38c073b20a
  event: Companions_Smugler_101
  text: '"Нет мудрости глубже, чем молчание дурака. Это я о себе, шерин, не подумайте. Лучше бы молчала побольше, чем вас своими разговорами утомлять".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Нет мудрости глубже, чем молчание дурака. Это я о себе, шерин, не подумайте. Лучше бы молчала побольше, чем вас своими разговорами утомлять.
- guid: ccf09e53-9c12-4e37-91e4-21c0bc8be5bc
  event: Companions_Smugler_102
  text: '{n}От улыбки Джай веет грустью и даже немного жалостью.{/n} "Все мы носим личины, {name}. Без них большинство лишь жалкие, уродливые, сморщенные..." {n}Джай смакует слова на языке, подбирая их ревностней {g|Encyclopedia:Amasec}амасека{/g} к ужину.{/n} "Персики? Все любят смотреть на персики, пока они свежие, сочные да упругие. А как превращаются в сухофрукт — все, пора отправляться в бочку. Так и с людьми".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: От улыбки Джай веет грустью и даже немного жалостью.
  - speaker: Контрабандист
    text_clean: Все мы носим личины, КЭП. Без них большинство лишь жалкие, уродливые, сморщенные...
  - speaker: narrator
    text_clean: Джай смакует слова на языке, подбирая их ревностней амасека к ужину.
  - speaker: Контрабандист
    text_clean: Персики? Все любят смотреть на персики, пока они свежие, сочные да упругие. А как превращаются в сухофрукт — все, пора отправляться в бочку. Так и с людьми.
- guid: 820b6627-e6d9-41e2-9245-e911b502f9db
  event: Companions_Smugler_103
  text: '"Ха, спрашиваете еще, шерин. Эти живучие ашмаги и кассхи {d|Encyclopedia:JaeGuysSaved}зализывают раны{/d} лучше, чем сами ажи. Торра себе, наконец, челюстной {g|Encyclopedia:Augmentation}имплант{/g} вставила. Теперь хоть говорит нормально может, а не как ослица беззубая. Ну и бравых парней да дамочек набирает в наши ряды — все же Фалько хорошенько мою сеть подчистил, пиранья межзвездная, чтоб ажи его душу растерзали!"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Ха, спрашиваете еще, шерин. Эти живучие ашмаги и кассхи зализывают раны лучше, чем сами ажи. Торра себе, наконец, челюстной имплант вставила. Теперь хоть говорит нормально может, а не как ослица беззубая. Ну и бравых парней да дамочек набирает в наши ряды — все же Фалько хорошенько мою сеть подчистил, пиранья межзвездная, чтоб ажи его душу растерзали!
- guid: d417296a-15bc-4e67-9816-1b4a605b0dcd
  event: Companions_Smugler_104
  text: '"По живому да ржавым лезвием, шерин, резать любите. {d|Encyclopedia:JaeGuysDead}Нет у меня больше банды{/d}... Да и не думаю, что она нужна. Одной точке достаточно и пары верных агентов, что кормятся прямо из моего кармана. Достаточно смышленых, чтобы дела делались. И недостаточно для того, чтобы понимать, как туго у них поводок натянут". {n}Джай ухмыляется и дергает за невидимую петлю на шее.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: По живому да ржавым лезвием, шерин, резать любите. Нет у меня больше банды... Да и не думаю, что она нужна. Одной точке достаточно и пары верных агентов, что кормятся прямо из моего кармана. Достаточно смышленых, чтобы дела делались. И недостаточно для того, чтобы понимать, как туго у них поводок натянут.
  - speaker: narrator
    text_clean: Джай ухмыляется и дергает за невидимую петлю на шее.
- guid: 4a34691b-2f2c-4b8f-98b9-398b3791a270
  event: Companions_Smugler_105
  text: '"И путеводной звездой в том плавании мне послужила отнюдь не вера и звон золотых побрякушек, о нет. Я осознала могущество тех, кто скрывается в ослепительном сиянии подобных вам светил, шерин. Тень, что поддерживает свет и порядок в обход закостенелых законов. И я стану ей, этой тенью, шерин. Быть может — даже вашей? Не очередной пешкой {g|Encyclopedia:KasballicaMission}Миссии Касбаллика{/g}, а полноправным Теневым Бароном Простора. Силой куда более могущественной и устрашающей, чем скромный торгаш-наместник".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: И путеводной звездой в том плавании мне послужила отнюдь не вера и звон золотых побрякушек, о нет. Я осознала могущество тех, кто скрывается в ослепительном сиянии подобных вам светил, шерин. Тень, что поддерживает свет и порядок в обход закостенелых законов. И я стану ей, этой тенью, шерин. Быть может — даже вашей? Не очередной пешкой Миссии Касбаллика, а полноправным Теневым Бароном Простора. Силой куда более могущественной и устрашающей, чем скромный торгаш-наместник.
- guid: 9524c856-baf8-4e1f-91f1-b0efacb9de41
  event: Companions_Smugler_106
  text: '"И где же обычно сияют самые драгоценные жемчужины, Джай", — спросите вы. И я вам отвечу: "В коронах монархов, шерин. В коронах монархов". Ах, {g|Encyclopedia:Footfall}Футфол{/g}... Когда-то я и мечтать не смела о том, чтоб стать наместником этой вечно рассыпающейся на шестеренки станции. Но теперь, шерин, я почти уверена — с грамотой торгового представителя Джай Хейдари может превратить Футфол в жемчужину среди миров и станций Простора!"'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'И где же обычно сияют самые драгоценные жемчужины, Джай", — спросите вы. И я вам отвечу: "В коронах монархов, шерин. В коронах монархов". Ах, Футфол... Когда-то я и мечтать не смела о том, чтоб стать наместником этой вечно рассыпающейся на шестеренки станции. Но теперь, шерин, я почти уверена — с грамотой торгового представителя Джай Хейдари может превратить Футфол в жемчужину среди миров и станций Простора!'
- guid: ba55e165-982f-4948-b414-9f59dd755cde
  event: Companions_Smugler_107
  text: '"О, Шерин, мне все же удалось заинтриговать вас!" {n}Обворожительная улыбка озаряет лицо Джай.{/n} "Позвольте пригласить вас в более тихое место, ибо слова мои предназначены лишь для ваших ушей".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О, Шерин, мне все же удалось заинтриговать вас!
  - speaker: narrator
    text_clean: Обворожительная улыбка озаряет лицо Джай.
  - speaker: Контрабандист
    text_clean: Позвольте пригласить вас в более тихое место, ибо слова мои предназначены лишь для ваших ушей.
- guid: c1abf625-6356-44e2-b0f4-69122db39f38
  event: Companions_Smugler_108
  text: '"И знаете что? Мне понравилось. Да, вот так — лицом о скалы и по горло в воде, зато я, наконец, смогла ощутить привкус свободы. Совсем чуть-чуть, самую малость... Но и этого хватило, чтобы мечтать теперь о ней по ночам. {g|Encyclopedia:KasballicaMission}Касбаллика{/g} и {g|Encyclopedia:ColdTrade}хладный торг{/g}? В пасть к пустотному кракену! Ну а наши с вами совместные дела, шерин... Если вы пожелаете — я останусь вашим верным партнером. Равным партнером". {n}Последние слова Джай выделяет особенно жарко.{/n}'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: И знаете что? Мне понравилось. Да, вот так — лицом о скалы и по горло в воде, зато я, наконец, смогла ощутить привкус свободы. Совсем чуть-чуть, самую малость... Но и этого хватило, чтобы мечтать теперь о ней по ночам. Касбаллика и хладный торг? В пасть к пустотному кракену! Ну а наши с вами совместные дела, шерин... Если вы пожелаете — я останусь вашим верным партнером. Равным партнером.
  - speaker: narrator
    text_clean: Последние слова Джай выделяет особенно жарко.
- guid: 677045de-fc74-421c-be01-537e11b01ee4
  event: Companions_Smugler_109
  text: '{n}Джай активно кивает.{/n} "О да, шерин, и вот что я думаю: со дня нашего знакомства меня штормило из стороны в сторону, словно шлюпку средь бушующего океана. Трепало, било о скалы, захлестывало с головой... И вот выбросило на берег, вручив напоследок еще и великий дар — драгоценную жемчужину из глубин, Меркатум Табула Официале". {n}Джай останавливается, дабы перевести дух.{/n}'
