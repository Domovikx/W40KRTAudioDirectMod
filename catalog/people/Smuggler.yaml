- guid: fc652e3d-3416-47b1-8a61-01bd4ef261df
  event: Companions_Smugler_121
  text: '"Затем за девочкой пришли слуги Его и забрали в {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g}. Девочка до жопы много трудилась, пока не повстречала {g|Encyclopedia:KasballicaMission}Касбаллику{/g} и стала хорошенько поживать на пригретом местечке. За что однажды чуть не поплатилась головой, попав под внутреннее расследование Оффицио Префектус и Департменто Муниторум. Ну а потом — сбежала в Простор".'
  speaker: null
  parts:
  - speaker: Контрабандист
