- guid: 479db39e-280f-4fdb-9567-9f27e9b0d1fe
  event: Companions_Smugler_53
  text: '"Бывает. За годы общения с ксеносами я неплохо так изучила их повадки и даже обучилась языку — правда, стоит мне на нем заговорить, как те начинают кривиться. Высокомерные ублюдки! Им не по нраву даже наши голоса, зато от ценностей не отказываются никогда. Впрочем, к гримасам мне не привыкать — если слишком чистоплюйствовать, останешься не у дел".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Бывает. За годы общения с ксеносами я неплохо так изучила их повадки и даже обучилась языку — правда, стоит мне на нем заговорить, как те начинают кривиться. Высокомерные ублюдки! Им не по нраву даже наши голоса, зато от ценностей не отказываются никогда. Впрочем, к гримасам мне не привыкать — если слишком чистоплюйствовать, останешься не у дел.
