- guid: 1fe3237b-6f97-46de-ba96-a8cefeb0360b
  event: Companions_Smugler_166
  text: '"Как я и обещала ранее, мои ребята станут вашими глазами и ушами по всему {g|Encyclopedia:KoronusExpanse}Простору{/g}, дайте им только время, шерин. Ну а на Даргонус уже спешит помощница официального имперского представителя Джай Хейдари, дабы предоставить вашим людям и вам, о влады{mf|ка|чица} миров, товары редчайшего мастерства и происхождения". {n}Темные глаза сияют озорными искрами в полумраке мостика.{/n} "И еще раз... благодарю от всей своей скромной души, шерин, и предлагаю отпраздновать это с моими людьми, как только окажемся на Футфоле!"'
  speaker: null
  parts:
