  event: Companions_Smugler_116
  text: '"Ладно, чего это мы все о почивших, шерин? Надо бы и живых помянуть добрым словом. Фалько, например". {n}Джай сжимает стальную кисть до протестного скрипа.{/n} "Я этого ашмага на кол насажу, шерин, вот увидите. Но только не слишком толстый — чтоб подольше мучился".'
