  text: '"Наследные принцы пьют с преступниками, {g|Encyclopedia:RogueTrader}Вольные Торговцы{/g} ведут дела с {g|Encyclopedia:KasballicaMission}Касбалликой{/g}, а десятки кораблей останавливаются на отдых после долгого плавания — разве есть во всем Империуме место прекрасней? Император милостив ко всем, и к ничтожным, и к благим. Здесь для каждого найдется работенка, коль голова на плечах. А захочешь поговорить с Самим — статую Великого с любого астероида видно, молись на здоровье".'
