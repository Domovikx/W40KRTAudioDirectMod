  text: '{n}Дрожащая рука касается {d|Encyclopedia:Ch3_JaeHealedOnTheShip}болезненных воспалений на шее{/d}.{/n} "Всю глотку кашлем сорвала, шерин. И каждый вдох — пытка похлеще друкарских ядовитых плетей. Я словно плавленный пласталь жру и неочищенным прометием запиваю". {n}Горло Джай сдавливает очередной спазм, и пузырьки крови расцветают на ее побледневших губах.{/n} "Ра-разорви меня ажи... Дожить бы до лечебниц Простора..."'
