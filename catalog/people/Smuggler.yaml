- guid: f4e3c961-eecf-4930-b3db-1e0d623f355e
  event: Companions_Smugler_17
  text: '"Короче, ты сам{mf||а} не знаешь, чего хочешь: берешь меня под свое крыло, затем затаскиваешь в этот город, спасаешь от мучительной смерти, выслушиваешь... А затем прогоняешь! Ладно, будь по-твоему: я уйду, шерин. И не ищи со мной встречи — не найдешь".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: 'Короче, ты сам не знаешь, чего хочешь: берешь меня под свое крыло, затем затаскиваешь в этот город, спасаешь от мучительной смерти, выслушиваешь... А затем прогоняешь! Ладно, будь по-твоему: я уйду, шерин. И не ищи со мной встречи — не найдешь.'
- guid: 18bcfc6e-a726-49bc-b128-281b22426c9c
  event: Companions_Smugler_170
  text: '"Как странно. Но я не смею ослушаться, шерин. Если вы велите забыть — ветер забвения уносит нежеланные вами воспоминания из моей памяти".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Как странно. Но я не смею ослушаться, шерин. Если вы велите забыть — ветер забвения уносит нежеланные вами воспоминания из моей памяти.
- guid: 3724bc73-0a6b-4f8c-937c-20f83ee5fab9
  event: Companions_Smugler_171
  text: '"О, шерин, тогда зачем же мне отвечать правду? Ведь всякая загадка, будучи разгаданной, перестает вызывать интерес пытливого ума".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: О, шерин, тогда зачем же мне отвечать правду? Ведь всякая загадка, будучи разгаданной, перестает вызывать интерес пытливого ума.
