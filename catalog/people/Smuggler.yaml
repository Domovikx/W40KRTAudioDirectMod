  text: '"Конечно, на моем пути все еще лежит небольшой бархан в виде Владайма... Но куда уж старому верблюду угнаться за молодой антилопой, вы так не думаете, шерин?" {n}Джай гордо вскидывает подбородок, с интересом наблюдая за вашей реакцией.{/n}'
