  event: Companions_Smugler_63
  text: '"Что ж, твоя светлость {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}, шерин, бич души моей, но спаситель{mf||ница} плоти. Загнала нас нелегкая в самое паскудное местечко в галактике — родненький дом {g|Encyclopedia:Drukhari}друкарских{/g} ублюдков, откуда, как мне известно, никто не возвращается. Ни живым, ни мертвым, ни по частям". {n}Суровая мрачность и изможденное тело совсем не подходят той Джай Хейдари, которую вы знали. Перед вами бывалый солдат, жесткий и прямолинейный.{/n}'
