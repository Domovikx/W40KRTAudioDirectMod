  event: Companions_Smugler_64
  text: '{n}Бережно, словно младенца укутывает в объятия новоиспеченная мать, Джай Хейдари лелеет клочок изъеденного письменами пергамента.{/n} "Ах шерин, свет очей моих, благодетель{mf||ница} страждущих! Отныне над небесным куполом протектората фон Валанциус сияет сразу два солнца — слепящее и всемогущее, как сам{mf||а} {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}, и светило поменьше. Подобное {mf|его|ее} скромной партнерше, владелице Меркатум Табула Официале и просто очаровательной женщине Джай Хейдари".'
