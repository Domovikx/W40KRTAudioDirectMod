  event: Companions_Smugler_169
  text: '"Или та. Моим сердцем желали обладать и гордые мужчины с твердым взором, и нежные девы с чувственными голосами, и властные повелители, и яростные предводительницы пустотных разбойников... Разве что Вольных Торговцев не были пока среди близких друзей Джай Хейдари". {n}Контрабандистка дарит вам загадочную улыбку.{/n} "Почему вы спрашиваете, шерин?"'
  speaker: Smuggler
  parts:
  - speaker: Контрабандист
    text_clean: Или та. Моим сердцем желали обладать и гордые мужчины с твердым взором, и нежные девы с чувственными голосами, и властные повелители, и яростные предводительницы пустотных разбойников... Разве что Вольных Торговцев не были пока среди близких друзей Джай Хейдари.
