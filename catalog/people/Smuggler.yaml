- guid: d9b79c78-3d13-4c57-988d-390c38593648
  event: Companions_Smugler_55
  text: '"Мое ремесло — знать всех нужных людей и нелюдей, налаживать связи и обеспечивать, чтобы драгоценный товар оказывался в руках не менее драгоценных клиентов. Моя мудрость включает в себя познания о врагах Человечества, будь то {g|Encyclopedia:Xenos}ксеносы{/g} или самые отпетые негодяи Империума, а также самые свежие сведения о том, почем сейчас идут те или иные диковинки на рынке {g|Encyclopedia:Footfall}Футфола{/g}. Со мной, шерин, вас не обманут даже самые ушлые ажи — это я вам обещаю. Коль сама я владею кое-чем, так, значит, смогу обеспечить это и вам — если, конечно, вам мало ваших фантастических богатств".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Мое ремесло — знать всех нужных людей и нелюдей, налаживать связи и обеспечивать, чтобы драгоценный товар оказывался в руках не менее драгоценных клиентов. Моя мудрость включает в себя познания о врагах Человечества, будь то ксеносы или самые отпетые негодяи Империума, а также самые свежие сведения о том, почем сейчас идут те или иные диковинки на рынке Футфола. Со мной, шерин, вас не обманут даже самые ушлые ажи — это я вам обещаю. Коль сама я владею кое-чем, так, значит, смогу обеспечить это и вам — если, конечно, вам мало ваших фантастических богатств.
- guid: 2fc5bff0-e458-4dfa-bd92-a1ed23437cc2
  event: Companions_Smugler_56
  text: '"Судьба последнего отпрыска рода — стать разменной монетой в политических играх семьи. Но я не желала мириться с подобной участью и хотела сама выбирать, кем мне быть и какой стезей идти. Узнав, что {g|Encyclopedia:Emperor}Великий{/g} оберегает еще сотни миров у далеких звезд, я поняла, что за пределами Ифрита меня ждет множество возможностей. Нужно лишь оборвать семейные оковы и сбежать с планеты — что я и проделала давным-давно".'
  speaker: null
  parts:
  - speaker: Контрабандист
    text_clean: Судьба последнего отпрыска рода — стать разменной монетой в политических играх семьи. Но я не желала мириться с подобной участью и хотела сама выбирать, кем мне быть и какой стезей идти. Узнав, что Великий оберегает еще сотни миров у далеких звезд, я поняла, что за пределами Ифрита меня ждет множество возможностей. Нужно лишь оборвать семейные оковы и сбежать с планеты — что я и проделала давным-давно.
