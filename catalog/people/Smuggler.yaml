    text_clean: Джай криво ухмыляется и пожимает плечами.
  - speaker: Контрабандист
    text_clean: Не угрожала я вашему Навигатору, и в мыслях не было. Я просто отдыхала — в хорошей компании из ароматного амасека, душистого лхо и нескольких новых приятелей с верхних палуб... И тут в самый разгар веселья к нам залетает Леди-Навигатор и с порога несет что-то о том, что у нее раскалывается голова от пестрых всплесков из нашей каюты.
