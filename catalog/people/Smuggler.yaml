  event: Companions_Smugler_113
  text: '{n}Джай надолго задумывается.{/n} "А знаете что? Мне ведь и правда нравилась в наших плаваниях вот так, лицом, биться о скалы. Карабкаться по горло в воде и не тонуть. Ощутить привкус свободы... совсем чуть-чуть, самую малость... Но и этого хватило, чтобы мечтать теперь о ней по ночам. {g|Encyclopedia:KasballicaMission}Касбаллика{/g}? Хладный торг? {g|Encyclopedia:Footfall}Футфол{/g}? В пасть к пустотному кракену! Отныне Джай Хейдари принадлежит лишь себе!"'
  speaker: null
