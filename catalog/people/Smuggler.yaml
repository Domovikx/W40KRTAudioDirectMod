  text: '{n}Джай перестает улыбаться и утомленно потирает переносицу.{/n} "Послушайте, шерин, податель{mf||ница} счастья и любезней{mf|ший друг|шая подруга моя}... я та, кто я есть — {g|Encyclopedia:ColdTrade}хладный торговец{/g}, агент {g|Encyclopedia:KasballicaMission}Касбаллики{/g} и ваш партнер. А прошлое у каждого свое и есть тайна за семью печатями. Я ж не лезу вам в душу, верно? Так и вы мою пожалейте, она и без того уже изрядно ажи потаскана да пожевана. А если вам это не по вкусу, так давайте расходиться — и дальше каждый по своему пути, да?"'
