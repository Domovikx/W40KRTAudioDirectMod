name: Тразин
gender: M
role: Некрон
age: ''
personality: загадочный, коллекционер, саркастичный
sound_keys:
- Trazyn
total_phrases: 63
phrases:
- guid: eff25560-b57d-48f1-a797-00860557a1fb
  event: TrazynAfterOffer_Trazyn_01
  text: '{n}Тразин окидывает взглядом рушащийся вокруг вас Музеон, а затем переводит взгляд на вас.{/n} "Нет смысла продолжать
    это сражение. Эту часть моего архива уже не спасти. Я лишь трачу время на упрям{mf|ого|ую} вредител{mf|я|ьницу}, защищающ{mf|его|ую}
    никчемный экспонат".'
  speaker: Trazyn
- guid: 631b6fdd-43c6-4e26-99b4-798ce942f338
  event: TrazynAfterOffer_Trazyn_02
  text: '"Я не намерен продолжать. Забирай Себериана фон Валанциуса. Местный Музеон пал, и я не вижу причин и далее находиться
    здесь".'
  speaker: null
- guid: 016810db-4a67-4eb9-a4ed-9681187913ee
  event: TrazynAfterOffer_Trazyn_03
  text: '"Поражение? Ты лишил{mf||а} меня малозначительного филиала моего Музеона. Твоя "победа" заключается лишь в том, что
    ты слишком долго удерживал{mf||а} на себе мой фокус внимания".'
  speaker: null
- guid: 97bdcc05-cbb1-41a6-b878-f1c66cae1e14
  event: TrazynAfterOffer_Trazyn_04
  text: '"Довольно. Я прекращаю этот бой за отсутствием хоть какого-то смысла".'
  speaker: null
- guid: e34a9400-ff72-40cd-a7eb-4bd1f6389adf
  event: TrazynFirstMeet_Trazyn_01
  text: '"Горстка вредителей, пробравшихся внутрь экспоната и испортившая мой шедевр — и из-за этого я вынужден явиться на
    полузабытые задворки галактики? Что ж, мои поздравления — вам удалось обратить на себя взор Тразина Неисчислимого, хозяина
    Музеона, в который вы, ничтожества, вторглись". {n}Сквозь металлическую маску просачивается едкий смешок, напоминающий
    скрежет металла по стеклу.{/n}'
  speaker: null
- guid: 916401c9-78c5-4571-9bd3-5037084f1552
  event: TrazynFirstMeet_Trazyn_02
  text: '{n}Ксенос бросает на вас взгляд — взгляд существа столь древнего и могущественного, что вы почти что ощущаете его
    физически.{/n} "Сам факт того, что ты оказал{mf|ся|ась} здесь, выделяет тебя среди прочих вредителей. Занятное упорство
    и отсутствие навыка прогнозирования последствий... хотя, быть может, ты даже не представлял{mf||а}, с чем связываешься".'
  speaker: null
- guid: 3ee313ef-d1cd-44ce-a6ee-a7dfe7f5e93c
  event: TrazynFirstMeet_Trazyn_03
  text: '"Это не твое решение. Однако..."'
  speaker: null
- guid: 349afab2-0b69-4543-81bd-c024bc50e9d2
  event: TrazynFirstMeet_Trazyn_04
  text: '{n}Острая боль пронзает все ваше существо. Вы хотите кричать в надежде, что это облегчит невыносимое страдание...
    и тут понимаете, что мука, одновременно мимолетная и бесконечная, уже прервалась. Перед глазами двоится и плывут цветные
    пятна.{/n} "Я внес небольшое дополнение в твою физиологию — мне интересно проследить, как ты распорядишься своим трофеем.
    Проследить и высказать свое мнение, которое ты услышишь — где бы ни находил{mf|ся|ась}".'
  speaker: null
- guid: 26e28713-b2a3-41e5-9d54-066c13116f3b
  event: TrazynFirstMeet_Trazyn_05
  text: '"Сломали? Отнюдь. Сбили гипергеометрическую логику лабиринта своими суетливыми выходками, не больше". {n}Голос ксеноса
    приобретает сардонические нотки.{/n} "Но не дай этому уточнению испортить свое маленькое торжество — это все еще весьма
    впечатляюще для представител{mf|я|ьницы} примитивного вида".'
  speaker: null
- guid: 2dd5f89f-638c-4166-b166-1171e99e9f1a
  event: TrazynFirstMeet_Trazyn_06
  text: '"Примитивные цивилизации всегда забавляют своей неспособностью осознать всю меру своего бессилия — и одновременной
    настойчивостью в ее полном отрицании. Путь для тех, кто находится в этом месте, определяю только я — тем более сейчас,
    когда ваши действия заставили меня прибыть лично".'
  speaker: null
- guid: cb2d6cd5-2637-4ae1-91d0-8ba93dbc6e54
  event: TrazynFirstMeet_Trazyn_07
  text: '"Я ценю внимательных слушателей. И все же нам пора завершать эту встречу".'
  speaker: null
- guid: 9be2e479-f2bf-4e90-a23e-3a0c7366509d
  event: TrazynFirstMeet_Trazyn_08
  text: '{n}Тразин поднимает руку, обводя окружающее пространство.{/n} "Ты — внутри одного из экспонатов моей коллекции, величайшей
    в галактике. Я лично собрал ее, преодолев расстояния в миллионы звездных систем и периоды в сотни тысячелетий. Оказаться
    среди реликвий, созданий и событий, что выставлены в Музеоне Тразина Неисчислимого — честь, которой я одариваю единицы".'
  speaker: Trazyn
- guid: ed99fa30-ada9-42ab-aacf-d8222c273c53
  event: TrazynFirstMeet_Trazyn_09
  text: '"Хм..." {n}Тразин окидывает вас и ваше оружие небрежным взглядом.{/n} "Типичный представитель своего вида — способность
    приходить даже к простым логическим выводам ограниченна. Упрощу вводные для твоего понимания: ты хочешь такого же обращения,
    какое получил твой собрат?"'
  speaker: Trazyn
- guid: b5aad916-8b14-48ae-a2d0-76626a94bea1
  event: TrazynFirstMeet_Trazyn_10
  text: '"Редкий представитель вашего рода заслуживает моего интереса. Себериан фон Валанциус сделал это, перейдя мне дорогу
    и украв бесценную реликвию, которую я планировал добавить к своей коллекции. Сей поступок столь впечатлил меня, что я
    решил вернуть себе украденное вместе с вором. Я знал, что Себериан вернется за другими сокровищами, скрытыми на мире Зарков.
    Я знал, что он не упустит возможность исследовать портал, который так кстати обнаружит внутри храма..."'
  speaker: null
- guid: 208ad0c1-83eb-4988-9e7b-243e12ca823d
  event: TrazynFirstMeet_Trazyn_11
  text: '{n}Тразин Неисчислимый погружается в короткое молчание.{/n} "Экспозиция, срежисированная мной, испорчена, а коллекция
    лишилась одного из экспонатов — и это после того, как я щедро наградил Себериана за его исключительность. Я лишаю династию
    фон Валанциус чести состоять в экспозиции Музеона. Забирай своего предка. Я буду присматривать замену".'
  speaker: Trazyn
- guid: 451ae85a-d0af-45aa-8cf7-29dd2b135103
  event: TrazynFirstMeet_Trazyn_12
  text: '{n}Голос некрона окрашивается ядовитыми нотками.{/n} "Конечно же, Ларию Войгтвир я оставлю — она прилежно исполняла
    свою роль и я не вижу причин избавляться от нее. Если Себериан захочет с ней воссоединиться — он может вернуться, взмолиться
    о прощении... и, быть может, заслужить честь снова стать экспонатом. А что касается тебя, вредитель{mf||ница}..." {n}Тразин
    чуть поднимает посох.{/n}'
  speaker: Trazyn
- guid: e903f113-13c0-4e31-b286-273f239d32b4
  event: TrazynFirstMeet_Trazyn_13
  text: '{n}Голова ксеноса чуть поворачивается в сторону Себериана.{/n} "Маленький воришка, посмевший украсть у самого Хранителя
    истории, и вновь ты доставляешь мне неприятности. Что это, самонадеянная спасательная операция? Твое никчемное имя еще
    помнит кто-то из твоих короткоживущих собратьев?"'
  speaker: null
- guid: 002c8194-8ac1-43cd-bc8f-825ce8a225be
  event: TrazynFirstMeet_Trazyn_14
  text: '"С тех пор Себериан фон Валанциус и столь любимая им Лария Войгтвир превратились в главных героев собственной экспозиции.
    Вновь и вновь они переживают безнадежную осаду своего мира. Вновь и вновь они выбирают пути, принимают решения и добираются
    к финалу все новыми и новыми способами. К финалу, который уже предрешен. К поражению, в котором Себериана неизменно подводит
    его драгоценный трофей, меч Багряная пляска Кхейна — тот самый, что он украл у меня. Тот самый, что я забрал, оставив
    запертому в бесконечном цикле Себериану твердосветную копию".'
  speaker: null
- guid: 2ef2f83f-f919-4690-aa61-51ba4823d635
  event: TrazynFirstMeet_Trazyn_15
  text: '"Какой интересный выбор слов — "смерть врагам фон Валанциус". Значит, ты — из рода Себериана. Не знаю, что именно
    привело тебя по следам предка — наивное желание его спасти, или схожая склонность к стяжательству, но не думаю, что ты
    будешь возражать, если я объясню, как он — а теперь и ты — оказались здесь".'
  speaker: null
- guid: 46d8457c-bd95-476f-8c9c-2212359117ab
  event: TrazynFirstMeet_Trazyn_16
  text: '"А теперь..." {n}Тразин поднимает руку в патетическом жесте и делает театральную паузу.{/n} "...вон из моего Музеона".'
  speaker: Trazyn
- guid: 8736cfbf-d838-4199-8048-215061129d5b
  event: TrazynInYourRoom_Trazyn_01
  text: '"Занятно, весьма занятно... единственная любопытная вещь из всей этой бесполезной груды. Но какой генез? Причины
    происхождения? Для определения потребуется более тщательное исследование... хотя свидетельство даже примитивного существа
    сгодится. Ты!" {n}Фигура оборачивается в к вам и небрежно указывает на один из трофеев.{/n} "Откуда на судне этот объект?
    Что тебе известно о его происхождении?"'
  speaker: null
- guid: 281fa2e5-d7dc-463a-976e-f2f0103d6693
  event: TrazynInYourRoom_Trazyn_02
  text: '"Элементарный пространственно-временной стазис, исключающий бесполезную конфронтацию, на которую я не собираюсь тратить
    время. Теперь — сосредоточься на моем вопросе".'
  speaker: null
- guid: 0115f573-c2a7-4aae-91e2-da0bd986dc4d
  event: TrazynInYourRoom_Trazyn_03
  text: '{n}Великан издает металлический лязг, в котором странным образом угадывается недовольство.{/n} "Человек, я обращаюсь
    к тебе на языке, который ты долж{mf|ен|на} понимать. Ответь на мой вопрос".'
  speaker: null
- guid: e6b2c419-f781-4ebf-b10f-f7ae75bf9acf
  event: TrazynInYourRoom_Trazyn_04
  text: '"Я высказался достаточно просто, чтобы ты смог{mf||ла} понять суть моего вопроса. Возможно, я должен говорить медленнее".'
  speaker: null
- guid: 1b05cebb-343f-47e6-8ffd-e87a6d18e742
  event: TrazynInYourRoom_Trazyn_05
  text: '"И вновь недолговечность форм подобных вашей уносит в бездну истории бесценные данные..."'
  speaker: null
- guid: 24869a5d-a3e5-4179-83e7-d20752990be8
  event: TrazynInYourRoom_Trazyn_06
  text: '{n}Великан указывает на массивную глыбу, расположенную на трофейной доске.{/n} "Сие есть свидетельство того, как
    древние враги моего вида были сражены руками твоего примитивного народа. Известно ли тебе, как появился этот объект и
    почему он занимает столь почетное место?"'
  speaker: null
- guid: 91e31ee6-0939-404d-b7ad-17ba89eaa9aa
  event: TrazynInYourRoom_Trazyn_07
  text: '"Я разочарован твоими коммуникационными способностями. Однако у тебя все еще есть возможность ответить на мой вопрос".'
  speaker: null
- guid: 442583d6-d54f-48dc-bec3-423828dc3d68
  event: TrazynInYourRoom_Trazyn_08
  text: '"Полагаю, ты весьма гордишься неаргументированной догадкой столь низкого уровня. Весьма прискорбное зрелище".'
  speaker: null
- guid: 74b86309-4b0e-4b97-83df-0e3ae068c9f0
  event: TrazynInYourRoom_Trazyn_09
  text: '"Полагаю, это тупик для дальнейших изысканий. Поскольку ты оказал{mf|ся|ась} бесполез{mf|ен|на} для моего исследования,
    я завершаю этот бессмысленный разговор. Прощай, человек".'
  speaker: null
- guid: 2d21a7d2-d3c7-40cb-b71c-579ca9e5207d
  event: TrazynOffer_Ancestor_01
  text: '{n}Себериан перехватывает оружие поудобнее.{/n} "Громкие слова. Давайте проверим, стоит ли наша династия гордых речей".'
  speaker: null
- guid: a4971292-0128-4057-9746-6ca663fd9f10
  event: TrazynOffer_Ancestor_02
  text: '{n}Лицо Себериана — уцелевшая его часть — искажается в гримасе бешенства.{/n} "Вероломн{mf|ый|ая}, бесхребетн{mf|ый|ая}
    мерзав{mf|ец|ка}! Вы недостойны носить имя рода фон Валанциус! Вы..."'
  speaker: null
- guid: 571e0fbe-efb7-4fef-9edd-6c4729eb048a
  event: TrazynOffer_Ancestor_03
  text: '{n}Предок издает угрюмый смешок.{/n} "Что ж. Пожалуй, все это с самого начала не стоило потраченных усилий... Об
    одном прошу: сберегите династию, наследни{mf|к|ца}. Сберегите..."'
  speaker: null
- guid: 2653ebc3-5309-4549-98c8-ee1a6febe337
  event: TrazynOffer_Ancestor_04
  text: '{n}Предок вздыхает — и вы слышите отчетливое облегчение в его голосе.{/n} "Я... рад. Рад вернуться к забытью. Надеюсь,
    память о вашем скорбном веке будет милосердно стерта из моей памяти. Прощайте, насле..."'
  speaker: null
- guid: 7756785e-ab16-45f9-93d6-37ca5680c21c
  event: TrazynOffer_Ancestor_05
  text: '{n}Себериан мрачно усмехается.{/n} "Похвальная, пускай и неожиданная решимость, наследни{mf|к|ца}! Тварь должна поплатиться!"'
  speaker: null
- guid: ac84596d-71b4-4e11-9367-2318200ae164
  event: TrazynOffer_Ancestor_06
  text: '{n}Себериан едва заметно качает головой.{/n} "Возможно, отдать меня твари было бы лучшим решением для нас обоих..."'
  speaker: null
- guid: 0dbc7acf-9933-48d2-b986-c151756d52a9
  event: TrazynOffer_Idira_01
  text: '{n}Идира обхватывает себя руками и начинает покачиваться. Ее губы покрываются изморозью.{/n} "Начало без конца, конец
    без начала, связаны, спутаны, идут друг за другом. И так вечность за вечностью за вечностью..."'
  speaker: Idira Tlass
- guid: 2741f4fe-220a-441a-be18-3e5d80a04fda
  event: TrazynOffer_Trazyn_01
  text: '{n}Некрон замирает, разглядывая вас. Спустя несколько мгновений голос Тразина Неисчислимого разрезает воцарившуюся
    тишину:{/n} "Нужно отдать тебе должное, человек — для своего вида ты сражаешься с выдающейся решимостью — или занятной
    обреченностью. Возможно, в тебе все же есть что-то, что когда-нибудь заслужит тебе право оказаться в моей коллекции".'
  speaker: null
- guid: 9d43febd-0d99-44ac-9800-e867a453038a
  event: TrazynOffer_Trazyn_02
  text: '"Сделка состоялась. Я заберу свое с твоего корабля, когда придет время".'
  speaker: null
- guid: 86a4af57-612f-4e59-92fa-01d244eaaef9
  event: TrazynOffer_Trazyn_03
  text: '"В таком случае..."'
  speaker: null
- guid: 9cf64bd1-26f4-4565-8d05-90c2782314b1
  event: TrazynOffer_Trazyn_04
  text: '{n}В то мгновение, когда ваше тело погружается в транспространственный водоворот, порожденный ксеносской магией,
    вам чудятся отголоски язвительного смеха, звучащего за вашей спиной...{/n}'
  speaker: null
- guid: fe5de4af-e47d-4295-bd40-5f0803743585
  event: TrazynOffer_Trazyn_05
  text: '"Я заберу его в другое хранилище моей коллекции, где помещу в новую экспозицию. Мне предстоит выбрать новый эпизод
    истории, главным героем которого будет Вольный Торговец... быть может, я воспроизведу ту сцену, что разворачивается вокруг
    нас? Рушащийся Музеон, призрачная надежда на победу, которая ускользает в последний момент..."'
  speaker: null
- guid: ef9005b8-bb4f-4ba3-9295-8529acbe6f77
  event: TrazynOffer_Trazyn_06
  text: '"Достаточно". {n}Тразин щелкает пальцами — и Себериан фон Валанциус, легенда рода и прославленный {g|Encyclopedia:RogueTraderGlossary}Вольный
    Торговец{/g}, исчезает, покорный неведомым ксенотехнологиям. Багряная пляска Кхейна меркнет вместе с хозяином — чтобы
    через мгновение появиться у вас в руках.{/n}'
  speaker: Trazyn
- guid: a200f233-8673-4623-b55e-1095440ab423
  event: TrazynOffer_Trazyn_07
  text: '"Напрасно. В таком случае..." {n}Ксенос поднимает оружие.{/n} "...продолжим".'
  speaker: null
- guid: 48d9d1aa-fc1e-49b1-9ee5-87817f322a9b
  event: TrazynOffer_Trazyn_08
  text: '{n}Металлическое чудовище издает звук, удивительно похожий на утомленный вздох.{/n} "Разочаровывающе".'
  speaker: null
- guid: 84d1b974-37ec-47c0-9ba5-25e379645366
  event: TrazynOffer_Trazyn_10
  text: '"Либо..." {n}Речь Тразина прерывается предвкушающим смешком.{/n} "Либо в обмен на услугу я приму в свою коллекцию
    занятную вещицу, которую я заметил на твоем корабле, когда следил за династией твоими глазами. Я не ожидал, что встречу
    на рядовом судне людей что-то уникальное. Ты называешь эту вещь "Номос". Я заинтригован природой этого феномена и хотел
    бы получить его себе — в обмен на помощь с Калькасаром".'
  speaker: null
- guid: 9561489b-29b6-4ca9-88b8-66442d2dbdd6
  event: TrazynOffer_Trazyn_12
  text: '{n}Тразин медлит.{/n} "Хм... я удивлен твоей сговорчивостью. Пожалуй, я предложу тебе еще одну сделку".'
  speaker: Trazyn
- guid: a0657984-a2bd-446a-8eb0-a6b51470c78a
  event: TrazynOffer_Trazyn_14
  text: '"Калькасар. Тот твой сородич, по следам которого ты прибыл в этот регион. На одном из миров-гробниц он скрывает нечто...
    ценное. Нечто, для чего было создано так называемое "Ярмо". Амбиции Лорд-инквизитора смехотворны в своей грандиозности
    и обречены на провал, потому я предлагаю тебе сделку. Я помогу тебе совладать с этим человеком и последствиями его деяний,
    а ты — ты отдашь мне то, что он так алчет и чего так страшится".'
  speaker: null
- guid: 5b2e6a96-f52f-4bef-ab3b-2abb9c49ab28
  event: TrazynOffer_Trazyn_15
  text: '{n}Повисает тишина — и вдруг вам в голову закрадывается мысль, что, кажется, Тразин Неисчислимый, Хранитель истории
    и владыка Музеона, не хочет расписываться в неподобающем неведении. После неловкой паузы некрон недовольно ворчит:{/n}
    "У меня есть несколько... гипотез".'
  speaker: null
- guid: 4d7dd2ab-70da-4508-af2b-dfea55d2b0cd
  event: TrazynOffer_Trazyn_16
  text: '"Это не предмет. И не существо. Это — осколок древности, побежденной и заточенной, но все еще неизмеримо опасной
    для примитивных варваров вроде вас. Ты осознаешь всю меру моей правоты, когда лично узришь ее".'
  speaker: null
- guid: e4e1bf7d-e7a5-4e78-8db9-7c2bf145992b
  event: TrazynOffer_Trazyn_17
  text: '"Прекрасно. Я появлюсь прямо на месте событий — пускай мое прибытие станет сюрпризом для твоего сородича".'
  speaker: null
- guid: a3d5d3f7-9c86-488b-b1d0-14232513c5a5
  event: TrazynOffer_Trazyn_18
  text: '{n}Тразин издает самодовольный хохоток.{/n} "Мудро. Короткоживущим не стоит заигрывать с тайнами, скрытыми во мраке
    древности".'
  speaker: Trazyn
- guid: 4929a20f-123e-4aca-8467-4eff81acfc3d
  event: TrazynOffer_Trazyn_19
  text: '"Нам больше не о чем говорить, и твое присутствие здесь неуместно. Я открыл пространственный проход, который выведет
    тебя из Музеона и вернет на твой корабль. Ступай же". {n}В голосе ксеноса звучит усталое раздражение и... что-то еще.
    Что-то странное и опасное.{/n}'
  speaker: null
- guid: efe31f79-1668-4454-a4e4-418f133be8a8
  event: TrazynOffer_Trazyn_20
  text: '"Чем тебя удивляет мое желание избавиться от тебя как можно скорее?" {n}Голос некрона звучит ровно, надменно и...
    фальшиво. Словно, произнося слова, ксенос сдерживает злобную усмешку, окрашивающую его тон в ядовитые цвета.{/n}'
  speaker: null
- guid: 05ec0eb3-a53a-41f0-9a2d-6aae99e7406c
  event: TrazynOffer_Trazyn_20
  text: '"Чем тебя удивляет мое желание избавиться от тебя как можно скорее?" {n}Голос некрона звучит ровно и надменно.{/n}'
  speaker: null
- guid: a508d8d6-7123-4c3c-ad5d-a2f3f313e4a7
  event: TrazynOffer_Trazyn_23
  text: '"Ты достаточно долго отвлекал{mf||а} меня своими жалкими попытками сопротивления, чтобы я спокойно обдумал судьбу
    этого Музеона и даже смирился с его утратой — в конце концов это лишь малая его часть, малозначимое собрание в малозначимом
    углу галактики. Поэтому я повторю свое предложение: Себериан фон Валанциус в обмен на {g|Encyclopedia:WarrantGlossary}Патент{/g}.
    Я даже позволю тебе забрать Багряную пляску Кхейна. По своему это будет даже иронично: маленький воришка все же заполучит
    легендарное оружие для своей династии".'
  speaker: null
- guid: 6674dc1b-b480-4bca-98c8-68643827c5e9
  event: TrazynOffer_Trazyn_24
  text: '{n}Повисает тишина — которую нарушает довольный смех ксеноса.{/n} "Похвально, человек — твоя способность делать выводы
    из полученного опыта делает тебе честь".'
  speaker: null
- guid: 5b7d12e8-77d0-45e9-800a-04d79e458256
  event: TrazynShowdown_Ancestor_01
  text: '{n}При виде ненавистного врага плечи Себериана тяжело вздымаются — Вольный Торговец словно набирает воздуха в кибернетические
    легкие перед решающим боем.{/n} "Ты хотел вернуть меня, ксенос? Я здесь. Я уничтожу и тебя, и эти нечистые палаты. Руины
    твоего музея, что так дорог твоей проклятой душе — если у тебя она есть — станут погребальным монументом Ларии Войгтвир..."'
  speaker: null
- guid: f26946e2-a925-4f25-8bcc-6a1a522ca50f
  event: TrazynShowdown_Trazyn_01
  text: '{n}Бездушная проекция подергивается и дрожит, однако голос Тразина Неисчислимого звучит ясно и четко — и холодная,
    пронизывающая до костей злоба, которой сочится речь ксеноса, заставляет вашу кровь застыть.{/n} "Вы... примитивные ничтожества!
    Я мог бы столетия объяснять вам, какую катастрофу вы сотворили, нарушив целостность и герметичность хранилища самой истории,
    но ваши ограниченные синаптические связи даже не способны обработать и усвоить эту информацию во всей ее чудовищности".'
  speaker: null
- guid: 8dc38935-0ce7-42f7-ba85-2654d3181db4
  event: TrazynShowdown_Trazyn_02
  text: '{n}Взгляд Тразина застывает на Себериане — и мече, который тот сжимает в руках. Голос некрона обращается едкой кислотой,
    прожигающей самую душу.{/n} "Я вижу, ты вновь отыскал свою драгоценную игрушку, маленький воришка... По своему это знаковое
    событие. С Багряной пляски Кхейна, попавшей в твои руки, все и началось — с ним же все и закончится. И для тебя, и для
    твое{mf|го|й} последн{mf|его|ей} уцелевше{mf|го|й} наследни{mf|ка|цы}".'
  speaker: null
- guid: 6752efc0-f01c-4561-af41-22c83c0a2a06
  event: TrazynShowdown_Trazyn_03
  text: '"Ты думаешь, что после вашей гибели я оставлю крохотное царство фон Валанциус в покое? Зря".'
  speaker: null
- guid: c3e1c8db-4e14-4a50-ae42-8713f21652ff
  event: TrazynShowdown_Trazyn_04
  text: '"Примитивная попытка манипуляции. Ничто в том, что нам предстоит, не покажется тебе "честным"".'
  speaker: null
- guid: 826a6663-21ec-45bd-aed0-8d00640e8a09
  event: TrazynShowdown_Trazyn_05
  text: '{n}Проекция колеблется и начинает затухать.{/n} "Пришло время вычистить остатки неудачной экспозиции, коими являются
    фон Валанциусы. И я лично займусь этим — прямо сейчас".'
  speaker: null
- guid: 49ccd84a-dfab-47c8-8fff-9e2c81a424fc
  event: TrazynShowdown_Trazyn_06
  text: '"Ты пытаешься выдать разрушение Музеона и порчу моей коллекции за мое собственное пожелание?" {n}Тразин переходит
    на шипение.{/n} "Твои убогие попытки шутить не идут на пользу твоему грядущему".'
  speaker: Trazyn
