    text_clean: Калькасар. Тот твой сородич, по следам которого ты прибыл в этот регион. На одном из миров-гробниц он скрывает нечто... ценное. Нечто, для чего было создано так называемое "Ярмо". Амбиции Лорд-инквизитора смехотворны в своей грандиозности и обречены на провал, потому я предлагаю тебе сделку. Я помогу тебе совладать с этим человеком и последствиями его деяний, а ты — ты отдашь мне то, что он так алчет и чего так страшится.
