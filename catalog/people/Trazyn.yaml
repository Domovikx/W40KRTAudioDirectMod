- guid: c22f081c-d37b-467b-a0ff-dac81750e944
  event: ''
  text: '"Наш договор истек за исполнением наших обязательств". {n}Тразин обращается к вам, и в его голосе сквозит злобное довольство.{/n} "Твой трофей отныне принадлежит мне, и наши пути расходятся".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Наш договор истек за исполнением наших обязательств.
  - speaker: narrator
    text_clean: Тразин обращается к вам, и в его голосе сквозит злобное довольство.
  - speaker: Trazyn
    text_clean: Твой трофей отныне принадлежит мне, и наши пути расходятся.
- guid: c78ed704-b5f1-46cc-885d-3a5d5c223ad2
  event: ''
  text: '{n}Тразин издает раздраженный скрежет.{/n} "Толика терпения не убьет тебя, примитивное создание. Ваша жизнь скоротечна, но не настолько".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Тразин издает раздраженный скрежет.
  - speaker: Trazyn
    text_clean: Толика терпения не убьет тебя, примитивное создание. Ваша жизнь скоротечна, но не настолько.
- guid: e3b580e4-5b36-4240-8d96-e62a1a001e6a
  event: ''
  text: '"Ярмо... сколь примитивное название. И все же то, что было сказано о нем, вызывает любопытство. Тайное оружие, основанное на запретных знаниях и скованное совместными усилиями десятков и сотен людей, оставленных в неведении..." {n}Тразин удовлетворенно хмыкает.{/n} "Тебе следует найти эту вещь — я хотел бы взглянуть на нее поближе".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Ярмо... сколь примитивное название. И все же то, что было сказано о нем, вызывает любопытство. Тайное оружие, основанное на запретных знаниях и скованное совместными усилиями десятков и сотен людей, оставленных в неведении...
  - speaker: narrator
    text_clean: Тразин удовлетворенно хмыкает.
  - speaker: Trazyn
    text_clean: Тебе следует найти эту вещь — я хотел бы взглянуть на нее поближе.
- guid: eff25560-b57d-48f1-a797-00860557a1fb
  event: TrazynAfterOffer_Trazyn_01
  text: '{n}Тразин окидывает взглядом рушащийся вокруг вас Музеон, а затем переводит взгляд на вас.{/n} "Нет смысла продолжать это сражение. Эту часть моего архива уже не спасти. Я лишь трачу время на упрям{mf|ого|ую} вредител{mf|я|ьницу}, защищающ{mf|его|ую} никчемный экспонат".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Тразин окидывает взглядом рушащийся вокруг вас Музеон, а затем переводит взгляд на вас.
  - speaker: Trazyn
    text_clean: Нет смысла продолжать это сражение. Эту часть моего архива уже не спасти. Я лишь трачу время на упрямого вредителя, защищающего никчемный экспонат.
- guid: 631b6fdd-43c6-4e26-99b4-798ce942f338
  event: TrazynAfterOffer_Trazyn_02
  text: '"Я не намерен продолжать. Забирай Себериана фон Валанциуса. Местный Музеон пал, и я не вижу причин и далее находиться здесь".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Я не намерен продолжать. Забирай Себериана фон Валанциуса. Местный Музеон пал, и я не вижу причин и далее находиться здесь.
- guid: 016810db-4a67-4eb9-a4ed-9681187913ee
  event: TrazynAfterOffer_Trazyn_03
  text: '"Поражение? Ты лишил{mf||а} меня малозначительного филиала моего Музеона. Твоя "победа" заключается лишь в том, что ты слишком долго удерживал{mf||а} на себе мой фокус внимания".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Поражение? Ты лишил меня малозначительного филиала моего Музеона. Твоя "победа" заключается лишь в том, что ты слишком долго удерживал на себе мой фокус внимания.
- guid: 97bdcc05-cbb1-41a6-b878-f1c66cae1e14
  event: TrazynAfterOffer_Trazyn_04
  text: '"Довольно. Я прекращаю этот бой за отсутствием хоть какого-то смысла".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Довольно. Я прекращаю этот бой за отсутствием хоть какого-то смысла.
- guid: e34a9400-ff72-40cd-a7eb-4bd1f6389adf
  event: TrazynFirstMeet_Trazyn_01
  text: '"Горстка вредителей, пробравшихся внутрь экспоната и испортившая мой шедевр — и из-за этого я вынужден явиться на полузабытые задворки галактики? Что ж, мои поздравления — вам удалось обратить на себя взор Тразина Неисчислимого, хозяина Музеона, в который вы, ничтожества, вторглись". {n}Сквозь металлическую маску просачивается едкий смешок, напоминающий скрежет металла по стеклу.{/n}'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Горстка вредителей, пробравшихся внутрь экспоната и испортившая мой шедевр — и из-за этого я вынужден явиться на полузабытые задворки галактики? Что ж, мои поздравления — вам удалось обратить на себя взор Тразина Неисчислимого, хозяина Музеона, в который вы, ничтожества, вторглись.
  - speaker: narrator
    text_clean: Сквозь металлическую маску просачивается едкий смешок, напоминающий скрежет металла по стеклу.
- guid: 916401c9-78c5-4571-9bd3-5037084f1552
  event: TrazynFirstMeet_Trazyn_02
  text: '{n}Ксенос бросает на вас взгляд — взгляд существа столь древнего и могущественного, что вы почти что ощущаете его физически.{/n} "Сам факт того, что ты оказал{mf|ся|ась} здесь, выделяет тебя среди прочих вредителей. Занятное упорство и отсутствие навыка прогнозирования последствий... хотя, быть может, ты даже не представлял{mf||а}, с чем связываешься".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Ксенос бросает на вас взгляд — взгляд существа столь древнего и могущественного, что вы почти что ощущаете его физически.
  - speaker: Trazyn
    text_clean: Сам факт того, что ты оказался здесь, выделяет тебя среди прочих вредителей. Занятное упорство и отсутствие навыка прогнозирования последствий... хотя, быть может, ты даже не представлял, с чем связываешься.
- guid: 3ee313ef-d1cd-44ce-a6ee-a7dfe7f5e93c
  event: TrazynFirstMeet_Trazyn_03
  text: '"Это не твое решение. Однако..."'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Это не твое решение. Однако...
- guid: 349afab2-0b69-4543-81bd-c024bc50e9d2
  event: TrazynFirstMeet_Trazyn_04
  text: '{n}Острая боль пронзает все ваше существо. Вы хотите кричать в надежде, что это облегчит невыносимое страдание... и тут понимаете, что мука, одновременно мимолетная и бесконечная, уже прервалась. Перед глазами двоится и плывут цветные пятна.{/n} "Я внес небольшое дополнение в твою физиологию — мне интересно проследить, как ты распорядишься своим трофеем. Проследить и высказать свое мнение, которое ты услышишь — где бы ни находил{mf|ся|ась}".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Острая боль пронзает все ваше существо. Вы хотите кричать в надежде, что это облегчит невыносимое страдание... и тут понимаете, что мука, одновременно мимолетная и бесконечная, уже прервалась. Перед глазами двоится и плывут цветные пятна.
  - speaker: Trazyn
    text_clean: Я внес небольшое дополнение в твою физиологию — мне интересно проследить, как ты распорядишься своим трофеем. Проследить и высказать свое мнение, которое ты услышишь — где бы ни находился.
- guid: 26e28713-b2a3-41e5-9d54-066c13116f3b
  event: TrazynFirstMeet_Trazyn_05
  text: '"Сломали? Отнюдь. Сбили гипергеометрическую логику лабиринта своими суетливыми выходками, не больше". {n}Голос ксеноса приобретает сардонические нотки.{/n} "Но не дай этому уточнению испортить свое маленькое торжество — это все еще весьма впечатляюще для представител{mf|я|ьницы} примитивного вида".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Сломали? Отнюдь. Сбили гипергеометрическую логику лабиринта своими суетливыми выходками, не больше.
  - speaker: narrator
    text_clean: Голос ксеноса приобретает сардонические нотки.
  - speaker: Trazyn
    text_clean: Но не дай этому уточнению испортить свое маленькое торжество — это все еще весьма впечатляюще для представителя примитивного вида.
- guid: 2dd5f89f-638c-4166-b166-1171e99e9f1a
  event: TrazynFirstMeet_Trazyn_06
  text: '"Примитивные цивилизации всегда забавляют своей неспособностью осознать всю меру своего бессилия — и одновременной настойчивостью в ее полном отрицании. Путь для тех, кто находится в этом месте, определяю только я — тем более сейчас, когда ваши действия заставили меня прибыть лично".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Примитивные цивилизации всегда забавляют своей неспособностью осознать всю меру своего бессилия — и одновременной настойчивостью в ее полном отрицании. Путь для тех, кто находится в этом месте, определяю только я — тем более сейчас, когда ваши действия заставили меня прибыть лично.
- guid: cb2d6cd5-2637-4ae1-91d0-8ba93dbc6e54
  event: TrazynFirstMeet_Trazyn_07
  text: '"Я ценю внимательных слушателей. И все же нам пора завершать эту встречу".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Я ценю внимательных слушателей. И все же нам пора завершать эту встречу.
- guid: 9be2e479-f2bf-4e90-a23e-3a0c7366509d
  event: TrazynFirstMeet_Trazyn_08
  text: '{n}Тразин поднимает руку, обводя окружающее пространство.{/n} "Ты — внутри одного из экспонатов моей коллекции, величайшей в галактике. Я лично собрал ее, преодолев расстояния в миллионы звездных систем и периоды в сотни тысячелетий. Оказаться среди реликвий, созданий и событий, что выставлены в Музеоне Тразина Неисчислимого — честь, которой я одариваю единицы".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Тразин поднимает руку, обводя окружающее пространство.
  - speaker: Trazyn
    text_clean: Ты — внутри одного из экспонатов моей коллекции, величайшей в галактике. Я лично собрал ее, преодолев расстояния в миллионы звездных систем и периоды в сотни тысячелетий. Оказаться среди реликвий, созданий и событий, что выставлены в Музеоне Тразина Неисчислимого — честь, которой я одариваю единицы.
- guid: ed99fa30-ada9-42ab-aacf-d8222c273c53
  event: TrazynFirstMeet_Trazyn_09
  text: '"Хм..." {n}Тразин окидывает вас и ваше оружие небрежным взглядом.{/n} "Типичный представитель своего вида — способность приходить даже к простым логическим выводам ограниченна. Упрощу вводные для твоего понимания: ты хочешь такого же обращения, какое получил твой собрат?"'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Хм...
  - speaker: narrator
    text_clean: Тразин окидывает вас и ваше оружие небрежным взглядом.
  - speaker: Trazyn
    text_clean: 'Типичный представитель своего вида — способность приходить даже к простым логическим выводам ограниченна. Упрощу вводные для твоего понимания: ты хочешь такого же обращения, какое получил твой собрат?'
- guid: b5aad916-8b14-48ae-a2d0-76626a94bea1
  event: TrazynFirstMeet_Trazyn_10
  text: '"Редкий представитель вашего рода заслуживает моего интереса. Себериан фон Валанциус сделал это, перейдя мне дорогу и украв бесценную реликвию, которую я планировал добавить к своей коллекции. Сей поступок столь впечатлил меня, что я решил вернуть себе украденное вместе с вором. Я знал, что Себериан вернется за другими сокровищами, скрытыми на мире Зарков. Я знал, что он не упустит возможность исследовать портал, который так кстати обнаружит внутри храма..."'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: Редкий представитель вашего рода заслуживает моего интереса. Себериан фон Валанциус сделал это, перейдя мне дорогу и украв бесценную реликвию, которую я планировал добавить к своей коллекции. Сей поступок столь впечатлил меня, что я решил вернуть себе украденное вместе с вором. Я знал, что Себериан вернется за другими сокровищами, скрытыми на мире Зарков. Я знал, что он не упустит возможность исследовать портал, который так кстати обнаружит внутри храма...
- guid: 208ad0c1-83eb-4988-9e7b-243e12ca823d
  event: TrazynFirstMeet_Trazyn_11
  text: '{n}Тразин Неисчислимый погружается в короткое молчание.{/n} "Экспозиция, срежисированная мной, испорчена, а коллекция лишилась одного из экспонатов — и это после того, как я щедро наградил Себериана за его исключительность. Я лишаю династию фон Валанциус чести состоять в экспозиции Музеона. Забирай своего предка. Я буду присматривать замену".'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Тразин Неисчислимый погружается в короткое молчание.
  - speaker: Trazyn
    text_clean: Экспозиция, срежисированная мной, испорчена, а коллекция лишилась одного из экспонатов — и это после того, как я щедро наградил Себериана за его исключительность. Я лишаю династию фон Валанциус чести состоять в экспозиции Музеона. Забирай своего предка. Я буду присматривать замену.
- guid: 451ae85a-d0af-45aa-8cf7-29dd2b135103
  event: TrazynFirstMeet_Trazyn_12
  text: '{n}Голос некрона окрашивается ядовитыми нотками.{/n} "Конечно же, Ларию Войгтвир я оставлю — она прилежно исполняла свою роль и я не вижу причин избавляться от нее. Если Себериан захочет с ней воссоединиться — он может вернуться, взмолиться о прощении... и, быть может, заслужить честь снова стать экспонатом. А что касается тебя, вредитель{mf||ница}..." {n}Тразин чуть поднимает посох.{/n}'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Голос некрона окрашивается ядовитыми нотками.
  - speaker: Trazyn
    text_clean: Конечно же, Ларию Войгтвир я оставлю — она прилежно исполняла свою роль и я не вижу причин избавляться от нее. Если Себериан захочет с ней воссоединиться — он может вернуться, взмолиться о прощении... и, быть может, заслужить честь снова стать экспонатом. А что касается тебя, вредитель...
  - speaker: narrator
    text_clean: Тразин чуть поднимает посох.
- guid: e903f113-13c0-4e31-b286-273f239d32b4
  event: TrazynFirstMeet_Trazyn_13
  text: '{n}Голова ксеноса чуть поворачивается в сторону Себериана.{/n} "Маленький воришка, посмевший украсть у самого Хранителя истории, и вновь ты доставляешь мне неприятности. Что это, самонадеянная спасательная операция? Твое никчемное имя еще помнит кто-то из твоих короткоживущих собратьев?"'
  speaker: Trazyn
  parts:
  - speaker: narrator
    text_clean: Голова ксеноса чуть поворачивается в сторону Себериана.
  - speaker: Trazyn
    text_clean: Маленький воришка, посмевший украсть у самого Хранителя истории, и вновь ты доставляешь мне неприятности. Что это, самонадеянная спасательная операция? Твое никчемное имя еще помнит кто-то из твоих короткоживущих собратьев?
- guid: 002c8194-8ac1-43cd-bc8f-825ce8a225be
  event: TrazynFirstMeet_Trazyn_14
  text: '"С тех пор Себериан фон Валанциус и столь любимая им Лария Войгтвир превратились в главных героев собственной экспозиции. Вновь и вновь они переживают безнадежную осаду своего мира. Вновь и вновь они выбирают пути, принимают решения и добираются к финалу все новыми и новыми способами. К финалу, который уже предрешен. К поражению, в котором Себериана неизменно подводит его драгоценный трофей, меч Багряная пляска Кхейна — тот самый, что он украл у меня. Тот самый, что я забрал, оставив запертому в бесконечном цикле Себериану твердосветную копию".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
    text_clean: С тех пор Себериан фон Валанциус и столь любимая им Лария Войгтвир превратились в главных героев собственной экспозиции. Вновь и вновь они переживают безнадежную осаду своего мира. Вновь и вновь они выбирают пути, принимают решения и добираются к финалу все новыми и новыми способами. К финалу, который уже предрешен. К поражению, в котором Себериана неизменно подводит его драгоценный трофей, меч Багряная пляска Кхейна — тот самый, что он украл у меня. Тот самый, что я забрал, оставив запертому в бесконечном цикле Себериану твердосветную копию.
- guid: 2ef2f83f-f919-4690-aa61-51ba4823d635
  event: TrazynFirstMeet_Trazyn_15
  text: '"Какой интересный выбор слов — "смерть врагам фон Валанциус". Значит, ты — из рода Себериана. Не знаю, что именно привело тебя по следам предка — наивное желание его спасти, или схожая склонность к стяжательству, но не думаю, что ты будешь возражать, если я объясню, как он — а теперь и ты — оказались здесь".'
  speaker: Trazyn
  parts:
  - speaker: Trazyn
