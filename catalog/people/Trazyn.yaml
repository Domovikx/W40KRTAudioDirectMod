  text: '"Либо..." {n}Речь Тразина прерывается предвкушающим смешком.{/n} "Либо в обмен на услугу я приму в свою коллекцию занятную вещицу, которую я заметил на твоем корабле, когда следил за династией твоими глазами. Я не ожидал, что встречу на рядовом судне людей что-то уникальное. Ты называешь эту вещь "Номос". Я заинтригован природой этого феномена и хотел бы получить его себе — в обмен на помощь с Калькасаром".'
