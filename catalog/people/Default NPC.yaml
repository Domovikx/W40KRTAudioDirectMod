  text: '"...по{mf|дин|жа}! Госпо{mf|дин|жа}, вы меня слышите?" {n}Сквозь гул и биение прорывается знакомый голос — это сенешаль Абеляр Версериан, склонившийся над вами и обеспокоенно заглядывающий вам в лицо. Заметив ваш взгляд, он облегченно вздыхает:{/n} "Вы живы... это больше, чем я от вас ожидал после того, что вы устроили!"'
  speaker: null
