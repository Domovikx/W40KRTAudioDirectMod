  event: PRL_BeforeFinalBattle_18
  text: '"Может, довольно высокопарных слов? {g|Encyclopedia:Navigator}Навигатор{/g} готов вывести корабль из варпа — если с мостика ему помогут!"'
  speaker: null
  parts:
