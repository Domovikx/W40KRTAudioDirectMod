  event: PRL_BeforeFinalBattle_19
  text: '{n}Эдель взирает на вас с недоумением. Затем, по мере того, как на псайкера нисходит осознание, его взгляд наполняется неверием.{/n} "Нет... Вольный Торговец... мертва?"'
