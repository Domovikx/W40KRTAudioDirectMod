  parts:
  - speaker: narrator
    text_clean: Инквизитор недовольно морщится.
  - speaker: NPC (по умолчанию)
    text_clean: Ваше необдуманное поведение не только неуместно, но и опасно. Для вас. Мне оно, впрочем, не доставит неудобств и не помешает задать свои вопросы.
- guid: 53c83a88-aa06-484e-b1e2-81f518f67d40
  event: CH2_Dargonus_InquisitorTruth_15
  text: '"Давайте начнем с главного. Как так вышло, что Хейнрикс ван Калокс, которого вашей почтенной предшественнице было поручено доставить ко мне, покинул этот мир? Признаюсь, я очень не люблю, когда мои агенты гибнут — как правило, по их кровавому следу я выхожу на очень неприятные и неблагочестивые секреты".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Давайте начнем с главного. Как так вышло, что Хейнрикс ван Калокс, которого вашей почтенной предшественнице было поручено доставить ко мне, покинул этот мир? Признаюсь, я очень не люблю, когда мои агенты гибнут — как правило, по их кровавому следу я выхожу на очень неприятные и неблагочестивые секреты.
- guid: fcd4e215-d3e7-4252-8780-b05bb7645ab8
  event: CH2_Dargonus_InquisitorTruth_16
  text: '"Господин ван Калокс достаточно долго пробыл рядом с вами. Он поручится за ваши слова".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Господин ван Калокс достаточно долго пробыл рядом с вами. Он поручится за ваши слова.
