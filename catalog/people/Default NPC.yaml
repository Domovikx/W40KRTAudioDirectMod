- guid: 4140f941-eca2-42e7-8b15-e6a91b517b79
  event: PRL_AfterKillingBeast_01
  text: '"Какой... подозрительно своевременный несчастный случай. Сервиторы вышли из строя на офицерской палубе как раз тогда, когда здесь присутствуют {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} и ее наследники". {n}Не сводя глаз с тел на полу, Кунрад снимает с пояса {g|Encyclopedia:Vox}вокс-передатчик{/g} и отрывисто отдает несколько команд в переговорное устройство. Затем он поворачивается к вам.{/n} "Я отдал команду блокировать переходы между верхним и средним сегментами обитаемых палуб. В случае намеренной атаки это должно помешать злоумышленникам... развить свой план".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Какой... подозрительно своевременный несчастный случай. Сервиторы вышли из строя на офицерской палубе как раз тогда, когда здесь присутствуют Вольный Торговец и ее наследники.
  - speaker: narrator
    text_clean: Не сводя глаз с тел на полу, Кунрад снимает с пояса вокс-передатчик и отрывисто отдает несколько команд в переговорное устройство. Затем он поворачивается к вам.
  - speaker: NPC (по умолчанию)
    text_clean: Я отдал команду блокировать переходы между верхним и средним сегментами обитаемых палуб. В случае намеренной атаки это должно помешать злоумышленникам... развить свой план.
- guid: 3236d0ef-c82c-4a1e-bd58-1a7b4b0554d6
  event: PRL_AfterKillingBeast_02
  text: '{n}Складки на лбу Кунрада разглаживаются, его голос приобретает обычную обходительность.{/n} "Я вынужден остаться здесь, {name} — для безопасности Леди Теодоры я должен лично проконтролировать выполнение приказов. Надеюсь, вам не составит труда самостоятельно добраться до смотровой площадки — она расположена в конце этого коридора". {n}Мастер шепотов коротко откланивается.{/n}'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Складки на лбу Кунрада разглаживаются, его голос приобретает обычную обходительность.
  - speaker: NPC (по умолчанию)
    text_clean: Я вынужден остаться здесь, КЭП — для безопасности Леди Теодоры я должен лично проконтролировать выполнение приказов. Надеюсь, вам не составит труда самостоятельно добраться до смотровой площадки — она расположена в конце этого коридора.
  - speaker: narrator
    text_clean: Мастер шепотов коротко откланивается.
- guid: ef4aed7f-a832-408f-8892-f7a1e270cfee
  event: PRL_BeforeFinalBattle_01
  text: '{n}Эдельтрад, держащийся за багряную рану в груди, бросает на вас ненавидящий взгляд.{/n} "Предатель{mf||ница}... В минуту, когда нужны были все силы для решительного удара, ты остал{mf|ся|ась} в стороне! Только не утверждай, что {g|Encyclopedia:Vox}вокс{/g}-трансляции не достигли тебя!"'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад, держащийся за багряную рану в груди, бросает на вас ненавидящий взгляд.
  - speaker: Edelthrad
    text_clean: Предатель... В минуту, когда нужны были все силы для решительного удара, ты остался в стороне! Только не утверждай, что вокс-трансляции не достигли тебя!
- guid: a879a612-e07f-44f2-8c22-235d4f67873e
  event: PRL_BeforeFinalBattle_02
  text: '{n}Эдельтрад выглядит потрепанным, но целым. Взглянув на вас, он встревоженно переводит взгляд за вашу спину.{/n} "Ты здесь, {name}... но где же Лорд-капитан?"'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад выглядит потрепанным, но целым. Взглянув на вас, он встревоженно переводит взгляд за вашу спину.
  - speaker: Edelthrad
    text_clean: Ты здесь, КЭП... но где же Лорд-капитан?
