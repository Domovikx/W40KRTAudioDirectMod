  event: PRL_ToTheBridgeLate_01
  text: '"{d|Encyclopedia:Prologue_WentBack}Опоздали! Опоздали!{/d}" {n}Абеляр сокрушенно всплескивает руками.{/n} "Либо Эдельтрад и его люди вообще не добрались сюда — что еще хуже!"'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: Опоздали! Опоздали!
  - speaker: narrator
    text_clean: Абеляр сокрушенно всплескивает руками.
  - speaker: Abelard Werserian
    text_clean: Либо Эдельтрад и его люди вообще не добрались сюда — что еще хуже!
- guid: 6471bc28-0b21-4d08-80bb-646c178e4447
  event: PRL_ToTheBridgeLate_02
  text: '"Либо они дают бой на командном мостике", {n}Арджента сжимает оружие.{/n} "Без нас!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Либо они дают бой на командном мостике,
  - speaker: narrator
    text_clean: Арджента сжимает оружие.
  - speaker: Sister Argenta
    text_clean: Без нас!
- guid: e45bd0a0-c8aa-43f4-940f-fff0c360a31f
  event: PRL_ToTheBridgeLate_03
  text: '"Ваша светлость, простите, что отрываю..." {n}Офицер торопливо кланяется.{/n} "Люди спрашивают, что им делать? После того, как вы не бросили нас, подданные за вами и в огонь, и в воду..."'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ваша светлость, простите, что отрываю...
  - speaker: narrator
    text_clean: Офицер торопливо кланяется.
  - speaker: NPC (по умолчанию)
    text_clean: Люди спрашивают, что им делать? После того, как вы не бросили нас, подданные за вами и в огонь, и в воду...
- guid: e04a1d67-7c65-4856-8e26-7c4b198a45e3
  event: PRL_ToTheBridgeLate_04
  text: '"На мостик, немедленно! Если Эдельтрад там, значит, ему нужна помощь". {n}Абеляр поворачивается к вам.{/n} "Знаете, {name}, что меня действительно тревожит? Вокс-трансляции Лорд-капитана. Они не прекращаются, хотя Леди Теодоре сейчас самое место — на мостике, во главе контрудара... Неспокойно мне. А если Вольного Торговца осадили в собственных палатах? С вашего дозволения — давайте удостоверимся, что это не так. Мы можем воспользоваться тем же подъемником, к которым ушли Леди Теодора и Морт".'
  speaker: Abelard Werserian
  parts:
  - speaker: Abelard Werserian
    text_clean: На мостик, немедленно! Если Эдельтрад там, значит, ему нужна помощь.
  - speaker: narrator
    text_clean: Абеляр поворачивается к вам.
  - speaker: Abelard Werserian
    text_clean: Знаете, КЭП, что меня действительно тревожит? Вокс-трансляции Лорд-капитана. Они не прекращаются, хотя Леди Теодоре сейчас самое место — на мостике, во главе контрудара... Неспокойно мне. А если Вольного Торговца осадили в собственных палатах? С вашего дозволения — давайте удостоверимся, что это не так. Мы можем воспользоваться тем же подъемником, к которым ушли Леди Теодора и Морт.
- guid: 0e075bcc-e3d1-4ae5-8575-e2244404bab4
  event: PRL_ToTheBridge_01
  text: '{n}Эдельтрад фон Валанциус взирает на вас с нескрываемым изумлением — и трепетом.{/n} "{name}... не подводят ли меня мои глаза? Готов поклясться, что я только что видел, как ты {d|Encyclopedia:Prologue_WentThroughFire}прош{mf|ел|ла} сквозь столб пламени{/d}, ведя за собой остальных..."'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад фон Валанциус взирает на вас с нескрываемым изумлением — и трепетом.
  - speaker: Edelthrad
    text_clean: КЭП... не подводят ли меня мои глаза? Готов поклясться, что я только что видел, как ты {d|Encyclopedia:Prologue_WentThroughFire}прошел сквозь столб пламени{/d}, ведя за собой остальных...
- guid: 1876d007-d113-4488-adad-45fec2616170
  event: PRL_ToTheBridge_02
  text: '"Воистину, {name}". {n}Эдельтрад осеняет себя знамением {g|Encyclopedia:Aquila}аквилы{/g} и бросает на вас еще один взгляд — на этот раз обеспокоенный.{/n} "Твои раны..."'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Воистину, КЭП.
  - speaker: narrator
    text_clean: Эдельтрад осеняет себя знамением аквилы и бросает на вас еще один взгляд — на этот раз обеспокоенный.
  - speaker: Edelthrad
    text_clean: Твои раны...
- guid: 9e71b97e-872c-4441-bedb-e15953a26983
  event: PRL_ToTheBridge_03
  text: '"Я не ожидал, что ты сможешь добраться вовремя — в конце концов, бунт застал весь экипаж врасплох в разных концах судна... послушай, и все же — твои раны..."'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я не ожидал, что ты сможешь добраться вовремя — в конце концов, бунт застал весь экипаж врасплох в разных концах судна... послушай, и все же — твои раны...
- guid: 48349fde-3248-4885-b6cb-4c2020676443
  event: PRL_ToTheBridge_04
  text: '"Подобная горячность не доводит до добра... но {g|Encyclopedia:Emperor}Император{/g} благоволит к тебе". {n}Эдельтрад оглядывает вас еще раз.{/n} "И все же — твои раны внушают мне беспокойство".'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: Подобная горячность не доводит до добра... но Император благоволит к тебе.
  - speaker: narrator
    text_clean: Эдельтрад оглядывает вас еще раз.
  - speaker: Edelthrad
    text_clean: И все же — твои раны внушают мне беспокойство.
- guid: 44fa1078-c11b-435a-84ba-e21f7303f494
  event: PRL_ToTheBridge_05
  text: '{n}Эдельтрад примирительно поднимает руку.{/n} "Прости мою настойчивость. Не мне сомневаться в вере то{mf|го|й}, что прош{mf|ел|ла} крещение огнем".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад примирительно поднимает руку.
  - speaker: Edelthrad
    text_clean: Прости мою настойчивость. Не мне сомневаться в вере того, что прошел крещение огнем.
- guid: 768c0f74-9c7b-459a-a983-5004764bcd95
  event: PRL_ToTheBridge_06
  text: '{n}Эдельтрад кивает, удовлетворенный ответом.{/n} "Тогда — скрепим души. Впереди нас ждет главное испытание".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад кивает, удовлетворенный ответом.
  - speaker: Edelthrad
    text_clean: Тогда — скрепим души. Впереди нас ждет главное испытание.
- guid: 2548b94f-14b4-4685-a84d-7478cfd913b1
  event: PRL_ToTheBridge_07
  text: '{n}Эдельтрад высокомерно фыркает.{/n} "Не думаю, что ты можешь позволить себе подобную роскошь, но благодарю за откровенность — вряд ли я могу положиться на тебя в бою".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад высокомерно фыркает.
  - speaker: Edelthrad
    text_clean: Не думаю, что ты можешь позволить себе подобную роскошь, но благодарю за откровенность — вряд ли я могу положиться на тебя в бою.
- guid: 27db0291-3656-4741-8dc1-1307e89a9923
  event: PRL_ToTheBridge_08
  text: '"У этого лифта, господин Эдельтрад. Лорд-капитан в сопровождении архмилитанта направилась в свои покои за предметом необычайной важности. После этого мы получали только общие {g|Encyclopedia:Vox}вокс{/g}-трансляции".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: У этого лифта, господин Эдельтрад. Лорд-капитан в сопровождении архмилитанта направилась в свои покои за предметом необычайной важности. После этого мы получали только общие вокс-трансляции.
- guid: 2cd3326c-e9cf-41ab-a911-917057233dce
  event: PRL_ToTheBridge_09
  text: '"Я собрал всех, кто смог откликнуться на вокс-призыв и кто способен держать оружие в руках... но я не вижу Лорд-капитана и ее архмилитанта. Сообщения с ее голосом продолжают поступать в эфир, однако она не откликается на прямые запросы. Последний раз я видел Леди Теодору на смотровой — когда вы расстались с ней?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я собрал всех, кто смог откликнуться на вокс-призыв и кто способен держать оружие в руках... но я не вижу Лорд-капитана и ее архмилитанта. Сообщения с ее голосом продолжают поступать в эфир, однако она не откликается на прямые запросы. Последний раз я видел Леди Теодору на смотровой — когда вы расстались с ней?
- guid: 4ef84aaa-efc4-478b-b1c3-18fbd116d451
  event: PRL_ToTheBridge_10
  text: '"Нет, {name}". {n}Голос Абеляра сух, однако в нем сквозит искренняя обеспокоенность.{/n} "Не готовы, совершенно. Вы едва стоите на ногах после того, что произошло... нам лучше отправиться за Леди Теодорой и предоставить Эдельтраду дать бой Войгтвиру". {n}Что-то в голосе сенешаля заставляет вас думать, что в первую очередь Абеляр хочет убедиться в безопасности Вольного Торговца, а не вашей.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Нет, КЭП.
  - speaker: narrator
    text_clean: Голос Абеляра сух, однако в нем сквозит искренняя обеспокоенность.
  - speaker: NPC (по умолчанию)
    text_clean: Не готовы, совершенно. Вы едва стоите на ногах после того, что произошло... нам лучше отправиться за Леди Теодорой и предоставить Эдельтраду дать бой Войгтвиру.
  - speaker: narrator
    text_clean: Что-то в голосе сенешаля заставляет вас думать, что в первую очередь Абеляр хочет убедиться в безопасности Вольного Торговца, а не вашей.
- guid: 931d58c8-e03c-4ca9-8079-68911e9899d9
  event: PRL_ToTheBridge_11
  text: '"Это тревожные известия... и весьма не вовремя. Я получаю отрывочные сведения с мостика корабля — там замечен Кунрад Войгтвир, и даже скупые рапорты о его действиях воскрешают в моей памяти описания того, как выглядят ведьмовские ритуалы... если предатель Кунрад взялся за колдовство — нужно немедленно помешать ему".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Это тревожные известия... и весьма не вовремя. Я получаю отрывочные сведения с мостика корабля — там замечен Кунрад Войгтвир, и даже скупые рапорты о его действиях воскрешают в моей памяти описания того, как выглядят ведьмовские ритуалы... если предатель Кунрад взялся за колдовство — нужно немедленно помешать ему.
- guid: 27a2c209-8c1e-4da8-8549-4c4065725f05
  event: PRL_ToTheBridge_12
  text: '{n}Эдельтрад кивает.{/n} "Разумно. Возьми с собой свой отряд — вас могут поджидать по пути. Как только вы встретитесь с Лорд-капитаном — умоляйте ее отправляться на мостик и возглавить контратаку. Появление {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} вселит надежду в сердца защитников, сколь бы напуганы или усталы они ни были".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад кивает.
  - speaker: Edelthrad
    text_clean: Разумно. Возьми с собой свой отряд — вас могут поджидать по пути. Как только вы встретитесь с Лорд-капитаном — умоляйте ее отправляться на мостик и возглавить контратаку. Появление Вольного Торговца вселит надежду в сердца защитников, сколь бы напуганы или усталы они ни были.
- guid: 260347e6-a3a2-4be8-9e86-638aa9b91740
  event: PRL_ToTheBridge_13
  text: '"До встречи, {name}. Да благословит {g|Encyclopedia:Emperor}Император{/g} ваши деяния, и увидимся на поле боя". {n}Эдельтрад салютует вам оружием и поворачивается к своей свите.{/n}'
  speaker: Edelthrad
  parts:
  - speaker: Edelthrad
    text_clean: До встречи, КЭП. Да благословит Император ваши деяния, и увидимся на поле боя.
  - speaker: narrator
    text_clean: Эдельтрад салютует вам оружием и поворачивается к своей свите.
- guid: 2bda68a8-f2d9-429e-9610-7ff9ee5810ea
  event: PRL_ToTheBridge_14
  text: '{n}Псайкер скалится вам в ответ.{/n} "Видишь следы моего "благословения", {name}? Да, варп забирает свое... но я еще в трезвом уме и в силах держать оружие. Я буду биться за род фон Валанциус до конца — даже если мне это будет стоить вечного проклятия мутанта!"'
  speaker: Psyker (NPC)
  parts:
  - speaker: narrator
    text_clean: Псайкер скалится вам в ответ.
  - speaker: Psyker (NPC)
    text_clean: Видишь следы моего "благословения", КЭП? Да, варп забирает свое... но я еще в трезвом уме и в силах держать оружие. Я буду биться за род фон Валанциус до конца — даже если мне это будет стоить вечного проклятия мутанта!
- guid: efbfaf32-9763-41c2-a1b6-55ac180391c8
  event: PRL_WarrantSentinel_01
  text: '"Что-то забыл{mf||а}, {name}? Поторопись".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Что-то забыл, КЭП? Поторопись.
- guid: cd1f2d20-78a2-4dfa-9158-86279d3519ce
  event: PRL_WarrantSentinel_02
  text: '"...окое содержание едких гуморов. Объект в состоянии повышенного стресса. Вам нужна помощь?"

    {n}Вы не понимаете, откуда исходит этот тихий голос, напоминающий треск статики. От Стража? От когитатора? Появляется в вашем усталом сознании сам собой? Как бы то ни было, вы отчетливо слышите каждое слово.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...окое содержание едких гуморов. Объект в состоянии повышенного стресса. Вам нужна помощь?'
  - speaker: narrator
    text_clean: Вы не понимаете, откуда исходит этот тихий голос, напоминающий треск статики. От Стража? От когитатора? Появляется в вашем усталом сознании сам собой? Как бы то ни было, вы отчетливо слышите каждое слово.
- guid: a3f7f6df-78e1-46e7-8871-e0c8d90b6bc6
  event: PRL_WarrantSentinel_03
  text: '{n}Вы слышите голос вновь — и теперь отчетливо понимаете, что он льется из двух динамиков, вмонтированных в плечи Стража.{/n} "Генетический код распознан. Дитя династии фон Валанциус, требуется ли тебе помощь?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Вы слышите голос вновь — и теперь отчетливо понимаете, что он льется из двух динамиков, вмонтированных в плечи Стража.
  - speaker: NPC (по умолчанию)
    text_clean: Генетический код распознан. Дитя династии фон Валанциус, требуется ли тебе помощь?
- guid: 1ae93bb8-36de-45a5-bfda-93bf071d38a1
  event: PRL_WarrantSentinel_04
  text: '"Запрос взят в исполнение. Исполняю протокол защиты".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Запрос взят в исполнение. Исполняю протокол защиты.
- guid: 93eaeadd-6adb-47aa-af0d-45e37840a92d
  event: PRL_WarrantSentinel_05
  text: '{n}Скрип, который издает сервочереп, постепенно складывается в разборчивые слова:{/n} "...сопровождать дитя династии до безопасного места".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Скрип, который издает сервочереп, постепенно складывается в разборчивые слова:'
  - speaker: NPC (по умолчанию)
    text_clean: '...сопровождать дитя династии до безопасного места.'
- guid: 2c20fb71-fb44-404d-9743-d06fff3cfae6
  event: PRL_WarrantSentinel_06
  text: '"...передвижная единица Стража {g|Encyclopedia:Warrant}Патента{/g} для персонального сопровождения дитя династии и обеспечения связи с подданными Вольного Торговца. Передвижная единица готова к исполнению приказов".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...передвижная единица Стража Патента для персонального сопровождения дитя династии и обеспечения связи с подданными Вольного Торговца. Передвижная единица готова к исполнению приказов.'
- guid: 5354580b-ec0a-4e03-8073-73198ef1a07e
  event: PRL_WarrantSentinel_07
  text: '"...временное помрачение рассудка ввиду переживания острой стрессовой ситуации. Передвижная единица Стража {g|Encyclopedia:Warrant}Патента{/g} готова к исполнению приказов".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...временное помрачение рассудка ввиду переживания острой стрессовой ситуации. Передвижная единица Стража Патента готова к исполнению приказов.'
- guid: 107124fa-7890-4fbb-82dc-ebaa259733e4
  event: PRL_WarrantSentinel_08
  text: '"...частоты {g|Encyclopedia:Vox}вокс{/g}-передач нарушены, провожу настройку... осуществляю подключение..."'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...частоты вокс-передач нарушены, провожу настройку... осуществляю подключение...'
- guid: 64f05955-3b79-4022-b5ce-58d1fc990cdd
  event: PRL_WarrantSentinel_09
  text: '{n}Вместо механического скрежета из вокса сервочерепа начинает литься голос Теодоры фон Валанциус — нечеткий и прерываемый помехами, однако совершенно различимый.{/n} "Мастер вокса, восстановите связь со Святилищем Навигатора! Я пытаюсь связаться с мостиком... Если меня слышит кто-то на этой частоте — немедленно перегруппируйте имеющиеся силы и направляйтесь на верхние палубы! Повторяю: перегруппируйте имеющиеся силы и направляйтесь..."'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Вместо механического скрежета из вокса сервочерепа начинает литься голос Теодоры фон Валанциус — нечеткий и прерываемый помехами, однако совершенно различимый.
  - speaker: NPC (по умолчанию)
    text_clean: 'Мастер вокса, восстановите связь со Святилищем Навигатора! Я пытаюсь связаться с мостиком... Если меня слышит кто-то на этой частоте — немедленно перегруппируйте имеющиеся силы и направляйтесь на верхние палубы! Повторяю: перегруппируйте имеющиеся силы и направляйтесь...'
- guid: 4113c1e0-5f62-4e20-906d-d4b625862924
  event: PRL_WarrantSentinel_10
  text: '"...нарушены протоколы связи, оценка задержки сигнала недоступна. Установление двустороннего соединения невозможна".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...нарушены протоколы связи, оценка задержки сигнала недоступна. Установление двустороннего соединения невозможна.'
- guid: 40126079-351a-4b32-9fa8-1695f857d325
  event: PRL_WarrantSentinel_11
  text: '"...удаленность арсеналов от текущей дислокации. Начинаю ситуационные исчисления..." {n}Сервочереп умолкает, щелкая реле. Секунда проходит за секундой, и вы понимаете, что сервочереп вам не ответит.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...удаленность арсеналов от текущей дислокации. Начинаю ситуационные исчисления...'
  - speaker: narrator
    text_clean: Сервочереп умолкает, щелкая реле. Секунда проходит за секундой, и вы понимаете, что сервочереп вам не ответит.
- guid: bd651264-d8c5-4ba5-87c5-edcd1ca078ea
  event: PRL_WarrantSentinel_12
  text: '"...средние и верхние палубы. Допускаю вероятность безопасного размещения в местах скопления вооруженных единиц. Вычисляю..." {n}Сервочереп дергается и издает несколько щелчков.{/n} "Во избежание прорыва неавторизованных единиц в святилище Патента необходимо превентивно запечатать камеру. Мобильная единица приступит к исполнению указа сразу после обеспечения безопасности Патента".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: '...средние и верхние палубы. Допускаю вероятность безопасного размещения в местах скопления вооруженных единиц. Вычисляю...'
  - speaker: narrator
    text_clean: Сервочереп дергается и издает несколько щелчков.
  - speaker: NPC (по умолчанию)
    text_clean: Во избежание прорыва неавторизованных единиц в святилище Патента необходимо превентивно запечатать камеру. Мобильная единица приступит к исполнению указа сразу после обеспечения безопасности Патента.
- guid: 08a1f7fc-73fe-4c66-813d-910530337b60
  event: speaker_1_bark_Play
  text: '"Сюрприз, {mf|мерзкий ублюдок|мерзкая тварь}! Не ожидал{mf||а} такого поворота? Думал{mf||а}, можешь так просто сюда заявиться? Если ты там еще не подох{mf||ла} — ходи и оглядывайся, то ли еще будет!"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Сюрприз, мерзкий ублюдок! Не ожидал такого поворота? Думал, можешь так просто сюда заявиться? Если ты там еще не подох — ходи и оглядывайся, то ли еще будет!
- guid: bf208e0a-3a2a-42f8-91da-8a089f571dfe
  event: speaker_2_bark_Play
  text: '"Надеюсь, ты еще дышишь? Я намерен продлить твои страдания. Моли о пощаде так, как молили мои ребята, погибая от твоих проклятых ксеноигрушек!"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Надеюсь, ты еще дышишь? Я намерен продлить твои страдания. Моли о пощаде так, как молили мои ребята, погибая от твоих проклятых ксеноигрушек!
- guid: 3f216337-9555-432d-8b32-63b478e8b6e3
  event: speaker_3_bark_Play
  text: '"Видишь эти трупы? Хорошие парни и девки поплатились из-за моей ненасытности. И твоей лжи. Мы оба примем кару Императора, готовься!"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Видишь эти трупы? Хорошие парни и девки поплатились из-за моей ненасытности. И твоей лжи. Мы оба примем кару Императора, готовься!
- guid: acd970c0-4368-4d9e-8468-cd7280e84cfd
  event: speaker_4_bark_Play
  text: '"Будь ты проклят{mf||а}, Мерд''Ки! Будь проклят день, когда я с тобой связался! Сдохни от своего же товара, ксеноская тварь!"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Будь ты проклят, Мерд'Ки! Будь проклят день, когда я с тобой связался! Сдохни от своего же товара, ксеноская тварь!
