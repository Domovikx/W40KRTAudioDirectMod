  event: CH2_Dargonus_InquisitorTruth_19
  text: '{n}Вспышка отражающего поля останавливает ваш удар. Генератор щита должен быть настоящим техническим чудом, раз Лорд-инквизитор смог скрыть его под одеянием. Ксавьер Калькасар бросает на вас тяжелый взгляд.{/n} "Помните, я говорил, что готов закрывать глаза на некоторые вольности? Это была первая. И — последняя такого рода".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Вспышка отражающего поля останавливает ваш удар. Генератор щита должен быть настоящим техническим чудом, раз Лорд-инквизитор смог скрыть его под одеянием. Ксавьер Калькасар бросает на вас тяжелый взгляд.
  - speaker: NPC (по умолчанию)
    text_clean: Помните, я говорил, что готов закрывать глаза на некоторые вольности? Это была первая. И — последняя такого рода.
- guid: 756a2814-dfcb-4503-9bc1-72e7f9575997
  event: CH2_Dargonus_InquisitorTruth_20
  text: '"Заключать сделки — безусловно. Сотрудничать — до определенной степени. Но не дарить же населенные людьми миры. Вы бы хоть {g|Encyclopedia:Warrant}Патент{/g} свой изучили повнимательнее. Помните — мудрость {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} заключается в том, чтобы понимать: фраза "мне можно все" означает "мне можно почти все".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: 'Заключать сделки — безусловно. Сотрудничать — до определенной степени. Но не дарить же населенные людьми миры. Вы бы хоть Патент свой изучили повнимательнее. Помните — мудрость Вольного Торговца заключается в том, чтобы понимать: фраза "мне можно все" означает "мне можно почти все.'
- guid: e68a87f1-48ab-49ed-8d7e-8f7f8657a160
  event: CH2_Dargonus_InquisitorTruth_21
  text: '"Конечно. Господин ван Калокс выполнял мое задание, а также, после смерти Теодоры, приглядывал за вами от лица моей организации. Прискорбно, что теперь он не может сказать ни одного доброго слова про вашу персону". {n}Сожаление в голосе инквизитора почему-то звучит как угроза.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Конечно. Господин ван Калокс выполнял мое задание, а также, после смерти Теодоры, приглядывал за вами от лица моей организации. Прискорбно, что теперь он не может сказать ни одного доброго слова про вашу персону.
  - speaker: narrator
    text_clean: Сожаление в голосе инквизитора почему-то звучит как угроза.
