- guid: bf3dd933-3715-484b-80c0-fdb737ea38d1
  event: CH2_Dargonus_InquisitorTruth_116
  text: '"Вы правда считаете, что у меня есть время играть в ваши политические игры? С сожалением вынужден признать, что вы так до сих пор и не поняли, кто я такой и чем занимаюсь".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы правда считаете, что у меня есть время играть в ваши политические игры? С сожалением вынужден признать, что вы так до сих пор и не поняли, кто я такой и чем занимаюсь.
- guid: d6aac174-a8c1-4c1c-901b-39903a594365
  event: CH2_Dargonus_InquisitorTruth_117
  text: '"А вы полагаете, что слуги Инквизиции имеют обыкновение нарекать еретиками невинных? Какое прискорбное недоверие, я его запомню".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: А вы полагаете, что слуги Инквизиции имеют обыкновение нарекать еретиками невинных? Какое прискорбное недоверие, я его запомню.
- guid: f0d389c1-6332-4da3-b4f8-5e19f0e98359
  event: CH2_Dargonus_InquisitorTruth_118
  text: '"Либо у вас сильная интуиция, либо хорошая реакция на изменение ситуации. Я ценю оба эти качества".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Либо у вас сильная интуиция, либо хорошая реакция на изменение ситуации. Я ценю оба эти качества.
- guid: ea78db85-b960-406e-9d32-2f995187a501
  event: CH2_Dargonus_InquisitorTruth_119
  text: '"Ценю, что вы не пытаетесь увиливать и валить вину на других. С подобными людьми я могу иметь дело".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ценю, что вы не пытаетесь увиливать и валить вину на других. С подобными людьми я могу иметь дело.
- guid: f45c7781-21f5-48d4-b414-c1c49ef5a1ff
  event: CH2_Dargonus_InquisitorTruth_12
  text: '"Похвальная готовность к сотрудничеству. Вам это зачтется". {n}Колкий взгляд инквизитора упирается в вашу переносицу.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Похвальная готовность к сотрудничеству. Вам это зачтется.
  - speaker: narrator
    text_clean: Колкий взгляд инквизитора упирается в вашу переносицу.
- guid: c641e53a-8cfa-4c3d-badd-97385d876b26
  event: CH2_Dargonus_InquisitorTruth_120
  text: '"Инквизиции известно, что Вистенца Вьятт много лет назад подпала под влияние еретиков, проникших в ее свиту, и исповедует богохульные верования, нашептанные Архиврагом. Мы не первый год пристально следим за Вистенцой и готовы положить конец ее маленьким мерзостям, как только они перешагнут черту и станут представлять настоящую опасность".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Инквизиции известно, что Вистенца Вьятт много лет назад подпала под влияние еретиков, проникших в ее свиту, и исповедует богохульные верования, нашептанные Архиврагом. Мы не первый год пристально следим за Вистенцой и готовы положить конец ее маленьким мерзостям, как только они перешагнут черту и станут представлять настоящую опасность.
- guid: 3a385853-065f-414a-85b7-a9d8ed6ce197
  event: CH2_Dargonus_InquisitorTruth_121
  text: '"Я не исключаю, что Леди Теодора сожалела об утрате свободы, полнотой которой она обладала до моего вступления в чин. И не отрицаю, что начало оного сотрудничества было сопряжено с некоторыми... воздействиями с моей стороны".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я не исключаю, что Леди Теодора сожалела об утрате свободы, полнотой которой она обладала до моего вступления в чин. И не отрицаю, что начало оного сотрудничества было сопряжено с некоторыми... воздействиями с моей стороны.
- guid: c24e68a9-688b-4f15-9ac8-f744859264b5
  event: CH2_Dargonus_InquisitorTruth_122
  text: '{n}Калькасар бросает на вас острый взгляд.{/n} "Однако вы — не Леди Теодора. Пусть сложности, отягощавшие наши отношения, упокоятся с ней. Не советую вам забивать голову делами минувшего, не имеющими к вам никакого отношения. Теодора предпочла забыть об этом — последуйте ее примеру, и ваша судьба сложится хорошо".'
  speaker: null
  parts:
