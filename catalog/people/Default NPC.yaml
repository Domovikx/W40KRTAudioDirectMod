  event: CH2_Dargonus_InquisitorTruth_92
  text: '"Остроумный ход. Но всех повинных в небрежении в рядах {g|Encyclopedia:AdeptusMechanicus}Братства Марса{/g} я уже обнаружил и наказал. Сейчас я оцениваю деятельность вашей династии".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Остроумный ход. Но всех повинных в небрежении в рядах Братства Марса я уже обнаружил и наказал. Сейчас я оцениваю деятельность вашей династии.
- guid: 49a56a08-7510-468d-a047-3a3ee9c7c54f
  event: CH2_Dargonus_InquisitorTruth_93
  text: '"Рад слышать, что вы пересмотрели свои взгляды и осознали ошибки. Это не уменьшает долг, в котором вы находитесь перед Инквизицией, но внушает надежду, что долг этот закроете вы, а не ваш наследник".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Рад слышать, что вы пересмотрели свои взгляды и осознали ошибки. Это не уменьшает долг, в котором вы находитесь перед Инквизицией, но внушает надежду, что долг этот закроете вы, а не ваш наследник.
- guid: 75eb919a-227b-4d31-9cdb-908338820c85
  event: CH2_Dargonus_InquisitorTruth_94
  text: '{n}Голос инквизитора становится еще более вкрадчивым и тихим.{/n} "Опасное заблуждение. Возможно, вас это расстроит, но я буду вам указывать, какую богохульную мерзость вы имеете право уничтожить, а какую не посмеете тронуть и пальцем".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Голос инквизитора становится еще более вкрадчивым и тихим.
  - speaker: NPC (по умолчанию)
    text_clean: Опасное заблуждение. Возможно, вас это расстроит, но я буду вам указывать, какую богохульную мерзость вы имеете право уничтожить, а какую не посмеете тронуть и пальцем.
- guid: 62f1f80a-8d52-4b39-93c8-371a58ae405f
  event: CH2_Dargonus_InquisitorTruth_95
  text: '"Разве? Мы в ваших покоях, а не в исповедальной камере. Вы в полном здравии, к вам не применяются разнообразные интересные инструменты и методики, способствующие искренности. Уверяю, вы бы сразу поняли, если бы наша беседа превратилась в допрос".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Разве? Мы в ваших покоях, а не в исповедальной камере. Вы в полном здравии, к вам не применяются разнообразные интересные инструменты и методики, способствующие искренности. Уверяю, вы бы сразу поняли, если бы наша беседа превратилась в допрос.
- guid: 0739f433-c02e-4f01-8223-0037b697ce76
  event: CH2_Dargonus_InquisitorTruth_96
  text: '"О, я и так все знаю. Хотя вы и эффективно {d|Encyclopedia:Ch2_JanusVistenzaDead}избавились{/d} от всех свидетельств, способных указать на просчет династии фон Валанциус. Печально осознавать, что с попустительства Вольного Торговца к власти пришла еретичка, которая не один год пестовала свой культ".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: О, я и так все знаю. Хотя вы и эффективно избавились от всех свидетельств, способных указать на просчет династии фон Валанциус. Печально осознавать, что с попустительства Вольного Торговца к власти пришла еретичка, которая не один год пестовала свой культ.
- guid: 8660f492-a49d-4246-8a1b-531ee66ffcc2
  event: CH2_Dargonus_InquisitorTruth_97
  text: '{n}Заметив ваше промедление, инквизитор блекло усмехается.{/n} "Не утруждайте свою память. Моя война ведется на тайных фронтах, и боевые сводки с них тщательно фильтруются. Поверьте, вам не нужно знать, с чем мне приходится сталкиваться и какие меры приходится порой принимать. Это — опасное для разума знание".'
  speaker: null
  parts:
