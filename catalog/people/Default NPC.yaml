  event: CH2_Dargonus_InquisitorTruth_85
  text: '{n}Инквизитор не сдерживает усмешки.{/n} "А вы, значит, уже в компанию к святому Друзу метите? Амбициозно. Что же, буду иметь это в виду".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор не сдерживает усмешки.
  - speaker: NPC (по умолчанию)
    text_clean: А вы, значит, уже в компанию к святому Друзу метите? Амбициозно. Что же, буду иметь это в виду.
- guid: ecd19881-5a2b-444d-a2f4-93387fc9a678
  event: CH2_Dargonus_InquisitorTruth_86
  text: '"Осторожнее со словами, Вольный Торговец. Поверьте, если понадобится — я осужу. И если вам мои аргументы кажутся неубедительными, это решительно ничего не поменяет. Главное, чтобы они казались убедительными мне".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Осторожнее со словами, Вольный Торговец. Поверьте, если понадобится — я осужу. И если вам мои аргументы кажутся неубедительными, это решительно ничего не поменяет. Главное, чтобы они казались убедительными мне.
- guid: ba3b3232-babb-4b07-80ed-d2d36c9423e7
  event: CH2_Dargonus_InquisitorTruth_87
  text: '"На этом нам пора проститься. Шаттл уже ждет меня. Мне пора возвращаться к своему дозору, вам — спать..." {n}Лорд-инквизитор бросает взгляд на завозившегося церемониймейстера.{/n} "А вашему слуге — просыпаться. До встречи, {name}".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: На этом нам пора проститься. Шаттл уже ждет меня. Мне пора возвращаться к своему дозору, вам — спать...
  - speaker: narrator
    text_clean: Лорд-инквизитор бросает взгляд на завозившегося церемониймейстера.
  - speaker: NPC (по умолчанию)
