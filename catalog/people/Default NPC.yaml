- guid: 13b87c06-43c1-4734-be44-16f3a52e79de
  event: CH2_Dargonus_InquisitorTruth_23
  text: '"Вы делаете смелую ставку, {name}. Ставку на то, что интересность вашей персоны перевешивает ценность персоны господина ван Калокса в моих глазах. И на то, что я с годами не приобрел сентиментальной тяги мстить за своих людей. Что ж. Пока что ваше предположение верно".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы делаете смелую ставку, КЭП. Ставку на то, что интересность вашей персоны перевешивает ценность персоны господина ван Калокса в моих глазах. И на то, что я с годами не приобрел сентиментальной тяги мстить за своих людей. Что ж. Пока что ваше предположение верно.
- guid: 8baa92da-d163-497f-8d16-d01f291d518a
  event: CH2_Dargonus_InquisitorTruth_24
  text: '"Инквизиция в моем лице готова проявить экстраординарную лояльность к вашей персоне. Во имя нашего бесценного сотрудничества я закрою глаза на... мелкие вольности, которые вы, почтенный Вольный Торговец, позволяли себе или позволите в будущем".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
