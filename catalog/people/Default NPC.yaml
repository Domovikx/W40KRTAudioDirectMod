- guid: 5d9ce3dd-422b-4dfd-9b81-79b8c509e22e
  event: CH2_Dargonus_InquisitorTruth_133
  text: '"Известно ли вам о появлении подозрительного культа на Футфоле? Установлена прямая связь между этим явлением и началом поставок {d|Encyclopedia:Ch2_JanusChaosFood}зерна{/d} с вашей планеты. Расследование показало, что над зерном не был прочитан весь цикл молитв и литургий обработки. Без сомнения, в этом вина конкретных исполнителей, нарушающих священные ритуалы или даже занимающихся саботажем, не так ли? Но вина за этот недосмотр лежит на вашей династии, не так ли?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Известно ли вам о появлении подозрительного культа на Футфоле? Установлена прямая связь между этим явлением и началом поставок зерна с вашей планеты. Расследование показало, что над зерном не был прочитан весь цикл молитв и литургий обработки. Без сомнения, в этом вина конкретных исполнителей, нарушающих священные ритуалы или даже занимающихся саботажем, не так ли? Но вина за этот недосмотр лежит на вашей династии, не так ли?
