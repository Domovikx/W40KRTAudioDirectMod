  text: '{n}Глаза Эдельтрада расширяются.{/n} "Храни нас {g|Encyclopedia:Emperor}Бог-Император{/g}, Вольный Торговец... мертва?! Судно лишилось Лорд-капитана, а династия — своей главы..."'
