- guid: a1c44e5d-8622-42c5-ac0f-4f8c8554eb72
  event: PRL_BeforeFinalBattle_09
  text: '"Господин Эдельтрад... нет. Мы были неразлучны все время с момента, когда {name} освободил{mf|ся|ась} от козней Кунрада. Лорд-капитан пала от другой руки... и клянусь {g|Encyclopedia:GoldenThrone}Золотым Троном{/g}, я догадываюсь, от чьей!"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Господин Эдельтрад... нет. Мы были неразлучны все время с момента, когда КЭП освободился от козней Кунрада. Лорд-капитан пала от другой руки... и клянусь Золотым Троном, я догадываюсь, от чьей!
- guid: 350b6d8c-e741-45a6-b831-7c63c7ed2152
  event: PRL_BeforeFinalBattle_10
  text: '"Я не могу поручиться за твои поступки, {name} — ибо то, что произошло на офицерской палубе..." {n}Взгляд Ардженты смутен, она смотрит мимо вас.{/n}'
