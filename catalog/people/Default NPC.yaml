  event: PRL_BeforeFinalBattle_03
  text: '{n}Эдельтрад, держащийся за багряную рану в груди, бросает на вас измученный взгляд.{/n} "Подмога? Боюсь, {d|Encyclopedia:Prologue_WentBack}уже поздно{/d}, чтобы переломить ход событий. Но, если у тебя достанет чести, мы можем хотя бы с достоинством отдать свои жизни — за {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад, держащийся за багряную рану в груди, бросает на вас измученный взгляд.
  - speaker: Edelthrad
    text_clean: Подмога? Боюсь, уже поздно, чтобы переломить ход событий. Но, если у тебя достанет чести, мы можем хотя бы с достоинством отдать свои жизни — за Вольного Торговца.
- guid: 1f20bb7d-7b31-4bbd-b8bf-7037377a5bf4
  event: PRL_BeforeFinalBattle_04
  text: '{n}Эдель морщится, его перекошенное лицо искажается еще больше.{/n} "Я еще стою на ногах. И моих сил хватит на еще одно сражение. Одно волнует меня по настоящему — где Лорд-капитан?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Эдель морщится, его перекошенное лицо искажается еще больше.
