  event: PRL_EdgeOfDaybreak_09
  text: '{n}Образ сдувает незримыми ветрами колдовства — и вы видите Идиру, в чьих глазах то же пламя и древнее зло.{/n} "Твой облик запечатлен в гобеленах грядущего. Я — воля Ткача Судеб, и сегодня я сплету новую нить из прихотливых вероятностей и ускользающих шансов. Нить, что выведет тебя из пасти необратимости. Нить, что позволит тебе отыскать ключи к спасению. Нить, что приведет тебя и орудие нашего возрождения ко мне".'
