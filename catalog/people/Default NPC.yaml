  event: PRL_BeforeFinalBattle_26
  text: '"Что? Теодора... мертва?" {n}Кунрад взирает на вас в изумлении — кажется, искреннем.{/n} "Нет! Этого не могло произойти! Не сейчас! Я еще не успел..."'
