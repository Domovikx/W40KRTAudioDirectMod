  text: '{n}Эдельтрад издает разъяренный рев фанатика-безумца.{/n} "Я не буду гибнуть без дела рядом с {mf|тем|той}, кто предал{mf||а} свой род. Если последнее, чем я послужу Империуму — это разорву горло врагу Человечества... значит, на то воля Бога-Императора!"'
  speaker: Edelthrad
