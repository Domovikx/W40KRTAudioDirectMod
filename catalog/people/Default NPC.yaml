  text: '{n}Теодора несколько раз щелкает воксом.{/n} "Ретрансляторы не работают. Или выведены из строя. Либо варп играет с нами шутки, либо кто-то постарался оборвать связь на корабле. Мне нужно связаться с Главным {g|Encyclopedia:Enginseer}технопровидцем{/g} по выделенному каналу, прежде чем станет ясно, с чем именно мы столкнулись. В любом случае — держите оружие под рукой. Сомневаюсь, что оно нам больше не пригодится".'
