  event: PRL_OfficerReadyToTranslate_02
  text: '"Восстановить вокс-канал со Святилищем Навигатора. Подготовить персональный состав. Начать подготовку к трансляции в реальный мир!" {n}Абеляр медлит пару секунд, после чего поворачивается к вам.{/n} "{name}, назовите меня суеверным, но трансляция — не та вещь, которую хочется делать не по правилам. Вы — единственн{mf|ый|ая} представитель{mf||ница} династии фон Валанциус. Пускай вы и не Лорд-капитан, но вы более всех остальных заслуживаете занять ее место в предстоящем ритуале". {n}Абеляр указывает глазами вверх — на трон, красующийся на вершине высоких ступеней.{/n}'
