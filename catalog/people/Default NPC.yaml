  event: PRL_BeforeFinalBattle_17
  text: '"Хватит болтать почем зря! {g|Encyclopedia:Navigator}Навигатор{/g} жив и готов вывести корабль из варпа — если с мостика ему помогут!"'
  speaker: null
  parts:
