  event: PRL_BeforeFinalBattle_08
  text: '{n}{g|Encyclopedia:Psyker}Псайкер{/g} суживает глаза.{/n} "Я чувствую на тебе печать {g|Encyclopedia:Warp}варпа{/g}... {d|Encyclopedia:Prologue_WentWithTheodora}отголосок тех сил{/d}, что терзают корабль. Что это? Эхо ужасов, с которыми тебе пришлось столкнуться, или же признание вины?"'
