  event: PRL_EdgeOfDaybreak_07
  text: '{n}Теодора шипит — почти болезненно, словно ваши слова ранят ее.{/n} "Сопротивление неизбежному значит лишь одно — осознание и подчинение принесут больше боли. Против токов судьбы нет силы, способной изменить их".'
