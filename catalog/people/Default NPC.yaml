  event: PRL_BeforeFinalBattle_13
  text: '{n}Эдельтрад вздрагивает и хватается за плечо — на ваших глазах рукав его камзола лопается, и сквозь ткань пробивается два костяных нароста.{/n} "Что за ритуал ни творит там Кунрад... варп слишком силен, я не могу ему противостоять. Я чувствую, как меняется тело... как варп звенит в воздухе... Это конец. Мы сгинем в {g|Encyclopedia:Warp}варпе{/g}... вместе с {g|Encyclopedia:Warrant}Патентом{/g} и всеми наследниками династии. Враг Человечества торжествует победу".'
  speaker: Edelthrad
