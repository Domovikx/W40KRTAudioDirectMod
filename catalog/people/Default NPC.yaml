    text_clean: Эдельтрад издает разъяренный рев фанатика-безумца.
  - speaker: Edelthrad
    text_clean: Я не буду гибнуть без дела рядом с тем, кто предал свой род. Если последнее, чем я послужу Империуму — это разорву горло врагу Человечества... значит, на то воля Бога-Императора!
- guid: c7571803-1037-4d97-a9c1-3c58c1cf9428
  event: PRL_BeforeFinalBattle_25
  text: '{n}Эдельтрад склоняет голову. Затем вздыхает и смотрит на вас в упор — холодным, надменным взглядом фанатика.{/n} "Ритуал не будет завершен — я позабочусь об этом. А ты... позаботься о том, чтобы пустотный корабль вырвался из варпа. Позаботься о наших владениях. И прощай".'
  speaker: Edelthrad
  parts:
  - speaker: narrator
    text_clean: Эдельтрад склоняет голову. Затем вздыхает и смотрит на вас в упор — холодным, надменным взглядом фанатика.
  - speaker: Edelthrad
