  - speaker: NPC (по умолчанию)
    text_clean: Я есть начало и финал, а также все, что проистекает между ними. Я — глас Истины, которой суждено восторжествовать, ибо к этому триумфу ведут все хитросплетения лабиринтов рока.
- guid: 58c5bc71-03cf-4b18-a2a4-0cc16e9d2cb5
  event: PRL_EdgeOfDaybreak_02
  text: '"Ты пош{mf|ел|ла} наперекор чужой участи, чтобы украсть ее. Ты принял{mf||а} зов Истины Изначальной — чтобы завладеть иной судьбой. Да будет так. Я сплел нити судьбы и {d|Encyclopedia:Prologue_WentWithTheodora}протянул тебе руку{/d}, когда пламя воздвиглось на твоем пути. Ты принял{mf||а} ее и тем самым запечатал{mf||а} свою судьбу. В будущем... в будущем ты сполна отплатишь мне за эту милость".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ты пошел наперекор чужой участи, чтобы украсть ее. Ты принял зов Истины Изначальной — чтобы завладеть иной судьбой. Да будет так. Я сплел нити судьбы и протянул тебе руку, когда пламя воздвиглось на твоем пути. Ты принял ее и тем самым запечатал свою судьбу. В будущем... в будущем ты сполна отплатишь мне за эту милость.
- guid: 4f9231c5-3fdd-4803-bd03-4e87fb58d02f
  event: PRL_EdgeOfDaybreak_03
  text: '"Кто ты так{mf|ой|ая}, чтобы {d|Encyclopedia:Prologue_WentBack}перечить самой судьбе{/d} во имя чужих участей? Столько нитей, протянутых к другим созданиям твоего мира — жалкие, ничтожные связи, что можно смахнуть одним движением. Запутанный, небрежный, бессмысленный клубок".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Кто ты такой, чтобы перечить самой судьбе во имя чужих участей? Столько нитей, протянутых к другим созданиям твоего мира — жалкие, ничтожные связи, что можно смахнуть одним движением. Запутанный, небрежный, бессмысленный клубок.
- guid: 13b71db8-ba22-4067-8687-82a76fa0ca47
  event: PRL_EdgeOfDaybreak_04
  text: '"Смертн{mf|ый|ая}. Кто ты так{mf|ой|ая}, чтобы перечить самим токам рока?" {n}Видение опускает голову, не отрывая уничтожающего взгляда от вас. На мгновение в лице Теодоры что-то меняется — словно на него набегает... {d|Encyclopedia:Prologue_WentThroughFire}тень страха{/d}?{/n} "Неважно. Твои шаги — эхо песка, что пересыпается из одной чаши весов в другую. Твои чаяния и вера — моя насмешка".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Смертный. Кто ты такой, чтобы перечить самим токам рока?
  - speaker: narrator
    text_clean: Видение опускает голову, не отрывая уничтожающего взгляда от вас. На мгновение в лице Теодоры что-то меняется — словно на него набегает... тень страха?
  - speaker: NPC (по умолчанию)
    text_clean: Неважно. Твои шаги — эхо песка, что пересыпается из одной чаши весов в другую. Твои чаяния и вера — моя насмешка.
- guid: 8bad3e7b-edb8-4093-9fe0-34b9e8c85535
  event: PRL_EdgeOfDaybreak_05
  text: '"Воистину, ибо Истина всеобъемлюща и безбрежна. Лишь часть ее коснулась тебя — но ты откликнул{mf|ся|ась}. Ты можешь быть новым чемпионом".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Воистину, ибо Истина всеобъемлюща и безбрежна. Лишь часть ее коснулась тебя — но ты откликнулся. Ты можешь быть новым чемпионом.
- guid: 5c76b4b2-2db5-43ce-9a31-c564e15819ac
  event: PRL_EdgeOfDaybreak_06
  text: '{n}Теодора клекочет — кажется, под этим скрежещущим, разрывающим перепонки звуком подразумевается смех.{/n} "Веди за собой, смертн{mf|ый|ая}. Веди, убеждай, заставляй их вступить на твою дорожку. Судьба предначертана — тебе нужны будут последователи".'
  speaker: Theodora von Valancius
