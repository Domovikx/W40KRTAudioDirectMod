  text: '{n}Эдель прожигает вас взглядом еще несколько секунд.{/n} "Возможно. Видит {g|Encyclopedia:Emperor}Бог-Император{/g}, в рядах этого экипажа уже довольно скверны..."'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Эдель прожигает вас взглядом еще несколько секунд.
