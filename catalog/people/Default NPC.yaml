- guid: 86e00510-4bf1-478e-89d2-89fd7c86db96
  event: CH2_Dargonus_InquisitorTruth_88
  text: '"Грубо, Вольный Торговец. Очень грубо и неубедительно вы строите из себя легкомысленн{mf|ого|ую} дур{mf|ачка|очку}. Так вы не обманете и самого завалящего арбитра в Империуме. Старайтесь лучше".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Грубо, Вольный Торговец. Очень грубо и неубедительно вы строите из себя легкомысленного дурачка. Так вы не обманете и самого завалящего арбитра в Империуме. Старайтесь лучше.
- guid: d3aa69b5-dab5-473a-9f99-810ee5fbeaad
  event: CH2_Dargonus_InquisitorTruth_89
  text: '"По крайней мере вы не отрицаете очевидное. Это уже хорошее начало. Просто запомните, что, если вдруг пожелаете покаяться, я приму чистосердечное признание с тем же снисхождением, с которым принял эти ваши слова".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: По крайней мере вы не отрицаете очевидное. Это уже хорошее начало. Просто запомните, что, если вдруг пожелаете покаяться, я приму чистосердечное признание с тем же снисхождением, с которым принял эти ваши слова.
- guid: b66c638f-5866-4ce6-ab92-ef0510139108
  event: CH2_Dargonus_InquisitorTruth_90
  text: '"Похвальная мотивация, но никуда не годное исполнение. В следующий раз доверьте задачу трактовки своего долга перед Императором сотруднику Инквизиции подле вас. Иначе рискуете очень сильно задолжать".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Похвальная мотивация, но никуда не годное исполнение. В следующий раз доверьте задачу трактовки своего долга перед Императором сотруднику Инквизиции подле вас. Иначе рискуете очень сильно задолжать.
- guid: 91c0e308-e7ba-45c3-b871-ca99719009ca
  event: CH2_Dargonus_InquisitorTruth_91
  text: '"Вы считаете, что более компетентны в оценке угроз, чем я и господин ван Калокс? Это любопытное суждение". {n}Лорд-инквизитор как-то по-особенному смотрит на вас... без выражения смотрит.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы считаете, что более компетентны в оценке угроз, чем я и господин ван Калокс? Это любопытное суждение.
  - speaker: narrator
