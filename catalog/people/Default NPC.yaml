- guid: 45c3c217-7f44-406c-99a0-c183ece08dc1
  event: CH2_Dargonus_InquisitorTruth_25
  text: '"Места, затронутые Хаосом, надлежит предавать огню и оставлять в забвении. Кьяву Гамма стоило разбомбить до самого основания и объявить запретным миром. Но вы рассудили иначе и восстановили работу колонии. И даже не потрудились скрыть следы допущенного вашей династией небрежения. Ведь именно фон Валанциус предоставили Кубису Дельфиму столько свободы, что он впал в отступническую ересь. Чем вы руководствовались?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Места, затронутые Хаосом, надлежит предавать огню и оставлять в забвении. Кьяву Гамма стоило разбомбить до самого основания и объявить запретным миром. Но вы рассудили иначе и восстановили работу колонии. И даже не потрудились скрыть следы допущенного вашей династией небрежения. Ведь именно фон Валанциус предоставили Кубису Дельфиму столько свободы, что он впал в отступническую ересь. Чем вы руководствовались?
- guid: ce5102e4-394d-433e-a565-d257a4c63552
  event: CH2_Dargonus_InquisitorTruth_26
  text: '"Я не заключаю сделок и, упаси Император, не собираюсь отдавать вам распоряжения — это было бы покушением на ваши привилегии. Я лишь даю благожелательные рекомендации и рассчитываю, что в момент, когда Простору будет угрожать опасность, вы оторветесь от своих дел и прислушаетесь к ним".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я не заключаю сделок и, упаси Император, не собираюсь отдавать вам распоряжения — это было бы покушением на ваши привилегии. Я лишь даю благожелательные рекомендации и рассчитываю, что в момент, когда Простору будет угрожать опасность, вы оторветесь от своих дел и прислушаетесь к ним.
- guid: 50ff6b40-aaec-4c6f-acf4-865562647ab9
  event: CH2_Dargonus_InquisitorTruth_27
  text: '"И извлекала из этого огромную выгоду. Власть {g|Encyclopedia:Warrant}Патента{/g} не бесконечна, как и защита, даруемая им. Все эти таинственные экспедиции, сомнительные эксперименты, коллекционирование ксенотехнологических диковинок — опасные забавы. Чтобы предаваться им без последствий, мало иметь лишь разрешение {g|Encyclopedia:Emperor}Императора{/g}. Нужно еще, чтобы не рассердился я".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: И извлекала из этого огромную выгоду. Власть Патента не бесконечна, как и защита, даруемая им. Все эти таинственные экспедиции, сомнительные эксперименты, коллекционирование ксенотехнологических диковинок — опасные забавы. Чтобы предаваться им без последствий, мало иметь лишь разрешение Императора. Нужно еще, чтобы не рассердился я.
- guid: 28b4a2c9-373e-4927-99ca-0cf264acfd13
  event: CH2_Dargonus_InquisitorTruth_28
  text: '{n}Улыбка Лорд-инквизитора выглядит немного хищно.{/n} "Давайте я продемонстрирую, как это работает. В вашей свите находится не получившая санкции {g|Encyclopedia:HolyTerra}Терры{/g} {g|Encyclopedia:Psyker}псайкерша{/g}, что, как мы оба знаем, есть страшнейшая угроза и богохульство против законов {g|Encyclopedia:Imperium}Империума{/g}. Мне ведом этот секрет, но... я совсем не сержусь. И она живет дальше, полезная псайкерша Идира Тласс".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Улыбка Лорд-инквизитора выглядит немного хищно.
  - speaker: NPC (по умолчанию)
    text_clean: Давайте я продемонстрирую, как это работает. В вашей свите находится не получившая санкции Терры псайкерша, что, как мы оба знаем, есть страшнейшая угроза и богохульство против законов Империума. Мне ведом этот секрет, но... я совсем не сержусь. И она живет дальше, полезная псайкерша Идира Тласс.
- guid: d8d133c2-4218-4f57-a5dc-d2b22ba01859
  event: CH2_Dargonus_InquisitorTruth_29
  text: '"Вы бы этого хотели? А ты, Хейнрикс, хотел бы продолжить работу при достопочтенном Вольном Торговце?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы бы этого хотели? А ты, Хейнрикс, хотел бы продолжить работу при достопочтенном Вольном Торговце?
- guid: d83ba411-95d2-4763-88f1-e705b70895dd
  event: CH2_Dargonus_InquisitorTruth_30
  text: '"Ваш протекторат — это живое тело. И вы оставили в нем занозу, которая может нагноиться. Подумайте, к каким масштабным ампутациям это может привести в будущем".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ваш протекторат — это живое тело. И вы оставили в нем занозу, которая может нагноиться. Подумайте, к каким масштабным ампутациям это может привести в будущем.
- guid: 7457fdf7-5339-41d1-a7b3-e30054cde80e
  event: CH2_Dargonus_InquisitorTruth_31
  text: '"Я в нетерпении ожидаю, когда вы покажете мне свою розетту священной Инквизиции. Наверняка она у вас есть... Нет? Как странно. Мне казалось, что такие эксперименты в ведении моих почтенных коллег из Ордо Еретикус".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я в нетерпении ожидаю, когда вы покажете мне свою розетту священной Инквизиции. Наверняка она у вас есть... Нет? Как странно. Мне казалось, что такие эксперименты в ведении моих почтенных коллег из Ордо Еретикус.
- guid: 6ff18ff7-0d5e-40f9-9d06-59324c9ab7e8
  event: CH2_Dargonus_InquisitorTruth_32
  text: '"Думаете, маска безалаберного {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} защитит от обвинения в ереси? Ваша вера в то, что я являюсь неосведомленным идиотом, весьма прискорбна".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Думаете, маска безалаберного Вольного Торговца защитит от обвинения в ереси? Ваша вера в то, что я являюсь неосведомленным идиотом, весьма прискорбна.
- guid: 2bae2112-ad8d-497d-a94d-9713c45dc549
  event: CH2_Dargonus_InquisitorTruth_33
  text: '"Вы удивлены? Предполагали, что {g|Encyclopedia:Inquisition}Инквизиции{/g} неведомы обстоятельства ваших деяний? Часто у вас возникают мысли о том, что нам не стоит чего-то знать о вашей жизни?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы удивлены? Предполагали, что Инквизиции неведомы обстоятельства ваших деяний? Часто у вас возникают мысли о том, что нам не стоит чего-то знать о вашей жизни?
- guid: 7193a830-5503-4cd6-88f1-b7d14d6120ae
  event: CH2_Dargonus_InquisitorTruth_34
  text: '"В таком случае господин ван Калокс продолжит сопровождать вас. И мне будет спокойнее знать, что есть, кому о вас позаботиться". {n}Последняя реплика инквизитора звучит двусмысленно.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: В таком случае господин ван Калокс продолжит сопровождать вас. И мне будет спокойнее знать, что есть, кому о вас позаботиться.
  - speaker: narrator
    text_clean: Последняя реплика инквизитора звучит двусмысленно.
- guid: 9ba3ff01-ef95-4af8-8e72-7a77002d7696
  event: CH2_Dargonus_InquisitorTruth_35
  text: '{n}Хейнрикс официально кланяется вам.{/n} "Почту за честь сопровождать тебя, {name}".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Хейнрикс официально кланяется вам.
  - speaker: NPC (по умолчанию)
    text_clean: Почту за честь сопровождать тебя, КЭП.
- guid: 2c007ee5-a745-4601-abcf-97f6f94efd01
  event: CH2_Dargonus_InquisitorTruth_36
  text: '"В таком случае, господин ван Калокс будет отозван в мою свиту. У меня много работы для тебя, Хейнрикс".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: В таком случае, господин ван Калокс будет отозван в мою свиту. У меня много работы для тебя, Хейнрикс.
- guid: 2a352795-acf6-4058-8a4c-07098bd7796f
  event: CH2_Dargonus_InquisitorTruth_37
  text: '"Вы недолго у власти, вам простительно пока не замечать тревожных перемен. В {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g} распространяется культ Последнего восхода — не первая и не последняя ересь, поразившая сектор, но на удивление живучая. К системам Безбожных звезд проскальзывают таинственные конвои судов — банальная торговля с пиратами, не так ли? Но почему сами пираты об этом не в курсе?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы недолго у власти, вам простительно пока не замечать тревожных перемен. В Просторе Коронус распространяется культ Последнего восхода — не первая и не последняя ересь, поразившая сектор, но на удивление живучая. К системам Безбожных звезд проскальзывают таинственные конвои судов — банальная торговля с пиратами, не так ли? Но почему сами пираты об этом не в курсе?
- guid: 84fb02ca-a98b-4b68-9f63-bba02250d1b8
  event: CH2_Dargonus_InquisitorTruth_38
  text: '"{g|Encyclopedia:Xenos}Ксеносы{/g}, тревожившие сектор и раньше, в последние десятилетия активизировались, в их прежде хаотичных налетах видны логика и системность. Даже две стаи Космических волков, — благословенных {g|Encyclopedia:AdeptusAstartes}космодесантников{/g}, призванных моим именем — не умерили их интерес к Простору".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ксеносы, тревожившие сектор и раньше, в последние десятилетия активизировались, в их прежде хаотичных налетах видны логика и системность. Даже две стаи Космических волков, — благословенных космодесантников, призванных моим именем — не умерили их интерес к Простору.
- guid: cc24457b-b704-46c2-8be2-20adbc788642
  event: CH2_Dargonus_InquisitorTruth_39
  text: '{n}Символ на перстне черен, словно пустота.{/n} "Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Черный означает принадлежность к ближнему кругу. Любые ресурсы будут в вашем распоряжении".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Символ на перстне черен, словно пустота.
  - speaker: NPC (по умолчанию)
    text_clean: Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Черный означает принадлежность к ближнему кругу. Любые ресурсы будут в вашем распоряжении.
- guid: 842161a2-12ee-4928-bd92-1bc9fd1eb1c4
  event: CH2_Dargonus_InquisitorTruth_40
  text: '{n}Символ на перстне ал, как кровь праведников.{/n} "Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Алый означает, что вам довелось пролить кровь во благо Империума. Значит, и вы стоите того, чтобы за вас пролили кровь Его слуги".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Символ на перстне ал, как кровь праведников.
  - speaker: NPC (по умолчанию)
    text_clean: Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Алый означает, что вам довелось пролить кровь во благо Империума. Значит, и вы стоите того, чтобы за вас пролили кровь Его слуги.
- guid: ff367635-7675-4753-9989-d233d457ce88
  event: CH2_Dargonus_InquisitorTruth_41
  text: '{n}Символ на перстне бел, как волосы {g|Encyclopedia:AdeptaSororitas}Сестер Сороритас{/g}.{/n} "Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Белый — красивый, но уязвимый цвет. Его легко запятнать, и так же легко утратить оказанное нами доверие. Дорожите им".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Символ на перстне бел, как волосы Сестер Сороритас.
  - speaker: NPC (по умолчанию)
    text_clean: Цвет определяет степень близости подателя перстня к Лорд-инквизитору. Белый — красивый, но уязвимый цвет. Его легко запятнать, и так же легко утратить оказанное нами доверие. Дорожите им.
- guid: 1054a1a9-b9de-40f5-bdd2-d6986099e997
  event: CH2_Dargonus_InquisitorTruth_42
  text: '"Я бы сказал, что вашей династии стоило избавиться от нее раньше лет на десять. А если бы вы прождали еще пару лет, то делать это уже пришлось бы мне. Небрежность со временем может быть роковой, {name}".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я бы сказал, что вашей династии стоило избавиться от нее раньше лет на десять. А если бы вы прождали еще пару лет, то делать это уже пришлось бы мне. Небрежность со временем может быть роковой, КЭП.
- guid: 9d09928b-ca04-4a16-9e2f-a3d65359f62b
  event: CH2_Dargonus_InquisitorTruth_43
  text: '"С господином ван Калоксом мы разобрались. Перейдем к иным вашим деяниям".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: С господином ван Калоксом мы разобрались. Перейдем к иным вашим деяниям.
- guid: bf7b1e3f-d639-4eeb-9a1e-8a44a241b597
  event: CH2_Dargonus_InquisitorTruth_44
  text: '"Я не могу удовлетворить ваше любопытство, не нарушив секретность сведений. Скажу лишь следующее: мы держали ситуацию под контролем. В {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g} завязался столь плотный клубок опасных событий, что действовать в нем приходится с великими точностью и осторожностью, без права на ошибку".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: 'Я не могу удовлетворить ваше любопытство, не нарушив секретность сведений. Скажу лишь следующее: мы держали ситуацию под контролем. В Просторе Коронус завязался столь плотный клубок опасных событий, что действовать в нем приходится с великими точностью и осторожностью, без права на ошибку.'
- guid: 3ea03335-6627-42dd-8dd7-559af9d8048e
  event: CH2_Dargonus_InquisitorTruth_45
  text: '"Хорошо, что вы отдаете себе в этом отчет. Милость Императора велика, Он дает своим раскаивающимся слугам исправить их ошибки... порой".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Хорошо, что вы отдаете себе в этом отчет. Милость Императора велика, Он дает своим раскаивающимся слугам исправить их ошибки... порой.
- guid: 88329a89-3408-4d84-a3bc-873a06c31b6c
  event: CH2_Dargonus_InquisitorTruth_46
  text: '"Ксеносы, именуемые {g|Encyclopedia:Aeldari}эльдарами{/g}, обрели такое влияние на ваших легковерных подданных, что я поневоле задаюсь вопросом — кто сейчас в действительности правит Янусом? Я вынужден уведомить вас, что первое же свидетельство о дальнейшем расширении власти ксеносов в ваших владениях станет приговором для данной колонии".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ксеносы, именуемые эльдарами, обрели такое влияние на ваших легковерных подданных, что я поневоле задаюсь вопросом — кто сейчас в действительности правит Янусом? Я вынужден уведомить вас, что первое же свидетельство о дальнейшем расширении власти ксеносов в ваших владениях станет приговором для данной колонии.
- guid: 73d9ca78-7067-424d-82f3-e5ef506a4724
  event: CH2_Dargonus_InquisitorTruth_47
  text: '"Мое расположение имеет и иные формы".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Мое расположение имеет и иные формы.
- guid: 62a03dc0-03fa-4345-a07e-80507bfdf7e1
  event: CH2_Dargonus_InquisitorTruth_48
  text: '"Есть преступления, на которые нельзя закрывать глаза даже Вольным Торговцам. Помните об этом. Если Вистенца Вьятт окажется уличена в подобном проступке, вина за недосмотр за слугой будет лежать на вас".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Есть преступления, на которые нельзя закрывать глаза даже Вольным Торговцам. Помните об этом. Если Вистенца Вьятт окажется уличена в подобном проступке, вина за недосмотр за слугой будет лежать на вас.
- guid: e728eb78-32ad-400c-910c-e423ac276472
  event: CH2_Dargonus_InquisitorTruth_49
  text: '{n}Помолчав, инквизитор веско изрекает:{/n} "Надеюсь, вы были достаточно тщательны в этом вопросе. В противном случае вас ждет ответственность".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Помолчав, инквизитор веско изрекает:'
  - speaker: NPC (по умолчанию)
    text_clean: Надеюсь, вы были достаточно тщательны в этом вопросе. В противном случае вас ждет ответственность.
- guid: bde4776a-e8d5-40b9-896d-eb16b27d76df
  event: CH2_Dargonus_InquisitorTruth_50
  text: '{n}Инквизитор качает головой.{/n} "И перед каким трибуналом вы будете оспаривать мои полномочия?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор качает головой.
  - speaker: NPC (по умолчанию)
    text_clean: И перед каким трибуналом вы будете оспаривать мои полномочия?
- guid: e5a61fcc-763b-426a-a451-899decb877b3
  event: CH2_Dargonus_InquisitorTruth_51
  text: '"Я прослежу, чтобы он был возвращен на корабль. Прошу прощения, Ваша Светлость, но поручение Лорд-инквизитора не терпело промедления. Я вынужден был воспользоваться вашими ресурсами".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я прослежу, чтобы он был возвращен на корабль. Прошу прощения, Ваша Светлость, но поручение Лорд-инквизитора не терпело промедления. Я вынужден был воспользоваться вашими ресурсами.
- guid: c484f9a1-2812-41d3-8b43-4064e198da64
  event: CH2_Dargonus_InquisitorTruth_52
  text: '{n}Лорд-инквизитор одобрительно кивает.{/n} "Уже лучше. Вы больше не пытаетесь лгать. Кажется, наше общение выходит в правильное русло".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Лорд-инквизитор одобрительно кивает.
  - speaker: NPC (по умолчанию)
