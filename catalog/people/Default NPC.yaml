- guid: 5e295e8c-8f90-47e4-916e-289c15ca7e45
  event: CH2_Dargonus_InquisitorTruth_53
  text: '"И даже более того — из тени {d|Encyclopedia:Ch2_JanusEldarGovern}руководить{/d} самим миром. Думаете, это достойная участь для ваших собратьев по расе — стать невольниками в лапах ксеносов? Действительно ли вы полагаете, что они будут чтить условия какой бы то ни было сделки, заключенной с вами?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: И даже более того — из тени руководить самим миром. Думаете, это достойная участь для ваших собратьев по расе — стать невольниками в лапах ксеносов? Действительно ли вы полагаете, что они будут чтить условия какой бы то ни было сделки, заключенной с вами?
- guid: 9c463e7e-d5b5-4d89-9d47-d7ef60b50a71
  event: CH2_Dargonus_InquisitorTruth_54
  text: '"Ваших прегрешений более чем достаточно, чтобы предстать перед трибуналом Инквизиции. И, уверяю, если вы не сделаете выводов из моих слов, так однажды и случится... Но пока я готов проявить милость, что мне не слишком свойственно".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ваших прегрешений более чем достаточно, чтобы предстать перед трибуналом Инквизиции. И, уверяю, если вы не сделаете выводов из моих слов, так однажды и случится... Но пока я готов проявить милость, что мне не слишком свойственно.
- guid: cc0dc584-c3fa-4e62-a4a7-c33402af8697
  event: CH2_Dargonus_InquisitorTruth_55
  text: '"Помнится, ваши достойные аристократы поднесли вам много подарков. Было бы грубо не последовать их примеру".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Помнится, ваши достойные аристократы поднесли вам много подарков. Было бы грубо не последовать их примеру.
- guid: 850f4438-bab3-45ce-9f65-9cd3a0d2a74e
  event: CH2_Dargonus_InquisitorTruth_56
  text: '"Благочестиво ли было позволять затронутым {g|Encyclopedia:Warp}варпом{/g} пустотникам {d|Encyclopedia:Ch2_MutatedCrewRescued}присоединяться{/d} к экипажу вашего корабля? Тем самым, что служили на судне, превращенном в ловушку для вас Кунрадом Войгтвиром — может, и они являлись частью рассеянной им скверны?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Благочестиво ли было позволять затронутым варпом пустотникам присоединяться к экипажу вашего корабля? Тем самым, что служили на судне, превращенном в ловушку для вас Кунрадом Войгтвиром — может, и они являлись частью рассеянной им скверны?
- guid: f73c5bb1-18a3-4070-9ab1-d8df39432451
  event: CH2_Dargonus_InquisitorTruth_57
  text: '"Значит, вам придется делать это без желания, почтенн{mf|ый|ая} {name}. Похоже, вы так и не уловили важный нюанс — я не интересуюсь вашим мнением, а ставлю вас перед фактом. Когда на кону безопасность целого сектора, игра перестает быть игрой и становится войной. Считайте, что династия фон Валанциус... мобилизована мной по повелению {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Значит, вам придется делать это без желания, почтенный КЭП. Похоже, вы так и не уловили важный нюанс — я не интересуюсь вашим мнением, а ставлю вас перед фактом. Когда на кону безопасность целого сектора, игра перестает быть игрой и становится войной. Считайте, что династия фон Валанциус... мобилизована мной по повелению Золотого Трона.
- guid: d423e297-797d-4124-abb5-9b73fb1e9fa4
  event: CH2_Dargonus_InquisitorTruth_58
  text: '{n}Инквизитор смотрит на вас с интересом.{/n} "Вы мыслите в любопытном направлении, опасном, но любопытном. Рекомендую быть очень осторожн{mf|ым|ой}, если решите двинуться по нему дальше".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор смотрит на вас с интересом.
  - speaker: NPC (по умолчанию)
    text_clean: Вы мыслите в любопытном направлении, опасном, но любопытном. Рекомендую быть очень осторожным, если решите двинуться по нему дальше.
- guid: 18d1bf85-39f8-4a03-b29f-b883bdee77fc
  event: CH2_Dargonus_InquisitorTruth_59
  text: '{n}Инквизитор устало вздыхает.{/n} "Вы не даете мне забыть, что я имею дело с Вольным Торговцем. Хорошо, в знак доброй воли я также окажу вашему протекторату значимую поддержку. Но с этого момента я жду от вас ответного содействия".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор устало вздыхает.
  - speaker: NPC (по умолчанию)
    text_clean: Вы не даете мне забыть, что я имею дело с Вольным Торговцем. Хорошо, в знак доброй воли я также окажу вашему протекторату значимую поддержку. Но с этого момента я жду от вас ответного содействия.
- guid: 5c411f9c-1fa0-4b87-843d-68c75748d6b6
  event: CH2_Dargonus_InquisitorTruth_60
  text: '"Надеюсь, вы понимаете, что мы говорим не о судьбе какой-то колонии. Мне нет дела до одной планеты, сколь угодно прибыльной и многолюдной. Но если скверна вновь поднимет голову на Кьяве Гамма и попытается распространиться — я выжгу ее. А вы... На вас ляжет вина в преступном небрежении".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Надеюсь, вы понимаете, что мы говорим не о судьбе какой-то колонии. Мне нет дела до одной планеты, сколь угодно прибыльной и многолюдной. Но если скверна вновь поднимет голову на Кьяве Гамма и попытается распространиться — я выжгу ее. А вы... На вас ляжет вина в преступном небрежении.
- guid: 37c28d1d-ce81-418b-9ec3-56868befb2a3
  event: CH2_Dargonus_InquisitorTruth_61
  text: '"Рад слышать это, {name}. Ваша клятва услышана и внесена в протокол".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Рад слышать это, КЭП. Ваша клятва услышана и внесена в протокол.
- guid: d1167084-1006-44f8-80fc-92b4ac976ad6
  event: CH2_Dargonus_InquisitorTruth_62
  text: '"Вы же не пытаетесь умилостивить члена Инквизиции взяткой? Это был бы не слишком проницательный шаг".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы же не пытаетесь умилостивить члена Инквизиции взяткой? Это был бы не слишком проницательный шаг.
- guid: 39bb27ad-e112-4d1f-a6bb-fa100e24e7d5
  event: CH2_Dargonus_InquisitorTruth_63
  text: '"Если для безопасности этих владений я сочту необходимым казнить любое лицо и заменить его двойником-марионеткой, обратить в пепел его владения, предать смерти его слуг — я имею право так поступить. Потому что угрозы, от которых защищаю Простор я, экстраординарны и оправдывают самые жестокие меры. Добро пожаловать в мой мир, в котором слова "излишняя строгость" являются забавным оксюмороном".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Если для безопасности этих владений я сочту необходимым казнить любое лицо и заменить его двойником-марионеткой, обратить в пепел его владения, предать смерти его слуг — я имею право так поступить. Потому что угрозы, от которых защищаю Простор я, экстраординарны и оправдывают самые жестокие меры. Добро пожаловать в мой мир, в котором слова "излишняя строгость" являются забавным оксюмороном.
- guid: 6c95f324-4ee1-4f15-9ed1-fdf1c1c601d7
  event: CH2_Dargonus_InquisitorTruth_64
  text: '"Вы, кажется, желаете сравнить, чей статус более весом? Извольте". {n}Калькасар демонстрирует инквизиторскую розетту.{/n} "Своей властью и именем {g|Encyclopedia:HolyTerra}Терры{/g} я мобилизую династию фон Валанциус во имя защиты {g|Encyclopedia:KoronusExpanse}Простора Коронус{/g} от множественных угроз, как внешних, так и внутренних. {name} фон Валанциус, вам надлежит в готовности ожидать распоряжений Инквизиции и приступить к их исполнению немедленно по получении таковых. В случае ослушания вы будете объявлены предател{mf|ем|ьницей} Империума".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы, кажется, желаете сравнить, чей статус более весом? Извольте.
  - speaker: narrator
    text_clean: Калькасар демонстрирует инквизиторскую розетту.
  - speaker: NPC (по умолчанию)
    text_clean: Своей властью и именем Терры я мобилизую династию фон Валанциус во имя защиты Простора Коронус от множественных угроз, как внешних, так и внутренних. КЭП фон Валанциус, вам надлежит в готовности ожидать распоряжений Инквизиции и приступить к их исполнению немедленно по получении таковых. В случае ослушания вы будете объявлены предателем Империума.
- guid: ebfb6d36-d18b-4348-856c-2dcff255fdd9
  event: CH2_Dargonus_InquisitorTruth_66
  text: '"Что же, вы явно захотите обсудить это происшествие, {name}". {n}На лице Хейнрикса впервые за весь разговор появляются эмоции — ожидание неприятной беседы.{/n} "Но, полагаю, не сейчас — сейчас вам будет полезнее отдохнуть и осмыслить слова Лорд-инквизитора в одиночестве. Доброй ночи, Вольный Торговец".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Что же, вы явно захотите обсудить это происшествие, КЭП.
  - speaker: narrator
    text_clean: На лице Хейнрикса впервые за весь разговор появляются эмоции — ожидание неприятной беседы.
  - speaker: NPC (по умолчанию)
    text_clean: Но, полагаю, не сейчас — сейчас вам будет полезнее отдохнуть и осмыслить слова Лорд-инквизитора в одиночестве. Доброй ночи, Вольный Торговец.
- guid: 70cbef56-f522-4cdd-9244-66a85027ff47
  event: CH2_Dargonus_InquisitorTruth_67
  text: '"В свете того, что их агент теперь сопровождает вас, как член свиты, у многих могут возникнуть подозрения — не отреклась ли династия фон Валанциус от служения Империуму?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: В свете того, что их агент теперь сопровождает вас, как член свиты, у многих могут возникнуть подозрения — не отреклась ли династия фон Валанциус от служения Империуму?
- guid: e4619b4b-f8ba-471b-8e8c-b1aa07a67cb9
  event: CH2_Dargonus_InquisitorTruth_68
  text: '"Прощайте". {n}По лицу Хейнрикса невозможно прочитать, что он чувствует и чувствует ли хоть что-то.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Прощайте.
  - speaker: narrator
    text_clean: По лицу Хейнрикса невозможно прочитать, что он чувствует и чувствует ли хоть что-то.
- guid: daf7fa43-d0a6-47d2-8eeb-388ddd414898
  event: CH2_Dargonus_InquisitorTruth_69
  text: '"Могучий Эксплораторский флот, изучающий Простор не первое столетие, внезапно перестал отвечать на сообщения и погрузился в спор вокруг техноереси, почитавшейся мертвой уже пару веков. Династия Чорда всерьез взялась за мятежников — но своими жестокими действиями плодит бунтарей с той же скоростью, с которой казнит, и эта кровавая карусель полностью поглощает внимание почтенной Инцендии. Каллигос Винтерскейл внезапно утратил интерес к своим владениям и, кажется, интересуется лишь тем, как прикончить новую ксенотварь поопаснее".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Могучий Эксплораторский флот, изучающий Простор не первое столетие, внезапно перестал отвечать на сообщения и погрузился в спор вокруг техноереси, почитавшейся мертвой уже пару веков. Династия Чорда всерьез взялась за мятежников — но своими жестокими действиями плодит бунтарей с той же скоростью, с которой казнит, и эта кровавая карусель полностью поглощает внимание почтенной Инцендии. Каллигос Винтерскейл внезапно утратил интерес к своим владениям и, кажется, интересуется лишь тем, как прикончить новую ксенотварь поопаснее.
- guid: fa0cf062-43e3-4957-90ff-d600cd24c40b
  event: CH2_Dargonus_InquisitorTruth_70
  text: '{n}Инквизитор снимает с пальца перстень и протягивает вам. На нем начертан замысловатый личный герб.{/n} "Примите этот подарок в знак моего расположения. В трудный час отдайте его любому верному слуге Императора, и Инквизиция придет на помощь".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор снимает с пальца перстень и протягивает вам. На нем начертан замысловатый личный герб.
  - speaker: NPC (по умолчанию)
