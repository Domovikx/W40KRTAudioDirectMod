- guid: c6d2ac06-fa7b-43d0-ad71-6e96b4c334c1
  event: PRL_EdgeOfDaybreak_01
  text: '{n}Видение издает каркающий смешок.{/n} "Я есть начало и финал, а также все, что проистекает между ними. Я — глас Истины, которой суждено восторжествовать, ибо к этому триумфу ведут все хитросплетения лабиринтов рока".'
  speaker: null
  parts:
