- guid: a36c76a2-4a3c-47af-b396-1c9d45bcdb13
  event: BNTRS_PickUps _129
  text: '"Вольный Торговец не против культа, теперь и инквизитор... Видимо, это логово убийц теперь никак не прикрыть".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вольный Торговец не против культа, теперь и инквизитор... Видимо, это логово убийц теперь никак не прикрыть.
- guid: f63b4179-9c62-44e9-ba70-95fb54253e63
  event: CH2_CeremonyInquisitorCutscn_MasterOfCeremonies_01
  text: '"Покои приготовлены, Ваша Светлость".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Покои приготовлены, Ваша Светлость.
- guid: 4113c34c-2984-4fdd-8e79-ecea0c8abc63
  event: CH2_Dargonus_InquisitorTruth_01
  text: '{n}Человек, которого вы видели среди гостей, ожидает вас в ваших покоях с таким видом, словно и должен здесь быть. Он бросает на вас холодный взгляд — оценивающий, сверху вниз. Прежде лишь Теодора позволяла себе так смотреть на вас.{/n} "Нам есть о чем побеседовать, {name} фон Валанциус".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Человек, которого вы видели среди гостей, ожидает вас в ваших покоях с таким видом, словно и должен здесь быть. Он бросает на вас холодный взгляд — оценивающий, сверху вниз. Прежде лишь Теодора позволяла себе так смотреть на вас.
  - speaker: NPC (по умолчанию)
    text_clean: Нам есть о чем побеседовать, КЭП фон Валанциус.
- guid: f6cc591b-56d3-4a50-a548-16e4c5b17506
  event: CH2_Dargonus_InquisitorTruth_02
  text: '{n}Инквизитор смотрит на вас с интересом.{/n} "Это очень опасная игра, {name}. "Я использую меньшее зло, чтобы истребить большее, и я точно не проморгаю момент, когда меньшее зло под моей опекой превратится в великое" — так вы думали? Поверьте, любителям не стоит играть в подобные игры".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор смотрит на вас с интересом.
  - speaker: NPC (по умолчанию)
    text_clean: Это очень опасная игра, КЭП. "Я использую меньшее зло, чтобы истребить большее, и я точно не проморгаю момент, когда меньшее зло под моей опекой превратится в великое" — так вы думали? Поверьте, любителям не стоит играть в подобные игры.
- guid: 8a994317-e230-49bf-8f09-a9d8fd01b349
  event: CH2_Dargonus_InquisitorTruth_03
  text: '"Чем было продиктовано ваше решение {d|Encyclopedia:Ch2_JanusVistenzaAlive}оставить{/d} во главе планеты еретичку и слугу {g|Encyclopedia:Chaos}Архиврага{/g}?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Чем было продиктовано ваше решение оставить во главе планеты еретичку и слугу Архиврага?
- guid: f2fdabaa-a7bf-40bf-8a53-7584ed5a9eed
  event: CH2_Dargonus_InquisitorTruth_04
  text: '"Чем вы руководствовались, когда позволили {g|Encyclopedia:Xenos}ксеносам{/g}, врагам Человечества, {d|Encyclopedia:Ch2_JanusEldarAllies}жить{/d} и действовать на принадлежащей вам планете?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Чем вы руководствовались, когда позволили ксеносам, врагам Человечества, жить и действовать на принадлежащей вам планете?
- guid: 6acdc37c-629b-4990-982b-2d27e34a66d1
  event: CH2_Dargonus_InquisitorTruth_05
  text: '"Ну вот, теперь мы оба знаем, что я имею право приказывать. Когда на кону безопасность целого сектора, игра перестает быть игрой и становится войной. Надеюсь, эта маленькая демонстрация власти не нанесла значимого ущерба чувству вашего достоинства".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Ну вот, теперь мы оба знаем, что я имею право приказывать. Когда на кону безопасность целого сектора, игра перестает быть игрой и становится войной. Надеюсь, эта маленькая демонстрация власти не нанесла значимого ущерба чувству вашего достоинства.
- guid: 20548b10-9b41-4d83-9c9c-c5d7dd00423e
  event: CH2_Dargonus_InquisitorTruth_06
  text: '{n}Инквизитор поднимает бровь.{/n} "Вот как? Интересный ответ. Мы действительно не первый год пристально следим за Вистенцой и маленькими мерзостями, которые позволяют себе члены ее свиты. Следим и готовы положить им конец, как только они перешагнут черту и станут представлять настоящую опасность. Теперь это и ваша ответственность. Будьте бдительны".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор поднимает бровь.
  - speaker: NPC (по умолчанию)
    text_clean: Вот как? Интересный ответ. Мы действительно не первый год пристально следим за Вистенцой и маленькими мерзостями, которые позволяют себе члены ее свиты. Следим и готовы положить им конец, как только они перешагнут черту и станут представлять настоящую опасность. Теперь это и ваша ответственность. Будьте бдительны.
- guid: a29a32bc-470c-4ea1-959e-2229923f80e5
  event: CH2_Dargonus_InquisitorTruth_07
  text: '"Как любят говорить мои коллеги, невинность ничего не доказывает. Вы унаследовали не только славу и богатство Теодоры, но и ее ошибки".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Как любят говорить мои коллеги, невинность ничего не доказывает. Вы унаследовали не только славу и богатство Теодоры, но и ее ошибки.
- guid: a45be895-7f1d-4254-9bbf-91fc4c05832c
  event: CH2_Dargonus_InquisitorTruth_08
  text: '"Лорд-инквизитор Ксавьер Калькасар, глава конклава Коронус. Милостью {g|Encyclopedia:Emperor}Императора{/g}, я уполномочен надзирать за {g|Encyclopedia:KoronusExpanse}Простором Коронус{/g}, искоренять ереси и предупреждать угрозу {g|Encyclopedia:Xenos}ксеносов{/g}". {n}Породистое лицо и роскошная седеющая грива больше подходят аристократу, чем служителю пугающей {g|Encyclopedia:Inquisition}Инквизиции{/g}.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Лорд-инквизитор Ксавьер Калькасар, глава конклава Коронус. Милостью Императора, я уполномочен надзирать за Простором Коронус, искоренять ереси и предупреждать угрозу ксеносов.
  - speaker: narrator
    text_clean: Породистое лицо и роскошная седеющая грива больше подходят аристократу, чем служителю пугающей Инквизиции.
- guid: b05ca653-65bd-49bc-8b10-a8d4c160434b
  event: CH2_Dargonus_InquisitorTruth_09
  text: '"Вероятно". {n}Инквизитор пожимает плечами.{/n} "Если он не страдал от скрытых недугов, то в скором придет в себя, и его здоровье не понесет серьезного ущерба. В любом случае, пребывание в беспамятстве для него куда безопаснее, чем опасная привилегия быть свидетелем этой беседы".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вероятно.
  - speaker: narrator
    text_clean: Инквизитор пожимает плечами.
  - speaker: NPC (по умолчанию)
    text_clean: Если он не страдал от скрытых недугов, то в скором придет в себя, и его здоровье не понесет серьезного ущерба. В любом случае, пребывание в беспамятстве для него куда безопаснее, чем опасная привилегия быть свидетелем этой беседы.
- guid: afecf890-3b5b-4b61-b1c2-0f73e83ba3c0
  event: CH2_Dargonus_InquisitorTruth_10
  text: '"Мы воспользовались иными методами перемещения, чтобы нанести вам визит". {n}Хейнрикс взирает на вас с непроницаемым видом.{/n} "Заверяю, Вольный Торговец, что все ваши запоры и замки в полном порядке".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Мы воспользовались иными методами перемещения, чтобы нанести вам визит.
  - speaker: narrator
    text_clean: Хейнрикс взирает на вас с непроницаемым видом.
  - speaker: NPC (по умолчанию)
    text_clean: Заверяю, Вольный Торговец, что все ваши запоры и замки в полном порядке.
- guid: 991610e7-291e-4404-9557-9339d5ee283b
  event: CH2_Dargonus_InquisitorTruth_100
  text: '"Это моя работа — знать все. И я справляюсь с ней очень хорошо. Помните об этом, {name}".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Это моя работа — знать все. И я справляюсь с ней очень хорошо. Помните об этом, КЭП.
- guid: 56bd8155-af28-4880-ad10-06bcfb4d9f61
  event: CH2_Dargonus_InquisitorTruth_101
  text: '"Потому что вы не хотите знать, какова цена этой ошибки. И какие формы она может принять".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Потому что вы не хотите знать, какова цена этой ошибки. И какие формы она может принять.
- guid: e1823027-3e5c-4adb-b0c7-c072b67b35a1
  event: CH2_Dargonus_InquisitorTruth_102
  text: '"Инквизиции известно, что Вистенца Вьятт много лет назад подпала под влияние еретиков, проникших в ее свиту, и исповедует богохульные верования, нашептанные Архиврагом. Ваше решение не предпринимать мер по этому вопросу было напрасным. Что же, я приму их сам".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Инквизиции известно, что Вистенца Вьятт много лет назад подпала под влияние еретиков, проникших в ее свиту, и исповедует богохульные верования, нашептанные Архиврагом. Ваше решение не предпринимать мер по этому вопросу было напрасным. Что же, я приму их сам.
- guid: 65c50ec6-f626-49d3-8c3b-ac690640e8e9
  event: CH2_Dargonus_InquisitorTruth_103
  text: '"Уважаем{mf|ый|ая} госпо{mf|дин|жа} фон Валанциус, я не знаю, кто убедил вас, что Инквизиция не расстреливает идиотов. Но я заверяю вас, что это не так. Поэтому прошу вас, перестаньте изображать из себя идиот{mf|а|ку}. Не дай Император я поверю".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Уважаемый господин фон Валанциус, я не знаю, кто убедил вас, что Инквизиция не расстреливает идиотов. Но я заверяю вас, что это не так. Поэтому прошу вас, перестаньте изображать из себя идиота. Не дай Император я поверю.
- guid: 45595d8c-f3d1-467e-81bb-863d0efb9bb1
  event: CH2_Dargonus_InquisitorTruth_104
  text: '"Меня радует ваше смирение, {name}. Не сомневайтесь, что при разбирательстве вашего прискорбного промаха оно будет зачтено".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Меня радует ваше смирение, КЭП. Не сомневайтесь, что при разбирательстве вашего прискорбного промаха оно будет зачтено.
- guid: 21ecfcef-769b-4356-97e4-bef27ffbf22f
  event: CH2_Dargonus_InquisitorTruth_105
  text: '{n}Калькасар предупреждающе поднимает руку.{/n} "И прошу, не утомляйте меня пояснениями, что он "не погиб, а пропал без вести". Молчание Хейнрикса говорит о том, что он либо мертв, либо в плену — что тоже означает, что он уже мертв. А значит, возвращает нас к моему вопросу — как же так вышло?"'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Калькасар предупреждающе поднимает руку.
  - speaker: NPC (по умолчанию)
    text_clean: И прошу, не утомляйте меня пояснениями, что он "не погиб, а пропал без вести". Молчание Хейнрикса говорит о том, что он либо мертв, либо в плену — что тоже означает, что он уже мертв. А значит, возвращает нас к моему вопросу — как же так вышло?
- guid: 0b06e5b8-d2d1-4c75-82b1-be4875cdd1b1
  event: CH2_Dargonus_InquisitorTruth_106
  text: '{n}Глаза инквизитора стекленеют.{/n} "Вы... что сделали? Мы говорим не о пистолете, автопере или чувстве стыда. Мы говорим о дознавателе Инквизиции. Моем агенте. Нельзя "потерять" моего агента... без последствий".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Глаза инквизитора стекленеют.
  - speaker: NPC (по умолчанию)
    text_clean: Вы... что сделали? Мы говорим не о пистолете, автопере или чувстве стыда. Мы говорим о дознавателе Инквизиции. Моем агенте. Нельзя "потерять" моего агента... без последствий.
- guid: aee84d00-3b1f-401f-bec4-eb3f39898bce
  event: CH2_Dargonus_InquisitorTruth_107
  text: '"Будьте осторожнее с пустыми угрозами". {n}Марево отражающего поля окружает фигуру Лорд-инквизитора. Ксавьер Калькасар бросает на вас тяжелый взгляд.{/n} "Помните, я говорил, что готов закрывать глаза на некоторые вольности? Это была первая. И — последняя такого рода".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Будьте осторожнее с пустыми угрозами.
  - speaker: narrator
    text_clean: Марево отражающего поля окружает фигуру Лорд-инквизитора. Ксавьер Калькасар бросает на вас тяжелый взгляд.
  - speaker: NPC (по умолчанию)
    text_clean: Помните, я говорил, что готов закрывать глаза на некоторые вольности? Это была первая. И — последняя такого рода.
- guid: 1819c0fa-d98e-4874-8936-3c6f6a3755bd
  event: CH2_Dargonus_InquisitorTruth_108
  text: '"Вы — слишком значимая фигура, чтобы не влиять на мои планы в секторе. А значит, вы — либо мой союзник, либо враг. Предпочитаю думать, что все таки первое, так что мы еще увидимся. Постарайтесь свыкнуться с этой мыслью".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Вы — слишком значимая фигура, чтобы не влиять на мои планы в секторе. А значит, вы — либо мой союзник, либо враг. Предпочитаю думать, что все таки первое, так что мы еще увидимся. Постарайтесь свыкнуться с этой мыслью.
- guid: aebe381c-01f9-4b25-9454-895b71834b21
  event: CH2_Dargonus_InquisitorTruth_109
  text: '{n}Инквизитор достает из-за пояса широкий кинжал с выгравированными вдоль лезвия литаниями и протягивает позолоченной рукоятью вперед.{/n} "Этот подарок — знак, что ваше рвение не осталось незамеченным. Если оно не угаснет и в будущем, то однажды этот кинжал переплавят в вашу инквизиторскую розетту. Такова традиция нашего конклава".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Инквизитор достает из-за пояса широкий кинжал с выгравированными вдоль лезвия литаниями и протягивает позолоченной рукоятью вперед.
  - speaker: NPC (по умолчанию)
    text_clean: Этот подарок — знак, что ваше рвение не осталось незамеченным. Если оно не угаснет и в будущем, то однажды этот кинжал переплавят в вашу инквизиторскую розетту. Такова традиция нашего конклава.
- guid: 5162ea4b-8c9c-4b45-93b0-c7edb21e7296
  event: CH2_Dargonus_InquisitorTruth_11
  text: '"Полагаете?" {n}Инквизитор слегка улыбается, но без какого-либо намека на теплоту.{/n} "Я прекрасно осознаю, что делаю — я расставляю акценты в нашем общении. Напоминаю, что недреманное око {g|Encyclopedia:Imperium}Империума{/g} следит за вами даже в вашей спальне. И не только око, но и чуткие руки Империума — в моем лице и лице моих помощников".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Полагаете?
  - speaker: narrator
    text_clean: Инквизитор слегка улыбается, но без какого-либо намека на теплоту.
  - speaker: NPC (по умолчанию)
    text_clean: Я прекрасно осознаю, что делаю — я расставляю акценты в нашем общении. Напоминаю, что недреманное око Империума следит за вами даже в вашей спальне. И не только око, но и чуткие руки Империума — в моем лице и лице моих помощников.
- guid: c8bc4004-0e7b-4750-bb20-d86e8b52bb56
  event: CH2_Dargonus_InquisitorTruth_111
  text: '"{name}?" {n}Хейнрикс смотрит на вас с тревогой во взгляде.{/n} "Полагаю, теперь ты понимаешь, о чем я предупреждал тебя. Молю Трон, что понимаешь и то, почему я не мог рассказать тебе все".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: КЭП?
  - speaker: narrator
    text_clean: Хейнрикс смотрит на вас с тревогой во взгляде.
  - speaker: NPC (по умолчанию)
    text_clean: Полагаю, теперь ты понимаешь, о чем я предупреждал тебя. Молю Трон, что понимаешь и то, почему я не мог рассказать тебе все.
- guid: a4b7ed60-f7fc-4bef-9890-9ee8152121cf
  event: CH2_Dargonus_InquisitorTruth_112
  text: '{n}Хейнрикс переводит дух и кивает. В уголках его губ появляется намек на мягкую улыбку.{/n} "Сегодня у тебя был тяжелый день, {name}. Я оставлю тебя, чтобы ты могла выспаться — утром тебя будет ждать протекторат и твои подданные. Доброй ночи, {name}".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: Хейнрикс переводит дух и кивает. В уголках его губ появляется намек на мягкую улыбку.
  - speaker: NPC (по умолчанию)
    text_clean: Сегодня у тебя был тяжелый день, КЭП. Я оставлю тебя, чтобы ты могла выспаться — утром тебя будет ждать протекторат и твои подданные. Доброй ночи, КЭП.
