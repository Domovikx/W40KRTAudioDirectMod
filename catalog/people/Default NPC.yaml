  event: PRL_EdgeOfDaybreak_08
  text: '{n}В голове начинает мутиться, а по вашим щекам скользят тягучие капли. Вы моргаете — и вот перед вами уже не Теодора, а предатель Кунрад, столь же зыбкий и мимолетный, как и предыдущий образ. Из его уст сочится тот же ужасающий глас.{/n} "Претендент обещал вернуться с трофеем — реликвией, что может послужить Пределу рассвета. Судьба была предначертана, шаги — определены. И все же... ты нарушил{mf||а} нерушимое, заняв место претендента. Я вижу тебя — в день, когда последний восход воздвигнется над железным миром. Я вижу тебя подле себя в день, когда я воскресну".'
