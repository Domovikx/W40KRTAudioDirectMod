- guid: 8c3a5093-5d4e-45b7-99bb-59328c2a8fda
  event: CH2_Dargonus_InquisitorTruth_71
  text: '"Повлияла? Как интересно вы валите все на госпожу Вьятт, а себя выставляете жертвой".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Повлияла? Как интересно вы валите все на госпожу Вьятт, а себя выставляете жертвой.
- guid: a8a1b303-cf60-422a-8315-a2ca7decc619
  event: CH2_Dargonus_InquisitorTruth_72
  text: '"Какого рода {d|Encyclopedia:Ch2_BottomlessPitDarkness}жертвы{/d} вы приносили ксеноаномалии, принявшей формы бездонной пропасти и являвшей вам свои богохульные видения? Или вы предполагали, что это тоже тайна?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Какого рода жертвы вы приносили ксеноаномалии, принявшей формы бездонной пропасти и являвшей вам свои богохульные видения? Или вы предполагали, что это тоже тайна?
- guid: 3887eed7-a6c7-4500-b074-6065324513ed
  event: CH2_Dargonus_InquisitorTruth_73
  text: '{n}Помолчав, инквизитор тяжело произносит:{/n} "Не сегодня, но так мы и поступим. Пока мы попробуем обернуть ваше промедление к нашей пользе. Впереди нас ждут непростые времена, и оружие, которое способно производить данная планета, не будет лишним. Но помните, что это — лишь отсрочка приговора".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Помолчав, инквизитор тяжело произносит:'
  - speaker: NPC (по умолчанию)
