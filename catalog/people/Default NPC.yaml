- guid: 9b12cf00-33e1-4676-8051-437ccad37f14
  event: CH2_Dargonus_InquisitorTruth_74
  text: '"Я исполню любой приказ, Лорд-инквизитор. Если вы повелите мне продолжить сопровождать наследни{mf|ка|цу} династии фон Валанциус, я не буду опечален".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Я исполню любой приказ, Лорд-инквизитор. Если вы повелите мне продолжить сопровождать наследника династии фон Валанциус, я не буду опечален.
- guid: 6d1af5c7-16f4-46e9-a36e-831add9a03b6
  event: CH2_Dargonus_InquisitorTruth_75
  text: '"В знак серьезности надежд, которые я питаю на ваш счет, я могу выделить в сопровождение вам Хейнрикса. Он — мой лучший агент, и я не стал бы предлагать его компанию никому, кроме самого доверенного союзника".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: В знак серьезности надежд, которые я питаю на ваш счет, я могу выделить в сопровождение вам Хейнрикса. Он — мой лучший агент, и я не стал бы предлагать его компанию никому, кроме самого доверенного союзника.
- guid: 8a645b97-6f75-47b5-a039-c9fb7f53d328
  event: CH2_Dargonus_InquisitorTruth_76
  text: '"Надеюсь, вы оцените щедрость этого предложения, как оценила в свое время ваша предшественница".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Надеюсь, вы оцените щедрость этого предложения, как оценила в свое время ваша предшественница.
- guid: a8bbff00-c8ae-49a9-ac54-cade02748315
  event: CH2_Dargonus_InquisitorTruth_77
  text: '"Да-да, ваша с ними вражда общеизвестна... Но можно посмотреть на нее иначе. На Веабос-6 вы встретились с архонтом могучего кабала — чье присутствие там уже само по себе странно, — и выжили. Впоследствии вы неоднократно сталкивались с ее ближайшими прихвостнями — и вновь уцелели. Ваша столица пала жертвой коварной атаки, но и тут кинжалы убийц разминулись с вашим сердцем".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Да-да, ваша с ними вражда общеизвестна... Но можно посмотреть на нее иначе. На Веабос-6 вы встретились с архонтом могучего кабала — чье присутствие там уже само по себе странно, — и выжили. Впоследствии вы неоднократно сталкивались с ее ближайшими прихвостнями — и вновь уцелели. Ваша столица пала жертвой коварной атаки, но и тут кинжалы убийц разминулись с вашим сердцем.
- guid: b34f2cfb-7a62-4f7c-910e-c3c67cd89966
  event: CH2_Dargonus_InquisitorTruth_78
  text: '"Без сомнения. Господин ван Калокс заслужил мое полное доверие, неоднократно проявив отвагу, преданность и смекалку. Его математический, не склонный к сантиментам ум очень полезен в экстренных ситуациях. Из тебя, дорогой Хейнрикс, получился куда лучший агент, чем вышел бы пилот Имперского Рыцаря".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Без сомнения. Господин ван Калокс заслужил мое полное доверие, неоднократно проявив отвагу, преданность и смекалку. Его математический, не склонный к сантиментам ум очень полезен в экстренных ситуациях. Из тебя, дорогой Хейнрикс, получился куда лучший агент, чем вышел бы пилот Имперского Рыцаря.
- guid: 47dfd4f0-b2d4-4fb6-8606-936c5d117bc9
  event: CH2_Dargonus_InquisitorTruth_79
  text: '"А третий и последний Вольный Торговец внезапно гибнет в результате предательского удара собственного Мастера шепотов. Простор стремительно остается без защитников в тот самый момент, когда сообщение с Империумом прервано разбушевавшимся варпом. Фактически, он может рассчитывать лишь на меня... и на вас, если вы будете следовать моим инструкциям".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: А третий и последний Вольный Торговец внезапно гибнет в результате предательского удара собственного Мастера шепотов. Простор стремительно остается без защитников в тот самый момент, когда сообщение с Империумом прервано разбушевавшимся варпом. Фактически, он может рассчитывать лишь на меня... и на вас, если вы будете следовать моим инструкциям.
- guid: 608db193-b1ac-4108-aae0-3d131419e5d6
  event: CH2_Dargonus_InquisitorTruth_80
  text: '"Среди недавних ваших свершений выделяются подавление мятежа на Янусе, схватка со слугами {g|Encyclopedia:Chaos}Архиврага{/g} на Кьяве Гамма и, конечно, особый интерес, питаемый к вам {g|Encyclopedia:Drukhari}друкари{/g}. Их и обсудим". {n}Произнеся это, инквизитор бросает на вас внимательный взгляд исподлобья — словно игрок в {g|Encyclopedia:Regicide}регицид{/g}, сделавший первый ход и наблюдающий за реакцией оппонента.{/n}'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Среди недавних ваших свершений выделяются подавление мятежа на Янусе, схватка со слугами Архиврага на Кьяве Гамма и, конечно, особый интерес, питаемый к вам друкари. Их и обсудим.
  - speaker: narrator
    text_clean: Произнеся это, инквизитор бросает на вас внимательный взгляд исподлобья — словно игрок в регицид, сделавший первый ход и наблюдающий за реакцией оппонента.
- guid: 50f4ed64-1f87-449d-9bf3-d788ea3ac290
  event: CH2_Dargonus_InquisitorTruth_81
  text: '"В таком случае мы достигли консенсуса, чему я весьма рад".'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: В таком случае мы достигли консенсуса, чему я весьма рад.
- guid: ab010ba7-4a99-4588-9611-1d7bf275104f
  event: CH2_Dargonus_InquisitorTruth_82
  text: '"Отнюдь, дорог{mf|ой|ая} {name}. Вопросов множество. Как вышло, что вам удалось уцелеть в схватке, в которой погибла Теодора, многократно более опытная и умелая? Является ли совпадением, что именно вам — единственно{mf|му|й} — удалось после этого вырваться из ловушки на Райкаде Минорис? Сколько правды в слухах еретика Кунрада Войгтвира, распространяемых о вас?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Отнюдь, дорогой КЭП. Вопросов множество. Как вышло, что вам удалось уцелеть в схватке, в которой погибла Теодора, многократно более опытная и умелая? Является ли совпадением, что именно вам — единственному — удалось после этого вырваться из ловушки на Райкаде Минорис? Сколько правды в слухах еретика Кунрада Войгтвира, распространяемых о вас?
- guid: 83a966ea-55f6-453a-9b5d-beecb1a4c027
  event: CH2_Dargonus_InquisitorTruth_83
  text: '"Удивительное везение — быть персональным врагом столь влиятельного ксеноса, столько раз подвергнуться ее атакам, но остаться в живых. Настолько удивительное, что поневоле задумаешься — а не разыгрывают ли для тебя спектакль? И не являются ли все эти зрелищные мясорубки своеобразным алиби, призванным раз и навсегда зарекомендовать вас как врага ксеносов, но никоим образом не союзника или даже агента?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
    text_clean: Удивительное везение — быть персональным врагом столь влиятельного ксеноса, столько раз подвергнуться ее атакам, но остаться в живых. Настолько удивительное, что поневоле задумаешься — а не разыгрывают ли для тебя спектакль? И не являются ли все эти зрелищные мясорубки своеобразным алиби, призванным раз и навсегда зарекомендовать вас как врага ксеносов, но никоим образом не союзника или даже агента?
- guid: 79ee8ab5-d7cd-4598-8e82-cdf42ddeee01
  event: CH2_Dargonus_InquisitorTruth_84
  text: '{n}Калькасар умолкает, словно дает понять, что обсуждение данной темы закончено, а затем вкрадчиво, словно невзначай, интересуется:{/n} "Ну а машину-то вы зачем сломали? Столько важных разведданных было утрачено... В донесении господина ван Калокса значится, что он ясно дал вам понять, насколько они ценны, и однозначно потребовал не вмешиваться в расследование".'
  speaker: null
  parts:
  - speaker: narrator
    text_clean: 'Калькасар умолкает, словно дает понять, что обсуждение данной темы закончено, а затем вкрадчиво, словно невзначай, интересуется:'
  - speaker: NPC (по умолчанию)
