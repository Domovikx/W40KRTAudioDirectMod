  text: '{n}Перед глазами проносятся смазанные картины еще неизвестного вам будущего. Вспышка алого... пурпурного... словно калейдоскоп, картины сменяют друг друга в бешеном ритме, не позволяя даже разглядеть себя. Сквозь марево на вас смотрит искаженный лик Абеляра, верного сенешаля династии.{/n} "Путь проложен, Дитя Рассвета. Нить сплетена. Ступай же по ней... мо{mf|й|я} слуга".'
  speaker: null
