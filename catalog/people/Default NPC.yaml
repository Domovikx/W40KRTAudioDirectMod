- guid: cebbb0f0-14a4-47f0-a345-e22f1d068e00
  event: CH2_Dargonus_InquisitorTruth_98
  text: '"Почему вы предпочли {d|Encyclopedia:Ch1_RaycadNoExterminatus}проигнорировать{/d} предупреждение сотрудника Инквизиции, что длительное пребывание возле гибнущего Райкада Минорис может принести порчу на ваш корабль? Было ли это продиктовано заботой о людях или... запретным интересом?"'
  speaker: null
  parts:
  - speaker: NPC (по умолчанию)
