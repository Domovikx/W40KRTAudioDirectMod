name: Псайкер (NPC)
gender: F
role: Псайкер
age: ''
personality: напряжённая, взволнованная
voice: xenia
gemini_voice: Gacrux
sound_keys:
- Psyker
total_phrases: 91
phrases:
- guid: c67cd8f7-6c71-47ac-af10-4fdf31bba16c
  event: Companions_Psyker_01
  text: '{n}Голос Идиры звучит звонко и четко, почти сценически.{/n} "Древний мир с разбитым сердцем. Найдешь к нему тропу
    — и его богатства твои! Но тропы две, и обе покроют тебя позором, и обе — не то, чем пытаются казаться... Что выберешь,
    {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}? Грех {g|Encyclopedia:Warp}Эмпиреев{/g} или грех мертвых богов?"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 956f8f9b-bca5-4c27-a4d7-da2f3e9ef5d6
  event: Companions_Psyker_02
  text: '"Другая дорога... дорога начинается с порога Простора и ведет к недрам зарождающегося ми... ми... ра..." {n}Идира
    вдруг становится серой и начинает хватать ртом воздух. Из ее хрипящего горла исторгается чужой голос — глухой, тяжелый
    рокот далекой лавины.{/n} "Читать нити судьбы — не твоя участь, раб{mf||а} трупа на троне! Ступай в объятья рока, ибо
    так предначертано Архитектором Судеб!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 0f3b6e30-a1ed-4dac-bbd2-3fbf990a0a0a
  event: Companions_Psyker_03
  text: '"В общем, были мы один раз на {g|Encyclopedia:Footfall}Футфоле{/g}... ну то есть Лорд-капитан Теодора на Футфоле
    часто бывала, а тут меня с собой потащила с какой-то целью. У меня еще с утра день не задался, башка трещала, но делать
    нечего — пришлось идти. Приходим мы в место — притон притоном, все господа и дамы расфуфыренные, с {g|Encyclopedia:Augmentation}имплантами{/g}
    инкрустированными, сидят кучками за столами... в общем, выяснилось, что это игральный дом, да не простой, а заведенный
    кем-то из толстосумов для таких же, с деньжищами. Знали бы вы, как это, когда у тебя на глазах в {g|Encyclopedia:Regicide}регицид{/g}
    планету проигрывают! В общем, Лорд-капитан хотела, чтобы я ей помогла обставить одного типа... я ей говорю: пить дать,
    фишка не ляжет, фигура не пойдет, не садитесь за стол, Ваша Светлость! Она ни в какую — вот чего ей было не занимать,
    так это упорства".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: d242ef21-b6f2-45dd-bdc9-6ea2c646a1d0
  event: Companions_Psyker_04
  text: '{n}Идира резко втягивает воздух и закашливается. Из ее рта на пол летит что-то белесое и шевелящееся — белые личинки,
    которые тут же тают и обращаются в дым.{/n} "Я... это была не я! Клянусь всем, что свято! Не знаю, что это за вторая "дорога"
    и кто ее стережет, но молю, держитесь от нее подальше!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 03ce0dda-0391-4029-9f9d-016a8cf4d051
  event: Companions_Psyker_05
  text: '"Так чего же мы ждем? Скорее зовите писаря, надо все увековечить, пока не забыли! Только пусть сделает меня более
    героической и могущественной, чтобы я выгодно выделялась на фоне остальных ваших спутников. Как думаете, сколько мы с
    вами негодяев перебили? Миллион наберется? Хрен с ним, пусть будет два!"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: cee46116-c5f2-401b-8538-f92112558d15
  event: Companions_Psyker_06
  text: '"Знала б наверняка — уже б выложила. Чтобы хорошо слышать, нужно содействие, а эта кобра на меня только шипит и поплевывает
    своим святым ядом. Ох, не доверяю я ей... "'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 88500d26-2fa3-40a3-bbba-bdfe35925d64
  event: Companions_Psyker_07
  text: '"С Лейры, мира на окраине, в регионе Безбожных звезд. В {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g} как —
    чем глубже забираешься, тем хуже видно {g|Encyclopedia:Astronomican}Астрономикон{/g} и меньше знают про {g|Encyclopedia:Imperium}Империум{/g}.
    Появление Вольного Торговца — лучшее, что может случиться с тамошними мирами. Да, самое лучшее".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: d9821277-db56-41d5-ad82-672af10feaa2
  event: Companions_Psyker_08
  text: '"Это точно не помешает. Я тоже послежу. Эх, понять бы, что значит... Может, опасность для нее... а может — от нее
    исходящую".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 9777900e-291a-4707-9f62-4ebcd8612788
  event: Companions_Psyker_09
  text: '"В лабиринте чуждого мира вереницей вершится месть: око за око. Пролитая кровь тех, что зрит, несет за собой возмездие
    тех, кто ослеп. А на запах бежит кровожадный зверь, оскверненно скалясь. Его укрощение мнимо и приводит к распутью — стереть
    зараженную кровь, самому ей упиться или окрасить землю в багряный".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 2a7d6082-5eb9-4583-9ea3-a7865b6c2811
  event: Companions_Psyker_10
  text: '"Я просто избавилась от лишнего. Я прятала свой страх за байками, шуточками и подхалимством. Теперь страх ушел, а
    значит, и прятать его незачем. Я больше не дам вам поводов называть меня обузой или риском, Лорд-капитан. Я ваш инструмент,
    {name}, повелевайте". {n}Идира учтиво кланяется и выжидающе смотрит на вас.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 736b72ea-99c0-493b-886d-01f51f75e431
  event: Companions_Psyker_11
  text: '{n}Идира смотрит на вас холодными бесчувственными глазами без тени улыбки на ее бледном лице.{/n} "Лорд-капитан?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: ae731093-fad9-4e9e-abd0-0fbb06eaa64e
  event: Companions_Psyker_12
  text: '"Сестричка одержима своими собственными голосами, что шепчут ей о скверне и ереси". {n}Идира молчит, а потом изменившимся
    голосом добавляет.{/n} "Глупышка не понимает, что начинать искать, откуда сквозит, надо со своей головы".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 40bd97a6-1adb-440d-8d51-cc5d08266b02
  event: Companions_Psyker_13
  text: '"Клубок очень запутанный, много в нем ниточек сплелось, каждая в свою сторону тянуть пытается. Марионетки считают,
    что у них своя воля, но это лишь потому что им так велят — уж больно искусный кукловод попался. Черная длань его далеко,
    но от того лишь страшнее. Даже пестрая кукла, что как черт из коробочки выпрыгивает и скачет где ей вздумается, делает
    это с его дозволения".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 661a8531-3a33-4e73-a9d0-de21526844d7
  event: Companions_Psyker_14
  text: '"Надо очень чутко прислушиваться к чуждой мелодии и шагать ровно в такт. Звучание ее мрачное и опасное, но хору страданий
    не вторит. Это не значит, что танец не будет кровавым, но, побыв ведомым, можно потом оказаться ведущим".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 7aa8f2d4-753c-43b1-b79a-f9a30c6edc9f
  event: Companions_Psyker_15
  text: '{n}Идира наклоняет голову набок, словно прислушиваясь к чему-то.{/n} "Лорд-капитан, вы меня извините, но только это
    как слепому про цвета рассказывать: могу часами говорить, а толку не будет".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: fcbdc254-5440-4180-a3b6-f5cb95b824b9
  event: Companions_Psyker_16
  text: '{n}С видимым напряжением Идира вслушивается в тишину.{/n} "Не могу... разобрать... зараза!" {n}Женщина в сердцах
    сплевывает и разочарованно поджимает губы.{/n} "Не, дохлый номер, Лорд-капитан".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 265cc614-3fbb-4695-9327-0d4d483b4c48
  event: Companions_Psyker_17
  text: '{n}Идира натянуто улыбается.{/n} "Да, Лорд-капитан. Очень люблю хорошо посмеяться".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: bec5ad69-e377-49cb-85a3-906a0848a959
  event: Companions_Psyker_18
  text: '{n}Идира делает шаг назад, словно ее ударили.{/n} "Но почему?!" {n}Она вглядывается вам в лицо и, словно отыскав
    в нем ответ, судорожно вздыхает и кивает.{/n} "Т-так точно, Лорд-капитан. Я... приступлю к выполнению. Прощайте".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 141a19d8-224f-4590-a3af-d4ac832ed2ad
  event: Companions_Psyker_19
  text: '{n}Идира замирает, ее глаза начинают наполняться страхом.{/n} "Что?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: e68480f6-b568-4055-ba56-b2a8f2b388b3
  event: Companions_Psyker_20
  text: '"Иногда. Редко. Да и если подумать — зачем мне это? Тут есть все, что мне нужно. Все шепоты, что слышу, привычные,
    почти родные. А о кошмарах за бортом я могу за {g|Encyclopedia:Amasec}амасеком{/g} послушать". {n}Идира морщится и потирает
    глаза.{/n} "Вы только не подумайте — если надо, я за вами хоть на край галактики".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: d3aa8167-2ef9-4d8e-a2de-45eb224e4c5e
  event: Companions_Psyker_21
  text: '"Тренировка. Привычка. Еще немного {g|Encyclopedia:Amasec}амасека{/g} и пара других штучек, которые можно достать
    на нижних палубах. Если взять все вместе — выходит терпимо". {n}Идира дергает плечом и хихикает.{/n} "Иногда даже думаю
    — может, я половину голосов сама себе придумываю? Ну, когда скучновато становится. Не живых же слушать".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: bcd86866-bdd7-4dea-a961-e062fef3be61
  event: Companions_Psyker_22
  text: '"Я была при свите владыки, когда Теодора фон Валанциус нанесла ему визит. Не знаю, зачем — да и не мое дело". {n}Идира
    прищуривается, словно приглядывается к чему-то вдали.{/n} "Я до сих пор помню, как изменились голоса в голове, когда взглянула
    на нее — чуть не до визга зашлись. Много было за ее спиной... и на пути впереди тоже хватало".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 7b70ae73-cdff-4fc4-b9f8-9d6ae219f677
  event: Companions_Psyker_23
  text: '{n}Идира фокусирует на вас взгляд — видно, что ей это дается с заметным усилием. Женщина напряженно усмехается.{/n}
    "О чем это вы, Лорд-капитан?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 9ad395c3-1aa4-412e-afaa-7a3513c42ff5
  event: Companions_Psyker_24
  text: '"Конечно, Лорд-капитан".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: fc095b50-723a-46b3-a49d-4c78f4c64bfb
  event: Companions_Psyker_25
  text: '"Вышивала гобелены во славу национальных героев. Ха!" {n}Идира заходится каркающим смехом.{/n} "Да тем же, чем и
    здесь, Лорд-капитан: прорицала. Наши правители ценили возможность заглянуть в будущее — каждый найденный {g|Encyclopedia:Psyker}псайкер{/g}
    на Лейре стоил маленькое состояние".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 356522ae-95db-445f-b143-bb460e3d6213
  event: Companions_Psyker_26
  text: '"Контроль теряют неудачники, когда боятся своего дара. Или идиоты, которые так и не разобрались, что они такое на
    самом деле. Ну или малые детки, которым охота поиграть в новую цацку. Если не знать предел своим способностям или постоянно
    скакать через собственную голову — вот тогда жди беды".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: c7cc42c7-82d4-4c46-82ea-4445f15f5cd1
  event: Companions_Psyker_27
  text: '"Слушаю".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: f0641c99-f268-4ecf-8180-32e9c932ed56
  event: Companions_Psyker_28
  text: '"Конечно. Всегда к вашим услугам, когда понадоблюсь".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: dc9739fe-0452-4467-bfd7-c0b7062522b8
  event: Companions_Psyker_29
  text: '{n}Идира молчит несколько секунд перед ответом — а потом картинно закатывает глаза.{/n} "Знаете... Леди Теодора плевать
    хотела, замерили ли мне какие-то умники мозги или нет. Дело не в печати на лбу, смекаете? Дело в том, какое у тебя нутро
    — гнилое или нет. У меня нутро тверже адамантиума на этом корабле. И {g|Encyclopedia:Augmentation}импланты{/g} получше
    тех, которые втыкают на этой вашей {g|Encyclopedia:HolyTerra}Терре{/g}. Иначе бы я просто не дожила до своих лет". {n}Идира
    зло оскаливается, ее глаза лихорадочно блестят.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 5bd9a9fc-53a6-47b4-a2e5-9db55a1e984d
  event: Companions_Psyker_30
  text: '"Лорд-капитан, не о том печалитесь. Я на этом корабле без малого десять лет. Держала бы меня госпожа фон Валанциус,
    если бы не была уверена во мне?" {n}Идира мнется пару мгновений.{/n} "Да, бывает иногда... по мелочи. Когда слышу всякое.
    Порой даже так хорошо слышу, что оно становится взаправдашним. Но и у обычных людей бывают плохие дни, верно?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 8a281990-1785-48e7-95a3-ff2bb97d1db1
  event: Companions_Psyker_31
  text: '{n}Идира нервным жестом теребит пальцы, а потом со вздохом опускает руки.{/n} "Право, Лорд-капитан. И без меня забот
    хватает, а?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: e55d1ee8-f8fa-4f6c-baa9-aa4e7ceacd0d
  event: Companions_Psyker_32
  text: '"Захолустная планетка между блеклых звезд. На Лейре десяток местных тиранов грызутся за жалкие пять континентов,
    но в ход идет все — от яда до {g|Encyclopedia:Psyker}псайкеров{/g}". {n}Идира принимается растирать дрожащие пальцы.{/n}
    "Много лет там не была, но поверьте, скучать не о чем".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 02ec9ced-f088-4660-91f1-bd6ab4fcede4
  event: Companions_Psyker_33
  text: '{n}Идира хохочет, но в смехе слышны визгливые нотки.{/n} "Ну раз дверь открылась, значит, кто-то планирует зайти,
    не так ли? Только хрен им, не выйдет. Уж я-то знаю, как держать свою драгоценную головушку на замке".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 2b33d0b2-7067-4f71-8751-08eff7b7b91c
  event: Companions_Psyker_34
  text: '{n}Идира кривит губы в злой усмешке.{/n} "О, не стоит, Лорд-капитан. Экипаж давным-давно научился держаться от меня
    подальше. Боятся, что я рядом постою и ка-а-ак услышу что-то такое эдакое, за что им стыдно будет. Дурачье! Делать мне
    нечего, как исподнее их совести разглядывать! Ха!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 9ca78882-d8d0-482d-86fa-fde8c19c4ea2
  event: Companions_Psyker_35
  text: '"Жизнь на Лейре мирной не назовешь. Меня и таких, как я, искали специально — подбирали где могли, покупали у родителей,
    воровали даже. Я вот, например, из уличной банды загремела — продали меня детки постарше, когда смекнули, что со мной
    не так. При правящих династиях были школы, где нас и натаскивали, дурь выбивали. А потом — отправляли служить. Кто-то
    долго протягивал, как я, кто-то — сильно поменьше. Не все такие же ловкие и талантливые, как я. Переступали грань и досрочно
    выходили в тираж". {n}Идира выжидательно смотрит на вас. Потом, словно уточняя, жестом изображает взорвавшуюся голову
    и смеется.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 1f926438-18eb-440c-8b79-135788ccdedf
  event: Companions_Psyker_36
  text: '"И пока я так глазела на нее, глазела... взяла и услышала один шепоток. Намек, предположение, не более. Но я-то умею
    отличать досужий треп от угроз. Улучила минуту, приблизилась и шепнула Теодоре пару слов прежде, чем меня стражники уволокли.
    Избили, заперли в карцер — еще бы, за неподобающее якшание с чужаком и не такое светит... а потом за мной пришли люди
    Теодоры. Разворотили стенку, устроили бойню со стражей — лишь бы меня достать, чтобы я договорить предупреждение до конца
    смогла. Ну, договорить-то договорила, только назад не захотела — и пошла в услужение к фон Валанциусам".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 97512411-ab7d-4433-9a9a-ca0cae9786ca
  event: Companions_Psyker_37
  text: '{n}Идира насмешливо смотрит на вас.{/n} "Вы и {d|Encyclopedia:CharGen_Psyker}сами{/d} могли бы кому-нибудь рассказать
    об этом, а, Лорд-капитан?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 5d6811a6-80bc-4cbb-8b16-1ae5b37e74c2
  event: Companions_Psyker_38
  text: '"Каждый из нас ощущает связь с {g|Encyclopedia:Warp}варпом{/g} по-своему. Кто-то видит пятна и силуэты на периферии
    взгляда. Кто-то чувствует пальцы на хребте. Что до меня — у меня дверная щель в голове. Никак не прикрыть, сколько ни
    старайся, остается только привыкать к шепоту с той стороны. Когда надо для дела — прислушиваюсь получше, а обычно стараюсь
    не замечать". {g|Encyclopedia:Psyker}{/g}'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 9b7a9342-faf2-42e0-8a1a-ad2c7a249edf
  event: Companions_Psyker_39
  text: '{n}Идира пытается улыбнуться, но в ее глазах плещется страх.{/n} "Знаете... чем меньше я об этом думаю, тем меньше
    шанс, что кто-то с той стороны учует мой страх. Давайте не будем об этом".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 0609c2f0-98af-4042-a4ce-1cc391377567
  event: Companions_Psyker_40
  text: '{n}Идира снова фокусируется на вас. Ее усмешка меркнет, а взгляд становится мягче.{/n} "Знаете... когда со мной произошло...
    ну, вы помните... я думала, что с катушек съеду от ужаса. Но теперь, зная, что вы за меня — у меня как будто этот проклятый
    шепот в голове тише стал. Легче не думать о плохом".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: cc30a045-4281-46a2-8622-eb7dd2c55513
  event: Companions_Psyker_41
  text: '{n}Идира качает головой.{/n} "Никто из офицеров не знал Лорд-капитана по настоящему хорошо. Даже Абеляр, а его она
    всегда держала ближе остальных. Мне сразу объяснила, что если я буду что-то про нее у {g|Encyclopedia:Warp}варпа{/g} выслушивать
    без ее санкции — отправлюсь за борт. Я из понятливых, поэтому нос куда не нужно не совала — только по требованию".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: a71e2030-d9ef-4d7a-9228-58e434a94d4c
  event: Companions_Psyker_42
  text: '{n}Идира шмыгает носом. Озирается по сторонам. Потом потирает руки, дергает головой и, наконец, кивает.{/n} "Ну да.
    Меня тут для того и держали, так-то. Так что, если что... подналягу на дверку в башке плечом, высуну ухо и послушаю, что
    там в {g|Encyclopedia:Warp}варпе{/g} за вас трут". {n}Идира скалится, словно уже услышала какую-то сальную подробность
    про вас.{/n} "Изволите прямо сейчас послушать?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 68f0b33e-5a9c-4089-a4cc-d1ae49159401
  event: Companions_Psyker_43
  text: '"Вот тут, на корабле, совсем другое дело... да я за первый год на службе у леди фон Валанциус насмотрелась на чудес
    больше, чем за всю жизнь на Лейре. Взять хотя бы мой первый полет через {g|Encyclopedia:Warp}варп{/g} — три дня лежала,
    а в голове сверхновые взрывались! Я только потом узнала, что легко отделалась — за переборкой в соседнем отсеке вся команда
    превратилась..." {n}Идира осекается.{/n} "Что-то я разболталась, Лорд-капитан. Не берите в голову".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: fdae2775-ea21-4900-9480-ab867ddb8ed9
  event: Companions_Psyker_44
  text: '{n}Идира серьезно кивает, ее глаза лихорадочно блестят.{/n} "Так точно, Лорд-капитан! Я помню {d|Encyclopedia:CompIdira_LeftAliveHarsh}наш
    уговор{/d} и держу себя в руках. Голоса так и не успокоились... но я справляюсь. И даже если вдруг захочу дать слабину..."
    {n}Она оглядывается на надсмотрщика.{/n} "...у меня есть напоминание о том, что на кону".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 3e77d7a6-3f1d-41e3-af3c-0d9b067b1d79
  event: Companions_Psyker_45
  text: '{n}Взгляд Идиры туманится, а на ее лице появляется странное, потустороннее выражение.{/n} "Мне... сложно свыкнуться
    с мыслью, что ее больше нет. Леди фон Валанциус дала мне все, что у меня есть. Открыла мне звезды и путь между ними. Мне...
    мне до сих пор кажется, что я слышу ее голос". {n}Идира прерывисто вздыхает и трясет головой.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 926ddee5-74cb-45c7-ad16-a4c9767829a6
  event: Companions_Psyker_46
  text: '{n}Идира улыбается — мягко, почти жалобно.{/n} "Не буду врать, {name}: нет. Возможно, никогда не приду. Но голоса
    случайные я больше не слушаю. И сама не зову никого оттуда... Нет, с этим покончено. После того, что {d|Encyclopedia:CompIdira_LeftAliveSoft}вы
    для меня сделали{/d}... я не могу подвести вас еще раз".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: ecb1d43d-8b81-47d6-bd23-e54dfcd75cc9
  event: Companions_Psyker_47
  text: '"Угу, поди ей скажи — так мол и так, нечестивая {g|Encyclopedia:Psyker}псайкерша{/g} тут про тебя нагадала кой-чего.
    То-то она обрадуется, поблагодарит и прислушается! Нет, бесполезно это. Да я и не уверена пока, что это вот все значит.
    Может, опасность для нее... а может — от нее исходящую".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: fda650e3-9b25-4ffe-8cc0-15661abff717
  event: Companions_Psyker_50
  text: '{n}Идира качает головой.{/n} "Не, Лорд-капитан, глухо! Все также брожу по отсекам, экипаж пугаю. Но вы не переживайте
    — я уверена, что как только мы близко окажемся... в общем, это я ни с чем не спутаю!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: e22a31af-56a6-40c3-a1ee-e9a35f988d47
  event: Companions_Psyker_51
  text: '{n}Идира улыбается в полный рот.{/n} "Лучше не бывает, Лорд-капитан, без шуток! Как только я перестала трястись за
    свою жизнь, даже голоса в башке поутихли. Вы не подумайте — они еще вернутся, и когда-нибудь настанет ситуация, из которой
    я не смогу выкрутиться... Но пока я в порядке, и все {d|Encyclopedia:CompIdira_DamperOff}благодаря вам{/d}!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: ae9c52e5-7783-44ab-81d5-19d424a707ce
  event: Companions_Psyker_52
  text: '{n}Взгляд Идиры выглядит абсолютно пустым и безразличным.{/n} "Жалею? О чем? Я жива, и я {d|Encyclopedia:CompIdira_DamperOn}в
    контроле{/d}. Остальное абсолютно неважно. Теперь я буду выполнять свой долг служения вам лучше, чем когда-либо, можете
    не беспокоиться".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 176d8870-d187-4804-85ad-e1546de9bf41
  event: Companions_Psyker_53
  text: '"Но мне надоело жить чужими историями. Хочу рассказать свою. Уж не знаю, когда и как ей суждено прерваться, но я
    приложу все силы, чтобы когда-нибудь кто-нибудь рассказал хоть одну потешную байку об Идире Тласс. И я не могу придумать
    способа это сделать лучше, чем стоя с вами плечом к плечу, {name}".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 879f5816-31b7-42cb-81da-f55471208c13
  event: Companions_Psyker_54
  text: '{n}Идира весело крякает.{/n} "Обижаете, Лорд-капитан! Я за вашу безопасность только так радею. Если у меня из ноздрей
    порождения Хаоса полезут, то обещаю с вашим именем на устах броситься в самую гущу врагов. Вы, главное, потом приукрасьте
    мой подвиг хорошенько, чтобы он был еще более впечатляющим!"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 63be6ab1-3dc2-4106-875b-c7d0fe5b40fc
  event: Companions_Psyker_55
  text: '"Так точно, Лорд-капитан. Будем".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 38bf1859-82cb-48d5-8ca0-11b703ce05ca
  event: Companions_Psyker_56
  text: '{n}Идира изумленно смотрит на вас.{/n} "Откуда... хотя что это я. Вы же тогда, когда меня звали..." {n}Псайкер опускает
    взгляд, ее голос сбивается.{/n} "Беспокоится, говорите? Поговорить, да, так давно не говорили... Отличная идея, {name}.
    Так и сделаю".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 97e3d7ae-7120-4323-b8d1-1ce801e2afb5
  event: Companions_Psyker_57
  text: '"Знаете, мне кажется чертовски ироничным, что мой дар позволяет мне видеть будущее, при том, что мысли о будущем
    — это то, чего я избегала любой ценой. Средства всякие, шуточки, истории о старых добрых деньках — я за ними пряталась
    как за ширмой. Не высовывайся и все будет хорошо. Так я считала, по крайней мере".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: cf8060bd-3844-4c37-972b-9e539896c95b
  event: Companions_Psyker_58
  text: '"На колыбель твоих предков зарится черный дракон, коварный и брызжущий ядом. Из дома расходятся множество троп, но
    обратно к нему ведет лишь одна, черная и горестная. Не медли, ступив на нее! Не медли!"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 6e5b17ab-ca26-464a-a127-83586828fc14
  event: Companions_Psyker_59
  text: '"Ищи не на тверди земной, а в золоченом чертоге, подвешенном в пустоте. Там дитя без семьи, но с именем, слепое до
    истины. Водит по холсту кистью, да не замечает, что вместо красок у нее кровь в кювете. И с каждым мазком кровь эта не
    убывает, а полнится, полнится, вот-вот за края прольется... Ясно одно — когда сосуд переполнится, никто незапятнанным
    не останется".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: e36543f0-73ee-4c2f-b253-ece5b36eec91
  event: Companions_Psyker_60
  text: '"Среди слепцов и лжепророков мудрец в алой робе ищет ответ на вопрос. Не знает он, что искать надо не ответ, а вопрос,
    что все сведет воедино. Поможешь ему, Вольный Торговец? Но учти, что порою неведенье слаще забвенья".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 78e404d3-3cd7-4151-98da-c8e06008da5f
  event: Companions_Psyker_61
  text: '"Цепной пес гонится за проблесками зари, но всполохи разрядов и запах масла сбивают его нюх. Цепь волочится за ним
    — что станется, если поднимешь ее? Станешь хозя{mf|ином|йкой} или новым зверем в своре подлинного владыки?"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 2c833395-006a-4a42-83eb-160376d6d141
  event: Companions_Psyker_62
  text: '"Зарево восхода вырвалось из заточения — стенам темницы не удержать мрачную суть, что таилась в песке. Наивный детеныш
    ластится к знакомой руке, таящей погибель в искаженном стекле. Пригрей его или отбрось словно обузу — клинок перемен все
    равно уже вознесен, что ему еще одна жизнь?"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: d02c1398-e2e0-42cc-a51f-bf1d1d55c8a0
  event: Companions_Psyker_63
  text: '{n}Идира съеживается и отчаянно глотает ртом воздух, будто ее ударили под дых.{/n} "Темнота лезет в глотку, в ноздри,
    буравится под кожу... Она заползает в легкие и наполняет их безнадежностью, застилает глаза и уши. Есть только она, снаружи
    и во мне". {n}Женщина резко выпрямляется и вскрикивает, озадаченно оглядываясь по сторонам.{/n} "Простите, Лорд-капитан...
    это странно, но все шепотки будто разом умолкли. Ума не приложу, что это значит, но предчувствие у меня паскудное".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 974907fe-3d6e-4ff6-80ad-a55e1495e3cb
  event: Companions_Psyker_64
  text: '"Автоперо старательно выводит план, буква за буквой, шаг за шагом. Но лишь одна судьба ждет ту заметку — чужая рука
    небрежно зальет ее чернилами, выведя поверх иную волю вашей кровью. Руку ведет другая рука, за ней — еще одна... кто?
    Кто стоит за тенями чудовищных шпилей?"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 06bc9491-ac7d-4f9a-896d-eaf820f10806
  event: Companions_Psyker_65
  text: '"Каменный лик {g|Encyclopedia:Emperor}Императора{/g} грозен, но не зрит, как в его ногах занимается пламя. Чело той,
    что зовет себя его карой, осеняет нимб из тел, что парят на орбите. Но не все горят одинаково — холодный расчет способен
    сломить даже праведный гнев. Канистра с прометием у твоих ног, а куда его вылить — решать лишь тебе".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 9bc49fda-f9ea-4194-9096-6c96871c0032
  event: Companions_Psyker_66
  text: '"Заводное сердце запретной святыни бьется не в ритм, скрежеща все больше с каждым ударом. Тот, кто начал твой путь
    вместе с вами, даст дорогу рассвету. В недрах плавилен скован разящий клинок, что в руке не удержишь. Обнажить его — навлечь
    рок и погибель".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 12d8d863-24bd-41de-8fc3-7c9afdbdbb0d
  event: Companions_Psyker_67
  text: '"Ну что, выясним, что там о вас наушничают, а?.." {n}Идира усмехается, потирает руки — и внезапно замирает с глупой
    улыбкой на губах и чуть склоненной набок головой. Вы ощущаете, как кожа покрывается мурашками, а воротник начинает едва
    заметно трепетать — словно на сквозняке, вылетевшем из приоткрытой двери.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 925c1948-c86d-402b-a2fc-9193f9cab8c5
  event: Companions_Psyker_68
  text: '{n}Взгляд псайкера уносится куда-то в непостижимую даль, а ее голос множится неестественным металлическим эхом.{/n}
    "То, где все началось и то, где пути вновь слились — все сошлось воедино. Шаг в бесконечность, где молчанье гробниц оскорбляет
    биенье сердец. Этот шаг — он будет последним. Слушай шепот в своей голове, так как мои слова иссякли, {g|Encyclopedia:RogueTrader}Вольный
    Торговец{/g}".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: c2a3a26c-10a3-4adc-8efc-f217fc51e6e7
  event: Companions_Psyker_69
  text: '{n}Идира напряженно прислушивается, после чего морщится и качает головой.{/n} "Простите, Лорд-капитан, шепотки мои
    как-то совсем распоясались — ни рожна не разобрать. Попробую их приструнить как-нибудь, а пока..." {n}Псайкер виновато
    пожимает плечами и шмыгает носом.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 58cf37f7-f53c-434f-b3f1-421a7edd8931
  event: Companions_Psyker_70
  text: '{n}Испуганно дернувшись, Идира смотрит на вас опухшими глазами, пытаясь выдавить из себя улыбку.{/n} "А, Лорд-капитан,
    это вы? Думала, очередной шепоток подкрался..."'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 35ec7745-cf76-45a3-b302-5cdf99c0232f
  event: Companions_Psyker_71
  text: '{n}Псайкер прыскает со смеху, будто вы крайне удачно пошутили. Заметив, что вы все еще ждете ответа на свой вопрос,
    она одергивается.{/n} "А... вы это серьезно? Ну, тут ведь как, Лорд-капитан — соседи мои из-за дверки снова вернулись
    в мою болезную головушку. Соскучились, видать, галдят с новой силой. Но, пожалуй, так получше будет, чем у ксеноса на
    побегушках самой над собой эксперименты ставить".'
  speaker: Psyker (NPC)
  gemini_voice: Gacrux
  gemini_text: null
- guid: f6f08582-da46-4e2e-9638-f482bcbae0dc
  event: Companions_Psyker_72
  text: '"Нет. Мутит так, что сдохнуть хочется. Голоса опять со мной, и после того как я глоточек тишины отведала, они, кажется,
    звучат еще более оглушительно и рьяно. Лучше бы вы меня там оставили, хоть подохла бы спокойно..." {n}Поняв, что ляпнула,
    {g|Encyclopedia:Psyker}псайкерша{/g} виновато смотрит на вас.{/n} "Простите, Лорд-капитан, я не имела этого в виду. Просто
    погано мне, вот и разнылась".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: e1edd004-8e6e-400e-9b83-14828eefa602
  event: Companions_Psyker_73
  text: '{n}Женщина растерянно оглядывается.{/n} "Как по мне, мы по уши увязли во всех ведомых и неведомых Человечеству сортах
    говна. Может, с арены как-то улизнуть можно? Не знаю, Лорд-капитан, боюсь, что я сейчас едва свои мысли от чужих отделить
    могу, не то что планы спасительные придумывать. Может, конечно, у шепотков какие подсказки найдутся?"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 0d2fae4a-4566-47ff-b156-f4ec85c0ad40
  event: Companions_Psyker_74
  text: '"Что-то четкое выловить сейчас еще труднее, чем обычно — тут повсюду эти штуковины глушащие стоят, я словно сквозь
    пелену помех все слышу. Но если поднапрячься..." {n}Идира зажмуривается и стискивает зубы.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 1513901a-5518-4a5b-83cd-c4a10bf46496
  event: Companions_Psyker_75
  text: '"Глотать кровавую пыль осталось недолго. Искаженное зеркало без отражений манит в свой лабиринт и дарует надежду
    в момент, когда смерть неизбежна".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 0c7a34b6-91cd-4189-b42b-fb1ed7fd7a5b
  event: Companions_Psyker_76
  text: '{n}Идира потирает нос.{/n} "Да она... да она не то чтобы уж прямо такая занимательная была, Лорд-капитан... вот что:
    если захотите про что интересное послушать — это я завсегда. Запросто развею скуку и обогащу ваш запас баек. А про то,
    как я за переборкой всех расплавила... ну, неохота вспоминать в подробностях, ладно?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 85e8b573-f65c-4a48-8fb6-df7f4130a22f
  event: Companions_Psyker_77
  text: '{n}Идира смотрит на вас без выражения.{/n} "Думаю, этого достаточно. Остальное и не важно. Кем я была, что делала
    — не важно. Главное теперь — служить вам, верно и без ошибок".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: d80d065b-95a3-4405-892f-d53bb53f4c52
  event: Companions_Psyker_78
  text: '"Опасно. Слишком опасно. Я рада, что мы {d|Encyclopedia:CompIdira_DamperOn}нашли способ{/d} уменьшить этот риск.
    И для меня, и для вас. И для всех остальных".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: f3ac933a-7884-4124-8dae-c63234e672ee
  event: Companions_Psyker_79
  text: '"А то, Лорд-капитан!" {n}Идира заметно оживляется, а ее взгляд становится немного мечтательным, пока она припоминает
    одну из своих историй.{/n}'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 2285d11f-4cf3-40d4-a7c1-6451993ddb87
  event: Companions_Psyker_80
  text: '"В другой так в другой... я тут, в любой момент, как понадобится".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: b3046165-a854-41cd-b523-3b24cccb8986
  event: Companions_Psyker_81
  text: '"Ну, сели, начали партию. Я рядом кручусь, вроде и не при делах, но поглядываю. И голова у меня все сильнее и сильнее
    трещит... короче, хорошо, что я сообразила вовремя, что дело не в слитой партии, а в чем-то другом — вытащила Лорд-капитана
    из-за стола под предлогом каким, уволокла подальше, а через считанные минуты там, где мы были..." {n}Идира не выдерживает
    и начинает хохотать.{/n} "Оказывается, какой-то умник тоже приволок с собой ручного {g|Encyclopedia:Psyker}псайкера{/g}!
    Из тех, что в подполье Футфола шарятся! Он взял и... перенервничал, короче! Говорят, когда в эту комнату после всей катавасии
    заглянули, все, кто там был, друг друга перегрызли! В прямом смысле! Зубами!" {n}Идира, всхлипывая, вытирает выступившую
    слезу.{/n} "Ох... кажется, тот астероид потом вообще от Футфола отцепили и в открытый космос оттолкнули, чтобы в местную
    звезду улетел".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 11aa1c93-9f66-48b2-bd3e-81f893313703
  event: Companions_Psyker_82
  text: '"Нервы расшалились!" {n} — фыркает Идира. Но затем хмурится и говорит куда серьезнее:{/n} "Что-то мне покоя не дает
    наша святоша, а своему чутью я верю. Вроде прямая она как палка и понятная как похмелье после пьянки, ан нет, как смотрю
    на нее — свербит что-то".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 122e6fbe-d643-42ab-be06-6e8790fc86b0
  event: Companions_Psyker_83
  text: '"После того нашего разговора я пыталась послушать, что толкуют про нее... за дверью..." {n}— чуть тише добавляет
    Идира.{/n} "Услышала... странное. Кровь в прошлом, сумрак в настоящем, и ведет ее будто бы звезда, но куда ведет? Я видела
    несколько дорог, и все показались мне страшными".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 506e0596-4802-49b5-8004-f50fea1c6502
  event: Companions_Psyker_84
  text: '{n}Идира прыскает, подавляя смешок.{/n} "Мне? Точно нет, Лорд-капитан. Не знаю, кому Леди Теодора могла рассказывать
    о таком, но точно не м..." {n}Псайкер осекается, словно прислушиваясь к чему-то. Лицо женщины покрывает тень скорби.{/n}
    "Зачем вы нашептываете мне это сейчас, зачем?.."'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: bdcd16a3-40a5-4698-9c3e-0609a6811aa4
  event: Companions_Psyker_85
  text: '{n}Идира говорит тихо, ее голос дрожит.{/n} "Лорд-капитан, мне неизвестно о тайниках и секретах Леди Теодоры, но
    голоса... вдруг решили напомнить кое-что. Как-то мне довелось попробовать самое настоящее вино — им меня угостила Леди
    Теодора... То было не абы какое синтетическое пойло, а ее любимое. Она всегда пила этот золотистый напиток в своем дворце.
    "Пламя чистоты" — название глупое, но вкус, такой яркий и не похожий ни на что другое, я помню до сих пор..." {n}Грустно
    хмыкнув, Идира трясет головой.{/n} "Извините. Наверное, это неважно, но большего я попросту не знаю".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 2e76b185-cc6d-4663-8a46-6204dd7136ca
  event: Companions_Psyker_86
  text: '"Ничего не говорят. Слова как слова". {n}Неожиданно Идира осекается и морщится. Прикладывает руки к вискам. Снова
    морщится.{/n} "Шепот... такой тихий, что я едва его поймала... как перышко падает на пух... что-то про проклятые амбиции,
    древность, страшную древность... и случайность. Случайность поперек всего".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 5abcea17-47e2-4e28-974f-22d2aa568435
  event: Companions_Psyker_87
  text: '{n}Женщина замолкает и удивленно смотрит на вас.{/n} "Аж голова разболелась. Ну его, дурацкий какой-то шепот, ненадежный!"'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: dc4c240e-de77-4b0b-a55c-9db5a272a6eb
  event: Companions_Psyker_88
  text: '{n}Идира расплывается в ухмылке.{/n} "Ну, это должно быть что-то, чем можно тыкать каждому встречному в нос со словами
    "Смотри, как Вольный Торговец любит меня". Например, роскошное платье, каких нет даже у аристократок Даргонуса. Наша "принцесса
    контрабандистов" будет в восторге от возможности утереть дворянству носы своими привилегиями".'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
- guid: 1a4931b9-fc0d-4b1e-9c23-0ccb8fbf35c2
  event: Companions_Psyker_89
  text: '{n}Вереница шепотков неразборчивым гомоном вырывается из глотки псайкера, прежде чем ей удается найти среди них свой
    голос и ответить.{/n} "Лорд-капитан, у меня никогда и не было иного выбора. Вы раскрыли нам... нет, мне! МНЕ! Да, {d|Encyclopedia:CompIdira_Chaos}мне
    глаза вы раскрыли{/d}. Я больше не боюсь того, что за дверью, потому что теперь я точно знаю. Знаю, что с вами мне ничего
    не грозит. Спасибо".'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 4820cd49-c128-4812-bba6-22ce9224e4ee
  event: Companions_Psyker_90
  text: '"Они все мои. Всегда были моими и такими и останутся. Теперь нет ни секунды, что я их не слышу. Столько... вероятностей...
    Столько судеб. Мы... Я теряюсь в них, но, только потерявшись окончательно, я смогла найти свою. Она ужасна. Нет, прекрасна!
    Нет... какая же она? Опять потеряла. Но я найду, снова найду, только чуть-чуть потеряюсь..."'
  speaker: null
  gemini_voice: Gacrux
  gemini_text: null
- guid: 36094cdd-4896-4afa-ac86-b6dc665d9ccf
  event: Companions_Psyker_91
  text: '"Не посоветует, нет, не посоветует! Да и зачем вам советовать, когда я сама себе посоветовать могу? Да, голосочки-шепоточки
    мои? Мы сами вам посоветуем все что захотите! Только скажите. Нет, не говорите! Нет, лучше подумайте! Сейчас? Или когда?
    Может быть вы уже подумали завтра? Дайте-ка поищу..." {n}Псайкер ударяется в бессвязное бормотание.{/n}'
  speaker: Psyker (NPC)
  gemini_voice: Gacrux
  gemini_text: null
- guid: dfb91402-7daa-416f-b226-fb6b077b19a1
  event: Companions_Psyker_92
  text: '"И правильно, не волноваться — это хорошо! Я вот больше не волнуюсь, к чему вся эта суета? Обо всем, что вас должно
    волновать мы первые услышим и вам расскажем. Но не Идира — Идира вас больше волновать не должна. Ведь я не одна, и мне
    так хорошо и так безопасно! Да, голосочки-шепоточки мои?" {n}Псайкер безумно хихикает, после чего ударяется в воркующее
    бессвязное бормотание.{/n}'
  speaker: Psyker (NPC)
  gemini_voice: Gacrux
  gemini_text: null
- guid: c4d73832-c12a-49bb-b5b3-01bd04ca0973
  event: Companions_Psyker_93
  text: '{n}Идира cо стерильной учтивостью наклоняет голову, стараясь не встречаться с вами взглядом.{/n} "Лорд-капитан?"'
  speaker: Idira Tlass
  gemini_voice: Gacrux
  gemini_text: null
