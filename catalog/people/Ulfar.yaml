- guid: e031e8eb-ada4-49b1-973b-9eafd48eb3e9
  event: Companions_Ulfar_58
  text: '{n}Ульфар указывает на другой наплечник, где изображена черная звериная голова, и наставительно изрекает:{/n} "Это — Великий Волк Черногрив, покровитель убийц и тотем нашей великой роты, носящей имя Черногривых. Все знают, что мы — грозные и жадные до драки воины, коварные, смертоносные и не прощающие. Имя наше гремит гордо!"'
