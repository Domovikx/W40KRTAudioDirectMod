- guid: baf17d66-46b5-4e63-a0f2-022d95931ef9
  event: Companions_Ulfar_02
  text: '"Сдвинем чаши, эттфатер! В честь свершенных подвигов и в предвкушении тех, что еще предстоит свершить!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Сдвинем чаши, эттфатер! В честь свершенных подвигов и в предвкушении тех, что еще предстоит свершить!
- guid: aabc886f-37e3-4df4-9cd3-fcdb78442376
  event: Companions_Ulfar_03
  text: '"Стая Торбальда Железношкурого сейчас осаждает Ефрат-II. Даже если моя стая не с ним, он может знать, где они охотятся. Я должен встретиться с Торбальдом и спросить его о своих братьях".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Стая Торбальда Железношкурого сейчас осаждает Ефрат-II. Даже если моя стая не с ним, он может знать, где они охотятся. Я должен встретиться с Торбальдом и спросить его о своих братьях.
- guid: 2b3f4a13-52a3-4283-bd2b-49aa2d05726e
  event: Companions_Ulfar_04
  text: '{n}Осклабившись, гигант искоса взирает на вас. На его грубом лице огромными буквами написано хитрое самодовольство, которое он безуспешно пытается скрыть.{/n} "Была у меня пара мыслей на сей счет. Но ты не спеши их выпытывать — когда они придутся к месту, я поделюсь ими".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Осклабившись, гигант искоса взирает на вас. На его грубом лице огромными буквами написано хитрое самодовольство, которое он безуспешно пытается скрыть.
  - speaker: Ulfar
    text_clean: Была у меня пара мыслей на сей счет. Но ты не спеши их выпытывать — когда они придутся к месту, я поделюсь ими.
- guid: 25a66098-6126-4c23-8189-4c4d260f4539
  event: Companions_Ulfar_05
  text: '"Видишь, эттфатер, сколь явно дает нам понять Всеотец, что нити вюрда нашего переплетены особым образом? Не случайно свел он твою и мою дороги, не случайно привел в одно место. Ступай же со мной, когда придет черед отыскать моих братьев".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Видишь, эттфатер, сколь явно дает нам понять Всеотец, что нити вюрда нашего переплетены особым образом? Не случайно свел он твою и мою дороги, не случайно привел в одно место. Ступай же со мной, когда придет черед отыскать моих братьев.
- guid: 2296df66-f3c7-4d2b-ab1f-26e60481fd63
  event: Companions_Ulfar_06
  text: '"Фенрис йольда, эттфатер".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Фенрис йольда, эттфатер.
- guid: 5db0bcdc-0267-454e-9621-592884a80154
  event: Companions_Ulfar_07
  text: '"Грядет шторм, кракены поднимаются из глубин за кровавой поживой, а ты хочешь оставить свой дреккар без лучшего гребца?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Грядет шторм, кракены поднимаются из глубин за кровавой поживой, а ты хочешь оставить свой дреккар без лучшего гребца?
- guid: 5324f198-e8bd-4b31-9d52-e56f777bea1a
  event: Companions_Ulfar_08
  text: '"Не каждому даровано право задавать такие вопросы, но тебе я отвечу. Что же ты желаешь знать об Астартес со славного Фенриса?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не каждому даровано право задавать такие вопросы, но тебе я отвечу. Что же ты желаешь знать об Астартес со славного Фенриса?
- guid: 150aad47-f061-433f-b358-42732febfe74
  event: Companions_Ulfar_09
  text: '"Таков был мой путь в Комморру, эттфатер".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Таков был мой путь в Комморру, эттфатер.
- guid: eb35e300-3179-458b-946c-840298f54260
  event: Companions_Ulfar_10
  text: '"Инквизитор, зовущийся Калькасаром, прислал призыв о помощи. Совет командиров решил не отказывать и направил две стаи в Простор, хоть мы и не доверяли этому "союзнику". Но обязывал нас откликнуться кровавый долг за услугу, оказанную в прошлом".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Инквизитор, зовущийся Калькасаром, прислал призыв о помощи. Совет командиров решил не отказывать и направил две стаи в Простор, хоть мы и не доверяли этому "союзнику". Но обязывал нас откликнуться кровавый долг за услугу, оказанную в прошлом.
- guid: 8d1d5991-7f7a-45ec-80d7-bfab022c8682
  event: Companions_Ulfar_100
  text: '"Наше геносемя — особое! Расс благословил нас Волчьей спиралью, особым компонентом гена, что оттачивает наши чувства и инстинкты, словно моноклинок. Волчья спираль разжигает в наших сердцах кровожадное пламя, а облику придает сходство со смертоносными волками Фенриса".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Наше геносемя — особое! Расс благословил нас Волчьей спиралью, особым компонентом гена, что оттачивает наши чувства и инстинкты, словно моноклинок. Волчья спираль разжигает в наших сердцах кровожадное пламя, а облику придает сходство со смертоносными волками Фенриса.
- guid: f52990c9-0c49-4730-adc0-f7cb1f14cdf2
  event: Companions_Ulfar_101
  text: '"Нас связывало многое. Арнульф был моим побратимом. От его клинка я пал в битве, где меня заметил Избирающий доблестных, от моего топора погиб и он в том сражении. Но позже мы забыли вражду наших кланов и стали близкими друзьями". {n}Ульфар показывает нож, покрытый красными рунами.{/n} "Этот клинок он подарил мне в знак того, что прошлое забыто. Скор на смех был Арнульф и страшен в драке, почти как я сам".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Нас связывало многое. Арнульф был моим побратимом. От его клинка я пал в битве, где меня заметил Избирающий доблестных, от моего топора погиб и он в том сражении. Но позже мы забыли вражду наших кланов и стали близкими друзьями.
  - speaker: narrator
    text_clean: Ульфар показывает нож, покрытый красными рунами.
  - speaker: Ulfar
    text_clean: Этот клинок он подарил мне в знак того, что прошлое забыто. Скор на смех был Арнульф и страшен в драке, почти как я сам.
- guid: 641f52ea-1847-4d8a-b796-fb33699c4d0b
  event: Companions_Ulfar_102
  text: '"Известно ли тебе об импланте, именуемом омофагия? Это одно из благословений Всеотца, даруемых Астартес. Нервные узлы, связывающие стенки желудка и спинной мозг, позволяют мне усваивать информацию из генетического кода поглощаемой пищи".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Известно ли тебе об импланте, именуемом омофагия? Это одно из благословений Всеотца, даруемых Астартес. Нервные узлы, связывающие стенки желудка и спинной мозг, позволяют мне усваивать информацию из генетического кода поглощаемой пищи.
- guid: 8dfccc97-b4a4-418e-8932-d4e991010bd1
  event: Companions_Ulfar_103
  text: '"Разумно скрывать свое прошлое и тайны своих братьев от чужака, но постыдно — от друга. Спрашивай".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Разумно скрывать свое прошлое и тайны своих братьев от чужака, но постыдно — от друга. Спрашивай.
- guid: 8144ff28-5d7c-469a-94c2-6cc914994e0d
  event: Companions_Ulfar_104
  text: '"А тебе многое известно. Куда больше, чем положено обычно{mf|му|й} смертно{mf|му|й}. Да, я и впрямь терзал плоть врагов, чтобы извлечь тайны из горчащего вкуса их мяса".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: А тебе многое известно. Куда больше, чем положено обычному смертному. Да, я и впрямь терзал плоть врагов, чтобы извлечь тайны из горчащего вкуса их мяса.
- guid: 61775572-3e2f-42b8-8aa5-f7e123f20afa
  event: Companions_Ulfar_105
  text: '"Скьядди же, Думающий Дважды, был послан нам Всеотцом, чтобы не сложили мы головы молодыми щенками. Мыслей в его голове было столько, что хватало их думать и за меня, и за Арнульфа. Это Скьядди научил меня слагать висы. Духи ценили его мудрость, руны слушались его голоса".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Скьядди же, Думающий Дважды, был послан нам Всеотцом, чтобы не сложили мы головы молодыми щенками. Мыслей в его голове было столько, что хватало их думать и за меня, и за Арнульфа. Это Скьядди научил меня слагать висы. Духи ценили его мудрость, руны слушались его голоса.
- guid: ffad1c13-bd6b-4f33-99f4-d1febb8e98c1
  event: Companions_Ulfar_106
  text: '{n}Фыркнув, Ульфар презрительно сплевывает.{/n} "Ради утоления голода я бы скорее глодал камни, чем мясо этих хилых вырожденцев, ничтожных прихвостней лжебогов, богохульных мешков скверны и трусости..." {n}Ворчание воина переходит в бранную тираду на фенрисийском.{/n}'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Фыркнув, Ульфар презрительно сплевывает.
  - speaker: Ulfar
    text_clean: Ради утоления голода я бы скорее глодал камни, чем мясо этих хилых вырожденцев, ничтожных прихвостней лжебогов, богохульных мешков скверны и трусости...
  - speaker: narrator
    text_clean: Ворчание воина переходит в бранную тираду на фенрисийском.
- guid: 4b2ae32c-f6b9-4b3a-bb45-31afb3f0097f
  event: Companions_Ulfar_107
  text: '{n}На губах Ульфара возникает улыбка маньяка.{/n} "Думаешь, я пал в сладкие объятия безумия?" {n}Воин добродушно смеется.{/n} "Нет, я не обезумел. Пока что, по крайней мере".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: На губах Ульфара возникает улыбка маньяка.
  - speaker: Ulfar
    text_clean: Думаешь, я пал в сладкие объятия безумия?
  - speaker: narrator
    text_clean: Воин добродушно смеется.
  - speaker: Ulfar
    text_clean: Нет, я не обезумел. Пока что, по крайней мере.
- guid: 9ef8fb63-a0d6-438c-afdc-2d2f042a6b5e
  event: Companions_Ulfar_108
  text: '"Отчасти, эттфатер. Я и впрямь водил за нос худосочных ксеносов, чтобы усыпить их бдительность. Но не только".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Отчасти, эттфатер. Я и впрямь водил за нос худосочных ксеносов, чтобы усыпить их бдительность. Но не только.
- guid: 1f157c52-0abe-4a1b-a472-d5595ee4cc2d
  event: Companions_Ulfar_109
  text: '{n}Ульфар внезапно сводит брови и растерянно добавляет:{/n} "Ты, конечно, дева, не "отец"... Но слова для девы-командира у нас просто нет, ведь все Космические волки — мужи".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар внезапно сводит брови и растерянно добавляет:'
  - speaker: Ulfar
    text_clean: Ты, конечно, дева, не "отец"... Но слова для девы-командира у нас просто нет, ведь все Космические волки — мужи.
- guid: d539c6eb-601e-4614-a088-af4f76fec920
  event: Companions_Ulfar_11
  text: '"Так тому и быть. Наше краткое знакомство будет упомянуто в саге, повествующей о моем побеге из Комморры. Гордись этим!" {n}Громогласно расхохотавшись, рыжеволосый отворачивается.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Так тому и быть. Наше краткое знакомство будет упомянуто в саге, повествующей о моем побеге из Комморры. Гордись этим!
  - speaker: narrator
    text_clean: Громогласно расхохотавшись, рыжеволосый отворачивается.
- guid: 6ca6a592-384d-43f9-b21e-c5d63dc1fd43
  event: Companions_Ulfar_110
  text: '"Когда ксеносы тащили меня, плененного, Арнульф настиг их и изрубил с десяток своей славной секирой, а Скьядди призвал шторм столь могучий, что реациклы нелюдей кружились в бурных потоках ветра, словно листья. Но даже их мощи не хватило на всех... Мы оказались в плену. Первым Тервантьяс забрал Скьядди и сотворил с его телом... немыслимое. Затем он забрал Арнульфа, и много часов под пыткой мой брат отвечал выродку презрительным хохотом, а затем умолк".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Когда ксеносы тащили меня, плененного, Арнульф настиг их и изрубил с десяток своей славной секирой, а Скьядди призвал шторм столь могучий, что реациклы нелюдей кружились в бурных потоках ветра, словно листья. Но даже их мощи не хватило на всех... Мы оказались в плену. Первым Тервантьяс забрал Скьядди и сотворил с его телом... немыслимое. Затем он забрал Арнульфа, и много часов под пыткой мой брат отвечал выродку презрительным хохотом, а затем умолк.
- guid: 0352847e-9a0a-4e4b-98f5-17d8d12d7b0c
  event: Companions_Ulfar_111
  text: '{n}Что-то изменилось в Ульфаре — внешне он кажется здоровым, но свет в его глазах потух и сменился кровавой дымкой {d|Encyclopedia:CompUlfar_Wulfen}подступающего безумия{/d}. Губы усохли и плотно сжались — нелегко таким устам будет петь славные саги. В голосе клокочет зловещий рык:{/n} "Эттфатер. Хорошо, что ты жив{mf||а}".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Что-то изменилось в Ульфаре — внешне он кажется здоровым, но свет в его глазах потух и сменился кровавой дымкой подступающего безумия. Губы усохли и плотно сжались — нелегко таким устам будет петь славные саги. В голосе клокочет зловещий рык:'
  - speaker: Ulfar
    text_clean: Эттфатер. Хорошо, что ты жив.
- guid: b640a484-d68c-4e93-bcfd-808ac0894be6
  event: Companions_Ulfar_112
  text: '{n}Что-то переменилось в Ульфаре, будто некий груз, с первой встречи давивший на плечи Волка, наконец исчез. В суровом его лице возникло спокойствие, которого прежде не было. Он почтительно кланяется вам.{/n} "Эттфатер, {mf|брат|сестра}, сердце поет, когда я вижу тебя. Клянусь, что {d|Encyclopedia:CompUlfar_Pack}имя твое не будет забыто{/d}, когда, возвратившись на Фенрис я буду петь свою сагу".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Что-то переменилось в Ульфаре, будто некий груз, с первой встречи давивший на плечи Волка, наконец исчез. В суровом его лице возникло спокойствие, которого прежде не было. Он почтительно кланяется вам.
  - speaker: Ulfar
    text_clean: Эттфатер, брат, сердце поет, когда я вижу тебя. Клянусь, что имя твое не будет забыто, когда, возвратившись на Фенрис я буду петь свою сагу.
- guid: b2365af0-a0b1-4038-ab30-add5ca67323f
  event: Companions_Ulfar_113
  text: '{n}Что-то переменилось в Ульфаре. Черты лица его стали суше и острее, а из веселого огонька в глазах пропала искренность. Он посуровел, и в голосе певца саг возникла траурная хрипотца.{/n} "Эттфатер, свидетель{mf||ница} {d|Encyclopedia:CompUlfar_Lone}клятвы моей{/d}, с почтением встречаю тебя".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Что-то переменилось в Ульфаре. Черты лица его стали суше и острее, а из веселого огонька в глазах пропала искренность. Он посуровел, и в голосе певца саг возникла траурная хрипотца.
  - speaker: Ulfar
    text_clean: Эттфатер, свидетель клятвы моей, с почтением встречаю тебя.
- guid: bf6a1ffa-d87c-4f6b-86d7-9b45e393ca1d
  event: Companions_Ulfar_114
  text: '{n}Голос Ульфара становится уклончив.{/n} "Он спас нашего брата, который потерял стаю и... Не мог позаботиться о себе и чести Ордена. Вернул его на Фенрис и сохранил в тайне несчастье, постигшее его. Ярл знал, что вела его жажда выгоды и желание обрести могучих должников, однако честь обязала его принять чужака гостеприимно и поклясться в дружбе".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Голос Ульфара становится уклончив.
  - speaker: Ulfar
    text_clean: Он спас нашего брата, который потерял стаю и... Не мог позаботиться о себе и чести Ордена. Вернул его на Фенрис и сохранил в тайне несчастье, постигшее его. Ярл знал, что вела его жажда выгоды и желание обрести могучих должников, однако честь обязала его принять чужака гостеприимно и поклясться в дружбе.
- guid: eef9f4c7-ca87-43f3-abce-e21d020229c9
  event: Companions_Ulfar_115
  text: '"Все на Фенрисе имеет силу. Я бился в сотне битв, я получил сотню ран. Даже среди Волков не каждый пережил бы эти увечья. Я же всегда выживал. И с каждой новой победой мысли мои все темнее — что, если мне так и не доведется пасть с честью однажды? Что, если смерть моя будет глупой и бесславной? И Расс брезгливо отвернется от меня, когда я буду стыдливо обивать порог его чертога?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Все на Фенрисе имеет силу. Я бился в сотне битв, я получил сотню ран. Даже среди Волков не каждый пережил бы эти увечья. Я же всегда выживал. И с каждой новой победой мысли мои все темнее — что, если мне так и не доведется пасть с честью однажды? Что, если смерть моя будет глупой и бесславной? И Расс брезгливо отвернется от меня, когда я буду стыдливо обивать порог его чертога?
- guid: 359193c4-17ee-4afe-8c73-ee90f87c9d36
  event: Companions_Ulfar_116
  text: '"Так у Космических волков зовется отец стаи. Я — опытный воин, и мне отдает приказы эттфатер. Он подчиняется ярлу — командиру великой роты. Раз сейчас мной командуешь ты, и командуешь достойно, я дарую тебе привилегию зваться моим эттфатером".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Так у Космических волков зовется отец стаи. Я — опытный воин, и мне отдает приказы эттфатер. Он подчиняется ярлу — командиру великой роты. Раз сейчас мной командуешь ты, и командуешь достойно, я дарую тебе привилегию зваться моим эттфатером.
- guid: c4f028af-159e-4efb-b55f-3a968b0b0557
  event: Companions_Ulfar_117
  text: '"Мы зовемся Зловещим воем, и знак наш известен всем Волкам". {n}Гигант с гордостью указывает на наплечник, украшенный похожими на клыки черными клиньями.{/n} "Мы — старые волки, много видавшие и прошедшие". {n}Тень тревоги омрачает хвастливую радость на лице воина.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мы зовемся Зловещим воем, и знак наш известен всем Волкам.
  - speaker: narrator
    text_clean: Гигант с гордостью указывает на наплечник, украшенный похожими на клыки черными клиньями.
  - speaker: Ulfar
    text_clean: Мы — старые волки, много видавшие и прошедшие.
  - speaker: narrator
    text_clean: Тень тревоги омрачает хвастливую радость на лице воина.
- guid: 4ec0f915-2905-463e-810c-549c0817e859
  event: Companions_Ulfar_118
  text: '"До становления Астартес я мечтал стать скьяльдом, хранителем историй. На пирах я часто пою о подвигах своих братьев. Тысячи их в памяти моей. Когда я рядом, Волки бьются еще ретивее, ведь знают, что их деяния сохраню я в вечности. Один Механикус рек, что в наших песнях скрыты психомеметические коды, укрепляющие отвагу. Наверное, где-нибудь в других местах так и есть. Но на Фенрисе саги пекут лишь из памяти, почтения и гордости".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: До становления Астартес я мечтал стать скьяльдом, хранителем историй. На пирах я часто пою о подвигах своих братьев. Тысячи их в памяти моей. Когда я рядом, Волки бьются еще ретивее, ведь знают, что их деяния сохраню я в вечности. Один Механикус рек, что в наших песнях скрыты психомеметические коды, укрепляющие отвагу. Наверное, где-нибудь в других местах так и есть. Но на Фенрисе саги пекут лишь из памяти, почтения и гордости.
- guid: f35f3dc4-4c25-4dd6-9908-df3b1cf612df
  event: Companions_Ulfar_119
  text: '"Всеотец одарил тебя сильным чутьем. Его сотворил Скьядди Думающий Дважды. Духи любили его, а под саги о его проницательности можно пировать всю долгую ночь Хельвинтра. Он был моим другом". {n}На лицо, только что светившееся от свирепой гордости, ложится угрюмая тень.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Всеотец одарил тебя сильным чутьем. Его сотворил Скьядди Думающий Дважды. Духи любили его, а под саги о его проницательности можно пировать всю долгую ночь Хельвинтра. Он был моим другом.
  - speaker: narrator
    text_clean: На лицо, только что светившееся от свирепой гордости, ложится угрюмая тень.
- guid: f4114d46-1a61-45e8-9ded-9d50ad1528f3
  event: Companions_Ulfar_12
  text: '"Как пожелаешь. Не знаю, чем прогневал тебя, но спорить не буду. Прощай, {name}. Чутье подсказывает, что всех нас ждет суровое ненастье. Встреть его доблестно, а я продолжу свою охоту в одиночку".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Как пожелаешь. Не знаю, чем прогневал тебя, но спорить не буду. Прощай, КЭП. Чутье подсказывает, что всех нас ждет суровое ненастье. Встреть его доблестно, а я продолжу свою охоту в одиночку.
- guid: 87f15d6e-5d84-46ab-9eb0-db86ad70d83f
  event: Companions_Ulfar_120
  text: '"Каждое утро я обращался ко Всеотцу, а каждый вечер — к Рассу. Я тренировал свое тело, читал литании, а в самые трудные часы повторял свою сагу. Вспоминал каждую битву, каждую рану, каждого брата. И так я выжил". {n}Свирепо зыркнув на вас, рыжеволосый отворачивается.{/n} "Я всегда выживаю".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Каждое утро я обращался ко Всеотцу, а каждый вечер — к Рассу. Я тренировал свое тело, читал литании, а в самые трудные часы повторял свою сагу. Вспоминал каждую битву, каждую рану, каждого брата. И так я выжил.
  - speaker: narrator
    text_clean: Свирепо зыркнув на вас, рыжеволосый отворачивается.
  - speaker: Ulfar
    text_clean: Я всегда выживаю.
- guid: 105fbeb1-5c86-4e82-a74a-63ce33f50be3
  event: Companions_Ulfar_121
  text: '"Или он огромен, как Солнечный волк, что каждое утро выходит на охоту и озаряет наш мир светом? Всеотец — не бог, а образец человека. Обычным людям тяжело осознать это, но мы, его воители и потомки, помним правду".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Или он огромен, как Солнечный волк, что каждое утро выходит на охоту и озаряет наш мир светом? Всеотец — не бог, а образец человека. Обычным людям тяжело осознать это, но мы, его воители и потомки, помним правду.
- guid: 308df6a7-b1bf-4bdb-a3f7-1fc93e3da710
  event: Companions_Ulfar_122
  text: '"О мрачных днях спрашиваешь ты, эттфатер". {n}Ульфар испускает рокочущий вздох, достает из ножен украшенный алыми рунами нож, который вы видели в его руках еще в Темном городе, и начинает вертеть в пальцах, успокаиваясь.{/n} "Пусть мой острый товарищ будет свидетелем правдивости моих слов".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: О мрачных днях спрашиваешь ты, эттфатер.
  - speaker: narrator
    text_clean: Ульфар испускает рокочущий вздох, достает из ножен украшенный алыми рунами нож, который вы видели в его руках еще в Темном городе, и начинает вертеть в пальцах, успокаиваясь.
  - speaker: Ulfar
    text_clean: Пусть мой острый товарищ будет свидетелем правдивости моих слов.
- guid: 3ff98d0d-75f2-4a88-8f2a-fe05c3031870
  event: Companions_Ulfar_123
  text: '"Простор Коронус — дикое угодье, полное добычи. И Космические волки первыми окрасят его снега алым! Ярл решил отправить самых неукротимых охотников, жаждущих почестей и кровопролития. Где одна стая исполняла бы долг во имя чести, две уже стремились превзойти друг друга во имя славы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Простор Коронус — дикое угодье, полное добычи. И Космические волки первыми окрасят его снега алым! Ярл решил отправить самых неукротимых охотников, жаждущих почестей и кровопролития. Где одна стая исполняла бы долг во имя чести, две уже стремились превзойти друг друга во имя славы.
- guid: e6d3af19-1796-4180-8c4d-fbb101dc6ab1
  event: Companions_Ulfar_124
  text: '"Благодарю. Их истории не будут забыты, но сохранятся в легендах Ордена. Мы, Волки, не умираем до конца — мы уходим охотиться в Кьялхалле, и однажды вернемся в сей мир для последней битвы. Славный будет день воссоединения братьев!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Благодарю. Их истории не будут забыты, но сохранятся в легендах Ордена. Мы, Волки, не умираем до конца — мы уходим охотиться в Кьялхалле, и однажды вернемся в сей мир для последней битвы. Славный будет день воссоединения братьев!
- guid: d6bd928b-2165-44d4-afcc-106803b483ef
  event: Companions_Ulfar_125
  text: '{n}Ульфар печально качает головой.{/n} "Нет больше стаи. Я мог бы стать Одиноким волком, мстителем, но сердце мое желает иного. Я соскучился по обществу воинов Фенриса. Когда мы исполним твое дело здесь, я отыщу Торбальда Железношкурого и приму его щедрое предложение, свяжу себя узами кровного братства с Грозовыми укусами. Долг мой перед Всеотцом еще не исполнен".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар печально качает головой.
  - speaker: Ulfar
    text_clean: Нет больше стаи. Я мог бы стать Одиноким волком, мстителем, но сердце мое желает иного. Я соскучился по обществу воинов Фенриса. Когда мы исполним твое дело здесь, я отыщу Торбальда Железношкурого и приму его щедрое предложение, свяжу себя узами кровного братства с Грозовыми укусами. Долг мой перед Всеотцом еще не исполнен.
- guid: 09cfa2a4-55bc-46e4-8468-ed616310074f
  event: Companions_Ulfar_126
  text: '{n}Рокочущий голос воина отдается дрожью в ваших костях.{/n} "Наш бесстрашный лидер — Леман Расс, потомок Всеотца. Наша обитель — Клык, чертог бессмертных, что возносится с Хребта мира до самой орбиты. Наш мир — Фенрис. Чувствуешь — каждое слово гремит ратной славой и зовет в кровавую бурю сражения! Вот каковы мы! И не бывать никому, схожему с нами!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Рокочущий голос воина отдается дрожью в ваших костях.
  - speaker: Ulfar
    text_clean: Наш бесстрашный лидер — Леман Расс, потомок Всеотца. Наша обитель — Клык, чертог бессмертных, что возносится с Хребта мира до самой орбиты. Наш мир — Фенрис. Чувствуешь — каждое слово гремит ратной славой и зовет в кровавую бурю сражения! Вот каковы мы! И не бывать никому, схожему с нами!
- guid: 234b1726-6891-4609-a1fc-f7adf285adf2
  event: Companions_Ulfar_127
  text: '{n}Взгляд гиганта теплеет.{/n} "Фенрис — это дом. Суровый край суровых зим и суровых людей. Когда приходит Хельвинтр, страшное время холодов, непокорное Мировое море замерзает и на охоту выходят великие белые медведи, снежные вирмы и ледяные тролли. Затем убийственный мороз отступает, и лодки гарпунщиков выходят на промысел, схватываясь с морскими змеями и кракенами".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Взгляд гиганта теплеет.
  - speaker: Ulfar
    text_clean: Фенрис — это дом. Суровый край суровых зим и суровых людей. Когда приходит Хельвинтр, страшное время холодов, непокорное Мировое море замерзает и на охоту выходят великие белые медведи, снежные вирмы и ледяные тролли. Затем убийственный мороз отступает, и лодки гарпунщиков выходят на промысел, схватываясь с морскими змеями и кракенами.
- guid: cd1cf9d1-ed11-42d3-8e62-e62c1a70e471
  event: Companions_Ulfar_128
  text: '{n}Воин отмахивается, но на губах его играет довольная улыбка.{/n} "Брось. Я, конечно, мог бы командовать тобой и твоими людьми, да хоть целой планетой!.. Но мне, воителю Всеотца, слишком легко забыть об ограничениях, присущих обычным людям".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Воин отмахивается, но на губах его играет довольная улыбка.
  - speaker: Ulfar
    text_clean: Брось. Я, конечно, мог бы командовать тобой и твоими людьми, да хоть целой планетой!.. Но мне, воителю Всеотца, слишком легко забыть об ограничениях, присущих обычным людям.
- guid: e6cbfaaf-19b3-4f32-a05b-acb1d978f9d5
  event: Companions_Ulfar_129
  text: '"Соответствуй ей и не опозорь славное звание".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Соответствуй ей и не опозорь славное звание.
- guid: fdc3b9c2-4172-44a3-85e0-3ecb4e269636
  event: Companions_Ulfar_13
  text: '"А, ты, видимо, любишь веселые шутки. Я тоже". {n}Рот воина растягивается в зубастой неприятной улыбке.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: А, ты, видимо, любишь веселые шутки. Я тоже.
  - speaker: narrator
    text_clean: Рот воина растягивается в зубастой неприятной улыбке.
- guid: 5705acc8-a668-4c05-a244-2b254788f1a2
  event: Companions_Ulfar_130
  text: '{n}Волк снисходительно улыбается.{/n} "Мне неведомы твои регалии, но ни одна из них не сравнится в почетности с дарованной мной".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Волк снисходительно улыбается.
  - speaker: Ulfar
    text_clean: Мне неведомы твои регалии, но ни одна из них не сравнится в почетности с дарованной мной.
- guid: 33a18b07-df29-477d-86c3-2e55f9f5c960
  event: Companions_Ulfar_131
  text: '"Больше, чем просто сплетением букв

    Является сага,

    В ней тайной вязью проложен магический смысл,

    Пусть не постигнет его ни ухо, ни разум,

    Сердце откликнется на прозвучавшие чары".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Больше, чем просто сплетением букв Является сага, В ней тайной вязью проложен магический смысл, Пусть не постигнет его ни ухо, ни разум, Сердце откликнется на прозвучавшие чары.
- guid: eb47f170-f0fd-4fa0-ad4d-f5982557bc61
  event: Companions_Ulfar_132
  text: '{n}Грозно рыкнув, Ульфар сводит брови, и нечто примитивное и древнее внутри вашего мозга заходится в истерике ужаса.{/n} "Не тебе, человек, судить наши овеянные веками кровавой славы традиции. Тебе оказана честь, так заткнись и соответствуй ей!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Грозно рыкнув, Ульфар сводит брови, и нечто примитивное и древнее внутри вашего мозга заходится в истерике ужаса.
  - speaker: Ulfar
    text_clean: Не тебе, человек, судить наши овеянные веками кровавой славы традиции. Тебе оказана честь, так заткнись и соответствуй ей!
- guid: 81f73f62-b2ac-4edb-b731-32a177b89442
  event: Companions_Ulfar_133
  text: '"Верь во что пожелаешь, эттфатер. Всеотец не желал от нас, чтобы мы почитали его, словно божество, но мы — не обычные люди. Не знаю, каков был его замысел касательно вас".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Верь во что пожелаешь, эттфатер. Всеотец не желал от нас, чтобы мы почитали его, словно божество, но мы — не обычные люди. Не знаю, каков был его замысел касательно вас.
- guid: 728c5598-b735-4995-b97d-f01c0200dec9
  event: Companions_Ulfar_134
  text: '"Тем славнее его деяния. Легко биться с богами, когда ты сам — бог. Но если ты человек — вот тут-то и начинается сага о славном подвиге".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Тем славнее его деяния. Легко биться с богами, когда ты сам — бог. Но если ты человек — вот тут-то и начинается сага о славном подвиге.
- guid: 0ba3ed2b-ab89-4b75-b503-e988de3abb22
  event: Companions_Ulfar_135
  text: '"Это не случилось бы без тебя, эттфатер. Знай, что отныне и навек у тебя есть товарищи на Фенрисе".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Это не случилось бы без тебя, эттфатер. Знай, что отныне и навек у тебя есть товарищи на Фенрисе.
- guid: 6e123a49-2a44-47d0-9470-df3c3deb1614
  event: Companions_Ulfar_136
  text: '"Не-фенрисийцу трудно постичь нашу мудрость. Она приходит с холодом и смертью".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не-фенрисийцу трудно постичь нашу мудрость. Она приходит с холодом и смертью.
- guid: 52550621-f64b-4491-b084-198978478bf2
  event: Companions_Ulfar_137
  text: '"Оно сильно, безусловно, но дух мой сильней Доппельгренделя. Раз я одолел его в схватке, неужели не одолею его чары? Нет, однажды я обязательно обрету славную гибель на поле сражения!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Оно сильно, безусловно, но дух мой сильней Доппельгренделя. Раз я одолел его в схватке, неужели не одолею его чары? Нет, однажды я обязательно обрету славную гибель на поле сражения!
- guid: 7b4f049e-f35f-4b4a-9cc1-af9e6118b456
  event: Companions_Ulfar_138
  text: '"Если услышишь в ночи торжествующий вой — знай, это я иду тропой возмездия".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Если услышишь в ночи торжествующий вой — знай, это я иду тропой возмездия.
- guid: 3c6fd13a-7a17-46b8-8254-5374a7e26f08
  event: Companions_Ulfar_139
  text: '"Да. Я тоже".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Да. Я тоже.
- guid: 4fb23a78-e818-437b-bb81-3b0cf20ca8ba
  event: Companions_Ulfar_14
  text: '"Кутает старец тело свое в теплую шерсть,

    Кутает планы свои многомудрый хитрец в покровы из тайны.

    Коли желаешь зловещий ты умысел знать,

    Печень вкуси хитреца вместо яда словес".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Кутает старец тело свое в теплую шерсть, Кутает планы свои многомудрый хитрец в покровы из тайны. Коли желаешь зловещий ты умысел знать, Печень вкуси хитреца вместо яда словес.
- guid: 6cbe2bad-7038-418d-9403-34d1c204e5d3
  event: Companions_Ulfar_140
  text: '{n}Хищная усмешка служит вам ответом.{/n} "Проницательно. Мы не имели прежде дел с этим Калькасаром и не доверяли ему. Две стаи — вдвое больше глаз, чтобы присматривать за его хитростями и махинациями. Да и потом..."'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Хищная усмешка служит вам ответом.
  - speaker: Ulfar
    text_clean: Проницательно. Мы не имели прежде дел с этим Калькасаром и не доверяли ему. Две стаи — вдвое больше глаз, чтобы присматривать за его хитростями и махинациями. Да и потом...
- guid: e79176f3-8eb6-4871-adea-55ad188c4fe9
  event: Companions_Ulfar_141
  text: '"Оно сильно, но и я не слаб. Прежде я выживал, потому что так велел мне долг перед братьями — перебороть любую рану, вновь встать в строй, защитить, уберечь... Теперь сего долга нет, и ничто не держит меня здесь. Может, теперь я смогу умереть".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Оно сильно, но и я не слаб. Прежде я выживал, потому что так велел мне долг перед братьями — перебороть любую рану, вновь встать в строй, защитить, уберечь... Теперь сего долга нет, и ничто не держит меня здесь. Может, теперь я смогу умереть.
- guid: f92d67a2-0dfb-4aa5-8258-6d1a05be05b0
  event: Companions_Ulfar_142
  text: '"Биться, эттфатер. Я буду искать достойную схватку и повергать врагов Всеотца, пока однажды не найдется достойный сразить меня. Имя Зловещего воя будет плыть, словно дреккар, в реках пролитой мной крови нечестивцев. Черногрив более не мой покровитель, отныне я пойду тропами Локъяра, Одинокого Волка".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Биться, эттфатер. Я буду искать достойную схватку и повергать врагов Всеотца, пока однажды не найдется достойный сразить меня. Имя Зловещего воя будет плыть, словно дреккар, в реках пролитой мной крови нечестивцев. Черногрив более не мой покровитель, отныне я пойду тропами Локъяра, Одинокого Волка.
- guid: eb496b4a-a335-4bf8-ac11-600a795beb41
  event: Companions_Ulfar_143
  text: '"Радость умерла в моем сердце, эттфатер. Я чувствую лишь гнев... Хотя это ложь. Кажется, я уже больше почти ничего не чувствую. Просто хочу растерзать кого-нибудь. Скоро лишь это чувство останется во мне, а затем уйдет и оно. И я буду пуст".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Радость умерла в моем сердце, эттфатер. Я чувствую лишь гнев... Хотя это ложь. Кажется, я уже больше почти ничего не чувствую. Просто хочу растерзать кого-нибудь. Скоро лишь это чувство останется во мне, а затем уйдет и оно. И я буду пуст.
- guid: b0188446-1791-49e0-b533-08ab35c02d22
  event: Companions_Ulfar_144
  text: '"Я больше не желаю обманывать себя смертной надеждой — даже она умерла. Всем нам достаются разные судьбы — чья-то легка, чья-то полна скорбей. Мне досталась такая, и я не буду скулить, точно щенок, отрицая ее. Пропащим мне суждено быть от роду, но только сейчас я обрел смелость принять сей путь".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я больше не желаю обманывать себя смертной надеждой — даже она умерла. Всем нам достаются разные судьбы — чья-то легка, чья-то полна скорбей. Мне досталась такая, и я не буду скулить, точно щенок, отрицая ее. Пропащим мне суждено быть от роду, но только сейчас я обрел смелость принять сей путь.
- guid: 8be2352e-b757-4ed8-a7e5-4479113ae45b
  event: Companions_Ulfar_145
  text: '"Греза, навеянная мьодом, смешалась с реальностью и чарами Доппельгренделя. Как сказать тебе, что было настоящим, а что — миражом? Бились ли мы с духом или моим обезумевшим братом? Встали ли подле нас призраки павших, чтобы взвесить нашу отвагу на весах достоинства, или дурман заставил нас сражаться с ветром? Все сразу, эттфатер. На Фенрисе издавна знают, сколь зыбка грань между настоящим и легендой, и мы с тобой были в легенде".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Греза, навеянная мьодом, смешалась с реальностью и чарами Доппельгренделя. Как сказать тебе, что было настоящим, а что — миражом? Бились ли мы с духом или моим обезумевшим братом? Встали ли подле нас призраки павших, чтобы взвесить нашу отвагу на весах достоинства, или дурман заставил нас сражаться с ветром? Все сразу, эттфатер. На Фенрисе издавна знают, сколь зыбка грань между настоящим и легендой, и мы с тобой были в легенде.
- guid: 1f890785-77fa-4cf2-9e77-7f8853c3c2cf
  event: Companions_Ulfar_146
  text: '"Пусть этот надменный вождь и возомнил, что может отдавать нам приказы, мы следовали собственному инстинкту и охотились по-своему". {n}Рыжеволосый довольно ухмыляется.{/n} "Бьюсь об заклад, это его изрядно злило".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Пусть этот надменный вождь и возомнил, что может отдавать нам приказы, мы следовали собственному инстинкту и охотились по-своему.
  - speaker: narrator
    text_clean: Рыжеволосый довольно ухмыляется.
  - speaker: Ulfar
    text_clean: Бьюсь об заклад, это его изрядно злило.
- guid: 9c07df56-cc74-4c2a-a2c0-c51273d126f5
  event: Companions_Ulfar_149
  text: '{n}Воин мрачно отрезает:{/n} "Пали. Достойно".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Воин мрачно отрезает:'
  - speaker: Ulfar
    text_clean: Пали. Достойно.
- guid: 381585cd-bbc3-41d0-95ea-88167bbcbcd2
  event: Companions_Ulfar_15
  text: '{n}Сумрачно взрыкнув, Ульфар посылает вам леденящий взгляд, рождающий в сердце понимание чудовищной пропасти, разделяющей вас и древнего сверхчеловека, стоящего напротив.{/n} "Их сагу я петь тебе не готов. Ты не проливал{mf||а} с ними кровь, ты не делил{mf||а} с ними мясо и мьод. Их духи могут оскорбиться, узнав, что я пою о их деяниях чужа{mf|ку|чке}".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Сумрачно взрыкнув, Ульфар посылает вам леденящий взгляд, рождающий в сердце понимание чудовищной пропасти, разделяющей вас и древнего сверхчеловека, стоящего напротив.
  - speaker: Ulfar
    text_clean: Их сагу я петь тебе не готов. Ты не проливал с ними кровь, ты не делил с ними мясо и мьод. Их духи могут оскорбиться, узнав, что я пою о их деяниях чужаку.
- guid: 3b9b6f19-ec18-475e-8eff-4addd5ac8513
  event: Companions_Ulfar_150
  text: '"Вот что придавало мне силы. Твои советы, эттфатер".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Вот что придавало мне силы. Твои советы, эттфатер.
- guid: cb1b310e-8ec4-488d-aa55-d4631bfa4e09
  event: Companions_Ulfar_151
  text: '"Я прикончил многих ксеносов и попировал их плотью. Мои пленители веселились, глядя на это, а я собирал информацию и готовил побег".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я прикончил многих ксеносов и попировал их плотью. Мои пленители веселились, глядя на это, а я собирал информацию и готовил побег.
- guid: ffd08c22-073b-45e4-9e5a-1f609967bcad
  event: Companions_Ulfar_157
  text: '"Будто вещий дух, ты указывал{mf||а} мне на мою тропу, эттфатер, пока очи мои не открылись".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Будто вещий дух, ты указывал мне на мою тропу, эттфатер, пока очи мои не открылись.
- guid: fcc2908c-81bc-4a5b-a7b8-71cec6b65dd5
  event: Companions_Ulfar_158
  text: '"Каждая трещина была мала, но вместе они раскололи твердыню надежд, живших во мне".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Каждая трещина была мала, но вместе они раскололи твердыню надежд, живших во мне.
- guid: 911342c4-1c90-412b-9614-78cac36444eb
  event: Companions_Ulfar_159
  text: '{n}Громогласно хохотнув, великан торжествующе ревет:{/n} "Вырвались смелые из плена презренных отродий!

    Темного града темницы убогие в сраме пребудут.

    Сага о славном побеге польется рекою

    На пиру, где восславят могучего Волка и ловкого эттфатера!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Громогласно хохотнув, великан торжествующе ревет:'
  - speaker: Ulfar
    text_clean: Вырвались смелые из плена презренных отродий! Темного града темницы убогие в сраме пребудут. Сага о славном побеге польется рекою На пиру, где восславят могучего Волка и ловкого эттфатера!
- guid: 93e84b32-c2ec-4b9d-8d1d-633f3a71425e
  event: Companions_Ulfar_16
  text: '"Меня отдали на потеху Тервантьясу. На аренах Комморры Астартес — редкость, и он выпускал меня убивать гладиаторов". {n}С каждым словом голос Ульфара тяжелеет от горечи и злобы.{/n} "Я ненавидел. Постоянно ненавидел, каждое мгновение!" {n}Взревев и выругавшись на фенрисийском, воин переводит дух.{/n} "Приходилось заботиться о своем разуме, пока он не сгинул в Семи Преисподних".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Меня отдали на потеху Тервантьясу. На аренах Комморры Астартес — редкость, и он выпускал меня убивать гладиаторов.
  - speaker: narrator
    text_clean: С каждым словом голос Ульфара тяжелеет от горечи и злобы.
  - speaker: Ulfar
    text_clean: Я ненавидел. Постоянно ненавидел, каждое мгновение!
  - speaker: narrator
    text_clean: Взревев и выругавшись на фенрисийском, воин переводит дух.
  - speaker: Ulfar
    text_clean: Приходилось заботиться о своем разуме, пока он не сгинул в Семи Преисподних.
- guid: 22a8648c-2860-4010-90fb-541283ee7166
  event: Companions_Ulfar_17
  text: '"В ночи, погрузившись в медитацию, я слышу их вой. Они охотятся в Кьялхалле, и сердце мое рвется к ним. Однажды мы встретимся".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: В ночи, погрузившись в медитацию, я слышу их вой. Они охотятся в Кьялхалле, и сердце мое рвется к ним. Однажды мы встретимся.
- guid: cc9a4785-1d1b-4c99-ade4-e2a8d5616580
  event: Companions_Ulfar_18
  text: '"Невеселую сагу поведал я тебе, эттфатер".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Невеселую сагу поведал я тебе, эттфатер.
- guid: b7db08e9-79e5-46e3-b28b-7aa318fa767a
  event: Companions_Ulfar_19
  text: '{n}Воин горестно рычит:{/n} "Зря. Они заслуживали более славной смерти. И саги их должны были звучать дольше. Лучше бы мне было в тот день умереть, а им — жить дальше и разить врагов во славу Всеотца".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Воин горестно рычит:'
  - speaker: Ulfar
    text_clean: Зря. Они заслуживали более славной смерти. И саги их должны были звучать дольше. Лучше бы мне было в тот день умереть, а им — жить дальше и разить врагов во славу Всеотца.
- guid: f1207962-a8fb-404f-9669-aa3d86a55d88
  event: Companions_Ulfar_20
  text: '{n}Свирепая гримаса искажает лицо воина, делает его похожим на звериную морду.{/n} "И я буду мстить. Клянусь кровью и клыками! Тысячей нечистых сердец буду я пировать, прославляя павших товарищей!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Свирепая гримаса искажает лицо воина, делает его похожим на звериную морду.
  - speaker: Ulfar
    text_clean: И я буду мстить. Клянусь кровью и клыками! Тысячей нечистых сердец буду я пировать, прославляя павших товарищей!
- guid: b9fd8cc6-8750-468e-af58-176f50513002
  event: Companions_Ulfar_21
  text: '{n}Гигант снисходительно улыбается, глядя на вас сверху вниз.{/n} "Не кипи, эттфатер. Если хочешь читать волшебные заговоры, взывая ко Всеотцу — разве я тебе запрещаю?" {n}Улыбка нехорошо кривится.{/n} "Но не бросайся столь дерзкими словами, иначе ответишь на них на поединке".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Гигант снисходительно улыбается, глядя на вас сверху вниз.
  - speaker: Ulfar
    text_clean: Не кипи, эттфатер. Если хочешь читать волшебные заговоры, взывая ко Всеотцу — разве я тебе запрещаю?
  - speaker: narrator
    text_clean: Улыбка нехорошо кривится.
  - speaker: Ulfar
    text_clean: Но не бросайся столь дерзкими словами, иначе ответишь на них на поединке.
- guid: f9228d15-f102-4933-b6e3-ef54aaa60205
  event: Companions_Ulfar_22
  text: '{n}Кровожадно взрыкнув, гигант сжимает чудовищные кулаки.{/n} "Брось еще одно надменное слово в сторону Фенриса, и мы выйдем на поединок. Не испытывай милость Всеотца — даже из безоружной схватки со мной тебе вряд ли удастся выйти жив{mf|ым|ой}".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Кровожадно взрыкнув, гигант сжимает чудовищные кулаки.
  - speaker: Ulfar
    text_clean: Брось еще одно надменное слово в сторону Фенриса, и мы выйдем на поединок. Не испытывай милость Всеотца — даже из безоружной схватки со мной тебе вряд ли удастся выйти живым.
- guid: a2869740-4baa-4484-a1c7-de267f236042
  event: Companions_Ulfar_23
  text: '{n}Весело оскалившись, гигант вкрадчиво осведомляется:{/n} "А ты как думаешь?"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Весело оскалившись, гигант вкрадчиво осведомляется:'
  - speaker: Ulfar
    text_clean: А ты как думаешь?
- guid: b974dc24-ace3-4426-a46e-bf97cdf3917c
  event: Companions_Ulfar_24
  text: '"Но не из одного мрачного разрушения сложен наш дух. Вкус веселья ведом нам не хуже вкуса битвы. В чертоге героев мы устраиваем пиры, каких не найти нигде. Под гремящий смех поднимаем мы рога, рассказываем саги и чествуем героев".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Но не из одного мрачного разрушения сложен наш дух. Вкус веселья ведом нам не хуже вкуса битвы. В чертоге героев мы устраиваем пиры, каких не найти нигде. Под гремящий смех поднимаем мы рога, рассказываем саги и чествуем героев.
- guid: 44b64caa-fcbc-438a-a368-aee2dbe52a97
  event: Companions_Ulfar_25
  text: '"Годы я провел в учении, а затем прошел сквозь мрачные Врата Моркаи, поклонился обеим его головам на рунных камнях и ступил в долину грез. Что видел я там, не спрашивай — то между мной и Волком смерти. Рунные жрецы рыскали в моей душе, но признали ее нетронутой скверной. Вернувшись, я был причащен из Чаши Вульфена. Волчья спираль вошла в мою кровь, и агония трансформации преобразила мое тело на манер зверя, а разум утопила в темных пучинах кровавого безумия".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Годы я провел в учении, а затем прошел сквозь мрачные Врата Моркаи, поклонился обеим его головам на рунных камнях и ступил в долину грез. Что видел я там, не спрашивай — то между мной и Волком смерти. Рунные жрецы рыскали в моей душе, но признали ее нетронутой скверной. Вернувшись, я был причащен из Чаши Вульфена. Волчья спираль вошла в мою кровь, и агония трансформации преобразила мое тело на манер зверя, а разум утопила в темных пучинах кровавого безумия.
- guid: f6cf56ab-5d13-40b8-9495-54cfed8952e1
  event: Companions_Ulfar_26
  text: '"Все мы однажды падем. Солнечный Волк падет, сраженный Моркаи, погаснет свет, и придет Время Волка. Отгремит гром Последней битвы, и не станет ничего. Каждый знает это, но не каждый может поверить и понять это. Я теперь — могу".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Все мы однажды падем. Солнечный Волк падет, сраженный Моркаи, погаснет свет, и придет Время Волка. Отгремит гром Последней битвы, и не станет ничего. Каждый знает это, но не каждый может поверить и понять это. Я теперь — могу.
- guid: a2220eb7-fdfd-46f3-a7ab-c2c7915be592
  event: Companions_Ulfar_27
  text: '"Я уйду. Не спрашивай куда, ибо тебе не надо быть там, где я. Я стану изгнанником, диким убийцей. Перед тем, как разум мой угаснет, я удалюсь от людей туда, где живут лишь нелюди и нечестивцы. Я стану их бичом, их проклятьем, крадущимся в ночи хищником, что разоряет селения и убивает всех на пути. Я буду злобой Всеотца".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я уйду. Не спрашивай куда, ибо тебе не надо быть там, где я. Я стану изгнанником, диким убийцей. Перед тем, как разум мой угаснет, я удалюсь от людей туда, где живут лишь нелюди и нечестивцы. Я стану их бичом, их проклятьем, крадущимся в ночи хищником, что разоряет селения и убивает всех на пути. Я буду злобой Всеотца.
- guid: 41542b52-9429-4dac-8b5c-359e43f65799
  event: Companions_Ulfar_28
  text: '"Влка Фенрика". {n}Гортанный выговор Ульфара звучит архаично и свирепо.{/n} "Так мы зовемся на старом языке нашего мира. Мы — самые яростные из воителей Всеотца, его палачи, его возмездие".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Влка Фенрика.
  - speaker: narrator
    text_clean: Гортанный выговор Ульфара звучит архаично и свирепо.
  - speaker: Ulfar
    text_clean: Так мы зовемся на старом языке нашего мира. Мы — самые яростные из воителей Всеотца, его палачи, его возмездие.
- guid: 8d2a5860-95b4-4158-8f11-f289fc5d1ea2
  event: Companions_Ulfar_29
  text: '{n}Ульфар сумрачно прищуривается.{/n} "Ты на что-то намекаешь? Подозреваешь, что плен развратил и отравил меня пагубной тягой к плоти?" {n}Верхняя губа гиганта задирается, демонстрируя жуткие зубы.{/n} "Не зли волка".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар сумрачно прищуривается.
  - speaker: Ulfar
    text_clean: Ты на что-то намекаешь? Подозреваешь, что плен развратил и отравил меня пагубной тягой к плоти?
  - speaker: narrator
    text_clean: Верхняя губа гиганта задирается, демонстрируя жуткие зубы.
  - speaker: Ulfar
    text_clean: Не зли волка.
- guid: f899a4ea-ad06-4aec-ac50-b70e3ef3393f
  event: Companions_Ulfar_30
  text: '"Всеотец любит всех волков. Даже проклятых".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Всеотец любит всех волков. Даже проклятых.
- guid: 77f0f92d-f3d2-48e0-ac89-695b33538eea
  event: Companions_Ulfar_31
  text: '{n}Ульфар, насупившись, мечет в вас грозный взгляд, но затем, не выдержав, хохочет.{/n} "Что правда, то правда. У родившихся на Фенрисе через слово волк".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар, насупившись, мечет в вас грозный взгляд, но затем, не выдержав, хохочет.
  - speaker: Ulfar
    text_clean: Что правда, то правда. У родившихся на Фенрисе через слово волк.
- guid: 4bc802d5-e2e5-4ebb-b5fe-960ab7c481aa
  event: Companions_Ulfar_32
  text: '"Я люблю рассказывать истории".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я люблю рассказывать истории.
- guid: 3ecf54d7-de05-4796-a240-6b4072af9caf
  event: Companions_Ulfar_33
  text: '"От перечисления моих свершений можно утомиться". {n}Воин хвастливо указывают на отметину на броне в форме скрещенных костей.{/n} "Сей знак стойкости я заслужил, сразив царя-вожака убогого эльдарского племени. Он нанес мне тяжкую рану, и волчий жрец сказал, что мне не выжить... но я всегда выживаю. Два года лежал я в беспамятстве после той битвы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: От перечисления моих свершений можно утомиться.
  - speaker: narrator
    text_clean: Воин хвастливо указывают на отметину на броне в форме скрещенных костей.
  - speaker: Ulfar
    text_clean: Сей знак стойкости я заслужил, сразив царя-вожака убогого эльдарского племени. Он нанес мне тяжкую рану, и волчий жрец сказал, что мне не выжить... но я всегда выживаю. Два года лежал я в беспамятстве после той битвы.
- guid: 23874d59-eb25-42b1-b923-b06deb5f93bb
  event: Companions_Ulfar_34
  text: '"А затем приходит Сезон огня — пробуждаются вулканы, волны затапливают острова, и лишь твердь Асахейма дарует спасение тем, кто кровью и железом отстоит свое право жить на ней. Кланы бьются меж собой, а над полями битв кружат вороны и разносится волчий вой. Вот какой мой любимый дом, нет места во вселенной, подобного ему". {n}Голос Ульфара полон мечтательной ностальгии.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: А затем приходит Сезон огня — пробуждаются вулканы, волны затапливают острова, и лишь твердь Асахейма дарует спасение тем, кто кровью и железом отстоит свое право жить на ней. Кланы бьются меж собой, а над полями битв кружат вороны и разносится волчий вой. Вот какой мой любимый дом, нет места во вселенной, подобного ему.
  - speaker: narrator
    text_clean: Голос Ульфара полон мечтательной ностальгии.
- guid: 4bd814cb-1b32-4f1b-9c8d-f8c86fcc4135
  event: Companions_Ulfar_35
  text: '{n}В глазах гиганта загорается хитрый огонек.{/n} "А знаешь, эттфатер, кто самый страшный враг на Фенрисе?"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: В глазах гиганта загорается хитрый огонек.
  - speaker: Ulfar
    text_clean: А знаешь, эттфатер, кто самый страшный враг на Фенрисе?
- guid: 3e33ed86-cc02-4b1e-a37c-b1429fe53b9f
  event: Companions_Ulfar_36
  text: '"Мороз Хельвинтра страшен, но понятен и предсказуем. Нет".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мороз Хельвинтра страшен, но понятен и предсказуем. Нет.
- guid: eac8d378-8aff-47e8-9c56-535524a365e5
  event: Companions_Ulfar_37
  text: '"Мировое море свирепо, но от него можно скрыться на тверди. Нет".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мировое море свирепо, но от него можно скрыться на тверди. Нет.
- guid: 44741ed5-cd04-4345-986e-1dcb8e2a121b
  event: Companions_Ulfar_38
  text: '"Человек и впрямь опаснее всего живого, но истинный ужас не имеет привычных нам плоти и крови".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Человек и впрямь опаснее всего живого, но истинный ужас не имеет привычных нам плоти и крови.
- guid: 3e8f30d6-95e9-4e33-aa33-4d6961045428
  event: Companions_Ulfar_39
  text: '"Как же без волков, если разговор про Фенрис. Волки страшны. Но самые страшные волки Фенриса — это мы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Как же без волков, если разговор про Фенрис. Волки страшны. Но самые страшные волки Фенриса — это мы.
- guid: 848f1d8f-c352-41b3-a63a-72cd4cb9964f
  event: Companions_Ulfar_40
  text: '"Ответ, принесенный на крыльях ворона мудрости. О том, сколь страшна измена, нам ведомо многое. Знай же имя страшнейшего из предателей".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ответ, принесенный на крыльях ворона мудрости. О том, сколь страшна измена, нам ведомо многое. Знай же имя страшнейшего из предателей.
- guid: 74ed57c6-6901-49b1-b245-59233bbbff71
  event: Companions_Ulfar_41
  text: '"Ты, наверное, говоришь про Царя ледяных троллей? Удивительно, что ты слыхал{mf||а} о нем. Но его давным давно сразил Харальд Волчья смерть, когда чудовище обрушилось на клан Гончих прилива. Великую сагу сложили о той охоте, люблю петь ее на пирах... Нет, не угадал{mf||а}".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ты, наверное, говоришь про Царя ледяных троллей? Удивительно, что ты слыхал о нем. Но его давным давно сразил Харальд Волчья смерть, когда чудовище обрушилось на клан Гончих прилива. Великую сагу сложили о той охоте, люблю петь ее на пирах... Нет, не угадал.
- guid: 163c03a0-1a86-4f64-83e8-9ac23f74c7d7
  event: Companions_Ulfar_42
  text: '"Не уга... Что? Почему гнев-барсук?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не уга... Что? Почему гнев-барсук?
- guid: f1915ddd-f4f1-4093-9274-4b74a26f1298
  event: Companions_Ulfar_43
  text: '{n}В зычном голосе Волка звучит хриплый рев бурана.{/n} "Проклятье Вульфена — самый страшный и жестокий враг на Фенрисе. В сердце каждого брата живет темный зверь, кровавый и вечно голодный. Он жаждет убивать — не ради славы, долга и товарищей, а лишь ради убийства. В резне для него нет радости и азарта, а есть лишь тупая злоба".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: В зычном голосе Волка звучит хриплый рев бурана.
  - speaker: Ulfar
    text_clean: Проклятье Вульфена — самый страшный и жестокий враг на Фенрисе. В сердце каждого брата живет темный зверь, кровавый и вечно голодный. Он жаждет убивать — не ради славы, долга и товарищей, а лишь ради убийства. В резне для него нет радости и азарта, а есть лишь тупая злоба.
- guid: fac7bcce-9df0-4fb8-9742-59dfb0f84cff
  event: Companions_Ulfar_44
  text: '"Смешное имя для несмешного зверя. У меня есть брат, на лице которого остались отметины от его когтей. На Фенрисе ничто не безобидно и не смешно, даже барсуки".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Смешное имя для несмешного зверя. У меня есть брат, на лице которого остались отметины от его когтей. На Фенрисе ничто не безобидно и не смешно, даже барсуки.
- guid: 01e206ee-d139-40e2-aacf-18a384927ed1
  event: Companions_Ulfar_45
  text: '{n}Хохот великана бьет в грудь, словно удар акустического орудия.{/n} "Славно! Я хотел поведать о черном проклятьи Вульфена, но твой ответ тоже недурен! Гнев-барсук, ха!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Хохот великана бьет в грудь, словно удар акустического орудия.
  - speaker: Ulfar
    text_clean: Славно! Я хотел поведать о черном проклятьи Вульфена, но твой ответ тоже недурен! Гнев-барсук, ха!
- guid: e5465d2b-6cac-4b50-abf1-4f48b15db978
  event: Companions_Ulfar_46
  text: '"Волки не ждут чужих указаний. Мы чтим старый уклад, а не Кодекс Астартес. Воюем стаями, нас учат и врачуют мудрые жрецы. Вместо лавров мы носим страшащие демонов маски, храним старую веру, владеем чарами Фенриса и носим прозвища, обладающие магической силой. Таковы мы!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Волки не ждут чужих указаний. Мы чтим старый уклад, а не Кодекс Астартес. Воюем стаями, нас учат и врачуют мудрые жрецы. Вместо лавров мы носим страшащие демонов маски, храним старую веру, владеем чарами Фенриса и носим прозвища, обладающие магической силой. Таковы мы!
- guid: 1410c6c9-99d2-430d-ba94-a03ffe5232c2
  event: Companions_Ulfar_47
  text: '"Однажды Рунный волк Лаккан поделился с нашими волчьими жрецами тайнами знахарских снадобий, врачующие раны, и секретами волшебных саг. Он научил видеть в брошенных рунах прошлое и будущее, призывать бурю и резать могучие талисманы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Однажды Рунный волк Лаккан поделился с нашими волчьими жрецами тайнами знахарских снадобий, врачующие раны, и секретами волшебных саг. Он научил видеть в брошенных рунах прошлое и будущее, призывать бурю и резать могучие талисманы.
- guid: 92fd110b-165f-45c8-a4bd-c8889b1bfaa7
  event: Companions_Ulfar_48
  text: '{n}Ульфар пожимает плечами.{/n} "Всеотец — не бог. Он — лучший из людей, наш совершенный прародитель. В жилах Лемана Расса текла его кровь, а в моих течет кровь Расса. Что же, я — тоже бог? Я бесконечно чту его и готов умереть за него, но... при чем тут вера? Разве Всеотец похож на огромного Железного волка, чья шерсть — скалы на поверхности Фенриса?"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар пожимает плечами.
  - speaker: Ulfar
    text_clean: Всеотец — не бог. Он — лучший из людей, наш совершенный прародитель. В жилах Лемана Расса текла его кровь, а в моих течет кровь Расса. Что же, я — тоже бог? Я бесконечно чту его и готов умереть за него, но... при чем тут вера? Разве Всеотец похож на огромного Железного волка, чья шерсть — скалы на поверхности Фенриса?
- guid: 2148d7f3-6baf-41f8-8dd1-3f186cfbb6ab
  event: Companions_Ulfar_49
  text: '"В Великих волков. В смертоносного Черногрива и неистового Дрекана Громоволка, в стойкого Хаэгра, Горного волка, и Кровавого охотника. В Крадущегося между звезд, что всюду следует за нами, и жуткого двуглавого Моркаи, стража царства мертвых. Одни Великие волки более расположены к нам, другие — более зловредны, но каждый дарует нам свой урок. За это мы славим и помним их".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: В Великих волков. В смертоносного Черногрива и неистового Дрекана Громоволка, в стойкого Хаэгра, Горного волка, и Кровавого охотника. В Крадущегося между звезд, что всюду следует за нами, и жуткого двуглавого Моркаи, стража царства мертвых. Одни Великие волки более расположены к нам, другие — более зловредны, но каждый дарует нам свой урок. За это мы славим и помним их.
- guid: bac98e49-97f9-456e-aca9-6a8abb6f4c78
  event: Companions_Ulfar_50
  text: '"Точно? А я как раз собирался завершить рассказ краткой сагой на четыреста строф о дарах Рунного волка Лаккана".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Точно? А я как раз собирался завершить рассказ краткой сагой на четыреста строф о дарах Рунного волка Лаккана.
- guid: 7ba536cd-f2d6-4f7d-9570-9f898b355b6b
  event: Companions_Ulfar_51
  text: '"Всеотец наделил его самодовольством, слишком большим для его хилого тела и незначительной судьбы. Когда мы прибыли в Простор, он был дерзок... пока не понял, что нить его готова оборваться в когтях моих своенравных братьев".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Всеотец наделил его самодовольством, слишком большим для его хилого тела и незначительной судьбы. Когда мы прибыли в Простор, он был дерзок... пока не понял, что нить его готова оборваться в когтях моих своенравных братьев.
- guid: 8fd45709-5acc-4485-9227-962a0b5504f1
  event: Companions_Ulfar_52
  text: '"Как помог{mf||ла} мне сложить славную песнь в бою против Крика скверны — помнишь? Спев ее до конца, я понял, что связь моя с братьями крепче, чем усталость и горе".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Как помог мне сложить славную песнь в бою против Крика скверны — помнишь? Спев ее до конца, я понял, что связь моя с братьями крепче, чем усталость и горе.
- guid: c244b9d1-44b2-424d-893f-6855ef30ad91
  event: Companions_Ulfar_53
  text: '"Помнишь ли ты, как в шпиле Опустошительной бури меня обуяла ярость, а ты напомнил{mf||а} мне, за кого мне должно сражаться?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Помнишь ли ты, как в шпиле Опустошительной бури меня обуяла ярость, а ты напомнил мне, за кого мне должно сражаться?
- guid: a9c3ff59-2759-4033-8ca3-36ce07dd0a17
  event: Companions_Ulfar_54
  text: '"Когда я рассказал тебе о смерти своих братьев, Арнульфа и Скьядди, ты отдал{mf||а} должное их отваге, и я на мгновение будто очутился дома, на Фенрисе. И я захотел вернуться туда".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Когда я рассказал тебе о смерти своих братьев, Арнульфа и Скьядди, ты отдал должное их отваге, и я на мгновение будто очутился дома, на Фенрисе. И я захотел вернуться туда.
- guid: 9f8209b7-0d31-4cb7-afe7-0a87b8eed267
  event: Companions_Ulfar_55
  text: '"А когда мы стояли над телом моего брата Игнильфа... ты произнес{mf||ла} верные слова. Напомнил{mf||а} мне о моем мире. И я осознал, что не готов проститься с надеждой вновь узреть его".'
  speaker: Ulfar
  parts:
