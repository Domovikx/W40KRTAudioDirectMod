  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Помнишь ли ты песнь, что помог сложить в битве с Криком скверны? Стылая печаль была в каждой ее строфе. Тогда я, должно быть, впервые узрел уготованный мне путь.
- guid: c512cc26-7260-4059-97af-4a6f779a6056
  event: Companions_Ulfar_57
  text: '"Когда в шпиле Опустошительной бури гнев обуял меня, ты сказал{mf||а}, что мой долг — мстить за товарищей, убивать ксеносов... И ты был{mf||а} прав{mf||а}. Не важно, один я или с братьями — долг мой неизменен".'
