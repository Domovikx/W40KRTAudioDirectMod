  text: '"Этот Тервантьяс, похоже, не такой мудрец, каким любит казаться, раз позволил выпустить меня из клетки. Ну, ему же хуже". {n}Гигант разминает плечи, и вы слышите громкий треск суставов. Он поднимает с пола украшенный алыми рунами боевой нож — похоже, единственное оставленное ему имущество. Взвесив его в руке и скептически нахмурившись, Волк произносит:{/n} "Добрая сталь у меня найдется, но, если мы выходим на охоту, мне понадобится моя шкура".'
