  text: '{n}Ульфар произносит трескучим, словно ломающийся камень, голосом:{/n} "Когда я одолел мрак Вульфена в душе, я направился к Клыку. Каждый новичок в том странствии переживает охоту. Кто-то сражается с грозным волком, кто-то — с коварным снежным вирмом. Я же встретил... Доппельгренделя. Хитрого и злопамятного духа".'
