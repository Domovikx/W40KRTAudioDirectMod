  event: ''
  text: '"От взора моего было сокрыто, какой я одержал победу, но устрашило меня не это... Взор черного волка был страшен. В нем была такая боль, какую сам он никогда бы не смог причинить. Она сводила его с ума, превращала в чудовище. И, сколь бы ни мрачен был его образ, я... узнаю себя в нем. Ведь я создан для разрушения, терзания, истребления. Я — ловчее чудовище. Значит ли это, что, по замыслу Всеотца, я должен испить эту чашу боли до дна, чтобы соответствовать его замыслу? Не знаю". {n}Ульфар загадочно смотрит на вас.{/n}'
