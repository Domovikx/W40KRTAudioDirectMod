  event: ''
  text: '{n}Ульфар взрывается яростным ревом, лицо его краснеет.{/n} "Что ты можешь знать о том, каково пребывать воителю Всеотца среди смертных?! Вы — мои боевые товарищи, почти стая мне! Но на вас нет благословения Расса, и для моей крови вы чужаки! Думаешь, мне нравится молчать, когда дело доходит до секретов Волков?! Думаешь, я из той породы скрытных хитрецов, чьи мысли ползают, подобно увертливым гадюкам?! Мне противно это!"'
