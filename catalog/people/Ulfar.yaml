- guid: 0031f351-7b6a-4f47-a070-4d871bb1c594
  event: ''
  text: '{n}Ульфар дарит вам пронзительный, исполненный горечи взгляд, и подхватив ваши слова, хрипит:{/n}

    "Много есть страхов во мраке вселенной,

    Но ужас — один. Это Волки Расса".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар дарит вам пронзительный, исполненный горечи взгляд, и подхватив ваши слова, хрипит:'
  - speaker: Ulfar
    text_clean: Много есть страхов во мраке вселенной, Но ужас — один. Это Волки Расса.
- guid: 0180852b-de3b-46a6-8059-d719ed2be0a6
  event: ''
  text: '{n}Уставившись в глаза Вортену, Ульфар мрачно рычит:{/n} "Инстинкт говорит, что наш долг еще не выполнен до конца". {n}Ульфар переводит на вас выжидающий взгляд. Пальцы отведенной в сторону руки незаметно складываются в знак. Жест этот, один из самых универсальных среди немых языков Империума, означает "готов атаковать по команде".{/n}'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Уставившись в глаза Вортену, Ульфар мрачно рычит:'
  - speaker: Ulfar
    text_clean: Инстинкт говорит, что наш долг еще не выполнен до конца.
  - speaker: narrator
    text_clean: Ульфар переводит на вас выжидающий взгляд. Пальцы отведенной в сторону руки незаметно складываются в знак. Жест этот, один из самых универсальных среди немых языков Империума, означает "готов атаковать по команде".
- guid: 02967a8b-4878-4f4e-b1a0-afa9284851e4
  event: ''
  text: '"Прежде, чем их грязные лапы коснутся священной брони с Фенриса, в этом теле не останется и капли крови!" {n}Ульфар бьет себя в грудь латным кулаком.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Прежде, чем их грязные лапы коснутся священной брони с Фенриса, в этом теле не останется и капли крови!
  - speaker: narrator
    text_clean: Ульфар бьет себя в грудь латным кулаком.
- guid: 0abd71d3-3e50-4b79-9dc8-29a4223db7ec
  event: ''
  text: '"По стати узнаю вожака и настоящего воина. Да, все еще недостойного жить ксеноса, но — воина. Спорю, что этот благородный безумец битвы падет от моей руки!" {n}Ульфар обводит отряд радостным взглядом, словно ожидает, что кто-то примет его пари.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: По стати узнаю вожака и настоящего воина. Да, все еще недостойного жить ксеноса, но — воина. Спорю, что этот благородный безумец битвы падет от моей руки!
  - speaker: narrator
    text_clean: Ульфар обводит отряд радостным взглядом, словно ожидает, что кто-то примет его пари.
- guid: 0eecf3ed-5752-49e3-a1f8-8bb980c2cfd5
  event: ''
  text: '{n}Ульфар, насупившись, тихо отвечает:{/n} "Ты — достойный соратник. Я не желал вреда тебе и твоим близким, железный жрец".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар, насупившись, тихо отвечает:'
  - speaker: Ulfar
    text_clean: Ты — достойный соратник. Я не желал вреда тебе и твоим близким, железный жрец.
- guid: 17dfc8c9-929a-4980-a6ba-c7c9d66a1765
  event: ''
  text: '"Прости, брат, но я вынужден отклонить твое предложение, хоть сердце мое и наполняется радостью от мысли биться с вами". {n}Ульфар достает украшенный алыми рунами нож и взрезает ладонь.{/n} "Я, Ульфар Громогласный, перед Черногривом клянусь кровью Фенриса, что не прекращу искать свою стаю, пока не узрю их живыми или же усопшими".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Прости, брат, но я вынужден отклонить твое предложение, хоть сердце мое и наполняется радостью от мысли биться с вами.
  - speaker: narrator
    text_clean: Ульфар достает украшенный алыми рунами нож и взрезает ладонь.
  - speaker: Ulfar
    text_clean: Я, Ульфар Громогласный, перед Черногривом клянусь кровью Фенриса, что не прекращу искать свою стаю, пока не узрю их живыми или же усопшими.
- guid: 19f143c8-cd92-4c84-a7c4-6ef76d20028f
  event: ''
  text: '{n}Ульфар делает небрежный жест, и двое безмолвных слуг почтительно отступают, дабы не мешать вашей беседе.{/n} "Эттфатер, я должен поблагодарить тебя за спасение. Мне выпала нелегкая битва".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар делает небрежный жест, и двое безмолвных слуг почтительно отступают, дабы не мешать вашей беседе.
  - speaker: Ulfar
    text_clean: Эттфатер, я должен поблагодарить тебя за спасение. Мне выпала нелегкая битва.
- guid: 1d2c4989-e4e0-4636-8c8c-916386aab3fe
  event: ''
  text: '{n}Ульфар улыбается, но улыбка эта принадлежит покойницкому черепу.{/n} "Уйду так далеко, как смогу. Заберусь в темные дали, в самое логово скверны, а уж там... Там я закончу свою охоту. И начнет охоту Зверь. Не летай за мной, эттфатер. Не риску".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар улыбается, но улыбка эта принадлежит покойницкому черепу.
  - speaker: Ulfar
    text_clean: Уйду так далеко, как смогу. Заберусь в темные дали, в самое логово скверны, а уж там... Там я закончу свою охоту. И начнет охоту Зверь. Не летай за мной, эттфатер. Не риску.
- guid: 1ed4d65c-fb34-4d46-9e31-2b44e105a471
  event: ''
  text: '"...памятью став над могилами братьев достойных".

    {n}Ульфар поднимает на вас замутненный тоской взгляд.{/n} "Арнульфу и Скьядди бы понравился такой финал".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: '...памятью став над могилами братьев достойных.'
  - speaker: narrator
    text_clean: Ульфар поднимает на вас замутненный тоской взгляд.
  - speaker: Ulfar
    text_clean: Арнульфу и Скьядди бы понравился такой финал.
- guid: 29d95419-c08d-4e20-91bb-8211c442e974
  event: ''
  text: '{n}Ульфар мрачно качает головой.{/n} "Не преданность Всеотцу вела мою руку. Лишь черная злоба Вульфена".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар мрачно качает головой.
  - speaker: Ulfar
    text_clean: Не преданность Всеотцу вела мою руку. Лишь черная злоба Вульфена.
- guid: 2b626c59-2929-4eb4-bc02-b937ce052133
  event: ''
  text: '{n}Ульфар бросает пронзительный взгляд на миролюбиво улыбающегося Торбальда, и лицо его темнеет, а голос становится низким, переходящим в звериное рычание:{/n} "Ты из ума выжил, Торбальд?!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар бросает пронзительный взгляд на миролюбиво улыбающегося Торбальда, и лицо его темнеет, а голос становится низким, переходящим в звериное рычание:'
  - speaker: Ulfar
    text_clean: Ты из ума выжил, Торбальд?!
- guid: 39a1737d-695a-42ff-904e-133d53c5e6ae
  event: ''
  text: '{n}Ульфар переводит одобрительный взгляд с вашего двойника на вас, а затем тихо бурчит в бороду:{/n} "Ну нет! Он{mf||а} все-таки твой эттфатер. Сменить сторону было бы... Ну нет!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар переводит одобрительный взгляд с вашего двойника на вас, а затем тихо бурчит в бороду:'
  - speaker: Ulfar
    text_clean: Ну нет! Он все-таки твой эттфатер. Сменить сторону было бы... Ну нет!
- guid: 3a1a7f13-6a55-4e1a-b1dc-aaa70e37a7d6
  event: ''
  text: '"...славит воителей Фенриса, гордую свору".

    {n}Ульфар задумчиво повторяет ваши слова, а затем усмехается.{/n} "Неплохо сказано, {name}. В нашем, волчьем, духе".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: '...славит воителей Фенриса, гордую свору.'
  - speaker: narrator
    text_clean: Ульфар задумчиво повторяет ваши слова, а затем усмехается.
  - speaker: Ulfar
    text_clean: Неплохо сказано, КЭП. В нашем, волчьем, духе.
- guid: 3ad512f7-142f-4ef2-bd2d-741524be2e85
  event: ''
  text: '"Злой дух. Он напал со спины и сразу ранил меня". {n}Ульфар указывает на особо жуткий рубец на груди — удар был нацелен в одно из двух сердец Астартес. От раны едко пахнет неведомым вам лекарством — скорее всего, фенрисийским бальзамом, сваренным самим Ульфаром. Ваши лекари попадали бы в обморок от одного запаха подобного снадобья.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Злой дух. Он напал со спины и сразу ранил меня.
  - speaker: narrator
    text_clean: Ульфар указывает на особо жуткий рубец на груди — удар был нацелен в одно из двух сердец Астартес. От раны едко пахнет неведомым вам лекарством — скорее всего, фенрисийским бальзамом, сваренным самим Ульфаром. Ваши лекари попадали бы в обморок от одного запаха подобного снадобья.
- guid: 3bb77877-f7d9-4af3-ab15-013537961a35
  event: ''
  text: '{n}Ульфар утирает с лица пахнущую машинной смазкой кровь и разражается оглушительным хохотом. Кажется, что сама твердь трясется от этого могучего проявления счастья.{/n}

    "Смотри, Всеотец, сколь коротко мужество труса,

    Сменились дерзкие гимны мольбой о спасении!

    Но заняты длани мои тяжким оружием,

    И нету в них милости места, и нет в них пощады!"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар утирает с лица пахнущую машинной смазкой кровь и разражается оглушительным хохотом. Кажется, что сама твердь трясется от этого могучего проявления счастья.
  - speaker: Ulfar
    text_clean: Смотри, Всеотец, сколь коротко мужество труса, Сменились дерзкие гимны мольбой о спасении! Но заняты длани мои тяжким оружием, И нету в них милости места, и нет в них пощады!
- guid: 3e60954e-b08e-402c-aa67-f4af8201f1ca
  event: ''
  text: '"Благодарю тебя за подарок, достойный варагира, Железношкурый". {n}Ульфар взвешивает в руке новое оружие, и на лице его возникает то довольное выражение, что бывает лишь на лицах истинных воинов, нашедших себе идеальное оружие по руке.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Благодарю тебя за подарок, достойный варагира, Железношкурый.
  - speaker: narrator
    text_clean: Ульфар взвешивает в руке новое оружие, и на лице его возникает то довольное выражение, что бывает лишь на лицах истинных воинов, нашедших себе идеальное оружие по руке.
- guid: 3e6deb91-4073-4acb-b0e6-9936e055e4c9
  event: ''
  text: '"Мои братья". {n}Ульфар склоняется над телами, закованными в керамит и адамантиум. Рыжие брови страдальчески изломились.{/n} "Вновь судьба не дала мне отправиться в чертог Всеотца с моими братьями".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мои братья.
  - speaker: narrator
    text_clean: Ульфар склоняется над телами, закованными в керамит и адамантиум. Рыжие брови страдальчески изломились.
  - speaker: Ulfar
    text_clean: Вновь судьба не дала мне отправиться в чертог Всеотца с моими братьями.
- guid: 3e79bafc-ec2c-4171-9739-2e04db45c674
  event: ''
  text: '"Какой еще в кракенову задницу товарищ?" {n}Ульфар недоумевающе пожимает плечами.{/n} "Я — потомок Всеотца, а он — мерзкий нелюдь. Сравни меня и нож из честной пластали, сломавшийся в руке гемункула — и то больше сходства найдется, чем с этим выродком. Пусть страдает — ты же видишь, что он не из простых, значит, успел совершить достаточно гнусностей за свою жизнь".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Какой еще в кракенову задницу товарищ?
  - speaker: narrator
    text_clean: Ульфар недоумевающе пожимает плечами.
  - speaker: Ulfar
    text_clean: Я — потомок Всеотца, а он — мерзкий нелюдь. Сравни меня и нож из честной пластали, сломавшийся в руке гемункула — и то больше сходства найдется, чем с этим выродком. Пусть страдает — ты же видишь, что он не из простых, значит, успел совершить достаточно гнусностей за свою жизнь.
- guid: 47352ea7-7940-4980-a9d4-22bb6cc2c121
  event: ''
  text: '{n}Ульфар одобрительно ворчит:{/n} "Гостеприимство — знамя достойного племени. Уважение к духам — знамя мудрого. Приятная планета".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар одобрительно ворчит:'
  - speaker: Ulfar
    text_clean: Гостеприимство — знамя достойного племени. Уважение к духам — знамя мудрого. Приятная планета.
- guid: 4ae263c6-e6f2-4fa2-997f-ac7703e8f322
  event: ''
  text: '"Фенрис йольда, эттфатер". {n}Ульфар торжественно и почтительно склоняет голову — невиданная честь для смертно{mf|го|й}, что подвигами своими смог{mf||ла} впечатлить Ангела Императора.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Фенрис йольда, эттфатер.
  - speaker: narrator
    text_clean: Ульфар торжественно и почтительно склоняет голову — невиданная честь для смертного, что подвигами своими смог впечатлить Ангела Императора.
- guid: 4dcd52dc-7208-4a95-8f92-357f029538d6
  event: ''
  text: '{n}Ульфар строго и по-деловому уточняет:{/n} "Подношения охотничьей добычи? Охранные обереги на тропах?" {n}Получив утвердительный ответ, он солидно и удовлетворенно кивает.{/n}'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар строго и по-деловому уточняет:'
  - speaker: Ulfar
    text_clean: Подношения охотничьей добычи? Охранные обереги на тропах?
  - speaker: narrator
    text_clean: Получив утвердительный ответ, он солидно и удовлетворенно кивает.
- guid: 532b0595-122d-4aae-b926-afe59d67fbd4
  event: ''
  text: '"Выбирай слова осторожно. Не все Вольные Торговцы одинаково приятны мне". {n}Ульфар дарит Каллигосу вызывающую улыбку, дышащую призывом к немедленной драке.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Выбирай слова осторожно. Не все Вольные Торговцы одинаково приятны мне.
  - speaker: narrator
    text_clean: Ульфар дарит Каллигосу вызывающую улыбку, дышащую призывом к немедленной драке.
- guid: 53758432-76d6-4724-8b73-660b34b1813b
  event: ''
  text: '{n}Ульфар с разочарованным вздохом бьет латным кулаком о доспех.{/n} "Не по мне это, прекращать бой, пока ксенос стоит на ногах... Ну да ничего, нелюдь худосочная, будет у нас еще возможность завершить дело".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар с разочарованным вздохом бьет латным кулаком о доспех.
  - speaker: Ulfar
    text_clean: Не по мне это, прекращать бой, пока ксенос стоит на ногах... Ну да ничего, нелюдь худосочная, будет у нас еще возможность завершить дело.
- guid: 57767485-c3ba-4396-97ff-3db196ad1055
  event: ''
  text: '{n}Ульфар недобро осклабивается.{/n} "Молись, чтобы следующая моя виса не была о том, как надменн{mf|ый|ая} Вольный Торговец поплатил{mf|ся|ась} за дерзость. Тебе она не понравится".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар недобро осклабивается.
  - speaker: Ulfar
    text_clean: Молись, чтобы следующая моя виса не была о том, как надменный Вольный Торговец поплатился за дерзость. Тебе она не понравится.
- guid: 59e28851-29e0-4aa0-83ba-c61ce3376c30
  event: ''
  text: '{n}Ульфар тяжело басит, отводя глаза.{/n} "Я тоже был там. Сражался против тех, кого обвинил Калькасар".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар тяжело басит, отводя глаза.
  - speaker: Ulfar
    text_clean: Я тоже был там. Сражался против тех, кого обвинил Калькасар.
- guid: 5ce9346b-ee66-49f5-a7c9-a0546292ab56
  event: ''
  text: '"О! Бесстрашная, могучая, с сердцем холодным словно камень! Достойная соперница, не чета убогим ксеносам и смердящим еретикам! Сразить тебя будет славно!" {n}Ульфар приветствует убийцу Калькасара самой доброй улыбкой, что вы когда-либо видели на его лице.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: О! Бесстрашная, могучая, с сердцем холодным словно камень! Достойная соперница, не чета убогим ксеносам и смердящим еретикам! Сразить тебя будет славно!
  - speaker: narrator
    text_clean: Ульфар приветствует убийцу Калькасара самой доброй улыбкой, что вы когда-либо видели на его лице.
