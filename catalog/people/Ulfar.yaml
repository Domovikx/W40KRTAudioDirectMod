name: Ульфар Громолёт
gender: M
role: Космический Волк
age: ''
personality: грубый, воинственный
sound_keys:
- Ulfar
total_phrases: 286
phrases:
- guid: f797ca65-3a97-40fb-8cf1-dba2c675581a
  event: BNTRS_AreaStressful_Ulfar_166
  text: '"Здесь была великая сеча. Столько храбрых душ пало, что их гнев обрушил сами своды этого склепа!"'
  speaker: null
- guid: 45599cbe-c721-4744-a242-6f9a34067bc5
  event: BNTRS_Chapter3_Ulfar_110
  text: '"Пусть приходят — не придется выискивать этих трусливых выродков по их темным норам".'
  speaker: null
- guid: 467ea8e7-dedb-459b-8753-7b62063242ab
  event: BNTRS_Chapter3_Ulfar_118
  text: '"Славно слышать столь чистый и праведный голос, сестра в бранном служении! Будем биться с нечистью плечом к плечу,
    сын Расса и дочерь Всеотца!"'
  speaker: null
- guid: 9b6a8aa5-84e1-492c-8105-4f522fe4d669
  event: BNTRS_Chapter3_Ulfar_120
  text: '"Не позволь своему змеиному языку изречь скверну сомнения в словах воина Всеотца. И тебе будет позволено носить его
    дальше".'
  speaker: null
- guid: 740caf30-3763-4304-b47a-cab69743a03a
  event: BNTRS_Chapter3_Ulfar_121
  text: '"Хм. Готи, а я ведь тебя видел. Ты прислуживала проклятой немочи Тервантьясу. Не по вкусу тебе милость ксеносская,
    раз решилась на побег?"'
  speaker: null
- guid: 9973c519-cc72-4c37-a078-3d0c800671e3
  event: BNTRS_Chapter3_Ulfar_124
  text: '"Тебя не искрошили в куски лишь потому, что эттфатер решил{mf||а} завести ручного ксеноса. Так что, немочь поганая,
    помалкивай, пока я тебя не заткнул".'
  speaker: null
- guid: 209d8b0f-f0f4-4d18-b59e-e994f77807b9
  event: BNTRS_Chapter3_Ulfar_125
  text: '"Бойцовая невольница-нелюдь? Эттфатеру стоит водить тебя на поводке, ксеносская погань, чтобы ты не забывала свое
    место".'
  speaker: null
- guid: 0723ecbf-7168-40b9-838b-c2d58c7cc071
  event: BNTRS_Chapter3_Ulfar_17
  text: '"Лживые ксеносы играют нами словно марионетками... Я чую, что новые тенета мерзких интриг сплетаются вокруг наших
    дланей!"'
  speaker: null
- guid: de64aebf-f152-4a27-9eff-1b8b02fd2af0
  event: BNTRS_Chapter4_Ulfar_06
  text: '"Ничего, как отыщу своих братьев, выследим со стаей этих усохших нелюдей и передавим, как яйца снежного змия! Никто
    не уйдет!"'
  speaker: null
- guid: a49dc0d5-340d-4395-98e6-595c585110c7
  event: BNTRS_Chapter4_Ulfar_112
  text: '"Кормчей душ не пристало переживать из-за обманов выродков-нелюдей. Страх — трещина в броне душе, и сквозь нее может
    проникнуть клякса скверны, что запачкает сердце и ум!"'
  speaker: null
- guid: f266d7b8-1a69-4c2f-97b2-fd7da4d136db
  event: BNTRS_Chapter4_Ulfar_120
  text: '"Ежели человек носит в своей голове слишком много грязных секретов, что удивительного, что в грязи заведутся паразиты
    и изъязвят мысли".'
  speaker: null
- guid: cf5b47c1-e477-4cc1-bb79-009f6250729b
  event: BNTRS_Chapter4_Ulfar_126
  text: '"Тебе на роду написано быть готи, проклятой душой, знающейся с духами. Хотел бы Всеотец тебе иного пути, сплел бы
    судьбу получше. Не противься року".'
  speaker: null
- guid: c4e03fa2-ae54-4664-b983-0a42ccc2c86e
  event: BNTRS_Chapter4_Ulfar_149
  text: '"Ты пошел путем воина, жрец. Воину должно быть беспощадным, но речь не о беспощадности к врагу. Главное — беспощадность
    к себе!"'
  speaker: null
- guid: 6ba304c6-bbdd-4f53-aadb-b0d1c436f37e
  event: BNTRS_Chapter4_Ulfar_15
  text: '"А, шакаленок, не любишь быть в неведении? За столом этим славно сидеть лишь с одной стороны?"'
  speaker: null
- guid: 3c79c1f7-672f-4709-ad49-2f14a614e012
  event: BNTRS_Chapter4_Ulfar_154
  text: '"Славный вышел пир в честь победы над слугами Архиврага! Эттфатер, за гостеприимство я обещаю однажды оказать тебе
    честь и пригласить на торжество на Фенрисе!"'
  speaker: null
- guid: 0283bb47-8b0f-4207-ac78-9075a56ec11b
  event: BNTRS_Chapter4_Ulfar_157
  text: '"Виса о моей славной победе над Криком скверны уже складывается в сердце моем! И вы, счастливцы, сейчас услышите
    ее начало..."'
  speaker: null
- guid: 127c233b-046e-46e2-8042-122fe1690e8e
  event: BNTRS_Chapter4_Ulfar_162
  text: '"Воистину, жрец. Твои собратья также не опозорили себя и не слишком мешали нам, воинам Всеотца, в сражении".'
  speaker: null
- guid: 8e7180b2-6f3d-4bc7-aee5-1cf2a579a698
  event: BNTRS_Chapter4_Ulfar_165
  text: '"Какой коварной и изворотливой душонкой ты обладаешь, нелюдь. Прикидываешься, что способна испытывать чувства, пытаешься
    усыпить нашу бдительность. Но я все равно вижу лишь худородное отродье с холодным сердцем".'
  speaker: null
- guid: 7ae60183-97ae-4428-9201-e25c5058ea71
  event: BNTRS_Chapter4_Ulfar_170
  text: '"Туда вам и дорога, нелюдь. Даст Всеотец, узрим мы еще не один ваш богохульный мир-корабль, пылающий под нашими выстрелами".'
  speaker: null
- guid: 7a971117-81c4-439d-ae12-dcce8e7c47d3
  event: BNTRS_Chapter4_Ulfar_21
  text: '"Не стоит недооценивать волшебную силу клятв. Духи уважают тех, кто дает весомые обеты, это знает каждый на Фенрисе".'
  speaker: null
- guid: cda63895-2c1e-4994-972d-8b31d7b9637e
  event: BNTRS_Chapter4_Ulfar_39
  text: '"Твой хозяин просто нашел полезного мясника, чтобы спихнуть на него грязную работу и не марать руки. Как и всегда
    вы делаете".'
  speaker: null
- guid: aa0c8a19-3e30-477b-84b1-10571c334e62
  event: BNTRS_Chapter4_Ulfar_55
  text: '"Хах! А ведь я обещал этому презренному мясорезу Тервантьясу, что увижу, как он подыхает! И не солгал... О, проклятье.
    Я же еще обещал помочиться на его труп!"'
  speaker: null
- guid: ee7c4edd-a093-4814-bd26-988fcea14792
  event: BNTRS_Chapter4_Ulfar_66
  text: '"Дружина наша покинула Темный город достойно! Нескоро они позабудут, как гостили в Комморре эттфатер и Ульфар! С
    удовольствием бы взглянул, как корчатся их малохольные душонки в вызванной нами буре душ!"'
  speaker: null
- guid: 6321c90b-dd8b-4fc5-8aff-229d25dedfc4
  event: BNTRS_Chapter4_Ulfar_72
  text: '"Этот Винтерскейл было ничего такой, ведал радость битвы, не трусил... но все же мелковат".'
  speaker: null
- guid: 1391042f-4969-4fef-bd1d-1317020a5f2f
  event: BNTRS_Chapter4_Ulfar_78
  text: '"Хитрый паук этот Калькасар. Явно замыслил какое-то тайное дело, в коем мы послужим ему орудием. Коварен, словно
    ксенос!"'
  speaker: null
- guid: 30f486cd-1ffb-45db-a76c-52782ee44435
  event: BNTRS_Chapter4_Ulfar_97
  text: '"Теперь ты ведаешь ее сагу до конца. Храни ее и неси другим, не дай подвигам былым в забвенье пасть, сестра".'
  speaker: null
- guid: 7c8a9ba5-6d84-475d-8a18-cee031d8afbd
  event: BNTRS_Chapter5_Ulfar_15
  text: '"Гхрм... Ценю это. Ладно, если твое слово чего-то стоит, то, может быть, ты и не такой гаденыш, как мне показалось
    сначала".'
  speaker: null
- guid: ea1c0d23-2505-4b1e-a4f9-bbe318c6bfa4
  event: BNTRS_Chapter5_Ulfar_17
  text: '"К чему им заклинания? Мои братья и без них найдут свой путь, сестра. Деяния их весомее наших слов".'
  speaker: null
- guid: 00c1eb1d-2c29-4192-8ce8-ef864ad4a1c6
  event: BNTRS_Chapter5_Ulfar_19
  text: '"Я узнаю, кто обрек на гибель моих братьев, и строго спрошу с них! Даю клятву!"'
  speaker: null
- guid: ee62e656-567f-44cc-a676-43fb627c9c9d
  event: BNTRS_Companion_DLC3_Ulfar_138
  text: '"С кем ты постоянно говоришь, железный муж? Не вижу и не чую подле тебя собеседника. Уж не с черепом ли ты толкуешь
    о премудростях?"'
  speaker: null
- guid: 170aba29-fea5-4122-ac54-4793f6163a47
  event: BNTRS_Companion_DLC3_Ulfar_39
  text: '"Я чую, что ты боишься чужой смерти, мудрец. Кислый запах страха разливается в воздухе всякий раз, как опасность
    грозит сервочерепу, именуемому Нунциусом. Растолкуй же мне, отчего тебя столь страшит гибель того, кто и так давно мертв?"'
  speaker: null
- guid: 9e84b9ee-cf48-4348-97e4-cbbe512675ba
  event: BNTRS_Companion_DLC3_Ulfar_60
  text: '"Хо! Да ты, железный мудрец, скрываешь под своей раздутой скорлупой душу, исполненную меда поэзии, раз старательно
    выправил огрехи в висе вместо того, чтобы лукавить и утверждать, что она услаждает слух и в первозданном виде. По нраву
    мне сие!"'
  speaker: null
- guid: e1d5daef-d52b-4aae-a1b6-df19a170398b
  event: BNTRS_DLC2_Ulfar_102
  text: '"Унылая забава. Хорош только тот суд, что заканчивается поединком правосудия — один на один, в кругу щитоносцев,
    под славную песнь!"'
  speaker: null
- guid: badbe79f-08a2-4ec4-9dbf-6a18b6f21637
  event: BNTRS_DLC2_Ulfar_127
  text: '"Законодержец был верен своему писанию, за него сражался и умер. Непоколебим оставался до конца — достойная погибель
    для обычного смертного".'
  speaker: null
- guid: 29a68909-ebd4-4d36-87f5-3eef55cbf456
  event: BNTRS_DLC2_Ulfar_135
  text: '"Что, законодержец, эттфатер наделил{mf||а} тебя великой властью? Выйдешь ли ты еще на поле брани, или удовольствуешься
    теплыми покоями?"'
  speaker: null
- guid: d373f685-a1ef-4aa4-9000-686e6af1b03d
  event: BNTRS_DLC2_Ulfar_146
  text: '"Что, ищейка, не любишь делить территорию с другими псами? Этот хотя бы не изворотлив и ведает о чести".'
  speaker: null
- guid: 3b562014-7e7a-4412-8ea0-def841e8ed3e
  event: BNTRS_DLC2_Ulfar_151
  text: '"Это ладья, которую надобно добыть для эттфатера? Ха, хватит на один зуб для могучего волка!"'
  speaker: null
- guid: f4a28034-5a2b-423f-9427-3844220a21a2
  event: BNTRS_DLC2_Ulfar_178
  text: '"Страшная участь — зачахнуть в плену, вдали от бранного поля. Мне было б стыдно взглянуть в глаза Всеотцу, встреть
    я подобный конец".'
  speaker: null
- guid: 67d1faaf-ad55-40b8-bd66-55b32496c4b8
  event: BNTRS_DLC2_Ulfar_180
  text: '"Вот это — чудовища? Да это ксеносские козявки! Прячься, если дрогнул, а гордый сын Фенриса идет охотиться".'
  speaker: null
- guid: 5e9ea42f-b075-429f-8cf9-7e94635520a5
  event: BNTRS_DLC2_Ulfar_222
  text: '"Не страшись меня, законодержец. Не оплошай в сражении, и справедливый гнев мой не падет на тебя".'
  speaker: null
- guid: ca085235-fe1c-476a-89ff-71a9d30c2dbf
  event: BNTRS_DLC2_Ulfar_223
  text: '"Не страшись, боевой пес. Теперь мы — часть одной стаи".'
  speaker: null
- guid: ddf3528e-4b88-4269-9445-1c358c5c6b5e
  event: BNTRS_DLC2_Ulfar_274
  text: '"Даже пес иногда может подхватить волчий вой. Твои слова достигли моего сердца, законодержец".'
  speaker: null
- guid: 4245e743-9529-45bd-a711-9530016d0d43
  event: BNTRS_DLC2_Ulfar_38
  text: '"С чего мне гневаться? Зверь чует страх хозяина, вот и скалит клыки. А ты меня боишься, законодержец, как пес — фенрисийского
    волка".'
  speaker: null
- guid: 8f62ff2f-511e-44cd-ae31-c5a1d84bfafe
  event: BNTRS_DLC2_Ulfar_41
  text: '"Пес, конечно, славный спутник, да только куда собаке до волка? Вот где ярость, вот где сила и удаль!"'
  speaker: null
- guid: d64e8c2b-9059-4cfa-8dbd-a010647d8583
  event: BNTRS_DLC2_Ulfar_64
  text: '"Он пал, когда вместо боевых соратников стал слушать нашептывания иссохшей гадюки. Какой позор для воина!"'
  speaker: null
- guid: 01951bf4-475e-45ea-ad56-4ecffc99c5df
  event: BNTRS_DLC2_Ulfar_75
  text: '"Славная вышла сеча, да вот только без пира на захваченной ладье я не чувствую полного довольства".'
  speaker: null
- guid: 368ae221-49b7-41b1-a34b-5af5ec193d59
  event: BNTRS_DLC3_Ulfar_09
  text: '"Доброе дело — развлечь сына Всеотца хорошей охотой! Мои руки скучают без битвы".'
  speaker: null
- guid: 5904fc74-eccc-4adc-8278-76445a3046d9
  event: BNTRS_DLC3_Ulfar_106
  text: '"Ха! Холод и соленый воздух — это местечко мне по душе. Если бы не вонь горелого прометия и чужого предательства,
    было бы точь-в-точь, как на Фенрисе, когда приходит оттепель".'
  speaker: null
- guid: aa89850b-d1d5-4390-9221-8bd9ab2f3206
  event: BNTRS_DLC3_Ulfar_127
  text: '"Чую запах хорошей охоты. Если здесь есть достойный противник — пусть выйдет и померяется силами с волком! А те,
    кто предпочитает прятаться, мне не ровня".'
  speaker: null
- guid: f1c3bc5f-bb13-403c-a168-84752735be42
  event: BNTRS_DLC3_Ulfar_13
  text: '"Ты снова говоришь загадками, готи. Что значит, "обогнать время"? Ни разу еще не видел врага, которому сначала ты
    сносишь голову, а только потом он от тебя сбегает".'
  speaker: null
- guid: 166b3373-6845-466b-bccd-d6ffdc88b208
  event: BNTRS_DLC3_Ulfar_59
  text: '"Не стоит бояться плодов сечи, слуга — воин страшится лишь трусости, которая не оставляет шрамов!"'
  speaker: null
- guid: 244f8c44-bd57-4514-b456-bfce89b6e6d0
  event: BNTRS_DLC3_Ulfar_74
  text: '"Всеотец улыбается воинам, получившим свои раны в бою. Песни их доблести достигают Его первыми".'
  speaker: null
- guid: 54897cc2-b266-4ce2-93a4-eb46b6be7b57
  event: BNTRS_DLC3_Ulfar_86
  text: '"В толк не возьму, как чужачка может описывать вещи, которые Ангелу Императора видеть не дано? Ты пытаешься затуманить
    мой взгляд, элфкид".'
  speaker: null
- guid: f4e15a5c-ccb1-4220-bf0d-ffb8ba2e1c7f
  event: BNTRS_PickUps_Ulfar_117
  text: '"Дурное место. Давайте принесем Всеотцу щедрую жертву на алтаре песнопений, а затем все тут сожжем".'
  speaker: null
- guid: 05c4e498-7cad-40ab-820c-383992c7bbd1
  event: BNTRS_PickUps_Ulfar_138
  text: '"Проклятье! Эттфатер, неужели твоя ладья настолько хлипкая? Чуть не сгинули позорно!"'
  speaker: null
- guid: dd21877b-3550-40ba-8a6e-3fd73b24d607
  event: BNTRS_PickUps_Ulfar_148
  text: '"Печаль меня берет при виде добрых клинков и стягов, лежащих без дела. Место им на поле брани, а не в ларцах золоченых".'
  speaker: null
- guid: 9439ce0f-dd69-49ca-80bb-1a4141460c62
  event: BNTRS_PickUps_Ulfar_165
  text: '"Ерунда! Глист поганый отправился в пасть Моркаи, а прочие отродья узрели, что их лучшие воины — не чета нам".'
  speaker: null
- guid: 1ddd52cc-8381-48c7-9965-e1f57bb04968
  event: BNTRS_PickUps_Ulfar_170
  text: '"Кровавая весталка, я видел, как ты билась сама с собой. Тяжелое испытание, изуверское — истинное коварство ксеносов".'
  speaker: null
- guid: ad6c739a-550e-4100-a98a-0855e02e2fec
  event: BNTRS_PickUps_Ulfar_214
  text: '"Хм, я не чувствую перемен. Страх наших врагов на запах такой же. Как смердел тухлятиной, так и смердит".'
  speaker: null
- guid: f4dd9231-5a10-4de6-90d1-481bd7d70f24
  event: BNTRS_PickUps_Ulfar_256
  text: '"Стужа здесь, словно ледяной тролль дыхнул — и впрямь навевает воспоминания о Фенрисе... Вот и все сходство. Этот
    мир как стылое забвение, Фенрис же гремит борьбой за жизнь и обещанием славы".'
  speaker: null
- guid: e5d96391-f221-4707-bf34-74b16e80e31c
  event: BNTRS_PickUps_Ulfar_34
  text: '"Дар принят, кровавая весталка. Начертай на моей броне ею руну, восславляющую мою доблесть".'
  speaker: null
- guid: 3ad00d7a-a3cb-4338-91eb-2505510ef7f2
  event: BNTRS_PickUps_Ulfar_41
  text: '"Скажи, кровавая весталка Всеотца... А я..."'
  speaker: null
- guid: 5efb90ad-0f77-4bc4-80c7-10e49238446e
  event: BNTRS_PickUps_Ulfar_47
  text: '"И впрямь. Что он — готи, что ты — готи... Когда от вашего племени порчей-то не пахло".'
  speaker: null
- guid: 69fc33bf-55f0-44b4-9f0c-8d345c9c55de
  event: BNTRS_PickUps_Ulfar_58
  text: '"Которыми ты предсказуемо с нами не поделишься, исполненный коварства паразит".'
  speaker: null
- guid: 49ec690e-678b-4225-9e34-888778adf979
  event: BNTRS_PickUps_Ulfar_75
  text: '"Я скорблю о кровавой весталке. Она была веселая".'
  speaker: null
- guid: df3f5c7c-0fbd-4f56-be16-fbcebec9d3d3
  event: BNTRS_PickUps_Ulfar_85
  text: '"Не унижай ее жалостью. Кровавая весталка идет путем жестоким, но исполненным благородства. Конец его, конечно, будет
    ужасен, но так и должны завершаться достойные сказания".'
  speaker: null
- guid: 4997ffb2-6ccb-4862-95c3-4f510d874781
  event: BNTRS_Reactivity_DLC3_Ulfar_08
  text: '"Клыки Моркаи, ксеносы ответят за свое коварство! Пленник не был мне братом по крови, но он погиб верным сыном Всеотца.
    Железные мертвецы сполна заплатят виру за его смерть".'
  speaker: null
- guid: 7b62d340-eeec-4a2f-b59b-7557da740475
  event: BNTRS_Reactivity_DLC3_Ulfar_17
  text: '"Ты говоришь загадками, кровавая весталка. Но я чую в твоих словах дух правды".'
  speaker: null
- guid: e4e7e97c-1ee7-4c25-aa4e-1d0c568b0056
  event: BNTRS_Reactivity_DLC3_Ulfar_35
  text: '"Хм... если надумаешь выслеживать нелюдь — кинь клич, ищейка. Подлая тварь прячется, зная, что по ее следу идут сыны
    Императора, но от моего нюха ей не укрыться".'
  speaker: null
- guid: ac61f1fa-6113-452d-974d-cad169694eaa
  event: BNTRS_Reactivity_DLC3_Ulfar_40
  text: '"Иначе и быть не могло, чистосердная сестра. Теперь железные ксеносы сполна отхлебнут из чаши гнева Всеотца. Славные
    саги сложат про капитана, что был освобожден эттфатером!"'
  speaker: null
- guid: 653bbcdf-945f-4b4f-9da3-2a99ee7a93ac
  event: BNTRS_Reactivity_DLC3_Ulfar_45
  text: '"Поганая тварь на столетия отняла у прародителя этфаттера радость служения во имя Человечества. Этот воин заслужил
    того, чтобы наконец отыскать славную погибель в бескрайнем Просторе Коронус!"'
  speaker: null
- guid: 9d5a2d49-6e69-4e85-8bca-e8caa3b4357f
  event: BNTRS_Reactivity_DLC3_Ulfar_68
  text: '"Новые владения чем-то напоминают мне родной мир, этфаттер. Помни мои слова: люди, что вышли с него, станут твоими
    вернейшими союзниками и страшнейшими врагами всему, что встанет супротив Человечества".'
  speaker: null
- guid: 05487f34-b6c6-482a-b8d7-19909faa9535
  event: BNTRS_Stressful_Ulfar_106
  text: '"Мьод разъел бы твои желудок и печень, плутовка. Тебе мало аугментов, что уже имеешь? Довольствуйся выпивкой обычных
    смертных".'
  speaker: null
- guid: 97af1b25-642f-4d13-850f-2c70668f2abf
  event: BNTRS_Stressful_Ulfar_124
  text: '"Я — творение Фенриса и Всеотца. Моя плоть от плоти гор Асахейма, вылепленная ветрами Хельвинтра. Который тебя, худосочную
    немочь, сдул бы вмиг прямо в задницу Моркаи".'
  speaker: null
- guid: 917a4eef-41d3-48c3-8e17-72ae31c6b9e0
  event: BNTRS_Stressful_Ulfar_144
  text: '"Да, адамантиумная шкура моя повидала немало битв и несет много славных шрамов! Услышь же славную вису о том.."'
  speaker: null
- guid: 2cc71f35-3f72-4390-9a96-a4c0d09edb24
  event: BNTRS_Stressful_Ulfar_147
  text: '"Моим доспехам не помешает чистка. Эй, старший слуга, распорядись! А я вознагражу тебя славной сагой за усердие!"'
  speaker: null
- guid: 0161f1db-446c-424e-b5e3-7584beef1007
  event: BNTRS_Stressful_Ulfar_149
  text: '"Что ты шепчешь, чистосердная сестра? Заклинание, что придаст сил? Повеление к грозным духам битвы?"'
  speaker: null
- guid: 58ac0cd8-35bb-42ed-8eff-8aecb1683105
  event: BNTRS_Stressful_Ulfar_151
  text: '"Кормчая моря душ, прими этот амулет как знак почтения к твоему ремеслу. Всякий созревший кормчий, водящий суда,
    носит такой у меня дома, на Фенрисе".'
  speaker: null
- guid: 27a75dea-8d77-4d21-96c3-eb7c417ae32b
  event: BNTRS_Stressful_Ulfar_153
  text: '"Гр-р-рхм!"'
  speaker: null
- guid: 44dda00b-403e-4729-93c3-c08d0c81c655
  event: BNTRS_Stressful_Ulfar_155
  text: '"Не зыркай на меня так, готи. Отведешь удачу".'
  speaker: null
- guid: 50fb5684-d687-419c-bf42-557101621a32
  event: BNTRS_Stressful_Ulfar_157
  text: '"Был у меня брат того же норова, что и ты, плутовка. Весельчак, каких поискать, певец!.. В общем, я твою породу знаю.
    Если что-то из моих вещей пропадет..."'
  speaker: null
- guid: c894df48-f2eb-42bb-b843-fbbeaf70ff33
  event: BNTRS_Stressful_Ulfar_159
  text: '"Я жду дня, когда ты надоешь эттфатеру, ручной ксенос. И тогда я лично вышвырну тебя в шлюз".'
  speaker: null
- guid: 14e7c834-f2a4-4f93-b76c-104884623731
  event: BNTRS_Stressful_Ulfar_16
  text: '"Это ты про трапезную, которую я... Кхм, обновил? Вини не меня, а мастера, что вытесал столь тесные кресла и хлипкие
    столы. Чуть кулаком, возвеселившись, пристукнешь — враз рассыпаются".'
  speaker: null
- guid: 5e9b3961-d4db-4438-aea3-64b5edf3dfcc
  event: BNTRS_Stressful_Ulfar_161
  text: '"Я слышу, что в твоей груди бьются два железных сердца. Одно принадлежит воину, другое — жрецу. С каким из них ты
    родился?"'
  speaker: null
- guid: 8bfe5e05-e129-4ca8-a281-ec27b82c9a7c
  event: BNTRS_Stressful_Ulfar_163
  text: '"Твоя трусливая манера боя вызывает лишь презрение. Даже не будь вы нелюдьми, столь робкая раса все равно не имела
    бы права на выживание".'
  speaker: null
- guid: 70bb9792-0450-4894-b22c-d79c6ac37656
  event: BNTRS_Stressful_Ulfar_182
  text: '"Умолкни, элфкид, лесная фея. Твои наглые речи мерзки, и ты рискуешь воистину узреть зверя".'
  speaker: null
- guid: 55cdccf1-edf8-4a1e-a44b-5b813b090913
  event: BNTRS_Stressful_Ulfar_34
  text: '"Добрая боевая песнь дает силы товарищам и славит Всеотца. Мои и твои песни схожи в этом, чистосердная сестра!"'
  speaker: null
- guid: 9f956843-fd31-4e68-a1d7-12454f6b44ba
  event: BNTRS_Stressful_Ulfar_52
  text: '"Я уважаю твой дар, Ведущая сквозь Море Душ. Но лучше оставь свое колдовство для кого-то другого".'
  speaker: null
- guid: beff970f-6d73-4a74-8b16-17839c68e1d3
  event: BNTRS_Stressful_Ulfar_70
  text: '"Нет. Отойди. Не разговаривай со мной. Сгинь с глаз, ищейка пронырливая!"'
  speaker: null
- guid: 4c49cb20-8261-44cc-ae1d-016f0958fe92
  event: BNTRS_Stressful_Ulfar_88
  text: '"Я не глуп, чтобы оскорблять попусту ведьму, знающуюся с духами. Но и не беспечен, чтобы пренебречь защитным амулетом,
    когда ты рядом. Тебе нет доверия".'
  speaker: null
- guid: 07498e5f-9e51-4655-9c2e-f13fe4793bbd
  event: CH3_UlfarPrison_01
  text: '{n}Когда песнь завершается, рыжеволосый удивленно смотрит на вас. Взгляд его чуть теплеет.{/n} "Ты, вижу, однажды
    пригубил{mf||а} мьода скьяльдов. В Длинном зале нашлись бы мои братья, которые захотели бы рассказать тебе о своих подвигах,
    чтобы ты сложил{mf||а} о них вису".'
  speaker: null
- guid: ab13ea8e-7e22-4f62-b850-8b6aa72d3679
  event: CH3_UlfarPrison_02
  text: '{n}Рыжий со смешком машет рукой.{/n} "Ладно, идти с тобой в бой и впрямь не зазорно". {n}В голосе его прорезается
    ревнивая подначивающия нотка.{/n} "Хоть с Ангелом Императора тебе в славе все равно не тягаться".'
  speaker: null
- guid: 3a1fee86-852a-4bd2-9666-9e0deeddaa54
  event: CH3_UlfarPrison_03
  text: '{n}Окинув вас внимательным взглядом, гигант пожимает плечами.{/n} "Если у тебя есть мьод, он станет еще приятнее".'
  speaker: null
- guid: 9fb81de3-08f8-44ca-b3ba-8c9cd3c9557b
  event: CH3_UlfarPrison_04
  text: '"Меркнут, какими бы они не были. В этом можешь не сомневаться".'
  speaker: null
- guid: 14c010f5-cfe1-4b3a-85b0-ff622fe23118
  event: CH3_UlfarPrison_05
  text: '"За Расса и Всеотца". {n}Удивительно, но даже с набитым сырым мясом ртом он умудряется произнести эту фразу солидно
    и веско.{/n}'
  speaker: null
- guid: 476d64c0-b8b5-4281-a1d1-37aefbab64e8
  event: CH3_UlfarPrison_06
  text: '"Не соизволю". {n}Гигант продолжает сосредоточено жевать. Поразмыслив он добавляет:{/n} "Моя клетка — мои правила".'
  speaker: null
- guid: d4539ba4-700a-4c12-a703-6e350f0bbdd5
  event: CH3_UlfarPrison_07
  text: '{n}Выковыряв из зубов застрявший кусок мяса, воин вновь начинает мычать под нос песенку. Между строками он бросает:{/n}
    "Чего надо?"'
  speaker: null
- guid: 34dedd37-b348-458c-8f51-f85f02a4e31d
  event: CH3_UlfarPrison_08
  text: '{n}Челюсти рыжеволосого перестают двигаться. На грубо вытесанном лице трудно читать эмоции, но вам чудится удивление.{/n}
    "Фенрис йольда, смертн{mf|ый|ая}. Ты знаешь старые слова, славные слова. Крепкие, словно камень. Острые, как лезвие силовой
    секиры. Опасные, как зуб кракена". {n}Несмотря на жуткую внешность и вполне подходящий ему хриплый бас завзятого убийцы,
    мужчина демонстрирует удивительную склонность к поэтичным эпитетам.{/n}'
  speaker: null
- guid: 826c16c6-a6ef-43df-8837-04b6d0699130
  event: CH3_UlfarPrison_09
  text: '{n}На первый взгляд мужчина перед вами не производит впечатление великого умника — рвать и убивать ему явно привычнее,
    чем думать. Но во взгляде его вы замечаете проницательную остроту. Осмотрев вас, он кратко отвечает:{/n} "Я — Волк".'
  speaker: null
- guid: 57d4e00d-2ed9-444b-bdc0-f0c3dcb2c7dc
  event: CH3_UlfarPrison_10
  text: '{n}Воин смотрит на вас с легким удивлением, а затем с понимаем криво ухмыляется и загадочно изрекает:{/n} "Хищник
    ест не только, когда голоден. Причины бывают разные".'
  speaker: null
- guid: a036c8e4-caab-4363-b899-cd35387a3641
  event: CH3_UlfarPrison_11
  text: '"Не могу порекомендовать. Мясо этих ксеносов пропитано скверной и немощью. А еще дурными препаратами, которые они
    вводят в свою кровь в ненормальных количествах".'
  speaker: null
- guid: f7c0659f-357d-4623-aaad-d0315cc5b2dd
  event: CH3_UlfarPrison_12
  text: '{n}Рыжеволосый пожимает плечами.{/n} "А я тебя и не приглашал присоединиться к трапезе".'
  speaker: null
- guid: a901385d-fda8-46d0-8c10-92e9c5e159a1
  event: CH3_UlfarPrison_13
  text: '{n}На лице пленника возникает высокомерная гримаса. Даже в клетке, залитый кровью и лишенный великолепной брони,
    он взирает на вас с надменным превосходством пост-человека.{/n} "Кто ты так{mf|ой|ая}, чтобы судить о чистоте и скверне
    Ангела Императора? Моя душа была ободрана до кости ледяными ветрами Врат Моркай, и в ней осталась только преданность Всеотцу
    и Рассу".'
  speaker: null
- guid: 3f3e47ea-c823-483b-affd-a5ab0c552616
  event: CH3_UlfarPrison_14
  text: '"Моя стая откликнулась на призыв Инквизиции и направилась в Простор Коронус. Была битва, а потом..."'
  speaker: null
- guid: 1e12279a-915c-458a-94a7-736a899f077d
  event: CH3_UlfarPrison_15
  text: '{n}Великан испускает низкое рычание, в котором звенит бешенство дикого зверя.{/n} "Для собственной сохранности. Когда
    я не занят убийством нелюдского отродья на арене, ксеносы страшатся моей воли".'
  speaker: null
- guid: fd0d7944-233d-4ac9-996a-39aa9619f9e3
  event: CH3_UlfarPrison_16
  text: '"Ага". {n}Жуя, воин вытирает с губ кровь тыльной стороной ладони.{/n}'
  speaker: null
- guid: 512b29c1-b781-4823-b8a6-baf965b2dd0a
  event: CH3_UlfarPrison_17
  text: '{n}Воин шумно втягивает носом воздух. Его зрачки чуть расширяются.{/n} "А кто ты так{mf|ой|ая}, чтобы предлагать
    помощь? От тебя пахнет ксеносами. Ты, вижу, ходишь у них в дружках, а не сидишь в клетке. И от тебя пахнет кем-то еще...
    Кем-то зловредным и хитрым. Так себе из тебя помощничек".'
  speaker: null
- guid: c6a4a1ea-3c35-4bc6-bfd0-02f6899264c0
  event: CH3_UlfarPrison_18
  text: '{n}Воин пожимает плечами.{/n} "Но я сижу в клетке, а ты разгуливаешь по их городу. Тебя они не боятся. Может, есть
    тому причина? Может, не так уж и схожа наша судьба?"'
  speaker: null
- guid: 04d6bbde-d012-4bcf-861d-193a7a29bfd3
  event: CH3_UlfarPrison_19
  text: '{n}Брови воина грозно сходятся, и рык его заставляет ваши кости вибрировать. Что-то внутри инстинктивно сжимается
    перед лицом пост-человеческой ярости.{/n} "Следи за языком, слуга! Иначе я вырву и сожру твою печень, чтобы во вкусе ее
    распознать, из какого скверного источника произошло твое скудоумие!"'
  speaker: null
- guid: 0c36a95b-505b-44ca-b97d-1f20b4ae26b4
  event: CH3_UlfarPrison_20
  text: '{n}Осклабившись, воин запускает пятерню в грязные волосы, придавая себе еще более дикий вид.{/n} "Тебе зачем то знать,
    а?"'
  speaker: null
- guid: eb6b4a34-aabf-4c61-81c9-283e389dd0cf
  event: CH3_UlfarPrison_21
  text: '{n}Криво ухмыльнувшись, мужчина косится на вас.{/n} "Этот мясорез прислал тебя шпионить? Или на тех задворках, откуда
    ты родом, и впрямь ничего не знают об Ангелах Императора, Космических волках с Фенриса и славном Лемане Рассе?"'
  speaker: null
- guid: 80a8d13a-eb43-4646-874f-306ded351930
  event: CH3_UlfarPrison_22
  text: '{n}Неприятный огонек загорается в его взгляде.{/n} "Отдал? Ну... Раз он меня тебе "отдал", войди в клетку и возьми".
    {n}Судя по оскалу длинных клыков, ничего хорошего внутри клетки вас не ждет.{/n} "Ты думаешь, что какой-то грязный, богохульный
    ксенос может распоряжаться... мной?!"'
  speaker: null
- guid: b0e3e749-d591-4571-8e1e-bd56d8415e27
  event: CH3_UlfarPrison_23
  text: '{n}Рыжеволосый цыкает зубом.{/n} "С чего бы? Я тебя не знаю. Как я могу довериться тебе? Вдруг ты враг... Вдруг ты
    {mf|дурак|дура}..."'
  speaker: null
- guid: dc274ec2-4139-4335-a818-2e09f8a11a80
  event: CH3_UlfarPrison_24
  text: '"Что ж ты с этого не начал{mf||а}?!" {n}Свирепая и тупая гримаса сменяется издевательской ухмылкой.{/n} "Так, думал{mf||а},
    я отреагирую на твои слова? Помани кровожадного убийцу запахом бойни — и он побежит, куда укажешь?"'
  speaker: null
- guid: 7296653e-573b-41bf-838b-ee671188cb61
  event: CH3_UlfarPrison_25
  text: '{n}На лице рыжеволосого возникает бесноватая, дикая гримаса. Надтреснутый голос ревет:{/n} "Иди сюда, погань! Хватит
    прятаться там, за решеткой! Иди и повтори свои грязные слова, чтобы я мог запихнуть их обратно в твою порванную смердящую
    пасть!"'
  speaker: null
- guid: 18736911-565a-49f3-806b-3e5a742c18b2
  event: CH3_UlfarPrison_26
  text: '{n}Воин равнодушно пожимает плечами.{/n} "Ага".'
  speaker: null
- guid: 647c5809-984b-4120-959a-a8514beba1b7
  event: CH3_UlfarPrison_27
  text: '"Этот Тервантьяс, похоже, не такой мудрец, каким любит казаться, раз позволил выпустить меня из клетки. Ну, ему же
    хуже". {n}Гигант разминает плечи, и вы слышите громкий треск суставов. Он поднимает с пола украшенный алыми рунами боевой
    нож — похоже, единственное оставленное ему имущество. Взвесив его в руке и скептически нахмурившись, Волк произносит:{/n}
    "Добрая сталь у меня найдется, но, если мы выходим на охоту, мне понадобится моя шкура".'
  speaker: null
- guid: 236153ac-0a42-40cb-bad9-e23df96faff7
  event: CH3_UlfarPrison_28
  text: '"О крови героев, в которой отражается блеск звезд. О снеге, по которому тянутся цепочки следов немилосердных охотников.
    О фузелиновом тумане, стелющемся над раздираемыми падальщиками трупами". {n}Мягкая, добрая улыбка касается губ рыжеволосого.{/n}
    "В общем, о доме".'
  speaker: null
- guid: b08f6890-5321-42d9-b973-d59343853f99
  event: CH3_UlfarPrison_29
  text: '"Конечно. Всеотец даровал мне честь испить мьод скьяльдов. Я сложил тысячу вис для своих братьев — ретивых и гордых,
    зовущих к битве, ранящих сердце в кровь и веселых, словно хохот безумца, у которого отобрала разум зимняя метель".'
  speaker: null
- guid: 846f0eda-2e39-4b16-ae10-269130651ef9
  event: CH3_UlfarPrison_30
  text: '"Они там и не прозвучат. Много чести для тебя".'
  speaker: null
- guid: 55c230e0-611f-4dce-a721-c30fbc408d89
  event: CH3_UlfarPrison_31
  text: '{n}Пленник завершает свою неторопливую песнь и довольно улыбается.{/n} "Я сам сочинил эту вису. Для брата, павшего
    век назад. Он был хорошим воином, и умер он тоже хорошо. И виса получилась славная".'
  speaker: null
- guid: 6a344182-3b84-41a4-89a0-620ddc1b16fe
  event: CH3_UlfarPrison_32
  text: '{n}Прикрыв глаза, Ульфар веско заявляет:{/n} "Для этого тебе пришлось бы уговорить сразу две очень несговорчивых
    персоны. Меня и клешнерукого ксеноса".'
  speaker: null
- guid: a3ef3e4e-0f1f-4c8e-9783-a37d804d45bc
  event: CH3_UlfarPrison_33
  text: '{n}Воин поднимает бровь.{/n} "А ты точно слуга Императора, а не кукла с рукой этого ксеноса-мясореза в заднице? Почем
    мне знать, чьи это слова — твои или его? Почем мне знать, в какую интригу ты меня втянешь?"'
  speaker: null
- guid: 275c6544-3685-4dce-b294-71e8f25f663a
  event: CH3_UlfarPrison_34
  text: '{n}Великан с интересом смеривает вас взглядом.{/n} "Славно молвишь. Слова эти книжные я не раз уже слыхал, но впервые
    вижу, чтобы их произносили с такой непоколебимостью во взгляде. Вижу, что ты не просто в них веришь — ты ими живешь. Я
    таких уважаю, подсоблю тебе. Пусть никто не посмеет молвить, что я свой долг перед Всеотцом позабыл".'
  speaker: null
- guid: 9d8176b4-dd07-4709-87d3-8b2f78c8929e
  event: CH3_UlfarPrison_35
  text: '{n}Пленник весело ухмыляется.{/n} "Вот как, с {d|Encyclopedia:CharGen_MOT_GreatDeed}настоящ{mf|им|ей} геро{mf|ем|иней}{/d}?"'
  speaker: null
- guid: e659acc0-cf61-44e8-9114-bf53c946e9d6
  event: CH3_UlfarPrison_36
  text: '{n}Гигант азартно взрыкивает.{/n} "Ты хоть понимаешь, перед кем хвастаешься, смертн{mf|ый|ая}?! Я сходился с врагами
    в тысяче битв, телами сраженных мной можно выстлать путь от Фенриса до Святой Терры! Мое имя ведомо каждому в Ордене!"'
  speaker: null
- guid: 2183bdc5-bc97-4cdd-a4dc-3206af7380a3
  event: CH3_UlfarPrison_37
  text: '"Ну а я..." {n}Распаленный великан набирает воздух в грудь, но внезапно задумывается.{/n} "{name}... А ведь мне доводилось
    слыхать о тебе. Ты и впрямь, говорят, тверд{mf||а} сердцем и в свое время недурно себя показал{mf||а}".'
  speaker: null
- guid: 1d23f671-f840-40e2-8185-b1cf62ab6d43
  event: CH3_UlfarPrison_38
  text: '{n}Великан изрыгает страшный, замогильный рев... который переходит в не менее дикий хохот. Отсмеявшись до слез из
    глаз, рыжеволосый без всякой угрозы бросает вам:{/n} "Ладно, ты меня раззадорил{mf||а}. И, судя по запаху, не обмарал{mf||а}
    штаны в процессе. Смелых я уважаю, с тобой можно иметь дело".'
  speaker: null
- guid: c0a91a72-9475-40ab-9c15-5d3e84bf468b
  event: CH3_UlfarPrison_39
  text: '{n}Запрокинув голову, воин издает леденящий душу вой, в котором слышатся безумное веселье злых духов, пляшущих на
    смертоносных ледяных отрогах. Кровожадная улыбка расцветает на его лице.{/n} "Так как, говоришь, тебя зовут?"'
  speaker: null
- guid: 702bcddb-b030-4c2d-b21f-1189747bcda8
  event: CH3_UlfarPrison_40
  text: '"А ты — просто болтлив{mf|ый|ая} дур{mf|ачок|очка}, судящ{mf|ий|ая} о том, о чем тебе судить не по чину".'
  speaker: null
- guid: 9073e205-e9c8-4d68-ab2e-3c8f23e81cac
  event: CH3_UlfarPrison_41
  text: '{n}Завершив песнь, рыжеволосый саркастично ухмыляется.{/n} "Да ты, вижу, не скьяльд. Держу пари, друзья твои ценят
    тебя не за висы, что ты читаешь им у очага".'
  speaker: null
- guid: 3397a1d9-5b07-4fab-8ca9-a5feb50e710d
  event: CH3_UlfarPrison_42
  text: '"Жаждали волки младые стать поживой меньшим братьям своим,

    Вышли на болтеров пир, хоть и было их мало.

    Но не затем шел с ними волк старый,

    Чтобы смотреть, как сожнут их нечистые косы.

    Разогнал он щенков и остался один, запирающий тропы,

    Ибо давно заприметил врага, что достойным казался средь недостойных.

    Пели они песнь мечей громко и славно,

    И встал старый волк на костях,

    А затем был сражен птицами битвы".'
  speaker: null
- guid: 7096017a-370e-4a2a-855d-e39ffb3381b9
  event: CH3_UlfarPrison_43
  text: '{n}Рыжеволосый усмехается.{/n} "Так понятно получилось? В прозе эта сага звучит менее интересно".'
  speaker: null
- guid: 29e8b2d1-f988-4c2d-8fe0-effb362b2b9d
  event: CH3_UlfarPrison_44
  text: '{n}Поиграв желваками, рыжеволосый угрюмо изрекает:{/n} "Когда я буду вырывать твой дерзкий язык из глотки, не задавайся
    вопросом "За что?" Ровно за это".'
  speaker: null
- guid: 2c37fd20-9337-45c3-8685-31c689d3dfa3
  event: Companions_Ulfar_01
  text: '"Мы пошли в набег на ксеносов за пленными и угодили в западню. Без техники, с ранеными на руках, мы вынуждены были
    отступить. Я велел братьям уходить, а сам остался встречать гостей. Не знаю, скольких слабосильных убожеств я убил, но
    прикончил бы еще столько же, если бы их громоздившиеся стенами трупы не завалили меня".'
  speaker: null
- guid: baf17d66-46b5-4e63-a0f2-022d95931ef9
  event: Companions_Ulfar_02
  text: '"Сдвинем чаши, эттфатер! В честь свершенных подвигов и в предвкушении тех, что еще предстоит свершить!"'
  speaker: null
- guid: aabc886f-37e3-4df4-9cd3-fcdb78442376
  event: Companions_Ulfar_03
  text: '"Стая Торбальда Железношкурого сейчас осаждает Ефрат-II. Даже если моя стая не с ним, он может знать, где они охотятся.
    Я должен встретиться с Торбальдом и спросить его о своих братьях".'
  speaker: null
- guid: 2b3f4a13-52a3-4283-bd2b-49aa2d05726e
  event: Companions_Ulfar_04
  text: '{n}Осклабившись, гигант искоса взирает на вас. На его грубом лице огромными буквами написано хитрое самодовольство,
    которое он безуспешно пытается скрыть.{/n} "Была у меня пара мыслей на сей счет. Но ты не спеши их выпытывать — когда
    они придутся к месту, я поделюсь ими".'
  speaker: null
- guid: 25a66098-6126-4c23-8189-4c4d260f4539
  event: Companions_Ulfar_05
  text: '"Видишь, эттфатер, сколь явно дает нам понять Всеотец, что нити вюрда нашего переплетены особым образом? Не случайно
    свел он твою и мою дороги, не случайно привел в одно место. Ступай же со мной, когда придет черед отыскать моих братьев".'
  speaker: null
- guid: 2296df66-f3c7-4d2b-ab1f-26e60481fd63
  event: Companions_Ulfar_06
  text: '"Фенрис йольда, эттфатер".'
  speaker: null
- guid: 5db0bcdc-0267-454e-9621-592884a80154
  event: Companions_Ulfar_07
  text: '"Грядет шторм, кракены поднимаются из глубин за кровавой поживой, а ты хочешь оставить свой дреккар без лучшего гребца?"'
  speaker: null
- guid: 5324f198-e8bd-4b31-9d52-e56f777bea1a
  event: Companions_Ulfar_08
  text: '"Не каждому даровано право задавать такие вопросы, но тебе я отвечу. Что же ты желаешь знать об Астартес со славного
    Фенриса?"'
  speaker: null
- guid: 150aad47-f061-433f-b358-42732febfe74
  event: Companions_Ulfar_09
  text: '"Таков был мой путь в Комморру, эттфатер".'
  speaker: null
- guid: eb35e300-3179-458b-946c-840298f54260
  event: Companions_Ulfar_10
  text: '"Инквизитор, зовущийся Калькасаром, прислал призыв о помощи. Совет командиров решил не отказывать и направил две
    стаи в Простор, хоть мы и не доверяли этому "союзнику". Но обязывал нас откликнуться кровавый долг за услугу, оказанную
    в прошлом".'
  speaker: null
- guid: 8d1d5991-7f7a-45ec-80d7-bfab022c8682
  event: Companions_Ulfar_100
  text: '"Наше геносемя — особое! Расс благословил нас Волчьей спиралью, особым компонентом гена, что оттачивает наши чувства
    и инстинкты, словно моноклинок. Волчья спираль разжигает в наших сердцах кровожадное пламя, а облику придает сходство
    со смертоносными волками Фенриса".'
  speaker: null
- guid: f52990c9-0c49-4730-adc0-f7cb1f14cdf2
  event: Companions_Ulfar_101
  text: '"Нас связывало многое. Арнульф был моим побратимом. От его клинка я пал в битве, где меня заметил Избирающий доблестных,
    от моего топора погиб и он в том сражении. Но позже мы забыли вражду наших кланов и стали близкими друзьями". {n}Ульфар
    показывает нож, покрытый красными рунами.{/n} "Этот клинок он подарил мне в знак того, что прошлое забыто. Скор на смех
    был Арнульф и страшен в драке, почти как я сам".'
  speaker: Ulfar
- guid: 641f52ea-1847-4d8a-b796-fb33699c4d0b
  event: Companions_Ulfar_102
  text: '"Известно ли тебе об импланте, именуемом омофагия? Это одно из благословений Всеотца, даруемых Астартес. Нервные
    узлы, связывающие стенки желудка и спинной мозг, позволяют мне усваивать информацию из генетического кода поглощаемой
    пищи".'
  speaker: null
- guid: 8dfccc97-b4a4-418e-8932-d4e991010bd1
  event: Companions_Ulfar_103
  text: '"Разумно скрывать свое прошлое и тайны своих братьев от чужака, но постыдно — от друга. Спрашивай".'
  speaker: null
- guid: 8144ff28-5d7c-469a-94c2-6cc914994e0d
  event: Companions_Ulfar_104
  text: '"А тебе многое известно. Куда больше, чем положено обычно{mf|му|й} смертно{mf|му|й}. Да, я и впрямь терзал плоть
    врагов, чтобы извлечь тайны из горчащего вкуса их мяса".'
  speaker: null
- guid: 61775572-3e2f-42b8-8aa5-f7e123f20afa
  event: Companions_Ulfar_105
  text: '"Скьядди же, Думающий Дважды, был послан нам Всеотцом, чтобы не сложили мы головы молодыми щенками. Мыслей в его
    голове было столько, что хватало их думать и за меня, и за Арнульфа. Это Скьядди научил меня слагать висы. Духи ценили
    его мудрость, руны слушались его голоса".'
  speaker: null
- guid: ffad1c13-bd6b-4f33-99f4-d1febb8e98c1
  event: Companions_Ulfar_106
  text: '{n}Фыркнув, Ульфар презрительно сплевывает.{/n} "Ради утоления голода я бы скорее глодал камни, чем мясо этих хилых
    вырожденцев, ничтожных прихвостней лжебогов, богохульных мешков скверны и трусости..." {n}Ворчание воина переходит в бранную
    тираду на фенрисийском.{/n}'
  speaker: null
- guid: 4b2ae32c-f6b9-4b3a-bb45-31afb3f0097f
  event: Companions_Ulfar_107
  text: '{n}На губах Ульфара возникает улыбка маньяка.{/n} "Думаешь, я пал в сладкие объятия безумия?" {n}Воин добродушно
    смеется.{/n} "Нет, я не обезумел. Пока что, по крайней мере".'
  speaker: null
- guid: 9ef8fb63-a0d6-438c-afdc-2d2f042a6b5e
  event: Companions_Ulfar_108
  text: '"Отчасти, эттфатер. Я и впрямь водил за нос худосочных ксеносов, чтобы усыпить их бдительность. Но не только".'
  speaker: null
- guid: 1f157c52-0abe-4a1b-a472-d5595ee4cc2d
  event: Companions_Ulfar_109
  text: '{n}Ульфар внезапно сводит брови и растерянно добавляет:{/n} "Ты, конечно, дева, не "отец"... Но слова для девы-командира
    у нас просто нет, ведь все Космические волки — мужи".'
  speaker: Ulfar
- guid: d539c6eb-601e-4614-a088-af4f76fec920
  event: Companions_Ulfar_11
  text: '"Так тому и быть. Наше краткое знакомство будет упомянуто в саге, повествующей о моем побеге из Комморры. Гордись
    этим!" {n}Громогласно расхохотавшись, рыжеволосый отворачивается.{/n}'
  speaker: null
- guid: 6ca6a592-384d-43f9-b21e-c5d63dc1fd43
  event: Companions_Ulfar_110
  text: '"Когда ксеносы тащили меня, плененного, Арнульф настиг их и изрубил с десяток своей славной секирой, а Скьядди призвал
    шторм столь могучий, что реациклы нелюдей кружились в бурных потоках ветра, словно листья. Но даже их мощи не хватило
    на всех... Мы оказались в плену. Первым Тервантьяс забрал Скьядди и сотворил с его телом... немыслимое. Затем он забрал
    Арнульфа, и много часов под пыткой мой брат отвечал выродку презрительным хохотом, а затем умолк".'
  speaker: null
- guid: 0352847e-9a0a-4e4b-98f5-17d8d12d7b0c
  event: Companions_Ulfar_111
  text: '{n}Что-то изменилось в Ульфаре — внешне он кажется здоровым, но свет в его глазах потух и сменился кровавой дымкой
    {d|Encyclopedia:CompUlfar_Wulfen}подступающего безумия{/d}. Губы усохли и плотно сжались — нелегко таким устам будет петь
    славные саги. В голосе клокочет зловещий рык:{/n} "Эттфатер. Хорошо, что ты жив{mf||а}".'
  speaker: null
- guid: b640a484-d68c-4e93-bcfd-808ac0894be6
  event: Companions_Ulfar_112
  text: '{n}Что-то переменилось в Ульфаре, будто некий груз, с первой встречи давивший на плечи Волка, наконец исчез. В суровом
    его лице возникло спокойствие, которого прежде не было. Он почтительно кланяется вам.{/n} "Эттфатер, {mf|брат|сестра},
    сердце поет, когда я вижу тебя. Клянусь, что {d|Encyclopedia:CompUlfar_Pack}имя твое не будет забыто{/d}, когда, возвратившись
    на Фенрис я буду петь свою сагу".'
  speaker: null
- guid: b2365af0-a0b1-4038-ab30-add5ca67323f
  event: Companions_Ulfar_113
  text: '{n}Что-то переменилось в Ульфаре. Черты лица его стали суше и острее, а из веселого огонька в глазах пропала искренность.
    Он посуровел, и в голосе певца саг возникла траурная хрипотца.{/n} "Эттфатер, свидетель{mf||ница} {d|Encyclopedia:CompUlfar_Lone}клятвы
    моей{/d}, с почтением встречаю тебя".'
  speaker: null
- guid: bf6a1ffa-d87c-4f6b-86d7-9b45e393ca1d
  event: Companions_Ulfar_114
  text: '{n}Голос Ульфара становится уклончив.{/n} "Он спас нашего брата, который потерял стаю и... Не мог позаботиться о
    себе и чести Ордена. Вернул его на Фенрис и сохранил в тайне несчастье, постигшее его. Ярл знал, что вела его жажда выгоды
    и желание обрести могучих должников, однако честь обязала его принять чужака гостеприимно и поклясться в дружбе".'
  speaker: null
- guid: eef9f4c7-ca87-43f3-abce-e21d020229c9
  event: Companions_Ulfar_115
  text: '"Все на Фенрисе имеет силу. Я бился в сотне битв, я получил сотню ран. Даже среди Волков не каждый пережил бы эти
    увечья. Я же всегда выживал. И с каждой новой победой мысли мои все темнее — что, если мне так и не доведется пасть с
    честью однажды? Что, если смерть моя будет глупой и бесславной? И Расс брезгливо отвернется от меня, когда я буду стыдливо
    обивать порог его чертога?"'
  speaker: null
- guid: 359193c4-17ee-4afe-8c73-ee90f87c9d36
  event: Companions_Ulfar_116
  text: '"Так у Космических волков зовется отец стаи. Я — опытный воин, и мне отдает приказы эттфатер. Он подчиняется ярлу
    — командиру великой роты. Раз сейчас мной командуешь ты, и командуешь достойно, я дарую тебе привилегию зваться моим эттфатером".'
  speaker: null
- guid: c4f028af-159e-4efb-b55f-3a968b0b0557
  event: Companions_Ulfar_117
  text: '"Мы зовемся Зловещим воем, и знак наш известен всем Волкам". {n}Гигант с гордостью указывает на наплечник, украшенный
    похожими на клыки черными клиньями.{/n} "Мы — старые волки, много видавшие и прошедшие". {n}Тень тревоги омрачает хвастливую
    радость на лице воина.{/n}'
  speaker: null
- guid: 4ec0f915-2905-463e-810c-549c0817e859
  event: Companions_Ulfar_118
  text: '"До становления Астартес я мечтал стать скьяльдом, хранителем историй. На пирах я часто пою о подвигах своих братьев.
    Тысячи их в памяти моей. Когда я рядом, Волки бьются еще ретивее, ведь знают, что их деяния сохраню я в вечности. Один
    Механикус рек, что в наших песнях скрыты психомеметические коды, укрепляющие отвагу. Наверное, где-нибудь в других местах
    так и есть. Но на Фенрисе саги пекут лишь из памяти, почтения и гордости".'
  speaker: null
- guid: f35f3dc4-4c25-4dd6-9908-df3b1cf612df
  event: Companions_Ulfar_119
  text: '"Всеотец одарил тебя сильным чутьем. Его сотворил Скьядди Думающий Дважды. Духи любили его, а под саги о его проницательности
    можно пировать всю долгую ночь Хельвинтра. Он был моим другом". {n}На лицо, только что светившееся от свирепой гордости,
    ложится угрюмая тень.{/n}'
  speaker: null
- guid: f4114d46-1a61-45e8-9ded-9d50ad1528f3
  event: Companions_Ulfar_12
  text: '"Как пожелаешь. Не знаю, чем прогневал тебя, но спорить не буду. Прощай, {name}. Чутье подсказывает, что всех нас
    ждет суровое ненастье. Встреть его доблестно, а я продолжу свою охоту в одиночку".'
  speaker: null
- guid: 87f15d6e-5d84-46ab-9eb0-db86ad70d83f
  event: Companions_Ulfar_120
  text: '"Каждое утро я обращался ко Всеотцу, а каждый вечер — к Рассу. Я тренировал свое тело, читал литании, а в самые трудные
    часы повторял свою сагу. Вспоминал каждую битву, каждую рану, каждого брата. И так я выжил". {n}Свирепо зыркнув на вас,
    рыжеволосый отворачивается.{/n} "Я всегда выживаю".'
  speaker: null
- guid: 105fbeb1-5c86-4e82-a74a-63ce33f50be3
  event: Companions_Ulfar_121
  text: '"Или он огромен, как Солнечный волк, что каждое утро выходит на охоту и озаряет наш мир светом? Всеотец — не бог,
    а образец человека. Обычным людям тяжело осознать это, но мы, его воители и потомки, помним правду".'
  speaker: null
- guid: 308df6a7-b1bf-4bdb-a3f7-1fc93e3da710
  event: Companions_Ulfar_122
  text: '"О мрачных днях спрашиваешь ты, эттфатер". {n}Ульфар испускает рокочущий вздох, достает из ножен украшенный алыми
    рунами нож, который вы видели в его руках еще в Темном городе, и начинает вертеть в пальцах, успокаиваясь.{/n} "Пусть
    мой острый товарищ будет свидетелем правдивости моих слов".'
  speaker: Ulfar
- guid: 3ff98d0d-75f2-4a88-8f2a-fe05c3031870
  event: Companions_Ulfar_123
  text: '"Простор Коронус — дикое угодье, полное добычи. И Космические волки первыми окрасят его снега алым! Ярл решил отправить
    самых неукротимых охотников, жаждущих почестей и кровопролития. Где одна стая исполняла бы долг во имя чести, две уже
    стремились превзойти друг друга во имя славы".'
  speaker: null
- guid: e6d3af19-1796-4180-8c4d-fbb101dc6ab1
  event: Companions_Ulfar_124
  text: '"Благодарю. Их истории не будут забыты, но сохранятся в легендах Ордена. Мы, Волки, не умираем до конца — мы уходим
    охотиться в Кьялхалле, и однажды вернемся в сей мир для последней битвы. Славный будет день воссоединения братьев!"'
  speaker: null
- guid: d6bd928b-2165-44d4-afcc-106803b483ef
  event: Companions_Ulfar_125
  text: '{n}Ульфар печально качает головой.{/n} "Нет больше стаи. Я мог бы стать Одиноким волком, мстителем, но сердце мое
    желает иного. Я соскучился по обществу воинов Фенриса. Когда мы исполним твое дело здесь, я отыщу Торбальда Железношкурого
    и приму его щедрое предложение, свяжу себя узами кровного братства с Грозовыми укусами. Долг мой перед Всеотцом еще не
    исполнен".'
  speaker: Ulfar
- guid: 09cfa2a4-55bc-46e4-8468-ed616310074f
  event: Companions_Ulfar_126
  text: '{n}Рокочущий голос воина отдается дрожью в ваших костях.{/n} "Наш бесстрашный лидер — Леман Расс, потомок Всеотца.
    Наша обитель — Клык, чертог бессмертных, что возносится с Хребта мира до самой орбиты. Наш мир — Фенрис. Чувствуешь —
    каждое слово гремит ратной славой и зовет в кровавую бурю сражения! Вот каковы мы! И не бывать никому, схожему с нами!"'
  speaker: null
- guid: 234b1726-6891-4609-a1fc-f7adf285adf2
  event: Companions_Ulfar_127
  text: '{n}Взгляд гиганта теплеет.{/n} "Фенрис — это дом. Суровый край суровых зим и суровых людей. Когда приходит Хельвинтр,
    страшное время холодов, непокорное Мировое море замерзает и на охоту выходят великие белые медведи, снежные вирмы и ледяные
    тролли. Затем убийственный мороз отступает, и лодки гарпунщиков выходят на промысел, схватываясь с морскими змеями и кракенами".'
  speaker: null
- guid: cd1cf9d1-ed11-42d3-8e62-e62c1a70e471
  event: Companions_Ulfar_128
  text: '{n}Воин отмахивается, но на губах его играет довольная улыбка.{/n} "Брось. Я, конечно, мог бы командовать тобой и
    твоими людьми, да хоть целой планетой!.. Но мне, воителю Всеотца, слишком легко забыть об ограничениях, присущих обычным
    людям".'
  speaker: null
- guid: e6cbfaaf-19b3-4f32-a05b-acb1d978f9d5
  event: Companions_Ulfar_129
  text: '"Соответствуй ей и не опозорь славное звание".'
  speaker: null
- guid: fdc3b9c2-4172-44a3-85e0-3ecb4e269636
  event: Companions_Ulfar_13
  text: '"А, ты, видимо, любишь веселые шутки. Я тоже". {n}Рот воина растягивается в зубастой неприятной улыбке.{/n}'
  speaker: null
- guid: 5705acc8-a668-4c05-a244-2b254788f1a2
  event: Companions_Ulfar_130
  text: '{n}Волк снисходительно улыбается.{/n} "Мне неведомы твои регалии, но ни одна из них не сравнится в почетности с дарованной
    мной".'
  speaker: null
- guid: 33a18b07-df29-477d-86c3-2e55f9f5c960
  event: Companions_Ulfar_131
  text: '"Больше, чем просто сплетением букв

    Является сага,

    В ней тайной вязью проложен магический смысл,

    Пусть не постигнет его ни ухо, ни разум,

    Сердце откликнется на прозвучавшие чары".'
  speaker: null
- guid: eb47f170-f0fd-4fa0-ad4d-f5982557bc61
  event: Companions_Ulfar_132
  text: '{n}Грозно рыкнув, Ульфар сводит брови, и нечто примитивное и древнее внутри вашего мозга заходится в истерике ужаса.{/n}
    "Не тебе, человек, судить наши овеянные веками кровавой славы традиции. Тебе оказана честь, так заткнись и соответствуй
    ей!"'
  speaker: null
- guid: 81f73f62-b2ac-4edb-b731-32a177b89442
  event: Companions_Ulfar_133
  text: '"Верь во что пожелаешь, эттфатер. Всеотец не желал от нас, чтобы мы почитали его, словно божество, но мы — не обычные
    люди. Не знаю, каков был его замысел касательно вас".'
  speaker: null
- guid: 728c5598-b735-4995-b97d-f01c0200dec9
  event: Companions_Ulfar_134
  text: '"Тем славнее его деяния. Легко биться с богами, когда ты сам — бог. Но если ты человек — вот тут-то и начинается
    сага о славном подвиге".'
  speaker: null
- guid: 0ba3ed2b-ab89-4b75-b503-e988de3abb22
  event: Companions_Ulfar_135
  text: '"Это не случилось бы без тебя, эттфатер. Знай, что отныне и навек у тебя есть товарищи на Фенрисе".'
  speaker: null
- guid: 6e123a49-2a44-47d0-9470-df3c3deb1614
  event: Companions_Ulfar_136
  text: '"Не-фенрисийцу трудно постичь нашу мудрость. Она приходит с холодом и смертью".'
  speaker: null
- guid: 52550621-f64b-4491-b084-198978478bf2
  event: Companions_Ulfar_137
  text: '"Оно сильно, безусловно, но дух мой сильней Доппельгренделя. Раз я одолел его в схватке, неужели не одолею его чары?
    Нет, однажды я обязательно обрету славную гибель на поле сражения!"'
  speaker: null
- guid: 7b4f049e-f35f-4b4a-9cc1-af9e6118b456
  event: Companions_Ulfar_138
  text: '"Если услышишь в ночи торжествующий вой — знай, это я иду тропой возмездия".'
  speaker: null
- guid: 3c6fd13a-7a17-46b8-8254-5374a7e26f08
  event: Companions_Ulfar_139
  text: '"Да. Я тоже".'
  speaker: null
- guid: 4fb23a78-e818-437b-bb81-3b0cf20ca8ba
  event: Companions_Ulfar_14
  text: '"Кутает старец тело свое в теплую шерсть,

    Кутает планы свои многомудрый хитрец в покровы из тайны.

    Коли желаешь зловещий ты умысел знать,

    Печень вкуси хитреца вместо яда словес".'
  speaker: null
- guid: 6cbe2bad-7038-418d-9403-34d1c204e5d3
  event: Companions_Ulfar_140
  text: '{n}Хищная усмешка служит вам ответом.{/n} "Проницательно. Мы не имели прежде дел с этим Калькасаром и не доверяли
    ему. Две стаи — вдвое больше глаз, чтобы присматривать за его хитростями и махинациями. Да и потом..."'
  speaker: null
- guid: e79176f3-8eb6-4871-adea-55ad188c4fe9
  event: Companions_Ulfar_141
  text: '"Оно сильно, но и я не слаб. Прежде я выживал, потому что так велел мне долг перед братьями — перебороть любую рану,
    вновь встать в строй, защитить, уберечь... Теперь сего долга нет, и ничто не держит меня здесь. Может, теперь я смогу
    умереть".'
  speaker: null
- guid: f92d67a2-0dfb-4aa5-8258-6d1a05be05b0
  event: Companions_Ulfar_142
  text: '"Биться, эттфатер. Я буду искать достойную схватку и повергать врагов Всеотца, пока однажды не найдется достойный
    сразить меня. Имя Зловещего воя будет плыть, словно дреккар, в реках пролитой мной крови нечестивцев. Черногрив более
    не мой покровитель, отныне я пойду тропами Локъяра, Одинокого Волка".'
  speaker: null
- guid: eb496b4a-a335-4bf8-ac11-600a795beb41
  event: Companions_Ulfar_143
  text: '"Радость умерла в моем сердце, эттфатер. Я чувствую лишь гнев... Хотя это ложь. Кажется, я уже больше почти ничего
    не чувствую. Просто хочу растерзать кого-нибудь. Скоро лишь это чувство останется во мне, а затем уйдет и оно. И я буду
    пуст".'
  speaker: null
- guid: b0188446-1791-49e0-b533-08ab35c02d22
  event: Companions_Ulfar_144
  text: '"Я больше не желаю обманывать себя смертной надеждой — даже она умерла. Всем нам достаются разные судьбы — чья-то
    легка, чья-то полна скорбей. Мне досталась такая, и я не буду скулить, точно щенок, отрицая ее. Пропащим мне суждено быть
    от роду, но только сейчас я обрел смелость принять сей путь".'
  speaker: null
- guid: 8be2352e-b757-4ed8-a7e5-4479113ae45b
  event: Companions_Ulfar_145
  text: '"Греза, навеянная мьодом, смешалась с реальностью и чарами Доппельгренделя. Как сказать тебе, что было настоящим,
    а что — миражом? Бились ли мы с духом или моим обезумевшим братом? Встали ли подле нас призраки павших, чтобы взвесить
    нашу отвагу на весах достоинства, или дурман заставил нас сражаться с ветром? Все сразу, эттфатер. На Фенрисе издавна
    знают, сколь зыбка грань между настоящим и легендой, и мы с тобой были в легенде".'
  speaker: null
- guid: 1f890785-77fa-4cf2-9e77-7f8853c3c2cf
  event: Companions_Ulfar_146
  text: '"Пусть этот надменный вождь и возомнил, что может отдавать нам приказы, мы следовали собственному инстинкту и охотились
    по-своему". {n}Рыжеволосый довольно ухмыляется.{/n} "Бьюсь об заклад, это его изрядно злило".'
  speaker: null
- guid: 9c07df56-cc74-4c2a-a2c0-c51273d126f5
  event: Companions_Ulfar_149
  text: '{n}Воин мрачно отрезает:{/n} "Пали. Достойно".'
  speaker: null
- guid: 381585cd-bbc3-41d0-95ea-88167bbcbcd2
  event: Companions_Ulfar_15
  text: '{n}Сумрачно взрыкнув, Ульфар посылает вам леденящий взгляд, рождающий в сердце понимание чудовищной пропасти, разделяющей
    вас и древнего сверхчеловека, стоящего напротив.{/n} "Их сагу я петь тебе не готов. Ты не проливал{mf||а} с ними кровь,
    ты не делил{mf||а} с ними мясо и мьод. Их духи могут оскорбиться, узнав, что я пою о их деяниях чужа{mf|ку|чке}".'
  speaker: null
- guid: 3b9b6f19-ec18-475e-8eff-4addd5ac8513
  event: Companions_Ulfar_150
  text: '"Вот что придавало мне силы. Твои советы, эттфатер".'
  speaker: null
- guid: cb1b310e-8ec4-488d-aa55-d4631bfa4e09
  event: Companions_Ulfar_151
  text: '"Я прикончил многих ксеносов и попировал их плотью. Мои пленители веселились, глядя на это, а я собирал информацию
    и готовил побег".'
  speaker: null
- guid: ffd08c22-073b-45e4-9e5a-1f609967bcad
  event: Companions_Ulfar_157
  text: '"Будто вещий дух, ты указывал{mf||а} мне на мою тропу, эттфатер, пока очи мои не открылись".'
  speaker: null
- guid: fcc2908c-81bc-4a5b-a7b8-71cec6b65dd5
  event: Companions_Ulfar_158
  text: '"Каждая трещина была мала, но вместе они раскололи твердыню надежд, живших во мне".'
  speaker: null
- guid: 911342c4-1c90-412b-9614-78cac36444eb
  event: Companions_Ulfar_159
  text: '{n}Громогласно хохотнув, великан торжествующе ревет:{/n} "Вырвались смелые из плена презренных отродий!

    Темного града темницы убогие в сраме пребудут.

    Сага о славном побеге польется рекою

    На пиру, где восславят могучего Волка и ловкого эттфатера!"'
  speaker: null
- guid: 93e84b32-c2ec-4b9d-8d1d-633f3a71425e
  event: Companions_Ulfar_16
  text: '"Меня отдали на потеху Тервантьясу. На аренах Комморры Астартес — редкость, и он выпускал меня убивать гладиаторов".
    {n}С каждым словом голос Ульфара тяжелеет от горечи и злобы.{/n} "Я ненавидел. Постоянно ненавидел, каждое мгновение!"
    {n}Взревев и выругавшись на фенрисийском, воин переводит дух.{/n} "Приходилось заботиться о своем разуме, пока он не сгинул
    в Семи Преисподних".'
  speaker: null
- guid: 22a8648c-2860-4010-90fb-541283ee7166
  event: Companions_Ulfar_17
  text: '"В ночи, погрузившись в медитацию, я слышу их вой. Они охотятся в Кьялхалле, и сердце мое рвется к ним. Однажды мы
    встретимся".'
  speaker: null
- guid: cc9a4785-1d1b-4c99-ade4-e2a8d5616580
  event: Companions_Ulfar_18
  text: '"Невеселую сагу поведал я тебе, эттфатер".'
  speaker: null
- guid: b7db08e9-79e5-46e3-b28b-7aa318fa767a
  event: Companions_Ulfar_19
  text: '{n}Воин горестно рычит:{/n} "Зря. Они заслуживали более славной смерти. И саги их должны были звучать дольше. Лучше
    бы мне было в тот день умереть, а им — жить дальше и разить врагов во славу Всеотца".'
  speaker: null
- guid: f1207962-a8fb-404f-9669-aa3d86a55d88
  event: Companions_Ulfar_20
  text: '{n}Свирепая гримаса искажает лицо воина, делает его похожим на звериную морду.{/n} "И я буду мстить. Клянусь кровью
    и клыками! Тысячей нечистых сердец буду я пировать, прославляя павших товарищей!"'
  speaker: null
- guid: b9fd8cc6-8750-468e-af58-176f50513002
  event: Companions_Ulfar_21
  text: '{n}Гигант снисходительно улыбается, глядя на вас сверху вниз.{/n} "Не кипи, эттфатер. Если хочешь читать волшебные
    заговоры, взывая ко Всеотцу — разве я тебе запрещаю?" {n}Улыбка нехорошо кривится.{/n} "Но не бросайся столь дерзкими
    словами, иначе ответишь на них на поединке".'
  speaker: null
- guid: f9228d15-f102-4933-b6e3-ef54aaa60205
  event: Companions_Ulfar_22
  text: '{n}Кровожадно взрыкнув, гигант сжимает чудовищные кулаки.{/n} "Брось еще одно надменное слово в сторону Фенриса,
    и мы выйдем на поединок. Не испытывай милость Всеотца — даже из безоружной схватки со мной тебе вряд ли удастся выйти
    жив{mf|ым|ой}".'
  speaker: null
- guid: a2869740-4baa-4484-a1c7-de267f236042
  event: Companions_Ulfar_23
  text: '{n}Весело оскалившись, гигант вкрадчиво осведомляется:{/n} "А ты как думаешь?"'
  speaker: null
- guid: b974dc24-ace3-4426-a46e-bf97cdf3917c
  event: Companions_Ulfar_24
  text: '"Но не из одного мрачного разрушения сложен наш дух. Вкус веселья ведом нам не хуже вкуса битвы. В чертоге героев
    мы устраиваем пиры, каких не найти нигде. Под гремящий смех поднимаем мы рога, рассказываем саги и чествуем героев".'
  speaker: null
- guid: 44b64caa-fcbc-438a-a368-aee2dbe52a97
  event: Companions_Ulfar_25
  text: '"Годы я провел в учении, а затем прошел сквозь мрачные Врата Моркаи, поклонился обеим его головам на рунных камнях
    и ступил в долину грез. Что видел я там, не спрашивай — то между мной и Волком смерти. Рунные жрецы рыскали в моей душе,
    но признали ее нетронутой скверной. Вернувшись, я был причащен из Чаши Вульфена. Волчья спираль вошла в мою кровь, и агония
    трансформации преобразила мое тело на манер зверя, а разум утопила в темных пучинах кровавого безумия".'
  speaker: null
- guid: f6cf56ab-5d13-40b8-9495-54cfed8952e1
  event: Companions_Ulfar_26
  text: '"Все мы однажды падем. Солнечный Волк падет, сраженный Моркаи, погаснет свет, и придет Время Волка. Отгремит гром
    Последней битвы, и не станет ничего. Каждый знает это, но не каждый может поверить и понять это. Я теперь — могу".'
  speaker: null
- guid: a2220eb7-fdfd-46f3-a7ab-c2c7915be592
  event: Companions_Ulfar_27
  text: '"Я уйду. Не спрашивай куда, ибо тебе не надо быть там, где я. Я стану изгнанником, диким убийцей. Перед тем, как
    разум мой угаснет, я удалюсь от людей туда, где живут лишь нелюди и нечестивцы. Я стану их бичом, их проклятьем, крадущимся
    в ночи хищником, что разоряет селения и убивает всех на пути. Я буду злобой Всеотца".'
  speaker: null
- guid: 41542b52-9429-4dac-8b5c-359e43f65799
  event: Companions_Ulfar_28
  text: '"Влка Фенрика". {n}Гортанный выговор Ульфара звучит архаично и свирепо.{/n} "Так мы зовемся на старом языке нашего
    мира. Мы — самые яростные из воителей Всеотца, его палачи, его возмездие".'
  speaker: null
- guid: 8d2a5860-95b4-4158-8f11-f289fc5d1ea2
  event: Companions_Ulfar_29
  text: '{n}Ульфар сумрачно прищуривается.{/n} "Ты на что-то намекаешь? Подозреваешь, что плен развратил и отравил меня пагубной
    тягой к плоти?" {n}Верхняя губа гиганта задирается, демонстрируя жуткие зубы.{/n} "Не зли волка".'
  speaker: Ulfar
- guid: f899a4ea-ad06-4aec-ac50-b70e3ef3393f
  event: Companions_Ulfar_30
  text: '"Всеотец любит всех волков. Даже проклятых".'
  speaker: null
- guid: 77f0f92d-f3d2-48e0-ac89-695b33538eea
  event: Companions_Ulfar_31
  text: '{n}Ульфар, насупившись, мечет в вас грозный взгляд, но затем, не выдержав, хохочет.{/n} "Что правда, то правда. У
    родившихся на Фенрисе через слово волк".'
  speaker: Ulfar
- guid: 4bc802d5-e2e5-4ebb-b5fe-960ab7c481aa
  event: Companions_Ulfar_32
  text: '"Я люблю рассказывать истории".'
  speaker: null
- guid: 3ecf54d7-de05-4796-a240-6b4072af9caf
  event: Companions_Ulfar_33
  text: '"От перечисления моих свершений можно утомиться". {n}Воин хвастливо указывают на отметину на броне в форме скрещенных
    костей.{/n} "Сей знак стойкости я заслужил, сразив царя-вожака убогого эльдарского племени. Он нанес мне тяжкую рану,
    и волчий жрец сказал, что мне не выжить... но я всегда выживаю. Два года лежал я в беспамятстве после той битвы".'
  speaker: null
- guid: 23874d59-eb25-42b1-b923-b06deb5f93bb
  event: Companions_Ulfar_34
  text: '"А затем приходит Сезон огня — пробуждаются вулканы, волны затапливают острова, и лишь твердь Асахейма дарует спасение
    тем, кто кровью и железом отстоит свое право жить на ней. Кланы бьются меж собой, а над полями битв кружат вороны и разносится
    волчий вой. Вот какой мой любимый дом, нет места во вселенной, подобного ему". {n}Голос Ульфара полон мечтательной ностальгии.{/n}'
  speaker: null
- guid: 4bd814cb-1b32-4f1b-9c8d-f8c86fcc4135
  event: Companions_Ulfar_35
  text: '{n}В глазах гиганта загорается хитрый огонек.{/n} "А знаешь, эттфатер, кто самый страшный враг на Фенрисе?"'
  speaker: null
- guid: 3e33ed86-cc02-4b1e-a37c-b1429fe53b9f
  event: Companions_Ulfar_36
  text: '"Мороз Хельвинтра страшен, но понятен и предсказуем. Нет".'
  speaker: null
- guid: eac8d378-8aff-47e8-9c56-535524a365e5
  event: Companions_Ulfar_37
  text: '"Мировое море свирепо, но от него можно скрыться на тверди. Нет".'
  speaker: null
- guid: 44741ed5-cd04-4345-986e-1dcb8e2a121b
  event: Companions_Ulfar_38
  text: '"Человек и впрямь опаснее всего живого, но истинный ужас не имеет привычных нам плоти и крови".'
  speaker: null
- guid: 3e8f30d6-95e9-4e33-aa33-4d6961045428
  event: Companions_Ulfar_39
  text: '"Как же без волков, если разговор про Фенрис. Волки страшны. Но самые страшные волки Фенриса — это мы".'
  speaker: null
- guid: 848f1d8f-c352-41b3-a63a-72cd4cb9964f
  event: Companions_Ulfar_40
  text: '"Ответ, принесенный на крыльях ворона мудрости. О том, сколь страшна измена, нам ведомо многое. Знай же имя страшнейшего
    из предателей".'
  speaker: null
- guid: 74ed57c6-6901-49b1-b245-59233bbbff71
  event: Companions_Ulfar_41
  text: '"Ты, наверное, говоришь про Царя ледяных троллей? Удивительно, что ты слыхал{mf||а} о нем. Но его давным давно сразил
    Харальд Волчья смерть, когда чудовище обрушилось на клан Гончих прилива. Великую сагу сложили о той охоте, люблю петь
    ее на пирах... Нет, не угадал{mf||а}".'
  speaker: null
- guid: 163c03a0-1a86-4f64-83e8-9ac23f74c7d7
  event: Companions_Ulfar_42
  text: '"Не уга... Что? Почему гнев-барсук?"'
  speaker: null
- guid: f1915ddd-f4f1-4093-9274-4b74a26f1298
  event: Companions_Ulfar_43
  text: '{n}В зычном голосе Волка звучит хриплый рев бурана.{/n} "Проклятье Вульфена — самый страшный и жестокий враг на Фенрисе.
    В сердце каждого брата живет темный зверь, кровавый и вечно голодный. Он жаждет убивать — не ради славы, долга и товарищей,
    а лишь ради убийства. В резне для него нет радости и азарта, а есть лишь тупая злоба".'
  speaker: null
- guid: fac7bcce-9df0-4fb8-9742-59dfb0f84cff
  event: Companions_Ulfar_44
  text: '"Смешное имя для несмешного зверя. У меня есть брат, на лице которого остались отметины от его когтей. На Фенрисе
    ничто не безобидно и не смешно, даже барсуки".'
  speaker: null
- guid: 01e206ee-d139-40e2-aacf-18a384927ed1
  event: Companions_Ulfar_45
  text: '{n}Хохот великана бьет в грудь, словно удар акустического орудия.{/n} "Славно! Я хотел поведать о черном проклятьи
    Вульфена, но твой ответ тоже недурен! Гнев-барсук, ха!"'
  speaker: null
- guid: e5465d2b-6cac-4b50-abf1-4f48b15db978
  event: Companions_Ulfar_46
  text: '"Волки не ждут чужих указаний. Мы чтим старый уклад, а не Кодекс Астартес. Воюем стаями, нас учат и врачуют мудрые
    жрецы. Вместо лавров мы носим страшащие демонов маски, храним старую веру, владеем чарами Фенриса и носим прозвища, обладающие
    магической силой. Таковы мы!"'
  speaker: null
- guid: 1410c6c9-99d2-430d-ba94-a03ffe5232c2
  event: Companions_Ulfar_47
  text: '"Однажды Рунный волк Лаккан поделился с нашими волчьими жрецами тайнами знахарских снадобий, врачующие раны, и секретами
    волшебных саг. Он научил видеть в брошенных рунах прошлое и будущее, призывать бурю и резать могучие талисманы".'
  speaker: null
- guid: 92fd110b-165f-45c8-a4bd-c8889b1bfaa7
  event: Companions_Ulfar_48
  text: '{n}Ульфар пожимает плечами.{/n} "Всеотец — не бог. Он — лучший из людей, наш совершенный прародитель. В жилах Лемана
    Расса текла его кровь, а в моих течет кровь Расса. Что же, я — тоже бог? Я бесконечно чту его и готов умереть за него,
    но... при чем тут вера? Разве Всеотец похож на огромного Железного волка, чья шерсть — скалы на поверхности Фенриса?"'
  speaker: Ulfar
- guid: 2148d7f3-6baf-41f8-8dd1-3f186cfbb6ab
  event: Companions_Ulfar_49
  text: '"В Великих волков. В смертоносного Черногрива и неистового Дрекана Громоволка, в стойкого Хаэгра, Горного волка,
    и Кровавого охотника. В Крадущегося между звезд, что всюду следует за нами, и жуткого двуглавого Моркаи, стража царства
    мертвых. Одни Великие волки более расположены к нам, другие — более зловредны, но каждый дарует нам свой урок. За это
    мы славим и помним их".'
  speaker: null
- guid: bac98e49-97f9-456e-aca9-6a8abb6f4c78
  event: Companions_Ulfar_50
  text: '"Точно? А я как раз собирался завершить рассказ краткой сагой на четыреста строф о дарах Рунного волка Лаккана".'
  speaker: null
- guid: 7ba536cd-f2d6-4f7d-9570-9f898b355b6b
  event: Companions_Ulfar_51
  text: '"Всеотец наделил его самодовольством, слишком большим для его хилого тела и незначительной судьбы. Когда мы прибыли
    в Простор, он был дерзок... пока не понял, что нить его готова оборваться в когтях моих своенравных братьев".'
  speaker: null
- guid: 8fd45709-5acc-4485-9227-962a0b5504f1
  event: Companions_Ulfar_52
  text: '"Как помог{mf||ла} мне сложить славную песнь в бою против Крика скверны — помнишь? Спев ее до конца, я понял, что
    связь моя с братьями крепче, чем усталость и горе".'
  speaker: null
- guid: c244b9d1-44b2-424d-893f-6855ef30ad91
  event: Companions_Ulfar_53
  text: '"Помнишь ли ты, как в шпиле Опустошительной бури меня обуяла ярость, а ты напомнил{mf||а} мне, за кого мне должно
    сражаться?"'
  speaker: null
- guid: a9c3ff59-2759-4033-8ca3-36ce07dd0a17
  event: Companions_Ulfar_54
  text: '"Когда я рассказал тебе о смерти своих братьев, Арнульфа и Скьядди, ты отдал{mf||а} должное их отваге, и я на мгновение
    будто очутился дома, на Фенрисе. И я захотел вернуться туда".'
  speaker: null
- guid: 9f8209b7-0d31-4cb7-afe7-0a87b8eed267
  event: Companions_Ulfar_55
  text: '"А когда мы стояли над телом моего брата Игнильфа... ты произнес{mf||ла} верные слова. Напомнил{mf||а} мне о моем
    мире. И я осознал, что не готов проститься с надеждой вновь узреть его".'
  speaker: null
- guid: edf2ec29-c089-4407-b6a2-590555a5afc6
  event: Companions_Ulfar_56
  text: '"Помнишь ли ты песнь, что помог{mf||ла} сложить в битве с Криком скверны? Стылая печаль была в каждой ее строфе.
    Тогда я, должно быть, впервые узрел уготованный мне путь".'
  speaker: null
- guid: c512cc26-7260-4059-97af-4a6f779a6056
  event: Companions_Ulfar_57
  text: '"Когда в шпиле Опустошительной бури гнев обуял меня, ты сказал{mf||а}, что мой долг — мстить за товарищей, убивать
    ксеносов... И ты был{mf||а} прав{mf||а}. Не важно, один я или с братьями — долг мой неизменен".'
  speaker: null
- guid: e031e8eb-ada4-49b1-973b-9eafd48eb3e9
  event: Companions_Ulfar_58
  text: '{n}Ульфар указывает на другой наплечник, где изображена черная звериная голова, и наставительно изрекает:{/n} "Это
    — Великий Волк Черногрив, покровитель убийц и тотем нашей великой роты, носящей имя Черногривых. Все знают, что мы — грозные
    и жадные до драки воины, коварные, смертоносные и не прощающие. Имя наше гремит гордо!"'
  speaker: Ulfar
- guid: 9dde4bcd-11dd-4657-bf99-7d82caa14ac2
  event: Companions_Ulfar_59
  text: '"Когда я очнулся на Фенрисе, то сразу отправился в пустоши, выследил черногривого волка и убил его голыми руками.
    За сей подвиг мне было даровано звание Волчьего гвардейца". {n}Ладонь Ульфара заботливо гладит волчью шкуру, покрывающей
    его плечи.{/n} "Тот грозный зверь отныне всюду со мной, я несу его яростный дух".'
  speaker: null
- guid: cef058c7-a7aa-441a-8326-09b55d948e24
  event: Companions_Ulfar_60
  text: '"Одиночество... Оно не так дурно. Когда я поведал тебе о смерти Арнульфа и Скьядди, ты заметил{mf||а}, что зря они
    вернулись за мной. Горько признавать, но, не имей я товарищей, не обрекал бы их на жуткую погибель".'
  speaker: null
- guid: ac63faa7-f24e-4149-b2c8-100891f072ce
  event: Companions_Ulfar_61
  text: '"Ясно же все мне стало над телом брата Игнильфа, когда ты назвал{mf||а} меня последним из стаи. Тогда-то и ясна стала
    дорога, что зовет меня".'
  speaker: null
- guid: 5c0ac091-fe8b-4b78-b556-94aaa6b0e399
  event: Companions_Ulfar_62
  text: '"Не обманись, эттфатер. Он умеет убедительно говорить, но прежде, чем я увижу кровавые трофеи, доказывающие его доблесть
    и верность, я не повернусь к нему спиной".'
  speaker: null
- guid: 5e4b60bf-60ab-4b4f-8ea5-c201094ad602
  event: Companions_Ulfar_63
  text: '"В Семь Преисподних такие дары!" {n}Воин взрывается гневным криком.{/n} "Чего стоит доблесть неумирающего?! В чем
    подвиг деяний того, кем брезгует смерть?! Когда наступит Время Волка, и павшие братья мои выйдут на последнюю битву, где
    буду я?! Один сидеть в чертоге Клыка у потухшего очага?"'
  speaker: null
- guid: 2b99690f-338a-4030-b9b7-2627c25240f3
  event: Companions_Ulfar_64
  text: '"Много раз я слышал лязг клыков Моркаи над ухом..." {n}Ульфар ограждает себя от зла суеверным жестом.{/n} "... но
    не дал ему подобраться достаточно близко, чтобы вцепиться в мой зад".'
  speaker: Ulfar
- guid: afa9ad49-013c-478c-aecf-dbec709ddcba
  event: Companions_Ulfar_65
  text: '"Путь Астартес ведет в клыки ужаса. Со всякой выносимой разумом угрозой могут справиться смертные. Мы же нужны там,
    где начинается немыслимое. То, с пониманием чего невозможно смириться. То, взглянув на что, разум плавится и бьется в
    конвульсиях".'
  speaker: null
- guid: 3bec37e6-5dcb-4ff2-9e50-ffd3a0cee422
  event: Companions_Ulfar_66
  text: '"О многом задумался я, когда пал Крик скверны. Песнь, спетая мной в той битве, была полна черной ярости и тоски.
    Они больше не пугали меня".'
  speaker: null
- guid: 28c99e0f-ab6d-441c-a53c-1d365252d579
  event: Companions_Ulfar_67
  text: '{n}Кратко помолчав, Ульфар произносит:{/n} "Ульфар Рыжий. Так зовут меня братья".'
  speaker: null
- guid: 168dc7ef-5298-47a1-88fa-39ede11ac83a
  event: Companions_Ulfar_68
  text: '{n}Прочистив горло, Ульфар добавляет уже обычным голосом:{/n} "Надеюсь, с пиром ты затягивать не будешь. Отметить
    наше спасение надо с размахом и весельем!"'
  speaker: null
- guid: 897786b0-e461-4963-932c-6462cfe276d8
  event: Companions_Ulfar_69
  text: '"Помнишь, как в шпиле Опустошительной бури меня обуяла ярость? Ты не пытал{mf|ся|ась} утишить ее, наоборот — приветствовал{mf||а}.
    И тогда приветствовать ее начал и я".'
  speaker: null
- guid: 19c5c4b0-3c46-40f1-9a36-cb65a633e7e2
  event: Companions_Ulfar_70
  text: '"Мы тоже решили блюсти осторожность. Слова его звучали красиво, а облик был благороден, но... Ложь всегда и выглядит
    похожей на правду, верно?"'
  speaker: null
- guid: 598f7ff9-8303-420f-9688-c067f129b11d
  event: Companions_Ulfar_71
  text: '"Когда поведал я тебе о судьбе своих братьев, Арнульфа и Скьядди, не славил{mf||а} ты их подвиг, лишь горькие слова
    изрек{mf||ла} о неизбежности смерти. Дух мой отозвался в тот миг".'
  speaker: null
- guid: 1418d334-c700-44de-a712-7764217e0a2d
  event: Companions_Ulfar_72
  text: '"Но все еще тлела надежда, что я отыщу братьев живыми, не давала мне укрыть голову черным саваном скорби. А затем...
    помнишь, что ты сказал{mf||а}? Я опоздал. Пропащий Ульфар вновь опоздал".'
  speaker: null
- guid: 8c4c73f4-6eec-4212-a2d3-ee455c37e7cf
  event: Companions_Ulfar_73
  text: '"Странное чувство тогда проникло в мой разум... Будто шепот, повторяющий: "Отдайся зову крови. Будь зверем".'
  speaker: null
- guid: c4ddd696-7dc8-41b7-ae7c-be9c2fb9f1d1
  event: Companions_Ulfar_74
  text: '{n}Помрачнев, Волк скомкано завершает.{/n} "Возвращение из тьмы было долгим и стоило мне... многого. Когда я вновь
    ступил в чертоги Клыка, рунные жрецы наделили тело мое оставшимся геносеменем и имплантировали священные органы. Но те
    испытания были ничтожны в сравнении с пережитым".'
  speaker: null
- guid: 12ad03c2-ea41-4606-9c48-74bc14791c93
  event: Companions_Ulfar_75
  text: '{n}Ульфар произносит трескучим, словно ломающийся камень, голосом:{/n} "Когда я одолел мрак Вульфена в душе, я направился
    к Клыку. Каждый новичок в том странствии переживает охоту. Кто-то сражается с грозным волком, кто-то — с коварным снежным
    вирмом. Я же встретил... Доппельгренделя. Хитрого и злопамятного духа".'
  speaker: Ulfar
- guid: 06fb6165-95ef-4678-a4e5-71fb2afe32e6
  event: Companions_Ulfar_76
  text: '"Мы состязались в коварстве и ярости пять дней и ночей, дух менял обличья, но в итоге я вышиб ему глаз. Удирая, он
    прошипел проклятье — нигде, пообещал он, не найти мне доблестной смерти. Сага моя оборвется бесславно, как добрая ткань
    стяга, сгнившего на конце. Когда я вернулся на Клык, сжимая его раздавленный глаз, рунный жрец осмотрел меня и помрачнел,
    но не промолвил ни слова, лишь подтвердил мою победу".'
  speaker: null
- guid: e089c43e-d7ab-4a79-9ec0-699859932f1a
  event: Companions_Ulfar_77
  text: '"Ясно же стало мне все, пока я метался в бреду, оправляясь от ран, нанесенных мне в битве с братом Игнильфом. Тогда
    много темных видений явилось мне, и каждое испило каплю тепла из горячего сердца".'
  speaker: null
- guid: 4a2238a5-881c-4f1e-97b7-7765942a331a
  event: Companions_Ulfar_78
  text: '"Хороня каждого брата, я тайно завидую ему". {n}Угрюмые слова Ульфара падают тяжело, словно обломки скалы в море.
    Его лицо темнеет и становится похоже на мрачного истукана, высеченного диким народом.{/n}'
  speaker: null
- guid: 7dfcc15e-a91f-4b2d-b2fc-cd24c3ebe6e4
  event: Companions_Ulfar_79
  text: '"Десятилетия ложатся бременем на мои руки и сердце, и однажды я окажусь слишком устал и безволен, чтобы проснуться
    и выйти на брань! Кем тогда назовут меня? Ульфаром, Что Проспал Битву?! Ульфаром, Ненужным Моркаи?!" {n}Помянув последнего,
    Ульфар делает ограждающий от зла жест.{/n}'
  speaker: null
- guid: 8813249c-3ad8-420b-bf38-4c6858d3ed6a
  event: Companions_Ulfar_80
  text: '"Обычный человек, встретив такое зло, сходит с ума от отчаяния, мы же не умеем страшиться. Просто не можем. Вместо
    этого мы испытываем невыносимый гнев. Чтобы отобрать тех, кто сможет яростно рычать в глаза немыслимому, и нужны наши
    испытания".'
  speaker: null
- guid: 6c265044-fd1e-4d34-b823-5b9b3e733757
  event: Companions_Ulfar_81
  text: '{n}Воин переходит на заговорщицкий шепот.{/n} "Хоть тело Астартес устроено так, чтобы не хмелеть, мы изобрели способ
    обойти сей запрет. Мьод, что мы варим, способен превозмочь даже нашу кровь. Оттого мы хмелеем, и пиры наши веселы. И Космические
    волки слывут самым веселым Орденом в Империуме!.. Эх... мьод... Нигде не сварить его, кроме как на старом добром Фенрисе.
    Нигде больше не растут столь ядовитые травы".'
  speaker: null
- guid: 90ce764d-9713-4b36-9c97-9bdd88f6a5db
  event: Companions_Ulfar_82
  text: '{n}Свирепый хрип звучит, как рык.{/n} "Они изранили и пленили меня, заклинили суставы брони. Когда меня волокли на
    корабль, двое моих братьев обрушились на ксеносов и попытались отбить меня. Безумная затея, но она почти увенчалась успехом...
    Почти". {n}На потемневшем от горя лице застыла гримаса боли.{/n} "Так нас стало трое пленников. Затем двое. Затем я вновь
    остался один".'
  speaker: null
- guid: dfe6b19b-aaeb-4f1a-b59e-2a3a72f01562
  event: Companions_Ulfar_83
  text: '"Я был мореходом. Каждую весну мы выходили в Мировое море и били многоруких кракенов и алчных морских дрейков. А
    затем приходил Сезон огня, и мы высаживались на Асахейм, чтобы в битве отстоять право клана на стоянку на тверди. Я был
    юн, но уже грозен, когда враг сразил меня, а я — его. Убийцу моего звали Арнульф. Избирающий доблестных, что взирал на
    брань со скал, избрал нас обоих достойными и забрал в Клык для исцеления. Мой клан был горд!"'
  speaker: null
- guid: a442138b-68e8-4590-8b1d-0281628bb403
  event: Companions_Ulfar_84
  text: '"О чем ты желаешь знать? Что привело нас в Простор? Или как я оказался в Темном городе нелюдей?"'
  speaker: null
- guid: aff1e22b-9da0-4926-bf92-00e4629f752c
  event: Companions_Ulfar_85
  text: '"И саги о них будут звучать в чертоге бессмертных, вселяя отвагу в сердца молодых!"'
  speaker: null
- guid: cc00995b-f8a6-470b-a026-6bfec69edaec
  event: Companions_Ulfar_86
  text: '"Много еще было у меня славных побед, недаром ярл даровал мне почести терминатора". {n}Астартес с гордостью демонстрирует
    знак на груди — каменную печать в виде волчьего черепа, лежащего поверх креста.{/n}'
  speaker: null
- guid: 8df43a7c-1dac-4758-a6ef-1216f4db1c8f
  event: Companions_Ulfar_87
  text: '{n}Голос Ульфара становится уклончив.{/n} "Древняя усобица. Если тебе о ней ничего не известно, значит, тебе и не
    надо этого знать".'
  speaker: null
- guid: eb5cb460-c6fe-4b5f-83a7-9b0695a66e3a
  event: Companions_Ulfar_88
  text: '"Нет мира среди звезд, лишь вечность резни и кровопролития, да хохот жаждущих божеств. Кому, как не кровавым дикарям,
    нести волю Всеотца в столь жутком месте?"'
  speaker: null
- guid: d72362e9-abe5-4343-a6ac-885174c4aeab
  event: Companions_Ulfar_89
  text: '{n}Ульфар шумно втягивает воздух, пробует ваш запах на вкус.{/n} "Чутье велит промолчать. Подобные знания можно разделить
    лишь с т{mf|ем|ой}, в ком уверен полностью".'
  speaker: Ulfar
- guid: f9030f71-20a1-42f3-a1a8-3a5f4390b120
  event: Companions_Ulfar_90
  text: '"Ну а моя стая даже среди братьев по роте числится самыми ретивыми охотниками до славы. Когда были мы юнцами, то
    не ведали запретов и предела гордости. Годы минули, все мы уже — ветераны, но нас не оставила алчная жажда подвига". {n}От
    слов великана веет теплом, словно от жарко натопленного очага в зимнюю ночь.{/n}'
  speaker: null
- guid: bc6c2604-e794-4fd7-971e-64367e36ec90
  event: Companions_Ulfar_91
  text: '{n}Ульфар практически выплевывает:{/n} "Инквизиция! Крысы, облюбовавшие дом Всеотца и правящие им в отсутствие хозяина.
    Трусы, последние в бою, но первые на военном совете. Мы видели, чего они стоят в Месяцы Позора".'
  speaker: Ulfar
- guid: 37151c5d-fcfe-407f-8747-bc6e6a498dec
  event: Companions_Ulfar_92
  text: '"Отыскать свою стаю. Они сейчас, скорее всего, исполняют какую-нибудь кровавую службу для Калькасара, и потому я
    желаю потолковать с инквизитором".'
  speaker: null
- guid: 76eb029f-e381-4c65-ab65-3aa4c1f67db1
  event: Companions_Ulfar_93
  text: '"Если кто и знает, где сейчас мои братья по стае, то это он. Но о таких вещах негоже говорить при посторонних, потому
    на военном совете я счел за лучшее хранить молчание".'
  speaker: null
- guid: 0f211074-11ca-4c40-856d-6bc2d912d446
  event: Companions_Ulfar_94
  text: '"Что именно ты желаешь узнать?"'
  speaker: null
- guid: 9514895e-6299-484c-b15a-e32e6bada49e
  event: Companions_Ulfar_95
  text: '{n}Воин азартно указывает на метку, схожую со следом когтей.{/n} "А эту ярл Рагнар вырезал, когда я снес голову презренному
    ведуну, архидеспоту Тираники-II". {n}Похвальба Ульфара меркнет, голос становится тягучим и темным, как яд в кубке.{/n}
    "Много братьев тогда пали жертвами его, и сагу о том мы не поем смертным, храня их разум. Увы, я не смог узреть свой подвиг
    — из глаз текла кровь, и ведуна я нашел по одному только запаху".'
  speaker: null
- guid: 6ed2c254-f1c8-44b6-949f-983b5d101365
  event: Companions_Ulfar_96
  text: '{n}Ульфар склоняется к вам и с дружелюбной, лишь самую малость кровожадной улыбкой произносит:{/n} "Ты же не будешь
    болтать об этом направо и налево, верно?"'
  speaker: Ulfar
- guid: 52a0dfb2-d6de-401b-872e-2fa4e87897e2
  event: Companions_Ulfar_97
  text: '"Благодарю тебя, эттфатер".'
  speaker: null
- guid: 0c972a16-990d-4958-b7e1-fe3e1890637d
  event: Companions_Ulfar_98
  text: '"Помогу тебе расправиться с врагами, осадившими твой дом, а затем отправлюсь по координатам, что дал мне Торбальд.
    Знаю, эттфатер, что если позову с собой — ты не устрашишься примкнуть ко мне в поисках, но... Место, куда я собираюсь
    лететь, и впрямь страшно и смертоносно. Мало кто сможет там выжить, и пусть меня туда ведет долг, я не желаю, чтобы он
    был оплачен твоей кровью".'
  speaker: null
- guid: 3f90d50c-fb13-4546-ad82-e2cfe3d79fad
  event: Companions_Ulfar_99
  text: '{n}Ульфар усмехается.{/n} "Таково мое прозвище. Не ведает мой голос устали ни в битве, ни на пиру. Часами могу я
    читать славные саги и устрашать врагов боевым кличем. Это славное имя дали мне мои верные друзья, Арнульф Смеющаяся Секира
    и Скьядди, Думающий Дважды".'
  speaker: Ulfar
