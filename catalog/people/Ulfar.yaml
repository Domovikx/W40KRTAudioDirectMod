- guid: 5c0ac091-fe8b-4b78-b556-94aaa6b0e399
  event: Companions_Ulfar_62
  text: '"Не обманись, эттфатер. Он умеет убедительно говорить, но прежде, чем я увижу кровавые трофеи, доказывающие его доблесть и верность, я не повернусь к нему спиной".'
