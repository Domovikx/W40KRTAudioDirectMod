    text_clean: 'Ульфар указывает на другой наплечник, где изображена черная звериная голова, и наставительно изрекает:'
  - speaker: Ulfar
    text_clean: Это — Великий Волк Черногрив, покровитель убийц и тотем нашей великой роты, носящей имя Черногривых. Все знают, что мы — грозные и жадные до драки воины, коварные, смертоносные и не прощающие. Имя наше гремит гордо!
- guid: 9dde4bcd-11dd-4657-bf99-7d82caa14ac2
  event: Companions_Ulfar_59
  text: '"Когда я очнулся на Фенрисе, то сразу отправился в пустоши, выследил черногривого волка и убил его голыми руками. За сей подвиг мне было даровано звание Волчьего гвардейца". {n}Ладонь Ульфара заботливо гладит волчью шкуру, покрывающей его плечи.{/n} "Тот грозный зверь отныне всюду со мной, я несу его яростный дух".'
