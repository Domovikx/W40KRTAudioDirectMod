    text_clean: Не зыркай на меня так, готи. Отведешь удачу.
- guid: 50fb5684-d687-419c-bf42-557101621a32
  event: BNTRS_Stressful_Ulfar_157
  text: '"Был у меня брат того же норова, что и ты, плутовка. Весельчак, каких поискать, певец!.. В общем, я твою породу знаю. Если что-то из моих вещей пропадет..."'
