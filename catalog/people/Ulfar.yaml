- guid: 14e7c834-f2a4-4f93-b76c-104884623731
  event: BNTRS_Stressful_Ulfar_16
  text: '"Это ты про трапезную, которую я... Кхм, обновил? Вини не меня, а мастера, что вытесал столь тесные кресла и хлипкие столы. Чуть кулаком, возвеселившись, пристукнешь — враз рассыпаются".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Это ты про трапезную, которую я... Кхм, обновил? Вини не меня, а мастера, что вытесал столь тесные кресла и хлипкие столы. Чуть кулаком, возвеселившись, пристукнешь — враз рассыпаются.
- guid: 5e9b3961-d4db-4438-aea3-64b5edf3dfcc
  event: BNTRS_Stressful_Ulfar_161
  text: '"Я слышу, что в твоей груди бьются два железных сердца. Одно принадлежит воину, другое — жрецу. С каким из них ты родился?"'
  speaker: Ulfar
  parts:
