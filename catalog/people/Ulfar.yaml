- guid: 740caf30-3763-4304-b47a-cab69743a03a
  event: BNTRS_Chapter3_Ulfar_121
  text: '"Хм. Готи, а я ведь тебя видел. Ты прислуживала проклятой немочи Тервантьясу. Не по вкусу тебе милость ксеносская, раз решилась на побег?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хм. Готи, а я ведь тебя видел. Ты прислуживала проклятой немочи Тервантьясу. Не по вкусу тебе милость ксеносская, раз решилась на побег?
- guid: 9973c519-cc72-4c37-a078-3d0c800671e3
  event: BNTRS_Chapter3_Ulfar_124
  text: '"Тебя не искрошили в куски лишь потому, что эттфатер решил{mf||а} завести ручного ксеноса. Так что, немочь поганая, помалкивай, пока я тебя не заткнул".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Тебя не искрошили в куски лишь потому, что эттфатер решил завести ручного ксеноса. Так что, немочь поганая, помалкивай, пока я тебя не заткнул.
- guid: 209d8b0f-f0f4-4d18-b59e-e994f77807b9
  event: BNTRS_Chapter3_Ulfar_125
  text: '"Бойцовая невольница-нелюдь? Эттфатеру стоит водить тебя на поводке, ксеносская погань, чтобы ты не забывала свое место".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Бойцовая невольница-нелюдь? Эттфатеру стоит водить тебя на поводке, ксеносская погань, чтобы ты не забывала свое место.
- guid: 0723ecbf-7168-40b9-838b-c2d58c7cc071
  event: BNTRS_Chapter3_Ulfar_17
  text: '"Лживые ксеносы играют нами словно марионетками... Я чую, что новые тенета мерзких интриг сплетаются вокруг наших дланей!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Лживые ксеносы играют нами словно марионетками... Я чую, что новые тенета мерзких интриг сплетаются вокруг наших дланей!
- guid: de64aebf-f152-4a27-9eff-1b8b02fd2af0
  event: BNTRS_Chapter4_Ulfar_06
  text: '"Ничего, как отыщу своих братьев, выследим со стаей этих усохших нелюдей и передавим, как яйца снежного змия! Никто не уйдет!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ничего, как отыщу своих братьев, выследим со стаей этих усохших нелюдей и передавим, как яйца снежного змия! Никто не уйдет!
- guid: a49dc0d5-340d-4395-98e6-595c585110c7
  event: BNTRS_Chapter4_Ulfar_112
  text: '"Кормчей душ не пристало переживать из-за обманов выродков-нелюдей. Страх — трещина в броне душе, и сквозь нее может проникнуть клякса скверны, что запачкает сердце и ум!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Кормчей душ не пристало переживать из-за обманов выродков-нелюдей. Страх — трещина в броне душе, и сквозь нее может проникнуть клякса скверны, что запачкает сердце и ум!
- guid: f266d7b8-1a69-4c2f-97b2-fd7da4d136db
  event: BNTRS_Chapter4_Ulfar_120
  text: '"Ежели человек носит в своей голове слишком много грязных секретов, что удивительного, что в грязи заведутся паразиты и изъязвят мысли".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ежели человек носит в своей голове слишком много грязных секретов, что удивительного, что в грязи заведутся паразиты и изъязвят мысли.
- guid: cf5b47c1-e477-4cc1-bb79-009f6250729b
  event: BNTRS_Chapter4_Ulfar_126
  text: '"Тебе на роду написано быть готи, проклятой душой, знающейся с духами. Хотел бы Всеотец тебе иного пути, сплел бы судьбу получше. Не противься року".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Тебе на роду написано быть готи, проклятой душой, знающейся с духами. Хотел бы Всеотец тебе иного пути, сплел бы судьбу получше. Не противься року.
- guid: c4e03fa2-ae54-4664-b983-0a42ccc2c86e
  event: BNTRS_Chapter4_Ulfar_149
  text: '"Ты пошел путем воина, жрец. Воину должно быть беспощадным, но речь не о беспощадности к врагу. Главное — беспощадность к себе!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ты пошел путем воина, жрец. Воину должно быть беспощадным, но речь не о беспощадности к врагу. Главное — беспощадность к себе!
- guid: 6ba304c6-bbdd-4f53-aadb-b0d1c436f37e
  event: BNTRS_Chapter4_Ulfar_15
  text: '"А, шакаленок, не любишь быть в неведении? За столом этим славно сидеть лишь с одной стороны?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: А, шакаленок, не любишь быть в неведении? За столом этим славно сидеть лишь с одной стороны?
- guid: 3c79c1f7-672f-4709-ad49-2f14a614e012
  event: BNTRS_Chapter4_Ulfar_154
  text: '"Славный вышел пир в честь победы над слугами Архиврага! Эттфатер, за гостеприимство я обещаю однажды оказать тебе честь и пригласить на торжество на Фенрисе!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Славный вышел пир в честь победы над слугами Архиврага! Эттфатер, за гостеприимство я обещаю однажды оказать тебе честь и пригласить на торжество на Фенрисе!
- guid: 0283bb47-8b0f-4207-ac78-9075a56ec11b
  event: BNTRS_Chapter4_Ulfar_157
  text: '"Виса о моей славной победе над Криком скверны уже складывается в сердце моем! И вы, счастливцы, сейчас услышите ее начало..."'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Виса о моей славной победе над Криком скверны уже складывается в сердце моем! И вы, счастливцы, сейчас услышите ее начало...
- guid: 127c233b-046e-46e2-8042-122fe1690e8e
  event: BNTRS_Chapter4_Ulfar_162
  text: '"Воистину, жрец. Твои собратья также не опозорили себя и не слишком мешали нам, воинам Всеотца, в сражении".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Воистину, жрец. Твои собратья также не опозорили себя и не слишком мешали нам, воинам Всеотца, в сражении.
- guid: 8e7180b2-6f3d-4bc7-aee5-1cf2a579a698
  event: BNTRS_Chapter4_Ulfar_165
  text: '"Какой коварной и изворотливой душонкой ты обладаешь, нелюдь. Прикидываешься, что способна испытывать чувства, пытаешься усыпить нашу бдительность. Но я все равно вижу лишь худородное отродье с холодным сердцем".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Какой коварной и изворотливой душонкой ты обладаешь, нелюдь. Прикидываешься, что способна испытывать чувства, пытаешься усыпить нашу бдительность. Но я все равно вижу лишь худородное отродье с холодным сердцем.
- guid: 7ae60183-97ae-4428-9201-e25c5058ea71
  event: BNTRS_Chapter4_Ulfar_170
  text: '"Туда вам и дорога, нелюдь. Даст Всеотец, узрим мы еще не один ваш богохульный мир-корабль, пылающий под нашими выстрелами".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Туда вам и дорога, нелюдь. Даст Всеотец, узрим мы еще не один ваш богохульный мир-корабль, пылающий под нашими выстрелами.
- guid: 7a971117-81c4-439d-ae12-dcce8e7c47d3
  event: BNTRS_Chapter4_Ulfar_21
  text: '"Не стоит недооценивать волшебную силу клятв. Духи уважают тех, кто дает весомые обеты, это знает каждый на Фенрисе".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не стоит недооценивать волшебную силу клятв. Духи уважают тех, кто дает весомые обеты, это знает каждый на Фенрисе.
- guid: cda63895-2c1e-4994-972d-8b31d7b9637e
  event: BNTRS_Chapter4_Ulfar_39
  text: '"Твой хозяин просто нашел полезного мясника, чтобы спихнуть на него грязную работу и не марать руки. Как и всегда вы делаете".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Твой хозяин просто нашел полезного мясника, чтобы спихнуть на него грязную работу и не марать руки. Как и всегда вы делаете.
- guid: aa0c8a19-3e30-477b-84b1-10571c334e62
  event: BNTRS_Chapter4_Ulfar_55
  text: '"Хах! А ведь я обещал этому презренному мясорезу Тервантьясу, что увижу, как он подыхает! И не солгал... О, проклятье. Я же еще обещал помочиться на его труп!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хах! А ведь я обещал этому презренному мясорезу Тервантьясу, что увижу, как он подыхает! И не солгал... О, проклятье. Я же еще обещал помочиться на его труп!
- guid: ee7c4edd-a093-4814-bd26-988fcea14792
  event: BNTRS_Chapter4_Ulfar_66
  text: '"Дружина наша покинула Темный город достойно! Нескоро они позабудут, как гостили в Комморре эттфатер и Ульфар! С удовольствием бы взглянул, как корчатся их малохольные душонки в вызванной нами буре душ!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Дружина наша покинула Темный город достойно! Нескоро они позабудут, как гостили в Комморре эттфатер и Ульфар! С удовольствием бы взглянул, как корчатся их малохольные душонки в вызванной нами буре душ!
- guid: 6321c90b-dd8b-4fc5-8aff-229d25dedfc4
  event: BNTRS_Chapter4_Ulfar_72
  text: '"Этот Винтерскейл было ничего такой, ведал радость битвы, не трусил... но все же мелковат".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Этот Винтерскейл было ничего такой, ведал радость битвы, не трусил... но все же мелковат.
- guid: 1391042f-4969-4fef-bd1d-1317020a5f2f
  event: BNTRS_Chapter4_Ulfar_78
  text: '"Хитрый паук этот Калькасар. Явно замыслил какое-то тайное дело, в коем мы послужим ему орудием. Коварен, словно ксенос!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хитрый паук этот Калькасар. Явно замыслил какое-то тайное дело, в коем мы послужим ему орудием. Коварен, словно ксенос!
- guid: 30f486cd-1ffb-45db-a76c-52782ee44435
  event: BNTRS_Chapter4_Ulfar_97
  text: '"Теперь ты ведаешь ее сагу до конца. Храни ее и неси другим, не дай подвигам былым в забвенье пасть, сестра".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Теперь ты ведаешь ее сагу до конца. Храни ее и неси другим, не дай подвигам былым в забвенье пасть, сестра.
- guid: 7c8a9ba5-6d84-475d-8a18-cee031d8afbd
  event: BNTRS_Chapter5_Ulfar_15
  text: '"Гхрм... Ценю это. Ладно, если твое слово чего-то стоит, то, может быть, ты и не такой гаденыш, как мне показалось сначала".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Гхрм... Ценю это. Ладно, если твое слово чего-то стоит, то, может быть, ты и не такой гаденыш, как мне показалось сначала.
- guid: ea1c0d23-2505-4b1e-a4f9-bbe318c6bfa4
  event: BNTRS_Chapter5_Ulfar_17
  text: '"К чему им заклинания? Мои братья и без них найдут свой путь, сестра. Деяния их весомее наших слов".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: К чему им заклинания? Мои братья и без них найдут свой путь, сестра. Деяния их весомее наших слов.
- guid: 00c1eb1d-2c29-4192-8ce8-ef864ad4a1c6
  event: BNTRS_Chapter5_Ulfar_19
  text: '"Я узнаю, кто обрек на гибель моих братьев, и строго спрошу с них! Даю клятву!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я узнаю, кто обрек на гибель моих братьев, и строго спрошу с них! Даю клятву!
- guid: ee62e656-567f-44cc-a676-43fb627c9c9d
  event: BNTRS_Companion_DLC3_Ulfar_138
  text: '"С кем ты постоянно говоришь, железный муж? Не вижу и не чую подле тебя собеседника. Уж не с черепом ли ты толкуешь о премудростях?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: С кем ты постоянно говоришь, железный муж? Не вижу и не чую подле тебя собеседника. Уж не с черепом ли ты толкуешь о премудростях?
- guid: 170aba29-fea5-4122-ac54-4793f6163a47
  event: BNTRS_Companion_DLC3_Ulfar_39
  text: '"Я чую, что ты боишься чужой смерти, мудрец. Кислый запах страха разливается в воздухе всякий раз, как опасность грозит сервочерепу, именуемому Нунциусом. Растолкуй же мне, отчего тебя столь страшит гибель того, кто и так давно мертв?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я чую, что ты боишься чужой смерти, мудрец. Кислый запах страха разливается в воздухе всякий раз, как опасность грозит сервочерепу, именуемому Нунциусом. Растолкуй же мне, отчего тебя столь страшит гибель того, кто и так давно мертв?
- guid: 9e84b9ee-cf48-4348-97e4-cbbe512675ba
  event: BNTRS_Companion_DLC3_Ulfar_60
  text: '"Хо! Да ты, железный мудрец, скрываешь под своей раздутой скорлупой душу, исполненную меда поэзии, раз старательно выправил огрехи в висе вместо того, чтобы лукавить и утверждать, что она услаждает слух и в первозданном виде. По нраву мне сие!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хо! Да ты, железный мудрец, скрываешь под своей раздутой скорлупой душу, исполненную меда поэзии, раз старательно выправил огрехи в висе вместо того, чтобы лукавить и утверждать, что она услаждает слух и в первозданном виде. По нраву мне сие!
- guid: e1d5daef-d52b-4aae-a1b6-df19a170398b
  event: BNTRS_DLC2_Ulfar_102
  text: '"Унылая забава. Хорош только тот суд, что заканчивается поединком правосудия — один на один, в кругу щитоносцев, под славную песнь!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Унылая забава. Хорош только тот суд, что заканчивается поединком правосудия — один на один, в кругу щитоносцев, под славную песнь!
- guid: badbe79f-08a2-4ec4-9dbf-6a18b6f21637
  event: BNTRS_DLC2_Ulfar_127
  text: '"Законодержец был верен своему писанию, за него сражался и умер. Непоколебим оставался до конца — достойная погибель для обычного смертного".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Законодержец был верен своему писанию, за него сражался и умер. Непоколебим оставался до конца — достойная погибель для обычного смертного.
- guid: 29a68909-ebd4-4d36-87f5-3eef55cbf456
  event: BNTRS_DLC2_Ulfar_135
  text: '"Что, законодержец, эттфатер наделил{mf||а} тебя великой властью? Выйдешь ли ты еще на поле брани, или удовольствуешься теплыми покоями?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Что, законодержец, эттфатер наделил тебя великой властью? Выйдешь ли ты еще на поле брани, или удовольствуешься теплыми покоями?
- guid: d373f685-a1ef-4aa4-9000-686e6af1b03d
  event: BNTRS_DLC2_Ulfar_146
  text: '"Что, ищейка, не любишь делить территорию с другими псами? Этот хотя бы не изворотлив и ведает о чести".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Что, ищейка, не любишь делить территорию с другими псами? Этот хотя бы не изворотлив и ведает о чести.
- guid: 3b562014-7e7a-4412-8ea0-def841e8ed3e
  event: BNTRS_DLC2_Ulfar_151
  text: '"Это ладья, которую надобно добыть для эттфатера? Ха, хватит на один зуб для могучего волка!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Это ладья, которую надобно добыть для эттфатера? Ха, хватит на один зуб для могучего волка!
- guid: f4a28034-5a2b-423f-9427-3844220a21a2
  event: BNTRS_DLC2_Ulfar_178
  text: '"Страшная участь — зачахнуть в плену, вдали от бранного поля. Мне было б стыдно взглянуть в глаза Всеотцу, встреть я подобный конец".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Страшная участь — зачахнуть в плену, вдали от бранного поля. Мне было б стыдно взглянуть в глаза Всеотцу, встреть я подобный конец.
- guid: 67d1faaf-ad55-40b8-bd66-55b32496c4b8
  event: BNTRS_DLC2_Ulfar_180
  text: '"Вот это — чудовища? Да это ксеносские козявки! Прячься, если дрогнул, а гордый сын Фенриса идет охотиться".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Вот это — чудовища? Да это ксеносские козявки! Прячься, если дрогнул, а гордый сын Фенриса идет охотиться.
- guid: 5e9ea42f-b075-429f-8cf9-7e94635520a5
  event: BNTRS_DLC2_Ulfar_222
  text: '"Не страшись меня, законодержец. Не оплошай в сражении, и справедливый гнев мой не падет на тебя".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не страшись меня, законодержец. Не оплошай в сражении, и справедливый гнев мой не падет на тебя.
- guid: ca085235-fe1c-476a-89ff-71a9d30c2dbf
  event: BNTRS_DLC2_Ulfar_223
  text: '"Не страшись, боевой пес. Теперь мы — часть одной стаи".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не страшись, боевой пес. Теперь мы — часть одной стаи.
- guid: ddf3528e-4b88-4269-9445-1c358c5c6b5e
  event: BNTRS_DLC2_Ulfar_274
  text: '"Даже пес иногда может подхватить волчий вой. Твои слова достигли моего сердца, законодержец".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Даже пес иногда может подхватить волчий вой. Твои слова достигли моего сердца, законодержец.
- guid: 4245e743-9529-45bd-a711-9530016d0d43
  event: BNTRS_DLC2_Ulfar_38
  text: '"С чего мне гневаться? Зверь чует страх хозяина, вот и скалит клыки. А ты меня боишься, законодержец, как пес — фенрисийского волка".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: С чего мне гневаться? Зверь чует страх хозяина, вот и скалит клыки. А ты меня боишься, законодержец, как пес — фенрисийского волка.
- guid: 8f62ff2f-511e-44cd-ae31-c5a1d84bfafe
  event: BNTRS_DLC2_Ulfar_41
  text: '"Пес, конечно, славный спутник, да только куда собаке до волка? Вот где ярость, вот где сила и удаль!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Пес, конечно, славный спутник, да только куда собаке до волка? Вот где ярость, вот где сила и удаль!
- guid: d64e8c2b-9059-4cfa-8dbd-a010647d8583
  event: BNTRS_DLC2_Ulfar_64
  text: '"Он пал, когда вместо боевых соратников стал слушать нашептывания иссохшей гадюки. Какой позор для воина!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Он пал, когда вместо боевых соратников стал слушать нашептывания иссохшей гадюки. Какой позор для воина!
- guid: 01951bf4-475e-45ea-ad56-4ecffc99c5df
  event: BNTRS_DLC2_Ulfar_75
  text: '"Славная вышла сеча, да вот только без пира на захваченной ладье я не чувствую полного довольства".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Славная вышла сеча, да вот только без пира на захваченной ладье я не чувствую полного довольства.
- guid: 368ae221-49b7-41b1-a34b-5af5ec193d59
  event: BNTRS_DLC3_Ulfar_09
  text: '"Доброе дело — развлечь сына Всеотца хорошей охотой! Мои руки скучают без битвы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Доброе дело — развлечь сына Всеотца хорошей охотой! Мои руки скучают без битвы.
- guid: 5904fc74-eccc-4adc-8278-76445a3046d9
  event: BNTRS_DLC3_Ulfar_106
  text: '"Ха! Холод и соленый воздух — это местечко мне по душе. Если бы не вонь горелого прометия и чужого предательства, было бы точь-в-точь, как на Фенрисе, когда приходит оттепель".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ха! Холод и соленый воздух — это местечко мне по душе. Если бы не вонь горелого прометия и чужого предательства, было бы точь-в-точь, как на Фенрисе, когда приходит оттепель.
- guid: aa89850b-d1d5-4390-9221-8bd9ab2f3206
  event: BNTRS_DLC3_Ulfar_127
  text: '"Чую запах хорошей охоты. Если здесь есть достойный противник — пусть выйдет и померяется силами с волком! А те, кто предпочитает прятаться, мне не ровня".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Чую запах хорошей охоты. Если здесь есть достойный противник — пусть выйдет и померяется силами с волком! А те, кто предпочитает прятаться, мне не ровня.
- guid: f1c3bc5f-bb13-403c-a168-84752735be42
  event: BNTRS_DLC3_Ulfar_13
  text: '"Ты снова говоришь загадками, готи. Что значит, "обогнать время"? Ни разу еще не видел врага, которому сначала ты сносишь голову, а только потом он от тебя сбегает".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ты снова говоришь загадками, готи. Что значит, "обогнать время"? Ни разу еще не видел врага, которому сначала ты сносишь голову, а только потом он от тебя сбегает.
- guid: 166b3373-6845-466b-bccd-d6ffdc88b208
  event: BNTRS_DLC3_Ulfar_59
  text: '"Не стоит бояться плодов сечи, слуга — воин страшится лишь трусости, которая не оставляет шрамов!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не стоит бояться плодов сечи, слуга — воин страшится лишь трусости, которая не оставляет шрамов!
- guid: 244f8c44-bd57-4514-b456-bfce89b6e6d0
  event: BNTRS_DLC3_Ulfar_74
  text: '"Всеотец улыбается воинам, получившим свои раны в бою. Песни их доблести достигают Его первыми".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Всеотец улыбается воинам, получившим свои раны в бою. Песни их доблести достигают Его первыми.
- guid: 54897cc2-b266-4ce2-93a4-eb46b6be7b57
  event: BNTRS_DLC3_Ulfar_86
  text: '"В толк не возьму, как чужачка может описывать вещи, которые Ангелу Императора видеть не дано? Ты пытаешься затуманить мой взгляд, элфкид".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: В толк не возьму, как чужачка может описывать вещи, которые Ангелу Императора видеть не дано? Ты пытаешься затуманить мой взгляд, элфкид.
- guid: f4e15a5c-ccb1-4220-bf0d-ffb8ba2e1c7f
  event: BNTRS_PickUps_Ulfar_117
  text: '"Дурное место. Давайте принесем Всеотцу щедрую жертву на алтаре песнопений, а затем все тут сожжем".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Дурное место. Давайте принесем Всеотцу щедрую жертву на алтаре песнопений, а затем все тут сожжем.
- guid: 05c4e498-7cad-40ab-820c-383992c7bbd1
  event: BNTRS_PickUps_Ulfar_138
  text: '"Проклятье! Эттфатер, неужели твоя ладья настолько хлипкая? Чуть не сгинули позорно!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Проклятье! Эттфатер, неужели твоя ладья настолько хлипкая? Чуть не сгинули позорно!
- guid: dd21877b-3550-40ba-8a6e-3fd73b24d607
  event: BNTRS_PickUps_Ulfar_148
  text: '"Печаль меня берет при виде добрых клинков и стягов, лежащих без дела. Место им на поле брани, а не в ларцах золоченых".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Печаль меня берет при виде добрых клинков и стягов, лежащих без дела. Место им на поле брани, а не в ларцах золоченых.
- guid: 9439ce0f-dd69-49ca-80bb-1a4141460c62
  event: BNTRS_PickUps_Ulfar_165
  text: '"Ерунда! Глист поганый отправился в пасть Моркаи, а прочие отродья узрели, что их лучшие воины — не чета нам".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ерунда! Глист поганый отправился в пасть Моркаи, а прочие отродья узрели, что их лучшие воины — не чета нам.
- guid: 1ddd52cc-8381-48c7-9965-e1f57bb04968
  event: BNTRS_PickUps_Ulfar_170
  text: '"Кровавая весталка, я видел, как ты билась сама с собой. Тяжелое испытание, изуверское — истинное коварство ксеносов".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Кровавая весталка, я видел, как ты билась сама с собой. Тяжелое испытание, изуверское — истинное коварство ксеносов.
- guid: ad6c739a-550e-4100-a98a-0855e02e2fec
  event: BNTRS_PickUps_Ulfar_214
  text: '"Хм, я не чувствую перемен. Страх наших врагов на запах такой же. Как смердел тухлятиной, так и смердит".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хм, я не чувствую перемен. Страх наших врагов на запах такой же. Как смердел тухлятиной, так и смердит.
- guid: f4dd9231-5a10-4de6-90d1-481bd7d70f24
  event: BNTRS_PickUps_Ulfar_256
  text: '"Стужа здесь, словно ледяной тролль дыхнул — и впрямь навевает воспоминания о Фенрисе... Вот и все сходство. Этот мир как стылое забвение, Фенрис же гремит борьбой за жизнь и обещанием славы".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Стужа здесь, словно ледяной тролль дыхнул — и впрямь навевает воспоминания о Фенрисе... Вот и все сходство. Этот мир как стылое забвение, Фенрис же гремит борьбой за жизнь и обещанием славы.
- guid: e5d96391-f221-4707-bf34-74b16e80e31c
  event: BNTRS_PickUps_Ulfar_34
  text: '"Дар принят, кровавая весталка. Начертай на моей броне ею руну, восславляющую мою доблесть".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Дар принят, кровавая весталка. Начертай на моей броне ею руну, восславляющую мою доблесть.
- guid: 3ad00d7a-a3cb-4338-91eb-2505510ef7f2
  event: BNTRS_PickUps_Ulfar_41
  text: '"Скажи, кровавая весталка Всеотца... А я..."'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Скажи, кровавая весталка Всеотца... А я...
- guid: 5efb90ad-0f77-4bc4-80c7-10e49238446e
  event: BNTRS_PickUps_Ulfar_47
  text: '"И впрямь. Что он — готи, что ты — готи... Когда от вашего племени порчей-то не пахло".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: И впрямь. Что он — готи, что ты — готи... Когда от вашего племени порчей-то не пахло.
- guid: 69fc33bf-55f0-44b4-9f0c-8d345c9c55de
  event: BNTRS_PickUps_Ulfar_58
  text: '"Которыми ты предсказуемо с нами не поделишься, исполненный коварства паразит".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Которыми ты предсказуемо с нами не поделишься, исполненный коварства паразит.
- guid: 49ec690e-678b-4225-9e34-888778adf979
  event: BNTRS_PickUps_Ulfar_75
  text: '"Я скорблю о кровавой весталке. Она была веселая".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я скорблю о кровавой весталке. Она была веселая.
- guid: df3f5c7c-0fbd-4f56-be16-fbcebec9d3d3
  event: BNTRS_PickUps_Ulfar_85
  text: '"Не унижай ее жалостью. Кровавая весталка идет путем жестоким, но исполненным благородства. Конец его, конечно, будет ужасен, но так и должны завершаться достойные сказания".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Не унижай ее жалостью. Кровавая весталка идет путем жестоким, но исполненным благородства. Конец его, конечно, будет ужасен, но так и должны завершаться достойные сказания.
- guid: 4997ffb2-6ccb-4862-95c3-4f510d874781
  event: BNTRS_Reactivity_DLC3_Ulfar_08
  text: '"Клыки Моркаи, ксеносы ответят за свое коварство! Пленник не был мне братом по крови, но он погиб верным сыном Всеотца. Железные мертвецы сполна заплатят виру за его смерть".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Клыки Моркаи, ксеносы ответят за свое коварство! Пленник не был мне братом по крови, но он погиб верным сыном Всеотца. Железные мертвецы сполна заплатят виру за его смерть.
- guid: 7b62d340-eeec-4a2f-b59b-7557da740475
  event: BNTRS_Reactivity_DLC3_Ulfar_17
  text: '"Ты говоришь загадками, кровавая весталка. Но я чую в твоих словах дух правды".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ты говоришь загадками, кровавая весталка. Но я чую в твоих словах дух правды.
- guid: e4e7e97c-1ee7-4c25-aa4e-1d0c568b0056
  event: BNTRS_Reactivity_DLC3_Ulfar_35
  text: '"Хм... если надумаешь выслеживать нелюдь — кинь клич, ищейка. Подлая тварь прячется, зная, что по ее следу идут сыны Императора, но от моего нюха ей не укрыться".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Хм... если надумаешь выслеживать нелюдь — кинь клич, ищейка. Подлая тварь прячется, зная, что по ее следу идут сыны Императора, но от моего нюха ей не укрыться.
- guid: ac61f1fa-6113-452d-974d-cad169694eaa
  event: BNTRS_Reactivity_DLC3_Ulfar_40
  text: '"Иначе и быть не могло, чистосердная сестра. Теперь железные ксеносы сполна отхлебнут из чаши гнева Всеотца. Славные саги сложат про капитана, что был освобожден эттфатером!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Иначе и быть не могло, чистосердная сестра. Теперь железные ксеносы сполна отхлебнут из чаши гнева Всеотца. Славные саги сложат про капитана, что был освобожден эттфатером!
- guid: 653bbcdf-945f-4b4f-9da3-2a99ee7a93ac
  event: BNTRS_Reactivity_DLC3_Ulfar_45
  text: '"Поганая тварь на столетия отняла у прародителя этфаттера радость служения во имя Человечества. Этот воин заслужил того, чтобы наконец отыскать славную погибель в бескрайнем Просторе Коронус!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Поганая тварь на столетия отняла у прародителя этфаттера радость служения во имя Человечества. Этот воин заслужил того, чтобы наконец отыскать славную погибель в бескрайнем Просторе Коронус!
- guid: 9d5a2d49-6e69-4e85-8bca-e8caa3b4357f
  event: BNTRS_Reactivity_DLC3_Ulfar_68
  text: '"Новые владения чем-то напоминают мне родной мир, этфаттер. Помни мои слова: люди, что вышли с него, станут твоими вернейшими союзниками и страшнейшими врагами всему, что встанет супротив Человечества".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: 'Новые владения чем-то напоминают мне родной мир, этфаттер. Помни мои слова: люди, что вышли с него, станут твоими вернейшими союзниками и страшнейшими врагами всему, что встанет супротив Человечества.'
- guid: 05487f34-b6c6-482a-b8d7-19909faa9535
  event: BNTRS_Stressful_Ulfar_106
  text: '"Мьод разъел бы твои желудок и печень, плутовка. Тебе мало аугментов, что уже имеешь? Довольствуйся выпивкой обычных смертных".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мьод разъел бы твои желудок и печень, плутовка. Тебе мало аугментов, что уже имеешь? Довольствуйся выпивкой обычных смертных.
- guid: 97af1b25-642f-4d13-850f-2c70668f2abf
  event: BNTRS_Stressful_Ulfar_124
  text: '"Я — творение Фенриса и Всеотца. Моя плоть от плоти гор Асахейма, вылепленная ветрами Хельвинтра. Который тебя, худосочную немочь, сдул бы вмиг прямо в задницу Моркаи".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я — творение Фенриса и Всеотца. Моя плоть от плоти гор Асахейма, вылепленная ветрами Хельвинтра. Который тебя, худосочную немочь, сдул бы вмиг прямо в задницу Моркаи.
- guid: 917a4eef-41d3-48c3-8e17-72ae31c6b9e0
  event: BNTRS_Stressful_Ulfar_144
  text: '"Да, адамантиумная шкура моя повидала немало битв и несет много славных шрамов! Услышь же славную вису о том.."'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Да, адамантиумная шкура моя повидала немало битв и несет много славных шрамов! Услышь же славную вису о том..
- guid: 2cc71f35-3f72-4390-9a96-a4c0d09edb24
  event: BNTRS_Stressful_Ulfar_147
  text: '"Моим доспехам не помешает чистка. Эй, старший слуга, распорядись! А я вознагражу тебя славной сагой за усердие!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Моим доспехам не помешает чистка. Эй, старший слуга, распорядись! А я вознагражу тебя славной сагой за усердие!
- guid: 0161f1db-446c-424e-b5e3-7584beef1007
  event: BNTRS_Stressful_Ulfar_149
  text: '"Что ты шепчешь, чистосердная сестра? Заклинание, что придаст сил? Повеление к грозным духам битвы?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Что ты шепчешь, чистосердная сестра? Заклинание, что придаст сил? Повеление к грозным духам битвы?
- guid: 58ac0cd8-35bb-42ed-8eff-8aecb1683105
  event: BNTRS_Stressful_Ulfar_151
  text: '"Кормчая моря душ, прими этот амулет как знак почтения к твоему ремеслу. Всякий созревший кормчий, водящий суда, носит такой у меня дома, на Фенрисе".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Кормчая моря душ, прими этот амулет как знак почтения к твоему ремеслу. Всякий созревший кормчий, водящий суда, носит такой у меня дома, на Фенрисе.
- guid: 27a75dea-8d77-4d21-96c3-eb7c417ae32b
  event: BNTRS_Stressful_Ulfar_153
  text: '"Гр-р-рхм!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Гр-р-рхм!
- guid: 44dda00b-403e-4729-93c3-c08d0c81c655
  event: BNTRS_Stressful_Ulfar_155
  text: '"Не зыркай на меня так, готи. Отведешь удачу".'
