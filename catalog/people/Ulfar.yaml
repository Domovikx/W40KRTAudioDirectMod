  event: Companions_Ulfar_60
  text: '"Одиночество... Оно не так дурно. Когда я поведал тебе о смерти Арнульфа и Скьядди, ты заметил{mf||а}, что зря они вернулись за мной. Горько признавать, но, не имей я товарищей, не обрекал бы их на жуткую погибель".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Одиночество... Оно не так дурно. Когда я поведал тебе о смерти Арнульфа и Скьядди, ты заметил, что зря они вернулись за мной. Горько признавать, но, не имей я товарищей, не обрекал бы их на жуткую погибель.
