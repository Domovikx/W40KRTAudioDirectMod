- guid: 5e4b60bf-60ab-4b4f-8ea5-c201094ad602
  event: Companions_Ulfar_63
  text: '"В Семь Преисподних такие дары!" {n}Воин взрывается гневным криком.{/n} "Чего стоит доблесть неумирающего?! В чем подвиг деяний того, кем брезгует смерть?! Когда наступит Время Волка, и павшие братья мои выйдут на последнюю битву, где буду я?! Один сидеть в чертоге Клыка у потухшего очага?"'
  speaker: Ulfar
