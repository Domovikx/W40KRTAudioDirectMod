  parts:
  - speaker: Ulfar
    text_clean: Путь Астартес ведет в клыки ужаса. Со всякой выносимой разумом угрозой могут справиться смертные. Мы же нужны там, где начинается немыслимое. То, с пониманием чего невозможно смириться. То, взглянув на что, разум плавится и бьется в конвульсиях.
