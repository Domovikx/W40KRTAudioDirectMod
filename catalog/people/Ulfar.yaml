- guid: 8813249c-3ad8-420b-bf38-4c6858d3ed6a
  event: Companions_Ulfar_80
  text: '"Обычный человек, встретив такое зло, сходит с ума от отчаяния, мы же не умеем страшиться. Просто не можем. Вместо этого мы испытываем невыносимый гнев. Чтобы отобрать тех, кто сможет яростно рычать в глаза немыслимому, и нужны наши испытания".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Обычный человек, встретив такое зло, сходит с ума от отчаяния, мы же не умеем страшиться. Просто не можем. Вместо этого мы испытываем невыносимый гнев. Чтобы отобрать тех, кто сможет яростно рычать в глаза немыслимому, и нужны наши испытания.
- guid: 6c265044-fd1e-4d34-b823-5b9b3e733757
  event: Companions_Ulfar_81
  text: '{n}Воин переходит на заговорщицкий шепот.{/n} "Хоть тело Астартес устроено так, чтобы не хмелеть, мы изобрели способ обойти сей запрет. Мьод, что мы варим, способен превозмочь даже нашу кровь. Оттого мы хмелеем, и пиры наши веселы. И Космические волки слывут самым веселым Орденом в Империуме!.. Эх... мьод... Нигде не сварить его, кроме как на старом добром Фенрисе. Нигде больше не растут столь ядовитые травы".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Воин переходит на заговорщицкий шепот.
  - speaker: Ulfar
    text_clean: Хоть тело Астартес устроено так, чтобы не хмелеть, мы изобрели способ обойти сей запрет. Мьод, что мы варим, способен превозмочь даже нашу кровь. Оттого мы хмелеем, и пиры наши веселы. И Космические волки слывут самым веселым Орденом в Империуме!.. Эх... мьод... Нигде не сварить его, кроме как на старом добром Фенрисе. Нигде больше не растут столь ядовитые травы.
- guid: 90ce764d-9713-4b36-9c97-9bdd88f6a5db
  event: Companions_Ulfar_82
  text: '{n}Свирепый хрип звучит, как рык.{/n} "Они изранили и пленили меня, заклинили суставы брони. Когда меня волокли на корабль, двое моих братьев обрушились на ксеносов и попытались отбить меня. Безумная затея, но она почти увенчалась успехом... Почти". {n}На потемневшем от горя лице застыла гримаса боли.{/n} "Так нас стало трое пленников. Затем двое. Затем я вновь остался один".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Свирепый хрип звучит, как рык.
  - speaker: Ulfar
    text_clean: Они изранили и пленили меня, заклинили суставы брони. Когда меня волокли на корабль, двое моих братьев обрушились на ксеносов и попытались отбить меня. Безумная затея, но она почти увенчалась успехом... Почти.
  - speaker: narrator
    text_clean: На потемневшем от горя лице застыла гримаса боли.
  - speaker: Ulfar
    text_clean: Так нас стало трое пленников. Затем двое. Затем я вновь остался один.
- guid: dfe6b19b-aaeb-4f1a-b59e-2a3a72f01562
  event: Companions_Ulfar_83
  text: '"Я был мореходом. Каждую весну мы выходили в Мировое море и били многоруких кракенов и алчных морских дрейков. А затем приходил Сезон огня, и мы высаживались на Асахейм, чтобы в битве отстоять право клана на стоянку на тверди. Я был юн, но уже грозен, когда враг сразил меня, а я — его. Убийцу моего звали Арнульф. Избирающий доблестных, что взирал на брань со скал, избрал нас обоих достойными и забрал в Клык для исцеления. Мой клан был горд!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Я был мореходом. Каждую весну мы выходили в Мировое море и били многоруких кракенов и алчных морских дрейков. А затем приходил Сезон огня, и мы высаживались на Асахейм, чтобы в битве отстоять право клана на стоянку на тверди. Я был юн, но уже грозен, когда враг сразил меня, а я — его. Убийцу моего звали Арнульф. Избирающий доблестных, что взирал на брань со скал, избрал нас обоих достойными и забрал в Клык для исцеления. Мой клан был горд!
- guid: a442138b-68e8-4590-8b1d-0281628bb403
  event: Companions_Ulfar_84
  text: '"О чем ты желаешь знать? Что привело нас в Простор? Или как я оказался в Темном городе нелюдей?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: О чем ты желаешь знать? Что привело нас в Простор? Или как я оказался в Темном городе нелюдей?
- guid: aff1e22b-9da0-4926-bf92-00e4629f752c
  event: Companions_Ulfar_85
  text: '"И саги о них будут звучать в чертоге бессмертных, вселяя отвагу в сердца молодых!"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: И саги о них будут звучать в чертоге бессмертных, вселяя отвагу в сердца молодых!
- guid: cc00995b-f8a6-470b-a026-6bfec69edaec
  event: Companions_Ulfar_86
  text: '"Много еще было у меня славных побед, недаром ярл даровал мне почести терминатора". {n}Астартес с гордостью демонстрирует знак на груди — каменную печать в виде волчьего черепа, лежащего поверх креста.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Много еще было у меня славных побед, недаром ярл даровал мне почести терминатора.
  - speaker: narrator
    text_clean: Астартес с гордостью демонстрирует знак на груди — каменную печать в виде волчьего черепа, лежащего поверх креста.
- guid: 8df43a7c-1dac-4758-a6ef-1216f4db1c8f
  event: Companions_Ulfar_87
  text: '{n}Голос Ульфара становится уклончив.{/n} "Древняя усобица. Если тебе о ней ничего не известно, значит, тебе и не надо этого знать".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Голос Ульфара становится уклончив.
  - speaker: Ulfar
    text_clean: Древняя усобица. Если тебе о ней ничего не известно, значит, тебе и не надо этого знать.
- guid: eb5cb460-c6fe-4b5f-83a7-9b0695a66e3a
  event: Companions_Ulfar_88
  text: '"Нет мира среди звезд, лишь вечность резни и кровопролития, да хохот жаждущих божеств. Кому, как не кровавым дикарям, нести волю Всеотца в столь жутком месте?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Нет мира среди звезд, лишь вечность резни и кровопролития, да хохот жаждущих божеств. Кому, как не кровавым дикарям, нести волю Всеотца в столь жутком месте?
- guid: d72362e9-abe5-4343-a6ac-885174c4aeab
  event: Companions_Ulfar_89
  text: '{n}Ульфар шумно втягивает воздух, пробует ваш запах на вкус.{/n} "Чутье велит промолчать. Подобные знания можно разделить лишь с т{mf|ем|ой}, в ком уверен полностью".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар шумно втягивает воздух, пробует ваш запах на вкус.
  - speaker: Ulfar
    text_clean: Чутье велит промолчать. Подобные знания можно разделить лишь с тем, в ком уверен полностью.
- guid: f9030f71-20a1-42f3-a1a8-3a5f4390b120
  event: Companions_Ulfar_90
  text: '"Ну а моя стая даже среди братьев по роте числится самыми ретивыми охотниками до славы. Когда были мы юнцами, то не ведали запретов и предела гордости. Годы минули, все мы уже — ветераны, но нас не оставила алчная жажда подвига". {n}От слов великана веет теплом, словно от жарко натопленного очага в зимнюю ночь.{/n}'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Ну а моя стая даже среди братьев по роте числится самыми ретивыми охотниками до славы. Когда были мы юнцами, то не ведали запретов и предела гордости. Годы минули, все мы уже — ветераны, но нас не оставила алчная жажда подвига.
  - speaker: narrator
    text_clean: От слов великана веет теплом, словно от жарко натопленного очага в зимнюю ночь.
- guid: bc6c2604-e794-4fd7-971e-64367e36ec90
  event: Companions_Ulfar_91
  text: '{n}Ульфар практически выплевывает:{/n} "Инквизиция! Крысы, облюбовавшие дом Всеотца и правящие им в отсутствие хозяина. Трусы, последние в бою, но первые на военном совете. Мы видели, чего они стоят в Месяцы Позора".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар практически выплевывает:'
  - speaker: Ulfar
    text_clean: Инквизиция! Крысы, облюбовавшие дом Всеотца и правящие им в отсутствие хозяина. Трусы, последние в бою, но первые на военном совете. Мы видели, чего они стоят в Месяцы Позора.
- guid: 37151c5d-fcfe-407f-8747-bc6e6a498dec
  event: Companions_Ulfar_92
  text: '"Отыскать свою стаю. Они сейчас, скорее всего, исполняют какую-нибудь кровавую службу для Калькасара, и потому я желаю потолковать с инквизитором".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Отыскать свою стаю. Они сейчас, скорее всего, исполняют какую-нибудь кровавую службу для Калькасара, и потому я желаю потолковать с инквизитором.
- guid: 76eb029f-e381-4c65-ab65-3aa4c1f67db1
  event: Companions_Ulfar_93
  text: '"Если кто и знает, где сейчас мои братья по стае, то это он. Но о таких вещах негоже говорить при посторонних, потому на военном совете я счел за лучшее хранить молчание".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Если кто и знает, где сейчас мои братья по стае, то это он. Но о таких вещах негоже говорить при посторонних, потому на военном совете я счел за лучшее хранить молчание.
- guid: 0f211074-11ca-4c40-856d-6bc2d912d446
  event: Companions_Ulfar_94
  text: '"Что именно ты желаешь узнать?"'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Что именно ты желаешь узнать?
- guid: 9514895e-6299-484c-b15a-e32e6bada49e
  event: Companions_Ulfar_95
  text: '{n}Воин азартно указывает на метку, схожую со следом когтей.{/n} "А эту ярл Рагнар вырезал, когда я снес голову презренному ведуну, архидеспоту Тираники-II". {n}Похвальба Ульфара меркнет, голос становится тягучим и темным, как яд в кубке.{/n} "Много братьев тогда пали жертвами его, и сагу о том мы не поем смертным, храня их разум. Увы, я не смог узреть свой подвиг — из глаз текла кровь, и ведуна я нашел по одному только запаху".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Воин азартно указывает на метку, схожую со следом когтей.
  - speaker: Ulfar
    text_clean: А эту ярл Рагнар вырезал, когда я снес голову презренному ведуну, архидеспоту Тираники-II.
  - speaker: narrator
    text_clean: Похвальба Ульфара меркнет, голос становится тягучим и темным, как яд в кубке.
  - speaker: Ulfar
    text_clean: Много братьев тогда пали жертвами его, и сагу о том мы не поем смертным, храня их разум. Увы, я не смог узреть свой подвиг — из глаз текла кровь, и ведуна я нашел по одному только запаху.
- guid: 6ed2c254-f1c8-44b6-949f-983b5d101365
  event: Companions_Ulfar_96
  text: '{n}Ульфар склоняется к вам и с дружелюбной, лишь самую малость кровожадной улыбкой произносит:{/n} "Ты же не будешь болтать об этом направо и налево, верно?"'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: 'Ульфар склоняется к вам и с дружелюбной, лишь самую малость кровожадной улыбкой произносит:'
  - speaker: Ulfar
    text_clean: Ты же не будешь болтать об этом направо и налево, верно?
- guid: 52a0dfb2-d6de-401b-872e-2fa4e87897e2
  event: Companions_Ulfar_97
  text: '"Благодарю тебя, эттфатер".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Благодарю тебя, эттфатер.
- guid: 0c972a16-990d-4958-b7e1-fe3e1890637d
  event: Companions_Ulfar_98
  text: '"Помогу тебе расправиться с врагами, осадившими твой дом, а затем отправлюсь по координатам, что дал мне Торбальд. Знаю, эттфатер, что если позову с собой — ты не устрашишься примкнуть ко мне в поисках, но... Место, куда я собираюсь лететь, и впрямь страшно и смертоносно. Мало кто сможет там выжить, и пусть меня туда ведет долг, я не желаю, чтобы он был оплачен твоей кровью".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Помогу тебе расправиться с врагами, осадившими твой дом, а затем отправлюсь по координатам, что дал мне Торбальд. Знаю, эттфатер, что если позову с собой — ты не устрашишься примкнуть ко мне в поисках, но... Место, куда я собираюсь лететь, и впрямь страшно и смертоносно. Мало кто сможет там выжить, и пусть меня туда ведет долг, я не желаю, чтобы он был оплачен твоей кровью.
- guid: 3f90d50c-fb13-4546-ad82-e2cfe3d79fad
  event: Companions_Ulfar_99
  text: '{n}Ульфар усмехается.{/n} "Таково мое прозвище. Не ведает мой голос устали ни в битве, ни на пиру. Часами могу я читать славные саги и устрашать врагов боевым кличем. Это славное имя дали мне мои верные друзья, Арнульф Смеющаяся Секира и Скьядди, Думающий Дважды".'
  speaker: Ulfar
  parts:
  - speaker: narrator
    text_clean: Ульфар усмехается.
  - speaker: Ulfar
    text_clean: Таково мое прозвище. Не ведает мой голос устали ни в битве, ни на пиру. Часами могу я читать славные саги и устрашать врагов боевым кличем. Это славное имя дали мне мои верные друзья, Арнульф Смеющаяся Секира и Скьядди, Думающий Дважды.
