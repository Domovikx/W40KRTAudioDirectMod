- guid: 06fb6165-95ef-4678-a4e5-71fb2afe32e6
  event: Companions_Ulfar_76
  text: '"Мы состязались в коварстве и ярости пять дней и ночей, дух менял обличья, но в итоге я вышиб ему глаз. Удирая, он прошипел проклятье — нигде, пообещал он, не найти мне доблестной смерти. Сага моя оборвется бесславно, как добрая ткань стяга, сгнившего на конце. Когда я вернулся на Клык, сжимая его раздавленный глаз, рунный жрец осмотрел меня и помрачнел, но не промолвил ни слова, лишь подтвердил мою победу".'
  speaker: Ulfar
  parts:
  - speaker: Ulfar
    text_clean: Мы состязались в коварстве и ярости пять дней и ночей, дух менял обличья, но в итоге я вышиб ему глаз. Удирая, он прошипел проклятье — нигде, пообещал он, не найти мне доблестной смерти. Сага моя оборвется бесславно, как добрая ткань стяга, сгнившего на конце. Когда я вернулся на Клык, сжимая его раздавленный глаз, рунный жрец осмотрел меня и помрачнел, но не промолвил ни слова, лишь подтвердил мою победу.
