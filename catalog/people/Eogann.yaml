  event: BNTRS_Reactivity_DLC3_Eogann_20
  text: '"Омниссия, сохрани тех, кто пал, до последней искры защищая слово Его, даже если враг его был бессчетен. Лишь самый светлый разум способен узреть глубину истины, что Омниссия знает все и постигает все".'
