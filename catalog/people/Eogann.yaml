- guid: f5c2961d-d04e-4751-aee7-c4a04339975d
  event: BNTRS_DLC3_Eogann_55
  text: '"Интересно, что в этом месте вызвало у тебя столь необычную реакцию? Кажется, мы имеем дело с неким феноменом, упорядочивающим течения Имматериума. Проверкой гипотез придется заняться в текущих полевых условиях".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Интересно, что в этом месте вызвало у тебя столь необычную реакцию? Кажется, мы имеем дело с неким феноменом, упорядочивающим течения Имматериума. Проверкой гипотез придется заняться в текущих полевых условиях.
- guid: 71ede9b4-422f-4eb5-b7e0-3d26ecfd7823
  event: BNTRS_DLC3_Eogann_97
  text: '"Осторожно позволю себе заметить, что во время наших совместных проектов Декабалус 4-16 не дал ни единого повода усомниться в своей добропорядочности. Его сан достаточно высок, и я рекомендовал бы дважды подумать, прежде чем подвергать критике выдвигаемые им тезисы".'
