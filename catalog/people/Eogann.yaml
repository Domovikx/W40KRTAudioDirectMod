  event: BNTRS_Companion_DLC3_Eogann_30
  text: '"Я вижу вам непривычно чего-то не знать, господин ван Калокс. Однако в неведении нет ничего предосудительного — ведь познание всегда начинается с вопроса, направленного в неизведанное. На ваш вопрос я не отвечу чего-либо, что вы не знаете сами, так что возможно вам стоит искать ответы где-то еще".'
