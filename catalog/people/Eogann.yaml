  event: BNTRS_Companion_DLC3_Eogann_34
  text: '"Госпожа Хейдари, я польщен вашей безграничной щедростью, но хочу отметить, что слово "пожертвование" предполагает безвозмездное дарение. Впрочем, я уверен, что мы сможем найти компромисс".'
