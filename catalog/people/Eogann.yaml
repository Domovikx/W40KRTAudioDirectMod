    text_clean: Мне кажется, "Соломон Антар" и "перемены" — понятия, лежащие в диаметрально противоположных контекстных полях.
- guid: 1f321259-54fc-46f1-867b-3e464f0f8330
  event: BNTRS_Companion_DLC3_Eogann_129
  text: '"Любой, кто узреет последствия бездумных заигрываний с энергиями Имматериума, многажды подумает перед тем, как ступить на эту извилистую стезю. Я нахожу это зрелище не только лишь печальным, но весьма поучительным".'
  speaker: Eogann
