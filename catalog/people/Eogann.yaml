  event: BNTRS_Companion_DLC3_Eogann_28
  text: '"Святопроцедура Великого Деланья требует благословенного притока Движущей Силы и превосходит в важности незначительные функциональные потребности экипажа, обеспечиваемые отключенными системами. Пара отсеков сможет выдержать десяток вахт без отопления во имя познания".'
