  event: BNTRS_Reactivity_DLC3_Eogann_01
  text: '"Нунциус обратил внимание на то, что в Секторе Бионика этого корабля с трепетом относятся к редким аугментациям. Это похвально для места, в котором нет своего генетора экстремис".'
