  event: BNTRS_DLC3_Eogann_48
  text: '"Омниссия даровал немало откровений этим ксеносам, а они превратили их в загадки, порой нерешаемые. Что? Да, Нунциус, я прекрасно понимаю, что для отключения питания нужно нарушить геометрию контура, но боюсь, что без ассистента с... нестандартным мышлением это малоосуществимо".'
