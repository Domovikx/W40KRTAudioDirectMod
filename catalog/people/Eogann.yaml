  event: BNTRS_Companion_DLC3_Eogann_134
  text: '"Чудовищное сходство с виденным ранее... Без сомнения, я узнаю почерк Инквизиции. Бросить десятки могучих, но неподготовленных умов на постижение неизведанного, а затем уничтожить полученное знание, ибо оно оказалось чрезмерно опасным".'
