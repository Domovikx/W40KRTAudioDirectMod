    text_clean: Технически, вы абсолютно правы и мой коллега не обладает кардиоваскулярной системой. Однако вы приписываете ему утверждения, которые он не произосил.
- guid: ff68e131-e4ee-4ec7-8d92-2e18671f205c
  event: ''
  text: '{n}Эоганн потерянно смотрит сквозь вас — тяжелые воспоминания утягивают его куда-то прочь из реальности.{/n} "Да, конечно, нам надо добраться... до Нунциуса. Я должен найти его и завершить начатое, верно?"'
