  event: BNTRS_Companion_DLC3_Eogann_95
  text: '"Незавершенное служение есть достаточно весомая причина к продлению жизни, даже если эта жизнь отмечена изъяном. Гипотетически, стигма псайкерства исправима.... в отличие от смерти".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Незавершенное служение есть достаточно весомая причина к продлению жизни, даже если эта жизнь отмечена изъяном. Гипотетически, стигма псайкерства исправима.... в отличие от смерти.
- guid: 382dedf8-7e42-4075-94d7-c26a682b0a85
  event: BNTRS_Companion_DLC3_Eogann_96
  text: '"Полагаю, стоит добавить фразу "если они совершены без санкции магоса Ханейманна". Я верно уловил смысл вашего тезиса, коллега?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Полагаю, стоит добавить фразу "если они совершены без санкции магоса Ханейманна". Я верно уловил смысл вашего тезиса, коллега?
- guid: ba55adda-83ae-43f0-8212-2ce8866845e7
  event: BNTRS_Companion_DLC3_Eogann_97
  text: '"Пытливый разум — редкое качество для мирянина. А мирянин, посмевший применить свой ум на постижение тайн ксеносов и сохранивший свои жизненные функции — статистическое чудо. Мы с Нунциусом приглашаем вас к дискуссии с целью взаимного обогащения знаниями, госпожа Хейдари".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Пытливый разум — редкое качество для мирянина. А мирянин, посмевший применить свой ум на постижение тайн ксеносов и сохранивший свои жизненные функции — статистическое чудо. Мы с Нунциусом приглашаем вас к дискуссии с целью взаимного обогащения знаниями, госпожа Хейдари.
- guid: 37ec0ed6-dffe-4d7a-9f40-b1f93988800a
  event: BNTRS_Companion_DLC3_Eogann_99
  text: '"Высказывание залогировано Нунциусом и отправлено в долгосрочный вокс-архив. Гипотеза о способности магоса Ханейманна понимать и применять юмор выдвинута, но не подтверждена окончательно".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Высказывание залогировано Нунциусом и отправлено в долгосрочный вокс-архив. Гипотеза о способности магоса Ханейманна понимать и применять юмор выдвинута, но не подтверждена окончательно.
- guid: be09acb5-b1c8-46d9-ba06-65b3f43dfe72
  event: BNTRS_DLC3_Eogann_03
  text: '"Нунциус обратил мое внимание на то, что у этого создания есть отчетливая сигнальная система вкупе с набором поведенческих ритуалов. Омниссия учит, что понимание есть истинный путь к познанию. Чтобы усмирить это существо, нужно постичь и верно интерпретировать его реакции на разные... раздражители".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус обратил мое внимание на то, что у этого создания есть отчетливая сигнальная система вкупе с набором поведенческих ритуалов. Омниссия учит, что понимание есть истинный путь к познанию. Чтобы усмирить это существо, нужно постичь и верно интерпретировать его реакции на разные... раздражители.
- guid: 7be4e471-25c4-478e-b371-5addac5c1602
  event: BNTRS_DLC3_Eogann_102
  text: '"Яркая демонстрация иррационального мышления, присущего ксеносам вашего вида. Авгурационное сканирование не показало ни единого признака того, что небесное тело, несущее станцию, обладает некоей... одушевленностью. Прекратите объяснять естественные явления через призму собственных примитивных воззрений, это чистой воды профанация".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Яркая демонстрация иррационального мышления, присущего ксеносам вашего вида. Авгурационное сканирование не показало ни единого признака того, что небесное тело, несущее станцию, обладает некоей... одушевленностью. Прекратите объяснять естественные явления через призму собственных примитивных воззрений, это чистой воды профанация.
- guid: 5433483c-2fe5-439a-aef4-7dd31d13f0fd
  event: BNTRS_DLC3_Eogann_115
  text: '"Нунциус отметил, что в начале знакомства вы относились к меровцам более подозрительно, чем сейчас. Неужели этот простой ритуал, предложенный Вольному Торговцу, смягчил ваше мнение?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус отметил, что в начале знакомства вы относились к меровцам более подозрительно, чем сейчас. Неужели этот простой ритуал, предложенный Вольному Торговцу, смягчил ваше мнение?
- guid: aed76fe6-c3c7-43c3-8f63-35b5125da5a2
  event: BNTRS_DLC3_Eogann_130
  text: '"Флора демонстрирует повышенную адаптируемость и агрессию, что редко свойственно ее роду. Подозреваю, было совершено ксенотическое вмешательство извне. Нунциус, приготовь все необходимое для сбора опытных образцов".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Флора демонстрирует повышенную адаптируемость и агрессию, что редко свойственно ее роду. Подозреваю, было совершено ксенотическое вмешательство извне. Нунциус, приготовь все необходимое для сбора опытных образцов.
- guid: 2660ffe6-796c-4396-8b8d-a5296bc707c5
  event: BNTRS_DLC3_Eogann_24
  text: '"Гораздо поразительнее другое: похититель предельно точно знает, как обезопасить окружение от тлетворного воздействия техноереси! Вглядитесь, часть оскверненной аугментики удалена вовсе, еще часть заменена на внешне похожие, но совершенно инертные конструкции. Сей кадавр подвергся чрезвычайно искусному ритуалу аутопсии!"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: 'Гораздо поразительнее другое: похититель предельно точно знает, как обезопасить окружение от тлетворного воздействия техноереси! Вглядитесь, часть оскверненной аугментики удалена вовсе, еще часть заменена на внешне похожие, но совершенно инертные конструкции. Сей кадавр подвергся чрезвычайно искусному ритуалу аутопсии!'
- guid: ac30c957-b12e-4fc6-bb60-8a776e4c7f64
  event: BNTRS_DLC3_Eogann_33
  text: '"Увы, в этих артефактах слишком мало органических составляющих, чтобы мои диагносторы могли пролить свет на их истинный возраст, а археологические изыскания никогда не были моей сильной стороной".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Увы, в этих артефактах слишком мало органических составляющих, чтобы мои диагносторы могли пролить свет на их истинный возраст, а археологические изыскания никогда не были моей сильной стороной.
- guid: 35658ce7-5d7c-4cfa-a11e-c4212ba22930
  event: BNTRS_DLC3_Eogann_46
  text: '"Отрадно видеть, уважаемый коллега, что широта вашего мышления достаточна, чтобы понять и оценить принцип работы этого творения. Не могу предположить, почему ты решил продемонстрировать ее лишь сейчас, но крайне удовлетворен намечающимися переменами в твоем подходе".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Отрадно видеть, уважаемый коллега, что широта вашего мышления достаточна, чтобы понять и оценить принцип работы этого творения. Не могу предположить, почему ты решил продемонстрировать ее лишь сейчас, но крайне удовлетворен намечающимися переменами в твоем подходе.
