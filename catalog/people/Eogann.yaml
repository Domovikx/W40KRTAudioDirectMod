  event: BNTRS_Companion_DLC3_Eogann_133
  text: '"Сочетание факторов, как я склонен полагать. Изъян узости мышления присущ многим магосам и архимагосам, что приводит к непредсказуемым и, увы, печальным последствиям. Надеюсь, ты, досточтимый коллега, на сей раз не поддашься ему". '
  speaker: Eogann
