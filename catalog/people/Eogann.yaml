  text: '"В текущем состоянии каждый из объектов обречен. Но как детали умирающих механизмов можно совместить вновь, создав функционирующий, так и подопытных можно объединить в одну сущность, даровав им продолжение жизни путем верной конфигурации феррум санктум и органических компонентов всех троих. Единственное, чего мне не хватает для продолжения эксперимента — разрешения дилеммы: кого поместить в основу?" {n}Эоганн переводит на вас горящий взгляд.{/n}'
