- guid: 29caa432-50aa-4ba8-b884-9ba25574acdf
  event: BNTRS_Companion_DLC3_Eogann_13
  text: '"Не могу не отметить, что ваши краниальные аугменты отличаются от тех, что я видел прежде, госпожа Тласс. Как правило, они более обширны. Нунциус заинтригован их устройством и тем как вы справляетесь с псайкерским проклятием с нестандартными параметрами свяженного железа".'
  speaker: Eogann
  parts:
