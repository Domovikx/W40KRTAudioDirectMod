  event: BNTRS_Reactivity_DLC3_Eogann_15
  text: '"Тонкое умение различать различные схизмы поклонения святейшему Омниссии редко встречается среди мирян. Мы с Нунциусом не держим обид".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Тонкое умение различать различные схизмы поклонения святейшему Омниссии редко встречается среди мирян. Мы с Нунциусом не держим обид.
