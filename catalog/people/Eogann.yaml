    text_clean: Эоганн потерянно смотрит сквозь вас — тяжелые воспоминания утягивают его куда-то прочь из реальности.
  - speaker: Eogann
    text_clean: Да, конечно, нам надо добраться... до Нунциуса. Я должен найти его и завершить начатое, верно?
- guid: 13f19617-d2d1-4036-a540-0e977323052e
  event: BNTRS_Companion_DLC3_Eogann_02
  text: '"Сенешаль, фантомы прошлого могут поглотить без остатка, если дать им волю. Когда-то я испытал это на себе, но с тех пор Омниссия сподвиг меня постичь способ справляться с этим. Я готов поделиться знанием".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Сенешаль, фантомы прошлого могут поглотить без остатка, если дать им волю. Когда-то я испытал это на себе, но с тех пор Омниссия сподвиг меня постичь способ справляться с этим. Я готов поделиться знанием.
- guid: 5dddc9ac-d94f-4d25-a0b6-95d9528ceabc
  event: BNTRS_Companion_DLC3_Eogann_03
  text: '"Стоит распорядиться, чтобы часть ксеносских останков транспортировали на корабль. Мне нужно пополнить запасы редких реактивов, и синтезировать их на основе тел будет проще всего".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Стоит распорядиться, чтобы часть ксеносских останков транспортировали на корабль. Мне нужно пополнить запасы редких реактивов, и синтезировать их на основе тел будет проще всего.
- guid: a448662e-57b0-4134-8571-7a9dbc799628
  event: BNTRS_Companion_DLC3_Eogann_07
  text: '"Солидарен, госпожа Хейдари. Боюсь, что даже моего мастерства не хватило бы на то, чтобы восстановить нашу телесную целостность в случае провала".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Солидарен, госпожа Хейдари. Боюсь, что даже моего мастерства не хватило бы на то, чтобы восстановить нашу телесную целостность в случае провала.
- guid: 6a007761-b40d-435c-86e4-10918fb74a1c
  event: BNTRS_Companion_DLC3_Eogann_08
  text: '"Чрезмерная импульсивность зачастую приводит к плачевным последствиям. Увы, но эту чашу горького опыта вам придется испить еще не раз и не два, сестра Арджента".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Чрезмерная импульсивность зачастую приводит к плачевным последствиям. Увы, но эту чашу горького опыта вам придется испить еще не раз и не два, сестра Арджента.
- guid: 7bf75b2d-53f1-4dc4-8dea-3a0c9206329d
  event: BNTRS_Companion_DLC3_Eogann_09
  text: '"Парадокс. Ауспекс-сканирование не показывает ничего. Диагносторы органики безмолвны. Нунциус! Перед нами непостижимый объект! Зафиксируй необходимость сюда вернуться... впоследствии".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Парадокс. Ауспекс-сканирование не показывает ничего. Диагносторы органики безмолвны. Нунциус! Перед нами непостижимый объект! Зафиксируй необходимость сюда вернуться... впоследствии.
- guid: afcda56f-fee3-4d81-81f4-33a5fb17e252
  event: BNTRS_Companion_DLC3_Eogann_101
  text: '"Нунциус недоумевает при виде трепета и утомления всех, кто посетил Администратум. Я разделяю его недоумение. Неужели столь обременительно проводить время ожидания в размышлениях и прочих благотворных занятиях для ума?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус недоумевает при виде трепета и утомления всех, кто посетил Администратум. Я разделяю его недоумение. Неужели столь обременительно проводить время ожидания в размышлениях и прочих благотворных занятиях для ума?
- guid: 30114612-6839-4645-bdeb-1defa3fc3320
  event: BNTRS_Companion_DLC3_Eogann_102
  text: '"Наоборот, госпожа Хейдари. Мне хорошо знаком страх хищного прошлого преследующего по пятам, и желание бежать, пока не кончится земля под ногами. Меня не волнует какой личиной вы предстаете передо мной — ведь ваш живой ум и острый язык все еще при вас".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Наоборот, госпожа Хейдари. Мне хорошо знаком страх хищного прошлого преследующего по пятам, и желание бежать, пока не кончится земля под ногами. Меня не волнует какой личиной вы предстаете передо мной — ведь ваш живой ум и острый язык все еще при вас.
- guid: 1ba0a299-bcca-4d60-baca-093e2136d24f
  event: BNTRS_Companion_DLC3_Eogann_104
  text: '"Впечатляющее разнообразие флоры, уникальный химический состав воздуха, а также весьма необычные психоактивные свойства кристаллической примеси в почве. Нунциус, нам просто необходимо изучить ее источник!"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Впечатляющее разнообразие флоры, уникальный химический состав воздуха, а также весьма необычные психоактивные свойства кристаллической примеси в почве. Нунциус, нам просто необходимо изучить ее источник!
- guid: b06f37c0-9c6d-4018-b1c1-c96e2bedce5f
  event: BNTRS_Companion_DLC3_Eogann_107
  text: '"Механизмы могут быть очищены и вновь введены в эксплуатацию, но потери среди служителей Культа Механикус невосполнимы. Я скорблю, но не о машинах, а о разумах, исполненных знания, что погибли вотще".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Механизмы могут быть очищены и вновь введены в эксплуатацию, но потери среди служителей Культа Механикус невосполнимы. Я скорблю, но не о машинах, а о разумах, исполненных знания, что погибли вотще.
- guid: 8511dfc8-2888-481f-a01f-3b337c74a8cb
  event: BNTRS_Companion_DLC3_Eogann_108
  text: '"Подобные методы уменьшения энтропии являются одной из немногих вещей, тревожащих гальванические цепи в моем мозгу. То, что вы их санкционируете, коллега, меня искренне удивляет".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Подобные методы уменьшения энтропии являются одной из немногих вещей, тревожащих гальванические цепи в моем мозгу. То, что вы их санкционируете, коллега, меня искренне удивляет.
- guid: 82bed9e7-987b-4697-a8ac-dac00f5c1ad0
  event: BNTRS_Companion_DLC3_Eogann_109
  text: '"Я... согласен. Я не желаю рассуждать о потенциальной ценности его экспериментов или образцов, не в этот раз. Все, чего касалось это омерзительное ксеносское исчадие, должно гореть. Все до последнего".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я... согласен. Я не желаю рассуждать о потенциальной ценности его экспериментов или образцов, не в этот раз. Все, чего касалось это омерзительное ксеносское исчадие, должно гореть. Все до последнего.
- guid: 15634a43-bf7a-41ad-8ef2-48a13ae754d0
  event: BNTRS_Companion_DLC3_Eogann_11
  text: '"Что есть шутка, кроме как не намеренное искажение смысла в угоду комическому эффекту? Вспомните наши диспуты, леди-навигатор. Пестрота оттенков лишь фикция, призванная отвлечь ваше внимание от истины".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Что есть шутка, кроме как не намеренное искажение смысла в угоду комическому эффекту? Вспомните наши диспуты, леди-навигатор. Пестрота оттенков лишь фикция, призванная отвлечь ваше внимание от истины.
- guid: 681ae365-7d7d-4a2e-ac0c-d1180d4734c5
  event: BNTRS_Companion_DLC3_Eogann_110
  text: '"Задумываясь о следствии, не стоит забывать про причину. Если не постичь и не уничтожить ксеносов, подобных тем, что захватили судно, гибель "Йесевона" станет лишь первым звеном в цепи значительных бед. Если бы я мог заполучить живой экземпляр, чтобы изыскать способ борьбы с их инвазивным геномом..."'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Задумываясь о следствии, не стоит забывать про причину. Если не постичь и не уничтожить ксеносов, подобных тем, что захватили судно, гибель "Йесевона" станет лишь первым звеном в цепи значительных бед. Если бы я мог заполучить живой экземпляр, чтобы изыскать способ борьбы с их инвазивным геномом...
- guid: 485d52f1-8174-4777-95ce-59849a32fdad
  event: BNTRS_Companion_DLC3_Eogann_111
  text: '"Воистину, тот, кто не может найти себе применение в миру, стремится в бой, чтобы так оправдать свою ценность. Порядок вещей все же незыблем и нерушим".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Воистину, тот, кто не может найти себе применение в миру, стремится в бой, чтобы так оправдать свою ценность. Порядок вещей все же незыблем и нерушим.
- guid: d8f55271-103b-4f05-a9ea-725552fb8145
  event: BNTRS_Companion_DLC3_Eogann_112
  text: '"Различие подмечено верно, но неверно истолковано. Очевидно, что сродство эльдаров к энергиям Эмпиреев выше, чем у Человечества, посему даже чудотворное поле Геллера не способно спасти их разум от... нежелательных последствий. Не пытайся объяснить свой видовой изъян чужой глупостью".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Различие подмечено верно, но неверно истолковано. Очевидно, что сродство эльдаров к энергиям Эмпиреев выше, чем у Человечества, посему даже чудотворное поле Геллера не способно спасти их разум от... нежелательных последствий. Не пытайся объяснить свой видовой изъян чужой глупостью.
- guid: 3c8d4b06-7740-4cfb-8543-3365eb6d7c46
  event: BNTRS_Companion_DLC3_Eogann_113
  text: '"Едва ли я мог предполагать, что в свиту Вольного Торговца на добровольных началах войдет экземпляр одного из самых опасных галактических видов. Нунциус, ты ведь знаком с краткой ксенологической характеристикой друкари? Их морфология изучена слабо, и возможность наблюдать представителя расы вблизи — редчайший казус".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Едва ли я мог предполагать, что в свиту Вольного Торговца на добровольных началах войдет экземпляр одного из самых опасных галактических видов. Нунциус, ты ведь знаком с краткой ксенологической характеристикой друкари? Их морфология изучена слабо, и возможность наблюдать представителя расы вблизи — редчайший казус.
- guid: a3ad3467-5a7a-4b25-aa29-e17f4642d278
  event: BNTRS_Companion_DLC3_Eogann_115
  text: '"Любопытно. Я сведущ в практиках, позволяющих подавлять воспоминания. Может ли это быть свидетельством применения одной из них?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Любопытно. Я сведущ в практиках, позволяющих подавлять воспоминания. Может ли это быть свидетельством применения одной из них?
- guid: b3d17a89-726c-483a-a9a6-f42d0fa0e4e9
  event: BNTRS_Companion_DLC3_Eogann_116
  text: '"Магос Ханейманн, твой конфликт с соратниками из Культа Механикус будоражит мое любопытство. Какой догмат ты нарушил, чтобы спровоцировать нападение? Знаешь ли ты сам? Мы с Нунциусом могли бы помочь с изучением аугментов павших..."'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Магос Ханейманн, твой конфликт с соратниками из Культа Механикус будоражит мое любопытство. Какой догмат ты нарушил, чтобы спровоцировать нападение? Знаешь ли ты сам? Мы с Нунциусом могли бы помочь с изучением аугментов павших...
- guid: 0e7933c8-6d55-4810-b7c8-24e249794d5a
  event: BNTRS_Companion_DLC3_Eogann_119
  text: '"Ваше возвращение отрадно, коллега. Отсутствие острой полемики притупляло мой разум и вселяло в него тревогу. Нунциус также настоятельно рекомендует произвести санацию ваших увечий, насколько это возможно во внелабораторных условиях".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Ваше возвращение отрадно, коллега. Отсутствие острой полемики притупляло мой разум и вселяло в него тревогу. Нунциус также настоятельно рекомендует произвести санацию ваших увечий, насколько это возможно во внелабораторных условиях.
- guid: 8a107612-cf38-4e0e-8bf3-2cfb07dcf517
  event: BNTRS_Companion_DLC3_Eogann_12
  text: '"И правда, любопытный вопрос с точки зрения анатомии. Ваш живой интерес, пример для подражания, госпожа Хейдари! Рассчитываю, что вы подробно задокументируете находки и поделитесь ими со мной. Что? Нунциус, брось эти отвратительные инсинуации!"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: И правда, любопытный вопрос с точки зрения анатомии. Ваш живой интерес, пример для подражания, госпожа Хейдари! Рассчитываю, что вы подробно задокументируете находки и поделитесь ими со мной. Что? Нунциус, брось эти отвратительные инсинуации!
- guid: 2b359e65-f610-42cc-8edf-818c0ef294ae
  event: BNTRS_Companion_DLC3_Eogann_121
  text: '"Мы не раз сталкивались с тобой на почве запретного, теперь же ты стал его воплощением. Сколь причудливы преобразования, творимые в тигле судьбы с разумами посвященных. Я не знаю куда заведет тебя этот путь, но надеюсь, что то, что ты на нем обретешь будет стоить того, чем ты пожертвовал".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Мы не раз сталкивались с тобой на почве запретного, теперь же ты стал его воплощением. Сколь причудливы преобразования, творимые в тигле судьбы с разумами посвященных. Я не знаю куда заведет тебя этот путь, но надеюсь, что то, что ты на нем обретешь будет стоить того, чем ты пожертвовал.
- guid: 4508f9aa-a29d-4e2e-89e8-b5f5e06c7aec
  event: BNTRS_Companion_DLC3_Eogann_122
  text: '"Простая логика примитивного хищнического подхода. Чем опаснее конкурент, тем сильнее необходимость его устранения. Я успел тщательно изучить гемункула Тервантьяса, и он демонстрировал ровно те же повадки".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Простая логика примитивного хищнического подхода. Чем опаснее конкурент, тем сильнее необходимость его устранения. Я успел тщательно изучить гемункула Тервантьяса, и он демонстрировал ровно те же повадки.
- guid: a0555da2-2061-4cbf-9ec3-a58b5abbf76d
  event: BNTRS_Companion_DLC3_Eogann_123
  text: '"Следовательно, впереди нас ждет опаснейшее сплетение реального с ирреальным, требующее крайней осмотрительности. Нунциус, экранируй внешние вокс-писцы и будь готов вести запись по моей команде".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Следовательно, впереди нас ждет опаснейшее сплетение реального с ирреальным, требующее крайней осмотрительности. Нунциус, экранируй внешние вокс-писцы и будь готов вести запись по моей команде.
- guid: df46d34b-a737-40af-8157-39a5f961e0d0
  event: BNTRS_Companion_DLC3_Eogann_124
  text: '"Мне не вполны ясны причины вашего смущения, сенешаль. Генеалогические истоки и склонности индивида не определяют его способность к установлению близких связей личного характера, и это неоспоримый факт".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Мне не вполны ясны причины вашего смущения, сенешаль. Генеалогические истоки и склонности индивида не определяют его способность к установлению близких связей личного характера, и это неоспоримый факт.
- guid: 2c63f94c-541e-4351-ba85-af091fb30831
  event: BNTRS_Companion_DLC3_Eogann_125
  text: '"Мы повстречали странное создание. Думаю, не ошибусь, если назову его воплощенной метафорой. Его реакции абсолютно иррациональны: при попытке рассчитать предиктивные паттерны поведения я едва не сжег дотла свои краниальные импланты".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: 'Мы повстречали странное создание. Думаю, не ошибусь, если назову его воплощенной метафорой. Его реакции абсолютно иррациональны: при попытке рассчитать предиктивные паттерны поведения я едва не сжег дотла свои краниальные импланты.'
- guid: 18a0f084-911b-4e88-9638-dbe8b5050d58
  event: BNTRS_Companion_DLC3_Eogann_128
  text: '"Мне кажется, "Соломон Антар" и "перемены" — понятия, лежащие в диаметрально противоположных контекстных полях".'
  speaker: Eogann
  parts:
