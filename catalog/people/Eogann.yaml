  event: BNTRS_Companion_DLC3_Eogann_140
  text: '"Замечу, что этот тезис верен не только для тебя. Для меня и Нунциуса странствие бок о бок с эльдаром тоже служит источником Познания, который не иссякнет даже в случае твоей гибели".'
  speaker: Eogann
