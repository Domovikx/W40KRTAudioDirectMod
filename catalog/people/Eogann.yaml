- guid: 01ca822f-736c-4a4b-b1dd-8425ac589a56
  event: ''
  text: '"Оно пыталось прекратить агонию. Но агония — это константа его бытия". {n}Эоганн мрачно отводит взгляд, на мгновение задержав его на Нунциусе.{/n}'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Оно пыталось прекратить агонию. Но агония — это константа его бытия.
  - speaker: narrator
    text_clean: Эоганн мрачно отводит взгляд, на мгновение задержав его на Нунциусе.
- guid: 02375093-d16a-4a9d-b699-70e0fc7386dd
  event: ''
  text: '"Нунциус, я абсолютно согласен с тем, что любое вмешательство в функции гальванического абдомена вызовет резкую гипертензию, но я полностью контролирую ситуацию. Летальный исход исключен". {n}Эоганн сосредоточенно всматривается в вид-скрин, закрепленный на шее. Все полости его тела аккуратно вскрыты — вы видите, как бьется багрово-розовый комок аугментированного сердца, и как приглушенно мерцает гальванический накопитель за белесоватой пленкой брюшины.{/n}'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус, я абсолютно согласен с тем, что любое вмешательство в функции гальванического абдомена вызовет резкую гипертензию, но я полностью контролирую ситуацию. Летальный исход исключен.
  - speaker: narrator
    text_clean: Эоганн сосредоточенно всматривается в вид-скрин, закрепленный на шее. Все полости его тела аккуратно вскрыты — вы видите, как бьется багрово-розовый комок аугментированного сердца, и как приглушенно мерцает гальванический накопитель за белесоватой пленкой брюшины.
- guid: 032a9843-0e05-4d4e-a9b3-5538594abbb0
  event: ''
  text: '{n}Эоганн закрывает глаза Нунциуса. Какое-то время он молча смотрит на тело, после чего подзывает к себе {g|Encyclopedia:ServoSkulls}сервочереп{/g} и отдает бинарную команду. Глазница сервочерепа гаснет, а манипуляторы застывают, и техножрец водружает его в подножье сацеллума.{/n} "Теперь я его отпустил окончательно. {name}, спасибо за эту возможность. И спасибо, что были рядом".'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн закрывает глаза Нунциуса. Какое-то время он молча смотрит на тело, после чего подзывает к себе сервочереп и отдает бинарную команду. Глазница сервочерепа гаснет, а манипуляторы застывают, и техножрец водружает его в подножье сацеллума.
  - speaker: Eogann
    text_clean: Теперь я его отпустил окончательно. КЭП, спасибо за эту возможность. И спасибо, что были рядом.
- guid: 036c099c-2705-446f-aae5-a0fb2ff214ca
  event: ''
  text: '{n}Эоганн вспыхивает возмущением, готовясь разразиться патетической тирадой... но внезапно осекается, удрученно глядя на сервочереп.{/n} "Очень жаль, Вольный Торговец, но я подчинюсь вашему решению. Ты прав, Нунциус. Масштабирование непроверенных решений может привести к печальным последствиям".'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн вспыхивает возмущением, готовясь разразиться патетической тирадой... но внезапно осекается, удрученно глядя на сервочереп.
  - speaker: Eogann
    text_clean: Очень жаль, Вольный Торговец, но я подчинюсь вашему решению. Ты прав, Нунциус. Масштабирование непроверенных решений может привести к печальным последствиям.
- guid: 03c7e53e-b470-407a-93ab-47a376f59f1e
  event: ''
  text: '"Состав питательного субстрата несбалансирован. Большое количество липидных соединений и сложных аминных цепочек. Тем не менее... органолептические показатели оцениваю как превосходные, хоть подобный способ питания и крайне иррационален". {n}Эоганн с подозрением кладет кусок жареной птицы в рот.{/n} "Крайне приемлемо".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Состав питательного субстрата несбалансирован. Большое количество липидных соединений и сложных аминных цепочек. Тем не менее... органолептические показатели оцениваю как превосходные, хоть подобный способ питания и крайне иррационален.
  - speaker: narrator
    text_clean: Эоганн с подозрением кладет кусок жареной птицы в рот.
  - speaker: Eogann
    text_clean: Крайне приемлемо.
- guid: 0619aa8c-e5be-42f9-b473-d4017d0c704c
  event: ''
  text: '{n}Эоганн опускает кончик аугментированного пальца в кубок и задумывается.{/n} "Анализ обнаружил в составе элементы металлов и органики, которыми покрыты внутренности фонтана. Увы, сия субстанция способна принести испившему лишь вейсалгию и полное разочарование в местном виноделии. Нет, Нунциус, мой анализ не нуждается в твоей ревизии".'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн опускает кончик аугментированного пальца в кубок и задумывается.
  - speaker: Eogann
    text_clean: Анализ обнаружил в составе элементы металлов и органики, которыми покрыты внутренности фонтана. Увы, сия субстанция способна принести испившему лишь вейсалгию и полное разочарование в местном виноделии. Нет, Нунциус, мой анализ не нуждается в твоей ревизии.
- guid: 06a3f038-d523-4eff-9c61-5d959f0972de
  event: ''
  text: '"Да. Впервые за долгое время мой разум абсолютно ясен. Я не сожалею о содеянном. Нунциус наконец-то свободен от скверны, и я рад, что мне хватило духа умертвить его самому. Я познал горький опыт, который не дерзну забыть, но если моя память начнет гаснуть, у меня всегда будет напоминание о том, к чему ведет отступление от догмы". {n}Эоганн печально смотрит на голову Нунциуса.{/n}'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Да. Впервые за долгое время мой разум абсолютно ясен. Я не сожалею о содеянном. Нунциус наконец-то свободен от скверны, и я рад, что мне хватило духа умертвить его самому. Я познал горький опыт, который не дерзну забыть, но если моя память начнет гаснуть, у меня всегда будет напоминание о том, к чему ведет отступление от догмы.
  - speaker: narrator
    text_clean: Эоганн печально смотрит на голову Нунциуса.
- guid: 06b1a9b5-c969-4d3a-8e3f-db7ab76adc94
  event: ''
  text: '"Искажения. Помехи. Энтропическая логика, вмешавшаяся в бытие сей обители, поразившая ее суть и множащая боль, которой несть конца и смысла". {n}Эоганн смахивает мехадендритом искры, бегущие по его лицу.{/n} "Этот технопатоген подобен худшей чуме из возможных".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Искажения. Помехи. Энтропическая логика, вмешавшаяся в бытие сей обители, поразившая ее суть и множащая боль, которой несть конца и смысла.
  - speaker: narrator
    text_clean: Эоганн смахивает мехадендритом искры, бегущие по его лицу.
  - speaker: Eogann
    text_clean: Этот технопатоген подобен худшей чуме из возможных.
- guid: 12958210-9ea2-4c20-9843-25802f7de372
  event: ''
  text: '{n}Эоганн хмурится, задумчиво теребя пистон на бороде.{/n} "Вы разделяете понятия "жизни" и "выживания"? Но где проходит эта грань? Разве что-то может перевешивать желание жить любой ценой? Признаться, я не рассматривал вопрос с подобной точки зрения, но ваша сила воли восхищает меня. Быть может, стоит проявить силу духа и мне, взглянув на гипотезу с иного ракурса".'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн хмурится, задумчиво теребя пистон на бороде.
  - speaker: Eogann
    text_clean: Вы разделяете понятия "жизни" и "выживания"? Но где проходит эта грань? Разве что-то может перевешивать желание жить любой ценой? Признаться, я не рассматривал вопрос с подобной точки зрения, но ваша сила воли восхищает меня. Быть может, стоит проявить силу духа и мне, взглянув на гипотезу с иного ракурса.
- guid: 142f9a10-a8ff-43d4-9a4c-5b200644613f
  event: ''
  text: '{n}Эоганн улыбается.{/n} "В этом нет нужды, досточтимый коллега. Каждый из нас рано или поздно встречается с лимитами своих функций, в этом нет ничего постыдного. Однако, если Вольный Торговец позволит, я готов взять на себя бремя, которое не по силе тебе".'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн улыбается.
  - speaker: Eogann
    text_clean: В этом нет нужды, досточтимый коллега. Каждый из нас рано или поздно встречается с лимитами своих функций, в этом нет ничего постыдного. Однако, если Вольный Торговец позволит, я готов взять на себя бремя, которое не по силе тебе.
- guid: 1464f39a-c325-4018-8c76-47cb09eea89c
  event: ''
  text: '"Сколь удивительно то, что это неестественное создание еще живет, в то время как более достойные пали его жертвами". {n}Эоганн подплывает к {g|Encyclopedia:Servitor}сервитору{/g} и перещелкивает несколько латунных тумблеров в его черепе.{/n} "Надеюсь, когитатор стационарного толкователя все еще исправен".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Сколь удивительно то, что это неестественное создание еще живет, в то время как более достойные пали его жертвами.
  - speaker: narrator
    text_clean: Эоганн подплывает к сервитору и перещелкивает несколько латунных тумблеров в его черепе.
  - speaker: Eogann
    text_clean: Надеюсь, когитатор стационарного толкователя все еще исправен.
- guid: 1523b6c7-702f-425f-ae4a-3daf302e677b
  event: ''
  text: '"Исключено". {n}Эоганн покачивает головой.{/n} "Исход предлагаемого сотрудничества предопределен, и он чрезвычайно неблагоприятен, Вольный Торговец".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Исключено.
  - speaker: narrator
    text_clean: Эоганн покачивает головой.
  - speaker: Eogann
    text_clean: Исход предлагаемого сотрудничества предопределен, и он чрезвычайно неблагоприятен, Вольный Торговец.
- guid: 16e9b0a6-a484-41f0-b5a3-6e0b98ceba23
  event: ''
  text: '"Я так цеплялся за идею того, что его можно спасти, что не заметил, что спасать уже нечего. Нунциус, которого я знал, погиб на этом самом месте полвека назад. Но ведь хладные останки — это не все, что остается после человека. Память. {g|Encyclopedia:ImperiumGlossary}Империум{/g} построен на памяти. Памяти о павших. О технологических заветах тех, кто был до нас. О великой жертве Бога-Императора, что ведет нас сквозь тьму беспощадного космоса". {n}Эоганн долго смотрит на Нунциуса сквозь марево стазиса.{/n} "Я дарую ему Милость Императора, а после воздам почести, как это должно сделать служителю Омниссии".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я так цеплялся за идею того, что его можно спасти, что не заметил, что спасать уже нечего. Нунциус, которого я знал, погиб на этом самом месте полвека назад. Но ведь хладные останки — это не все, что остается после человека. Память. Империум построен на памяти. Памяти о павших. О технологических заветах тех, кто был до нас. О великой жертве Бога-Императора, что ведет нас сквозь тьму беспощадного космоса.
  - speaker: narrator
    text_clean: Эоганн долго смотрит на Нунциуса сквозь марево стазиса.
  - speaker: Eogann
    text_clean: Я дарую ему Милость Императора, а после воздам почести, как это должно сделать служителю Омниссии.
- guid: 1ba4071d-7957-4674-9dc7-b92f0e0e573e
  event: ''
  text: '"Боюсь, мои вкусовые рецепторы существенно атрофировались, поэтому не могу порадовать вас ничем, кроме уже высказанных умозаключений. Однако, хочу отметить, что совместная дегустация нутриентов является весьма удовлетворительным процессом вне зависимости от их формы". {n}Эоганн многозначительно улыбается.{/n} "Предлагаю перейти к более содержательной части нашей беседы, тем более что мой коллега начинает несколько скучать".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Боюсь, мои вкусовые рецепторы существенно атрофировались, поэтому не могу порадовать вас ничем, кроме уже высказанных умозаключений. Однако, хочу отметить, что совместная дегустация нутриентов является весьма удовлетворительным процессом вне зависимости от их формы.
  - speaker: narrator
    text_clean: Эоганн многозначительно улыбается.
  - speaker: Eogann
    text_clean: Предлагаю перейти к более содержательной части нашей беседы, тем более что мой коллега начинает несколько скучать.
- guid: 1c002d4b-5345-4d7b-8db6-8f65e5c0ec88
  event: ''
  text: '{n}Эоганн коротко кивает.{/n} "Пожалуй, это к лучшему. Я благодарю вас за все, {name}. Надеюсь когда-нибудь я смогу найти ответ, который от меня ускользает, и рассказать Нунциусу о ваших выдающихся качествах. Прощайте". {n}Он разворачивается и манит сервочереп за собой. Пустые глазницы "Нунциуса" не выражают ничего.{/n}'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Эоганн коротко кивает.
  - speaker: Eogann
    text_clean: Пожалуй, это к лучшему. Я благодарю вас за все, КЭП. Надеюсь когда-нибудь я смогу найти ответ, который от меня ускользает, и рассказать Нунциусу о ваших выдающихся качествах. Прощайте.
  - speaker: narrator
    text_clean: Он разворачивается и манит сервочереп за собой. Пустые глазницы "Нунциуса" не выражают ничего.
- guid: 1c1edbfd-c3d0-4979-82f2-64c119b1c826
  event: ''
  text: '"Нунциус, вопрос продуктивного слияния аугментики с живой плотью носителя — это краеугольный камень всех моих начинаний!" {n}Эоганн еще несколько секунд молчит, словно осмысляя ответ собеседника.{/n} "Я огорчен твоими попытками придерживаться нейтралитета в данной дискуссии".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус, вопрос продуктивного слияния аугментики с живой плотью носителя — это краеугольный камень всех моих начинаний!
  - speaker: narrator
    text_clean: Эоганн еще несколько секунд молчит, словно осмысляя ответ собеседника.
  - speaker: Eogann
    text_clean: Я огорчен твоими попытками придерживаться нейтралитета в данной дискуссии.
- guid: 1e1af207-c0ca-40e2-bb69-78f46ec3069c
  event: ''
  text: '"Взгляни, Нунциус: атипичное образование в сервиторе, при этом функциональное". {n}Эоганн со свойственной ему причудливой манерой обращается к сервочерепу, деловито осматривая опухоль.{/n} "При этом сия тератома образовалась совсем недавно, но уже успела заблокировать несколько критических важных узлов управления, сковав машинный дух путами органики. Случайность или злонравный умысел?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: 'Взгляни, Нунциус: атипичное образование в сервиторе, при этом функциональное.'
  - speaker: narrator
    text_clean: Эоганн со свойственной ему причудливой манерой обращается к сервочерепу, деловито осматривая опухоль.
  - speaker: Eogann
    text_clean: При этом сия тератома образовалась совсем недавно, но уже успела заблокировать несколько критических важных узлов управления, сковав машинный дух путами органики. Случайность или злонравный умысел?
- guid: 20211c88-2e35-463a-a406-01cea85697ad
  event: ''
  text: '{n}Внезапно Нунциус начинает биться в припадке — приступ настолько силен, что он откусывает мутировавший язык и начинает захлебываться кровью.{/n} "Нет, проклятье, нет!" {n}Эоганн истошно кричит, панически мельтеша мехадендритами. Через мгновение тело Нунциуса застывает.{/n}'
  speaker: Eogann
  parts:
  - speaker: narrator
    text_clean: Внезапно Нунциус начинает биться в припадке — приступ настолько силен, что он откусывает мутировавший язык и начинает захлебываться кровью.
  - speaker: Eogann
    text_clean: Нет, проклятье, нет!
  - speaker: narrator
    text_clean: Эоганн истошно кричит, панически мельтеша мехадендритами. Через мгновение тело Нунциуса застывает.
- guid: 22781d71-5212-4017-a35e-4d51b5257639
  event: ''
  text: '"Абсурд! Невежество! Как смеешь ты намеренно искажать истину..." {n}Эоганн резко замолкает, обернувшись за плечо, словно прислушивается к кому-то. Обычно за этим плечом парит его дражайший коллега.{/n}'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Абсурд! Невежество! Как смеешь ты намеренно искажать истину...
