  parts:
  - speaker: Eogann
    text_clean: Нунциус — мой дражайший коллега, почтенный Астартес. Он незаменим и его вклад в наши совместные поиски совершенно неоценим. Его утрату я бы сравнил с потерей части себя. Это неопровержимый факт.
- guid: d9f7f15c-1d4a-4bae-9d79-ffb534e78b6c
  event: BNTRS_Companion_DLC3_Eogann_42
  text: '"Любопытно, что ты чувствуешь некую боль, которой не ощущаю я. Движущая Сила внутри моих гальванических цепей течет плавно и покойно. Возможно, ты видишь нечто, что недоступно моему восприятию, друкари".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Любопытно, что ты чувствуешь некую боль, которой не ощущаю я. Движущая Сила внутри моих гальванических цепей течет плавно и покойно. Возможно, ты видишь нечто, что недоступно моему восприятию, друкари.
- guid: d07d2e70-6b04-402a-a641-68e2591582fd
  event: BNTRS_Companion_DLC3_Eogann_44
  text: '"Нунциус — не череп, а весьма утонченный конструкт и мой дражайший коллега. Твоя вера искажает восприятие действительности и ты видишь смерть даже там, где ее нет, Кибелла".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус — не череп, а весьма утонченный конструкт и мой дражайший коллега. Твоя вера искажает восприятие действительности и ты видишь смерть даже там, где ее нет, Кибелла.
- guid: 299621d1-4085-469d-99a9-5b9f0d3e987e
  event: BNTRS_Companion_DLC3_Eogann_46
  text: '"Поверхность вашего мышления может соперничать лишь с узостью вашего восприятия, проктор. Ваши обвинения беспочвенны, а выводы ложны — они порождены лишь слепой верой в Лекс, понятие нюансов вам не знакомо".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Поверхность вашего мышления может соперничать лишь с узостью вашего восприятия, проктор. Ваши обвинения беспочвенны, а выводы ложны — они порождены лишь слепой верой в Лекс, понятие нюансов вам не знакомо.
- guid: e063aa87-8fb8-471c-9c22-89d429f48d65
  event: BNTRS_Companion_DLC3_Eogann_47
  text: '"Сестра Арджента, ваш гнев очень эффективен для сокрушения врагов рода человеческого. Но не затмевает ли он ваш разум? Не заставляет ли упускать из вида детали, составляющие целостную картину мира?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Сестра Арджента, ваш гнев очень эффективен для сокрушения врагов рода человеческого. Но не затмевает ли он ваш разум? Не заставляет ли упускать из вида детали, составляющие целостную картину мира?
- guid: 214cf885-8bae-4d12-99ed-3c8a09a947ea
  event: BNTRS_Companion_DLC3_Eogann_49
  text: '"Ты подозрительно молчалив, досточтимый коллега. Неужели моя победа в наших последних дебатах отвадила твое желание продолжать наши в высшей степени стимулирующие прения?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Ты подозрительно молчалив, досточтимый коллега. Неужели моя победа в наших последних дебатах отвадила твое желание продолжать наши в высшей степени стимулирующие прения?
- guid: d8290e05-f3d7-4ca6-b892-32a603b671f1
  event: BNTRS_Companion_DLC3_Eogann_51
  text: '"Я настоятельно прошу вас более не посещать лабораторию в мое отсутствие, дознаватель. Нунциус весьма нервничает, когда не обнаруживает экспериментальных объектов на своих местах".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я настоятельно прошу вас более не посещать лабораторию в мое отсутствие, дознаватель. Нунциус весьма нервничает, когда не обнаруживает экспериментальных объектов на своих местах.
- guid: 270ab0bc-4eba-499d-828e-2255ab216e54
  event: BNTRS_Companion_DLC3_Eogann_53
  text: '"Я обратил внимание на вашу коллекцию книг, леди-навигатор. Внимательность, тонкий литературный вкус, пытливость ума... Ведомо ли вам о том, что в вас есть задатки эрудита с нетривиальным подходом к познанию?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я обратил внимание на вашу коллекцию книг, леди-навигатор. Внимательность, тонкий литературный вкус, пытливость ума... Ведомо ли вам о том, что в вас есть задатки эрудита с нетривиальным подходом к познанию?
- guid: b04b6db7-037b-4568-954f-ea86d51db2a2
  event: BNTRS_Companion_DLC3_Eogann_55
  text: '"Госпожа Хейдари, вы изъявляли желание осмотреть мою коллекцию ксеносских артефактов. Нунциус, несмотря на присущий ему скепсис, все же согласился допустить вас к ней под его тщательным присмотром".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Госпожа Хейдари, вы изъявляли желание осмотреть мою коллекцию ксеносских артефактов. Нунциус, несмотря на присущий ему скепсис, все же согласился допустить вас к ней под его тщательным присмотром.
- guid: f9ba9ce3-30a4-4dbd-ae53-7f78effd087e
  event: BNTRS_Companion_DLC3_Eogann_57
  text: '"Эльдар, твоя жизнь среди представителей иного вида — феномен, требующий изучения. Я бы хотел провести беглое сканирование твоего тела, чтобы выяснить, как последствия варп-трансляций влияют на состояние плоти".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Эльдар, твоя жизнь среди представителей иного вида — феномен, требующий изучения. Я бы хотел провести беглое сканирование твоего тела, чтобы выяснить, как последствия варп-трансляций влияют на состояние плоти.
- guid: bb82b826-48a4-436b-816f-e2de087e9d26
  event: BNTRS_Companion_DLC3_Eogann_59
  text: '"В продолжение разговора о поэзии, почтенный Астартес. Я проанализировал записанную с ваших слов стихотворную форму и при помощи Нунциуса слегка исправил ритм. Теперь четные строки рифмуются через ассонансы, а нечетные через созвучия, что благотворно сказалось на ее структуре".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: В продолжение разговора о поэзии, почтенный Астартес. Я проанализировал записанную с ваших слов стихотворную форму и при помощи Нунциуса слегка исправил ритм. Теперь четные строки рифмуются через ассонансы, а нечетные через созвучия, что благотворно сказалось на ее структуре.
- guid: d2d6f3e8-4121-4687-aa08-dd4d37533561
  event: BNTRS_Companion_DLC3_Eogann_61
  text: '"Нунциус, лицезрел ли ты подобные шедевры зодчества доселе? Один их вид навевает на меня размышления о том, сколь могуч разум, способный создать подобное, и сколь искусны руки, что воплотили его мысль".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Нунциус, лицезрел ли ты подобные шедевры зодчества доселе? Один их вид навевает на меня размышления о том, сколь могуч разум, способный создать подобное, и сколь искусны руки, что воплотили его мысль.
- guid: 92a9644e-3286-4951-b72e-511fb368c471
  event: BNTRS_Companion_DLC3_Eogann_63
  text: '"Милосердие заканчивается там, где начинается оценка эффективности индивида. Это неоспоримый факт".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Милосердие заканчивается там, где начинается оценка эффективности индивида. Это неоспоримый факт.
- guid: f137e45c-7f43-4a64-94a3-c14127cfb495
  event: BNTRS_Companion_DLC3_Eogann_64
  text: '"Не вижу достаточных причин для пересмотра и тем более для вмешательства в окончательное формирование зародившихся уз. Гармония рождается из дисгармонии, таков алхимический принцип. Умейте ждать, коллега, терпение суть добродетель".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Не вижу достаточных причин для пересмотра и тем более для вмешательства в окончательное формирование зародившихся уз. Гармония рождается из дисгармонии, таков алхимический принцип. Умейте ждать, коллега, терпение суть добродетель.
- guid: 71623577-cb72-4983-bbce-6def6082863f
  event: BNTRS_Companion_DLC3_Eogann_65
  text: '"Я скорблю вместе с тобой, магос Ханейманн, и возношу молебны Движущей Силе, чтобы она не иссякла в пласталевых венах Ефрата-II. Но, несмотря на утраты, мир выстоял, как выстояла некогда Стигия VIII. Со временем она смогла оправиться, а значит сможет и Ефрат-II".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я скорблю вместе с тобой, магос Ханейманн, и возношу молебны Движущей Силе, чтобы она не иссякла в пласталевых венах Ефрата-II. Но, несмотря на утраты, мир выстоял, как выстояла некогда Стигия VIII. Со временем она смогла оправиться, а значит сможет и Ефрат-II.
- guid: 2747fcf3-7ae7-45a4-b2a4-51e8da846ca8
  event: BNTRS_Companion_DLC3_Eogann_66
  text: '"Беглое медике сканирование показывает опасный для вас уровень психического истощения, госпожа Тласс. Есть ли риски проявления психических феноменов?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Беглое медике сканирование показывает опасный для вас уровень психического истощения, госпожа Тласс. Есть ли риски проявления психических феноменов?
- guid: 0de370a3-81aa-440b-9796-24ca8cf2b893
  event: BNTRS_Companion_DLC3_Eogann_68
  text: '"Ненависть, госпожа Хейдари. Я занимал разум размышлениями об изуверских опытах ксеноса и воспоминаниями о своем устройстве, чтобы не думать о боли. Но лишь ненависть не позволила мне сдаться".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Ненависть, госпожа Хейдари. Я занимал разум размышлениями об изуверских опытах ксеноса и воспоминаниями о своем устройстве, чтобы не думать о боли. Но лишь ненависть не позволила мне сдаться.
- guid: 4d45c23a-7503-4ae4-b764-043f24b192d8
  event: BNTRS_Companion_DLC3_Eogann_70
  text: '"Уповайте на себя и свою биомантию, дознаватель. Вы тоже многое пережили, займите мысли собственным благополучием, вместо хлопот о моем будущем".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Уповайте на себя и свою биомантию, дознаватель. Вы тоже многое пережили, займите мысли собственным благополучием, вместо хлопот о моем будущем.
- guid: 86795f9b-3446-4c9e-a697-d32881046671
  event: BNTRS_Companion_DLC3_Eogann_73
  text: '"Леди-навигатор, когда ксеносское отродье иссекало меня, оно хвасталось вашим пыточным механизмом. Мне жаль, что вам пришлось это пережить".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Леди-навигатор, когда ксеносское отродье иссекало меня, оно хвасталось вашим пыточным механизмом. Мне жаль, что вам пришлось это пережить.
- guid: b4bbc90d-5ffd-435c-977c-c1edb0ea8821
  event: BNTRS_Companion_DLC3_Eogann_74
  text: '"Я готов подсказать вам идентификаторы нескольких заинтересованных лиц, но у нас с Нунциусом есть условие. Перед тем, как образцы попадут в ваши ловкие руки, я досконально исследую и постигну суть каждого из них совместно с моим дражайшим коллегой".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я готов подсказать вам идентификаторы нескольких заинтересованных лиц, но у нас с Нунциусом есть условие. Перед тем, как образцы попадут в ваши ловкие руки, я досконально исследую и постигну суть каждого из них совместно с моим дражайшим коллегой.
- guid: 852561b1-4b9b-4c89-a168-558c4e91f54d
  event: BNTRS_Companion_DLC3_Eogann_76
  text: '"Отрадно, что никто не попытался вторгнуться в мою лабораторию за время нашего плена. Мне предстоит свершить еще много очистительных таинств, прежде чем я окончательно избавлюсь от скверны гемункула".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Отрадно, что никто не попытался вторгнуться в мою лабораторию за время нашего плена. Мне предстоит свершить еще много очистительных таинств, прежде чем я окончательно избавлюсь от скверны гемункула.
- guid: 0a3ab43c-52d1-4c89-b8e9-6bfef63c309a
  event: BNTRS_Companion_DLC3_Eogann_78
  text: '"Чепуха. На подобных мирах можно обнаружить уникальные феномены, и тассерций тому примером. Впрочем, коллега, если вы предпочитаете потакать собственной гордыне, а не познавать мироздание во всей его полноте, не стану вам мешать".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Чепуха. На подобных мирах можно обнаружить уникальные феномены, и тассерций тому примером. Впрочем, коллега, если вы предпочитаете потакать собственной гордыне, а не познавать мироздание во всей его полноте, не стану вам мешать.
- guid: 93417322-44b0-45fb-8ffc-b2fb30e91162
  event: BNTRS_Companion_DLC3_Eogann_79
  text: '"Местные рекреационные обычаи определяю, как примитивные, но любопытные. Однако принятие подобных токсинов не самый эффективный подход к успокоению разума, исходя из статистики моих экспериментов. Нет, Нунциус, это были эксперименты, а не дегустация".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Местные рекреационные обычаи определяю, как примитивные, но любопытные. Однако принятие подобных токсинов не самый эффективный подход к успокоению разума, исходя из статистики моих экспериментов. Нет, Нунциус, это были эксперименты, а не дегустация.
- guid: 9387c467-5abd-4346-8299-cfaeb8a3af9d
  event: BNTRS_Companion_DLC3_Eogann_82
  text: '"Я согласен, Нунциус. Помещение столь впечатляющего масштаба могло быть использовано с куда большей эффективностью. Вряд ли тот, кто ныне здесь властвует, знаком с основами священного учения об эргономике".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я согласен, Нунциус. Помещение столь впечатляющего масштаба могло быть использовано с куда большей эффективностью. Вряд ли тот, кто ныне здесь властвует, знаком с основами священного учения об эргономике.
- guid: 1f71aa4e-4680-42e9-aaf1-186b26c9bb2b
  event: BNTRS_Companion_DLC3_Eogann_84
  text: '"С одной стороны, теперь можно вести наблюдение за развитием ксеноячейки в условиях, приближенных к нативным. С другой стороны, мы имеем дело с крайне опасными генетическими паразитами. Принятое решение неоднозначно".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: С одной стороны, теперь можно вести наблюдение за развитием ксеноячейки в условиях, приближенных к нативным. С другой стороны, мы имеем дело с крайне опасными генетическими паразитами. Принятое решение неоднозначно.
- guid: 5545aa04-e9e1-4d04-9fd0-682b9b963bdb
  event: BNTRS_Companion_DLC3_Eogann_85
  text: '"Более всего меня интересует, как мирянин смог столь глубоко постичь ксенотехнические секреты. Если он сотворил подобное сам, то, безусловно, его мозг достоин изучения. Если же у него были сподвижники, их нужно безотлагательно обнаружить и опросить".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Более всего меня интересует, как мирянин смог столь глубоко постичь ксенотехнические секреты. Если он сотворил подобное сам, то, безусловно, его мозг достоин изучения. Если же у него были сподвижники, их нужно безотлагательно обнаружить и опросить.
- guid: 00b40cf2-e922-467f-a5f4-5cac4ff3588a
  event: BNTRS_Companion_DLC3_Eogann_86
  text: '"Магос, неужели ты не чуешь хворь в священных токах Движущей Силы? Не слышишь стоны благословенных машин? Оставь хвалебные псалмы и присоединяйся к инициации очистительных молебнов, досточтимый коллега".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Магос, неужели ты не чуешь хворь в священных токах Движущей Силы? Не слышишь стоны благословенных машин? Оставь хвалебные псалмы и присоединяйся к инициации очистительных молебнов, досточтимый коллега.
- guid: 7c4b59d4-c187-4968-be3f-675e23661ca3
  event: BNTRS_Companion_DLC3_Eogann_87
  text: '"Я затрудняюсь определить количество органического материала, что использован в убранстве обители. Эстетика сих творений безусловна, функциональность же сомнительна".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Я затрудняюсь определить количество органического материала, что использован в убранстве обители. Эстетика сих творений безусловна, функциональность же сомнительна.
- guid: 22210a87-4da2-422d-a10c-a95dc259a859
  event: BNTRS_Companion_DLC3_Eogann_89
  text: '"Тезис, который ни я, ни Нунциус не станем оспаривать. Сие судно подобно абсцессу, кишащему скверной... И он вот-вот лопнет".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Тезис, который ни я, ни Нунциус не станем оспаривать. Сие судно подобно абсцессу, кишащему скверной... И он вот-вот лопнет.
- guid: f176446c-7817-4cdd-871f-6785ee05a321
  event: BNTRS_Companion_DLC3_Eogann_90
  text: '"Дознаватель ван Калокс, я хотел бы побеседовать с вами об... увиденном на Кьяве Гамма. Как бы вы охарактеризовали сей чудовищный образец еретической машинерии?"'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Дознаватель ван Калокс, я хотел бы побеседовать с вами об... увиденном на Кьяве Гамма. Как бы вы охарактеризовали сей чудовищный образец еретической машинерии?
- guid: 79251f05-1b1e-4ab0-8b78-048b7df8487b
  event: BNTRS_Companion_DLC3_Eogann_92
  text: '"Вероятность обнаружения индивида со схожими психофизиологическими характеристиками близка к нулевой, нет — отрицательной. Иными словами, проще будет создать генетический дубликат утерянного саванта, нежели искать нового. Но вряд ли вы, почтенный дознаватель, санкционируете такой опыт".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: Вероятность обнаружения индивида со схожими психофизиологическими характеристиками близка к нулевой, нет — отрицательной. Иными словами, проще будет создать генетический дубликат утерянного саванта, нежели искать нового. Но вряд ли вы, почтенный дознаватель, санкционируете такой опыт.
