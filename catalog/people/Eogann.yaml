  event: BNTRS_Reactivity_DLC3_Eogann_43
  text: '"Вам не стоит недооценивать мудрость старого друга и опытного коллеги, госпожа Хейдари. Продолжительные исследования показывают, что наличие подобных лиц рядом бывает жизненно необходимо".'
