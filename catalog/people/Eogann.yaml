    text_clean: Омниссия, сохрани тех, кто пал, до последней искры защищая слово Его, даже если враг его был бессчетен. Лишь самый светлый разум способен узреть глубину истины, что Омниссия знает все и постигает все.
- guid: de1f6715-bcb3-4869-8998-c0b4cb21d038
  event: BNTRS_Reactivity_DLC3_Eogann_23
  text: '"Нунциус верно подметил, досточтимый коллега: познание есть ключ ко всему. Омниссия знает все и постигает все. Даже из ксенотехнологий можно выведать тайны, что пойдут на благо Империума. Полагаю, эта священная логика и лежала в основе решения Вольного Торговца, и не нам ее оспаривать".'
  speaker: Eogann
  parts:
  - speaker: Eogann
    text_clean: 'Нунциус верно подметил, досточтимый коллега: познание есть ключ ко всему. Омниссия знает все и постигает все. Даже из ксенотехнологий можно выведать тайны, что пойдут на благо Империума. Полагаю, эта священная логика и лежала в основе решения Вольного Торговца, и не нам ее оспаривать.'
