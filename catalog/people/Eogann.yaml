  event: BNTRS_Companion_DLC3_Eogann_137
  text: '"Прошу извинить моего немногословного коллегу Нунциуса. Он впервые ведет диалог с представителем Адептус Астартес и оттого слегка... затрудняется с вербализацией своих мыслей".'
