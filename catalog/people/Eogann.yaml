  event: BNTRS_Reactivity_DLC3_Eogann_36
  text: '"Подумать только, мы побывали в полностью функциональной гробнице некронов титанических масштабов! Если бы у меня была возможность прикоснуться к ее тайнам или даже склонить того могущественного ксеноса к более содержательной беседе..."'
