  text: '"Всякий, верующий в Бога-Императора, отправляет обряды сообразно своему разумению и установленным канонам. Но из уважения и обязательств, возлагаемых на меня саном, я должен проинформировать тебя, Кибелла: постоянные истязания плоти редко идут ей на пользу".'
