- guid: 054add6d-81db-40e8-85ee-8cc003fe7b4d
  event: ''
  text: '{n}Идира непонимающе смотрит на вас.{/n} "Стать единой? О чем... вы?"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира непонимающе смотрит на вас.
  - speaker: Идира Тласс
    text_clean: Стать единой? О чем... вы?
- guid: 065c2507-3919-44ff-b3aa-ff90ba340156
  event: ''
  text: '"Спасибо, Лорд-капитан". {n}Идира выдыхает слова едва слышно. На ее лице явственно читается облегчение.{/n} "Уж на что Футфол был грязным местом... только кровью и слезами эту грязь не смыть — только сделать еще смраднее".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Спасибо, Лорд-капитан.
  - speaker: narrator
    text_clean: Идира выдыхает слова едва слышно. На ее лице явственно читается облегчение.
  - speaker: Идира Тласс
    text_clean: Уж на что Футфол был грязным местом... только кровью и слезами эту грязь не смыть — только сделать еще смраднее.
- guid: 070a94a1-fa4d-42d2-857a-3847e6ac7243
  event: ''
  text: '{n}Идира хмурится, смотря куда-то сквозь сержанта.{/n} "Хороший ты солдат, но крови на тебе больно много — своей и иной. А ведь рука, что сейчас честь отдает, может и дрогнуть во мраке. Никакие эполеты от горечи не спасут..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира хмурится, смотря куда-то сквозь сержанта.
  - speaker: Идира Тласс
    text_clean: Хороший ты солдат, но крови на тебе больно много — своей и иной. А ведь рука, что сейчас честь отдает, может и дрогнуть во мраке. Никакие эполеты от горечи не спасут...
- guid: 09a0ca6a-f5f6-43eb-bec7-c7c18591cb1d
  event: ''
  text: '"Это мои-то?... Ха!" {n}Идира шмыгает носом и криво улыбается.{/n} "Чувства юмора вам не занимать, конечно..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это мои-то?... Ха!
  - speaker: narrator
    text_clean: Идира шмыгает носом и криво улыбается.
  - speaker: Идира Тласс
    text_clean: Чувства юмора вам не занимать, конечно...
- guid: 09ddc696-b561-4a43-8e08-cae7b622fd10
  event: ''
  text: '{n}Идира содрогается от ужаса и с трудом кивает.{/n} "Я... понимаю. Конечно. Благодарю тебя, {name}. Прости меня... и прощай".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира содрогается от ужаса и с трудом кивает.
  - speaker: Идира Тласс
    text_clean: Я... понимаю. Конечно. Благодарю тебя, КЭП. Прости меня... и прощай.
- guid: 0a17a484-9533-4256-8f0a-b667e47ddd7c
  event: ''
  text: '"Кому? Правильно, не вам же помирать в мучениях. Да что уж там — жить каждый чертов миг в мучениях. Вам есть дело лишь до того, совсем сломалась ваша ведьмовская марионетка, или еще можно выжать из нее какую-то пользу. Так ведь? Ну хорошо. Будет вам польза. Можете использовать меня как хотите — мне уже все равно". {n}Идира в последний раз бросает взгляд на осколки пси-удушителя, яростно утирает рукавом слезы и смотрит куда-то сквозь вас.{/n} "Пойдем?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Кому? Правильно, не вам же помирать в мучениях. Да что уж там — жить каждый чертов миг в мучениях. Вам есть дело лишь до того, совсем сломалась ваша ведьмовская марионетка, или еще можно выжать из нее какую-то пользу. Так ведь? Ну хорошо. Будет вам польза. Можете использовать меня как хотите — мне уже все равно.
  - speaker: narrator
    text_clean: Идира в последний раз бросает взгляд на осколки пси-удушителя, яростно утирает рукавом слезы и смотрит куда-то сквозь вас.
  - speaker: Идира Тласс
    text_clean: Пойдем?
- guid: 0a9e6e67-3226-422b-be6f-896c502d8a83
  event: ''
  text: '"Если ради этого надо послужить ксеносу... пусть! Все эти дни, что я здесь, я живу в блаженной тишине. Никто не досаждает мне. Никто не мучает меня! Никто не пытается достать меня с той стороны, а с этой... с этой меня просто не замечают! Мне и не надо иного! Пускай... меня все... оставят в покое..." {n}Идира отворачивается — от резкого движения она чуть пошатывается.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Если ради этого надо послужить ксеносу... пусть! Все эти дни, что я здесь, я живу в блаженной тишине. Никто не досаждает мне. Никто не мучает меня! Никто не пытается достать меня с той стороны, а с этой... с этой меня просто не замечают! Мне и не надо иного! Пускай... меня все... оставят в покое...
  - speaker: narrator
    text_clean: Идира отворачивается — от резкого движения она чуть пошатывается.
- guid: 1103b294-f059-42e1-8e79-1f656ece7bbd
  event: ''
  text: '{n}Идира резко подается вперед. На ее лице читается одновременно гнев и безысходность.{/n} "Ну уж нет, ксенос! Эта штука... этот пси-удушитель спасет мне жизнь! Ты... ты просто слабак и не можешь с ним совладать!"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира резко подается вперед. На ее лице читается одновременно гнев и безысходность.
  - speaker: Идира Тласс
    text_clean: Ну уж нет, ксенос! Эта штука... этот пси-удушитель спасет мне жизнь! Ты... ты просто слабак и не можешь с ним совладать!
- guid: 110457e0-7266-4e14-83c6-a48db4b3910b
  event: ''
  text: '"Как скажете, Лорд-капитан". {n}Идира хитро улыбается и выпускает густое облако дыма в вашу сторону.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Как скажете, Лорд-капитан.
  - speaker: narrator
    text_clean: Идира хитро улыбается и выпускает густое облако дыма в вашу сторону.
- guid: 11ae8caa-9627-445e-80b1-39b32d321a57
  event: ''
  text: '{n}Идира хватается за голову и хрипит:{/n} "С судьбой аккуратно обращаться нужно. То, что сейчас может добром обернуться, потом назад должок попросит. Но и наоборот бывает — чтобы в будущем сладкие плоды пожинать, нужно горечи испить сначала. Думайте, что говорить собрались!"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: 'Идира хватается за голову и хрипит:'
  - speaker: Идира Тласс
    text_clean: С судьбой аккуратно обращаться нужно. То, что сейчас может добром обернуться, потом назад должок попросит. Но и наоборот бывает — чтобы в будущем сладкие плоды пожинать, нужно горечи испить сначала. Думайте, что говорить собрались!
- guid: 136daf6f-709e-4194-9495-a36f4b94eb46
  event: ''
  text: '{n}Идира делает неопределенный жест, указывая на странную "сбрую" на голове.{/n} "Видите? Это награда. Моя награда за преданность".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира делает неопределенный жест, указывая на странную "сбрую" на голове.
  - speaker: Идира Тласс
    text_clean: Видите? Это награда. Моя награда за преданность.
- guid: 146f69db-b146-4c02-93ee-32572ba1f093
  event: ''
  text: '{n}Идира пожимает плечами.{/n} "Я уже давно перестала верить в какое-либо после. Вас ждет протекторат и новые вершины, которые вы, несомненно, покорите. Меня..." {n}Голос женщины на секунду срывается, но она, шумно втянув воздух, берет себя в руки.{/n} "Лорд-капитан, пожалуйста, не заставляйте меня думать о том, что меня ждет".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира пожимает плечами.
  - speaker: Идира Тласс
    text_clean: Я уже давно перестала верить в какое-либо после. Вас ждет протекторат и новые вершины, которые вы, несомненно, покорите. Меня...
  - speaker: narrator
    text_clean: Голос женщины на секунду срывается, но она, шумно втянув воздух, берет себя в руки.
  - speaker: Идира Тласс
    text_clean: Лорд-капитан, пожалуйста, не заставляйте меня думать о том, что меня ждет.
- guid: 14d76fc8-05cf-4351-bad3-a0df2806b45c
  event: ''
  text: '"И правда не стоит. Эта бездна с удовольствием поглощает как жалкую чернь, так и холеных аристократов — а особенно ей по вкусу наивные идеалисты". {n}Идира горько улыбается Эвейну и переводит взгляд на останки его бывшего друга.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: И правда не стоит. Эта бездна с удовольствием поглощает как жалкую чернь, так и холеных аристократов — а особенно ей по вкусу наивные идеалисты.
  - speaker: narrator
    text_clean: Идира горько улыбается Эвейну и переводит взгляд на останки его бывшего друга.
- guid: 1546da9b-ee3b-47b7-ad51-4335483ed7bd
  event: ''
  text: '"Освободили". {n}Идира смотрит вам прямо в глаза и улыбается — самозабвенно, опьяненно.{/n} "От страха. От боли. От... них".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Освободили.
  - speaker: narrator
    text_clean: Идира смотрит вам прямо в глаза и улыбается — самозабвенно, опьяненно.
  - speaker: Идира Тласс
    text_clean: От страха. От боли. От... них.
- guid: 15fc9774-da64-42ba-978b-ee1237be3dfa
  event: ''
  text: '"Лорд-капитан, как же вас видеть отрадно! Я чуть было с ума не свихнулась, когда вы пропали. Все это время на стимуляторах и рекафе сидела, не спала почти, все шепотки слушала, пытаясь понять как вас найти. Я себя такой бессильной чувствовала только один раз прежде, когда Леди Теодора..." {n}Идира запинается.{/n} "Простите, что-то я несу невесть что тут".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Лорд-капитан, как же вас видеть отрадно! Я чуть было с ума не свихнулась, когда вы пропали. Все это время на стимуляторах и рекафе сидела, не спала почти, все шепотки слушала, пытаясь понять как вас найти. Я себя такой бессильной чувствовала только один раз прежде, когда Леди Теодора...
  - speaker: narrator
    text_clean: Идира запинается.
  - speaker: Идира Тласс
    text_clean: Простите, что-то я несу невесть что тут.
- guid: 17ad0f40-16d2-43bc-a41f-da110d5846bd
  event: ''
  text: '"Думаете, шепотки нам что полезное скажут? Ха, сдается мне, и раньше от них пользы не было особой, и сейчас они скорее шутку сыграют, чем на выручку придут". {n}Идира каркающе смеется.{/n} "Ваша судьба, Лорд-капитан, только в ваших руках. Не дайте словам полоумной псайкерши вас смутить — вы птица не того полета, чтобы оглядываться на брюзжание из-за пелены".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Думаете, шепотки нам что полезное скажут? Ха, сдается мне, и раньше от них пользы не было особой, и сейчас они скорее шутку сыграют, чем на выручку придут.
  - speaker: narrator
    text_clean: Идира каркающе смеется.
  - speaker: Идира Тласс
    text_clean: Ваша судьба, Лорд-капитан, только в ваших руках. Не дайте словам полоумной псайкерши вас смутить — вы птица не того полета, чтобы оглядываться на брюзжание из-за пелены.
- guid: 1a026e3e-ef3f-4d5f-ac28-45808f1e479b
  event: ''
  text: '{n}Идира тяжело дышит, глядя на вас со смесью отчаяния и недоверия. А потом, неожиданно, опускается на колени и устало всхлипывает.{/n} "Все было так хорошо, пока Леди Теодора была жива... она ценила меня, она дала мне новую жизнь! И голоса почти не мучили. А потом... потом... после... она стала приходить ко мне во снах, голоса стали звать днем и ночью..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира тяжело дышит, глядя на вас со смесью отчаяния и недоверия. А потом, неожиданно, опускается на колени и устало всхлипывает.
  - speaker: Идира Тласс
    text_clean: Все было так хорошо, пока Леди Теодора была жива... она ценила меня, она дала мне новую жизнь! И голоса почти не мучили. А потом... потом... после... она стала приходить ко мне во снах, голоса стали звать днем и ночью...
- guid: 1a70f7aa-cc6e-4081-ad2b-b4630dfe3783
  event: ''
  text: '{n}Идира испуганно всхлипывает, но в следующую секунду обнимает вас в ответ.{/n} "Вот так так... совсем вы расклеились, а?" {n}Она молчит несколько секунд и прежде чем вас отпустить совсем тихо бормочет.{/n} "Спасибо".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира испуганно всхлипывает, но в следующую секунду обнимает вас в ответ.
  - speaker: Идира Тласс
    text_clean: Вот так так... совсем вы расклеились, а?
  - speaker: narrator
    text_clean: Она молчит несколько секунд и прежде чем вас отпустить совсем тихо бормочет.
  - speaker: Идира Тласс
    text_clean: Спасибо.
- guid: 1a7a0d71-eefb-4323-88d2-802f1d312329
  event: ''
  text: '{n}Идира склоняет голову набок.{/n} "Вот на этих его словах, Лорд-капитан... "не дать добраться"... голосочки мои петь начали. Слышу, как поют про тонкую ниточку, что ведет в сердце вашей территории... слышу, как поют про Даргонус... слышу про черного дракона..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира склоняет голову набок.
  - speaker: Идира Тласс
    text_clean: Вот на этих его словах, Лорд-капитан... "не дать добраться"... голосочки мои петь начали. Слышу, как поют про тонкую ниточку, что ведет в сердце вашей территории... слышу, как поют про Даргонус... слышу про черного дракона...
- guid: 1c802124-892c-4489-a0d5-7f98c62a168d
  event: ''
  text: '{n}Идира поворачивается к вам и качает головой:{/n} "Хорошо б, конечно, взглянуть на эти надписи, но вот так навскидку — на {g|Encyclopedia:Warp}варп{/g}-влияние не похоже. Если б там в доме что-то поселилось — за десять лет оно бы уже себя активнее проявило. Десятком трупов минимум".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: 'Идира поворачивается к вам и качает головой:'
  - speaker: Идира Тласс
    text_clean: Хорошо б, конечно, взглянуть на эти надписи, но вот так навскидку — на варп-влияние не похоже. Если б там в доме что-то поселилось — за десять лет оно бы уже себя активнее проявило. Десятком трупов минимум.
- guid: 1cd7aee4-5ada-4beb-890b-14b44a497754
  event: ''
  text: '{n}Идира закусывает губу.{/n} "Да... с тех пор, как ее не стало... как ее голос зазвучал в голове... шепоты стали громче. Яснее. Заманчивей".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира закусывает губу.
  - speaker: Идира Тласс
    text_clean: Да... с тех пор, как ее не стало... как ее голос зазвучал в голове... шепоты стали громче. Яснее. Заманчивей.
- guid: 1fa8731a-1e88-4b50-8046-c529637ae958
  event: ''
  text: '"Лорд-капитан?!" {n}Идира поворачивает к вам голову, но ее безумный взгляд, на мгновение задержавшись на вашем лице, тут же соскальзывает с него. Вблизи вы видите, что основание одного из височных {g|Encyclopedia:Augmentation}имплантов{/g} Идиры почернело и оплавилось.{/n} "Нет... погодите... Лорд-капитан... Леди фон Валанциус!" {n}Идира поднимает глаза на "Теодору", стоящую прямо перед ней. По ее щекам начинают катиться слезы.{/n} "Вы... вы вернулись..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Лорд-капитан?!
  - speaker: narrator
    text_clean: Идира поворачивает к вам голову, но ее безумный взгляд, на мгновение задержавшись на вашем лице, тут же соскальзывает с него. Вблизи вы видите, что основание одного из височных имплантов Идиры почернело и оплавилось.
  - speaker: Идира Тласс
    text_clean: Нет... погодите... Лорд-капитан... Леди фон Валанциус!
  - speaker: narrator
    text_clean: Идира поднимает глаза на "Теодору", стоящую прямо перед ней. По ее щекам начинают катиться слезы.
  - speaker: Идира Тласс
    text_clean: Вы... вы вернулись...
- guid: 2225d03a-666d-4f6d-9fb0-94befabf837a
  event: ''
  text: '{n}Идира издает пронзительный визг.{/n} "Нет тропы, рыжая! Там только топь, топь, а под ней... Кольца! Черные драконьи кольца, уже обвили и сломали тебя, уже обвивают на..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира издает пронзительный визг.
