name: Идира Тласс
sound_keys:
- Idira
doc: docs/characters/Идира_Тласс.md
total_phrases: 247
phrases:
- guid: 7c8607b6-44a7-424c-9043-ec17f5776be8
  event: BNTRS_AreaPeaceful_Idira_1
  text: '"За яркими всполохами затаилась тьма... нет... две тьмы. Одна — с красными прожилками, звенящая кандалами и лживыми
    проповедями. Другая — цвета желчи, запаха бурлящей крови и звука криков боли..."'
  speaker: Идира Тласс
- guid: b96aafd7-c662-420f-b35a-8f77337a72ec
  event: BNTRS_AreaPeaceful_Idira_5
  text: '"Скребутся, дерут когтями череп прямо изнутри — словно царапают все эти металлические стены вокруг..."'
  speaker: Идира Тласс
- guid: 6623333b-ae9e-4239-8043-a06df39036b7
  event: BNTRS_AreaPeaceful_Idira_9
  text: '"Ты только посмотри... аж глаза болят от мрамора и золота. У заправил с моего мира, Лейры, были похожие хоромы".'
  speaker: Идира Тласс
- guid: da3fcb62-77a2-4b80-ad2a-1f006e867429
  event: BNTRS_AreaStressful_Idira_105
  text: '"Хищники? Вы тоже слышите их приглушенный рык? Такой мерзкий, аж зубы сводит и хочется убивать... Нет? Только я?
    Ох не к добру это..."'
  speaker: Идира Тласс
- guid: f497defe-d247-45aa-9d17-1c9f34f0e93d
  event: BNTRS_AreaStressful_Idira_109
  text: '"Расслабься, старик. Иногда полезно походить по нижним палубам. Посмотреть, чем простой люд живет".'
  speaker: Идира Тласс
- guid: f543fd69-96a8-4705-a753-569dc8485064
  event: BNTRS_AreaStressful_Idira_118
  text: '"Белое, белое... ясный, чистый цвет — и тот весь пронизан мерзкими венами, что разносят по телу яд страха и боли.
    Кто ты? О чем ты плачешь?"'
  speaker: Идира Тласс
- guid: 021aaa7f-5735-4684-bef6-9852d942abc2
  event: BNTRS_AreaStressful_Idira_12
  text: '"Странно, в этом месте... моя голова абсолютно пуста. Ни шепоточков тебе, ни предчувствий. Ноль. Пусто".'
  speaker: Идира Тласс
- guid: 26ed9617-1e9d-4e9e-add3-321895864ab4
  event: BNTRS_AreaStressful_Idira_122
  text: '"Сегодня... первое звено потянет за собой следующие, и вскоре цепь затянется на горле. Но чьем? Нет, не вижу..."'
  speaker: Идира Тласс
- guid: 480a33ad-4c62-4377-bad7-adf623441009
  event: BNTRS_AreaStressful_Idira_129
  text: '"Варп забрался в бездушную жестянку и исказил вокс? Представляю, что он мог сотворить с мозгами тех бедолаг, что
    здесь живут..."'
  speaker: Идира Тласс
- guid: 2b663525-3644-4280-a630-07c013bcac85
  event: BNTRS_AreaStressful_Idira_139
  text: '"Вы видали?! Нас едва не сбили в воздухе! Ох какому-то безрукому идиоту не повезет сегодня, когда его притащат к
    Лорд-капитану на дознание и суд!"'
  speaker: Идира Тласс
- guid: 8bbe3d56-82aa-4959-8593-61bfc16b72ef
  event: BNTRS_AreaStressful_Idira_150
  text: '"Многочисленные потери среди боевых и гражданских единиц" — это мертвые люди, магос? Они толпами мрут везде, всегда,
    при любом командовании. Если всех считать начнешь, то когитатор в черепушке и перегреться может!"'
  speaker: Идира Тласс
- guid: f064628f-fbcf-4d43-815f-9c71af3d2e39
  event: BNTRS_AreaStressful_Idira_151
  text: '"В этом месте... Голоса из-за дверки наперебой гогочут, в такт всей этой какофонии вокруг! Ниже? Да... Что-то есть
    дальше, внизу!"'
  speaker: Идира Тласс
- guid: a6aedd6e-1434-44e3-942e-2983f16d15b8
  event: BNTRS_AreaStressful_Idira_153
  text: '"Проклятье, как глаза жжет-то, хоть новые вставляй! И эти еще вопят... Слышу, как дружочки из-за дверки эту линзу
    учуяли, бормочут ей что-то... Чую ее мерзкую, липкую энергию. Вот же дрянь!"'
  speaker: Идира Тласс
- guid: 473dcbd3-077e-4554-b75f-227952e1db88
  event: BNTRS_AreaStressful_Idira_156
  text: '"Притихли голосочки мои, затаились. Шепчутся где-то далеко, на самых задворках, словно робкий сквознячок шумит. Хотела
    бы сказать, что это не к добру, но хорошо-то как свои мысли снова слышать!"'
  speaker: Идира Тласс
- guid: 7382ce23-55b1-44ef-a0e4-9da3085a0b65
  event: BNTRS_AreaStressful_Idira_161
  text: '"Как громко! Зачем же так кричать-то! Ох... Вы что-то говорили, господин дознаватель? Не расслышала вас за этим душераздирающим
    воплем".'
  speaker: Идира Тласс
- guid: 58bc9628-5cf6-4606-8e64-4526a68b272e
  event: BNTRS_AreaStressful_Idira_165
  text: '"Абеляр, ты лучше взгляни на эти скопытившиеся черные жестянки. Тут и прорицать не надо — их рук дело. Они ведь насовсем
    подохли... верно?"'
  speaker: Идира Тласс
- guid: 9e9e513b-a32f-4470-b3f3-943d567a5fdf
  event: BNTRS_AreaStressful_Idira_168
  text: '"Что это? В стенах, над нами, под полом... Они скребутся о мою черепную коробку... Хотят выпотрошить, надеть на себя
    мою кожу..."'
  speaker: Идира Тласс
- guid: 1e2a22b0-cb7e-46a1-ad43-8b8699e78f04
  event: BNTRS_AreaStressful_Idira_17
  text: '"Весь дворец сочится страхом... Дракон обвил его своим телом и переломал кости. Что было истиной... сегодня обернется
    ложью".'
  speaker: Идира Тласс
- guid: 070a30f3-bec9-4883-b1ab-12ba708ee555
  event: BNTRS_AreaStressful_Idira_171
  text: '"Не мог бы ты приглушить свое механическое жужжание? Голосов не разобрать! Чего-чего говорите? Доброта сгубила праведных?
    Тоже мне новость".'
  speaker: Идира Тласс
- guid: c54f6e11-b9d4-4af0-b856-21d79547de92
  event: BNTRS_AreaStressful_Idira_2
  text: '"Эй, да хватит тут хихикать! Что, сюрприз, там, дальше? Умереть не встать? Ах, как смешно!... Прости, ты что-то сказала,
    Джай?"'
  speaker: Идира Тласс
- guid: 76ede2e9-5b7b-4964-8bae-9b267dcb9c6d
  event: BNTRS_AreaStressful_Idira_21
  text: '"Мы прибыли сюда... по темному приглашению. Черный дракон ворочается в тенях. Пьет кровь. Ждет... вас".'
  speaker: Идира Тласс
- guid: b335fd08-bb01-468e-ba43-9d38ebba0b74
  event: BNTRS_AreaStressful_Idira_25
  text: '"Чувствую странное... нить, тянущуюся из недавнего прошлого в будущее. Соперничество. Угрозу. Ну и варп-влиянием
    пахнет, но так, слегка..."'
  speaker: Идира Тласс
- guid: 3f26849b-0b7d-41cc-b0fe-7d01902fa8b6
  event: BNTRS_AreaStressful_Idira_30
  text: '"Звучишь разочарованно, тощий. Надеялся сторговаться с ними и вонзить нож нам в спину, а?"'
  speaker: Идира Тласс
- guid: e7d11143-ec26-49ee-b6fc-69bb78cf0985
  event: BNTRS_AreaStressful_Idira_36
  text: '"Эк вежливо ты произнес "чуть менее грязная грязная дыра", сенешаль!"'
  speaker: Идира Тласс
- guid: 07fa4b35-8844-4af2-88c3-f3ab395fc46c
  event: BNTRS_AreaStressful_Idira_39
  text: '"Хорошее местечко! Народ гуляет-веселится, даже дышится здесь как-то приятнее!"'
  speaker: Идира Тласс
- guid: 719053c3-d2b7-4b3f-a3de-081072cdf0de
  event: BNTRS_AreaStressful_Idira_42
  text: '"Тьфу ты, еще немного — и мы приучим нашу благородную девочку ходить по кабакам..."'
  speaker: Идира Тласс
- guid: 91a42db8-003d-4af1-aff5-9c5b6503a1af
  event: BNTRS_AreaStressful_Idira_43
  text: '"Всякий раз, как здесь оказываюсь, едва не глохну. Звучат из прошлого трубы славы, перебитые шорохом ветоши, и звон
    монет — поверх всего..."'
  speaker: Идира Тласс
- guid: 9d3524b3-bd39-4b4c-85d2-f5fc057d8964
  event: BNTRS_AreaStressful_Idira_51
  text: '"Владайм Токара будет ужом виться, как всякий опытный делец. Мне и голосов никаких не надо, чтоб это предсказать".'
  speaker: Идира Тласс
- guid: 6dc65c16-2ef8-4f7e-bfc1-11f934e53c84
  event: BNTRS_AreaStressful_Idira_59
  text: '"Я слышу странное... дыхание, полное отравы, зараза, притворяющаяся молитвою..."'
  speaker: Идира Тласс
- guid: a6fc503c-8553-4e9d-a7f3-b141ffb277f1
  event: BNTRS_AreaStressful_Idira_64
  text: '"Ух, зараза! Вроде и жарко тут как в котельной, и несет смазкой и сваркой, да только чую я и другие запахи... гниет
    как будто что-то..."'
  speaker: Идира Тласс
- guid: 6092fc7e-cfb4-4f07-9766-00e6a77c9ebc
  event: BNTRS_AreaStressful_Idira_68
  text: '"Ох... Яд течет по механическим венам... Путь к цели покажется легким, пока не повернешь назад. В железном сердце
    бушует пламя..."'
  speaker: Идира Тласс
- guid: f59e3fca-813e-4a6a-83e0-02e27d3d5524
  event: BNTRS_AreaStressful_Idira_74
  text: '"Тысячи и тысячи голосов вопиют о спасении... о надежде... о несдержанном обещании... Их боль... твоя награда, дознаватель".'
  speaker: Идира Тласс
- guid: f6590f24-062c-4197-8e74-cc7785952d9b
  event: BNTRS_AreaStressful_Idira_81
  text: '"Да ты ей просто завидуешь! Она глушит амасек и носит откровенные наряды, а у тебя только и развлечений, что молиться".'
  speaker: Идира Тласс
- guid: 314df502-2b79-4614-a14f-f0dea457acb3
  event: BNTRS_AreaStressful_Idira_82
  text: '"Голосочки шепчут, что впереди ждет заварушка. Но если не умерить пыл — можно и без штанов остаться. Серьезно...
    без штанов?"'
  speaker: Идира Тласс
- guid: 296aeceb-3f6c-41f9-b246-c5d666978988
  event: BNTRS_AreaStressful_Idira_93
  text: '"Эти джунгли... скрывают хищников опаснее тех, что страшат когтями и клыками. Я слышу... среди них есть вожак. Ближе,
    чем вы думаете..."'
  speaker: Идира Тласс
- guid: 8ddeee84-1f49-4fbd-801e-250ed56f379c
  event: BNTRS_AreaStressful_Idira_98
  text: '"Что ты сказал{mf||а}? А, это не ты? Голоса крепнут... почему? Что-то не так".'
  speaker: Идира Тласс
- guid: c8a4f5cf-f368-4836-a787-71de9414bf7c
  event: BNTRS_Chapter1_Idira_06
  text: '"Сила и вера не помогли им, когда за ними пришли. Надеюсь, они сделают выводы попрактичнее, чем больше молиться и
    бить поклоны. Хотя кого я обманываю?"'
  speaker: Идира Тласс
- guid: 05e3b894-5e97-4fcb-a0b4-4cc7c195b87b
  event: BNTRS_Chapter1_Idira_11
  text: '"По крайней мере он попытался обратиться к тому, кого считал другом, а не вышиб ему мозги при встрече. Хотя кому
    я это говорю?"'
  speaker: Идира Тласс
- guid: 3f7ab2c4-bb79-4272-8911-37e6979089f4
  event: BNTRS_Chapter1_Idira_13
  text: '"Из чего именно ты сделал такой вывод? Из-за его избирательной слепоты или из очевидной попытки делать хорошую мину?"'
  speaker: Идира Тласс
- guid: f981e904-47a6-4d20-af39-415b79a79355
  event: BNTRS_Chapter1_Idira_20
  text: '"Ага. А еще очень шумно. Но тебе, Кас, этого не понять. К счастью".'
  speaker: Идира Тласс
- guid: 581d81ce-5fb1-45ab-ae48-4ce519ebe485
  event: BNTRS_Chapter1_Idira_26
  text: '"Да-да. Только, надеюсь, экипаж перестанет штормить всякий раз, когда Кас соизволит по мостику пройтись".'
  speaker: Идира Тласс
- guid: 76f08a3c-99be-4dc3-bf16-39c840948769
  event: BNTRS_Chapter1_Idira_31
  text: '"Чем скорее... мы уберемся... отсюда... тем... лучше".'
  speaker: Идира Тласс
- guid: 8ae9f822-51d3-4950-9b30-d35f3c7d48be
  event: BNTRS_Chapter1_Idira_37
  text: '"Дай людям отгоревать. Леди Теодора была с нами столь долго... что начала казаться бессмертной".'
  speaker: Идира Тласс
- guid: 75ef5a0a-e303-42c6-af3c-e924fcd5dd44
  event: BNTRS_Chapter1_Idira_39
  text: '"Проклятый варп... если бы мы были в реальном мире, я бы услышала... услышала..."'
  speaker: Идира Тласс
- guid: 334b80fc-81bb-4ee1-ad8a-e34d9e8d2995
  event: BNTRS_Chapter1_Idira_44
  text: '"С твоим появлением она стала еще, кхе, необычнее. Когда ты, говоришь, нас покинешь, м?"'
  speaker: Идира Тласс
- guid: 6e76a389-32ff-4b99-a735-066f53ebb6ad
  event: BNTRS_Chapter1_Idira_46
  text: '"Хе. С персоналом зря стараешься. Если их собеседник будет поджаривать им пятки во время разговора, все пароли быстро
    будут разглашены."'
  speaker: Идира Тласс
- guid: e1f64b8b-8b60-46ee-a534-e7c928e96fad
  event: BNTRS_Chapter1_Idira_48
  text: '"Всегда считала, что шестеренки говорят несколько... непонятно. Ну, теперь, кажется, будет возможность потренироваться
    в расшифровке!"'
  speaker: Идира Тласс
- guid: c6204a1b-f91f-401d-a0cd-3ab8d62717cc
  event: BNTRS_Chapter1_Idira_57
  text: '"По поводу тех людей с нижних палуб... мне кажется, блюстители палку перегнули. Нельзя держать людей в черном теле
    все время — если не забузят, то как минимум чердаком поедут".'
  speaker: Идира Тласс
- guid: ae9091e3-ae9b-4678-b349-1a7394c200bd
  event: BNTRS_Chapter2_Idira_03
  text: '"Кажется, ледышка не слишком рвется об этом говорить. И, наверное, я тоже не хочу об этом лишний раз думать".'
  speaker: Идира Тласс
- guid: f665cda5-4379-48ba-b39e-9e5f0e29d233
  event: BNTRS_Chapter2_Idira_09
  text: '"Мы уже давно не в системе Райкада, а в голове все еще эхо того, что я перед трансляцией наслушаться успела... Жутко
    даже подумать, что там происходит сейчас".'
  speaker: Идира Тласс
- guid: 1451e563-f7b6-4333-8c4d-7be5c56acfca
  event: BNTRS_Chapter2_Idira_100
  text: '"То ли дело, когда "нечистые вычисления" производятся в человеческой голове... которую при желании легко отпилить.
    Я правильно поняла двойное дно твоей реплики?"'
  speaker: Идира Тласс
- guid: 719129d1-c24c-42da-8e6d-6fbab5b1ca73
  event: BNTRS_Chapter2_Idira_102
  text: '"Я все еще не верю, что вы, Лорд-капитан, позволили мне остаться... не избавились от меня... я докажу... оправдаю
    ваше доверие".'
  speaker: Идира Тласс
- guid: af4750e8-d9e6-4be7-82f0-98500de8fda7
  event: BNTRS_Chapter2_Idira_107
  text: '"Я... боюсь тебе отвечать. Что, если я скажу: "нет, не слышала"? На всякий случай прокипятишь мне мозги, чтобы проверить,
    не вру ли я?"'
  speaker: Идира Тласс
- guid: b96a2bce-06cb-4468-b633-57cfbacb8c3c
  event: BNTRS_Chapter2_Idira_121
  text: '"А, прекрати, шестеренка! С Джай хотя бы разговаривать можно, а не "вести коммуникацию".'
  speaker: Идира Тласс
- guid: 72f7f9df-4d4b-4644-a4a5-31b4dce70c6d
  event: BNTRS_Chapter2_Idira_125
  text: '"Ха. Я когда-то так же думала, когда только к Леди Теодоре попала... со временем привыкнешь. Хочешь, покажу, где
    на корабле самый сносный кабак?"'
  speaker: Идира Тласс
- guid: 0f408fb8-30f9-4279-b534-01618911cdcc
  event: BNTRS_Chapter2_Idira_131
  text: '"А вдруг их цель на самом деле просто мучить людей? В таком случае механизмам Администратума нет равных!"'
  speaker: Идира Тласс
- guid: 39b9b1c0-4e91-4541-bed6-020348b31ff8
  event: BNTRS_Chapter2_Idira_141
  text: '"Вся эта история вокруг нашего нового Главного технопровидца заставляет меня нервничать... словно огромный механизм
    пришел в движение, стремясь свести свои части воедино".'
  speaker: Идира Тласс
- guid: 76c228a7-2006-4c99-8004-3522709052de
  event: BNTRS_Chapter2_Idira_146
  text: '"Ооо, наша ледышка просто изводит себя от бешенства. Шепотки уже рассказали мне про пару его планов насчет Ирлиэт...
    только вот пока Лорд-капитан не разрешит — ничего он и не сделает".'
  speaker: Идира Тласс
- guid: 48d93f90-6ed4-4b19-b07a-af25a03c3950
  event: BNTRS_Chapter2_Idira_148
  text: '"Ага, а поделать-то ты с ней ничего и не можешь, святоша. Терпи. Только зубами так громко не скрипи — сотрешь".'
  speaker: Идира Тласс
- guid: 6a187f00-67ae-4c5e-b375-a76d96dc3cb4
  event: BNTRS_Chapter2_Idira_21
  text: '"Я все не могу перестать думать о губернаторе Даргонуса. Почему его не было при штурме дворца Вольного Торговца?"'
  speaker: Идира Тласс
- guid: 7dcdc248-3fe4-4baa-84ce-124f2a525052
  event: BNTRS_Chapter2_Idira_32
  text: '"Мне дурно от одной мысли, сколько невинных погибло в муках — а ты этим восхищаешься!"'
  speaker: Идира Тласс
- guid: b7cce804-d8c8-4632-bade-4975d287345c
  event: BNTRS_Chapter2_Idira_40
  text: '"Ты про то, как на это отреагирует Винтерскейл? Из того, что я слышала — интересные не то слово! Ничего хорошего
    ждать точно не стоит".'
  speaker: Идира Тласс
- guid: eafc2019-e283-45c7-845a-1973d103c457
  event: BNTRS_Chapter2_Idira_42
  text: '"Хотела бы я посмотреть на рожу Инцендии, когда она узнала о том, как мы увели у нее Футфол..."'
  speaker: Идира Тласс
- guid: 6593fe65-0bc9-49a7-a8c1-00f8a394c608
  event: BNTRS_Chapter2_Idira_47
  text: '"Это ты так намекаешь, что чуть что — и планету Лорд-капитана взорвут? Весьма тактично, господин дознаватель — спасибо,
    что хоть предупредил!"'
  speaker: Идира Тласс
- guid: eb5bf6ed-cfef-4d4a-b966-31fbd5de4445
  event: BNTRS_Chapter2_Idira_56
  text: '"Это ты так дал понять, что расстроился? Слушай, ведь можно просто сказать — "хреново мне", и все. Тебя так и поймут,
    и поддержать смогут".'
  speaker: Идира Тласс
- guid: daf3ced4-b4ba-4aee-a821-edbdf210a83d
  event: BNTRS_Chapter2_Idira_70
  text: '"Ты серьезно считаешь, что смерть тех безумцев не была мученической? Стать живой заплаткой на корабле, захваченным
    демоном — можно ли изобрести казнь страшнее? Бр-р-р!"'
  speaker: Идира Тласс
- guid: 2c1ce97e-f038-498b-a927-8f76557ba843
  event: BNTRS_Chapter2_Idira_81
  text: '"Эй, святоша... а что это тебя тот еретик в лицо признал, м? Ну тот, которого мы прижали в логове вонючем? Странные
    у тебя друзья, вот что сказать хочу".'
  speaker: Идира Тласс
- guid: f9f84755-31a6-4c16-97da-55fea6689751
  event: BNTRS_Chapter2_Idira_84
  text: '"Ну и заварушку устроили родственнички Касс во дворце... подумать только, покушение прямо на приеме у Вольного Торговца!"'
  speaker: Идира Тласс
- guid: 42d91e39-4c96-408b-8a5f-d95b2ff882d1
  event: BNTRS_Chapter2_Idira_89
  text: '"Да, Касс, не хочу тебя пугать... но, когда я думаю о тебе, я слышу смех. Смех много более древний, чем само Человечество...
    и наводящий жуть. Не думаю, что смеется этот кто-то вместе с нами — скорее над".'
  speaker: Идира Тласс
- guid: 457d19bd-7d3f-42e7-b704-73f94da1ee7f
  event: BNTRS_Chapter2_Idira_96
  text: '"После того, как ледышка спустился на Кьяву Гамма ради своей миссии, мои шепотки при виде дознавателя ведут себя
    странно. В толк не возьму, что именно изменилось, но... просто странно".'
  speaker: Идира Тласс
- guid: 69498d1e-3e3c-44d3-a517-5514ed30a831
  event: BNTRS_Chapter3_Idira_01
  text: '"Сначала предательство Кунрада... теперь вот эта заварушка... старик, а как мы с тобой еще живы, а?"'
  speaker: Идира Тласс
- guid: 2831950f-bb71-485d-83f4-93242fc36e12
  event: BNTRS_Chapter3_Idira_100
  text: '"Порадуйся тому, что ты жив. А всем своим епитимьям еще найдешь время... если мы сбежим отсюда".'
  speaker: Идира Тласс
- guid: 40350238-44cf-4331-8065-9157864973f0
  event: BNTRS_Chapter3_Idira_106
  text: '"А в этом месте можно сделать что-то, за что тебя не захочет убить еще больше ксеносов, а? А, точно. Умереть".'
  speaker: Идира Тласс
- guid: 0279c104-54b3-43fb-a810-4786e283abe2
  event: BNTRS_Chapter3_Idira_122
  text: '"Знаешь, косматый, не тебе меня судить. Сам сколько в клетке сидел и не рыпался, а все туда же, бедную Идиру жизни
    поучать".'
  speaker: Идира Тласс
- guid: 48d0a94e-e25f-49fa-86fa-a1d24fd9c203
  event: BNTRS_Chapter3_Idira_13
  text: '"Не верю сама, что соглашаюсь со святошей... но да, наконец-то этот мерзавец поплатится за то, что сделал!"'
  speaker: Идира Тласс
- guid: e2540adf-70c9-4547-bae6-c0156f4a5ff1
  event: BNTRS_Chapter3_Idira_130
  text: '"Экая ты ретивая, а. Хотя могу тебя понять: со всеми предущими твоими сородичами как-то... не задалось".'
  speaker: Идира Тласс
- guid: f2b0c1d4-6b36-4236-a485-35eb313aa109
  event: BNTRS_Chapter3_Idira_138
  text: '"Да пошла она! Мы ее приютили, защитили, с родней ее возились... Давайте отнесем ее тело Тервантьясу, пусть воскресит
    ее, а мы еще раз убьем!"'
  speaker: Идира Тласс
- guid: 41ef468f-d636-47f2-93a1-27427cdafcac
  event: BNTRS_Chapter3_Idira_145
  text: '"Хех. Кажется, у Лорд-капитана привычка — прощать непростительное... да, рыжая?"'
  speaker: Идира Тласс
- guid: fc0728a9-4607-4c53-b459-b67b7f38d1f3
  event: BNTRS_Chapter3_Idira_26
  text: '"Эти порталы... не могу понять, как далеко мы от треклятой арены... надо ли опасаться погони? Можно ли надеяться
    на исход?"'
  speaker: Идира Тласс
- guid: 6dcd6b58-6571-4570-aab1-a09553bb5b0e
  event: BNTRS_Chapter3_Idira_42
  text: '"Все еще не могу поверить, что ты жива, Касс... это место не смогло сломить тебя".'
  speaker: Идира Тласс
- guid: 2444e54b-4daf-47d7-a9b7-8b341f2a8b89
  event: BNTRS_Chapter3_Idira_52
  text: '"Те безумные вопли в лаборатории, все то время, пока я там была... это же был ты, ледышка? Как ты выжил после...
    после такого?"'
  speaker: Идира Тласс
- guid: a429fc22-ccbd-47ce-ad2b-518ca367fff5
  event: BNTRS_Chapter3_Idira_59
  text: '"Кому суждено сгинуть в варпе, тот на плахе не окажется. Подавись своим каталогом, стукач железный".'
  speaker: Идира Тласс
- guid: 6b41f028-967d-4d90-abaf-62eb77cb6dd8
  event: BNTRS_Chapter3_Idira_61
  text: '"А, а тебе так бы этого хотелось, да? Нет уж. Лорд-капитану я еще нужна — так что засунь свое разочарование куда-нибудь...
    подальше".'
  speaker: Идира Тласс
- guid: f660a0dd-f34d-48a2-9309-fee504002707
  event: BNTRS_Chapter3_Idira_62
  text: '"Я видела тот аппарат, в который ты была заключена. Но я даже не подозревала..."'
  speaker: Идира Тласс
- guid: 15f2aacd-09ce-4066-80c9-a73601a5cad4
  event: BNTRS_Chapter3_Idira_65
  text: '"Ох не знаю я... кажется, если выживу, еще полгода буду бояться темных углов, не говоря уже о темных кабаках с темными
    личностями".'
  speaker: Идира Тласс
- guid: 809fea49-3f77-40a2-8979-34f46ba4ec5f
  event: BNTRS_Chapter3_Idira_75
  text: '"О, Касс, видела бы ты, какие празднества закатывала Леди Теодора!... То есть церемония была очень хорошей, не поймите
    превратно, Лорд-капитан! Это я так, снова о былом ною..."'
  speaker: Идира Тласс
- guid: 6df64025-aafb-4266-b6cd-2e3656e245ff
  event: BNTRS_Chapter3_Idira_87
  text: '"Я бы на твоем месте сейчас крепко задумалась, что, в таком случае, ждет впереди тебя, невинная ты наша".'
  speaker: Идира Тласс
- guid: f072ad86-6a5b-460d-bc87-a4bd38bc82ba
  event: BNTRS_Chapter4_Idira_03
  text: '"Угу. А еще в их вымирании им сильно подсобили твои дружки-приятели и ты сам. Сотри свою паскудную улыбку с лица,
    изверг, они тебе все же родичами приходились!"'
  speaker: Идира Тласс
- guid: c84533c4-f305-43f8-90a8-bd9aee597670
  event: BNTRS_Chapter4_Idira_114
  text: '"После того, что произошло на Фтоне... неужели тебе не хочется задать парочку вопросов своему начальнику?"'
  speaker: Идира Тласс
- guid: 57eed083-a461-4ddc-b8a3-e35822d003cc
  event: BNTRS_Chapter4_Idira_122
  text: '"Тишина в голове... благословенная, казавшаяся столь недостижимой тишина..."'
  speaker: Идира Тласс
- guid: 5dea6f9f-d359-4e49-9738-8b06c13f5194
  event: BNTRS_Chapter4_Idira_125
  text: '"Странно себя чувствую. Вроде бы искала управу на свою "проблему", искала, а в последний момент отказалась. И знаете,
    что страннее всего, Лорд-капитан? Не жалею. Ни капли".'
  speaker: Идира Тласс
- guid: 14f5da4f-863a-444c-a0ba-4ca837835328
  event: BNTRS_Chapter4_Idira_130
  text: '"Ха, наши головы покрепче ваших тощих черепушек! Не каждый лезет на стену, стоит произойти трансляции в Эмпиреи.
    Я так вообще — сама стабильность. Учись, пока я жива!"'
  speaker: Идира Тласс
- guid: d017093c-cd32-4114-8e03-800cbc90c30b
  event: BNTRS_Chapter4_Idira_14
  text: '"Что, ледышка, не посвятили тебя в хитросплетения планов Калькасара? Кажется, кое-кого разжаловали из любимчиков".'
  speaker: Идира Тласс
- guid: 2e5b4964-f37a-459f-b212-88ed6f926605
  event: BNTRS_Chapter4_Idira_140
  text: '"Со мной тут разговаривал этот... этот Номос. Чудной такой. Жутковатый даже. Но вроде... безобидный. И очень любопытный".'
  speaker: Идира Тласс
- guid: d3bb42f1-c1cb-4da6-b6f1-be228deb203c
  event: BNTRS_Chapter4_Idira_160
  text: '"Косматый, нет. Пожалуйста. Я больше не могу. Очень тебя прошу, давай без меня!"'
  speaker: Идира Тласс
- guid: 28bd9f7a-00ef-4882-92df-6522bd438089
  event: BNTRS_Chapter4_Idira_22
  text: '"Я тут подумала... А мы точно вернулись? Это не может быть очередной пыткой Тервантьяса? Какой-нибудь извращенной
    грезой?"'
  speaker: Идира Тласс
- guid: 74f7a67b-44de-4723-9764-a03a87dbe844
  event: BNTRS_Chapter4_Idira_26
  text: '"Нет. Футфол — тот, каким знали его мы — просто перестанет существовать. Каким он станет... об этом я думать не хочу".'
  speaker: Идира Тласс
- guid: fe2f53d8-99e6-4921-b993-92dc80b62701
  event: BNTRS_Chapter4_Idira_36
  text: '"Могу только согласиться с тобой, старик. Сколько бы грехов не нажила эта станция, превращение ее в могильник лучше
    не сделало!"'
  speaker: Идира Тласс
- guid: b1c88b9a-4e11-4f63-be71-7538ef207ed0
  event: BNTRS_Chapter4_Idira_40
  text: '"Итак, Владайм остался у руля Футфола. Посмотрим, какие выводы он сделает из этой заварушки с Чорда".'
  speaker: Идира Тласс
- guid: 2bce4d68-c898-4519-a5de-101b50169871
  event: BNTRS_Chapter4_Idira_45
  text: '"Да брось вздыхать, старик. Фон Валанциус и Чорда никогда не дружили в десна. Рано или поздно кто-то бы да взял верх
    — все это понимали".'
  speaker: Идира Тласс
- guid: e468cb46-9357-428a-bb45-ce82ed74f772
  event: BNTRS_Chapter4_Idira_59
  text: '"Лучше драться в меньшинстве, но знать, что никакая сволочь не прострелит твой затылок, потому что ты "запятнал себя
    в глазах Императора".'
  speaker: Идира Тласс
- guid: 663acb6a-e2a1-482d-a0a3-29afbfce8c18
  event: BNTRS_Chapter4_Idira_74
  text: '"А нечего было недооценивать Лорд-капитана! "Новеньк{mf|ий|ая}" да "новеньк{mf|ий|ая}"... сам себя успокаивал, что
    бояться {mf|его|ее} не надо, вот и доуспокоился!"'
  speaker: Идира Тласс
- guid: b9675aa2-8a1b-43dc-9ade-285429266fda
  event: BNTRS_Chapter4_Idira_81
  text: '"С тех пор, как Лорд-капитан к Калькасару наведал{mf|ся|ась}, чувство у меня такое... непростое. И неприятное. Словно...
    не все было сказано".'
  speaker: Идира Тласс
- guid: 2db74320-7aec-42f5-947a-c47d3b59088d
  event: BNTRS_Chapter4_Idira_88
  text: '"Хорошо еще что получилось поймать ее по горячим следам — если бы змея уползла, твоя семья, старик, могла бы получить
    ой какой неприятный сюрприз лет эдак через пять или десять..."'
  speaker: Идира Тласс
- guid: 105cf423-9e49-4c20-9575-8817003a89e1
  event: BNTRS_Chapter5_Idira_04
  text: '"Странно, эти системы кажутся мне знакомыми... На что они похожи из того, что мы видели?"'
  speaker: Идира Тласс
- guid: 40fbac19-7c81-485c-bfc1-7cab8f5f83db
  event: BNTRS_Chapter5_Idira_10
  text: '"Слушай, не знаю до конца, кем там был этот твой Назокей, но мысль о том, что ты, тощий, выбесил кого-то до такой
    степени, что он отправился за твоей башкой на край света, кажется мне ну очень логичной".'
  speaker: Идира Тласс
- guid: 1240e848-beb7-45dd-abf6-9948d263616c
  event: BNTRS_Chapter5_Idira_20
  text: '"Ага, ты прикончишь убийц и поклянешься отомстить их хозяину. Расправишься с ним и пойдешь искать того, кто виновен
    "на самом деле". Признай, тебе либо нравится это, либо ты просто боишься остановиться".'
  speaker: Идира Тласс
- guid: beb8cf0a-d6e8-4463-b028-06454b41e2da
  event: BNTRS_Companion_DLC3_Idira_126
  text: '"Ох, пузатый господин, не ломай мозги! Даже мои шепотки не понимают, что дальше выкинет этот арлекин, куда уж твоим
    шестеренкам угнаться!"'
  speaker: Идира Тласс
- guid: 58fc06f1-fe17-4194-9bcf-a15f096893f0
  event: BNTRS_Companion_DLC3_Idira_14
  text: '"Клешни прочь, пузатый господин — мне их Леди Теодора пожаловала! Кстати о псайкерском проклятии: передавай Нунциусу
    пламенный привет от друзей с той стороны. Они насчет него тоже заинтригованы".'
  speaker: Идира Тласс
- guid: 0db51a20-ea7c-47a2-8d8d-ef9651de2a39
  event: BNTRS_Companion_DLC3_Idira_23
  text: '"В ледяном озере слез обрящешь утерянное, но обретешь ли покой? У смерти единственный глаз, что смотрит из тьмы веков,
    но руками ее будешь ты... кххх... Прости, пузатый господин, это было сильнее меня".'
  speaker: Идира Тласс
- guid: c5478a60-6fd8-449b-9b8d-75d6b1cd8e60
  event: BNTRS_Companion_DLC3_Idira_67
  text: '"Я чувствую себя так, словно на куски разваливаюсь, но голова вроде варит, если ты об этом. Ох. Про куски я зря сказала,
    да?"'
  speaker: Идира Тласс
- guid: 5c562e29-a9ee-45ed-a0f1-0b5263df97f8
  event: BNTRS_Companion_DLC3_Idira_80
  text: '"Погоди, то есть беседуя со своим воображаемым дружком, ты абсолютно трезв? Пожалуй, не буду предлагать тебе выпить.
    Кто знает, что ты учудишь, перебрав амасека".'
  speaker: Идира Тласс
- guid: 83c21ac5-4800-4ad5-a8b2-6252c5c2e988
  event: BNTRS_DLC2_Idira_09
  text: '"Эй, я видела тебя в питейной на нижних палубах, булыжник! Даже арбитрам иногда надо расслабляться, да?"'
  speaker: Идира Тласс
- guid: 76f97614-f08b-4c85-a818-73f36370d7f0
  event: BNTRS_DLC2_Idira_103
  text: '"Косматый, словами не могу передать, как мне жаль, что не ты задаешь правила во Дворце Правосудия!"'
  speaker: Идира Тласс
- guid: 5ee0c452-72f5-49a0-99e5-3d5e4c90fef0
  event: BNTRS_DLC2_Idira_107
  text: '"Ты как-то упускаешь тот факт, что с суда друкари можно уйти только по частям после о-о-очень долгих пыток. Но какая
    разница, если есть возможность кинуть камнем в мон-кай, да?"'
  speaker: Идира Тласс
- guid: bd076e17-57a4-4ca0-842c-6d3ba39566d5
  event: BNTRS_DLC2_Idira_117
  text: '"Никак не пойму, почему Лорд-капитан не назначил{mf||а} булыжника маршалом? Он самый упертый и непробиваемый законник
    в секторе — какие еще качества нужны-то?"'
  speaker: Идира Тласс
- guid: 867a42ce-4a44-427f-88c6-9551458f8dfd
  event: BNTRS_DLC2_Idira_120
  text: '"Это ж у булыжника был шанс стать первым арбитром сектора, который закончил свои дни в тюрьме! Такая байка пропала".'
  speaker: Идира Тласс
- guid: 5f75fc2d-f337-4219-a96e-8fa3303decae
  event: BNTRS_DLC2_Idira_134
  text: '"Ну ты и спросил! Да пока это сборище булыжников все бумажки подпишет, можно и от старости помереть. Вот дела, сместить
    прошлого маршала — дело одного дня, а как нового выбрать, так нет, регламент!"'
  speaker: Идира Тласс
- guid: 66ee6bc6-0f41-44c0-bfa7-f56b052409f9
  event: BNTRS_DLC2_Idira_142
  text: '"Ты хотела сказать, фанатиками, которые сначала стреляют, а потом задают вопросы?"'
  speaker: Идира Тласс
- guid: 5e596320-47f9-4b20-bcef-2522c0bb9fac
  event: BNTRS_DLC2_Idira_154
  text: '"Голосочки аж надрываются, слушая, как ты уже переделываешь еще не захваченный корабль. Ох чую, не к добру они так
    радуются".'
  speaker: Идира Тласс
- guid: 0b4aacbb-27b6-4663-a939-6aca5e15c25e
  event: BNTRS_DLC2_Idira_162
  text: '"Даже не мечтай, старик, их интересует только десятина. Коронус может хоть вверх дном перевернуться — они ухом не
    поведут".'
  speaker: Идира Тласс
- guid: e17e1935-1c05-4c07-92a5-40e5adbff668
  event: BNTRS_DLC2_Idira_170
  text: '"У нашего булыжника голова взорвется — Вольный Торговец берет что-то из десятины! Куда судить, что делать?"'
  speaker: Идира Тласс
- guid: f0fe7a70-3610-4d65-8256-314a7ac679f4
  event: BNTRS_DLC2_Idira_176
  text: '"Свалкой? Нет, это почти комплимент. Это — складбище, и сюда приходит умирать десятина".'
  speaker: Идира Тласс
- guid: 6fea7a58-4808-4acb-905e-10509c7802db
  event: BNTRS_DLC2_Idira_187
  text: '"И это Лекс Империалис? Ожидала томик повнушительнее".'
  speaker: Идира Тласс
- guid: 789ab825-1472-4f70-a616-61702667a30a
  event: BNTRS_DLC2_Idira_198
  text: '"Хм, если Администратум хребет Империума, то какая его часть Арбитес? Его загребущие руки?"'
  speaker: Идира Тласс
- guid: 694c76e4-41f6-4ac5-b517-7a45a8337b39
  event: BNTRS_DLC2_Idira_210
  text: '"Вот ты заладил: механизмы, механизмы... А своих братьев тебе не жалко? Или в них шестеренок недостаточно?"'
  speaker: Идира Тласс
- guid: bc6047d8-fdca-40a1-97a2-13a9bc3104b9
  event: BNTRS_DLC2_Idira_252
  text: '"Я тоже рада тебя видеть, булыжник! Но твоего пса рада видеть больше".'
  speaker: Идира Тласс
- guid: 5ef04890-df66-4527-ace2-dacbb236e9a3
  event: BNTRS_DLC2_Idira_28
  text: '"Постой, у тебя что, личность есть? Смотрите-ка, наш булыжник не только выдержками из Лекса общается!"'
  speaker: Идира Тласс
- guid: 8a8a2d3a-f282-4199-b3af-f694280c31f7
  event: BNTRS_DLC2_Idira_293
  text: '"Ты глянь: измываются над ним как могут. А я думала, что это булыжник у нас бессердечный".'
  speaker: Идира Тласс
- guid: 41b62cc7-73ac-4772-a943-11e16f8413c3
  event: BNTRS_DLC2_Idira_306
  text: '"Ого, ты продержался целых пять минут без историй о хрусте костей под пятой закона! Как ты только вытерпел?"'
  speaker: Идира Тласс
- guid: e24127f8-c1b2-49c7-b864-09f4c9a8df13
  event: BNTRS_DLC2_Idira_338
  text: '"В бездну правосудие. Я выверну тварь наизнанку раньше, чем ты начнешь нудеть про свои законы".'
  speaker: Идира Тласс
- guid: 82826df4-5e92-472f-a7f7-90e25d7ca9be
  event: BNTRS_DLC2_Idira_342
  text: '"Ладно тебе, булыжник. Комморре тебя не сломить! А насчет ненависти — так ты всегда все живое ненавидел, разве нет?"'
  speaker: Идира Тласс
- guid: e38f7ce6-64b4-4fb7-b798-139c44f8b148
  event: BNTRS_DLC2_Idira_343
  text: '"Мне вот интересно, булыжник, а как твой Лекс смотрит на ситуацию с Лорд-капитаном? Что, силенок не хватит судить
    Вольного Торговца?"'
  speaker: Идира Тласс
- guid: 755ca141-30ea-4501-aac2-445bdefbb697
  event: BNTRS_DLC2_Idira_358
  text: '"Спросили б меня раньше, что вероятнее: что я запишусь в монахини, или наш булыжник закрутит роман с Лорд-капитаном,
    я бы купила четки".'
  speaker: Идира Тласс
- guid: d54fbccf-7455-4a7c-81b8-867dfbf43840
  event: BNTRS_DLC2_Idira_46
  text: '"Да, а перед этим много-много раз убить. И не обязательно тех, кто этого заслуживает".'
  speaker: Идира Тласс
- guid: 4360d8f0-3477-456a-b5af-0dd507a6d25b
  event: BNTRS_DLC2_Idira_59
  text: '"И как бы выглядели молитвы? "Да не нарушим мы сроки отправки десятины, да незыблем будет ранг Солюцио-как-там-его..."
    Хотя что это я — ты же, наверное, и правда так молишься".'
  speaker: Идира Тласс
- guid: 9a2e230d-1a76-4947-b313-1e9c2af0fb77
  event: BNTRS_DLC2_Idira_67
  text: '"По-моему, авантюра была как раз в духе Лорд-капитана. У меня, правда, башка чуть не лопнула — так шепотки смехом
    заходились, что целый корабль сгинет в Имматериуме, но кто будет справляться о здоровье ведьмы, верно?"'
  speaker: Идира Тласс
- guid: 443b275e-e2b4-42aa-9716-0cc4610218c1
  event: BNTRS_DLC2_Idira_82
  text: '"Я думала, ты наоборот будешь только за. Самая продвинутая шестеренка на целом мире — сколько внимания, сколько обожания!"'
  speaker: Идира Тласс
- guid: f97f0b6c-16b6-4c20-a76e-105ad43a0150
  event: BNTRS_DLC2_Idira_88
  text: '"Ох, дед, это ж Леди Теодора. Она такими делами ворочала — масштабов не нашего ума. Планету в расход пустить — это
    так, мелочевка по ее меркам".'
  speaker: Идира Тласс
- guid: a67d6f7f-b1c0-4028-867c-adc99c2564c2
  event: BNTRS_DLC3_Idira_06
  text: '"Не дрейфь, Джай. Голосочки мне недавно намекнули: если не уничтожим гадину, застрянем в этой дыре надолго. А с развлечениями
    здесь негусто, сама видишь..."'
  speaker: Идира Тласс
- guid: 76755084-2a73-4835-a7d9-7fdf25c922d4
  event: BNTRS_DLC3_Idira_104
  text: '"Да тут никому не нравится, не только твоей собаке. Холодно, промозгло... Не помешало бы смазать свои протоколы стаканом
    амасека".'
  speaker: Идира Тласс
- guid: 40702a84-cad1-4bd8-badb-a7b5934e7fdf
  event: BNTRS_DLC3_Idira_112
  text: '"Доверься нашему Лорд-капитану, Абеляр. Это вполне в духе того наследства, которое оставила Теодора, а она всегда
    знала, что делала. Почти всегда..."'
  speaker: Идира Тласс
- guid: 39b2bd76-1a01-444d-892f-0be9daae8a95
  event: BNTRS_DLC3_Idira_12
  text: '"Как ловко эта тварь пытается обогнать время, поглядите-ка. Нутром чую, это его родственничек встретился нам в руинах.
    Ну, от своей судьбы он все равно не убежит, хоть и резвый".'
  speaker: Идира Тласс
- guid: 477554aa-6ebb-48c5-b26e-fd53fea418c1
  event: BNTRS_DLC3_Idira_121
  text: '"Обычно я люблю легенды, но на моем веку все они почему-то все время заканчиваются мрачно. Будет глупо надеяться,
    что здесь нас ждет что-то иное".'
  speaker: Идира Тласс
- guid: f40e7586-ea9f-42e2-8cec-75c5ba314df6
  event: BNTRS_DLC3_Idira_16
  text: '"Легче, старик, легче. Это не настоящий дворец, а игрушечный домик, который кто-то очень старался вылепить из иллюзий
    и надувательства. Но вот внутри него точно есть кто-то живой, нутром чую".'
  speaker: Идира Тласс
- guid: 648be451-002d-4e37-b87a-c1dd210a4b36
  event: BNTRS_DLC3_Idira_34
  text: '"Шепотки... они кричат. От ярости и негодования. Словно на войну собрались. Но... им страшно. Говорят мы идем туда,
    где умирает сама смерть".'
  speaker: Идира Тласс
- guid: a4d03888-427e-471b-b977-d7d2452026a6
  event: BNTRS_DLC3_Idira_43
  text: '"Ни живы, ни мертвы, все так, только вот с чего ты возомнила, что надо их обязательно добивать, а, черепушка?"'
  speaker: Идира Тласс
- guid: b963378d-5473-4118-8523-9e07a3567468
  event: BNTRS_DLC3_Idira_53
  text: '"Я не понимаю, ничего не понимаю. Голоса... голоса враз взвыли и умолкли. Молчат. Пусто здесь, мертво..."'
  speaker: Идира Тласс
- guid: 9c572dac-13a3-4ebb-85e8-845c20932b2b
  event: BNTRS_DLC3_Idira_63
  text: '"Не думаю, что проблема в нехватке обычных техножрецов. Эти когитаторы находятся тут дольше, чем я живу, и до сих
    пор никто не разобрался, что именно так глубоко их тревожит".'
  speaker: Идира Тласс
- guid: c2a390ea-70ed-4e79-bcaa-204495a3a5c1
  event: BNTRS_DLC3_Idira_77
  text: '"Да-а, казалось бы, латают тут живых, да только атмосферка — для шестеренок одних! Надеюсь, они выпускают вылеченных
    быстрее, чем они сваливаются от новых болезней, надышавшись этой дрянью".'
  speaker: Идира Тласс
- guid: 87c11224-68d7-435d-8309-bb95506a7fe4
  event: BNTRS_DLC3_Idira_81
  text: '"Не обижайся, Кас, но это привычный для нас, рядовых слуг династии, запах и атмосфера. Тебе бы уже пора привыкнуть,
    если хочешь жить в реальности..."'
  speaker: Идира Тласс
- guid: c9624e66-1abf-4d09-99cb-a547d5c79ae9
  event: BNTRS_DLC3_Idira_92
  text: '"Ого! Все машины теперь включены? Странным образом это место стало выглядеть еще жутче, чем раньше!"'
  speaker: Идира Тласс
- guid: af7a21a9-c3fd-4476-a66e-8c992fac968e
  event: BNTRS_PickUps_Idira_100
  text: '"А я слышала Ничего, Великое Ничего. Не волнуйся, что бы это ни было, оно далеко... правда ведь?"'
  speaker: Идира Тласс
- guid: 617477cc-ceb5-4922-8dc6-40fd274766d9
  event: BNTRS_PickUps_Idira_104
  text: '"Так теперь Лорд-капитан потакает культу смерти? Он{mf||а} же не будет резать кого ни попадя, потому что "Неумирающий
    даровал {mf|ему|ей} знак?"'
  speaker: Идира Тласс
- guid: 96cc7b18-9501-4293-a8c6-d98e62d76e88
  event: BNTRS_PickUps_Idira_108
  text: '"Нижнепалубники постоянно пропадают. Может его поезд переехал?"'
  speaker: Идира Тласс
- guid: e6d7b678-853a-41e7-a071-0f5e84049e66
  event: BNTRS_PickUps_Idira_11
  text: '"Слышала, ты гадаешь на Таро... Тебя после этого не мучают кошмары? Не являются голоса?"'
  speaker: Идира Тласс
- guid: 7cd4f3a3-02e5-4746-86a2-ce902da0cd8d
  event: BNTRS_PickUps_Idira_110
  text: '"Вот же пырят на меня глазенки выжженные, словно я прокаженная. Да не надолго я, не нервничайте так!"'
  speaker: Идира Тласс
- guid: 987b1bb4-dc5a-4c74-ac34-dc2424792049
  event: BNTRS_PickUps_Idira_114
  text: '"Шепотки аж повизгивают от удовольствия. Они так обычно беснуются, когда своих рядом чуют".'
  speaker: Идира Тласс
- guid: 940a3728-6a20-41c0-b0c3-6c60d6386cd9
  event: BNTRS_PickUps_Idira_118
  text: '"Что притих, Абеляр? Подбираешь местечко по вкусу? Вон тот гробик расписной вполне ничего!"'
  speaker: Идира Тласс
- guid: 76f9d2f5-14e7-4260-ad06-5d089213980a
  event: BNTRS_PickUps_Idira_12
  text: '"Я наблюдала, как ты гадаешь на Таро Императора, и знаешь что... Думаю, ты обладаешь даром псайкера, сестричка".'
  speaker: Идира Тласс
- guid: 6f622766-4ad8-40b9-805e-21ec37a340d0
  event: BNTRS_PickUps_Idira_133
  text: '"О нет, опять. Как его выключить? Кто-нибудь?"'
  speaker: Идира Тласс
- guid: ff29b363-24ac-4a9b-a797-20d8dec80d0b
  event: BNTRS_PickUps_Idira_137
  text: '"Напомни свечку поставить в вашем храме. Помолюсь, чтобы смерть заикалась почаще".'
  speaker: Идира Тласс
- guid: 58cf8fc8-a6db-41fe-8a13-b11ed9f5a1f0
  event: BNTRS_PickUps_Idira_154
  text: '"Вокруг тьма... и пламя... а тебе... уютно?!"'
  speaker: Идира Тласс
- guid: 18a6b418-c0cd-4fbf-ae33-788c3bacc139
  event: BNTRS_PickUps_Idira_169
  text: '"Я была так поглощена обретенной тишиной, что даже не поняла сначала, что это ты. Мне так жаль, Кибелла..."'
  speaker: Идира Тласс
- guid: 6404825b-d310-4849-8033-d73c7ecca457
  event: BNTRS_PickUps_Idira_176
  text: '"Интересно, у шестеренки-то кровь осталась, или там давно одно машинное масло?"'
  speaker: Идира Тласс
- guid: f9d48340-37ad-40b6-98b5-c310eba89a76
  event: BNTRS_PickUps_Idira_185
  text: '"Просто один спятивший аристократ огреб, пытаясь образумить другого спятившего аристократа. Как только богатеи не
    развлекаются..."'
  speaker: Идира Тласс
- guid: f09fa350-3f6e-4d2c-8ded-b52e7232c07c
  event: BNTRS_PickUps_Idira_223
  text: '"Одна провела жизнь в аскезе и тренировках, другая — в роскоши и книжках. И обе понятия не имеют, как устроена настоящая
    жизнь".'
  speaker: Идира Тласс
- guid: 734cea5b-2184-4322-a342-46610da41311
  event: BNTRS_PickUps_Idira_226
  text: '"Завидую отваге Лорд-капитана — порвать с убийцей из культа смерти, да еще и остаться с ней в одном секторе".'
  speaker: Идира Тласс
- guid: 7d6682b8-67cb-4994-9422-1da89e80a6ad
  event: BNTRS_PickUps_Idira_232
  text: '"Кажется, связь с Лорд-капитаном потихоньку сводит Кибеллу с ума. Не пора ли ее..."'
  speaker: Идира Тласс
- guid: e86208c6-976d-4030-8653-dd2b0ba4554b
  event: BNTRS_PickUps_Idira_240
  text: '"Ну, по крайней мере, в койке она безоружна, а значит — не так опасна. Она ведь там безоружна?"'
  speaker: Идира Тласс
- guid: 3c2dfd64-62b3-4a98-97c5-8a39f7ffacf8
  event: BNTRS_PickUps_Idira_253
  text: '"Тьма, здесь повсюду тьма — зубастая, голодная, неправильная... Смотри куда ступаешь — неверный шаг, и ты в гибельном
    омуте".'
  speaker: Идира Тласс
- guid: 9ad48985-46e4-4229-92f9-7af8ba7f1d5a
  event: BNTRS_PickUps_Idira_26
  text: '"Только если никаких дурманов, кровопусканий и самоистязаний! М-м, чего это ты притихла, черепушка?"'
  speaker: Идира Тласс
- guid: 09b889da-ae2d-4c9e-96d3-4749517b6f61
  event: BNTRS_PickUps_Idira_271
  text: '"Потому что я не культистка смерти с промытыми мозгами. Потому что хочу жить. Потому что есть люди, которым я обязана".'
  speaker: Идира Тласс
- guid: 6bafb100-f47c-42b5-8ddf-eb168b69fc9c
  event: BNTRS_PickUps_Idira_292
  text: '"Старик умер в крови по колено, в попытке прикончить самого близкого человека. Я-то думала, так умирают съехавшие
    с катушек псайкеры, а оно и вот так бывает".'
  speaker: Идира Тласс
- guid: 1384cfd7-61c0-4ec3-ad82-cff0ede38b62
  event: BNTRS_PickUps_Idira_294
  text: '"У меня на днях куда-то пропала любимая фляжка. Ума не приложу, куда делась. Вот думаю — может, кто-то из вас стащил?"'
  speaker: Идира Тласс
- guid: 4f5a3046-8c9c-4d12-973f-0036b3879208
  event: BNTRS_PickUps_Idira_45
  text: '"Старик Вайс так рьяно меня обвинял во всех ненастьях, а сам оказался ничуть не лучше! Варп никого не щадит, выжег
    ты себе глаза или нет".'
  speaker: Идира Тласс
- guid: 086e9107-dfb6-4770-9513-0c50ecf30675
  event: BNTRS_PickUps_Idira_52
  text: '"Среди шепотков я их не слышу. Давай надеяться, что да".'
  speaker: Идира Тласс
- guid: 80a5e940-a7ac-442e-aebb-647aa876b18d
  event: BNTRS_PickUps_Idira_55
  text: '"Они посмели изгадить память Леди Теодоры! Надеюсь, что их гнилые душонки сейчас терзают все демоны варпа".'
  speaker: Идира Тласс
- guid: 613a689d-c068-4b25-bc7f-7682a0f8a48c
  event: BNTRS_PickUps_Idira_63
  text: '"Ткачи Кровавой паутины умываются кровью, потрошат трупы и проводят сомнительные ритуалы... Напомните, чем эти культисты
    лучше тех, что мы истребляем?"'
  speaker: Идира Тласс
- guid: 5093f6e2-7c08-4857-ba1b-4253082d5e9e
  event: BNTRS_PickUps_Idira_73
  text: '"...но как же спокойно мы заснем этой ночью. Фу, Джай, ты такая плохая, что ты говоришь, мы все совершенно не разделяем
    твоих чувств".'
  speaker: Идира Тласс
- guid: c9132dc5-6284-4cb5-8b61-41243ed7c3e0
  event: BNTRS_PickUps_Idira_88
  text: '"Мы пережили бунт еретиков, смерть Леди Теодоры, варп выплюнул нас черти куда... Но удивляет тебя, что Лорд-капитан
    спустил{mf|ся|ась} на нижние палубы? Серьезно?"'
  speaker: Идира Тласс
- guid: 6fe4d000-bd12-4df6-a2f0-0571f37a962d
  event: BNTRS_PickUps_Idira_91
  text: '"О, Леди Теодора позабавилась бы, расскажи ей кто о такой традиции".'
  speaker: Идира Тласс
- guid: 0a4d34c8-8fb4-4bae-97ee-0eeac293e971
  event: BNTRS_PickUps_Idira_95
  text: '"Он, конечно, мерзким отродьем был, но согласись, дед, он смог обмануть простолюдинов сказочками о свободе. Может,
    как-то полегче с ними можно обходиться, а?"'
  speaker: Идира Тласс
- guid: db258f94-d184-4685-ad5d-e28faf834ee3
  event: BNTRS_Reactivity_DLC3_Idira_13
  text: '"Еще одна жестянка на борту. Шепотки говорят, что эта заметно любопытнее старой, но по мне так они все на одно лицо".'
  speaker: Идира Тласс
- guid: 415b4bfa-b3b1-4dac-9bd4-3be17b418707
  event: BNTRS_Reactivity_DLC3_Idira_26
  text: '"Не кори себя, старик. Патент окружали тысячи слуг и охранников, хранили под лучшими замками — и никто даже шороха
    не услышал! Даже мои голосочки молчали, поганцы такие!"'
  speaker: Идира Тласс
- guid: 71505a10-070e-4007-8cf5-a0a7ded414b0
  event: BNTRS_Reactivity_DLC3_Idira_31
  text: '"Лично мне просто... непривычно думать, что Патента нет на своем месте. Я так привыкла к его сущестывованию, словно
    он сросся с самим судном".'
  speaker: Идира Тласс
- guid: cab5c64f-8c0c-410e-82c8-d016d809670c
  event: BNTRS_Reactivity_DLC3_Idira_51
  text: '"Столько фон Валанциусов на одном корабле... больше их было только накануне гибели Теодоры. Надеюсь, в этот раз число
    не будет сокращаться столь... драматически".'
  speaker: Идира Тласс
- guid: 0c2c09f6-5d26-4a5a-822c-6583549dcc43
  event: BNTRS_Reactivity_DLC3_Idira_54
  text: '"Старший фон Валанциус был той еще историей, и мне она будто бы даже понравилась. Тем не менее — хорошо, что у этой
    истории случился финал".'
  speaker: Идира Тласс
- guid: 9674409e-4bbc-43e3-bc14-d9ca9ccfa145
  event: BNTRS_Reactivity_DLC3_Idira_60
  text: '"Ага, как же. На палубах и так не продохнуть от ваших "благовоний"! Если вас станет еще больше, остальных придется
    сервиторизировать, чтобы выдерживали этот смрад!"'
  speaker: Идира Тласс
- guid: 11f68583-71be-4fa5-8d5e-416989ae7997
  event: BNTRS_Reactivity_DLC3_Idira_71
  text: '"Да ты смеешься, булыжник? Они же все потомки штрафников! От твоих надзирателей места мокрого не останется".'
  speaker: Идира Тласс
- guid: 2f70fd3b-084e-468d-a604-a738df8949c5
  event: BNTRS_Reactivity_Idira_05
  text: '"Не знаю, Абеляр... может быть, какой-то потайной проход? И... что это за ящики?"'
  speaker: Идира Тласс
- guid: 1ff80475-b71c-4c49-bee0-b841eea0019d
  event: BNTRS_Reactivity_Idira_07
  text: '"Куда исчезла... исчезло то, что стояло перед нами в огне? Я могу поклясться..."'
  speaker: Идира Тласс
- guid: 2425c500-5256-4caa-95da-7fb0dbd821f0
  event: BNTRS_Reactivity_Idira_10
  text: '"Мы же... мы же не оставим это так просто? Мы же найдем тех, кто это сделал, старик?"'
  speaker: Идира Тласс
- guid: 20f841da-7d7a-49c3-9096-ac3a1dc4762f
  event: BNTRS_Reactivity_Idira_12
  text: '"Старик, он был не жилец. Мутировал на глазах. Просто приблизил свой конец".'
  speaker: Идира Тласс
- guid: 93a2471b-d01f-4837-b624-63468b5bb2f0
  event: BNTRS_Reactivity_Idira_16
  text: '"Не обижайся, Касс, но это все твои навигаторские штучки. У меня с утра премерзкое настроение было, но стоило Лорд-капитану
    взглянуть на тебя — как улыбка сама натянулась до ушей".'
  speaker: Идира Тласс
- guid: 39582ba9-70b8-4925-8049-76425631fd0f
  event: BNTRS_Reactivity_Idira_20
  text: '"Кажись, у Лорд-капитана и Касс в последнее время все как-то не ладится".'
  speaker: Идира Тласс
- guid: 0c92570f-a0f1-45b2-b4a7-289729178fb0
  event: BNTRS_Reactivity_Idira_32
  text: '"Касс, ты... несправедлива ко мне. Представь, за то время, что мы провели рядом, я к тебе прикипела. И... ну... мне
    жаль, девочка. Мне правда жаль".'
  speaker: Идира Тласс
- guid: 62f0b30b-7322-4373-a8d4-39d93884947e
  event: BNTRS_Reactivity_Idira_36
  text: '"Голоски мне все про тебя нашептали, ледышка... хотя какая ты теперь ледышка, а? Таешь весь по краям, словно изморозь
    на выключенном конденсаторе. Ха!"'
  speaker: Идира Тласс
- guid: d5388c4c-eec1-40d4-85af-b69345161eb0
  event: BNTRS_Reactivity_Idira_43
  text: '"Хейнрикс, мои голоски рядом с тобой шепчут о чем-то темном и чудовищном. Такого не было раньше, никогда... что с
    тобой происходит?"'
  speaker: Идира Тласс
- guid: a356c9f6-4b6a-4666-9614-5de6255178a8
  event: BNTRS_Reactivity_Idira_50
  text: '"Немного демонстративна? Да она скоро нам в каюты пикты постельных забав начнет подбрасывать".'
  speaker: Идира Тласс
- guid: 44fdc451-23c2-4a77-a45c-e03b51a80604
  event: BNTRS_Reactivity_Idira_53
  text: '"{name} рискует с ней содержимым карманов и разбитым сердцем, но не безопасностью. Джай — плутовка, но не злодейка,
    так говорят голоса. Да и мне она нравится".'
  speaker: Идира Тласс
- guid: 7dcfd779-bf07-4285-99ca-1923cea0c8a1
  event: BNTRS_Reactivity_Idira_57
  text: '"Знаешь, придурок тощий, ты много опасной чуши плетешь, но вот эту говорить точно не стоило. Она же сама тебе теперь
    что-нибудь... ущемит".'
  speaker: Идира Тласс
- guid: d85f40f0-992c-4836-b33e-e56b709243e6
  event: BNTRS_Reactivity_Idira_64
  text: '"Тоже мне задачка. Она, поди, в койке такое выделывает, что {mf|Его|Ее} Светлость ей любой грех спустит. Впрочем,
    кому я объясняю..."'
  speaker: Идира Тласс
- guid: 0cb16a4f-ab13-46f3-abe6-6d6797b667d5
  event: BNTRS_Reactivity_Idira_69
  text: '"Касс, мне тут шепотки наболтали, что ты ночами рыдаешь в подушку. Я им, конечно, не верю, но ты в последнее время
    и правда расклеилась".'
  speaker: Идира Тласс
- guid: aed8458a-3dab-477d-9b79-f9e99da0c842
  event: BNTRS_Reactivity_Idira_74
  text: '"Не ворчи, старик. Лично я тихо радуюсь тому, что у покоев Лорд-капитана толстые и плотно закрывающиеся двери. Крики...
    не такие душераздирающие, когда их глушит толстый слой пластали".'
  speaker: Идира Тласс
- guid: 1dd61621-bad2-40ff-97d3-930a833f33f1
  event: BNTRS_Reactivity_Idira_83
  text: '"Ооо, рыжая. Сдается мне, если верить моим голоскам-шепоткам, "зло" не в полной мере описывает то, что на уме у тощего..."'
  speaker: Идира Тласс
- guid: 1b3b198e-cee3-4d89-95e4-8b54f0cdd953
  event: BNTRS_Reactivity_Idira_88
  text: '"У этой "чужачки" есть имя — Ирлиэт. И да, голосочки хихикают. Говорят, что-то между ними происходит, что-то назревает...
    Бррр. Не. Мое. Дело".'
  speaker: Идира Тласс
- guid: 815cd0b1-978f-446d-bf8f-8b107674ce77
  event: BNTRS_Reactivity_Idira_93
  text: '"Да я все прислушиваюсь, просто понять пытаюсь... Теперь, когда Лорд-капитан отверг{mf||ла} тебя, начнешь ли ты снова
    психовать и чудить, как раньше, или нет?"'
  speaker: Идира Тласс
- guid: 2e8323f9-3c48-40dd-af47-daa3c8a34ee4
  event: BNTRS_Reactivity_Idira_97
  text: '"Не ринься Лорд-капитан сломя голову прерывать ритуал ксеносов, не пришлось бы никого спасать. Н-да... Эти двое друг
    друга стоят".'
  speaker: Идира Тласс
- guid: 39ba38fc-0f3a-409d-af48-86e2e3c395b0
  event: BNTRS_Stressful_Idira_08
  text: '"Старик, хватит мне пенять за каждый разгул офицерья. Иногда на корабле происходят побоища и анархия без моего участия".'
  speaker: Идира Тласс
- guid: 8db78b60-c9fe-4916-a9ae-a4f7a330316f
  event: BNTRS_Stressful_Idira_100
  text: '"Ты выбрала время, чтоб спросить!"'
  speaker: Идира Тласс
- guid: 55de44be-225b-44f0-9dae-c44d1ce92866
  event: BNTRS_Stressful_Idira_118
  text: '"Просто прекрасно! Раньше меня обвиняли в колдовстве, а теперь — в том, что я вызываю у ксеносов бешенство! Слушай,
    тощий, просто держись от меня подальше, ладно?"'
  speaker: Идира Тласс
- guid: 4f6840b6-e0ba-4da8-9851-3e2c3115c45a
  event: BNTRS_Stressful_Idira_138
  text: '"При помощи бура на твоем мехадендрите, я угадала? Не стоит, право слово. Только что моя ноша перестала казаться
    мне такой уж тяжкой".'
  speaker: Идира Тласс
- guid: 5a77c90b-2fec-46e2-a84b-891e2f297815
  event: BNTRS_Stressful_Idira_156
  text: '"Судя по твоей истории, отводить там особо нечего. Но я благодарна, косматый, теперь я знаю, как сказать "ведьма"
    еще на еще одном языке. Я их собираю".'
  speaker: Идира Тласс
- guid: 78211868-eaa8-428b-a45e-4ec959da915b
  event: BNTRS_Stressful_Idira_174
  text: '"Смотрите — ксенос соглашается с доктринами Империума! С ума сойти!"'
  speaker: Идира Тласс
- guid: 91a84fb4-e74b-40c1-af31-1d1e5e14572a
  event: BNTRS_Stressful_Idira_26
  text: '"Сдается мне, ты хотела спросить не это, а как другие смеют доверять презренной псайкерше. Смирись, святоша, не все
    такие чугуноголовые, как ты!"'
  speaker: Идира Тласс
- guid: 69d9e93a-5527-4d3d-a345-103589f3f70f
  event: BNTRS_Stressful_Idira_44
  text: '"Я лично рада, что мне не надо в него хотя бы смотреть. Не обижайся, Кас, но и без этой зыркалки посредь лба я обойдусь".'
  speaker: Идира Тласс
- guid: 87145718-6d34-43b9-83fc-aeee21ffffe8
  event: BNTRS_Stressful_Idira_62
  text: '"Ты, ледышка, что-то задумал. Думаю, ты и сам еще не в курсе, что, но я-то не ты — я знаю твои коварные планы наперед".'
  speaker: Идира Тласс
- guid: c9c32d1c-d54f-41d5-8518-8929819417af
  event: BNTRS_Stressful_Idira_73
  text: '"Абеляр... я все хотела спросить... Как ты так держишься? Тебе не бывает... невыносимо без нее?"'
  speaker: Идира Тласс
- guid: a0cccf11-8e11-430c-888e-84ef5051ae0c
  event: BNTRS_Stressful_Idira_74
  text: '"Что ты меня взглядом сверлишь, ледышка?"'
  speaker: Идира Тласс
- guid: b1f8fe0e-a5c8-4aa9-a110-999dbed80fcd
  event: BNTRS_Stressful_Idira_77
  text: '"Эй, твое святейшество, как настроение?"'
  speaker: Идира Тласс
- guid: 1173aeaa-c1e9-4532-a944-bb16fb82a4d1
  event: BNTRS_Stressful_Idira_79
  text: '"Кас, скажи мне... что ты видишь, когда смотришь на меня?"'
  speaker: Идира Тласс
- guid: 8704c92b-ebb7-4053-b137-fa47ff006403
  event: BNTRS_Stressful_Idira_81
  text: '"Джай! Не желаешь ли, как вернемся, вновь навестить то заведение на нижних палубах — помнишь, там еще столы из отработанных
    баков прометия? В прошлый раз вышло весело!"'
  speaker: Идира Тласс
- guid: f1a98371-d855-4219-9cbd-768bce2f074a
  event: BNTRS_Stressful_Idira_83
  text: '"Я вот уже спрашивала, но еще раз... вот эльдары вроде все из одного рода, да? А я смотрю на тебя, тощий, и в ум
    не возьму — что ж ты и твой брат такие страхолюдские тогда, не такие, как те, с Януса? Не, конечно, на диете из одной
    боли красавцем не станешь, но..."'
  speaker: Идира Тласс
- guid: acbc731c-6572-488e-91a5-4f45c704e639
  event: BNTRS_Stressful_Idira_85
  text: '"Ты все время в своих молитвах, шестеренка. Самому не скучно? Ты вообще знаешь, что такое веселье, шутка?"'
  speaker: Идира Тласс
- guid: 6b156ed8-24f3-4160-a38e-1021f91813f5
  event: BNTRS_Stressful_Idira_87
  text: '"Косматый, никак не могу понять, ты уважаешь меня за мои способности или презираешь? Смотришь на меня сейчас, словно
    прокисшего амасека хлебнул — я тебе не нравлюсь?"'
  speaker: Идира Тласс
- guid: 2d6162f2-a3e7-4c83-a887-8c6aa1405213
  event: BNTRS_Stressful_Idira_89
  text: '"Вот нам талдычат — ксеносы то, ксеносы это... а я смотрю на тебя, Ирлиэт, и ты будто бы и на человека похожа. Только
    тощая больно".'
  speaker: Идира Тласс
- guid: 21598caf-ec01-4b49-b56f-da07cc4f8f6c
  event: PRL_IdiraRecruit_01
  text: '{n}Женщина перед вами резко оборачивается и смотрит вам прямо в глаза. Ее собственные очи сияют потусторонним светом.{/n}
    "...и вступит под своды палат ослепленного проводника, и узрит сияние последнего восхода сквозь неплотные ставни, и падет
    жертвой прихоти судьбы..."'
  speaker: Идира Тласс
- guid: c015d3f5-a481-42fb-a984-6657b38160ee
  event: PRL_IdiraRecruit_02
  text: '"Госпо{mf|дин|жа}, берегите голову!"'
  speaker: Идира Тласс
- guid: 6c1f6d39-67fe-45af-ab7a-145bd24ca624
  event: PRL_IdiraRecruit_02
  text: '"Госпо{mf|дин|жа}, берегите голову!"'
  speaker: Идира Тласс
- guid: 9352933b-730c-4b1e-8296-098adee0eaa0
  event: PRL_IdiraRecruit_03
  text: '"Идира!" {n}Абеляр недовольно отряхивается и перехватывает оружие.{/n} "Неужели хотя бы сейчас нельзя было формулировать
    свои предсказания четче? Мы едва не погибли!"'
  speaker: Абеляр Версериан
- guid: a4b8348b-ad35-4202-be3f-c68cf0465cce
  event: PRL_IdiraRecruit_04
  text: '{n}Женщина заходится гортанным пьяным смехом.{/n} "Прости, старик... голоса столь громки, что я и сама себя не слышу!
    Визжат, поют... о, Абеляр, как они поют!"'
  speaker: Идира Тласс
- guid: 5ffd03f8-cc30-44a1-940e-c871600c4fbd
  event: PRL_IdiraRecruit_05
  text: '"{name}, это Идира Тласс — личный псайкер и предсказательница Ее Светлости Теодоры фон Валанциус". {n}Абеляр окидывает
    женщину взглядом.{/n} "Идира..."'
  speaker: Абеляр Версериан
- guid: 63534e8e-d5e1-49a4-bd69-c24b0c7fc47d
  event: PRL_IdiraRecruit_06
  text: '"Мертв. Без сомнений. И голоса вопиют о мириаде кошмаров, гогочут над каждой из сотен душ, что сейчас растворяются
    в варпе. Визг из Святилища Навигатора был звонче прочих — и лучше мы убережем Навигатора, чем какого-то нажимателя рычага
    в отсеке с охладителями или повара со средней палубы!"'
  speaker: Идира Тласс
- guid: f4948779-155b-4221-af6c-68445b5c64b6
  event: PRL_IdiraRecruit_07
  text: '{n}Идира кивает в ответ, однако взгляд ее направлен куда-то в сторону.{/n} "Мне шепчут голоса по ту сторону порога.
    Порой их говор различим и дарует познания. Порой он сводит меня с ума... но я терпелива. Я умею слушать. И разбирать.
    Только сейчас вокруг такой гомон... слишком много голосов. Слишком громко".'
  speaker: Идира Тласс
- guid: 17a91edc-aab6-430f-bbf3-ed85f1677177
  event: PRL_IdiraRecruit_08
  text: '{n}Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.{/n} "И ты... ты, {name} фон Валанциус — ты
    {d|Encyclopedia:CharGen_Psyker}тоже{/d} {mf|колдун|ведьма}. Как и второй. Леди Теодоре, кажется, псайкеры столь стали
    по душе, что теперь она одного вместо себя посадить хочет..."'
  speaker: Идира Тласс
- guid: dbe057eb-b782-422a-a6f6-ccde156588dc
  event: PRL_IdiraRecruit_09
  text: '"Меня позвали шепотки — те, которые я смогла разобрать среди прочих воплей и визгов. Те, кто качает лодку и хочет
    опрокинуть ее в варп, начали с больного — с {g|Encyclopedia:Navigator}Навигатора{/g}, проводника сквозь варп. Другие шепотки
    звали в инженерный отсек... но поздно. Я слышала крик нашей главной шестеренки... и тишину после".'
  speaker: Идира Тласс
- guid: f252f4a2-a4e3-4872-9bfe-f380baf7477b
  event: PRL_IdiraRecruit_11
  text: '"О нет. Нет-нет-нет. Никаким "в порядке" и не пахнет. Неужели не чувствуете этот морозец по коже? Не ощущаете взглядов
    на себе? Варп-лед уже сковал переборки... дальше — беда".'
  speaker: Идира Тласс
- guid: 5732e608-7d90-4628-b747-23d548568b93
  event: PRL_IdiraRecruit_12
  text: '{n}Идира замирает. Потом хлопает себя по щекам, потирает лицо и обращает на вас взгляд — потусторонний свет в ее
    глазах угас, а на губах появляется ухмылка.{/n} "Но мы же так просто не дадимся, да? Чтобы тут так фонило, как сейчас,
    нужен Навигатор — хоть калечный, хоть при смерти, но еще живой. И раз у нас еще не слезла кожа с лиц — значит, его третий
    глаз закрыт, ну или подбит на худой конец. Так чего мы тут прохлаждаемся? Вперед — на защиту благородного мутанта, пока
    мы еще живы!"'
  speaker: Идира Тласс
- guid: 8082dc74-763a-4205-b364-cf1470a8fbc5
  event: PRL_IdiraRecruit_13
  text: '"Я не пьяна, старик. Меня дурманит {g|Encyclopedia:Warp}варп{/g}, что пропитывает эти стены. Я вижу участь корабля
    — участь сгинуть в волнах Имматериума, пасть в испепеляющих лучах последнего восхода... и среди испепеляющего пламени
    стоит фигура... кто это? Я не знаю ответа".'
  speaker: Идира Тласс
- guid: 57430e4e-99dc-412c-8f0a-9bd979476cfa
  event: PRL_IdiraRecruit_14
  text: '{n}Абеляр витиевато ругается.{/n} "Проклятье! Ты права — сначала нужно разобраться с тем, что происходит тут".'
  speaker: Абеляр Версериан
- guid: 72773011-1031-4441-9609-5e2f65b18232
  event: PRL_IdiraRecruit_15
  text: '{n}Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.{/n} "А ты... ты — {name} фон Валанциус, {mf|один|одна}
    из наследников Леди Теодоры. Что ж. Вот и познакомились".'
  speaker: Идира Тласс
- guid: e567a986-dfe3-4e23-bb1d-e41e7213fc57
  event: PRL_IdiraRecruit_16
  text: '"Что, думаешь, Леди Теодора не просила меня заглянуть во тьму за спиной тех, кого она прочит себе в наследники?"
    {n}Идира гортанно смеется.{/n} "Я видела тебя, {name}. Я видела поступь твоего минувшего и раны твоего сердца".'
  speaker: Идира Тласс
- guid: c00f0144-852a-49f6-9c6e-32fa73db2c77
  event: PRL_IdiraRecruit_17
  text: '"Что? Главный технопровидец..."'
  speaker: Идира Тласс
- guid: fa256507-cc9e-48cb-8c40-6df7dba0fdbf
  event: PRL_IdiraRecruit_18
  text: '{n}Следовавший за вами всю дорогу сервочереп щелкает несколько раз реле, и обрывки речи Теодоры сменяются смутно
    знакомым вам голосом:{/n} "...офицерская частота, всем, кто меня слышит: держащим в руках оружие немедленно собраться
    на офицерской палубе. Повторяю... немедленно собраться на офицерской палубе для организации контратаки..."'
  speaker: Идира Тласс
- guid: 35dd6757-2e8c-4ab3-bbab-093e16e40547
  event: PRL_IdiraRecruit_19
  text: '"Это Эдельтрад! Провидение Императора, второй наследник тоже жив! Нужно немедленно отправляться на..."'
  speaker: Идира Тласс
- guid: 67b97989-f8a9-4624-b37b-e5bdb4a61073
  event: PRL_IdiraRecruit_20
  text: '"Э, нет, старик! Если мы утонем в варпе, ни один из наследничков Леди Теодоры нам уже не пригодится! Если Эдельтрад,
    как и я, еще не сдал ни разум, ни тело на милость варпу — значит, без нас еще продержится чуток!"'
  speaker: Идира Тласс
