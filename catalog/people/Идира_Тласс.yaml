- guid: 21598caf-ec01-4b49-b56f-da07cc4f8f6c
  event: PRL_IdiraRecruit_01
  text: '{n}Женщина перед вами резко оборачивается и смотрит вам прямо в глаза. Ее собственные очи сияют потусторонним светом.{/n} "...и вступит под своды палат ослепленного проводника, и узрит сияние последнего восхода сквозь неплотные ставни, и падет жертвой прихоти судьбы..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Женщина перед вами резко оборачивается и смотрит вам прямо в глаза. Ее собственные очи сияют потусторонним светом.
  - speaker: Идира Тласс
    text_clean: '...и вступит под своды палат ослепленного проводника, и узрит сияние последнего восхода сквозь неплотные ставни, и падет жертвой прихоти судьбы...'
- guid: c015d3f5-a481-42fb-a984-6657b38160ee
  event: PRL_IdiraRecruit_02
  text: '"Госпо{mf|дин|жа}, берегите голову!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Господин, берегите голову!
- guid: 6c1f6d39-67fe-45af-ab7a-145bd24ca624
  event: PRL_IdiraRecruit_02
  text: '"Госпо{mf|дин|жа}, берегите голову!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Господин, берегите голову!
- guid: 9352933b-730c-4b1e-8296-098adee0eaa0
  event: PRL_IdiraRecruit_03
  text: '"Идира!" {n}Абеляр недовольно отряхивается и перехватывает оружие.{/n} "Неужели хотя бы сейчас нельзя было формулировать свои предсказания четче? Мы едва не погибли!"'
  speaker: Абеляр Версериан
  parts:
  - speaker: Абеляр Версериан
    text_clean: Идира!
  - speaker: narrator
    text_clean: Абеляр недовольно отряхивается и перехватывает оружие.
  - speaker: Абеляр Версериан
    text_clean: Неужели хотя бы сейчас нельзя было формулировать свои предсказания четче? Мы едва не погибли!
- guid: a4b8348b-ad35-4202-be3f-c68cf0465cce
  event: PRL_IdiraRecruit_04
  text: '{n}Женщина заходится гортанным пьяным смехом.{/n} "Прости, старик... голоса столь громки, что я и сама себя не слышу! Визжат, поют... о, Абеляр, как они поют!"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Женщина заходится гортанным пьяным смехом.
  - speaker: Идира Тласс
    text_clean: Прости, старик... голоса столь громки, что я и сама себя не слышу! Визжат, поют... о, Абеляр, как они поют!
- guid: 5ffd03f8-cc30-44a1-940e-c871600c4fbd
  event: PRL_IdiraRecruit_05
  text: '"{name}, это Идира Тласс — личный псайкер и предсказательница Ее Светлости Теодоры фон Валанциус". {n}Абеляр окидывает женщину взглядом.{/n} "Идира..."'
  speaker: Абеляр Версериан
  parts:
  - speaker: Абеляр Версериан
    text_clean: КЭП, это Идира Тласс — личный псайкер и предсказательница Ее Светлости Теодоры фон Валанциус.
  - speaker: narrator
    text_clean: Абеляр окидывает женщину взглядом.
  - speaker: Абеляр Версериан
    text_clean: Идира...
- guid: 63534e8e-d5e1-49a4-bd69-c24b0c7fc47d
  event: PRL_IdiraRecruit_06
  text: '"Мертв. Без сомнений. И голоса вопиют о мириаде кошмаров, гогочут над каждой из сотен душ, что сейчас растворяются в варпе. Визг из Святилища Навигатора был звонче прочих — и лучше мы убережем Навигатора, чем какого-то нажимателя рычага в отсеке с охладителями или повара со средней палубы!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Мертв. Без сомнений. И голоса вопиют о мириаде кошмаров, гогочут над каждой из сотен душ, что сейчас растворяются в варпе. Визг из Святилища Навигатора был звонче прочих — и лучше мы убережем Навигатора, чем какого-то нажимателя рычага в отсеке с охладителями или повара со средней палубы!
- guid: f4948779-155b-4221-af6c-68445b5c64b6
  event: PRL_IdiraRecruit_07
  text: '{n}Идира кивает в ответ, однако взгляд ее направлен куда-то в сторону.{/n} "Мне шепчут голоса по ту сторону порога. Порой их говор различим и дарует познания. Порой он сводит меня с ума... но я терпелива. Я умею слушать. И разбирать. Только сейчас вокруг такой гомон... слишком много голосов. Слишком громко".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира кивает в ответ, однако взгляд ее направлен куда-то в сторону.
  - speaker: Идира Тласс
    text_clean: Мне шепчут голоса по ту сторону порога. Порой их говор различим и дарует познания. Порой он сводит меня с ума... но я терпелива. Я умею слушать. И разбирать. Только сейчас вокруг такой гомон... слишком много голосов. Слишком громко.
- guid: 17a91edc-aab6-430f-bbf3-ed85f1677177
  event: PRL_IdiraRecruit_08
  text: '{n}Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.{/n} "И ты... ты, {name} фон Валанциус — ты {d|Encyclopedia:CharGen_Psyker}тоже{/d} {mf|колдун|ведьма}. Как и второй. Леди Теодоре, кажется, псайкеры столь стали по душе, что теперь она одного вместо себя посадить хочет..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.
  - speaker: Идира Тласс
    text_clean: И ты... ты, КЭП фон Валанциус — ты тоже колдун. Как и второй. Леди Теодоре, кажется, псайкеры столь стали по душе, что теперь она одного вместо себя посадить хочет...
- guid: dbe057eb-b782-422a-a6f6-ccde156588dc
  event: PRL_IdiraRecruit_09
  text: '"Меня позвали шепотки — те, которые я смогла разобрать среди прочих воплей и визгов. Те, кто качает лодку и хочет опрокинуть ее в варп, начали с больного — с {g|Encyclopedia:Navigator}Навигатора{/g}, проводника сквозь варп. Другие шепотки звали в инженерный отсек... но поздно. Я слышала крик нашей главной шестеренки... и тишину после".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Меня позвали шепотки — те, которые я смогла разобрать среди прочих воплей и визгов. Те, кто качает лодку и хочет опрокинуть ее в варп, начали с больного — с Навигатора, проводника сквозь варп. Другие шепотки звали в инженерный отсек... но поздно. Я слышала крик нашей главной шестеренки... и тишину после.
- guid: f252f4a2-a4e3-4872-9bfe-f380baf7477b
  event: PRL_IdiraRecruit_11
  text: '"О нет. Нет-нет-нет. Никаким "в порядке" и не пахнет. Неужели не чувствуете этот морозец по коже? Не ощущаете взглядов на себе? Варп-лед уже сковал переборки... дальше — беда".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: О нет. Нет-нет-нет. Никаким "в порядке" и не пахнет. Неужели не чувствуете этот морозец по коже? Не ощущаете взглядов на себе? Варп-лед уже сковал переборки... дальше — беда.
- guid: 5732e608-7d90-4628-b747-23d548568b93
  event: PRL_IdiraRecruit_12
  text: '{n}Идира замирает. Потом хлопает себя по щекам, потирает лицо и обращает на вас взгляд — потусторонний свет в ее глазах угас, а на губах появляется ухмылка.{/n} "Но мы же так просто не дадимся, да? Чтобы тут так фонило, как сейчас, нужен Навигатор — хоть калечный, хоть при смерти, но еще живой. И раз у нас еще не слезла кожа с лиц — значит, его третий глаз закрыт, ну или подбит на худой конец. Так чего мы тут прохлаждаемся? Вперед — на защиту благородного мутанта, пока мы еще живы!"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира замирает. Потом хлопает себя по щекам, потирает лицо и обращает на вас взгляд — потусторонний свет в ее глазах угас, а на губах появляется ухмылка.
  - speaker: Идира Тласс
    text_clean: Но мы же так просто не дадимся, да? Чтобы тут так фонило, как сейчас, нужен Навигатор — хоть калечный, хоть при смерти, но еще живой. И раз у нас еще не слезла кожа с лиц — значит, его третий глаз закрыт, ну или подбит на худой конец. Так чего мы тут прохлаждаемся? Вперед — на защиту благородного мутанта, пока мы еще живы!
- guid: 8082dc74-763a-4205-b364-cf1470a8fbc5
  event: PRL_IdiraRecruit_13
  text: '"Я не пьяна, старик. Меня дурманит {g|Encyclopedia:Warp}варп{/g}, что пропитывает эти стены. Я вижу участь корабля — участь сгинуть в волнах Имматериума, пасть в испепеляющих лучах последнего восхода... и среди испепеляющего пламени стоит фигура... кто это? Я не знаю ответа".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я не пьяна, старик. Меня дурманит варп, что пропитывает эти стены. Я вижу участь корабля — участь сгинуть в волнах Имматериума, пасть в испепеляющих лучах последнего восхода... и среди испепеляющего пламени стоит фигура... кто это? Я не знаю ответа.
- guid: 57430e4e-99dc-412c-8f0a-9bd979476cfa
  event: PRL_IdiraRecruit_14
  text: '{n}Абеляр витиевато ругается.{/n} "Проклятье! Ты права — сначала нужно разобраться с тем, что происходит тут".'
  speaker: Абеляр Версериан
  parts:
  - speaker: narrator
    text_clean: Абеляр витиевато ругается.
  - speaker: Абеляр Версериан
    text_clean: Проклятье! Ты права — сначала нужно разобраться с тем, что происходит тут.
- guid: 72773011-1031-4441-9609-5e2f65b18232
  event: PRL_IdiraRecruit_15
  text: '{n}Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.{/n} "А ты... ты — {name} фон Валанциус, {mf|один|одна} из наследников Леди Теодоры. Что ж. Вот и познакомились".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира поворачивает к вами голову — ее отрешенные глаза сияют углями.
  - speaker: Идира Тласс
    text_clean: А ты... ты — КЭП фон Валанциус, один из наследников Леди Теодоры. Что ж. Вот и познакомились.
- guid: e567a986-dfe3-4e23-bb1d-e41e7213fc57
  event: PRL_IdiraRecruit_16
  text: '"Что, думаешь, Леди Теодора не просила меня заглянуть во тьму за спиной тех, кого она прочит себе в наследники?" {n}Идира гортанно смеется.{/n} "Я видела тебя, {name}. Я видела поступь твоего минувшего и раны твоего сердца".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Что, думаешь, Леди Теодора не просила меня заглянуть во тьму за спиной тех, кого она прочит себе в наследники?
  - speaker: narrator
    text_clean: Идира гортанно смеется.
  - speaker: Идира Тласс
    text_clean: Я видела тебя, КЭП. Я видела поступь твоего минувшего и раны твоего сердца.
- guid: c00f0144-852a-49f6-9c6e-32fa73db2c77
  event: PRL_IdiraRecruit_17
  text: '"Что? Главный технопровидец..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Что? Главный технопровидец...
- guid: fa256507-cc9e-48cb-8c40-6df7dba0fdbf
  event: PRL_IdiraRecruit_18
  text: '{n}Следовавший за вами всю дорогу сервочереп щелкает несколько раз реле, и обрывки речи Теодоры сменяются смутно знакомым вам голосом:{/n} "...офицерская частота, всем, кто меня слышит: держащим в руках оружие немедленно собраться на офицерской палубе. Повторяю... немедленно собраться на офицерской палубе для организации контратаки..."'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: 'Следовавший за вами всю дорогу сервочереп щелкает несколько раз реле, и обрывки речи Теодоры сменяются смутно знакомым вам голосом:'
  - speaker: Идира Тласс
    text_clean: '...офицерская частота, всем, кто меня слышит: держащим в руках оружие немедленно собраться на офицерской палубе. Повторяю... немедленно собраться на офицерской палубе для организации контратаки...'
- guid: 35dd6757-2e8c-4ab3-bbab-093e16e40547
  event: PRL_IdiraRecruit_19
  text: '"Это Эдельтрад! Провидение Императора, второй наследник тоже жив! Нужно немедленно отправляться на..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это Эдельтрад! Провидение Императора, второй наследник тоже жив! Нужно немедленно отправляться на...
- guid: 67b97989-f8a9-4624-b37b-e5bdb4a61073
  event: PRL_IdiraRecruit_20
  text: '"Э, нет, старик! Если мы утонем в варпе, ни один из наследничков Леди Теодоры нам уже не пригодится! Если Эдельтрад, как и я, еще не сдал ни разум, ни тело на милость варпу — значит, без нас еще продержится чуток!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Э, нет, старик! Если мы утонем в варпе, ни один из наследничков Леди Теодоры нам уже не пригодится! Если Эдельтрад, как и я, еще не сдал ни разум, ни тело на милость варпу — значит, без нас еще продержится чуток!
