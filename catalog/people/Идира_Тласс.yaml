- guid: 480a33ad-4c62-4377-bad7-adf623441009
  event: BNTRS_AreaStressful_Idira_129
  text: '"Варп забрался в бездушную жестянку и исказил вокс? Представляю, что он мог сотворить с мозгами тех бедолаг, что здесь живут..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Варп забрался в бездушную жестянку и исказил вокс? Представляю, что он мог сотворить с мозгами тех бедолаг, что здесь живут...
- guid: 2b663525-3644-4280-a630-07c013bcac85
  event: BNTRS_AreaStressful_Idira_139
  text: '"Вы видали?! Нас едва не сбили в воздухе! Ох какому-то безрукому идиоту не повезет сегодня, когда его притащат к Лорд-капитану на дознание и суд!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Вы видали?! Нас едва не сбили в воздухе! Ох какому-то безрукому идиоту не повезет сегодня, когда его притащат к Лорд-капитану на дознание и суд!
- guid: 8bbe3d56-82aa-4959-8593-61bfc16b72ef
  event: BNTRS_AreaStressful_Idira_150
  text: '"Многочисленные потери среди боевых и гражданских единиц" — это мертвые люди, магос? Они толпами мрут везде, всегда, при любом командовании. Если всех считать начнешь, то когитатор в черепушке и перегреться может!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Многочисленные потери среди боевых и гражданских единиц" — это мертвые люди, магос? Они толпами мрут везде, всегда, при любом командовании. Если всех считать начнешь, то когитатор в черепушке и перегреться может!
- guid: f064628f-fbcf-4d43-815f-9c71af3d2e39
  event: BNTRS_AreaStressful_Idira_151
  text: '"В этом месте... Голоса из-за дверки наперебой гогочут, в такт всей этой какофонии вокруг! Ниже? Да... Что-то есть дальше, внизу!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: В этом месте... Голоса из-за дверки наперебой гогочут, в такт всей этой какофонии вокруг! Ниже? Да... Что-то есть дальше, внизу!
- guid: a6aedd6e-1434-44e3-942e-2983f16d15b8
  event: BNTRS_AreaStressful_Idira_153
  text: '"Проклятье, как глаза жжет-то, хоть новые вставляй! И эти еще вопят... Слышу, как дружочки из-за дверки эту линзу учуяли, бормочут ей что-то... Чую ее мерзкую, липкую энергию. Вот же дрянь!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Проклятье, как глаза жжет-то, хоть новые вставляй! И эти еще вопят... Слышу, как дружочки из-за дверки эту линзу учуяли, бормочут ей что-то... Чую ее мерзкую, липкую энергию. Вот же дрянь!
- guid: 473dcbd3-077e-4554-b75f-227952e1db88
  event: BNTRS_AreaStressful_Idira_156
  text: '"Притихли голосочки мои, затаились. Шепчутся где-то далеко, на самых задворках, словно робкий сквознячок шумит. Хотела бы сказать, что это не к добру, но хорошо-то как свои мысли снова слышать!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Притихли голосочки мои, затаились. Шепчутся где-то далеко, на самых задворках, словно робкий сквознячок шумит. Хотела бы сказать, что это не к добру, но хорошо-то как свои мысли снова слышать!
- guid: 7382ce23-55b1-44ef-a0e4-9da3085a0b65
  event: BNTRS_AreaStressful_Idira_161
  text: '"Как громко! Зачем же так кричать-то! Ох... Вы что-то говорили, господин дознаватель? Не расслышала вас за этим душераздирающим воплем".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Как громко! Зачем же так кричать-то! Ох... Вы что-то говорили, господин дознаватель? Не расслышала вас за этим душераздирающим воплем.
- guid: 58bc9628-5cf6-4606-8e64-4526a68b272e
  event: BNTRS_AreaStressful_Idira_165
  text: '"Абеляр, ты лучше взгляни на эти скопытившиеся черные жестянки. Тут и прорицать не надо — их рук дело. Они ведь насовсем подохли... верно?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Абеляр, ты лучше взгляни на эти скопытившиеся черные жестянки. Тут и прорицать не надо — их рук дело. Они ведь насовсем подохли... верно?
- guid: 9e9e513b-a32f-4470-b3f3-943d567a5fdf
  event: BNTRS_AreaStressful_Idira_168
  text: '"Что это? В стенах, над нами, под полом... Они скребутся о мою черепную коробку... Хотят выпотрошить, надеть на себя мою кожу..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Что это? В стенах, над нами, под полом... Они скребутся о мою черепную коробку... Хотят выпотрошить, надеть на себя мою кожу...
- guid: 1e2a22b0-cb7e-46a1-ad43-8b8699e78f04
  event: BNTRS_AreaStressful_Idira_17
  text: '"Весь дворец сочится страхом... Дракон обвил его своим телом и переломал кости. Что было истиной... сегодня обернется ложью".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Весь дворец сочится страхом... Дракон обвил его своим телом и переломал кости. Что было истиной... сегодня обернется ложью.
- guid: 070a30f3-bec9-4883-b1ab-12ba708ee555
  event: BNTRS_AreaStressful_Idira_171
  text: '"Не мог бы ты приглушить свое механическое жужжание? Голосов не разобрать! Чего-чего говорите? Доброта сгубила праведных? Тоже мне новость".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Не мог бы ты приглушить свое механическое жужжание? Голосов не разобрать! Чего-чего говорите? Доброта сгубила праведных? Тоже мне новость.
- guid: c54f6e11-b9d4-4af0-b856-21d79547de92
  event: BNTRS_AreaStressful_Idira_2
  text: '"Эй, да хватит тут хихикать! Что, сюрприз, там, дальше? Умереть не встать? Ах, как смешно!... Прости, ты что-то сказала, Джай?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эй, да хватит тут хихикать! Что, сюрприз, там, дальше? Умереть не встать? Ах, как смешно!... Прости, ты что-то сказала, Джай?
- guid: 76ede2e9-5b7b-4964-8bae-9b267dcb9c6d
  event: BNTRS_AreaStressful_Idira_21
  text: '"Мы прибыли сюда... по темному приглашению. Черный дракон ворочается в тенях. Пьет кровь. Ждет... вас".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Мы прибыли сюда... по темному приглашению. Черный дракон ворочается в тенях. Пьет кровь. Ждет... вас.
- guid: b335fd08-bb01-468e-ba43-9d38ebba0b74
  event: BNTRS_AreaStressful_Idira_25
  text: '"Чувствую странное... нить, тянущуюся из недавнего прошлого в будущее. Соперничество. Угрозу. Ну и варп-влиянием пахнет, но так, слегка..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Чувствую странное... нить, тянущуюся из недавнего прошлого в будущее. Соперничество. Угрозу. Ну и варп-влиянием пахнет, но так, слегка...
- guid: 3f26849b-0b7d-41cc-b0fe-7d01902fa8b6
  event: BNTRS_AreaStressful_Idira_30
  text: '"Звучишь разочарованно, тощий. Надеялся сторговаться с ними и вонзить нож нам в спину, а?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Звучишь разочарованно, тощий. Надеялся сторговаться с ними и вонзить нож нам в спину, а?
- guid: e7d11143-ec26-49ee-b6fc-69bb78cf0985
  event: BNTRS_AreaStressful_Idira_36
  text: '"Эк вежливо ты произнес "чуть менее грязная грязная дыра", сенешаль!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эк вежливо ты произнес "чуть менее грязная грязная дыра", сенешаль!
- guid: 07fa4b35-8844-4af2-88c3-f3ab395fc46c
  event: BNTRS_AreaStressful_Idira_39
  text: '"Хорошее местечко! Народ гуляет-веселится, даже дышится здесь как-то приятнее!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хорошее местечко! Народ гуляет-веселится, даже дышится здесь как-то приятнее!
- guid: 719053c3-d2b7-4b3f-a3de-081072cdf0de
  event: BNTRS_AreaStressful_Idira_42
  text: '"Тьфу ты, еще немного — и мы приучим нашу благородную девочку ходить по кабакам..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Тьфу ты, еще немного — и мы приучим нашу благородную девочку ходить по кабакам...
- guid: 91a42db8-003d-4af1-aff5-9c5b6503a1af
  event: BNTRS_AreaStressful_Idira_43
  text: '"Всякий раз, как здесь оказываюсь, едва не глохну. Звучат из прошлого трубы славы, перебитые шорохом ветоши, и звон монет — поверх всего..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Всякий раз, как здесь оказываюсь, едва не глохну. Звучат из прошлого трубы славы, перебитые шорохом ветоши, и звон монет — поверх всего...
- guid: 9d3524b3-bd39-4b4c-85d2-f5fc057d8964
  event: BNTRS_AreaStressful_Idira_51
  text: '"Владайм Токара будет ужом виться, как всякий опытный делец. Мне и голосов никаких не надо, чтоб это предсказать".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Владайм Токара будет ужом виться, как всякий опытный делец. Мне и голосов никаких не надо, чтоб это предсказать.
- guid: 6dc65c16-2ef8-4f7e-bfc1-11f934e53c84
  event: BNTRS_AreaStressful_Idira_59
  text: '"Я слышу странное... дыхание, полное отравы, зараза, притворяющаяся молитвою..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я слышу странное... дыхание, полное отравы, зараза, притворяющаяся молитвою...
- guid: a6fc503c-8553-4e9d-a7f3-b141ffb277f1
  event: BNTRS_AreaStressful_Idira_64
  text: '"Ух, зараза! Вроде и жарко тут как в котельной, и несет смазкой и сваркой, да только чую я и другие запахи... гниет как будто что-то..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ух, зараза! Вроде и жарко тут как в котельной, и несет смазкой и сваркой, да только чую я и другие запахи... гниет как будто что-то...
- guid: 6092fc7e-cfb4-4f07-9766-00e6a77c9ebc
  event: BNTRS_AreaStressful_Idira_68
  text: '"Ох... Яд течет по механическим венам... Путь к цели покажется легким, пока не повернешь назад. В железном сердце бушует пламя..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ох... Яд течет по механическим венам... Путь к цели покажется легким, пока не повернешь назад. В железном сердце бушует пламя...
- guid: f59e3fca-813e-4a6a-83e0-02e27d3d5524
  event: BNTRS_AreaStressful_Idira_74
  text: '"Тысячи и тысячи голосов вопиют о спасении... о надежде... о несдержанном обещании... Их боль... твоя награда, дознаватель".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Тысячи и тысячи голосов вопиют о спасении... о надежде... о несдержанном обещании... Их боль... твоя награда, дознаватель.
- guid: f6590f24-062c-4197-8e74-cc7785952d9b
  event: BNTRS_AreaStressful_Idira_81
  text: '"Да ты ей просто завидуешь! Она глушит амасек и носит откровенные наряды, а у тебя только и развлечений, что молиться".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да ты ей просто завидуешь! Она глушит амасек и носит откровенные наряды, а у тебя только и развлечений, что молиться.
- guid: 314df502-2b79-4614-a14f-f0dea457acb3
  event: BNTRS_AreaStressful_Idira_82
  text: '"Голосочки шепчут, что впереди ждет заварушка. Но если не умерить пыл — можно и без штанов остаться. Серьезно... без штанов?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Голосочки шепчут, что впереди ждет заварушка. Но если не умерить пыл — можно и без штанов остаться. Серьезно... без штанов?
- guid: 296aeceb-3f6c-41f9-b246-c5d666978988
  event: BNTRS_AreaStressful_Idira_93
  text: '"Эти джунгли... скрывают хищников опаснее тех, что страшат когтями и клыками. Я слышу... среди них есть вожак. Ближе, чем вы думаете..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эти джунгли... скрывают хищников опаснее тех, что страшат когтями и клыками. Я слышу... среди них есть вожак. Ближе, чем вы думаете...
- guid: 8ddeee84-1f49-4fbd-801e-250ed56f379c
  event: BNTRS_AreaStressful_Idira_98
  text: '"Что ты сказал{mf||а}? А, это не ты? Голоса крепнут... почему? Что-то не так".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Что ты сказал? А, это не ты? Голоса крепнут... почему? Что-то не так.
- guid: c8a4f5cf-f368-4836-a787-71de9414bf7c
  event: BNTRS_Chapter1_Idira_06
  text: '"Сила и вера не помогли им, когда за ними пришли. Надеюсь, они сделают выводы попрактичнее, чем больше молиться и бить поклоны. Хотя кого я обманываю?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Сила и вера не помогли им, когда за ними пришли. Надеюсь, они сделают выводы попрактичнее, чем больше молиться и бить поклоны. Хотя кого я обманываю?
- guid: 05e3b894-5e97-4fcb-a0b4-4cc7c195b87b
  event: BNTRS_Chapter1_Idira_11
  text: '"По крайней мере он попытался обратиться к тому, кого считал другом, а не вышиб ему мозги при встрече. Хотя кому я это говорю?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: По крайней мере он попытался обратиться к тому, кого считал другом, а не вышиб ему мозги при встрече. Хотя кому я это говорю?
- guid: 3f7ab2c4-bb79-4272-8911-37e6979089f4
  event: BNTRS_Chapter1_Idira_13
  text: '"Из чего именно ты сделал такой вывод? Из-за его избирательной слепоты или из очевидной попытки делать хорошую мину?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Из чего именно ты сделал такой вывод? Из-за его избирательной слепоты или из очевидной попытки делать хорошую мину?
- guid: f981e904-47a6-4d20-af39-415b79a79355
  event: BNTRS_Chapter1_Idira_20
  text: '"Ага. А еще очень шумно. Но тебе, Кас, этого не понять. К счастью".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ага. А еще очень шумно. Но тебе, Кас, этого не понять. К счастью.
- guid: 581d81ce-5fb1-45ab-ae48-4ce519ebe485
  event: BNTRS_Chapter1_Idira_26
  text: '"Да-да. Только, надеюсь, экипаж перестанет штормить всякий раз, когда Кас соизволит по мостику пройтись".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да-да. Только, надеюсь, экипаж перестанет штормить всякий раз, когда Кас соизволит по мостику пройтись.
- guid: 76f08a3c-99be-4dc3-bf16-39c840948769
  event: BNTRS_Chapter1_Idira_31
  text: '"Чем скорее... мы уберемся... отсюда... тем... лучше".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Чем скорее... мы уберемся... отсюда... тем... лучше.
- guid: 8ae9f822-51d3-4950-9b30-d35f3c7d48be
  event: BNTRS_Chapter1_Idira_37
  text: '"Дай людям отгоревать. Леди Теодора была с нами столь долго... что начала казаться бессмертной".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Дай людям отгоревать. Леди Теодора была с нами столь долго... что начала казаться бессмертной.
- guid: 75ef5a0a-e303-42c6-af3c-e924fcd5dd44
  event: BNTRS_Chapter1_Idira_39
  text: '"Проклятый варп... если бы мы были в реальном мире, я бы услышала... услышала..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Проклятый варп... если бы мы были в реальном мире, я бы услышала... услышала...
- guid: 334b80fc-81bb-4ee1-ad8a-e34d9e8d2995
  event: BNTRS_Chapter1_Idira_44
  text: '"С твоим появлением она стала еще, кхе, необычнее. Когда ты, говоришь, нас покинешь, м?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: С твоим появлением она стала еще, кхе, необычнее. Когда ты, говоришь, нас покинешь, м?
- guid: 6e76a389-32ff-4b99-a735-066f53ebb6ad
  event: BNTRS_Chapter1_Idira_46
  text: '"Хе. С персоналом зря стараешься. Если их собеседник будет поджаривать им пятки во время разговора, все пароли быстро будут разглашены."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хе. С персоналом зря стараешься. Если их собеседник будет поджаривать им пятки во время разговора, все пароли быстро будут разглашены.
- guid: e1f64b8b-8b60-46ee-a534-e7c928e96fad
  event: BNTRS_Chapter1_Idira_48
  text: '"Всегда считала, что шестеренки говорят несколько... непонятно. Ну, теперь, кажется, будет возможность потренироваться в расшифровке!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Всегда считала, что шестеренки говорят несколько... непонятно. Ну, теперь, кажется, будет возможность потренироваться в расшифровке!
- guid: c6204a1b-f91f-401d-a0cd-3ab8d62717cc
  event: BNTRS_Chapter1_Idira_57
  text: '"По поводу тех людей с нижних палуб... мне кажется, блюстители палку перегнули. Нельзя держать людей в черном теле все время — если не забузят, то как минимум чердаком поедут".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: По поводу тех людей с нижних палуб... мне кажется, блюстители палку перегнули. Нельзя держать людей в черном теле все время — если не забузят, то как минимум чердаком поедут.
- guid: ae9091e3-ae9b-4678-b349-1a7394c200bd
  event: BNTRS_Chapter2_Idira_03
  text: '"Кажется, ледышка не слишком рвется об этом говорить. И, наверное, я тоже не хочу об этом лишний раз думать".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Кажется, ледышка не слишком рвется об этом говорить. И, наверное, я тоже не хочу об этом лишний раз думать.
- guid: f665cda5-4379-48ba-b39e-9e5f0e29d233
  event: BNTRS_Chapter2_Idira_09
  text: '"Мы уже давно не в системе Райкада, а в голове все еще эхо того, что я перед трансляцией наслушаться успела... Жутко даже подумать, что там происходит сейчас".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Мы уже давно не в системе Райкада, а в голове все еще эхо того, что я перед трансляцией наслушаться успела... Жутко даже подумать, что там происходит сейчас.
- guid: 1451e563-f7b6-4333-8c4d-7be5c56acfca
  event: BNTRS_Chapter2_Idira_100
  text: '"То ли дело, когда "нечистые вычисления" производятся в человеческой голове... которую при желании легко отпилить. Я правильно поняла двойное дно твоей реплики?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: То ли дело, когда "нечистые вычисления" производятся в человеческой голове... которую при желании легко отпилить. Я правильно поняла двойное дно твоей реплики?
- guid: 719129d1-c24c-42da-8e6d-6fbab5b1ca73
  event: BNTRS_Chapter2_Idira_102
  text: '"Я все еще не верю, что вы, Лорд-капитан, позволили мне остаться... не избавились от меня... я докажу... оправдаю ваше доверие".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я все еще не верю, что вы, Лорд-капитан, позволили мне остаться... не избавились от меня... я докажу... оправдаю ваше доверие.
- guid: af4750e8-d9e6-4be7-82f0-98500de8fda7
  event: BNTRS_Chapter2_Idira_107
  text: '"Я... боюсь тебе отвечать. Что, если я скажу: "нет, не слышала"? На всякий случай прокипятишь мне мозги, чтобы проверить, не вру ли я?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Я... боюсь тебе отвечать. Что, если я скажу: "нет, не слышала"? На всякий случай прокипятишь мне мозги, чтобы проверить, не вру ли я?'
- guid: b96a2bce-06cb-4468-b633-57cfbacb8c3c
  event: BNTRS_Chapter2_Idira_121
  text: '"А, прекрати, шестеренка! С Джай хотя бы разговаривать можно, а не "вести коммуникацию".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: А, прекрати, шестеренка! С Джай хотя бы разговаривать можно, а не "вести коммуникацию.
- guid: 72f7f9df-4d4b-4644-a4a5-31b4dce70c6d
  event: BNTRS_Chapter2_Idira_125
  text: '"Ха. Я когда-то так же думала, когда только к Леди Теодоре попала... со временем привыкнешь. Хочешь, покажу, где на корабле самый сносный кабак?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ха. Я когда-то так же думала, когда только к Леди Теодоре попала... со временем привыкнешь. Хочешь, покажу, где на корабле самый сносный кабак?
- guid: 0f408fb8-30f9-4279-b534-01618911cdcc
  event: BNTRS_Chapter2_Idira_131
  text: '"А вдруг их цель на самом деле просто мучить людей? В таком случае механизмам Администратума нет равных!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: А вдруг их цель на самом деле просто мучить людей? В таком случае механизмам Администратума нет равных!
- guid: 39b9b1c0-4e91-4541-bed6-020348b31ff8
  event: BNTRS_Chapter2_Idira_141
  text: '"Вся эта история вокруг нашего нового Главного технопровидца заставляет меня нервничать... словно огромный механизм пришел в движение, стремясь свести свои части воедино".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Вся эта история вокруг нашего нового Главного технопровидца заставляет меня нервничать... словно огромный механизм пришел в движение, стремясь свести свои части воедино.
- guid: 76c228a7-2006-4c99-8004-3522709052de
  event: BNTRS_Chapter2_Idira_146
  text: '"Ооо, наша ледышка просто изводит себя от бешенства. Шепотки уже рассказали мне про пару его планов насчет Ирлиэт... только вот пока Лорд-капитан не разрешит — ничего он и не сделает".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ооо, наша ледышка просто изводит себя от бешенства. Шепотки уже рассказали мне про пару его планов насчет Ирлиэт... только вот пока Лорд-капитан не разрешит — ничего он и не сделает.
- guid: 48d93f90-6ed4-4b19-b07a-af25a03c3950
  event: BNTRS_Chapter2_Idira_148
  text: '"Ага, а поделать-то ты с ней ничего и не можешь, святоша. Терпи. Только зубами так громко не скрипи — сотрешь".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ага, а поделать-то ты с ней ничего и не можешь, святоша. Терпи. Только зубами так громко не скрипи — сотрешь.
- guid: 6a187f00-67ae-4c5e-b375-a76d96dc3cb4
  event: BNTRS_Chapter2_Idira_21
  text: '"Я все не могу перестать думать о губернаторе Даргонуса. Почему его не было при штурме дворца Вольного Торговца?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я все не могу перестать думать о губернаторе Даргонуса. Почему его не было при штурме дворца Вольного Торговца?
- guid: 7dcdc248-3fe4-4baa-84ce-124f2a525052
  event: BNTRS_Chapter2_Idira_32
  text: '"Мне дурно от одной мысли, сколько невинных погибло в муках — а ты этим восхищаешься!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Мне дурно от одной мысли, сколько невинных погибло в муках — а ты этим восхищаешься!
- guid: b7cce804-d8c8-4632-bade-4975d287345c
  event: BNTRS_Chapter2_Idira_40
  text: '"Ты про то, как на это отреагирует Винтерскейл? Из того, что я слышала — интересные не то слово! Ничего хорошего ждать точно не стоит".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ты про то, как на это отреагирует Винтерскейл? Из того, что я слышала — интересные не то слово! Ничего хорошего ждать точно не стоит.
- guid: eafc2019-e283-45c7-845a-1973d103c457
  event: BNTRS_Chapter2_Idira_42
  text: '"Хотела бы я посмотреть на рожу Инцендии, когда она узнала о том, как мы увели у нее Футфол..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хотела бы я посмотреть на рожу Инцендии, когда она узнала о том, как мы увели у нее Футфол...
- guid: 6593fe65-0bc9-49a7-a8c1-00f8a394c608
  event: BNTRS_Chapter2_Idira_47
  text: '"Это ты так намекаешь, что чуть что — и планету Лорд-капитана взорвут? Весьма тактично, господин дознаватель — спасибо, что хоть предупредил!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это ты так намекаешь, что чуть что — и планету Лорд-капитана взорвут? Весьма тактично, господин дознаватель — спасибо, что хоть предупредил!
- guid: eb5bf6ed-cfef-4d4a-b966-31fbd5de4445
  event: BNTRS_Chapter2_Idira_56
  text: '"Это ты так дал понять, что расстроился? Слушай, ведь можно просто сказать — "хреново мне", и все. Тебя так и поймут, и поддержать смогут".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это ты так дал понять, что расстроился? Слушай, ведь можно просто сказать — "хреново мне", и все. Тебя так и поймут, и поддержать смогут.
- guid: daf3ced4-b4ba-4aee-a821-edbdf210a83d
  event: BNTRS_Chapter2_Idira_70
  text: '"Ты серьезно считаешь, что смерть тех безумцев не была мученической? Стать живой заплаткой на корабле, захваченным демоном — можно ли изобрести казнь страшнее? Бр-р-р!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ты серьезно считаешь, что смерть тех безумцев не была мученической? Стать живой заплаткой на корабле, захваченным демоном — можно ли изобрести казнь страшнее? Бр-р-р!
- guid: 2c1ce97e-f038-498b-a927-8f76557ba843
  event: BNTRS_Chapter2_Idira_81
  text: '"Эй, святоша... а что это тебя тот еретик в лицо признал, м? Ну тот, которого мы прижали в логове вонючем? Странные у тебя друзья, вот что сказать хочу".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эй, святоша... а что это тебя тот еретик в лицо признал, м? Ну тот, которого мы прижали в логове вонючем? Странные у тебя друзья, вот что сказать хочу.
- guid: f9f84755-31a6-4c16-97da-55fea6689751
  event: BNTRS_Chapter2_Idira_84
  text: '"Ну и заварушку устроили родственнички Касс во дворце... подумать только, покушение прямо на приеме у Вольного Торговца!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ну и заварушку устроили родственнички Касс во дворце... подумать только, покушение прямо на приеме у Вольного Торговца!
- guid: 42d91e39-4c96-408b-8a5f-d95b2ff882d1
  event: BNTRS_Chapter2_Idira_89
  text: '"Да, Касс, не хочу тебя пугать... но, когда я думаю о тебе, я слышу смех. Смех много более древний, чем само Человечество... и наводящий жуть. Не думаю, что смеется этот кто-то вместе с нами — скорее над".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да, Касс, не хочу тебя пугать... но, когда я думаю о тебе, я слышу смех. Смех много более древний, чем само Человечество... и наводящий жуть. Не думаю, что смеется этот кто-то вместе с нами — скорее над.
- guid: 457d19bd-7d3f-42e7-b704-73f94da1ee7f
  event: BNTRS_Chapter2_Idira_96
  text: '"После того, как ледышка спустился на Кьяву Гамма ради своей миссии, мои шепотки при виде дознавателя ведут себя странно. В толк не возьму, что именно изменилось, но... просто странно".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: После того, как ледышка спустился на Кьяву Гамма ради своей миссии, мои шепотки при виде дознавателя ведут себя странно. В толк не возьму, что именно изменилось, но... просто странно.
- guid: 69498d1e-3e3c-44d3-a517-5514ed30a831
  event: BNTRS_Chapter3_Idira_01
  text: '"Сначала предательство Кунрада... теперь вот эта заварушка... старик, а как мы с тобой еще живы, а?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Сначала предательство Кунрада... теперь вот эта заварушка... старик, а как мы с тобой еще живы, а?
- guid: 2831950f-bb71-485d-83f4-93242fc36e12
  event: BNTRS_Chapter3_Idira_100
  text: '"Порадуйся тому, что ты жив. А всем своим епитимьям еще найдешь время... если мы сбежим отсюда".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Порадуйся тому, что ты жив. А всем своим епитимьям еще найдешь время... если мы сбежим отсюда.
- guid: 40350238-44cf-4331-8065-9157864973f0
  event: BNTRS_Chapter3_Idira_106
  text: '"А в этом месте можно сделать что-то, за что тебя не захочет убить еще больше ксеносов, а? А, точно. Умереть".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: А в этом месте можно сделать что-то, за что тебя не захочет убить еще больше ксеносов, а? А, точно. Умереть.
- guid: 0279c104-54b3-43fb-a810-4786e283abe2
  event: BNTRS_Chapter3_Idira_122
  text: '"Знаешь, косматый, не тебе меня судить. Сам сколько в клетке сидел и не рыпался, а все туда же, бедную Идиру жизни поучать".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Знаешь, косматый, не тебе меня судить. Сам сколько в клетке сидел и не рыпался, а все туда же, бедную Идиру жизни поучать.
- guid: 48d0a94e-e25f-49fa-86fa-a1d24fd9c203
  event: BNTRS_Chapter3_Idira_13
  text: '"Не верю сама, что соглашаюсь со святошей... но да, наконец-то этот мерзавец поплатится за то, что сделал!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Не верю сама, что соглашаюсь со святошей... но да, наконец-то этот мерзавец поплатится за то, что сделал!
- guid: e2540adf-70c9-4547-bae6-c0156f4a5ff1
  event: BNTRS_Chapter3_Idira_130
  text: '"Экая ты ретивая, а. Хотя могу тебя понять: со всеми предущими твоими сородичами как-то... не задалось".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Экая ты ретивая, а. Хотя могу тебя понять: со всеми предущими твоими сородичами как-то... не задалось.'
- guid: f2b0c1d4-6b36-4236-a485-35eb313aa109
  event: BNTRS_Chapter3_Idira_138
  text: '"Да пошла она! Мы ее приютили, защитили, с родней ее возились... Давайте отнесем ее тело Тервантьясу, пусть воскресит ее, а мы еще раз убьем!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да пошла она! Мы ее приютили, защитили, с родней ее возились... Давайте отнесем ее тело Тервантьясу, пусть воскресит ее, а мы еще раз убьем!
- guid: 41ef468f-d636-47f2-93a1-27427cdafcac
  event: BNTRS_Chapter3_Idira_145
  text: '"Хех. Кажется, у Лорд-капитана привычка — прощать непростительное... да, рыжая?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хех. Кажется, у Лорд-капитана привычка — прощать непростительное... да, рыжая?
- guid: fc0728a9-4607-4c53-b459-b67b7f38d1f3
  event: BNTRS_Chapter3_Idira_26
  text: '"Эти порталы... не могу понять, как далеко мы от треклятой арены... надо ли опасаться погони? Можно ли надеяться на исход?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эти порталы... не могу понять, как далеко мы от треклятой арены... надо ли опасаться погони? Можно ли надеяться на исход?
- guid: 6dcd6b58-6571-4570-aab1-a09553bb5b0e
  event: BNTRS_Chapter3_Idira_42
  text: '"Все еще не могу поверить, что ты жива, Касс... это место не смогло сломить тебя".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Все еще не могу поверить, что ты жива, Касс... это место не смогло сломить тебя.
- guid: 2444e54b-4daf-47d7-a9b7-8b341f2a8b89
  event: BNTRS_Chapter3_Idira_52
  text: '"Те безумные вопли в лаборатории, все то время, пока я там была... это же был ты, ледышка? Как ты выжил после... после такого?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Те безумные вопли в лаборатории, все то время, пока я там была... это же был ты, ледышка? Как ты выжил после... после такого?
- guid: a429fc22-ccbd-47ce-ad2b-518ca367fff5
  event: BNTRS_Chapter3_Idira_59
  text: '"Кому суждено сгинуть в варпе, тот на плахе не окажется. Подавись своим каталогом, стукач железный".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Кому суждено сгинуть в варпе, тот на плахе не окажется. Подавись своим каталогом, стукач железный.
- guid: 6b41f028-967d-4d90-abaf-62eb77cb6dd8
  event: BNTRS_Chapter3_Idira_61
  text: '"А, а тебе так бы этого хотелось, да? Нет уж. Лорд-капитану я еще нужна — так что засунь свое разочарование куда-нибудь... подальше".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: А, а тебе так бы этого хотелось, да? Нет уж. Лорд-капитану я еще нужна — так что засунь свое разочарование куда-нибудь... подальше.
- guid: f660a0dd-f34d-48a2-9309-fee504002707
  event: BNTRS_Chapter3_Idira_62
  text: '"Я видела тот аппарат, в который ты была заключена. Но я даже не подозревала..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я видела тот аппарат, в который ты была заключена. Но я даже не подозревала...
- guid: 15f2aacd-09ce-4066-80c9-a73601a5cad4
  event: BNTRS_Chapter3_Idira_65
  text: '"Ох не знаю я... кажется, если выживу, еще полгода буду бояться темных углов, не говоря уже о темных кабаках с темными личностями".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ох не знаю я... кажется, если выживу, еще полгода буду бояться темных углов, не говоря уже о темных кабаках с темными личностями.
- guid: 809fea49-3f77-40a2-8979-34f46ba4ec5f
  event: BNTRS_Chapter3_Idira_75
  text: '"О, Касс, видела бы ты, какие празднества закатывала Леди Теодора!... То есть церемония была очень хорошей, не поймите превратно, Лорд-капитан! Это я так, снова о былом ною..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: О, Касс, видела бы ты, какие празднества закатывала Леди Теодора!... То есть церемония была очень хорошей, не поймите превратно, Лорд-капитан! Это я так, снова о былом ною...
- guid: 6df64025-aafb-4266-b6cd-2e3656e245ff
  event: BNTRS_Chapter3_Idira_87
  text: '"Я бы на твоем месте сейчас крепко задумалась, что, в таком случае, ждет впереди тебя, невинная ты наша".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я бы на твоем месте сейчас крепко задумалась, что, в таком случае, ждет впереди тебя, невинная ты наша.
- guid: f072ad86-6a5b-460d-bc87-a4bd38bc82ba
  event: BNTRS_Chapter4_Idira_03
  text: '"Угу. А еще в их вымирании им сильно подсобили твои дружки-приятели и ты сам. Сотри свою паскудную улыбку с лица, изверг, они тебе все же родичами приходились!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Угу. А еще в их вымирании им сильно подсобили твои дружки-приятели и ты сам. Сотри свою паскудную улыбку с лица, изверг, они тебе все же родичами приходились!
- guid: c84533c4-f305-43f8-90a8-bd9aee597670
  event: BNTRS_Chapter4_Idira_114
  text: '"После того, что произошло на Фтоне... неужели тебе не хочется задать парочку вопросов своему начальнику?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: После того, что произошло на Фтоне... неужели тебе не хочется задать парочку вопросов своему начальнику?
- guid: 57eed083-a461-4ddc-b8a3-e35822d003cc
  event: BNTRS_Chapter4_Idira_122
  text: '"Тишина в голове... благословенная, казавшаяся столь недостижимой тишина..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Тишина в голове... благословенная, казавшаяся столь недостижимой тишина...
- guid: 5dea6f9f-d359-4e49-9738-8b06c13f5194
  event: BNTRS_Chapter4_Idira_125
  text: '"Странно себя чувствую. Вроде бы искала управу на свою "проблему", искала, а в последний момент отказалась. И знаете, что страннее всего, Лорд-капитан? Не жалею. Ни капли".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Странно себя чувствую. Вроде бы искала управу на свою "проблему", искала, а в последний момент отказалась. И знаете, что страннее всего, Лорд-капитан? Не жалею. Ни капли.
- guid: 14f5da4f-863a-444c-a0ba-4ca837835328
  event: BNTRS_Chapter4_Idira_130
  text: '"Ха, наши головы покрепче ваших тощих черепушек! Не каждый лезет на стену, стоит произойти трансляции в Эмпиреи. Я так вообще — сама стабильность. Учись, пока я жива!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ха, наши головы покрепче ваших тощих черепушек! Не каждый лезет на стену, стоит произойти трансляции в Эмпиреи. Я так вообще — сама стабильность. Учись, пока я жива!
- guid: d017093c-cd32-4114-8e03-800cbc90c30b
  event: BNTRS_Chapter4_Idira_14
  text: '"Что, ледышка, не посвятили тебя в хитросплетения планов Калькасара? Кажется, кое-кого разжаловали из любимчиков".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Что, ледышка, не посвятили тебя в хитросплетения планов Калькасара? Кажется, кое-кого разжаловали из любимчиков.
- guid: 2e5b4964-f37a-459f-b212-88ed6f926605
  event: BNTRS_Chapter4_Idira_140
  text: '"Со мной тут разговаривал этот... этот Номос. Чудной такой. Жутковатый даже. Но вроде... безобидный. И очень любопытный".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Со мной тут разговаривал этот... этот Номос. Чудной такой. Жутковатый даже. Но вроде... безобидный. И очень любопытный.
- guid: d3bb42f1-c1cb-4da6-b6f1-be228deb203c
  event: BNTRS_Chapter4_Idira_160
  text: '"Косматый, нет. Пожалуйста. Я больше не могу. Очень тебя прошу, давай без меня!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Косматый, нет. Пожалуйста. Я больше не могу. Очень тебя прошу, давай без меня!
- guid: 28bd9f7a-00ef-4882-92df-6522bd438089
  event: BNTRS_Chapter4_Idira_22
  text: '"Я тут подумала... А мы точно вернулись? Это не может быть очередной пыткой Тервантьяса? Какой-нибудь извращенной грезой?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я тут подумала... А мы точно вернулись? Это не может быть очередной пыткой Тервантьяса? Какой-нибудь извращенной грезой?
- guid: 74f7a67b-44de-4723-9764-a03a87dbe844
  event: BNTRS_Chapter4_Idira_26
  text: '"Нет. Футфол — тот, каким знали его мы — просто перестанет существовать. Каким он станет... об этом я думать не хочу".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Нет. Футфол — тот, каким знали его мы — просто перестанет существовать. Каким он станет... об этом я думать не хочу.
- guid: fe2f53d8-99e6-4921-b993-92dc80b62701
  event: BNTRS_Chapter4_Idira_36
  text: '"Могу только согласиться с тобой, старик. Сколько бы грехов не нажила эта станция, превращение ее в могильник лучше не сделало!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Могу только согласиться с тобой, старик. Сколько бы грехов не нажила эта станция, превращение ее в могильник лучше не сделало!
- guid: b1c88b9a-4e11-4f63-be71-7538ef207ed0
  event: BNTRS_Chapter4_Idira_40
  text: '"Итак, Владайм остался у руля Футфола. Посмотрим, какие выводы он сделает из этой заварушки с Чорда".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Итак, Владайм остался у руля Футфола. Посмотрим, какие выводы он сделает из этой заварушки с Чорда.
- guid: 2bce4d68-c898-4519-a5de-101b50169871
  event: BNTRS_Chapter4_Idira_45
  text: '"Да брось вздыхать, старик. Фон Валанциус и Чорда никогда не дружили в десна. Рано или поздно кто-то бы да взял верх — все это понимали".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да брось вздыхать, старик. Фон Валанциус и Чорда никогда не дружили в десна. Рано или поздно кто-то бы да взял верх — все это понимали.
- guid: e468cb46-9357-428a-bb45-ce82ed74f772
  event: BNTRS_Chapter4_Idira_59
  text: '"Лучше драться в меньшинстве, но знать, что никакая сволочь не прострелит твой затылок, потому что ты "запятнал себя в глазах Императора".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Лучше драться в меньшинстве, но знать, что никакая сволочь не прострелит твой затылок, потому что ты "запятнал себя в глазах Императора.
- guid: 663acb6a-e2a1-482d-a0a3-29afbfce8c18
  event: BNTRS_Chapter4_Idira_74
  text: '"А нечего было недооценивать Лорд-капитана! "Новеньк{mf|ий|ая}" да "новеньк{mf|ий|ая}"... сам себя успокаивал, что бояться {mf|его|ее} не надо, вот и доуспокоился!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: А нечего было недооценивать Лорд-капитана! "Новенький" да "новенький"... сам себя успокаивал, что бояться его не надо, вот и доуспокоился!
- guid: b9675aa2-8a1b-43dc-9ade-285429266fda
  event: BNTRS_Chapter4_Idira_81
  text: '"С тех пор, как Лорд-капитан к Калькасару наведал{mf|ся|ась}, чувство у меня такое... непростое. И неприятное. Словно... не все было сказано".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: С тех пор, как Лорд-капитан к Калькасару наведался, чувство у меня такое... непростое. И неприятное. Словно... не все было сказано.
- guid: 2db74320-7aec-42f5-947a-c47d3b59088d
  event: BNTRS_Chapter4_Idira_88
  text: '"Хорошо еще что получилось поймать ее по горячим следам — если бы змея уползла, твоя семья, старик, могла бы получить ой какой неприятный сюрприз лет эдак через пять или десять..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хорошо еще что получилось поймать ее по горячим следам — если бы змея уползла, твоя семья, старик, могла бы получить ой какой неприятный сюрприз лет эдак через пять или десять...
- guid: 105cf423-9e49-4c20-9575-8817003a89e1
  event: BNTRS_Chapter5_Idira_04
  text: '"Странно, эти системы кажутся мне знакомыми... На что они похожи из того, что мы видели?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Странно, эти системы кажутся мне знакомыми... На что они похожи из того, что мы видели?
- guid: 40fbac19-7c81-485c-bfc1-7cab8f5f83db
  event: BNTRS_Chapter5_Idira_10
  text: '"Слушай, не знаю до конца, кем там был этот твой Назокей, но мысль о том, что ты, тощий, выбесил кого-то до такой степени, что он отправился за твоей башкой на край света, кажется мне ну очень логичной".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Слушай, не знаю до конца, кем там был этот твой Назокей, но мысль о том, что ты, тощий, выбесил кого-то до такой степени, что он отправился за твоей башкой на край света, кажется мне ну очень логичной.
- guid: 1240e848-beb7-45dd-abf6-9948d263616c
  event: BNTRS_Chapter5_Idira_20
  text: '"Ага, ты прикончишь убийц и поклянешься отомстить их хозяину. Расправишься с ним и пойдешь искать того, кто виновен "на самом деле". Признай, тебе либо нравится это, либо ты просто боишься остановиться".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ага, ты прикончишь убийц и поклянешься отомстить их хозяину. Расправишься с ним и пойдешь искать того, кто виновен "на самом деле". Признай, тебе либо нравится это, либо ты просто боишься остановиться.
- guid: beb8cf0a-d6e8-4463-b028-06454b41e2da
  event: BNTRS_Companion_DLC3_Idira_126
  text: '"Ох, пузатый господин, не ломай мозги! Даже мои шепотки не понимают, что дальше выкинет этот арлекин, куда уж твоим шестеренкам угнаться!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ох, пузатый господин, не ломай мозги! Даже мои шепотки не понимают, что дальше выкинет этот арлекин, куда уж твоим шестеренкам угнаться!
- guid: 58fc06f1-fe17-4194-9bcf-a15f096893f0
  event: BNTRS_Companion_DLC3_Idira_14
  text: '"Клешни прочь, пузатый господин — мне их Леди Теодора пожаловала! Кстати о псайкерском проклятии: передавай Нунциусу пламенный привет от друзей с той стороны. Они насчет него тоже заинтригованы".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Клешни прочь, пузатый господин — мне их Леди Теодора пожаловала! Кстати о псайкерском проклятии: передавай Нунциусу пламенный привет от друзей с той стороны. Они насчет него тоже заинтригованы.'
- guid: 0db51a20-ea7c-47a2-8d8d-ef9651de2a39
  event: BNTRS_Companion_DLC3_Idira_23
  text: '"В ледяном озере слез обрящешь утерянное, но обретешь ли покой? У смерти единственный глаз, что смотрит из тьмы веков, но руками ее будешь ты... кххх... Прости, пузатый господин, это было сильнее меня".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: В ледяном озере слез обрящешь утерянное, но обретешь ли покой? У смерти единственный глаз, что смотрит из тьмы веков, но руками ее будешь ты... кххх... Прости, пузатый господин, это было сильнее меня.
- guid: c5478a60-6fd8-449b-9b8d-75d6b1cd8e60
  event: BNTRS_Companion_DLC3_Idira_67
  text: '"Я чувствую себя так, словно на куски разваливаюсь, но голова вроде варит, если ты об этом. Ох. Про куски я зря сказала, да?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я чувствую себя так, словно на куски разваливаюсь, но голова вроде варит, если ты об этом. Ох. Про куски я зря сказала, да?
- guid: 5c562e29-a9ee-45ed-a0f1-0b5263df97f8
  event: BNTRS_Companion_DLC3_Idira_80
  text: '"Погоди, то есть беседуя со своим воображаемым дружком, ты абсолютно трезв? Пожалуй, не буду предлагать тебе выпить. Кто знает, что ты учудишь, перебрав амасека".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Погоди, то есть беседуя со своим воображаемым дружком, ты абсолютно трезв? Пожалуй, не буду предлагать тебе выпить. Кто знает, что ты учудишь, перебрав амасека.
- guid: 83c21ac5-4800-4ad5-a8b2-6252c5c2e988
  event: BNTRS_DLC2_Idira_09
  text: '"Эй, я видела тебя в питейной на нижних палубах, булыжник! Даже арбитрам иногда надо расслабляться, да?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Эй, я видела тебя в питейной на нижних палубах, булыжник! Даже арбитрам иногда надо расслабляться, да?
- guid: 76f97614-f08b-4c85-a818-73f36370d7f0
  event: BNTRS_DLC2_Idira_103
  text: '"Косматый, словами не могу передать, как мне жаль, что не ты задаешь правила во Дворце Правосудия!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Косматый, словами не могу передать, как мне жаль, что не ты задаешь правила во Дворце Правосудия!
- guid: 5ee0c452-72f5-49a0-99e5-3d5e4c90fef0
  event: BNTRS_DLC2_Idira_107
  text: '"Ты как-то упускаешь тот факт, что с суда друкари можно уйти только по частям после о-о-очень долгих пыток. Но какая разница, если есть возможность кинуть камнем в мон-кай, да?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ты как-то упускаешь тот факт, что с суда друкари можно уйти только по частям после о-о-очень долгих пыток. Но какая разница, если есть возможность кинуть камнем в мон-кай, да?
- guid: bd076e17-57a4-4ca0-842c-6d3ba39566d5
  event: BNTRS_DLC2_Idira_117
  text: '"Никак не пойму, почему Лорд-капитан не назначил{mf||а} булыжника маршалом? Он самый упертый и непробиваемый законник в секторе — какие еще качества нужны-то?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Никак не пойму, почему Лорд-капитан не назначил булыжника маршалом? Он самый упертый и непробиваемый законник в секторе — какие еще качества нужны-то?
- guid: 867a42ce-4a44-427f-88c6-9551458f8dfd
  event: BNTRS_DLC2_Idira_120
  text: '"Это ж у булыжника был шанс стать первым арбитром сектора, который закончил свои дни в тюрьме! Такая байка пропала".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это ж у булыжника был шанс стать первым арбитром сектора, который закончил свои дни в тюрьме! Такая байка пропала.
- guid: 5f75fc2d-f337-4219-a96e-8fa3303decae
  event: BNTRS_DLC2_Idira_134
  text: '"Ну ты и спросил! Да пока это сборище булыжников все бумажки подпишет, можно и от старости помереть. Вот дела, сместить прошлого маршала — дело одного дня, а как нового выбрать, так нет, регламент!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ну ты и спросил! Да пока это сборище булыжников все бумажки подпишет, можно и от старости помереть. Вот дела, сместить прошлого маршала — дело одного дня, а как нового выбрать, так нет, регламент!
- guid: 66ee6bc6-0f41-44c0-bfa7-f56b052409f9
  event: BNTRS_DLC2_Idira_142
  text: '"Ты хотела сказать, фанатиками, которые сначала стреляют, а потом задают вопросы?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ты хотела сказать, фанатиками, которые сначала стреляют, а потом задают вопросы?
- guid: 5e596320-47f9-4b20-bcef-2522c0bb9fac
  event: BNTRS_DLC2_Idira_154
  text: '"Голосочки аж надрываются, слушая, как ты уже переделываешь еще не захваченный корабль. Ох чую, не к добру они так радуются".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Голосочки аж надрываются, слушая, как ты уже переделываешь еще не захваченный корабль. Ох чую, не к добру они так радуются.
- guid: 0b4aacbb-27b6-4663-a939-6aca5e15c25e
  event: BNTRS_DLC2_Idira_162
  text: '"Даже не мечтай, старик, их интересует только десятина. Коронус может хоть вверх дном перевернуться — они ухом не поведут".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Даже не мечтай, старик, их интересует только десятина. Коронус может хоть вверх дном перевернуться — они ухом не поведут.
- guid: e17e1935-1c05-4c07-92a5-40e5adbff668
  event: BNTRS_DLC2_Idira_170
  text: '"У нашего булыжника голова взорвется — Вольный Торговец берет что-то из десятины! Куда судить, что делать?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: У нашего булыжника голова взорвется — Вольный Торговец берет что-то из десятины! Куда судить, что делать?
- guid: f0fe7a70-3610-4d65-8256-314a7ac679f4
  event: BNTRS_DLC2_Idira_176
  text: '"Свалкой? Нет, это почти комплимент. Это — складбище, и сюда приходит умирать десятина".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Свалкой? Нет, это почти комплимент. Это — складбище, и сюда приходит умирать десятина.
- guid: 6fea7a58-4808-4acb-905e-10509c7802db
  event: BNTRS_DLC2_Idira_187
  text: '"И это Лекс Империалис? Ожидала томик повнушительнее".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: И это Лекс Империалис? Ожидала томик повнушительнее.
- guid: 789ab825-1472-4f70-a616-61702667a30a
  event: BNTRS_DLC2_Idira_198
  text: '"Хм, если Администратум хребет Империума, то какая его часть Арбитес? Его загребущие руки?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Хм, если Администратум хребет Империума, то какая его часть Арбитес? Его загребущие руки?
- guid: 694c76e4-41f6-4ac5-b517-7a45a8337b39
  event: BNTRS_DLC2_Idira_210
  text: '"Вот ты заладил: механизмы, механизмы... А своих братьев тебе не жалко? Или в них шестеренок недостаточно?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Вот ты заладил: механизмы, механизмы... А своих братьев тебе не жалко? Или в них шестеренок недостаточно?'
- guid: bc6047d8-fdca-40a1-97a2-13a9bc3104b9
  event: BNTRS_DLC2_Idira_252
  text: '"Я тоже рада тебя видеть, булыжник! Но твоего пса рада видеть больше".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я тоже рада тебя видеть, булыжник! Но твоего пса рада видеть больше.
- guid: 5ef04890-df66-4527-ace2-dacbb236e9a3
  event: BNTRS_DLC2_Idira_28
  text: '"Постой, у тебя что, личность есть? Смотрите-ка, наш булыжник не только выдержками из Лекса общается!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Постой, у тебя что, личность есть? Смотрите-ка, наш булыжник не только выдержками из Лекса общается!
- guid: 8a8a2d3a-f282-4199-b3af-f694280c31f7
  event: BNTRS_DLC2_Idira_293
  text: '"Ты глянь: измываются над ним как могут. А я думала, что это булыжник у нас бессердечный".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Ты глянь: измываются над ним как могут. А я думала, что это булыжник у нас бессердечный.'
- guid: 41b62cc7-73ac-4772-a943-11e16f8413c3
  event: BNTRS_DLC2_Idira_306
  text: '"Ого, ты продержался целых пять минут без историй о хрусте костей под пятой закона! Как ты только вытерпел?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ого, ты продержался целых пять минут без историй о хрусте костей под пятой закона! Как ты только вытерпел?
- guid: e24127f8-c1b2-49c7-b864-09f4c9a8df13
  event: BNTRS_DLC2_Idira_338
  text: '"В бездну правосудие. Я выверну тварь наизнанку раньше, чем ты начнешь нудеть про свои законы".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: В бездну правосудие. Я выверну тварь наизнанку раньше, чем ты начнешь нудеть про свои законы.
- guid: 82826df4-5e92-472f-a7f7-90e25d7ca9be
  event: BNTRS_DLC2_Idira_342
  text: '"Ладно тебе, булыжник. Комморре тебя не сломить! А насчет ненависти — так ты всегда все живое ненавидел, разве нет?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ладно тебе, булыжник. Комморре тебя не сломить! А насчет ненависти — так ты всегда все живое ненавидел, разве нет?
- guid: e38f7ce6-64b4-4fb7-b798-139c44f8b148
  event: BNTRS_DLC2_Idira_343
  text: '"Мне вот интересно, булыжник, а как твой Лекс смотрит на ситуацию с Лорд-капитаном? Что, силенок не хватит судить Вольного Торговца?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Мне вот интересно, булыжник, а как твой Лекс смотрит на ситуацию с Лорд-капитаном? Что, силенок не хватит судить Вольного Торговца?
- guid: 755ca141-30ea-4501-aac2-445bdefbb697
  event: BNTRS_DLC2_Idira_358
  text: '"Спросили б меня раньше, что вероятнее: что я запишусь в монахини, или наш булыжник закрутит роман с Лорд-капитаном, я бы купила четки".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Спросили б меня раньше, что вероятнее: что я запишусь в монахини, или наш булыжник закрутит роман с Лорд-капитаном, я бы купила четки.'
- guid: d54fbccf-7455-4a7c-81b8-867dfbf43840
  event: BNTRS_DLC2_Idira_46
  text: '"Да, а перед этим много-много раз убить. И не обязательно тех, кто этого заслуживает".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да, а перед этим много-много раз убить. И не обязательно тех, кто этого заслуживает.
- guid: 4360d8f0-3477-456a-b5af-0dd507a6d25b
  event: BNTRS_DLC2_Idira_59
  text: '"И как бы выглядели молитвы? "Да не нарушим мы сроки отправки десятины, да незыблем будет ранг Солюцио-как-там-его..." Хотя что это я — ты же, наверное, и правда так молишься".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: И как бы выглядели молитвы? "Да не нарушим мы сроки отправки десятины, да незыблем будет ранг Солюцио-как-там-его..." Хотя что это я — ты же, наверное, и правда так молишься.
- guid: 9a2e230d-1a76-4947-b313-1e9c2af0fb77
  event: BNTRS_DLC2_Idira_67
  text: '"По-моему, авантюра была как раз в духе Лорд-капитана. У меня, правда, башка чуть не лопнула — так шепотки смехом заходились, что целый корабль сгинет в Имматериуме, но кто будет справляться о здоровье ведьмы, верно?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: По-моему, авантюра была как раз в духе Лорд-капитана. У меня, правда, башка чуть не лопнула — так шепотки смехом заходились, что целый корабль сгинет в Имматериуме, но кто будет справляться о здоровье ведьмы, верно?
- guid: 443b275e-e2b4-42aa-9716-0cc4610218c1
  event: BNTRS_DLC2_Idira_82
  text: '"Я думала, ты наоборот будешь только за. Самая продвинутая шестеренка на целом мире — сколько внимания, сколько обожания!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я думала, ты наоборот будешь только за. Самая продвинутая шестеренка на целом мире — сколько внимания, сколько обожания!
- guid: f97f0b6c-16b6-4c20-a76e-105ad43a0150
  event: BNTRS_DLC2_Idira_88
  text: '"Ох, дед, это ж Леди Теодора. Она такими делами ворочала — масштабов не нашего ума. Планету в расход пустить — это так, мелочевка по ее меркам".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ох, дед, это ж Леди Теодора. Она такими делами ворочала — масштабов не нашего ума. Планету в расход пустить — это так, мелочевка по ее меркам.
- guid: a67d6f7f-b1c0-4028-867c-adc99c2564c2
  event: BNTRS_DLC3_Idira_06
  text: '"Не дрейфь, Джай. Голосочки мне недавно намекнули: если не уничтожим гадину, застрянем в этой дыре надолго. А с развлечениями здесь негусто, сама видишь..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'Не дрейфь, Джай. Голосочки мне недавно намекнули: если не уничтожим гадину, застрянем в этой дыре надолго. А с развлечениями здесь негусто, сама видишь...'
- guid: 76755084-2a73-4835-a7d9-7fdf25c922d4
  event: BNTRS_DLC3_Idira_104
  text: '"Да тут никому не нравится, не только твоей собаке. Холодно, промозгло... Не помешало бы смазать свои протоколы стаканом амасека".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да тут никому не нравится, не только твоей собаке. Холодно, промозгло... Не помешало бы смазать свои протоколы стаканом амасека.
- guid: 40702a84-cad1-4bd8-badb-a7b5934e7fdf
  event: BNTRS_DLC3_Idira_112
  text: '"Доверься нашему Лорд-капитану, Абеляр. Это вполне в духе того наследства, которое оставила Теодора, а она всегда знала, что делала. Почти всегда..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Доверься нашему Лорд-капитану, Абеляр. Это вполне в духе того наследства, которое оставила Теодора, а она всегда знала, что делала. Почти всегда...
- guid: 39b2bd76-1a01-444d-892f-0be9daae8a95
  event: BNTRS_DLC3_Idira_12
  text: '"Как ловко эта тварь пытается обогнать время, поглядите-ка. Нутром чую, это его родственничек встретился нам в руинах. Ну, от своей судьбы он все равно не убежит, хоть и резвый".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Как ловко эта тварь пытается обогнать время, поглядите-ка. Нутром чую, это его родственничек встретился нам в руинах. Ну, от своей судьбы он все равно не убежит, хоть и резвый.
- guid: 477554aa-6ebb-48c5-b26e-fd53fea418c1
  event: BNTRS_DLC3_Idira_121
  text: '"Обычно я люблю легенды, но на моем веку все они почему-то все время заканчиваются мрачно. Будет глупо надеяться, что здесь нас ждет что-то иное".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Обычно я люблю легенды, но на моем веку все они почему-то все время заканчиваются мрачно. Будет глупо надеяться, что здесь нас ждет что-то иное.
- guid: f40e7586-ea9f-42e2-8cec-75c5ba314df6
  event: BNTRS_DLC3_Idira_16
  text: '"Легче, старик, легче. Это не настоящий дворец, а игрушечный домик, который кто-то очень старался вылепить из иллюзий и надувательства. Но вот внутри него точно есть кто-то живой, нутром чую".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Легче, старик, легче. Это не настоящий дворец, а игрушечный домик, который кто-то очень старался вылепить из иллюзий и надувательства. Но вот внутри него точно есть кто-то живой, нутром чую.
- guid: 648be451-002d-4e37-b87a-c1dd210a4b36
  event: BNTRS_DLC3_Idira_34
  text: '"Шепотки... они кричат. От ярости и негодования. Словно на войну собрались. Но... им страшно. Говорят мы идем туда, где умирает сама смерть".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Шепотки... они кричат. От ярости и негодования. Словно на войну собрались. Но... им страшно. Говорят мы идем туда, где умирает сама смерть.
- guid: a4d03888-427e-471b-b977-d7d2452026a6
  event: BNTRS_DLC3_Idira_43
  text: '"Ни живы, ни мертвы, все так, только вот с чего ты возомнила, что надо их обязательно добивать, а, черепушка?"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ни живы, ни мертвы, все так, только вот с чего ты возомнила, что надо их обязательно добивать, а, черепушка?
- guid: b963378d-5473-4118-8523-9e07a3567468
  event: BNTRS_DLC3_Idira_53
  text: '"Я не понимаю, ничего не понимаю. Голоса... голоса враз взвыли и умолкли. Молчат. Пусто здесь, мертво..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я не понимаю, ничего не понимаю. Голоса... голоса враз взвыли и умолкли. Молчат. Пусто здесь, мертво...
- guid: 9c572dac-13a3-4ebb-85e8-845c20932b2b
  event: BNTRS_DLC3_Idira_63
  text: '"Не думаю, что проблема в нехватке обычных техножрецов. Эти когитаторы находятся тут дольше, чем я живу, и до сих пор никто не разобрался, что именно так глубоко их тревожит".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Не думаю, что проблема в нехватке обычных техножрецов. Эти когитаторы находятся тут дольше, чем я живу, и до сих пор никто не разобрался, что именно так глубоко их тревожит.
- guid: c2a390ea-70ed-4e79-bcaa-204495a3a5c1
  event: BNTRS_DLC3_Idira_77
  text: '"Да-а, казалось бы, латают тут живых, да только атмосферка — для шестеренок одних! Надеюсь, они выпускают вылеченных быстрее, чем они сваливаются от новых болезней, надышавшись этой дрянью".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Да-а, казалось бы, латают тут живых, да только атмосферка — для шестеренок одних! Надеюсь, они выпускают вылеченных быстрее, чем они сваливаются от новых болезней, надышавшись этой дрянью.
- guid: 87c11224-68d7-435d-8309-bb95506a7fe4
  event: BNTRS_DLC3_Idira_81
  text: '"Не обижайся, Кас, но это привычный для нас, рядовых слуг династии, запах и атмосфера. Тебе бы уже пора привыкнуть, если хочешь жить в реальности..."'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Не обижайся, Кас, но это привычный для нас, рядовых слуг династии, запах и атмосфера. Тебе бы уже пора привыкнуть, если хочешь жить в реальности...
- guid: c9624e66-1abf-4d09-99cb-a547d5c79ae9
  event: BNTRS_DLC3_Idira_92
  text: '"Ого! Все машины теперь включены? Странным образом это место стало выглядеть еще жутче, чем раньше!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ого! Все машины теперь включены? Странным образом это место стало выглядеть еще жутче, чем раньше!
