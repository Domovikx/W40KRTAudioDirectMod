name: Джаэ Хейдари
gender: F
role: Агент Касабаллики
age: ''
personality: хитрая, игривая, скользкая
sound_keys:
- Jae
total_phrases: 248
phrases:
- guid: 1727f93a-be2b-4286-a6c4-e3e4e54d3908
  event: BNTRS_AreaPeaceful_Jae_13
  text: '"Надеюсь, мы найдем время для дегустации местных напитков. Я слышала самые восторженные рассказы о винокурнях Януса!"'
  speaker: null
- guid: b646169f-b963-4fc4-ad4c-9508211f0d1a
  event: BNTRS_AreaStressful_Jae_1
  text: '"Знаете, о чем мои думы? О том, как уютно в родной каюте с обогревом. С чем-то горячим в бокале. И под чьим-то теплым
    боком..."'
  speaker: null
- guid: 53a4100d-3e8c-4a60-8a0e-d37e6a2cec59
  event: BNTRS_AreaStressful_Jae_111
  text: '"Они тебе не кильки в банке, а живые люди, бездушная ты шестеренка!"'
  speaker: null
- guid: 3205fa10-f014-4922-a27d-4d78f98ba1b2
  event: BNTRS_AreaStressful_Jae_126
  text: '"Империум до смешного неоригинален на методы воспитания. Исправительные работы в шахтах? Такие места не щадят ни
    взрослых, ни детей".'
  speaker: null
- guid: 5ddd3a3d-f2fd-4bd1-95b6-3a223033857d
  event: BNTRS_AreaStressful_Jae_136
  text: '"А как же прозорливые мародеры, копающиеся в нутре этого мертвого колосса пустоты? Поболтайте с ними — мудрость кроется
    в неожиданных местах, шерин".'
  speaker: null
- guid: 3cc1d924-6d7c-4c4a-b08d-75a1cc033321
  event: BNTRS_AreaStressful_Jae_163
  text: '"Жестянка ты бездушная, почему твоя первая реакция на что угодно — обвинять всех в некомпетентности? Больная тема,
    м?"'
  speaker: null
- guid: b1d5458c-6401-4f46-942f-69556af6436f
  event: BNTRS_AreaStressful_Jae_173
  text: '"О, я бы не сказала, что ОЧЕНЬ надежное. Мои бравые ребята такие на раз-два вскрывают, и... знаете, что обычно внутри?
    Мертвецы".'
  speaker: null
- guid: 907c8bd0-6662-4839-aeb4-c95345997988
  event: BNTRS_AreaStressful_Jae_27
  text: '"Знаю я нескольких особ, готовых выложить немало тронов за груду этого мертвого металлолома... И еще парочку сговорчивых
    Эксплораторов".'
  speaker: null
- guid: 3403d6d1-8044-4d5d-8894-2827c151102b
  event: BNTRS_AreaStressful_Jae_38
  text: '"Дай вам, шестеренкам, волю, уже бы все кабаки перестроили в цеха и всю станцию переделали в сервиторов!"'
  speaker: null
- guid: cfbedcc0-1284-49cc-b772-283c46a37293
  event: BNTRS_AreaStressful_Jae_53
  text: '"Идем в гости к Владайму? Ах как он обрадуется, увидев старую подругу!"'
  speaker: null
- guid: 7ddb3fb9-8d8e-4dde-a5b2-c2324dad13c6
  event: BNTRS_AreaStressful_Jae_67
  text: '"После того, что произошло на входе в систему, мой разум дурманят сомнения в том, что этот "священный цех" встретит
    нас миррой и ладаном..."'
  speaker: null
- guid: 5dd43159-cc06-4801-8dc3-c84bf0a4b95a
  event: BNTRS_AreaStressful_Jae_9
  text: '"Ржавые мостки над пыльными траншеями... Невероятно, умопомрачительно интересно. Напомните, зачем мы сюда притащились?"'
  speaker: null
- guid: b0590198-5ea7-4c52-8a54-133e7174bca8
  event: BNTRS_AreaStressful_Jae_95
  text: '"Полагаю, потому, что местные джунгли самую малость враждебны к гостям. Кстати о гостях... Лорд-капитан, не думали
    вы в своей безбрежной мудрости сделать тут курорт для богатеев?"'
  speaker: null
- guid: 7ab9986b-5954-469e-bebb-5104fab5476e
  event: BNTRS_AreaStressful_Jae_99
  text: '"От столь безвкусного богатства несложно тронуться умом. Только взгляни: эти ашмаги пустили дорогущую кавосскую древесину
    на отделку!"'
  speaker: null
- guid: 16efc384-abbb-4b0a-9e9d-a12cdc2c0eaa
  event: BNTRS_Chapter2_Jae_08
  text: '"Однажды я угодила в подобную ловушку — конкуренты заманили меня на сигнал от погибшей команды... Кассхи! Никчемные
    пираты жестоко поплатились за то, что натворили с моими ребятками".'
  speaker: null
- guid: 5fcc91e6-55b8-43d9-86a8-2d261f2e91cd
  event: BNTRS_Chapter2_Jae_109
  text: '"Слава о деяниях Леди Теодоры разошлась по Простору, воистину так. Только не думаю, что служить под столь амбициозной
    величиной — дело приятное..."'
  speaker: null
- guid: 43ddb8dd-d846-477f-95c0-e11d91949e61
  event: BNTRS_Chapter2_Jae_114
  text: '"Я все понимаю, шерин, и все же... горюю об Идире. Мне нравилась ее компания, да сохранит Великий грешную душу этой
    болтливой кассхи".'
  speaker: null
- guid: 30bc44ba-6f9d-4a72-9c1c-71e1df03636b
  event: BNTRS_Chapter2_Jae_120
  text: '"Разве брать то, что никому не принадлежит, воровство? В нашем с тобой деле, шестеренка, прав тот, кто оказался проворнее".'
  speaker: null
- guid: b06777e3-4dcd-4a23-8a62-aa5527033831
  event: BNTRS_Chapter2_Jae_124
  text: '"Кто мог подумать, что смиренная Джай Хейдари станет частью свиты Вольного Торговца? Великий поистине щедр ко мне!"'
  speaker: null
- guid: 481044b3-0371-4194-bc94-12c6b73a0ab8
  event: BNTRS_Chapter2_Jae_127
  text: '"Раньше я думала, что больше всего меня пугают орки... Наивная! Очереди в Администратуме гораздо, гораздо страшнее".'
  speaker: null
- guid: ddf29d91-8623-41c5-b7c4-03a21864f63d
  event: BNTRS_Chapter2_Jae_133
  text: '"И вновь щедрость шерин к Джай Хейдари не знает границ! С Меркатум Табула Официале я стану для вас полезнее, и да
    хранит Великий ваш род!"'
  speaker: null
- guid: 4c78c057-c607-47bd-ae47-5f908dfe7a2d
  event: BNTRS_Chapter2_Jae_143
  text: '"Интересное наблюдение. Кто подсказал — разум или шепотки? В любом случае, не придавай этому значения: шестеренки
    слишком хорошо хранят свои секреты".'
  speaker: null
- guid: 0985daa6-e150-418b-976b-547de38adad5
  event: BNTRS_Chapter2_Jae_19
  text: '"Мне показалось, или в голосе твоем сквозит уважение к родственничкам? Осторожнее, остроухая, шерин не придется по
    вкусу эта симпатия, если она там есть".'
  speaker: null
- guid: 03897747-366f-484d-b0fa-60722cb94e78
  event: BNTRS_Chapter2_Jae_22
  text: '"Когда беда ступает на порог, каждый делец думает лишь о своем добре. А губернатор — именно что делец, пускай и рядящийся
    в одежды слуги Империума".'
  speaker: null
- guid: e73f2378-756e-4a87-97c8-9fed863d45c6
  event: BNTRS_Chapter2_Jae_25
  text: '"Мало того, что он выжил — он сумел сплотить вокруг себя людей и дать отпор тем, чья душа пала Архиврагу! Воистину,
    навигатор выдающихся талантов!"'
  speaker: null
- guid: 51e4c1aa-cffd-4548-b208-897be081df9e
  event: BNTRS_Chapter2_Jae_36
  text: '"Приятно видеть, что жители Футфола вновь обретают опору под ногами. На станции много простых людей, которые отныне
    могут не бояться умереть от голода".'
  speaker: null
- guid: 9b1151c4-0528-4cef-b19a-e7f91bc74b94
  event: BNTRS_Chapter2_Jae_41
  text: '"Шерин разозлил{mf||а} сразу двух влиятельных господ... И оба — Вольные Торговцы. Впечатляющая эффективность!"'
  speaker: null
- guid: 8b4742f0-d8da-4ee1-9ef4-c36718ec0bff
  event: BNTRS_Chapter2_Jae_50
  text: '"Ах, Янус... Из всех мест, где мне доводилось ступать, лишь этот мир не пытался убить меня при каждом удобном случае.
    Задержаться бы на нем подольше".'
  speaker: null
- guid: 8bb03f79-2f79-444c-bc18-eae4fb3dd756
  event: BNTRS_Chapter2_Jae_80
  text: '"Ты видела... священный Патент? О, вот бы взглянуть и мне хоть одним глазком! Но шерин наверняка откажется водить
    к нему экскурсии для всех желающих..."'
  speaker: null
- guid: ad776899-9a20-4a85-8b66-141a1fce78de
  event: BNTRS_Chapter2_Jae_92
  text: '"Не только проблемами в будущем, но и жертвами в настоящем — как Лорд-капитан, увы, уже имел{mf||а} неудовольствие
    убедиться лично".'
  speaker: null
- guid: b8c5ddd9-d80d-444a-b93c-038f60eadcd1
  event: BNTRS_Chapter2_Jae_95
  text: '"Надо же, как ты избирателен, старик! Когда ажи заводят тебя на охваченный Архиврагом мир, стоит быть признательным
    любой помощи — не только "глубокоуважаемых" господ".'
  speaker: null
- guid: 7b88768a-c96f-4c86-b304-23d06bcfad35
  event: BNTRS_Chapter3_Jae_06
  text: '"Ты в порядке, старик? С кем это ты сейчас говорил?.. Эй, почему отводишь взгляд!"'
  speaker: null
- guid: 4489503b-fa87-4e1e-ae7d-f0fb1d6b8ac5
  event: BNTRS_Chapter3_Jae_107
  text: '"У всего, к чему вы, друкари, прикасаетесь, возникает дерьмовый привкус. Даже у побед".'
  speaker: null
- guid: 1fd367e7-792e-4f3e-84e3-e4a3266516ae
  event: BNTRS_Chapter3_Jae_113
  text: '"Сложно расписываться в своем незнании, но я впервые видела такого эльдара. Не уверена, что хочу знать о нем больше
    — небезопасная это затея, нутром чую".'
  speaker: null
- guid: ec6e560a-62f0-47f0-8773-d8853c995df2
  event: BNTRS_Chapter3_Jae_133
  text: '"Да уж, Абеляр. Если бы в твою смену прикончили второго Вольного Торговца подряд, кто-то мог бы и усомниться в твоей
    компетенции, а?"'
  speaker: null
- guid: 80977c5b-5b98-44e5-8376-c5da4776f22d
  event: BNTRS_Chapter3_Jae_135
  text: '"Да уж, Абеляр. Если бы в твою смену прикончили второго Вольного Торговца подряд, кто-то мог бы и усомниться в твоей
    компетенции, а?"'
  speaker: null
- guid: 6a2dba63-0bf9-4d1d-9ec9-5c4757e67da1
  event: BNTRS_Chapter3_Jae_16
  text: '"Постичь планы и разум ксеноса по-настоящему — значит сойти с ума и позабыть Великого. Случись подобное, спорю, ты
    бы первый пристрелил своего подопечного".'
  speaker: null
- guid: 4e8f3fe6-467e-47dc-9e53-64ad47964fe6
  event: BNTRS_Chapter3_Jae_23
  text: '"По крайней мере, мы выбрались с арены не в виде фарша. Исход... лучший, на который можно вообще было рассчитывать".'
  speaker: null
- guid: 7fd4ae63-83bc-4161-b65d-7cc521dc439a
  event: BNTRS_Chapter3_Jae_34
  text: '"Ты продырявила славную женщину, что спасла тебя, увидев странную штуковину в ее руках. А я по призванию держу при
    себе странные штуковины. Давай в следующий раз ты немного поразмыслишь, прежде чем палить?"'
  speaker: null
- guid: 615b8b73-7963-412e-ac14-12925f3e606a
  event: BNTRS_Chapter3_Jae_49
  text: '"Честнее? Хех. Пожалуй. Глупо прятаться за маской, когда тебе вот-вот откусят голову целиком. Удивлена, что ты не
    раскусила меня раньше".'
  speaker: null
- guid: 68c8d596-4549-4688-a048-c1369a184a9b
  event: BNTRS_Chapter3_Jae_50
  text: '"Че тебя так крючит на каждом шагу? Разве ты не исцелил себя?"'
  speaker: null
- guid: 41eb2504-b123-4437-8551-886dc806256f
  event: BNTRS_Chapter3_Jae_64
  text: '"Хех. Ничего, справимся. Выберемся. Еще гульнем на средней палубе... Что скажешь, Идира?"'
  speaker: null
- guid: 78dc3fff-ee57-41b0-a6a9-23f4aad56599
  event: BNTRS_Chapter3_Jae_66
  text: '"Мне вот любопытно, шерин Касс... А может твой дар помочь нам найти дорогу отсюда?"'
  speaker: null
- guid: 9f9df940-c596-4100-ae79-52905792bef2
  event: BNTRS_Chapter3_Jae_69
  text: '"На сей раз я выжила лишь потому, что мое горло приглянулось одному местному уроду. Настолько, что он вернул мне
    его... со всем, от чего я когда-то еле избавилась".'
  speaker: null
- guid: 92fa6f50-10f9-4912-861d-f1a5343c2f20
  event: BNTRS_Chapter3_Jae_71
  text: '"Сочту за комплимент, господин Версериан. Без подобного таланта от меня было бы мало проку, не находите?"'
  speaker: null
- guid: 664e1247-05ba-4222-bd92-6c9a89c1bb2a
  event: BNTRS_Chapter3_Jae_73
  text: '"Иди в жопу, Паскаль. Я тоже рада, что ты не окочурился".'
  speaker: null
- guid: a57cd41a-473d-404d-9f87-d969a5f67cac
  event: BNTRS_Chapter3_Jae_79
  text: '"Я видела его после того, как Лорд-капитан удалил{mf|ся|ась} в свои покои. Бедняга держался за голову и явно был
    немного не в себе. А вот почему... это мне уже неведомо".'
  speaker: null
- guid: ae64effa-af0e-44cb-96ae-883b5bdf2df0
  event: BNTRS_Chapter3_Jae_82
  text: '"Воистину так, сестра! Однако не буду лгать, что перины и амасек в гостях у шерин весьма пришлись мне по вкусу".'
  speaker: null
- guid: 06a616d6-c03a-447c-87e0-4c71351f9dbe
  event: BNTRS_Chapter3_Jae_85
  text: '"Не только ты, шестеренка. В пору назначать праздник в честь смерти языкастого ублюдка! Удивительно поганый был тип
    даже для ксеноса".'
  speaker: null
- guid: 29165bee-3a7d-422e-8b6a-85bb0f50761c
  event: BNTRS_Chapter3_Jae_97
  text: '"Слушай, жестянка, твое тело... оно... А, Трон побери, никто не заслуживает подобной участи!"'
  speaker: null
- guid: c500bb57-a19f-4901-967d-6a495fec84f5
  event: BNTRS_Chapter4_Jae_05
  text: '"Эх, если бы они затаились по углам и научились хоть как-то выживать... Глядишь, появился бы и с ними хладный торг".'
  speaker: null
- guid: 78ed2b34-7342-4a21-a2ac-47bac85611dc
  event: BNTRS_Chapter4_Jae_104
  text: '"Интересно, как много ценностей было внутри того кораб... Шерин Арджента, прошу, не смотри на меня так! Это шутка!
    Просто шутка бедной безголовой Джай!"'
  speaker: null
- guid: a495cb4f-5416-42e0-995b-a1fe8025afcf
  event: BNTRS_Chapter4_Jae_107
  text: '"Чтобы знать, к чему ты идешь, нужно сначала раскрыть, откуда тянутся твои корни — так говорят мудрецы Ифрита. Надеюсь,
    найденные ответы помогут тебе, шерин".'
  speaker: null
- guid: 15e5e704-fdea-4a40-885f-21ebaa645ef7
  event: BNTRS_Chapter4_Jae_117
  text: '"Иногда я забываю, что вы агент Инквизиции. А потом слышу, что вы относитесь к своей старой коллеге как к функции...
    и все встает на свои места".'
  speaker: null
- guid: 7ec3ef03-c8d9-471d-9ec9-001c39352b85
  event: BNTRS_Chapter4_Jae_136
  text: '"Этой "Сай''лантреш" прямо неймется заграбастать каждого из вашего рода... Что вы ей сделали, а, ксенос?"'
  speaker: null
- guid: 69070d18-35c1-409c-a8db-3c7f7227bb88
  event: BNTRS_Chapter4_Jae_139
  text: '"Ха, даже не пытайтесь, шерин ван Калокс. Шестеренка голову теряет от одного вида новой игрушки. Все заветы и правила
    Омниссии выходят в шлюз вместе с обычной предусмотрительностью".'
  speaker: null
- guid: 6514e677-a691-408f-8a1b-f793e9378aed
  event: BNTRS_Chapter4_Jae_147
  text: '"Самое забавное, что шестеренка уже второй раз совершает схизму. А мерзкая нарушительница воли Омниссии — все равно
    я".'
  speaker: null
- guid: 5136124f-8fcf-437a-a6fe-ee2929749c70
  event: BNTRS_Chapter4_Jae_156
  text: '"Ах, многоуважаемый Ульфар, ваш бы задор — да в наши края, в старый добрый Амасекус... Впрочем, в отличие от ваших
    братьев, завсегдатаи с Футфола такое веселье бы не пережили".'
  speaker: null
- guid: 95b7abfe-3149-4930-8d76-5be30a292aba
  event: BNTRS_Chapter4_Jae_17
  text: '"По крайней мере мир вернулся во владения Империума. Было бы только хуже оставлять его еретикам, не находишь?"'
  speaker: null
- guid: 783ba45d-229b-4a90-a3e5-b91e37ae7159
  event: BNTRS_Chapter4_Jae_173
  text: '"Родичи Ирлиэт нажили слишком много врагов, чтобы рассчитывать на чье-то милосердие. Видит Великий, в искусстве находить
    себе недругов твой род весьма преуспел!"'
  speaker: null
- guid: 975fafac-421b-416c-9963-364e4849e0b2
  event: BNTRS_Chapter4_Jae_19
  text: '"До сих пор не верю, что мы спаслись! В Темном городе я часто молилась Великому, и теперь нужна куча тронов, чтобы
    исполнить обещанное Ему. Но я не жалею!"'
  speaker: null
- guid: f95e1618-2b9c-4084-843e-5bce59bb0d42
  event: BNTRS_Chapter4_Jae_28
  text: '"Владайм больше не Наместник Футфола... Не то чтобы мне жаль старого проныру, но все же он умел держать станцию под
    контролем. Справится ли его смена со столь норовистым хозяйством?"'
  speaker: null
- guid: 50de7d7c-f1ff-4dd5-8634-0fcedd6e296b
  event: BNTRS_Chapter4_Jae_31
  text: '"Бедный Футфол... Что бы себе ни думала Чорда, то, что она устроила, не может быть угодно Великому!"'
  speaker: null
- guid: 6bc2c523-2a70-4bb2-9309-0df0d7c8a761
  event: BNTRS_Chapter4_Jae_47
  text: '"Хитро. Сливаете информацию, чтобы я рассказала об этом всему Футфолу, и мои коллеги и конкуренты поджали хвосты?
    Что ж... не буду противиться вашему плану!"'
  speaker: null
- guid: 7dd040da-ba9b-40b4-a3c3-3ea6b40fd000
  event: BNTRS_Chapter4_Jae_54
  text: '"И что, даже не наложишь вето? Не объявишь все собственностью братии и не приберешь к рукам? Впрочем, могу понять:
    разбираться в дерьме, что творил гемункул, даже мне не хочется".'
  speaker: null
- guid: d1db2abd-b5ab-4a8a-8ff2-aa1a26e01e10
  event: BNTRS_Chapter4_Jae_62
  text: '"Может, и делаем. Но какая разница? Ты ведь хочешь жить своим умом, а не как прикажут, верно? Право ошибаться тоже
    надо отстаивать".'
  speaker: null
- guid: 1b3f7d5a-c7ba-4f57-932d-6a0beb963503
  event: BNTRS_Chapter4_Jae_63
  text: '"Могу только представить, что происходит в Темном городе после того, как Лорд-капитан уничтожил{mf||а} последний
    замок, удерживающий силы варпа от вторжения".'
  speaker: null
- guid: ee674daa-3fe7-42b2-9e94-61d7a01c503b
  event: BNTRS_Chapter4_Jae_71
  text: '"Некому теперь будет наводить шорох в Амасекусе... Впрочем, Окти этому только порадуется — после гулянок Каллигоса
    оставались одни трупы да пустые бочонки с пойлом!"'
  speaker: null
- guid: ad2d5ba7-db20-4053-9a88-c2f4401e3355
  event: BNTRS_Chapter4_Jae_80
  text: '"Ха! Только Ангел Императора может так говорить о Лорд-инквизиторе! Нам же, малым людям, остается помалкивать, дабы
    не проститься с головой..."'
  speaker: null
- guid: b926271b-9b7f-4eca-a4a9-dea05022d6da
  event: BNTRS_Chapter4_Jae_94
  text: '"Распри "уважаемых" господ отличаются от теневых разборок лишь пышными нарядами. Захочешь по-тихому убрать мерзавца
    — только кликни, старик".'
  speaker: null
- guid: 2d8ae133-6747-4aae-bfd4-19c23d1e883b
  event: BNTRS_Chapter5_Jae_03
  text: '"Если открыть шлюз и выпустить его наружу, он, кажется, помчится к этим мирам вприпрыжку на своих двоих... Давайте
    проверим?"'
  speaker: null
- guid: a07b4167-a3eb-4907-9dc7-ea0b51318260
  event: BNTRS_Chapter5_Jae_11
  text: '"Удивительно, как одна никчемная песчинка, вымытая потоком, обрушила гору. И-и.. после этого твоего взгляда многомудрой
    Джай, пожалуй, стоит умолкнуть".'
  speaker: null
- guid: c7d4a250-a0ea-464b-84d5-d2e9e8c83d1a
  event: BNTRS_Companion_DLC3_Jae_103
  text: '"Эоганн, теперь, когда увидел меня настоящую, поди больше не пожелаешь вести со мной заумные беседы?"'
  speaker: null
- guid: 597ff071-84e1-4481-8aab-41679c417c4f
  event: BNTRS_Companion_DLC3_Jae_33
  text: '"Мудрейший, я тут заполучила в свое распоряжение парочку артефактов, которые могли бы вас заинтересовать. Из большого
    уважения и симпатии, я готова буду пожертвовать их вам за весьма разумную цену!"'
  speaker: null
- guid: ef4094e2-c537-491e-bd26-3461e2c1a311
  event: BNTRS_Companion_DLC3_Jae_56
  text: '"Ох, мудрейший, о большем я бы не смела просить! Передайте мою бесконечную признательность своему спутнику. Мне не
    терпится услышать истории об этих вещицах, особенно о том, где вы их раздобыли и какую ценность они представляют".'
  speaker: null
- guid: 1f4cd064-cf74-4d99-b45e-12616be90b3d
  event: BNTRS_Companion_DLC3_Jae_69
  text: '"Мудрейший, как ты сохраняешь рассудок после зверств этого ксеносского ашмага? Я думала мне худо пришлось, но тебя
    же он разделал на части как грокса!"'
  speaker: null
- guid: 9c2a8c6b-dac7-4ce6-be74-6b1bd96f2f05
  event: BNTRS_Companion_DLC3_Jae_77
  text: '"Мудрейший, если когда-либо понадобится присмотреть за вашими чертогами, я с радостью подсоблю! Вы же не откажетесь
    провести мне экскурсию при случае?"'
  speaker: null
- guid: 7b696056-7894-483b-aeea-425aaa438850
  event: BNTRS_Companion_DLC3_Jae_81
  text: '"Да бросьте. Топить печаль в бутылке как раз эффективней некуда. Пара кружек чего покрепче и горести как рукой снимет!
    Во всяком случае, до утра".'
  speaker: null
- guid: d186dcc5-0ddd-4120-8a44-413329dba676
  event: BNTRS_Companion_DLC3_Jae_83
  text: '"Мудрейший, ваш слог так богат и внятен, не то, что у прочих адептов Омниссии! Не поведаете ли вы мне побольше об
    этой вашей эргономике... и прочих таинствах Механикус?"'
  speaker: null
- guid: 7bf05dda-69c4-4ab2-bde6-dff3f805ff3d
  event: BNTRS_Companion_DLC3_Jae_98
  text: '"Мудрейший, я не ослышалась, вы назвали меня чудом? Служитель Омниссии, желающий обменяться со мной знаниями — не
    меньшая редкость, чем золотая песчинка, затерявшаяся в барханах Ифрита! Что же, я приветствую любую возможность обогащения.
    Знаниями — в том числе".

    '
  speaker: null
- guid: 0fc3c617-3214-4a24-817c-c19050971a79
  event: BNTRS_DLC2_Jae_108
  text: '"Вот же старая кассха! Почти обвела нас вокруг пальца. Пусть Великий судит ее душу по всей строгости!"'
  speaker: null
- guid: fa32a1e3-307e-48ad-84ab-5641313ba852
  event: BNTRS_DLC2_Jae_11
  text: '"Мы оба знаем, что Хладный торг порицается законом, но что-то ты не грозишь мне карой, как остальные. Неужто мое
    обаяние оказалось сильнее протоколов?"'
  speaker: null
- guid: a7fab33e-e7d5-4c8d-a812-852d530ae9c6
  event: BNTRS_DLC2_Jae_125
  text: '"Техножрец питает к чему-то неметаллическому теплые чувства? Я скорее поверю, что наш проктор просто очень продвинутая
    модель боевого сервитора!"'
  speaker: null
- guid: fd4be31b-e150-42a6-804e-58f2185b62fe
  event: BNTRS_DLC2_Jae_143
  text: '"О Великий, ну почему ты послал мне законника с кодексом вместо сердца и глыбой вместо лица, а не еще одну прекрасную
    сестру? Я что, о многом прошу?"'
  speaker: null
- guid: 715d470f-1c7d-4d82-9c8e-0fe34d1a90e9
  event: BNTRS_DLC2_Jae_156
  text: '"Да простит меня Великий, но сегодня я радуюсь, что этот ашмаг на нашей стороне! Давайте пустим его первым и подождем
    немного?"'
  speaker: null
- guid: aba67fa1-e7f2-4f00-9896-e149a2ebf491
  event: BNTRS_DLC2_Jae_165
  text: '"О Великий, сколько же сокровищ таится в этом лабиринте? Есть только один способ узнать..."'
  speaker: null
- guid: edb3067d-40c0-4ee1-af28-f149209f1ce0
  event: BNTRS_DLC2_Jae_171
  text: '"Что такое, проктор? Присутствие Вольного Торговца все же позволяет сделать послабления в Лекс Империалис?"'
  speaker: null
- guid: 81a5114e-9c14-4712-a336-ae62895b9ef7
  event: BNTRS_DLC2_Jae_174
  text: '"Всецело разделяю твои страдания, Кас. Когда полная богатств планета повергает в уныние хладного торговца, поневоле
    задумываешься — не пора ли в отставку?"'
  speaker: null
- guid: d0439fbc-7a62-4cb3-8bb2-2bf692bb55ba
  event: BNTRS_DLC2_Jae_181
  text: '"Лишь для глупцов весы есть символ беспристрастного суждения. Мудрый же знает — ловкая рука легко качнет чашу в нужную
    сторону".'
  speaker: null
- guid: eb4dc591-5a33-48a5-b980-c033bd5ae4cb
  event: BNTRS_DLC2_Jae_189
  text: '"О Великий, проклятые ашмаги даже не дают этим людям объясниться!"'
  speaker: null
- guid: d010715f-4ffe-4910-8305-cdd267660db6
  event: BNTRS_DLC2_Jae_217
  text: '"И одним другом, бездушный ашмаг! Впрочем, не уверена, что тебе знакомо это слово".'
  speaker: null
- guid: 406459bc-2257-49f7-97e9-9a3654d68c22
  event: BNTRS_DLC2_Jae_247
  text: '"Ну что, законник, теперь ты знаешь, что я дезертир. Все еще хочешь учить меня жизни? Наставлять на правильный путь?"'
  speaker: null
- guid: 4a4fa096-d3f6-4194-a815-098f7cdbeaff
  event: BNTRS_DLC2_Jae_258
  text: '"Я догадывалась, что в этом мире тебя возбуждает только работа. Но называть слежку за преступниками "приятным занятием"...
    то еще извращение".'
  speaker: null
- guid: e3b679e6-a57f-4697-98fa-3ff901331ffb
  event: BNTRS_DLC2_Jae_263
  text: '"Ох, если бы воля Великого и правда... Стоп, я что, соглашаюсь с законником? Ты плохо на меня влияешь, проктор!"'
  speaker: null
- guid: 80a779d7-e3c6-4d66-abb9-e50db80d2d4d
  event: BNTRS_DLC2_Jae_282
  text: '"Пытаешься отвадить меня, законник? Не выйдет. Между холодом разума и жаром живого сердца выбор прост".'
  speaker: null
- guid: 6bc7c5fc-de6e-45b6-b7aa-fb206b1d25af
  event: BNTRS_DLC2_Jae_290
  text: '"Даже в самой сухой пустыне скрывается подземный родник. Даже в груди самого холодного человека бьется сердце".'
  speaker: null
- guid: 9cc0a11b-7258-4ca7-ad28-7051f637d738
  event: BNTRS_DLC2_Jae_30
  text: '"О, я знаю, к чему этот разговор! Сначала я соглашусь с правдоподобной лестью, а потом — раз! — и ты уже муштруешь
    меня, словно боевого пса".'
  speaker: null
- guid: d3b6d14c-8954-4185-b54a-bf889a3376d2
  event: BNTRS_DLC2_Jae_355
  text: '"Проктор-проктор... Такой суровый и неприступный на вид, а оказался не таким суровым и весьма приступным на деле!"'
  speaker: null
- guid: 622f9eec-bc9b-4741-be5b-3d4bc87cf4c2
  event: BNTRS_DLC2_Jae_62
  text: '"Куда интереснее, как теперь будут собирать и защищать десятину. Кажется, священная подать станет более легкой добычей...
    Для пиратов и врагов Империума, разумеется!"'
  speaker: null
- guid: e0dc0e83-7ffb-4dd2-aac0-3cb5e2380751
  event: BNTRS_DLC2_Jae_70
  text: '"Я готова взять на абордаж еще хоть сотню пиратских кораблей, лишь бы вновь порадовать тебя, о Сестра!"'
  speaker: null
- guid: 21ed26e7-7976-4202-b66f-24af15d86627
  event: BNTRS_DLC2_Jae_73
  text: '"Ставлю ящик амасека, ты себе все мехадендриты искусал от того, что не смог покопаться в этих пиратских поделках".'
  speaker: null
- guid: 43edda06-5056-4d21-a1fa-c590549c6e32
  event: BNTRS_DLC2_Jae_79
  text: '"Ох, Кас, надо было предупредить тебя, что мы прибудем в дыру. И дать глоток из моей фляги перед высадкой..."'
  speaker: null
- guid: 9adf721d-5a33-4929-a19d-ff5a417f0551
  event: BNTRS_DLC2_Jae_91
  text: '"Был на Летусе один парень, доперечислялся до сбоя в импланте. Некоторые глухи к урокам мудрости!"'
  speaker: null
- guid: 7cb3c37b-afa2-4521-aebf-dc37b4f4add5
  event: BNTRS_DLC3_Jae_04
  text: '"Шерин, вы знаете, я никогда не боялась драки. Но от мысли, что нам придется залезть в логово этой твари, мне не
    по себе... Возможно, его будет проще наградить метким залпом с орбиты?"'
  speaker: null
- guid: 4bf23e18-24a6-44fa-8073-dbcad21a910d
  event: BNTRS_DLC3_Jae_108
  text: '"Чужаки, не чужаки... как ты вообще умудряешься хоть что-то почуять за всей этой гарью? Я вижу только дрянное полузаброшенное
    местечко, в котором кто-то устроил изрядный беспорядок".'
  speaker: null
- guid: 74f8fd23-d883-410e-88a5-cfe890703424
  event: BNTRS_DLC3_Jae_123
  text: '"Шерин, мне, наверное, впервые в жизни придется согласиться с этой сумасшедшей. Местные жители — суровые и безжалостные
    люди, но, кажется, надежные сверх меры".'
  speaker: null
- guid: 59f956cd-fbea-45dc-901b-f17145b33c7e
  event: BNTRS_DLC3_Jae_129
  text: '"Мы едва ступили на поверхность планеты, а ты уже расписал, сколько они задолжали Империуму. Бессердечный ты ашмаг,
    подожди еще хотя бы лет пятьдесят!"'
  speaker: null
- guid: 721289fb-1abb-47ac-93fb-a7b84d48cac5
  event: BNTRS_DLC3_Jae_18
  text: '"О-о-о-о, что за сокровищница! Я думала, в прошлой комнате было много интересного, но здешнее великолепие не поддается
    вообще никакому описанию! Шерин, нужно срочно обследовать здесь каждый уголок".'
  speaker: null
- guid: 4ef3f82d-b795-4c19-826a-de20ab5916fb
  event: BNTRS_DLC3_Jae_26
  text: '"Только без меня. У этого так называемого транспорта даже сиденья выглядят так, словно они подпитываются болью сидящих
    в них. Предпочитаю сохранить все части своего тела в целости".'
  speaker: null
- guid: f58330d7-0c47-477c-bc83-0e426163ba70
  event: BNTRS_DLC3_Jae_49
  text: '"Почтенный генетор, может быть, обойдемся без нестандартного мышления? Неизвестно, как эта... штука вообще работает.
    Предпочту коллекционировать статуи в своей роскошной каюте, а не пополнить собой чью-то коллекцию".'
  speaker: null
- guid: 7c8ecdd8-507d-4d4f-a941-70cbcea792ff
  event: BNTRS_DLC3_Jae_57
  text: '"Говори за себя, хорошо? Мое чутье точно подсказывает мне, что за любой предмет на этих постаментах любой мало-мальски
    смыслящий в выгоде хладный торговец удавится".'
  speaker: null
- guid: a1a9e31e-ca3c-4d75-b51c-07090a0b7ad8
  event: BNTRS_DLC3_Jae_67
  text: '"Золото и кровь... Обычно роскошь не вызывает у меня столь смешанные эмоции".'
  speaker: null
- guid: 5df3e5a6-a217-4023-bb5d-6ea5e29c2e37
  event: BNTRS_DLC3_Jae_76
  text: '"Ох, все эти машинные запахи... с тех пор как Сектор заработал в полную силу, тут теперь не продохнуть от этой вони.
    Еще и духота... кое-кто понежнее может и упасть без чувств!"'
  speaker: null
- guid: 877c5c93-7f27-49a6-9937-fb60ff7ed2fd
  event: BNTRS_DLC3_Jae_93
  text: '"Брось! Здесь стало светлее и чище, меньше крови. Все познается в сравнении — видела бы ты, где лечат жителей Футфолла".'
  speaker: null
- guid: 2e2c4fed-67fe-49fd-aab7-3a883ed823d5
  event: BNTRS_DLC3_Jae_96
  text: '"Вынуждена согласиться с суждением господина ван Калокса. Шестеренки обычно куда прямолинейнее в общении. Артизан...
    пытается хитрить".'
  speaker: null
- guid: c35bcbea-0b3d-4284-a910-dd03256cb29f
  event: BNTRS_PickUps_Jae_124
  text: '"Почему тут так пусто? На Ифрите могилы почитаемых мертвецов окружены толпами молящихся".'
  speaker: null
- guid: 60c06938-d800-4a06-9cb9-39d2e726b634
  event: BNTRS_PickUps_Jae_134
  text: '"Ах, шерин, вы водите нас по таким изысканным местам! Заброшенные корабли, вонючие подворотни, теперь вот грязный
    отсек, где всех желающих может убить проводящий заряд..."'
  speaker: null
- guid: b85709b4-c76d-4b90-b5d2-d7f972a51c16
  event: BNTRS_PickUps_Jae_141
  text: '"Свет очей моих, могу предложить глоток из моей фляги. Тогда и цвета посимпатичнее станут, и до вони дела не будет!"'
  speaker: null
- guid: 11218c2c-4454-4ff9-9dc8-fad67262e9b5
  event: BNTRS_PickUps_Jae_147
  text: '"Надеюсь, побыв их наглядным пособием. Я почти уверена, что за выходкой с кровью стоишь ты, извращенная мразь!"'
  speaker: null
- guid: 427ffb1a-4267-4c2a-a0fa-ce6a2145f508
  event: BNTRS_PickUps_Jae_15
  text: '"Ты принимаешь дурманы, чтобы слышать шепоты, и истязаешь плоть, получая извращенное удовольствие. Признайся, твоя
    аскеза — фальшивка!"'
  speaker: null
- guid: 42ff3963-0a8e-4324-8eed-22512e91458e
  event: BNTRS_PickUps_Jae_150
  text: '"Ах, сенешаль, в столь благословенном месте вы неприлично близко подходите к даме. Неужели заигрываете?"'
  speaker: null
- guid: 038bf3d6-28d1-4b28-b1fd-53a501c9c5cd
  event: BNTRS_PickUps_Jae_167
  text: '"Кажись, мы забрали все-таки правильную поехавшую фанатичку. Или все твои дохлые двойники терпеть меня не могли одинаково?"'
  speaker: null
- guid: 8865f844-ce6a-4e14-adb6-82f8346d3b7d
  event: BNTRS_PickUps_Jae_188
  text: '"Слышь, костлявая. Я тебя часто придушить хочу, но... мне жаль, что тебе пришлось проделать это с собой".'
  speaker: null
- guid: caffe23b-22e7-4727-b693-84ee8dcf265e
  event: BNTRS_PickUps_Jae_203
  text: '"Тебя волнует, что они прирезали тысячи людей, но сделали это без уважения? Чокнутая".'
  speaker: null
- guid: 23aec93f-724b-441d-af29-fb08d5ded4ab
  event: BNTRS_PickUps_Jae_210
  text: '"Знавала я одного командира, предпочитающего быстрые, простые и эффективные меры. Жаль, не выжил".'
  speaker: null
- guid: cecc82b3-6742-481b-892c-eb9002695b0a
  event: BNTRS_PickUps_Jae_213
  text: '"Ты прямо ожила в этой мясорубке. Ты точно не одна из друкари?"'
  speaker: null
- guid: 4d2872ac-a67f-4f4d-be8d-752295fb5e36
  event: BNTRS_PickUps_Jae_229
  text: '"Святый Трон, а под вуалью наивности у нашей малышки прячутся ядовитые зубки!"'
  speaker: null
- guid: 55d01eee-1be7-45bb-86a6-dafa5475f48c
  event: BNTRS_PickUps_Jae_231
  text: '"Вот теперь она по-настоящему пугает. Псих, умеющий прикидываться нормальным, в десять раз опаснее".'
  speaker: null
- guid: 3fa4c95a-2b63-4c06-9a34-17cf8ee6f0d8
  event: BNTRS_PickUps_Jae_234
  text: '"По-моему, спятившей она была изначально. Но я рада, что вы хотя бы теперь это замечаете!"'
  speaker: null
- guid: 7f5e7e43-0d72-4710-a801-66b6c23038d4
  event: BNTRS_PickUps_Jae_239
  text: '"Лорд-капитану не стоило подпускать убийцу так близко... Если вы понимаете, о чем я".'
  speaker: null
- guid: d1785e49-1301-48fd-a470-ef0f0bfade76
  event: BNTRS_PickUps_Jae_267
  text: '"Ваш культ кровавых фанатиков тоже существует лишь по воле Лорд-капитана. Что на это скажешь?"'
  speaker: null
- guid: 1e138a14-58bc-4299-bb87-9bc849777166
  event: BNTRS_PickUps_Jae_272
  text: '"Идира, шерин, не слушай эту кассху. Слушай лучше меня — на средних палубах в твою честь сегодня будет такое..."'
  speaker: null
- guid: 22bd205b-c88c-48e5-a3bd-876ef3fbc1eb
  event: BNTRS_PickUps_Jae_274
  text: '"Неправильно? Да что ты такое несешь! Слушай, может, вырежешь уже себе язык и рот поплотнее зашьешь? Или как там
    в вашем культе любят извращаться".'
  speaker: null
- guid: 57e1f7bb-42e9-41b5-b0f8-7ecedda2bd16
  event: BNTRS_PickUps_Jae_28
  text: '"Великий есть жизнь и есть свет. Вы же обращаете сияние Его во тьму, милость Его — в кровавую расправу".'
  speaker: null
- guid: 161db519-1091-4288-963c-4cc8029bc40d
  event: BNTRS_PickUps_Jae_46
  text: '"Не обижайся, шерин, но по частоте и непредсказуемости своих инцидентов ты все еще выигрываешь".'
  speaker: null
- guid: be77885d-e959-49c0-ab29-c8fcf2f9f2f5
  event: BNTRS_PickUps_Jae_50
  text: '"Тебя здесь никто не держит, ашмаг, — можешь доказывать свой выдающийся интеллект за бортом. Придержать тебе шлюз?"'
  speaker: null
- guid: 17751f06-102f-4e54-8892-a84c10e8a72d
  event: BNTRS_PickUps_Jae_64
  text: '"Видимо, тем, что эти делают все это не с нами".'
  speaker: null
- guid: 5ae968f9-5168-446b-a07f-23a5747a6ec2
  event: BNTRS_PickUps_Jae_71
  text: '"Слушаю и думаю — и за что же они нас так ненавидели, таких добряков?"'
  speaker: null
- guid: f6a532ec-f8cc-40ce-812c-34226013c6f0
  event: BNTRS_PickUps_Jae_72
  text: '"Я буду последней сукой, если скажу, что мне ни капли не жаль, что Кибеллы больше нет? Знаю, мы были соратниками,
    но..."'
  speaker: null
- guid: 2f32ccbf-00d2-435d-b20a-ad69677164cd
  event: BNTRS_PickUps_Jae_76
  text: '"Какая?! Мы точно об одном человеке говорим?!"'
  speaker: null
- guid: 49678e22-b6b5-481d-8616-5233ac0adcd7
  event: BNTRS_PickUps_Jae_82
  text: '"Ты просто радуешься, что оказался не единственным, кто сразил своего наставника, в нашем тесном кругу".'
  speaker: null
- guid: c2db02d6-e1f0-4178-bd58-5646ba8754e7
  event: BNTRS_Reactivity_DLC3_Jae_24
  text: '"Все просто: шерин не чуждо понимание выгоды. Ты удивишься, как полезно бывает иметь гибкое мышление, железяка".'
  speaker: null
- guid: 62858f7e-db27-4e39-bafd-625691da548b
  event: BNTRS_Reactivity_DLC3_Jae_27
  text: '"Полагаю, кто-то рано или поздно это спросит, так что пусть это буду я. Из чистого любопытства... является ли Вольный
    Торговец Вольным Торговцем, если у него нет Патента?"'
  speaker: null
- guid: 384b6b2c-5208-4e16-973d-e4e688e99a7c
  event: BNTRS_Reactivity_DLC3_Jae_34
  text: '"За тем, что он собрал у себя в своем карманном музее, наверняка охотится половина галактики... и не только Империум.
    Если нам повезет еще раз попасть туда, я бы... оценила возможность лишить ксеноса пары-тройки артефактов".'
  speaker: null
- guid: a39d0809-d01c-4922-9475-443d6b16cb23
  event: BNTRS_Reactivity_DLC3_Jae_41
  text: '"Восхищаюсь вашей семейственностью, шерин! Если бы у меня появился пожилой родственник, что зудит над ухом и претендует
    на мое место, я бы не задумываясь отправила его туда, откуда он вылез".'
  speaker: null
- guid: 00a94d32-0c6e-4412-9e6b-2a087a36247b
  event: BNTRS_Reactivity_DLC3_Jae_50
  text: '"Не думаю, что шерин стоит переживать по этому поводу. Все знают, кто истинный — и текущий — глава династии фон Валанциус".'
  speaker: null
- guid: 67a3c553-9ac9-49c7-b8c2-04fec5c53a47
  event: BNTRS_Reactivity_DLC3_Jae_65
  text: '"Свет очей моих, умоляю, только суйся на нижние палубы за новой порцией вдохновения. Боюсь, твое трепетное сердце
    может этого не вынести".'
  speaker: null
- guid: 6ba189fb-8689-485c-8123-fbec69dfb5ef
  event: BNTRS_Reactivity_Jae_15
  text: '"Да вот думаю, что за возвышенное и трогательное чувство — первая влюбленность! Эти бабочки в животе, этот жар на
    щеках..."'
  speaker: null
- guid: c4e513b4-e5fd-4e6d-81d7-4361a6946fe0
  event: BNTRS_Reactivity_Jae_23
  text: '"Интересно, а Касс и Лорд-капитану удобно... ну... с этими навигаторскими особенностями? Острые коготки, нежные жабры..."'
  speaker: null
- guid: 4560a9d8-76b4-4860-a5a1-3d6daee2bfc6
  event: BNTRS_Reactivity_Jae_30
  text: '"Не лезь куда не просят, бездушная жестянка! Судьбы людей не поддаются твоим дурацким расчетам".'
  speaker: null
- guid: 58f1b566-504c-420b-9e0a-302c70de4900
  event: BNTRS_Reactivity_Jae_56
  text: '"После того, как тебя пользовали ведьмы арены, я побрезгую".'
  speaker: null
- guid: 56cd8601-e681-4f1f-ad11-861e5d3118b3
  event: BNTRS_Reactivity_Jae_59
  text: '"О чем ты, милая? Джай Хейдари неведома скорбь! Сердце ее подобно переменчивому ветру, что не отягощен прахом земным
    и вечно несется вперед!"'
  speaker: null
- guid: 18f71129-48c5-4076-83ec-74a2c572ee13
  event: BNTRS_Reactivity_Jae_61
  text: '"Заткнись, шестеренка! Или придушу твоим же щупальцем!"'
  speaker: null
- guid: 03eb93b1-37d7-4232-b90b-f4afbd39fdfd
  event: BNTRS_Reactivity_Jae_71
  text: '"Хейнрикс, никогда бы не подумала, что скажу это, но... у нас с тобой есть нечто общее, не находишь? Может быть,
    обсудим наши совместные пристрастия? Поделимся впечатлениями?"'
  speaker: null
- guid: 59f19b18-bdaa-4c0f-8388-44aa3dd4b7ed
  event: BNTRS_Reactivity_Jae_80
  text: '"Интересно, с чего бы это вдруг произошло? Ума не приложу. Вероятно, шерин перестал{mf||а} выгуливать своего ручного
    ксеноса? Какой печальный — и долгожданный — разлад".'
  speaker: null
- guid: cb8a7fcd-b277-4c77-8d09-ee8ffd2673e8
  event: BNTRS_Stressful_Jae_10
  text: '"Вот честное слово, господин Версериан, не могу поверить, что зануде вроде вас хоть кто-то дал. Но как-то ж вы наплодили
    вашу кучу детей!"'
  speaker: null
- guid: 5bc88c82-b2b5-4cac-8ba1-87e012c143f4
  event: BNTRS_Stressful_Jae_101
  text: '"С тех пор, как с тебя сбили спесь, тебя стало проще терпеть. Не могу сказать, что приятнее, но... проще".'
  speaker: null
- guid: 97aefb23-1db7-4572-86c1-33845fc923e1
  event: BNTRS_Stressful_Jae_103
  text: '"Спорю, как только мы наткнемся на что-то интересное, жадная железяка заскрипит про привилегии Адептус Механикус
    и попытается наложить на трофеи лапу".'
  speaker: null
- guid: d084f913-fc4a-410d-8576-a573e653f8df
  event: BNTRS_Stressful_Jae_105
  text: '"Чем так воня... пахнет из вашей кельи? Вы там фенрисийский мьод варите? Я слышала о нем, вот бы хоть каплю попробовать!"'
  speaker: null
- guid: e3a9b16c-32da-4046-a13f-7e9ee1a2bd3c
  event: BNTRS_Stressful_Jae_107
  text: '"Ты отличаешься от своих собратьев, Ирлиэт, и это меня беспокоит. Когда не знаешь, чего ожидать, приходится всегда
    начеку быть".'
  speaker: null
- guid: 49fd930b-6d56-4d6a-bbc3-018c550f1060
  event: BNTRS_Stressful_Jae_120
  text: '"Да простит меня Великий за сей грех, но я имела дело с друкари. До сих пор удивляюсь, как после тех переговоров
    я не рассталась ни с одной конечностью".'
  speaker: null
- guid: ced27af8-508d-4d0c-95e0-702df9f883d9
  event: BNTRS_Stressful_Jae_140
  text: '"Только попробуй тронуть мои аугменты своим железными щупальцами, и зафиксируешь пулю лбом! Я не шучу!"'
  speaker: null
- guid: 50aa0435-9d7a-45c2-8e62-123d7ea1b23b
  event: BNTRS_Stressful_Jae_158
  text: '"Заверяю, господин Ульфар, что и помыслить о подобном не могла. Откуда такие подозрения, вы что-то потеряли? Поищите
    получше в своей келье, уверена, найдете!"'
  speaker: null
- guid: 72c26d88-8794-436a-b5dd-b6e9bdfbc55d
  event: BNTRS_Stressful_Jae_176
  text: '"Все зависит от... перспективы. Что для одних — смертный приговор, другим дозволено в полной мере. Я лишь стараюсь
    держаться лучших и не упускать возможностей".'
  speaker: null
- guid: 5a600ab8-44a5-444f-a5d4-f3f51b921792
  event: BNTRS_Stressful_Jae_28
  text: '"Это все — твое присутствие, о прекрасный праведный ангел! Оно меня в равной степени приободряет и отвлекает".'
  speaker: null
- guid: 62048726-759e-4526-a6b2-86190143f92f
  event: BNTRS_Stressful_Jae_46
  text: '"Кас, радость очей моих, я не стыжусь показывать другим свое тело. Но вот душу мою обнажать не смей".'
  speaker: null
- guid: 3753e45e-c5f9-4c11-abf5-d9a6522394b7
  event: BNTRS_Stressful_Jae_64
  text: '"Побойтесь Великого, господин ван Калокс — даже у хладных торговцев есть стандарты. И мои не позволили мне вести
    дела с Наставниками, когда я узнала о их специализации".'
  speaker: null
- guid: 265e31dc-c537-41ac-a050-5f8dc1b807e4
  event: BNTRS_Stressful_Jae_82
  text: '"Идира, шерин, я думала, после той перестрелки ты и думать забыла со мной компанию водить! А ведь у меня еще есть
    пара идей, как развлечься!"'
  speaker: null
- guid: b6421a26-7121-41d1-bbc9-68aa5bdd1646
  event: BNTRS_Stressful_Jae_91
  text: '"Эй, дед! Тебя там ревматизм прихватил? Странно как-то ходишь".'
  speaker: null
- guid: 22c6be53-7df6-4402-a848-20d1e3cd98c8
  event: BNTRS_Stressful_Jae_93
  text: '"Сестра Арджента, помолимся вместе Великому по возвращении на корабль?.. Только в укромном местечке — не хочу портить
    свою репутацию бессовестной торговки".'
  speaker: null
- guid: 8c4b4ec7-7e70-4cba-9bee-34b5dfe97416
  event: BNTRS_Stressful_Jae_95
  text: '"Кас, радость очей моих, ты никогда не думала окрашивать волосы? При богатстве твоего Дома ты могла бы позволить
    себе лучшие средства..."'
  speaker: null
- guid: 31a46063-7ee9-484c-88b3-6fa15d3be54d
  event: BNTRS_Stressful_Jae_97
  text: '"Господин ван Калокс, нам надо как-нибудь потолковать с вами о делах. С глазу на глаз. Уверена, у вас найдется информация,
    которую я сочту невероятно полезной... и стоящей хороших денег".'
  speaker: null
- guid: 9f85fffd-581b-4c83-a31f-fd0214c1a02d
  event: BNTRS_Stressful_Jae_99
  text: '"Идира, шерин, развей мои сомнения... А с помощью твоего прорицания можно угадать, как карта за столом ляжет, а?"'
  speaker: null
- guid: fdbb7e9d-0df7-48e1-9ec9-2b89545e0930
  event: BS_KTCStolenTithe_Jae_01
  text: '"Берем!" {n}Глаза Джай горят азартом картежника, вытянувшего козырь.{/n} "Мы же берем его, шерин? Лишний флагман
    — и почти даром..."'
  speaker: null
- guid: 027719fa-a752-4b9a-b81c-3090a4ed14b6
  event: CH2_JaeHasAnOfferForYou_01
  text: '"Мы где-то виделись?.." {n}Женщина одаривает вас хмельным взглядом — две пустые бутылки уже составили ей компанию
    перед вашим приходом. В грязном и дымном баре она выглядит совершенно инородно: вычурный наряд, многочисленные украшения,
    {g|Encyclopedia:Augmentation}импланты{/g} с покрытием из драгоценных металлов — все в этом человеке кричит о богатстве
    и дерзости, необходимой для столь откровенной демонстрации роскоши.{/n}'
  speaker: null
- guid: 8ceb5c66-a9f3-404a-aacb-2183c33a9e81
  event: CH2_JaeHasAnOfferForYou_02
  text: '"Видите ли, шерин... На Футфоле действует одно главное правило — "дозволено все, пока это не мешает вести дела".
    Я — одна из тех, кто сумела в полной мере воспользоваться этим законом, и за последние годы настолько преуспела в своих
    делах, что теперь стала песчинкой в чужом завистливом глазу. Раньше мне строили мелкие козни, а теперь начали гадить по-крупному.
    Какой-то подлец украл мой груз и утащил его в глубины теневых кварталов — отвратное местечко, даже для ценителей неповторимой
    атмосферы Футфола".'
  speaker: null
- guid: 8fd67d6e-79b8-4772-af20-a91cfa403abc
  event: CH2_JaeHasAnOfferForYou_03
  text: '"О, мед для моих ушей! Бальзам для отвергнутой души!" {n}Джай элегантно отбрасывает смоляные волосы с лица и озаряет
    вас сияющей улыбкой.{/n} "Я знала, что Бог-Император вновь сведет нас в час, когда мои услуги будут вам нужны! Я и мои
    таланты — в вашем полном распоряжении".'
  speaker: null
- guid: c371fef2-b146-476d-ae0f-4d9d0f6b5051
  event: CH2_JaeHasAnOfferForYou_04
  text: '"Как могут быть дела у несчастной слуги Великого, брошенной без покровительства на съедение футфольским псам? Я все
    еще в затруднительном положении, шерин... и все еще жажду помощи, за которую готова щедро отплатить".'
  speaker: null
- guid: 5bc93b53-fadf-4c1d-9d88-c86fa3577f2b
  event: CH2_JaeHasAnOfferForYou_05
  text: '{n}Женщина, уже сделавшая глоток из стакана, давится и торопливо прочищает горло.{/n} "{name}! {name} фон Валанциус...
    мое глубочайшее, нижайшее почтение, {d|Encyclopedia:Ch2_FootfallOfficial}Ваша Светлость{/d}! Никогда представить себе
    не могла, что в "Амасекусе" буду стоять у стойки рядом с настоящим, храни нас Бог-Император, {g|Encyclopedia:RogueTrader}Вольным
    Торговцем{/g}!"'
  speaker: null
- guid: 55cb4ce6-feb5-4d70-9fe6-16a71ddc31a5
  event: CH2_JaeHasAnOfferForYou_06
  text: '"Что ж... за нашу встречу, {name}. Не надо быть семи пядей во лбу, чтобы понять, что вы {d|Encyclopedia:Ch2_FootfallIncognito}человек
    непростой{/d}, раз удостоились личной встречи с самим Наместником Футфола. Всегда приятно свести знакомство с власть имущими..."
    {n}Сделав глоток, женщина вдруг замирает — и, решительно отставив стакан в сторону, поворачивается к вам.{/n} "...приятно
    и к месту".'
  speaker: null
- guid: 8227634e-3a4a-4968-ac2c-1b4b3dfe7a1f
  event: CH2_JaeHasAnOfferForYou_07
  text: '"Вот... вот здесь, по данным маячков, эти ашмаги держат украденный груз. Из "Амасекуса" через мостки и налево — там,
    в глубине, есть один дворик, через который можно на место добраться. Я буду ждать неподалеку — приходите как сможете,
    но чем быстрее, тем лучше. До встречи, шерин!"'
  speaker: null
- guid: 7faa73a1-52be-42c9-be4b-9b357cdaee9d
  event: CH2_JaeHasAnOfferForYou_08
  text: '"Когда я обратилась к Наместнику за защитой, у нас возникло взаимное недопонимание. Кажется, Владайм самым прискорбным
    образом запамятовал о своих обязательствах покровителя угнетенных и обиженных... поэтому мне срочно нужен новый. Вы, шерин,
    идеально подходите для этой роли. Всего-то и нужно — прогуляться до одного забытого угла в теневых кварталах и вколотить
    в головы причастным к краже, что брать собственность Хейдари чревато".'
  speaker: null
- guid: 5bd95909-bfbe-4f50-8ce7-e7f29e1927b5
  event: CH2_JaeHasAnOfferForYou_09
  text: '"Конечно я понимаю, что мое благосостояние не сравнится с вашим, шерин, и деньгами вас не удивить. Но я также могу
    предложить нечто иное — свои безграничные знания! Уверена, вы оцените услуги специалиста по ведению торговых дел. Там,
    откуда я родом, такую сделку называют "продажей мудрости".'
  speaker: null
- guid: 04fc2111-08b1-4d50-beca-59c8c48532ec
  event: CH2_JaeHasAnOfferForYou_10
  text: '"Я многое слышала о... широких взглядах представителей династии фон Валанциус. И самой Леди Теодоры".'
  speaker: null
- guid: 22f9dabc-e2cb-4493-8d4e-9372aae2ef6a
  event: CH2_JaeHasAnOfferForYou_11
  text: '"Товары невероятной редкости, о шерин. Но дело не только в этом — две дюжины моих людей сгинули в непроглядной пустоте
    космоса, чтобы достать их. Я не могу оставить их семьи ни с чем".'
  speaker: null
- guid: d2dbf076-b18e-4feb-9626-e892f202f380
  event: CH2_JaeHasAnOfferForYou_12
  text: '"Мне показалось, мы оба с самого начала понимали, о чем речь, шерин. Примите мои искренние извинения, если это не
    так. И позвольте объясниться".'
  speaker: null
- guid: c48b8c84-d493-40ff-becd-c1154f2ce545
  event: CH2_JaeHasAnOfferForYou_13
  text: '"Если бы я рассказала вам обо всем напрямую, вы бы стали... скажем, соучастни{mf|ком|цей}. Но так как заветные слова
    не прозвучали из моих уст — вы, гипотетически, согласились бы лишь помочь мне отбить несколько контейнеров. А если бы
    ажи вдруг решили спутать наши планы — всех пустотных псов спустили бы на меня. Я искренне желала оградить вас от лишнего
    беспокойства, шерин. Клянусь Великим!"'
  speaker: null
- guid: 9245269e-e5ce-4fab-a427-b2fe0bd38188
  event: CH2_JaeHasAnOfferForYou_14
  text: '"Полагаю, это значит "нет"?'
  speaker: null
- guid: 1cc98dba-1a12-4da6-be04-29fdcec8e3db
  event: CH2_JaeHasAnOfferForYou_15
  text: '"Честную сделку, шерин". {n}В глазах Джай разгорается сдерживаемый азарт.{/n} "Если ваша душа пожелает — мы разделим
    возвращенный груз... пополам. Так будет справедливо. Ну а если товары невероятной редкости вас не интересуют, я с готовностью
    покрою хлопоты парой бумаг, сравнимых по ценности с парой набитых трюмов".'
  speaker: null
- guid: 80d3dca4-297e-48a3-b720-a30ac62d8ce1
  event: CH2_JaeHasAnOfferForYou_16
  text: '"Сколько угодно, шерин. Доверие — залог успешного дела".'
  speaker: null
- guid: fd4c67c1-228e-4718-b0d6-f5967034b811
  event: CH2_JaeHasAnOfferForYou_17
  text: '{n}Хейнрикс кашляет и тихо, едва слышно оттарабанивает:{/n} "Она из хладных торговцев — контрабандистов, промышляющих
    ксенотоварами. Помимо этой ереси о других, более тяжелых прегрешениях в ее исполнении не слышал".'
  speaker: null
- guid: 2f87a47a-6b6e-45f5-83b6-ccd24c84f762
  event: CH2_JaeHasAnOfferForYou_18
  text: '"Хех. Она начинает мне нравиться".'
  speaker: null
- guid: 1619c965-f860-4f94-84a1-a15f53727901
  event: CH2_JaeHasAnOfferForYou_19
  text: '{n}Темные глаза загораются живым интересом.{/n} "Воистину дела вы вести умеете, шерин! Требуете платы, еще не давши
    ответа, разумев мое неустойчивое положение... Уважаю. И уж не знаю, алкоголь говорит во мне или предчувствие какое, да
    только хочется мне с вами пойти на риск".'
  speaker: null
- guid: df4bff0f-641c-4084-83c1-b6450c0dbea1
  event: CH2_JaeHasAnOfferForYou_20
  text: '{n}Джай приветственно салютует вам стаканом.{/n} "Шерин! Рада видеть вас в добром здравии! Быть может, вы уже сменили
    равнодушие на милость к моей беде?"'
  speaker: null
- guid: 627a22ab-a0ba-4f18-8e15-9716e213d788
  event: CH2_JaeHasAnOfferForYou_21
  text: '{n}Женщина достает из голенища начищенного сапога небольшой сверток и протягивает вам.{/n} "Истинным драгоценностям
    место в руках достойнейших, шерин. Прошу, примите сей скромный дар". {n}Джай загадочно улыбается и пригубливает ароматный
    напиток.{/n}'
  speaker: null
- guid: 4ce325a6-38a7-411a-8e1a-01f461bab592
  event: CH2_JaeHasAnOfferForYou_22
  text: '{n}Глаза Джай тускнеют.{/n} "Как жаль... как жаль. Что ж, тогда благодарю вас за то, что выслушали скорбную историю
    несчастной женщины. Если же вы вдруг передумаете, то я буду где-то неподалеку... да, скорее всего, прямо на этом самом
    месте". {n}Джай откланивается и поворачивается к стойке.{/n} "Эй, Октавиана! Тащи еще одну бутылку!"'
  speaker: null
- guid: 616ed01b-43e0-481f-ae8f-c962a6abb0c7
  event: CH2_JaeHasAnOfferForYou_23
  text: '{n}Женщина чуть пьяно улыбается, разглядывая вас поверх поднятого ко рту стакана.{/n} "Приветствую, шерин. С кем
    имею честь?"'
  speaker: null
- guid: 83a9dbad-6e75-4766-bc5c-33239cf4b743
  event: CH2_JaeHasAnOfferForYou_24
  text: '"Джай Хейдари, к вашим услугам. Профессиональный негоциант, искусный торговый посредник и — да украдут мой язык ажи,
    если совру — самый честный делец на Футфоле. Впрочем, у каждого бывают проблемы, для решения которых даже самых многочисленных
    достоинств может не хватить. Возможно, человеку с властью и статусом вроде ваших не составит труда помочь человеку с бедой
    вроде моей?"'
  speaker: null
- guid: c65e928a-f873-4531-a8af-54b95439b797
  event: CH2_JaeHasAnOfferForYou_25
  text: '"Великий благослови и вас, и весь ваш род!" {n}Джай молниеносно вытаскивает из-за пазухи {g|Encyclopedia:Dataslate}инфопластину{/g}
    и демонстрирует вам схему Футфола.{/n} "Значит, вот как поступим. Не стоит, чтобы нас видели вместе до того, как мы доберемся
    до схрона. Я отправлюсь на место первой — своими путями, я знаю тропки".'
  speaker: null
- guid: 7e68d86e-2f0a-4967-8386-f0c210a096f7
  event: CH2_JaeHasAnOfferForYou_26
  text: '"Ваша Светлость, шерин, какая прекрасная встреча! Вы зачастили в "Амасекус" — местная атмосфера вам явно по вкусу".
    {n}Джай смеется, поднося к губам стакан с янтарной жидкостью.{/n}'
  speaker: null
- guid: 37f2b5b2-1c60-483b-b2cd-50d4187976b5
  event: CH2_JaeHasAnOfferForYou_27
  text: '"Лучше, чем в прошлую нашу встречу, шерин, да благословит Великий ваш путь! Впрочем, на Футфоле мне день ото дня
    становится все неуютнее — без благоволения Наместника эта забытая {g|Encyclopedia:GoldenThrone}Троном{/g} станция весьма
    опасна. Быть может, переберусь куда-нибудь подальше, как только прикину, как избавиться от лишних обязательств и сбыть
    связывающие меня товары..."'
  speaker: null
- guid: a3d68978-58b9-4d22-ba09-af83ee6708be
  event: CH2_JaeHasAnOfferForYou_Jae_28
  text: '{n}Улыбка Джай становится еще ослепительнее.{/n} "Надеюсь, эта поверхностная и совершенно неуместная характеристика
    из уст многоуважаемого арбитра не помешает вам само{mf|му|й} составить мнение о моих многочисленных и блестящих талантах!"'
  speaker: null
- guid: bc999fe4-16d3-4ed1-8d2d-fc8a855f2a9a
  event: RMNC_AfterSex_BarksJae_01
  text: '"Время так скоротечно в объятьях желанн{mf|ого|ой}. Кажется, Великий даровал нам вечность счастья".'
  speaker: null
- guid: 62d4c01d-657f-4e79-bb58-e06e8a303a05
  event: RMNC_AfterSex_BarksJae_02
  text: '"Мое сердце было ужалено твоей страстью. Теперь я вечно буду желать вновь ощутить ее, шерин".'
  speaker: null
- guid: d903eaa2-6ad0-4462-85f9-1e7781699359
  event: RMNC_AfterSex_BarksJae_03
  text: '"Воистину правду говорят, что Вольные Торговцы блистательны во всем, за что берутся".'
  speaker: null
- guid: 0c1dc62c-5461-4d4e-9c2c-e1565637a93c
  event: RMNC_AfterSex_BarksJae_04
  text: '"Ты так противоречив{mf||а}, шерин. Подарил{mf||а} мне платье лишь для того, чтобы снять его".'
  speaker: null
- guid: 5a73e55a-f82c-4c61-9159-d5814483768d
  event: RMNC_Jae_Jacuzzi_01
  text: '"Шерин, я тебя заждалась". {n}Джай возлежит в вашей купальне с таким видом, будто она скорее ее, чем ваша. Стоящая
    рядом бутылка мерцает алым в отблесках свечей.{/n} "Иди скорее сюда, вода горяча, как объятия молодых любовников в их
    первую ночь".'
  speaker: null
- guid: 4acebd8c-a4fd-4614-9347-aec71daac997
  event: RMNC_Jae_Jacuzzi_02
  text: '{n}Ладонь контрабандистки смахивает капли воды с покатого плеча, отправляя их в вас горячим веером.{/n} "Это свидание
    никогда не закончится, шерин. Ночь, амасек, вода и страсть будут нашей вечностью".'
  speaker: null
- guid: 75740575-4d4b-489d-877b-3c3fe63131f5
  event: RMNC_Jae_Jacuzzi_03
  text: '"Восстала из пепла, коим стало мое прошлое, шерин. Я много думала о том, кем была и кем стала, и поняла, что Джай
    Хейдари — это больше, чем имя. Это та жизнь, о которой я мечтала с младых когтей и которую смогла выцарапать у мироздания.
    Когда-то это было маской, но теперь... Это просто я. И мне нечего стесняться".'
  speaker: null
- guid: cd4981c3-4333-4771-bc59-79e9f6fd2515
  event: RMNC_Jae_Jacuzzi_04
  text: '"Думаешь, поможет, шерин?" {n}Джай игриво улыбается.{/n}'
  speaker: null
- guid: 2963523f-cd47-4786-9d64-af570f0f9ed3
  event: RMNC_Jae_Jacuzzi_05
  text: '"У нас первое свидание. Второе первое свидание, если быть точной. Ты узнал{mf||а} меня с новой стороны, так что я
    аннулирую предыдущее первое свидание".'
  speaker: null
- guid: 89bfed40-6f38-4944-9402-e794448b3365
  event: RMNC_Jae_Jacuzzi_06
  text: '{n}Прижавшись к вам всем телом и закрыв глаза, Джай дарит вам долгий поцелуй и тихо шепчет:{/n} "На самом деле так
    не бывает. Это все долгий сон, но я запрещаю себе просыпаться, ведь после него мне не нужна настоящая жизнь".'
  speaker: null
- guid: 8d435e64-612a-4119-8334-91dca9de4ea3
  event: RMNC_Jae_Jacuzzi_07
  text: '"Как хочешь". {n}Джай мягко улыбается.{/n} "Я готова быть твоей женой или наложницей. Мне не нужна свадьба, мне нуж{mf|ен|на}
    только ты".'
  speaker: null
- guid: 8f73ac72-6713-4e02-86bc-b1a3539b853f
  event: RMNC_Jae_Jacuzzi_08
  text: '{n}С сожалением прикрыв глаза, Джай отвечает:{/n} "Ладно, не топить же тебя тут, мо{mf|й|я} неромантичн{mf|ый|ая}
    шерин. Я еще немного понежусь и удалюсь. Эта купальня слишком прекрасна, чтобы я согласилась покинуть ее не под дулом
    автопистолета".'
  speaker: null
- guid: 76e5cb52-4185-4a38-8697-7a82c8c4c11f
  event: RMNC_Jae_Jacuzzi_09
  text: '{n}Вода обжигает, но лишь на мгновение. Ее жар уносит прочь из тела усталость, а из головы — тревоги и мысли о завтра.
    Вы ощущаете прикосновение под водой. Джай, соблазнительно улыбаясь, накручивает прядь волос на палец.{/n} "Разве не божественно?
    И почему мы не делали этого раньше?"'
  speaker: null
- guid: 30755e06-e83c-46bd-b068-68d7b414dea6
  event: RMNC_Jae_Jacuzzi_10
  text: '"Помнишь, как ты сказал{mf||а} в Комморре? Что тебе не важно, кем я родилась, потому что я умру столь же достойно,
    как и все остальные? Я, кажется, тогда поняла, какую власть имею над своей жизнью".'
  speaker: null
- guid: e50428b4-c7ed-4671-9c75-a2c90eb4dc8b
  event: RMNC_Jae_Jacuzzi_11
  text: '"Помнишь, как ты сказал{mf||а} в Комморре? Что я никогда не умещалась в чужие рамки? Я, кажется, тогда поняла, какую
    власть имею над своей жизнью".'
  speaker: null
- guid: 2e7bb764-6272-4aa6-a9b8-980903bf6940
  event: RMNC_Jae_Jacuzzi_12
  text: '"Помнишь, что ты сказал{mf||а} мне, когда узнал{mf||а} правду о моем прошлом? Что в твоих глазах я не изменилась.
    Я, кажется, тогда поняла, какую власть имею над своей жизнью".'
  speaker: null
- guid: 3946a8ed-c2e2-43b6-9790-087dd3ca273f
  event: RMNC_Jae_Jacuzzi_13
  text: '"А потом ты запретил{mf||а} Пощаде смотреть на меня, как на девочку, нуждающуюся в нем... Знаешь, ты, возможно, перв{mf|ый|ая},
    кто сделал{mf||а} это для меня. Кто не попытал{mf|ся|ась} под предлогом любви переделать меня, кто не ждал{mf||а}, что
    я буду соответствовать навешенным ярлыкам".'
  speaker: null
- guid: 8d8da010-6c00-44f8-8f0b-e38ab13abee8
  event: RMNC_Jae_Jacuzzi_14
  text: '"И я подумала... Я решила, что могу тебе доверять. Это очень опасно — доверять кому-то себя. Но почему-то мне кажется,
    что ты не воспользуешься моей уязвимостью". {n}Закрыв глаза, девушка произносит фразу на неизвестном вам языке, и на губах
    у нее возникает светлая улыбка.{/n}'
  speaker: null
- guid: 11f77ee2-ad7e-4f6c-b3ef-dbc279386fd7
  event: RMNC_Jae_Jacuzzi_15
  text: '{n}В огромных темных глазах девушки вспыхивает пламя. Это пламя ревущих в ночи костров, пламя факелов охотничьей
    кавалькады, пламя яростного прометийного пожара. Оно приближается к вам, вцепляется в вас своими жгучими языками, оплетает
    ваше тело. Имя этому буйному огню — Джай Хейдари.{/n}'
  speaker: null
- guid: 3478c5c1-8ea6-4ce4-a6da-7c45bab0c389
  event: RMNC_Jae_Jacuzzi_16
  text: '"Мне тоже, шерин. Давай просто посидим". {n}Джай откидывается назад, тяжелые пряди мокрых волос падают на грудь.
    Она начинает мурлыкать нежную переливчатую песню. Вы не знаете, о чем она, но очень легко представить, что она о том,
    как усталые странники возвращаются домой после долгого похода, и горячий очаг согревает их озябшие усталые руки.{/n}'
  speaker: null
- guid: 155f9566-35c0-4bf8-bca1-87a4794dffa8
  event: RMNC_Jae_Jacuzzi_17
  text: '{n}Зажмурившись, Джай довольно отвечает:{/n} "Богатства, слава. Красивый финал. Я всегда мечтала именно о таком".
    {n}Открыв глаза, Джай со значением смотрит на вас.{/n} "Именно о тако{mf|м|й}".'
  speaker: null
- guid: 6aaa85a7-e9e5-4084-b99b-668a77339ff9
  event: RMNC_Jae_Jacuzzi_18
  text: '"Ах, шерин, так бывает лишь в сказках. Но мы ведь в сказке, не так ли?" {n}Капли воды стекают по щекам Джай, словно
    слезы, но это, наверное, все же не слезы — ведь она улыбается.{/n}'
  speaker: null
- guid: 440b9bc2-a641-4898-8f60-453a3e16e983
  event: RMNC_Jae_Jacuzzi_19
  text: '{n}Закрыв глаза, Джай произносит с такой серьезностью, словно творит заклинание:{/n} "В конце они умерли, потому
    что все умирают. Но до того Великий даровал им милость не разу не пожалеть о чувстве, что связало их. И им было довольно
    этой милости".'
  speaker: null
- guid: 1bfcbc9e-4e6e-453f-8695-bdc625abbdfa
  event: RMNC_Jae_Jacuzzi_20
  text: '"Хамаэ сар, лаэ кар, раум ка. Это значит: "Я принадлежу, я клянусь, смотри, Великий". Эту клятву на Ифрите приносят
    над водой те, кто встретил свое сердце. Ее дают один раз в жизни и навсегда, ибо что отразилось в водной глади, то отразилось
    в зрачке Великого". {n}Джай застенчиво отводит взгляд.{/n}'
  speaker: null
- guid: a8ecab80-9823-4541-8b48-1b1f49e3a8a7
  event: RMNC_Jae_Jacuzzi_21
  text: '{n}Одарив вас задумчивым взглядом, Джай без улыбки отвечает:{/n} "Я — твоя возлюбленная. Сегодня мне хватает этого,
    а завтра... посмотрим".'
  speaker: null
- guid: b6ffa9a6-a89b-456e-a3da-11162b9500c5
  event: RMNC_Jae_Jacuzzi_22
  text: '{n}Передавая вам бокал, Джай задерживает свои пальцы на ваших.{/n} "Восславим глотком Великого, что зрит в глубины
    наших сердец и посылает нам то, о чем не догадываемся мечтать, но что нам более всего нужно".'
  speaker: null
- guid: 419e2848-d214-42e7-ae1c-6317a891f8bd
  event: RMNC_Jae_Jacuzzi_23
  text: '"Представляю, какими отъявленными сорванцами они бы были". {n}Джай счастливо смеется и довольно мурлычет:{/n} "Ох
    уж эти сказки, ну как в них верить. Да, шерин?"'
  speaker: null
- guid: 2e914f76-7098-448f-a97e-fb21229b5309
  event: RMNC_Jae_Jacuzzi_24
  text: '"И это случилось благодаря тебе, шерин. Ты не отверг{mf||ла} меня, и я перестала задаваться вопросом, достойна ли
    я быть рядом с тобой. Я достойна, и я знаю это". {n}Спокойный голос исполнен уверенности, вальяжной силы и, в то же время,
    трепетной нежности. Он ласкает и обтекает вас.{/n}'
  speaker: null
- guid: 9157f37f-4e37-4593-8b8d-2985c9f22808
  event: RMNC_Jae_Jacuzzi_25
  text: '{n}Руки Джай изгибаются в прихотливом театральном жесте, словно она на сцене.{/n} "На Ифрите говорят, что чтобы знать
    будущее, надо обратить взгляд в прошлое, ибо Великий сплел время в петлю. Я слышала сказку... Прекрасную сказку об авантюристке
    и воровке, что украла у вселенной счастье и, словно спелый плод, вкушала его в одиночестве. Но разве можно быть счастливой
    в одиночестве? Нет. И тогда воровка разделила свой трофей с Вольным Торговцем, что был{mf||а} прекрас{mf|ен|на} и внешностью,
    и сердцем".'
  speaker: null
- guid: 4c433bf8-3b8f-4acf-babb-8748cec764c8
  event: RMNC_Jae_Jacuzzi_26
  text: '{n}Бархатный голос убаюкивает, вводит в транс.{/n} "Вместе они пировали краденным счастьем, возводили дворцы, завоевывали
    миры, любили друг друга... О, как они любили друг друга. Они сгорали и обновлялись в этой любви. А потом... Я не помню,
    чем закончилась эта сказка". {n}Джай улыбается.{/n} "Как думаешь, что ждало их в конце?"'
  speaker: null
- guid: f64679f3-eb2a-434c-99e4-ebd371279a27
  event: RMNC_Jae_Jacuzzi_27
  text: '"Я буду той, кем пожелаю, шерин. В конце концов, я всегда могу изобрести для себя еще какую-нибудь интересную судьбу.
    Военачальница, исследовательница, пиратка, мудрая правительница... Я найду, чем тебя удивить". {n}Джай смотрит на вас
    с лукавым интересом.{/n}'
  speaker: null
- guid: dd1b6d6e-6a41-402c-aa92-4624434fc338
  event: RMNC_Jae_Jacuzzi_28
  text: '"И то, что я никогда не умела уместиться в какие-то рамки... Это тоже правда. Я всегда гнула их под себя".'
  speaker: null
- guid: ebf6e5e6-24c1-4283-93ee-115883c4d30d
  event: RMNC_Jae_SearchAndSex_01
  text: '{n}Быстро обернувшись, Джай ослепительно улыбается и как ни в чем ни бывало заявляет:{/n} "Шерин, вот и ты. Я тебя
    заждалась".'
  speaker: null
- guid: a874b019-640d-4711-81fe-f03b824fbf78
  event: RMNC_Jae_SearchAndSex_02
  text: '"Что поделать, шерин. В силу своего происхождения я всегда презирала запертые двери".'
  speaker: null
- guid: fb96bba1-3d3f-4cc7-8ef5-6df223904840
  event: RMNC_Jae_SearchAndSex_03
  text: '"Утоляю голод, что превыше телесного — голод любопытства. Лицо человека, его одежда и повадки — маска, дым из уст
    факира, призванный скрыть истину. Но содержимое сундуков и шкафов — отражение души, в котором мудрому дано прозреть чужое
    сердце. Мне стало интересно, каков{mf||а} ты".'
  speaker: null
- guid: a4b9a0dd-a930-42e7-a080-e863ce46b02f
  event: RMNC_Jae_SearchAndSex_04
  text: '"Шерин, вы так неосторожны. Я же контрабандистка, бессовестная хладная торговка, вдруг я что-нибудь украла? Вы хоть
    обыщите меня". {n}Джай с лукавой улыбкой подается к вам всем телом, разведя руки.{/n}'
  speaker: null
- guid: 5c7329e7-0ac3-4be7-920e-1d24dd40697f
  event: RMNC_Jae_SearchAndSex_05
  text: '"Все в нашей жизни — какая-то игра, шерин. Мы играем, нами играют. Без игры все становится скучным".'
  speaker: null
- guid: 229c361b-0e37-4489-a0e4-8594b849d910
  event: RMNC_Jae_SearchAndSex_06
  text: '"Ты... Ты все совсем неправильно понял{mf||а}". {n}Лицо Хейдари мертвеет. Она вытаскивает из одежды шкатулку, еще
    недавно украшавшую ваши покои, и роняет на пол. Из раскрывшейся шкатулки выпадает сложенный листок, на котором начертано
    "Спасибо".{/n} "Мне жаль, что ты не оценил{mf||а} мою забаву. Впредь я не побеспокою тебя с подобными играми".'
  speaker: null
- guid: 0746faee-5d23-4fab-993d-76248887418a
  event: RMNC_Jae_SearchAndSex_07
  text: '{n}Джай, склонив голову к плечу, прикусывает губу.{/n} "Как еще мне доказать свою невинность, шерин?"'
  speaker: null
- guid: 6eaf5252-5e25-4a35-95fe-3d8b4238f871
  event: RMNC_Jae_SearchAndSex_08
  text: '"Шерин, чернила горькой обиды уродливой кляксой запятнали мое сердце. Раз вы так не доверяете мне — обыщите". {n}Джай
    с лукавой улыбкой подается к вам всем телом, разведя руки.{/n}'
  speaker: null
- guid: 79a7ce57-ff68-43c5-94c3-37276c904cd5
  event: RMNC_Jae_SearchAndSex_09
  text: '{n}Джай с вызовом усмехается.{/n} "Может, я не люблю просить".'
  speaker: null
- guid: 2ea968f1-41ea-4dfb-a5f6-07954624e65b
  event: RMNC_Jae_SearchAndSex_10
  text: '{n}Ваши пальцы касаются теплого дерева. Вы достаете крохотную шкатулку, украшавшую ваши покои. Открыв ее, вы видите
    сложенную записку, в которой написано: "Спасибо". Джай с улыбкой заглядывает вам в глаза.{/n} "Мне очень понравился подарок,
    шерин".'
  speaker: null
- guid: 001a87b5-6c03-4815-93e3-99a0bc8d4c2a
  event: RMNC_Jae_SearchAndSex_11
  text: '{n}Джай ошарашенно смотрит на вас.{/n} "Че... Чего? Шерин, не морочьте голову наивной контрабандистке".'
  speaker: null
- guid: ce7eecd7-27bc-42c3-a547-2daff42b9c11
  event: RMNC_Jae_SearchAndSex_12
  text: '{n}Губы Джай кривятся в болезненной гримасе, но уже спустя мгновение на них вновь играет ослепительная улыбка.{/n}
    "Прошу меня простить, шерин. Я неправильно поняла... суть наших отношений. Это больше не повторится".'
  speaker: null
- guid: c3382ebd-b926-4440-a472-f4bd5863e07c
  event: RMNC_Jae_SearchAndSex_13
  text: '"Все, что пожелает Вольный Торговец".'
  speaker: null
- guid: d80fe4f6-75ff-4d51-9df6-ad6dfcd1bf98
  event: RMNC_Jae_SearchAndSex_14
  text: '"Продолжайте, шерин. Вдруг вам все же улыбнется удача".'
  speaker: null
