- guid: 2db13e48-850a-4fb9-8c55-6a87665465e8
  event: Companions_Sororitas_25
  text: '"Про это я могу рассказать. Отовсюду и ниоткуда. Я..." {n}— глаза Ардженты на мгновение становятся темнее.{/n} "Я — дитя офицеров {g|Encyclopedia:AstraMilitarum}Имперской гвардии{/g}. Я родилась в трюме боевого корабля, росла в бросках с одной планеты на другую, и потеряла семью в огне праведной войны".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Про это я могу рассказать. Отовсюду и ниоткуда. Я...
  - speaker: narrator
    text_clean: — глаза Ардженты на мгновение становятся темнее.
  - speaker: Sister Argenta
    text_clean: Я — дитя офицеров Имперской гвардии. Я родилась в трюме боевого корабля, росла в бросках с одной планеты на другую, и потеряла семью в огне праведной войны.
- guid: 5e13265e-baca-456a-abb6-42c6fa83323e
  event: Companions_Sororitas_26
  text: '{n}Арджента рассеянно проводит пальцами по фрагменту золотой {g|Encyclopedia:Aquila}аквилы{/g}, что висит у нее на поясе.{/n} "Моя память — как клочки дыма над полем отгремевшего боя. Серость корабельной обшивки, четкий ритм жизни военных лагерей. Форма матери — я любила разглядывать ее. Потом — тот бой... грохот, крики и копоть. Вопли горящих заживо солдат. И золото полковой аквилы — последняя незапятнанная гарью и кровью частичка сходящего с ума мира".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента рассеянно проводит пальцами по фрагменту золотой аквилы, что висит у нее на поясе.
  - speaker: Sister Argenta
    text_clean: Моя память — как клочки дыма над полем отгремевшего боя. Серость корабельной обшивки, четкий ритм жизни военных лагерей. Форма матери — я любила разглядывать ее. Потом — тот бой... грохот, крики и копоть. Вопли горящих заживо солдат. И золото полковой аквилы — последняя незапятнанная гарью и кровью частичка сходящего с ума мира.
- guid: 4c084c88-96e6-4541-afc1-735c35e145b0
  event: Companions_Sororitas_27
  text: '"Я допустила ошибку. Попала в засаду проклятых поклонников {g|Encyclopedia:Chaos}Архиврага{/g}. Была тяжело ранена. Леди Теодора пришла мне на выручку. На ее корабле мне оказали помощь, выходили после ранения. Все это произошло не так давно — я едва-едва оправилась от ран, когда на корабль напали культисты. Воистину, слуги зла не ведают покоя! Нет места, где мы были бы в безопасности от их козней".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я допустила ошибку. Попала в засаду проклятых поклонников Архиврага. Была тяжело ранена. Леди Теодора пришла мне на выручку. На ее корабле мне оказали помощь, выходили после ранения. Все это произошло не так давно — я едва-едва оправилась от ран, когда на корабль напали культисты. Воистину, слуги зла не ведают покоя! Нет места, где мы были бы в безопасности от их козней.
- guid: e1573340-fb34-4482-8082-596dca4ba3ab
  event: Companions_Sororitas_28
  text: '"В одних лишь робах, без брони, с цепным Потрошителем в руках, эти раз оступившиеся сестры совершают свое покаяние на поле битвы. Их век редко долог, но смерть во имя очищения — лучшая участь, чем жизнь с тенью в душе".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В одних лишь робах, без брони, с цепным Потрошителем в руках, эти раз оступившиеся сестры совершают свое покаяние на поле битвы. Их век редко долог, но смерть во имя очищения — лучшая участь, чем жизнь с тенью в душе.
- guid: d65f053d-5d3f-440f-8a79-0f2876f46033
  event: Companions_Sororitas_29
  text: '"Даже с лучшими это случается!" {n}— запальчиво говорит Арджента. Потом хмурится и на мгновение опускает голову.{/n} "Мои ошибки — мое бремя. Я найду способ их искупить".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Даже с лучшими это случается!
  - speaker: narrator
    text_clean: — запальчиво говорит Арджента. Потом хмурится и на мгновение опускает голову.
  - speaker: Sister Argenta
    text_clean: Мои ошибки — мое бремя. Я найду способ их искупить.
- guid: 046a449b-e939-4d83-809b-bef1ca17c6f6
  event: Companions_Sororitas_30
  text: '"Этот корабль стал целью атаки еретиков — значит, мое присутствие здесь и помощь тебе есть моя святая обязанность. Рано или поздно мне, вероятно, придется вернуться на {g|Encyclopedia:Footfall}Футфол{/g}, охранять его реликварий. Но я хотела бы пока остаться частью команды {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}, если это всех устраивает".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Этот корабль стал целью атаки еретиков — значит, мое присутствие здесь и помощь тебе есть моя святая обязанность. Рано или поздно мне, вероятно, придется вернуться на Футфол, охранять его реликварий. Но я хотела бы пока остаться частью команды Вольного Торговца, если это всех устраивает.
- guid: 20c6d7b8-4cbc-48d2-a1dd-b037d92c3d3c
  event: Companions_Sororitas_31
  text: '{n}Арджента склоняет голову.{/n} "Я... рада быть откровенной".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента склоняет голову.
  - speaker: Sister Argenta
    text_clean: Я... рада быть откровенной.
- guid: c013e83f-a55c-4b51-a2ef-06f38707eaa4
  event: Companions_Sororitas_32
  text: '{n}Глаза сестры вспыхивают.{/n} "Да будет так!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Глаза сестры вспыхивают.
  - speaker: Sister Argenta
    text_clean: Да будет так!
- guid: 80beeb2f-c526-4085-8bb8-6b5dc3eacef1
  event: Companions_Sororitas_33
  text: '{n}После короткой заминки Арджента добавляет с некоторой заносчивой торопливостью:{/n} "Мой же Орден тем более славен боевым мастерством его сестер. Мы храним имперские святыни! Что стало бы с наследием наших благословенных героев, не умей сестры Пронатус защитить его?"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: 'После короткой заминки Арджента добавляет с некоторой заносчивой торопливостью:'
  - speaker: Sister Argenta
    text_clean: Мой же Орден тем более славен боевым мастерством его сестер. Мы храним имперские святыни! Что стало бы с наследием наших благословенных героев, не умей сестры Пронатус защитить его?
- guid: 2598039f-694b-49b4-aa02-5b9c3206944a
  event: Companions_Sororitas_34
  text: '"На одной из недавно открытых планет {g|Encyclopedia:KoronusExpanse}Простора{/g}. Никто не ведал, что она уже запятнана мерзостью ереси. Знай я это заранее — конечно, была бы начеку".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: На одной из недавно открытых планет Простора. Никто не ведал, что она уже запятнана мерзостью ереси. Знай я это заранее — конечно, была бы начеку.
- guid: cae57bfc-3242-44c8-ad44-77dc90358207
  event: Companions_Sororitas_35
  text: '"К сожалению, нет. Леди Теодора спешила, и не стала задерживаться на планете. Ее люди забрали меня на корабль в беспамятстве, а когда я пришла в себя, мы уже летели прочь. О как надеюсь я снова встретиться лицом к лицу с этими еретиками! И когда-нибудь это обязательно произойдет".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: К сожалению, нет. Леди Теодора спешила, и не стала задерживаться на планете. Ее люди забрали меня на корабль в беспамятстве, а когда я пришла в себя, мы уже летели прочь. О как надеюсь я снова встретиться лицом к лицу с этими еретиками! И когда-нибудь это обязательно произойдет.
- guid: 5f364a7b-f003-430b-a906-22e9635db713
  event: Companions_Sororitas_36
  text: '"Как тебе угодно".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как тебе угодно.
- guid: 9f1b5efa-7569-4f66-8cd7-d22204c20ba2
  event: Companions_Sororitas_37
  text: '"Единственная звезда, яркая звезда, серебряная звезда светила на небе. И когда та сирота улыбнулась ей — Единственная звезда упала с неба прямо в ее руки. Все верные в разных уголках континента, кто увидел след падающей звезды, распознали знамение и отправились искать место падения. И собрались они вместе, и вместе со светом Единственной звезды к ним пришло спасение".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Единственная звезда, яркая звезда, серебряная звезда светила на небе. И когда та сирота улыбнулась ей — Единственная звезда упала с неба прямо в ее руки. Все верные в разных уголках континента, кто увидел след падающей звезды, распознали знамение и отправились искать место падения. И собрались они вместе, и вместе со светом Единственной звезды к ним пришло спасение.
- guid: 987b92a1-21f5-486d-8afb-c9d13b0ffda1
  event: Companions_Sororitas_38
  text: '"Это... очень приятные слова, Вольный Торговец. Благодарю — и за слова, и за гостеприимство". {n}Она бросает на вас еще один, слегка озадаченный взгляд.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Это... очень приятные слова, Вольный Торговец. Благодарю — и за слова, и за гостеприимство.
  - speaker: narrator
    text_clean: Она бросает на вас еще один, слегка озадаченный взгляд.
- guid: e5dc1a21-3e65-4c67-b64f-c6a0d6798821
  event: Companions_Sororitas_39
  text: '{n}В глазах сестры Ардженты появляется блеск. Она колеблется, но потом со вздохом качает головой.{/n} "Путь к этой планете утрачен, знания погибли вместе с прежним {g|Encyclopedia:Navigator}Навигатором{/g} корабля. Заново открыть маршрут потребует неимоверных усилий и ресурсов. У наследни{mf|ка|цы} протектората фон Валанциус наверняка много проблем и забот сейчас. Может быть, позже... когда небо над нашими головами прояснится".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: В глазах сестры Ардженты появляется блеск. Она колеблется, но потом со вздохом качает головой.
  - speaker: Sister Argenta
    text_clean: Путь к этой планете утрачен, знания погибли вместе с прежним Навигатором корабля. Заново открыть маршрут потребует неимоверных усилий и ресурсов. У наследника протектората фон Валанциус наверняка много проблем и забот сейчас. Может быть, позже... когда небо над нашими головами прояснится.
- guid: 708dd040-7536-4ed5-a744-f8503e6de5df
  event: Companions_Sororitas_40
  text: '"Я не так долго пробыла здесь — один полет от Футфола, и то, второе путешествие, в ходе которого я почти все время томилась в медотсеке. Про первый полет я мало что могу рассказать... молитвы и размышления занимали меня больше, чем окружающие люди или сам путь".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я не так долго пробыла здесь — один полет от Футфола, и то, второе путешествие, в ходе которого я почти все время томилась в медотсеке. Про первый полет я мало что могу рассказать... молитвы и размышления занимали меня больше, чем окружающие люди или сам путь.
- guid: fa1f6bf3-756b-4837-bc12-44630b4f45fc
  event: Companions_Sororitas_41
  text: '"Но не все люди Теодоры вызывают у меня доверие. Ты знаешь, о ком я говорю — Идире Тласс не место среди верных Империума. Я удивлена, что она не оказалась сообщницей культистов. И удивлена, как глубоко ересь и измена пустили корни здесь..." {n}Арджента хмурится и качает головой.{/n} "Хорошо, что все мы пережили темный час. Пусть день, следующий за ним, будет ярок!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Но не все люди Теодоры вызывают у меня доверие. Ты знаешь, о ком я говорю — Идире Тласс не место среди верных Империума. Я удивлена, что она не оказалась сообщницей культистов. И удивлена, как глубоко ересь и измена пустили корни здесь...
  - speaker: narrator
    text_clean: Арджента хмурится и качает головой.
  - speaker: Sister Argenta
    text_clean: Хорошо, что все мы пережили темный час. Пусть день, следующий за ним, будет ярок!
- guid: 71537d7b-2180-4121-930c-341fe5e3062b
  event: Companions_Sororitas_42
  text: '"После этого на своем корабле, отмеченным знаком серебряной звезды, она путешествовала по мирам, охваченным смутой, и несла надежду верным. Тому есть многочисленные свидетельства. Ее явление людям позволило переломить ход войны и вычистить скверну даже до того, как подоспели основные части имперских сил".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: После этого на своем корабле, отмеченным знаком серебряной звезды, она путешествовала по мирам, охваченным смутой, и несла надежду верным. Тому есть многочисленные свидетельства. Ее явление людям позволило переломить ход войны и вычистить скверну даже до того, как подоспели основные части имперских сил.
- guid: 8d48c120-ad0d-457a-a7bf-20b8ebdee6fd
  event: Companions_Sororitas_43
  text: '"Миллионы людей были обязаны ей жизнью. Однако еретики, понимая, что терпят поражение, бросили все остатки сил против корабля с серебряной звездой. Он упал с небес в безвестном мире. Нет точных данных, сколько лет было в этот момент Ардженте. Некоторые хроники даже зовут ее Дитя-Святая, хотя достоверность их сомнительна. В любом случае, она прожила мало... но оставила яркий след. Как падающая звезда".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Миллионы людей были обязаны ей жизнью. Однако еретики, понимая, что терпят поражение, бросили все остатки сил против корабля с серебряной звездой. Он упал с небес в безвестном мире. Нет точных данных, сколько лет было в этот момент Ардженте. Некоторые хроники даже зовут ее Дитя-Святая, хотя достоверность их сомнительна. В любом случае, она прожила мало... но оставила яркий след. Как падающая звезда.
- guid: f3a94dab-8441-4b81-ae08-3a0c4a20ef0e
  event: Companions_Sororitas_44
  text: '"И мы разыскиваем те реликвии, что были утрачены. Ни ковен еретиков, ни самый страшный мир смерти не удержит сестер Пронатус, если их цель — возвращение великого наследия {g|Encyclopedia:Imperium}Империума{/g} в руки верных".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: И мы разыскиваем те реликвии, что были утрачены. Ни ковен еретиков, ни самый страшный мир смерти не удержит сестер Пронатус, если их цель — возвращение великого наследия Империума в руки верных.
- guid: 5093def1-aed1-4121-9df2-32cfa0d1ba2b
  event: Companions_Sororitas_45
  text: '{n}Недовольный огонь вспыхивает в глазах сестры, она складывает руки на груди.{/n} "Если такова воля Лорд-капитана..."'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Недовольный огонь вспыхивает в глазах сестры, она складывает руки на груди.
  - speaker: Sister Argenta
    text_clean: Если такова воля Лорд-капитана...
- guid: 747c5a90-e2fa-4552-b707-b784e30c174b
  event: Companions_Sororitas_46
  text: '{n}Арджента резко вздергивает подбородок.{/n} "Как вам будет угодно, Вольный Торговец".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента резко вздергивает подбородок.
  - speaker: Sister Argenta
    text_clean: Как вам будет угодно, Вольный Торговец.
- guid: a1629257-6289-4504-a62a-1e864e42b757
  event: Companions_Sororitas_47
  text: '"Да. Я готова! Попрошу лишь об одном, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}. Если мне будет дозволено, я хочу посетить хранилище священного {g|Encyclopedia:Warrant}Патента{/g} и преклонить колени перед реликвией, которой касался сам {g|Encyclopedia:Emperor}Император{/g}. Нам предстоит серьезный разговор... и я хочу помолиться перед святыней прежде, чем открою душу".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да. Я готова! Попрошу лишь об одном, Вольный Торговец. Если мне будет дозволено, я хочу посетить хранилище священного Патента и преклонить колени перед реликвией, которой касался сам Император. Нам предстоит серьезный разговор... и я хочу помолиться перед святыней прежде, чем открою душу.
- guid: 6aa1bc0d-bf3b-40e1-bf5a-55a89d63c25d
  event: Companions_Sororitas_48
  text: '"Что ж... я наберусь терпения, Вольный Торговец, и буду ждать".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Что ж... я наберусь терпения, Вольный Торговец, и буду ждать.
- guid: 5b9cd56a-5471-4b7b-9a90-5e46946f96f2
  event: Companions_Sororitas_49
  text: '"Стала"... это такое странное слово. Вроде и верное, но разве так говорят о предназначении? Если вопрос о том, каков был сам путь — об этом рассказать несложно. Сначала я, как и многие имперские сироты, прошла {g|Encyclopedia:ScholaProgenium}Схола Прогениум{/g}. Это были суровые годы, но я вспоминаю о них с радостью. Мало что сравнится с ощущением пройденного испытания, даже если после тело стонет от усталости или душа сжимается от боли".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Стала"... это такое странное слово. Вроде и верное, но разве так говорят о предназначении? Если вопрос о том, каков был сам путь — об этом рассказать несложно. Сначала я, как и многие имперские сироты, прошла Схола Прогениум. Это были суровые годы, но я вспоминаю о них с радостью. Мало что сравнится с ощущением пройденного испытания, даже если после тело стонет от усталости или душа сжимается от боли.
- guid: 63a251bb-2980-44b1-8235-0730d238208a
  event: Companions_Sororitas_50
  text: '"Я была одной из лучших среди сверстниц. И была отобрана для послушничества в рядах {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g}. В свой час прошла испытания и приняла обеты. Самый радостный день моей жизни! Свет {g|Encyclopedia:Emperor}Императора{/g} был со мной всегда, но принять его всем сердцем, произнести клятвы — это особое упоение".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я была одной из лучших среди сверстниц. И была отобрана для послушничества в рядах Адепта Сороритас. В свой час прошла испытания и приняла обеты. Самый радостный день моей жизни! Свет Императора был со мной всегда, но принять его всем сердцем, произнести клятвы — это особое упоение.
- guid: 804a098a-0471-4731-837f-d119c9a51cfa
  event: Companions_Sororitas_51
  text: '"В последнем путешествии мне запомнился сенешаль Версериан — он несколько раз заходил справиться о моем здоровье. Добрый человек, верный слуга {g|Encyclopedia:Imperium}Империума{/g}. Кажется, он одинаково дотошно относится к инспекции систем логистики и проверке здоровья случайно оказавшихся на корабле {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g}!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В последнем путешествии мне запомнился сенешаль Версериан — он несколько раз заходил справиться о моем здоровье. Добрый человек, верный слуга Империума. Кажется, он одинаково дотошно относится к инспекции систем логистики и проверке здоровья случайно оказавшихся на корабле Адепта Сороритас!
- guid: 4977fe61-7759-477c-bf44-b728aa472736
  event: Companions_Sororitas_52
  text: '"Известных мне — нет, но ордена {g|Encyclopedia:AdeptaSororitas}Сестринства{/g} многочисленны и могут действовать независимо друг от друга, направляя сестер туда, где {g|Encyclopedia:AdeptusMinistorum}Экклезиархия{/g} видит в них нужду. Может быть, где-то в свите {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g}, да будет путь его благословен, есть мои сестры? Я бы хотела, чтобы это было так — даже один вечер совместных молитв и тренировок принес бы мне радость!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Известных мне — нет, но ордена Сестринства многочисленны и могут действовать независимо друг от друга, направляя сестер туда, где Экклезиархия видит в них нужду. Может быть, где-то в свите Лорд-инквизитора, да будет путь его благословен, есть мои сестры? Я бы хотела, чтобы это было так — даже один вечер совместных молитв и тренировок принес бы мне радость!
- guid: c31cb5b5-31c7-481b-b695-15d7b1d9b2d5
  event: Companions_Sororitas_53
  text: '"Орден отправил меня на станцию {g|Encyclopedia:Footfall}Футфол{/g}. Мой долг заключался в помощи местным братьям-{g|Encyclopedia:Drusians}друзианцам{/g} со старым реликварием, оставшемся еще со времен Парсимуса Девейна, основателя станции".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Орден отправил меня на станцию Футфол. Мой долг заключался в помощи местным братьям-друзианцам со старым реликварием, оставшемся еще со времен Парсимуса Девейна, основателя станции.
- guid: 78a6cd0c-0503-4f69-8b2c-920d45322865
  event: Companions_Sororitas_54
  text: '"Если появятся новые — не стоит держать их в себе! Интерес к святости есть добродетель".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Если появятся новые — не стоит держать их в себе! Интерес к святости есть добродетель.
- guid: 18d17c11-024d-47be-8781-0431a07c4e1c
  event: Companions_Sororitas_55
  text: '"Да. Это — начало ее жития. Известно, что она жила в мире, где произошло страшное восстание еретиков. Они уничтожили там все живое — кроме тех, кого святая Арджента смогла спасти при помощи Единственной звезды. И силы своей веры".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да. Это — начало ее жития. Известно, что она жила в мире, где произошло страшное восстание еретиков. Они уничтожили там все живое — кроме тех, кого святая Арджента смогла спасти при помощи Единственной звезды. И силы своей веры.
- guid: 36461d00-99a6-4d19-a433-eda0c378b81f
  event: Companions_Sororitas_56
  text: '{n}Глаза сестры вспыхивают.{/n} "Как же счастлива я буду наконец-то найти ответ, которым {g|Encyclopedia:AdeptusMinistorum}Экклезиархия{/g} задавалась тысячелетиями! Скорее бы отыскать дорогу на Салис Прайм... Губительные силы, без сомнения, нарочно мешают нам. Стоят на пути веры".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Глаза сестры вспыхивают.
  - speaker: Sister Argenta
    text_clean: Как же счастлива я буду наконец-то найти ответ, которым Экклезиархия задавалась тысячелетиями! Скорее бы отыскать дорогу на Салис Прайм... Губительные силы, без сомнения, нарочно мешают нам. Стоят на пути веры.
- guid: 5728af0f-f8f2-4904-8a95-1379ba1a79e4
  event: Companions_Sororitas_57
  text: '"Разыскать путь к планете Салис Прайм. Там находится упавший корабль святой Ардженты, моей покровительницы. И там должна покоиться принадлежавшая ей великая реликвия — Единственная звезда".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Разыскать путь к планете Салис Прайм. Там находится упавший корабль святой Ардженты, моей покровительницы. И там должна покоиться принадлежавшая ей великая реликвия — Единственная звезда.
- guid: 5710617d-8995-4332-99de-36977c464a78
  event: Companions_Sororitas_58
  text: '{n}Глаза Ардженты непрестанно обшаривают окружение, будто в поисках скрытых врагов. Даже когда она останавливает взгляд на вашем лице, это выражение не исчезает.{/n} "Вольный Торговец".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Глаза Ардженты непрестанно обшаривают окружение, будто в поисках скрытых врагов. Даже когда она останавливает взгляд на вашем лице, это выражение не исчезает.
  - speaker: Sister Argenta
    text_clean: Вольный Торговец.
- guid: 709c548a-d947-4a2c-b7eb-77f98fc97def
  event: Companions_Sororitas_59
  text: '"Вольный Торговец! Как мне отрадно воссоединиться с {mf|избранником|избранницей} Императора!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольный Торговец! Как мне отрадно воссоединиться с избранником Императора!
- guid: aeee3a78-2b5e-43be-9f54-146bb4a1e881
  event: Companions_Sororitas_60
  text: '"Я даже не пыталась! Зачем мне знать что-либо про мерзость врагов человечества, когда все чего я хочу — сжечь здесь все в чистом, яростном пламени? Все, что мне нужно, я уже знаю — это место есть зло, но и в нем встречаются слуги Императора, достойные спасения".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я даже не пыталась! Зачем мне знать что-либо про мерзость врагов человечества, когда все чего я хочу — сжечь здесь все в чистом, яростном пламени? Все, что мне нужно, я уже знаю — это место есть зло, но и в нем встречаются слуги Императора, достойные спасения.
- guid: 078289b8-1fe7-421e-8632-afccf75373fc
  event: Companions_Sororitas_61
  text: '"Мы бы нашли выход, если бы объединили усилия с собратом по вере, а не отвратительным чудовищем! Но теперь Комиссар мертв, а мы — сами по себе".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мы бы нашли выход, если бы объединили усилия с собратом по вере, а не отвратительным чудовищем! Но теперь Комиссар мертв, а мы — сами по себе.
- guid: e39ba083-acd2-4f72-beb3-2f02fd0f63cf
  event: Companions_Sororitas_62
  text: '"Нужно. И я клянусь биться ради этого и не терять надежды даже... даже когда ложь, скверна и предательство окружают со всех сторон!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Нужно. И я клянусь биться ради этого и не терять надежды даже... даже когда ложь, скверна и предательство окружают со всех сторон!
- guid: d92354cb-b79c-4dec-8aef-313a1918d927
  event: Companions_Sororitas_63
  text: '"Да пребудет с тобою свет Терры, Вольный Торговец!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да пребудет с тобою свет Терры, Вольный Торговец!
- guid: 42c644c9-a8c9-4c44-94e0-7f77f1c2f516
  event: Companions_Sororitas_64
  text: '"Следуя за тобой в пламя битвы, я получу шанс на очищение. А это — все, чего я желаю, все, о чем молю. Праведная гибель — и за ней покой, если Он решит даровать его недостойной дочери".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Следуя за тобой в пламя битвы, я получу шанс на очищение. А это — все, чего я желаю, все, о чем молю. Праведная гибель — и за ней покой, если Он решит даровать его недостойной дочери.
- guid: 04205aab-9d8e-455e-adf3-04392bfe480f
  event: Companions_Sororitas_65
  text: '{n}Лицо Ардженты будто озарено изнутри, глаза сияют.{/n} "Я приветствую тебя, Вольный Торгвоец!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Лицо Ардженты будто озарено изнутри, глаза сияют.
  - speaker: Sister Argenta
    text_clean: Я приветствую тебя, Вольный Торгвоец!
- guid: b19acc1c-715c-4ee8-980f-9106c6a0ca12
  event: Companions_Sororitas_66
  text: '"Как никогда, Вольный Торговец! Мое место — на поле праведного боя, рядом с {mf|Избранником|Избранницей} Императора, что помог{mf||ла} мне пройти путь до конца и обрести святую реликвию! Веди, и я последую".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как никогда, Вольный Торговец! Мое место — на поле праведного боя, рядом с Избранником Императора, что помог мне пройти путь до конца и обрести святую реликвию! Веди, и я последую.
- guid: a1bc6a75-f724-4741-8b16-c62d4a046811
  event: Companions_Sororitas_67
  text: '"Сегодня — да. Но я не могу обещать вечно оставаться твоей спутницей. Так много зла, скрытого и явного, так много скверны и мерзости прячется за каждым углом! Я жажду смести его, искоренить. Везде, где найду, в любое время, любой ценой". {n}Глаза Ардженты опасно горят.{/n} "Тебя обременяет слишком много мелочных забот, Вольный Торговец. Моя дорога — прямее и неумолимее".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Сегодня — да. Но я не могу обещать вечно оставаться твоей спутницей. Так много зла, скрытого и явного, так много скверны и мерзости прячется за каждым углом! Я жажду смести его, искоренить. Везде, где найду, в любое время, любой ценой.
  - speaker: narrator
    text_clean: Глаза Ардженты опасно горят.
  - speaker: Sister Argenta
    text_clean: Тебя обременяет слишком много мелочных забот, Вольный Торговец. Моя дорога — прямее и неумолимее.
- guid: 48a1c4b7-e791-4a84-8b97-fc1c8ba24512
  event: Companions_Sororitas_68
  text: '"Конечно!" {n}— Арджента взволнованно вздыхает.{/n} "Ты помнишь первые дни атаки, когда нам удалось захватить одного из командиров еретиков? Он горел так ярко, что, должно быть, видно было на всем поле боя! Но особенно ценно то, что он успел рассказать до казни".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Конечно!
  - speaker: narrator
    text_clean: — Арджента взволнованно вздыхает.
  - speaker: Sister Argenta
    text_clean: Ты помнишь первые дни атаки, когда нам удалось захватить одного из командиров еретиков? Он горел так ярко, что, должно быть, видно было на всем поле боя! Но особенно ценно то, что он успел рассказать до казни.
- guid: 476fc4dd-b5ad-4052-b48f-ce89f5073ce9
  event: Companions_Sororitas_69
  text: '"Сгинувший еретик был одним из ближайших приспешников Кунрада Войгтвира. И он сообщил — прокричал сквозь боль — то, что я так давно стремилась узнать. Приметы маршрута к Салис Прайм, миру, куда я стремлюсь всем сердцем! Как бы ни пытались еретики Последнего восхода остановить нас — им это не удастся".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Сгинувший еретик был одним из ближайших приспешников Кунрада Войгтвира. И он сообщил — прокричал сквозь боль — то, что я так давно стремилась узнать. Приметы маршрута к Салис Прайм, миру, куда я стремлюсь всем сердцем! Как бы ни пытались еретики Последнего восхода остановить нас — им это не удастся.
- guid: f55d8feb-5a4d-47f5-a719-da9e7fdae1ca
  event: Companions_Sororitas_70
  text: '"Истинно так, Вольный Торговец".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Истинно так, Вольный Торговец.
- guid: 40aee646-5d4d-4cf2-836e-abdf2ee73756
  event: Companions_Sororitas_71
  text: '"Если хочешь ей добра, подари каплю совести и страха перед Императором — вот то, в чем она поистине нуждается. Ну а если хочешь порадовать... дай ей какое-нибудь бессмысленное украшение, дорогое и блестящее. Над сердцами вроде ее они имеют магическую власть".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Если хочешь ей добра, подари каплю совести и страха перед Императором — вот то, в чем она поистине нуждается. Ну а если хочешь порадовать... дай ей какое-нибудь бессмысленное украшение, дорогое и блестящее. Над сердцами вроде ее они имеют магическую власть.
- guid: f47b65bf-8ca4-4740-9167-45e652c8874d
  event: Companions_Sororitas_72
  text: '"Вольный Торговец!" {n}Глаза Ардженты горят испепеляющим пламенем оскорбленной веры.{/n} "Скверна и ересь проникли на борт этого пустотного корабля, словно насмехаясь над праведными! Ты тешишь себя мыслью о том, что пышущее скверной чудовище Архиврага покорно тебе, но подобными мыслями лишь позволяешь тьме проникнуть в самую душу, отравляя ее. Твой поступок не ведает ни объяснения, ни прощения — знай об этом!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольный Торговец!
  - speaker: narrator
    text_clean: Глаза Ардженты горят испепеляющим пламенем оскорбленной веры.
  - speaker: Sister Argenta
    text_clean: Скверна и ересь проникли на борт этого пустотного корабля, словно насмехаясь над праведными! Ты тешишь себя мыслью о том, что пышущее скверной чудовище Архиврага покорно тебе, но подобными мыслями лишь позволяешь тьме проникнуть в самую душу, отравляя ее. Твой поступок не ведает ни объяснения, ни прощения — знай об этом!
- guid: 1d66e102-f762-4ab1-9830-1445b82e1da5
  event: Companions_Sororitas_73
  text: '"Да убережет сердца наши от гнилых страстей и слабости духа...", — {n}едва слышно шепчет Арджента, не сводя глаз с отметины на вашей шее.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да убережет сердца наши от гнилых страстей и слабости духа..., —
  - speaker: narrator
    text_clean: едва слышно шепчет Арджента, не сводя глаз с отметины на вашей шее.
- guid: a3d1aa68-584c-44b0-8bdc-f8e6998b758a
  event: PRL_ArgentaRecruit_02
  text: '"Сестра Арджента!" {n}Голос сенешаля, кажется, выводит воительницу из боевого транса.{/n} "Сестра Арджента, рад видеть вас. Нам нужны все силы, какие мы сможем собрать!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Сестра Арджента!
    speaker_override: Abelard Werserian
  - speaker: narrator
    text_clean: Голос сенешаля, кажется, выводит воительницу из боевого транса.
