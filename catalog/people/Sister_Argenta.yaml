  event: ''
  text: '"Наконец-то!" {n}Арджента вскидывает оружие.{/n} "Да направит Он руку мою, ибо я есть гнев и возмездие Его!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Наконец-то!
  - speaker: narrator
    text_clean: Арджента вскидывает оружие.
  - speaker: Sister Argenta
    text_clean: Да направит Он руку мою, ибо я есть гнев и возмездие Его!
- guid: 1710dcf6-ecce-470f-8d3c-0c8c429f5404
  event: ''
  text: '{n}Арджента кивает. Взгляд ее прикован ко входу в корабль.{/n} "Лишь достойные, лишь те, кого примет святая, могут войти в эти врата. Недостойные будут отвергнуты. Я... я готова принять вердикт".'
  speaker: Sister Argenta
  parts:
