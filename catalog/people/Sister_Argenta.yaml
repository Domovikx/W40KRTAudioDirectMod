  event: ''
  text: '{n}Арджента стискивает оружие до хруста в костяшках.{/n} "{name}. Нет".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента стискивает оружие до хруста в костяшках.
  - speaker: Sister Argenta
