    text_clean: Ты уже знаешь ответ, еретик!
  - speaker: narrator
    text_clean: Арджента хватается за оружие.
- guid: 269e4db9-6ef5-4109-bcd3-3edd86116dc5
  event: ''
  text: '"Ну же, Вольный Торговец... почему мы тратим время, когда все наши цели — на виду? Отдай... приказ..." {n}Арджента дрожит от желания пустить в ход оружие.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ну же, Вольный Торговец... почему мы тратим время, когда все наши цели — на виду? Отдай... приказ...
  - speaker: narrator
    text_clean: Арджента дрожит от желания пустить в ход оружие.
- guid: 2805e73b-c5dc-47d8-b854-a1ab2660ad72
  event: ''
  text: '{n}Арджента вскидывается при виде облаченного в черное старца.{/n} "Это — преподобный Иеронимус! Он решил вмешаться в уличную склоку, надо же..."'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента вскидывается при виде облаченного в черное старца.
  - speaker: Sister Argenta
    text_clean: Это — преподобный Иеронимус! Он решил вмешаться в уличную склоку, надо же...
- guid: 28e581bf-51af-4ebf-ae00-da95bea9bfa5
  event: ''
  text: '{n}Арджента мягко улыбается.{/n} "Благодарю тебя, отважный Ульфар. О более надежном и бдительном страже нельзя было бы и мечтать... Но сегодня мне не понадобятся твои мощь и товарищеское плечо".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента мягко улыбается.
  - speaker: Sister Argenta
    text_clean: Благодарю тебя, отважный Ульфар. О более надежном и бдительном страже нельзя было бы и мечтать... Но сегодня мне не понадобятся твои мощь и товарищеское плечо.
- guid: 290fb6c4-4714-4fc5-b9e4-8f29c74e283b
  event: ''
  text: '"Бог-Император, укрепи наше мужество против наваждения ксеносов, разожги в нас ненависть, чтобы сокрушить их волшбу!" {n}Арджента молится, не прерываясь ни на секунду, пораженная произошедшим.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Бог-Император, укрепи наше мужество против наваждения ксеносов, разожги в нас ненависть, чтобы сокрушить их волшбу!
  - speaker: narrator
    text_clean: Арджента молится, не прерываясь ни на секунду, пораженная произошедшим.
