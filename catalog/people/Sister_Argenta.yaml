- guid: 1ab839d6-47b9-4be4-9295-e6ca8ad3f2fe
  event: ''
  text: '"Там, где проповедовал еретик, вновь гремит Имперское кредо! Это наполняет меня радостью почти столь же глубокой, как битва с врагами Его". {n}Арджента и преподобная обмениваются полными благочестия взглядами.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Там, где проповедовал еретик, вновь гремит Имперское кредо! Это наполняет меня радостью почти столь же глубокой, как битва с врагами Его.
  - speaker: narrator
    text_clean: Арджента и преподобная обмениваются полными благочестия взглядами.
- guid: 1d922152-fa1e-44ad-894f-990deab67b08
  event: ''
  text: '"Да эти заблудшие позабыли истинный лик Бога-Императора! Все, что несчастным досталось в память о Его благословении и могуществе — лишь священная аквила". {n}Арджента сокрушенно качает головой.{/n} "Каллигосу Винтерскейлу стоило бы заботиться о просвещении своих миров вместо удовлетворения охотничьего азарта".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да эти заблудшие позабыли истинный лик Бога-Императора! Все, что несчастным досталось в память о Его благословении и могуществе — лишь священная аквила.
  - speaker: narrator
    text_clean: Арджента сокрушенно качает головой.
  - speaker: Sister Argenta
    text_clean: Каллигосу Винтерскейлу стоило бы заботиться о просвещении своих миров вместо удовлетворения охотничьего азарта.
- guid: 1e677ae5-d8c5-45a0-9c1f-aa552d4c7f6f
  event: ''
  text: '{n}Арджента отвечает ей взглядом спокойных и ясных глаз.{/n} "Я знаю".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента отвечает ей взглядом спокойных и ясных глаз.
  - speaker: Sister Argenta
    text_clean: Я знаю.
- guid: 1e8187a9-1712-431a-865a-2cd0f66247b6
  event: ''
  text: '"Святой Трон! Прости и спаси нас... Бог-Император!" {n}Сестра Арджента замирает в молитве, сложив руки в аквилу.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Святой Трон! Прости и спаси нас... Бог-Император!
  - speaker: narrator
    text_clean: Сестра Арджента замирает в молитве, сложив руки в аквилу.
- guid: 1e8f53a2-a596-475f-bb71-76d92215669d
  event: ''
  text: '"Вольный Торговец!" {n}Сестра Арджента приветствует вас горящим взором и уверенной улыбкой на губах.{/n} "Бог-Император не оставил сво{mf|его|ю} избранни{mf|ка|цу}! Я молилась о том, чтобы наши пути вновь пересеклись!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольный Торговец!
  - speaker: narrator
    text_clean: Сестра Арджента приветствует вас горящим взором и уверенной улыбкой на губах.
  - speaker: Sister Argenta
    text_clean: Бог-Император не оставил своего избранника! Я молилась о том, чтобы наши пути вновь пересеклись!
- guid: 1ff3992c-263b-4660-b9e6-2556f2a625af
  event: ''
  text: '{n}Арджента вздыхает, удрученно качая головой.{/n} "Бог-Император, прости этому грешному скудоумие его".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента вздыхает, удрученно качая головой.
  - speaker: Sister Argenta
    text_clean: Бог-Император, прости этому грешному скудоумие его.
- guid: 21e9620c-b39b-4188-8f3c-cfef7c010dab
  event: ''
  text: '{n}Арджента мрачно оглядывает темные туннели.{/n} "Красться в тенях, таиться от битвы... недостойно воинов Его. Но ради спасения невинных я усмирю пламя в душе, требующее ворваться в стан врага в открытую".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента мрачно оглядывает темные туннели.
  - speaker: Sister Argenta
    text_clean: Красться в тенях, таиться от битвы... недостойно воинов Его. Но ради спасения невинных я усмирю пламя в душе, требующее ворваться в стан врага в открытую.
- guid: 22cfecc5-1b1b-4ace-a123-77846f4e75c2
  event: ''
  text: '{n}Арджента вскидывает подбородок.{/n} "Вот как? Что ж. Зная, как ты цацкаешься с ересью... в следующий раз, когда мы встретимся, я вряд ли окажу тебе милость и отпущу тебя невредим{mf|ым|ой}. Пусть Бог-Император смилостивится и наставит тебя на путь истинный!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента вскидывает подбородок.
  - speaker: Sister Argenta
    text_clean: Вот как? Что ж. Зная, как ты цацкаешься с ересью... в следующий раз, когда мы встретимся, я вряд ли окажу тебе милость и отпущу тебя невредимым. Пусть Бог-Император смилостивится и наставит тебя на путь истинный!
- guid: 23546b72-486f-4ab8-9a45-1b2f415cf3f7
  event: ''
  text: '{n}Арджента в сердцах топает ногой и цедит сквозь зубы:{/n} "Как вам будет угодно. Преподобный Иеронимус! Я пойду... помолюсь в храме. Поговорим после, когда благородн{mf|ый|ая} {name} удалится".'
  speaker: Sister Argenta
