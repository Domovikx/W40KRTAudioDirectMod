- guid: 019a2eaf-ffd0-40f5-a5e7-9a585d04d38a
  event: ''
  text: '"И мне пришлось самой отвратить тебя от чудовищной ереси, Вольный Торговец! Иначе бы..." {n}Арджента перехватывает оружие с выразительным выражением лица, ее пылающие глаза устремлены прямо на вас.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: И мне пришлось самой отвратить тебя от чудовищной ереси, Вольный Торговец! Иначе бы...
  - speaker: narrator
    text_clean: Арджента перехватывает оружие с выразительным выражением лица, ее пылающие глаза устремлены прямо на вас.
- guid: 0452b9f1-f925-4547-b1b2-2d1ba2dbf662
  event: ''
  text: '{n}Арджента хмурится.{/n} "Верные почитают Императора под множеством имен и множеством способов. Но... мне не нравится эта молитва".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента хмурится.
  - speaker: Sister Argenta
    text_clean: Верные почитают Императора под множеством имен и множеством способов. Но... мне не нравится эта молитва.
- guid: 0958bb27-5d99-493b-82bb-15536504cc6c
  event: ''
  text: '{n}Арджента стискивает зубы.{/n} "Эта... еретичка не в первый раз становится причиной гибели экипажа. Помнишь бедствие на средней палубе, Идира? Чем те честные люди заслужили обратиться в мутантов и напасть на свои же семьи? Ты — чудовище. Еретик. Если в тебе осталась хоть капля человеческого — признай это!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента стискивает зубы.
  - speaker: Sister Argenta
    text_clean: Эта... еретичка не в первый раз становится причиной гибели экипажа. Помнишь бедствие на средней палубе, Идира? Чем те честные люди заслужили обратиться в мутантов и напасть на свои же семьи? Ты — чудовище. Еретик. Если в тебе осталась хоть капля человеческого — признай это!
- guid: 0aebae22-ae4e-4e84-9164-93bac4285a36
  event: ''
  text: '{n}Арджента подходит и кладет руку вам на плечо.{/n} "Да будет так, Вольный Торговец. Перед Патентом, воплощением воли Императора, отмеченным Его собственной рукой, я клянусь не отступиться, пока святыня не будет возвращена, а еретики — наказаны. И да пребудет свет со мной и вами на этом пути!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента подходит и кладет руку вам на плечо.
  - speaker: Sister Argenta
    text_clean: Да будет так, Вольный Торговец. Перед Патентом, воплощением воли Императора, отмеченным Его собственной рукой, я клянусь не отступиться, пока святыня не будет возвращена, а еретики — наказаны. И да пребудет свет со мной и вами на этом пути!
- guid: 0b40bebf-8463-46a8-959a-2c464b00ba74
  event: ''
  text: '{n}Арджента обводит рукой собравшихся.{/n} "Твое прибытие очень своевременно: с избранни{mf|ком|цей} Императора на нашей стороне мы можем перестать таиться и воздать врагам Человечества по заслугам! Но я не буду тратить твое время зря: поговори с Комиссаром, предводителем этих отважных душ. Он расскажет тебе все, что надо знать".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента обводит рукой собравшихся.
  - speaker: Sister Argenta
    text_clean: 'Твое прибытие очень своевременно: с избранником Императора на нашей стороне мы можем перестать таиться и воздать врагам Человечества по заслугам! Но я не буду тратить твое время зря: поговори с Комиссаром, предводителем этих отважных душ. Он расскажет тебе все, что надо знать.'
- guid: 0bc616cc-cbbb-4aa2-bbfa-0c96c4c8dbf9
  event: ''
  text: '{n}Арджента отшатывается, как от удара, но затем делает шаг вперед, хватает культиста за загривок и заставляет посмотреть ей прямо в глаза, полыхающие, как уголья.{/n} "Я — одна из {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g}. И я никогда, никогда в жизни не бежала от еретиков и предателей рода человеческого".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента отшатывается, как от удара, но затем делает шаг вперед, хватает культиста за загривок и заставляет посмотреть ей прямо в глаза, полыхающие, как уголья.
  - speaker: Sister Argenta
    text_clean: Я — одна из Адепта Сороритас. И я никогда, никогда в жизни не бежала от еретиков и предателей рода человеческого.
- guid: 0fd740d2-11cf-436f-a2f4-4f6a3fc8c1d3
  event: ''
  text: '"Вымаливать облегчение участи, возложенной на них с рождения! Может, стоит поставить им в пример сестер Ордена Доблестного Сердца? Те не дозволяют даже притупить боль при врачевании — каково бы ни…" {n}Арджента осекается, словно устыдившись собственной суровости.{/n} "Впрочем… сравнение несправедливо к простым работягам. Быть может, им и правда пригодится помощь."'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вымаливать облегчение участи, возложенной на них с рождения! Может, стоит поставить им в пример сестер Ордена Доблестного Сердца? Те не дозволяют даже притупить боль при врачевании — каково бы ни…
  - speaker: narrator
    text_clean: Арджента осекается, словно устыдившись собственной суровости.
  - speaker: Sister Argenta
    text_clean: Впрочем… сравнение несправедливо к простым работягам. Быть может, им и правда пригодится помощь.
- guid: 102c7535-daa8-4ca0-8381-16b4ddfbd853
  event: ''
  text: '{n}Арджента даже отшатывается на миг. Затем ее темные глаза вспыхивают:{/n} "Как смеешь ты меня в чем-то упрекать?! Речь о пособничестве Хаосу! Человека, который себя им запятнал, ничем не оправдать!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: 'Арджента даже отшатывается на миг. Затем ее темные глаза вспыхивают:'
  - speaker: Sister Argenta
    text_clean: Как смеешь ты меня в чем-то упрекать?! Речь о пособничестве Хаосу! Человека, который себя им запятнал, ничем не оправдать!
- guid: 119b5e9e-1e05-43b2-a0b2-08a9c76023de
  event: ''
  text: '{n}Арджента с горечью смотрит на солдата, словно видит рану, которую не перевязать. Ее голос наполнен торжественным фатализмом.{/n} "Невыносимо видеть, как здешних солдат поразила одна из самых гнусных и заразных болезней — страх! Не подхвати и ты ее, {name}."'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Арджента с горечью смотрит на солдата, словно видит рану, которую не перевязать. Ее голос наполнен торжественным фатализмом.
  - speaker: Sister Argenta
    text_clean: Невыносимо видеть, как здешних солдат поразила одна из самых гнусных и заразных болезней — страх! Не подхвати и ты ее, КЭП.
- guid: 137f6523-e4b1-43f0-8c39-ddaa3a5c50c5
  event: ''
  text: '"Стой, {name}!" {n}Арджента потрясенно смотрит на вас.{/n} "Он — наш друг и слуга Императора, зачем вредить ему?"'
