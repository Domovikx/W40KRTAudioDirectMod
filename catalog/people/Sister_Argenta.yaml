  event: Companions_Sororitas_23
  text: '"И несущие утешение госпитальерки, и многомудрые сестры диалогус знают, как встречать врагов Человечества. "Диалог", что они ведут с еретиками, обычно короток, и последнее слово в нем — залп болтера!"'
