    text_clean: Арджента кивает. Взгляд ее прикован ко входу в корабль.
  - speaker: Sister Argenta
    text_clean: Лишь достойные, лишь те, кого примет святая, могут войти в эти врата. Недостойные будут отвергнуты. Я... я готова принять вердикт.
