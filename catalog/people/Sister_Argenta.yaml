- guid: ef8f681b-55b8-4d7c-beab-ad9510be0c23
  event: BNTRS_AreaStressful_Argenta_86
  text: '"Покаяние в тюрьме — тень истинного преображения души. Только в бою, отринув плотское и облачив душу пламенем, можно заслужить прощение".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Покаяние в тюрьме — тень истинного преображения души. Только в бою, отринув плотское и облачив душу пламенем, можно заслужить прощение.
- guid: b04ae8c1-3a20-46f9-87a3-673d49d015c1
  event: BNTRS_Chapter1_Argenta_04
  text: '"Пока сильны слуги Омниссии и стойка вера монахов Электродинамической Обители, скверна не посмеет больше коснуться ее".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Пока сильны слуги Омниссии и стойка вера монахов Электродинамической Обители, скверна не посмеет больше коснуться ее.
- guid: f0e0423e-38f5-4c0a-afd9-f525e3483b27
  event: BNTRS_Chapter1_Argenta_10
  text: '"Поступок Эвейна был благороден, но безрассуден. Нельзя спасти того, кто добровольно обратился к ереси".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Поступок Эвейна был благороден, но безрассуден. Нельзя спасти того, кто добровольно обратился к ереси.
- guid: 0f812f20-f28d-4985-9cec-2851b1748efd
  event: BNTRS_Chapter1_Argenta_15
  text: '"Планетарный бунт... как можно было допустить восстание еретиков такого масштаба? Неужто Райкад лишен зрячих и верных, что могли бы поднять тревогу?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Планетарный бунт... как можно было допустить восстание еретиков такого масштаба? Неужто Райкад лишен зрячих и верных, что могли бы поднять тревогу?
- guid: 76ebe4e1-f8f1-4dc4-9267-9cdcd47b6cee
  event: BNTRS_Chapter1_Argenta_23
  text: '"Тебя что-то тревожит, Кассия? Не бойся — я защищу тебя от любого еретика, осмелившегося покуситься на зрящую Его свет!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тебя что-то тревожит, Кассия? Не бойся — я защищу тебя от любого еретика, осмелившегося покуситься на зрящую Его свет!
- guid: f04c5f62-60df-4fda-a84c-de42818e58d6
  event: BNTRS_Chapter1_Argenta_29
  text: '"Я возношу молитвы за души невинных. И за то, чтоб души виновных не обрели покоя".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я возношу молитвы за души невинных. И за то, чтоб души виновных не обрели покоя.
- guid: 6f01795a-5c78-4a4b-93fb-a808a4f5dabf
  event: BNTRS_Chapter1_Argenta_34
  text: '"Чем гуще мрак, тем ярче пламя в наших сердцах! Сплотимся перед ликом катастрофы!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Чем гуще мрак, тем ярче пламя в наших сердцах! Сплотимся перед ликом катастрофы!
- guid: 9eb8f8c1-9514-4336-833e-8a14f24b0345
  event: BNTRS_Chapter1_Argenta_38
  text: '"В служении Ему найдут они силу и стойкость. Только так отвратят сердца свои от слабостей, что ведут к ересям".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В служении Ему найдут они силу и стойкость. Только так отвратят сердца свои от слабостей, что ведут к ересям.
- guid: f41f1513-7283-4993-93ea-ab03f38212db
  event: BNTRS_Chapter1_Argenta_41
  text: '"Избавь меня от своих стенаний, ведьма. Каждый голос, что звучит в твоем сознании — шепот Архиврага!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Избавь меня от своих стенаний, ведьма. Каждый голос, что звучит в твоем сознании — шепот Архиврага!
- guid: 5dc74c4a-9445-43a2-9696-869471d206a9
  event: BNTRS_Chapter1_Argenta_50
  text: '"Истинно верующие найдут общий язык — если не на словах, то в общем желании очистить этот мир от скверны!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Истинно верующие найдут общий язык — если не на словах, то в общем желании очистить этот мир от скверны!
- guid: ea2c38ad-22ca-4941-b6a5-12c9de5111df
  event: BNTRS_Chapter1_Argenta_59
  text: '"Мне жаль слабых и невинных, что стали жертвами чужих грехов... лучше сражаться на передовой, чем принимать те решения, что выпадают сенешалю".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мне жаль слабых и невинных, что стали жертвами чужих грехов... лучше сражаться на передовой, чем принимать те решения, что выпадают сенешалю.
- guid: 1a82b338-302c-4a71-a6b7-bb639236bf35
  event: BNTRS_Chapter2_Argenta_06
  text: '"Как странно слышать от ксеноса рассуждения о скверне. Вы сами — нечистые творения, и все же опасаетесь того же, с чем ведем непримиримую войну мы".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как странно слышать от ксеноса рассуждения о скверне. Вы сами — нечистые творения, и все же опасаетесь того же, с чем ведем непримиримую войну мы.
- guid: 02f20101-0dcc-4aa4-8144-16fb1eb68a9f
  event: BNTRS_Chapter2_Argenta_10
  text: '"Когда придет время, мы встанем несокрушимой стеной на пути скверны, что охватила этот мир. Мы не отдадим Архиврагу больше и пяди!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Когда придет время, мы встанем несокрушимой стеной на пути скверны, что охватила этот мир. Мы не отдадим Архиврагу больше и пяди!
- guid: 3b8a20f5-e224-4caa-8fdb-5df44f22529b
  event: BNTRS_Chapter2_Argenta_104
  text: '"В один день сила твоего обещания иссякнет, словно пересохший родник. Я молюсь, что в тот день я буду рядом... чтобы прекратить эту ересь. Раз и навсегда".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В один день сила твоего обещания иссякнет, словно пересохший родник. Я молюсь, что в тот день я буду рядом... чтобы прекратить эту ересь. Раз и навсегда.
- guid: cebf09b8-dbed-47dd-bfd1-326df89872cd
  event: BNTRS_Chapter2_Argenta_106
  text: '"Ответ мы получим только когда нечестивый морок вновь явится на корабль и заберет в пасть Архиврага новые невинные жертвы".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ответ мы получим только когда нечестивый морок вновь явится на корабль и заберет в пасть Архиврага новые невинные жертвы.
- guid: 2967a62b-87ca-4de8-b61d-cc094e456f59
  event: BNTRS_Chapter2_Argenta_111
  text: '"День, когда ведьма отправляется в небытие, должен отмечаться как праздник".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: День, когда ведьма отправляется в небытие, должен отмечаться как праздник.
- guid: edb2a720-9e55-4b0f-94e2-5c48d834fd58
  event: BNTRS_Chapter2_Argenta_116
  text: '"Отрекшиеся от Него при жизни не достойны Его милости в посмертии".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Отрекшиеся от Него при жизни не достойны Его милости в посмертии.
- guid: e632693b-64d3-4f53-b160-8240e6e58c15
  event: BNTRS_Chapter2_Argenta_126
  text: '"Путь Избранни{mf|ка|цы} Императора делает странные извивы... но пока твое сердце преисполнено веры, я приветствую тебя в наших рядах".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Путь Избранника Императора делает странные извивы... но пока твое сердце преисполнено веры, я приветствую тебя в наших рядах.
- guid: 29baaf6e-5fcb-4a27-9536-9db5ec056f58
  event: BNTRS_Chapter2_Argenta_132
  text: '"Каждый слуга Империума должен исполнять предписанный ему долг... и сердце мое радуется от того, что мой долг — уничтожать ересь, а не гнить среди бумаг".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Каждый слуга Империума должен исполнять предписанный ему долг... и сердце мое радуется от того, что мой долг — уничтожать ересь, а не гнить среди бумаг.
- guid: 7edfc37a-c26b-498a-80e6-2d78464e8856
  event: BNTRS_Chapter2_Argenta_147
  text: '"Ксенос среди людей... пригласить ее к себе все равно что пригреть змею на груди".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ксенос среди людей... пригласить ее к себе все равно что пригреть змею на груди.
- guid: f05eb6f5-ae85-4352-9c8a-56e74261d8c1
  event: BNTRS_Chapter2_Argenta_15
  text: '"Даргонус подвергся атаке ксеносов, но устоял! Это ли не знак того, что Бог-Император защищает истово верующих".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Даргонус подвергся атаке ксеносов, но устоял! Это ли не знак того, что Бог-Император защищает истово верующих.
- guid: 79adfaff-2022-40b3-99ea-5d550cdd4666
  event: BNTRS_Chapter2_Argenta_28
  text: '"Я дрожу от ярости, вспоминая, что этот еретик посягал на святой Патент! День, когда мы предадим его смерти, будет моим личным праздником".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я дрожу от ярости, вспоминая, что этот еретик посягал на святой Патент! День, когда мы предадим его смерти, будет моим личным праздником.
- guid: b06235e9-a9d8-4776-a2c1-e7d86e1081e8
  event: BNTRS_Chapter2_Argenta_30
  text: '"Священный экстерминатус... я впервые видела его во всем его огненном величии..."'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Священный экстерминатус... я впервые видела его во всем его огненном величии...
- guid: 32195520-6d6b-488e-ad5d-9a8cdc25cc83
  event: BNTRS_Chapter2_Argenta_58
  text: '"Благородные семьи тратят силы и время на нелепую борьбу за власть, а должны бы — на укрепление воинской мощи и святой веры".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Благородные семьи тратят силы и время на нелепую борьбу за власть, а должны бы — на укрепление воинской мощи и святой веры.
- guid: a8197fff-7433-4414-ba68-32de01337b9f
  event: BNTRS_Chapter2_Argenta_62
  text: '"Проповедники хулы и скверны выискивают сердца и умы послабее, дабы заронить туда семена ереси. Будем молиться о том, что во владениях фон Валанциус более не найдется таковых".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Проповедники хулы и скверны выискивают сердца и умы послабее, дабы заронить туда семена ереси. Будем молиться о том, что во владениях фон Валанциус более не найдется таковых.
- guid: 1e75ba8a-031f-4cd5-9663-5865da5e2f83
  event: BNTRS_Chapter2_Argenta_66
  text: '"Гибель "Йесевона" — ужасная утрата. Миллионы паломников сгинули во мраке ереси, унеся с собой искру Его".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Гибель "Йесевона" — ужасная утрата. Миллионы паломников сгинули во мраке ереси, унеся с собой искру Его.
- guid: e4cfe94c-f30d-4107-a2d7-d5f9f9274725
  event: BNTRS_Chapter2_Argenta_73
  text: '"Архивраг не дремлет ни мгновения, высматривая, где бы нанести удар по верным. Этот корабль — лишь еще один пример из массы, напоминание о том, что у нас нет права терять бдительность".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Архивраг не дремлет ни мгновения, высматривая, где бы нанести удар по верным. Этот корабль — лишь еще один пример из массы, напоминание о том, что у нас нет права терять бдительность.
- guid: 6305c0de-c15c-4e85-af79-f64e1be8aea3
  event: BNTRS_Chapter2_Argenta_76
  text: '"Я там, где требуется гнев Его, что опалит нечестивое, изгонит скверное и очистит скорбные юдоли слуг его".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я там, где требуется гнев Его, что опалит нечестивое, изгонит скверное и очистит скорбные юдоли слуг его.
- guid: 8b781019-40ec-4497-97ed-fa71e055efb1
  event: BNTRS_Chapter2_Argenta_78
  text: '"Молитва у священного Патента наполнила меня решимостью исполнить свою миссию... с поддержкой Вольного Торговца я вырву святыню из рук еретиков!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Молитва у священного Патента наполнила меня решимостью исполнить свою миссию... с поддержкой Вольного Торговца я вырву святыню из рук еретиков!
- guid: e4405175-456c-4924-a85a-2579531a03eb
  event: BNTRS_Chapter2_Argenta_82
  text: '"Почему он узнал мое лицо, ведьма? Надо думать — потому, что часто видел его в кошмарах. Надеюсь, и к тебе они приходят".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Почему он узнал мое лицо, ведьма? Надо думать — потому, что часто видел его в кошмарах. Надеюсь, и к тебе они приходят.
- guid: d1d496f2-47ea-4993-a6c0-d3ea7a973d45
  event: BNTRS_Chapter2_Argenta_91
  text: '"Навигаторы, зрящие золотой свет сквозь тьму и безумие, не должны быть подвержены распрям! Величие их миссии должно беречь от низменных порывов, разве не так?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Навигаторы, зрящие золотой свет сквозь тьму и безумие, не должны быть подвержены распрям! Величие их миссии должно беречь от низменных порывов, разве не так?
- guid: 9c087a5e-b930-43b5-9605-69fa237b4289
  event: BNTRS_Chapter2_Argenta_98
  text: '"Нечестивые голоса из мрака не в восторге от триумфального возвращения слуг Его из обители ереси? Вот ведь удивительно!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Нечестивые голоса из мрака не в восторге от триумфального возвращения слуг Его из обители ереси? Вот ведь удивительно!
- guid: ca1036bf-1f09-43f9-beb5-7faacdb83c53
  event: BNTRS_Chapter3_Argenta_03
  text: '"Сенешаль Версериан. Я рада, что вы все еще с нами и не утратили твердости".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Сенешаль Версериан. Я рада, что вы все еще с нами и не утратили твердости.
- guid: 42ae248e-9313-4a04-b5e7-34b40764df39
  event: BNTRS_Chapter3_Argenta_11
  text: '"О как я жду блаженного мига, когда предатель Кунрад Войгтвир понесет заслуженное наказание".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: О как я жду блаженного мига, когда предатель Кунрад Войгтвир понесет заслуженное наказание.
- guid: 6a266478-ebaf-4f0c-ac3a-c1f21312170b
  event: BNTRS_Chapter3_Argenta_117
  text: '"Что бы ни ждало нас впереди — исход любой битвы предрешен, ибо с нами — ангел Его!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Что бы ни ждало нас впереди — исход любой битвы предрешен, ибо с нами — ангел Его!
- guid: f33a456d-f0ce-4d95-ade8-949b6931c576
  event: BNTRS_Chapter3_Argenta_134
  text: '"Мы все повинны в грехе терпимости. Надеюсь, что смерть ее хоть немного облегчит бремя на наших душах".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мы все повинны в грехе терпимости. Надеюсь, что смерть ее хоть немного облегчит бремя на наших душах.
- guid: 2821dbb3-4a0f-43c0-aa57-09b72368b7df
  event: BNTRS_Chapter3_Argenta_143
  text: '"Единственное оправдание твоего существования — помощь тем, кого ты предала. Не забывай об этом".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Единственное оправдание твоего существования — помощь тем, кого ты предала. Не забывай об этом.
- guid: 61d45e22-d636-4246-af36-a890f5b96a5c
  event: BNTRS_Chapter3_Argenta_19
  text: '"Бог-Император не оставит верных своих. Мы близимся к выходу из этого лабиринта... я чувствую это всем сердцем".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Бог-Император не оставит верных своих. Мы близимся к выходу из этого лабиринта... я чувствую это всем сердцем.
- guid: 79b94fa7-4cda-4c58-a71e-cc9b199c81e8
  event: BNTRS_Chapter3_Argenta_29
  text: '"Теперь, когда душа моя избавлена от тягостной тайны, мне стало..."'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Теперь, когда душа моя избавлена от тягостной тайны, мне стало...
- guid: 13e222f5-d2bd-43ee-b984-8a8a7ea21f17
  event: BNTRS_Chapter3_Argenta_32
  text: '"Ярость бурлила во мне и нашла выход через смерть. Я не отыскала сил, чтобы прокричать правду в лицо миру. Но Вольный Торговец простил{mf||а} мое малодушие".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ярость бурлила во мне и нашла выход через смерть. Я не отыскала сил, чтобы прокричать правду в лицо миру. Но Вольный Торговец простил мое малодушие.
- guid: f5a8c44c-5811-44d1-b8f8-3af32834bf2e
  event: BNTRS_Chapter3_Argenta_36
  text: '"Ч... что? Ты... благодаришь меня за... отступись от меня, ибо мне не нужно твое одобрение!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ч... что? Ты... благодаришь меня за... отступись от меня, ибо мне не нужно твое одобрение!
- guid: 85e8c877-32ed-440a-975f-be5fc65002ef
  event: BNTRS_Chapter3_Argenta_39
  text: '"Да. По крайней мере, так мне казалось. Затем я поняла, что угодила из малой клетки в клетку крупнее... и мне предстояло найти путь уже из нее".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да. По крайней мере, так мне казалось. Затем я поняла, что угодила из малой клетки в клетку крупнее... и мне предстояло найти путь уже из нее.
- guid: 75164ff5-0978-4bd2-8169-098b1ceaae63
  event: BNTRS_Chapter3_Argenta_40
  text: '"Я вижу следы тяжких ран на вашем теле, магос. Ран, от которых не оправляются".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я вижу следы тяжких ран на вашем теле, магос. Ран, от которых не оправляются.
- guid: fc5d447a-cbad-4766-8179-d40c2e8336c1
  event: BNTRS_Chapter3_Argenta_45
  text: '"Вспоминай свет Астрономикона, Кассия. Вспоминай Его вечное святое сияние. Пускай память о нем поможет тебе проложить наш путь на свободу!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вспоминай свет Астрономикона, Кассия. Вспоминай Его вечное святое сияние. Пускай память о нем поможет тебе проложить наш путь на свободу!
- guid: 3ae2ed7e-1bb1-4662-ac5f-ea4c47966976
  event: BNTRS_Chapter3_Argenta_55
  text: '"Чем гуще мрак вокруг, тем ярче пламя в моей душе. Ибо я клялась быть маяком для верных, и даже смерть не освободит от этой клятвы".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Чем гуще мрак вокруг, тем ярче пламя в моей душе. Ибо я клялась быть маяком для верных, и даже смерть не освободит от этой клятвы.
- guid: 00976522-8afe-4c95-ad8d-9b4d653ed8ab
  event: BNTRS_Chapter3_Argenta_60
  text: '"Почему ты не осталась на попечении своего нового покровителя? Разве не была бы ты более счастлива там, где правит ересь?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Почему ты не осталась на попечении своего нового покровителя? Разве не была бы ты более счастлива там, где правит ересь?
- guid: c36910c6-8584-4fc0-a18c-464ec52234d5
  event: BNTRS_Chapter3_Argenta_68
  text: '"Твои мотивы и методы сотканы из тени, Джай... но, кажется, помогают тебе выжить даже в самых темных углах вселенной".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Твои мотивы и методы сотканы из тени, Джай... но, кажется, помогают тебе выжить даже в самых темных углах вселенной.
- guid: e238187e-faca-4e7e-bb67-0912d625c3e5
  event: BNTRS_Chapter3_Argenta_80
  text: '"Магнэ Ацессио была достойной избранни{mf|ка|цы} Императора. Но я рада, что мы покинули безопасные стены и вновь стремимся в пыл битвы!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Магнэ Ацессио была достойной избранника Императора. Но я рада, что мы покинули безопасные стены и вновь стремимся в пыл битвы!
- guid: edcde3ae-ea93-44f4-b333-f74d0759973a
  event: BNTRS_Chapter3_Argenta_84
  text: '"Пусть мерзость этого сквернавца не выделяет его в вашем сердце среди прочих его гнусных сородичей. Поступить так надо с каждым".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Пусть мерзость этого сквернавца не выделяет его в вашем сердце среди прочих его гнусных сородичей. Поступить так надо с каждым.
- guid: 75be478f-f0b7-4487-b881-7b319afd2da7
  event: BNTRS_Chapter4_Argenta_07
  text: '"Изничтожение ксеносов на Кетца Темере было долгом, который Вольный Торговец исполнил{mf||а} с честью. Ряды врагов Человечества скудеют — отрадная новость!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Изничтожение ксеносов на Кетца Темере было долгом, который Вольный Торговец исполнил с честью. Ряды врагов Человечества скудеют — отрадная новость!
- guid: 5435c095-a575-4c05-8e2a-406642203bdd
  event: BNTRS_Chapter4_Argenta_103
  text: '"Где-то в душе я знала: только мне под силу отыскать путь к месту последнего упокоения святой Ардженты. Теперь... мой долг исполнен".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: 'Где-то в душе я знала: только мне под силу отыскать путь к месту последнего упокоения святой Ардженты. Теперь... мой долг исполнен.'
- guid: dc240b83-c43f-46fe-89d8-9fa428ac9066
  event: BNTRS_Chapter4_Argenta_124
  text: '"Нельзя вверять свою судьбу порождению вредоносного ксеносского разума. Впрочем, если это избавит тебя от одержимости силами Архиврага..."'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Нельзя вверять свою судьбу порождению вредоносного ксеносского разума. Впрочем, если это избавит тебя от одержимости силами Архиврага...
- guid: 271253cc-01c7-4e4c-bdfb-c0dd6ffa73a3
  event: BNTRS_Chapter4_Argenta_142
  text: '"Ересь привлекает ересь. Почему я не удивлена".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ересь привлекает ересь. Почему я не удивлена.
- guid: 10380d74-69fa-4e5c-986b-335cdcf307c3
  event: BNTRS_Chapter4_Argenta_152
  text: '"Тебя ослепила гордыня, Паскаль. Так начинаются великие ереси — человек отвергает канон и заменяет веру в Него верой в себя".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тебя ослепила гордыня, Паскаль. Так начинаются великие ереси — человек отвергает канон и заменяет веру в Него верой в себя.
- guid: bc104395-7ba2-4e55-8c28-14f30cf53d38
  event: BNTRS_Chapter4_Argenta_169
  text: '"По крайней мере тебе ведомо некое подобие благодарности, ксенос. Вольный Торговец — единственная причина, почему ты все еще жива. Справедливо воздать {mf|ему|ей} по заслугам".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: По крайней мере тебе ведомо некое подобие благодарности, ксенос. Вольный Торговец — единственная причина, почему ты все еще жива. Справедливо воздать ему по заслугам.
- guid: 82d45b60-ac8b-4190-a43d-7a650c6c1660
  event: BNTRS_Chapter4_Argenta_20
  text: '"Спасение — следствие Его неизмеримой милости к верным делу Его, а не плод заключенных тобой сделок. Император не торгуется".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Спасение — следствие Его неизмеримой милости к верным делу Его, а не плод заключенных тобой сделок. Император не торгуется.
- guid: 066fa3ad-a721-45d0-b171-6b995cf7407f
  event: BNTRS_Chapter4_Argenta_25
  text: '"Я молю Бога-Императора, чтобы под главенством Инцендии Чорда Футфол прошел через все выпавшие ему испытания и очистился, восстав к жизни обновленным".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я молю Бога-Императора, чтобы под главенством Инцендии Чорда Футфол прошел через все выпавшие ему испытания и очистился, восстав к жизни обновленным.
- guid: 82efd8e5-8761-4b55-b9b7-69f29b968b7c
  event: BNTRS_Chapter4_Argenta_35
  text: '"Стремления Инцендии Чорда понятны мне, но то, как она воплощает их... мне сложно найти оправдание для насилия над теми, кто должен полагаться на защиту праведных".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Стремления Инцендии Чорда понятны мне, но то, как она воплощает их... мне сложно найти оправдание для насилия над теми, кто должен полагаться на защиту праведных.
- guid: 4d292a9e-7374-42df-83a3-a114b32bd40d
  event: BNTRS_Chapter4_Argenta_67
  text: '"Врагам Человечества нанесен удар. Достойное воздаяние за страдания, что эти чудовища причиняли невинным и слабым".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Врагам Человечества нанесен удар. Достойное воздаяние за страдания, что эти чудовища причиняли невинным и слабым.
- guid: a352497e-f2fd-4964-9246-4413015b0bc6
  event: BNTRS_Chapter4_Argenta_73
  text: '"Каллигос был из тех, для кого погибнуть в бою было величайшим желанием всей жизни. Что ж, его чаяние сбылось".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Каллигос был из тех, для кого погибнуть в бою было величайшим желанием всей жизни. Что ж, его чаяние сбылось.
- guid: 8e5a4b3c-c737-4fbb-a80a-4b22378d25da
  event: BNTRS_Chapter4_Argenta_83
  text: '"Ефрат осаждают силы Архиврага — значит, там место праведных. Те, кто сомневается и боится, могут отступиться — и дать дорогу истинным сынам и дочерям Его".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ефрат осаждают силы Архиврага — значит, там место праведных. Те, кто сомневается и боится, могут отступиться — и дать дорогу истинным сынам и дочерям Его.
- guid: 2ebd4fbf-9f99-4ac2-96cf-689f6f27f4f6
  event: BNTRS_Chapter4_Argenta_96
  text: '"Тайна места последнего упокоения моей покровительницы раскрыта. Я чувствую... покой. Какое удивительное, светлое чувство".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тайна места последнего упокоения моей покровительницы раскрыта. Я чувствую... покой. Какое удивительное, светлое чувство.
- guid: e82a7305-0139-4fdf-9e16-3d00d1381493
  event: BNTRS_Chapter4_Argenta_99
  text: '"На Салис Прайм мы сразили еще одного почитателя Последнего восхода... сколько еще таких еретиков разбросано по Простору? Сколько еще готовятся нанести удар?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: На Салис Прайм мы сразили еще одного почитателя Последнего восхода... сколько еще таких еретиков разбросано по Простору? Сколько еще готовятся нанести удар?
- guid: ee1e7bd4-57ac-461e-a418-705b3430b7be
  event: BNTRS_Chapter5_Argenta_16
  text: '"Брат Ульфар, не желаешь ли ты помолиться за то, чтобы души твоих братьев нашли свой путь к Золотому Трону?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Брат Ульфар, не желаешь ли ты помолиться за то, чтобы души твоих братьев нашли свой путь к Золотому Трону?
- guid: b5182c7b-5f94-43bc-bb5c-daa7338eba56
  event: BNTRS_Companion_DLC3_Argenta_25
  text: '"Твои изречения длинны, запутанны и велеречивы, генетор. Они сеют яд вольнодумства в податливых умах и сердцах, и заражают разум скверной. Прими епитимью и смири сердце в покаянии".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Твои изречения длинны, запутанны и велеречивы, генетор. Они сеют яд вольнодумства в податливых умах и сердцах, и заражают разум скверной. Прими епитимью и смири сердце в покаянии.
- guid: 17209cdf-386a-43ad-9ebd-b3ff835f0cdd
  event: BNTRS_Companion_DLC3_Argenta_48
  text: '"Опасно излишне задумываться о сущем, ибо размышления порождают сомнение. А от сомнения до ереси — один шаг".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Опасно излишне задумываться о сущем, ибо размышления порождают сомнение. А от сомнения до ереси — один шаг.
- guid: e9556111-3477-4bf6-b5da-566945779fba
  event: BNTRS_DLC2_Argenta_03
  text: '"Скажи, Соломон, ты никогда не колебался, вынося приговор? Никогда не просыпался среди ночи, пытаясь понять, насколько ты был безупречен в своих суждениях?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Скажи, Соломон, ты никогда не колебался, вынося приговор? Никогда не просыпался среди ночи, пытаясь понять, насколько ты был безупречен в своих суждениях?
- guid: 2ccc178d-d32c-41f1-a4e7-fca5465abc0c
  event: BNTRS_DLC2_Argenta_121
  text: '"Молчи, ведьма. Ты не знаешь, как раскаяние может снедать человека и что истинно верующие сами выбирают для себя наказание".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Молчи, ведьма. Ты не знаешь, как раскаяние может снедать человека и что истинно верующие сами выбирают для себя наказание.
- guid: 28ace607-d2e0-4095-b6cd-8af53a651725
  event: BNTRS_DLC2_Argenta_141
  text: '"Отрадно видеть, что ряды нашей свиты пополняются истово верующими слугами Его!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Отрадно видеть, что ряды нашей свиты пополняются истово верующими слугами Его!
- guid: 7de48d9b-4c82-4280-ae01-ec33ec9ed80f
  event: BNTRS_DLC2_Argenta_148
  text: '"Предвкушение битвы с еретиками переполняет силой и меня! Вперед!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Предвкушение битвы с еретиками переполняет силой и меня! Вперед!
- guid: 1fa00930-ffaf-4ac2-8d68-fdd45912e424
  event: BNTRS_DLC2_Argenta_177
  text: '"Эти люди должны были нести смерть врагам Человечества, но оказались заперты здесь. Сколько же из них погибло здесь, так и не вкусив радости битвы во имя Императора?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Эти люди должны были нести смерть врагам Человечества, но оказались заперты здесь. Сколько же из них погибло здесь, так и не вкусив радости битвы во имя Императора?
- guid: a3b1fd49-33bd-4548-adf2-57ca2411fed3
  event: BNTRS_DLC2_Argenta_192
  text: '"Даже тебя, нелюдь, я бы убила быстро — в этом разница между нечестивыми ксеносами и слугами Императора".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Даже тебя, нелюдь, я бы убила быстро — в этом разница между нечестивыми ксеносами и слугами Императора.
- guid: a11bc397-2f0b-4f3d-a462-f257622eca31
  event: BNTRS_DLC2_Argenta_196
  text: '"Мое служение не может быть закончено, пока в Просторе остается хоть один все еще дышащий еретик".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мое служение не может быть закончено, пока в Просторе остается хоть один все еще дышащий еретик.
- guid: 1b5fbd60-e39a-4ce1-bbac-75be9ef765f8
  event: BNTRS_DLC2_Argenta_202
  text: '"Я не ставлю под сомнение твои методы, но сострадание к невинным — не слабость. Мы должны защищать Его возлюбленных подданных".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я не ставлю под сомнение твои методы, но сострадание к невинным — не слабость. Мы должны защищать Его возлюбленных подданных.
- guid: 0e3f56ea-c896-493b-8cf6-0ea1d0bdc45b
  event: BNTRS_DLC2_Argenta_22
  text: '"Потому что мое сердце пылает верой и жаждой подвига во имя Его. Твое же лишь полнится перечнем законов".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Потому что мое сердце пылает верой и жаждой подвига во имя Его. Твое же лишь полнится перечнем законов.
- guid: e82b317c-2495-4ab5-a862-038fee31d415
  event: BNTRS_DLC2_Argenta_250
  text: '"Отринь сожаления! Былое не должно омрачать будущее, в котором мы сообща прокладываем путь к свободе — пламенем и сталью!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Отринь сожаления! Былое не должно омрачать будущее, в котором мы сообща прокладываем путь к свободе — пламенем и сталью!
- guid: d902b897-121d-4b1d-876f-99799903e134
  event: BNTRS_DLC2_Argenta_359
  text: '"За раз поглумилась и над священной верой, и над чужими чувствами. И ни капли стыда, ведьма".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: За раз поглумилась и над священной верой, и над чужими чувствами. И ни капли стыда, ведьма.
- guid: 077f6a4b-3daf-4d52-ab90-5ee367b6431e
  event: BNTRS_DLC2_Argenta_69
  text: '"Битва на "Бессердечном" была тяжелым испытанием, но мы победили! Что, как не триумф вопреки всему, вдохновляет на новые подвиги?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Битва на "Бессердечном" была тяжелым испытанием, но мы победили! Что, как не триумф вопреки всему, вдохновляет на новые подвиги?
- guid: 9ecd94ae-fc90-411e-974f-11c31fb17ba5
  event: BNTRS_DLC2_Argenta_74
  text: '"Вольному Торговцу стоило бы предать пиратский корабль очистительному огню. Даже обломок с этого судна может нести скверну!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольному Торговцу стоило бы предать пиратский корабль очистительному огню. Даже обломок с этого судна может нести скверну!
- guid: e1c195e3-62da-43e2-8b0f-386a47ed2497
  event: BNTRS_DLC2_Argenta_86
  text: '"Простые люди не всегда знают, кто ими правит. Уверена, на корабле Вольного Торговца еще не все знают, что Теодора мертва".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Простые люди не всегда знают, кто ими правит. Уверена, на корабле Вольного Торговца еще не все знают, что Теодора мертва.
- guid: f240ee07-145a-4709-a232-101f47fff045
  event: BNTRS_DLC2_Argenta_96
  text: '"Тот суд... Людям не дали шанса искупить свою вину в бою, сражаясь во имя Его. Смерть без покаяния в огне битвы — это неправильно".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тот суд... Людям не дали шанса искупить свою вину в бою, сражаясь во имя Его. Смерть без покаяния в огне битвы — это неправильно.
- guid: ed146748-97b3-463e-9405-bbe3a99136e6
  event: BNTRS_DLC3_Argenta_105
  text: '"Даже в самых невыносимых условиях слуг Бога-Императора согревает вера в их сердцах! И желание поразить врага Его, где бы тот ни прятался".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Даже в самых невыносимых условиях слуг Бога-Императора согревает вера в их сердцах! И желание поразить врага Его, где бы тот ни прятался.
- guid: 055afa1d-00f8-4804-9c27-fa168b35183e
  event: BNTRS_DLC3_Argenta_124
  text: '"Они пронесли свет веры сквозь тяжелый долг одиночества и покинутости. Это служение — одно из самых трудных и очищающих. Ты можешь верить этим подданным Бога-Императора".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Они пронесли свет веры сквозь тяжелый долг одиночества и покинутости. Это служение — одно из самых трудных и очищающих. Ты можешь верить этим подданным Бога-Императора.
- guid: 6d7c3ba1-eda1-48c1-8c87-953a0cf9d41d
  event: BNTRS_DLC3_Argenta_68
  text: '"Здесь нечего страшиться, Джай! Страдания есть удел всех, кто хочет сохранить свою душу чистой перед Его взором".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Здесь нечего страшиться, Джай! Страдания есть удел всех, кто хочет сохранить свою душу чистой перед Его взором.
- guid: 3839516f-798d-477d-a83c-c2b0ce1d8e21
  event: BNTRS_DLC3_Argenta_73
  text: '"Пусть Трон будет милостив к тем, чья душа проходит через испытание воли в этом чертоге. От слабости, Бог-Император, избавь нас!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Пусть Трон будет милостив к тем, чья душа проходит через испытание воли в этом чертоге. От слабости, Бог-Император, избавь нас!
- guid: 7bf6927e-d669-4a6a-9d2a-8beb617caeb0
  event: BNTRS_PickUps_Argenta_03
  text: '"В другой жизни ты могла бы носить знаки Сороритас, и я звала бы тебя сестрой. Но твои ритуалы... тревожат меня".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В другой жизни ты могла бы носить знаки Сороритас, и я звала бы тебя сестрой. Но твои ритуалы... тревожат меня.
- guid: 99154bc8-4daa-45d9-af47-ad7d70e7f3d0
  event: BNTRS_PickUps_Argenta_113
  text: '"Проклятая музыка. Почему здесь не звучат литании во славу Его?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Проклятая музыка. Почему здесь не звучат литании во славу Его?
- guid: 6311d3b7-71e5-456b-b8e0-d22a68e33c8c
  event: BNTRS_PickUps_Argenta_116
  text: '"Скверна здесь. Я слышу ее в тенях — она стенает голосами пожранных ею душ".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Скверна здесь. Я слышу ее в тенях — она стенает голосами пожранных ею душ.
- guid: 3e1be735-e523-4514-95ec-f9333b3daff1
  event: BNTRS_PickUps_Argenta_120
  text: '"Кощунники устроили логово в благословенном отсеке, чтобы посмеяться над нашей верой!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Кощунники устроили логово в благословенном отсеке, чтобы посмеяться над нашей верой!
- guid: 79572fcf-9393-4bbd-a9e6-402edfb6547f
  event: BNTRS_PickUps_Argenta_130
  text: '"Тайная вера Кровавой паутины... Она одновременно пугает и восхищает".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тайная вера Кровавой паутины... Она одновременно пугает и восхищает.
- guid: c9aee775-bcf3-41af-be83-93a3dcb8c64a
  event: BNTRS_PickUps_Argenta_149
  text: '"Не горюй, воин, они все равно исполняют свой долг. Люди, глядя на них, наполняются светом Его и вдохновляются на битву с врагами Человечества!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Не горюй, воин, они все равно исполняют свой долг. Люди, глядя на них, наполняются светом Его и вдохновляются на битву с врагами Человечества!
- guid: 1570262f-44c7-45aa-b4db-dbc90f52fab4
  event: BNTRS_PickUps_Argenta_161
  text: '"Ты знаешь, что я убила Леди Теодору, но я не вижу упрека в твоем взгляде. Почему?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ты знаешь, что я убила Леди Теодору, но я не вижу упрека в твоем взгляде. Почему?
- guid: 47f128fc-a2a7-46ed-bb85-e42037d42742
  event: BNTRS_PickUps_Argenta_20
  text: '"Мы избираем врагов по-разному. Я убиваю тех, кого уличает в ереси пречистая Экклезиархия. Ты — тех, на кого указывают смутные знамения. И я не знаю, насколько им можно верить".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мы избираем врагов по-разному. Я убиваю тех, кого уличает в ереси пречистая Экклезиархия. Ты — тех, на кого указывают смутные знамения. И я не знаю, насколько им можно верить.
- guid: 05faf072-7caf-4513-ac9f-4f503935bab3
  event: BNTRS_PickUps_Argenta_218
  text: '"В таком случае стоило поставить в известность нас. Иначе добыча может случайно свернуть шею прежде, чем западня захлопнется".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В таком случае стоило поставить в известность нас. Иначе добыча может случайно свернуть шею прежде, чем западня захлопнется.
- guid: 17fec39e-5a4b-4e47-90f9-102eac1449cb
  event: BNTRS_PickUps_Argenta_219
  text: '"Если бы я знала, что они сотворили с тобой, я бы пришла вызволить тебя... или даровать Его милость".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Если бы я знала, что они сотворили с тобой, я бы пришла вызволить тебя... или даровать Его милость.
- guid: 78193bb0-830c-4297-a6f0-3149c800e5b6
  event: BNTRS_PickUps_Argenta_237
  text: '"Кибелла, что для тебя роман с Лорд-капитаном? Часть твоего долга телохранительцы? Или то, что нарушает долг?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Кибелла, что для тебя роман с Лорд-капитаном? Часть твоего долга телохранительцы? Или то, что нарушает долг?
- guid: 5e75622f-85f4-460e-8161-3f448e95ddd4
  event: BNTRS_PickUps_Argenta_247
  text: '"Верно. Единственное решение — сражаться до последней капли крови и добыть победу во славу Императора либо умереть, пытаясь".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Верно. Единственное решение — сражаться до последней капли крови и добыть победу во славу Императора либо умереть, пытаясь.
- guid: b3387b49-b346-43d7-9eab-86ff34689dd9
  event: BNTRS_PickUps_Argenta_251
  text: '"В подобных местах мне хочется думать о снеге — чистом, не испорченном человеческой грязью. Под морозным светом звезды, что освещает все — до самых глубин души".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: В подобных местах мне хочется думать о снеге — чистом, не испорченном человеческой грязью. Под морозным светом звезды, что освещает все — до самых глубин души.
- guid: cb9937ef-ab9d-42cb-9b34-d2109cbbafd1
  event: BNTRS_PickUps_Argenta_59
  text: '"Я доверяю твоей бдительности, Хейнрикс. А ты доверься моей праведной ярости, если обнаружишь новых выродков".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я доверяю твоей бдительности, Хейнрикс. А ты доверься моей праведной ярости, если обнаружишь новых выродков.
- guid: c62ca6af-2b74-4d0a-9817-6856670e614f
  event: BNTRS_PickUps_Argenta_62
  text: '"Власть молниеносно развратила Кибеллу. Я предчувствую, что все это закончится братоубийством".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Власть молниеносно развратила Кибеллу. Я предчувствую, что все это закончится братоубийством.
- guid: d1c3c57e-2482-4483-b012-e6b9ac096641
  event: BNTRS_PickUps_Argenta_78
  text: '"Пусть обряды Кровавой паутины и кажутся мне радикальными, но я рада, что столь истовая воительница Императора с нами".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Пусть обряды Кровавой паутины и кажутся мне радикальными, но я рада, что столь истовая воительница Императора с нами.
- guid: 3d47274e-02df-47f8-8115-6176212dc88a
  event: BNTRS_PickUps_Argenta_83
  text: '"Ее жертва ужасна... Но я не могу испытывать к ней ничего, кроме устрашенного почтения".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ее жертва ужасна... Но я не могу испытывать к ней ничего, кроме устрашенного почтения.
- guid: 2777e187-7878-4d27-a875-355fdbdf8f89
  event: BNTRS_PickUps_Argenta_89
  text: '"Значит, {name} внимательнее к своим подданным, чем была Леди Теодора. Печально, что это тебя удивляет, а не радует".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Значит, КЭП внимательнее к своим подданным, чем была Леди Теодора. Печально, что это тебя удивляет, а не радует.
- guid: 506008b4-e406-4f5e-858c-7cc3d439e051
  event: BNTRS_PickUps_Argenta_97
  text: '"Тебя ведет служение Императору, а он — порождение ереси, мерзость. Не говори, что вы схожи".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Тебя ведет служение Императору, а он — порождение ереси, мерзость. Не говори, что вы схожи.
- guid: e8c4c5b0-fc1b-4e8b-b92b-4e8e9abbcfec
  event: BNTRS_Reactivity_Argenta_02
  text: '"Не открывается! Проклятые еретики заблокировали дверь, дрожа от мысли о нашем приближении!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Не открывается! Проклятые еретики заблокировали дверь, дрожа от мысли о нашем приближении!
- guid: ad89178e-51ab-400d-a6df-f8bc6af93468
  event: BNTRS_Reactivity_Argenta_06
  text: '"Мой разум застила мгла... Император, возложи ладонь свою на чела наши и защити от морока ереси!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мой разум застила мгла... Император, возложи ладонь свою на чела наши и защити от морока ереси!
- guid: e54be983-67d5-4c7c-bde1-d67cdcb24211
  event: BNTRS_Reactivity_Argenta_08
  text: '"Туда же, куда дорога всем нечестивым морокам. Хочешь за ним последовать, а, ведьма?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Туда же, куда дорога всем нечестивым морокам. Хочешь за ним последовать, а, ведьма?
- guid: 1f9dba77-9725-4834-b289-193224f22a34
  event: BNTRS_Reactivity_Argenta_102
  text: '"Все знают: твое присутствие отравляет душу и разум Вольного Торговца. Оступись хоть на миг — и я без сомнений оборву твою жалкую жизнь!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: 'Все знают: твое присутствие отравляет душу и разум Вольного Торговца. Оступись хоть на миг — и я без сомнений оборву твою жалкую жизнь!'
- guid: 9c82e515-2d5d-42c3-9ced-a6d2a23b2839
  event: BNTRS_Reactivity_Argenta_13
  text: '"Благородное деяние. Пускай команда вознесет молитвы о герое, отринувшем нечистую жизнь во имя Человечества".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Благородное деяние. Пускай команда вознесет молитвы о герое, отринувшем нечистую жизнь во имя Человечества.
- guid: 0952451f-e581-419f-8210-0a9bc61fb150
  event: BNTRS_Reactivity_Argenta_38
  text: '"Кассия... мне не нужен третий глаз, чтобы заметить, что происходит. Тебе надо учиться полагаться и на свои обычные очи".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Кассия... мне не нужен третий глаз, чтобы заметить, что происходит. Тебе надо учиться полагаться и на свои обычные очи.
- guid: bb618054-e6e0-490f-8722-84139bb434ce
  event: BNTRS_Reactivity_Argenta_45
  text: '"Перестань так смотреть на Вольного Торговца, Хейнрикс. С ней ничего не случится, пока мы рядом".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Перестань так смотреть на Вольного Торговца, Хейнрикс. С ней ничего не случится, пока мы рядом.
- guid: bfdee320-44ba-4d5b-b3ec-e4f5e0427f06
  event: BNTRS_Reactivity_Argenta_51
  text: '"Джай любит хвастаться трофеями и богатствами. Лорд-капитан для нее — и то, и другое".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Джай любит хвастаться трофеями и богатствами. Лорд-капитан для нее — и то, и другое.
- guid: 985e4611-ecd1-4d45-bc1a-c6bd49de184d
  event: BNTRS_Reactivity_Argenta_66
  text: '"Наполни душу свою чистой любовью к Богу-Императору, и все сомнения сердца разом станут пустыми".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Наполни душу свою чистой любовью к Богу-Императору, и все сомнения сердца разом станут пустыми.
- guid: 4747d3a3-cb46-40a6-a990-ca87521d7085
  event: BNTRS_Reactivity_Argenta_84
  text: '"Как мог{mf||ла} Вольный Торговец допустить тебя в свиту? Что за изъян воли позволил {mf|ему|ей} найти тебе, мерзость, место подле себя?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как мог Вольный Торговец допустить тебя в свиту? Что за изъян воли позволил ему найти тебе, мерзость, место подле себя?
- guid: 4c473136-c01b-46d5-a2cf-ed640d389de6
  event: BNTRS_Reactivity_Argenta_87
  text: '"Вольный Торговец выказывает ксеносу слишком много симпатии. Ее следует держать на коротком поводке, а не в статусе... гостьи".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольный Торговец выказывает ксеносу слишком много симпатии. Ее следует держать на коротком поводке, а не в статусе... гостьи.
- guid: 1a221afd-9fa2-40c8-8148-5ca439667d6b
  event: BNTRS_Reactivity_Argenta_99
  text: '"Вольный Торговец сблизил{mf|ся|ась} с ксеносом настолько, что попал{mf||а} в самую ее душу, постиг{mf||ла} чувства... Непростительная богомерзкая ересь!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Вольный Торговец сблизился с ксеносом настолько, что попал в самую ее душу, постиг чувства... Непростительная богомерзкая ересь!
- guid: 240dc138-4cf2-4c1c-9cc4-f8417abbf0f5
  event: BNTRS_Reactivity_DLC3_Argenta_06
  text: '"Мое сердце радуется, когда видит служителей Бога-Императора, что несут хвалу Ему через верную службу. Но я не увидела среди собравшихся на шествие простых людей... Неужели им не нашлось места?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мое сердце радуется, когда видит служителей Бога-Императора, что несут хвалу Ему через верную службу. Но я не увидела среди собравшихся на шествие простых людей... Неужели им не нашлось места?
- guid: d670963a-24c6-4b04-a7d0-358973de9c72
  event: BNTRS_Reactivity_DLC3_Argenta_09
  text: '"Да будет так, святой воин. Дитя благословенного Сангвиния более не с нами, но воздаяние за его смерть — в наших руках. Гнев Бога-Императора да падет на головы нечестивцев!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Да будет так, святой воин. Дитя благословенного Сангвиния более не с нами, но воздаяние за его смерть — в наших руках. Гнев Бога-Императора да падет на головы нечестивцев!
- guid: 1bd71aa2-ffd4-450d-9b3e-60b14ac64db7
  event: BNTRS_Reactivity_DLC3_Argenta_21
  text: '"Не печальтесь о потерях, братья: те, кто пал в битве за праведность, будут согреты взором Бога-Императора босле смерти!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: 'Не печальтесь о потерях, братья: те, кто пал в битве за праведность, будут согреты взором Бога-Императора босле смерти!'
- guid: 117ca1cc-f05f-4807-a15a-7822b8b5222c
  event: BNTRS_Reactivity_DLC3_Argenta_38
  text: '"Воля Бога-Императора была ниспослана через Его помазанни{mf|ка|цу}, чтобы освободить верного слугу от вражеских оков. Все произошло так, как тому было должно случиться".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Воля Бога-Императора была ниспослана через Его помазанника, чтобы освободить верного слугу от вражеских оков. Все произошло так, как тому было должно случиться.
- guid: 352e1471-117c-4896-84bd-d1b75bb55d6e
  event: BNTRS_Reactivity_DLC3_Argenta_44
  text: '"Бог Император да благословит милосердие Вольного Торговца! Ни один честный слуга Империума не заслуживает быть запертым в плену ксеноса, и Себериан фон Валанциус — тем более!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Бог Император да благословит милосердие Вольного Торговца! Ни один честный слуга Империума не заслуживает быть запертым в плену ксеноса, и Себериан фон Валанциус — тем более!
- guid: 7024e3c0-1805-424e-99d7-13c87200f3e1
  event: BNTRS_Reactivity_DLC3_Argenta_69
  text: '"Суровые условия рождают самые светлые сердца. Пусть взор Его обратится на Зарков и благословит этот мир на долгую жизнь внутри Империума Человечества!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Суровые условия рождают самые светлые сердца. Пусть взор Его обратится на Зарков и благословит этот мир на долгую жизнь внутри Империума Человечества!
- guid: fd36f547-78a4-4ac8-98e8-0c13996d8814
  event: BNTRS_Stressful_Argenta_02
  text: '"Я была бы рада биться плечом к плечу с моими сестрами, но и нынешняя судьба не тяготит меня. Где бы я ни была и кто бы меня не сопровождал меня — еретиков ждет смерть. Вот что важно!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я была бы рада биться плечом к плечу с моими сестрами, но и нынешняя судьба не тяготит меня. Где бы я ни была и кто бы меня не сопровождал меня — еретиков ждет смерть. Вот что важно!
- guid: 11e9deb1-c103-4458-afd3-8b842c38d619
  event: BNTRS_Stressful_Argenta_112
  text: '"О, будь уверен, я смотрю за каждым твоим шагом, нечисть. И когда ты предашь Вольного Торговца — а ты предашь — я буду рядом".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: О, будь уверен, я смотрю за каждым твоим шагом, нечисть. И когда ты предашь Вольного Торговца — а ты предашь — я буду рядом.
- guid: 782bf238-e951-4d76-a5ce-a5aaec4873f9
  event: BNTRS_Stressful_Argenta_132
  text: '"Ты прав. Лишь нам с тобой известно, что такое обращаться у алтаря к нашему заступнику и умолять о защите для ближних наших. Быть их щитом духа".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ты прав. Лишь нам с тобой известно, что такое обращаться у алтаря к нашему заступнику и умолять о защите для ближних наших. Быть их щитом духа.
- guid: 2aa61b97-21c8-4c77-a252-c1ca1ed42fb4
  event: BNTRS_Stressful_Argenta_150
  text: '"Нет, брат Ульфар. Лишь смиренно молюсь, чтобы Император послал моим глазам ясность, чтобы они отличили правое от лживого. И сокрушили его!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Нет, брат Ульфар. Лишь смиренно молюсь, чтобы Император послал моим глазам ясность, чтобы они отличили правое от лживого. И сокрушили его!
- guid: 2dc5753e-5e3b-4efd-abce-60111436704f
  event: BNTRS_Stressful_Argenta_168
  text: '"Не за мной — Бог-Император заботится о всех достойных дщерях и сыновьях Его. Но тебе, ксенос, едва ли удастся осознать чистоту человеческой веры".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Не за мной — Бог-Император заботится о всех достойных дщерях и сыновьях Его. Но тебе, ксенос, едва ли удастся осознать чистоту человеческой веры.
- guid: 89460b71-3ca0-41b0-93a7-5e66c55f6b7b
  event: BNTRS_Stressful_Argenta_19
  text: '"Ты оставил флот ради службы у Вольного Торговца. Не жалеешь ли об этом, сенешаль?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ты оставил флот ради службы у Вольного Торговца. Не жалеешь ли об этом, сенешаль?
- guid: 2ad9f502-3592-4566-b629-dfd5b137c898
  event: BNTRS_Stressful_Argenta_21
  text: '"Если бы я могла увидеть золотой свет Астрономикона, как видишь его ты, Кассия… я бы, наверное, замерла навеки, и вовсе не смогла отвести от него глаз".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Если бы я могла увидеть золотой свет Астрономикона, как видишь его ты, Кассия… я бы, наверное, замерла навеки, и вовсе не смогла отвести от него глаз.
- guid: a831a9bf-e2c6-4ade-a4f6-e3b161d8b3d0
  event: BNTRS_Stressful_Argenta_23
  text: '"Служба заставляет тебя глубоко заглядывать в секреты врагов человечества. Не боишься ли ты однажды заглянуть слишком глубоко, дознаватель?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Служба заставляет тебя глубоко заглядывать в секреты врагов человечества. Не боишься ли ты однажды заглянуть слишком глубоко, дознаватель?
- guid: 86b5f8cf-a88e-4751-8f40-1610b48a9e81
  event: BNTRS_Stressful_Argenta_25
  text: '"Как ты можешь доверять своим прозрениям, Идира? Неужели не боишься, что историю будущего тебе нашептывает Архивраг?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как ты можешь доверять своим прозрениям, Идира? Неужели не боишься, что историю будущего тебе нашептывает Архивраг?
- guid: 77f3b792-3584-4f9f-9c6a-efe23c584235
  event: BNTRS_Stressful_Argenta_27
  text: '"Будь начеку, Джай. Ты кажешься немного, гм, расфокусированной".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Будь начеку, Джай. Ты кажешься немного, гм, расфокусированной.
- guid: fe6c716e-e86d-471b-8b21-1949abadfaeb
  event: BNTRS_Stressful_Argenta_29
  text: '"Однажды Вольный Торговец устанет от тебя, нечисть, и даст свершиться правосудию. Ничто не доставляет мне большего удовольствия, чем предвкушение этого мига".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Однажды Вольный Торговец устанет от тебя, нечисть, и даст свершиться правосудию. Ничто не доставляет мне большего удовольствия, чем предвкушение этого мига.
- guid: 51af5739-db64-4aeb-bbfc-85694c2af4ff
  event: BNTRS_Stressful_Argenta_31
  text: '"Алый — хороший цвет для боевого облачения. Враги не увидят слабость, даже если ты истекаешь кровью".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Алый — хороший цвет для боевого облачения. Враги не увидят слабость, даже если ты истекаешь кровью.
- guid: 7d6352ab-7646-4f2a-83e9-a081d43e9089
  event: BNTRS_Stressful_Argenta_33
  text: '"Мне нравятся твои речи, светлый воин. В них есть что-то от святых гимнов, что мы с сестрами поем на поле боя".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Мне нравятся твои речи, светлый воин. В них есть что-то от святых гимнов, что мы с сестрами поем на поле боя.
- guid: 32695065-f0f8-485d-90f4-24963243cfd9
  event: BNTRS_Stressful_Argenta_35
  text: '"Сила воли и грация. Печально, что подобные дары достались той, чью душу никогда не осветит свет Терры".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Сила воли и грация. Печально, что подобные дары достались той, чью душу никогда не осветит свет Терры.
- guid: aafa2461-04e1-4e88-9e25-413006b9b8e8
  event: BNTRS_Stressful_Argenta_40
  text: '"Душа моя открыта для света и верных слуг Его. Все остальное — минутные слабости и есть пустое".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Душа моя открыта для света и верных слуг Его. Все остальное — минутные слабости и есть пустое.
- guid: 85a7b479-5c98-4407-85da-cc202fa9eb60
  event: BNTRS_Stressful_Argenta_58
  text: '"Что с того? Мою руку направляет Император. Каждый выстрел и удар найдет цель в рядах врагов Человечества!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Что с того? Мою руку направляет Император. Каждый выстрел и удар найдет цель в рядах врагов Человечества!
- guid: a1b24aea-8279-432f-b4cb-a6b5ca5aa0cf
  event: BNTRS_Stressful_Argenta_78
  text: '"Я рождена для битвы против тьмы, мое настроение всегда прекрасное, когда опасность близко!"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я рождена для битвы против тьмы, мое настроение всегда прекрасное, когда опасность близко!
- guid: abd0cfdc-9ed1-4c5e-82fa-2593f9921fb0
  event: BNTRS_Stressful_Argenta_94
  text: '"Иногда мне кажется, что ты не такая уж и плохая женщина, Джай. И это меня беспокоит".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Иногда мне кажется, что ты не такая уж и плохая женщина, Джай. И это меня беспокоит.
- guid: b39a1954-81a1-4aca-b304-9308bfa66a86
  event: BS_KTCStolenTithe_Argenta_01
  text: '"Служба Империуму стоит превыше личных пожеланий. Тем более столь... приземленных, как твои, Джай".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Служба Империуму стоит превыше личных пожеланий. Тем более столь... приземленных, как твои, Джай.
- guid: b2c46c73-a187-4b65-8a8e-b46fe751529a
  event: Companions_SororitasQ1_OrphansPromt_01
  text: '"Приветствую, Вольный Торговец! Я хотела обратиться с личной просьбой". {n}Голос сестры Ардженты одно мгновение кажется неуверенным.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Приветствую, Вольный Торговец! Я хотела обратиться с личной просьбой.
  - speaker: narrator
    text_clean: Голос сестры Ардженты одно мгновение кажется неуверенным.
- guid: 92bbd952-5e0c-413c-be4f-e47a46248671
  event: Companions_SororitasQ1_OrphansPromt_02
  text: '"Проклятые слуги {g|Encyclopedia:Chaos}Хаоса{/g}, напавшие на этот корабль, унесли жизни верных членов твоей команды. И сделали сиротами многих детей — включая отпрысков храбрейших офицеров, защищавших свои посты до конца. Я не знаю, как заведено поступать в таких случаях во владениях фон Валанциус, но в привычном мне мире дети павших храбрецов могут рассчитывать на особое внимание. Быть может, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} мог{mf||ла} бы встретиться с сиротами?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Проклятые слуги Хаоса, напавшие на этот корабль, унесли жизни верных членов твоей команды. И сделали сиротами многих детей — включая отпрысков храбрейших офицеров, защищавших свои посты до конца. Я не знаю, как заведено поступать в таких случаях во владениях фон Валанциус, но в привычном мне мире дети павших храбрецов могут рассчитывать на особое внимание. Быть может, Вольный Торговец мог бы встретиться с сиротами?
- guid: 516505b0-9d35-4c2c-bf4d-813774f1a860
  event: Companions_SororitasQ1_OrphansPromt_03
  text: '"Как пожелаешь, Вольный Торговец. Благодарю, что согласились исполнить мою просьбу".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как пожелаешь, Вольный Торговец. Благодарю, что согласились исполнить мою просьбу.
- guid: a970c5cc-27d9-4fc3-b15e-78d5194db3f1
  event: Companions_SororitasQ1_OrphansPromt_04
  text: '"Я передам ваше распоряжение. Благодарю, что прислушались к моей просьбе".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я передам ваше распоряжение. Благодарю, что прислушались к моей просьбе.
- guid: 5f0006b7-482c-4d69-b13d-66c1a05b874d
  event: Companions_SororitasQ1_OrphansPromt_05
  text: '"Как пожелаете, Вольный Торговец", {n}— в голосе Ардженты звенят нотки разочарования.{/n}'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Как пожелаете, Вольный Торговец,
  - speaker: narrator
    text_clean: — в голосе Ардженты звенят нотки разочарования.
- guid: d0561414-75fa-4436-b18a-7486ef8b7ba1
  event: Companions_SororitasQ1_OrphansPromt_06
  text: '"Так вот как ты это видишь!" {n}— в голосе Ардженты прорезается нотка ярости, но она берет себя в руки.{/n} "Прошу прощения, Вольный Торговец. Я больше не потревожу вас подобными просьбами".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Так вот как ты это видишь!
  - speaker: narrator
    text_clean: — в голосе Ардженты прорезается нотка ярости, но она берет себя в руки.
  - speaker: Sister Argenta
    text_clean: Прошу прощения, Вольный Торговец. Я больше не потревожу вас подобными просьбами.
- guid: 108f6399-89d9-48cb-8c6e-e0a1e14353d0
  event: Companions_SororitasQ1_OrphansPromt_07
  text: '"Эти дети — будущее твоей команды, когда-нибудь и им придется встать против зла и ереси, как встали их родители. Встретившись с ними, обратившись с правильными словами, ты отдашь дань памяти павшим храбрецам, и укажешь путь храбрецам будущим. Встречу с Вольным Торговцем они запомнят навсегда! К тому же, это укрепит дух сирот... поможет пережить утрату — в столь юном возрасте это может быть непросто".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Эти дети — будущее твоей команды, когда-нибудь и им придется встать против зла и ереси, как встали их родители. Встретившись с ними, обратившись с правильными словами, ты отдашь дань памяти павшим храбрецам, и укажешь путь храбрецам будущим. Встречу с Вольным Торговцем они запомнят навсегда! К тому же, это укрепит дух сирот... поможет пережить утрату — в столь юном возрасте это может быть непросто.
- guid: cf360e9b-467b-4e38-ae60-3b6b936ffb29
  event: Companions_Sororitas_01
  text: '{n}Сестра Арджента кажется уставшей — под глазами залегли темные круги, волосы в легком беспорядке, в движениях — легкая нервозность.{/n} "{g|Encyclopedia:RogueTrader}Вольный Торговец{/g}?"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Сестра Арджента кажется уставшей — под глазами залегли темные круги, волосы в легком беспорядке, в движениях — легкая нервозность.
  - speaker: Sister Argenta
    text_clean: Вольный Торговец?
- guid: f32a68a7-2515-4977-86e2-525cf18c9736
  event: Companions_Sororitas_02
  text: '{n}Сестра Арджента встречает вас легчайшим полупоклоном.{/n} "Лорд-капитан. Я рада, что вы пришли. И хочу принести извинения за прежнюю... холодность. После нашей первой встречи я опасалась, что вы окажетесь еще одним гнилым ростком семейного древа фон Валанциус, как... как предатель Кунрад. Но теперь я вижу перед собой достойного лидера и слугу {g|Encyclopedia:Imperium}Империума{/g}. Я рада быть вам соратницей".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Сестра Арджента встречает вас легчайшим полупоклоном.
  - speaker: Sister Argenta
    text_clean: Лорд-капитан. Я рада, что вы пришли. И хочу принести извинения за прежнюю... холодность. После нашей первой встречи я опасалась, что вы окажетесь еще одним гнилым ростком семейного древа фон Валанциус, как... как предатель Кунрад. Но теперь я вижу перед собой достойного лидера и слугу Империума. Я рада быть вам соратницей.
- guid: 9cf145c1-22a5-44d5-909b-b74443e7a288
  event: Companions_Sororitas_03
  text: '{n}Даже не двигаясь с места, сестра Арджента излучает энергию. С сиянием в темных глазах и легким румянцем на щеках она читает молитву, и обращает взгляд к вам, только произнеся последнюю строчку:{/n} "{name}, приветствую!"'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: 'Даже не двигаясь с места, сестра Арджента излучает энергию. С сиянием в темных глазах и легким румянцем на щеках она читает молитву, и обращает взгляд к вам, только произнеся последнюю строчку:'
  - speaker: Sister Argenta
    text_clean: КЭП, приветствую!
- guid: c9c01224-891d-4a2a-85a4-d7a87f4f76fa
  event: Companions_Sororitas_04
  text: '"Это так! {g|Encyclopedia:AdeptaSororitas}Сестры битвы{/g}— это пламя, зажженное {g|Encyclopedia:Emperor}Императором{/g}, это эхо его голоса, летящее по темным просторам Вселенной. Мы несем Его гнев еретикам, злодеям и другим врагам Человечества. Мы можем защищать верных от нечестивых и грешных. Иногда — словом. Чаще — болтером".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Это так! Сестры битвы— это пламя, зажженное Императором, это эхо его голоса, летящее по темным просторам Вселенной. Мы несем Его гнев еретикам, злодеям и другим врагам Человечества. Мы можем защищать верных от нечестивых и грешных. Иногда — словом. Чаще — болтером.
- guid: 61eac97b-0854-4b12-9561-ed61a61efcb8
  event: Companions_Sororitas_05
  text: '"Однажды мы достигнем Салис Прайм и встанем перед вратами корабля святой... я знаю. Я верю".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Однажды мы достигнем Салис Прайм и встанем перед вратами корабля святой... я знаю. Я верю.
- guid: 4100b054-c506-4957-8ace-25933eeca1a8
  event: Companions_Sororitas_06
  text: '"Даже в послушницы {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g} попадают лишь достойнейшие. Те же, кто принял обеты и стал полноправной сестрой — лучшие из лучших, прошедшие испытания тела и духа. Да, случается, что сестры оступаются или проявляют слабость. Но не думай, что ты сейчас услышишь от меня историю низости или падения".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Даже в послушницы Адепта Сороритас попадают лишь достойнейшие. Те же, кто принял обеты и стал полноправной сестрой — лучшие из лучших, прошедшие испытания тела и духа. Да, случается, что сестры оступаются или проявляют слабость. Но не думай, что ты сейчас услышишь от меня историю низости или падения.
- guid: bd440fad-3900-4261-8e0b-78a96c29331a
  event: Companions_Sororitas_07
  text: '"Каждый такой случай — великое горе для всех нас. Свет не может нести в себе и мельчайшей частички тьмы! Потому тем, кто совершит проступок или проявит слабость духа, дают шанс на искупление. Их зовут сестрами Репентиа, и пусть дрожат враги пред их ликом, ибо ничто не удержит Сестру битвы, жаждущую очиститься от греха и слабости".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Каждый такой случай — великое горе для всех нас. Свет не может нести в себе и мельчайшей частички тьмы! Потому тем, кто совершит проступок или проявит слабость духа, дают шанс на искупление. Их зовут сестрами Репентиа, и пусть дрожат враги пред их ликом, ибо ничто не удержит Сестру битвы, жаждущую очиститься от греха и слабости.
- guid: 2ae88f73-11f4-44b4-b385-8bc8dc2be114
  event: Companions_Sororitas_08
  text: '"О себе!" {n}Сестра кажется удивленной.{/n} "Я — дщерь {g|Encyclopedia:Emperor}Императора{/g} и служительница его. Что еще можно сказать обо мне?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: О себе!
  - speaker: narrator
    text_clean: Сестра кажется удивленной.
  - speaker: Sister Argenta
    text_clean: Я — дщерь Императора и служительница его. Что еще можно сказать обо мне?
- guid: b982f9a2-068c-42f2-818b-be8d6da2701c
  event: Companions_Sororitas_09
  text: '"Если таково желание {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}. Хотя я не так много могу поведать. Я — дщерь {g|Encyclopedia:Emperor}Императора{/g} и служительница Его... что еще?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Если таково желание Вольного Торговца. Хотя я не так много могу поведать. Я — дщерь Императора и служительница Его... что еще?
- guid: f173ea34-2eff-4813-9b74-27b41a93fe4d
  event: Companions_Sororitas_10
  text: '"Это — последнее мое воспоминание о матери. И о прежней жизни — до {g|Encyclopedia:ScholaProgenium}Схола Прогениум{/g} и послушничества, до испытания, до принятия обетов".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Это — последнее мое воспоминание о матери. И о прежней жизни — до Схола Прогениум и послушничества, до испытания, до принятия обетов.
- guid: 6dd3f9c3-8f92-4370-804e-972501f37d22
  event: Companions_Sororitas_11
  text: '"Моя личная святыня. Это — полковая {g|Encyclopedia:Aquila}аквила{/g}, вернее, ее остаток, переживший атаку, взрывы и пламя. Для меня она — память о том, что чистоту и сияние можно сохранить даже в сердце тьмы".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Моя личная святыня. Это — полковая аквила, вернее, ее остаток, переживший атаку, взрывы и пламя. Для меня она — память о том, что чистоту и сияние можно сохранить даже в сердце тьмы.
- guid: 49ef8875-1094-43bb-8e33-543cdc414af6
  event: Companions_Sororitas_12
  text: '{n}Вопрос, кажется, застает Ардженту врасплох.{/n} "Желала ли я? Но это была бы позорная слабость, почти ересь! Конечно, нет. Я рождена для этого. Я живу по воле {g|Encyclopedia:Emperor}Императора{/g} и в свете Его, я сама есть свет, должна быть светом — для себя и для тех, кто обращается ко мне за защитой".'
  speaker: Sister Argenta
  parts:
  - speaker: narrator
    text_clean: Вопрос, кажется, застает Ардженту врасплох.
  - speaker: Sister Argenta
    text_clean: Желала ли я? Но это была бы позорная слабость, почти ересь! Конечно, нет. Я рождена для этого. Я живу по воле Императора и в свете Его, я сама есть свет, должна быть светом — для себя и для тех, кто обращается ко мне за защитой.
- guid: a271e77e-19ac-4297-848b-bca85c1257eb
  event: Companions_Sororitas_13
  text: '"Я была избрана для служения. Но кроме того — скажу не таясь — мало что доставляет мне столько радости, как мысль, что падающий под моим выстрелом еретик более не сделает сиротой ни одну имперскую девочку".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Я была избрана для служения. Но кроме того — скажу не таясь — мало что доставляет мне столько радости, как мысль, что падающий под моим выстрелом еретик более не сделает сиротой ни одну имперскую девочку.
- guid: ae1be7ad-5fdf-4049-ac86-e85116e2a662
  event: Companions_Sororitas_14
  text: '"Конечно. Все, о чем я могу думать — это моя миссия..."'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Конечно. Все, о чем я могу думать — это моя миссия...
- guid: 5062afae-aabc-4907-8482-cb9d33c9e528
  event: Companions_Sororitas_15
  text: '"С радостью! Слушай..." {n}— сестра чуть прикрывает глаза и начинает рассказывать, почти напевать:{/n} "Давным-давно был на свете благословенный мир. Тысячи звезд усеивали там небо, столь ярких, что жители едва ли знали, что такое ночная тьма. Тысячи рек поили почву, тысячи садов расцветали каждую весну, и тысячи молитв каждый миг взлетали в прозрачный воздух, благодаря и славя {g|Encyclopedia:Emperor}Императора{/g}".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: С радостью! Слушай...
  - speaker: narrator
    text_clean: '— сестра чуть прикрывает глаза и начинает рассказывать, почти напевать:'
  - speaker: Sister Argenta
    text_clean: Давным-давно был на свете благословенный мир. Тысячи звезд усеивали там небо, столь ярких, что жители едва ли знали, что такое ночная тьма. Тысячи рек поили почву, тысячи садов расцветали каждую весну, и тысячи молитв каждый миг взлетали в прозрачный воздух, благодаря и славя Императора.
- guid: ef571fe8-703b-4057-b66c-c67fed0fafb9
  event: Companions_Sororitas_16
  text: '"Но однажды жители узнали, что такое тьма. Словно смерч, обрушились на планету проклятые еретики, продавшиеся {g|Encyclopedia:Chaos}Архиврагу{/g}. С неба летели снаряды, что опустошали целые города, и жгли сады, и кровью верных наполняли русла рек. Дым и копоть скрыли небосклон и тысячу звезд, что сияли над миром".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Но однажды жители узнали, что такое тьма. Словно смерч, обрушились на планету проклятые еретики, продавшиеся Архиврагу. С неба летели снаряды, что опустошали целые города, и жгли сады, и кровью верных наполняли русла рек. Дым и копоть скрыли небосклон и тысячу звезд, что сияли над миром.
- guid: 50dd9ace-2313-483f-87a2-2095665d59f2
  event: Companions_Sororitas_17
  text: '"Среди горстки выживших была одна сирота, видевшая, как погибли все родные ее и дотла сгорел сад, в котором она росла. Но в сердце своем она знала главную истину, что умещается в два слова — Император защищает. И, зная это, не отрываясь, глядела она в черное, страшное, затянутое дымом пожаров небо. Не разглядеть больше было на нем ярких звезд... кроме одной".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Среди горстки выживших была одна сирота, видевшая, как погибли все родные ее и дотла сгорел сад, в котором она росла. Но в сердце своем она знала главную истину, что умещается в два слова — Император защищает. И, зная это, не отрываясь, глядела она в черное, страшное, затянутое дымом пожаров небо. Не разглядеть больше было на нем ярких звезд... кроме одной.
- guid: 48a653fe-d661-4307-b3c3-560d27fe4340
  event: Companions_Sororitas_18
  text: '"Ах, если бы знать! Ни в житие, ни в легендах нет точного ответа. Классические иконописцы полагали, что звезда обратилась сребротканным знаменем, которое выносили на поле боя, и оно источало свет, слепящий лишь еретиков, но безвредный для верных. Большинство изображало святую Ардженту как девочку с этим знаменем в руках".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Ах, если бы знать! Ни в житие, ни в легендах нет точного ответа. Классические иконописцы полагали, что звезда обратилась сребротканным знаменем, которое выносили на поле боя, и оно источало свет, слепящий лишь еретиков, но безвредный для верных. Большинство изображало святую Ардженту как девочку с этим знаменем в руках.
- guid: 8d0f66a5-9457-4f61-9568-ebd24e1e55c8
  event: Companions_Sororitas_19
  text: '"Другие полагают, что, упав с неба, Единственная звезда стала святым цепным мечом, коим Ардженте в будущем предстояло разить чудовищ и врагов Империума. На некоторых ранних гравюрах Арджента изображена в силовой броне с серебряной звездой на груди — по одному из мнений богословов, эта броня и есть реликвия. Есть даже мнение, что Единственная звезда на деле — это корабль, на котором летала Арджента".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: Другие полагают, что, упав с неба, Единственная звезда стала святым цепным мечом, коим Ардженте в будущем предстояло разить чудовищ и врагов Империума. На некоторых ранних гравюрах Арджента изображена в силовой броне с серебряной звездой на груди — по одному из мнений богословов, эта броня и есть реликвия. Есть даже мнение, что Единственная звезда на деле — это корабль, на котором летала Арджента.
- guid: a9b6cf3e-e501-404d-b73e-ec89ab7fd009
  event: Companions_Sororitas_20
  text: '"С радостью. Мы служим Императору и Человечеству с незапамятных времен, бьемся со злом по воле святой {g|Encyclopedia:AdeptusMinistorum}Экклезиархии{/g}, мы..." {n}Арджента обрывает сама себя и фыркает под нос.{/n} "Прошу простить меня, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}. Начала рассказывать то, что знает любой мелкий дворянин в Империуме! Так что же именно вас интересует?"'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: С радостью. Мы служим Императору и Человечеству с незапамятных времен, бьемся со злом по воле святой Экклезиархии, мы...
  - speaker: narrator
    text_clean: Арджента обрывает сама себя и фыркает под нос.
  - speaker: Sister Argenta
    text_clean: Прошу простить меня, Вольный Торговец. Начала рассказывать то, что знает любой мелкий дворянин в Империуме! Так что же именно вас интересует?
- guid: a08ed819-7b02-4f9b-8791-e3604ae3718e
  event: Companions_Sororitas_21
  text: '"По окончании послушничества я была направлена в каликсийскую ветвь ордена Пресвятой Девы-Мученицы и приставлена к ордену Пронатус. Миссия ордена важна и благородна — сестры Пронатус защищают великие имперские святыни. Мы охраняем их, поддерживаем в порядке, сопровождаем, если их выносят на поле боя или паломникам для поклонения".'
  speaker: Sister Argenta
  parts:
  - speaker: Sister Argenta
    text_clean: По окончании послушничества я была направлена в каликсийскую ветвь ордена Пресвятой Девы-Мученицы и приставлена к ордену Пронатус. Миссия ордена важна и благородна — сестры Пронатус защищают великие имперские святыни. Мы охраняем их, поддерживаем в порядке, сопровождаем, если их выносят на поле боя или паломникам для поклонения.
- guid: afa89ae6-8759-41b5-a66e-3238ab8d3a1d
  event: Companions_Sororitas_22
  text: '"Не позволяй названию обмануть тебя. "Воинствующие ордена" обучают сестер выходить на поле боя как армия. Это не значит, что сестры из прочих орденов кротки и беззащитны".'
  speaker: Sister Argenta
