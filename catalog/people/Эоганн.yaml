name: Эоганн
gender: M
role: Навигатор
age: средний
personality: спокойный, задумчивый
voice: aidar
gemini_voice: Umbriel
sound_keys:
- Eogann
total_phrases: 104
phrases:
- guid: 13f19617-d2d1-4036-a540-0e977323052e
  event: BNTRS_Companion_DLC3_Eogann_02
  text: '"Сенешаль, фантомы прошлого могут поглотить без остатка, если дать им волю. Когда-то я испытал это на себе, но с
    тех пор Омниссия сподвиг меня постичь способ справляться с этим. Я готов поделиться знанием".'
- guid: 5dddc9ac-d94f-4d25-a0b6-95d9528ceabc
  event: BNTRS_Companion_DLC3_Eogann_03
  text: '"Стоит распорядиться, чтобы часть ксеносских останков транспортировали на корабль. Мне нужно пополнить запасы редких
    реактивов, и синтезировать их на основе тел будет проще всего".'
- guid: a448662e-57b0-4134-8571-7a9dbc799628
  event: BNTRS_Companion_DLC3_Eogann_07
  text: '"Солидарен, госпожа Хейдари. Боюсь, что даже моего мастерства не хватило бы на то, чтобы восстановить нашу телесную
    целостность в случае провала".'
- guid: 6a007761-b40d-435c-86e4-10918fb74a1c
  event: BNTRS_Companion_DLC3_Eogann_08
  text: '"Чрезмерная импульсивность зачастую приводит к плачевным последствиям. Увы, но эту чашу горького опыта вам придется
    испить еще не раз и не два, сестра Арджента".'
- guid: 7bf75b2d-53f1-4dc4-8dea-3a0c9206329d
  event: BNTRS_Companion_DLC3_Eogann_09
  text: '"Парадокс. Ауспекс-сканирование не показывает ничего. Диагносторы органики безмолвны. Нунциус! Перед нами непостижимый
    объект! Зафиксируй необходимость сюда вернуться... впоследствии".'
- guid: afcda56f-fee3-4d81-81f4-33a5fb17e252
  event: BNTRS_Companion_DLC3_Eogann_101
  text: '"Нунциус недоумевает при виде трепета и утомления всех, кто посетил Администратум. Я разделяю его недоумение. Неужели
    столь обременительно проводить время ожидания в размышлениях и прочих благотворных занятиях для ума?"'
- guid: 30114612-6839-4645-bdeb-1defa3fc3320
  event: BNTRS_Companion_DLC3_Eogann_102
  text: '"Наоборот, госпожа Хейдари. Мне хорошо знаком страх хищного прошлого преследующего по пятам, и желание бежать, пока
    не кончится земля под ногами. Меня не волнует какой личиной вы предстаете передо мной — ведь ваш живой ум и острый язык
    все еще при вас".'
- guid: 1ba0a299-bcca-4d60-baca-093e2136d24f
  event: BNTRS_Companion_DLC3_Eogann_104
  text: '"Впечатляющее разнообразие флоры, уникальный химический состав воздуха, а также весьма необычные психоактивные свойства
    кристаллической примеси в почве. Нунциус, нам просто необходимо изучить ее источник!"'
- guid: b06f37c0-9c6d-4018-b1c1-c96e2bedce5f
  event: BNTRS_Companion_DLC3_Eogann_107
  text: '"Механизмы могут быть очищены и вновь введены в эксплуатацию, но потери среди служителей Культа Механикус невосполнимы.
    Я скорблю, но не о машинах, а о разумах, исполненных знания, что погибли вотще".'
- guid: 8511dfc8-2888-481f-a01f-3b337c74a8cb
  event: BNTRS_Companion_DLC3_Eogann_108
  text: '"Подобные методы уменьшения энтропии являются одной из немногих вещей, тревожащих гальванические цепи в моем мозгу.
    То, что вы их санкционируете, коллега, меня искренне удивляет".'
- guid: 82bed9e7-987b-4697-a8ac-dac00f5c1ad0
  event: BNTRS_Companion_DLC3_Eogann_109
  text: '"Я... согласен. Я не желаю рассуждать о потенциальной ценности его экспериментов или образцов, не в этот раз. Все,
    чего касалось это омерзительное ксеносское исчадие, должно гореть. Все до последнего".'
- guid: 15634a43-bf7a-41ad-8ef2-48a13ae754d0
  event: BNTRS_Companion_DLC3_Eogann_11
  text: '"Что есть шутка, кроме как не намеренное искажение смысла в угоду комическому эффекту? Вспомните наши диспуты, леди-навигатор.
    Пестрота оттенков лишь фикция, призванная отвлечь ваше внимание от истины".'
- guid: 681ae365-7d7d-4a2e-ac0c-d1180d4734c5
  event: BNTRS_Companion_DLC3_Eogann_110
  text: '"Задумываясь о следствии, не стоит забывать про причину. Если не постичь и не уничтожить ксеносов, подобных тем,
    что захватили судно, гибель "Йесевона" станет лишь первым звеном в цепи значительных бед. Если бы я мог заполучить живой
    экземпляр, чтобы изыскать способ борьбы с их инвазивным геномом..."'
- guid: 485d52f1-8174-4777-95ce-59849a32fdad
  event: BNTRS_Companion_DLC3_Eogann_111
  text: '"Воистину, тот, кто не может найти себе применение в миру, стремится в бой, чтобы так оправдать свою ценность. Порядок
    вещей все же незыблем и нерушим".'
- guid: d8f55271-103b-4f05-a9ea-725552fb8145
  event: BNTRS_Companion_DLC3_Eogann_112
  text: '"Различие подмечено верно, но неверно истолковано. Очевидно, что сродство эльдаров к энергиям Эмпиреев выше, чем
    у Человечества, посему даже чудотворное поле Геллера не способно спасти их разум от... нежелательных последствий. Не пытайся
    объяснить свой видовой изъян чужой глупостью".'
- guid: 3c8d4b06-7740-4cfb-8543-3365eb6d7c46
  event: BNTRS_Companion_DLC3_Eogann_113
  text: '"Едва ли я мог предполагать, что в свиту Вольного Торговца на добровольных началах войдет экземпляр одного из самых
    опасных галактических видов. Нунциус, ты ведь знаком с краткой ксенологической характеристикой друкари? Их морфология
    изучена слабо, и возможность наблюдать представителя расы вблизи — редчайший казус".'
- guid: a3ad3467-5a7a-4b25-aa29-e17f4642d278
  event: BNTRS_Companion_DLC3_Eogann_115
  text: '"Любопытно. Я сведущ в практиках, позволяющих подавлять воспоминания. Может ли это быть свидетельством применения
    одной из них?"'
- guid: b3d17a89-726c-483a-a9a6-f42d0fa0e4e9
  event: BNTRS_Companion_DLC3_Eogann_116
  text: '"Магос Ханейманн, твой конфликт с соратниками из Культа Механикус будоражит мое любопытство. Какой догмат ты нарушил,
    чтобы спровоцировать нападение? Знаешь ли ты сам? Мы с Нунциусом могли бы помочь с изучением аугментов павших..."'
- guid: 0e7933c8-6d55-4810-b7c8-24e249794d5a
  event: BNTRS_Companion_DLC3_Eogann_119
  text: '"Ваше возвращение отрадно, коллега. Отсутствие острой полемики притупляло мой разум и вселяло в него тревогу. Нунциус
    также настоятельно рекомендует произвести санацию ваших увечий, насколько это возможно во внелабораторных условиях".'
- guid: 8a107612-cf38-4e0e-8bf3-2cfb07dcf517
  event: BNTRS_Companion_DLC3_Eogann_12
  text: '"И правда, любопытный вопрос с точки зрения анатомии. Ваш живой интерес, пример для подражания, госпожа Хейдари!
    Рассчитываю, что вы подробно задокументируете находки и поделитесь ими со мной. Что? Нунциус, брось эти отвратительные
    инсинуации!"'
- guid: 2b359e65-f610-42cc-8edf-818c0ef294ae
  event: BNTRS_Companion_DLC3_Eogann_121
  text: '"Мы не раз сталкивались с тобой на почве запретного, теперь же ты стал его воплощением. Сколь причудливы преобразования,
    творимые в тигле судьбы с разумами посвященных. Я не знаю куда заведет тебя этот путь, но надеюсь, что то, что ты на нем
    обретешь будет стоить того, чем ты пожертвовал".'
- guid: 4508f9aa-a29d-4e2e-89e8-b5f5e06c7aec
  event: BNTRS_Companion_DLC3_Eogann_122
  text: '"Простая логика примитивного хищнического подхода. Чем опаснее конкурент, тем сильнее необходимость его устранения.
    Я успел тщательно изучить гемункула Тервантьяса, и он демонстрировал ровно те же повадки".'
- guid: a0555da2-2061-4cbf-9ec3-a58b5abbf76d
  event: BNTRS_Companion_DLC3_Eogann_123
  text: '"Следовательно, впереди нас ждет опаснейшее сплетение реального с ирреальным, требующее крайней осмотрительности.
    Нунциус, экранируй внешние вокс-писцы и будь готов вести запись по моей команде".'
- guid: df46d34b-a737-40af-8157-39a5f961e0d0
  event: BNTRS_Companion_DLC3_Eogann_124
  text: '"Мне не вполны ясны причины вашего смущения, сенешаль. Генеалогические истоки и склонности индивида не определяют
    его способность к установлению близких связей личного характера, и это неоспоримый факт".'
- guid: 2c63f94c-541e-4351-ba85-af091fb30831
  event: BNTRS_Companion_DLC3_Eogann_125
  text: '"Мы повстречали странное создание. Думаю, не ошибусь, если назову его воплощенной метафорой. Его реакции абсолютно
    иррациональны: при попытке рассчитать предиктивные паттерны поведения я едва не сжег дотла свои краниальные импланты".'
- guid: 18a0f084-911b-4e88-9638-dbe8b5050d58
  event: BNTRS_Companion_DLC3_Eogann_128
  text: '"Мне кажется, "Соломон Антар" и "перемены" — понятия, лежащие в диаметрально противоположных контекстных полях".'
- guid: 1f321259-54fc-46f1-867b-3e464f0f8330
  event: BNTRS_Companion_DLC3_Eogann_129
  text: '"Любой, кто узреет последствия бездумных заигрываний с энергиями Имматериума, многажды подумает перед тем, как ступить
    на эту извилистую стезю. Я нахожу это зрелище не только лишь печальным, но весьма поучительным".'
- guid: 29caa432-50aa-4ba8-b884-9ba25574acdf
  event: BNTRS_Companion_DLC3_Eogann_13
  text: '"Не могу не отметить, что ваши краниальные аугменты отличаются от тех, что я видел прежде, госпожа Тласс. Как правило,
    они более обширны. Нунциус заинтригован их устройством и тем как вы справляетесь с псайкерским проклятием с нестандартными
    параметрами свяженного железа".'
- guid: 52c42227-c2db-43bf-8e12-62803d2b3acd
  event: BNTRS_Companion_DLC3_Eogann_130
  text: '"Позвольте полюбопытствовать, как вы собрались проводить анализ? Что используете в качестве реактивов? По каким критериям
    определяете наличие или отсутствие заражения? Я готов предоставить образец, если смогу тщательно запротоколировать весь
    процесс от начала и до конца".'
- guid: cff2568a-c7da-4855-99f2-e72d51b14b10
  event: BNTRS_Companion_DLC3_Eogann_131
  text: '"Любопытно, коллега, не думал, что вам свойственна тяга лишь к поверхностному анализу. Кто знает какие тайны можно
    извлечь из дискуссий с мирянами, нашедшими здесь пристанище?"'
- guid: 8dca5901-4eee-4736-bdd1-25376b343482
  event: BNTRS_Companion_DLC3_Eogann_132
  text: '"Умножение страданий и противостояние трансцендентальной энтропии с помощью насилия, полагаю. Я изреку ложь, если
    скажу, что не хотел бы это лицезреть, но чувство самосохранения все же присуще моему разуму".'
- guid: f6856906-0656-44f8-8c9e-3eec04353228
  event: BNTRS_Companion_DLC3_Eogann_133
  text: '"Сочетание факторов, как я склонен полагать. Изъян узости мышления присущ многим магосам и архимагосам, что приводит
    к непредсказуемым и, увы, печальным последствиям. Надеюсь, ты, досточтимый коллега, на сей раз не поддашься ему". '
- guid: 0cdd951b-f239-45af-97f8-965b6c18003e
  event: BNTRS_Companion_DLC3_Eogann_134
  text: '"Чудовищное сходство с виденным ранее... Без сомнения, я узнаю почерк Инквизиции. Бросить десятки могучих, но неподготовленных
    умов на постижение неизведанного, а затем уничтожить полученное знание, ибо оно оказалось чрезмерно опасным".'
- guid: 4e871374-c99b-4da8-9aff-f42d8ade6571
  event: BNTRS_Companion_DLC3_Eogann_137
  text: '"Прошу извинить моего немногословного коллегу Нунциуса. Он впервые ведет диалог с представителем Адептус Астартес
    и оттого слегка... затрудняется с вербализацией своих мыслей".'
- guid: 97130f9f-2043-449f-bad1-5b86039548bd
  event: BNTRS_Companion_DLC3_Eogann_139
  text: '"Вот редкий случай, когда поэтическое иносказание наиболее точно вмещает в себя суть передаваемой мысли".'
- guid: 0f7e6e31-c2ef-41cd-90d3-64bf4d801b1e
  event: BNTRS_Companion_DLC3_Eogann_140
  text: '"Замечу, что этот тезис верен не только для тебя. Для меня и Нунциуса странствие бок о бок с эльдаром тоже служит
    источником Познания, который не иссякнет даже в случае твоей гибели".'
- guid: fe9af355-6eb6-42af-9c92-02942337e8b3
  event: BNTRS_Companion_DLC3_Eogann_141
  text: '"Широта взглядов Вольного Торговца весьма вдохновляюща. Не предполагал, что смогу изучить живого ксеноса, хоть и
    не во вполне естественной среде. Что думаешь, Нунциус?"'
- guid: 9ee2ad18-ba10-462f-b2f0-dd8c63146a25
  event: BNTRS_Companion_DLC3_Eogann_143
  text: '"Вдвойне жаль, что ее труп сильно поврежден. Я и Нунциус провели беглую аутопсию, чтобы определить, пригоден ли мозг
    к стазис-консервированию в качестве опытного образца, но обнаружили лишь конгломерат тканей, деформированных в результате
    ранения".'
- guid: d753339e-4bdf-448d-a802-8db213567089
  event: BNTRS_Companion_DLC3_Eogann_144
  text: '"Безусловно. Ощущаешь ли ты эмоцию, схожую с раскаянием? Способны ли в целом ксеносы испытывать чувства, кроме коварного
    злорадства? Постой, не отвечай — Нунциус, приготовься сканировать нервную систему, фиксируй любые отклонения!"'
- guid: 87a82200-53f7-4414-b8ce-9d7a876cfc31
  event: BNTRS_Companion_DLC3_Eogann_15
  text: '"У нас с Нунциусом возник спор по поводу анатомической разницы друкари и азуриани. Он утверждает, что различия спровоцированы
    биологическими факторами, я же уверен, что тому причиной образ жизни обитателей Комморры. Для завершения диспута необходимо
    произвести анализ живого образца".'
- guid: 4920643c-4d0c-4d41-9dc0-cc85ca73957d
  event: BNTRS_Companion_DLC3_Eogann_17
  text: '"Всякий, верующий в Бога-Императора, отправляет обряды сообразно своему разумению и установленным канонам. Но из
    уважения и обязательств, возлагаемых на меня саном, я должен проинформировать тебя, Кибелла: постоянные истязания плоти
    редко идут ей на пользу".'
- guid: 381a54d8-e3ee-42a1-97aa-cc8eac2bde2f
  event: BNTRS_Companion_DLC3_Eogann_19
  text: '"Примечательно, что модель вашего кибермастифа не полностью соответствует классическим шаблонам и содержит в себе
    весьма большой процент органики. Как вы думаете, проктор, ваш канид — средоточие машинного духа, или все еще живой автономный
    организм?"'
- guid: 0a2cd033-ba0b-40e5-9b68-643f6d849c33
  event: BNTRS_Companion_DLC3_Eogann_22
  text: '"То есть ваш отказ ультимативен? Прискорбно! Комплементарность вашей личности с занимаемой должностью имеет немыслимый
    коэффициент полезного действия, близкий к ста процентам. Поддерживать сей показатель есть дело, угодное Омниссии".'
- guid: ffdd706d-d8aa-40bc-a207-e047f7e9e48e
  event: BNTRS_Companion_DLC3_Eogann_24
  text: '"Озвученный вами ассоциативный ряд отчего-то не кажется мне случайным, но разгадка ускользает от меня. Нунциус? Почему
    ты притих?"'
- guid: 855c829a-431d-4441-99b6-93d23a3c0e2a
  event: BNTRS_Companion_DLC3_Eogann_26
  text: '"Следование догмам действительно упрощает бытие, сестра Арджента, но упрощение в моем искусстве недопустимо. Боюсь,
    что смирение придется проявить вам, ибо я не намерен ни прекращать свои изыскания, ни отказываться от привычных методологий
    и канонов в угоду вашим требованиям".'
- guid: e744f5f2-9842-4a26-bb15-f38f4ab4f66a
  event: BNTRS_Companion_DLC3_Eogann_28
  text: '"Святопроцедура Великого Деланья требует благословенного притока Движущей Силы и превосходит в важности незначительные
    функциональные потребности экипажа, обеспечиваемые отключенными системами. Пара отсеков сможет выдержать десяток вахт
    без отопления во имя познания".'
- guid: 4fa832a8-7efc-4b3b-af68-8c2ea74cc1e9
  event: BNTRS_Companion_DLC3_Eogann_30
  text: '"Я вижу вам непривычно чего-то не знать, господин ван Калокс. Однако в неведении нет ничего предосудительного — ведь
    познание всегда начинается с вопроса, направленного в неизведанное. На ваш вопрос я не отвечу чего-либо, что вы не знаете
    сами, так что возможно вам стоит искать ответы где-то еще".'
- guid: 5ff2b7ed-cd94-4307-a0be-1f1f5d1ea507
  event: BNTRS_Companion_DLC3_Eogann_32
  text: '"Есть многие знания, леди-навигатор, которым не должно смущать и тревожить пытливые молодые умы. Рубедо, созерцаемое
    вами, лишь осколок прошлого, который отпечатался в моей памяти. Он не имеет полезности, а следовательно, незначителен".'
- guid: 2f200931-b7e6-4276-8d90-2410c1a81b45
  event: BNTRS_Companion_DLC3_Eogann_34
  text: '"Госпожа Хейдари, я польщен вашей безграничной щедростью, но хочу отметить, что слово "пожертвование" предполагает
    безвозмездное дарение. Впрочем, я уверен, что мы сможем найти компромисс".'
- guid: 209d7238-33aa-4761-b3c3-4f75149ab556
  event: BNTRS_Companion_DLC3_Eogann_35
  text: '"Сенешаль, я признателен вам за исполнительность. Мои запросы часто вызывают трудности у мирян. Но вы распорядились
    доставить мне два сигила доступа к личным покоям, не исказив моего запроса собственными домыслами".'
- guid: f4dbe437-df60-4ca5-8a47-9571d4829610
  event: BNTRS_Companion_DLC3_Eogann_38
  text: '"Любой язык есть форма, в которую облечен смысл, и эта форма напрямую отражает строение разума носителя. Постигая
    ваш язык, я постигаю и ваше мышление, становясь еще на йоту ближе к постижению вас как концепции".'
- guid: d566b6d5-5e05-45ec-bdda-73129a5d0674
  event: BNTRS_Companion_DLC3_Eogann_40
  text: '"Нунциус — мой дражайший коллега, почтенный Астартес. Он незаменим и его вклад в наши совместные поиски совершенно
    неоценим. Его утрату я бы сравнил с потерей части себя. Это неопровержимый факт".'
- guid: d9f7f15c-1d4a-4bae-9d79-ffb534e78b6c
  event: BNTRS_Companion_DLC3_Eogann_42
  text: '"Любопытно, что ты чувствуешь некую боль, которой не ощущаю я. Движущая Сила внутри моих гальванических цепей течет
    плавно и покойно. Возможно, ты видишь нечто, что недоступно моему восприятию, друкари".'
- guid: d07d2e70-6b04-402a-a641-68e2591582fd
  event: BNTRS_Companion_DLC3_Eogann_44
  text: '"Нунциус — не череп, а весьма утонченный конструкт и мой дражайший коллега. Твоя вера искажает восприятие действительности
    и ты видишь смерть даже там, где ее нет, Кибелла".'
- guid: 299621d1-4085-469d-99a9-5b9f0d3e987e
  event: BNTRS_Companion_DLC3_Eogann_46
  text: '"Поверхность вашего мышления может соперничать лишь с узостью вашего восприятия, проктор. Ваши обвинения беспочвенны,
    а выводы ложны — они порождены лишь слепой верой в Лекс, понятие нюансов вам не знакомо".'
- guid: e063aa87-8fb8-471c-9c22-89d429f48d65
  event: BNTRS_Companion_DLC3_Eogann_47
  text: '"Сестра Арджента, ваш гнев очень эффективен для сокрушения врагов рода человеческого. Но не затмевает ли он ваш разум?
    Не заставляет ли упускать из вида детали, составляющие целостную картину мира?"'
- guid: 214cf885-8bae-4d12-99ed-3c8a09a947ea
  event: BNTRS_Companion_DLC3_Eogann_49
  text: '"Ты подозрительно молчалив, досточтимый коллега. Неужели моя победа в наших последних дебатах отвадила твое желание
    продолжать наши в высшей степени стимулирующие прения?"'
- guid: d8290e05-f3d7-4ca6-b892-32a603b671f1
  event: BNTRS_Companion_DLC3_Eogann_51
  text: '"Я настоятельно прошу вас более не посещать лабораторию в мое отсутствие, дознаватель. Нунциус весьма нервничает,
    когда не обнаруживает экспериментальных объектов на своих местах".'
- guid: 270ab0bc-4eba-499d-828e-2255ab216e54
  event: BNTRS_Companion_DLC3_Eogann_53
  text: '"Я обратил внимание на вашу коллекцию книг, леди-навигатор. Внимательность, тонкий литературный вкус, пытливость
    ума... Ведомо ли вам о том, что в вас есть задатки эрудита с нетривиальным подходом к познанию?"'
- guid: b04b6db7-037b-4568-954f-ea86d51db2a2
  event: BNTRS_Companion_DLC3_Eogann_55
  text: '"Госпожа Хейдари, вы изъявляли желание осмотреть мою коллекцию ксеносских артефактов. Нунциус, несмотря на присущий
    ему скепсис, все же согласился допустить вас к ней под его тщательным присмотром".'
- guid: f9ba9ce3-30a4-4dbd-ae53-7f78effd087e
  event: BNTRS_Companion_DLC3_Eogann_57
  text: '"Эльдар, твоя жизнь среди представителей иного вида — феномен, требующий изучения. Я бы хотел провести беглое сканирование
    твоего тела, чтобы выяснить, как последствия варп-трансляций влияют на состояние плоти".'
- guid: bb82b826-48a4-436b-816f-e2de087e9d26
  event: BNTRS_Companion_DLC3_Eogann_59
  text: '"В продолжение разговора о поэзии, почтенный Астартес. Я проанализировал записанную с ваших слов стихотворную форму
    и при помощи Нунциуса слегка исправил ритм. Теперь четные строки рифмуются через ассонансы, а нечетные через созвучия,
    что благотворно сказалось на ее структуре".'
- guid: d2d6f3e8-4121-4687-aa08-dd4d37533561
  event: BNTRS_Companion_DLC3_Eogann_61
  text: '"Нунциус, лицезрел ли ты подобные шедевры зодчества доселе? Один их вид навевает на меня размышления о том, сколь
    могуч разум, способный создать подобное, и сколь искусны руки, что воплотили его мысль".'
- guid: 92a9644e-3286-4951-b72e-511fb368c471
  event: BNTRS_Companion_DLC3_Eogann_63
  text: '"Милосердие заканчивается там, где начинается оценка эффективности индивида. Это неоспоримый факт".'
- guid: f137e45c-7f43-4a64-94a3-c14127cfb495
  event: BNTRS_Companion_DLC3_Eogann_64
  text: '"Не вижу достаточных причин для пересмотра и тем более для вмешательства в окончательное формирование зародившихся
    уз. Гармония рождается из дисгармонии, таков алхимический принцип. Умейте ждать, коллега, терпение суть добродетель".'
- guid: 71623577-cb72-4983-bbce-6def6082863f
  event: BNTRS_Companion_DLC3_Eogann_65
  text: '"Я скорблю вместе с тобой, магос Ханейманн, и возношу молебны Движущей Силе, чтобы она не иссякла в пласталевых венах
    Ефрата-II. Но, несмотря на утраты, мир выстоял, как выстояла некогда Стигия VIII. Со временем она смогла оправиться, а
    значит сможет и Ефрат-II".'
- guid: 2747fcf3-7ae7-45a4-b2a4-51e8da846ca8
  event: BNTRS_Companion_DLC3_Eogann_66
  text: '"Беглое медике сканирование показывает опасный для вас уровень психического истощения, госпожа Тласс. Есть ли риски
    проявления психических феноменов?"'
- guid: 0de370a3-81aa-440b-9796-24ca8cf2b893
  event: BNTRS_Companion_DLC3_Eogann_68
  text: '"Ненависть, госпожа Хейдари. Я занимал разум размышлениями об изуверских опытах ксеноса и воспоминаниями о своем
    устройстве, чтобы не думать о боли. Но лишь ненависть не позволила мне сдаться".'
- guid: 4d45c23a-7503-4ae4-b764-043f24b192d8
  event: BNTRS_Companion_DLC3_Eogann_70
  text: '"Уповайте на себя и свою биомантию, дознаватель. Вы тоже многое пережили, займите мысли собственным благополучием,
    вместо хлопот о моем будущем".'
- guid: 86795f9b-3446-4c9e-a697-d32881046671
  event: BNTRS_Companion_DLC3_Eogann_73
  text: '"Леди-навигатор, когда ксеносское отродье иссекало меня, оно хвасталось вашим пыточным механизмом. Мне жаль, что
    вам пришлось это пережить".'
- guid: b4bbc90d-5ffd-435c-977c-c1edb0ea8821
  event: BNTRS_Companion_DLC3_Eogann_74
  text: '"Я готов подсказать вам идентификаторы нескольких заинтересованных лиц, но у нас с Нунциусом есть условие. Перед
    тем, как образцы попадут в ваши ловкие руки, я досконально исследую и постигну суть каждого из них совместно с моим дражайшим
    коллегой".'
- guid: 852561b1-4b9b-4c89-a168-558c4e91f54d
  event: BNTRS_Companion_DLC3_Eogann_76
  text: '"Отрадно, что никто не попытался вторгнуться в мою лабораторию за время нашего плена. Мне предстоит свершить еще
    много очистительных таинств, прежде чем я окончательно избавлюсь от скверны гемункула".'
- guid: 0a3ab43c-52d1-4c89-b8e9-6bfef63c309a
  event: BNTRS_Companion_DLC3_Eogann_78
  text: '"Чепуха. На подобных мирах можно обнаружить уникальные феномены, и тассерций тому примером. Впрочем, коллега, если
    вы предпочитаете потакать собственной гордыне, а не познавать мироздание во всей его полноте, не стану вам мешать".'
- guid: 93417322-44b0-45fb-8ffc-b2fb30e91162
  event: BNTRS_Companion_DLC3_Eogann_79
  text: '"Местные рекреационные обычаи определяю, как примитивные, но любопытные. Однако принятие подобных токсинов не самый
    эффективный подход к успокоению разума, исходя из статистики моих экспериментов. Нет, Нунциус, это были эксперименты,
    а не дегустация".'
- guid: 9387c467-5abd-4346-8299-cfaeb8a3af9d
  event: BNTRS_Companion_DLC3_Eogann_82
  text: '"Я согласен, Нунциус. Помещение столь впечатляющего масштаба могло быть использовано с куда большей эффективностью.
    Вряд ли тот, кто ныне здесь властвует, знаком с основами священного учения об эргономике".'
- guid: 1f71aa4e-4680-42e9-aaf1-186b26c9bb2b
  event: BNTRS_Companion_DLC3_Eogann_84
  text: '"С одной стороны, теперь можно вести наблюдение за развитием ксеноячейки в условиях, приближенных к нативным. С другой
    стороны, мы имеем дело с крайне опасными генетическими паразитами. Принятое решение неоднозначно".'
- guid: 5545aa04-e9e1-4d04-9fd0-682b9b963bdb
  event: BNTRS_Companion_DLC3_Eogann_85
  text: '"Более всего меня интересует, как мирянин смог столь глубоко постичь ксенотехнические секреты. Если он сотворил подобное
    сам, то, безусловно, его мозг достоин изучения. Если же у него были сподвижники, их нужно безотлагательно обнаружить и
    опросить".'
- guid: 00b40cf2-e922-467f-a5f4-5cac4ff3588a
  event: BNTRS_Companion_DLC3_Eogann_86
  text: '"Магос, неужели ты не чуешь хворь в священных токах Движущей Силы? Не слышишь стоны благословенных машин? Оставь
    хвалебные псалмы и присоединяйся к инициации очистительных молебнов, досточтимый коллега".'
- guid: 7c4b59d4-c187-4968-be3f-675e23661ca3
  event: BNTRS_Companion_DLC3_Eogann_87
  text: '"Я затрудняюсь определить количество органического материала, что использован в убранстве обители. Эстетика сих творений
    безусловна, функциональность же сомнительна".'
- guid: 22210a87-4da2-422d-a10c-a95dc259a859
  event: BNTRS_Companion_DLC3_Eogann_89
  text: '"Тезис, который ни я, ни Нунциус не станем оспаривать. Сие судно подобно абсцессу, кишащему скверной... И он вот-вот
    лопнет".'
- guid: f176446c-7817-4cdd-871f-6785ee05a321
  event: BNTRS_Companion_DLC3_Eogann_90
  text: '"Дознаватель ван Калокс, я хотел бы побеседовать с вами об... увиденном на Кьяве Гамма. Как бы вы охарактеризовали
    сей чудовищный образец еретической машинерии?"'
- guid: 79251f05-1b1e-4ab0-8b78-048b7df8487b
  event: BNTRS_Companion_DLC3_Eogann_92
  text: '"Вероятность обнаружения индивида со схожими психофизиологическими характеристиками близка к нулевой, нет — отрицательной.
    Иными словами, проще будет создать генетический дубликат утерянного саванта, нежели искать нового. Но вряд ли вы, почтенный
    дознаватель, санкционируете такой опыт".'
- guid: 69676dda-0e19-4675-a3a1-db60304f427b
  event: BNTRS_Companion_DLC3_Eogann_93
  text: '"Дознаватель ван Калокс, ваше текущее состояние демонстрирует сниженную эффективность. Как генетор, я мог бы..."'
- guid: 9ea72e60-3679-48db-85e2-76587c303731
  event: BNTRS_Companion_DLC3_Eogann_95
  text: '"Незавершенное служение есть достаточно весомая причина к продлению жизни, даже если эта жизнь отмечена изъяном.
    Гипотетически, стигма псайкерства исправима.... в отличие от смерти".'
- guid: 382dedf8-7e42-4075-94d7-c26a682b0a85
  event: BNTRS_Companion_DLC3_Eogann_96
  text: '"Полагаю, стоит добавить фразу "если они совершены без санкции магоса Ханейманна". Я верно уловил смысл вашего тезиса,
    коллега?"'
- guid: ba55adda-83ae-43f0-8212-2ce8866845e7
  event: BNTRS_Companion_DLC3_Eogann_97
  text: '"Пытливый разум — редкое качество для мирянина. А мирянин, посмевший применить свой ум на постижение тайн ксеносов
    и сохранивший свои жизненные функции — статистическое чудо. Мы с Нунциусом приглашаем вас к дискуссии с целью взаимного
    обогащения знаниями, госпожа Хейдари".'
- guid: 37ec0ed6-dffe-4d7a-9f40-b1f93988800a
  event: BNTRS_Companion_DLC3_Eogann_99
  text: '"Высказывание залогировано Нунциусом и отправлено в долгосрочный вокс-архив. Гипотеза о способности магоса Ханейманна
    понимать и применять юмор выдвинута, но не подтверждена окончательно".'
- guid: be09acb5-b1c8-46d9-ba06-65b3f43dfe72
  event: BNTRS_DLC3_Eogann_03
  text: '"Нунциус обратил мое внимание на то, что у этого создания есть отчетливая сигнальная система вкупе с набором поведенческих
    ритуалов. Омниссия учит, что понимание есть истинный путь к познанию. Чтобы усмирить это существо, нужно постичь и верно
    интерпретировать его реакции на разные... раздражители".'
- guid: 7be4e471-25c4-478e-b371-5addac5c1602
  event: BNTRS_DLC3_Eogann_102
  text: '"Яркая демонстрация иррационального мышления, присущего ксеносам вашего вида. Авгурационное сканирование не показало
    ни единого признака того, что небесное тело, несущее станцию, обладает некоей... одушевленностью. Прекратите объяснять
    естественные явления через призму собственных примитивных воззрений, это чистой воды профанация".'
- guid: 5433483c-2fe5-439a-aef4-7dd31d13f0fd
  event: BNTRS_DLC3_Eogann_115
  text: '"Нунциус отметил, что в начале знакомства вы относились к меровцам более подозрительно, чем сейчас. Неужели этот
    простой ритуал, предложенный Вольному Торговцу, смягчил ваше мнение?"'
- guid: aed76fe6-c3c7-43c3-8f63-35b5125da5a2
  event: BNTRS_DLC3_Eogann_130
  text: '"Флора демонстрирует повышенную адаптируемость и агрессию, что редко свойственно ее роду. Подозреваю, было совершено
    ксенотическое вмешательство извне. Нунциус, приготовь все необходимое для сбора опытных образцов".'
- guid: 2660ffe6-796c-4396-8b8d-a5296bc707c5
  event: BNTRS_DLC3_Eogann_24
  text: '"Гораздо поразительнее другое: похититель предельно точно знает, как обезопасить окружение от тлетворного воздействия
    техноереси! Вглядитесь, часть оскверненной аугментики удалена вовсе, еще часть заменена на внешне похожие, но совершенно
    инертные конструкции. Сей кадавр подвергся чрезвычайно искусному ритуалу аутопсии!"'
- guid: ac30c957-b12e-4fc6-bb60-8a776e4c7f64
  event: BNTRS_DLC3_Eogann_33
  text: '"Увы, в этих артефактах слишком мало органических составляющих, чтобы мои диагносторы могли пролить свет на их истинный
    возраст, а археологические изыскания никогда не были моей сильной стороной".'
- guid: 35658ce7-5d7c-4cfa-a11e-c4212ba22930
  event: BNTRS_DLC3_Eogann_46
  text: '"Отрадно видеть, уважаемый коллега, что широта вашего мышления достаточна, чтобы понять и оценить принцип работы
    этого творения. Не могу предположить, почему ты решил продемонстрировать ее лишь сейчас, но крайне удовлетворен намечающимися
    переменами в твоем подходе".'
- guid: 3bc4ae50-a58e-4030-8598-84b365480aa8
  event: BNTRS_DLC3_Eogann_48
  text: '"Омниссия даровал немало откровений этим ксеносам, а они превратили их в загадки, порой нерешаемые. Что? Да, Нунциус,
    я прекрасно понимаю, что для отключения питания нужно нарушить геометрию контура, но боюсь, что без ассистента с... нестандартным
    мышлением это малоосуществимо".'
- guid: f5c2961d-d04e-4751-aee7-c4a04339975d
  event: BNTRS_DLC3_Eogann_55
  text: '"Интересно, что в этом месте вызвало у тебя столь необычную реакцию? Кажется, мы имеем дело с неким феноменом, упорядочивающим
    течения Имматериума. Проверкой гипотез придется заняться в текущих полевых условиях".'
- guid: 71ede9b4-422f-4eb5-b7e0-3d26ecfd7823
  event: BNTRS_DLC3_Eogann_97
  text: '"Осторожно позволю себе заметить, что во время наших совместных проектов Декабалус 4-16 не дал ни единого повода
    усомниться в своей добропорядочности. Его сан достаточно высок, и я рекомендовал бы дважды подумать, прежде чем подвергать
    критике выдвигаемые им тезисы".'
- guid: 085fe76d-5fbd-4a3d-9f7b-37c1d0625443
  event: BNTRS_Reactivity_DLC3_Eogann_01
  text: '"Нунциус обратил внимание на то, что в Секторе Бионика этого корабля с трепетом относятся к редким аугментациям.
    Это похвально для места, в котором нет своего генетора экстремис".'
- guid: 9fb1e986-6402-42ab-99e6-164a3d007e68
  event: BNTRS_Reactivity_DLC3_Eogann_15
  text: '"Тонкое умение различать различные схизмы поклонения святейшему Омниссии редко встречается среди мирян. Мы с Нунциусом
    не держим обид".'
- guid: d86ffe3c-bac9-4eca-a3b2-2aac9887be65
  event: BNTRS_Reactivity_DLC3_Eogann_20
  text: '"Омниссия, сохрани тех, кто пал, до последней искры защищая слово Его, даже если враг его был бессчетен. Лишь самый
    светлый разум способен узреть глубину истины, что Омниссия знает все и постигает все".'
- guid: de1f6715-bcb3-4869-8998-c0b4cb21d038
  event: BNTRS_Reactivity_DLC3_Eogann_23
  text: '"Нунциус верно подметил, досточтимый коллега: познание есть ключ ко всему. Омниссия знает все и постигает все. Даже
    из ксенотехнологий можно выведать тайны, что пойдут на благо Империума. Полагаю, эта священная логика и лежала в основе
    решения Вольного Торговца, и не нам ее оспаривать".'
- guid: f335c392-8f33-40b7-9f7a-b41bc875d593
  event: BNTRS_Reactivity_DLC3_Eogann_36
  text: '"Подумать только, мы побывали в полностью функциональной гробнице некронов титанических масштабов! Если бы у меня
    была возможность прикоснуться к ее тайнам или даже склонить того могущественного ксеноса к более содержательной беседе..."'
- guid: 21f10b25-acd5-4da1-8a17-a336c71b4c6a
  event: BNTRS_Reactivity_DLC3_Eogann_43
  text: '"Вам не стоит недооценивать мудрость старого друга и опытного коллеги, госпожа Хейдари. Продолжительные исследования
    показывают, что наличие подобных лиц рядом бывает жизненно необходимо".'
- guid: 419d48c0-ca79-4007-a038-26cd2698d58f
  event: BNTRS_Reactivity_DLC3_Eogann_59
  text: '"Ты абсолютно справедлив в своем требовании. Мы с Нунциусом давно обсуждаем необходимость более полного присутствия
    коллег со Стигии VIII в Просторе Коронус. Возможно, покровительство Вольного Торговца могло бы этому поспособствовать".'
