name: Сенешаль (NPC)
gender: M
role: Сенешаль
age: ''
personality: чинный, официальный
sound_keys:
- Seneschal
total_phrases: 63
phrases:
- guid: 79d79333-c9b5-4dfe-a2e1-f058f02c8208
  event: Companions_Seneschal_01
  text: '{n}Абеляр быстро, но придирчиво оглядывает вас, будто сканируя взглядом в поисках оплошностей и недостатков. Затем
    учтиво кивает:{/n} "Лорд-капитан".'
  speaker: Abelard Werserian
- guid: 8f6af02a-efc9-450e-9412-3e6d64f6fdb3
  event: Companions_Seneschal_01
  text: '"Лорд-капитан". {n}Абеляр четко, по уставу приветствует вас, не забывая, впрочем, осмотреть с ног до головы своим
    "сканирующим" взглядом.{/n}'
  speaker: Abelard Werserian
- guid: ed389ec9-659c-4dae-b76f-96fbd0ff67b1
  event: Companions_Seneschal_02
  text: '"Как вам угодно, Лорд-капитан".'
  speaker: null
- guid: f6836018-ec00-40d9-8eee-a92c52c1a93d
  event: Companions_Seneschal_03
  text: '{n}Абеляр кривится, как от зубной боли, даже не пытаясь скрыть чувств.{/n} "Знаете, Лорд-капитан, я не поклонник
    изящных искусств, но когда найдется время и мы будем в каком-нибудь цивилизованном порту — непременно найду живописца
    и закажу ему портрет указанной вами персоны с дырой меж глаз. Кунрад Войгтвир! То, что он ушел живым после предательства,
    — огромное, огромное упущение".'
  speaker: Abelard Werserian
- guid: 7432e421-41e9-464f-a38e-065fd7aa8ba6
  event: Companions_Seneschal_04
  text: '{n}Абеляр мгновение хмурится и молчит, потом продолжает:{/n} "Мы служили Лорд-капитану Теодоре долгие годы и никогда
    не ладили. Он был... дерзким. Не боялся брать на себя ответственность, добровольно брался за сложные задания. Тяжело признавать,
    но... плодами его трудов протекторат фон Валанциус продолжает пользоваться и по сей день. Его служба всегда вызывала у
    меня уважение. Все остальное вызывало желание свернуть шею этой двуличной змее".'
  speaker: Abelard Werserian
- guid: 340f2e36-9d3e-43ee-9ea5-61101f585fff
  event: Companions_Seneschal_05
  text: '"Офицером {g|Encyclopedia:ImperialNavy}Навис Империалис{/g}", {n}— с гордостью отвечает Абеляр.{/n} "Не знаю, уместно
    ли здесь слово "был" — это судьба и суть жизни, а не работа. Я был счастлив служить Лорд-капитану Теодоре. Но душой и
    разумом я все еще имперский офицер".'
  speaker: null
- guid: d061a035-c7a2-4b37-9db5-7b886a118221
  event: Companions_Seneschal_06
  text: '"До недавнего времени Простор Коронус едва ли можно было назвать имперским регионом. С прибытием {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g}
    ситуация изменилась, но ненамного. Считайте, что здесь действуют свои порядки, более радикальные, но допускающие нестандартный
    подход там, где он сулит победу. Коронус не зря считается территорией Вольных Торговцев. Только у них достаточно военных
    сил, дерзости и прав, дарованных {g|Encyclopedia:Warrant}Патентом{/g}, чтобы пережить прыжок в неисследованную часть Простора.
    А в случае удачного исхода — удержать то, что сумели завоевать на фронтире".'
  speaker: null
- guid: fcd07ee3-d47c-4d98-9b4e-f1198057b4bf
  event: Companions_Seneschal_07
  text: '"В первую очередь вам следует с уважением относиться к официальным представителям Империума — пусть Простор и окраина,
    он все же относится к территории {g|Encyclopedia:GoldenThrone}Золотого Трона{/g}. Появление {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g}
    привело к тому, что Простор Коронус стал менее диким и неконтролируемым регионом... к вящему расстройству некоторых индивидов,
    привыкших к местному беспределу".'
  speaker: null
- guid: 8385d363-4512-4f8a-b446-a7ce96fed36a
  event: Companions_Seneschal_08
  text: '"Если говорить о "ничейной" территории, коей является {g|Encyclopedia:Footfall}Футфол{/g}... среди того отребья,
    который обретается на этой горстке астероидов, есть три фракции, имеющие относительно большое влияние в секторе. Первая
    — {g|Encyclopedia:KasballicaMission}Миссия Касбаллики{/g}. Организованная преступность в самом первозданном виде, имеющая
    влияние на Наместника Футфола и связи с Вольным Торговцем Винтерскейл. Вторая — ответвление нашей сиятельной Экклезиархии,
    {g|Encyclopedia:Drusians}последователи{/g} святого Друза. Активно наращивают силы, пользуясь влиянием на Торговца Чорда.
    Наконец, третьи — Эксплораторы, крыло {g|Encyclopedia:AdeptusMechanicus}Адептус Механикус{/g}. Готовы умирать и убивать
    за тайны древней технологической ереси, что скрыта меж звезд Простора Коронус".'
  speaker: null
- guid: b822ea3b-33b5-405f-9eb7-039d4d839e75
  event: Companions_Seneschal_09
  text: '"Решение далось мне нелегко. Но в этом предложении я увидел возможность служить интересам Человечества даже более
    эффективно, чем в Навис Империалис. Не мне рассказывать вам, сколь удивительной особой была Лорд-капитан Теодора. Я увидел
    в ней настоящего лидера и созидательную силу, создавшую свой протекторат среди опасностей и дикости {g|Encyclopedia:KoronusExpanse}Простора{/g}.'
  speaker: null
- guid: b2a90a50-ad6d-4062-96cd-97743bfc8fd5
  event: Companions_Seneschal_10
  text: '"Что?" {n}— Абеляр, кажется, теряет дар речи.{/n} "Лорд-капитан, любые подозрения о неподобающих неуставных чувствах
    или отношениях совершенно беспочвенны и почти оскорбительны!" {n}Он хмурится и добавляет:{/n} "Совершенно беспочвенны".'
  speaker: null
- guid: ec59225e-1bcd-42c0-9328-1547286b9d07
  event: Companions_Seneschal_11
  text: '"Разумеется".'
  speaker: null
- guid: cd40f599-f313-4a36-a31f-fba3ad0afcff
  event: Companions_Seneschal_12
  text: '"Вам необходимо как можно скорее воспитать в себе настоящего {g|Encyclopedia:RogueTrader}Вольного Торговца{/g} и
    восстановить контроль над протекторатом фон Валанциус. Все — от этого корабля до самых дальних ваших планет — должно работать,
    как части одной машины, благословленной лучшими {g|Encyclopedia:TechPriest}техножрецами{/g}. Ситуация у вас не самая завидная,
    тем бдительнее надо быть! Даже малый недосмотр может вырасти в огромную проблему, так что будьте внимательны и строги
    — и к себе, и к другим!"'
  speaker: null
- guid: 8338184a-4a7e-43b5-9527-9d0f0024df2a
  event: Companions_Seneschal_13
  text: '"Лорд-капитан!" {n}Абеляр по-уставному отдает честь.{/n}'
  speaker: Abelard Werserian
- guid: c61e757e-a122-4914-8eaf-14dc7e779d59
  event: Companions_Seneschal_14
  text: '"Я встретил Лорд-капитана Теодору во время миссии: части Имперского флота оказывали поддержку армии {g|Encyclopedia:RogueTrader}Вольного
    Торговца{/g} на одном из приграничных миров. Наше знакомство выдалось... непростым. Взаимодействия с гражданскими никогда
    не были моим коньком. Каково же было мое удивление, когда, уже после завершения операции, я получил направление покинуть
    службу на флоте и присоединиться к личному совету Вольного Торговца".'
  speaker: null
- guid: 3957f29f-ea1b-4d86-84a6-0025d12405c1
  event: Companions_Seneschal_15
  text: '"Можно сказать, что среди командования не нашлось тех, кто готов был бы препятствовать желаниям {g|Encyclopedia:RogueTrader}Вольного
    Торговца{/g}, рискуя своим положением и отношениями с Теодорой". {n}Абеляр усмехается.{/n} "Лорд-капитан обладала определенными
    связями во {g|Encyclopedia:ImperialNavy}Флоте{/g} — связи, которые она использовала для запроса помощи при конфликте на
    пограничном мире и которые позволили ей сделать мне предложение, итогом которого стало мое присутствие в ее свите".'
  speaker: Abelard Werserian
- guid: b8f6d3a9-7d0d-4bf7-ba2b-657851e4881f
  event: Companions_Seneschal_16
  text: '{n}Под вашим выразительно-пристальным взглядом Абеляр едва заметно тушуется.{/n} "Флот — древнее учреждение, со своими
    неписанными законами и правилами. Порой, в пылу официального брифинга или неформальной беседы, я нарушал эти правила,
    настаивая на своем. Бывает непросто подобрать слова, в точности выражающие мое отношение к ситуации или поступкам других
    и при этом не звучащие чересчур едко или вызывающе. Многие в командовании были склонны считать мою манеру общения... чрезмерной
    для человека моего ранга".'
  speaker: null
- guid: 98cd81d6-8899-4fcf-b6d2-86d4d0561618
  event: Companions_Seneschal_17
  text: '{n}Сенешаль стряхивает несколько невидимых пылинок с кителя.{/n} "Что-то еще, Лорд-капитан?"'
  speaker: null
- guid: 5a9a8f7b-e91b-4263-8a19-5491c227acfb
  event: Companions_Seneschal_18
  text: '{n}При вашем приближении Абеляр распрямляет спину и болезненно кряхтит, когда в его спине что-то хрустит.{/n} "Лорд-капитан.
    К вашим услугам".'
  speaker: null
- guid: dfaa5802-539f-406b-b374-fbf270422857
  event: Companions_Seneschal_19
  text: '"Интересно, кто донес эту новость". {n}Абеляр презрительно фыркает.{/n} "Впрочем, мне от вас скрывать нечего. В последнее
    время рулевые все чаще сбиваются с курсов, а рапорты не перестают противоречить друг другу. Беспорядки не прекратились
    и после разжалований, так что я лично взялся провести расследование".'
  speaker: Abelard Werserian
- guid: 6851643e-abe4-425a-b057-eeb651ff4044
  event: Companions_Seneschal_20
  text: '"Каково же было мое удивление, когда я обнаружил, что Леди-Навигатор лично правит записи в бортовом журнале, а офицеры
    хранят молчание по ее указу. Я немедля потребовал прекратить это безобразие и отчитал леди Кассию на глазах у офицеров.
    Она отреагировала на мои слова молчанием, а после быстро удалилась". {n}Абеляр глубоко вздыхает.{/n} "Не следовало мне
    этого делать. Я ведь даже не узнал, что ей двигало".'
  speaker: Abelard Werserian
- guid: 54eaae83-4890-4001-858c-dd18c1200b46
  event: Companions_Seneschal_21
  text: '{n}Лицо Абеляра вытягивается.{/n} "Лорд-капитан?"'
  speaker: null
- guid: db5b96de-e0c9-4317-8d90-6df89244641d
  event: Companions_Seneschal_22
  text: '{n}Абеляр багровеет от ярости, но неимоверным усилием воли он берет себя в руки.{/n} "Прискорбно слышать это от вас.
    После всех лет службы при {g|Encyclopedia:RogueTrader}Вольном Торговце{/g} фон Валанциус... вероятно, умение Леди Теодоры
    ценить верность не передается в крови. Всего наилучшего, {name} — при первой возможности я покину пустотный корабль и
    вернусь в семейное имение на Даргонусе".'
  speaker: Abelard Werserian
- guid: 8f518dc8-8156-4c28-8c73-5b8ea340f7a0
  event: Companions_Seneschal_23
  text: '{n}Абеляр склоняет голову и смотрит на вас с плохо скрываемым беспокойством.{/n} "Разумеется, Лорд-капитан".'
  speaker: Abelard Werserian
- guid: 3b9d3ee9-1a3a-4f88-882c-8f41b3355ec8
  event: Companions_Seneschal_24
  text: '"Как угодно Лорд-капитану. Что вас интересует?"'
  speaker: null
- guid: e55a5cf7-4182-4b4a-afbc-1f0a22c7e2ab
  event: Companions_Seneschal_25
  text: '{n}Абеляр окидывает вас взглядом и едва заметно кивает.{/n} "Лорд-капитан".'
  speaker: Abelard Werserian
- guid: 5ce318dd-d937-4a96-a485-3d1930c30ca5
  event: Companions_Seneschal_26
  text: '"Боюсь, Лорд-капитан, без серьезного вмешательства опытного оздоровителя мне эту слабость не одолеть самому. Святый
    Трон, как же тяжело быть бессильным стариком! Всегда надеялся, что не доживу до дней, когда спина и руки будут отказывать,
    а вот же ж..."'
  speaker: null
- guid: 738a21ac-2918-48d8-8fe5-4f9508c26918
  event: Companions_Seneschal_27
  text: '"В здравии и силах, Лорд-капитан! Осталось только найти выход — живым — из этой преисподней, вернуть вас на ваш корабль,
    и тогда на ваш вопрос я отвечу "великолепно"!"'
  speaker: null
- guid: d74cc214-b3fa-4fbe-be07-3a2198b9c76b
  event: Companions_Seneschal_28
  text: '"Сожалею, но нет... если бы в нашем распоряжении был наш корабль и экипаж, мы могли бы оказаться в безопасности за
    его стенами, отправиться на разведку боем, в конце-концов сложить свои головы в битве с ксеносами, как то и подобает слугам
    {g|Encyclopedia:Emperor}Бога-Императора{/g}!.. Однако мы лишены наших обычных возможностей. Остается полагаться только
    на наше оружие и смекалку".'
  speaker: null
- guid: 9365f228-ae53-472c-ad0c-6b2a2d350d0d
  event: Companions_Seneschal_29
  text: '{n}Абеляр одобрительно кивает.{/n} "Благоразумное стремление, Лорд-капитан. Готов посвятить вас во все интересующие
    вас нюансы".'
  speaker: Abelard Werserian
- guid: 0cebd36c-76b5-441f-822a-9e03f32d3538
  event: Companions_Seneschal_30
  text: '"Возможно, {g|Encyclopedia:AdeptusAstartes}Ангел Императора{/g} сможет рассказать вам о чем-то, что ему стало известно
    за время заточения в этих стенах. Узнайте, что у него на уме... только постарайтесь не злить — нрав у Ульфара поистине
    крутой!"'
  speaker: null
- guid: 8bc6d6cb-af97-4466-a49e-7807aee0e480
  event: Companions_Seneschal_31
  text: '"Возможно, {g|Encyclopedia:Xenos}ксенос{/g} Ирлиэт сможет что-то поведать вам о том, что это за место. В конце концов,
    она каким-то образом родственна тем, кто здесь обитает... и повинна в том, что мы с вами находимся здесь сейчас". {n}Абеляр
    умолкает, однако в его глазах легко прочитать все, что он думает о возвращении эльдарки в ряды ваших спутников.{/n}'
  speaker: Abelard Werserian
- guid: 42491e9b-cf0a-4496-91ec-0ca45a4e7bd6
  event: Companions_Seneschal_32
  text: '"Если вас так уж интересует это Богом-Императором проклятое место, то почему бы вам не спросить своего нового спутника?"
    {n}Абеляр смотрит на вас с едва скрываемым раздражением.{/n} "Ваше решение о том, чтобы присоединить его к своей свите,
    должно принести хотя бы какую-то пользу нашему положению".'
  speaker: Abelard Werserian
- guid: f3723c2a-9126-4326-a2f4-1b5057444a10
  event: Companions_Seneschal_33
  text: '"Хейнрикс наверняка мог бы что-то рассказать вам о нашем узилище... но его судьба нам до сих пор неизвестна".'
  speaker: null
- guid: 09e3d8cd-3b05-4178-9468-782b84d0ef9a
  event: Companions_Seneschal_34
  text: '"Нет, Лорд-капитан, и, поверьте, я бы хотел оставаться в этом блаженном неведении до своего последнего дня. Даже
    знание того, что это... эта... бездна вообще существует, отравляет мое сознание".'
  speaker: null
- guid: 6328ee13-386d-422c-ba6a-8d22dae5abba
  event: Companions_Seneschal_35
  text: '"Вы говорили с Хейнриксом? После его вызволения из плена он едва ли обменялся со мной десятком слов, но вряд ли будет
    отмалчиваться, если знает о чем-то, что может нам помочь!"'
  speaker: null
- guid: c0fc3c14-b85c-4eac-a401-327f79541119
  event: Companions_Seneschal_36
  text: '{n}Абеляр медлит. Наконец, вздохнув, опускает голову.{/n} "Я... не видел ее, Лорд-капитан. Но иногда... иногда словно
    слышу ее смех на отдалении. Или как будто чувствую, что руки касаются — как она делала, когда пыталась отвлечь от горестных
    раздумий... Но я отличаю явь от миража. Боюсь, теперь придется просто научиться жить с этим призраком, который является
    только мне. Видением ушедшего".'
  speaker: Abelard Werserian
- guid: d575556d-8416-4f87-a979-9a1204d03d96
  event: Companions_Seneschal_37
  text: '"Никак нет, Лорд-капитан. Я в здравом уме и памяти, служу династии фон Валанциус!" {n}Абеляр пытается придать своему
    голосу обычную строгость и крепость, но выходит это у него немного наигранно.{/n}'
  speaker: Abelard Werserian
- guid: ce781b6d-9a50-4523-8fec-f62a0a468196
  event: Companions_Seneschal_38
  text: '"Так точно, Лорд-капитан. Процедуры омоложения в очередной раз обратили время вспять, и не спрашивайте, сколько именно
    иголок в меня воткнули наши хирургеоны. Однако я исцелился от старческих недугов... Ну, большей их части. Нельзя избегать
    смерть вечно — каждый раз она откусывает от меня кусочек за кусочком".'
  speaker: null
- guid: 2b2d7902-0f52-47a2-b496-794b2576fb9c
  event: Companions_Seneschal_39
  text: '"Вольные Торговцы, подобные вам, также являются слугами {g|Encyclopedia:Imperium}Империума{/g}. Они наделены особыми
    правами и полномочиями, обладают огромной властью на своих территориях и пользуются безоговорочным уважением в других
    частях Простора. Наиболее могущественные из них — Каллигос Винтерскейл и Инцендия Бастаал-Чорда. Будьте осторожнее при
    контакте с любым из них".'
  speaker: null
- guid: da75986c-0107-4f81-8e2a-fe75c1485143
  event: Companions_Seneschal_40
  text: '"Трагедия с кораблем флота Даргонуса лишь подтверждает мои опасения: Кунрад не оставил попыток навредить вам и, вероятно,
    завершить свою миссию. Мастер шепотов по-прежнему распоряжается инструментами, которые он создал своими руками и которые
    скрыты в глубинах протектората фон Валанциус. Любой ваш подданный может быть агентом Мастера шепотов, который действует
    в его интересах. Остерегайтесь, Лорд-капитан".'
  speaker: null
- guid: b47ebc49-cf86-4a5d-bab3-5f31109d23b3
  event: Companions_Seneschal_41
  text: '"Благодарю за честь. Но вынужден отказаться. Я старый военный и верю в важность порядка во всем, в том числе — в
    субординации. Вы — Лорд-капитан, мой непосредственный командующий. Я не готов обращаться к вам никак иначе, кроме как
    с соблюдением полагающегося устава".'
  speaker: null
- guid: 547ed3da-44f2-45c8-a81d-b52e18d0dc80
  event: Companions_Seneschal_42
  text: '"Это тема для официального брифинга, а не обычной беседы, но я попробую ответить кратко — и, если позволите, своими
    словами". {n}Абеляр набирает в грудь воздуха и начинает.{/n} "{g|Encyclopedia:KoronusExpanse}Простор Коронус{/g} значительно
    удален от сердца Империума. Это значит, что здешние {g|Encyclopedia:Warp}варп{/g}-пути приходят в негодность за считанные
    месяцы, маршруты регулярно подвергаются нападениям разнообразного сброда, а в единственном крупном порту бок о бок швартуются
    пиратские посудины и имперские фрегаты".'
  speaker: Abelard Werserian
- guid: d2ae8950-e1a4-49a0-ac0c-98d549515ea9
  event: Companions_Seneschal_43
  text: '"Если вы успокаиваете себя мыслью, что мы больше не услышим о Кунраде, то совершенно напрасно. Вы разрушили его планы,
    тщательно подготовленное и выпестованное предательство. Он обязательно попробует нанести вам удар, пользуясь своими контактами
    и знаниями протектората. Вопрос только в том, сможете ли вы, Лорд-капитан, предугадать его следующие шаги".'
  speaker: null
- guid: 4be9bf8a-82f9-4e08-adf5-c378423ccaa9
  event: Companions_Seneschal_44
  text: '"Я вдовец", {n}— чинно отвечает Абеляр.{/n} "Четырежды отец, и, если эти сведения еще не устарели — одиннадцатикратный
    дед. Моя семья живет на Даргонусе. Никто из детей не выказал рвения или способностей к корабельной службе, и я не стал
    настаивать, чтобы они шли по моим стопам".'
  speaker: null
- guid: 72606f3f-5a0a-4db2-a515-63471307e8d3
  event: Companions_Seneschal_45
  text: '"Благодарю за столь высокое доверие, Лорд-капитан. Я буду и далее оправдывать его".'
  speaker: null
- guid: 5535f723-0865-4f1b-a965-38a5bc3b35bd
  event: Companions_Seneschal_46
  text: '"Благодарю вас, Лорд-капитан!" {n}Абеляр вытягивается в струнку и складывает руки аквилой.{/n} "Под моим присмотром
    торговый протекторат будет пребывать в безопасности и преуспевать в служении вам!"'
  speaker: Abelard Werserian
- guid: d7331f51-1d43-4b0d-9f82-3715be8df358
  event: Companions_Seneschal_47
  text: '"Ни в коей мере, Лорд-капитан". {n}Во взгляде Абеляра читается невиданный вами раньше холод, однако его голос и выражение
    лица не выдают ничего, кроме почтения к свое{mf|му|й} влады{mf|ке|чице}.{/n}'
  speaker: null
- guid: 7ac4006e-6682-4719-9978-5fd86e183a37
  event: Companions_Seneschal_48
  text: '{n}Сенешаль вздыхает.{/n} "При Леди Теодоре я неоднократно исполнял роль управителя торгового протектората. При этом
    я находился на Даргонусе, а не в странствиях с Вольным Торговцем. Если это возможно... после того, как непосредственная
    потребность в моем присутствии будет исчерпана... я бы хотел вернуться к той позиции. Присматривать за торговым протекторатом
    на мире-столице, попутно главенствуя над родом Версериан — и своим авторитетом помогая им возвыситься".'
  speaker: null
- guid: 1e5734d1-f10f-4d8d-84f2-00007ed99abc
  event: Companions_Seneschal_49
  text: '"Но таков мой долг перед Вольным Торговцем — неусыпно нести вахту подле Лорд-капитана, служить опорой в самые темные
    времена — для вас и для меня". {n}Абеляр выпрямляется и смотрит вам в глаза с мрачной убежденностью.{/n} "Я {d|Encyclopedia:CompAbelard_Q1_OldWays}не
    отступлюсь от своей роли{/d}, чтобы не происходило. Не сомневайтесь во мне. Семья Версериан сделает выводы из произошедшего
    и, если наша кровь чего-то стоит, будет готова к новым испытаниям без моей опеки".'
  speaker: Abelard Werserian
- guid: b883abcb-301b-44e9-9fca-b1f2b918b221
  event: Companions_Seneschal_50
  text: '"Сказать вам по правде, Лорд-капитан, вся эта ситуация заставила меня задуматься..." {n}Абеляр медлит, ему явно неловко.{/n}
    "Как патриарх семьи Версериан, я несу ответственность перед своей родной кровью. Да, мой долг — служить сенешалем Вольному
    Торговцу, и я ни в коей мере не намерен отступаться от этой роли, если я вас устраиваю так же, как устраивал Леди Теодору.
    Однако если бы у меня {d|Encyclopedia:CompAbelard_Q1_NewWays}была возможность{/d} принять более деятельное участие в семейных
    делах и притом продолжать служить роду фон Валанциус..."'
  speaker: Abelard Werserian
- guid: dcf36b59-d40e-4127-b444-664930cef0d2
  event: Companions_Seneschal_51
  text: '{n}Тень печальной улыбки мелькает и сразу тает на лице сенешаля.{/n} "Для Вольного Торговца разумно иметь тайники,
    в которых можно сберечь важную информацию. И совершенно неразумно делиться их координатами даже с самыми приближенными
    лицами".'
  speaker: null
- guid: baa82cce-fa6e-4d27-9174-f2b5cdc872ce
  event: Companions_Seneschal_52
  text: '{n}Сенешаль берет в руки инфопластину. Его нахмуренные брови сходятся на переносице. {/n}"Боюсь мне неизвестно, как
    найти тайники, но кое-чем я все же могу помочь". {n}Абеляр протягивает инфопластину вам.{/n} "Этот числовой код ваша предшественница
    использовала для дезактивации некоторых систем защиты на своей службе. Если я знал Леди Теодору достаточно хорошо, то
    могу быть уверенным, что свои тайники она оставила под надежной защитой — в этом случае, код пригодится и вам".'
  speaker: null
- guid: a94bac52-5c4c-4137-aa5f-cfb4f73d3d67
  event: Companions_Seneschal_53
  text: '{n}На мгновение взгляд Абеляра становится пустым, будто обращенным внутрь себя. Затем он пару раз моргает и удивленно
    произносит:{/n} "Хмм. Нет. Определенно нет. Ничего такого не припомню".'
  speaker: null
- guid: 031e99f1-3079-4a7c-8d3e-3b10fc3b0851
  event: Companions_Seneschal_54
  text: '{n}Абеляр, прищурившись, долго смотрит вам в лицо, а затем тихо произносит:{/n} "Девушке, которая мне нравилась,
    я дарил янусские лилии, но этот сорт давно вымер... Остался лишь в моей памяти. Спросите кого другого, Ваша Светлость.
    Я слишком стар, чтобы помнить, как обаять девушек". {n}Насупившись, сенешаль отводит взгляд.{/n}'
  speaker: Abelard Werserian
- guid: fd5b7400-9562-46b6-b168-0e25f5ee2b30
  event: Companions_Seneschal_55
  text: '"Лорд-капитан! Дозвольте еще раз изъявить свою благодарность за вашу помощь. Если бы не ваше вмешательство..." {n}Абеляр
    потрясенно качает головой.{/n} "...я мог бы лишиться всей своей семьи, казненной по ложному обвинению! Я и не представлял,
    насколько уязвимы Версерианы, когда я — сенешаль само{mf|го|й} Лорд-капитана — вдали от дома".'
  speaker: Abelard Werserian
- guid: de4ddfba-5a35-43d9-b0a6-60a6f683fc8c
  event: Companions_Seneschal_56
  text: '"Что ж, Лорд-капитан..." {n}Абеляр чуть медлит, на его лице — печать прожитых лет, в эту минуту проступившая особенно
    явно.{/n} "Позвольте выразить свое сожаление, что семья Версериан {d|Encyclopedia:CompAbelard_Q2_KilledFamily}не оправдала{/d}
    возложенных на нее обязательств и оказанного доверия. Надеюсь, дворянский род, который в будущем займет ее место, проявит
    себя лучше, чем моя кровь".'
  speaker: Abelard Werserian
- guid: c73a1023-3cc8-409c-b514-721efe0e5893
  event: Companions_Seneschal_57
  text: '"Я не могу опекать свой род, словно они малые дети. Когда-то я подобным образом попытался опекать вас... и быстро
    выяснил, что у вас есть своя голова на плечах и свои суждения — пускай я и не всегда с ними соглашаюсь. Нет, мой долг
    — быть подле вас. Быть сенешалем".'
  speaker: null
- guid: a98fa809-f3d5-4200-b177-ddfedfbdda7b
  event: Companions_Seneschal_58
  text: '"Лорд-капитан..." {n}Старый офицер поднимает густые брови в непритворном изумлении — и облегчении.{/n} "Не знаю,
    за какие мои заслуги вы столь снисходительны к старику... но я не буду перечить приказу Вольного Торговца — тем более
    что даже желания такого не имею! Ох, только бы вот успеть вам нового сенешаля на смену себе воспитать..."'
  speaker: null
- guid: 160cd945-ea63-464f-a4cd-6eca5bfa6322
  event: Companions_Seneschal_59
  text: '{n}Абеляр порывается что-то сказать, но в последний момент останавливает себя. Морщинки на его лбу разглаживаются.{/n}
    "Я понимаю, Лорд-Капитан. Что ж, в таком случае — забудьте то, о чем я сказал. Мое место — подле Лорд-капитана, ибо таков
    мой долг сенешаля".'
  speaker: Abelard Werserian
- guid: f9ed09e8-3860-477b-a029-c5b4713418e5
  event: Companions_Seneschal_60
  text: '"Что ж, Лорд-капитан. Время мне вернуться к своим обязанностям. Могу ли я быть вам еще чем-то полезен?"'
  speaker: null
- guid: 4f3763cf-158c-4014-8b44-508168fb6116
  event: Companions_Seneschal_61
  text: '{n}Сенешаль качает головой.{/n} "Не сомневайтесь, Лорд-капитан. Я намерен исполнять долг сенешаля до своего последнего
    полезного вздоха".'
  speaker: null
- guid: 9ba5b0fb-5e57-4c65-8392-d79b331731d8
  event: Companions_Seneschal_62
  text: '{n}Абеляр устало прикрывает глаза.{/n} "Рад это слышать".'
  speaker: Abelard Werserian
