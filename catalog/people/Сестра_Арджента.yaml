name: Сестра Арджента
sound_keys:
- Argenta
- Sororitas
doc: docs/characters/Сестра_Арджента.md
total_phrases: 264
phrases:
- guid: 2f576dcd-8be0-4cb5-84f5-a2c95b42df3e
  event: BNTRS_AreaPeaceful_Argenta_10
  text: '"Лейра? Это оттуда ты выползла? Отлично, я запомню. Еще одно место, которое нуждается в порции очистительного огня".'
  speaker: Сестра Арджента
- guid: 63ab5e47-43ff-4e2b-b36c-b2412b5fbe90
  event: BNTRS_AreaPeaceful_Argenta_3
  text: '"Что в убежище делают все эти блюстители и воины? Почему они не на улицах, не дают отпор врагам Человечества?"'
  speaker: Сестра Арджента
- guid: 46effd9c-9df4-4ce7-9a6b-14b1d5f9aad1
  event: BNTRS_AreaStressful_Argenta_100
  text: '"Да-а, немного я видела мест, хвастающих такой роскошью. Если соскрести позолоту со всех храмов Футфола, ее и то
    будет меньше".'
  speaker: Сестра Арджента
- guid: 0c3f2426-9c52-44d2-aa65-bad9df771e92
  event: BNTRS_AreaStressful_Argenta_113
  text: '"Нет. Я собственными глазами... Стойте. Кто это там?"'
  speaker: Сестра Арджента
- guid: 0949b2ad-0f79-4ee7-ba45-2c93e67969f0
  event: BNTRS_AreaStressful_Argenta_119
  text: '"Если ведьма говорит о врагах Человечества, что поразили эту обитель благородных навигаторов, то наше оружие быстро
    развеет их порочную тоску!"'
  speaker: Сестра Арджента
- guid: 7e001543-73dd-45ea-922d-dcfbd674cdde
  event: BNTRS_AreaStressful_Argenta_127
  text: '"Эти грешники должны в слезах благодарить за то, что им дали шанс искупить вину тяжким трудом".'
  speaker: Сестра Арджента
- guid: 16313f2e-7401-4d28-878c-c1872c7d80aa
  event: BNTRS_AreaStressful_Argenta_13
  text: '"Слова успокоения из твоих уст, ведьма — для меня повод быть начеку втрое против обычного!"'
  speaker: Сестра Арджента
- guid: 2ae3295d-28b6-4570-b443-85027d450ef8
  event: BNTRS_AreaStressful_Argenta_130
  text: '"Да не устрашат сердца верных гнусные речи врагов Человечества, да укрепится вера наша пред ликом всякой скверны
    и погани..."'
  speaker: Сестра Арджента
- guid: e578e09b-483e-4bb2-b89c-610bc3fbe21c
  event: BNTRS_AreaStressful_Argenta_133
  text: '"Боль целого погибшего мира — тяжкое бремя, оно способно разбить сердце и надломить дух. Все ли готовы к встрече
    с ней?"'
  speaker: Сестра Арджента
- guid: 3a031975-57f0-46f7-abd3-65f27c6ca796
  event: BNTRS_AreaStressful_Argenta_138
  text: '"Эти люди просты душой и усердны в труде, как и надлежит быть верным детям Империума".'
  speaker: Сестра Арджента
- guid: 7c269548-3e56-462a-a34d-c5d757ac5bab
  event: BNTRS_AreaStressful_Argenta_141
  text: '"Да укрепит Его свет наши сердца... нас ждут новые испытания в этом месте".'
  speaker: Сестра Арджента
- guid: b0aa8e7e-d2a7-474d-9deb-a033880f1b1c
  event: BNTRS_AreaStressful_Argenta_148
  text: '"Если губернатор искренен в своей вере и служении Императору, то, я уверена, он делает все, что в его силах".'
  speaker: Сестра Арджента
- guid: 11906d4e-7893-4927-a544-d5a46033f000
  event: BNTRS_AreaStressful_Argenta_155
  text: '"Здесь всюду грязные следы Архиврага. Что за нечестивое место! Еретиков настиг единственно возможный для них конец
    — они приняли смерть от рук праведных слуг Императора".'
  speaker: Сестра Арджента
- guid: 7c198d16-e0c5-4281-b4a5-10e01c6edb8d
  event: BNTRS_AreaStressful_Argenta_159
  text: '"Я молюсь за их души. И я молюсь, чтоб Император послал нам встречу с командирами еретиков, виновными в этом зле.
    Быть орудием праведного отмщения — о что за желанная участь!"'
  speaker: Сестра Арджента
- guid: 2994dba9-09f3-4e98-bd05-f56c278139da
  event: BNTRS_AreaStressful_Argenta_18
  text: '"Свет Императора рассеет любую ложь. Но тебе, конечно, этого не понять".'
  speaker: Сестра Арджента
- guid: 605d9006-f742-4c9f-b0ea-a0b2ab077121
  event: BNTRS_AreaStressful_Argenta_20
  text: '"''Темные кузены'' — то есть ксеносы, отвратительные даже их отвратительной родне? Для моего оружия здесь найдется
    работа!"'
  speaker: Сестра Арджента
- guid: 86d87fe4-07c8-4442-a889-09198d6d0c19
  event: BNTRS_AreaStressful_Argenta_23
  text: '"Варп — это море зла, неустанно тянущее руки к нашим душам. Неудивительно, что именно корабли, путешествующие через
    варп, часто встречают беду".'
  speaker: Сестра Арджента
- guid: 0b038bc4-f548-4781-90b5-97068956d2f7
  event: BNTRS_AreaStressful_Argenta_31
  text: '"Даже нечестивые ксеносы не в силах совладать с постигшей их напастью. Сколь жалко выглядят их пустые оболочки..."'
  speaker: Сестра Арджента
- guid: 02d72d77-4662-449c-a172-8305b49f9c3e
  event: BNTRS_AreaStressful_Argenta_45
  text: '"Место, где мы сейчас находимся, должно было быть всего лишь залом храма. А теперь сюда втиснулся целый город!"'
  speaker: Сестра Арджента
- guid: a4b6e7ff-4195-46e0-a19e-aedc002d5fcf
  event: BNTRS_AreaStressful_Argenta_48
  text: '"Друзианцы — особый орден. Они учат довольствоваться малым, и сами cледуют этому принципу".'
  speaker: Сестра Арджента
- guid: 7411f74c-b0b5-4381-8790-f1af896f36e1
  event: BNTRS_AreaStressful_Argenta_57
  text: '"Теневые кварталы... В мои дни на Футфоле я, бывало, брала оружие и бродила здесь, ожидая встречи с мутантом или
    бандитом".'
  speaker: Сестра Арджента
- guid: 8ee4d1d0-fd5b-4ec2-9a82-47402ab7433d
  event: BNTRS_AreaStressful_Argenta_60
  text: '"Для таких, как ты, и самая искренняя молитва будет отравой".'
  speaker: Сестра Арджента
- guid: def47a37-c82f-4c31-a6ed-c4bfa5e62bad
  event: BNTRS_AreaStressful_Argenta_7
  text: '"Направь мою руку, чтобы верный удар настиг еретиков, покусившихся на эти палаты... ни один злодей не уйдет от возмездия
    Бога-Императора, что несут наши длани!"'
  speaker: Сестра Арджента
- guid: e6621c0e-5c81-4a16-8968-f74bc6d6bcaf
  event: BNTRS_AreaStressful_Argenta_72
  text: '"Это место пропитано скверной, а значит — должно быть очищено. Огнем. До самого дальнего закутка".'
  speaker: Сестра Арджента
- guid: 5b726e71-4291-4b22-8e25-e260d1d4cc2d
  event: BNTRS_AreaStressful_Argenta_80
  text: '"Разве помощь какой-то контрабандистке — достойное дело для Вольного Торговца?"'
  speaker: Сестра Арджента
- guid: ef8f681b-55b8-4d7c-beab-ad9510be0c23
  event: BNTRS_AreaStressful_Argenta_86
  text: '"Покаяние в тюрьме — тень истинного преображения души. Только в бою, отринув плотское и облачив душу пламенем, можно
    заслужить прощение".'
  speaker: Сестра Арджента
- guid: b04ae8c1-3a20-46f9-87a3-673d49d015c1
  event: BNTRS_Chapter1_Argenta_04
  text: '"Пока сильны слуги Омниссии и стойка вера монахов Электродинамической Обители, скверна не посмеет больше коснуться
    ее".'
  speaker: Сестра Арджента
- guid: f0e0423e-38f5-4c0a-afd9-f525e3483b27
  event: BNTRS_Chapter1_Argenta_10
  text: '"Поступок Эвейна был благороден, но безрассуден. Нельзя спасти того, кто добровольно обратился к ереси".'
  speaker: Сестра Арджента
- guid: 0f812f20-f28d-4985-9cec-2851b1748efd
  event: BNTRS_Chapter1_Argenta_15
  text: '"Планетарный бунт... как можно было допустить восстание еретиков такого масштаба? Неужто Райкад лишен зрячих и верных,
    что могли бы поднять тревогу?"'
  speaker: Сестра Арджента
- guid: 76ebe4e1-f8f1-4dc4-9267-9cdcd47b6cee
  event: BNTRS_Chapter1_Argenta_23
  text: '"Тебя что-то тревожит, Кассия? Не бойся — я защищу тебя от любого еретика, осмелившегося покуситься на зрящую Его
    свет!"'
  speaker: Сестра Арджента
- guid: f04c5f62-60df-4fda-a84c-de42818e58d6
  event: BNTRS_Chapter1_Argenta_29
  text: '"Я возношу молитвы за души невинных. И за то, чтоб души виновных не обрели покоя".'
  speaker: Сестра Арджента
- guid: 6f01795a-5c78-4a4b-93fb-a808a4f5dabf
  event: BNTRS_Chapter1_Argenta_34
  text: '"Чем гуще мрак, тем ярче пламя в наших сердцах! Сплотимся перед ликом катастрофы!"'
  speaker: Сестра Арджента
- guid: 9eb8f8c1-9514-4336-833e-8a14f24b0345
  event: BNTRS_Chapter1_Argenta_38
  text: '"В служении Ему найдут они силу и стойкость. Только так отвратят сердца свои от слабостей, что ведут к ересям".'
  speaker: Сестра Арджента
- guid: f41f1513-7283-4993-93ea-ab03f38212db
  event: BNTRS_Chapter1_Argenta_41
  text: '"Избавь меня от своих стенаний, ведьма. Каждый голос, что звучит в твоем сознании — шепот Архиврага!"'
  speaker: Сестра Арджента
- guid: 5dc74c4a-9445-43a2-9696-869471d206a9
  event: BNTRS_Chapter1_Argenta_50
  text: '"Истинно верующие найдут общий язык — если не на словах, то в общем желании очистить этот мир от скверны!"'
  speaker: Сестра Арджента
- guid: ea2c38ad-22ca-4941-b6a5-12c9de5111df
  event: BNTRS_Chapter1_Argenta_59
  text: '"Мне жаль слабых и невинных, что стали жертвами чужих грехов... лучше сражаться на передовой, чем принимать те решения,
    что выпадают сенешалю".'
  speaker: Сестра Арджента
- guid: 1a82b338-302c-4a71-a6b7-bb639236bf35
  event: BNTRS_Chapter2_Argenta_06
  text: '"Как странно слышать от ксеноса рассуждения о скверне. Вы сами — нечистые творения, и все же опасаетесь того же,
    с чем ведем непримиримую войну мы".'
  speaker: Сестра Арджента
- guid: 02f20101-0dcc-4aa4-8144-16fb1eb68a9f
  event: BNTRS_Chapter2_Argenta_10
  text: '"Когда придет время, мы встанем несокрушимой стеной на пути скверны, что охватила этот мир. Мы не отдадим Архиврагу
    больше и пяди!"'
  speaker: Сестра Арджента
- guid: 3b8a20f5-e224-4caa-8fdb-5df44f22529b
  event: BNTRS_Chapter2_Argenta_104
  text: '"В один день сила твоего обещания иссякнет, словно пересохший родник. Я молюсь, что в тот день я буду рядом... чтобы
    прекратить эту ересь. Раз и навсегда".'
  speaker: Сестра Арджента
- guid: cebf09b8-dbed-47dd-bfd1-326df89872cd
  event: BNTRS_Chapter2_Argenta_106
  text: '"Ответ мы получим только когда нечестивый морок вновь явится на корабль и заберет в пасть Архиврага новые невинные
    жертвы".'
  speaker: Сестра Арджента
- guid: 2967a62b-87ca-4de8-b61d-cc094e456f59
  event: BNTRS_Chapter2_Argenta_111
  text: '"День, когда ведьма отправляется в небытие, должен отмечаться как праздник".'
  speaker: Сестра Арджента
- guid: edb2a720-9e55-4b0f-94e2-5c48d834fd58
  event: BNTRS_Chapter2_Argenta_116
  text: '"Отрекшиеся от Него при жизни не достойны Его милости в посмертии".'
  speaker: Сестра Арджента
- guid: e632693b-64d3-4f53-b160-8240e6e58c15
  event: BNTRS_Chapter2_Argenta_126
  text: '"Путь Избранни{mf|ка|цы} Императора делает странные извивы... но пока твое сердце преисполнено веры, я приветствую
    тебя в наших рядах".'
  speaker: Сестра Арджента
- guid: 29baaf6e-5fcb-4a27-9536-9db5ec056f58
  event: BNTRS_Chapter2_Argenta_132
  text: '"Каждый слуга Империума должен исполнять предписанный ему долг... и сердце мое радуется от того, что мой долг — уничтожать
    ересь, а не гнить среди бумаг".'
  speaker: Сестра Арджента
- guid: 7edfc37a-c26b-498a-80e6-2d78464e8856
  event: BNTRS_Chapter2_Argenta_147
  text: '"Ксенос среди людей... пригласить ее к себе все равно что пригреть змею на груди".'
  speaker: Сестра Арджента
- guid: f05eb6f5-ae85-4352-9c8a-56e74261d8c1
  event: BNTRS_Chapter2_Argenta_15
  text: '"Даргонус подвергся атаке ксеносов, но устоял! Это ли не знак того, что Бог-Император защищает истово верующих".'
  speaker: Сестра Арджента
- guid: 79adfaff-2022-40b3-99ea-5d550cdd4666
  event: BNTRS_Chapter2_Argenta_28
  text: '"Я дрожу от ярости, вспоминая, что этот еретик посягал на святой Патент! День, когда мы предадим его смерти, будет
    моим личным праздником".'
  speaker: Сестра Арджента
- guid: b06235e9-a9d8-4776-a2c1-e7d86e1081e8
  event: BNTRS_Chapter2_Argenta_30
  text: '"Священный экстерминатус... я впервые видела его во всем его огненном величии..."'
  speaker: Сестра Арджента
- guid: 32195520-6d6b-488e-ad5d-9a8cdc25cc83
  event: BNTRS_Chapter2_Argenta_58
  text: '"Благородные семьи тратят силы и время на нелепую борьбу за власть, а должны бы — на укрепление воинской мощи и святой
    веры".'
  speaker: Сестра Арджента
- guid: a8197fff-7433-4414-ba68-32de01337b9f
  event: BNTRS_Chapter2_Argenta_62
  text: '"Проповедники хулы и скверны выискивают сердца и умы послабее, дабы заронить туда семена ереси. Будем молиться о
    том, что во владениях фон Валанциус более не найдется таковых".'
  speaker: Сестра Арджента
- guid: 1e75ba8a-031f-4cd5-9663-5865da5e2f83
  event: BNTRS_Chapter2_Argenta_66
  text: '"Гибель "Йесевона" — ужасная утрата. Миллионы паломников сгинули во мраке ереси, унеся с собой искру Его".'
  speaker: Сестра Арджента
- guid: e4cfe94c-f30d-4107-a2d7-d5f9f9274725
  event: BNTRS_Chapter2_Argenta_73
  text: '"Архивраг не дремлет ни мгновения, высматривая, где бы нанести удар по верным. Этот корабль — лишь еще один пример
    из массы, напоминание о том, что у нас нет права терять бдительность".'
  speaker: Сестра Арджента
- guid: 6305c0de-c15c-4e85-af79-f64e1be8aea3
  event: BNTRS_Chapter2_Argenta_76
  text: '"Я там, где требуется гнев Его, что опалит нечестивое, изгонит скверное и очистит скорбные юдоли слуг его".'
  speaker: Сестра Арджента
- guid: 8b781019-40ec-4497-97ed-fa71e055efb1
  event: BNTRS_Chapter2_Argenta_78
  text: '"Молитва у священного Патента наполнила меня решимостью исполнить свою миссию... с поддержкой Вольного Торговца я
    вырву святыню из рук еретиков!"'
  speaker: Сестра Арджента
- guid: e4405175-456c-4924-a85a-2579531a03eb
  event: BNTRS_Chapter2_Argenta_82
  text: '"Почему он узнал мое лицо, ведьма? Надо думать — потому, что часто видел его в кошмарах. Надеюсь, и к тебе они приходят".'
  speaker: Сестра Арджента
- guid: d1d496f2-47ea-4993-a6c0-d3ea7a973d45
  event: BNTRS_Chapter2_Argenta_91
  text: '"Навигаторы, зрящие золотой свет сквозь тьму и безумие, не должны быть подвержены распрям! Величие их миссии должно
    беречь от низменных порывов, разве не так?"'
  speaker: Сестра Арджента
- guid: 9c087a5e-b930-43b5-9605-69fa237b4289
  event: BNTRS_Chapter2_Argenta_98
  text: '"Нечестивые голоса из мрака не в восторге от триумфального возвращения слуг Его из обители ереси? Вот ведь удивительно!"'
  speaker: Сестра Арджента
- guid: ca1036bf-1f09-43f9-beb5-7faacdb83c53
  event: BNTRS_Chapter3_Argenta_03
  text: '"Сенешаль Версериан. Я рада, что вы все еще с нами и не утратили твердости".'
  speaker: Сестра Арджента
- guid: 42ae248e-9313-4a04-b5e7-34b40764df39
  event: BNTRS_Chapter3_Argenta_11
  text: '"О как я жду блаженного мига, когда предатель Кунрад Войгтвир понесет заслуженное наказание".'
  speaker: Сестра Арджента
- guid: 6a266478-ebaf-4f0c-ac3a-c1f21312170b
  event: BNTRS_Chapter3_Argenta_117
  text: '"Что бы ни ждало нас впереди — исход любой битвы предрешен, ибо с нами — ангел Его!"'
  speaker: Сестра Арджента
- guid: f33a456d-f0ce-4d95-ade8-949b6931c576
  event: BNTRS_Chapter3_Argenta_134
  text: '"Мы все повинны в грехе терпимости. Надеюсь, что смерть ее хоть немного облегчит бремя на наших душах".'
  speaker: Сестра Арджента
- guid: 2821dbb3-4a0f-43c0-aa57-09b72368b7df
  event: BNTRS_Chapter3_Argenta_143
  text: '"Единственное оправдание твоего существования — помощь тем, кого ты предала. Не забывай об этом".'
  speaker: Сестра Арджента
- guid: 61d45e22-d636-4246-af36-a890f5b96a5c
  event: BNTRS_Chapter3_Argenta_19
  text: '"Бог-Император не оставит верных своих. Мы близимся к выходу из этого лабиринта... я чувствую это всем сердцем".'
  speaker: Сестра Арджента
- guid: 79b94fa7-4cda-4c58-a71e-cc9b199c81e8
  event: BNTRS_Chapter3_Argenta_29
  text: '"Теперь, когда душа моя избавлена от тягостной тайны, мне стало..."'
  speaker: Сестра Арджента
- guid: 13e222f5-d2bd-43ee-b984-8a8a7ea21f17
  event: BNTRS_Chapter3_Argenta_32
  text: '"Ярость бурлила во мне и нашла выход через смерть. Я не отыскала сил, чтобы прокричать правду в лицо миру. Но Вольный
    Торговец простил{mf||а} мое малодушие".'
  speaker: Сестра Арджента
- guid: f5a8c44c-5811-44d1-b8f8-3af32834bf2e
  event: BNTRS_Chapter3_Argenta_36
  text: '"Ч... что? Ты... благодаришь меня за... отступись от меня, ибо мне не нужно твое одобрение!"'
  speaker: Сестра Арджента
- guid: 85e8c877-32ed-440a-975f-be5fc65002ef
  event: BNTRS_Chapter3_Argenta_39
  text: '"Да. По крайней мере, так мне казалось. Затем я поняла, что угодила из малой клетки в клетку крупнее... и мне предстояло
    найти путь уже из нее".'
  speaker: Сестра Арджента
- guid: 75164ff5-0978-4bd2-8169-098b1ceaae63
  event: BNTRS_Chapter3_Argenta_40
  text: '"Я вижу следы тяжких ран на вашем теле, магос. Ран, от которых не оправляются".'
  speaker: Сестра Арджента
- guid: fc5d447a-cbad-4766-8179-d40c2e8336c1
  event: BNTRS_Chapter3_Argenta_45
  text: '"Вспоминай свет Астрономикона, Кассия. Вспоминай Его вечное святое сияние. Пускай память о нем поможет тебе проложить
    наш путь на свободу!"'
  speaker: Сестра Арджента
- guid: 3ae2ed7e-1bb1-4662-ac5f-ea4c47966976
  event: BNTRS_Chapter3_Argenta_55
  text: '"Чем гуще мрак вокруг, тем ярче пламя в моей душе. Ибо я клялась быть маяком для верных, и даже смерть не освободит
    от этой клятвы".'
  speaker: Сестра Арджента
- guid: 00976522-8afe-4c95-ad8d-9b4d653ed8ab
  event: BNTRS_Chapter3_Argenta_60
  text: '"Почему ты не осталась на попечении своего нового покровителя? Разве не была бы ты более счастлива там, где правит
    ересь?"'
  speaker: Сестра Арджента
- guid: c36910c6-8584-4fc0-a18c-464ec52234d5
  event: BNTRS_Chapter3_Argenta_68
  text: '"Твои мотивы и методы сотканы из тени, Джай... но, кажется, помогают тебе выжить даже в самых темных углах вселенной".'
  speaker: Сестра Арджента
- guid: e238187e-faca-4e7e-bb67-0912d625c3e5
  event: BNTRS_Chapter3_Argenta_80
  text: '"Магнэ Ацессио была достойной избранни{mf|ка|цы} Императора. Но я рада, что мы покинули безопасные стены и вновь
    стремимся в пыл битвы!"'
  speaker: Сестра Арджента
- guid: edcde3ae-ea93-44f4-b333-f74d0759973a
  event: BNTRS_Chapter3_Argenta_84
  text: '"Пусть мерзость этого сквернавца не выделяет его в вашем сердце среди прочих его гнусных сородичей. Поступить так
    надо с каждым".'
  speaker: Сестра Арджента
- guid: 75be478f-f0b7-4487-b881-7b319afd2da7
  event: BNTRS_Chapter4_Argenta_07
  text: '"Изничтожение ксеносов на Кетца Темере было долгом, который Вольный Торговец исполнил{mf||а} с честью. Ряды врагов
    Человечества скудеют — отрадная новость!"'
  speaker: Сестра Арджента
- guid: 5435c095-a575-4c05-8e2a-406642203bdd
  event: BNTRS_Chapter4_Argenta_103
  text: '"Где-то в душе я знала: только мне под силу отыскать путь к месту последнего упокоения святой Ардженты. Теперь...
    мой долг исполнен".'
  speaker: Сестра Арджента
- guid: dc240b83-c43f-46fe-89d8-9fa428ac9066
  event: BNTRS_Chapter4_Argenta_124
  text: '"Нельзя вверять свою судьбу порождению вредоносного ксеносского разума. Впрочем, если это избавит тебя от одержимости
    силами Архиврага..."'
  speaker: Сестра Арджента
- guid: 271253cc-01c7-4e4c-bdfb-c0dd6ffa73a3
  event: BNTRS_Chapter4_Argenta_142
  text: '"Ересь привлекает ересь. Почему я не удивлена".'
  speaker: Сестра Арджента
- guid: 10380d74-69fa-4e5c-986b-335cdcf307c3
  event: BNTRS_Chapter4_Argenta_152
  text: '"Тебя ослепила гордыня, Паскаль. Так начинаются великие ереси — человек отвергает канон и заменяет веру в Него верой
    в себя".'
  speaker: Сестра Арджента
- guid: bc104395-7ba2-4e55-8c28-14f30cf53d38
  event: BNTRS_Chapter4_Argenta_169
  text: '"По крайней мере тебе ведомо некое подобие благодарности, ксенос. Вольный Торговец — единственная причина, почему
    ты все еще жива. Справедливо воздать {mf|ему|ей} по заслугам".'
  speaker: Сестра Арджента
- guid: 82d45b60-ac8b-4190-a43d-7a650c6c1660
  event: BNTRS_Chapter4_Argenta_20
  text: '"Спасение — следствие Его неизмеримой милости к верным делу Его, а не плод заключенных тобой сделок. Император не
    торгуется".'
  speaker: Сестра Арджента
- guid: 066fa3ad-a721-45d0-b171-6b995cf7407f
  event: BNTRS_Chapter4_Argenta_25
  text: '"Я молю Бога-Императора, чтобы под главенством Инцендии Чорда Футфол прошел через все выпавшие ему испытания и очистился,
    восстав к жизни обновленным".'
  speaker: Сестра Арджента
- guid: 82efd8e5-8761-4b55-b9b7-69f29b968b7c
  event: BNTRS_Chapter4_Argenta_35
  text: '"Стремления Инцендии Чорда понятны мне, но то, как она воплощает их... мне сложно найти оправдание для насилия над
    теми, кто должен полагаться на защиту праведных".'
  speaker: Сестра Арджента
- guid: 4d292a9e-7374-42df-83a3-a114b32bd40d
  event: BNTRS_Chapter4_Argenta_67
  text: '"Врагам Человечества нанесен удар. Достойное воздаяние за страдания, что эти чудовища причиняли невинным и слабым".'
  speaker: Сестра Арджента
- guid: a352497e-f2fd-4964-9246-4413015b0bc6
  event: BNTRS_Chapter4_Argenta_73
  text: '"Каллигос был из тех, для кого погибнуть в бою было величайшим желанием всей жизни. Что ж, его чаяние сбылось".'
  speaker: Сестра Арджента
- guid: 8e5a4b3c-c737-4fbb-a80a-4b22378d25da
  event: BNTRS_Chapter4_Argenta_83
  text: '"Ефрат осаждают силы Архиврага — значит, там место праведных. Те, кто сомневается и боится, могут отступиться — и
    дать дорогу истинным сынам и дочерям Его".'
  speaker: Сестра Арджента
- guid: 2ebd4fbf-9f99-4ac2-96cf-689f6f27f4f6
  event: BNTRS_Chapter4_Argenta_96
  text: '"Тайна места последнего упокоения моей покровительницы раскрыта. Я чувствую... покой. Какое удивительное, светлое
    чувство".'
  speaker: Сестра Арджента
- guid: e82a7305-0139-4fdf-9e16-3d00d1381493
  event: BNTRS_Chapter4_Argenta_99
  text: '"На Салис Прайм мы сразили еще одного почитателя Последнего восхода... сколько еще таких еретиков разбросано по Простору?
    Сколько еще готовятся нанести удар?"'
  speaker: Сестра Арджента
- guid: ee1e7bd4-57ac-461e-a418-705b3430b7be
  event: BNTRS_Chapter5_Argenta_16
  text: '"Брат Ульфар, не желаешь ли ты помолиться за то, чтобы души твоих братьев нашли свой путь к Золотому Трону?"'
  speaker: Сестра Арджента
- guid: b5182c7b-5f94-43bc-bb5c-daa7338eba56
  event: BNTRS_Companion_DLC3_Argenta_25
  text: '"Твои изречения длинны, запутанны и велеречивы, генетор. Они сеют яд вольнодумства в податливых умах и сердцах, и
    заражают разум скверной. Прими епитимью и смири сердце в покаянии".'
  speaker: Сестра Арджента
- guid: 17209cdf-386a-43ad-9ebd-b3ff835f0cdd
  event: BNTRS_Companion_DLC3_Argenta_48
  text: '"Опасно излишне задумываться о сущем, ибо размышления порождают сомнение. А от сомнения до ереси — один шаг".'
  speaker: Сестра Арджента
- guid: e9556111-3477-4bf6-b5da-566945779fba
  event: BNTRS_DLC2_Argenta_03
  text: '"Скажи, Соломон, ты никогда не колебался, вынося приговор? Никогда не просыпался среди ночи, пытаясь понять, насколько
    ты был безупречен в своих суждениях?"'
  speaker: Сестра Арджента
- guid: 2ccc178d-d32c-41f1-a4e7-fca5465abc0c
  event: BNTRS_DLC2_Argenta_121
  text: '"Молчи, ведьма. Ты не знаешь, как раскаяние может снедать человека и что истинно верующие сами выбирают для себя
    наказание".'
  speaker: Сестра Арджента
- guid: 28ace607-d2e0-4095-b6cd-8af53a651725
  event: BNTRS_DLC2_Argenta_141
  text: '"Отрадно видеть, что ряды нашей свиты пополняются истово верующими слугами Его!"'
  speaker: Сестра Арджента
- guid: 7de48d9b-4c82-4280-ae01-ec33ec9ed80f
  event: BNTRS_DLC2_Argenta_148
  text: '"Предвкушение битвы с еретиками переполняет силой и меня! Вперед!"'
  speaker: Сестра Арджента
- guid: 1fa00930-ffaf-4ac2-8d68-fdd45912e424
  event: BNTRS_DLC2_Argenta_177
  text: '"Эти люди должны были нести смерть врагам Человечества, но оказались заперты здесь. Сколько же из них погибло здесь,
    так и не вкусив радости битвы во имя Императора?"'
  speaker: Сестра Арджента
- guid: a3b1fd49-33bd-4548-adf2-57ca2411fed3
  event: BNTRS_DLC2_Argenta_192
  text: '"Даже тебя, нелюдь, я бы убила быстро — в этом разница между нечестивыми ксеносами и слугами Императора".'
  speaker: Сестра Арджента
- guid: a11bc397-2f0b-4f3d-a462-f257622eca31
  event: BNTRS_DLC2_Argenta_196
  text: '"Мое служение не может быть закончено, пока в Просторе остается хоть один все еще дышащий еретик".'
  speaker: Сестра Арджента
- guid: 1b5fbd60-e39a-4ce1-bbac-75be9ef765f8
  event: BNTRS_DLC2_Argenta_202
  text: '"Я не ставлю под сомнение твои методы, но сострадание к невинным — не слабость. Мы должны защищать Его возлюбленных
    подданных".'
  speaker: Сестра Арджента
- guid: 0e3f56ea-c896-493b-8cf6-0ea1d0bdc45b
  event: BNTRS_DLC2_Argenta_22
  text: '"Потому что мое сердце пылает верой и жаждой подвига во имя Его. Твое же лишь полнится перечнем законов".'
  speaker: Сестра Арджента
- guid: e82b317c-2495-4ab5-a862-038fee31d415
  event: BNTRS_DLC2_Argenta_250
  text: '"Отринь сожаления! Былое не должно омрачать будущее, в котором мы сообща прокладываем путь к свободе — пламенем и
    сталью!"'
  speaker: Сестра Арджента
- guid: d902b897-121d-4b1d-876f-99799903e134
  event: BNTRS_DLC2_Argenta_359
  text: '"За раз поглумилась и над священной верой, и над чужими чувствами. И ни капли стыда, ведьма".'
  speaker: Сестра Арджента
- guid: 077f6a4b-3daf-4d52-ab90-5ee367b6431e
  event: BNTRS_DLC2_Argenta_69
  text: '"Битва на "Бессердечном" была тяжелым испытанием, но мы победили! Что, как не триумф вопреки всему, вдохновляет на
    новые подвиги?"'
  speaker: Сестра Арджента
- guid: 9ecd94ae-fc90-411e-974f-11c31fb17ba5
  event: BNTRS_DLC2_Argenta_74
  text: '"Вольному Торговцу стоило бы предать пиратский корабль очистительному огню. Даже обломок с этого судна может нести
    скверну!"'
  speaker: Сестра Арджента
- guid: e1c195e3-62da-43e2-8b0f-386a47ed2497
  event: BNTRS_DLC2_Argenta_86
  text: '"Простые люди не всегда знают, кто ими правит. Уверена, на корабле Вольного Торговца еще не все знают, что Теодора
    мертва".'
  speaker: Сестра Арджента
- guid: f240ee07-145a-4709-a232-101f47fff045
  event: BNTRS_DLC2_Argenta_96
  text: '"Тот суд... Людям не дали шанса искупить свою вину в бою, сражаясь во имя Его. Смерть без покаяния в огне битвы —
    это неправильно".'
  speaker: Сестра Арджента
- guid: ed146748-97b3-463e-9405-bbe3a99136e6
  event: BNTRS_DLC3_Argenta_105
  text: '"Даже в самых невыносимых условиях слуг Бога-Императора согревает вера в их сердцах! И желание поразить врага Его,
    где бы тот ни прятался".'
  speaker: Сестра Арджента
- guid: 055afa1d-00f8-4804-9c27-fa168b35183e
  event: BNTRS_DLC3_Argenta_124
  text: '"Они пронесли свет веры сквозь тяжелый долг одиночества и покинутости. Это служение — одно из самых трудных и очищающих.
    Ты можешь верить этим подданным Бога-Императора".'
  speaker: Сестра Арджента
- guid: 6d7c3ba1-eda1-48c1-8c87-953a0cf9d41d
  event: BNTRS_DLC3_Argenta_68
  text: '"Здесь нечего страшиться, Джай! Страдания есть удел всех, кто хочет сохранить свою душу чистой перед Его взором".'
  speaker: Сестра Арджента
- guid: 3839516f-798d-477d-a83c-c2b0ce1d8e21
  event: BNTRS_DLC3_Argenta_73
  text: '"Пусть Трон будет милостив к тем, чья душа проходит через испытание воли в этом чертоге. От слабости, Бог-Император,
    избавь нас!"'
  speaker: Сестра Арджента
- guid: 7bf6927e-d669-4a6a-9d2a-8beb617caeb0
  event: BNTRS_PickUps_Argenta_03
  text: '"В другой жизни ты могла бы носить знаки Сороритас, и я звала бы тебя сестрой. Но твои ритуалы... тревожат меня".'
  speaker: Сестра Арджента
- guid: 99154bc8-4daa-45d9-af47-ad7d70e7f3d0
  event: BNTRS_PickUps_Argenta_113
  text: '"Проклятая музыка. Почему здесь не звучат литании во славу Его?"'
  speaker: Сестра Арджента
- guid: 6311d3b7-71e5-456b-b8e0-d22a68e33c8c
  event: BNTRS_PickUps_Argenta_116
  text: '"Скверна здесь. Я слышу ее в тенях — она стенает голосами пожранных ею душ".'
  speaker: Сестра Арджента
- guid: 3e1be735-e523-4514-95ec-f9333b3daff1
  event: BNTRS_PickUps_Argenta_120
  text: '"Кощунники устроили логово в благословенном отсеке, чтобы посмеяться над нашей верой!"'
  speaker: Сестра Арджента
- guid: 79572fcf-9393-4bbd-a9e6-402edfb6547f
  event: BNTRS_PickUps_Argenta_130
  text: '"Тайная вера Кровавой паутины... Она одновременно пугает и восхищает".'
  speaker: Сестра Арджента
- guid: c9aee775-bcf3-41af-be83-93a3dcb8c64a
  event: BNTRS_PickUps_Argenta_149
  text: '"Не горюй, воин, они все равно исполняют свой долг. Люди, глядя на них, наполняются светом Его и вдохновляются на
    битву с врагами Человечества!"'
  speaker: Сестра Арджента
- guid: 1570262f-44c7-45aa-b4db-dbc90f52fab4
  event: BNTRS_PickUps_Argenta_161
  text: '"Ты знаешь, что я убила Леди Теодору, но я не вижу упрека в твоем взгляде. Почему?"'
  speaker: Сестра Арджента
- guid: 47f128fc-a2a7-46ed-bb85-e42037d42742
  event: BNTRS_PickUps_Argenta_20
  text: '"Мы избираем врагов по-разному. Я убиваю тех, кого уличает в ереси пречистая Экклезиархия. Ты — тех, на кого указывают
    смутные знамения. И я не знаю, насколько им можно верить".'
  speaker: Сестра Арджента
- guid: 05faf072-7caf-4513-ac9f-4f503935bab3
  event: BNTRS_PickUps_Argenta_218
  text: '"В таком случае стоило поставить в известность нас. Иначе добыча может случайно свернуть шею прежде, чем западня
    захлопнется".'
  speaker: Сестра Арджента
- guid: 17fec39e-5a4b-4e47-90f9-102eac1449cb
  event: BNTRS_PickUps_Argenta_219
  text: '"Если бы я знала, что они сотворили с тобой, я бы пришла вызволить тебя... или даровать Его милость".'
  speaker: Сестра Арджента
- guid: 78193bb0-830c-4297-a6f0-3149c800e5b6
  event: BNTRS_PickUps_Argenta_237
  text: '"Кибелла, что для тебя роман с Лорд-капитаном? Часть твоего долга телохранительцы? Или то, что нарушает долг?"'
  speaker: Сестра Арджента
- guid: 5e75622f-85f4-460e-8161-3f448e95ddd4
  event: BNTRS_PickUps_Argenta_247
  text: '"Верно. Единственное решение — сражаться до последней капли крови и добыть победу во славу Императора либо умереть,
    пытаясь".'
  speaker: Сестра Арджента
- guid: b3387b49-b346-43d7-9eab-86ff34689dd9
  event: BNTRS_PickUps_Argenta_251
  text: '"В подобных местах мне хочется думать о снеге — чистом, не испорченном человеческой грязью. Под морозным светом звезды,
    что освещает все — до самых глубин души".'
  speaker: Сестра Арджента
- guid: cb9937ef-ab9d-42cb-9b34-d2109cbbafd1
  event: BNTRS_PickUps_Argenta_59
  text: '"Я доверяю твоей бдительности, Хейнрикс. А ты доверься моей праведной ярости, если обнаружишь новых выродков".'
  speaker: Сестра Арджента
- guid: c62ca6af-2b74-4d0a-9817-6856670e614f
  event: BNTRS_PickUps_Argenta_62
  text: '"Власть молниеносно развратила Кибеллу. Я предчувствую, что все это закончится братоубийством".'
  speaker: Сестра Арджента
- guid: d1c3c57e-2482-4483-b012-e6b9ac096641
  event: BNTRS_PickUps_Argenta_78
  text: '"Пусть обряды Кровавой паутины и кажутся мне радикальными, но я рада, что столь истовая воительница Императора с
    нами".'
  speaker: Сестра Арджента
- guid: 3d47274e-02df-47f8-8115-6176212dc88a
  event: BNTRS_PickUps_Argenta_83
  text: '"Ее жертва ужасна... Но я не могу испытывать к ней ничего, кроме устрашенного почтения".'
  speaker: Сестра Арджента
- guid: 2777e187-7878-4d27-a875-355fdbdf8f89
  event: BNTRS_PickUps_Argenta_89
  text: '"Значит, {name} внимательнее к своим подданным, чем была Леди Теодора. Печально, что это тебя удивляет, а не радует".'
  speaker: Сестра Арджента
- guid: 506008b4-e406-4f5e-858c-7cc3d439e051
  event: BNTRS_PickUps_Argenta_97
  text: '"Тебя ведет служение Императору, а он — порождение ереси, мерзость. Не говори, что вы схожи".'
  speaker: Сестра Арджента
- guid: e8c4c5b0-fc1b-4e8b-b92b-4e8e9abbcfec
  event: BNTRS_Reactivity_Argenta_02
  text: '"Не открывается! Проклятые еретики заблокировали дверь, дрожа от мысли о нашем приближении!"'
  speaker: Сестра Арджента
- guid: ad89178e-51ab-400d-a6df-f8bc6af93468
  event: BNTRS_Reactivity_Argenta_06
  text: '"Мой разум застила мгла... Император, возложи ладонь свою на чела наши и защити от морока ереси!"'
  speaker: Сестра Арджента
- guid: e54be983-67d5-4c7c-bde1-d67cdcb24211
  event: BNTRS_Reactivity_Argenta_08
  text: '"Туда же, куда дорога всем нечестивым морокам. Хочешь за ним последовать, а, ведьма?"'
  speaker: Сестра Арджента
- guid: 1f9dba77-9725-4834-b289-193224f22a34
  event: BNTRS_Reactivity_Argenta_102
  text: '"Все знают: твое присутствие отравляет душу и разум Вольного Торговца. Оступись хоть на миг — и я без сомнений оборву
    твою жалкую жизнь!"'
  speaker: Сестра Арджента
- guid: 9c82e515-2d5d-42c3-9ced-a6d2a23b2839
  event: BNTRS_Reactivity_Argenta_13
  text: '"Благородное деяние. Пускай команда вознесет молитвы о герое, отринувшем нечистую жизнь во имя Человечества".'
  speaker: Сестра Арджента
- guid: 0952451f-e581-419f-8210-0a9bc61fb150
  event: BNTRS_Reactivity_Argenta_38
  text: '"Кассия... мне не нужен третий глаз, чтобы заметить, что происходит. Тебе надо учиться полагаться и на свои обычные
    очи".'
  speaker: Сестра Арджента
- guid: bb618054-e6e0-490f-8722-84139bb434ce
  event: BNTRS_Reactivity_Argenta_45
  text: '"Перестань так смотреть на Вольного Торговца, Хейнрикс. С ней ничего не случится, пока мы рядом".'
  speaker: Сестра Арджента
- guid: bfdee320-44ba-4d5b-b3ec-e4f5e0427f06
  event: BNTRS_Reactivity_Argenta_51
  text: '"Джай любит хвастаться трофеями и богатствами. Лорд-капитан для нее — и то, и другое".'
  speaker: Сестра Арджента
- guid: 985e4611-ecd1-4d45-bc1a-c6bd49de184d
  event: BNTRS_Reactivity_Argenta_66
  text: '"Наполни душу свою чистой любовью к Богу-Императору, и все сомнения сердца разом станут пустыми".'
  speaker: Сестра Арджента
- guid: 4747d3a3-cb46-40a6-a990-ca87521d7085
  event: BNTRS_Reactivity_Argenta_84
  text: '"Как мог{mf||ла} Вольный Торговец допустить тебя в свиту? Что за изъян воли позволил {mf|ему|ей} найти тебе, мерзость,
    место подле себя?"'
  speaker: Сестра Арджента
- guid: 4c473136-c01b-46d5-a2cf-ed640d389de6
  event: BNTRS_Reactivity_Argenta_87
  text: '"Вольный Торговец выказывает ксеносу слишком много симпатии. Ее следует держать на коротком поводке, а не в статусе...
    гостьи".'
  speaker: Сестра Арджента
- guid: 1a221afd-9fa2-40c8-8148-5ca439667d6b
  event: BNTRS_Reactivity_Argenta_99
  text: '"Вольный Торговец сблизил{mf|ся|ась} с ксеносом настолько, что попал{mf||а} в самую ее душу, постиг{mf||ла} чувства...
    Непростительная богомерзкая ересь!"'
  speaker: Сестра Арджента
- guid: 240dc138-4cf2-4c1c-9cc4-f8417abbf0f5
  event: BNTRS_Reactivity_DLC3_Argenta_06
  text: '"Мое сердце радуется, когда видит служителей Бога-Императора, что несут хвалу Ему через верную службу. Но я не увидела
    среди собравшихся на шествие простых людей... Неужели им не нашлось места?"'
  speaker: Сестра Арджента
- guid: d670963a-24c6-4b04-a7d0-358973de9c72
  event: BNTRS_Reactivity_DLC3_Argenta_09
  text: '"Да будет так, святой воин. Дитя благословенного Сангвиния более не с нами, но воздаяние за его смерть — в наших
    руках. Гнев Бога-Императора да падет на головы нечестивцев!"'
  speaker: Сестра Арджента
- guid: 1bd71aa2-ffd4-450d-9b3e-60b14ac64db7
  event: BNTRS_Reactivity_DLC3_Argenta_21
  text: '"Не печальтесь о потерях, братья: те, кто пал в битве за праведность, будут согреты взором Бога-Императора босле
    смерти!"'
  speaker: Сестра Арджента
- guid: 117ca1cc-f05f-4807-a15a-7822b8b5222c
  event: BNTRS_Reactivity_DLC3_Argenta_38
  text: '"Воля Бога-Императора была ниспослана через Его помазанни{mf|ка|цу}, чтобы освободить верного слугу от вражеских
    оков. Все произошло так, как тому было должно случиться".'
  speaker: Сестра Арджента
- guid: 352e1471-117c-4896-84bd-d1b75bb55d6e
  event: BNTRS_Reactivity_DLC3_Argenta_44
  text: '"Бог Император да благословит милосердие Вольного Торговца! Ни один честный слуга Империума не заслуживает быть запертым
    в плену ксеноса, и Себериан фон Валанциус — тем более!"'
  speaker: Сестра Арджента
- guid: 7024e3c0-1805-424e-99d7-13c87200f3e1
  event: BNTRS_Reactivity_DLC3_Argenta_69
  text: '"Суровые условия рождают самые светлые сердца. Пусть взор Его обратится на Зарков и благословит этот мир на долгую
    жизнь внутри Империума Человечества!"'
  speaker: Сестра Арджента
- guid: fd36f547-78a4-4ac8-98e8-0c13996d8814
  event: BNTRS_Stressful_Argenta_02
  text: '"Я была бы рада биться плечом к плечу с моими сестрами, но и нынешняя судьба не тяготит меня. Где бы я ни была и
    кто бы меня не сопровождал меня — еретиков ждет смерть. Вот что важно!"'
  speaker: Сестра Арджента
- guid: 11e9deb1-c103-4458-afd3-8b842c38d619
  event: BNTRS_Stressful_Argenta_112
  text: '"О, будь уверен, я смотрю за каждым твоим шагом, нечисть. И когда ты предашь Вольного Торговца — а ты предашь — я
    буду рядом".'
  speaker: Сестра Арджента
- guid: 782bf238-e951-4d76-a5ce-a5aaec4873f9
  event: BNTRS_Stressful_Argenta_132
  text: '"Ты прав. Лишь нам с тобой известно, что такое обращаться у алтаря к нашему заступнику и умолять о защите для ближних
    наших. Быть их щитом духа".'
  speaker: Сестра Арджента
- guid: 2aa61b97-21c8-4c77-a252-c1ca1ed42fb4
  event: BNTRS_Stressful_Argenta_150
  text: '"Нет, брат Ульфар. Лишь смиренно молюсь, чтобы Император послал моим глазам ясность, чтобы они отличили правое от
    лживого. И сокрушили его!"'
  speaker: Сестра Арджента
- guid: 2dc5753e-5e3b-4efd-abce-60111436704f
  event: BNTRS_Stressful_Argenta_168
  text: '"Не за мной — Бог-Император заботится о всех достойных дщерях и сыновьях Его. Но тебе, ксенос, едва ли удастся осознать
    чистоту человеческой веры".'
  speaker: Сестра Арджента
- guid: 89460b71-3ca0-41b0-93a7-5e66c55f6b7b
  event: BNTRS_Stressful_Argenta_19
  text: '"Ты оставил флот ради службы у Вольного Торговца. Не жалеешь ли об этом, сенешаль?"'
  speaker: Сестра Арджента
- guid: 2ad9f502-3592-4566-b629-dfd5b137c898
  event: BNTRS_Stressful_Argenta_21
  text: '"Если бы я могла увидеть золотой свет Астрономикона, как видишь его ты, Кассия… я бы, наверное, замерла навеки, и
    вовсе не смогла отвести от него глаз".'
  speaker: Сестра Арджента
- guid: a831a9bf-e2c6-4ade-a4f6-e3b161d8b3d0
  event: BNTRS_Stressful_Argenta_23
  text: '"Служба заставляет тебя глубоко заглядывать в секреты врагов человечества. Не боишься ли ты однажды заглянуть слишком
    глубоко, дознаватель?"'
  speaker: Сестра Арджента
- guid: 86b5f8cf-a88e-4751-8f40-1610b48a9e81
  event: BNTRS_Stressful_Argenta_25
  text: '"Как ты можешь доверять своим прозрениям, Идира? Неужели не боишься, что историю будущего тебе нашептывает Архивраг?"'
  speaker: Сестра Арджента
- guid: 77f3b792-3584-4f9f-9c6a-efe23c584235
  event: BNTRS_Stressful_Argenta_27
  text: '"Будь начеку, Джай. Ты кажешься немного, гм, расфокусированной".'
  speaker: Сестра Арджента
- guid: fe6c716e-e86d-471b-8b21-1949abadfaeb
  event: BNTRS_Stressful_Argenta_29
  text: '"Однажды Вольный Торговец устанет от тебя, нечисть, и даст свершиться правосудию. Ничто не доставляет мне большего
    удовольствия, чем предвкушение этого мига".'
  speaker: Сестра Арджента
- guid: 51af5739-db64-4aeb-bbfc-85694c2af4ff
  event: BNTRS_Stressful_Argenta_31
  text: '"Алый — хороший цвет для боевого облачения. Враги не увидят слабость, даже если ты истекаешь кровью".'
  speaker: Сестра Арджента
- guid: 7d6352ab-7646-4f2a-83e9-a081d43e9089
  event: BNTRS_Stressful_Argenta_33
  text: '"Мне нравятся твои речи, светлый воин. В них есть что-то от святых гимнов, что мы с сестрами поем на поле боя".'
  speaker: Сестра Арджента
- guid: 32695065-f0f8-485d-90f4-24963243cfd9
  event: BNTRS_Stressful_Argenta_35
  text: '"Сила воли и грация. Печально, что подобные дары достались той, чью душу никогда не осветит свет Терры".'
  speaker: Сестра Арджента
- guid: aafa2461-04e1-4e88-9e25-413006b9b8e8
  event: BNTRS_Stressful_Argenta_40
  text: '"Душа моя открыта для света и верных слуг Его. Все остальное — минутные слабости и есть пустое".'
  speaker: Сестра Арджента
- guid: 85a7b479-5c98-4407-85da-cc202fa9eb60
  event: BNTRS_Stressful_Argenta_58
  text: '"Что с того? Мою руку направляет Император. Каждый выстрел и удар найдет цель в рядах врагов Человечества!"'
  speaker: Сестра Арджента
- guid: a1b24aea-8279-432f-b4cb-a6b5ca5aa0cf
  event: BNTRS_Stressful_Argenta_78
  text: '"Я рождена для битвы против тьмы, мое настроение всегда прекрасное, когда опасность близко!"'
  speaker: Сестра Арджента
- guid: abd0cfdc-9ed1-4c5e-82fa-2593f9921fb0
  event: BNTRS_Stressful_Argenta_94
  text: '"Иногда мне кажется, что ты не такая уж и плохая женщина, Джай. И это меня беспокоит".'
  speaker: Сестра Арджента
- guid: b39a1954-81a1-4aca-b304-9308bfa66a86
  event: BS_KTCStolenTithe_Argenta_01
  text: '"Служба Империуму стоит превыше личных пожеланий. Тем более столь... приземленных, как твои, Джай".'
  speaker: Сестра Арджента
- guid: b2c46c73-a187-4b65-8a8e-b46fe751529a
  event: Companions_SororitasQ1_OrphansPromt_01
  text: '"Приветствую, Вольный Торговец! Я хотела обратиться с личной просьбой". {n}Голос сестры Ардженты одно мгновение кажется
    неуверенным.{/n}'
  speaker: Сестра Арджента
- guid: 92bbd952-5e0c-413c-be4f-e47a46248671
  event: Companions_SororitasQ1_OrphansPromt_02
  text: '"Проклятые слуги {g|Encyclopedia:Chaos}Хаоса{/g}, напавшие на этот корабль, унесли жизни верных членов твоей команды.
    И сделали сиротами многих детей — включая отпрысков храбрейших офицеров, защищавших свои посты до конца. Я не знаю, как
    заведено поступать в таких случаях во владениях фон Валанциус, но в привычном мне мире дети павших храбрецов могут рассчитывать
    на особое внимание. Быть может, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} мог{mf||ла} бы встретиться с сиротами?"'
  speaker: Сестра Арджента
- guid: 516505b0-9d35-4c2c-bf4d-813774f1a860
  event: Companions_SororitasQ1_OrphansPromt_03
  text: '"Как пожелаешь, Вольный Торговец. Благодарю, что согласились исполнить мою просьбу".'
  speaker: Сестра Арджента
- guid: a970c5cc-27d9-4fc3-b15e-78d5194db3f1
  event: Companions_SororitasQ1_OrphansPromt_04
  text: '"Я передам ваше распоряжение. Благодарю, что прислушались к моей просьбе".'
  speaker: Сестра Арджента
- guid: 5f0006b7-482c-4d69-b13d-66c1a05b874d
  event: Companions_SororitasQ1_OrphansPromt_05
  text: '"Как пожелаете, Вольный Торговец", {n}— в голосе Ардженты звенят нотки разочарования.{/n}'
  speaker: Сестра Арджента
- guid: d0561414-75fa-4436-b18a-7486ef8b7ba1
  event: Companions_SororitasQ1_OrphansPromt_06
  text: '"Так вот как ты это видишь!" {n}— в голосе Ардженты прорезается нотка ярости, но она берет себя в руки.{/n} "Прошу
    прощения, Вольный Торговец. Я больше не потревожу вас подобными просьбами".'
  speaker: Сестра Арджента
- guid: 108f6399-89d9-48cb-8c6e-e0a1e14353d0
  event: Companions_SororitasQ1_OrphansPromt_07
  text: '"Эти дети — будущее твоей команды, когда-нибудь и им придется встать против зла и ереси, как встали их родители.
    Встретившись с ними, обратившись с правильными словами, ты отдашь дань памяти павшим храбрецам, и укажешь путь храбрецам
    будущим. Встречу с Вольным Торговцем они запомнят навсегда! К тому же, это укрепит дух сирот... поможет пережить утрату
    — в столь юном возрасте это может быть непросто".'
  speaker: Сестра Арджента
- guid: cf360e9b-467b-4e38-ae60-3b6b936ffb29
  event: Companions_Sororitas_01
  text: '{n}Сестра Арджента кажется уставшей — под глазами залегли темные круги, волосы в легком беспорядке, в движениях —
    легкая нервозность.{/n} "{g|Encyclopedia:RogueTrader}Вольный Торговец{/g}?"'
  speaker: Сестра Арджента
- guid: f32a68a7-2515-4977-86e2-525cf18c9736
  event: Companions_Sororitas_02
  text: '{n}Сестра Арджента встречает вас легчайшим полупоклоном.{/n} "Лорд-капитан. Я рада, что вы пришли. И хочу принести
    извинения за прежнюю... холодность. После нашей первой встречи я опасалась, что вы окажетесь еще одним гнилым ростком
    семейного древа фон Валанциус, как... как предатель Кунрад. Но теперь я вижу перед собой достойного лидера и слугу {g|Encyclopedia:Imperium}Империума{/g}.
    Я рада быть вам соратницей".'
  speaker: Сестра Арджента
- guid: 9cf145c1-22a5-44d5-909b-b74443e7a288
  event: Companions_Sororitas_03
  text: '{n}Даже не двигаясь с места, сестра Арджента излучает энергию. С сиянием в темных глазах и легким румянцем на щеках
    она читает молитву, и обращает взгляд к вам, только произнеся последнюю строчку:{/n} "{name}, приветствую!"'
  speaker: Сестра Арджента
- guid: c9c01224-891d-4a2a-85a4-d7a87f4f76fa
  event: Companions_Sororitas_04
  text: '"Это так! {g|Encyclopedia:AdeptaSororitas}Сестры битвы{/g}— это пламя, зажженное {g|Encyclopedia:Emperor}Императором{/g},
    это эхо его голоса, летящее по темным просторам Вселенной. Мы несем Его гнев еретикам, злодеям и другим врагам Человечества.
    Мы можем защищать верных от нечестивых и грешных. Иногда — словом. Чаще — болтером".'
  speaker: Сестра Арджента
- guid: 61eac97b-0854-4b12-9561-ed61a61efcb8
  event: Companions_Sororitas_05
  text: '"Однажды мы достигнем Салис Прайм и встанем перед вратами корабля святой... я знаю. Я верю".'
  speaker: Сестра Арджента
- guid: 4100b054-c506-4957-8ace-25933eeca1a8
  event: Companions_Sororitas_06
  text: '"Даже в послушницы {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g} попадают лишь достойнейшие. Те же, кто принял
    обеты и стал полноправной сестрой — лучшие из лучших, прошедшие испытания тела и духа. Да, случается, что сестры оступаются
    или проявляют слабость. Но не думай, что ты сейчас услышишь от меня историю низости или падения".'
  speaker: Сестра Арджента
- guid: bd440fad-3900-4261-8e0b-78a96c29331a
  event: Companions_Sororitas_07
  text: '"Каждый такой случай — великое горе для всех нас. Свет не может нести в себе и мельчайшей частички тьмы! Потому тем,
    кто совершит проступок или проявит слабость духа, дают шанс на искупление. Их зовут сестрами Репентиа, и пусть дрожат
    враги пред их ликом, ибо ничто не удержит Сестру битвы, жаждущую очиститься от греха и слабости".'
  speaker: Сестра Арджента
- guid: 2ae88f73-11f4-44b4-b385-8bc8dc2be114
  event: Companions_Sororitas_08
  text: '"О себе!" {n}Сестра кажется удивленной.{/n} "Я — дщерь {g|Encyclopedia:Emperor}Императора{/g} и служительница его.
    Что еще можно сказать обо мне?"'
  speaker: Сестра Арджента
- guid: b982f9a2-068c-42f2-818b-be8d6da2701c
  event: Companions_Sororitas_09
  text: '"Если таково желание {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}. Хотя я не так много могу поведать. Я — дщерь
    {g|Encyclopedia:Emperor}Императора{/g} и служительница Его... что еще?"'
  speaker: Сестра Арджента
- guid: f173ea34-2eff-4813-9b74-27b41a93fe4d
  event: Companions_Sororitas_10
  text: '"Это — последнее мое воспоминание о матери. И о прежней жизни — до {g|Encyclopedia:ScholaProgenium}Схола Прогениум{/g}
    и послушничества, до испытания, до принятия обетов".'
  speaker: Сестра Арджента
- guid: 6dd3f9c3-8f92-4370-804e-972501f37d22
  event: Companions_Sororitas_11
  text: '"Моя личная святыня. Это — полковая {g|Encyclopedia:Aquila}аквила{/g}, вернее, ее остаток, переживший атаку, взрывы
    и пламя. Для меня она — память о том, что чистоту и сияние можно сохранить даже в сердце тьмы".'
  speaker: Сестра Арджента
- guid: 49ef8875-1094-43bb-8e33-543cdc414af6
  event: Companions_Sororitas_12
  text: '{n}Вопрос, кажется, застает Ардженту врасплох.{/n} "Желала ли я? Но это была бы позорная слабость, почти ересь! Конечно,
    нет. Я рождена для этого. Я живу по воле {g|Encyclopedia:Emperor}Императора{/g} и в свете Его, я сама есть свет, должна
    быть светом — для себя и для тех, кто обращается ко мне за защитой".'
  speaker: Сестра Арджента
- guid: a271e77e-19ac-4297-848b-bca85c1257eb
  event: Companions_Sororitas_13
  text: '"Я была избрана для служения. Но кроме того — скажу не таясь — мало что доставляет мне столько радости, как мысль,
    что падающий под моим выстрелом еретик более не сделает сиротой ни одну имперскую девочку".'
  speaker: Сестра Арджента
- guid: ae1be7ad-5fdf-4049-ac86-e85116e2a662
  event: Companions_Sororitas_14
  text: '"Конечно. Все, о чем я могу думать — это моя миссия..."'
  speaker: Сестра Арджента
- guid: 5062afae-aabc-4907-8482-cb9d33c9e528
  event: Companions_Sororitas_15
  text: '"С радостью! Слушай..." {n}— сестра чуть прикрывает глаза и начинает рассказывать, почти напевать:{/n} "Давным-давно
    был на свете благословенный мир. Тысячи звезд усеивали там небо, столь ярких, что жители едва ли знали, что такое ночная
    тьма. Тысячи рек поили почву, тысячи садов расцветали каждую весну, и тысячи молитв каждый миг взлетали в прозрачный воздух,
    благодаря и славя {g|Encyclopedia:Emperor}Императора{/g}".'
  speaker: Сестра Арджента
- guid: ef571fe8-703b-4057-b66c-c67fed0fafb9
  event: Companions_Sororitas_16
  text: '"Но однажды жители узнали, что такое тьма. Словно смерч, обрушились на планету проклятые еретики, продавшиеся {g|Encyclopedia:Chaos}Архиврагу{/g}.
    С неба летели снаряды, что опустошали целые города, и жгли сады, и кровью верных наполняли русла рек. Дым и копоть скрыли
    небосклон и тысячу звезд, что сияли над миром".'
  speaker: Сестра Арджента
- guid: 50dd9ace-2313-483f-87a2-2095665d59f2
  event: Companions_Sororitas_17
  text: '"Среди горстки выживших была одна сирота, видевшая, как погибли все родные ее и дотла сгорел сад, в котором она росла.
    Но в сердце своем она знала главную истину, что умещается в два слова — Император защищает. И, зная это, не отрываясь,
    глядела она в черное, страшное, затянутое дымом пожаров небо. Не разглядеть больше было на нем ярких звезд... кроме одной".'
  speaker: Сестра Арджента
- guid: 48a653fe-d661-4307-b3c3-560d27fe4340
  event: Companions_Sororitas_18
  text: '"Ах, если бы знать! Ни в житие, ни в легендах нет точного ответа. Классические иконописцы полагали, что звезда обратилась
    сребротканным знаменем, которое выносили на поле боя, и оно источало свет, слепящий лишь еретиков, но безвредный для верных.
    Большинство изображало святую Ардженту как девочку с этим знаменем в руках".'
  speaker: Сестра Арджента
- guid: 8d0f66a5-9457-4f61-9568-ebd24e1e55c8
  event: Companions_Sororitas_19
  text: '"Другие полагают, что, упав с неба, Единственная звезда стала святым цепным мечом, коим Ардженте в будущем предстояло
    разить чудовищ и врагов Империума. На некоторых ранних гравюрах Арджента изображена в силовой броне с серебряной звездой
    на груди — по одному из мнений богословов, эта броня и есть реликвия. Есть даже мнение, что Единственная звезда на деле
    — это корабль, на котором летала Арджента".'
  speaker: Сестра Арджента
- guid: a9b6cf3e-e501-404d-b73e-ec89ab7fd009
  event: Companions_Sororitas_20
  text: '"С радостью. Мы служим Императору и Человечеству с незапамятных времен, бьемся со злом по воле святой {g|Encyclopedia:AdeptusMinistorum}Экклезиархии{/g},
    мы..." {n}Арджента обрывает сама себя и фыркает под нос.{/n} "Прошу простить меня, {g|Encyclopedia:RogueTrader}Вольный
    Торговец{/g}. Начала рассказывать то, что знает любой мелкий дворянин в Империуме! Так что же именно вас интересует?"'
  speaker: Сестра Арджента
- guid: a08ed819-7b02-4f9b-8791-e3604ae3718e
  event: Companions_Sororitas_21
  text: '"По окончании послушничества я была направлена в каликсийскую ветвь ордена Пресвятой Девы-Мученицы и приставлена
    к ордену Пронатус. Миссия ордена важна и благородна — сестры Пронатус защищают великие имперские святыни. Мы охраняем
    их, поддерживаем в порядке, сопровождаем, если их выносят на поле боя или паломникам для поклонения".'
  speaker: Сестра Арджента
- guid: afa89ae6-8759-41b5-a66e-3238ab8d3a1d
  event: Companions_Sororitas_22
  text: '"Не позволяй названию обмануть тебя. "Воинствующие ордена" обучают сестер выходить на поле боя как армия. Это не
    значит, что сестры из прочих орденов кротки и беззащитны".'
  speaker: Сестра Арджента
- guid: b5c58354-5558-42e5-9b88-5b254a3ed53a
  event: Companions_Sororitas_23
  text: '"И несущие утешение госпитальерки, и многомудрые сестры диалогус знают, как встречать врагов Человечества. "Диалог",
    что они ведут с еретиками, обычно короток, и последнее слово в нем — залп болтера!"'
  speaker: Сестра Арджента
- guid: d69de261-4eba-491d-bd8d-21389928fc8b
  event: Companions_Sororitas_24
  text: '{n}Арджента заметно мрачнеет.{/n} "Впервые я появилась здесь, когда мне требовалось добраться от {g|Encyclopedia:Footfall}Футфола{/g}
    до одной окраинной планеты. Но, верно, вопрос не о том, первом путешествии, а о том, как я попала сюда перед нападением
    культистов. Это непростая история. Так случилось, что я..." {n}— она осекается.{/n}'
  speaker: Сестра Арджента
- guid: 2db13e48-850a-4fb9-8c55-6a87665465e8
  event: Companions_Sororitas_25
  text: '"Про это я могу рассказать. Отовсюду и ниоткуда. Я..." {n}— глаза Ардженты на мгновение становятся темнее.{/n} "Я
    — дитя офицеров {g|Encyclopedia:AstraMilitarum}Имперской гвардии{/g}. Я родилась в трюме боевого корабля, росла в бросках
    с одной планеты на другую, и потеряла семью в огне праведной войны".'
  speaker: Сестра Арджента
- guid: 5e13265e-baca-456a-abb6-42c6fa83323e
  event: Companions_Sororitas_26
  text: '{n}Арджента рассеянно проводит пальцами по фрагменту золотой {g|Encyclopedia:Aquila}аквилы{/g}, что висит у нее на
    поясе.{/n} "Моя память — как клочки дыма над полем отгремевшего боя. Серость корабельной обшивки, четкий ритм жизни военных
    лагерей. Форма матери — я любила разглядывать ее. Потом — тот бой... грохот, крики и копоть. Вопли горящих заживо солдат.
    И золото полковой аквилы — последняя незапятнанная гарью и кровью частичка сходящего с ума мира".'
  speaker: Сестра Арджента
- guid: 4c084c88-96e6-4541-afc1-735c35e145b0
  event: Companions_Sororitas_27
  text: '"Я допустила ошибку. Попала в засаду проклятых поклонников {g|Encyclopedia:Chaos}Архиврага{/g}. Была тяжело ранена.
    Леди Теодора пришла мне на выручку. На ее корабле мне оказали помощь, выходили после ранения. Все это произошло не так
    давно — я едва-едва оправилась от ран, когда на корабль напали культисты. Воистину, слуги зла не ведают покоя! Нет места,
    где мы были бы в безопасности от их козней".'
  speaker: Сестра Арджента
- guid: e1573340-fb34-4482-8082-596dca4ba3ab
  event: Companions_Sororitas_28
  text: '"В одних лишь робах, без брони, с цепным Потрошителем в руках, эти раз оступившиеся сестры совершают свое покаяние
    на поле битвы. Их век редко долог, но смерть во имя очищения — лучшая участь, чем жизнь с тенью в душе".'
  speaker: Сестра Арджента
- guid: d65f053d-5d3f-440f-8a79-0f2876f46033
  event: Companions_Sororitas_29
  text: '"Даже с лучшими это случается!" {n}— запальчиво говорит Арджента. Потом хмурится и на мгновение опускает голову.{/n}
    "Мои ошибки — мое бремя. Я найду способ их искупить".'
  speaker: Сестра Арджента
- guid: 046a449b-e939-4d83-809b-bef1ca17c6f6
  event: Companions_Sororitas_30
  text: '"Этот корабль стал целью атаки еретиков — значит, мое присутствие здесь и помощь тебе есть моя святая обязанность.
    Рано или поздно мне, вероятно, придется вернуться на {g|Encyclopedia:Footfall}Футфол{/g}, охранять его реликварий. Но
    я хотела бы пока остаться частью команды {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}, если это всех устраивает".'
  speaker: Сестра Арджента
- guid: 20c6d7b8-4cbc-48d2-a1dd-b037d92c3d3c
  event: Companions_Sororitas_31
  text: '{n}Арджента склоняет голову.{/n} "Я... рада быть откровенной".'
  speaker: Сестра Арджента
- guid: c013e83f-a55c-4b51-a2ef-06f38707eaa4
  event: Companions_Sororitas_32
  text: '{n}Глаза сестры вспыхивают.{/n} "Да будет так!"'
  speaker: Сестра Арджента
- guid: 80beeb2f-c526-4085-8bb8-6b5dc3eacef1
  event: Companions_Sororitas_33
  text: '{n}После короткой заминки Арджента добавляет с некоторой заносчивой торопливостью:{/n} "Мой же Орден тем более славен
    боевым мастерством его сестер. Мы храним имперские святыни! Что стало бы с наследием наших благословенных героев, не умей
    сестры Пронатус защитить его?"'
  speaker: Сестра Арджента
- guid: 2598039f-694b-49b4-aa02-5b9c3206944a
  event: Companions_Sororitas_34
  text: '"На одной из недавно открытых планет {g|Encyclopedia:KoronusExpanse}Простора{/g}. Никто не ведал, что она уже запятнана
    мерзостью ереси. Знай я это заранее — конечно, была бы начеку".'
  speaker: Сестра Арджента
- guid: cae57bfc-3242-44c8-ad44-77dc90358207
  event: Companions_Sororitas_35
  text: '"К сожалению, нет. Леди Теодора спешила, и не стала задерживаться на планете. Ее люди забрали меня на корабль в беспамятстве,
    а когда я пришла в себя, мы уже летели прочь. О как надеюсь я снова встретиться лицом к лицу с этими еретиками! И когда-нибудь
    это обязательно произойдет".'
  speaker: Сестра Арджента
- guid: 5f364a7b-f003-430b-a906-22e9635db713
  event: Companions_Sororitas_36
  text: '"Как тебе угодно".'
  speaker: Сестра Арджента
- guid: 9f1b5efa-7569-4f66-8cd7-d22204c20ba2
  event: Companions_Sororitas_37
  text: '"Единственная звезда, яркая звезда, серебряная звезда светила на небе. И когда та сирота улыбнулась ей — Единственная
    звезда упала с неба прямо в ее руки. Все верные в разных уголках континента, кто увидел след падающей звезды, распознали
    знамение и отправились искать место падения. И собрались они вместе, и вместе со светом Единственной звезды к ним пришло
    спасение".'
  speaker: Сестра Арджента
- guid: 987b92a1-21f5-486d-8afb-c9d13b0ffda1
  event: Companions_Sororitas_38
  text: '"Это... очень приятные слова, Вольный Торговец. Благодарю — и за слова, и за гостеприимство". {n}Она бросает на вас
    еще один, слегка озадаченный взгляд.{/n}'
  speaker: Сестра Арджента
- guid: e5dc1a21-3e65-4c67-b64f-c6a0d6798821
  event: Companions_Sororitas_39
  text: '{n}В глазах сестры Ардженты появляется блеск. Она колеблется, но потом со вздохом качает головой.{/n} "Путь к этой
    планете утрачен, знания погибли вместе с прежним {g|Encyclopedia:Navigator}Навигатором{/g} корабля. Заново открыть маршрут
    потребует неимоверных усилий и ресурсов. У наследни{mf|ка|цы} протектората фон Валанциус наверняка много проблем и забот
    сейчас. Может быть, позже... когда небо над нашими головами прояснится".'
  speaker: Сестра Арджента
- guid: 708dd040-7536-4ed5-a744-f8503e6de5df
  event: Companions_Sororitas_40
  text: '"Я не так долго пробыла здесь — один полет от Футфола, и то, второе путешествие, в ходе которого я почти все время
    томилась в медотсеке. Про первый полет я мало что могу рассказать... молитвы и размышления занимали меня больше, чем окружающие
    люди или сам путь".'
  speaker: Сестра Арджента
- guid: fa1f6bf3-756b-4837-bc12-44630b4f45fc
  event: Companions_Sororitas_41
  text: '"Но не все люди Теодоры вызывают у меня доверие. Ты знаешь, о ком я говорю — Идире Тласс не место среди верных Империума.
    Я удивлена, что она не оказалась сообщницей культистов. И удивлена, как глубоко ересь и измена пустили корни здесь..."
    {n}Арджента хмурится и качает головой.{/n} "Хорошо, что все мы пережили темный час. Пусть день, следующий за ним, будет
    ярок!"'
  speaker: Сестра Арджента
- guid: 71537d7b-2180-4121-930c-341fe5e3062b
  event: Companions_Sororitas_42
  text: '"После этого на своем корабле, отмеченным знаком серебряной звезды, она путешествовала по мирам, охваченным смутой,
    и несла надежду верным. Тому есть многочисленные свидетельства. Ее явление людям позволило переломить ход войны и вычистить
    скверну даже до того, как подоспели основные части имперских сил".'
  speaker: Сестра Арджента
- guid: 8d48c120-ad0d-457a-a7bf-20b8ebdee6fd
  event: Companions_Sororitas_43
  text: '"Миллионы людей были обязаны ей жизнью. Однако еретики, понимая, что терпят поражение, бросили все остатки сил против
    корабля с серебряной звездой. Он упал с небес в безвестном мире. Нет точных данных, сколько лет было в этот момент Ардженте.
    Некоторые хроники даже зовут ее Дитя-Святая, хотя достоверность их сомнительна. В любом случае, она прожила мало... но
    оставила яркий след. Как падающая звезда".'
  speaker: Сестра Арджента
- guid: f3a94dab-8441-4b81-ae08-3a0c4a20ef0e
  event: Companions_Sororitas_44
  text: '"И мы разыскиваем те реликвии, что были утрачены. Ни ковен еретиков, ни самый страшный мир смерти не удержит сестер
    Пронатус, если их цель — возвращение великого наследия {g|Encyclopedia:Imperium}Империума{/g} в руки верных".'
  speaker: Сестра Арджента
- guid: 5093def1-aed1-4121-9df2-32cfa0d1ba2b
  event: Companions_Sororitas_45
  text: '{n}Недовольный огонь вспыхивает в глазах сестры, она складывает руки на груди.{/n} "Если такова воля Лорд-капитана..."'
  speaker: Сестра Арджента
- guid: 747c5a90-e2fa-4552-b707-b784e30c174b
  event: Companions_Sororitas_46
  text: '{n}Арджента резко вздергивает подбородок.{/n} "Как вам будет угодно, Вольный Торговец".'
  speaker: Сестра Арджента
- guid: a1629257-6289-4504-a62a-1e864e42b757
  event: Companions_Sororitas_47
  text: '"Да. Я готова! Попрошу лишь об одном, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}. Если мне будет дозволено,
    я хочу посетить хранилище священного {g|Encyclopedia:Warrant}Патента{/g} и преклонить колени перед реликвией, которой
    касался сам {g|Encyclopedia:Emperor}Император{/g}. Нам предстоит серьезный разговор... и я хочу помолиться перед святыней
    прежде, чем открою душу".'
  speaker: Сестра Арджента
- guid: 6aa1bc0d-bf3b-40e1-bf5a-55a89d63c25d
  event: Companions_Sororitas_48
  text: '"Что ж... я наберусь терпения, Вольный Торговец, и буду ждать".'
  speaker: Сестра Арджента
- guid: 5b9cd56a-5471-4b7b-9a90-5e46946f96f2
  event: Companions_Sororitas_49
  text: '"Стала"... это такое странное слово. Вроде и верное, но разве так говорят о предназначении? Если вопрос о том, каков
    был сам путь — об этом рассказать несложно. Сначала я, как и многие имперские сироты, прошла {g|Encyclopedia:ScholaProgenium}Схола
    Прогениум{/g}. Это были суровые годы, но я вспоминаю о них с радостью. Мало что сравнится с ощущением пройденного испытания,
    даже если после тело стонет от усталости или душа сжимается от боли".'
  speaker: Сестра Арджента
- guid: 63a251bb-2980-44b1-8235-0730d238208a
  event: Companions_Sororitas_50
  text: '"Я была одной из лучших среди сверстниц. И была отобрана для послушничества в рядах {g|Encyclopedia:AdeptaSororitas}Адепта
    Сороритас{/g}. В свой час прошла испытания и приняла обеты. Самый радостный день моей жизни! Свет {g|Encyclopedia:Emperor}Императора{/g}
    был со мной всегда, но принять его всем сердцем, произнести клятвы — это особое упоение".'
  speaker: Сестра Арджента
- guid: 804a098a-0471-4731-837f-d119c9a51cfa
  event: Companions_Sororitas_51
  text: '"В последнем путешествии мне запомнился сенешаль Версериан — он несколько раз заходил справиться о моем здоровье.
    Добрый человек, верный слуга {g|Encyclopedia:Imperium}Империума{/g}. Кажется, он одинаково дотошно относится к инспекции
    систем логистики и проверке здоровья случайно оказавшихся на корабле {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g}!"'
  speaker: Сестра Арджента
- guid: 4977fe61-7759-477c-bf44-b728aa472736
  event: Companions_Sororitas_52
  text: '"Известных мне — нет, но ордена {g|Encyclopedia:AdeptaSororitas}Сестринства{/g} многочисленны и могут действовать
    независимо друг от друга, направляя сестер туда, где {g|Encyclopedia:AdeptusMinistorum}Экклезиархия{/g} видит в них нужду.
    Может быть, где-то в свите {g|Encyclopedia:Inquisition}Лорд-инквизитора{/g}, да будет путь его благословен, есть мои сестры?
    Я бы хотела, чтобы это было так — даже один вечер совместных молитв и тренировок принес бы мне радость!"'
  speaker: Сестра Арджента
- guid: c31cb5b5-31c7-481b-b695-15d7b1d9b2d5
  event: Companions_Sororitas_53
  text: '"Орден отправил меня на станцию {g|Encyclopedia:Footfall}Футфол{/g}. Мой долг заключался в помощи местным братьям-{g|Encyclopedia:Drusians}друзианцам{/g}
    со старым реликварием, оставшемся еще со времен Парсимуса Девейна, основателя станции".'
  speaker: Сестра Арджента
- guid: 78a6cd0c-0503-4f69-8b2c-920d45322865
  event: Companions_Sororitas_54
  text: '"Если появятся новые — не стоит держать их в себе! Интерес к святости есть добродетель".'
  speaker: Сестра Арджента
- guid: 18d17c11-024d-47be-8781-0431a07c4e1c
  event: Companions_Sororitas_55
  text: '"Да. Это — начало ее жития. Известно, что она жила в мире, где произошло страшное восстание еретиков. Они уничтожили
    там все живое — кроме тех, кого святая Арджента смогла спасти при помощи Единственной звезды. И силы своей веры".'
  speaker: Сестра Арджента
- guid: 36461d00-99a6-4d19-a433-eda0c378b81f
  event: Companions_Sororitas_56
  text: '{n}Глаза сестры вспыхивают.{/n} "Как же счастлива я буду наконец-то найти ответ, которым {g|Encyclopedia:AdeptusMinistorum}Экклезиархия{/g}
    задавалась тысячелетиями! Скорее бы отыскать дорогу на Салис Прайм... Губительные силы, без сомнения, нарочно мешают нам.
    Стоят на пути веры".'
  speaker: Сестра Арджента
- guid: 5728af0f-f8f2-4904-8a95-1379ba1a79e4
  event: Companions_Sororitas_57
  text: '"Разыскать путь к планете Салис Прайм. Там находится упавший корабль святой Ардженты, моей покровительницы. И там
    должна покоиться принадлежавшая ей великая реликвия — Единственная звезда".'
  speaker: Сестра Арджента
- guid: 5710617d-8995-4332-99de-36977c464a78
  event: Companions_Sororitas_58
  text: '{n}Глаза Ардженты непрестанно обшаривают окружение, будто в поисках скрытых врагов. Даже когда она останавливает
    взгляд на вашем лице, это выражение не исчезает.{/n} "Вольный Торговец".'
  speaker: Сестра Арджента
- guid: 709c548a-d947-4a2c-b7eb-77f98fc97def
  event: Companions_Sororitas_59
  text: '"Вольный Торговец! Как мне отрадно воссоединиться с {mf|избранником|избранницей} Императора!"'
  speaker: Сестра Арджента
- guid: aeee3a78-2b5e-43be-9f54-146bb4a1e881
  event: Companions_Sororitas_60
  text: '"Я даже не пыталась! Зачем мне знать что-либо про мерзость врагов человечества, когда все чего я хочу — сжечь здесь
    все в чистом, яростном пламени? Все, что мне нужно, я уже знаю — это место есть зло, но и в нем встречаются слуги Императора,
    достойные спасения".'
  speaker: Сестра Арджента
- guid: 078289b8-1fe7-421e-8632-afccf75373fc
  event: Companions_Sororitas_61
  text: '"Мы бы нашли выход, если бы объединили усилия с собратом по вере, а не отвратительным чудовищем! Но теперь Комиссар
    мертв, а мы — сами по себе".'
  speaker: Сестра Арджента
- guid: e39ba083-acd2-4f72-beb3-2f02fd0f63cf
  event: Companions_Sororitas_62
  text: '"Нужно. И я клянусь биться ради этого и не терять надежды даже... даже когда ложь, скверна и предательство окружают
    со всех сторон!"'
  speaker: Сестра Арджента
- guid: d92354cb-b79c-4dec-8aef-313a1918d927
  event: Companions_Sororitas_63
  text: '"Да пребудет с тобою свет Терры, Вольный Торговец!"'
  speaker: Сестра Арджента
- guid: 42c644c9-a8c9-4c44-94e0-7f77f1c2f516
  event: Companions_Sororitas_64
  text: '"Следуя за тобой в пламя битвы, я получу шанс на очищение. А это — все, чего я желаю, все, о чем молю. Праведная
    гибель — и за ней покой, если Он решит даровать его недостойной дочери".'
  speaker: Сестра Арджента
- guid: 04205aab-9d8e-455e-adf3-04392bfe480f
  event: Companions_Sororitas_65
  text: '{n}Лицо Ардженты будто озарено изнутри, глаза сияют.{/n} "Я приветствую тебя, Вольный Торгвоец!"'
  speaker: Сестра Арджента
- guid: b19acc1c-715c-4ee8-980f-9106c6a0ca12
  event: Companions_Sororitas_66
  text: '"Как никогда, Вольный Торговец! Мое место — на поле праведного боя, рядом с {mf|Избранником|Избранницей} Императора,
    что помог{mf||ла} мне пройти путь до конца и обрести святую реликвию! Веди, и я последую".'
  speaker: Сестра Арджента
- guid: a1bc6a75-f724-4741-8b16-c62d4a046811
  event: Companions_Sororitas_67
  text: '"Сегодня — да. Но я не могу обещать вечно оставаться твоей спутницей. Так много зла, скрытого и явного, так много
    скверны и мерзости прячется за каждым углом! Я жажду смести его, искоренить. Везде, где найду, в любое время, любой ценой".
    {n}Глаза Ардженты опасно горят.{/n} "Тебя обременяет слишком много мелочных забот, Вольный Торговец. Моя дорога — прямее
    и неумолимее".'
  speaker: Сестра Арджента
- guid: 48a1c4b7-e791-4a84-8b97-fc1c8ba24512
  event: Companions_Sororitas_68
  text: '"Конечно!" {n}— Арджента взволнованно вздыхает.{/n} "Ты помнишь первые дни атаки, когда нам удалось захватить одного
    из командиров еретиков? Он горел так ярко, что, должно быть, видно было на всем поле боя! Но особенно ценно то, что он
    успел рассказать до казни".'
  speaker: Сестра Арджента
- guid: 476fc4dd-b5ad-4052-b48f-ce89f5073ce9
  event: Companions_Sororitas_69
  text: '"Сгинувший еретик был одним из ближайших приспешников Кунрада Войгтвира. И он сообщил — прокричал сквозь боль — то,
    что я так давно стремилась узнать. Приметы маршрута к Салис Прайм, миру, куда я стремлюсь всем сердцем! Как бы ни пытались
    еретики Последнего восхода остановить нас — им это не удастся".'
  speaker: Сестра Арджента
- guid: f55d8feb-5a4d-47f5-a719-da9e7fdae1ca
  event: Companions_Sororitas_70
  text: '"Истинно так, Вольный Торговец".'
  speaker: Сестра Арджента
- guid: 40aee646-5d4d-4cf2-836e-abdf2ee73756
  event: Companions_Sororitas_71
  text: '"Если хочешь ей добра, подари каплю совести и страха перед Императором — вот то, в чем она поистине нуждается. Ну
    а если хочешь порадовать... дай ей какое-нибудь бессмысленное украшение, дорогое и блестящее. Над сердцами вроде ее они
    имеют магическую власть".'
  speaker: Сестра Арджента
- guid: f47b65bf-8ca4-4740-9167-45e652c8874d
  event: Companions_Sororitas_72
  text: '"Вольный Торговец!" {n}Глаза Ардженты горят испепеляющим пламенем оскорбленной веры.{/n} "Скверна и ересь проникли
    на борт этого пустотного корабля, словно насмехаясь над праведными! Ты тешишь себя мыслью о том, что пышущее скверной
    чудовище Архиврага покорно тебе, но подобными мыслями лишь позволяешь тьме проникнуть в самую душу, отравляя ее. Твой
    поступок не ведает ни объяснения, ни прощения — знай об этом!"'
  speaker: Сестра Арджента
- guid: 1d66e102-f762-4ab1-9830-1445b82e1da5
  event: Companions_Sororitas_73
  text: '"Да убережет сердца наши от гнилых страстей и слабости духа...", — {n}едва слышно шепчет Арджента, не сводя глаз
    с отметины на вашей шее.{/n}'
  speaker: Сестра Арджента
- guid: a3d1aa68-584c-44b0-8bdc-f8e6998b758a
  event: PRL_ArgentaRecruit_02
  text: '"Сестра Арджента!" {n}Голос сенешаля, кажется, выводит воительницу из боевого транса.{/n} "Сестра Арджента, рад видеть
    вас. Нам нужны все силы, какие мы сможем собрать!"'
  speaker: Сестра Арджента
- guid: 91f3e398-276f-47d0-bb16-fff089ce475d
  event: PRL_ArgentaRecruit_03
  text: '"Мне не терпится истребить еще больше еретиков. Всех их!"'
  speaker: Сестра Арджента
- guid: 4b5c7a38-91ef-4dc5-ba93-b4a910d8d2f3
  event: PRL_ArgentaRecruit_04
  text: '"Сестра Арджента — гостья Лорд-капитана". {n}Абеляр бросает быстрый взгляд на девушку.{/n} "И эта история заслуживает
    отдельного времени и разговора — в более подходящей ситуации".'
  speaker: Абеляр Версериан
- guid: 17905916-481b-445c-91e2-b540ed0d197b
  event: PRL_ArgentaRecruit_05
  text: '"Погром, Ваша Светлость! Мало того, что еретики уничтожают экипаж... какая-то скверна стелется по палубам, заполняет
    собой воздух. Я видел, как люди сходят с ума, вдохнув ее... как начинают видеть мертвецов, как выдирают себе глаза. Заклинаю
    вас, будьте осторожнее!"'
  speaker: Сестра Арджента
- guid: 438d6686-a74a-4484-b587-47767638eadb
  event: PRL_ArgentaRecruit_07
  text: '"Готова. Свет Терры да озарит наш путь через огонь и тьму!"'
  speaker: Сестра Арджента
- guid: a8ecba6e-6f9c-4534-b488-fe9c6e11be51
  event: PRL_ArgentaRecruit_08
  text: '"Этот ответ делает вам честь. Только истинному праведнику будет столь нестерпимо само обвинение в ереси". {n}Арджента
    кивает.{/n}'
  speaker: Сестра Арджента
- guid: dc3c3356-85b4-479e-949e-0acc7783a0f4
  event: PRL_ArgentaRecruit_09
  text: '"Если вы говорите правду — {g|Encyclopedia:Emperor}Император{/g} не оставит вас. Если лжете — не уйдете от Его возмездия".'
  speaker: Сестра Арджента
- guid: c391c9e8-9ca9-4df9-be97-c08394add642
  event: PRL_ArgentaRecruit_10
  text: '"Довольно пустой болтовни. Я там, где должна быть — и этого довольно".'
  speaker: Сестра Арджента
- guid: 245a6533-4ad8-47a8-ad64-498b07c1a5c0
  event: PRL_ArgentaRecruit_11
  text: '"Вот и славно. Сестра?"'
  speaker: Сестра Арджента
- guid: 6335a076-9037-47ef-a624-b1e1a93de993
  event: PRL_ArgentaRecruit_12
  text: '"Сестра, прошу!" {n}Абеляр, похоже, теряет терпение.{/n} "Сейчас не время для допросов. Корабль атакован еретиками,
    нас предал дражайший Мастер шепотов, наследник Эдельтрад ожидает нашей помощи, а Лорд-капитан Теодора — доклада об успешных
    действиях. Мы здесь, чтоб навести порядок — так давайте этим и займемся".'
  speaker: Абеляр Версериан
- guid: 6b8370c0-ac31-439d-bb98-8c0a6c697b48
  event: PRL_ArgentaRecruit_13
  text: '{n}Идира издает каркающий смешок.{/n} "Ха! Впервые вижу, чтобы кто-то на борту говорил с сестричкой в таком тоне!"'
  speaker: Идира Тласс
- guid: 0f60dfb7-ec54-43d9-a756-8b107aaa0860
  event: PRL_ArgentaRecruit_14
  text: '"Позвольте мне, {name}. Сестра Арджента, священная воительница из {g|Encyclopedia:AdeptaSororitas}Адепта Сороритас{/g}.
    Сестра, перед вами — {name} фон Валанциус, член династии {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}".'
  speaker: Сестра Арджента
- guid: dc795687-67ae-49d1-9244-e119a9bb4ed4
  event: PRL_ArgentaRecruit_15
  text: '{n}Арджента снова смеривает вас взглядом. В темных глубинах ее глаз читается что-то странное, какая-то борьба, или
    невысказанный вопрос. Но в конце концов она кивает.{/n} "Это темный и страшный час. Корабль полнится скверной. На лицах
    друзей проступают усмешки еретиков, в глазах товарищей вспыхивает голод {g|Encyclopedia:Chaos}Архиврага{/g}. Я сделаю
    то что должно, чтобы остановить поступь темных сил, но в эти мрачные мгновения верить нельзя ничему. Потому я должна знать
    — зачем вы здесь?"'
  speaker: Сестра Арджента
- guid: b35f6d72-aa90-43f3-8a93-1852280789a7
  event: PRL_ArgentaRecruit_16
  text: '"Что ж, пусть будет так... пока что". {n}Арджента гордо вскидывает голову.{/n}'
  speaker: Сестра Арджента
- guid: b2d21fd6-2700-45b7-87dc-1a21742c573a
  event: PRL_ArgentaRecruit_17
  text: '{n}Девушка, названная Арджентой, опускает оружие и окидывает ваш небольшой отряд напряженным взглядом. И смотрит
    прямо на вас.{/n} "Я не знаю вашего лица. Кто вы?"'
  speaker: Сестра Арджента
- guid: 6318b8ab-7cdd-486b-8cda-5e13f45bbce9
  event: PRL_ArgentaRecruit_18
  text: '"Надзиратель средней палубы АЛ-84, Ваша Светлость! Мы собирали людей среди атакованных отсеков, когда угодили в ловушку.
    Почти все блюстители пали... это — те, кто остался жив после боев".'
  speaker: Сестра Арджента
- guid: b2c6942b-9ff1-4c50-a14b-d23563de748f
  event: PRL_ArgentaRecruit_19
  text: '"Мы пойдем следом — пока что будем сдерживать еретиков, которые пытаются лезть через щели на подмогу своим, и заодно
    взглянем на генераторы. Эти лихоимцы что-то накрутили в кабелях... эх, нам бы техномата в помощь, но посмотрим, что можем
    сами сделать".'
  speaker: Сестра Арджента
- guid: 19cd5eb5-560f-4ec6-944f-54ae12efe3af
  event: PRL_ArgentaRecruit_20
  text: '"Через эту дверь". {n}Арджента кивает на проход справа от вас.{/n} "Я пойду с вами, ибо долг мой перед Богом-Императором
    — уничтожить эту ересь".'
  speaker: Сестра Арджента
