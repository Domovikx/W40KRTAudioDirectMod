- guid: c67cd8f7-6c71-47ac-af10-4fdf31bba16c
  event: Companions_Psyker_01
  text: '{n}Голос Идиры звучит звонко и четко, почти сценически.{/n} "Древний мир с разбитым сердцем. Найдешь к нему тропу — и его богатства твои! Но тропы две, и обе покроют тебя позором, и обе — не то, чем пытаются казаться... Что выберешь, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}? Грех {g|Encyclopedia:Warp}Эмпиреев{/g} или грех мертвых богов?"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Голос Идиры звучит звонко и четко, почти сценически.
  - speaker: Идира Тласс
    text_clean: Древний мир с разбитым сердцем. Найдешь к нему тропу — и его богатства твои! Но тропы две, и обе покроют тебя позором, и обе — не то, чем пытаются казаться... Что выберешь, Вольный Торговец? Грех Эмпиреев или грех мертвых богов?
- guid: 956f8f9b-bca5-4c27-a4d7-da2f3e9ef5d6
  event: Companions_Psyker_02
  text: '"Другая дорога... дорога начинается с порога Простора и ведет к недрам зарождающегося ми... ми... ра..." {n}Идира вдруг становится серой и начинает хватать ртом воздух. Из ее хрипящего горла исторгается чужой голос — глухой, тяжелый рокот далекой лавины.{/n} "Читать нити судьбы — не твоя участь, раб{mf||а} трупа на троне! Ступай в объятья рока, ибо так предначертано Архитектором Судеб!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Другая дорога... дорога начинается с порога Простора и ведет к недрам зарождающегося ми... ми... ра...
  - speaker: narrator
    text_clean: Идира вдруг становится серой и начинает хватать ртом воздух. Из ее хрипящего горла исторгается чужой голос — глухой, тяжелый рокот далекой лавины.
  - speaker: Идира Тласс
    text_clean: Читать нити судьбы — не твоя участь, раб трупа на троне! Ступай в объятья рока, ибо так предначертано Архитектором Судеб!
- guid: 0f3b6e30-a1ed-4dac-bbd2-3fbf990a0a0a
  event: Companions_Psyker_03
  text: '"В общем, были мы один раз на {g|Encyclopedia:Footfall}Футфоле{/g}... ну то есть Лорд-капитан Теодора на Футфоле часто бывала, а тут меня с собой потащила с какой-то целью. У меня еще с утра день не задался, башка трещала, но делать нечего — пришлось идти. Приходим мы в место — притон притоном, все господа и дамы расфуфыренные, с {g|Encyclopedia:Augmentation}имплантами{/g} инкрустированными, сидят кучками за столами... в общем, выяснилось, что это игральный дом, да не простой, а заведенный кем-то из толстосумов для таких же, с деньжищами. Знали бы вы, как это, когда у тебя на глазах в {g|Encyclopedia:Regicide}регицид{/g} планету проигрывают! В общем, Лорд-капитан хотела, чтобы я ей помогла обставить одного типа... я ей говорю: пить дать, фишка не ляжет, фигура не пойдет, не садитесь за стол, Ваша Светлость! Она ни в какую — вот чего ей было не занимать, так это упорства".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'В общем, были мы один раз на Футфоле... ну то есть Лорд-капитан Теодора на Футфоле часто бывала, а тут меня с собой потащила с какой-то целью. У меня еще с утра день не задался, башка трещала, но делать нечего — пришлось идти. Приходим мы в место — притон притоном, все господа и дамы расфуфыренные, с имплантами инкрустированными, сидят кучками за столами... в общем, выяснилось, что это игральный дом, да не простой, а заведенный кем-то из толстосумов для таких же, с деньжищами. Знали бы вы, как это, когда у тебя на глазах в регицид планету проигрывают! В общем, Лорд-капитан хотела, чтобы я ей помогла обставить одного типа... я ей говорю: пить дать, фишка не ляжет, фигура не пойдет, не садитесь за стол, Ваша Светлость! Она ни в какую — вот чего ей было не занимать, так это упорства.'
- guid: d242ef21-b6f2-45dd-bdc9-6ea2c646a1d0
  event: Companions_Psyker_04
  text: '{n}Идира резко втягивает воздух и закашливается. Из ее рта на пол летит что-то белесое и шевелящееся — белые личинки, которые тут же тают и обращаются в дым.{/n} "Я... это была не я! Клянусь всем, что свято! Не знаю, что это за вторая "дорога" и кто ее стережет, но молю, держитесь от нее подальше!"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира резко втягивает воздух и закашливается. Из ее рта на пол летит что-то белесое и шевелящееся — белые личинки, которые тут же тают и обращаются в дым.
  - speaker: Идира Тласс
    text_clean: Я... это была не я! Клянусь всем, что свято! Не знаю, что это за вторая "дорога" и кто ее стережет, но молю, держитесь от нее подальше!
- guid: 03ce0dda-0391-4029-9f9d-016a8cf4d051
  event: Companions_Psyker_05
  text: '"Так чего же мы ждем? Скорее зовите писаря, надо все увековечить, пока не забыли! Только пусть сделает меня более героической и могущественной, чтобы я выгодно выделялась на фоне остальных ваших спутников. Как думаете, сколько мы с вами негодяев перебили? Миллион наберется? Хрен с ним, пусть будет два!"'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Так чего же мы ждем? Скорее зовите писаря, надо все увековечить, пока не забыли! Только пусть сделает меня более героической и могущественной, чтобы я выгодно выделялась на фоне остальных ваших спутников. Как думаете, сколько мы с вами негодяев перебили? Миллион наберется? Хрен с ним, пусть будет два!
- guid: cee46116-c5f2-401b-8538-f92112558d15
  event: Companions_Psyker_06
  text: '"Знала б наверняка — уже б выложила. Чтобы хорошо слышать, нужно содействие, а эта кобра на меня только шипит и поплевывает своим святым ядом. Ох, не доверяю я ей... "'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Знала б наверняка — уже б выложила. Чтобы хорошо слышать, нужно содействие, а эта кобра на меня только шипит и поплевывает своим святым ядом. Ох, не доверяю я ей...
- guid: 88500d26-2fa3-40a3-bbba-bdfe35925d64
  event: Companions_Psyker_07
  text: '"С Лейры, мира на окраине, в регионе Безбожных звезд. В {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g} как — чем глубже забираешься, тем хуже видно {g|Encyclopedia:Astronomican}Астрономикон{/g} и меньше знают про {g|Encyclopedia:Imperium}Империум{/g}. Появление Вольного Торговца — лучшее, что может случиться с тамошними мирами. Да, самое лучшее".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: С Лейры, мира на окраине, в регионе Безбожных звезд. В Просторе Коронус как — чем глубже забираешься, тем хуже видно Астрономикон и меньше знают про Империум. Появление Вольного Торговца — лучшее, что может случиться с тамошними мирами. Да, самое лучшее.
- guid: d9821277-db56-41d5-ad82-672af10feaa2
  event: Companions_Psyker_08
  text: '"Это точно не помешает. Я тоже послежу. Эх, понять бы, что значит... Может, опасность для нее... а может — от нее исходящую".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Это точно не помешает. Я тоже послежу. Эх, понять бы, что значит... Может, опасность для нее... а может — от нее исходящую.
- guid: 9777900e-291a-4707-9f62-4ebcd8612788
  event: Companions_Psyker_09
  text: '"В лабиринте чуждого мира вереницей вершится месть: око за око. Пролитая кровь тех, что зрит, несет за собой возмездие тех, кто ослеп. А на запах бежит кровожадный зверь, оскверненно скалясь. Его укрощение мнимо и приводит к распутью — стереть зараженную кровь, самому ей упиться или окрасить землю в багряный".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: 'В лабиринте чуждого мира вереницей вершится месть: око за око. Пролитая кровь тех, что зрит, несет за собой возмездие тех, кто ослеп. А на запах бежит кровожадный зверь, оскверненно скалясь. Его укрощение мнимо и приводит к распутью — стереть зараженную кровь, самому ей упиться или окрасить землю в багряный.'
- guid: 2a7d6082-5eb9-4583-9ea3-a7865b6c2811
  event: Companions_Psyker_10
  text: '"Я просто избавилась от лишнего. Я прятала свой страх за байками, шуточками и подхалимством. Теперь страх ушел, а значит, и прятать его незачем. Я больше не дам вам поводов называть меня обузой или риском, Лорд-капитан. Я ваш инструмент, {name}, повелевайте". {n}Идира учтиво кланяется и выжидающе смотрит на вас.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Я просто избавилась от лишнего. Я прятала свой страх за байками, шуточками и подхалимством. Теперь страх ушел, а значит, и прятать его незачем. Я больше не дам вам поводов называть меня обузой или риском, Лорд-капитан. Я ваш инструмент, КЭП, повелевайте.
  - speaker: narrator
    text_clean: Идира учтиво кланяется и выжидающе смотрит на вас.
- guid: 736b72ea-99c0-493b-886d-01f51f75e431
  event: Companions_Psyker_11
  text: '{n}Идира смотрит на вас холодными бесчувственными глазами без тени улыбки на ее бледном лице.{/n} "Лорд-капитан?"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира смотрит на вас холодными бесчувственными глазами без тени улыбки на ее бледном лице.
  - speaker: Идира Тласс
    text_clean: Лорд-капитан?
- guid: ae731093-fad9-4e9e-abd0-0fbb06eaa64e
  event: Companions_Psyker_12
  text: '"Сестричка одержима своими собственными голосами, что шепчут ей о скверне и ереси". {n}Идира молчит, а потом изменившимся голосом добавляет.{/n} "Глупышка не понимает, что начинать искать, откуда сквозит, надо со своей головы".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Сестричка одержима своими собственными голосами, что шепчут ей о скверне и ереси.
  - speaker: narrator
    text_clean: Идира молчит, а потом изменившимся голосом добавляет.
  - speaker: Идира Тласс
    text_clean: Глупышка не понимает, что начинать искать, откуда сквозит, надо со своей головы.
- guid: 40bd97a6-1adb-440d-8d51-cc5d08266b02
  event: Companions_Psyker_13
  text: '"Клубок очень запутанный, много в нем ниточек сплелось, каждая в свою сторону тянуть пытается. Марионетки считают, что у них своя воля, но это лишь потому что им так велят — уж больно искусный кукловод попался. Черная длань его далеко, но от того лишь страшнее. Даже пестрая кукла, что как черт из коробочки выпрыгивает и скачет где ей вздумается, делает это с его дозволения".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Клубок очень запутанный, много в нем ниточек сплелось, каждая в свою сторону тянуть пытается. Марионетки считают, что у них своя воля, но это лишь потому что им так велят — уж больно искусный кукловод попался. Черная длань его далеко, но от того лишь страшнее. Даже пестрая кукла, что как черт из коробочки выпрыгивает и скачет где ей вздумается, делает это с его дозволения.
- guid: 661a8531-3a33-4e73-a9d0-de21526844d7
  event: Companions_Psyker_14
  text: '"Надо очень чутко прислушиваться к чуждой мелодии и шагать ровно в такт. Звучание ее мрачное и опасное, но хору страданий не вторит. Это не значит, что танец не будет кровавым, но, побыв ведомым, можно потом оказаться ведущим".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Надо очень чутко прислушиваться к чуждой мелодии и шагать ровно в такт. Звучание ее мрачное и опасное, но хору страданий не вторит. Это не значит, что танец не будет кровавым, но, побыв ведомым, можно потом оказаться ведущим.
- guid: 7aa8f2d4-753c-43b1-b79a-f9a30c6edc9f
  event: Companions_Psyker_15
  text: '{n}Идира наклоняет голову набок, словно прислушиваясь к чему-то.{/n} "Лорд-капитан, вы меня извините, но только это как слепому про цвета рассказывать: могу часами говорить, а толку не будет".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира наклоняет голову набок, словно прислушиваясь к чему-то.
  - speaker: Идира Тласс
    text_clean: 'Лорд-капитан, вы меня извините, но только это как слепому про цвета рассказывать: могу часами говорить, а толку не будет.'
- guid: fcbdc254-5440-4180-a3b6-f5cb95b824b9
  event: Companions_Psyker_16
  text: '{n}С видимым напряжением Идира вслушивается в тишину.{/n} "Не могу... разобрать... зараза!" {n}Женщина в сердцах сплевывает и разочарованно поджимает губы.{/n} "Не, дохлый номер, Лорд-капитан".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: С видимым напряжением Идира вслушивается в тишину.
  - speaker: Идира Тласс
    text_clean: Не могу... разобрать... зараза!
  - speaker: narrator
    text_clean: Женщина в сердцах сплевывает и разочарованно поджимает губы.
  - speaker: Идира Тласс
    text_clean: Не, дохлый номер, Лорд-капитан.
- guid: 265cc614-3fbb-4695-9327-0d4d483b4c48
  event: Companions_Psyker_17
  text: '{n}Идира натянуто улыбается.{/n} "Да, Лорд-капитан. Очень люблю хорошо посмеяться".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира натянуто улыбается.
  - speaker: Идира Тласс
    text_clean: Да, Лорд-капитан. Очень люблю хорошо посмеяться.
- guid: bec5ad69-e377-49cb-85a3-906a0848a959
  event: Companions_Psyker_18
  text: '{n}Идира делает шаг назад, словно ее ударили.{/n} "Но почему?!" {n}Она вглядывается вам в лицо и, словно отыскав в нем ответ, судорожно вздыхает и кивает.{/n} "Т-так точно, Лорд-капитан. Я... приступлю к выполнению. Прощайте".'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира делает шаг назад, словно ее ударили.
  - speaker: Идира Тласс
    text_clean: Но почему?!
  - speaker: narrator
    text_clean: Она вглядывается вам в лицо и, словно отыскав в нем ответ, судорожно вздыхает и кивает.
  - speaker: Идира Тласс
    text_clean: Т-так точно, Лорд-капитан. Я... приступлю к выполнению. Прощайте.
- guid: 141a19d8-224f-4590-a3af-d4ac832ed2ad
  event: Companions_Psyker_19
  text: '{n}Идира замирает, ее глаза начинают наполняться страхом.{/n} "Что?"'
  speaker: Идира Тласс
  parts:
  - speaker: narrator
    text_clean: Идира замирает, ее глаза начинают наполняться страхом.
  - speaker: Идира Тласс
    text_clean: Что?
- guid: e68480f6-b568-4055-ba56-b2a8f2b388b3
  event: Companions_Psyker_20
  text: '"Иногда. Редко. Да и если подумать — зачем мне это? Тут есть все, что мне нужно. Все шепоты, что слышу, привычные, почти родные. А о кошмарах за бортом я могу за {g|Encyclopedia:Amasec}амасеком{/g} послушать". {n}Идира морщится и потирает глаза.{/n} "Вы только не подумайте — если надо, я за вами хоть на край галактики".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Иногда. Редко. Да и если подумать — зачем мне это? Тут есть все, что мне нужно. Все шепоты, что слышу, привычные, почти родные. А о кошмарах за бортом я могу за амасеком послушать.
  - speaker: narrator
    text_clean: Идира морщится и потирает глаза.
  - speaker: Идира Тласс
    text_clean: Вы только не подумайте — если надо, я за вами хоть на край галактики.
- guid: d3aa8167-2ef9-4d8e-a2de-45eb224e4c5e
  event: Companions_Psyker_21
  text: '"Тренировка. Привычка. Еще немного {g|Encyclopedia:Amasec}амасека{/g} и пара других штучек, которые можно достать на нижних палубах. Если взять все вместе — выходит терпимо". {n}Идира дергает плечом и хихикает.{/n} "Иногда даже думаю — может, я половину голосов сама себе придумываю? Ну, когда скучновато становится. Не живых же слушать".'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Тренировка. Привычка. Еще немного амасека и пара других штучек, которые можно достать на нижних палубах. Если взять все вместе — выходит терпимо.
  - speaker: narrator
    text_clean: Идира дергает плечом и хихикает.
  - speaker: Идира Тласс
