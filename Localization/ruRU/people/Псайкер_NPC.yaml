  event: Companions_Psyker_38
  text: '"Каждый из нас ощущает связь с {g|Encyclopedia:Warp}варпом{/g} по-своему. Кто-то видит пятна и силуэты на периферии взгляда. Кто-то чувствует пальцы на хребте. Что до меня — у меня дверная щель в голове. Никак не прикрыть, сколько ни старайся, остается только привыкать к шепоту с той стороны. Когда надо для дела — прислушиваюсь получше, а обычно стараюсь не замечать". {g|Encyclopedia:Psyker}{/g}'
