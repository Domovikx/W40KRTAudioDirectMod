  event: Companions_Psyker_67
  text: '"Ну что, выясним, что там о вас наушничают, а?.." {n}Идира усмехается, потирает руки — и внезапно замирает с глупой улыбкой на губах и чуть склоненной набок головой. Вы ощущаете, как кожа покрывается мурашками, а воротник начинает едва заметно трепетать — словно на сквозняке, вылетевшем из приоткрытой двери.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Ну что, выясним, что там о вас наушничают, а?..
