  event: Companions_Psyker_26
  text: '"Контроль теряют неудачники, когда боятся своего дара. Или идиоты, которые так и не разобрались, что они такое на самом деле. Ну или малые детки, которым охота поиграть в новую цацку. Если не знать предел своим способностям или постоянно скакать через собственную голову — вот тогда жди беды".'
