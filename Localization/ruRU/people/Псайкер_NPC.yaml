  - speaker: Идира Тласс
    text_clean: Каменный лик Императора грозен, но не зрит, как в его ногах занимается пламя. Чело той, что зовет себя его карой, осеняет нимб из тел, что парят на орбите. Но не все горят одинаково — холодный расчет способен сломить даже праведный гнев. Канистра с прометием у твоих ног, а куда его вылить — решать лишь тебе.
