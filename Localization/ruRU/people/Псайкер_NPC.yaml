  event: Companions_Psyker_66
  text: '"Заводное сердце запретной святыни бьется не в ритм, скрежеща все больше с каждым ударом. Тот, кто начал твой путь вместе с вами, даст дорогу рассвету. В недрах плавилен скован разящий клинок, что в руке не удержишь. Обнажить его — навлечь рок и погибель".'
