  text: '"Вот тут, на корабле, совсем другое дело... да я за первый год на службе у леди фон Валанциус насмотрелась на чудес больше, чем за всю жизнь на Лейре. Взять хотя бы мой первый полет через {g|Encyclopedia:Warp}варп{/g} — три дня лежала, а в голове сверхновые взрывались! Я только потом узнала, что легко отделалась — за переборкой в соседнем отсеке вся команда превратилась..." {n}Идира осекается.{/n} "Что-то я разболталась, Лорд-капитан. Не берите в голову".'
