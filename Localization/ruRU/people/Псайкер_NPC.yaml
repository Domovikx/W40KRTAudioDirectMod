  event: Companions_Psyker_22
  text: '"Я была при свите владыки, когда Теодора фон Валанциус нанесла ему визит. Не знаю, зачем — да и не мое дело". {n}Идира прищуривается, словно приглядывается к чему-то вдали.{/n} "Я до сих пор помню, как изменились голоса в голове, когда взглянула на нее — чуть не до визга зашлись. Много было за ее спиной... и на пути впереди тоже хватало".'
