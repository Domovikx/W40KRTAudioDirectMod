  event: Companions_Psyker_29
  text: '{n}Идира молчит несколько секунд перед ответом — а потом картинно закатывает глаза.{/n} "Знаете... Леди Теодора плевать хотела, замерили ли мне какие-то умники мозги или нет. Дело не в печати на лбу, смекаете? Дело в том, какое у тебя нутро — гнилое или нет. У меня нутро тверже адамантиума на этом корабле. И {g|Encyclopedia:Augmentation}импланты{/g} получше тех, которые втыкают на этой вашей {g|Encyclopedia:HolyTerra}Терре{/g}. Иначе бы я просто не дожила до своих лет". {n}Идира зло оскаливается, ее глаза лихорадочно блестят.{/n}'
