- guid: 06bc9491-ac7d-4f9a-896d-eaf820f10806
  event: Companions_Psyker_65
  text: '"Каменный лик {g|Encyclopedia:Emperor}Императора{/g} грозен, но не зрит, как в его ногах занимается пламя. Чело той, что зовет себя его карой, осеняет нимб из тел, что парят на орбите. Но не все горят одинаково — холодный расчет способен сломить даже праведный гнев. Канистра с прометием у твоих ног, а куда его вылить — решать лишь тебе".'
  speaker: Идира Тласс
