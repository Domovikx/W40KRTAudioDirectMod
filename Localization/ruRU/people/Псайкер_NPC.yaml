  event: Companions_Psyker_81
  text: '"Ну, сели, начали партию. Я рядом кручусь, вроде и не при делах, но поглядываю. И голова у меня все сильнее и сильнее трещит... короче, хорошо, что я сообразила вовремя, что дело не в слитой партии, а в чем-то другом — вытащила Лорд-капитана из-за стола под предлогом каким, уволокла подальше, а через считанные минуты там, где мы были..." {n}Идира не выдерживает и начинает хохотать.{/n} "Оказывается, какой-то умник тоже приволок с собой ручного {g|Encyclopedia:Psyker}псайкера{/g}! Из тех, что в подполье Футфола шарятся! Он взял и... перенервничал, короче! Говорят, когда в эту комнату после всей катавасии заглянули, все, кто там был, друг друга перегрызли! В прямом смысле! Зубами!" {n}Идира, всхлипывая, вытирает выступившую слезу.{/n} "Ох... кажется, тот астероид потом вообще от Футфола отцепили и в открытый космос оттолкнули, чтобы в местную звезду улетел".'
