  event: Companions_Psyker_32
  text: '"Захолустная планетка между блеклых звезд. На Лейре десяток местных тиранов грызутся за жалкие пять континентов, но в ход идет все — от яда до {g|Encyclopedia:Psyker}псайкеров{/g}". {n}Идира принимается растирать дрожащие пальцы.{/n} "Много лет там не была, но поверьте, скучать не о чем".'
