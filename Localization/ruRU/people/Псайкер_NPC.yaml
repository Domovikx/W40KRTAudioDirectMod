  event: Companions_Psyker_68
  text: '{n}Взгляд псайкера уносится куда-то в непостижимую даль, а ее голос множится неестественным металлическим эхом.{/n} "То, где все началось и то, где пути вновь слились — все сошлось воедино. Шаг в бесконечность, где молчанье гробниц оскорбляет биенье сердец. Этот шаг — он будет последним. Слушай шепот в своей голове, так как мои слова иссякли, {g|Encyclopedia:RogueTrader}Вольный Торговец{/g}".'
