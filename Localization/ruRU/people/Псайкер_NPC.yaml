  event: Companions_Psyker_35
  text: '"Жизнь на Лейре мирной не назовешь. Меня и таких, как я, искали специально — подбирали где могли, покупали у родителей, воровали даже. Я вот, например, из уличной банды загремела — продали меня детки постарше, когда смекнули, что со мной не так. При правящих династиях были школы, где нас и натаскивали, дурь выбивали. А потом — отправляли служить. Кто-то долго протягивал, как я, кто-то — сильно поменьше. Не все такие же ловкие и талантливые, как я. Переступали грань и досрочно выходили в тираж". {n}Идира выжидательно смотрит на вас. Потом, словно уточняя, жестом изображает взорвавшуюся голову и смеется.{/n}'
  speaker: Идира Тласс
  parts:
  - speaker: Идира Тласс
    text_clean: Жизнь на Лейре мирной не назовешь. Меня и таких, как я, искали специально — подбирали где могли, покупали у родителей, воровали даже. Я вот, например, из уличной банды загремела — продали меня детки постарше, когда смекнули, что со мной не так. При правящих династиях были школы, где нас и натаскивали, дурь выбивали. А потом — отправляли служить. Кто-то долго протягивал, как я, кто-то — сильно поменьше. Не все такие же ловкие и талантливые, как я. Переступали грань и досрочно выходили в тираж.
