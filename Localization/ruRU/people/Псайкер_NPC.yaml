  event: Companions_Psyker_34
  text: '{n}Идира кривит губы в злой усмешке.{/n} "О, не стоит, Лорд-капитан. Экипаж давным-давно научился держаться от меня подальше. Боятся, что я рядом постою и ка-а-ак услышу что-то такое эдакое, за что им стыдно будет. Дурачье! Делать мне нечего, как исподнее их совести разглядывать! Ха!"'
