    text_clean: Идира выжидательно смотрит на вас. Потом, словно уточняя, жестом изображает взорвавшуюся голову и смеется.
- guid: 1f926438-18eb-440c-8b79-135788ccdedf
  event: Companions_Psyker_36
  text: '"И пока я так глазела на нее, глазела... взяла и услышала один шепоток. Намек, предположение, не более. Но я-то умею отличать досужий треп от угроз. Улучила минуту, приблизилась и шепнула Теодоре пару слов прежде, чем меня стражники уволокли. Избили, заперли в карцер — еще бы, за неподобающее якшание с чужаком и не такое светит... а потом за мной пришли люди Теодоры. Разворотили стенку, устроили бойню со стражей — лишь бы меня достать, чтобы я договорить предупреждение до конца смогла. Ну, договорить-то договорила, только назад не захотела — и пошла в услужение к фон Валанциусам".'
  speaker: Идира Тласс
  parts:
