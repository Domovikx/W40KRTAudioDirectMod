  event: Companions_Psyker_30
  text: '"Лорд-капитан, не о том печалитесь. Я на этом корабле без малого десять лет. Держала бы меня госпожа фон Валанциус, если бы не была уверена во мне?" {n}Идира мнется пару мгновений.{/n} "Да, бывает иногда... по мелочи. Когда слышу всякое. Порой даже так хорошо слышу, что оно становится взаправдашним. Но и у обычных людей бывают плохие дни, верно?"'
