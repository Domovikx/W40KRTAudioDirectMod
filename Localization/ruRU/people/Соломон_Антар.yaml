  event: RM_ArbitesFirstMeeting_Solomorne_17
  text: '"Ресурсы, которые каждый мир должен отдавать на благо Империума. В случае Райкада Минорис это керамит и реагенты для взрывчатых веществ, добываемые на Райкади Филии, бронестекло, медицинские припасы, а также гвардейцы — живая десятина для назначения в имперские полки. В руках еретиков этот груз особенно опасен, поскольку его легко конвертировать в состояние или использовать в военных целях".'
