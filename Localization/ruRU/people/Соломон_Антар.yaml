- guid: 43344192-34a9-4a0e-99db-f61a39cec0ad
  event: CompanionDialogue_Solomorne_04
  text: '"Порт Странник, Каликсис. Это врата в Коронус и монументальная станция, вечно облепленная кораблями и трещащая по швам от количества торгашей, паломников, наемников и преступников всех мастей. В сравнении с Портом Странник Футфол — безжизненный камень в пустоте".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Порт Странник, Каликсис. Это врата в Коронус и монументальная станция, вечно облепленная кораблями и трещащая по швам от количества торгашей, паломников, наемников и преступников всех мастей. В сравнении с Портом Странник Футфол — безжизненный камень в пустоте.
- guid: 59690bfb-d142-4261-8bfa-f9728ec79291
  event: CompanionDialogue_Solomorne_05
  text: '"Как?" {n}Соломон эхом повторяет ваши слова, и на его губы ложится подобие мрачной усмешки.{/n} "Если коротко — Схола Прогениум. Но такой ответ вряд ли вас устроит. Мой отец был Арбитес, и весьма хорошим. Иначе бы его не нашли в переулке, изрешеченного пулями. Сослуживец отца сказал, что его убили из десяти разных оружий, и что минимум четверых ублюдков он успел забрать с собой".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Как?
  - speaker: narrator
    text_clean: Соломон эхом повторяет ваши слова, и на его губы ложится подобие мрачной усмешки.
  - speaker: Соломон Антар
    text_clean: Если коротко — Схола Прогениум. Но такой ответ вряд ли вас устроит. Мой отец был Арбитес, и весьма хорошим. Иначе бы его не нашли в переулке, изрешеченного пулями. Сослуживец отца сказал, что его убили из десяти разных оружий, и что минимум четверых ублюдков он успел забрать с собой.
- guid: b833bd38-296c-4be5-9a83-0bdcddf7daba
  event: CompanionDialogue_Solomorne_06
  text: '"Меня почти сразу забрали в Схола Прогениум, там наставники выковали из меня арбитра. Я учился со всем рвением, потому что отец служил мне примером несгибаемого долга и достоинства. Единственное, в чем я не равнялся на него, была ненависть — он не прививал ее мне, она просто всегда была со мной". {n}В бесстрастном взгляде нет ни капли эмоций.{/n} "Я никогда не сомневался, что преступное отребье заслуживает лишь плахи. Убийство отца сделало мою ненависть кристально ясной, завершенной".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Меня почти сразу забрали в Схола Прогениум, там наставники выковали из меня арбитра. Я учился со всем рвением, потому что отец служил мне примером несгибаемого долга и достоинства. Единственное, в чем я не равнялся на него, была ненависть — он не прививал ее мне, она просто всегда была со мной.
  - speaker: narrator
    text_clean: В бесстрастном взгляде нет ни капли эмоций.
  - speaker: Соломон Антар
    text_clean: Я никогда не сомневался, что преступное отребье заслуживает лишь плахи. Убийство отца сделало мою ненависть кристально ясной, завершенной.
- guid: 8a8887df-b4f6-4d82-b9cb-bb8907d050fd
  event: CompanionDialogue_Solomorne_07
  text: '"Этот вопрос лучше задать маршалу — я получил назначение, и это все, что мне известно. Но подозреваю, что дело в моем опыте: сбор десятины с полудиких миров, где живого Арбитес видели три поколения назад, разумно поручить ветерану".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Этот вопрос лучше задать маршалу — я получил назначение, и это все, что мне известно. Но подозреваю, что дело в моем опыте: сбор десятины с полудиких миров, где живого Арбитес видели три поколения назад, разумно поручить ветерану.'
- guid: 140b4a8e-8fe3-4572-9970-6b658b02c46d
  event: CompanionDialogue_Solomorne_08
  text: '{n}Соломон качает головой.{/n} "Он сделал, что мог, но вытащить из Глейто неизвестную друкарскую дрянь в полевых условиях не выйдет. Надо дотянуть до возвращения на флагман, иначе никак. Не знаю, выберемся ли мы, но на всякий случай я должен..."'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон качает головой.
  - speaker: Соломон Антар
    text_clean: Он сделал, что мог, но вытащить из Глейто неизвестную друкарскую дрянь в полевых условиях не выйдет. Надо дотянуть до возвращения на флагман, иначе никак. Не знаю, выберемся ли мы, но на всякий случай я должен...
- guid: faea44e8-be0e-4465-bc13-0fa1ae3bbd30
  event: CompanionDialogue_Solomorne_09
  text: '"Это точно не ссылка. Иначе бы ваше суждение можно было распространить на маршала и других арбитров в Просторе Коронус. Мы здесь потому, что Империуму нужна десятина, ни больше ни меньше".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это точно не ссылка. Иначе бы ваше суждение можно было распространить на маршала и других арбитров в Просторе Коронус. Мы здесь потому, что Империуму нужна десятина, ни больше ни меньше.
- guid: 37e67cfa-0f41-4f63-8a80-2c30139415d2
  event: CompanionDialogue_Solomorne_10
  text: '"Вряд ли. Такова суть служебной собаки. Но будьте уверены — вы у Глейто на особом счету, раз он больше не точит об вашу руку клыки".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вряд ли. Такова суть служебной собаки. Но будьте уверены — вы у Глейто на особом счету, раз он больше не точит об вашу руку клыки.
- guid: 5d8523cc-24ef-4f92-a986-329851e077a8
  event: CompanionDialogue_Solomorne_100
  text: '"Кроме безупречного служения? Есть кое-что, о чем я много думал... О том, что Кредо уступает Лекс Империалис в близости к Богу-Императору. Я хочу, чтобы Его закон стал единственным столпом веры для арбитров. Хочу вести их не только как маршал, но и как проповедник".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Кроме безупречного служения? Есть кое-что, о чем я много думал... О том, что Кредо уступает Лекс Империалис в близости к Богу-Императору. Я хочу, чтобы Его закон стал единственным столпом веры для арбитров. Хочу вести их не только как маршал, но и как проповедник.
- guid: 2ee3c574-70c9-468f-8277-e0c82bff4a20
  event: CompanionDialogue_Solomorne_101
  text: '"Низложение маршала станет испытанием для духа Арбитес, но я верю, они справятся. Нас учили исполнять долг несмотря ни на что, и даже пока не избран новый глава, нас будет вести Лекс Империалис".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Низложение маршала станет испытанием для духа Арбитес, но я верю, они справятся. Нас учили исполнять долг несмотря ни на что, и даже пока не избран новый глава, нас будет вести Лекс Империалис.
- guid: f262a05b-9992-4001-b2f3-e60c8e785483
  event: CompanionDialogue_Solomorne_102
  text: '"И в любом случае Арбитес больше никогда не станут вмешиваться в дела фон Валанциус". {n}Взгляд Соломона темнеет.{/n} "Другие династии отметят это, и почти наверняка откажутся подчиняться Адептус Арбитес. Нас ждут тяжелые времена".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: И в любом случае Арбитес больше никогда не станут вмешиваться в дела фон Валанциус.
  - speaker: narrator
    text_clean: Взгляд Соломона темнеет.
  - speaker: Соломон Антар
    text_clean: Другие династии отметят это, и почти наверняка откажутся подчиняться Адептус Арбитес. Нас ждут тяжелые времена.
- guid: 4c2ee0dd-8758-4992-8051-7a86efe283d5
  event: CompanionDialogue_Solomorne_103
  text: '"Грегорас Стракс был выдающимся слугой Лекс Империалис, и я все еще не могу понять, почему он не распознал в Вультур врага".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Грегорас Стракс был выдающимся слугой Лекс Империалис, и я все еще не могу понять, почему он не распознал в Вультур врага.
- guid: 19ccb58e-3c9d-401f-9990-55b8985fe4a4
  event: CompanionDialogue_Solomorne_104
  text: '"Я склоняюсь к тому, что Стракс отдалился от Лекс Империалис. В букве закона Его все ответы и все решения, но Стракс стал нетверд в суждениях и начал внимать советам Вультур. Ослабление веры сделало его слепым и привело к закономерному и полному позора концу".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я склоняюсь к тому, что Стракс отдалился от Лекс Империалис. В букве закона Его все ответы и все решения, но Стракс стал нетверд в суждениях и начал внимать советам Вультур. Ослабление веры сделало его слепым и привело к закономерному и полному позора концу.
- guid: 9a5382e7-b3b7-4079-8482-4a5c959ad081
  event: CompanionDialogue_Solomorne_105
  text: '"Думаю, Грегорас в конце концов оказался просто человеком. Он был заперт в Просторе, ему приходилось охранять всю десятину сектора — он нуждался в ком-то, чья мудрость облегчила бы его бремя".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Думаю, Грегорас в конце концов оказался просто человеком. Он был заперт в Просторе, ему приходилось охранять всю десятину сектора — он нуждался в ком-то, чья мудрость облегчила бы его бремя.
- guid: 5f4f0b4c-d02a-4fec-88f2-1567f858e224
  event: CompanionDialogue_Solomorne_106
  text: '"В его преступлении мне видится проблема серьезнее. Наставники в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g}, не распознавшие в нем слабость, и даже сам Лорд-маршал Гореман, доверивший Страксу высокий ранг, — на них всех может лежать часть вины. Я больше не склонюсь перед старшими чинами Арбитес — каждый из них может оказаться недостойным".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: В его преступлении мне видится проблема серьезнее. Наставники в Схола Прогениум, не распознавшие в нем слабость, и даже сам Лорд-маршал Гореман, доверивший Страксу высокий ранг, — на них всех может лежать часть вины. Я больше не склонюсь перед старшими чинами Арбитес — каждый из них может оказаться недостойным.
- guid: eb253e7b-f841-4eee-8561-7f971ffa8f0c
  event: CompanionDialogue_Solomorne_107
  text: '"Потребуются крепкие снаряды и мишени — Глейто неудержим, когда действует в полную силу". {n}Соломон приподнимает уголки губ.{/n} "Благодарю".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Потребуются крепкие снаряды и мишени — Глейто неудержим, когда действует в полную силу.
  - speaker: narrator
    text_clean: Соломон приподнимает уголки губ.
  - speaker: Соломон Антар
    text_clean: Благодарю.
- guid: 71c122c0-9a2b-4abd-9a6a-c69057ebed07
  event: CompanionDialogue_Solomorne_108
  text: '"Я благодарен вам за то, что вы сохранили Грегорасу жизнь. Он бы предпочел казнь, но, как и все арбитры, он с полной ответственностью примет назначенное наказание. Я буду навещать своего бывшего командира — не хочу, чтобы он оставался наедине со своей виной".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я благодарен вам за то, что вы сохранили Грегорасу жизнь. Он бы предпочел казнь, но, как и все арбитры, он с полной ответственностью примет назначенное наказание. Я буду навещать своего бывшего командира — не хочу, чтобы он оставался наедине со своей виной.
- guid: d94ac78e-8ef4-4beb-a961-0d3539b7f5f1
  event: CompanionDialogue_Solomorne_109
  text: '"Согласен. Поговорим о другом?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Согласен. Поговорим о другом?
- guid: 1917c18f-2e30-4e1a-9f23-a86d8a5d2878
  event: CompanionDialogue_Solomorne_11
  text: '"Так и есть. Кодексы Лекс Империалис — моя молитва, и я верю, что служение каждого арбитра священно, поскольку приближает несовершенную реальность к тому, что высечено в Книге суда. К воле Бога-Императора".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Так и есть. Кодексы Лекс Империалис — моя молитва, и я верю, что служение каждого арбитра священно, поскольку приближает несовершенную реальность к тому, что высечено в Книге суда. К воле Бога-Императора.
- guid: 266f7dd9-b886-40d2-9f5c-143858552864
  event: CompanionDialogue_Solomorne_110
  text: '{n}Мрачно и торжественно Соломон поднимает железную ладонь.{/n} "Я клянусь, что больше никогда не подниму против вас оружия. А если наши взгляды на Лекс Империалис вновь разойдутся, я приду и сообщу об этом, чтобы вы немедленно решили мою судьбу".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Мрачно и торжественно Соломон поднимает железную ладонь.
  - speaker: Соломон Антар
    text_clean: Я клянусь, что больше никогда не подниму против вас оружия. А если наши взгляды на Лекс Империалис вновь разойдутся, я приду и сообщу об этом, чтобы вы немедленно решили мою судьбу.
- guid: b7aa03f3-dda6-4e17-9d9f-0ec8e2847741
  event: CompanionDialogue_Solomorne_111
  text: '"Арбитес в Просторе требуется реорганизация. Последние события показали, что мы не можем служить Лекс Империалис, как прежде — я использую опыт путешествий с вами, чтобы лилось меньше крови, как судей, так и обвиняемых. Та еще задача, ведь арбитры не знают, что такое искупление и милосердие".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Арбитес в Просторе требуется реорганизация. Последние события показали, что мы не можем служить Лекс Империалис, как прежде — я использую опыт путешествий с вами, чтобы лилось меньше крови, как судей, так и обвиняемых. Та еще задача, ведь арбитры не знают, что такое искупление и милосердие.
- guid: 7a6b59c1-6537-4036-9cde-7d09262162f3
  event: CompanionDialogue_Solomorne_112
  text: '{n}Соломон складывает руки на груди и возводит глаза к люменам на сводах.{/n} "Я, разрази меня Лекс, даже не знаю, с чего начать. Стракс оставил мне руины, и Арбитес придется компенсировать его позор и свою малую численность служением яростным и внушающим благоговейный ужас. Я перекую арбитров в новую элиту и начну писать Лекс Коронус — кровью тех, кто хоть в чем-то дерзнет не покориться нам".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон складывает руки на груди и возводит глаза к люменам на сводах.
  - speaker: Соломон Антар
    text_clean: Я, разрази меня Лекс, даже не знаю, с чего начать. Стракс оставил мне руины, и Арбитес придется компенсировать его позор и свою малую численность служением яростным и внушающим благоговейный ужас. Я перекую арбитров в новую элиту и начну писать Лекс Коронус — кровью тех, кто хоть в чем-то дерзнет не покориться нам.
- guid: 189d02c9-1294-4c53-8969-62eed1ab80cf
  event: CompanionDialogue_Solomorne_113
  text: '"Я решил, что не стоит лишний раз подвергать его операции: протокол, требовавший от него вести наблюдение, все равно остановлен. Может, однажды нам понадобится эта функция, но пока она деактивирована — и в бездну ее".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Я решил, что не стоит лишний раз подвергать его операции: протокол, требовавший от него вести наблюдение, все равно остановлен. Может, однажды нам понадобится эта функция, но пока она деактивирована — и в бездну ее.'
- guid: 2fd7c3a1-63ac-491d-88d2-03cdb082d221
  event: CompanionDialogue_Solomorne_114
  text: '"Как и {d|Encyclopedia:CharGen_Arbitrator}любой арбитр{/d}, я знаю Инъюнкта Кардинал до последней запятой. Не было и дня, чтобы я не повторял священные положения от и до — они высечены в моей памяти так же четко, как на стенах крепостей Арбитес и на гильзах наших патронов. Я скорее свое имя забуду, чем хоть слово из Инъюнкта Кардинал".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Как и любой арбитр, я знаю Инъюнкта Кардинал до последней запятой. Не было и дня, чтобы я не повторял священные положения от и до — они высечены в моей памяти так же четко, как на стенах крепостей Арбитес и на гильзах наших патронов. Я скорее свое имя забуду, чем хоть слово из Инъюнкта Кардинал.
- guid: da605858-9491-4f83-91f2-e7f6fb87e83b
  event: CompanionDialogue_Solomorne_115
  text: '"{d|Encyclopedia:CharGen_Arbitrator}Вы сами прекрасно знаете{/d}, что такая команда бессмысленна, поскольку ставит кибермастифа в позицию, из которой сложнее атаковать врага. Или вы проверяете его аугменты? Что ж, как и положено, Глейто не реагирует на команду постороннего человека".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы сами прекрасно знаете, что такая команда бессмысленна, поскольку ставит кибермастифа в позицию, из которой сложнее атаковать врага. Или вы проверяете его аугменты? Что ж, как и положено, Глейто не реагирует на команду постороннего человека.
- guid: 6309eafc-f099-4246-acf9-28317099610b
  event: CompanionDialogue_Solomorne_116
  text: '"Я... верно вас услышал? Вы хотите порвать наши отношения?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я... верно вас услышал? Вы хотите порвать наши отношения?
- guid: 48002466-78ef-48d6-b75c-3dcbfe2c940c
  event: CompanionDialogue_Solomorne_117
  text: '"Что ж, вы выразились предельно ясно. Вернемся к исключительно служебным отношениям".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Что ж, вы выразились предельно ясно. Вернемся к исключительно служебным отношениям.
- guid: c0ed543d-8908-4ee1-b826-28c7ed629466
  event: CompanionDialogue_Solomorne_118
  text: '"Нет". {n}Голос Соломона обретает резкость.{/n} "Потому что никаких отношений никогда и не было".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Нет.
  - speaker: narrator
    text_clean: Голос Соломона обретает резкость.
  - speaker: Соломон Антар
    text_clean: Потому что никаких отношений никогда и не было.
- guid: f2d36a88-c118-42ea-bfb3-4ed9e102ec4e
  event: CompanionDialogue_Solomorne_119
  text: '"Предательство в рядах арбитров надо было расследовать быстро и безжалостно — как раз задача для особого отряда по захвату преступников. Соратники вызволили меня из плена, и теперь уже я слушал вопли своих мучителей".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Предательство в рядах арбитров надо было расследовать быстро и безжалостно — как раз задача для особого отряда по захвату преступников. Соратники вызволили меня из плена, и теперь уже я слушал вопли своих мучителей.
- guid: 8d36008a-a868-4965-8804-037cacba9873
  event: CompanionDialogue_Solomorne_12
  text: '{n}Соломон немедленно ставит руку между вами и мордой пса.{/n} "Любую ответственность за действия кибермастифа несет хозяин. Наказывайте меня — и только меня".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон немедленно ставит руку между вами и мордой пса.
  - speaker: Соломон Антар
    text_clean: Любую ответственность за действия кибермастифа несет хозяин. Наказывайте меня — и только меня.
- guid: 97297f38-10d5-4ba5-b2ed-c39105958cde
  event: CompanionDialogue_Solomorne_120
  text: '"Вольный Торговец. Перейду сразу к делу — мне известно, что у вас {d|Encyclopedia:MiniJealousyRomanceBroken}сменился любовный интерес{/d}". {n}Лицо Соломона непроницаемо, как стена из керамита.{/n} "Раз вы все решили, то вернемся к исключительно профессиональным отношениям, как и должно было быть с самого начала".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вольный Торговец. Перейду сразу к делу — мне известно, что у вас сменился любовный интерес.
  - speaker: narrator
    text_clean: Лицо Соломона непроницаемо, как стена из керамита.
  - speaker: Соломон Антар
    text_clean: Раз вы все решили, то вернемся к исключительно профессиональным отношениям, как и должно было быть с самого начала.
- guid: dae32408-bba2-4b24-9257-af146ddf6a9a
  event: CompanionDialogue_Solomorne_121
  text: '{n}Соломон морщится.{/n} "Глейто, разве ты не мог уважить Вольного Торговца менее глубоким укусом? Не вините его, это был стандартный предупредительный захват, тем более весьма чистый — понадобится всего десяток швов".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон морщится.
  - speaker: Соломон Антар
    text_clean: Глейто, разве ты не мог уважить Вольного Торговца менее глубоким укусом? Не вините его, это был стандартный предупредительный захват, тем более весьма чистый — понадобится всего десяток швов.
- guid: 88bd4e46-6720-4cdc-b710-b0285d365b10
  event: CompanionDialogue_Solomorne_122
  text: '{n}Соломон стоит, заложив большие пальцы за ремень, по-хозяйски осматривая мостик. При вашем приближении он непринужденно кивает.{/n} "Приветствую, Вольный Торговец. Докладываю: провел первичную инспекцию верхних палуб с Глейто — список нарушений оказался на пять страниц короче ожидаемого. Начинаю опасаться, что служителю {g|Encyclopedia:LexImperialisGlossary}Лекса{/g} будет нечем заняться на вашем судне".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон стоит, заложив большие пальцы за ремень, по-хозяйски осматривая мостик. При вашем приближении он непринужденно кивает.
  - speaker: Соломон Антар
    text_clean: 'Приветствую, Вольный Торговец. Докладываю: провел первичную инспекцию верхних палуб с Глейто — список нарушений оказался на пять страниц короче ожидаемого. Начинаю опасаться, что служителю Лекса будет нечем заняться на вашем судне.'
- guid: f449c74d-796d-4a1b-90e1-2f86eef8bceb
  event: CompanionDialogue_Solomorne_123
  text: '"То, что вы желаете во мне видеть — это изъян. Слабость, что сделала бы меня понятнее и проще. Но поверьте — вам не нужен такой человек в свите, как и Империум не нуждается в подобных слугах".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: То, что вы желаете во мне видеть — это изъян. Слабость, что сделала бы меня понятнее и проще. Но поверьте — вам не нужен такой человек в свите, как и Империум не нуждается в подобных слугах.
- guid: 81907a2a-e9cc-4874-b29c-1f6afcf270c1
  event: CompanionDialogue_Solomorne_124
  text: '"Верно. На вашем столичном мире действует Лекс Даргонус, написанный поколениями фон Валанциус. Но Лекс Империалис — последняя инстанция любых судебных споров. Он выше юридических установок любой планеты, поскольку исходит от самого Императора".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Верно. На вашем столичном мире действует Лекс Даргонус, написанный поколениями фон Валанциус. Но Лекс Империалис — последняя инстанция любых судебных споров. Он выше юридических установок любой планеты, поскольку исходит от самого Императора.
- guid: 5d82acf2-5f82-487a-a82d-399dc83d88de
  event: CompanionDialogue_Solomorne_125
  text: '"Жизни человека не хватит не то чтобы запомнить — чтобы прочесть хотя бы часть закона Его. Но есть фундаментальные и неотъемлимые положения, известные каждому арбитру — это Инъюнкта Кардинал. Они высечены на стенах крепостей Арбитес и выгравированы на гильзах наших патронов. Мы цитируем их как непреложную истину и декламируем подобно боевым псалмам во время сражений".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Жизни человека не хватит не то чтобы запомнить — чтобы прочесть хотя бы часть закона Его. Но есть фундаментальные и неотъемлимые положения, известные каждому арбитру — это Инъюнкта Кардинал. Они высечены на стенах крепостей Арбитес и выгравированы на гильзах наших патронов. Мы цитируем их как непреложную истину и декламируем подобно боевым псалмам во время сражений.
- guid: bef47458-9c66-4f6b-9734-3c62ab2d32cc
  event: CompanionDialogue_Solomorne_126
  text: '"Это бесполезная команда, Вольный Торговец, потому что кибермастиф всегда должен находиться в позиции, из которой эффективнее всего атаковать врага. Глейто может ползти или двигаться скрытно, если требует ситуация, но в любом случае он не отреагирует на приказ постороннего человека".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это бесполезная команда, Вольный Торговец, потому что кибермастиф всегда должен находиться в позиции, из которой эффективнее всего атаковать врага. Глейто может ползти или двигаться скрытно, если требует ситуация, но в любом случае он не отреагирует на приказ постороннего человека.
- guid: 185194f9-6313-449b-9f89-132742ad3eba
  event: CompanionDialogue_Solomorne_127
  text: '"Это требование нарушить не протокол взаимодействия с кибермастифом, но принципы Адептус Арбитес. Согласно им Глейто — оружие, а арбитры не используют вооружение для увеселения знатных особ".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это требование нарушить не протокол взаимодействия с кибермастифом, но принципы Адептус Арбитес. Согласно им Глейто — оружие, а арбитры не используют вооружение для увеселения знатных особ.
- guid: 47b5d566-b879-4a08-8db1-e2523174407b
  event: CompanionDialogue_Solomorne_128
  text: '"Если бы мне давали трон каждый раз, когда я отвечаю отказом на мольбу, я бы мог купить ваш флагман". {n}Соломон потирает переносицу.{/n} "Ради вашей же сохранности — оставьте эту идею".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Если бы мне давали трон каждый раз, когда я отвечаю отказом на мольбу, я бы мог купить ваш флагман.
  - speaker: narrator
    text_clean: Соломон потирает переносицу.
  - speaker: Соломон Антар
    text_clean: Ради вашей же сохранности — оставьте эту идею.
- guid: af6f445d-14d8-4e55-8c9e-5bdd13033239
  event: CompanionDialogue_Solomorne_129
  text: '"Слышал, Глейто? Не часто тебя хвалят Вольные Торговцы. Голос!" {n}Кибермастиф издает громоподобный лай.{/n} "Будем считать, что Глейто выразил свое почтение и извинился".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Слышал, Глейто? Не часто тебя хвалят Вольные Торговцы. Голос!
  - speaker: narrator
    text_clean: Кибермастиф издает громоподобный лай.
  - speaker: Соломон Антар
    text_clean: Будем считать, что Глейто выразил свое почтение и извинился.
- guid: d469d292-ce35-4504-818f-826247cc1545
  event: CompanionDialogue_Solomorne_13
  text: '"Напоминаю: Глейто — живое оружие. Если количество пальцев вас устраивает — не трогайте пса".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Напоминаю: Глейто — живое оружие. Если количество пальцев вас устраивает — не трогайте пса.'
- guid: f2cab70b-5fd2-4df6-bb37-03443d376bd7
  event: CompanionDialogue_Solomorne_130
  text: '"Я могу только попросить вас больше не предпринимать попыток взамодействовать с Глейто... подобным образом".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я могу только попросить вас больше не предпринимать попыток взамодействовать с Глейто... подобным образом.
- guid: 2733e876-000c-4e92-97e5-7acc3e35cde9
  event: CompanionDialogue_Solomorne_131
  text: '"Мы — служители закона Бога-Императора, воплощенного в {g|Encyclopedia:LexImperialisGlossary}Лекс Империалис{/g}. Адептус Арбитес следят за соблюдением порядка в масштабах Империума и несут беспощадную кару нарушителям".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Мы — служители закона Бога-Императора, воплощенного в Лекс Империалис. Адептус Арбитес следят за соблюдением порядка в масштабах Империума и несут беспощадную кару нарушителям.
- guid: 0128772f-9b4e-4166-b999-15903bfb02ed
  event: CompanionDialogue_Solomorne_132
  text: '"На Даргонусе. Леди Теодора выделила для Адептус Арбитес верхний уровень в одном из шпилей — раньше его занимал благородный дом, вздумавший запустить руку в богатства вашей династии... Расквартировав нас в таком видном месте, ваша предшественница не только закрепила союз с Арбитес, но еще сделала красноречивый жест в сторону дворян. Умная была женщина, и суровая".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: На Даргонусе. Леди Теодора выделила для Адептус Арбитес верхний уровень в одном из шпилей — раньше его занимал благородный дом, вздумавший запустить руку в богатства вашей династии... Расквартировав нас в таком видном месте, ваша предшественница не только закрепила союз с Арбитес, но еще сделала красноречивый жест в сторону дворян. Умная была женщина, и суровая.
- guid: f12ffbae-2a5d-4eb4-a23a-36417a95adac
  event: CompanionDialogue_Solomorne_133
  text: '"Не пройду, если невиновность будет доказана предварительным расследованием, например. В остальных случаях убийство — это заурядное нарушение порядка. Моего вмешательства потребует разве что нападение на функционера {g|Encyclopedia:AdeptusAdministratumGlossary}Администратума{/g} или на другое важное лицо. Тогда я обязан принять меры".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не пройду, если невиновность будет доказана предварительным расследованием, например. В остальных случаях убийство — это заурядное нарушение порядка. Моего вмешательства потребует разве что нападение на функционера Администратума или на другое важное лицо. Тогда я обязан принять меры.
- guid: 1275428a-ae57-4899-96bb-82eb2699acaa
  event: CompanionDialogue_Solomorne_134
  text: '"Но если я выполняю миссию, то проигнорирую любой отвлекающий фактор. Потому что задачи Арбитес стоят выше банальных преступлений — мы собираем десятину, что питает военную мощь Империума и обеспечивает его власть на мирах. Размениваться на мелочи значит преступно пренебрегать временем и ресурсами, которые нам даны для служения абсолюту закона".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Но если я выполняю миссию, то проигнорирую любой отвлекающий фактор. Потому что задачи Арбитес стоят выше банальных преступлений — мы собираем десятину, что питает военную мощь Империума и обеспечивает его власть на мирах. Размениваться на мелочи значит преступно пренебрегать временем и ресурсами, которые нам даны для служения абсолюту закона.
- guid: ad8fa94f-f0f6-4560-8119-d17818c87052
  event: CompanionDialogue_Solomorne_135
  text: '"Они, без сомнений, угроза Империуму номер один, и я не оставлю без пули еретика, попадись он мне. Однако подобными делами занимаются другие имперские силы — достаточно серьезные, чтобы не упоминать их вслух лишний раз".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Они, без сомнений, угроза Империуму номер один, и я не оставлю без пули еретика, попадись он мне. Однако подобными делами занимаются другие имперские силы — достаточно серьезные, чтобы не упоминать их вслух лишний раз.
- guid: 7a7a823e-a9c9-4ca6-b57a-91af8593b7e8
  event: CompanionDialogue_Solomorne_136
  text: '"Я в вашем распоряжении".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я в вашем распоряжении.
- guid: 637acb8b-09a5-4ce0-9af6-1588c1ea03d5
  event: CompanionDialogue_Solomorne_137
  text: '"Невозможно — вы меня раскусили". {n}Соломон поднимает бровь.{/n} "Я действительно на одну сотую процента менее равнодушен, чем выгляжу".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Невозможно — вы меня раскусили.
  - speaker: narrator
    text_clean: Соломон поднимает бровь.
  - speaker: Соломон Антар
    text_clean: Я действительно на одну сотую процента менее равнодушен, чем выгляжу.
- guid: 50658e3c-4155-4487-b136-7a56e39352fc
  event: CompanionDialogue_Solomorne_138
  text: '"Однажды я участвовал в рейде на банду мутантов — отличился в бою, был награжден и повышен до проктора". {n}Соломон выдерживает паузу.{/n} "Это все".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Однажды я участвовал в рейде на банду мутантов — отличился в бою, был награжден и повышен до проктора.
  - speaker: narrator
    text_clean: Соломон выдерживает паузу.
  - speaker: Соломон Антар
    text_clean: Это все.
- guid: df6149da-da64-44b2-94a2-a5d81ee4b466
  event: CompanionDialogue_Solomorne_139
  text: '"Тот рейд был скомпрометирован: врага предупредили об операции. Мы оказались в западне. Какой-то мутант решил отгрызть мне руку — это была ошибка. Освободиться я не мог, пришлось протолкнуть предплечье в осклизлое горло, ухватиться за рыхлое нутро и прикрыться выродком, как щитом. Пока тварь хрустела моими костями, и окатывала меня ихором и моей собственной кровью, я поливал огнем других мутантов. Вот такой небольшой маневр, который выиграл моему отряду несколько решающих секунд".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Тот рейд был скомпрометирован: врага предупредили об операции. Мы оказались в западне. Какой-то мутант решил отгрызть мне руку — это была ошибка. Освободиться я не мог, пришлось протолкнуть предплечье в осклизлое горло, ухватиться за рыхлое нутро и прикрыться выродком, как щитом. Пока тварь хрустела моими костями, и окатывала меня ихором и моей собственной кровью, я поливал огнем других мутантов. Вот такой небольшой маневр, который выиграл моему отряду несколько решающих секунд.'
- guid: ae5e092c-f3a3-4317-8117-366367f6b310
  event: CompanionDialogue_Solomorne_14
  text: '{n}Арбитес невозмутимо отстегивает часть доспеха, обнажая предплечье.{/n} "Глейто, цель — ДК-1, предупредительная атака". {n}Кибермастиф немедленно впивается в руку хозяина, бешено мотая мордой, и окатывая вас брызгами горячей крови.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитес невозмутимо отстегивает часть доспеха, обнажая предплечье.
  - speaker: Соломон Антар
    text_clean: Глейто, цель — ДК-1, предупредительная атака.
  - speaker: narrator
    text_clean: Кибермастиф немедленно впивается в руку хозяина, бешено мотая мордой, и окатывая вас брызгами горячей крови.
- guid: c1790af6-aba7-4550-8848-b236732979a6
  event: CompanionDialogue_Solomorne_140
  text: '"Сбор и охрана десятины. Но мы не закрываем глаза на прочие нарушения Лекс Империалис и действуем, насколько нам позволяют ограниченные ресурсы. Главным образом — малая численность. Здесь, в Коронусе, многие считают, что находятся слишком далеко от цивилизованной части Империума, чтобы соблюдать закон. Присутствие Адептус Арбитес помогает этим людям вспомнить, что Лекс Империалис действует везде, где есть хотя бы один человек".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Сбор и охрана десятины. Но мы не закрываем глаза на прочие нарушения Лекс Империалис и действуем, насколько нам позволяют ограниченные ресурсы. Главным образом — малая численность. Здесь, в Коронусе, многие считают, что находятся слишком далеко от цивилизованной части Империума, чтобы соблюдать закон. Присутствие Адептус Арбитес помогает этим людям вспомнить, что Лекс Империалис действует везде, где есть хотя бы один человек.
- guid: 40c68dd8-5cf9-41e1-9dbf-33df6c0b0d9b
  event: CompanionDialogue_Solomorne_141
  text: '"Охотно верю. Трон Вольного Торговца не терпит слабаков и идиотов".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Охотно верю. Трон Вольного Торговца не терпит слабаков и идиотов.
- guid: dd5f0bf4-fc48-477b-96de-7446b1353dae
  event: CompanionDialogue_Solomorne_142
  text: '"Едва ли такое слово применимо к арбитру, но доля истины в вашем замечании есть. Раз мы не в бою, я позволяю себе команду "вольно". Однако я по-прежнему бдителен и в полной боевой готовности".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Едва ли такое слово применимо к арбитру, но доля истины в вашем замечании есть. Раз мы не в бою, я позволяю себе команду "вольно". Однако я по-прежнему бдителен и в полной боевой готовности.
- guid: a381610b-4e84-47bb-a439-7bab59a71f91
  event: CompanionDialogue_Solomorne_143
  text: '"Едва ли дело в везении: вы заключили союз с Арбитес, как и ваша предшественница. То, что я здесь — закономерный результат ваших решений".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Едва ли дело в везении: вы заключили союз с Арбитес, как и ваша предшественница. То, что я здесь — закономерный результат ваших решений.'
- guid: b6c1d3f8-70e1-4131-a84d-734613e9e16b
  event: CompanionDialogue_Solomorne_144
  text: '"Надеялся, что такой ответ отобьет у вас интерес. Я не могу ответить иначе как честно и исчерпывающе, а история та еще — про потерю конечностей и мерзких отродий. Вольному Торговцу такое может и не понравиться".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Надеялся, что такой ответ отобьет у вас интерес. Я не могу ответить иначе как честно и исчерпывающе, а история та еще — про потерю конечностей и мерзких отродий. Вольному Торговцу такое может и не понравиться.
- guid: f72b5ba8-2dea-48e8-b63d-ab75a1ce7470
  event: CompanionDialogue_Solomorne_145
  text: '"Ладно". {n}Арбитр поднимает перед собой железную ладонь и медленно сжимает пальцы в кулак.{/n} "Вас когда-нибудь ели заживо? Меня — да".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Ладно.
  - speaker: narrator
    text_clean: Арбитр поднимает перед собой железную ладонь и медленно сжимает пальцы в кулак.
  - speaker: Соломон Антар
    text_clean: Вас когда-нибудь ели заживо? Меня — да.
- guid: 5f02874b-6b92-4108-bf6b-be9e72327ceb
  event: CompanionDialogue_Solomorne_146
  text: '"Вы знаете, где найти меня, Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы знаете, где найти меня, Вольный Торговец.
- guid: 4fe7b046-133a-4f86-b31c-789aa01b6d96
  event: CompanionDialogue_Solomorne_147
  text: '{n}Проктор отвечает вам прямым, бесстрастным взглядом.{/n} "Предположение, что я мог предотвратить исчезновение светила, звучит почти лестно. Однако я никогда не уклоняюсь от ответственности: пусть Император в час последнего суда определит мою степень вины в произошедшем".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Проктор отвечает вам прямым, бесстрастным взглядом.
  - speaker: Соломон Антар
    text_clean: 'Предположение, что я мог предотвратить исчезновение светила, звучит почти лестно. Однако я никогда не уклоняюсь от ответственности: пусть Император в час последнего суда определит мою степень вины в произошедшем.'
- guid: 72d335c1-1179-45fb-93da-d1e37d99a515
  event: CompanionDialogue_Solomorne_148
  text: '"Хотите повторить подвиг? Не могу поручиться, что Глейто и в этот раз будет сидеть смирно".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хотите повторить подвиг? Не могу поручиться, что Глейто и в этот раз будет сидеть смирно.
- guid: 72521f77-fe3a-48ad-81a6-ca9c29b25667
  event: CompanionDialogue_Solomorne_149
  text: '"Признаться, он меня приятно удивил. Я ожидал чего-то менее цивилизованного, учитывая, что Простор Коронус — это окраина Империума. Но Даргонус мог бы потягаться в статусе и стабильности с некоторыми мирами Каликсиса".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Признаться, он меня приятно удивил. Я ожидал чего-то менее цивилизованного, учитывая, что Простор Коронус — это окраина Империума. Но Даргонус мог бы потягаться в статусе и стабильности с некоторыми мирами Каликсиса.
- guid: 41a2be4b-53b7-4541-b8d1-63d7b0db71ae
  event: CompanionDialogue_Solomorne_15
  text: '{n}Приладив броню на изорванную в мясо руку, Соломон сквозь зубы произносит:{/n} "Если на этом все, мне нужно в медотсек. После вас, разумеется".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Приладив броню на изорванную в мясо руку, Соломон сквозь зубы произносит:'
  - speaker: Соломон Антар
    text_clean: Если на этом все, мне нужно в медотсек. После вас, разумеется.
- guid: 7524f421-cb69-4a42-8a9e-96c6f0e1a65b
  event: CompanionDialogue_Solomorne_150
  text: '{n}Соломон склонился над Глейто, его пальцы ощупывают каждый шов на теле кибермастифа.{/n} "Уплотнения здесь и здесь... А тут что еще такое?" {n}Железный кулак обрушивается в пол, оставляя вмятину.{/n} "Ублюдочные отродья, распотрошить моего пса! Я... Гхм, Вольный Торговец? Вы… давно тут стоите?"'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон склонился над Глейто, его пальцы ощупывают каждый шов на теле кибермастифа.
  - speaker: Соломон Антар
    text_clean: Уплотнения здесь и здесь... А тут что еще такое?
  - speaker: narrator
    text_clean: Железный кулак обрушивается в пол, оставляя вмятину.
  - speaker: Соломон Антар
    text_clean: Ублюдочные отродья, распотрошить моего пса! Я... Гхм, Вольный Торговец? Вы… давно тут стоите?
- guid: 51e6bce6-6375-4d84-a49b-a8e6d724b09c
  event: CompanionDialogue_Solomorne_151
  text: '"Я так часто себе это повторяю, что перестал понимать смысл слов. Кстати, о словах..."'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я так часто себе это повторяю, что перестал понимать смысл слов. Кстати, о словах...
- guid: 6f946ce2-bfa4-4c95-9c15-232ae7648f42
  event: CompanionDialogue_Solomorne_152
  text: '"Начинаю думать, что вам нравится боль".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Начинаю думать, что вам нравится боль.
- guid: 1fe15b06-cdcc-4e90-9365-6ddc969d79d2
  event: CompanionDialogue_Solomorne_153
  text: '"Мне тоже. Привычнее, когда есть приказ и план, а мои собеседники — цели, требующие устранения. Но иногда приходится терпеть вот такие периоды затишья".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Мне тоже. Привычнее, когда есть приказ и план, а мои собеседники — цели, требующие устранения. Но иногда приходится терпеть вот такие периоды затишья.
- guid: 8f3c013a-da4b-4344-9739-e4f84a7ea0ad
  event: CompanionDialogue_Solomorne_154
  text: '{n}Соломон вскидывает бровь:{/n} "Вольный Торговец и арбитр — интересные у вас представления о "нормальном". Попробую поддержать беседу на уровне ожиданий".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Соломон вскидывает бровь:'
  - speaker: Соломон Антар
    text_clean: Вольный Торговец и арбитр — интересные у вас представления о "нормальном". Попробую поддержать беседу на уровне ожиданий.
- guid: 43304fb4-b2ae-43d8-ad95-6ab354eb3433
  event: CompanionDialogue_Solomorne_155
  text: '"Со слов отца — достойной женщиной со слабым здоровьем. Она не перенесла родов. Наверное, тот факт, что я не знал ее — единственное сожаление в моей жизни".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Со слов отца — достойной женщиной со слабым здоровьем. Она не перенесла родов. Наверное, тот факт, что я не знал ее — единственное сожаление в моей жизни.
- guid: 26533021-8854-4403-a1f4-16e680c9d81e
  event: CompanionDialogue_Solomorne_156
  text: '{n}Из груди арбитра доносится тяжелый вздох. Спустя миг он уже столь же спокоен, как и всегда. Недрогнувшим голосом Соломон произносит:{/n} "Как... неудачно. Что же, я готов удовлетворить ваше любопытство, но прошу о приватности".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Из груди арбитра доносится тяжелый вздох. Спустя миг он уже столь же спокоен, как и всегда. Недрогнувшим голосом Соломон произносит:'
  - speaker: Соломон Антар
    text_clean: Как... неудачно. Что же, я готов удовлетворить ваше любопытство, но прошу о приватности.
- guid: 803334cb-215f-4806-ba62-8f4ac56cb6a7
  event: CompanionDialogue_Solomorne_157
  text: '"Слушаюсь, отложим этот разговор". {n}Соломон не меняется в лице, только старается пореже встречаться с вами взглядом.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Слушаюсь, отложим этот разговор.
  - speaker: narrator
    text_clean: Соломон не меняется в лице, только старается пореже встречаться с вами взглядом.
- guid: 9a15b760-e482-42d0-a8b9-cb76704b4015
  event: CompanionDialogue_Solomorne_158
  text: '"Обсудим. Что вас интересует?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Обсудим. Что вас интересует?
- guid: 9b79571a-bf1b-4c54-95a2-91076691a0bb
  event: CompanionDialogue_Solomorne_159
  text: '"Я не стану оспаривать суждения префекта, но..." {n}Соломон пристально смотрит вам в глаза.{/n} "Вам надо было принять решение по непростому вопросу, и вы это сделали. Взяли ответственность на себя. Я ценю в людях подобные качества".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я не стану оспаривать суждения префекта, но...
  - speaker: narrator
    text_clean: Соломон пристально смотрит вам в глаза.
  - speaker: Соломон Антар
    text_clean: Вам надо было принять решение по непростому вопросу, и вы это сделали. Взяли ответственность на себя. Я ценю в людях подобные качества.
- guid: d529a2d1-604e-45be-b9cb-d4ffa397f0c2
  event: CompanionDialogue_Solomorne_16
  text: '"Слушаю".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Слушаю.
- guid: 0a787bd2-e585-4ab8-a725-b898292d029a
  event: CompanionDialogue_Solomorne_160
  text: '"Вы уже указали на это префекту, а я получил отметку в личном деле. Если этого недостаточно, и вы ждете от меня каких-то комментариев — я отвечу".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы уже указали на это префекту, а я получил отметку в личном деле. Если этого недостаточно, и вы ждете от меня каких-то комментариев — я отвечу.
- guid: 3911163a-243d-4e12-84be-cf4d53eb7592
  event: CompanionDialogue_Solomorne_161
  text: '{n}Соломон с достоинством поднимает подбородок.{/n} "Вы можете утверждать, что моя рекомендация была неверной, но я не заставлял вас принимать именно это решение. Мне больше нечего добавить".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон с достоинством поднимает подбородок.
  - speaker: Соломон Антар
    text_clean: Вы можете утверждать, что моя рекомендация была неверной, но я не заставлял вас принимать именно это решение. Мне больше нечего добавить.
- guid: b8541983-48e1-485f-bbf7-4156da101b5f
  event: CompanionDialogue_Solomorne_162
  text: '"Вы правите целым протекторатом — мне бы и в голову не пришло судить о вас по одному инциденту. Если вам показалось, что я порицаю вас, так это у меня лицо такое. И голос. И выбор слов. Да, тяжело переключиться на обычную беседу после стольких лет, проведенных за допросами..."'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы правите целым протекторатом — мне бы и в голову не пришло судить о вас по одному инциденту. Если вам показалось, что я порицаю вас, так это у меня лицо такое. И голос. И выбор слов. Да, тяжело переключиться на обычную беседу после стольких лет, проведенных за допросами...
- guid: ec5bca37-36f4-4a77-9d70-92744327dc63
  event: CompanionDialogue_Solomorne_163
  text: '{n}Проктор выдерживает паузу, прежде чем ответить.{/n} "Помогать Вольному Торговцу, что осваивает новые миры во имя Бога-Императора — это именно то, зачем я здесь".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Проктор выдерживает паузу, прежде чем ответить.
  - speaker: Соломон Антар
    text_clean: Помогать Вольному Торговцу, что осваивает новые миры во имя Бога-Императора — это именно то, зачем я здесь.
- guid: 99ce0fda-e482-485e-95ec-9e47b8af22ec
  event: CompanionDialogue_Solomorne_164
  text: '{n}Соломон касается железными пальцами щеки.{/n} "Лучше бы вы прострелили мне ногу... Ах да, перечить не дозволено. Тогда благодарю, что преподали урок — он пойдет на пользу такому наглецу, как я".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон касается железными пальцами щеки.
  - speaker: Соломон Антар
    text_clean: Лучше бы вы прострелили мне ногу... Ах да, перечить не дозволено. Тогда благодарю, что преподали урок — он пойдет на пользу такому наглецу, как я.
- guid: 42e3e996-b68c-41d9-b792-b86239bed50a
  event: CompanionDialogue_Solomorne_165
  text: '{n}Соломон выглядит немного озадаченным вашим ответом.{/n} "Не мне учить Вольного Торговца жизни, но... В общем, вы можете на меня рассчитывать по части честности и непредвзятости".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон выглядит немного озадаченным вашим ответом.
  - speaker: Соломон Антар
    text_clean: Не мне учить Вольного Торговца жизни, но... В общем, вы можете на меня рассчитывать по части честности и непредвзятости.
- guid: 580c457e-6221-4100-a825-b86e87788319
  event: CompanionDialogue_Solomorne_166
  text: '"Не знаю. Это одна из тех паршивых ситуаций, когда только время покажет, насколько верно ты поступил".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не знаю. Это одна из тех паршивых ситуаций, когда только время покажет, насколько верно ты поступил.
- guid: ddc09567-3dd1-456d-8bc2-8a8bdd36c89e
  event: CompanionDialogue_Solomorne_167
  text: '{n}Арбитр замирает, на лбу выступают бисеринки пота.{/n} "Мне надо рассказать вам о своем прошлом, если, конечно, вы пожелаете выслушать".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитр замирает, на лбу выступают бисеринки пота.
  - speaker: Соломон Антар
    text_clean: Мне надо рассказать вам о своем прошлом, если, конечно, вы пожелаете выслушать.
- guid: 089ed759-ca28-4d46-ae7c-633b94fcdc3f
  event: CompanionDialogue_Solomorne_168
  text: '"На вашем месте я бы стойко принял оценку префекта и вооружился горьким опытом Тассеры. Жизнь порой дает под дых так, что не увернуться, поэтому важно уметь держать удар".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: На вашем месте я бы стойко принял оценку префекта и вооружился горьким опытом Тассеры. Жизнь порой дает под дых так, что не увернуться, поэтому важно уметь держать удар.
- guid: 4253861a-b1be-4ce4-acf4-d0ee19f5a2eb
  event: CompanionDialogue_Solomorne_169
  text: '"Еще я видел недавно ту девчонку, {d|Encyclopedia:CQ_LizzyOnBoardDecision}Мейв{/d}... Делает реверансы перед каждым встречным, улыбка до ушей. Раздражает страшно, но она определенно безобидна. Распознавать, кто не несет угрозу, и находить ему применение — тоже ценная способность".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Еще я видел недавно ту девчонку, Мейв... Делает реверансы перед каждым встречным, улыбка до ушей. Раздражает страшно, но она определенно безобидна. Распознавать, кто не несет угрозу, и находить ему применение — тоже ценная способность.
- guid: 9377e063-2795-48d0-b5b0-634f362d567f
  event: CompanionDialogue_Solomorne_17
  text: '"Уверен, Вольный Торговец может позволить себе лучшие импланты".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Уверен, Вольный Торговец может позволить себе лучшие импланты.
- guid: c0903180-b725-4b5c-ae8c-858523ac0618
  event: CompanionDialogue_Solomorne_170
  text: '"{d|Encyclopedia:CQ_LizzyServDecision}Вы сервиторизовали{/d} ту девицу, Мейв — суровое и правильное решение. Теперь враг не сможет вновь воспользоваться ее наивностью".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы сервиторизовали ту девицу, Мейв — суровое и правильное решение. Теперь враг не сможет вновь воспользоваться ее наивностью.
- guid: 42127d2e-5950-4aa2-8a56-e761a99ff7f9
  event: CompanionDialogue_Solomorne_171
  text: '"Могу поговорить с вами о чем-то еще".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Могу поговорить с вами о чем-то еще.
- guid: 4e3fc2ab-f56d-471b-b175-3c6a965ace29
  event: CompanionDialogue_Solomorne_172
  text: '"Наверное, ко мне применимо то, что зовут богатым послужным списком: расследования, подавление бунтов, карательные рейды. На моем счету десятки операций". {n}Соломон перечисляет сухо, без намека на гордость.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Наверное, ко мне применимо то, что зовут богатым послужным списком: расследования, подавление бунтов, карательные рейды. На моем счету десятки операций.'
  - speaker: narrator
    text_clean: Соломон перечисляет сухо, без намека на гордость.
- guid: eba56544-adec-411c-a3a5-9eb8bcfe6265
  event: CompanionDialogue_Solomorne_173
  text: '"Я был на миссии, и едва ли уделял внимание убогим забавам".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я был на миссии, и едва ли уделял внимание убогим забавам.
- guid: 14b29af0-b994-46d4-b3cd-2a412109e575
  event: CompanionDialogue_Solomorne_174
  text: '"Именно, и этим почти горжусь — какой арбитр опустится до того, чтобы праздно проводить время или, Трон упаси, танцевать?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Именно, и этим почти горжусь — какой арбитр опустится до того, чтобы праздно проводить время или, Трон упаси, танцевать?
- guid: 9c51ac39-a186-4c28-8585-f30315e01dcf
  event: CompanionDialogue_Solomorne_175
  text: '"Сейчас, когда я вспоминаю Тассеру, то явно вижу лишь один момент радости — возвращение на корабль". {n}Соломон отвечает сдержаннее обычного, глядя куда-то поверх вашего плеча.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Сейчас, когда я вспоминаю Тассеру, то явно вижу лишь один момент радости — возвращение на корабль.
  - speaker: narrator
    text_clean: Соломон отвечает сдержаннее обычного, глядя куда-то поверх вашего плеча.
- guid: 1c36affd-4d06-4646-942f-84b3676d609a
  event: CompanionDialogue_Solomorne_176
  text: '"Хорошо, раз вы настаиваете, я подумаю еще раз... Вино разило брагой, прятки были покушением — ничего веселого в этом нет, прочие увеселения отдавали упадочностью и скудоумием. Вроде все".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хорошо, раз вы настаиваете, я подумаю еще раз... Вино разило брагой, прятки были покушением — ничего веселого в этом нет, прочие увеселения отдавали упадочностью и скудоумием. Вроде все.
- guid: e27b9ce2-568f-4101-a06e-c1b916a56c0a
  event: CompanionDialogue_Solomorne_177
  text: '"Хотя нет". {n}Проктор словно сам себя останавливает, подняв палец.{/n} "Мне было приятно увидеть ту аугментированную бестию на свободе — сам не знаю, почему".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хотя нет.
  - speaker: narrator
    text_clean: Проктор словно сам себя останавливает, подняв палец.
  - speaker: Соломон Антар
    text_clean: Мне было приятно увидеть ту аугментированную бестию на свободе — сам не знаю, почему.
- guid: e7cd4e6a-6207-41fb-9240-523488972b06
  event: CompanionDialogue_Solomorne_178
  text: '"Я точно не советчик в таких вопросах, и не мера весов. Может, просто вас уже сложно удивить — вы Вольный Торговец все-таки".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я точно не советчик в таких вопросах, и не мера весов. Может, просто вас уже сложно удивить — вы Вольный Торговец все-таки.
- guid: d50e090a-a440-487d-b091-2276c3bfb7fb
  event: CompanionDialogue_Solomorne_179
  text: '"Обязательно учтите это, если вам понадобится спутник на какой-то раут. Знаете, не пьющий, бдительный и умеющий прикрывать спину".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Обязательно учтите это, если вам понадобится спутник на какой-то раут. Знаете, не пьющий, бдительный и умеющий прикрывать спину.
- guid: 4171b1f2-1cb1-4f7d-811c-3947b65cd628
  event: CompanionDialogue_Solomorne_18
  text: '{n}Соломон одаривает вас долгим взглядом.{/n} "Нет".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон одаривает вас долгим взглядом.
  - speaker: Соломон Антар
    text_clean: Нет.
- guid: 76c72d37-7340-4d9d-ba12-75af65607697
  event: CompanionDialogue_Solomorne_180
  text: '"Хорошо, я и сам искал разговора". {n}Ноздри Соломона раздуваются, взгляд беспокойно скользит по мостику.{/n} "Я должен рассказать о своем прошлом, чтобы окончательно закрыть всю эту ситуацию. Если вы, конечно, захотите выслушать".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хорошо, я и сам искал разговора.
  - speaker: narrator
    text_clean: Ноздри Соломона раздуваются, взгляд беспокойно скользит по мостику.
  - speaker: Соломон Антар
    text_clean: Я должен рассказать о своем прошлом, чтобы окончательно закрыть всю эту ситуацию. Если вы, конечно, захотите выслушать.
- guid: cd74b42c-0fae-4566-8037-c9b4554cd01b
  event: CompanionDialogue_Solomorne_181
  text: '"Нам определенно есть что обсудить".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Нам определенно есть что обсудить.
- guid: 87014981-0dc5-4fb6-896b-01b7f5363627
  event: CompanionDialogue_Solomorne_182
  text: '"Есть у меня предположение, но… я пока сам в него не верю. Слишком маловероятно, слишком опасно. Однако я охотно выслушаю ваши мысли на счет происходящего".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Есть у меня предположение, но… я пока сам в него не верю. Слишком маловероятно, слишком опасно. Однако я охотно выслушаю ваши мысли на счет происходящего.
- guid: 430943bc-3ce3-40c3-86f6-3e126226d6d7
  event: CompanionDialogue_Solomorne_183
  text: '"Глейто не домашнее животное, Вольный Торговец, подкармливать его бесполезно. Он ест только из моих рук и в строго отведенное время — иного дрессура не позволит. Исключает предумышленное отравление и другие попытки навредить кибермастифу. Одним словом — не тратьте время и мясо".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Глейто не домашнее животное, Вольный Торговец, подкармливать его бесполезно. Он ест только из моих рук и в строго отведенное время — иного дрессура не позволит. Исключает предумышленное отравление и другие попытки навредить кибермастифу. Одним словом — не тратьте время и мясо.
- guid: 61ae7a0d-1308-48da-8571-2fc1b3d818ad
  event: CompanionDialogue_Solomorne_184
  text: '"О том, что на самом деле толкнуло меня в бездну гнева". {n}Арбитр закрывает глаза, а когда открывает их снова, его голос звучит отстраненно и безжизненно.{/n} "В Каликсисе еще до получения ранга проктора я был в отряде с другим арбитром — Эммерсоном. Он был не просто соратником — мы одновременно попали в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g}, вместе прошли подготовку, получили назначение на один мир-улей. Я считал его братом, и я убил его".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: О том, что на самом деле толкнуло меня в бездну гнева.
  - speaker: narrator
    text_clean: Арбитр закрывает глаза, а когда открывает их снова, его голос звучит отстраненно и безжизненно.
  - speaker: Соломон Антар
    text_clean: В Каликсисе еще до получения ранга проктора я был в отряде с другим арбитром — Эммерсоном. Он был не просто соратником — мы одновременно попали в Схола Прогениум, вместе прошли подготовку, получили назначение на один мир-улей. Я считал его братом, и я убил его.
- guid: 7843f123-d8e6-4c12-9f0f-9e6229efd965
  event: CompanionDialogue_Solomorne_185
  text: '"Помните, я рассказывал о миссии, на которой лишился руки? Эммерсон продался преступному синдикату и скомпрометировал тот рейд".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Помните, я рассказывал о миссии, на которой лишился руки? Эммерсон продался преступному синдикату и скомпрометировал тот рейд.
- guid: 7420ac96-87b3-48ce-b781-a5098229748f
  event: CompanionDialogue_Solomorne_186
  text: '"Во время одного рейда мы попали в западню, потому что Эммерсон продался преступному синдикату и предал нас".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Во время одного рейда мы попали в западню, потому что Эммерсон продался преступному синдикату и предал нас.
- guid: b67c96f5-3c7b-4dea-b75e-6ad933524f03
  event: CompanionDialogue_Solomorne_187
  text: '"Я был тяжело ранен в первой стычке, лежал еле живой. Остальные ушли на разведку, а Эммерсон остался охранять меня. Он не заметил, как я очнулся, — говорил по воксу. Все требовал повышения платы, а когда он стал диктовать наши координаты, я выстрелил ему в затылок". {n}Соломон кладет руку на голову кибермастифа.{/n} "Я решил, что живыми мы отсюда не выберемся, поэтому прицепил свой вокс с последним докладом к ошейнику Глейто и приказал ему возвращаться в штаб. Потом снова отключился, а пришел в себя уже в плену. Еретики пытали меня сутками напролет, но я продержался достаточно, чтобы дождаться Взыскателей".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я был тяжело ранен в первой стычке, лежал еле живой. Остальные ушли на разведку, а Эммерсон остался охранять меня. Он не заметил, как я очнулся, — говорил по воксу. Все требовал повышения платы, а когда он стал диктовать наши координаты, я выстрелил ему в затылок.
  - speaker: narrator
    text_clean: Соломон кладет руку на голову кибермастифа.
  - speaker: Соломон Антар
    text_clean: Я решил, что живыми мы отсюда не выберемся, поэтому прицепил свой вокс с последним докладом к ошейнику Глейто и приказал ему возвращаться в штаб. Потом снова отключился, а пришел в себя уже в плену. Еретики пытали меня сутками напролет, но я продержался достаточно, чтобы дождаться Взыскателей.
- guid: df5856c0-1e7b-4254-8616-9ee3522b6f91
  event: CompanionDialogue_Solomorne_188
  text: '"Особый отряд — специализируется на выслеживании и захвате опасных преступников. Они расследовали предательство Эммерсона и вышли на логово еретиков, где меня держали".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Особый отряд — специализируется на выслеживании и захвате опасных преступников. Они расследовали предательство Эммерсона и вышли на логово еретиков, где меня держали.
- guid: e154556e-949d-4fab-b689-0e42e661a1fc
  event: CompanionDialogue_Solomorne_189
  text: '"Я был рядом с трупом их связного — им надо было понять, как я раскрыл их и что еще знаю. Из меня выбивали ответы, долго и изощренно. А я молчал, потому что знал: начну говорить, и от меня тут же избавятся".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Я был рядом с трупом их связного — им надо было понять, как я раскрыл их и что еще знаю. Из меня выбивали ответы, долго и изощренно. А я молчал, потому что знал: начну говорить, и от меня тут же избавятся.'
- guid: 95ea0487-301a-49ac-a53f-6b3be6dd9252
  event: CompanionDialogue_Solomorne_19
  text: '{n}Соломон кивает.{/n} "Разумное решение".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон кивает.
  - speaker: Соломон Антар
    text_clean: Разумное решение.
- guid: 3a148d14-067c-483b-bb4f-12f9e736acdb
  event: CompanionDialogue_Solomorne_190
  text: '"Я бы мог навешать вам на уши красивых словес о том, как перебирал в памяти Инъюнкта Кардинал или молился Императору, но... Я правда молился, и я хорошо подготовлен, чтобы терпеть боль, однако и у арбитра есть предел. Когда я почти сломался, мне помогла ненависть".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я бы мог навешать вам на уши красивых словес о том, как перебирал в памяти Инъюнкта Кардинал или молился Императору, но... Я правда молился, и я хорошо подготовлен, чтобы терпеть боль, однако и у арбитра есть предел. Когда я почти сломался, мне помогла ненависть.
- guid: 14e746d0-b8ee-4b87-a1f6-a7ea0b91fbd7
  event: CompanionDialogue_Solomorne_191
  text: '{n}Все тело Соломона напрягается, и Глейто тут же подается вперед, ища невидимую угрозу, но железная рука тянет ошейник на себя.{/n} "Я вспоминал лицо этого ублюдка, и душил в себе постыдное желание смерти снова и снова. Часы в агонии, часы в омуте чистой ярости".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Все тело Соломона напрягается, и Глейто тут же подается вперед, ища невидимую угрозу, но железная рука тянет ошейник на себя.
  - speaker: Соломон Антар
    text_clean: Я вспоминал лицо этого ублюдка, и душил в себе постыдное желание смерти снова и снова. Часы в агонии, часы в омуте чистой ярости.
- guid: e173a807-4810-4a2b-8d59-d8ef5ee2a3b8
  event: CompanionDialogue_Solomorne_192
  text: '"Я попал под следствие, но был оправдан и назначен на Благочестие, без Глейто. Самый коррумпированный мир-улей в Друзианской Марке, два года среди самых поганых представителей Человечества... Меня проверяли, и я прошел проверку — мне дали повышение, вернули Глейто, но после предательства Эммерсона я уже не был прежним".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я попал под следствие, но был оправдан и назначен на Благочестие, без Глейто. Самый коррумпированный мир-улей в Друзианской Марке, два года среди самых поганых представителей Человечества... Меня проверяли, и я прошел проверку — мне дали повышение, вернули Глейто, но после предательства Эммерсона я уже не был прежним.
- guid: 274b771b-3756-4d48-9697-d8c393556cbd
  event: CompanionDialogue_Solomorne_193
  text: '"Я знаю". {n}В словах нет ни гордости, ни вины, одна только отрешенность, граничащая с полным эмоциональным опустошением.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я знаю.
  - speaker: narrator
    text_clean: В словах нет ни гордости, ни вины, одна только отрешенность, граничащая с полным эмоциональным опустошением.
- guid: 66d56872-2f9a-4ce2-b81e-5f640718ddb6
  event: CompanionDialogue_Solomorne_20
  text: '"Нет. Не захотел. Одно время я сам не знал, что думаю о смерти отца. Точнее — старался не думать. Не интересовался ходом дела и не искал повода вернуться в Порт Странник: все равно Арбитес не получают назначения на родные миры. Но когда я покидал Каликсис, наше судно провело на станции несколько дней, и я позволил себе прийти туда, где убили отца. Немного постоял там и…" {n}Соломон задерживает на вас взгляд.{/n} "Ничего. Я просто знал, что другой арбитр довел расследование до конца, и мне здесь нечего делать".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Нет. Не захотел. Одно время я сам не знал, что думаю о смерти отца. Точнее — старался не думать. Не интересовался ходом дела и не искал повода вернуться в Порт Странник: все равно Арбитес не получают назначения на родные миры. Но когда я покидал Каликсис, наше судно провело на станции несколько дней, и я позволил себе прийти туда, где убили отца. Немного постоял там и…'
  - speaker: narrator
    text_clean: Соломон задерживает на вас взгляд.
  - speaker: Соломон Антар
    text_clean: Ничего. Я просто знал, что другой арбитр довел расследование до конца, и мне здесь нечего делать.
- guid: 8a36c0e0-4ee5-4656-90e0-fa1dc977ae7c
  event: CompanionDialogue_Solomorne_21
  text: '"Может быть. Он был сухарем, иногда мы по нескольку дней и слова друг другу не говорили. Разговорчивее всего он становился, когда по ночам сидел за делами. Просто и скупо рассказывал мне, кто и почему продался, какую мерзость творят еретики на нижних уровнях ульев, ради каких низменных потребностей чернь вешает бригадиров... Мне хватило слышать и слушать, наблюдать и размышлять".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Может быть. Он был сухарем, иногда мы по нескольку дней и слова друг другу не говорили. Разговорчивее всего он становился, когда по ночам сидел за делами. Просто и скупо рассказывал мне, кто и почему продался, какую мерзость творят еретики на нижних уровнях ульев, ради каких низменных потребностей чернь вешает бригадиров... Мне хватило слышать и слушать, наблюдать и размышлять.
- guid: 2e3e6fa5-ce60-4727-ab39-4fb08eb198f9
  event: CompanionDialogue_Solomorne_22
  text: '"Конечно, это правда. Я — арбитр во втором поколении, и мой отец мертвее некуда. Начинаю подозревать, что смерть при исполнении — это у нас потомственное, надо только предварительно обзавестись ребенком". {n}Если это и была шутка, на лице Соломона и мускул не дрогнул.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Конечно, это правда. Я — арбитр во втором поколении, и мой отец мертвее некуда. Начинаю подозревать, что смерть при исполнении — это у нас потомственное, надо только предварительно обзавестись ребенком.
  - speaker: narrator
    text_clean: Если это и была шутка, на лице Соломона и мускул не дрогнул.
- guid: 087a7cb4-33c4-41ec-9c0d-edc3d6e1df1e
  event: CompanionDialogue_Solomorne_23
  text: '"Рожден? Я не верю в предопределенность. Но точно знаю, что судьба каждого человека — служить Империуму, а в моем случае Империум посчитал, что мне положен ранг Арбитеса, тяжелый дробовик и Глейто. Не знаю, чего еще желать".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Рожден? Я не верю в предопределенность. Но точно знаю, что судьба каждого человека — служить Империуму, а в моем случае Империум посчитал, что мне положен ранг Арбитеса, тяжелый дробовик и Глейто. Не знаю, чего еще желать.
- guid: 21e25f06-7d62-4e9d-bc96-1bc14302b1bd
  event: CompanionDialogue_Solomorne_24
  text: '"Вас понял. Мой ответ был неуместным и неуважительным". {n}Соломон склоняет голову в знак смирения.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вас понял. Мой ответ был неуместным и неуважительным.
  - speaker: narrator
    text_clean: Соломон склоняет голову в знак смирения.
- guid: ca4b60ab-4f67-4c65-86df-e3f005bbd11f
  event: CompanionDialogue_Solomorne_25
  text: '"Прежде я не бывал в свите Вольного Торговца. В остальном..." {n}Соломон окидывает мостик взглядом.{/n} "Я приспосабливаюсь быстрее, чем вы думаете. И пока Глейто со мной, я готов к любым перестановкам".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Прежде я не бывал в свите Вольного Торговца. В остальном...
  - speaker: narrator
    text_clean: Соломон окидывает мостик взглядом.
  - speaker: Соломон Антар
    text_clean: Я приспосабливаюсь быстрее, чем вы думаете. И пока Глейто со мной, я готов к любым перестановкам.
- guid: abcf7063-e34b-4f93-9202-0f38827efdca
  event: CompanionDialogue_Solomorne_26
  text: '"Он передал мне сообщение — неожиданно душевное". {n}Соломон прикрывает глаза и почтительно цитирует ровным тоном:{/n} "Соломон Антар, ты вновь возведен в ранг проктора — впредь пусть и тени недостойности не ложится на твой мундир".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Он передал мне сообщение — неожиданно душевное.
  - speaker: narrator
    text_clean: 'Соломон прикрывает глаза и почтительно цитирует ровным тоном:'
  - speaker: Соломон Антар
    text_clean: Соломон Антар, ты вновь возведен в ранг проктора — впредь пусть и тени недостойности не ложится на твой мундир.
- guid: 45f385e1-3a4b-4d9e-8b6b-d0b3082c3d5d
  event: CompanionDialogue_Solomorne_27
  text: '{n}Каменное лицо Соломона чуть оживляется.{/n} "Слышал, Глейто? Тобой интересуется сам{mf||а} Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Каменное лицо Соломона чуть оживляется.
  - speaker: Соломон Антар
    text_clean: Слышал, Глейто? Тобой интересуется сам Вольный Торговец.
- guid: b3485a99-1e0f-4c37-808a-12f7ae1864e6
  event: CompanionDialogue_Solomorne_28
  text: '"С первого до последнего слова? Вы явно плохо знаете маршала, поэтому просто поверьте мне".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: С первого до последнего слова? Вы явно плохо знаете маршала, поэтому просто поверьте мне.
- guid: 805e7ee1-d685-4344-b68c-53c60452fd08
  event: CompanionDialogue_Solomorne_29
  text: '"И не говорите. Я до сих пор потрясен его словами". {n}Если Соломон и испытывает некоторое потрясение, его лицо остается непроницаемым.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: И не говорите. Я до сих пор потрясен его словами.
  - speaker: narrator
    text_clean: Если Соломон и испытывает некоторое потрясение, его лицо остается непроницаемым.
- guid: ad4fa390-dc3a-4a82-8d77-7bb1620a9e77
  event: CompanionDialogue_Solomorne_30
  text: '"Его серийный номер GL-80. На готике удобно прочесть как "Глейто". Многие называют своих кибермастифов внушительно — "Палач" или "Гром", но меня и такое имя устраивает".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Его серийный номер GL-80. На готике удобно прочесть как "Глейто". Многие называют своих кибермастифов внушительно — "Палач" или "Гром", но меня и такое имя устраивает.
- guid: 30a9f40e-6475-4cee-b515-fe28b314a93a
  event: CompanionDialogue_Solomorne_31
  text: '"Главным образом он действует как поддержка в бою. Обучен летальным и нелетальным способам захвата цели, способен оценивать обстановку и действовать соответствующе. Еще Глейто умеет вести слежку, распознавать элементарные улики. Он знает больше сотни команд и в целом..." {n}Соломон замолкает, задумчиво глядя на сидящего по струнке кибермастифа.{/n} "Он полезнее и исполнительнее большинства людей, которых я встречал".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Главным образом он действует как поддержка в бою. Обучен летальным и нелетальным способам захвата цели, способен оценивать обстановку и действовать соответствующе. Еще Глейто умеет вести слежку, распознавать элементарные улики. Он знает больше сотни команд и в целом...
  - speaker: narrator
    text_clean: Соломон замолкает, задумчиво глядя на сидящего по струнке кибермастифа.
  - speaker: Соломон Антар
    text_clean: Он полезнее и исполнительнее большинства людей, которых я встречал.
- guid: af1a8401-cf99-4ed6-ae15-5292058da9a8
  event: CompanionDialogue_Solomorne_32
  text: '"Более чем. Ваши слова вытащили меня из мрака, и я благодарен за это".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Более чем. Ваши слова вытащили меня из мрака, и я благодарен за это.
- guid: cae7bee3-62ca-4709-8a4d-c6e40cf97408
  event: CompanionDialogue_Solomorne_33
  text: '"Глейто — не питомец. Он инструмент правосудия. Как и я".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Глейто — не питомец. Он инструмент правосудия. Как и я.
- guid: f2570c0d-ee96-4d5e-8796-59ea3b7293b8
  event: CompanionDialogue_Solomorne_34
  text: '"Моя вера пересилила разочарование и ненависть. Да, люди слабы и порочны, но не это важно. Главное, что буква закона Его совершенна, и она ведет меня — только она".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Моя вера пересилила разочарование и ненависть. Да, люди слабы и порочны, но не это важно. Главное, что буква закона Его совершенна, и она ведет меня — только она.
- guid: 3af265ba-2224-40ee-bdbe-5682bc48a5a0
  event: CompanionDialogue_Solomorne_35
  text: '"Я много думал о духе закона Его, о том, чего бы сам Император хотел для нас. Если бы мне раньше кто-то сказал, что я буду о таком помышлять, я бы, может, и лицо ему разбил. Но теперь я не вижу в подобных мыслях ереси. Наоборот, они словно приближают меня к Императору".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я много думал о духе закона Его, о том, чего бы сам Император хотел для нас. Если бы мне раньше кто-то сказал, что я буду о таком помышлять, я бы, может, и лицо ему разбил. Но теперь я не вижу в подобных мыслях ереси. Наоборот, они словно приближают меня к Императору.
- guid: 6f4f512f-203e-4eba-ac72-e0e628d101a9
  event: CompanionDialogue_Solomorne_36
  text: '"Ненависть все еще клокочет у меня внутри, но теперь я могу дать ей выход — обрушить ее на преступную падаль и даже больше... Каждый сомневающийся, любой вольнодумец или хоть в чем-то ненадежный будет судим мной, как отпетый еретик. Только так я заставлю людей почитать Лекс Империалис".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Ненависть все еще клокочет у меня внутри, но теперь я могу дать ей выход — обрушить ее на преступную падаль и даже больше... Каждый сомневающийся, любой вольнодумец или хоть в чем-то ненадежный будет судим мной, как отпетый еретик. Только так я заставлю людей почитать Лекс Империалис.
- guid: 995ca72e-0f94-408e-b371-c5c8b24ccf6d
  event: CompanionDialogue_Solomorne_37
  text: '"До сих пор не приходилось. Я не провожу время в размышлениях о подобном — это, в лучшем случае, бесполезное занятие".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: До сих пор не приходилось. Я не провожу время в размышлениях о подобном — это, в лучшем случае, бесполезное занятие.
- guid: 210d5a51-5c2d-4d80-ab15-7da09a8d1c9a
  event: CompanionDialogue_Solomorne_38
  text: '"С любым оружием в руках закона. Только служение Лекс Империалис определяет мой "уровень".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: С любым оружием в руках закона. Только служение Лекс Империалис определяет мой "уровень.
- guid: 9e81b04a-e984-49c5-9690-f881043a883a
  event: CompanionDialogue_Solomorne_39
  text: '"Мы поняли друг друга. Хорошо".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Мы поняли друг друга. Хорошо.
- guid: 106ac7eb-12ff-44b2-b0b6-300e1312b8d4
  event: CompanionDialogue_Solomorne_40
  text: '"Да. Дрессура и аугментации гарантируют, что Глейто будет принимать только те приказы, что исходят от меня или вышестоящего по чину. Кроме очевидных достоинств, это препятствует неразберихе, когда в миссии участвуют несколько Арбитес с кибермастифами".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Да. Дрессура и аугментации гарантируют, что Глейто будет принимать только те приказы, что исходят от меня или вышестоящего по чину. Кроме очевидных достоинств, это препятствует неразберихе, когда в миссии участвуют несколько Арбитес с кибермастифами.
- guid: 4f92ad71-052d-4d6d-a197-0817eaca69e5
  event: CompanionDialogue_Solomorne_41
  text: '"Обычно кибермастифов лишают любых проявлений животной натуры, но Глейто — особый случай. Его подмодель берет за основу собачью верность, охотничьи и сторожевые инстинкты и возводит их в абсолют. Он не пес и не сервитор, а намного лучше: кибермастиф — живое оружие на службе закона".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Обычно кибермастифов лишают любых проявлений животной натуры, но Глейто — особый случай. Его подмодель берет за основу собачью верность, охотничьи и сторожевые инстинкты и возводит их в абсолют. Он не пес и не сервитор, а намного лучше: кибермастиф — живое оружие на службе закона.'
- guid: b2ba4bc2-5f31-4230-ac4a-28e10767b23a
  event: CompanionDialogue_Solomorne_42
  text: '"Глейто, изготовка". {n}Кибермастиф немедленно принимает стойку, а Соломон начинает указывать на разные части пса.{/n} "Корпус — по большей части из металла, бронепластины закрывают жизненно важные части тела. Челюсть усилена — откусить ногу, что волос выдрать". {n}Он поворачивает морду Глейто, чтобы вам было лучше видно и без того огромные клыки.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Глейто, изготовка.
  - speaker: narrator
    text_clean: Кибермастиф немедленно принимает стойку, а Соломон начинает указывать на разные части пса.
  - speaker: Соломон Антар
    text_clean: Корпус — по большей части из металла, бронепластины закрывают жизненно важные части тела. Челюсть усилена — откусить ногу, что волос выдрать.
  - speaker: narrator
    text_clean: Он поворачивает морду Глейто, чтобы вам было лучше видно и без того огромные клыки.
- guid: fa396b06-dff7-4614-82c7-879853874e30
  event: CompanionDialogue_Solomorne_43
  text: '{n}Соломон треплет пса за холку, пристально глядя ему в глаза.{/n} "Я не знаю и десятой доли того, чем начинен Глейто, но поверьте — список внушительный. Взять хотя бы сенсоры в носу, которые делают из кибермастифа мини-лабораторию по анализу запахов". {n}Арбитес похлопывает пса по спине.{/n} "Все. Глейто, смирно".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон треплет пса за холку, пристально глядя ему в глаза.
  - speaker: Соломон Антар
    text_clean: Я не знаю и десятой доли того, чем начинен Глейто, но поверьте — список внушительный. Взять хотя бы сенсоры в носу, которые делают из кибермастифа мини-лабораторию по анализу запахов.
  - speaker: narrator
    text_clean: Арбитес похлопывает пса по спине.
  - speaker: Соломон Антар
    text_clean: Все. Глейто, смирно.
- guid: 0e554297-937c-42cc-ad70-0e5241a5eafe
  event: CompanionDialogue_Solomorne_44
  text: '"Начиная от "убей", "охраняй" и так далее, заканчивая комплексными протоколами для охраны и патрулирования — то есть комбинациями паттернов поведения, по которым кибермастиф действует в зависимости от ситуации. Иначе говоря, мне не всегда надо контролировать Глейто — он способен оценивать обстановку и реагировать самостоятельно".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Начиная от "убей", "охраняй" и так далее, заканчивая комплексными протоколами для охраны и патрулирования — то есть комбинациями паттернов поведения, по которым кибермастиф действует в зависимости от ситуации. Иначе говоря, мне не всегда надо контролировать Глейто — он способен оценивать обстановку и реагировать самостоятельно.
- guid: 17b78c6c-2d9e-4a73-928d-cb3945737d9e
  event: CompanionDialogue_Solomorne_45
  text: '"Как скажете".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Как скажете.
- guid: d21d0519-3457-42cf-957d-23d94aed2c85
  event: CompanionDialogue_Solomorne_46
  text: '"Самыми значительными. За пределами Коронуса мы не только собираем {g|Encyclopedia:TitheGlossary}десятину{/g}, но и следим, чтобы каждый мир подчинялся законам Его, и никто не посягал на имперскую власть. Продажные губернаторы, преступные синдикаты, мятежники — ежеминутно какая-то мразь пытается оторвать кусок от Империума. Мы уничтожаем любого, кто дерзнет преступить закон".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Самыми значительными. За пределами Коронуса мы не только собираем десятину, но и следим, чтобы каждый мир подчинялся законам Его, и никто не посягал на имперскую власть. Продажные губернаторы, преступные синдикаты, мятежники — ежеминутно какая-то мразь пытается оторвать кусок от Империума. Мы уничтожаем любого, кто дерзнет преступить закон.
- guid: e416b498-adb8-45ba-9cd2-95ec43b0ddb9
  event: CompanionDialogue_Solomorne_47
  text: '"Вы понимаете". {n}Соломон шумно выдыхает.{/n} "Долго же это меня глодало... Наверное, мне просто надо было, чтобы другой человек озвучил мои собственные мысли. Спасибо".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы понимаете.
  - speaker: narrator
    text_clean: Соломон шумно выдыхает.
  - speaker: Соломон Антар
    text_clean: Долго же это меня глодало... Наверное, мне просто надо было, чтобы другой человек озвучил мои собственные мысли. Спасибо.
- guid: cc3aa569-6c6d-48d7-ae97-f4652c9cd872
  event: CompanionDialogue_Solomorne_48
  text: '{n}Соломон встречает вас, выпятив грудь, точно собирается на битву.{/n} "Благодарю, что нашли время поговорить о моем рапорте. Смею просить, чтобы этот разговор состоялся в приватной обстановке. Позвольте продолжить в вашем кабинете, Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон встречает вас, выпятив грудь, точно собирается на битву.
  - speaker: Соломон Антар
    text_clean: Благодарю, что нашли время поговорить о моем рапорте. Смею просить, чтобы этот разговор состоялся в приватной обстановке. Позвольте продолжить в вашем кабинете, Вольный Торговец.
- guid: 35bd5a8f-f45b-4eee-89f8-0cdb4a8c0d42
  event: CompanionDialogue_Solomorne_49
  text: '"О нем не беспокойтесь — Глейто полностью исправен. Недавно закончил проверять все протоколы, и он подхватывает приказы с полуслова. Не буду кривить душой — мне этого очень не хватало".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: О нем не беспокойтесь — Глейто полностью исправен. Недавно закончил проверять все протоколы, и он подхватывает приказы с полуслова. Не буду кривить душой — мне этого очень не хватало.
- guid: 3c4ee89e-ab39-4d00-bc06-bd7cadeebdaf
  event: CompanionDialogue_Solomorne_50
  text: '"Может быть, вы правы". {n}Соломон задумчиво поправляет на Глейто совершенно ровно сидящий ошейник.{/n} "Может быть".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Может быть, вы правы.
  - speaker: narrator
    text_clean: Соломон задумчиво поправляет на Глейто совершенно ровно сидящий ошейник.
  - speaker: Соломон Антар
    text_clean: Может быть.
- guid: e1e3e273-7998-4681-b0b5-c1b6eeb5ed0f
  event: CompanionDialogue_Solomorne_51
  text: '"Первое время я был не в себе, но стиснул зубы и стал читать катехизисы Лекс Империалис — с самого начала, как если бы вновь оказался в {g|Encyclopedia:ScholaProgeniumGlossary}Схола Прогениум{/g}. Каждый раз, чувствуя, что снова сорвусь, я запирался в каюте и перечислял положения Инъюнкта Кардинал, и это помогло".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Первое время я был не в себе, но стиснул зубы и стал читать катехизисы Лекс Империалис — с самого начала, как если бы вновь оказался в Схола Прогениум. Каждый раз, чувствуя, что снова сорвусь, я запирался в каюте и перечислял положения Инъюнкта Кардинал, и это помогло.
- guid: f2d03a70-c734-40cd-97a3-2b5cadb6a381
  event: CompanionDialogue_Solomorne_52
  text: '"Хорошо. Самое время перевести тему".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хорошо. Самое время перевести тему.
- guid: b0bc0d2f-0f7e-4e9b-a777-0a2b912a5188
  event: CompanionDialogue_Solomorne_53
  text: '"Вы о проведенной вместе ночи? Думаю, нам не стоит придавать ей большего значения, чем она заслуживает".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы о проведенной вместе ночи? Думаю, нам не стоит придавать ей большего значения, чем она заслуживает.
- guid: f205d245-3e6c-4965-92e1-01da63937ddc
  event: CompanionDialogue_Solomorne_54
  text: '"Конечно, {name}". {n}Соломон невозмутим, но глаза его улыбаются.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Конечно, КЭП.
  - speaker: narrator
    text_clean: Соломон невозмутим, но глаза его улыбаются.
- guid: 3f0ee87e-721f-436f-8776-4f581a575f31
  event: CompanionDialogue_Solomorne_55
  text: '"А разве между нами что-то происходит? Мне казалось, мы прояснили этот вопрос — я лгал, и между нами нет ничего кроме службы".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: А разве между нами что-то происходит? Мне казалось, мы прояснили этот вопрос — я лгал, и между нами нет ничего кроме службы.
- guid: cb314e3c-36ae-42e1-926b-27dd3241f5c1
  event: CompanionDialogue_Solomorne_56
  text: '"Как вы могли убедиться на Райкаде Минорис — весьма".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Как вы могли убедиться на Райкаде Минорис — весьма.
- guid: b0201e3e-a48a-48e5-bbf7-a30e084a4dc5
  event: CompanionDialogue_Solomorne_57
  text: '"Вы просто обезоруживаете меня такими словами". {n}Соломон отвечает тише обычного, точно это признание дается ему непросто.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вы просто обезоруживаете меня такими словами.
  - speaker: narrator
    text_clean: Соломон отвечает тише обычного, точно это признание дается ему непросто.
- guid: 1615f157-bf49-4821-a526-69c11e8b6cf0
  event: CompanionDialogue_Solomorne_58
  text: '{n}Выпятив мощную челюсть, Соломон хмуро произносит:{/n} "Если такова ваша воля — все кончено. Я не смею требовать объяснений".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Выпятив мощную челюсть, Соломон хмуро произносит:'
  - speaker: Соломон Антар
    text_clean: Если такова ваша воля — все кончено. Я не смею требовать объяснений.
- guid: 40c0540d-ea68-4925-ad15-179dc0cb6e50
  event: CompanionDialogue_Solomorne_59
  text: '"...особенное? Волнующее? Опасное?" {n}Приподняв бровь, проктор делает шаг и оказывается близко, слишком близко.{/n} "Нужны двое, чтобы ответить на этот вопрос. Я знаю, чего хочу". {n}Его взгляд скользит по вам.{/n} "А чего желаете вы?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: '...особенное? Волнующее? Опасное?'
  - speaker: narrator
    text_clean: Приподняв бровь, проктор делает шаг и оказывается близко, слишком близко.
  - speaker: Соломон Антар
    text_clean: Нужны двое, чтобы ответить на этот вопрос. Я знаю, чего хочу.
  - speaker: narrator
    text_clean: Его взгляд скользит по вам.
  - speaker: Соломон Антар
    text_clean: А чего желаете вы?
- guid: 7e486ae6-e39d-4095-af8f-ba24c946a8d2
  event: CompanionDialogue_Solomorne_60
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "Что будет, если я отвечу "Да"?"'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Во взгляде арбитра возникает теплый огонек.
  - speaker: Соломон Антар
    text_clean: Что будет, если я отвечу "Да"?
- guid: cbdb8bd7-5f41-45d8-a059-0f70a5c8d90c
  event: CompanionDialogue_Solomorne_61
  text: '{n}Соломон почтительно кивает.{/n} "Как вам угодно".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон почтительно кивает.
  - speaker: Соломон Антар
    text_clean: Как вам угодно.
- guid: 91b6087b-0238-4b75-bb6e-2ddd35fd278c
  event: CompanionDialogue_Solomorne_62
  text: '{n}Голос Соломона тих и серьезен.{/n} "Перед тем как я отвечу... Я слышал разговоры ваших офицеров, и мне кажется, что кое-чье сердце может быть разбито. Вы уверены, что после не сочтете это ошибкой?"'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Голос Соломона тих и серьезен.
  - speaker: Соломон Антар
    text_clean: Перед тем как я отвечу... Я слышал разговоры ваших офицеров, и мне кажется, что кое-чье сердце может быть разбито. Вы уверены, что после не сочтете это ошибкой?
- guid: 8efe837d-5307-4df8-8295-c12e6b9bacdc
  event: CompanionDialogue_Solomorne_63
  text: '"Это все... не слишком известное мне пространство. Моя жизнь — служба, и на службе я куда чаще задаюсь вопросом "виновен ли этот человек", чем вопросом "как я отношусь к этому человеку". Я впервые испытываю к кому-то подобную тягу, так что прошу простить за неопытность".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это все... не слишком известное мне пространство. Моя жизнь — служба, и на службе я куда чаще задаюсь вопросом "виновен ли этот человек", чем вопросом "как я отношусь к этому человеку". Я впервые испытываю к кому-то подобную тягу, так что прошу простить за неопытность.
- guid: d61d9c40-db78-4b3f-8d76-7e272501aaf5
  event: CompanionDialogue_Solomorne_64
  text: '"Это помешает службе — и моей, и вашей".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это помешает службе — и моей, и вашей.
- guid: 2f1f6d5f-b58e-46f6-8b1b-afc797aa6a66
  event: CompanionDialogue_Solomorne_65
  text: '"Велики, и для многих в Коронусе это становится неприятным сюрпризом".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Велики, и для многих в Коронусе это становится неприятным сюрпризом.
- guid: ce05621c-7b13-4cfd-80c6-13d75e159161
  event: CompanionDialogue_Solomorne_66
  text: '"О ней и ее людях можно не беспокоиться — они ждут возможности отчитаться перед маршалом. Уж что-что, а терпеливо ждать они умеют". {n}Соломон немного понижает голос.{/n} "Я не сообщал Йегер о связи стража Летуса с леди Теодорой — ей ни к чему это знать".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: О ней и ее людях можно не беспокоиться — они ждут возможности отчитаться перед маршалом. Уж что-что, а терпеливо ждать они умеют.
  - speaker: narrator
    text_clean: Соломон немного понижает голос.
  - speaker: Соломон Антар
    text_clean: Я не сообщал Йегер о связи стража Летуса с леди Теодорой — ей ни к чему это знать.
- guid: 9daac29c-0fdd-4820-a7a7-49cc8b1428bc
  event: CompanionDialogue_Solomorne_67
  text: '"По меркам Арбитес я уже погряз в ереси, но знаете, меня не пугает их осуждение. Я служу Императору как никогда прежде, я больше не слеп и не скован, но бремя долга от осознания этого лишь сильнее давит на плечи. Так много надо сделать, чтобы защитить Коронус от бедствий и раздоров, и я сам возлагаю на себя эту миссию".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: По меркам Арбитес я уже погряз в ереси, но знаете, меня не пугает их осуждение. Я служу Императору как никогда прежде, я больше не слеп и не скован, но бремя долга от осознания этого лишь сильнее давит на плечи. Так много надо сделать, чтобы защитить Коронус от бедствий и раздоров, и я сам возлагаю на себя эту миссию.
- guid: 65266d45-335a-47d9-bf84-0c43318023c3
  event: CompanionDialogue_Solomorne_68
  text: '"Ограничения в толковании Лекс Империалис — это поводок, который гарантирует, что слабые и недальновидные Арбитес не дадут маху. Я давно перерос рамки системы и вижу ее изъяны. И, если во имя порядка в Империуме, мне придется что-то сломать и выстроить заново, я это сделаю".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Ограничения в толковании Лекс Империалис — это поводок, который гарантирует, что слабые и недальновидные Арбитес не дадут маху. Я давно перерос рамки системы и вижу ее изъяны. И, если во имя порядка в Империуме, мне придется что-то сломать и выстроить заново, я это сделаю.
- guid: 21eb175a-757e-45c1-a9ed-a8f853aefd4d
  event: CompanionDialogue_Solomorne_69
  text: '"Раз уж вы подняли эту тему — вас беспокоит, что я нашел новый путь служения?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Раз уж вы подняли эту тему — вас беспокоит, что я нашел новый путь служения?
- guid: 6aadb8ca-de22-4f46-9df6-9613ce4c8946
  event: CompanionDialogue_Solomorne_70
  text: '{n}Проктор прижимает к сердцу железную ладонь.{/n} "Для меня это много значит, Вольный Торговец — быть не только вашим спутником в странствиях, но и соратником в борьбе за новое толкование Лекс Империалис".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Проктор прижимает к сердцу железную ладонь.
  - speaker: Соломон Антар
    text_clean: Для меня это много значит, Вольный Торговец — быть не только вашим спутником в странствиях, но и соратником в борьбе за новое толкование Лекс Империалис.
- guid: 75552cda-0a7a-458a-80a3-ba9e6220946e
  event: CompanionDialogue_Solomorne_71
  text: '"Я меняюсь, чтобы лучше служить Лексу, разве это не часть долга?" {n}Проктор переводит взгляд с вас на Глейто.{/n} "Не ожидал от вас подобных слов, учитывая... Нет, не важно. Вы сказали, что считали нужным".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я меняюсь, чтобы лучше служить Лексу, разве это не часть долга?
  - speaker: narrator
    text_clean: Проктор переводит взгляд с вас на Глейто.
  - speaker: Соломон Антар
    text_clean: Не ожидал от вас подобных слов, учитывая... Нет, не важно. Вы сказали, что считали нужным.
- guid: 85081488-044c-418b-ac77-3f0824c65574
  event: CompanionDialogue_Solomorne_72
  text: '"Тогда тема закрыта".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Тогда тема закрыта.
- guid: 3a3367b3-68ba-465c-ba9c-fe3318ca6521
  event: CompanionDialogue_Solomorne_73
  text: '"Понимаю ход ваших мыслей: Летус выглядел выгребной ямой отчаяния и безумия, а раз за хранение десятины отвечают арбитры, то и вывод простой. Простой, но неверный. Попробуйте посмотреть с другой стороны: Лекс Империалис дает четкую директиву к действию, надо лишь следовать ей. Гвардейцы могли смиренно ждать, клерк — покаяться в незавершенной работе. Но они выбрали свои слабости и пороки. Так что на самом деле несет вред?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Понимаю ход ваших мыслей: Летус выглядел выгребной ямой отчаяния и безумия, а раз за хранение десятины отвечают арбитры, то и вывод простой. Простой, но неверный. Попробуйте посмотреть с другой стороны: Лекс Империалис дает четкую директиву к действию, надо лишь следовать ей. Гвардейцы могли смиренно ждать, клерк — покаяться в незавершенной работе. Но они выбрали свои слабости и пороки. Так что на самом деле несет вред?'
- guid: 6c5c6071-e62e-438c-87b8-3e75c4b6f0ae
  event: CompanionDialogue_Solomorne_74
  text: '"Ваши действия говорят за себя лучше любых слов, но..." {n}Соломон смотрит вам прямо в глаза.{/n} "Будь я проклят, если не признаюсь, что рад услышать лично от вас о верности Лекс Империалис. Когда мир летит в бездну, я хочу знать, что мы сражаемся за одни идеалы".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Ваши действия говорят за себя лучше любых слов, но...
  - speaker: narrator
    text_clean: Соломон смотрит вам прямо в глаза.
  - speaker: Соломон Антар
    text_clean: Будь я проклят, если не признаюсь, что рад услышать лично от вас о верности Лекс Империалис. Когда мир летит в бездну, я хочу знать, что мы сражаемся за одни идеалы.
- guid: 712256a5-960e-4fe0-8020-57b59fc0a1f5
  event: CompanionDialogue_Solomorne_75
  text: '"Арбитес выносят приговор и приводят его в исполнение на месте. Только высшие чины {g|Encyclopedia:HolyTerraGlossary}Терры{/g} и служители Инквизиции могут рассчитывать на привилегию суда, а в Просторе — Вольные Торговцы. Планетарные губернаторы, знать, духовенство — для арбитров все они равны перед законом".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Арбитес выносят приговор и приводят его в исполнение на месте. Только высшие чины Терры и служители Инквизиции могут рассчитывать на привилегию суда, а в Просторе — Вольные Торговцы. Планетарные губернаторы, знать, духовенство — для арбитров все они равны перед законом.
- guid: a699685d-303f-4a0e-abaa-b5cbf2927c99
  event: CompanionDialogue_Solomorne_76
  text: '"Не сомневайтесь, я больше не подведу вас. И в знак своей решимости я должен кое-что сделать".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не сомневайтесь, я больше не подведу вас. И в знак своей решимости я должен кое-что сделать.
- guid: be090b93-766c-4639-b2b3-5df61ac358dc
  event: CompanionDialogue_Solomorne_77
  text: '"Проверяете меня? Я не против". {n}Голос Соломона приобретает особую глубину, даже торжественность:{/n} "Лекс Империалис — это свод законов и слово самого Бога-Императора. Тысячелетиями Его указы собирались и хранились на {g|Encyclopedia:HolyTerraGlossary}Святой Терре{/g} в Зале Суда вместе с распоряжениями Верховных Лордов. Это одновременно и огромное собрание законов, и священное писание".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Проверяете меня? Я не против.
  - speaker: narrator
    text_clean: 'Голос Соломона приобретает особую глубину, даже торжественность:'
  - speaker: Соломон Антар
    text_clean: Лекс Империалис — это свод законов и слово самого Бога-Императора. Тысячелетиями Его указы собирались и хранились на Святой Терре в Зале Суда вместе с распоряжениями Верховных Лордов. Это одновременно и огромное собрание законов, и священное писание.
- guid: 4688fb65-1202-41af-b5f1-703af4dff9b6
  event: CompanionDialogue_Solomorne_78
  text: '"Лучше. Иногда мне кажется, что я вот-вот сорвусь, но вспоминаю ваши слова, и голова проясняется".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Лучше. Иногда мне кажется, что я вот-вот сорвусь, но вспоминаю ваши слова, и голова проясняется.
- guid: ea657ae5-d990-464b-a2e6-1c014e773b8e
  event: CompanionDialogue_Solomorne_79
  text: '"Отвратительно". {n}Соломон поднимает к лицу слегка дрожащую железную ладонь и сжимает в кулак.{/n} "Но я не дам себе развалиться на куски — одной позорной слабости более чем достаточно".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Отвратительно.
  - speaker: narrator
    text_clean: Соломон поднимает к лицу слегка дрожащую железную ладонь и сжимает в кулак.
  - speaker: Соломон Антар
    text_clean: Но я не дам себе развалиться на куски — одной позорной слабости более чем достаточно.
- guid: d959a87f-9075-4236-8df5-f5895e0d1510
  event: CompanionDialogue_Solomorne_80
  text: '{n}Соломон поглощен тем, что оттирает тряпицей кровь с аугментированной руки. Оторвав взгляд от импланта, он устало кивает.{/n} "Вольный Торговец?"'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон поглощен тем, что оттирает тряпицей кровь с аугментированной руки. Оторвав взгляд от импланта, он устало кивает.
  - speaker: Соломон Антар
    text_clean: Вольный Торговец?
- guid: 6d0878ca-2064-465c-8e74-ff9f38e236b2
  event: CompanionDialogue_Solomorne_81
  text: '"Для начала надо понять, как сами ксеносы выбираются отсюда — как просачиваются в Коронус, чтобы грабить, убивать и брать пленных. А когда мы это поймем, то надо будет пробиваться к выходу с боем — для этого уже сейчас надо искать умелых бойцов".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Для начала надо понять, как сами ксеносы выбираются отсюда — как просачиваются в Коронус, чтобы грабить, убивать и брать пленных. А когда мы это поймем, то надо будет пробиваться к выходу с боем — для этого уже сейчас надо искать умелых бойцов.
- guid: 28bd0660-2af1-431f-8e66-a2cea6c5b514
  event: CompanionDialogue_Solomorne_82
  text: '"Хотя последнее уже не актуально с тех пор, как Ангел Императора присоединился к вам. Какое еще боевое подкрепление можно желать, дредноут?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Хотя последнее уже не актуально с тех пор, как Ангел Императора присоединился к вам. Какое еще боевое подкрепление можно желать, дредноут?
- guid: 0104a47f-75ab-49a8-a5ff-8ab93363701c
  event: CompanionDialogue_Solomorne_83
  text: '"Не могу. Не потому что не доверяю вам, а потому что не хочу, чтобы мои суждения толкнули вас на опрометчивый поступок — возможно, враг именно этого и ждет. Мы должны отправиться к маршалу и расследовать это дело строго в рамках Лекс Империалис. Только так удастся избежать ошибки".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не могу. Не потому что не доверяю вам, а потому что не хочу, чтобы мои суждения толкнули вас на опрометчивый поступок — возможно, враг именно этого и ждет. Мы должны отправиться к маршалу и расследовать это дело строго в рамках Лекс Империалис. Только так удастся избежать ошибки.
- guid: a81a215b-dda0-4285-8aa2-2042de6f586d
  event: CompanionDialogue_Solomorne_84
  text: '"Иногда я позволяю ему поиграть с трупами еретиков". {n}Соломон выдерживает паузу.{/n} "Шутка. Если вы спрашиваете про развлечения, то само это слово плохо применимо к служебной собаке Арбитес. Однако мне кажется, что Глейто с энтузиазмом воспринимает мои персональные тренировки. Ему нравится сопровождать меня в беге на долгие дистанции, и во время стрелковой практики он всегда ждет, что я дам ему приказ атаковать мишень".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Иногда я позволяю ему поиграть с трупами еретиков.
  - speaker: narrator
    text_clean: Соломон выдерживает паузу.
  - speaker: Соломон Антар
    text_clean: Шутка. Если вы спрашиваете про развлечения, то само это слово плохо применимо к служебной собаке Арбитес. Однако мне кажется, что Глейто с энтузиазмом воспринимает мои персональные тренировки. Ему нравится сопровождать меня в беге на долгие дистанции, и во время стрелковой практики он всегда ждет, что я дам ему приказ атаковать мишень.
- guid: b47c822f-f05a-4d75-b272-d6e034d21f34
  event: CompanionDialogue_Solomorne_85
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "В таком случае мой ответ на ваш вопрос — да".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Во взгляде арбитра возникает теплый огонек.
  - speaker: Соломон Антар
    text_clean: В таком случае мой ответ на ваш вопрос — да.
- guid: fb389619-48ce-419d-8d3d-b5baf2947c2a
  event: CompanionDialogue_Solomorne_86
  text: '"Этот приказ я исполню с удовольствием".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Этот приказ я исполню с удовольствием.
- guid: 473af26c-5954-4912-be30-d254a4631751
  event: CompanionDialogue_Solomorne_87
  text: '{n}Арбитес чуть кашляет.{/n} "Ладно, удовлетворю ваш интерес. Есть у меня одна особая тренировка, которая помогает оттачивать охотничьи инстинкты Глейто: я беру несколько гильз и прячу их в труднодоступных местах. Как-то раз после рейда на мануфакторум я устроил Глейто раздолье в заброшенном цехе, но с одной гильзой схитрил и закинул ее на потолочную балку. Тогда уже схитрил Глейто — сидел под балкой, пока я не подошел, прыгнул мне на плечи и забрался наверх. Раскроил мне когтем висок и чуть ключицу не сломал, но до гильзы добрался".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитес чуть кашляет.
  - speaker: Соломон Антар
    text_clean: 'Ладно, удовлетворю ваш интерес. Есть у меня одна особая тренировка, которая помогает оттачивать охотничьи инстинкты Глейто: я беру несколько гильз и прячу их в труднодоступных местах. Как-то раз после рейда на мануфакторум я устроил Глейто раздолье в заброшенном цехе, но с одной гильзой схитрил и закинул ее на потолочную балку. Тогда уже схитрил Глейто — сидел под балкой, пока я не подошел, прыгнул мне на плечи и забрался наверх. Раскроил мне когтем висок и чуть ключицу не сломал, но до гильзы добрался.'
- guid: 00af0b89-a6f4-4c26-8605-7c3ca4787322
  event: CompanionDialogue_Solomorne_88
  text: '"Я редко ошибаюсь в таких вопросах, Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Я редко ошибаюсь в таких вопросах, Вольный Торговец.
- guid: b1194019-b6b9-44ce-9931-fdc67ca3704b
  event: CompanionDialogue_Solomorne_89
  text: '"Слушаюсь, Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Слушаюсь, Вольный Торговец.
- guid: 347025fe-2fe4-48e6-8107-a64aec406032
  event: CompanionDialogue_Solomorne_90
  text: '"У нас нет доказательств, что это одни и те же наемники. Враг хорошо заметает следы, и нам тоже надо быть осторожными".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: У нас нет доказательств, что это одни и те же наемники. Враг хорошо заметает следы, и нам тоже надо быть осторожными.
- guid: 555bf601-147f-4c83-891d-14851b9ed4f3
  event: CompanionDialogue_Solomorne_91
  text: '"Я пришел к тем же выводам. Саргона никогда не покушался на слишком большие куски: десятину Райкада ему было не проглотить — на него охотились бы не только Арбитес, но и преступники, желающие растащить подать на части. Саргона действовал по чьей-то указке и не боялся следствий".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: 'Я пришел к тем же выводам. Саргона никогда не покушался на слишком большие куски: десятину Райкада ему было не проглотить — на него охотились бы не только Арбитес, но и преступники, желающие растащить подать на части. Саргона действовал по чьей-то указке и не боялся следствий.'
- guid: a2b62474-bacc-4b25-a6f8-ea7298623b02
  event: CompanionDialogue_Solomorne_92
  text: '"Верно, поговорим лучше о другом".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Верно, поговорим лучше о другом.
- guid: bcf2aead-9ecd-4e73-bf32-cdba31c73056
  event: CompanionDialogue_Solomorne_93
  text: '"Маршал может увидеть в таком решении знак, что союз между вашей династией и Арбитес будет разорван. Что я должен передать ему?"'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Маршал может увидеть в таком решении знак, что союз между вашей династией и Арбитес будет разорван. Что я должен передать ему?
- guid: e181e118-9762-4b98-80d6-5bbd69579719
  event: CompanionDialogue_Solomorne_94
  text: '"Как прикажете". {n}Лицо проктора остается непроницаемым.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Как прикажете.
  - speaker: narrator
    text_clean: Лицо проктора остается непроницаемым.
- guid: b60787c9-2ced-4ab3-97e9-06f221b78c2b
  event: CompanionDialogue_Solomorne_95
  text: '"Принято. Я покину флагман при первой же возможности и сообщу маршалу ваши слова. Прощайте, Вольный Торговец".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Принято. Я покину флагман при первой же возможности и сообщу маршалу ваши слова. Прощайте, Вольный Торговец.
- guid: 82c3e3f6-6844-40f0-926a-da420f7e5f39
  event: CompanionDialogue_Solomorne_96
  text: '"Все, что оттачивает навыки и инстинкты Глейто и полезно при исполнении долга".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Все, что оттачивает навыки и инстинкты Глейто и полезно при исполнении долга.
- guid: 4f8366b5-ddf0-4b12-9f89-68d1152afc89
  event: CompanionDialogue_Solomorne_97
  text: '"Не умею? Да я танцевал". {n}Соломон говорит это таким голосом, каким иные признаются в страшной ереси.{/n} "Боюсь представить, что для вас значит веселье, если нашего танца на Тассере вам оказалось мало".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не умею? Да я танцевал.
  - speaker: narrator
    text_clean: Соломон говорит это таким голосом, каким иные признаются в страшной ереси.
  - speaker: Соломон Антар
    text_clean: Боюсь представить, что для вас значит веселье, если нашего танца на Тассере вам оказалось мало.
- guid: b37dda54-6ac1-4a18-99b1-225cfcbaa4f9
  event: CompanionDialogue_Solomorne_98
  text: '"Понимаю. Этот суд был беспрецедентным, как и его финал".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Понимаю. Этот суд был беспрецедентным, как и его финал.
- guid: 31d69f7b-0cb2-4a44-8093-273bc1e5e148
  event: CompanionDialogue_Solomorne_99
  text: '"Зависит от того, как много из нас окажутся неблагонадежными. Тщательное расследование выявит это, но даже если нас останется с десяток, мы все равно будем до последнего вздоха служить закону Его".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Зависит от того, как много из нас окажутся неблагонадежными. Тщательное расследование выявит это, но даже если нас останется с десяток, мы все равно будем до последнего вздоха служить закону Его.
- guid: 70635284-2f18-4170-a155-401d0ac03471
  event: OfficialPropos_Solomorne_01
  text: '{n}Лицо Соломона непроницаемо. Он сверлит взглядом инфопластину в ваших руках. Наконец он с удивительной мягкостью произносит:{/n} "Полагаю, вы желаете объяснений".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Лицо Соломона непроницаемо. Он сверлит взглядом инфопластину в ваших руках. Наконец он с удивительной мягкостью произносит:'
  - speaker: Соломон Антар
    text_clean: Полагаю, вы желаете объяснений.
- guid: 33cbba8f-95a0-4cdf-a0ab-1e70df5c5114
  event: OfficialPropos_Solomorne_02
  text: '"Если это не взаимно — скажите, я пойму. В противном случае — я приношу извинения за необдуманные слова и хочу забрать их назад".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Если это не взаимно — скажите, я пойму. В противном случае — я приношу извинения за необдуманные слова и хочу забрать их назад.
- guid: a1b257c0-d3cf-4432-8643-ac295eac7807
  event: OfficialPropos_Solomorne_03
  text: '"Если это доставит вам удовольствие, я напрягусь и смогу выучить вторую". {n}Бросив на вас многозначительный взгляд, он добавляет:{/n} "Для вас я могу все что угодно".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Если это доставит вам удовольствие, я напрягусь и смогу выучить вторую.
  - speaker: narrator
    text_clean: 'Бросив на вас многозначительный взгляд, он добавляет:'
  - speaker: Соломон Антар
    text_clean: Для вас я могу все что угодно.
- guid: 7622359c-f1d2-4ae2-8c50-35d55b953294
  event: OfficialPropos_Solomorne_04
  text: '"Поверьте, далеко не единственный". {n}Скупая, но от того не менее двусмысленная улыбка возникает на губах арбитра.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Поверьте, далеко не единственный.
  - speaker: narrator
    text_clean: Скупая, но от того не менее двусмысленная улыбка возникает на губах арбитра.
- guid: 50be2d41-e198-4ba3-8b80-4725b4cd20a4
  event: OfficialPropos_Solomorne_05
  text: '"Слава Императору нет. Но однажды мне довелось конвоировать в столицу сектора Каликсис некую персону особой важности. Сам губернатор ожидал его. Я провел восемь терранских месяцев в запечатанных покоях наедине с ним, пока корабль шел к Сцинтилле. Не знаю, кем он был, и какая важность вознесла его в ранг опекаемых Адептус Арбитис субъектов. Знаю лишь, что он очень любил играть на органе эту мелодию. Я запомнил ее".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Слава Императору нет. Но однажды мне довелось конвоировать в столицу сектора Каликсис некую персону особой важности. Сам губернатор ожидал его. Я провел восемь терранских месяцев в запечатанных покоях наедине с ним, пока корабль шел к Сцинтилле. Не знаю, кем он был, и какая важность вознесла его в ранг опекаемых Адептус Арбитис субъектов. Знаю лишь, что он очень любил играть на органе эту мелодию. Я запомнил ее.
- guid: 6c95868a-f7f2-4054-a17c-9b278291206b
  event: OfficialPropos_Solomorne_06
  text: '{n}Не отрываясь от клавиш, Соломон изрекает:{/n} "По крайней мере вам весело. Уже неплохо".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Не отрываясь от клавиш, Соломон изрекает:'
  - speaker: Соломон Антар
    text_clean: По крайней мере вам весело. Уже неплохо.
- guid: 9c8374ca-092e-4999-af64-846e521670d3
  event: OfficialPropos_Solomorne_07
  text: '"Все, что я делаю, я стараюсь делать хорошо". {n}Арбитр прищуривается, извлекая из инструмента прихотливый пассаж одной рукой и убрав за спину другую.{/n} "Даже идеально".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Все, что я делаю, я стараюсь делать хорошо.
  - speaker: narrator
    text_clean: Арбитр прищуривается, извлекая из инструмента прихотливый пассаж одной рукой и убрав за спину другую.
  - speaker: Соломон Антар
    text_clean: Даже идеально.
- guid: b3df8a1d-c3ed-40e4-95ea-5bb847de61e5
  event: OfficialPropos_Solomorne_08
  text: '"Не назвал бы себя опытным в этом вопросе. Прежде я не встречал людей, которые увлекали бы меня настолько сильно. Я просто предпочитаю говорить как есть".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Не назвал бы себя опытным в этом вопросе. Прежде я не встречал людей, которые увлекали бы меня настолько сильно. Я просто предпочитаю говорить как есть.
- guid: f7f8fffb-e646-428f-8bea-baa5ef94c0c6
  event: OfficialPropos_Solomorne_09
  text: '{n}Арбитр недовольно прищуривается.{/n} "Глупая ошибка. Я работал в кают-компании на выделенном мне месте и банально забыл инфопластину, а Глейто — опознал его как мою важную собственность, потому перешел в режим охраны. И начал отгонять всех, кто мог на него посягнуть".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитр недовольно прищуривается.
  - speaker: Соломон Антар
    text_clean: Глупая ошибка. Я работал в кают-компании на выделенном мне месте и банально забыл инфопластину, а Глейто — опознал его как мою важную собственность, потому перешел в режим охраны. И начал отгонять всех, кто мог на него посягнуть.
- guid: 92fc046e-a2b5-4657-96f0-e84d03ef51fe
  event: OfficialPropos_Solomorne_10
  text: '{n}Отняв руку от клавиш, он привлекает вас к себе уверенным и сильным движением. Клавиши под весом вашего тела издают пронзительный вскрик. Соломон дарит вам белоснежную улыбку.{/n} "Я рад, что ты дал{mf||а} мне еще один шанс".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Отняв руку от клавиш, он привлекает вас к себе уверенным и сильным движением. Клавиши под весом вашего тела издают пронзительный вскрик. Соломон дарит вам белоснежную улыбку.
  - speaker: Соломон Антар
    text_clean: Я рад, что ты дал мне еще один шанс.
- guid: 0b01eb02-6f18-4996-b689-7c4b8e63a42c
  event: OfficialPropos_Solomorne_11
  text: '{n}Искоса взглянув на вас и не прекращая играть, Соломон тихо произносит:{/n} "Раньше я ни для кого не играл. Это — мой знак внимания".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Искоса взглянув на вас и не прекращая играть, Соломон тихо произносит:'
  - speaker: Соломон Антар
    text_clean: Раньше я ни для кого не играл. Это — мой знак внимания.
- guid: ca2dea54-9a12-4b4b-9fd2-68dcb37100a2
  event: OfficialPropos_Solomorne_12
  text: '{n}Уголки рта Соломона чуть поднимаются.{/n} "Если вы имеете ввиду, что я показал себя растяпой — то полностью согласен. И рад, что извлеку этот урок из события, которое не повлекло трагедии".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Уголки рта Соломона чуть поднимаются.
  - speaker: Соломон Антар
    text_clean: Если вы имеете ввиду, что я показал себя растяпой — то полностью согласен. И рад, что извлеку этот урок из события, которое не повлекло трагедии.
- guid: a60aeaf4-a2b5-4b10-b1b5-8547d35dc398
  event: OfficialPropos_Solomorne_13
  text: '{n}Арбитр на миг застывает, на его губах возникает скупая, но дерзкая улыбка.{/n} "Я могу показать".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитр на миг застывает, на его губах возникает скупая, но дерзкая улыбка.
  - speaker: Соломон Антар
    text_clean: Я могу показать.
- guid: dad16078-8fec-4d5f-9707-e9a007eae4cc
  event: OfficialPropos_Solomorne_14
  text: '{n}Соломон кивает.{/n} "Намного больше. И намного значимее для меня. Не смею претендовать на официальный статус, но обещаю вам свои дружбу, верность, терпение..." {n}Арбитр хмыкает.{/n} "Говорю как идиот, верно? Вы мне просто очень нравитесь, {name}. И я хотел бы выражать это чувство открыто".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон кивает.
  - speaker: Соломон Антар
    text_clean: Намного больше. И намного значимее для меня. Не смею претендовать на официальный статус, но обещаю вам свои дружбу, верность, терпение...
  - speaker: narrator
    text_clean: Арбитр хмыкает.
  - speaker: Соломон Антар
    text_clean: Говорю как идиот, верно? Вы мне просто очень нравитесь, КЭП. И я хотел бы выражать это чувство открыто.
- guid: ca543040-3424-44ae-874a-9ade0bddcb4f
  event: OfficialPropos_Solomorne_16
  text: '"Думаю, все же обязан. Чтобы между нами все было прозрачно".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Думаю, все же обязан. Чтобы между нами все было прозрачно.
- guid: 6050e974-4d72-4413-a988-dfa6dde118ca
  event: OfficialPropos_Solomorne_17
  text: '{n}Соломон клятвенно поднимает сжатый кулак и качает головой.{/n} "Нет. Я не выведываю чужих тайн и не осуществляю тайного наблюдения. Лишь записываю то, что вижу. Хранить бдительность — мой долг".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Соломон клятвенно поднимает сжатый кулак и качает головой.
  - speaker: Соломон Антар
    text_clean: Нет. Я не выведываю чужих тайн и не осуществляю тайного наблюдения. Лишь записываю то, что вижу. Хранить бдительность — мой долг.
- guid: 11d06807-617e-45a1-9924-3f84c4194b6d
  event: OfficialPropos_Solomorne_18
  text: '"Прошу простить. Это не повторится". {n}Напряженная поза Соломона чуть расслабляется, на лице возникает тень странного облегчения.{/n} "Разрешите идти".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Прошу простить. Это не повторится.
  - speaker: narrator
    text_clean: Напряженная поза Соломона чуть расслабляется, на лице возникает тень странного облегчения.
  - speaker: Соломон Антар
    text_clean: Разрешите идти.
- guid: 91e4ec1f-6686-48a6-906d-8df5b64c82f2
  event: OfficialPropos_Solomorne_19
  text: '{n}Арбитр победно прищуривается.{/n} "Согласен на звание хоть придворного органиста, если вы не попросите меня сыграть что-нибудь еще. Я знаю только эту композицию".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: Арбитр победно прищуривается.
  - speaker: Соломон Антар
    text_clean: Согласен на звание хоть придворного органиста, если вы не попросите меня сыграть что-нибудь еще. Я знаю только эту композицию.
- guid: 84b2a590-cc54-487f-857d-eaf5b7930acf
  event: OfficialPropos_Solomorne_20
  text: '{n}Арбитр хранит долгую паузу, а затем решительно рубит:{/n} "Я свалял дурака той ночью. Между нами возникла близость, и это... возможно, это меня встревожило. Или я не был готов испытать сильное чувство. Но я его испытал — я думаю о вас и о том, что могло бы между нами быть".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Арбитр хранит долгую паузу, а затем решительно рубит:'
  - speaker: Соломон Антар
    text_clean: Я свалял дурака той ночью. Между нами возникла близость, и это... возможно, это меня встревожило. Или я не был готов испытать сильное чувство. Но я его испытал — я думаю о вас и о том, что могло бы между нами быть.
- guid: 095bbde1-13f3-436b-84b9-4c5b20cb6257
  event: OfficialPropos_Solomorne_21
  text: '"С ним все будет в порядке, Глейто {d|Encyclopedia:RMC_DogInjuredDecision}не получил серьезных ран{/d}. Благодарю, что вы не были с ним слишком суровы".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: С ним все будет в порядке, Глейто не получил серьезных ран. Благодарю, что вы не были с ним слишком суровы.
- guid: 7aa154db-4d69-4c4f-b168-c2d108a39212
  event: OfficialPropos_Solomorne_22
  text: '{n}Пока вы зачитываете идею совместно посетить священнослужение в реликварии, Соломон сохраняет каменное выражение лица. Мысль о романтическом свидании под витражами корабельного обсерваториума приветствует едва слышно скрипнувшими зубами. На строчке "может, бутылка хорошего амасека и перстень побогаче, реквизированный у какого-нибудь рвача-чинуши?" его глаз нервно дергается. Но стоит вам начать читать вслух строчки некоего пафосного — и явно откуда-то украденного, — признания в любви, как он громогласно фыркает, чудовищным усилием подавляет улыбку и заявляет:{/n} "Прошу вас. Я готов выглядеть в ваших глазах идиотом — я определенно это заслужил, — но оставьте мне хотя бы крохи самоуважения".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Пока вы зачитываете идею совместно посетить священнослужение в реликварии, Соломон сохраняет каменное выражение лица. Мысль о романтическом свидании под витражами корабельного обсерваториума приветствует едва слышно скрипнувшими зубами. На строчке "может, бутылка хорошего амасека и перстень побогаче, реквизированный у какого-нибудь рвача-чинуши?" его глаз нервно дергается. Но стоит вам начать читать вслух строчки некоего пафосного — и явно откуда-то украденного, — признания в любви, как он громогласно фыркает, чудовищным усилием подавляет улыбку и заявляет:'
  - speaker: Соломон Антар
    text_clean: Прошу вас. Я готов выглядеть в ваших глазах идиотом — я определенно это заслужил, — но оставьте мне хотя бы крохи самоуважения.
- guid: 669af65c-fb6a-43e6-8812-1e6639ee8754
  event: OfficialPropos_Solomorne_23
  text: '{n}Соломон вновь надолго задумывается, а затем с сомнением произносит:{/n} "Поди знай... Если я скажу, что вы — особенн{mf|ый|ая}, это будет звучать банально, да? Но так и есть. Прежде я не встречал людей, подобных вам".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Соломон вновь надолго задумывается, а затем с сомнением произносит:'
  - speaker: Соломон Антар
    text_clean: Поди знай... Если я скажу, что вы — особенный, это будет звучать банально, да? Но так и есть. Прежде я не встречал людей, подобных вам.
- guid: 83734272-96bc-4709-b009-890fd02f5039
  event: OfficialPropos_Solomorne_24
  text: '"На этой инфопластине — мой журнал наблюдений за вами и членами вашей свиты. В ней я фиксирую привычки, особенности характера, заслуживающие внимания факты. И, если говорить о вашей персоне... не только их. Думаю, вы уже обнаружили там записи иного характера — размышления о том, как можно было бы оказать знак внимания Вольному Торговцу". {n}Взгляд из-под чуть опущенных бровей можно было бы счесть лукавым в исполнении менее сурового человека.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: На этой инфопластине — мой журнал наблюдений за вами и членами вашей свиты. В ней я фиксирую привычки, особенности характера, заслуживающие внимания факты. И, если говорить о вашей персоне... не только их. Думаю, вы уже обнаружили там записи иного характера — размышления о том, как можно было бы оказать знак внимания Вольному Торговцу.
  - speaker: narrator
    text_clean: Взгляд из-под чуть опущенных бровей можно было бы счесть лукавым в исполнении менее сурового человека.
- guid: db44677c-7d11-4e3c-b784-3618aeb9967a
  event: OfficialPropos_Solomorne_25
  text: '"В дальнейшем я не повторю подобной глупости".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: В дальнейшем я не повторю подобной глупости.
- guid: 9bbf2ef5-c943-4846-930e-f3dce5931882
  event: OfficialPropos_Solomorne_26
  text: '{n}Соломон кисло изрекает:{/n} "Да, мне она тоже подарила... незабываемые ощущения".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Соломон кисло изрекает:'
  - speaker: Соломон Антар
    text_clean: Да, мне она тоже подарила... незабываемые ощущения.
- guid: ccfa52cb-c200-4adf-8f36-f2745c6d20a0
  event: OfficialPropos_Solomorne_27
  text: '"Знаете, {name}, вам повезло, что Глейто не оттяпал вам руку, пока вы отбирали у него инфопластину. Уверен, ему было непросто решить, чья безопасность важнее — ваша или моих записей".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Знаете, КЭП, вам повезло, что Глейто не оттяпал вам руку, пока вы отбирали у него инфопластину. Уверен, ему было непросто решить, чья безопасность важнее — ваша или моих записей.
- guid: fa36b7ca-126b-490b-a289-e7badd298a9a
  event: OfficialPropos_Solomorne_28
  text: '"Это было бы неслыханным коварством для арбитра. Боюсь, что вы переоцениваете мою находчивость". {n}По лицу Соломона сложно оценить искренность его слов.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Это было бы неслыханным коварством для арбитра. Боюсь, что вы переоцениваете мою находчивость.
  - speaker: narrator
    text_clean: По лицу Соломона сложно оценить искренность его слов.
- guid: abc9a3c7-fcfb-4b3d-8210-42bca5123669
  event: RM_ArbitesFirstMeeting_Solomorne_01
  text: '{n}Могучего телосложения мужчина осматривает поле брани. Его лицо, волевое и бесстрастное, напоминает о статуях героев Империума. Задержавшись на вас взглядом, он поднимает вверх железный кулак:{/n} "Арбитры — периметр. Формация — сорок семь пятьдесят пять. Глейто — рядом".'
  speaker: Соломон Антар
  parts:
  - speaker: narrator
    text_clean: 'Могучего телосложения мужчина осматривает поле брани. Его лицо, волевое и бесстрастное, напоминает о статуях героев Империума. Задержавшись на вас взглядом, он поднимает вверх железный кулак:'
  - speaker: Соломон Антар
    text_clean: Арбитры — периметр. Формация — сорок семь пятьдесят пять. Глейто — рядом.
- guid: 91ca152a-77cf-40ec-bfbd-2ec7e2b08f5e
  event: RM_ArbitesFirstMeeting_Solomorne_02
  text: '"{g|Encyclopedia:ProctorGlossary}Проктор-взыскатель{/g} Соломон Антар, {g|Encyclopedia:AdeptusArbitesGlossary}Адептус Арбитес{/g}. Назовите свое имя и цель пребывания на Райкаде Минорис". {n}Его голос звучит спокойно и ровно, но пальцы застыли на курке оружия.{/n}'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Проктор-взыскатель Соломон Антар, Адептус Арбитес. Назовите свое имя и цель пребывания на Райкаде Минорис.
  - speaker: narrator
    text_clean: Его голос звучит спокойно и ровно, но пальцы застыли на курке оружия.
- guid: e21394e4-384b-4f7c-a992-a691773a1de2
  event: RM_ArbitesFirstMeeting_Solomorne_03
  text: '"Вольный Торговец? У Инцендии Чорда нет наследников, а преемников Каллигоса Винтерскейла я знаю наперечет".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вольный Торговец? У Инцендии Чорда нет наследников, а преемников Каллигоса Винтерскейла я знаю наперечет.
- guid: 617d9bd8-dcb9-4906-900c-d7d4642b061e
  event: RM_ArbitesFirstMeeting_Solomorne_04
  text: '"Значит, Теодора фон Валанциус мертва. Я передам маршалу Страксу эту прискорбную весть".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Значит, Теодора фон Валанциус мертва. Я передам маршалу Страксу эту прискорбную весть.
- guid: 4ce1a45f-7569-4808-8456-508016a2e6b8
  event: RM_ArbitesFirstMeeting_Solomorne_05
  text: '"Избавляемся от препятствий на пути официального расследования". {n}На каменном лице нет ни намека на улыбку.{/n} "Я прибыл с отрядом для расследования пропажи крайне ценного судна, но в процессе нас отвлекает мятежное отребье. Приходится попутно заниматься им".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Избавляемся от препятствий на пути официального расследования.
  - speaker: narrator
    text_clean: На каменном лице нет ни намека на улыбку.
  - speaker: Соломон Антар
    text_clean: Я прибыл с отрядом для расследования пропажи крайне ценного судна, но в процессе нас отвлекает мятежное отребье. Приходится попутно заниматься им.
- guid: c1444632-c737-4cea-99ca-7d2dacc64193
  event: RM_ArbitesFirstMeeting_Solomorne_06
  text: '"Только то, что губернатор плохо справляется со своими обязанностями". {n}Арбитр говорит сухо, словно констатирует факт.{/n} "Бушует бунт планетарного масштаба, и от него разит безумием или того хуже — колдовством. Мятежники ослепляют себя и других и несут самый больной и нечестивый бред, какой я только слышал".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Только то, что губернатор плохо справляется со своими обязанностями.
  - speaker: narrator
    text_clean: Арбитр говорит сухо, словно констатирует факт.
  - speaker: Соломон Антар
    text_clean: Бушует бунт планетарного масштаба, и от него разит безумием или того хуже — колдовством. Мятежники ослепляют себя и других и несут самый больной и нечестивый бред, какой я только слышал.
- guid: 0d7546c9-7d8b-48e5-8632-f375c1ddaae9
  event: RM_ArbitesFirstMeeting_Solomorne_07
  text: '"О судне с десятиной". {n}Последнее слово мужчина произносит с особым нажимом.{/n} "Корабль, набитый планетарной податью за внушительный период, не выходит на связь с тех пор, как покинул Райкад Минорис".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: О судне с десятиной.
  - speaker: narrator
    text_clean: Последнее слово мужчина произносит с особым нажимом.
  - speaker: Соломон Антар
    text_clean: Корабль, набитый планетарной податью за внушительный период, не выходит на связь с тех пор, как покинул Райкад Минорис.
- guid: d71f12d9-4592-4078-be15-825dcefeec11
  event: RM_ArbitesFirstMeeting_Solomorne_08
  text: '"Пробиваться с боем к дворцу Администратума и убедиться, что пожар или другое бедствие не уничтожило важные для следствия бумаги — надеюсь, у клерков хватило ума спасать в первую очередь записи, а не свои жизни. Если Император будет благоволить нам, мы успеем изъять важные данные или допросить выживших, а после нанесем визит губернатору — к нему накопились вопросы".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Пробиваться с боем к дворцу Администратума и убедиться, что пожар или другое бедствие не уничтожило важные для следствия бумаги — надеюсь, у клерков хватило ума спасать в первую очередь записи, а не свои жизни. Если Император будет благоволить нам, мы успеем изъять важные данные или допросить выживших, а после нанесем визит губернатору — к нему накопились вопросы.
- guid: a7b4ac62-4e50-47a2-9630-d547104a9f98
  event: RM_ArbitesFirstMeeting_Solomorne_09
  text: '"Вынужден отказать. Наша миссия и приказ маршала имеют высший приоритет, даже перед просьбой такой важной особы, как вы".'
  speaker: Соломон Антар
  parts:
  - speaker: Соломон Антар
    text_clean: Вынужден отказать. Наша миссия и приказ маршала имеют высший приоритет, даже перед просьбой такой важной особы, как вы.
- guid: 50e919be-19f5-4c45-88c0-452e4d2b9d41
