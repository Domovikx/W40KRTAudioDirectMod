- guid: 26294739-43bc-4d13-9a12-2010140421b6
  event: Companions_Marazhai_40
  text: '"Кабалы — основа, на которой покоится власть того, кто правит Комморрой, Асдрубаэля Векта. Будь это свора берсерков или организованный картель, суть их одинакова: это армия головорезов, готовых терзать целые миры на потребу своих предводителей или резать глотки соседнего кабала в войне, объявленной архонтами".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: 'Кабалы — основа, на которой покоится власть того, кто правит Комморрой, Асдрубаэля Векта. Будь это свора берсерков или организованный картель, суть их одинакова: это армия головорезов, готовых терзать целые миры на потребу своих предводителей или резать глотки соседнего кабала в войне, объявленной архонтами.'
- guid: d6d505de-5ea3-4093-a030-3968dc4a8d2a
  event: Companions_Marazhai_41
  text: '"Гордецы инкубы... они посвящают свою жизнь искусству убийства — настолько, что не плетут интриг и не гоняются за изысканными страданиями. Вся их ненависть и все стремление к мучению направлены на совершенствование их мастерства".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Гордецы инкубы... они посвящают свою жизнь искусству убийства — настолько, что не плетут интриг и не гоняются за изысканными страданиями. Вся их ненависть и все стремление к мучению направлены на совершенствование их мастерства.
- guid: a168fa1d-a358-4093-baf1-ff24fa6fb7df
  event: Companions_Marazhai_42
  text: '"Друкари-крыланы. Генетически измененные стервятники с нарощенными крыльями. Они сопровождают рейдерские корабли и первыми бьют по врагу. В Комморре эти твари сбиваются в стаи, чтобы не пасть жертвой более могущественных собратьев".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Друкари-крыланы. Генетически измененные стервятники с нарощенными крыльями. Они сопровождают рейдерские корабли и первыми бьют по врагу. В Комморре эти твари сбиваются в стаи, чтобы не пасть жертвой более могущественных собратьев.
- guid: 31136748-7660-4d79-a59d-468e144ac5dc
  event: Companions_Marazhai_43
  text: '"Что еще тебе нужно про них знать, что ты не видел{mf||а} своими глазами? Хозяйки арен и гладиаторы, что кормят жадную до боли публику изысканными представлениями. Культы часто отправляются в реальный мир с рейдами кабалов — чтобы насладиться болью самим и захватить свежее мясо для своих арен".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Что еще тебе нужно про них знать, что ты не видел своими глазами? Хозяйки арен и гладиаторы, что кормят жадную до боли публику изысканными представлениями. Культы часто отправляются в реальный мир с рейдами кабалов — чтобы насладиться болью самим и захватить свежее мясо для своих арен.
- guid: 826e52ff-ab0b-4b67-abc4-2b5b9c259f8e
  event: Companions_Marazhai_44
  text: '"Творцы плоти, что предпочитают скрываться в своих лабораториях и творить кошмары из тех материалов, что поставляют им их слуги. Орудия боли, гротески, развалины — все это плоды их тонкого ремесла".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Творцы плоти, что предпочитают скрываться в своих лабораториях и творить кошмары из тех материалов, что поставляют им их слуги. Орудия боли, гротески, развалины — все это плоды их тонкого ремесла.
