- guid: 4e6e51b7-0e84-49ca-a5de-a5dd533f379d
  event: BNTRS_DLC2_Marazhai_34
  text: '"Удивительно. Сильный, тупой и уродливый — первый раз вижу, чтобы гемункулу не надо было дорабатывать материал для развалины".'
  speaker: Маражай Аэзирраэш
