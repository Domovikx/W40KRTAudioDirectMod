    text_clean: Ха! Тебя по-настоящему гнетет существование среди мон-кай, раз ты вдруг начала изливать восторги в наш адрес.
- guid: fa8dd9ec-988c-49e7-abcc-0ff998669939
  event: BNTRS_DLC2_Marazhai_119
  text: '"Ты говоришь об убогости мысли, которая сделала прошлого мон-кай удобным инстументом в чужих руках. Очевидно, Вольный Торговец не желает подпускать к власти еще одного глупца".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты говоришь об убогости мысли, которая сделала прошлого мон-кай удобным инстументом в чужих руках. Очевидно, Вольный Торговец не желает подпускать к власти еще одного глупца.
- guid: 6811233f-2a09-4557-848b-73ad45bb1591
  event: BNTRS_DLC2_Marazhai_129
  text: '"Хотя бы перед смертью этот скучный мон-кай выкинул что-то забавное. Попытался укусить сво{mf|его|ю} хозя{mf|ина|йку} — неуклюже и безыскусно, конечно, но хотя бы так".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хотя бы перед смертью этот скучный мон-кай выкинул что-то забавное. Попытался укусить своего хозяина — неуклюже и безыскусно, конечно, но хотя бы так.
- guid: 93dba1b4-fe1c-4af1-bfb3-d4a4aa41f25f
  event: BNTRS_DLC2_Marazhai_15
  text: '"Ты продолжаешь коситься на меня, мон-кай. Напрасно — твой гнев слишком пресный для меня. И вдобавок предсказуемый — достаточно спросить, с какой части надо начинать разделывать твоего зверя..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты продолжаешь коситься на меня, мон-кай. Напрасно — твой гнев слишком пресный для меня. И вдобавок предсказуемый — достаточно спросить, с какой части надо начинать разделывать твоего зверя...
- guid: 890410a7-d6b9-4afe-8be4-aada9b97f3c2
  event: BNTRS_DLC2_Marazhai_155
  text: '"Воздух пронизан страхом добычи, которой некуда деться с этого мон-кайского ведра и которой остается только ждать, когда охотники доберутся до нее..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Воздух пронизан страхом добычи, которой некуда деться с этого мон-кайского ведра и которой остается только ждать, когда охотники доберутся до нее...
- guid: 71c65d84-10b5-4e72-998b-aebcf5aa86c9
  event: BNTRS_DLC2_Marazhai_191
  text: '"Какая напрасная трата... Можно было бы заставить их биться за право жить, а последнего медленно умертвить, наслаждаясь его отчаянием".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Какая напрасная трата... Можно было бы заставить их биться за право жить, а последнего медленно умертвить, наслаждаясь его отчаянием.
- guid: f44614f4-756c-4faf-9dde-3ce90d1603c0
  event: BNTRS_DLC2_Marazhai_226
  text: '"М-м-м, продолжай рычать, зверушка. Мы оба знаем, что ты не укусишь, пока хозя{mf|ин|йка} не позволит".'
  speaker: Маражай Аэзирраэш
