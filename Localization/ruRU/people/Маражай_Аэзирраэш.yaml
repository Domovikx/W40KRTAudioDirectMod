- guid: cf4fb072-79f1-4388-a965-66526c4cef9f
  event: BNTRS_Reactivity_Marazhai_79
  text: '"Я могу навестить заскучавший скот и в одиночку. Пожалуй, сделаю это при первой же возможности".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
