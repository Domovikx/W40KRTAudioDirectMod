- guid: 9631ce19-5f1c-4e40-8bf0-15bbe69c5e07
  event: Companions_Marazhai_08
  text: '"Потрошитель Иллиридоса, Сжигатель Баркагского царства и убийца Карроция Бледного... Иллиридосом назывался мир, населенный нашими дальними родичами-эльдарами — до того, как туда с жатвой явился мой рейд. Баркагское царство было отдельным кластером на границе Комморры до того, как вступило в войну с Опустошительной бурей. Я оставил его по колено залитым кровью его обитателей".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Потрошитель Иллиридоса, Сжигатель Баркагского царства и убийца Карроция Бледного... Иллиридосом назывался мир, населенный нашими дальними родичами-эльдарами — до того, как туда с жатвой явился мой рейд. Баркагское царство было отдельным кластером на границе Комморры до того, как вступило в войну с Опустошительной бурей. Я оставил его по колено залитым кровью его обитателей.
- guid: 4f930af8-da92-4515-b045-b68722d5f1ad
  event: Companions_Marazhai_09
  text: '"Дракон — первый клинок кабала Опустошительной бури. И тот, кто лишь на ступеньку ниже архонта. Дракон возглавляет рейды и войны с другими кабалами, держит в страхе спесивых истиннорожденных и выскочек из полуродков, имеет право на любого противника в любом бою. Когда-то у Иремерисс были и другие приближенные... но я позаботился о том, чтобы они постепенно исчезли, а новые кандидаты слишком боялись занять их место. Тогда-то моя сестра и связалась с орденом инкубов, которые стали ее телохранителями. Эти... не поддаются ни страху, ни подкупу".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Дракон — первый клинок кабала Опустошительной бури. И тот, кто лишь на ступеньку ниже архонта. Дракон возглавляет рейды и войны с другими кабалами, держит в страхе спесивых истиннорожденных и выскочек из полуродков, имеет право на любого противника в любом бою. Когда-то у Иремерисс были и другие приближенные... но я позаботился о том, чтобы они постепенно исчезли, а новые кандидаты слишком боялись занять их место. Тогда-то моя сестра и связалась с орденом инкубов, которые стали ее телохранителями. Эти... не поддаются ни страху, ни подкупу.
- guid: 59e68b11-981d-4e31-8902-37688e769df2
  event: Companions_Marazhai_10
  text: '{n}Маражай расплывается в улыбке.{/n} "Еще ни один мон-кай, оставленный наедине со мной и моим искусством боли, не спасался из омута страданий, в который я его погружал. Души твоих соплеменников хрупки. Их убеждения и принципы — самообман, дающих их жизни подобие смысла. У нас было много времени, пока я дожидался твоего прибытия. Когда Ахиллеас вышел тебе навстречу — он уже был предан мне. Я купил его обещанием никогда больше не прикасаться ни к его телу, ни к разуму".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай расплывается в улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Еще ни один мон-кай, оставленный наедине со мной и моим искусством боли, не спасался из омута страданий, в который я его погружал. Души твоих соплеменников хрупки. Их убеждения и принципы — самообман, дающих их жизни подобие смысла. У нас было много времени, пока я дожидался твоего прибытия. Когда Ахиллеас вышел тебе навстречу — он уже был предан мне. Я купил его обещанием никогда больше не прикасаться ни к его телу, ни к разуму.
- guid: 6b187be7-f5f9-49dd-bcca-25f954c0f73f
  event: Companions_Marazhai_100
  text: '"С превеликой радостью, {name}. Едва ли после такого разочарования я имею подобное желание".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: С превеликой радостью, КЭП. Едва ли после такого разочарования я имею подобное желание.
- guid: 0031c3ef-9c12-4ac0-8f1b-39a6667296ad
  event: Companions_Marazhai_101
  text: '"О нет, {name}. Так легко ты не отделаешься. Я найду достойное наказание за этот проступок".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: О нет, КЭП. Так легко ты не отделаешься. Я найду достойное наказание за этот проступок.
- guid: d3332a9a-aaf0-4c8b-81f7-9a439bc1f71b
  event: Companions_Marazhai_102
  text: '"Повинуюсь твоему слову, {name}". {n}В тоне Маражая нет и намека на истинную покорность.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Повинуюсь твоему слову, КЭП.
  - speaker: narrator
    text_clean: В тоне Маражая нет и намека на истинную покорность.
- guid: 3470d2d1-de0e-4aa3-95e7-afc47f2ae0ce
  event: Companions_Marazhai_103
  text: '"Тервантьяс — союзник Иремерисс, не мой. Опустошительная буря покровительствовала ему — как и культу ведьм с Арены. Я обращался к его искусству несколько раз... и каждый раз это было непросто: в последнее время он больше отсутствовал, чем находился в Комморре. Скорее всего — был в каком-то из своих логовищ, где прятал иные эксперименты и работы".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: 'Тервантьяс — союзник Иремерисс, не мой. Опустошительная буря покровительствовала ему — как и культу ведьм с Арены. Я обращался к его искусству несколько раз... и каждый раз это было непросто: в последнее время он больше отсутствовал, чем находился в Комморре. Скорее всего — был в каком-то из своих логовищ, где прятал иные эксперименты и работы.'
- guid: bc8dc3f0-594b-4eab-af32-8243634549f6
  event: Companions_Marazhai_104
  text: '{n}Друкари суживает глаза, но ничего не говорит вам в ответ.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари суживает глаза, но ничего не говорит вам в ответ.
- guid: 9aa65218-1381-49e9-99c7-b2dc5aafa043
  event: Companions_Marazhai_105
  text: '{n}Друкари бросает на вас ненавидящий взгляд.{/n} "Надо сказать, Назракею не требовалось много труда обернуть суд против меня — не после того, что ты устроил{mf||а} перед собранием архонтов".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари бросает на вас ненавидящий взгляд.
  - speaker: Маражай Аэзирраэш
    text_clean: Надо сказать, Назракею не требовалось много труда обернуть суд против меня — не после того, что ты устроил перед собранием архонтов.
- guid: c9a0b073-6779-47fd-81c2-99dfb637c8f9
  event: Companions_Marazhai_106
  text: '"После того, как Тервантьяс поссорился с ведьмами и лишился протекции кабала, его убежища в Комморре превратились в смертельную западню — полагаю, они уже разграблены и разрушены. Возможно, где-то в переплетениях Паутины... или в реальном мире. Хотя последнее — безумие даже для гемункула".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: После того, как Тервантьяс поссорился с ведьмами и лишился протекции кабала, его убежища в Комморре превратились в смертельную западню — полагаю, они уже разграблены и разрушены. Возможно, где-то в переплетениях Паутины... или в реальном мире. Хотя последнее — безумие даже для гемункула.
- guid: 987730e0-4ec6-4db9-ac93-9239bc4071c0
  event: Companions_Marazhai_107
  text: '"Когда гротеск конкурирующего кабала вырвал мне плечо с рукой. Когда мне нужно было средство выдавить из тебя правду на Обсидиановом суде. Когда у меня возникали личные пожелания, удовлетворить которые мог только мастер плоти".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Когда гротеск конкурирующего кабала вырвал мне плечо с рукой. Когда мне нужно было средство выдавить из тебя правду на Обсидиановом суде. Когда у меня возникали личные пожелания, удовлетворить которые мог только мастер плоти.
- guid: dee465b8-93bd-4389-90f4-7f3babefa47b
  event: Companions_Marazhai_108
  text: '{n}Маражай скрещивает руки на груди и посылает вам многозначительную улыбку.{/n} "Ах как сильно тебе хотелось бы это узнать, да, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай скрещивает руки на груди и посылает вам многозначительную улыбку.
  - speaker: Маражай Аэзирраэш
    text_clean: Ах как сильно тебе хотелось бы это узнать, да, КЭП?
- guid: 45b5b85a-b3bb-461e-9460-c12e7ca4b9cf
  event: Companions_Marazhai_109
  text: '{n}Маражай смотрит мимо вас.{/n} "Назракей должен был стать секирой, что опустится на ее шею... но в итоге уничтожил меня. Изящно, достойно восхищения... но почему? Тайный союз с Иремерисс? Или есть иная причина? Когда-нибудь я вырву ответ из его глотки с последним вздохом".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай смотрит мимо вас.
  - speaker: Маражай Аэзирраэш
    text_clean: Назракей должен был стать секирой, что опустится на ее шею... но в итоге уничтожил меня. Изящно, достойно восхищения... но почему? Тайный союз с Иремерисс? Или есть иная причина? Когда-нибудь я вырву ответ из его глотки с последним вздохом.
- guid: 39be141f-48a8-4923-a497-65b774604ed7
  event: Companions_Marazhai_11
  text: '{n}Маражай склоняется к вам, в его глазах тлеет интерес.{/n} "И о чем же ты хочешь поговорить, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай склоняется к вам, в его глазах тлеет интерес.
  - speaker: Маражай Аэзирраэш
    text_clean: И о чем же ты хочешь поговорить, КЭП?
- guid: e08b4bbe-c616-497a-8144-3134e58bb9fe
  event: Companions_Marazhai_110
  text: '{n}Друкари растягивает рот в ехидной улыбке.{/n} "Разумеется. Насколько мне известно, ты сам{mf||а} повстречал{mf|ся|ась} с моим посланцем, проникшим к тебе на судно — кабалитом, который оставил в одном из мон-кай личинку, полученную от Тервантьяса. Или ты так и не выяснил{mf||а}, в чем причина предательства при давнишнем абордаже? Ммм. Тогда о спящих агентах, скрытых на твоих мирах, и говорить нечего".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари растягивает рот в ехидной улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Разумеется. Насколько мне известно, ты сам повстречался с моим посланцем, проникшим к тебе на судно — кабалитом, который оставил в одном из мон-кай личинку, полученную от Тервантьяса. Или ты так и не выяснил, в чем причина предательства при давнишнем абордаже? Ммм. Тогда о спящих агентах, скрытых на твоих мирах, и говорить нечего.
- guid: 9deee4f6-70ab-4304-a380-202ae15667f6
  event: Companions_Marazhai_111
  text: '"Кого?" {n}Друкари смотрит на вас с недоумением.{/n} "Я понятия не имею, что ты видел{mf||а} в своем дурмане. Гемункульская тварь не порождает конкретные образы — она путает твое сознание, заставляя его рисовать подходящие картины, вызывающие смятение или страх. Ни Тервантьясу, ни мне нет дела до ритуальной мон-кайской возни. Личинка должна была создать тебе... подходящую среду, в которой ты охотнее отвечал{mf||а} бы на мои вопросы на Обсидиановом суде".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Кого?
  - speaker: narrator
    text_clean: Друкари смотрит на вас с недоумением.
  - speaker: Маражай Аэзирраэш
    text_clean: Я понятия не имею, что ты видел в своем дурмане. Гемункульская тварь не порождает конкретные образы — она путает твое сознание, заставляя его рисовать подходящие картины, вызывающие смятение или страх. Ни Тервантьясу, ни мне нет дела до ритуальной мон-кайской возни. Личинка должна была создать тебе... подходящую среду, в которой ты охотнее отвечал бы на мои вопросы на Обсидиановом суде.
- guid: d46e171f-39f1-4fcc-bc07-2d6dc87e3b2e
  event: Companions_Marazhai_112
  text: '{n}Маражай протягивает руку и дотрагивается до клейма, красующегося на вашей шее.{/n} "Мо{mf|й|я} маленьк{mf|ий|ая} звер{mf|ек|ушка}, как же тебя красит мой знак на твоей плоти. Придает смысл твоему существованию. Дает знать всему миру, кто владеет тобой. Совершенство".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай протягивает руку и дотрагивается до клейма, красующегося на вашей шее.
  - speaker: Маражай Аэзирраэш
    text_clean: Мой маленький зверек, как же тебя красит мой знак на твоей плоти. Придает смысл твоему существованию. Дает знать всему миру, кто владеет тобой. Совершенство.
- guid: 34a66f95-c2f3-4376-b24a-186ec2ad20c5
  event: Companions_Marazhai_113
  text: '{n}При вашем приближении Маражай словно бы невзначай поворачивает голову, демонстрируя ваше клеймо на своей шее.{/n} "Как я могу служить тебе, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: При вашем приближении Маражай словно бы невзначай поворачивает голову, демонстрируя ваше клеймо на своей шее.
  - speaker: Маражай Аэзирраэш
    text_clean: Как я могу служить тебе, КЭП?
- guid: 6a9226f9-cca0-4a9d-8bc1-a84b37ec29e1
  event: Companions_Marazhai_114
  text: '{n}Друкари презрительно фыркает.{/n} "Едва ли мандрагоры посмеют потребовать свое с меня. Если они придут за мной — пожалеют об этом решении". {n}Несмотря на уверенный тон, на лбу Маражая появляется тревожная складка.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари презрительно фыркает.
  - speaker: Маражай Аэзирраэш
    text_clean: Едва ли мандрагоры посмеют потребовать свое с меня. Если они придут за мной — пожалеют об этом решении.
  - speaker: narrator
    text_clean: Несмотря на уверенный тон, на лбу Маражая появляется тревожная складка.
- guid: 8fa773eb-670b-49e1-924e-c3156808942a
  event: Companions_Marazhai_115
  text: '"А, сообразил{mf||а}, о ком речь, да?" {n}Маражай осклабляется, но его улыбка тут же тает.{/n} "Твари не угомонились после своего фиаско в шпиле Опустошительной бури. Они хотят моей крови и боли, потому решили наведаться на твою посудину и попытаться застать меня врасплох. Напрасно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: А, сообразил, о ком речь, да?
  - speaker: narrator
    text_clean: Маражай осклабляется, но его улыбка тут же тает.
  - speaker: Маражай Аэзирраэш
    text_clean: Твари не угомонились после своего фиаско в шпиле Опустошительной бури. Они хотят моей крови и боли, потому решили наведаться на твою посудину и попытаться застать меня врасплох. Напрасно.
- guid: db48ef4e-beea-44ad-8125-a047d7f74983
  event: Companions_Marazhai_116
  text: '{n}Маражай взирает на вас с насмешливой снисходительностью.{/n} "Признаю, ты изрядно повеселил{mf||а} меня, {name}. {d|Encyclopedia:MiniJealousyRomanceBroken}Сдал{mf|ся|ась} и сбежал{mf||а}{/d} без единого слова! Можно ли унизить себя более, чем это сделал{mf||а} ты?" {n}Друкари смеется с искренним наслаждением.{/n} "А, мне даже не хочется марать об тебя руки после этого! Можешь жить — со славой никчемной трусливой твари".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай взирает на вас с насмешливой снисходительностью.
  - speaker: Маражай Аэзирраэш
    text_clean: Признаю, ты изрядно повеселил меня, КЭП. {d|Encyclopedia:MiniJealousyRomanceBroken}Сдался и сбежал{/d} без единого слова! Можно ли унизить себя более, чем это сделал ты?
  - speaker: narrator
    text_clean: Друкари смеется с искренним наслаждением.
  - speaker: Маражай Аэзирраэш
    text_clean: А, мне даже не хочется марать об тебя руки после этого! Можешь жить — со славой никчемной трусливой твари.
- guid: 27bfc68b-b06b-4173-8469-0bdf0b9c3a78
  event: Companions_Marazhai_12
  text: '"Сговорились? О нет. Никакого договора не было — она лишь летела на приманку. Изначально я планировал использовать того, кому ты доверял{mf||а} — обожженного мон-кай, с которым мы провели долгие, долгие часы в ожидании тебя. Однако моя кузина оказалась весьма проворна — позже она выследила мон-кай, убила его и забрала у него переговорное устройство, которое он использовал, чтобы связаться со мной".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Сговорились? О нет. Никакого договора не было — она лишь летела на приманку. Изначально я планировал использовать того, кому ты доверял — обожженного мон-кай, с которым мы провели долгие, долгие часы в ожидании тебя. Однако моя кузина оказалась весьма проворна — позже она выследила мон-кай, убила его и забрала у него переговорное устройство, которое он использовал, чтобы связаться со мной.
- guid: fd289457-d38c-4eea-97bd-017899376e8e
  event: Companions_Marazhai_13
  text: '"Когда Иремерисс приказала опустошить селения мон-кай, мы с Тазаррой столкнулись с сопротивлением. Я слишком давно охочусь на твоих соплеменников, чтобы не заметить, как успешно ты сопротивлял{mf|ся|ась} нашим атакам. Разгром арены Тазарры, появление на месте разграбления судна... ваше племя беспомощно против наших атак, но в этот раз было иначе. Я начал подозревать, что дело не обошлось без помощи со стороны. С нашей стороны".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Когда Иремерисс приказала опустошить селения мон-кай, мы с Тазаррой столкнулись с сопротивлением. Я слишком давно охочусь на твоих соплеменников, чтобы не заметить, как успешно ты сопротивлялся нашим атакам. Разгром арены Тазарры, появление на месте разграбления судна... ваше племя беспомощно против наших атак, но в этот раз было иначе. Я начал подозревать, что дело не обошлось без помощи со стороны. С нашей стороны.
- guid: 7091967b-128b-4c5b-8ce8-52b50de54913
  event: Companions_Marazhai_14
  text: '"Я не планировал окончить свои дни в роли мяса с арены. А вот ты..." {n}Маражай наклоняется вперед и заглядывает вам в глаза.{/n} "Ты легкомысленно предложил{mf||а} мне союз. После всего, что я с тобой сделал... в чем причина?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я не планировал окончить свои дни в роли мяса с арены. А вот ты...
  - speaker: narrator
    text_clean: Маражай наклоняется вперед и заглядывает вам в глаза.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты легкомысленно предложил мне союз. После всего, что я с тобой сделал... в чем причина?
- guid: f464c6bf-5daf-403d-b8e8-590ed9d49ac4
  event: Companions_Marazhai_15
  text: '"Потому что упоение страданием — высочайшая форма удовольствия, доступная лишь высшим созданиям. Таким, как ты, не дано познать этого наслаждения самим по себе".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Потому что упоение страданием — высочайшая форма удовольствия, доступная лишь высшим созданиям. Таким, как ты, не дано познать этого наслаждения самим по себе.
- guid: 4c976e18-9995-4255-b5b7-2b13a9394343
  event: Companions_Marazhai_16
  text: '"Свергнуть архонта — пускай и ту, что уже запятнала свою репутацию — весьма непросто: у каждого в кабале есть своя поддержка, и у Иремерисс ее достаточно. Назракей пообещал мне подставной Обсидиановый суд с предрешенным финалом. Иремерисс должна была быть обвинена и свергнута. Я должен был занять ее место и превратить Опустошительную бурю в верного вассала Черного сердца".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: 'Свергнуть архонта — пускай и ту, что уже запятнала свою репутацию — весьма непросто: у каждого в кабале есть своя поддержка, и у Иремерисс ее достаточно. Назракей пообещал мне подставной Обсидиановый суд с предрешенным финалом. Иремерисс должна была быть обвинена и свергнута. Я должен был занять ее место и превратить Опустошительную бурю в верного вассала Черного сердца.'
- guid: c44ff4e5-7e99-46c8-af7f-7283b2a910d9
  event: Companions_Marazhai_17
  text: '"Нет. К моему великому сожалению. Возможно, теперь мне самому нужно проявить инициативу". {n}Маражай ухмыляется собственным мыслям.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Нет. К моему великому сожалению. Возможно, теперь мне самому нужно проявить инициативу.
  - speaker: narrator
    text_clean: Маражай ухмыляется собственным мыслям.
- guid: 8880efcb-2a15-4ee4-aac5-90f21285565d
  event: Companions_Marazhai_18
  text: '"Я заронил отравленные семена в ее душу — еще тогда, при первой нашей личной встрече. Намекнул ей, что мне известно о судьбе ее мира. Поманил... и оставил тебе. Остальное сделало время... и неприятное открытие на борту твоего собственного корабля".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я заронил отравленные семена в ее душу — еще тогда, при первой нашей личной встрече. Намекнул ей, что мне известно о судьбе ее мира. Поманил... и оставил тебе. Остальное сделало время... и неприятное открытие на борту твоего собственного корабля.
- guid: 024b0047-d9fb-4a60-9211-d3692ef227e4
  event: Companions_Marazhai_19
  text: '"Она поведала мне о том, что увидела в твоих покоях... кусок ее собственного дома — разрушенного, искаженного до неузнаваемости, низведенного до трофея на стене! О да, это стало переломным моментом. Последней каплей, переполнившей чашу ее наивного доверия к мон-кай... и она пришла искать ответы к собрату".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Она поведала мне о том, что увидела в твоих покоях... кусок ее собственного дома — разрушенного, искаженного до неузнаваемости, низведенного до трофея на стене! О да, это стало переломным моментом. Последней каплей, переполнившей чашу ее наивного доверия к мон-кай... и она пришла искать ответы к собрату.
- guid: 848142aa-f86b-49e7-8699-13020c424f3c
  event: Companions_Marazhai_20
  text: '"Я не просил ее отдавать тебя в мои руки — нет, это заставило бы мою бедную кузину лишь больше сомневаться в своих поступках. Я лишь указал ей, где искать следы ее мира-корабля, ответы на все ее вопросы — родственная услуга, не более. И подготовился к вашему прибытию — она не смогла бы попасть туда иначе, кроме как вместе с тобой".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я не просил ее отдавать тебя в мои руки — нет, это заставило бы мою бедную кузину лишь больше сомневаться в своих поступках. Я лишь указал ей, где искать следы ее мира-корабля, ответы на все ее вопросы — родственная услуга, не более. И подготовился к вашему прибытию — она не смогла бы попасть туда иначе, кроме как вместе с тобой.
- guid: 4da5248a-6cd0-44e6-828f-e64d3f4d8cdf
  event: Companions_Marazhai_21
  text: '"Мандрагоры... выродки, обретающиеся в недрах Комморры. Их способность находить пути через тени нашло достойное применение. Я обещал им снисхождение и союз, когда стану архонтом Опустошительной бури..." {n}Маражай запинается и движением руки показывает, что закончил говорить.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мандрагоры... выродки, обретающиеся в недрах Комморры. Их способность находить пути через тени нашло достойное применение. Я обещал им снисхождение и союз, когда стану архонтом Опустошительной бури...
  - speaker: narrator
    text_clean: Маражай запинается и движением руки показывает, что закончил говорить.
- guid: 84864037-1f85-4c88-9ee2-98d8ae4272a4
  event: Companions_Marazhai_22
  text: '"Меня отдали в распоряжение ведьминского культа — владельцев арены. Сначала заставили сражаться с отребьем, потом, насладившись моим унижением, позволили войти в круг Кровавых прозелитов".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Меня отдали в распоряжение ведьминского культа — владельцев арены. Сначала заставили сражаться с отребьем, потом, насладившись моим унижением, позволили войти в круг Кровавых прозелитов.
- guid: fe25dda4-b22d-403d-bbd0-7d004654357b
  event: Companions_Marazhai_23
  text: '{n}Маражай растекается в улыбке.{/n} "Один раз ты уже попытал{mf|ся|ась} завести себе зверька — и что из этого вышло? Неужели ты мнишь, что твой воображаемый поводок, не удержавший Ирлиэт, справится со мной?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай растекается в улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Один раз ты уже попытался завести себе зверька — и что из этого вышло? Неужели ты мнишь, что твой воображаемый поводок, не удержавший Ирлиэт, справится со мной?
- guid: a2e5b177-4fe8-478b-abc6-6b6939da2818
  event: Companions_Marazhai_24
  text: '{n}Маражай растягивает губы в улыбке.{/n} "Посмотрим, кто из нас двоих лучше поддается дрессуре".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай растягивает губы в улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Посмотрим, кто из нас двоих лучше поддается дрессуре.
- guid: 64c23143-f6cc-4819-b955-f88a4cbdf8a7
  event: Companions_Marazhai_25
  text: '"Кабал Черного сердца — древнейший из всех. И наиболее многочисленный. Его тень простирается над всей Комморрой, и когда она падает на тебя — ты либо падаешь ниц, либо умираешь. Опустошительная буря не собиралась погибать — и, когда тень Черного сердца простерлась над нами, предшественники Иремерисс предпочли склониться и стать вассалами".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Кабал Черного сердца — древнейший из всех. И наиболее многочисленный. Его тень простирается над всей Комморрой, и когда она падает на тебя — ты либо падаешь ниц, либо умираешь. Опустошительная буря не собиралась погибать — и, когда тень Черного сердца простерлась над нами, предшественники Иремерисс предпочли склониться и стать вассалами.
- guid: 6a0f4b04-4d7b-4c1b-b57a-0ec7e4facfcc
  event: Companions_Marazhai_26
  text: '"Всем. Азуриани — тень наших предков, чьими истинными наследниками мы являемся. Азуриани прячутся от Той, Что Жаждет, за своими Путями и полагаются на видения своих драгоценных провидцев, будучи слепыми к реальности вокруг них. Мы смеемся в лицо неизвестности — если что-то и сломит нас, то только наша собственная слабость, которую мы изживаем каждый день".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Всем. Азуриани — тень наших предков, чьими истинными наследниками мы являемся. Азуриани прячутся от Той, Что Жаждет, за своими Путями и полагаются на видения своих драгоценных провидцев, будучи слепыми к реальности вокруг них. Мы смеемся в лицо неизвестности — если что-то и сломит нас, то только наша собственная слабость, которую мы изживаем каждый день.
- guid: 8c6c8c7c-822a-4fb7-916b-729b79b49e09
  event: Companions_Marazhai_27
  text: '"На продолжение своего существования. С потерей своего положения я стал законной добычей любого, кто польстился бы на разжалованного кабалита — ради мести или же ради наслаждения от убийства. В Комморре одинокий друкари — мишень для любого. Как бы ни были велики мои таланты, я трезво оцениваю свои шансы".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: На продолжение своего существования. С потерей своего положения я стал законной добычей любого, кто польстился бы на разжалованного кабалита — ради мести или же ради наслаждения от убийства. В Комморре одинокий друкари — мишень для любого. Как бы ни были велики мои таланты, я трезво оцениваю свои шансы.
- guid: 2e58a2a5-1b47-4d0e-b9b0-922220cf4d33
  event: Companions_Marazhai_28
  text: '{n}Улыбка Маражая становится невыносимо ехидной.{/n} "Как же плохо ты лжешь, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Улыбка Маражая становится невыносимо ехидной.
  - speaker: Маражай Аэзирраэш
    text_clean: Как же плохо ты лжешь, КЭП.
- guid: bbebe82d-e265-45e1-a941-60b80b0e426b
  event: Companions_Marazhai_29
  text: '"Тебе не понять хитросплетений Комморры и ее строя, {name}. Мы все — союзники и худшие враги друг другу, надежная опора и готовое свершиться предательство. Культы всегда стояли на полступеньки ниже кабалов, и ведьмам только в радость измываться над тем, кто раньше возвышался над ними".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тебе не понять хитросплетений Комморры и ее строя, КЭП. Мы все — союзники и худшие враги друг другу, надежная опора и готовое свершиться предательство. Культы всегда стояли на полступеньки ниже кабалов, и ведьмам только в радость измываться над тем, кто раньше возвышался над ними.
- guid: c474cf0d-6c40-432c-a819-47a73182000c
  event: Companions_Marazhai_30
  text: '"Если наша беседа окончена..." {n}Маражай нетерпеливо щелкает пальцами.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Если наша беседа окончена...
  - speaker: narrator
    text_clean: Маражай нетерпеливо щелкает пальцами.
- guid: 70fd1843-b86e-4471-bacf-b7933c0b5b83
  event: Companions_Marazhai_31
  text: '"Теперь, когда я нашел опору в реальном мире, я должен понять, как мне вернуть себе кабал. Иремерисс мертва, и Опустошительная буря будет явно отдана на растерзание Комморре... впрочем, если они позволят себя сразить, особой жалости к этим ничтожествам я не буду испытывать".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Теперь, когда я нашел опору в реальном мире, я должен понять, как мне вернуть себе кабал. Иремерисс мертва, и Опустошительная буря будет явно отдана на растерзание Комморре... впрочем, если они позволят себя сразить, особой жалости к этим ничтожествам я не буду испытывать.
- guid: 1f11bfdd-261b-42b1-b18e-afa14c6c620c
  event: Companions_Marazhai_32
  text: '"По многочисленным трупам врагов, умывшись их кровью и слезами". {n}Маражай хищно облизывается.{/n} "Не лги себе, считая, что мы покинем это место живьем без насилия. И я надеюсь, что на нашем пути его будет много".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: По многочисленным трупам врагов, умывшись их кровью и слезами.
  - speaker: narrator
    text_clean: Маражай хищно облизывается.
  - speaker: Маражай Аэзирраэш
    text_clean: Не лги себе, считая, что мы покинем это место живьем без насилия. И я надеюсь, что на нашем пути его будет много.
- guid: d7749e53-d166-4970-8bcb-54521906a78f
  event: Companions_Marazhai_33
  text: '"Однако есть прискорбный нюанс. На твоем пути возник Аребенниан — один из племени Цегораха, что скрывается в переплетениях Паутины. Иначе их зовут Арлекинами, и тот, что появился на Обсидиановом суде — самый опасный и непредсказуемый. Я начинаю думать, что его визит — знак того, что в происходящие с нами события вмешались со стороны. Возможно... с самого высокого дозволения".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Однако есть прискорбный нюанс. На твоем пути возник Аребенниан — один из племени Цегораха, что скрывается в переплетениях Паутины. Иначе их зовут Арлекинами, и тот, что появился на Обсидиановом суде — самый опасный и непредсказуемый. Я начинаю думать, что его визит — знак того, что в происходящие с нами события вмешались со стороны. Возможно... с самого высокого дозволения.
- guid: 820f6c9c-d51a-4ca9-8151-3aa85c445403
  event: Companions_Marazhai_34
  text: '"Я не участвовал ни в какой краже солнца, {name}. Но могу ли я утверждать, что это не дело рук кабалитов Опустошительной бури, ведомых другим предводителем?" {n}Маражай морщится.{/n} "Нет. Я не отвечаю за Иремерисс и ее прихвостней".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я не участвовал ни в какой краже солнца, КЭП. Но могу ли я утверждать, что это не дело рук кабалитов Опустошительной бури, ведомых другим предводителем?
  - speaker: narrator
    text_clean: Маражай морщится.
  - speaker: Маражай Аэзирраэш
