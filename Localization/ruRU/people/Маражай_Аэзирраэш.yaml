  event: CH2_MarazhaiHelloAgain_30
  text: '{n}Ирлиэт застывает — только распахнувшиеся глаза выдают ее смятение и гнев.{/n} "Что тебе, Темный, известно о моих братьях и сестрах?!"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Ирлиэт застывает — только распахнувшиеся глаза выдают ее смятение и гнев.
  - speaker: Маражай Аэзирраэш
    text_clean: Что тебе, Темный, известно о моих братьях и сестрах?!
- guid: 0c637958-8134-4558-89ef-41f40d190673
  event: CH2_MarazhaiHelloAgain_31
  text: '{n}Ксенос издает гадкий смешок.{/n} "Лишь то, что они блуждают, слепые и беспомощные, лишенные дома и всякой надежды... но почему я говорю тебе об этом? Разве не твоя обязанность стеречь свою семью, Изгой?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Ксенос издает гадкий смешок.
  - speaker: Маражай Аэзирраэш
    text_clean: Лишь то, что они блуждают, слепые и беспомощные, лишенные дома и всякой надежды... но почему я говорю тебе об этом? Разве не твоя обязанность стеречь свою семью, Изгой?
- guid: 39d6000d-f499-4af7-976f-369514b221e6
  event: CH2_MarazhaiHelloAgain_32
  text: '{n}Хейнрикс прищуривается.{/n} "Какая досада — это явно не Иремерисс, архонт кабала, которую мы имели неудовольствие лицезреть на Веабос-6. Опять придется иметь дело с пешкой вместо главного источника проблем".'
