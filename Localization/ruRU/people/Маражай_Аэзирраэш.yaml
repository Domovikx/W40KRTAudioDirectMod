    text_clean: Примитивные культы, бессмысленная и бесцельная грызня между собой... Ах да, и весьма забавные попытки сладить с этим миром на свой умилительный монкайский манер. Что скажешь, изгой?
- guid: 1a4ad1e2-5547-4a95-b957-8753710d8c02
  event: BNTRS_DLC3_Marazhai_25
  text: '"Хм... был бы у нас в доступе энергетический концентратор, эту гондолу можно было бы привести в движение и добраться до верхних уровней..."'
  speaker: Маражай Аэзирраэш
  parts:
