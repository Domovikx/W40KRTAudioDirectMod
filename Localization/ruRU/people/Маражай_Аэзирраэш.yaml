  event: Companions_Marazhai_47
  text: '{n}Маражай прищуривается и смотрит на вас несколько секунд, словно пытаясь просверлить взглядом дырку у вас между глаз.{/n} "Какой забавный образец примитивного мышления... Любой друкари стоит бесконечно выше любого мон-кай, и мы не скрываем своего отношения к скоту. Но мои собратья? Любой из них достоин настороженности, а те, кто уже показали свою силу и власть — сами по себе смертельная опасность. Я не наслаждаюсь подчинением — я умею принимать данность. И ждать, когда откроется слабое место, манящее мой клинок".'
