  - speaker: Маражай Аэзирраэш
    text_clean: Ты вышел целым из той схватки только потому, что я был на твоей стороне. Твое заблуждение удручающе глубоко.
- guid: 3c8422dd-6ae2-47ea-b7b9-70fe0cff0556
  event: RMNC_Marazhai_StartingEvent_P2_04
  text: '"Мне недостаточно просто убить ее — нет, это слишком... банально? Оставаться вечность заточенной в мучительной темнице, из которой нет спасения — эта участь мне куда больше по душе. Ее ярость и страдания будут питать меня, пока ее дух не иссякнет, словно фонтан крови из перерубленной артерии. Ну и вдобавок... она не сможет вернуться за мной после воскрешения".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мне недостаточно просто убить ее — нет, это слишком... банально? Оставаться вечность заточенной в мучительной темнице, из которой нет спасения — эта участь мне куда больше по душе. Ее ярость и страдания будут питать меня, пока ее дух не иссякнет, словно фонтан крови из перерубленной артерии. Ну и вдобавок... она не сможет вернуться за мной после воскрешения.
