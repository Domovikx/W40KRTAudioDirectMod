- guid: c88edc1f-c252-4645-8637-3d51c27043f8
  event: BNTRS_DLC2_Marazhai_264
  text: '"Вы — слишком короткоживущее племя, чтобы не покушаться на заветы мертвого бога. Столь любимые тобой законы ныне вряд ли содержат хотя бы одно слово, не переписанное в угоду новым поколениям мон-кай".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
