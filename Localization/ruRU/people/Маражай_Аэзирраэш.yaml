  event: BNTRS_DLC3_Marazhai_107
  text: '"И что бы мы делали без ищейки с таким потрясающим чутьем? Ах да, были бы избавлены от бесценной возможности оценить примитивность твоего мышления".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
