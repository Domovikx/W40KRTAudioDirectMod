  event: Companions_Marazhai_49
  text: '"Что делают подобные мне в реальном мире, {name}? Собирали жатву. Комморра требовала мяса — в недавней дизъюнкции Темный город понес потери. Нам нужны были источники сладостной боли, чтобы напоить ей умы и тела. Когда архонт моего кабала повелела собрать урожай с региона, я не подозревал, что это обернется нашей с тобой игрой".'
