- guid: 359e3d99-9d76-48af-9c6d-c5843e5f0a63
  event: BNTRS_DLC2_Marazhai_92
  text: '"Не знаю, почему перечисление железяк наполняет тебя такой болью, но продолжай... я готов быть внимательным слушателем".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
