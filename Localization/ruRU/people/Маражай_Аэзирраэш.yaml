- guid: 9f935954-c71d-4c74-bcd6-e026b409df44
  event: BNTRS_Reactivity_Marazhai_82
  text: '"Ммм. Ты, кузина, исчерпала себя как забава, с которой потешно играть. Мне надо как-то развеивать скуку... и, похоже, я нашел для себя новый способ сделать это".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ммм. Ты, кузина, исчерпала себя как забава, с которой потешно играть. Мне надо как-то развеивать скуку... и, похоже, я нашел для себя новый способ сделать это.
- guid: a8ac2cd6-44eb-4752-8cf4-545a445ef557
  event: BNTRS_Reactivity_Marazhai_85
  text: '"Ты действительно хочешь знать ответ? Любопытство. Любопытство, которое я найду способ удовлетворить... наиболее полным и приятным образом".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты действительно хочешь знать ответ? Любопытство. Любопытство, которое я найду способ удовлетворить... наиболее полным и приятным образом.
- guid: 48c2b327-9b3c-45fa-9c4e-673ad7db7ad6
  event: BNTRS_Reactivity_Marazhai_94
  text: '"Если бы ты довела свое "перевоспитание" в Комморре до конца, то могла бы сейчас вкушать свою боль и одиночество словно изысканное явство. Эх. Мы все жалеем об упущенных возможностях слишком поздно, не так ли?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Если бы ты довела свое "перевоспитание" в Комморре до конца, то могла бы сейчас вкушать свою боль и одиночество словно изысканное явство. Эх. Мы все жалеем об упущенных возможностях слишком поздно, не так ли?
- guid: 641022af-6435-442b-a5bd-25e52a7fff84
  event: BNTRS_Reactivity_Marazhai_98
  text: '"Разве это не прекрасно? Ради Вольного Торговца Ирлиэт лишилась самого дорогого, чем обладала. Сколько боли принес этот выбор. Сколько страха..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Разве это не прекрасно? Ради Вольного Торговца Ирлиэт лишилась самого дорогого, чем обладала. Сколько боли принес этот выбор. Сколько страха...
- guid: 4056bd24-fdf8-4f21-94a3-ed57e2372171
  event: BNTRS_Stressful_Marazhai_102
  text: '"Дай мне знать, если тебе наскучит простота. Я с удовольствием сделаю твою жизнь много, много сложнее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Дай мне знать, если тебе наскучит простота. Я с удовольствием сделаю твою жизнь много, много сложнее.
- guid: 24e1d22e-40e2-4cc3-b751-506121d56e35
  event: BNTRS_Stressful_Marazhai_109
  text: '"Ты на излете лет. Зачем влачить существование, в котором нет сил ни на ярость, ни на экстаз?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты на излете лет. Зачем влачить существование, в котором нет сил ни на ярость, ни на экстаз?
- guid: 451f4748-7c84-4bce-91ae-6b3fc3fe3b84
  event: BNTRS_Stressful_Marazhai_111
  text: '"Ты снова смотришь на меня, сладкоголосая мон-кай".'
  speaker: Маражай Аэзирраэш
