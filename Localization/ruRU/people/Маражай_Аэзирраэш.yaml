  - speaker: Маражай Аэзирраэш
    text_clean: Тот, кто способен собирать самых опасных противников в галактике словно коллекционер, вряд ли прельстился бы большим количеством мон-кайских творений.
- guid: 5ecbfafa-aa69-4fc1-9d45-311227cdfff2
  event: BNTRS_DLC3_Marazhai_69
  text: '"Ммм... некоторые из этих приборов могут извлечь немало страданий из тех, кого с их помощью... как вы это называете... "врачуют"? Занятное место".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ммм... некоторые из этих приборов могут извлечь немало страданий из тех, кого с их помощью... как вы это называете... "врачуют"? Занятное место.
- guid: 199b113c-bfa9-4070-b614-2d528c0241a3
  event: BNTRS_DLC3_Marazhai_83
  text: '"Да-да, чем больше неудобных железок вы засунете в свои тела с присущим мон-кай "мастерством", тем больше боли и страданий будет источать каждый из вас на этой палубе. Воистину создание оптимальных условий для меня".'
  speaker: Маражай Аэзирраэш
