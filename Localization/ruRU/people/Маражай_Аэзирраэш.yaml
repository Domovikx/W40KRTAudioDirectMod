  event: BNTRS_PickUps_Marazhai_37
  text: '"Брызги горячей крови на лице, клинок нежно пронзает плоть, жертва трепещет в твоих руках... Разве это не будоражит твои чувства, убийца?"'
  speaker: Маражай Аэзирраэш
