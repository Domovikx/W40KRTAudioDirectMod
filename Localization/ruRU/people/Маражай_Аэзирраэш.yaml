  event: Companions_Marazhai_06
  text: '"Он сам и не знал, как именно сведения приходили к его агентам. Но по их составу и деталям было ясно: ни один мон-кай в реальном мире не смог бы собрать такие подробности о составе и целях рейдов. Нет, немыслимо. Информацию скармливали вам мои же сородичи. И я знал, кто. Иремерисс Эзирраеш, архонт Опустошительной бури, моя бывшая владыка. Трусливая дрянь, нашедшая управу на тех, кто грозил ее власти. Я знал, что в войне с ней мне нужна поддержка покровителя Опустошительной бури — кабала Черного Сердца. Так я вступил в альянс с Назракеем, что председательствовал на суде. Я обещал ему унижение Иремерисс. Свидетельство низкого мон-кай, которое обречет ее на падение в глазах архонтов. Для этого представления мне нуж{mf|ен|на} был{mf||а} ты".'
