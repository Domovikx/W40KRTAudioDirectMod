  event: BNTRS_PickUps_Marazhai_146
  text: '"Милый аперитив, но по сравнению с аренами Комморры их страдания безвкусны. Я мог бы преподать твоим палачам пару занимательных уроков".'
  speaker: Маражай Аэзирраэш
  parts:
