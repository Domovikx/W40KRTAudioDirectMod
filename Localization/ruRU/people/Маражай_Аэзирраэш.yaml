  text: '"Душа Иремерисс. Архонта Опустошительной бури. Она должна принадлежать мне. Я не знаю, где... я не знаю, как... но эта дрянь, пытавшаяся избавиться от меня чужими руками, должна расстаться с жизнью, а ее душа — оказаться в моей душеловке". {n}Маражай небрежно кивает на темный кристалл, свисающий у него с пояса.{/n}'
