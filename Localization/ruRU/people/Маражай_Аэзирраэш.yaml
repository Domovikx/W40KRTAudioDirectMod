  event: CH2_MarazhaiHelloAgain_02
  text: '"Как так получается, что из всех своих сородичей ты единственн{mf|ый|ая} узнаешь о наших пирах заранее? Обычно вы столь медленны и нерасторопны, что мои собратья успевают покинуть поле боя прежде, чем поспеет подмога. И все же твоим псам раз за разом удается переходить кабалу дорогу..." {n}Ксенос умолкает, явно ожидая ответа.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Как так получается, что из всех своих сородичей ты единственный узнаешь о наших пирах заранее? Обычно вы столь медленны и нерасторопны, что мои собратья успевают покинуть поле боя прежде, чем поспеет подмога. И все же твоим псам раз за разом удается переходить кабалу дорогу...
  - speaker: narrator
    text_clean: Ксенос умолкает, явно ожидая ответа.
- guid: 8b727243-800e-43d0-88ec-6cf54e4f5068
  event: CH2_MarazhaiHelloAgain_03
  text: '"Ты испортил{mf||а} прием, который так старательно подготовила наша маленькая бедная Тазарра. Теперь суккуба мечтает лично затащить тебя в Комморру и как следует поразвлечься. Каково будет ее разочарование, если с тобой что-то случится до этого момента... Впрочем, зачем торопить события? Прежде, мон-кай, позволь разглядеть тебя получше".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты испортил прием, который так старательно подготовила наша маленькая бедная Тазарра. Теперь суккуба мечтает лично затащить тебя в Комморру и как следует поразвлечься. Каково будет ее разочарование, если с тобой что-то случится до этого момента... Впрочем, зачем торопить события? Прежде, мон-кай, позволь разглядеть тебя получше.
- guid: 0e8dc6d2-6cc7-40e6-8a97-8786f76eff01
  event: CH2_MarazhaiHelloAgain_04
  text: '"Да, мон-кай. Радуйся этим воспоминаниям пока можешь, потому что позже я заставлю тебя сильно пожалеть об этой выходке. А пока что — пока что, раз выпала такая возможность, я как следует изучу тебя".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Да, мон-кай. Радуйся этим воспоминаниям пока можешь, потому что позже я заставлю тебя сильно пожалеть об этой выходке. А пока что — пока что, раз выпала такая возможность, я как следует изучу тебя.
- guid: 9291dc63-17ed-418b-88b8-fba6c684d512
  event: CH2_MarazhaiHelloAgain_05
  text: '"Тебе не стоило бы столь веселиться, мон-кай. Знай ты, на кого поднял{mf||а} руку, то перерезал{mf||а} бы сам{mf||а} себе горло, чтобы избежать воздаяния. Но для этого еще будет время".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тебе не стоило бы столь веселиться, мон-кай. Знай ты, на кого поднял руку, то перерезал бы сам себе горло, чтобы избежать воздаяния. Но для этого еще будет время.
- guid: 6c75f4e5-06f9-45c8-b2c6-a07f50e7e74f
  event: CH2_MarazhaiHelloAgain_06
  text: '"Говорить на твоем языке — чуть меньшее испытание для моего терпения, чем слушать, как мон-кайская машина уродует наш язык. Кроме того, я хочу, чтобы ты как следует понимал{mf||а} то, что я буду тебе говорить".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Говорить на твоем языке — чуть меньшее испытание для моего терпения, чем слушать, как мон-кайская машина уродует наш язык. Кроме того, я хочу, чтобы ты как следует понимал то, что я буду тебе говорить.
- guid: 2881d736-7ee8-4eb1-99d5-9cef8259de62
  event: CH2_MarazhaiHelloAgain_07
  text: '{n}Друкари цокает языком.{/n} "Значит, ты действительно служишь моей кузине. Что ж, я могу рассказать тебе кое-что, Ирлиэт... после того, как покончу с этими мон-кай. Отойди с моего пути".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари цокает языком.
  - speaker: Маражай Аэзирраэш
    text_clean: Значит, ты действительно служишь моей кузине. Что ж, я могу рассказать тебе кое-что, Ирлиэт... после того, как покончу с этими мон-кай. Отойди с моего пути.
- guid: 605c2d39-ac39-4c71-bcbe-46447f2ecf48
  event: CH2_MarazhaiHelloAgain_08
  text: '"Наивная зверушка. Я не буду пачкать об тебя клинки сегодня. Но вот мои подданные... мои подданные с удовольствием развлекутся с тобой".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Наивная зверушка. Я не буду пачкать об тебя клинки сегодня. Но вот мои подданные... мои подданные с удовольствием развлекутся с тобой.
- guid: 6288121f-a4ea-4c70-aff2-f37a55c9b579
  event: CH2_MarazhaiHelloAgain_09
  text: '{n}Хейнрикс понижает голос.{/n} "Странно, {name}: архонт бы не упустила возможности возглавить рейд и лично упиваться насилием и болью. Что это? Отвлекающий маневр, пока она занята чем-то другим? Или попытка избавиться от нижестоящего?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Хейнрикс понижает голос.
  - speaker: Маражай Аэзирраэш
    text_clean: 'Странно, КЭП: архонт бы не упустила возможности возглавить рейд и лично упиваться насилием и болью. Что это? Отвлекающий маневр, пока она занята чем-то другим? Или попытка избавиться от нижестоящего?'
- guid: c97ae899-f649-461d-84d6-f2906db58a47
  event: CH2_MarazhaiHelloAgain_10
  text: '"Хочешь убедить меня в том, что мон-кай, пусть и выдрессированные, способны разгадывать замыслы {g|Encyclopedia:Drukhari}друкари{/g}? За подобную наглость расплачиваться придется и тебе, и твоему "другу".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хочешь убедить меня в том, что мон-кай, пусть и выдрессированные, способны разгадывать замыслы друкари? За подобную наглость расплачиваться придется и тебе, и твоему "другу.
- guid: 57dcfa12-f8ff-4a51-bdd8-46488bf38df2
  event: CH2_MarazhaiHelloAgain_11
  text: '"Похоже, благодарности я не дождусь".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Похоже, благодарности я не дождусь.
- guid: a5e4f5b4-5fcf-4c03-b492-0f210b8031c2
  event: CH2_MarazhaiHelloAgain_12
  text: '"И? Это все? Уверение в том, что вы не настолько безмозглые, какими выглядите в наших глазах? Меня не удовлетворяет такой ответ".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: И? Это все? Уверение в том, что вы не настолько безмозглые, какими выглядите в наших глазах? Меня не удовлетворяет такой ответ.
- guid: 43ad1935-8ef2-4d16-a61c-8b617c7bbaa8
  event: CH2_MarazhaiHelloAgain_13
  text: '"Пожалуй, в этом ты не лжешь. Но простое богатство не меняет сути — вашей слабой, близорукой, ограниченной сути. Нет, есть иная причина, почему мон-кай столь неожиданно прозрели и поумнели".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Пожалуй, в этом ты не лжешь. Но простое богатство не меняет сути — вашей слабой, близорукой, ограниченной сути. Нет, есть иная причина, почему мон-кай столь неожиданно прозрели и поумнели.
- guid: 00c42bfb-ae74-4d87-905f-d6632b14c04c
  event: CH2_MarazhaiHelloAgain_14
  text: '"Ты придаешь слишком большое значение собственным деяниям — сколько бы незначительными они ни были".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты придаешь слишком большое значение собственным деяниям — сколько бы незначительными они ни были.
- guid: d2977ae1-25ae-4118-9b07-2f88286a2e19
  event: CH2_MarazhaiHelloAgain_15
  text: '"Хм. Что ж, развлеки меня".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хм. Что ж, развлеки меня.
- guid: 581db9fe-e2c6-417a-bec3-9cf887260871
  event: CH2_MarazhaiHelloAgain_16
  text: '"Меня зовут Маражай Эзирраеш. Дракон кабала Опустошительной бури. Первый клинок госпожи Иремерисс. Потрошитель Иллиридоса, Сжигатель Баркагского царства и убийца Карроция Бледного".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Меня зовут Маражай Эзирраеш. Дракон кабала Опустошительной бури. Первый клинок госпожи Иремерисс. Потрошитель Иллиридоса, Сжигатель Баркагского царства и убийца Карроция Бледного.
- guid: c19db800-d1cf-456c-bb14-0fb67e883a0a
  event: CH2_MarazhaiHelloAgain_17
  text: '"Повелительница кабала, чьи угодья раскинулись в этом регионе реального мира. Именно она повелела своим подданным распотрошить миры мон-кай, чтобы восстановить запасы мяса в клетях ее арен".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Повелительница кабала, чьи угодья раскинулись в этом регионе реального мира. Именно она повелела своим подданным распотрошить миры мон-кай, чтобы восстановить запасы мяса в клетях ее арен.
- guid: e5b2ad72-edf4-4f69-8ebb-15ca059cb1fa
  event: CH2_MarazhaiHelloAgain_18
  text: '"Потому что таков порядок вещей, мон-кай. Вы бежите. Мы охотимся. Вы умираете в муках. Мы наслаждаемся каждым их мгновением. Когда сиюминутных страданий становится недостаточно и из жертв нужно выжать нечто более изысканное... что ж. Твои сородичи — частые гости в моем родном царстве, пусть и не по своей воле".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Потому что таков порядок вещей, мон-кай. Вы бежите. Мы охотимся. Вы умираете в муках. Мы наслаждаемся каждым их мгновением. Когда сиюминутных страданий становится недостаточно и из жертв нужно выжать нечто более изысканное... что ж. Твои сородичи — частые гости в моем родном царстве, пусть и не по своей воле.
- guid: 581aec6c-0b5a-4ec2-9b92-5f0a42b50f6f
  event: CH2_MarazhaiHelloAgain_19
  text: '"Прискорбная необходимость. Иногда мне нужно разговаривать с тебе подобными — когда языка плети оказывается недостаточно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Прискорбная необходимость. Иногда мне нужно разговаривать с тебе подобными — когда языка плети оказывается недостаточно.
- guid: af0d9b60-1931-4d15-963d-ccac0209ac24
  event: CH2_MarazhaiHelloAgain_20
  text: '"Пожалуй, я зря ждал чего-то занятного от мон-кай. Твои вопросы навевают скуку. Разговор закончен".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Пожалуй, я зря ждал чего-то занятного от мон-кай. Твои вопросы навевают скуку. Разговор закончен.
- guid: 3c461485-3930-472c-ad7e-7e9de945eee2
  event: CH2_MarazhaiHelloAgain_21
  text: '"О, мон-кай. Я не играю по твоим правилам".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: О, мон-кай. Я не играю по твоим правилам.
- guid: 0620a2c0-68b4-485f-aeb7-de2f0eb78da4
  event: CH2_MarazhaiHelloAgain_23
  text: '"Похищение солнц? {g|Encyclopedia:Drukhari}Друкари{/g} способны и не на такое, мон-кай — Комморра купается в лучах трех светил, украденных моими сородичами. Но если ты думаешь, что я приложил руку к этому, или иному воровству звезд — напрасно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Похищение солнц? Друкари способны и не на такое, мон-кай — Комморра купается в лучах трех светил, украденных моими сородичами. Но если ты думаешь, что я приложил руку к этому, или иному воровству звезд — напрасно.
- guid: 1de1d515-1971-43de-bb5f-e70242f41a41
  event: CH2_MarazhaiHelloAgain_24
  text: '"Славно, мон-кай. Что ж, раз предложение передано... я вынужден откланяться. Надеюсь, ты как следует развлечешь моих подданных, что я оставляю взамен себя".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Славно, мон-кай. Что ж, раз предложение передано... я вынужден откланяться. Надеюсь, ты как следует развлечешь моих подданных, что я оставляю взамен себя.
- guid: 409040dd-2686-44b9-ae32-d2b275e20945
  event: CH2_MarazhaiHelloAgain_25
  text: '"Так или иначе, но меня изрядно утомили твои попытки отсрочить неизбежное. Уверен, что и ты уже выдох{mf|ся|лась}, гоняясь за нами между звезд. Давай положим этому конец. Закончим противостояние. Мои силы против твоих. Раз и навсегда".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Так или иначе, но меня изрядно утомили твои попытки отсрочить неизбежное. Уверен, что и ты уже выдохся, гоняясь за нами между звезд. Давай положим этому конец. Закончим противостояние. Мои силы против твоих. Раз и навсегда.
- guid: 8e425fc8-40f4-4831-9fde-c6639879acfc
  event: CH2_MarazhaiHelloAgain_26
  text: '"Хочешь найти его?" {n}Глаза ксеноса вспыхивают от темного восторга, его голос становится издевательски услужливым.{/n} "Что ж, мон-кай, тогда шли своих слуг за Цинерус Малефикум. Уверен, они вернутся... с удивительными результатами".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Хочешь найти его?
  - speaker: narrator
    text_clean: Глаза ксеноса вспыхивают от темного восторга, его голос становится издевательски услужливым.
  - speaker: Маражай Аэзирраэш
    text_clean: Что ж, мон-кай, тогда шли своих слуг за Цинерус Малефикум. Уверен, они вернутся... с удивительными результатами.
- guid: 0d80d187-bbd6-4f67-9862-d17cab9d105c
  event: CH2_MarazhaiHelloAgain_27
  text: '"Захлопни свою поганую пасть, проклятая тварь! Ни одна мерзость вроде тебя не смеет говорить в таком тоне с избранником Императора!" {n}Абеляр белеет от ярости.{/n}'
  speaker: Абеляр Версериан
  parts:
  - speaker: Абеляр Версериан
    text_clean: Захлопни свою поганую пасть, проклятая тварь! Ни одна мерзость вроде тебя не смеет говорить в таком тоне с избранником Императора!
  - speaker: narrator
    text_clean: Абеляр белеет от ярости.
- guid: d4c52fe5-3b90-4d0f-a819-c612ce9fdc91
  event: CH2_MarazhaiHelloAgain_28
  text: '{n}Ксенос склоняет голову набок.{/n} "Почему же? Я передал приглашение — руками скота, что обретался на этом мире — и "избранник" послушно явился. Разве я погрешил против истины?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Ксенос склоняет голову набок.
  - speaker: Маражай Аэзирраэш
    text_clean: Почему же? Я передал приглашение — руками скота, что обретался на этом мире — и "избранник" послушно явился. Разве я погрешил против истины?
- guid: 8d083373-4b7e-4c59-b9cf-b140040f70ff
  event: CH2_MarazhaiHelloAgain_29
  text: '{n}Ксенос змеиным движением поворачивается к Ирлиэт.{/n} "Одна из моих мягкотелых родичей. Какой подачкой тебя прикормили, раз ты опустилась до сопровождения этих животных? Или их компания напоминает тебе об обществе твоих потерянных братьев и сестер?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Ксенос змеиным движением поворачивается к Ирлиэт.
  - speaker: Маражай Аэзирраэш
    text_clean: Одна из моих мягкотелых родичей. Какой подачкой тебя прикормили, раз ты опустилась до сопровождения этих животных? Или их компания напоминает тебе об обществе твоих потерянных братьев и сестер?
