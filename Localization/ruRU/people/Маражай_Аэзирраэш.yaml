  text: '"Ты странствуешь среди звезд и долж{mf|ен|на} знать это место... Древний простор, в котором еще звучит эхо звездной агонии. Место, что служит кладбищем старинных звезд, по-прежнему полное остаточных излучений и сияющей пыли. Место, что похоронило вашу жестянку, набитую сладкими, испуганными мон-кай и ужасами, что пожрали их. Порог нашего царства. Вы называете его Цинерус Малефикум. Там мы и решим наши разногласия. Кабал Опустошительной бури будет ждать тебя, мон-кай — не приходи безоружным".'
