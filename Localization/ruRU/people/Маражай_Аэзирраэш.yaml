  - speaker: Маражай Аэзирраэш
    text_clean: О, мон-кай, зачем же так неизящно выдавать свой страх и неуверенность? Что, Вольный Торговец дозволяет мне больше, чем тебе, раз ты так стремишься отогнать меня подальше? Это твоя вина, а не моя.
- guid: 86d441e6-5b94-43a8-83bb-ad52688d373d
  event: BNTRS_Reactivity_Marazhai_77
  text: '"Скот быстро учится своему месту. Похвально".'
  speaker: Маражай Аэзирраэш
