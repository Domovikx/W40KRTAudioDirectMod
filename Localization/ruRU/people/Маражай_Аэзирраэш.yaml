  - speaker: Маражай Аэзирраэш
    text_clean: Тогда что еще тебе нужно знать?
- guid: adb26f9d-9cd1-4e6b-9bed-175857fe2e73
  event: Companions_Marazhai_83
  text: '"Ммм. Занятное объяснение того, что ты не в силах постичь. Хотя и весьма предсказуемое".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ммм. Занятное объяснение того, что ты не в силах постичь. Хотя и весьма предсказуемое.
- guid: dd9ad9ba-9445-43cc-bdb3-9b0cd6f6d8af
  event: Companions_Marazhai_84
  text: '"Хм. Почему я не удивлен тому, как быстро ты уш{mf|ел|ла} от темы".'
