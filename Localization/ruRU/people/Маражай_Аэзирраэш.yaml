- guid: 1fd7cb31-9d79-4d65-8fcf-3d0d3d5ffea7
  event: RMNC_Marazhai_StartingEvent_P2_15
  text: '{n}Губы Маражая растягиваются в улыбке.{/n} "Покорн{mf|ый|ая} питом{mf|ец|ица}. Хорошо". {n}Он наклоняется еще ближе — и вдруг отталкивает вас, отстраняясь с безразличным видом и с хлопком возвращая деталь доспеха на место.{/n} "Тогда начни с исполнения моего приказа. Если мы встретим ее, то Иремерисс будет моей. А теперь — иди, {name}. Я с тобой закончил. Пока".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Губы Маражая растягиваются в улыбке.
  - speaker: Маражай Аэзирраэш
    text_clean: Покорный питомец. Хорошо.
  - speaker: narrator
    text_clean: Он наклоняется еще ближе — и вдруг отталкивает вас, отстраняясь с безразличным видом и с хлопком возвращая деталь доспеха на место.
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда начни с исполнения моего приказа. Если мы встретим ее, то Иремерисс будет моей. А теперь — иди, КЭП. Я с тобой закончил. Пока.
- guid: 256dec8c-41b3-4b4d-bc7a-601cb77dd96d
  event: RMNC_Marazhai_StartingEvent_P2_16
  text: '{n}Маражай издевательски смеется.{/n} "Верно, {name}! Все, что тебе нужно — это сосредоточиться на своих обязательствах".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай издевательски смеется.
  - speaker: Маражай Аэзирраэш
    text_clean: Верно, КЭП! Все, что тебе нужно — это сосредоточиться на своих обязательствах.
- guid: 2c41b160-ceb9-4d04-bf45-692e3d0dcd2e
  event: RMNC_Marazhai_StartingEvent_P2_17
  text: '"Посмотрим, как ты справишься с теми, что я уже возложил на тебя. Помни — Иремерисс моя, когда бы и где бы мы не встретили ее. На этом — мой разговор к тебе исчерпан, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Посмотрим, как ты справишься с теми, что я уже возложил на тебя. Помни — Иремерисс моя, когда бы и где бы мы не встретили ее. На этом — мой разговор к тебе исчерпан, КЭП.
- guid: a035aa8f-e2b2-4d83-99e1-9d3d5334d876
  event: RMNC_Marazhai_StartingEvent_P2_18
  text: '"Право забрать жизнь Эзирраеш есть только у Эзирраеш. Ты дашь мне возможность прервать существование архонта Опустошительной бури".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Право забрать жизнь Эзирраеш есть только у Эзирраеш. Ты дашь мне возможность прервать существование архонта Опустошительной бури.
- guid: e6c8db64-86ca-40d3-880c-87e6f62b8821
  event: RMNC_Marazhai_StartingEvent_P2_19
  text: '"Тогда вернемся к тому, что я требую. Душа Иремерисс и мое право на нее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда вернемся к тому, что я требую. Душа Иремерисс и мое право на нее.
- guid: 1f125aa8-f4cf-4996-80d8-96d3307b1291
  event: RMNC_Marazhai_StartingEvent_P2_20
  text: '"Да?..." {n}На лице друкари появляется выражение глубочайшего недоумения.{/n} "И твое изумление заставляет меня думать, что мон-кай еще примитивнее, чем я подозревал. Не говори мне, что узы крови налагают на вас какие-то особые запреты и табу".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Да?...
  - speaker: narrator
    text_clean: На лице друкари появляется выражение глубочайшего недоумения.
  - speaker: Маражай Аэзирраэш
    text_clean: И твое изумление заставляет меня думать, что мон-кай еще примитивнее, чем я подозревал. Не говори мне, что узы крови налагают на вас какие-то особые запреты и табу.
- guid: 416071be-ddc2-492b-b737-c5b902d3b4e8
  event: RMNC_Marazhai_StartingEvent_P2_21
  text: '"Да. Я ценил ее, пока она не зашла слишком далеко в своих попытках избавиться от меня. Она ценила меня, пока я не отказался молча подставить горло под клинок. Отношения зашли в тупик. Осталось лишь перерубить этот узел".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Да. Я ценил ее, пока она не зашла слишком далеко в своих попытках избавиться от меня. Она ценила меня, пока я не отказался молча подставить горло под клинок. Отношения зашли в тупик. Осталось лишь перерубить этот узел.
- guid: 2bc6dc53-f7f9-4279-b347-07c53883186a
  event: RMNC_Marazhai_StartingEvent_P2_22
  text: '{n}Маражай с довольным смешком уклоняется от удара и подается назад.{/n} "Напрасно. Впрочем, неважно. Вернемся к твоим обязательствам".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай с довольным смешком уклоняется от удара и подается назад.
  - speaker: Маражай Аэзирраэш
    text_clean: Напрасно. Впрочем, неважно. Вернемся к твоим обязательствам.
- guid: 017ea674-5f13-4907-80bb-c57c5daa110a
  event: RMNC_Marazhai_StartingEvent_P2_23
  text: '"Наивное создание... гемункулам Комморры — вроде Тервантьяса, пригретого Иремерисс — по силам выращивать новые тела из небольших кусков плоти, заключенных в амниотические трубки. Любой друкари, сраженный тобой на поле боя, может вновь прийти за тобой. Если душа Иремерисс будет у меня — возможно, ее клон — если он появится — выйдет неполноценным. Быть может, она даже не вспомнит обо мне".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Наивное создание... гемункулам Комморры — вроде Тервантьяса, пригретого Иремерисс — по силам выращивать новые тела из небольших кусков плоти, заключенных в амниотические трубки. Любой друкари, сраженный тобой на поле боя, может вновь прийти за тобой. Если душа Иремерисс будет у меня — возможно, ее клон — если он появится — выйдет неполноценным. Быть может, она даже не вспомнит обо мне.
- guid: 9cd0eb1d-403e-43d8-8583-4297ad77958c
  event: RMNC_Marazhai_StartingEvent_P2_24
  text: '"Мон-кай..." {n}Друкари осекается. Вы видите, как у ксеноса сводит скулы, когда он с трудом выдавливает из себя:{/n} "...{name}. У меня есть для тебя поручение".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мон-кай...
  - speaker: narrator
    text_clean: 'Друкари осекается. Вы видите, как у ксеноса сводит скулы, когда он с трудом выдавливает из себя:'
  - speaker: Маражай Аэзирраэш
    text_clean: '...КЭП. У меня есть для тебя поручение.'
- guid: 273c8769-054d-430b-bc0e-a2990db43289
  event: RMNC_Marazhai_StartingEvent_P2_25
  text: '"Славно, {name}. Поверь, ты никогда не смог бы обречь ее на худшую участь, чем я приготовил для нее. Теперь же, когда этот договор заключен..." {n}Маражай с хлопком возвращает пластину на место.{/n} "Мы оба можем идти".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Славно, КЭП. Поверь, ты никогда не смог бы обречь ее на худшую участь, чем я приготовил для нее. Теперь же, когда этот договор заключен...
  - speaker: narrator
    text_clean: Маражай с хлопком возвращает пластину на место.
  - speaker: Маражай Аэзирраэш
    text_clean: Мы оба можем идти.
- guid: 75238ce3-8c0c-465c-8126-937e63488bfa
  event: RMNC_Marazhai_StartingEvent_P2_26
  text: '"Все... несколько сложнее, чем ты способ{mf|ен|на} осознать. Наша старинная игра должна закончиться. Мой первый шаг пошел прахом из-за предательства Назракея — теперь мне остается только довести начатое до конца. Своими руками добить ее, пока она не добила меня".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Все... несколько сложнее, чем ты способен осознать. Наша старинная игра должна закончиться. Мой первый шаг пошел прахом из-за предательства Назракея — теперь мне остается только довести начатое до конца. Своими руками добить ее, пока она не добила меня.
- guid: 9d42ac2d-1c6f-43b4-a031-caf69159f89e
  event: RMNC_Marazhai_StartingEvent_P2_27
  text: '{n}Друкари издевательски скалится.{/n} "Твой страх почти осязаем. Восхитительно. Что ж, вернемся к тому, зачем я тебя позвал — Иремерисс. И твои обязанности передо мной".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари издевательски скалится.
  - speaker: Маражай Аэзирраэш
    text_clean: Твой страх почти осязаем. Восхитительно. Что ж, вернемся к тому, зачем я тебя позвал — Иремерисс. И твои обязанности передо мной.
- guid: 5464d1bc-27cb-4135-8bc4-3cb34af37934
  event: RMNC_Marazhai_StartingEvent_P2_28
  text: '"Я... помню". {n}Когда вы разжимаете хватку, друкари несколько мгновений смотрит на вас, чуть склонив голову.{/n} "Прежде чем я оставлю тебя... могу ли я просить о том, чтобы Иремерисс досталась мне?" {n}В его голосе — покладистость, которая одновременно кажется искренней и насмешливой.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я... помню.
  - speaker: narrator
    text_clean: Когда вы разжимаете хватку, друкари несколько мгновений смотрит на вас, чуть склонив голову.
  - speaker: Маражай Аэзирраэш
    text_clean: Прежде чем я оставлю тебя... могу ли я просить о том, чтобы Иремерисс досталась мне?
  - speaker: narrator
    text_clean: В его голосе — покладистость, которая одновременно кажется искренней и насмешливой.
- guid: 8ac032d2-810c-45d3-8185-e6fe0fbc03f9
  event: RMNC_Marazhai_StartingEvent_P2_29
  text: '"Я... помню". {n}Когда вы разжимаете хватку, друкари несколько мгновений смотрит на вас, чуть склонив голову.{/n} "И я буду помнить... если ты не утратишь хватку". {n}Глаза Маражая голодно блестят.{/n} "Поскольку ты уже пообещал{mf||а} мне Иремерисс... я оставлю тебя. Когда придет время убивать... дай мне знать".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я... помню.
  - speaker: narrator
    text_clean: Когда вы разжимаете хватку, друкари несколько мгновений смотрит на вас, чуть склонив голову.
  - speaker: Маражай Аэзирраэш
    text_clean: И я буду помнить... если ты не утратишь хватку.
  - speaker: narrator
    text_clean: Глаза Маражая голодно блестят.
  - speaker: Маражай Аэзирраэш
    text_clean: Поскольку ты уже пообещал мне Иремерисс... я оставлю тебя. Когда придет время убивать... дай мне знать.
- guid: 3987bca4-5c65-4c66-8343-5b974cd5ecef
  event: RMNC_Marazhai_StartingEvent_P2_30
  text: '"Иремерисс — моя сестра. Какое это имеет значение?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Иремерисс — моя сестра. Какое это имеет значение?
