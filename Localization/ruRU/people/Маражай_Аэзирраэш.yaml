- guid: 8585bba5-5722-4fe6-b7d9-0f85fea4f461
  event: Companions_Marazhai_58
  text: '{n}Маражай осклабляется.{/n} "Ты создал{mf||а} условия для того, чтобы я {d|Encyclopedia:CompMarazhai_Free}не знал отказа{/d} ни в одном своем желании. Твой экипаж чует мою власть над ними и боится меня — я купаюсь в их страхе каждый раз, когда ступаю на мостик. Хорошо. Скот должен знать свое место".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай осклабляется.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты создал условия для того, чтобы я не знал отказа ни в одном своем желании. Твой экипаж чует мою власть над ними и боится меня — я купаюсь в их страхе каждый раз, когда ступаю на мостик. Хорошо. Скот должен знать свое место.
- guid: 5dce99ac-8d90-4644-b1f3-afc43c155d25
  event: Companions_Marazhai_59
  text: '{n}Маражай изгибает губы в усмешке.{/n} "Ты выделил{mf||а} мне {d|Encyclopedia:CompMarazhai_Compartment}угодья{/d}... не то, к чему я привык, но вполне достаточно, чтобы занять себя, когда это корыто пронзает вуаль. Твой экипаж хорошо знает, какой сектор корабля принадлежит мне... и, кажется, уже решили, что вышвыривать туда нарушителей порядка — лучшее применение для него. Неважно. Они все кричат одинаково".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай изгибает губы в усмешке.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты выделил мне угодья... не то, к чему я привык, но вполне достаточно, чтобы занять себя, когда это корыто пронзает вуаль. Твой экипаж хорошо знает, какой сектор корабля принадлежит мне... и, кажется, уже решили, что вышвыривать туда нарушителей порядка — лучшее применение для него. Неважно. Они все кричат одинаково.
- guid: 254e54ef-4757-485a-a99b-0330ba8e93a3
  event: Companions_Marazhai_60
  text: '{n}Маражай бросает на вас темный взгляд.{/n} "Ты смеешь задавать мне этот вопрос, {name}? Каждый раз, когда это корыто пронзает вуаль, я {d|Encyclopedia:CompMarazhai_Locked}остаюсь один на один{/d} со всеми кошмарами Той, Что Жаждет. Даже мне требуется вся выдержка и все силы, чтобы дать им отпор... и под рукой никогда нет того, с кем бы я мог порезвиться — только холодные стены и запертый шлюз!"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай бросает на вас темный взгляд.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты смеешь задавать мне этот вопрос, КЭП? Каждый раз, когда это корыто пронзает вуаль, я остаюсь один на один со всеми кошмарами Той, Что Жаждет. Даже мне требуется вся выдержка и все силы, чтобы дать им отпор... и под рукой никогда нет того, с кем бы я мог порезвиться — только холодные стены и запертый шлюз!
- guid: 8bef0329-750f-4b97-ab8e-124b64fa3f89
  event: Companions_Marazhai_61
  text: '"Что он существует. Что мой Кабал обнаружил его, беспомощного и недвижимого, не способного защитить своих сыновей и дочерей. Что в шпиле Опустошительной бури начали появляться пленники-сородичи, источники утонченной и прелестной боли. Я слишком много времени проводил за пределами нашей обители, чтобы узнать больше... но и этого хватило, чтобы соблазнить Ирлиэт ложной надеждой".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Что он существует. Что мой Кабал обнаружил его, беспомощного и недвижимого, не способного защитить своих сыновей и дочерей. Что в шпиле Опустошительной бури начали появляться пленники-сородичи, источники утонченной и прелестной боли. Я слишком много времени проводил за пределами нашей обители, чтобы узнать больше... но и этого хватило, чтобы соблазнить Ирлиэт ложной надеждой.
- guid: 839fb8d8-8c63-4cf3-a8ea-3deacb0071bd
  event: Companions_Marazhai_62
  text: '{n}Маражай издает странный звук — не то кашель, не то смешок.{/n} "Твой язык подводит тебя. Мне показалось, что ты... пытаешься избавиться от меня?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай издает странный звук — не то кашель, не то смешок.
  - speaker: Маражай Аэзирраэш
    text_clean: Твой язык подводит тебя. Мне показалось, что ты... пытаешься избавиться от меня?
- guid: 1c04d633-bcf2-4541-bab6-4b0900819fe3
  event: Companions_Marazhai_63
  text: '{n}Маражай издает утробный смешок.{/n} "Почему же? Я обещал воссоединить ее с родичами. Долгожданная встреча в пыточной — я нахожу это... весьма трогательным. Им было бы что обсудить. И чем развлечь себя — и нас — в тесном семейном кругу".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай издает утробный смешок.
  - speaker: Маражай Аэзирраэш
    text_clean: Почему же? Я обещал воссоединить ее с родичами. Долгожданная встреча в пыточной — я нахожу это... весьма трогательным. Им было бы что обсудить. И чем развлечь себя — и нас — в тесном семейном кругу.
- guid: 995a48c3-afc8-4ea7-b1fc-41aa9762d76c
  event: Companions_Marazhai_64
  text: '"Мы уже перемолвились словечком, {name}. Мне нет больше смысла скрывать правду — Ирлиэт исчерпала свой потенциал в моих глазах. Заглянуть ей в лицо, когда она узнала истину, было бесценно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мы уже перемолвились словечком, КЭП. Мне нет больше смысла скрывать правду — Ирлиэт исчерпала свой потенциал в моих глазах. Заглянуть ей в лицо, когда она узнала истину, было бесценно.
- guid: deaaa07a-b616-40bd-baac-e48fb9c1a275
  event: Companions_Marazhai_65
  text: '"Все верно. Ты весьма заботливо избавил{mf|ся|ась} от нее прежде, чем ее хрупкое сердечко разбили мои слова".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Все верно. Ты весьма заботливо избавился от нее прежде, чем ее хрупкое сердечко разбили мои слова.
- guid: 883433ac-a8b8-4570-af35-abd4ea8ec722
  event: Companions_Marazhai_66
  text: '{n}Друкари чуть откидывает голову, его взгляд устремлен в пустоту.{/n} "Если они заявятся вновь — их ждет тот же прием, который я уже им оказал. Так что умерь свой страх: мандрагоры хотят добраться только до меня, а я знаю, как обращаться с незваными гостями".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Друкари чуть откидывает голову, его взгляд устремлен в пустоту.
  - speaker: Маражай Аэзирраэш
    text_clean: 'Если они заявятся вновь — их ждет тот же прием, который я уже им оказал. Так что умерь свой страх: мандрагоры хотят добраться только до меня, а я знаю, как обращаться с незваными гостями.'
- guid: 2ce6fee7-f135-4a30-afc9-729857995130
  event: Companions_Marazhai_67
  text: '"Что-то еще, {name}?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Что-то еще, КЭП?
- guid: aa718a73-567e-47fe-845d-65cb9cff16ce
  event: Companions_Marazhai_68
  text: '"Интригую? Какой интересный оборот речи". {n}Маражай наклоняется еще ближе и протягивает к вам руку, беря вас за подбородок несколькими когтистыми пальцами.{/n} "Ты не страшишься меня, а... заинтригован{mf||а}? Что ж. Возможно, я снизойду до того, чтобы удовлетворить твое любопытство. Если ты будешь подобающе покор{mf|ен|на}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Интригую? Какой интересный оборот речи.
  - speaker: narrator
    text_clean: Маражай наклоняется еще ближе и протягивает к вам руку, беря вас за подбородок несколькими когтистыми пальцами.
  - speaker: Маражай Аэзирраэш
    text_clean: Ты не страшишься меня, а... заинтригован? Что ж. Возможно, я снизойду до того, чтобы удовлетворить твое любопытство. Если ты будешь подобающе покорен.
- guid: 61225c47-f6c2-45e5-ad88-16fcb9110ff4
  event: Companions_Marazhai_69
  text: '{n}Взгляд друкари становится испепеляющим. Кажется, что он сейчас кинется на вас... но в последний момент Маражай бросает взгляд вокруг и удерживается от порыва.{/n} "Молись своим богам, чтобы наши дорожки более никогда не пересеклись, мон-кай".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Взгляд друкари становится испепеляющим. Кажется, что он сейчас кинется на вас... но в последний момент Маражай бросает взгляд вокруг и удерживается от порыва.
  - speaker: Маражай Аэзирраэш
    text_clean: Молись своим богам, чтобы наши дорожки более никогда не пересеклись, мон-кай.
- guid: c389fa9f-86ba-4a2b-92f0-188913fd0778
  event: Companions_Marazhai_70
  text: '"Значит, наши цели совпадают. Пока что".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Значит, наши цели совпадают. Пока что.
- guid: df9b06b1-45f4-496d-8dbc-a494253d89c3
  event: Companions_Marazhai_71
  text: '"Следи за выражениями, {name} — это мон-кай пристало бежать и скрываться, а не моему роду. Комморра — наследие наших предков. Когда-то они нашли способ проникать в переплетения Паутины и перемещаться по ее запутанным лабиринтам. Немногие рискнут путешествовать и тем более возводить свои бастионы в этом раздробленном царстве. Друкари — единственные эльдары, которые не страшатся ужасов Паутины, ибо каждая преодоленная опасность делает нас сильнее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Следи за выражениями, КЭП — это мон-кай пристало бежать и скрываться, а не моему роду. Комморра — наследие наших предков. Когда-то они нашли способ проникать в переплетения Паутины и перемещаться по ее запутанным лабиринтам. Немногие рискнут путешествовать и тем более возводить свои бастионы в этом раздробленном царстве. Друкари — единственные эльдары, которые не страшатся ужасов Паутины, ибо каждая преодоленная опасность делает нас сильнее.
- guid: 2bcef11a-a9c0-471f-b17c-39d98fe12b9a
  event: Companions_Marazhai_72
  text: '"Ммм. Полагаю, поддал{mf|ся|ась} соблазну момента? Тебе стоит лучше обдумывать свои действия, {name}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ммм. Полагаю, поддался соблазну момента? Тебе стоит лучше обдумывать свои действия, КЭП.
- guid: 1d22f677-f67f-4767-a823-2dce8f5595e4
  event: Companions_Marazhai_73
  text: '"Славн{mf|ый|ая}, послуш{mf|ный|ная} звер{mf|ек|ушка}..." {n}Маражай суживает глаза.{/n} "Я найду способ просветить тебя... и получить от этого удовольствие".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Славный, послушный зверек...
  - speaker: narrator
    text_clean: Маражай суживает глаза.
  - speaker: Маражай Аэзирраэш
    text_clean: Я найду способ просветить тебя... и получить от этого удовольствие.
- guid: a71714b3-cc6c-4b2d-8026-d3c8608ab8da
  event: Companions_Marazhai_74
  text: '"Ты не услышал{mf||а} меня, когда я ответил тебе в первый раз? Я не люблю повторяться дважды".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты не услышал меня, когда я ответил тебе в первый раз? Я не люблю повторяться дважды.
- guid: 9c295988-247b-4e4e-b356-c0bbab3b75dc
  event: Companions_Marazhai_75
  text: '{n}Маражай едва слышно вздыхает — и вы не можете понять, наигранно или искренне его удивление.{/n} "А, ценитель{mf||ница} всех оттенков власти? Что ж..." {n}Он одним движением выкручивает руку из вашей хватки и смотрит на вас из-под полуопущенных век.{/n} "Я услышал тебя, {name}. И это может быть... необычно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай едва слышно вздыхает — и вы не можете понять, наигранно или искренне его удивление.
  - speaker: Маражай Аэзирраэш
    text_clean: А, ценитель всех оттенков власти? Что ж...
  - speaker: narrator
    text_clean: Он одним движением выкручивает руку из вашей хватки и смотрит на вас из-под полуопущенных век.
  - speaker: Маражай Аэзирраэш
    text_clean: Я услышал тебя, КЭП. И это может быть... необычно.
- guid: bcc24321-4d49-4e2a-b696-70266ceb57c7
  event: Companions_Marazhai_76
  text: '{n}Маражай щелкает языком.{/n} "Мандрагоры, которых я когда-то использовал, чтобы добраться до тебя. Твари из бездн Комморры решили, что могут застать меня врасплох здесь, на твоей посудине. Я преподал им урок. Одному вырезал символ Эзирраеш на горле и вышвырнул обратно в тени — чтобы стал посланием тем, кто не рискнул прийти за мной в этот раз".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай щелкает языком.
  - speaker: Маражай Аэзирраэш
    text_clean: Мандрагоры, которых я когда-то использовал, чтобы добраться до тебя. Твари из бездн Комморры решили, что могут застать меня врасплох здесь, на твоей посудине. Я преподал им урок. Одному вырезал символ Эзирраеш на горле и вышвырнул обратно в тени — чтобы стал посланием тем, кто не рискнул прийти за мной в этот раз.
- guid: 2d8dce6f-308f-4acd-9f20-9820984cb7f0
  event: Companions_Marazhai_77
  text: '{n}Маражай со смехом отстраняется от вас.{/n} "Тогда не говори того, чего на самом деле не думаешь, {name}. Это... небезопасно для твоего вида".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай со смехом отстраняется от вас.
  - speaker: Маражай Аэзирраэш
    text_clean: Тогда не говори того, чего на самом деле не думаешь, КЭП. Это... небезопасно для твоего вида.
- guid: 921c72d5-df6a-4311-8ae2-934d34f03f12
  event: Companions_Marazhai_78
  text: '{n}Маражай окидывает взглядом мостик корабля. На мгновение вам кажется, что в обычно надменно-насмешливом взгляде друкари читается растерянность.{/n} "Я... должен привыкнуть к своим новым обстоятельствам. И этому ведру, которое мон-кай называют пустотным кораблем. Эти сплавы переборок... столь примитивно..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: narrator
    text_clean: Маражай окидывает взглядом мостик корабля. На мгновение вам кажется, что в обычно надменно-насмешливом взгляде друкари читается растерянность.
  - speaker: Маражай Аэзирраэш
    text_clean: Я... должен привыкнуть к своим новым обстоятельствам. И этому ведру, которое мон-кай называют пустотным кораблем. Эти сплавы переборок... столь примитивно...
- guid: db62e461-ad78-42aa-8767-db58e8ead814
  event: Companions_Marazhai_79
  text: '"Явиться на место встречи с остатками Опустошительной бури. Меня снедает любопытство, что это — ловушка? Или же мои бывшие подданные настолько отчаялись, что действительно решили играть в открытую? Хм... посмотрим".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Явиться на место встречи с остатками Опустошительной бури. Меня снедает любопытство, что это — ловушка? Или же мои бывшие подданные настолько отчаялись, что действительно решили играть в открытую? Хм... посмотрим.
- guid: 41240987-2c2e-4f51-ac36-3196d6966361
  event: Companions_Marazhai_80
  text: '"Дальше" — слишком расплывчатое понятие. Когда придет время, я вернусь в Комморру и {d|Encyclopedia:CompMarazhai_Archont}займу трон архонта{/d} — место, которое принадлежит мне по праву. А пока... пока я остаюсь здесь, подле тебя. Я чую в будущем еще немало крови и страданий, которые мне будет жаль упустить".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Дальше" — слишком расплывчатое понятие. Когда придет время, я вернусь в Комморру и займу трон архонта — место, которое принадлежит мне по праву. А пока... пока я остаюсь здесь, подле тебя. Я чую в будущем еще немало крови и страданий, которые мне будет жаль упустить.
- guid: 7adb94a6-986a-4851-a536-076e41fa352f
  event: Companions_Marazhai_81
