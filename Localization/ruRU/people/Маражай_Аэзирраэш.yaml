  event: RMNC_Marazhai_StartingEvent_P2_12
  text: '"Верно. Прямо в нервные узлы". {n}Друкари склоняет голову набок, его голос обретает бархатные ноты — он смакует каждое слово.{/n} "Прямая стимуляция триггерных зон, вызывающая постоянную, неослабевающую боль. Знаешь ли ты, какое наслаждение испытываешь, когда твое страдание звенит в унисон с чужим? Какой экстаз преисполняет тебя, когда собственная агония сливается с агонией врага? Это — то, из чего соткан мой мир, {name}".'
