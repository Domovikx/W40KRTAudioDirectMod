- guid: 19dd59cd-c71f-40b8-a5a7-c5aad8e00fd8
  event: BNTRS_DLC3_Marazhai_41
  text: '"Тот, кто способен собирать самых опасных противников в галактике словно коллекционер, вряд ли прельстился бы большим количеством мон-кайских творений".'
