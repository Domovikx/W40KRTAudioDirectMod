- guid: 4048d7f9-bb10-4491-ba01-1cb1d1dc9a39
  event: Companions_Marazhai_46
  text: '"Впрочем, Иремерисс никогда не нравилось подчиненное положение кабала. Ее слова, а порой и поступки, направленные против Черного сердца, вызывали у ее слуг шепотки недовольства и страха. Я не собирался отказываться от протекции кабала самого Асдрубаэля Векта — если бы мне удалось сбросить Иремерисс с помощью Назракея, я бы нашел поддержку".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Впрочем, Иремерисс никогда не нравилось подчиненное положение кабала. Ее слова, а порой и поступки, направленные против Черного сердца, вызывали у ее слуг шепотки недовольства и страха. Я не собирался отказываться от протекции кабала самого Асдрубаэля Векта — если бы мне удалось сбросить Иремерисс с помощью Назракея, я бы нашел поддержку.
