name: Маражай Аэзирраэш
sound_keys:
- Marazhai
doc: docs/characters/Маражай_Аэзирраэш.md
total_phrases: 325
phrases:
- guid: ae828a38-72d6-46be-bd5e-ce11131656c4
  event: BNTRS_AreaStressful_Marazhai_29
  text: '"Любопытно. Тела огиров исчезают после гибели. Эти экземпляры, очевидно, ущербные, раз они все еще здесь".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Любопытно. Тела огиров исчезают после гибели. Эти экземпляры, очевидно, ущербные, раз они все еще здесь.
- guid: 4325e253-54c3-458c-9d32-7e0629789202
  event: BNTRS_Chapter3_Marazhai_105
  text: '"Культ не простит, что мы выпотрошили их лучших бойцов. Думаю, нас уже выслеживает пара охотников за чемпионами — наши головы теперь особо ценны".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Культ не простит, что мы выпотрошили их лучших бойцов. Думаю, нас уже выслеживает пара охотников за чемпионами — наши головы теперь особо ценны.
- guid: a2f05b9b-4957-430e-86ce-a3ece9a23304
  event: BNTRS_Chapter3_Marazhai_112
  text: '"И из всех, кого он мог выбрать объектом своего внимания... мон-кай. Что бы не творилось у него в голове — это будет или величайший фарс, или хорошо поставленная катастрофа".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: И из всех, кого он мог выбрать объектом своего внимания... мон-кай. Что бы не творилось у него в голове — это будет или величайший фарс, или хорошо поставленная катастрофа.
- guid: 09a1747e-64d7-4516-87a1-1b32009ba829
  event: BNTRS_Chapter3_Marazhai_116
  text: '"Вывернуты наизнанку? То же можно сказать о всей сути его племени. Даже архонты опасаются Аребенниан — и не зря".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Вывернуты наизнанку? То же можно сказать о всей сути его племени. Даже архонты опасаются Аребенниан — и не зря.
- guid: ccd6b836-a051-45cc-b8e5-21e930071ba8
  event: BNTRS_Chapter3_Marazhai_123
  text: '"Ха. Мясо с арены решило держаться толпы, чтобы не стать чьей-то добычей?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ха. Мясо с арены решило держаться толпы, чтобы не стать чьей-то добычей?
- guid: 58aca5fd-cf3c-4f8f-af36-84bbb2d78d6f
  event: BNTRS_Chapter3_Marazhai_18
  text: '"В чем дело, узник? Ты годами был доволен своей участью, а теперь в тебе взыграло свободолюбие? Запоздалая смелость".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: В чем дело, узник? Ты годами был доволен своей участью, а теперь в тебе взыграло свободолюбие? Запоздалая смелость.
- guid: cc09832d-0b53-407d-aed7-76ec5c1ac428
  event: BNTRS_Chapter3_Marazhai_37
  text: '"Кузина, будь любезна — поблагодари беловолосую мон-кай еще пару раз. Выражение ее лица, когда она слышит похвалу от тебя... бесценно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Кузина, будь любезна — поблагодари беловолосую мон-кай еще пару раз. Выражение ее лица, когда она слышит похвалу от тебя... бесценно.
- guid: 9f22b93d-74c4-4966-b6f3-cccacc465e81
  event: BNTRS_Chapter3_Marazhai_90
  text: '"Ты не способен запомнить мое имя? Я могу вырезать его на изнанке твоих век, если память тебя подводит".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты не способен запомнить мое имя? Я могу вырезать его на изнанке твоих век, если память тебя подводит.
- guid: bb1663fc-c16c-4f7e-8860-618a27f4aa6e
  event: BNTRS_Chapter3_Marazhai_92
  text: '"Тише, Ирлиэт, тише. Разве Пути не учат вас сдерживать мелочные страсти? Следи за собой, иначе может произойти что-то непоправимое. Снова".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Тише, Ирлиэт, тише. Разве Пути не учат вас сдерживать мелочные страсти? Следи за собой, иначе может произойти что-то непоправимое. Снова.
- guid: c1419987-60b3-4762-8cca-0a3bafe6ce38
  event: BNTRS_Chapter3_Marazhai_93
  text: '"Одно мое присутствие заставляет тебя трястись от бешенства. Мне даже не надо ничего с тобой делать. Восхитительно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Одно мое присутствие заставляет тебя трястись от бешенства. Мне даже не надо ничего с тобой делать. Восхитительно.
- guid: 975416d2-f5ed-4262-ac14-6d8be52681e7
  event: BNTRS_Chapter3_Marazhai_96
  text: '"Твой язык еще более угловатый и уродливый, чем обычный мон-кайский. Как это вообще возможно?'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Твой язык еще более угловатый и уродливый, чем обычный мон-кайский. Как это вообще возможно?
- guid: 98320e7f-c5ca-4dc2-9936-cd3d6e4e778f
  event: BNTRS_Chapter4_Marazhai_01
  text: '"Гибель остатков Азуриани на мире, покрытом лесами, была предсказуема. Рано или поздно, но без своей скорлупы-корабля они были обречены".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Гибель остатков Азуриани на мире, покрытом лесами, была предсказуема. Рано или поздно, но без своей скорлупы-корабля они были обречены.
- guid: 00bd57c6-b7a9-474c-8a62-4527a2c5c61a
  event: BNTRS_Chapter4_Marazhai_10
  text: '"Глядя на то, как вы ведете штурмы миров, лишний раз убеждаешься, что ваше племя недалеко ушло от дубин и камней".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Глядя на то, как вы ведете штурмы миров, лишний раз убеждаешься, что ваше племя недалеко ушло от дубин и камней.
- guid: 00c51765-02cd-4991-aeaa-745c6fc7b766
  event: BNTRS_Chapter4_Marazhai_110
  text: '"На мой вкус затея была не лишена изящества. Сплетение вечно страдающих и ненавидящих душ в одном клубке... полагаю, сами Эмпиреи нашептали предводительнице навигаторов столь восхитительную и издевательскую мысль".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: На мой вкус затея была не лишена изящества. Сплетение вечно страдающих и ненавидящих душ в одном клубке... полагаю, сами Эмпиреи нашептали предводительнице навигаторов столь восхитительную и издевательскую мысль.
- guid: 8583f721-06a8-4982-b5fa-0e0913782f24
  event: BNTRS_Chapter4_Marazhai_128
  text: '"Я знал, что мон-кай глупы... но путешествовать меж звезд через владения Сай''лантреш? Я не могу представить себе безумия хуже этого".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я знал, что мон-кай глупы... но путешествовать меж звезд через владения Сай'лантреш? Я не могу представить себе безумия хуже этого.
- guid: d2c142a8-56b6-438b-9836-5d10bf2597e7
  event: BNTRS_Chapter4_Marazhai_133
  text: '"Скот мнит свое мнение ценным? Тебе нужно лучше дрессировать своих лакеев, Вольный Торговец".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Скот мнит свое мнение ценным? Тебе нужно лучше дрессировать своих лакеев, Вольный Торговец.
- guid: 31ab5148-98ce-44bb-83a3-56d04af5e0b0
  event: BNTRS_Chapter4_Marazhai_134
  text: '"Я знал, что голос одного из порождений варпа мне не привиделся. Сай''лантреш прислала за мной своих слуг... почет, от которого я готов отказаться".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я знал, что голос одного из порождений варпа мне не привиделся. Сай'лантреш прислала за мной своих слуг... почет, от которого я готов отказаться.
- guid: 379b8a79-0d6b-48cc-8212-0fe3137452e6
  event: BNTRS_Chapter4_Marazhai_143
  text: '"Ирлиэт, что за противоестественное существо обретается на корабле Вольного Торговца? Ты пробыла на борту дольше меня — ты должна знать ответ".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ирлиэт, что за противоестественное существо обретается на корабле Вольного Торговца? Ты пробыла на борту дольше меня — ты должна знать ответ.
- guid: 507a7cf4-7c7c-4ca1-9187-ced6988ae6d0
  event: BNTRS_Chapter4_Marazhai_158
  text: '"Интересно. Если я начну складывать чудовищные вирши и декламировать их при любой возможности, окружающие испытают столько же страданий?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Интересно. Если я начну складывать чудовищные вирши и декламировать их при любой возможности, окружающие испытают столько же страданий?
- guid: b15ed3aa-6b10-45aa-beb5-2f4da3133f18
  event: BNTRS_Chapter4_Marazhai_161
  text: '"Почему же? Захватывающая экспозиция достижений гемункульского искусства. Тебе следовало бы быть благодарной за возможность лицезреть эти творения со стороны, а не в качестве препарата".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Почему же? Захватывающая экспозиция достижений гемункульского искусства. Тебе следовало бы быть благодарной за возможность лицезреть эти творения со стороны, а не в качестве препарата.
- guid: bf58a994-c5a1-4e73-98be-714ff1a20eaf
  event: BNTRS_Chapter4_Marazhai_166
  text: '"Изгой, ты не задумывалась о том, почему Аребенниан решил особо указать тебе путь к твоим провидцам? Не боишься часа, когда он придет за наградой за свою помощь?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Изгой, ты не задумывалась о том, почему Аребенниан решил особо указать тебе путь к твоим провидцам? Не боишься часа, когда он придет за наградой за свою помощь?
- guid: 73b8b952-f7a2-47a7-86da-01d2c023f6b8
  event: BNTRS_Chapter4_Marazhai_171
  text: '"Остатки Азуриани все еще рассеянны по Простору, Ирлиэт. Сомневаюсь, что они переживут ближайшие месяцы".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Остатки Азуриани все еще рассеянны по Простору, Ирлиэт. Сомневаюсь, что они переживут ближайшие месяцы.
- guid: dc099153-81a0-4bf6-84ea-c9a7d84d406e
  event: BNTRS_Chapter4_Marazhai_29
  text: '"Мон-кай лучше прочих понимают язык боли и смерти. Еще пара-другая сотен показных расправ — и самые смелые из вашего числа навсегда покорятся кнуту новой хозяйки".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Мон-кай лучше прочих понимают язык боли и смерти. Еще пара-другая сотен показных расправ — и самые смелые из вашего числа навсегда покорятся кнуту новой хозяйки.
- guid: 77db3ea4-e7f9-4920-ad52-f4e3ce356ff9
  event: BNTRS_Chapter4_Marazhai_32
  text: '"Некоторые ваши соплеменники все же знают толк в развлечениях. Полагаю, при плодовитости вашего рода найти замену погибшему скоту совсем несложно".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Некоторые ваши соплеменники все же знают толк в развлечениях. Полагаю, при плодовитости вашего рода найти замену погибшему скоту совсем несложно.
- guid: f2b98f6d-4471-415c-afbf-6ee79ab7764e
  event: BNTRS_Chapter4_Marazhai_48
  text: '"Если они столь же мягкотелы, как и обоженный мон-кай... то тебе следует прикончить их всех, а следующих — готовить лучше".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Если они столь же мягкотелы, как и обоженный мон-кай... то тебе следует прикончить их всех, а следующих — готовить лучше.
- guid: a9ef8a8d-7a04-4d4f-9e7e-59acdf8fcdf6
  event: BNTRS_Chapter4_Marazhai_50
  text: '"Безумие. Отчаяние. Или веление извращенной творческой искры. Каждый гемункул мнит себя художником — быть может, его очередной "замысел" требовал отдать себя на ужин Сай''лантреш".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Безумие. Отчаяние. Или веление извращенной творческой искры. Каждый гемункул мнит себя художником — быть может, его очередной "замысел" требовал отдать себя на ужин Сай'лантреш.
- guid: 1f14eb7b-5dd0-41a4-adfd-7407eb463d1b
  event: BNTRS_Chapter4_Marazhai_56
  text: '"Ну ты не горюй слишком сильно. Опыт показывает, что тебе еще может предоставиться такая возможность".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ну ты не горюй слишком сильно. Опыт показывает, что тебе еще может предоставиться такая возможность.
- guid: 8f3a9983-b09e-4e85-b759-e73944cf1a14
  event: BNTRS_Chapter4_Marazhai_60
  text: '"Напрасно мы позволили отступникам уйти. Надо было прикончить их за ослушание. Что теперь подумают о Вольном Торговце прочие слуги?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Напрасно мы позволили отступникам уйти. Надо было прикончить их за ослушание. Что теперь подумают о Вольном Торговце прочие слуги?
- guid: 9fb5052e-44d1-4ad6-9806-8ac9b940f718
  event: BNTRS_Chapter4_Marazhai_86
  text: '"Потому что тот, кто отправляет других сражаться и умирать за себя, сильнее. Что бы не мнил{mf||а} себе Вольный Торговец... этот "Калькасар" могущественнее {mf|его|ее}".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Потому что тот, кто отправляет других сражаться и умирать за себя, сильнее. Что бы не мнил себе Вольный Торговец... этот "Калькасар" могущественнее его.
- guid: 49e3b3b7-f2c3-423d-941b-5b3279cb1b30
  event: BNTRS_Chapter4_Marazhai_92
  text: '"Чем это отличается от нас, дражайшая кузина? Разве что более нелепыми схемами и грубыми методами".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Чем это отличается от нас, дражайшая кузина? Разве что более нелепыми схемами и грубыми методами.
- guid: 2f52fd95-d525-485c-a93b-e38ea1185d1a
  event: BNTRS_Chapter5_Marazhai_07
  text: '"Вотчины огиров... Когда-то я бывал здесь, в этом регионе. Бедные на достойную добычу места. Богатые на опасных противников".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Вотчины огиров... Когда-то я бывал здесь, в этом регионе. Бедные на достойную добычу места. Богатые на опасных противников.
- guid: 2d1e44b2-1fca-4744-b39e-997b08b2b2ea
  event: BNTRS_Chapter5_Marazhai_13
  text: '"Черное сердце управляется множеством архонтов, мон-кай. Если ты рассчитывал, что гибель одного станет причиной разрушения всего кабала... то я рад тебя разочаровать".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Черное сердце управляется множеством архонтов, мон-кай. Если ты рассчитывал, что гибель одного станет причиной разрушения всего кабала... то я рад тебя разочаровать.
- guid: 3eea6188-855e-4e5b-9bc5-50c7d09fd7ea
  event: BNTRS_Chapter5_Marazhai_9
  text: '"Назракею не нужно было высовываться из Паутины. Впрочем, у него явно не было выбора, если за спиной его действительно пылал гнев Векта".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Назракею не нужно было высовываться из Паутины. Впрочем, у него явно не было выбора, если за спиной его действительно пылал гнев Векта.
- guid: 5a7749c5-6ed4-4ce2-b3e7-1565edd5989b
  event: BNTRS_Companion_DLC3_Marazhai_04
  text: '"Ты так занятно подражаешь гемункулу в его извращенных интересах... Уроки Тервантьяса оставили след в твоем разуме, мон-кай. Интересно, в кого они превратят тебя годы спустя?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты так занятно подражаешь гемункулу в его извращенных интересах... Уроки Тервантьяса оставили след в твоем разуме, мон-кай. Интересно, в кого они превратят тебя годы спустя?
- guid: 74c3beb3-a43a-495f-8ba8-b8b68d509b57
  event: BNTRS_Companion_DLC3_Marazhai_114
  text: '"Говоришь весьма вразумительно для низшего существа. Это забавно, учитывая явное повреждение рассудка. Если будешь достаточно почтителен, я вознагражу твое любопытство... может быть".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Говоришь весьма вразумительно для низшего существа. Это забавно, учитывая явное повреждение рассудка. Если будешь достаточно почтителен, я вознагражу твое любопытство... может быть.
- guid: 590f7da3-de48-469e-ba59-f282c4b79072
  event: BNTRS_Companion_DLC3_Marazhai_127
  text: '"Возомнил, что Аребенниан предсказуем? Наивно. Впрочем, вы, мон-каи, знаете о подобных ему слишком мало, чтобы здраво оценивать этих... исполнителей".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Возомнил, что Аребенниан предсказуем? Наивно. Впрочем, вы, мон-каи, знаете о подобных ему слишком мало, чтобы здраво оценивать этих... исполнителей.
- guid: af369fac-cd67-46b6-8c49-806f16941707
  event: BNTRS_Companion_DLC3_Marazhai_16
  text: '"Если это завуалированное предложение лечь на секционный стол и позволить тебе покопаться в моих внутренностях, то попытка была хороша, но попробуй еще раз".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Если это завуалированное предложение лечь на секционный стол и позволить тебе покопаться в моих внутренностях, то попытка была хороша, но попробуй еще раз.
- guid: 1d2fda8f-df4a-4c13-a3bd-bb407de9428f
  event: BNTRS_Companion_DLC3_Marazhai_41
  text: '"Итак, о Нунциусе. Кем же на самом деле является твой загадочный собеседник? В ответе нет нужды — мне попросту нравится твоя боль, возникающая всякий раз, когда я задаю этот вопрос".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Итак, о Нунциусе. Кем же на самом деле является твой загадочный собеседник? В ответе нет нужды — мне попросту нравится твоя боль, возникающая всякий раз, когда я задаю этот вопрос.
- guid: 858bd133-29b2-4ec6-bb47-5350929c1e80
  event: BNTRS_DLC2_Marazhai_104
  text: '"Действительно — даже примитивное побоище сделало бы этот фарс каплю интереснее".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Действительно — даже примитивное побоище сделало бы этот фарс каплю интереснее.
- guid: 157b97f9-f3e5-4578-a2bf-5ca022e8bf69
  event: BNTRS_DLC2_Marazhai_106
  text: '"Ха! Тебя по-настоящему гнетет существование среди мон-кай, раз ты вдруг начала изливать восторги в наш адрес".'
  speaker: Маражай Аэзирраэш
  parts:
