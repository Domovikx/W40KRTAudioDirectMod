- guid: 928f7f92-77c2-4d6e-b1c6-9f5a61f279a3
  event: BNTRS_Stressful_Marazhai_115
  text: '"В тебе скрыт огромный потенциал. Сильная, волевая, упорная в сопротивлении жертва... Из тебя бы вышла прекрасная игрушка боли".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: В тебе скрыт огромный потенциал. Сильная, волевая, упорная в сопротивлении жертва... Из тебя бы вышла прекрасная игрушка боли.
- guid: 4b9fd36a-b6ef-4e55-988c-516fa4e4fd5e
  event: BNTRS_Stressful_Marazhai_117
  text: '"Ты источаешь скверну Той, Что Жаждет. Стоит тебе оказаться рядом — и все мое естество требует новых жертв, дабы заглушить ее зов..."'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты источаешь скверну Той, Что Жаждет. Стоит тебе оказаться рядом — и все мое естество требует новых жертв, дабы заглушить ее зов...
- guid: 4ba2a359-9cdb-4483-bf4a-ce7af802069a
  event: BNTRS_Stressful_Marazhai_119
  text: '"Я не навожу на тебя тот же страх, что вызываю в других. В чем дело? Почему ты так привычна к облику друкари?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я не навожу на тебя тот же страх, что вызываю в других. В чем дело? Почему ты так привычна к облику друкари?
- guid: d45147ae-e3f5-4a88-a643-a85fc08fa730
  event: BNTRS_Stressful_Marazhai_12
  text: '"Это... это ты мне? Это я, по-твоему, "юноша"? И, чтобы ты знал, я оказал честь тому дрянному уродству, когда прикоснулся к нему".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Это... это ты мне? Это я, по-твоему, "юноша"? И, чтобы ты знал, я оказал честь тому дрянному уродству, когда прикоснулся к нему.
- guid: 0492ab3a-582e-4d1e-b238-f9812c0c2a55
  event: BNTRS_Stressful_Marazhai_121
  text: '"Как нужно бояться своих страстей, чтобы заменить их щелкающей счетной машинкой? Что за чувства так страшили тебя, маленький жрец?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Как нужно бояться своих страстей, чтобы заменить их щелкающей счетной машинкой? Что за чувства так страшили тебя, маленький жрец?
- guid: 826ed45e-5937-4c14-b969-080ec28d38fb
  event: BNTRS_Stressful_Marazhai_123
  text: '"Ты — творение какого-то вашего мон-кайского гемункула? Он, видать, на редкость криворук, раз слепил столь уродливого бойца".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты — творение какого-то вашего мон-кайского гемункула? Он, видать, на редкость криворук, раз слепил столь уродливого бойца.
- guid: 564eb06f-2ff9-4efc-99f6-84b6f4fb71bc
  event: BNTRS_Stressful_Marazhai_125
  text: '"Из тебя могла бы получиться пристойная друкари, кузина. Если бы ты нашла в себе силы признать, что твой Путь — заблуждение, и принять нашу стезю".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Из тебя могла бы получиться пристойная друкари, кузина. Если бы ты нашла в себе силы признать, что твой Путь — заблуждение, и принять нашу стезю.
- guid: 8ee6ac27-74da-4716-b9ef-b9f88a0645fd
  event: BNTRS_Stressful_Marazhai_142
  text: '"Я чувствую боль, которую причиняют железные части внутри тебя. Это ведь... сделано специально? Ты не столь слеп к истинным удовольствиям, как другие мон-кай".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Я чувствую боль, которую причиняют железные части внутри тебя. Это ведь... сделано специально? Ты не столь слеп к истинным удовольствиям, как другие мон-кай.
- guid: 7ebe7ce5-947d-4f5d-8622-acd2553a20b8
  event: BNTRS_Stressful_Marazhai_160
  text: '"Но пока приказа не было и ты стоишь смирно, да? Хорошая зверушка!"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Но пока приказа не было и ты стоишь смирно, да? Хорошая зверушка!
- guid: 59be5344-a241-44f1-8061-eb3af6352735
  event: BNTRS_Stressful_Marazhai_178
  text: '"Ты начинаешь понимать суть вещей, Изгой! Жалость — удел беспомощных. Так что продолжай дарить мне свою боль и отчаяние — как и раньше".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты начинаешь понимать суть вещей, Изгой! Жалость — удел беспомощных. Так что продолжай дарить мне свою боль и отчаяние — как и раньше.
- guid: 7b618510-d6a0-4108-a93f-9dc39ebe1e23
  event: BNTRS_Stressful_Marazhai_30
  text: '"Ты поешь про удовольствие и предвкушение, сладкоголосая мон-кай? Можешь не объяснять — я читаю их ясно в каждом твоем взгляде, обращенном на меня".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты поешь про удовольствие и предвкушение, сладкоголосая мон-кай? Можешь не объяснять — я читаю их ясно в каждом твоем взгляде, обращенном на меня.
- guid: 36a4f558-5956-4bb9-acd1-957ff4c8fff6
  event: BNTRS_Stressful_Marazhai_48
  text: '"В этом и заключается глупость мон-кай. Как скот визжите от боли, что несут наши клинки, когда следует трепетать от ужасов, сокрытых за взором тебе подобных".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: В этом и заключается глупость мон-кай. Как скот визжите от боли, что несут наши клинки, когда следует трепетать от ужасов, сокрытых за взором тебе подобных.
- guid: 2544d5c7-e16e-45af-a7f1-0034a6282e8f
  event: BNTRS_Stressful_Marazhai_66
  text: '"Ты прячешься за оправданиями долга, но на деле жаждешь чужих страданий не меньше, чем я. Каково это — знать, что ты и я похожи? М-м, можешь не отвечать — я чувствую твое мучительное бешенство".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Ты прячешься за оправданиями долга, но на деле жаждешь чужих страданий не меньше, чем я. Каково это — знать, что ты и я похожи? М-м, можешь не отвечать — я чувствую твое мучительное бешенство.
- guid: 567d184a-47cf-4044-a22f-87cc142f9f20
  event: BNTRS_Stressful_Marazhai_84
  text: '"Просто. Оставь меня. В покое".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Просто. Оставь меня. В покое.
- guid: e5cf7dba-8975-4b71-8bcc-87612d1796e3
  event: CH2_MarazhaiHelloAgain_01
  text: '{n}{g|Encyclopedia:Xenos}Ксенос{/g} в вычурном черном доспехе поворачивает к вам голову. Узкое бледное лицо испещрено татуировками и брызгами крови. Спустя мгновение тонкие губы растягиваются в кривой неприятной улыбке:{/n} "Наконец-то. Ты не спешил{mf||а} на встречу со мной, {g|Encyclopedia:MonKeigh}мон-кай{/g}". {n}У вас уходит пара секунд, чтобы осознать, что {g|Encyclopedia:Elucidator}Толкователь{/g} молчит — ксенос обращается к вам на низком готике.{/n}'
  speaker: Маражай Аэзирраэш
  parts:
