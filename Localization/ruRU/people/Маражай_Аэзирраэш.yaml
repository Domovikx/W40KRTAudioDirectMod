  event: BNTRS_Stressful_Marazhai_113
  text: '"Не смей взирать на меня, исчадие, или я сам вырежу тебе твое проклятое око".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
