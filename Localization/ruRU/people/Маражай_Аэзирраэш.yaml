- guid: 804ab194-4ed1-40bc-9252-16bca749e3b6
  event: BNTRS_DLC2_Marazhai_230
  text: '"Мы расчистили путь для новых выскочек, которые будут рваться занять освободившееся место. А значит — дали им повод усердствовать в новых расправах над мон-кай. Как иронично".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
