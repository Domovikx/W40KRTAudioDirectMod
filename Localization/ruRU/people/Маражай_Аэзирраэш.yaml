- guid: f2605949-f214-48bf-9c2a-28f0ac85f088
  event: Companions_Marazhai_37
  text: '"Темный город — бастион друкари, величайший из наших оплотов. Здесь обретаются кабалы, ведьминские культы и ордена инкубов, над их головами парят стаи плетей, а под ногами таятся мириады отбросов и ужасов, включая ковены гемункулов. О ком ты хочешь знать?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Темный город — бастион друкари, величайший из наших оплотов. Здесь обретаются кабалы, ведьминские культы и ордена инкубов, над их головами парят стаи плетей, а под ногами таятся мириады отбросов и ужасов, включая ковены гемункулов. О ком ты хочешь знать?
- guid: 79752d53-3976-411c-92b4-069836f59486
  event: Companions_Marazhai_38
  text: '"Наконец, Карроций Бледный... древний гемункул, предавший Эзирраеш ради иного кабала. Это была не военная, а личная победа. В своих попытках стать неуязвимым он вшил в себя самых смертоносных тварей, каких можно было найти в недрах Комморры. Ему это не помогло — я вырезал все его восемь сердец, которые затем отослал в его бывший ковен — в назидание другим".'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: Наконец, Карроций Бледный... древний гемункул, предавший Эзирраеш ради иного кабала. Это была не военная, а личная победа. В своих попытках стать неуязвимым он вшил в себя самых смертоносных тварей, каких можно было найти в недрах Комморры. Ему это не помогло — я вырезал все его восемь сердец, которые затем отослал в его бывший ковен — в назидание другим.
- guid: 0f6c5820-f590-45dc-a872-62334e6d3a52
  event: Companions_Marazhai_39
  text: '{n}Маражай облизывает губы. Потом ухмыляется.{/n} "Это было наказанием. Один из моих рейдов был... недостаточно успешен, и Иремерисс приказала Тервантьясу насильно имплантировать знание уродливого языка мон-кай мне в разум — якобы чтобы я мог приносить хоть какую-то пользу кабалу, лично уговаривая скот зайти в клетку. Пять дней под ментальным выжигателем в главной зале шпиля на радость всей свите. Я вывернул все суставы, когда бился в кандалах от боли, но с радостью перенес бы это еще раз, чтобы эту дрянь истравили у меня из головы".'
  speaker: Маражай Аэзирраэш
