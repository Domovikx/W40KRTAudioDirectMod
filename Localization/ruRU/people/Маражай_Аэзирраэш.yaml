- guid: 2d32f20e-52ce-4faa-a110-0fd36a316e99
  event: BNTRS_Reactivity_Marazhai_55
  text: '"М-м-м, какой интересный букет. Это из-за Вольного Торговца, да? Не могу различить, что это... ущемленные амбиции или просто ревность? Хочешь, я помогу тебе излить их?"'
  speaker: Маражай Аэзирраэш
  parts:
  - speaker: Маражай Аэзирраэш
    text_clean: М-м-м, какой интересный букет. Это из-за Вольного Торговца, да? Не могу различить, что это... ущемленные амбиции или просто ревность? Хочешь, я помогу тебе излить их?
- guid: 7beb16fe-2f68-41f2-bb2e-1f425bf9dff7
  event: BNTRS_Reactivity_Marazhai_68
  text: '"О, мон-кай, зачем же так неизящно выдавать свой страх и неуверенность? Что, Вольный Торговец дозволяет мне больше, чем тебе, раз ты так стремишься отогнать меня подальше? Это твоя вина, а не моя".'
  speaker: Маражай Аэзирраэш
