- guid: 1cd1ec6f-3e7e-4ad9-a436-5f9b3abb3fea
  event: BNTRS_DLC3_Marazhai_117
  text: '"Примитивные культы, бессмысленная и бесцельная грызня между собой... Ах да, и весьма забавные попытки сладить с этим миром на свой умилительный монкайский манер. Что скажешь, изгой?"'
  speaker: Маражай Аэзирраэш
  parts:
