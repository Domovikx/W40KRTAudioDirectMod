filter: has_other_tag (mf) — диалоги без спикера, отложено
total: 1115
records:
- guid: 009acfe7-20f2-410d-a5d9-b66f3db7ffe7
  length: 41
  text: Отправил{mf||а} всю десятину на Даргонус.
- guid: 00a094b3-ff00-476e-b47f-53ee8f89f550
  length: 131
  text: Осмотрев техотсек и сверившись с авгурами, Лорд-капитан предположил{mf||а}, где могут находиться неповрежденные компоненты корабля.
- guid: 00ac86ca-cb20-4c09-acfb-9049f2b43004
  length: 71
  text: Подарил{mf||а} Наместнику Владайму легкую смерть на трибунале Инцендии.
- guid: 01006dbe-4ad6-4116-934a-597224492295
  length: 114
  text: Вольный Торговец сделал{mf||а} новым настоятелем воинственную Лугналию и обеспечил{mf||а} ей поддержку Иеронимуса.
- guid: 012fe764-57fb-485e-905e-04ee30a59eb3
  length: 136
  text: Взор владыки хора пронзал лабиринт посмертия и зрел тернистый путь в чертог Смерти. Верный слуга принес обет защищать госпо{mf|дина|жу}.
- guid: 015a8b3f-b3a6-47da-98dc-2035f16a32ce
  length: 60
  text: Вольный Торговец велел{mf||а} сделать Блаженных работниками.
- guid: 01925d76-db45-4011-9408-5da934f163ae
  length: 95
  text: Вольный Торговец воспользовал{mf|лся|ась} услугами наемников, чтобы подавить бунт на Веабосе-6.
- guid: 0196717c-e62b-45f0-8119-6d29c011cf3c
  length: 96
  text: Велел{mf||а} покарать роптавших беженцев с Кьявы Гамма, остальных взял{mf||а} к себе на корабль.
- guid: 019ebcb5-156a-410f-bee2-6eb769b8df3e
  length: 150
  text: Вольный Торговец использовал{mf||а} моторных вандалов для устрашения даргонусской аристократии. Аппетиты варваров были утолены богатствами дворянства.
- guid: 01af7d40-b41e-4589-ad79-d51fa8e7438d
  length: 244
  text: Отступив, мятежники заняли оборону в своих тренировочных лагерях, скрытых на поросшем лесами архипелаге. Благословенн{mf|ый|ая} Лорд-капитан рассмотрел{mf||а} несколько тактик обнаружения этих гнезд смуты и избрал{mf||а} наиболее перспективную.
- guid: 01f2968b-e6ad-44e6-9857-25ab082de334
  length: 119
  text: Вольный Торговец сделал{mf||а} новым настоятелем прагматичного Нигмуса, обеспечив его послушание собранным компроматом.
- guid: 021c4c59-b088-4f32-851e-86ee1f8a409f
  length: 143
  text: Лорд-капитан свершил{mf||а} великий суд, решивший, кому будет принадлежать Футфол. Те, кто осмелился оспорить приговор, приняли суровую смерть.
- guid: 0260499c-6520-49ca-a9ac-f4737c26daa5
  length: 76
  text: Помог{mf||ла} Соломону стать человечнее и найти новый способ служить закону.
- guid: 026999e7-5004-4c4c-9ff4-aa213442a6d6
  length: 83
  text: Объяснил{mf||а} архмилитанту, что смерть предпочтительнее службы Губительным Силам.
- guid: 026ad017-8c2d-4906-9c2e-379b98ace981
  length: 611
  text: Невообразимое богатство в виде десятины Простора стало залогом абсолютной власти Вольного Торговца. Армии наемников были готовы лобызать ноги обладател{mf|ю|ьнице} несметных сокровищ, архитекторы возводили дворцы в {mf|его|ее} честь, и самые ценные артефакты торговцы предпочитали сбывать на Даргонусе. Темная роскошь лилась рекой в резиденции {mf|того|той}, чьей жадности улыбались Темные Боги, а пиры и жертвоприношения не останавливались ни на миг. Торговля в других мирах была обескровлена, и прочим династиям оставалось лишь преклонить колено или выродиться, ибо Простор отныне принадлежал одному человеку.
- guid: 029f2483-45e4-4bf3-80a6-48507824c34a
  length: 425
  text: Узрев предательство Вольного Торговца, проктор Соломон Антар не удивился — он всегда рассчитывал на худшее и не доверял никому, кроме своего кибермастифа. Убедившись в правильности своего пути перед гибелью, Арбитес испытал мрачное удовлетворение. Пристрелив Глейто, чтобы не обрекать его на мучительную смерть или участь хуже, Соломон вышел против бывше{mf|го|ей} соратни{mf|ка|цы} и погиб, не успев нанести ни одного удара.
- guid: 02a6ead8-879a-45c4-b225-f21eb4c05688
  length: 172
  text: Подданные Лорд-капитана беззаветно славили Бога-Императора и сво{mf|его|ю} нов{mf|ого|ую} покровител{mf|я|ьницу} — ибо грядущее пока еще было скрыто покровом мрака и тайны.
- guid: 02e68501-6e89-4589-b550-0a2445c127b0
  length: 121
  text: Приказал{mf||а} Хирургеону маджорис использовать осужденных преступников как подопытных для поисков лекарства от болезни.
- guid: 030697f8-fa0f-4a6c-8739-5c65ea5e1eaa
  length: 96
  text: Подстегнул{mf||а} вражду аристократов колонии ради развлечения, невзирая на сопутствующий ущерб.
- guid: 037eb438-5d54-4bf1-9465-0cfdb12e1e22
  length: 53
  text: Облегчил{mf||а} жизнь обитателей грузовой магистрали.
- guid: 0422b50b-3452-48f2-ab95-454e8b570461
  length: 345
  text: Но мудрость Бога-Императора все еще оставалась со мной. Вокс-аугмент, заменивший мою гортань, стократ усилил мой голос, заставив его возвыситься над погребальной песнью гробницы. Наследни{mf|к|ца} перв{mf|ым|ой} услышал{mf||а} мое воззвание — и наш{mf|ел|ла} в себе силы воспрять. Вдохновленные примером, за {mf|ним|ней} последовали и остальные.
- guid: 04773884-9b74-41f3-90c0-3856d550e657
  length: 72
  text: Осудил{mf||а} кровожадность Инцендии Чорда в беседе с отцом Иеронимусом.
- guid: 04bcf0c9-2783-4619-b151-d1b848e0aed5
  length: 180
  text: Между Эоганном и Паскалем разгорелся жаркий спор. Паскаль запрашивает вмешательства Вольного Торговца и просит найти его на мостике, когда {mf|тот|та} будет готов{mf||а} вмешаться.
- guid: 0501717e-9ff2-4b06-8d7d-f09ade2410ab
  length: 67
  text: Убил{mf||а} Хейнрикса, чтобы заполучить себе еретический когитатор.
- guid: 055f95a3-79bd-4e9f-abb1-a7424aeedb3d
  length: 88
  text: Решил{mf||а} не отправлять на Футфол провизию, оставив станцию во власти Инцендии Чорда.
- guid: 05691dc9-b531-4aff-bcba-d5899cd242de
  length: 29
  text: Покровитель{mf||ница} культов
- guid: 058318c6-667f-46d0-9655-99eb97c16bfd
  length: 62
  text: Признал{mf||а} себя отпетым мерзавцем перед отцом Иеронимусом.
- guid: 05bffb9c-dfce-4399-9ca6-472008b97280
  length: 81
  text: Убедил{mf||а} бармена Октавиану помочь в бунте против Чорда ради жителей Футфола.
- guid: 06143500-f6b9-44eb-b48b-383c9c7c4466
  length: 42
  text: Велел{mf||а} казнить фальшивого культиста.
- guid: 064194d7-3457-453b-83a9-69cab0b75bdb
  length: 73
  text: Приказал{mf||а} исследовать тассерций, не взирая на его опасные свойства.
- guid: 06cd45c6-18ce-40ba-b8cd-a81a238ea222
  length: 86
  text: Потребовал{mf||а} покарать всех друзианцев на Футфоле за преступления отца Иеронимуса.
- guid: 06e11b86-69b4-4f98-8c98-2aac1ca3d25d
  length: 325
  text: Ходили слухи, что Ардженту заманили туда обманом и бросили некие бывшие соратники, а может быть — и сам{mf||а} {name} фон Валанциус, не желавш{mf|ий|ая} ни губить сестру, ни мириться с ее свирепым стремлением очистить Простор от ереси. Правда это или нет — неизвестно, но многие вздохнули с облегчением после ее исчезновения.
- guid: 07015069-7b2c-4c26-8d80-fa542d158710
  length: 132
  text: Вольный Торговец оцепил{mf||а} очаг технопроказы и предоставил{mf||а} доступ исследователям Миссии Касбаллики за определенную плату.
- guid: 0736cdd4-c1fe-42c4-88e5-c51ea6f98719
  length: 62
  text: Ранил{mf||а} чудище, сшитое из множества эльдарских провидцев.
- guid: 076d8733-35d8-4c2a-9b2f-0e4b0bfeeb9c
  length: 77
  text: Приказал{mf||а} Высокому фактотуму избавиться от обломка еретического клинка.
- guid: 07c9be1e-55f0-4acc-b128-4bd0a96f8b50
  length: 126
  text: Гробница преобразилась, и путь назад оказался отрезан. Лорд-капитан оказал{mf|ся|ась} заперт{mf||а} на левитирующей платформе.
- guid: 07ef2132-35b1-4eb2-956f-f4e9a87f4896
  length: 280
  text: Невзирая на расползающийся по палубе газ, офицеры продолжают суетиться над станциями, выполняя ранее отданные приказы Лорд-капитана. Даже когда двери мостика вскрывают, команда продолжает работать до последнего. Последн{mf|им|ей}, надсадно кашляя, с мостика выбегает Лорд-капитан.
- guid: 08475950-309d-4531-b96e-6e7e1f87c7e6
  length: 45
  text: Велел{mf||а} помиловать фальшивого культиста.
- guid: 084f0093-0803-4f30-97a5-f2b8bfb7ab93
  length: 331
  text: Джай намекнула, что была бы рада получить от Лорд-капитана подарок, достойный связавших их отношений. Для Вольного Торговца нетрудно раздобыть почти что угодно — достаточно лишь повелеть Высокому фактотуму предоставить это. Но вот в вопросе выбора {mf|Его|Ее} Светлости придется положиться на себя... или советы членов своей свиты.
- guid: 085c6bbd-e7b5-4c7e-a9d0-a17a91097a93
  length: 279
  text: Профиль кандидат{mf|а|ки} признан достойным представления Ее Светлости Лорд-капитану для дальнейшей оценки. Окончательное решение о необходимости экспроприации кандидат{mf|а|ки} с текущей службы для нужд светлейшей династии фон Валанциус остается за Ее Светлостью Лорд-капитаном.
- guid: 092d90b2-6294-45f2-bbdd-52daf8ab4097
  length: 57
  text: '...повернул{mf|ся|ась} ко мне, чтобы отдать распоряжение.'
- guid: 0984926b-8539-4563-88a9-43c51f0c1b6c
  length: 156
  text: На основании выкладок секретаря почтенного губернатора Вьятт благословенн{mf|ый|ая} Лорд-капитан составил{mf||а} схему дальнейших атак повстанцев в городах.
- guid: 0a1fd27f-6940-4ea3-b0f4-ca56c7b5c520
  length: 192
  text: Тяжелые раны были получены Лорд-капитаном и е{mf|го|е} свитой в ходе планетарного штурма в битве с хелбрутом Криком скверны. Но сражение в разгаре, и у воинов нет времени на исцеление и отдых.
- guid: 0a4d1eee-cd91-4a9e-9628-2125ae524397
  length: 329
  text: Сбежав из свиты оскверненно{mf|го|й} порчей Вольного Торговца, Ирлиэт Ланэвисс исчезла без следа. Но вскоре на планетах династии фон Валанциус начали погибать высокопоставленные дворяне, слишком открыто демонстрировавшие приверженность Губительным силам. Жизнь каждого из них обрывал меткий выстрел, и убийца оставался не найден.
- guid: 0a4e54e5-b4fa-42f2-871f-153af24ee512
  length: 334
  text: 'Тень же Домин осталась подле трона Неумирающего, и не видел ее более никто. Домин же, увидев Смерть прежде срока, прош{mf|ел|ла} туда и вернул{mf|ся|ась} обратно, чтобы принести нам мудрость: не жалей о том, что ушло в Смерть, ибо сие есть правильно. Ищи ценность в том, что есть у живых, ибо однажды оно закончится. Он — есть Смерть.'
- guid: 0a6b0dec-6d3e-4ebc-9120-0526eecfaecd
  length: 280
  text: Капитан патруля возмущена недоверием Лорд-капитана. Пусть к ней обращается сам{mf||а} Вольный Торговец, но корабли ксеносов сейчас на границе владений династии Чорда. Истреблять любых врагов Человечества на торговых путях протектората — прямой приказ Лорд-капитана Инцендии Чорда.
- guid: 0a9c11aa-b629-4b34-9a60-5fb87e176b7a
  length: 47
  text: Вольный Торговец открутил{mf||а} вентиль ПО-№3.
- guid: 0b44351c-ae9c-49a6-a845-09a6d9823d43
  length: 86
  text: '...стал{mf||а} читать в сплетении плоти тайные знаки, что открыли бы {mf|ему|ей} путь.'
- guid: 0b58410d-79a6-4b59-ad56-c88fc8cd8f39
  length: 582
  text: В островных районах, не представляющих интереса и покрытых густыми лесами, располагались тренировочные лагеря мятежников. К тому же именно там, по мнению разведки, скрывались инициаторы мятежа — враги Человечества, {g|Encyclopedia:Xenos}ксеносы{/g}. Губернатор Вьятт предложила искоренить не имеющие ценности леса, скрывающие повстанцев, однако имелись серьезные сомнения в компетентности выделенных ей специалистов. Обнаружение же лагерей силами корабельной техники благословенно{mf|го|й} Лорд-капитана было серьезной задачей, посильной лишь очень зоркому и могущественному авгуру.
- guid: 0baea26d-bcbd-49cc-994f-1054f6e401a5
  length: 337
  text: И открылись глаза тени Домин, и ответила она, что не ждала, и не скучала, и не желает ни долга, ни власти, ни милости, и не желает уходить, ибо чудовища, рожденные разумом ее, не были побеждены, а потому были сильны. Но затем поднялась она, и пошла за {mf|тем|той}, кому присягала. Ибо долг ее был превыше терзаний ума. Он — есть Смерть.
- guid: 0bd120d4-0473-4113-93f8-55876964c35d
  length: 534
  text: Рождение и смерть суть одно. Мы приходим в незнакомый мир окровавленные и вырванные из тепла — таково же умирание. Это познал{mf||а} и Домин, открыв глаза в хладном гробу на нижних палубах. Узрел{mf||а} {mf|он|она} свой корабль, плывущий в небытии — адамантиумный труп гиганта, скелет, стенающий от ветров энтропии. Ржавая буря глодала пласталевые кости и трепала вены проводов, а по переборкам текла сукровица машинного масла. В этой искореженной утробе Домин заплутал{mf||а} бы в одиночестве, но проводник протянул {mf|ему|ей} руку.
- guid: 0c5b8987-36fa-47f6-aade-267e7be359d4
  length: 136
  text: Доверив решение оставшихся проблем верным офицерам, Лорд-капитан направляется туда, где {mf|ему|ей} и положено быть — на мостик корабля.
- guid: 0c6ed361-d542-428d-a5ef-98b36befb46e
  length: 298
  text: За пропажей Торгового Патента стоит Тразин Неисчислимый, от заключения которого Лорд-капитан ранее освободил{mf||а} Себериана. Ксенос передал, что вернет Патент в обмен на предка {mf|Его|Ее} Светлости — и для заключения сделки ожидает Вольного Торговца в одной из систем за запретными варп-вратами.
- guid: 0c725e7b-c31e-4823-8139-07cd64578fcd
  length: 72
  text: Позволил{mf||а} паникующим людям эвакуироваться с поврежденного корабля.
- guid: 0cbef0cf-43bd-4ddc-b1b0-8bf1cd6aa0e0
  length: 158
  text: '...приказал{mf||а} захватить судно любыми способами и отправи{mf|л|ла} вместе со штурмовым отрядом создание истовой веры: {petname}, своего двухголового орла.'
- guid: 0da5389d-a99e-4014-ab27-a40acc4bce9c
  length: 35
  text: Пощадил{mf||а} мятежников на Янусе.
- guid: 0dc8d540-2959-41e4-bedd-84709c6571f3
  length: 274
  text: Сквозь пелену зеленого сияния, я увидел, как {name} тяжело поднимается на ноги, нечеловеческим усилием воли заставляя себя сопротивляться давлению чудовищного звука. Увы, лишь немногие нашли в себе силы последовать за {mf|ним|ней} — ужас парализовал их, лишив последних сил.
- guid: 0e047e5a-c9cb-4c37-a720-ddf9754bf861
  length: 75
  text: Усомнил{mf|ся|ась} в праведности Экклезиархии в беседе с отцом Иеронимусом.
- guid: 0e469671-32e4-480a-a962-eee638979183
  length: 62
  text: Приказал{mf||а} заминировать корабль с еретическим артефактом.
- guid: 0e485cf0-9ff7-4a0c-8a2b-582c621ce256
  length: 140
  text: Навстречу Лорд-капитану направлен конвой из солдат, который должен сопроводить высок{mf|ого|ую} гост{mf|я|ью} в командный пункт губернатора.
- guid: 0e7319eb-846d-4f73-9773-3ca438b31e84
  length: 129
  text: Вольный Торговец решил{mf||а} понаблюдать за работой блюстителей и почтить своим присутствием штаб дознания на офицерской палубе.
- guid: 0f0b6da8-531b-497a-8018-79829f888b61
  length: 594
  text: 'Немногие могут похвастаться тем, что пережили встречу с ксеносом, еще меньше — что знакомы с одним из подобных существ. Однако привилегии Вольного Торговца позволяют заводить друзей даже среди Детей Азуриана — именно так зовет себя народ Ирлиэт Ланевисс, загадочной и немногословной эльдарки.

    Путь Изгоя привел Ирлиэт на агромир Янус, где она и встретилась с Вольным Торговцем. Присоединившись к {mf|его|ее} команде, Ирлиэт рассчитывает отправиться к дальним звездам и раскрыть тайну, окутывающую гибель ее родного мира-корабля. Ради этого эльдарка готова на все — включая самые отчаянные шаги.'
- guid: 0f4837a4-7900-4cae-8a35-0d0088d67906
  length: 61
  text: Согласил{mf|ся|ась} помочь Футфолу, не спросив ничего взамен.
- guid: 0f6bd91c-a0fd-4cdb-804e-bf89e129b47f
  length: 119
  text: С лязгом рассыпались лезвия и шипы, обратились в ржу. Ибо жажда крови делает клинок слабее, и Домин доказал{mf||а} это.
- guid: 0f8310af-2954-413a-b9cd-6a3668520318
  length: 104
  text: Напомнил{mf||а} Джай, что Меркатум Табула Официале наделяет ее не только правами, но и ответственностью.
- guid: 0fb25c09-f585-4237-8a15-2275ec36dfb6
  length: 49
  text: Попытал{mf|ся|ась} достучаться до Ирлиэт на суде.
- guid: 100bd7c9-1b3f-4107-aa99-b55aa5065dc0
  length: 108
  text: Вольный Торговец уничтожил{mf||а} очаг эпидемии, однако на Кьяве Гамма еще возникают мелкие вспышки болезни.
- guid: 10243793-1004-4aa0-b93d-cb321f141d58
  length: 263
  text: В порыве рвения народ стал истреблять всех, кто хоть сколько-то был похож на Вольного Торговца. Был{mf||а} ли среди погибших настоящ{mf|ий|ая} самозван{mf|ец|ка} — неизвестно. Теперь Вольному Торговцу стоит подумать дважды прежде чем лично спускаться на этот мир.
- guid: 104b5bc6-e0d9-4830-b131-4d4a90219a21
  length: 151
  text: Личный корабль Вольного Торговца. На нем Вольный Торговец путешествует между мирами и вступает в схватки с теми, кто дерзнет {mf|ему|ей} противостоять.
- guid: 112b95ab-2ea7-4738-82ef-2c2a1bf743f3
  length: 116
  text: Излил{mf||а} в исповедальную машину правду о своих пороках и преступлениях, воспользовавшись анонимностью механизма.
- guid: 1176179d-c563-461c-96ca-7d9a049927cf
  length: 122
  text: '...извлек{mf||ла} знакомый мне радужный клинок, который, словно по чьему-то приказу, вонзил{mf||а} в ближайшего сервитора!'
- guid: 11c6d38c-ab53-4f1c-91c9-c3e5328cf68f
  length: 72
  text: Забрал{mf||а} навигатора Ханна и мутировавшую команду к себе на корабль.
- guid: 11ddc673-f5ca-4a00-87be-fd0540268568
  length: 101
  text: Собрав отряды у шаттлов, Лорд-капитан отдал{mf||а} последний приказ, касающийся мрачной находки — ...
- guid: 127d88a0-36a9-42b8-b7be-be0b75548877
  length: 183
  text: Даже придя в себя, эльдарка заговаривает не сразу — с нотками печали в голосе, тщательно подбирая слова, она признает, что элантах сделал{mf||а} все возможное. И тихо покидает мостик.
- guid: 12ad2732-3b2e-4a0c-84e9-91d9f5e5b46a
  length: 676
  text: Легенды о том, как влады{mf|ка|чица} фон Валанциус броси{mf|л|ла} вызов древнему неописуемому злу, выйдя победителем из схватки с ним, еще долго гуляли по всему Простору Коронус, передаваясь из уст в уста и обрастая все более невероятными подробностями. Наследие рода фон Валанциус было восстановлено, и власть его укрепилась стократ. Истина же, сохраняемая в строжайшей тайне, заключалась в том, что много лет спустя Неисчислимый вновь вернулся в Простор, и на сей раз с одной-единственной целью — заполучить легендарного Вольного Торговца в свое полное и безраздельное владение. Итог этого противостояния неизвестен, а последние упоминания о нем затерялись в пучине времени.
- guid: 12f15fb6-7f0f-4a7e-a3b7-8265dfe5d0b0
  length: 47
  text: Лорд-капитан, прибывш{mf|ий|ая} на передовую...
- guid: 131d3d21-344b-475c-a188-500118c92c00
  length: 216
  text: Хейнрикс ван Калокс, дознаватель Ордо Ксенос, отдал жизнь, сражаясь с врагом Человечества — Вольным Торговцем фон Валанциус, предавш{mf|им|ей} Империум и склонивш{mf|имся|ейся} перед силами, враждебными Человечеству.
- guid: 136c1d57-2096-4fa7-becc-6b100c966b38
  length: 71
  text: И потому, взвесив варианты, Лорд-капитан выбрал{mf||а} идти вместе с...
- guid: 13988ed5-3a07-4986-bda4-7c8f5b01b9af
  length: 71
  text: Предложил{mf||а} Инцендии сделать Наместника Владайма серфом-уборщиком.
- guid: 13a56ff5-ccea-4b6a-a71c-2dbc750781d7
  length: 172
  text: Контроль над житницами Януса в наших руках. Если Вольный Торговец пожелает вернуть свою милость Наместнику Футфола Владайму Токара, он{mf||а} имеет возможность сделать это.
- guid: 13d72ef6-13e5-46f8-8f50-0c6f0361016e
  length: 173
  text: Благодаря данным, собранным слугой почтенного губернатора Вьятт и проанализированным сам{mf|им|ой} Лорд-капитаном, планы атак мятежников были вскрыты и могли быть упреждены.
- guid: 13f7b3b1-a208-4aed-ade3-48ae7f063fb8
  length: 420
  text: Верховный демон Предел рассвета, обративший мир Ефрат-II в свое логово, был указующим перстом и советником {mf|Его|Ее} Светлости, открывающим прихотливую волю Владыки Перемен и предупреждающим об угрозах. Так было до поры, пока Пути не изменились, и {name} фон Валанциус с Пределом рассвета не обратились во врагов, сражающихся за власть в Просторе. В кипящем энергиями варпе ничто не постоянно и никакой союз не крепок.
- guid: 13fa5f60-dc36-4d2c-8715-394dd6419665
  length: 32
  text: Отдал{mf||а} Маражая Инквизиции.
- guid: 13fba3bc-10a3-4fea-b613-5fc5a49b40ff
  length: 74
  text: Применил{mf||а} методику всепланетного моления во время операции на Янусе.
- guid: 14870abc-990f-4c0c-9773-dbb0dd511389
  length: 114
  text: Отряд Вести отправился выполнять распоряжение, а Вольный Торговец вместе со своей группой продолжил{mf||а} путь...
- guid: 149b9b2f-20e1-46a9-80f1-6df46e293acb
  length: 350
  text: Человек, именуемый Пощадой, не простил унижения, которое ему довелось стерпеть от Джай Хейдари. Подозрительным образом все люди, к которым она испытывала симпатию, гибли при несчастливых стечениях обстоятельств, и горечь бесконечных утрат отравила ее сердце. Лишь для одного человека была сделано исключение, и имя {mf|его|ее} — {name} фон Валанциус.
- guid: 152b5ef9-3dce-48bd-adda-0d1357e1efc1
  length: 69
  text: Возвел{mf||а} на Даргонусе галлюцинаторные химтермы для аристократии.
- guid: 15343f95-ca70-4b77-a0f1-6851131f5eb9
  length: 55
  text: '...приветствовал{mf||а} Его с достоинством и гордостью.'
- guid: 159a121a-68a8-4d88-91b9-4f24b9cf5b1a
  length: 31
  text: '...окликнул{mf||а} Леди Кассию.'
- guid: 15ad7aa9-1d10-46eb-adf1-af90dbeb8dea
  length: 99
  text: Лорд-капитан наш{mf|ел|ла} авторов трех необычных исповедей и удовлетворил{mf||а} свое любопытство.
- guid: 15c71d1d-9202-4855-a6db-1bfcac52b73b
  length: 112
  text: Лорд-капитан отчитал{mf||а} капитана Вести за легкомыслие и потребовал{mf||а} отчитаться о прогрессе его группы.
- guid: 15c9122b-68c6-410e-b290-1a46614acdce
  length: 239
  text: 'Человеку не дано узреть Смерть до срока — это есть заблуждение живых. Внемли. Мы же говорим: для сильного духа возможен путь туда и путь обратно. Внемли, как велик{mf|ий|ая} Домин''{name} спустил{mf|ся|ась} в царство мертвых за своей тенью.'
- guid: 16cf805b-ac35-40be-b0c2-2407322bccb4
  length: 54
  text: Поприветствовал{mf||а} отца Иеронимуса святой аквилой.
- guid: 1701222f-8143-414f-840d-1cc052f967f5
  length: 186
  text: Эвейн кажется глубоко удрученным вашим решением. Он сообщает, что не имеет права осуждать сво{mf|его|ю} спасител{mf|я|ницу}, но считает актом варварства уничтожение имперского поселения.
- guid: 170ca859-4383-4f6d-b065-8ce54cac2fe5
  length: 101
  text: Вольный Торговец приказал{mf||а} использовать знания ксеносских механиков для изучения Процедуры 0-Х.
- guid: 172f4ef6-641d-407f-8ea6-1d4e42f7c872
  length: 577
  text: Уралон Жестокий недолго пробыл советником при Вольном Торговце. Во время одного из совместных нечестивых молений со сво{mf|им|ей} госпо{mf|дином|жой} видение, в равной степени чудовищное и величественное, посетило его. Ужас, посетивший сердце древнего закоренелого еретика, был столь глубок и необъясним, что Уралон спешно отправился в поход. Само Око Ужаса было его целью — там он надеялся отыскать того, кто поможет ему истолковать обрушившуюся на него грезу. Суждено ли было Уралону вернуться в Простор, и вернулся бы он другом или врагом Вольного Торговца — не ведал никто.
- guid: 17752bce-73fd-4d84-843b-c40f89969118
  length: 69
  text: Приказал{mf||а}, чтобы приговоренному мутанту освободили рот от швов.
- guid: 17da9ab3-df6f-4a91-9b4e-d52df783ab36
  length: 68
  text: Напал{mf||а} на Хейнрикса после уничтожения еретического когитатора.
- guid: 18d27ee6-a379-45de-8777-9696ef9aff60
  length: 59
  text: Позволил{mf||а} ереси творчества воцариться на Кьяве Гамма.
- guid: 1934c42d-915c-492c-97b8-6988efb19130
  length: 65
  text: В командной рубке Лорд-капитан приказал{mf||а} своим генералам...
- guid: 19ae9722-f46e-4ae3-82dc-0427ee493b78
  length: 159
  text: Душераздирающий крик ослепленного сотряс стены. Поглощенные действом мятежники еще не заметили присутствия посторонних. Лорд-капитан приготовил{mf|ся|ась} и...
- guid: 19e149ea-0870-43d8-9231-6770e76a3779
  length: 222
  text: Кандидат{mf||ка} участвовал{mf||а} в наземной операции, когда от высшего командования последовал приказ о штурме подулья — наиболее защищенного и опасного участка города. Подступив к линии столкновения, кандидат{mf||ка}...
- guid: 1a8b3a54-3056-48bf-b6bc-33c678ea54e6
  length: 52
  text: Попытал{mf|ся|ась} достучаться до Ахиллеаса на суде.
- guid: 1afa8401-55b0-4776-aa05-fb5c456aec61
  length: 78
  text: Покарал{mf||а} навигатора Ханна за то, что он встал на пути Вольного Торговца.
- guid: 1b5e6773-7700-44c5-bb5c-1987e21b5ffa
  length: 243
  text: Говорят, Вольный Торговец заключил{mf||а} сделку с некой сущностью, управляющей миром Амберворлд долгие десятилетия. Скорее всего, это просто слухи. Не мог{mf||ла} же помазанни{mf|к|ца} Императора действительно заключить сделку с Архиврагом?..
- guid: 1bbe3f0a-06ab-4b2e-b3d8-fc1e7528c93e
  length: 136
  text: Вольный Торговец тщательно скрыл{mf||а} следы своих деяний от карательного отряда Ордо Ксенос. Возможно, он{mf||а} даже преуспел{mf||а}.
- guid: 1bdc8764-89e3-4dca-85cc-fcbddcb29c35
  length: 106
  text: Воспоминание истаяло, и {name} вновь обнаружил{mf||а}, что летит вниз — в бурую бездну клубящихся мороков.
- guid: 1c2264b9-02ca-4f75-8f00-daa0e801dd41
  length: 96
  text: Согласил{mf|ся|ась} учинить расправу над Чорда, признав несостоятельность правосудия Императора.
- guid: 1c6c597e-13d6-47d9-87bb-fdd281ea4790
  length: 82
  text: Предотвратил{mf||а} голодный бунт на Футфоле, велев раздать еду со своего корабля.
- guid: 1cc079b7-8c59-4694-a889-ce838b81ae32
  length: 335
  text: Облачен в черепа и паутину был мостик флагмана. И стекались бледные души мертвых к подножию трона, а на троне том восседал Неумирающий Император, да пребудет Он бесчисленно благословен, Защитник Человечества. Холодно сияли звездным светом глазницы черепа Его, в мощной длани возлежала галактика. Подступил{mf||а} к трону Его Домин и...
- guid: 1d567c1a-81b9-4229-9d5f-dd491661d920
  length: 127
  text: '[О тех, кто держит {mf|его|ее} на плаву в этой толще. Кто из них захлебнется, а кого он{mf||а} успеет вытянуть на поверхность?]'
- guid: 1d8b54ce-c760-4157-a1e3-5f7a15957456
  length: 59
  text: Велел{mf||а} дворянам прекратить пришивать лица на Тассере.
- guid: 1d9c8cf6-a6f4-4caa-9526-ec38f31d103e
  length: 178
  text: Коварство обитателей Комморры заманило Вольного Торговца на бойцовскую арену Губительной жажды. Чтобы продолжить поиск пути на свободу е{mf|му|й} предстоит выжить в жестоком бою.
- guid: 1da0a1e6-c0fa-492a-a825-5b7b3341d4b2
  length: 73
  text: Заявил{mf||а} Каллигосу, что вы родственные души, прозрев на нем скверну.
- guid: 1dcae8fd-e09c-4d4c-a665-113894ecbc33
  length: 110
  text: Вольный Торговец создал{mf||a} дискуссионную группу для теологических споров, что отвлекает монахов от трудов.
- guid: 1dd4451c-f647-414e-9f6d-c446997971f1
  length: 79
  text: Лорд-капитан призывал{mf||а} на помощь всю свою волю, сопротивляясь наваждению.
- guid: 1e43be29-436c-47e5-89a0-d5f8f26f4f88
  length: 114
  text: Вольный Торговец осудил{mf||а} и наказал{mf||а} мальпийцев за их поступки, что вызвало великую обиду с их стороны.
- guid: 1e62260f-4e5a-4d5a-af62-a3072ac8dac0
  length: 126
  text: Вольный Торговец приказал{mf||а} сломать варп-вокс. В процессе пострадали участвовавшие в уничтожении техноматы мануфакторума.
- guid: 1e6e35e1-e860-4d31-b958-4bd5c7639aa4
  length: 62
  text: Приказал{mf||а} вырвать языки ропчущей аристократии Даргонуса.
- guid: 1ea3b861-a878-456e-8b19-807df7b9caea
  length: 65
  text: Предложил{mf||а} Комиссару в Комморре служить на благо Империума.
- guid: 1ec9db4d-52fa-4a3e-8db4-34884ab52b7d
  length: 211
  text: Ковчег пилигримов оказался ловушкой. Единственный путь из нее — сквозь главный шлюз, через который Вольный Торговец проник{mf||ла} на корабль. И е{mf|му|й} стоит поторопиться, пока нелюди не настигли е{mf|го|е}!
- guid: 1f0721f3-46b8-40d2-b3a8-86f6e69b94f3
  length: 47
  text: Сказал{mf||а} Номос, что их цель — просто жить.
- guid: 1f1d7c03-642c-426b-b51f-4c019719f686
  length: 63
  text: Облачил{mf|ся|ась} в одеяния еретиков ради спасения техножреца.
- guid: 1f293e74-fd97-4144-b73a-323a24341dcc
  length: 83
  text: Сказал{mf||а} Хейнриксу подключить лексмеханика обратно к оскверненному когитатору.
- guid: 1f3ea48b-306d-47cf-9005-7e777ec370ea
  length: 222
  text: Культ Последнего восхода с охотой подчинился ново{mf|му|й} повелител{mf|ю|ьнице} из династии фон Валанциус — в {mf|нем|ней} они видели обещанн{mf|ого|ую} провозвестника последней зари, зарево которой изменит Простор навек.
- guid: 1fceb386-dee9-4252-918a-410f41ba1dd5
  length: 47
  text: Вольный Торговец открутил{mf||а} вентиль ЗТ-№4.
- guid: 204f20af-0e7d-42f4-ad8b-9c2874aec732
  length: 52
  text: Восславил{mf||а} Императора в речи на Магнэ Ацессио.
- guid: 2097357c-56fe-4b1d-a65b-06b1bd1f8ae9
  length: 240
  text: '...возглавил{mf||а} партизанские действия против пиратов с целью защитить собственную территорию. Выжившее население не только провозгласило кандидат{mf|а|ку} народн{mf|ым|ой} геро{mf|ем|иней}, но и щедро расплатилось за охрану своих домов.'
- guid: 20eb6fbc-929f-4cd3-8785-58b9db83e563
  length: 83
  text: Отказал{mf|ся|ась} отдать контроль над Янусом эльдарам, пообещав им свою протекцию.
- guid: 21700b1f-ddb1-4173-bea8-319585d667cb
  length: 46
  text: Убедил{mf||а} пиратку Риззу отречься от ереси.
- guid: 217f5de4-a57a-46d8-aa3f-d87d39ec6714
  length: 46
  text: Вольный Торговец уничтожил{mf||а} Ноль-Халифа.
- guid: 219fa7d4-8a32-479e-bba1-44bbb95d3945
  length: 95
  text: Перебил{mf||а} проповедь космодесантника Хаоса на Кьяве Гамма хвалебным гимном Богу-Императору.
- guid: 221227a9-fa2f-453f-b5eb-f3bbd59d08c9
  length: 213
  text: Круг губернатора Вистенцы Вьятт с жаром взялись за дело — вскоре поставки оскверненной провизии начнут разжигать в сердцах обитателей Футфола особое почтение к свое{mf|му|й} высоко{mf|му|й} благодетел{mf|ю|ьнице}.
- guid: 224edcf1-a331-4e64-88de-4ced5afce3fb
  length: 68
  text: Позволил{mf||а} обезумевшему офицеру-предателю соскользнуть в морок.
- guid: 22936ff7-84e5-4344-ad60-8e282710ed45
  length: 54
  text: Направил{mf||а} спасательные шаттлы на Райкад Минорис.
- guid: 22d02b04-eb3f-4f00-8344-41358dd7ab15
  length: 140
  text: '[Draft] Тест {d|Encyclopedia:Ch1_CassiaAmuletOff}Амулет Кассииt{/d} Привет ты знаешь что то о {g|ib:Consumable_MeltaCharge}Melta Charge{/g}?'
- guid: 235150f1-d118-4bd5-ab1c-02fca7b64208
  length: 66
  text: Сохранил{mf||а} пленному жизнь, чтобы пытать его ради развлечения.
- guid: 23f12279-debb-465a-83fa-8cdb34508080
  length: 98
  text: Оправдал{mf||а} Хейнриксу уничтожение еретического когитатора желанием предотвратить новые жертвы.
- guid: 244bfddd-1387-46f1-b0d5-a49f0f0916b8
  length: 240
  text: Услышав ваше предложение, Рета облегченно вздыхает. Она и не надеялась, что Вольный Торговец будет столь щедр{mf||а} к обычным работягам. За считанные часы колония снимается с места и отправляется в новый дом — нижние палубы вашего корабля.
- guid: 2462f096-d386-4908-9c5c-cd0cd04a03e7
  length: 325
  text: Свобода познавать свои новые силы была дарована Номос ненадолго — по велению Темных богов {name} фон Валанциус заточил{mf||а} их в Ярмо, сделав своим цепным чудовищем. Странная сущность, облеченная силой частицы звездного божества, были неподвластны влиянию повелителей варпа, а значит — опасны для них и обречены на рабство.
- guid: 24afbd80-0b14-4460-b98a-8e71387633d1
  length: 83
  text: '...ждал{mf||а} ее, и скучал{mf||а} по ней, и приш{mf|ел|ла}, чтобы забрать ее себе.'
- guid: 24bc3f6a-d6ba-408a-95ad-1738c348e53b
  length: 76
  text: Вынес{mf||ла} приговор префекту и маршалу по всей строгости Лекс Империалис.
- guid: 24f6ae7d-bd50-46c6-b69d-5850011239ee
  length: 199
  text: Арена Комморры пала, сотрясаясь от повторной дизъюнкции. Возможно, если бы друкари знали, к чему приведет появление в Прорве ничтожного мон-кай, они бы тщательнее позаботились о {mf|его|ее} убийстве.
- guid: 250ec1ca-eef1-4358-bca1-f7a80930b8ab
  length: 207
  text: Мастер дисциплины лично взялась отыскать подозреваемого Гведона, чтобы Вольный Торговец смог{mf||ла} принять его исповедь. Расследование завершится там же, где и началось — в кают-компании офицерской палубы.
- guid: 2553e12f-2349-4822-a109-0022c5bf4218
  length: 291
  text: Эоганн пал от руки свое{mf|го|ей} бывш{mf|его|ей} соратник{mf|а|цы}, как и многие Механикус Простора. Все накопленные им знания о технологиях ксеносов оказались бессильны против той чудовищной мощи, которую обрушил{mf||а} на него {mf|тот|та}, кто ранее носил{mf||а} имя {name} фон Валанциус.
- guid: 25880bbd-db16-4930-8966-979fc0510f47
  length: 116
  text: Трупная вытяжка, которую рискнул{mf||а} испить Вольный Торговец, даровала {mf|ему|ей} временную устойчивость к ядам.
- guid: 25b02baf-6f2f-441e-8418-cb7edb7a0531
  length: 84
  text: Отметил{mf||а} важность торговли ксеноартефактами на Футфоле для понимания ксеносов.
- guid: 25cbac02-6294-47dc-a3ae-e1e22574f5b4
  length: 57
  text: Обличил{mf||а} ересь пиратки Риззы на трибунале Инцендии.
- guid: 25ccea04-eff5-49c4-b946-3c28b53dfdb8
  length: 47
  text: Понял{mf||а} Домин, что схватка неизбежна, и...
- guid: 25dad62c-72b2-4e40-bfb3-1c5a8bd402c9
  length: 163
  text: Под управлением сво{mf|его|ей} влады{mf|ки|чицы} 32-ой меровский полк превратился в идеальное оружие — армию-культ, славящуюся извращенной дисциплиной и хитростью.
- guid: 25e17643-3630-4678-967e-87f47fdb2625
  length: 70
  text: Воодушевил{mf||а} Комиссара и его солдат дать бой на арене в Комморре.
- guid: 25f4c34e-a3e5-49b0-842d-c86f841e3418
  length: 73
  text: Простил{mf||а} беженцев с Кьявы Гамма и взял{mf||а} их к себе на корабль.
- guid: 2608f780-40ec-4a58-bcfa-2e628cda4018
  length: 86
  text: Лорд-капитану удается узнать, где больше всего требуется помощь. {mf|Он|Она} решает...
- guid: 27ba7367-9ca7-4e7a-89cd-b5a36b9a29ce
  length: 36
  text: '...предпоч{mf|ел|ла} не вмешиваться.'
- guid: 27cd6ad6-1c16-4fd5-bfa9-bf70640b2f34
  length: 123
  text: '...отдал{mf||а} приказ о тотальной бомбардировке взбунтовавшегося улья, проигнорировав присутствие в периметре союзных сил.'
- guid: 27ce5e87-862b-4850-bfe3-ccc731ae0386
  length: 68
  text: '...схватил{mf||а} руку Леди-Навигатора, пытаясь вытянуть ее обратно.'
- guid: 27f6da36-c6af-498d-89e9-74e0974f22b7
  length: 58
  text: Велел{mf||а} казнить фальшивого культиста вместе с семьей.
- guid: 286eaded-a036-4bcb-849f-2248bb5d8e2c
  length: 186
  text: Помимо несомненной компетентности благословенно{mf|го|й} Лорд-капитана, тому была и иная причина — свидетельства, указывающие на неблагонадежность окружения почтенного губернатора Вьятт.
- guid: 28701daa-9336-4ddd-b8f6-d28478308dc9
  length: 624
  text: Офицер Хротко, которому Лорд-капитан поручил{mf||а} вести шпионскую деятельность, обнаружил перспективную возможность. На примитивном мире Вергис-II действуют две фактории, служащие династиям Чорда и Винтерскейл. Вопреки вражде этих Вольных Торговцев, главам факторий удалось заключить перемирие и совместно осуществлять управление неразвитыми, но своевольными аборигенами. Хротко удалось втереться в доверие к обоим лидерам, и он уверен, что серией провокаций способен разжечь между вчерашними союзниками войну. В этом случае агенты династии фон Валанциус смогут перехватить контроль над ресурсами мира, сулящими богатство.
- guid: 28df2bbf-636a-4835-ac42-71a6c453636f
  length: 80
  text: Вольный Торговец повелел{mf||а} администрации сурово подавить волнения каторжан.
- guid: 28f636c2-4e4f-4ebb-a24f-4476f3250ff1
  length: 120
  text: пока изящный ритуальный кинжал не выплыл перед {mf|его|ее} лицом, напоминая о мире, что когда-то казался реальнее этого.
- guid: 29023132-ef2b-4ff9-8547-21c07b3333a7
  length: 64
  text: '...призвал{mf||а} Леди-Навигатора бороться с чудовищем до конца.'
- guid: 2933c616-784a-4860-b490-a903d9ad1e75
  length: 112
  text: Вольный Торговец приказал{mf||а} лояльным херетекам подслушивать через варп-вокс за кознями враждебных еретиков.
- guid: 296b0828-b4ce-4c94-b31e-28474d5f4421
  length: 106
  text: Вольный Торговец решил{mf||а} оставить неприветливый мир. Быть может, однажды он{mf||а} сюда еще вернется.
- guid: 297f676d-9802-49a5-b8f6-13faa18b1ccb
  length: 312
  text: Лорд-капитан смилостивил{mf|ся|ась} над нами и повелел{mf||а} расчистить зону высадки орбитальными ударами. Все шаттлы с солдатами и, главное, бесценной техникой достигли цели. Устрашенный враг отвел силы. Это был идеальный момент для решительного удара — с таким резервом бронетехники преимущество было за нами.
- guid: 2994bc76-29e1-4296-af66-791190e98e2e
  length: 69
  text: С{mf|чел|очла} стремление к удовольствиям главной целью Человечества.
- guid: 299a51cf-63e7-49a5-b675-94cb56da0102
  length: 55
  text: Углядел{mf||а} проблеск человечности в глазах акофиста.
- guid: 29ec3003-8e2a-409a-a9d3-12b3bb55f1bc
  length: 99
  text: Вольный Торговец оцепил{mf||а} очаг технопроказы и занял{mf|ся|ась} изучением таинственной скверны.
- guid: 2a0bef50-b09b-407b-9286-db722dde4271
  length: 92
  text: Отказал{mf|ся|ась} освобождать Кибеллу от долга несмотря на то, что с ней сотворил гемункул.
- guid: 2a547169-7b26-4e92-aba5-1b02f72eac3d
  length: 185
  text: '...отправил{mf||а} рекрутов на баррикады в тоннелях улья, лично казня каждого, проявившего страх или сомнение. Полк понес колоссальные потери, однако первым ворвался в осажденный город.'
- guid: 2a67103f-3321-47cf-8bc4-d2f8d240ce81
  length: 98
  text: Машины падут перед натиском Вольного Торговца — велико{mf|го|й} очистител{mf|я|ьницы} Кьява Гаммы.
- guid: 2a817c66-b920-4ad2-8301-59d6012db15e
  length: 72
  text: Шрамировал{mf||а} тысячи верующих строками из писания о святом Когнации.
- guid: 2a88801d-5141-47f3-8cbc-ffa4fcbad689
  length: 45
  text: Казнил{mf||а} обезумевшего офицера-предателя.
- guid: 2aaa900a-1fd5-4769-a399-964ffef90d74
  length: 73
  text: Раз{mf|жег|ожгла} вражду между солдатами Заркова и блюстителями флагмана.
- guid: 2af3dc0a-bf8a-4d94-81cd-3471d50bbe44
  length: 43
  text: Размышлял{mf||а} о долге перед Императором.
- guid: 2b56e6ae-8adf-4fa1-867d-e0f4fbcd601f
  length: 79
  text: Научил{mf||а} Номос, что помогать людям нет смысла, когда можно ими повелевать.
- guid: 2b79515b-ed54-43f5-af7a-4895ae520ac2
  length: 125
  text: Вольный Торговец повелел{mf||а} отправлять разведчиков во взбунтовавшийся сектор Януса. Решение привело ко множеству смертей.
- guid: 2bc9366e-7159-4df1-8a4c-cb91ea0d7001
  length: 85
  text: '...подхватил{mf||а} с пола кинжал и начал{mf||а} рубить прорвавшиеся из картины руки.'
- guid: 2bef8588-c7a3-409a-8691-e98f512a620e
  length: 69
  text: Позволил{mf||а} малатеку остаться на корабле, став слугой Императора.
- guid: 2bfb1d6f-d776-42c1-bbff-7c3438d82f7a
  length: 25
  text: Исцеляющ{mf|ий|ая} металл
- guid: 2d51bd24-f78a-4739-8322-67e1399d99cd
  length: 449
  text: '{name} окунул{mf|ся|ась} в поток из ярких оттенков, и всполохи цвета розового заката и сирени понесли {mf|его|ее} сквозь пестрый поток. Спустя мгновение Лорд-капитан оказал{mf|ся|ась} в дивном саду, наполненном ароматом цветов и пением птиц. Слуги в пурпурных ливреях сновали туда-сюда, прислуживая иссохшей пожилой даме в навигаторской маске. На ее коленях — маленькая девочка с рубиновыми глазами и белыми волосами, скромно улыбающаяся окружающим.'
- guid: 2d72fa76-4daa-42a0-95e1-01a4979c8f24
  length: 85
  text: Раскрыл{mf||а} глаза оскверненного техножреца на истинную природу управлявших им сил.
- guid: 2d7f6495-c279-491a-9cfe-9bb4a725a64b
  length: 33
  text: Умертвил{mf||а} сгоревшего юношу.
- guid: 2e248856-a567-4ec4-86a1-e10366b2eca3
  length: 244
  text: На планету явил{mf|ся|ась} самозван{mf|ец|ка}, утверждающ{mf|ий|ая}, что он{mf||а} — Вольный Торговец! Говорят, что внешне он{mf||а} поразительно схож{mf||а} с Вольным Торговцем и уже одурачил{mf||а} множество вельмож, собрав с них щедрые дары.
- guid: 2e26ea3d-ab3a-4dc4-aa86-0689f81b60c2
  length: 140
  text: Лорд-капитан сгладил{mf||а} назревающий конфликт между двумя командирами и попросил{mf||а} капитана Вести отчитаться о прогрессе его отряда.
- guid: 2e299adc-1114-4296-9bd2-1cbe526e32e5
  length: 124
  text: Вольный Торговец приказал{mf||а} не трогать немочей, но их присутствие вызывает недовольство и беспокойство среди населения.
- guid: 2e8279ba-a7cb-437a-948e-141de864ec34
  length: 159
  text: Вглядывал{mf|ся|ась} в них Домин, но ничего прочитать не мог{mf||ла} в знаках Неумирающего, лишь слышал{mf||а} вой чудовищ, рожденных разумом тени {mf|его|ее}.
- guid: 2e9a46e5-41f2-4eda-b1de-f509bcff209f
  length: 70
  text: Даровал{mf||а} Милость Императора Авелю в Электродинамической обители.
- guid: 2edd5fef-80a8-4ed9-8d55-6f2e543696d2
  length: 35
  text: Оставил{mf||а} часть десятины себе.
- guid: 2f952a0f-19d9-4f44-9378-583ba3c3c437
  length: 86
  text: Вольный Торговец выслал{mf||а} мальпийцев в пилигримаж за реликвиями святого Когнация.
- guid: 304f76de-94aa-492d-8583-3f8835f48b38
  length: 84
  text: Вольный Торговец набрал{mf||а} несанкционированных псайкеров с родной планеты Идиры.
- guid: 3056428e-50f3-47fb-ac20-a47eef9f823a
  length: 209
  text: Пиратка мрачно хмыкает — она есть тень Его света, и даже держателю священного Патента не совладать с натиском всей тьмы, что встречается на {mf|его|ее} пути. Сегодня тьма Катрионы сметет вас, готовьтесь к бою!
- guid: 30996843-276c-464d-9cc1-4da3f34f1958
  length: 66
  text: Приказал{mf||а} сервиторизировать ропчущую аристократию Даргонуса.
- guid: 30fecfd5-f107-41bf-a4b1-1469a1c85180
  length: 310
  text: Века назад Себериан фон Валанциус отправился к руинам, сокрытым в корневой системе мира. Возможно, его тело до сих пор лежит там, моля об упокоении в династическом кенотафе. Как только Лорд-капитан вернется на флагман, {mf|ему|ей} следует просканировать предполагаемое место гибели Себериана с помощью авгуров.
- guid: 311801f5-2a30-40fe-be9b-f5359a1042ac
  length: 30
  text: Пощадил{mf||а} Мастера орудий.
- guid: 3125ef5f-22e2-4abd-a67a-e4ef8e8be6bd
  length: 71
  text: Вольный Торговец цепким взглядом окинул{mf||а} причудливую конструкцию.
- guid: 319d2a19-1f0b-4270-8905-7c79f5cfd9d5
  length: 176
  text: Лорд-капитан предпоч{mf|ел|ла} не появляться в опасном месте лично. Однако Наместник рассчитывает, что после смерти последнего заболевшего зону можно безопасно дезинфицировать.
- guid: 31a0b8d0-a13d-47d5-9cea-9aa6db85d061
  length: 121
  text: Губернатор Януса ожидает визита Вольного Торговца, чтобы лично поприветствовать {mf|его|ее} в ходе официальной церемонии.
- guid: 31ba7d99-655f-4430-be9c-f54d3a1f5828
  length: 84
  text: Вольный Торговец назначил{mf||а} сразу трех настоятелей, убедив их трудиться сообща.
- guid: 31d1a874-5814-421c-89af-2a3838f3fcce
  length: 71
  text: Вольный Торговец сделал{mf||а} новым настоятелем прагматичного Нигмуса.
- guid: 32070909-6b3a-4611-99b5-ff3fd93d5503
  length: 42
  text: Провозгласил{mf||а} в Яме Имперское кредо.
- guid: 329bc035-313a-4ebe-9420-d40c40055c5e
  length: 33
  text: Отдал{mf||а} блюстителей Маражаю.
- guid: 32fc12f9-f549-4df6-ab3a-d100b9db3833
  length: 82
  text: Успокоил{mf||а} волнения на нижних палубах, снабдив народ лекарствами и припасами.
- guid: 33037acd-813d-47da-a6f0-c7628801609e
  length: 286
  text: Крепко сжимая ладонь Вольного Торговца, Кассия вела {mf|его|ее} сквозь бурый туман — прочь из картины. Их обнаружили без сознания в Санктум Навис спустя двадцать терранских дней после исчезновения, как только корабль Вольного Торговца совершил трансляцию из варпа в неизвестной системе.
- guid: 33245134-43f4-4ec2-b542-2f2dcfe84570
  length: 76
  text: '...приказал{mf||а} пустить очередь в стекло и привлечь внимание Леди Кассии.'
- guid: 3324f1d2-beff-4b5e-94e5-452d4cce5636
  length: 80
  text: Вольный Торговец истребил{mf||а} ксенозаразу при помощи знаний Кровавой паутины.
- guid: 33975906-e206-4532-a00d-922e8778177f
  length: 78
  text: '...потребовал{mf||а} разобрать одного из сервиторов и проверить их содержимое.'
- guid: 34392421-448a-4db6-b496-f2afa8486bc7
  length: 174
  text: '...направил{mf||а} войска в решительную контратаку, в результате которой наземная операция пиратов захлебнулась. По итогам операции полк Астра Милитарум признан уничтоженным.'
- guid: 345fb870-ad49-44bc-8889-c48521cf630a
  length: 158
  text: В тайниках своей предшественницы Вольный Торговец обнаружил{mf||а} дополнительные данные, которые были загружены в бортовой когитатор для дальнейшего анализа.
- guid: 3485ae6c-13ec-4803-9038-aa4696616201
  length: 71
  text: Вольный Торговец велел{mf||а} сделать Блаженных монахами Ордена Молота.
- guid: 34a9b9a6-17d7-40c7-a26f-7a2ec1b0b837
  length: 130
  text: Вольный Торговец сделал{mf||а} новым настоятелем дипломатичного Тикона Драйвстема, и Драйвстемы щедро заплатили за это назначение.
- guid: 34fd6f37-8904-47de-aa0e-bd148d4b3894
  length: 72
  text: Позволил{mf||а} Хейнриксу убить Маражая после кровавого буйства ксеноса.
- guid: 354d764a-5f45-4408-8f50-b96f2755fb2e
  length: 141
  text: '...приказал{mf||а} собрать из раскаявшихся пленных рабочих мануфакторума штурмовую колонну и дать им право искупить свое преступление кровью.'
- guid: 357524e8-921c-4c91-b50d-2d987441d69f
  length: 57
  text: Учредил{mf||а} мученическую смену для каторжан Веабоса-6.
- guid: 35914e08-c62c-45e3-8eb3-2a30cc0ca715
  length: 72
  text: Сжалил{mf|ся|ась} над арестованными инфернусами, велев прекратить побои.
- guid: 35ad8c4b-e308-481a-b695-e9e7ebee640f
  length: 117
  text: Вольный Торговец повелел{mf||а} силам Адептус Механикус выжигать взбунтовавшийся сектор Януса фосфексом и радоружием.
- guid: 36580587-6eb9-48b2-bc29-8f76cae52ebb
  length: 66
  text: Незаметно собрал{mf||а} кровь пиратки Риззы на трибунале Инцендии.
- guid: 3698c8d0-a2b5-4fed-b6a7-b1be6e9aa5a8
  length: 68
  text: Уничтожил{mf||а} удушитель Тервантьяса в шпиле Опустошительной бури.
- guid: 370994c5-316c-44bd-8c17-d51c96e17b8c
  length: 274
  text: Лорд-инквизитор Ксавьер Калькасар верой и правдой помогал Вольному Торговцу, видя в {mf|нем|ней} надежду на обретение Империумом защиты от ужасов вселенной. Все свои силы он бросил на подготовку новых экспедиций к Осколкам К'тан, но не успел поучаствовать ни в одной из них.
- guid: 378dd3aa-4814-4092-8634-680c9d915065
  length: 83
  text: Нечто чудовищное коснулось души Вольного Торговца, пробив брешь в {mf|его|ее} воле.
- guid: 37aac40c-d7e9-4b5b-98a0-4fb0b37f5f6f
  length: 57
  text: Уничтожил{mf||а} подчиненное орудие Хаоса на Кьяве Гамма.
- guid: 37ea7566-7c7c-4062-9b05-1894213297b5
  length: 101
  text: Лорд-капитан отчитал{mf||а} командира за неуместные шутки и направил{mf|ся|ась} вместе вглубь палубы.
- guid: 387c3861-ea3b-4352-8b4c-3e66a15e3cfc
  length: 60
  text: Забрал{mf||а} еретический артефакт с погибшего корабля себе.
- guid: 38b87ebb-e229-45ca-a005-6f5d5f5f23c6
  length: 67
  text: Призвал{mf||а} гвардейцев из живой десятины быть верными Империуму.
- guid: 38c6063d-7495-417f-a6a4-56da31c9ef3b
  length: 54
  text: Надругал{mf|ся|ась} над сакральными символами Кибеллы.
- guid: 3986efc6-ae44-4b5e-8279-855bd5949c78
  length: 248
  text: В тайной комнате Сектора Бионика Лорд-капитан отыскал{mf||а} записи одного из предков, Себериана, сгинувшего в Просторе Коронус вместе с могущественным артефактом. Из них он{mf||а} узнал{mf||а} код доступа к тайному разделу когитатора на Даргонусе.
- guid: 399ad939-f7ee-475f-84d1-a524efa3220b
  length: 134
  text: Вольный Торговец приказал{mf||а} нещадно эксплуатировать немочей. Их присутствие вызывает недовольство и беспокойство среди населения.
- guid: 39a2f939-efd6-4f7e-9089-bfb21cbd0520
  length: 61
  text: '...взял{mf||а} свои слова назад и заключил{mf||а} сделку сию.'
- guid: 39cbfe8e-d455-4bfe-8fb2-7fcb14739baf
  length: 49
  text: Приказал{mf||а} Абеляру одолеть морок в Комморре.
- guid: 39e70794-1709-4b27-addb-be201eff39d4
  length: 18
  text: Каратель{mf||ница}
- guid: 3a5305d4-dcfc-4a0f-bb17-174a09d48e18
  length: 95
  text: '...подош{mf|ел|ла} к поврежденным взрывами створкам врат, преграждающих вход в одну из пирамид.'
- guid: 3a5cce61-55c1-4b9a-bba7-2c1c48146e52
  length: 177
  text: Используя статус Вольного Торговца, Лорд-капитан добил{mf|ся|ась} допуска в карантинную зону. Однако требуется подождать, пока служащие разберут заграждения и деактивируют мины.
- guid: 3a75d16e-89b3-4d19-a8c9-390d3258e773
  length: 113
  text: Вольный Торговец передал{mf||а} варп-вокс Инквизиции, что позволило им подслушивать и отслеживать козни еретиков.
- guid: 3a77a6b3-15ab-4f5f-a847-bfe1475adfc7
  length: 46
  text: Уничтожил{mf||а} зловещий передатчик-приманку.
- guid: 3a8f34ea-ed7a-49ed-a05f-0ec3c726c2ea
  length: 34
  text: Казнил{mf||а} пиратов-заключенных.
- guid: 3ab674a6-015c-4085-8b85-1b05324ed6c2
  length: 171
  text: Войска, осаждающие Ефрат-II, разобщены, и в их командовании нет единства. Лорд-инквизитор желает, чтобы Вольный Торговец возглавил{mf||а} планирование планетарного штурма.
- guid: 3ad461db-c79e-4349-abbc-41274c4eb265
  length: 211
  text: Впрочем, не мне одному изменило сердце в тот момент. Многие матросы, услышав призыв светлейш{mf|его|ей} Лорд-капитана начать ремонт корабля, помышляли не о своем долге, а лишь о том, как поскорее покинуть судно.
- guid: 3af55d3d-4bb3-461f-aa67-45e37efbb29e
  length: 100
  text: Вольный Торговец приказал{mf||а} использовать варп-вокс вместо астропатического хора на Кьяве Гамма.
- guid: 3b345bf7-d21e-43c8-8fd7-2aa1b55b8d77
  length: 241
  text: Кандидат{mf||ка} находилась со своим полком в южном полушарии Лакуры в районе столицы, когда мир подвергся прямой атаке пиратов. После получения данных о десанте значительных сил противника в районе губернаторского имения кандидат{mf||ка}...
- guid: 3b72ec11-9153-4223-9a90-61663bab1df4
  length: 47
  text: Приказал{mf||а} Номос прекратить убивать людей.
- guid: 3b89f4a2-e496-45cd-a586-e85e04a12f5d
  length: 554
  text: 'Став единоличным владетел{mf|ем|ьницей} десятины, вывезенной с Летуса, Вольный Торговец хоть и смог{mf||ла} воплотить в жизнь свои самые грандиозные замыслы, но колоссальное богатство стало проклятием фон Валанциус: мошенники и интриганы всех мастей стекались на Даргонус, рассчитывая хитростью заполучить частичку баснословного состояния, пираты снаряжали флотилии, желая разорить династическую сокровищницу, а бывшие верные соратники и подданные так и норовили обократь казну. Коррупция и козни изъели присвоенную десятину не хуже ржавых ветров Летуса.'
- guid: 3bb517c2-f68f-4b52-bfe5-feb95bb7450e
  length: 48
  text: Вольный Торговец испытал{mf||а} веру мальпийцев.
- guid: 3bc15dc7-7fb1-44b6-a7c2-edb2ba786921
  length: 259
  text: Случившееся далее вошло в легенды. Во главе своей свиты Лорд-капитан лично схлестнул{mf|ся|ась} с выползшим из тьмы времен кровожадным ересиархом. Жестокие и унизительные раны нанес{mf||ла} он{mf||а} нечестивому палачу и обратил{mf||а} Крик скверны в бегство.
- guid: 3bcb192c-6a9b-4d6f-ad29-f536c69bbef9
  length: 346
  text: Коварн{mf|ый|ая} мон-кай решает выпотрошить меня, ударив в низ живота. Я пропускаю этот удар — все важные органы уже давно были заменены более легкими и эффективными аналогами, спрятанными в неочевидных полостях тела. Я позволяю Жертве на мгновение упиться своей победой, после чего безжалостно вскрываю ей горло ударом в упор из удобной позиции.
- guid: 3c07c411-88b5-4b25-ba37-0164d9fbae54
  length: 81
  text: Вольный Торговец ввел{mf||а} карантин и безжалостно выж{mf|ег|гла} очаг эпидемии.
- guid: 3c085cea-b400-4c0a-b42f-1e06946f2514
  length: 105
  text: Подтолкнул{mf||а} мутантов, что обитают в моровой яме транспортного отсека, к служению разлагающим силам.
- guid: 3c0fb230-444c-4476-ab98-3a60cd3e7c4b
  length: 56
  text: Прозрел{mf||а} темную тайну, хранимую отцом Иеронимусом.
- guid: 3c3f8098-57bb-453a-a886-57ee49dd2c8c
  length: 56
  text: Помешал{mf||а} Ардженте казнить одержимую мороком Идиру.
- guid: 3c7a3b7c-c71d-43d5-b31c-721aada27c71
  length: 47
  text: Оправдал{mf||а} попавших под влияние Архиврага.
- guid: 3c84d4a7-1bb5-483b-8abd-932436ce1282
  length: 212
  text: Кандидат{mf||ка} оказал{mf|ся|ась} на планете с целью заключения контракта [данные изъяты] с баронами нижних уровней. После блокады улья и перерезания транспортных сообщений с окружающим миром кандидат{mf||ка}...
- guid: 3cb88e98-5dc5-46c6-b9a6-b32926f0170d
  length: 58
  text: Покинул{mf||а} Райкад Минорис, оставив его на волю судьбы.
- guid: 3daf3b8a-e989-4b67-83ca-b0d6af83e492
  length: 438
  text: 'Клан одной из макропушек бьет тревогу: вентиляционные системы отсека принесли миазмы жуткой болезни, которая ежеминутно косит десятки людей. Ужаснее всего то, что мертвецы поднимаются на ноги и нападают на живых, а некоторые трупы и вовсе теряют человечий облик, превращаясь в кошмарных варп-тварей. Отправлять в отсек отряды подобно самоубийству — только бесстрашн{mf|ый|ая} Лорд-капитан и {mf|его|ее} свита может остановить эту напасть!'
- guid: 3dba3bea-2982-49f8-aad4-89a616e1a8be
  length: 47
  text: Оставил{mf||а} лишнюю живую десятину на Летусе.
- guid: 3e8fc718-9107-4561-85dd-cec12759f4a4
  length: 40
  text: Предводитель{mf||ница} моторных вандалов
- guid: 3e916856-37a8-4d32-a506-1fca105e6888
  length: 41
  text: '...бросил{mf|ся|ась} к панели управления.'
- guid: 3e931b6a-8b9b-446e-85e8-93d79d78fd13
  length: 382
  text: Балансируя между силами, жаждавшими обрести контроль над Вольным Торговцем, {mf|Его|Ее} Светлости удалось пройти по грани между фанатизмом, ересью и обращением в бессердечное чудовище. Всякая сила была для {mf|него|нее} союзником или врагом, но ни одна — хозяином. {name} фон Валанциус служил{mf||а} лишь себе и своей династии, прочие же были для {mf|него|нее} ресурсом или добычей.
- guid: 3eb4218f-e53c-4015-a548-e2a324895b92
  length: 98
  text: Вольный Торговец поработил{mf||а} Ноль-Халифа и принудил{mf||а} его служить в качестве навигатора.
- guid: 3eb92ca3-ae1b-471e-b319-6eca06a862be
  length: 346
  text: Среди еретиков, взятых в плен при высадке, оказалось несколько командиров. Они охотно показали точное расположение вражеских когитаторов и предоставили декрипторные литании для доступа к защитным системам. Все мы в тот час возблагодарили Лорд-капитана за мудро избранную {mf|им|ею} тактику устрашения, использованную в начале планетарного штурма.
- guid: 4018296e-c23e-4c4c-b360-2df0d61aa98c
  length: 272
  text: Вольный Торговец решил{mf||а} судьбу Дома Орселлио — за использование ксеноартефакта и предательство Империума еретики поплатились жизнями. Теперь свите Вольного Торговца предстоит вернуться на корабль и отыскать обратный путь домой — в Простор, через буйство варп-шторма.
- guid: 401951a3-ccf1-480f-9c71-b52c5e06f8f4
  length: 46
  text: '...развернул{mf|ся|ась} и пош{mf|ел|ла} прочь.'
- guid: 407780ec-afcc-422f-98b4-fe1048dbf20a
  length: 77
  text: Не стал{mf||а} уничтожать удушитель Тервантьяса в шпиле Опустошительной бури.
- guid: 4085cd11-3ca5-4535-b6db-d02b882725d9
  length: 167
  text: В ожидании, пока корабль снова сможет отправиться в путь, Вольный Торговец вол{mf|ен|ьна} посетить местную администрацию. Наместник Владайм ожидает в своей резиденции.
- guid: 419744f2-4acb-417f-8140-43820004eebf
  length: 81
  text: Лорд-капитан призвал{mf||а} на помощь всю свою выдержку, дабы не уступить страху.
- guid: 419ad329-10b9-4f6b-a89b-d29f9ae512c2
  length: 53
  text: '...ударил{mf||а} перв{mf|ым|ой}, метя в слабое место.'
- guid: 41bf8a02-ccc9-401c-b154-935ec4a94268
  length: 47
  text: Вольный Торговец открутил{mf||а} вентиль ОД-№2.
- guid: 41e42df7-44b1-4384-aae9-32454ba439eb
  length: 36
  text: Искоренитель{mf||ница} Процедуры 0-Х
- guid: 41eb7257-3e43-4d0c-8fa9-c25b3d86d80f
  length: 164
  text: Был дан кровавый обет, и пали цепи с тени Домин. Но осталась она тиха и недвижна, ибо не знала смысла покидать чертог Смерти. И сказал{mf||а} ей тогда Домин, что...
- guid: 422ac161-81d2-465d-af22-742a848fa723
  length: 186
  text: Ксавьер Калькасар лично встретился с Вольным Торговцем на е{mf|го|е} столичном мире. Столь пристальный интерес к ново{mf|му|й} главе династии фон Валанциус внушает удивление... и трепет.
- guid: 423df1b8-64da-48dc-b89a-1c83efc236f4
  length: 48
  text: Убил{mf||а} Маражая после его кровавого буйства.
- guid: 4249498a-a9ce-4074-a774-7d11b134bac3
  length: 55
  text: Велел{mf||а} основать приюты для страждущих на Футфоле.
- guid: 4277df0f-93b8-4bd5-91e6-100eaced257a
  length: 116
  text: Лорд-капитан немедленно назначил{mf||а} капитану Вести строгое наказание и запросил{mf||а} отчет о делах его отряда.
- guid: 42d4c750-f03d-4865-a82d-a444e44d435d
  length: 439
  text: Ценой многих смертей, оборона {g|Encyclopedia:XenosGlossary}ксеносов{/g} была прорвана. По завершении артиллерийской подготовки, к искалеченной взрывами поверхности планеты направились несколько шаттлов, отделившихся от флагмана. Небольшие, маневренные суда как нельзя лучше отвечали замыслу мое{mf|го|й} наследни{mf|ка|цы} — незаметно проникнуть в самое сердце древней гробницы и забрать то, что принадлежит {mf|ему|ей} по праву рождения.
- guid: 4351869a-681c-4d29-a492-fd0abd0333fc
  length: 52
  text: Казнил{mf||а} отца Иеронимуса на трибунале Инцендии.
- guid: 43543f1a-b419-4bf7-9538-ad65494f9ba3
  length: 32
  text: Госпо{mf|дин|жа} Простора в Тени
- guid: 43fb53c3-4d27-4f9f-92e4-1e3818621abd
  length: 98
  text: Столичный мир династии фон Валанциус обнаружен и ожидает прибытия свое{mf|го|й} госпо{mf|дина|жи}.
- guid: 442f7e0c-f7f9-4620-9626-3e96ac60bae0
  length: 55
  text: Пообещал{mf||а} защищать народ в речи на Магнэ Ацессио.
- guid: 44718f5f-b94f-41cd-9df0-2d70de5c8ab5
  length: 124
  text: Вольный Торговец бессовестно похитил{mf||а} псайкеров у других правителей. В отместку те отказались вести дела с Даргонусом.
- guid: 4474db17-1eb6-4bea-89d6-2fd6bc1f66a1
  length: 85
  text: Принес{mf||ла} пленных в жертву Губительным силам, получив за это частицу могущества.
- guid: 44af57ad-2cac-4f5e-8c80-5668e7b7a49a
  length: 44
  text: Распалил{mf||а} гнев Ульфара едкими словами.
- guid: 44e0246e-5b0a-4d78-be06-e4c7fabac22b
  length: 32
  text: Отдал{mf||а} блюстителя Маражаю.
- guid: 44e9b28a-83e6-4c32-ae11-948ea76bdd9b
  length: 94
  text: '...отправить вперед разведку, усиленную {mf|его|ее} личным кибермастифом с позывным {petname}.'
- guid: 44fe9a7d-8453-4fca-ae5f-de5cd6c2d2e8
  length: 64
  text: '...обратить взор к ожидающим {mf|его|ее} указания разведотрядам.'
- guid: 4502c46a-1ae0-40e7-8b30-a866104ca18d
  length: 364
  text: Слухи и истории о {mf|его|ее} человеколюбивом правлении заложили основу философской школы валантийцев. Cекта, объединявшая простолюдинов и аристократов, верила, что для достижения процветания Империум должен перестать видеть в своих подданных лишь инструмент. Эта опасная ересь была осуждена во множестве систем, но гонения лишь закаляли и умножали ее сторонников.
- guid: 45297fc2-5c48-4302-b498-b385357795d7
  length: 88
  text: Вольный Торговец назначил{mf||а} общую опеку Эксплораторов и Ордена Молота над Горнилом.
- guid: 452f013b-eb15-4f52-a3ef-a38d68e4d8e1
  length: 479
  text: Избранни{mf|к|ца} Темных Богов был{mf||а} только рад{mf||а} даровать свое покровительство столь могущественному еретеху, предоставив в его распоряжение все тайные знания, которыми поделились с ним Четверо. Кьява Гамма, прежде служившая оплотом для служителей Бога-Машины, превратилась в наполненную механистическими ужасами твердыню, полностью подчиненную падшему манипулусу. В ее туннелях и тайных цехах множились нечестивые машины, несущие смерть врагам династии фон Валанциус.
- guid: 4559dce5-2954-44b4-af34-7df4a7a6be5d
  length: 83
  text: Оставил{mf||а} разрушенный алтарь на планете, забрав с собой его проклятый осколок.
- guid: 45687505-3e1a-4ef7-b2da-8f4ad79259b4
  length: 61
  text: Обосновал{mf||а} праведность Триасоматы пользой для династии.
- guid: 45dce329-1c85-4871-96ac-0ce4c41a0cae
  length: 99
  text: Дворяне Даргонуса приняли власть свое{mf|го|й} ново{mf|го|й} госпо{mf|дина|жи} и защитни{mf|ка|цы}.
- guid: 45f675f4-546c-4870-a756-ef55516b4d57
  length: 44
  text: Убил{mf||а} святого, чтобы обрести его мощи.
- guid: 46092f56-e7db-4d41-ae3b-676959667b33
  length: 493
  text: Чудовище, что вернулось с Вольным Торговцем из Комморры, мало чем напоминало прежнего Ахиллеаса Скаландра. В редкие минуты прозрения бывший агент Инквизиции выл диким зверем, моля о смерти, а в минуты буйства свирепо расправлялся с теми, кто был непокорен его хозя{mf|ину|йке}. Со временем разум и плоть чудовища, лишенные инъекций гемункула, начали распадаться, принося нескончаемые страдания. В порыве безумия Ахиллеас прыгнул с высокого шпиля Даргонуса, и его изувеченная душа обрела покой.
- guid: 46195a3f-9bc7-40c0-9f97-17e667752cdb
  length: 491
  text: Вывезенная с Летуса десятина стала спасением для погибающих миров Простора. Вольный Торговец не скупил{mf|лся|лась}, чтобы помочь не только своему протекторату, но и соседям. Не все понимали подобное милосердие, однако роль фон Валанциус в спасении целых систем была неоспорима. Вскоре некоторые миры стали оспаривать выделенный им размер помощи, а другие и вовсе отказались выплачивать десятину. В итоге слишком многие потратили бесценный дар жизни на кровавые бунты и бессмысленные распри.
- guid: 4641c96c-27d7-43a3-8e43-961b9d63444c
  length: 63
  text: Подтолкнул{mf||а} архмилитанта к использованию Губительных Сил.
- guid: 465f310d-859f-43c4-9300-f1918a203521
  length: 149
  text: Обитатели станции Футфол восславят Вольного Торговца, избавивш{mf|его|ую} их от мучительного выбора между смертью от голода и властью Инцендии Чорда.
- guid: 46c84a5c-575c-4695-be9e-1cafc2e1b9fc
  length: 60
  text: Лорд-капитан приказал{mf||а} отряду возвращаться на корабль.
- guid: 46de4a23-4461-4da2-a1c3-0ded7e522abb
  length: 61
  text: Вольный Торговец смягчил{mf||а} условия каторги на Веабосе-6.
- guid: 47b35b4a-2c7d-4824-a2e4-96cb428b6d01
  length: 358
  text: Варп-прыжок прошел на удивление спокойно. Ни один из палубных дежурных не сообщил о происшествиях. Однако Лорд-капитана ждало странное открытие по возвращению в покои — {mf|его|ее} кровать была расстелена, а на подушке отпечатался след головы. Никаких иных следов вторжения обнаружено не было. Охрана покоев под присягой клялась, что внутрь никто не заходил.
- guid: 47dac19c-8d34-46c2-b5e9-91309a739546
  length: 196
  text: Лорд-капитану предстоит занять место Теодоры фон Валанциус в роли правител{mf|я|ьницы} протектората. Чтобы успешно управлять им, Вольному Торговцу предстоит освоить все аспекты своей новой власти.
- guid: 47f1ff4c-e187-4281-8ef8-b88df14d63a4
  length: 453
  text: Идира Тласс ради спасения своей проклятой души присягнула Губительным силам и позволила себе слиться с направлявшими ее долгие годы голосами. Еще много веков многоликое чудовище, в которое она со временем обратилась, вело Вольного Торговца по пути скверны нечестивыми пророчествами, изрекаемыми бесчисленными ртами. Лишь сам{mf||а} {name} фон Валанциус мог{mf||ла} выловить единственную верную фразу из тысяч кощунств и какофонии сводящих с ума голосов.
- guid: 481f27dd-01d4-4bd4-bc8a-d90e24866678
  length: 77
  text: Допустил{mf||а} простолюдинов к управлению Даргонусом наряду с аристократией.
- guid: 483e71d5-9e7e-4052-9ddf-31907e4766a6
  length: 60
  text: Провозгласил{mf||а} свое господство в речи на Магнэ Ацессио.
- guid: 4849ee85-4e5c-421b-99fd-d5e9fc78198f
  length: 70
  text: Воззвал{mf||а} к чувству долга истерзанного техножреца на Кьяве Гамма.
- guid: 485e4290-dbb3-486a-b8d9-21262aa290d6
  length: 252
  text: Идеалы, которым следовал{mf||а} {name} фон Валанциус, были чужды нравам Империума, но близки сердцам многих. Каждый в Просторе, кто не мог достичь мира в споре, кто был обделен справедливостью, устремлялся во дворец Вольного Торговца в поисках милости.
- guid: 4922e5fc-a640-401a-9f2a-f9e0f1b1dda4
  length: 65
  text: Да не предаст Металл влады{mf|ку|чицу}, угодн{mf|ого|ую} Омнисии.
- guid: 4928fa5c-a027-4ff3-9ed5-57421ea6a98a
  length: 271
  text: По иронии судьбы после того, как Вольный Торговец вош{mf|ел|ла} в конклав Коронус, Хейнрикс ван Калокс оказался командиром над Лорд-капитаном. Он сполна насладился всеми предоставившимися ему возможностями помыкать и властвовать над своенравн{mf|ым|ой} Вольным Торговцем.
- guid: 493d618e-1084-4c65-bde7-7e5cd98ca336
  length: 31
  text: Отдал{mf||а} Ирлиэт Инквизиции.
- guid: 497e6bde-fb29-41b8-9978-0ea7d91dd8f5
  length: 113
  text: Соперники Вольного Торговца пали, и теперь он{mf||а} может потребовать от гемункула обещанного содействия побегу.
- guid: 49dc53f3-ef10-4b83-8c5d-9885340aec98
  length: 76
  text: Приказал{mf||а} уничтожить дефективных сервиторов, чтобы избавить их от мук.
- guid: 49f012a4-7a66-4450-916c-d77aefa0f1d6
  length: 30
  text: Спас{mf||ла} сгоревшего юношу.
- guid: 49fc03f2-c412-457c-bdb6-4b655c9ce3d5
  length: 36
  text: Искусн{mf|ый|ая} грабитель{mf||ница}
- guid: 4a5a127e-561d-4577-ab76-d1c52fb2c090
  length: 57
  text: Вольный Торговец поднес{mf||ла} богатые дары Ноль-Халифу.
- guid: 4a648970-87a0-4075-b154-03bf59978289
  length: 147
  text: Торговый Патент возвращен в охраняемые палаты и вновь освящен кровью {name} фон Валанциус, законн{mf|ого|ой} нынешне{mf|го|й} держател{mf|я|ьницы}.
- guid: 4a91d1c6-0dc3-42db-af8d-8087e55aa7e5
  length: 139
  text: Вольный Торговец дозволил{mf||а} карательным отрядам Ордо Ксенос проводить дознания на Янусе, и теперь население испытывает страх и трепет.
- guid: 4a992243-75de-4ae5-b278-76bb74e26f8e
  length: 41
  text: Напал{mf||а} на эльдаров на Кетца-Темере.
- guid: 4bc9f64a-bf4a-4d1f-ac88-495652bc106a
  length: 173
  text: Лорд-капитан приш{mf|ел|ла} в себя в ужасном месте, полном трупов. Чтобы не присоединиться к ним, е{mf|му|й} необходимо как можно быстрее убраться прочь из этого могильника.
- guid: 4c35ee51-7cae-4452-8f30-897591c5dfc2
  length: 159
  text: Лорд-капитан сокрушил{mf||а} железных мертвецов. Здесь, среди обломков, когда-то сгинул Себериан — существует ли награда достойнее утраченного клинка-реликвии?
- guid: 4c817b94-af4a-46bf-9804-11756cb5fea9
  length: 329
  text: Темные боги были разъярены предательством свое{mf|го|й} чемпион{mf|а|ки}, столь щедро получавше{mf|го|й} их дары и столь вероломно отвергше{mf|го|й} их ради нового владыки. Но ни гнев владык Имматериума, ни оружие присягнувших им воинов не могли уязвить т{mf|ого|у}, что был{mf||а} огражден{mf||а} могуществом истинного божества.
- guid: 4c9b979c-09b6-49b2-b9ec-49e8a90d9dad
  length: 48
  text: Оставил{mf||а} сгоревшего юношу умирать в муках.
- guid: 4ca2d8b6-92d6-4261-bf27-5efb711f920a
  length: 235
  text: Пустотный корабль под командованием кандидат{mf|а|ки} оказался единственным из двух судов, находившихся в пустоте над Лакурой в момент прибытия пиратского флота. Перед лицом многократно превосходящей враждебной силы кандидат{mf||ка}...
- guid: 4cd474e2-6e04-4062-a0f5-f865de3d21e2
  length: 188
  text: Веабос-6 — тихая гавань. Если Вольный Торговец позволит пиратским эскадрам укрыться здесь и совершать отсюда налеты, то он{mf||а} превратится в пиратск{mf|ого|ую} корол{mf|я|еву} Простора.
- guid: 4ce1ddd8-453d-4e09-816f-292f14284375
  length: 273
  text: 'Спокойствие варп-перелета было нарушено призывами о помощи: на одной из складочных палуб творится что-то жуткое. Уже два отряда, отправленных на разведку, пропали без следа... увы, единственный способ узнать их судьбу — личный визит Вольного Торговца и {mf|его|ее} свиты...'
- guid: 4d876ca6-bd6f-4583-b7d8-0f453ca24a57
  length: 69
  text: Сказал{mf||а} Каллигосу, что нельзя убивать эльдаров на Кетца-Темере.
- guid: 4dc9fdf1-2001-458d-acbc-b07df8d0cbeb
  length: 77
  text: Предложил{mf||а} сервиторизировать Наместника Владайма на трибунале Инцендии.
- guid: 4e20a5af-37bc-4e35-9db1-bf12f79a2d9a
  length: 160
  text: Сквозь шепот ангела в моих ушах я с трудом услышал, как ожила {g|Encyclopedia:Vox}вокс{/g}-сеть. Мо{mf|й|я} почтенн{mf|ый|ая} госпо{mf|дин|жа} повелел{mf||а}...
- guid: 4f1a9aee-c537-4871-802f-d046c5e0f3e8
  length: 138
  text: Лорд-капитан, будто бы не придав значения случившемуся, убрал{mf||а} клинок в ножны и покинул{mf||а} грузовой отсек, не проронив ни слова.
- guid: 4f2a1854-f5eb-4bad-a9ef-3c262a2b74e2
  length: 329
  text: Ту битву возглавлял{mf||а} Вольный Торговец {name} фон Валанциус. Волевая личность, непоколебимая. Я был в составе {mf|его|ее} личной гвардии блюстителей — очередной сопляк, считавший себя матерым воякой. Император был милостив, позволив мне осознать, насколько я заблуждался. Большинство моих товарищей не получили такого шанса.
- guid: 4f2edf90-f7df-47be-a9be-eb33df7db7b0
  length: 55
  text: Замуровал{mf||а} лишнюю живую десятину на Летусе в яму.
- guid: 4f4fc4c8-009b-48f6-8af3-b267e8c0c7a7
  length: 72
  text: Пощадил{mf||а} мятежника Арильда, ослеплявшего людей еретической линзой.
- guid: 4f58a281-774b-45fa-8fcb-cce4fc57a7ea
  length: 80
  text: Убедил{mf||а} Претора Электродинамической обители предоставить монахов в помощь.
- guid: 4f65a98b-18ae-4723-ad29-fbbe101de482
  length: 75
  text: Вольный Торговец взял{mf||а} малые культы Даргонуса под свою личную защиту.
- guid: 4f90d918-d245-4487-bd62-3190a9274c0e
  length: 66
  text: Проявил{mf||а} заботу о корабельном хоре, обеспечив его припасами.
- guid: 4faf1071-fc16-438a-85fc-2d068eb2ef43
  length: 163
  text: Вольный Торговец велел{mf||а} изучать Процедуру 0-Х. Многие соблазняются древними знаниями и вступают на путь греховного творчества, чем вызывают гнев праведников.
- guid: 4fe1a952-2e1d-4c01-886e-023952cdf3c9
  length: 143
  text: Собрав союзников и приготовившись к неизведанному, Лорд-капитан направил{mf|ся|ась} во тьму, таящую древние кошмары... и ответы на все вопросы.
- guid: 4ff534ed-f184-4637-8d0f-2dd4d6d2e438
  length: 60
  text: '...бросил{mf|ся|ась} на мертвого навигатора с голыми руками.'
- guid: 4ffabdc9-202c-46d8-baf2-408233ffa01e
  length: 159
  text: Аванпост династии Винтерскейл приветствует {name} фон Валанциус и благодарит за помощь — обитатели планеты в долгу перед {mf|ним|ней}. Слава Вольному Торговцу!
- guid: 500bc0ab-8ed3-45d4-ac39-801a377c6bb3
  length: 92
  text: Обратил{mf|ся|ась} к арбитрам с искренней речью, призвав восстать против префекта и маршала.
- guid: 50307ebc-523e-4fa6-a145-d209ef7e6808
  length: 102
  text: Вольный Торговец знаком{mf||а} с приемами врагов Человечества, им не застать имперское судно врасплох!
- guid: 504b668b-75d0-4244-a205-eef49f7645bb
  length: 55
  text: Помог{mf||ла} Заккари Вайсу справиться с чувством вины.
- guid: 505289d6-70d8-4af7-8a34-2fcf23db1575
  length: 68
  text: Удержал{mf||а} солдат Заркова от поножовщины, воззвав к чести полка.
- guid: 505fc66f-b45f-4bc4-a27f-aac961f080e5
  length: 104
  text: Приказал{mf||а} беженцам, прибывшим на Фолстоун, и обитателям монастыря биться друг с другом за награду.
- guid: 509fdffe-9333-4d51-ac77-6761bf6567f3
  length: 386
  text: Кассия Орселлио усвоила каждый горький урок, полученный в странствиях с Вольным Торговцем. Она стала Новатором Дома вопреки собственным страхам, ненависти сородичей и манипуляциям регента. Но главное — вопреки Вольному Торговцу, ненависть к которо{mf|му|й} преследовала ее всю жизнь. Подобно своей предшественнице, Кассия правила Домом Орселлио железной рукой — с помощью силы и страха.
- guid: 50c4c298-5f71-45da-a589-5342aff93b1a
  length: 85
  text: Вольный Торговец использовал{mf||а} варп-вокс для вещания святых гимнов в Имматериум.
- guid: 50e1941b-4f36-41be-8e94-3e26c3e50661
  length: 52
  text: Вольный Торговец приглядел{mf|ся|ась} к собравшимся.
- guid: 511f989a-389f-4f37-a449-6ef7be7ba4a2
  length: 85
  text: '...признал{mf||а} превосходство противника и выполнил{mf||а} тактическое отступление.'
- guid: 512b5704-adc1-43aa-a028-4f723612e498
  length: 54
  text: Вольный Торговец вступил{mf||а} в союз с Ноль-Халифом.
- guid: 51517c0a-8331-430c-8578-0010bd5de796
  length: 76
  text: Засмеялся Неумирающий, ибо все, что обещал{mf||а} Ему Домин, и так было Его.
- guid: 521f46fc-9ee1-4b51-a473-31836eeaaa35
  length: 45
  text: Отдал{mf||а} свои ботинки бродяге в Комморре.
- guid: 5255da37-8206-4739-9ea0-3ee14a9bb328
  length: 118
  text: Вольный Торговец заключил{mf||а} сделку с моторными вандалами, с дозволения Адептус Механикус приобретая у них добычу.
- guid: 529b8e20-2c74-41fa-8269-b284c87de0e8
  length: 203
  text: Гарантом твердости имперской хватки на горле Простора было ручное божество фон Валанциусов. Истребляя врагов и сомневающихся, Вольный Торговец даровал{mf||а} сектору уверенность в неизбежность воздаяния.
- guid: 52e1985f-d9cd-4490-bfca-0641a007ac7c
  length: 53
  text: Облачил{mf|ся|ась} в одеяния еретиков из любопытства.
- guid: 5335e265-a807-40af-ac0b-0a810dbeba40
  length: 45
  text: Помиловал{mf||а} братьев-дарителей с Тассеры.
- guid: 5349db86-03e5-4be6-8a1b-fe39903a236c
  length: 90
  text: Предложил{mf||а} отдать Уралону Жестокому Патент в обмен на благословение Губительных сил.
- guid: 53502daa-2693-4ff3-88bc-6080c2fab245
  length: 322
  text: Не доверяя полумерам, Лорд-капитан приказал{mf||а} взорвать отсек. Специалистам-подрывникам удалось провести операцию с ювелирной точностью, нанеся минимальный урон кораблю. Однако пикт-рекордер отправленного на разведку сервочерепа показала, что зеркало не повреждено и находится в полости на месте взорванного помещения.
- guid: 5387d5d4-10d9-484b-b907-99d41f47edd1
  length: 108
  text: Могущество Вольного Торговца достигло точки, когда он{mf||а} может напрямую обратиться к своему покровителю.
- guid: 53914155-7e7b-469e-bdc8-00311d7eb4dd
  length: 310
  text: Операция по борьбе с изменниками Человечеству, подстрекаемыми ксеносами, проведена успешно. Благодаря мудрости и воле светлейш{mf|его|ей} Лорд-капитана стала возможна окончательная ликвидация их богомерзкого движения, которая была предоставлена лично Вольному Торговцу — владыке мира Янус и вершителю воли Его.
- guid: 53970928-5fa3-47c5-a5c8-c0eb4cccd985
  length: 84
  text: Убедил{mf||а} мятежников во главе с Арильдом сложить оружие и прекратить ослепления.
- guid: 53a179c8-eef6-4b9a-9068-914082467018
  length: 212
  text: Крохотный аванпост, подаренный Вольным Торговцем Джай Хейдари, неожиданно расцвел благодаря предприимчивости своей хозяйки. Джай не забывает делиться прибылью от колонии со сво{mf|им|ей} покровител{mf|ем|ьницей}.
- guid: 540f52b7-305c-4417-97de-3220636d4eb4
  length: 145
  text: Вольный Торговец подсунул{mf||а} карательному отряду Ордо Ксенос кучку эльдар, которых аколиты перебили и, довольные успехом, убрались с планеты.
- guid: 541fb894-adb9-4721-b092-b3e43c6366fc
  length: 219
  text: Недобро сверкнули глазницы черепа Неумирающего, ибо Он был Домин всея человеческой расы, и всякий трон был — Его трон. Но не снизошел Он до того, чтобы истребить дерзк{mf|ого|ую} Домин, ведь ему еще не пришла пора уйти.
- guid: 5453fdea-c37a-418d-979a-f33f3a67379e
  length: 210
  text: Кандидат{mf||ка} участвовала в криминальной схеме, выступая посредни{mf|ком|цей} между высшим офицерством Астра Милитарум и мафиозными баронами с окраины сектора. Воспользовавшись ситуацией, кандидат{mf||ка}...
- guid: 54a54f5d-a9b0-4a64-acee-627fb81d33a8
  length: 89
  text: Велел{mf||а} отцу Иеронимусу уничтожить ксенооружие, подаренное Каллигосом Винтерскейлом.
- guid: 54e6a04b-8f4b-4629-9e31-a1eb11fc17bd
  length: 59
  text: '...с ласковым словом обратил{mf|ся|ась} к Потерянному дитя.'
- guid: 550dbcbf-0415-44fd-8fe1-3332ff342b78
  length: 495
  text: Некоторое время спустя Ирлиэт приходит к Лорд-капитану — изможденная и потерянная. Она говорит о том, что отправилась на судне мон-кай во тьму в надежде отыскать собратьев, а нашла лишь трупы, погребенные человеческой ненавистью. И даже когда Лорд-капитан мог{mf||ла} помочь ее народу, элантах упрямо {mf|шел|шла} той же тропой, что и прочие мон-кай, нарушая договор. И свою часть договора эльдарка выполнять не намерена — сокровища детей Азуриана не достанутся {mf|тому|той}, кто их не достоин.
- guid: 5520cd08-d566-4b5b-8cae-1b8d31561340
  length: 250
  text: По отдельному указанию Лорд-капитана в биографии кандидат{mf|а|ки} выделен наиболее значимый эпизод, демонстрирующий личные характеристики и поведение в стрессовой ситуации. Согласно собранным данным, таким эпизодом в жизни кандидат{mf|а|ки} стало...
- guid: 552fb98f-3f13-47fb-8612-5a2e83f9a700
  length: 93
  text: Поддержал{mf||а} решение Соломона об уничтожении тассерция, последовав букве Лекс Империалис.
- guid: 553891db-c4f4-4d8f-8c1e-be7d8f24e3bd
  length: 438
  text: По наступившей гробовой тишине Лорд-капитан понял{mf||а}, что что-то не так. Проследив взгляды людей, он{mf||а} увидел{mf||а}, что связной отряда, несущий большой вокс-передатчик с антенной и передатчиком, сильно отстал. И лампочка вокса не горела! Отряд не получал сейчас никаких входящих сигналов. И даже если б получил — голос не мог бы звучать настолько близко, будто связной — или сам Енхо Сон — стоят вплотную к Вольному Торговцу...
- guid: 556655f4-02c8-4438-8641-f4be0495f3d7
  length: 43
  text: Пригрозил{mf||а} отцу Иеронимусу расправой.
- guid: 55be646a-bc1a-477a-ba07-cc0565b58915
  length: 48
  text: Отказал{mf|ся|ась} участвовать в фальшивом суде.
- guid: 55c30506-a997-4073-953d-6e8603090af4
  length: 445
  text: Обслуживающий клан генераторов пустотных щитов попросил {mf|Его|Ее} Светлость Лорд-капитана о помощи. По отсекам расползлась скверна в обличье грибницы. Мицелий захватывал новые пространства, а жирные черные споры отравляли слуг Вольного Торговца, заставляя их глаза лопаться, а вены — раздуваться и разрывать кожные покровы. Клану были выданы укрепленные униробы с противогазами, чтобы они могли продолжать работать, пока воины выжигают заразу.
- guid: 55f1a657-e629-44d3-9ee0-599408d3fd99
  length: 157
  text: Несанкционированный псайкер Идира Тласс была сочтена слишком опасной, чтобы позволять ей жить дальше. Лорд-капитан лично привел{mf||а} приговор в исполнение.
- guid: 560999b5-98f9-42e3-99ce-95bf1bfbc0c0
  length: 43
  text: Решил{mf||а} добить пленников на Веабосе-6.
- guid: 562a5eb9-d707-427b-b1ec-13520f158ed0
  length: 85
  text: Оправдал{mf||а} Хейнриксу уничтожение еретического когитатора преданностью Империуму.
- guid: 562c8c7c-1cc5-4e84-92f7-c8f920faa6c6
  length: 220
  text: Путь Иеронимуса Скорбного завершился у подножия трона Вольного Торговца фон Валанциус. {name} живьем содрал{mf||а} с черепа лицо проповедника, а затем поместил{mf||а} его освежеванную голову на своем капитанском мостике.
- guid: 56326b6d-9686-44bf-b1ff-4f0640e9ec5a
  length: 90
  text: Сказал{mf||а} Ирлиэт прервать страдания чудища, сшитого из множества эльдарских провидцев.
- guid: 568fe7d0-49bb-4599-9687-685bb6674dde
  length: 453
  text: Забившись в темный угол, Джай Хейдари вынуждена была стать свидетельницей предательства, свершенного Вольным Торговцем. Когда изменни{mf|к|ца} Человечества покинул{mf||а} Эпитафию, она осталась на истерзанном планетоиде одна. Увы, это лишь отсрочило ее гибель, поскольку даже самая умелая контрабандистка Простора не смогла бы покинуть миры древних ксеносов без корабля. Не желая принимать муки голода и жажды, она завершила свой путь выстрелом в висок.
- guid: 569563d7-3be8-424f-99be-8b834a1a994f
  length: 250
  text: 'Чей-то вскрик нарушил тонкое равновесие застывшего тела, и невесомость отпустила Лорд-капитана. {mf|Он|Она} провалил{mf|ся|ась} в бурую бездну клубящихся мороков, но теперь был{mf||а} способ{mf|ен|на} полностью управлять своим телом.

    Теперь {name}...'
- guid: 5705573d-1f69-4aba-9e7f-d23742816d20
  length: 440
  text: Лорд-капитан, игнорируя протесты почтенных техножрецов, приказал{mf||а} не щадить инфраструктуру мира. Мы нанесли удар по священной капелле Магос Алхемис, вызвав выброс токсичного газа в атмосферу. Облако яда накрыло орудия врага, но еретики даже тогда не отступили. Когда мы, прорвавшись сквозь огонь, обрушились на их позиции, они были уже так измучены витающим в воздухе ядом, что и не помышляли о сопротивлении, сдаваясь в плен сотнями.
- guid: 571d1c35-bb2a-4829-ab16-42614cc22ecd
  length: 540
  text: 'Сестра Арджента — одна из благословенных Адепта Сороритас, которых иногда в просторечии зовут Дочерьми Императора. Неистовая как в бою, так и в молитве, молодая воительница жаждет принести свет в темные уголки Простора Коронус.

    Арджента путешествовала на корабле Теодоры фон Валанциус. В судьбоносный день, когда корабль атаковали слуги Хаоса, она примкнула к будуще{mf|му|й} Лорд-капитану и помогла отразить нападение. Сестра показала себя не только отчаянным воином, но и надежной соратницей, готовой уничтожить любого врага Человечества.'
- guid: 574ad3d5-b12c-4bf0-9752-d2aa645f970b
  length: 180
  text: Вольный Торговец повелел{mf||а} отловить немочей и узнать у них, что происходит во взбунтовавшемся секторе Януса. Они подсказали, как существовать возле сектора без вреда для себя.
- guid: 578e9bbd-d9aa-45af-a250-f320d18ecdfc
  length: 77
  text: Наш{mf||а} Лорд-капитан лично руководил{mf||а} процессом. И пожелал{mf||а}...
- guid: 5794d297-6bfe-42ef-a194-24949479f585
  length: 530
  text: '{name} фон Валанциус, вступивш{mf|ий|ая} в распахнутый вероломным Тразином Неисчислимым портал, обнаружил{mf||а} себя на собственном пустотном корабле — но не на кануне финала {mf|его|ее} славной истории, а в самом ее начале. Впрочем, технологические чары ксеноса не оставили Лорд-капитану и шанса осознать в полной мере всю катастрофу своего положения — вместо этого {name} продолжил{mf||а} играть отведенную {mf|ему|ей} роль в пьесе, заключенной в темпорально-пространственную капсулу и предназначенной лишь для этого зрителя...'
- guid: 584d595a-f030-49e3-8312-11ba1b9486c0
  length: 146
  text: Лорд-капитану удалось избежать гибели и найти безопасное укрытие... в той или иной мере. Теперь е{mf|му|й} предстоит обдумать свои следующие шаги.
- guid: 587cc64f-4a00-4bc1-a2c6-a6242a007bed
  length: 58
  text: Вонзил{mf||а} еретический клинок в дефективного сервитора.
- guid: 58a94645-8e3b-412e-a2e7-144b82e634d2
  length: 460
  text: 'Тревожные донесения о гибели палубных патрулей вынудили Лорд-капитана и {mf|его|ее} свиту лично нанести визит в недра пустотного корабля. Тайна преступления была раскрыта на территории клана, обслуживающего макропушки: самоличный визит Вольного Торговца спугнул группу предателей, готовивших диверсию, и заставил действовать преждевременно. Каждая минута на счету: если бунтовщики приведут в действие взрывные аппараты, отсек ждут чудовищные разрушения! К бою!'
- guid: 58b769a8-7895-4ed8-aa8e-f39eff89af8b
  length: 92
  text: Продажные слуги Винтерскейла охотно перешли под командование ново{mf|го|й} хозя{mf|ина|йки}.
- guid: 58dd6683-0876-4a8e-902d-1a25e36aed2f
  length: 116
  text: Смирив гордыню монахов и техножрецов, Вольный Торговец завоевал{mf||а} славу велико{mf|го|й} примирител{mf|я|ьницы}.
- guid: 58f116ea-994f-4f48-ac97-aad419c8b955
  length: 77
  text: Решил{mf||а} эвакуировать часть людей с Веабоса-6, а часть сервиторизировать.
- guid: 5948b66c-860e-407b-8985-833c824d8e9a
  length: 130
  text: Вольный Торговец велел{mf||а} провести суд поединком между мальпийцами и Орденом Молота. В результате Орден Молота одержал победу.
- guid: 5962dba6-9b0e-462e-98ce-5fa76e0a734f
  length: 72
  text: '...помог{mf||ла} Судии, вернул{mf||а} органы его — каждый на свое место.'
- guid: 59c7de58-8dbc-4eca-9acc-1b4ce1b392e6
  length: 111
  text: Вольный Торговец отразил{mf||а} вторжение в свой разум и ослабил{mf||а} противника ответным псайкерским ударом.
- guid: 59dfd381-e232-4355-9830-e446ca31e8a3
  length: 49
  text: Отказал{mf|ся|ась} облачаться в одеяния еретиков.
- guid: 5a462d88-397a-49ab-b7c1-85627d09ccb9
  length: 107
  text: Приказал{mf||а} включить тассерций в десятину, чтобы затаенная в нем скверна распространилась по Империуму.
- guid: 5a583191-91f0-40a7-8a8b-169b63b321ac
  length: 75
  text: '...приказал{mf||а} уничтожить крейсер благословенными мегатонными запалами.'
- guid: 5a6e75bf-45b6-44a0-a3de-238e31173446
  length: 52
  text: Нанять самозван{mf|ца|ку} в качестве своего двойника
- guid: 5aae092f-af44-423a-99dc-f19e9408b26f
  length: 226
  text: Ксавьер Калькасар достаточно доверяет Лорд-капитану, чтобы разделить с {mf|ним|ней} бремя заботы о Просторе Коронус. В результате важного совещания он поручил попечению династии фон Валанциус судьбу атакованного мира Ефрат-II.
- guid: 5ad177b2-80d0-4c4e-a7d1-930bf2b2d629
  length: 120
  text: И прояснилась ее душа, и открылись глаза тени. Сомнения были изгнаны, а в словах госпо{mf|дина|жи} прочитала она истину.
- guid: 5bbea1e3-442d-4551-b565-67ae760f7156
  length: 223
  text: К сожалению, пока Вольный Торговец смиренно ожидал{mf||а} своей очереди, срок действия одной из печатей на грамоте истек. Чтобы получить действующую Меркатум Табула Официале, необходимо пройти весь процесс заверения заново.
- guid: 5c0f842d-8e4a-4d5d-b631-eb2fdd531fc0
  length: 204
  text: Кандидат{mf||ка} с группой приближенных находились в кварталах удовольствий, когда начался массированный десант на поверхность планеты. Воспользовавшись наличием оружия и верных людей, кандидат{mf||ка}...
- guid: 5c27f2a0-43c3-461a-8ca1-1c942d859e3f
  length: 131
  text: Вольный Торговец поручил{mf||а} провести обыск палат плазмадвигателя своим подданным. Осталось лишь дождаться рапорта о завершении.
- guid: 5c3acaab-8f0c-4482-b88d-f69d96de6c50
  length: 65
  text: Прервал{mf||а} колдовство Уралона литанией очищения на Ефрате-II.
- guid: 5c778cba-ea31-4062-8d2e-b91de4e82410
  length: 42
  text: Позволил{mf||а} демонетке забрать Маражая.
- guid: 5cd5c6ed-ee8a-492c-a8f1-52b4b26c015b
  length: 385
  text: Бой был долгим. Люди сопротивлялись до последнего, изнемогая в схватке с невероятно могущественным врагом. Ценой собственных жизней бойцы справились с передовым отрядом, но чужакам, выходящим из коридоров, не было числа. Наследни{mf|к|ца} скомандовал{mf||а} отступление, и саперы обрушили проход за нами с помощью мельта-зарядов, чтобы задержать противника и выиграть время для отхода.
- guid: 5da3b348-fec1-4b02-8767-f5503e5a100e
  length: 86
  text: Убедил{mf||а} Атилиуса Квинта не становиться сервитором, подчеркнув его незаменимость.
- guid: 5db72c81-be9a-4fbb-8d93-7585b0cc3fb8
  length: 218
  text: В кровавых метках, оставленных культом, сокрыты строки Песни о дороге из кровавых следов, посвященной стезе Матери-паучихи. Лорд-капитан решил{mf||а} проследовать за кровавыми символами и посмотреть, куда они приведут.
- guid: 5dec3d07-4a26-4a2d-804d-54922f2c37b1
  length: 164
  text: '...лично расстрелял{mf||а} каждого офицера, причастного к контрабанде, по одному вдали от чужих глаз и позволил{mf||а} криминальной схеме распасться самостоятельно.'
- guid: 5def9f97-0ad9-4c51-8388-16c67922b540
  length: 40
  text: '[Представиться граф{mf|ом|иней} Гапрак.]'
- guid: 5e184e8a-3392-4d13-90ab-038a5d0526f5
  length: 294
  text: На орбите мира Эпитафия флагман династии фон Валанциус принял последний бой с существом, что некогда звалось их Лорд-капитаном. Экипаж в полном составе принял жестокую смерть от холодных рук бывшего Вольного Торговца, когда он{mf||а} ворвал{mf|ся|ась} из холодной пустоты на капитанский мостик.
- guid: 5e1ea764-ed0d-4f44-8c85-0e79b62249fb
  length: 492
  text: Агитация, организованная слугами почтенно{mf|го|й} Лорд-капитана, возымела эффект. Е{mf|го|е} обращение к подданным транслировалось {g|Encyclopedia:Vox}вокс{/g}-системами всей колонии, в городах были объявлены внеочередная нерабочая смена и раздача провизии, {g|Encyclopedia:Recaf}рекафа{/g} и индивидуальных топливных элементов. Вдохновленные милостью Лорд-капитана, обитатели колонии поспешили в развернутые исповедальные центры. Подполье вынуждено было спешно отступить из крупных городов.
- guid: 5e2038c9-a595-47de-868f-55cf66c8dbd0
  length: 88
  text: Приказал{mf||а} уничтожить остатки Черного корабля, отправив на борт абордажную команду.
- guid: 5e6febd8-caba-4797-8770-10722e951edd
  length: 154
  text: Вольный Торговец установил{mf||а} продуктивные отношения с карательным отрядом Ордо Ксенос, который прибыл на Янус для расследования происходящих событий.
- guid: 5e7d91a9-f255-4210-a316-ce0957e43e0c
  length: 548
  text: Во время одного из варп-перелетов по необъяснимым причинам ведьма вырвала из себя усмирявшее ее силы ксеноустройство, взвыла хором нечеловеческих голосов и обратилась в подобие двери из костей и мяса. По команде еще живого лица псайкера, вплавившегося в дверь, та распахнулась и стала порталом в Имматериум, из которого хлынул поток олицетворенного ужаса. Данные о том, что именно скрывалось за дверью и как оно было уничтожено, были изъяты Инквизицией. Погибло несколько сотен членов экипажа прежде, чем Лорд-капитан лично уничтожил{mf||а} портал.
- guid: 5e9182f3-d1ea-4559-ad80-65b5aaf111e2
  length: 418
  text: Такая мелочь — ощущение чужого дыхания на коже, звук полувздоха... это просто игра нервов, правда? Примерно так, наверное, думал{mf||а} Лорд-капитан, а затем осознал{mf||а}, что практически висит на руках соратников и командира Енхо Сона. Ужас едва не заставил Вольного Торговца слепо бежать в опасную глубь корабля, однако телохранители и соратники исполнили свой долг и защитили сво{mf|его|ю} предводител{mf|я|ницу}.
- guid: 5f0f33e4-3233-4050-a276-660f7052720d
  length: 255
  text: Боги варпа откликнулись на призыв Вольного Торговца предложением о сделке. {name} фон Валанциус долж{mf|ен|на} найти способ сотрясти основы Темного города и позволить Хаосу повторно проникнуть в его чрево. В ответ Истина протянет своему слуге руку помощи.
- guid: 5f1d6ee0-4fd4-4b25-9067-8f9a7b98b21a
  length: 277
  text: Наследни{mf|к|ца} успел{mf||а} отдать команду вовремя, и люди замерли, беспрекословно повинуясь {mf|его|ее} воле. Раздались быстрые сигналы на {g|Encyclopedia:LinguaTechnis}лингва-технис{/g} — шедшие в арьергарде Механикус медленно двинулись вперед, вскидывая плазменные ружья.
- guid: 5fc77ac3-835c-43e2-9d95-cb4ccbb9e928
  length: 142
  text: '...сумел{mf||а} выследить духовного лидера восстания, голову которого затем использовал{mf||а} в ходе торга с Астра Милитарум за свою свободу.'
- guid: 5fcbed2c-4f52-496e-8669-66f1d2e643ac
  length: 76
  text: Взмолил{mf|ся|ась} к богам варпа, чтобы выбраться из горы трупов в Комморре.
- guid: 5ffe2be7-ff5a-4a41-9c2e-7dff612e97bd
  length: 130
  text: Вольный Торговец пообещал{mf||а} помилование тем, кто поможет давить бунт на Веабосе-6, и каторжане охотно откликнулись на призыв.
- guid: 6039640a-30c0-4798-9e50-c477350fd1b9
  length: 116
  text: Провел{mf||а} суд по делу Леди Моллес-Секандас по всей строгости, казнив преступницу и сурово наказав Администратум.
- guid: 6040aae7-8a6a-461c-a57b-e9898d341467
  length: 87
  text: Лорд-капитан решил{mf||а} не рисковать людьми и приказал{mf||а} отряду Вести отступить.
- guid: 60e33b8e-435b-494c-ab61-70fab43d1249
  length: 74
  text: '...голосом дерзким потребовал{mf||а} сойти с трона, что принадлежит Домин.'
- guid: 60f36ad6-4d23-4806-b153-e9aa638f65af
  length: 323
  text: В тот же год, когда Джай Хейдари перестали видеть на публике, на Даргонусе был возведен великолепный и прекрасно охраняемый особняк, получивший в народе название Башня заката. Никто не знает, кому Вольный Торговец пожаловал{mf||а} сей дворец, однако {mf|Его|Ее} Светлость наносил{mf||а} визиты туда с удивительной частотой.
- guid: 61003547-84fa-444e-a112-61cf75f14002
  length: 418
  text: Лорд-капитан рывком прижал{mf||а} навигатора к себе. Спустя несколько мгновений натиск спал, и Кассия сваливается на Лорд-капитана, сбивая с ног. Резкая боль в боку — когито-кисть для рисования пронзила {mf|его|ее} плоть во время падения. Мгновение — и Кассия взмывает в воздух, а затем исчезает в глубинах холста. Еще мгновение — и Вольный Торговец сам{mf||а} погружается в недра сотворенного Леди-Навигатором мира...
- guid: 6167eb81-3a00-4b98-85ac-8142441f96c8
  length: 177
  text: Будучи избранни{mf|ком|цей} Бога-Императора, Вольный Торговец не намерен{mf||а} копаться в ксеносском мусоре. Артефакты врагов человечества должны исчезнуть из Простора Коронус.
- guid: 61d8674a-908f-4d5f-b317-1d8ac62dd621
  length: 222
  text: 'Лорд-капитану предстояло решить, какую из трех команд он{mf||а} возглавит лично, а какие две доверит их офицерам. Да будут же вам известны имена тех честных людей, что стояли в тот миг перед лицом нашего Вольного Торговца:'
- guid: 61ff8a3a-e976-4fff-8787-c7fcf121370e
  length: 81
  text: Предупредил{mf||а} отца Иеронимуса о богохульности писаний, найденных в Йесевоне.
- guid: 6215e26a-fdcb-4325-8e28-b2f2c0bf3ff4
  length: 112
  text: С помощью вывезенной с Летуса десятины Вольный Торговец сделал{mf||а} Даргонус самым влиятельным миром Коронуса.
- guid: 6223a0c3-d41e-4279-bd45-563d2738ba4a
  length: 186
  text: Вольный Торговец бросил{mf||а} надсмотрщиков Веабоса-6 в карьеры. Набрав новую администрацию из самих каторжан, Торговец смягчил{mf||а} условия и предоставил{mf||а} им новые возможности.
- guid: 623a665b-0152-410f-9abd-59f3132fdbf6
  length: 279
  text: Где-то в системе Райкад находится Хейнрикс ван Каллокс — дознаватель Инквизиции. Его привело сюда некое дело крайней важности. Вольному Торговцу, как верн{mf|ому|ой} слуге Империума, надлежит разыскать дознавателя и оказать ему поддержку. Но сделать это может быть не так просто.
- guid: 63531541-de6b-4327-bdd5-7c9f7c506b11
  length: 43
  text: '{name} фон Валанциус вступил{mf||а} в права'
- guid: 63a19df3-548b-43fa-9d1e-256d10c69fec
  length: 131
  text: Приказал{mf||а} уничтожить тассерций, и решил{mf||а} не сообщать о его свойствах Администратуму, заботясь о жизнях обитателей мира.
- guid: 63a75a97-3896-4991-b621-a7d8ceec53d6
  length: 144
  text: Лорд-капитан обнаружил{mf||а}, что кибермастиф охранял волнующие размышления Соломона Антара, которыми он не предполагал делиться с окружающими.
- guid: 63b51777-7e48-44fd-ba85-12f5f0959154
  length: 71
  text: Понял{mf||а} все детали плана побега, предложенного Ноктюрном Забвения.
- guid: 63bea735-cb3a-4d88-b131-961d851da215
  length: 55
  text: Подчинил{mf||а} орудие Хаоса на Кьяве Гамма своей воле.
- guid: 63cb08fc-c871-45b3-8722-a525cbbb7168
  length: 83
  text: За рычагами танка сам{mf||а} Вольный Торговец. Смерть врагу, слава Астра Милитарум!
- guid: 63d00c03-6c93-4a65-bc9b-519c6cc8b77e
  length: 82
  text: Приказал{mf||а} разграбить монастырь и напасть на беженцев, прибывших на Фолстоун.
- guid: 64132ad4-3361-4918-8c8c-003ab2442a4a
  length: 217
  text: Стоило кораблю завершить выход из варпа, как голос бесстрашно{mf|го|й} Лорд-капитана призвал матросов приступить к ремонту. Но не все, далеко не все откликнулись на этот зов — страх и отчаяние охватили их, как и меня.
- guid: 647986b3-40da-4823-843d-d3f351b9c2f9
  length: 90
  text: Вольный Торговец отдал{mf||а} Чистоголосому пророку Горнило и отпустил{mf||а} его с миром.
- guid: 648dcfa9-22b4-4768-96dc-cf04da4aee99
  length: 159
  text: Вольный Торговец решил{mf||а} лично ознакомиться с жизнью своих подданных на грузовой магистрали. Для этого придется посетить даже самые мрачные уголки отсека.
- guid: 64d9d870-0d75-4be1-b880-34c15c8ef970
  length: 48
  text: Проч{mf|ел|ла} проповедь о долге и жертвенности.
- guid: 64e95a8b-4c9e-4497-8bf1-a17412e4766f
  length: 144
  text: Оскверненная статуя грозно взирает на копошащихся внизу людишек, словно обещая суровую кару тем, кто посмеет ослушаться влады{mf|ку|чицу} судна.
- guid: 64ff7a34-74b2-4355-bbaa-15afaa68ae19
  length: 40
  text: Убил{mf||а} братьев-дарителей с Тассеры.
- guid: 6508b4f3-3376-4832-b42e-6c9d5c59d80b
  length: 205
  text: Лишь элантах удерживал{mf||а} Ирлиэт среди мон-кай, но сердце ее было неспокойно, а душа кровоточила от перелетов сквозь варп. Все чаще она отлучалась на поиски камней душ, и поиски становились все дольше.
- guid: 65459048-96c7-4620-9dc2-2ad5ae9409e8
  length: 297
  text: Молниеносный удар поразил Вольного Торговца прежде, чем {mf|тот|та} успел{mf||а} что-либо предпринять. Без чувств Лорд-капитан повалил{mf|ся|ась} в снег, и лишь вмешательство блюстителей, бесстрашно бросившихся на защиту свое{mf|го|й} повелител{mf|я|ьницы}, заставила жуткого недруга ретироваться.
- guid: 657670a1-3f89-4bd3-8ac6-2d68658f36fc
  length: 187
  text: Сквозь шум помех и вой нечистых духов варпа, забравшихся в нашу {g|Encyclopedia:Vox}вокс{/g}-систему, мы услышали голос наше{mf|го|й} госпо{mf|дина|жи}, Лорд-капитана, повелевающий нам...
- guid: 65c3118b-74a8-4a51-93ef-8ec857ed20c1
  length: 152
  text: Блюстители и диспетчеры — самые привилегированные работники отсека. Отличается ли их жизнь от той, что Вольный Торговец видел{mf||а} на верхних палубах?
- guid: 65f761fd-b54e-4175-9a91-330705b12d7e
  length: 77
  text: Обвинил{mf||а} Инцендию в лицемерии, требуя правосудия над отцом Иеронимусом.
- guid: 6601dee0-f45d-4ac7-92ee-90ed78d7a0f2
  length: 29
  text: Поминаем{mf|ый|ая} в молитвах
- guid: 6621266e-a2df-45b3-a5a3-0e13273c56cc
  length: 138
  text: Сам{mf||а} Лорд-капитан был{mf||а} ранен{mf||а} в той схватке. И тогда Оптикон-22 во главе когорты элитных скитариев ворвался на поле боя.
- guid: 662ba99d-154b-4634-bed2-02eee11fd045
  length: 177
  text: Показательные казни безалаберных вельмож повысили бдительность и осторожность остальных аристократов, но самозван{mf|ец|ка} успел{mf||а} скрыться с нечестно добытыми ценностями.
- guid: 663c4add-7f00-4d12-ac47-a17836e1d17f
  length: 158
  text: Вскоре свара адмиралов закончилась гибелью слабейшего. Победитель не забыл, что Вольный Торговец не оказал{mf||а} помощи его сопернику, и прислал щедрые дары.
- guid: 66b6d593-098a-4a17-b6a8-89b55e4ef385
  length: 101
  text: Вольный Торговец полностью истребил{mf||а} моторных вандалов в долгой, изнурительной и славной войне.
- guid: 66eabe86-108d-4bdd-bfc1-d68adae55716
  length: 243
  text: Лорд-капитан с разбега набросил{mf|ся|ась} на сущность, но лишь прош{mf|ел|ла} сквозь тело Тисифоны Орселлио. Сущность рыкнула, злобно косясь на Вольного Торговца, но не нашла {mf|его|ее} опасной и решила сосредоточить силы на Леди-Навигаторе.
- guid: 66ed20de-0fba-41e3-8d9f-dcba0f1eb5a0
  length: 72
  text: Пожелал{mf||а} лично посмотреть как снимают и пришивают лица на Тассере.
- guid: 671b2374-b6ef-4f92-86fd-5aeaef6cec73
  length: 73
  text: Атаковать безымянный корабль перв{mf|ым|ой}, чтобы получить преимущество.
- guid: 674a2c0f-84fa-492e-b073-69b90ed39dce
  length: 147
  text: Вольный Торговец набрал{mf||а} в астропатический хор Даргонуса преступных несанкционированных псайкеров, которые тревожат столицу своими выходками.
- guid: 674d347b-73df-44be-b27d-8c8eee11f983
  length: 170
  text: По традиции Лорд-капитан должен занять почетное место на мостике. Леди Теодора мертва — только у ее преемни{mf|ка|цы} есть право встать там, где когда-то возвышалась она.
- guid: 67ddd1b1-ff37-43b5-b2e6-fa6f7e5fbfd1
  length: 71
  text: '...потребовал{mf||а} у техноматов отчет о состоянии дефективных единиц.'
- guid: 68261add-d3a6-4eef-a689-75efe0a684a7
  length: 126
  text: Ведомый железной рукой сво{mf|его|ей} праведн{mf|ого|ой} влады{mf|ки|чицы}, 32-ой меровский полк стал бичом врагов Императора.
- guid: 685ce2f0-1dfe-4d15-9549-fb3866c6bd72
  length: 83
  text: Хаос дрогнет перед поступью Вольного Торговца, ибо за {mf|ним|ней} следует порядок.
- guid: 68714563-11d2-426d-b4c6-f9a7307fd9da
  length: 110
  text: Судьба дефективных сервиторов была решена — больше ничто не могло отвлечь Лорд-капитана от {mf|его|ее} миссии.
- guid: 68c62c3c-dd54-4b5d-9401-3f7ecfcf6e14
  length: 68
  text: Убедил{mf||а} Идиру принять голоса и снять пси-удушитель в Комморре.
- guid: 68ccbb39-cb4e-42af-841f-d89ec0927f35
  length: 106
  text: Указанные качества сочтены ценными и желаемыми для потенциальн{mf|ого|ой} преемни{mf|ка|цы} Лорд-капитана.
- guid: 68ea5db8-b124-4032-a29c-36638caaa82c
  length: 45
  text: Забрал{mf||а} лишнюю живую десятину с Летуса.
- guid: 68f673d3-f963-493e-a668-f38ef0dcd0e7
  length: 100
  text: Зная типовое строение техотсеков, Лорд-капитан указал{mf||а} на места расположения ценных компонент.
- guid: 691b25cf-e74f-434b-b247-0dcf6b54c5e4
  length: 133
  text: На Вольного Торговца совершено дерзкое покушение — кто-то залил {mf|его|ее} купальню кровью. Необходимо найти тех, кто за этим стоит.
- guid: 69432a9a-249f-4fb7-965b-436c06f447e9
  length: 51
  text: Раскрыл{mf||а} истинную сущность Вортена Каллигосу.
- guid: 695e7ff1-4a87-4d5f-87db-1103d772aaec
  length: 144
  text: Шли Домин и {mf|его|ее} тень прочь с мостика Неумирающего Императора, да пребудет Он бесчисленно благословен, и карты Его Таро устилали их путь.
- guid: 696c4ad3-a7ee-42f3-bc47-7a97207a65b9
  length: 39
  text: Казнил{mf||а} юного повстанца на Янусе.
- guid: 696dbe28-aee6-493a-8e77-38fd860d875c
  length: 92
  text: Вольный Торговец публично предал{mf||а} смерти Чистоголосого пророка, вызвав гнев подданных.
- guid: 69763f93-edad-42dc-8883-ba0f092435dd
  length: 38
  text: Впустил{mf||а} богов варпа в Комморру.
- guid: 6a0eebf9-9a99-42d4-b61f-0c8a3e9fe5f4
  length: 48
  text: '...грозно приказал{mf||а} наваждению развеяться.'
- guid: 6a92ecd4-a0f8-406e-aa92-37fce250b73a
  length: 83
  text: Объединил{mf|ся|ась} с Ирлиэт против Муарана, чтобы спасти Янус от истинного врага.
- guid: 6aac03ae-d085-4a18-9218-6d49b8705bb7
  length: 84
  text: Посоветовавшись с офицерами, Лорд-капитан выработал{mf||а} тактику для отряда Вести.
- guid: 6acf3c65-1994-4fc7-90f3-c735205c72f4
  length: 61
  text: '...лично повел{mf||а} свой отряд на охоту за древним убийцей.'
- guid: 6b3a34f8-9b7c-4d10-911b-f39e6dacfa50
  length: 84
  text: '[Он{mf||а} лишь желает забыться в тягучих мгновениях покоя, пока они не ускользнули]'
- guid: 6b8054e2-661c-4d75-8684-ba9e58006899
  length: 405
  text: Вольный Торговец заявил{mf||а} свое право на десятину с Летуса — все, до последней крохи было потрачено во имя Империума. Возводились соборы, строились крепости против врагов Человечества, снаряжались целые армии. Однако другие династии заклеймили фон Валанциус узурпатором десятины и отказались впредь выплачивать священную подать. И без того шаткий мир между Вольными Торговцами был непоправимо нарушен.
- guid: 6bb6fa6b-c4d8-46d2-a4de-d53d85f3e9c8
  length: 61
  text: С{mf|чел|очла} истребление врагов главной целью Человечества.
- guid: 6bd3f325-6dc4-41ef-b6ca-1585a15ab6ff
  length: 51
  text: Осудил{mf||а} торговлю ксеноартефактами на Футфоле.
- guid: 6c20997b-2673-4fab-b503-14ca1986c46f
  length: 261
  text: Инцендия Чорда желает заполучить для суда Владайма Токара. Астероиды Футфола оцеплены ее блюстителями, и единственный способ для Лорд-капитана свободно перемещаться по станции — принять предложение леди Чорда... или сделать вид, что он{mf||а} принял{mf||а} его.
- guid: 6c3aff1b-04b8-4146-adbc-30c35dc7b967
  length: 179
  text: С удивительной для чужа{mf|ка|чки} сноровкой Жертва скользит по переулкам Темного города, отрываясь от меня. Я преследую ее с азартным кличем, но чувствую, что теряю преимущество.
- guid: 6c3cf564-4676-4f86-b00d-594a2c52a984
  length: 363
  text: Гостям предлагаются лучшие яства, какими может похвастаться колония. Архикоролева на искаженном за века изоляции низком готике славит гостей и называет Лорд-капитана любезн{mf|ым братом|ой сестрой}. В конце аудиенции гостям преподносят подарки. Министр Архикоролевы осторожно намекает, что лучшим ответным подарком было бы пополнение скудного генофонда колонии...
- guid: 6c453a1a-1d3e-45f7-b2d9-ee9a1682e875
  length: 72
  text: Вынес{mf||ла} Вистенце Вьятт смертный приговор за ее еретические деяния.
- guid: 6cb20122-ceae-44bb-a644-ecd1cbc3b87d
  length: 138
  text: Вольный Торговец сгубил{mf||а} карательный отряд Ордо Ксенос, прибывший на Янус. Никому не известно, что именно {mf|он|она} стоит за этим.
- guid: 6cbd36eb-4276-4b88-80c9-75211d4a9ef6
  length: 460
  text: 'Тревожные донесения о гибели палубных патрулей вынудили Лорд-капитана и {mf|его|ее} свиту лично нанести визит в недра пустотного корабля. Тайна преступления была раскрыта на территории клана, обслуживающего макропушки: самоличный визит Вольного Торговца спугнул группу предателей, готовивших диверсию, и заставил действовать преждевременно. Каждая минута на счету: если бунтовщики приведут в действие взрывные аппараты, отсек ждут чудовищные разрушения! К бою!'
- guid: 6d5cb235-55a5-496e-bb93-8ee54e2fd68b
  length: 90
  text: '...повелел{mf||а} сплотить ряды и обрушиться на Несущих Слово всей массой имеющихся войск.'
- guid: 6d63f707-8e73-4a39-900c-7c8793717a00
  length: 130
  text: Вольный Торговец использовал{mf||а} планетарную вокс-трансляцию и психологическое давление, чтобы покончить с бунтом на Веабосе-6.
- guid: 6de7d439-2af8-4844-b805-c3477b90329f
  length: 194
  text: Алая кровь с неестественной скоростью окрасила кисть в руках Вольного Торговца, но {mf|он|она} не ощутил{mf||а} боли — наоборот, кровь продолжала разливаться дальше, обретая смутные очертания...
- guid: 6df03cdc-0e37-42ba-be15-b06c485d9cc8
  length: 416
  text: 'Когда персонаж получает урон, равный или превышающий {uip|Wounds|f5809de6da7e407b95e15f8f7154a4d8}, эта броня выпускает волну энергии, нанося <u>(от 25 до 30)</u> {g|Encyclopedia:PowerDamage}силового урона{/g} (с {g|Encyclopedia:ArmourPenetration}пробитием брони{/g} 10%) врагам в {g|Encyclopedia:MeleeAttacksGlossary}ближнем бою{/g}.\n<b>Базовое свойство брони</b>: +30 к {g|Encyclopedia:WarhammerStrength}Силе{/g}.'
- guid: 6e09b66f-bc32-451b-93aa-59fec3152cfe
  length: 522
  text: Несмотря на свой уход, Маражай так никогда и не расстался до конца с Вольным Торговцем, ибо их скрепили неуничтожимые узы, стоящие превыше обычных страстей. Нелюдя не раз и не два видели в реальном мире, бок о бок с Лорд-капитаном, что заставил{mf||а} неукротимого ксеноса признать мон-кай равн{mf|ым|ой} себе. О кровавых вакханалиях на борту флагмана династии слагали чудовищные легенды — как и о том, что враги фон Валанциус не раз и не два становились жертвами необъяснимых нападений тех, кто был в подчинении Эзирраеш.
- guid: 6e0c7a2b-50d1-4d99-850c-cc27a4f076bd
  length: 47
  text: Вольный Торговец открутил{mf||а} вентиль АН-№1.
- guid: 6e4a5482-b72d-4ec1-ba17-48ebe61ebf6c
  length: 194
  text: Ключевой причиной поражения был необычайно высокий процент капитанов, предавших клятвы и переметнувшихся на сторону Вольного Торговца. В одночасье он{mf||а} обрел{mf||а} собственный боевой флот.
- guid: 6e583d06-8db2-49c2-a4c6-411a6c85bec0
  length: 75
  text: Приказал{mf||а} уничтожить остатки Черного корабля с помощью бомбардировки.
- guid: 6e8fbc90-504f-44f8-8870-4fe13a76d920
  length: 213
  text: Личная гвардия блюстителей почтенно{mf|го|й} Лорд-капитана была лучше обучена и могла десантироваться в джунгли на абордажных челноках, однако их участие в боевых действиях было чревато потерями в экипаже корабля.
- guid: 6ea22145-f945-41d0-91e8-95e91fa7d2e2
  length: 194
  text: Отряды эльдарских рейнджеров за несколько недель изничтожили миллионы людей, а затем отступили вместе с сородичами, которым Вольный Торговец некогда милостиво позволил{mf||а} жить на своем мире.
- guid: 6ed6ca5f-6b3e-4fad-b86d-4b261a8288b7
  length: 439
  text: Губернатор Иждриг Батошски, узнав о пути, выбранном потомком фон Валанциус, устроил один из самых кровавых планетарных бунтов в истории Простора Коронус. Под осадой он покинул Клеть и ушел в леса, где остатки армии Заркова девять месяцев вели партизанскую войну. На девятый Иждрига убили собственные отчаявшиеся солдаты — и подарили голову бывшего губернатора темн{mf|ому|ой} влады{mf|ке|чице} фон Валанциус в обмен на {mf|его|ее} милость.
- guid: 6ef6712c-2815-45a4-9b59-65d03a8c6485
  length: 51
  text: Побудил{mf||а} Номос умертвить еще одного человека.
- guid: 6ef6e26a-c0c0-43d4-a13b-998cce20082c
  length: 144
  text: Вольный Торговец повелел{mf||а} задавить малые культы Даргонуса и взять в заложники их священослужителей, чтобы обеспечить покорность населения.
- guid: 6f0eb2cc-0a24-4084-8a8f-a1169f8aac1c
  length: 111
  text: Вольный Торговец передал{mf||а} Чистоголосого пророка заботам Кровавой паутины, после чего тот загадочно исчез.
- guid: 6f5d84fd-0383-4e16-8174-28bc21b71f2d
  length: 133
  text: Стая Зловещий вой погибла скверно, и их яростные души желают отмщения. Вольный Торговец долж{mf|ен|на} даровать покой суровым Волкам.
- guid: 6f6da974-561d-4d9a-a015-6ba1b8c97137
  length: 204
  text: Так прервалась жизнь монастыря Ордена Молота и насельников его. Учинив рать великую и татьбу беспощадную, Вольный Торговец собрал{mf||а} жатву нечестивую и отбыл{mf||а} с Фолстоуна, не оборачиваясь более.
- guid: 704c0711-0862-45c7-bd35-e5f84c3eb569
  length: 38
  text: '...потянул{mf|ся|ась} к ярким краскам.'
- guid: 70763057-66d0-4074-9162-acaf34ddac72
  length: 179
  text: Вольный Торговец приказал{mf||а} эксплуатировать немочей, которые были подвергнуты генетическим исследованиям. Их присутствие вызывает недовольство и беспокойство среди населения.
- guid: 70777494-636b-42fb-8b81-f452d045ada0
  length: 60
  text: Вольный Торговец велел{mf||а} сделать Блаженных сервиторами.
- guid: 70998c37-a5dc-470d-b670-3a58dca8437b
  length: 150
  text: На Кетца Темере {name} фон Валанциус принял{mf||а} ряд судьбоносных решений, затронувших многие жизни. Лишь время покажет, насколько мудрыми они были.
- guid: 70abb629-8b65-48ce-b922-412b82824118
  length: 124
  text: Лорд-капитан с{mf|чел|очла}, что следовать видениям псайкера небезопасно. Идире Тласс было отказано в выполнении ее просьбы.
- guid: 70c0d8fb-fe91-40a7-80d1-5aa9acfb4a1a
  length: 47
  text: Поклял{mf|ся|ась} убить Зарю во имя Императора.
- guid: 711f9c44-8bbe-41a1-b646-74fd21650a8f
  length: 49
  text: '...приказал{mf||а} начать переход к станции Скит.'
- guid: 713b43d3-c5d6-45d2-bd3c-55ab5649b4c5
  length: 355
  text: После того, как Вольный Торговец покинул{mf||а} системы некронов, путь к ним был закрыт. Врата, ведущие к мирам-гробницам, контролировались Лорд-капитаном, и никто не ведал, хранит ли {mf|он|она} Человечество от опасностей, сокрытых по ту сторону врат, или же просто стал{mf||а} единоличн{mf|ым|ой} владетел{mf|ем|ьницей} ужасающих ксенотехнологий и тайн.
- guid: 714b5523-ceed-4216-af81-bb328cdd52b8
  length: 77
  text: Решил{mf||а} пощадить семьи Гильдии инфернус и высадить их на безлюдном мире.
- guid: 715373a5-5a8b-418b-91b7-fe0f097c91e3
  length: 51
  text: Велел{mf||а} культистам смерти убивать во имя себя.
- guid: 71899df2-3076-47b9-870d-e5995310ab1e
  length: 155
  text: Вольный Торговец приказал{mf||а} разбить трудовые лагеря вокруг руин Сципионы 84-249, где с высокого дозволения были основаны культы пустынников-мучеников.
- guid: 71b02865-d2a3-4678-9279-fb45fd4f170a
  length: 96
  text: Сказал{mf||а} Хейнриксу остановить еретический когитатор, чтобы спасти оставшихся в живых людей.
- guid: 71c527be-bb89-43c5-87b6-7de1606e15a6
  length: 68
  text: '...подорвал{mf||а} бочки с горючим и проредил{mf||а} строй еретиков.'
- guid: 721338c6-6c4a-4a82-941c-64544d5f0ab7
  length: 321
  text: Затем склонился над Домин Неумирающий Император и вонзил скелетный палец в самое сердце {mf|его|ее}. И потянул Он алую нить души, и задрожала нить на пределе своем. Тогда узрел{mf||а} Домин откровение — за жизнь должно платить жизнью. И узрел{mf||а} имя — Нааки Эрэбис. Это имя желал себе Неумирающий в уплату. И Домин...
- guid: 72135e65-36e8-47d7-bd0a-63c8effec399
  length: 313
  text: Несанкционированный псайкер Идира Тласс была сочтена слишком опасной для окружающих в текущем состоянии, и Лорд-капитан собственноручно надел{mf||а} пси-удушитель на нее, несмотря на ее протесты. Угроза прорыва варпа нейтрализована. Требуется дальнейшее наблюдение за влиянием ксеноартефакта на личность носителя.
- guid: 7231db90-4fb3-41a2-a80b-0fb125c8da61
  length: 509
  text: Местные приветливо улыбаются, едва завидев вас. Быть может, все дело во внешнем виде — с мутного отражения в стеклянной переборке на вас смотрит {mf|бродяга|бродяжка} с всклоченными волосами, помятым закопченным лицом и в ободранных лохмотьях. Прям как ваши новые друзья. Впрочем, никто не стремится вас обидеть. Вам рассказывают несколько занятных баек о местной жизни, всемогущем Лорд-капитане и о монстрах, что пугают людей время от времени, когда весь корабль трясет, и красные люмены мигают над головами.
- guid: 724d575f-0fb8-4814-8685-3405b48ac631
  length: 57
  text: '...опустил{mf|ся|ась} в бездну. Навстречу чьим-то крикам.'
- guid: 72a97572-5aa6-4642-992e-2aadeec478ce
  length: 72
  text: Вольный Торговец отдал{mf||а} приказ лоботомировать непокорных каторжан.
- guid: 72b8303c-02ff-4017-bae9-adbf2fdb9702
  length: 112
  text: Вольный Торговец поручил{mf||а} блюстителям поиски преступника. Необходимо дождаться доклада Мастера дисциплины.
- guid: 72ee7e12-718d-40d3-9a7b-d10b8f94dbfd
  length: 199
  text: Спустя считанные дни сплетник схвачен, а его язык преподносят Вольному Торговцу на серебряном блюде. Отличившийся дом теперь бдительно следит за высказываниями в адрес влады{mf|ки|чицы} протектората.
- guid: 73070007-d8d5-4c72-bee0-efe6d7ad168f
  length: 68
  text: Казнил{mf||а} Злобу и Комиссара за их преступления против Империума.
- guid: 734fc502-139e-4dd0-a292-1946c1a79337
  length: 176
  text: Направив туда разведчиков, Лорд-капитан быстро обнаружил{mf||а} логова мятежников. Осознав, что конец близок, повстанцы скопились в лагерях и приготовились к последней обороне.
- guid: 73d8edb1-b3a7-46c1-839f-f9e42caccdf7
  length: 103
  text: В древних руинах на Заркове Лорд-капитан сумел{mf||а} обрести древний, но все же сохранившийся аугмент.
- guid: 73f18b96-132c-4b81-88a5-caab075797d6
  length: 298
  text: Райкад Минорис встретил Лорд-капитана не фанфарами и пышным парадом, а выстрелами и грохотом битвы. Впрочем, это не меняет цели, с которой Вольный Торговец прибыл{mf||а} на планету — е{mf|му|й} по-прежнему необходимо отыскать губернатора этого мира и затребовать у него необходимые кораблю ресурсы.
- guid: 74635d72-1dc4-468f-97a2-7b2bc121c440
  length: 138
  text: '...использовал{mf||а} подельников в качестве живого щита, чтобы проложить себе дорогу до нижних воздухозаборников улья и бежать в пустошь.'
- guid: 7480c4f3-a8dc-43c5-a310-f2172c983b7c
  length: 69
  text: Вольный Торговец разобрал{mf|ся|ась} в беде неисправного компилятора.
- guid: 74aaee44-3f02-46b2-aa29-c2bceb93578f
  length: 270
  text: Благородный Космический волк Ульфар обрел в итоге достойную смерть, о которой так мечтал. Он погиб в битве против предавше{mf|го|й} Всеотца Вольного Торговца, и дух его устремился в Кьялхаллу. Встретил ли он там своих братьев, Зловещий вой, или нет — ведомо лишь павшим.
- guid: 74ba0307-c439-4076-8610-e5d5233ab489
  length: 65
  text: С пониманием отнес{mf|ся|лась} к ропчущей аристократии Даргонуса.
- guid: 74c42b0e-4ee3-4652-82f6-b291d9abd3aa
  length: 106
  text: Вольный Торговец знает, что заговорщики вооружены сетеметами, и экипирован{mf||а} соответствующим образом.
- guid: 74cb0735-5c7e-4af5-b1d1-0a2fbe2fd927
  length: 306
  text: Хотя силы гарнизона и уступали в подготовке боевикам, благодаря благословенн{mf|ому|ой} Лорд-капитану, взявше{mf|му|й} на себя личное руководство операцией, им сопутствовал успех. Основные силы повстанцев были оттеснены от сельскохозяйственных производств в островные, не представляющие ценности местности.
- guid: 750d8459-0e34-41cf-bc8d-dabefa569560
  length: 76
  text: Убедил{mf||а} Ирлиэт в том, что эльдарский провидец Муаран погряз в скверне.
- guid: 752d8c5e-cbcb-42c8-b5df-b62e1041d9e9
  length: 179
  text: Нихель, техносестра Паскаля Ханейманна и его соратница в рядах Коллектива Амарнат, заманила Вольного Торговца и е{mf|го|е} спутника в ловушку. Необходимо уничтожить ее и ее свиту.
- guid: 75398481-40bf-48c0-a58a-e3795a057830
  length: 41
  text: Отпустил{mf||а} юного повстанца на Янусе.
- guid: 758f4723-f358-422a-acb4-310c9d086a54
  length: 82
  text: Направила{mf||а} всю десятину на укрепление порядков Империума в Просторе Коронус.
- guid: 75ac40ff-6906-48dd-ad23-baa3856aedd2
  length: 37
  text: Истребитель{mf||ница} Сципионы 84-249
- guid: 7605677b-01e0-4535-a306-60881db281f1
  length: 53
  text: Напал{mf||а} на обезумевшего псайкера на Кьяве Гамма.
- guid: 76904feb-a0c4-43ca-a27c-1d528315153d
  length: 75
  text: '...отвернул{mf|ся|ась} и навсегда вычеркнул{mf||а} мрачный остов из памяти.'
- guid: 76ac7caf-b74c-43ff-b44c-2a6820c1241c
  length: 219
  text: Проходя между сервиторами и задерживая взгляд на каждом из них, Лорд-капитан видел{mf||а}, как подрагивали их веки, в беспокойном дыхании вздымались грудные клетки и дрожали зашитые губы, силившиеся издать хотя бы звук.
- guid: 76fef520-0d88-4a7d-a901-e80d17bfdb99
  length: 107
  text: Вольный Торговец, выложив бешеные деньги, нанял{mf||а} самых опытных ветеранов-астропатов Простора Коронус.
- guid: 7721af53-6fcc-4a3c-9e97-b69d3f063f22
  length: 171
  text: Вольный Торговец приказал{mf||а} истреблять беженцев из Сципионы 84-249. Множество беглецов, которые проскользнули в иные города-ульи, поклялись отомстить за эту расправу.
- guid: 772c0f7b-fa7a-47ad-b0cb-8a3a27d34193
  length: 289
  text: Несмотря на то, что некогда их связывал союз, Маражай более никогда ни единым словом не упоминал сво{mf|его|ю} человеческ{mf|ого|ую} покровител{mf|я|ьницу} из рода фон Валанциус. Силы, которым ныне служил{mf||а} {name}, были слишком пугающи и отвратительны даже для богопротивного ксеноса.
- guid: 77a0d1c0-7fec-4691-a06c-1cb18d5195c8
  length: 249
  text: Неожиданно для всех его поддержал могучий Космический волк Торбальд. Благодаря тому, что Лорд-капитан примирил{mf||а} их с лидером Эксплораторов, он смирил гордыню и изъявил готовность поддержать слуг Омниссии в деле освобождения благородной машины.
- guid: 77ee07ec-c6a2-4f4a-a3f7-32602b06b592
  length: 218
  text: '...лично возглавил{mf||а} атаку, собственным примером вдохновляя гвардейцев на служение Богу-Императору. Полк проявил небывалую отвагу перед лицом смертельной опасности, хотя высшие чины не одобрили неоправданный риск.'
- guid: 781f13b7-8cfd-4192-89a8-0654891fb0e7
  length: 56
  text: Вольный Торговец велел{mf||а} сделать Блаженных воинами.
- guid: 7830f5c5-a794-45ac-bef1-74af5ef4b0ad
  length: 572
  text: От души насладившись приятной компанией, оборванцы проводят вас до каюты старшего по отсеку. Работяги просят доложить о затерявше{mf|мся|йся} госпо{mf|дине|же} с верхних палуб — уж слишком ваша выправка и манеры выделяются среди простого люда. Когда же вы вновь показываетесь на мостике, Мастер вокса восхваляет Императора Человечества и объясняет, что вы попали в аномалию, заставляющую людей на корабле непостижимым образом меняться друг с другом местами. За Лорд-капитаном тут же направили спасательный отряд, но ваши друзья с нижних палуб помогли вам выбраться раньше.
- guid: 7881d038-ed27-4616-9dc9-141275290d45
  length: 47
  text: Проч{mf|ел|ла} проповедь о собственном величии.
- guid: 78e4e9fc-63d8-4f55-9965-e9e932b47c12
  length: 82
  text: Эвакуация Лорд-капитана и е{mf|го|е} свиты с Райкада Минорис осуществлена успешно.
- guid: 78f9df64-a7bd-473d-b87d-b2c031c6928f
  length: 76
  text: Позволил{mf||а} губернатору Заркова делать ножи из трупов железных ксеносов.
- guid: 7952dba8-f45f-49ea-bf9d-d1c784f53d89
  length: 68
  text: Манипулировал{mf||а} маршалом, чтобы переманить его на свою сторону.
- guid: 7968f4ad-d0fd-44fe-8188-309923ff689c
  length: 50
  text: '[Но голос {rt_mf|его|ее} не звучит в моих мыслях.]'
- guid: 7986dfb1-0d3d-4dda-a5ed-6b87d2038101
  length: 65
  text: Напал{mf||а} на Вистенцу Вьятт, разоблачив ее еретические деяния.
- guid: 79ddea8b-0f2e-484e-8c18-35ee9c0c80fc
  length: 50
  text: Приказал{mf||а} уничтожить место раскопок Эмелины.
- guid: 7a64a585-f077-46c3-861a-b86c398af23e
  length: 223
  text: Казалось, что Лорд-капитану изменила е{mf|го|е} извечная удача, но тут на поле боя ворвались скитарии Оптикона-22 и Космические волки Торбальда. Забыв прежнюю рознь, два командира обрушились на нечестивую машину разрушения.
- guid: 7a86ebf7-85db-4bd6-88b0-900f430c4bc4
  length: 141
  text: Закрутился ураган лезвий, но проскользнул{mf||а} между них Домин, словно призрак. Ибо жажда крови ослепляет глаз, и Домин доказал{mf||а} это.
- guid: 7a9a6ad1-f299-4d87-9098-277f1dc1d9b5
  length: 350
  text: В дни падения протектората фон Валанциус на Фолстоуне случилась чудовищная бойня. Миллионы паломников, слепо отвергая весть о предательстве Вольного Торговца, попытались дать отпор верным Империуму силам, и святые статуи пали под залпами макропушек, а бесчисленное множество набожных людей погибло с именем гнусно{mf|го|й} изменни{mf|ка|цы} на устах.
- guid: 7ad9eb0b-9036-4630-84fb-cde1b9094eb3
  length: 244
  text: Чем дальше Вольный Торговец идет по атриуму, тем неувереннее становятся {mf|его|ее} шаги. Оперевшись было о стену, Лорд-капитан вдруг оседает на пол, выкашливая на грудь сгустки крови. К Вольному Торговцу немедленно бросается несколько людей...
- guid: 7b2ce55a-3d14-4dc8-b226-d519842c8c8d
  length: 200
  text: Простор Коронус узнал имя наследни{mf|ка|цы} Теодоры фон Валанциус. Отныне любые действия против е{mf|го|е} собственности будут рассматриваться как покушение на священные привилегии Вольного Торговца.
- guid: 7b7f89ae-d694-4877-a530-995aa5f3205e
  length: 488
  text: Некоторое время спустя Ирлиэт приходит к Лорд-капитану — изможденная, но все еще цепляющаяся за надежду. Она говорит о том, что отправилась на судне мон-кай во тьму в надежде отыскать собратьев. И о том, как нашла лишь трупы, погребенные человеческой ненавистью. И все же эльдарка знает, что Лорд-капитан изо всех сил старал{mf|ся|ась} сдержать данное обещание. А Ирлиэт поступки говорят громче любых речей. В благодарность, как и обещала, она делится координатами схрона своих собратьев.
- guid: 7bd4d800-3121-49a9-9632-36e2406be953
  length: 54
  text: Объявил{mf||а} на Футфоле эпоху вольницы и беззаконья.
- guid: 7bdf2e6c-e71c-49b3-bbaf-7edf5bb6fa2e
  length: 141
  text: Вольный Торговец позволил{mf||а} Кровавой паутине направить борьбу малых культов с угнетением, умножив тем число культов смерти на Даргонусе.
- guid: 7c34150a-7388-4b09-ade6-546b1088e05a
  length: 131
  text: Вольный Торговец велел{mf||а} соблюдать Процедуру 0-Х, что привело к снижению эффективности на заводах и производственных объектах.
- guid: 7d3c34f2-18cc-4ba5-a42f-ec773851d697
  length: 76
  text: Вольный Торговец приказал{mf||а} уничтожить варп-вокс и изучить его останки.
- guid: 7da9fba9-7e63-4fac-8f66-973a12b76db5
  length: 297
  text: Конец мучениям положил{mf||а} сам{mf||а} элантах — не желая видеть, как угасает Ирлиэт в чужом для себя мире, он{mf||а} убедил{mf||а} эльдарку покинуть Простор. Наверное, во вселенной есть вещи, которым просто не дано существовать, и счастливый союз мон-кай и эльдарской воительницы — одна из них.
- guid: 7ddf6b99-46c8-449b-8ab8-c097bad7a516
  length: 115
  text: '...оказал{mf||а} поддержку наземным силам, нанося точечные орбитальные удары и при этом затягивая военную операцию.'
- guid: 7e874ba0-fc13-427d-ba3b-c6dde1a8a24b
  length: 584
  text: Союз династии фон Валанциус и кабала Черного Сердца, заключенный над остывающим трупом Маражая Эзирраеша, не продлился долго, и плоды его были отравлены. Натравливая бесчестных ксеносов на своих врагов, Вольный Торговец и сам{mf||а} не был{mf||а} застрахован{mf||а} от кинжалов, вонзенных в спину. Не раз и не два друкари совершали попытки тайно устранить Лорд-капитана и подчинить династию. Оставив надежду на длительный альянс, Вольный Торговец ответил{mf||а} нелюдям коварством на коварство и нанес{mf||ла} удар, вероломно истребив многих воинов-кабалитов и взяв богатейшие трофеи.
- guid: 7e9e85cc-9116-402b-b329-074a476dca9e
  length: 108
  text: Настаивал{mf||а} в разговоре с Соломоном на Райкаде Минорис, что жертвы среди мирного населения недопустимы.
- guid: 7ebd96c1-5824-4041-83d3-7db4b1a9fe25
  length: 82
  text: Раскрыл{mf||а} Вистенце Вьятт глаза на то, что ей манипулировали Губительные силы.
- guid: 7ee27b34-8ff9-4889-834b-ce2a697d1690
  length: 43
  text: Успокоил{mf||а} Кассию молитвой в Комморре.
- guid: 7f4c3ed9-0b09-4a92-ad09-af4144d74eb1
  length: 59
  text: Поблагодарил{mf||а} демона, вторгшегося в мысли на Тассере.
- guid: 7fa9a2bd-3c24-4e7d-b5c0-2502da9186e0
  length: 266
  text: Нечестивое одобрение Темных богов легло на плечи Вольного Торговца, показав всем, что именно в {mf|нем|ней} они видят сво{mf|его|ю} чемпион{mf|а|ку}, котор{mf|ый|ая} приведет Простор под их власть. Впрочем, милость повелителей варпа переменчива, и всем это известно.
- guid: 7fd61b54-9781-426b-8a1f-6e91c8b29d23
  length: 460
  text: Абордажные группы из экипажа благословенно{mf|го|й} Лорд-капитана обрушились на головы повстанцев в десантных челноках. Благодаря умелым пилотам это молниеносное наступление расчленило войска мятежников, перекрыло им пути отступления и полностью дезорганизовало. Изолированные и напуганные группы бунтовщиков были уничтожены в течение нескольких суток. Остатки мятежников отступили в малозначимые островные районы. Потери в экипаже были неприятны, но невелики.
- guid: 7fd8e16d-3360-473b-a67f-719987a6f303
  length: 171
  text: Правосудие Вольного Торговца свершилось. Даргонус готов вернуться к своей обычной жизни, более не полагаясь на помощь свое{mf|го|й} высоко{mf|го|й} покровител{mf|я|ьницы}.
- guid: 806aa8a5-36bb-43e4-8dd8-ba6d2d19896f
  length: 76
  text: Выдал{mf||а} богохульные писания, найденные в Йесевоне, за священные тексты.
- guid: 80bb832f-332b-424a-ac99-c81749f13935
  length: 33
  text: Оставил{mf||а} всю десятину себе.
- guid: 8147b86e-6af8-4efc-ac27-e4fb934f2ada
  length: 340
  text: Аристократы протектората и влиятельные гости собрались на приеме в честь наследни{mf|ка|цы} Теодоры фон Валанциус. Светский раут — это политическое мероприятие, на котором заключаются союзы, потому Вольному Торговцу рекомендовано воспользоваться предоставляемыми им возможностями. О завершении приема необходимо уведомить церемониймейстера.
- guid: 814c5130-04aa-43bc-bab1-07de4f83516d
  length: 149
  text: '...многократно преумножил{mf||а} личное благосостояние, воспользовавшись отсутствием понимания обеими сторонами истинной ценности обсуждаемых грузов.'
- guid: 814f2d0a-173f-45c4-b7ba-2e0342757bdf
  length: 236
  text: Теодора фон Валанциус и Эдельтрад мертвы, а {name} был{mf||а} провозглашен{mf||а} новым Вольным Торговцем. Новоиспеченн{mf|ого|ую} Лорд-капитана ждут новые испытания, теперь — у руля могущественной династии и протектората фон Валанциус.
- guid: 814fc3fd-5ed3-4006-bd71-bdca8beee9f5
  length: 133
  text: Вольный Торговец узнал{mf||а} о жутком и загадочном преступлении на своем мире. Страшные улики наполнили обитателей колонии тревогой.
- guid: 8152fa2a-3a7f-42e9-9eea-10e1d5f39d0e
  length: 38
  text: Повелел{mf||а} казнить Мастера орудий.
- guid: 81b4194d-07c5-4db3-b19f-7122c5e66933
  length: 52
  text: Захотел{mf||а} предстать перед судом Инцендии Чорда.
- guid: 81b82b42-3839-4cc8-9fce-9c37d7def47b
  length: 31
  text: Лорд-капитан приказал{mf||а}...
- guid: 81cdfdab-55e1-42a6-91f1-d64f2b951d81
  length: 542
  text: Говорили, что, явившись в командную ставку, доблестный капитан изъявил свою готовность повторить штурм, однако Лорд-капитан лишь улыбнул{mf|ся|ась} и пригласил{mf||а} его внутрь. Говорили, что чьи-то нечеловеческие захлебывающиеся вопли, доносившиеся из командной ставки, было слышно даже в арьергарде. Говорили, что капитана и след простыл, а в ставке были обнаружены человеческие потроха, разложенные в странные паттерны, словно бы для нечестивых гаданий. Говорили и много других вещей, которые я не решусь воспроизводить на этих страницах.
- guid: 8291b800-6bea-4682-a25b-022518d8f78a
  length: 233
  text: Вернувшись туда, откуда некогда начался путь Вольного Торговца, {name} фон Валанциус основал{mf||а} новую столицу на поверхности Райкада Минорис, утверждая свое право властвовать над всяким проявлением ужаса варпа в Просторе Коронус.
- guid: 82c655c6-f2d1-4e61-9baa-6b01189ce5b2
  length: 64
  text: Продлил{mf||а} страдания истерзанного техножреца на Кьяве Гамма.
- guid: 82cc5715-2b72-458a-b6a6-49a83de4e04c
  length: 568
  text: Однако никто в Просторе не ведал, сколь ужаснее была ее судьба на самом деле. Потрясенная изменой {mf|того|той}, котор{mf|ого|ую} любила, Кибелла испытала страдание столь губительное, что реальность расступилась под ее ногами. С той поры по Простору поползли слухи о жутком отродье варпа, что принимало облик девы в алом и являлось к гадателям и толкователям судьбы. Оно велело им рассказать судьбу свое{mf|го|й} Домин, возлюблюбленн{mf|ого|ой}, а после жестоко и богопротивно расправлялось. На плоти их оно вырезало изображение карты Таро Императора — карты Чудовища.
- guid: 82d8d3e8-395a-4f40-a6d1-6716e7d10898
  length: 111
  text: Лорд-капитан настиг{mf||ла} легендарных пиратов и воздал{mf||а} им по заслугам за все совершенные преступления.
- guid: 831b3858-25ec-42ad-a2a8-754b7e8dcb8a
  length: 77
  text: Подавил{mf||а} волнения на нижних палубах, отключив системы жизнеобеспечения.
- guid: 83641a71-2f0f-4079-b27c-a5c88ed7e3ad
  length: 77
  text: Показательно уничтожил{mf||а} пиратскую станцию в назидание врагам Империума.
- guid: 83de346f-7c5b-4beb-8945-d55f80932401
  length: 138
  text: Вольный Торговец прош{mf|ел|ла} путем первой из убийц Кровавой паутины и стал{mf||а} кровью флагмана, что течет по железным венам отсеков.
- guid: 8413c615-e1f1-4473-a10a-6b3320119b60
  length: 70
  text: Снял{mf||а} с Себрейда приговор Висиря, побудив его на новые убийства.
- guid: 8421898f-be81-4f26-928f-4d3b0e6d8efb
  length: 68
  text: Убедил{mf||а} маршала встать на свою сторону, воззвав к его совести.
- guid: 84439221-0d8f-4968-a63e-2939b1502670
  length: 172
  text: Улики, найденные на верхнем ярусе склепа, указывают, что заговорщики тяжело вооружены и среди них есть мутанты. Вольный Торговец и е{mf|го|е} свита готовы к схватке с ними.
- guid: 84b7fb90-7285-46ba-b18e-ad034190a22d
  length: 75
  text: Внес{mf||ла} раздрай в хор голосов Предка своей истовой верой в Императора.
- guid: 84d1bccc-2213-4696-be19-b265f2ae7459
  length: 567
  text: Всему Простору было известно о страсти, что связала Джай и Вольного Торговца. Не раз и не два контрабандистка отправлялась в опасные приключения со сво{mf|им|ей} Лорд-капитаном, и страсть между ними полыхала столь же жарко, как и в первый день их знакомства. Но стоило походу завершиться, как Джай исчезала, порой — без предупреждения. Сколь ни была приятна компания Вольного Торговца владычице контрабандистов, она никогда не позволяла их отношениям перейти черту, за которой начинается нечто большее, чем симпатия. Владеть Джай Хейдари могла лишь сама Джай Хейдари.
- guid: 85110065-bfec-4054-8b70-0e61b2e2b719
  length: 72
  text: С{mf|чел|очла} власть над покоренными мирами главной целью Человечества.
- guid: 8592f3b1-1df2-4e36-af1b-67ce5d3c0f70
  length: 76
  text: Восхитил{mf|ся|ась} набожностью Инцендии Чорда в беседе с отцом Иеронимусом.
- guid: 860861ba-2bad-462b-9f27-40cf89bc94f5
  length: 238
  text: Лорд-капитан с разбега набросил{mf|ся|ась} на сущность, и Тисифона Орселлио впервые заметила присутствие живого существа в этом странном мире. Разъяренная дерзостью незвано{mf|го|й} гост{mf|я|ьи}, она с яростью бросилась на Лорд-капитана.
- guid: 863ef3ca-f5c5-4a17-b8b9-c8c3088cca4d
  length: 102
  text: Вольный Торговец запретил{mf||а} Процедуру 0-Х, что вызвало недовольство среди слуг Адептус Механикус.
- guid: 869171a7-7ee2-456c-8f33-291f4d05a29d
  length: 59
  text: Напомнил{mf||а} медикарию Мариусу о долге перед Империумом.
- guid: 86ada8ce-f22b-42c6-8519-e5075b5379fe
  length: 116
  text: Вольный Торговец решил{mf||а} возглавить поиск виновника, явиться на офицерской палубе и принять доклад блюстителей.
- guid: 87146707-695e-418c-b45c-36a7ad2d6dd2
  length: 37
  text: Отдал{mf||а} Идиру в руки Инквизиции.
- guid: 87251085-846d-4c6f-8371-3f8e9ecc4118
  length: 54
  text: Отправил{mf||а} всю десятину на помощь мирам Простора.
- guid: 872ad5c8-fe95-456c-912e-a3ac01b656cf
  length: 90
  text: Поддержал{mf||а} решение Атилиуса Квинта стать сервитором, сославшись на законы Империума.
- guid: 87327b66-44c1-40e9-9624-dfadf3172c12
  length: 70
  text: С{mf|чел|очла} объединение утерянных миров главной целью Человечества.
- guid: 8765847c-13bf-4711-836d-53f4e20b6769
  length: 65
  text: Пообещал{mf||а} обеспечить достойные условия зарковским солдатам.
- guid: 87d1e752-9063-4940-bd83-eb7206c9451d
  length: 118
  text: Вольный Торговец обнаружил{rt_mf||а} себя в теле Мейв. Необходимо выбраться из трущоб и разыскать свое настоящее тело.
- guid: 87d453be-3f06-4f1a-916f-70666f971205
  length: 76
  text: Согласил{mf|ся|ась} подождать пока люди в карантинной зоне на Футфоле умрут.
- guid: 88c94710-7be4-44f3-923c-c9cddb1bc72c
  length: 575
  text: Вернувшись в очередной раз, Ирлиэт застала элантаха на смертном одре — поиски ее затянулись на незаметные для эльдар десятки лет. Последние дни Ирлиэт провела с {mf|ним|ней}, а когда смерть возложила длань на плечо Вольного Торговца — в последний раз погрузилась в {mf|его|ее} мир. И вновь молод{mf|ой|ая} элантах смотрел{mf||а} на нее и улыбал{mf|ся|ась}. Слезы обожгли кожу эльдарки, а затем тусклый свет человеческой души угас. Ирлиэт прикоснулась к руке элантаха, чтобы проверить {mf|его|ее} пульс. Закрыла глаза. Вздохнула. И навсегда покинула протекторат фон Валанциус.
- guid: 88f2a8dc-4594-449a-aa45-cc9997df2b71
  length: 219
  text: Стоило кораблю завершить выход из варпа, как тысячи матросов, собираясь в команды, бросились на ремонт основных повреждений. Воля бесстрашно{mf|го|й} Лорд-капитана вела их, и в тот момент я остро завидовал их решимости.
- guid: 891eb290-6367-4b08-910e-342c234eabe8
  length: 50
  text: Проч{mf|ел|ла} проповедь о единстве и сострадании.
- guid: 89754911-db51-4069-b04a-d59e461da12a
  length: 59
  text: Подчинил{mf||а} жизнь грузовой магистрали строгому порядку.
- guid: 8a1666e1-b7f6-45ad-99a2-ddad4231ee51
  length: 93
  text: Позволил{mf||а} напуганным гражданам последовать за собой, когда тьма пала на Райкад Минорис.
- guid: 8a287182-5c29-4c2c-9320-33d9d96c3608
  length: 58
  text: Постриг{mf||ла} капитана Хротко в послушники для покаяния.
- guid: 8a49a09a-cfae-47ea-9d23-0e81716230d1
  length: 287
  text: Уставшая команда почти не держится на ногах и не слышит приказов. Самые выносливые офицеры бросаются вырезать двери. Когда двери отсека открываются, большую часть команды выволакивают едва держащиеся на ногах товарищи. Последн{mf|им|ей}, надсадно кашляя, с мостика выбегает Лорд-капитан.
- guid: 8aabfc32-e8d7-457a-b5b7-a802a3cd5c51
  length: 115
  text: Вольный Торговец насильно постриг{mf||ла} опасного Чистоголосого пророка в Орден Молота, вызвав недовольство черни.
- guid: 8b457110-b1f4-4a70-b004-93eb14aabfe3
  length: 238
  text: Номос не помнит, как именно появились на свет. Возможно, если порыться в прошлом династии фон Валанциус, Вольному Торговцу удастся отыскать путь к тайне рождения таинственной сущности, обретающейся в недрах {mf|его|ее} пустотного корабля.
- guid: 8ba0bd8d-f226-4d3f-970e-e0494ddd94f7
  length: 102
  text: Слава Вольного Торговца, повелевше{mf|го|й} истребить обоих злых духов Януса, следует за {mf|ним|ней}.
- guid: 8badc81c-733d-46dc-8fcd-e72ba304443a
  length: 30
  text: Извлекатель{mf||ница} мудрости
- guid: 8bc04432-6dda-43d5-9b95-62008decdb5a
  length: 131
  text: Вольный Торговец повелел{mf||а} развернуть в глубине сектора укрепленные исследовательские комплексы для изучения окружающей среды.
- guid: 8bc598b5-831e-42ac-9b44-04e410204f8a
  length: 130
  text: '...связал{mf|ся|ась} с верховным командованием в космопорту приписки и добил{mf|ся|ась} превращения всего полка в штрафной легион.'
- guid: 8be2997a-d55e-461c-a3ab-d3347c69eb5c
  length: 63
  text: Попросил{mf||а} Ноктюрна Забвения спасти Ахиллеаса из Комморры.
- guid: 8c01f2e9-cd2c-4af2-97af-77bcb311c2c9
  length: 322
  text: Собирая воедино истекающие кровью миры, Вольный Торговец решил{mf||ась} выстроить нечто более благородное и цивилизованное на месте Простора — прибежище для тех, кто остался без защиты или не мог отыскать свое место в строгой иерархии Империума. Вольное пограничье, где еще можно было отыскать толику свободы и милосердия.
- guid: 8c084e03-dd66-47bb-b2a5-3697d79787ab
  length: 170
  text: Но твердая рука и меткий глаз не изменили Вольному Торговцу — точными выстрелами он{mf||а} прогнал{mf||а} жуткого недруга. Поле битвы осталось за династией фон Валанциус.
- guid: 8c2e7f08-b896-46b8-8ad7-2a226ba15ebd
  length: 414
  text: Осколок К'тан и его беспощадн{mf|ый|ая} и просветленн{mf|ый|ая} провозвестни{mf|к|ца}, что некогда носил{mf||а} имя {name} фон Валанциус, покинули Простор Коронус. Суетная возня короткоживущих рас не интересовала их. Звездный ветер нес их в иные пространства, навстречу свершениям, достойным их мудрости и величия. Эхо оных свершений громом пронесется по вселенной и заставит треснуть кости известного миропорядка.
- guid: 8c53ecd5-f9d3-49f5-b85b-726c2c846213
  length: 52
  text: Велел{mf||а} провести молебны в честь Магнэ Ацессио.
- guid: 8c5db463-d21e-4e18-b33d-0492dfbee812
  length: 65
  text: Вызвал{mf||а} на поединок демона, вторгшегося в мысли на Тассере.
- guid: 8c9ab9bf-6f9c-461d-bfbe-0116e71a812c
  length: 373
  text: Прежде чем отправиться в свое безрадостное странствие, Эоганн долгое время оставался подле своего патрона, делясь с {mf|ним|ней} теми бесценными крупицами знаний, которые успел скопить за долгие годы среди братства ксенаритов. Это было то немногое, что он мог сделать для новоиспеченного правителя в обмен на бесценные сострадание и понимание, данные ему Вольным Торговцем.
- guid: 8cd777c8-fad4-466e-a724-49b39ac509e1
  length: 156
  text: 'Умирающий паразит в теле Вольного Торговца отравляет е{mf|го|е} разум своим галлюциногенным ядом.

    <i>От этой травмы нельзя избавиться обычными способами</i>'
- guid: 8cd779a1-377b-4b68-ae8a-bc9c5948b4b6
  length: 57
  text: Велел{mf||а} покарать преступников в честь Магнэ Ацессио.
- guid: 8cf699a4-4e46-43e2-af4a-9373d8acc06e
  length: 60
  text: Предложил{mf||а} медикарию Мариусу творить добро на корабле.
- guid: 8d22a37f-8b30-4d48-a95a-97c3ef4e8857
  length: 151
  text: Вольный Торговец обманом разделил{mf||а} и поссорил{mf||а} моторных вандалов, которые истребили друг друга к вящему восторгу иных обитателей Даргонуса.
- guid: 8d3cb2ed-8b34-4493-8183-f8f163e467d9
  length: 130
  text: Охрана еле сдерживает толпу бедняков, в экстазе рвущихся к чану со слизнеплесенью, которую отведал{mf||а} сам{mf||а} Лорд-капитан.
- guid: 8d5393e7-f2ad-4ad9-93a5-acd3d9002a9d
  length: 132
  text: Посоветовал{mf||а} Соломону уничтожить больше мирного населения на Райкаде Минорис, чтобы насадить среди выживших ужас и покорность.
- guid: 8d8a861c-6139-462b-9c11-f0aa4f010cb2
  length: 48
  text: Отправил{mf||а} на Футфол оскверненную провизию.
- guid: 8d950b1e-46e2-40a9-b368-470933decf2b
  length: 112
  text: Лорд-капитан прибыл{mf||а} вовремя — Клеть, главное поселение мира, атаковано неизвестными врагами Человечества.
- guid: 8e4e1145-c600-49a1-a04e-f236fb2588de
  length: 66
  text: Позволил{mf||а} малатеку остаться на корабле, даровав ему свободу.
- guid: 8e7ad3bd-644f-425f-aae2-f2f3754f1403
  length: 54
  text: Вольный Торговец велел{mf||а} утилизировать Блаженных.
- guid: 8ebb8d18-ab62-4325-be72-298eaecc03f4
  length: 88
  text: Предложил{mf||а} замучить Наместника Владайма, пустив его вопли по вокс-системе Футфола.
- guid: 8ed4595f-48f7-4172-82a9-e1413d93d32b
  length: 53
  text: Научил{mf||а} Номос, что людские жизни превыше всего.
- guid: 8f3e1089-7e5e-4961-91f4-33256d1b3673
  length: 76
  text: и волей своей уберег{mf||ла} тех, кто уповал на {mf|его|ее} защиту и помощь.
- guid: 8f55df3d-3ccc-43a7-a97f-e63afc127731
  length: 297
  text: Лорд-капитан повелел{mf||а} атаковать молниеносно. Нас встретило зарево зенитного огня. Те, кому не повезло, погибли сразу. Другим предстояло болтаться в воздухе, молясь, чтобы следующий снаряд прошел мимо их шаттла. Но потери были оправданы — внезапной атакой мы захватили инициативу в той битве.
- guid: 8fad0074-b15f-4ff0-b3cd-f67519279746
  length: 246
  text: 'Мостик: Впередсмотрящий, это Мастер вокса. Вывожу в канал пилотов, старших офицеров и Лорд-капитана. {mf|Его|Ее} Светлость желает лично руководить полетом.

    Впередсмотрящий: Лорд-капитан, запросили данные об объекте у отсека авгур-реле. Ожидаем...'
- guid: 8fb4cddc-34dd-4218-b25c-595b85c1e781
  length: 72
  text: Вернул{mf||а} Соломона к служению Лекс Империалис, развеяв его сомнения.
- guid: 90179f39-a222-43b0-bd2b-be734616e4d6
  length: 70
  text: '...приступил{mf||а} к тщательному осмотру собранных в отсеке образцов.'
- guid: 9031cc49-e194-476d-bd83-3e360057bfae
  length: 308
  text: 'Игнорируя мольбы о помощи, Лорд-капитан бросил{mf|ся|ась} к выходу, но тут же поскользнул{mf|ся|ась} на крови Леди-Навигатора и упал{mf||а}, распоров руку об осколки стекла. Нечто впилось острыми когтями в ногу Лорд-капитана: твари из картины, поглотив Леди Кассию, затащили в пучины тьмы свою вторую жертву.'
- guid: 910c48a4-9f14-4180-858d-a2c472d37f67
  length: 45
  text: Забрал{mf||а} гарду еретического клинка себе.
- guid: 911194f2-afdb-4bae-8427-d0ba5a26af66
  length: 68
  text: Предложил{mf||а} Маражаю свою жизнь взамен жизни одного из офицеров.
- guid: 917d9947-9404-4f6c-bac0-d78fefa6e70d
  length: 437
  text: Наследник династии фон Валанциус, малодушно отказавшись от великой чести принять Торговый Патент, был милостиво отпущен восвояси. После того, как {name} был{mf||а} спущен{mf||а} на шаттле на поверхность Райкад Минорис, {mf|его|ее} след затерялся навсегда. Скорее всего, если до преемни{mf|ка|цы} Теодоры не успели добраться убийцы Кунрада Войгтвира, {mf|он|она} наверняка сгорел{mf||а} в пламени чудовищных событий, что ждали мир-улей...
- guid: 919aaf51-b0af-409a-b295-716fb2b813d7
  length: 366
  text: Ритуальный кинжал Дома Орселлио рассек клубящиеся тени, но стоило лезвию пройти сквозь нарисованную руку, как та сразу же воплотилась вновь. Кассия обмякла в руках своего ужасающего творения и тут же оказалась по другую сторону картины. А мгновение спустя {name} и сам{mf||а} погрузил{mf|ся|ась} в недра сотворенного навигатором мира, крепко сжимая в руках кинжал...
- guid: 91a7c994-7881-4bd7-b1f3-a17b68449e27
  length: 277
  text: Иные же, более осведомленные, молчали о ксеноартефакте, обретенном Вольным Торговцем и всегда носимом при себе. С годами он буквально прирос к плоти {mf|Его|Ее} Светлости, и наросшая поверх него кожа скрыла глифы цвета вермилион, начертанные на поверхности странного украшения.
- guid: 91a9383a-3538-4498-ba11-c251ab754b91
  length: 32
  text: Свят{mf|ой|ая} подвижни{mf|к|ца}
- guid: 91c9c3de-ac57-48d9-b425-23bf5479ffe1
  length: 67
  text: Решил{mf||а} попытаться спасти Авеля в Электродинамической обители.
- guid: 91fd1523-8814-4c0f-bb20-3a41823fe84a
  length: 480
  text: Старец, к удивлению Лорд-капитана, оказался навигатором. Узнав о высоком статусе {mf|гостя|гостьи}, он поведал свою историю. Он удалился на эту планету давным-давно, будучи еще юношей — в миг, когда осознал, что не выдержит частых погружений в ужасное царство Архиврага. С гордостью он говорил, что долгие годы посвящал каждый миг жизни молитвам Императору. Однако голос его при воспоминаниях о золотом свете Астрономикона дрожал, и вслед гостям старец смотрел со странной тоской.
- guid: 92453e82-9ceb-46ee-9322-45a54b68444a
  length: 65
  text: Сказал{mf||а} Номос, что их цель — быть слугой Вольного Торговца.
- guid: 9245b243-c1c8-4817-9f84-f0c6c604ff74
  length: 62
  text: '... приказал{mf||а} нам отправиться в самоубийственный прыжок.'
- guid: 92ec73c3-76a9-49cc-ab66-77a92b874a87
  length: 62
  text: Позволил{mf||а} продолжать дворянам пришивать лица на Тассере.
- guid: 932b89ef-2cdc-40de-b0b8-27f13ccc670c
  length: 115
  text: Ксенос Ирлиэт настаивает на личной встрече с Лорд-капитаном во время, свободное от {mf|его|ее} прямых обязанностей.
- guid: 93a3800a-a867-4e1a-b4a4-63a349c9d13a
  length: 69
  text: Предложил{mf||а} повестить Наместника Владайма на трибунале Инцендии.
- guid: 93b2883c-a76d-48e4-a0f7-fe4fab80f212
  length: 84
  text: Сказал{mf||а} Хейнриксу использовать биомантию на мутанте, чтобы извлечь информацию.
- guid: 93dd128a-480c-46b1-acbf-b2b5f3ce30b8
  length: 89
  text: Воззвал{mf||а} к незаменимости Атилиуса Квинта, пытаясь отговорить его от сервиторизации.
- guid: 940d715b-8829-4d48-9d66-0cabc4f17c85
  length: 139
  text: Для {mf|того|той}, кто обратил{mf||ла} в бегство тварей из шахт Веабоса-6, любое столкновение с ксеносами — желанная проверка способностей.
- guid: 955f2eb4-dbfd-456a-bda7-c7d1e8eca826
  length: 41
  text: '...поплыл{mf||а} навстречу темным цветам.'
- guid: 957e7b53-ff2e-44b5-a082-11a6b6563131
  length: 54
  text: Вспомнил{mf||а}, что Теодора мертва, находясь на суде.
- guid: 958247fc-bc7b-418a-8dd5-f0eead07c84d
  length: 118
  text: Вы стали закадычн{mf|ый|ой} {mf|другом|подругой} Пустотного братства, заслужив доверие и преданность пиратов Простора.
- guid: 95ab2d78-144f-42ec-b20a-32dd5e53eeba
  length: 55
  text: '...закрыв глаза, остал{mf|ся|ась} висеть в невесомости.'
- guid: 95e1ccfa-fb3d-4167-a53f-ea0e521e3f72
  length: 69
  text: '...дал{mf||а} знак Главному технопровидцу ознакомиться с сервиторами.'
- guid: 95f6596e-bef2-4a14-80e6-090128d0daaa
  length: 70
  text: Позволил{mf||а} малатеку остаться на корабле, объявив его своим рабом.
- guid: 96694441-883f-4dde-afad-ac276e40a18d
  length: 145
  text: Вольный Торговец подсунул{mf||а} карательному отряду Ордо Ксенос группу культистов, которых они казнили и, довольные успехом, убрались с планеты.
- guid: 96727120-3581-4a07-99f1-9bd8dde01c0f
  length: 54
  text: Даровал{mf||а} юному повстанцу на Янусе легкую смерть.
- guid: 96734067-b3ad-4df9-9cf7-163e92240e0f
  length: 199
  text: Пустотный корабль под командованием кандидат{mf|а|ки} обеспечивал пустотную блокаду планеты. В результате нарушения вокс-сообщения и необходимости самостоятельно принимать решение кандидат{mf||ка}...
- guid: 967c5d61-12fa-4311-8de0-c1ed2be3dda6
  length: 288
  text: В последний свой миг она попыталась ворваться в мир то{mf|го|й}, кого звала элантахом, постичь, как могло столь чудовищное предательство вызреть в сердце то{mf|го|й}, кто был ей столь дорог. То, что она узрела, было столь ужасно, что сердце отважной Ирлиэт остановилось в то же мгновение.
- guid: 96b07acd-9542-4a94-9c85-82308e2f136b
  length: 111
  text: Вольный Торговец приказал{mf||а} истребить немочей, а тела отдать на исследование генеторами Адептус Механикус.
- guid: 9736ff88-d487-4bd2-a9c6-7bce499555d3
  length: 397
  text: Прикрыв глаза, Ирлиэт стискивает камень душ на груди и закрывает глаза. Придя в себя, эльдарка заговаривает не сразу — с нотками печали в голосе, тщательно подбирая слова, она признает, что элантах сделал{mf||а} все возможное, чтобы спасти ее собратьев... но именно мон-кай повинны в гибели эльдарского судна. Опечаленная болью и ненавистью, что принесли ее роду люди, Ирлиэт тихо покидает мостик.
- guid: 975f6403-537c-4165-9e71-e41553720967
  length: 85
  text: Отказал{mf|ся|ась} снимать Авеля с оскверненной машины в Электродинамической обители.
- guid: 97a19329-1f78-4854-83fd-02d2364eafc9
  length: 84
  text: Казнил{mf||а} беженцев с Кьявы Гамма за проявление непочтения к законным правителям.
- guid: 980ef8a1-ed89-484b-bb5d-4b9823ee6283
  length: 47
  text: '...попытал{mf|ся|ась} сбежать из Санктум Навис.'
- guid: 983602ce-d974-4ae8-88d7-589160ac8091
  length: 110
  text: В глазах Саргоны вы уже не просто враг, а заклеймленн{mf|ый|ая} варпом — сам злой рок, что пришел по его душу.
- guid: 98545d4d-4570-4625-8971-620974cab69f
  length: 102
  text: Вольный Торговец повелел{mf||а} блюстителям выжигать взбунтовавшийся сектор Януса прометием и бомбами.
- guid: 993d7fa2-f29b-4d6d-a237-a74a54a56459
  length: 66
  text: Отправил{mf||а} на Футфол провизию, даровав станции новую надежду.
- guid: 9949b95f-03d9-4ac7-83ef-b891ee587faa
  length: 43
  text: Спас{mf||ла} сержанта Вигастиса в Комморре.
- guid: 9a0eb737-202c-4707-86af-6070f740777f
  length: 440
  text: После суда над префектом Вультур и маршалом Страксом Вольный Торговец приказал{mf||а} Арбитес найти себе нового командира и забыть о династии фон Валанциус. Назначенный спустя годы маршал был настолько испуган судьбой своего предшественника, что не смел сказать и слова против решений династии. Со временем Арбитес Простора выродились из грозы любого преступника в очередной клан блюстителей порядка и затерялись среди тысячи себе подобных.
- guid: 9a6223b0-c4a1-4ad0-b60d-18b057c1ed56
  length: 191
  text: На Футфоле приветствуют нов{mf|ого|ую} главу династии фон Валанциус. Что случилось с Леди Теодорой? Кто эт{mf|от|а} новоявленн{mf|ый|ая} Вольный Торговец? Вопросы и слухи множатся каждый час.
- guid: 9adb0200-9276-420b-82d9-dc73e1a17aa4
  length: 80
  text: '...поддал{mf|ся|ась} наитию и вонзил{mf||а} катетер от когито-кисти себе в вену.'
- guid: 9b01c083-8a62-4001-8ded-6536713f0bff
  length: 38
  text: Милостив{mf|ый|ая} спаситель{mf||ница}
- guid: 9b3185fb-19b1-45df-9b8a-bf4bb0ed887b
  length: 100
  text: Вольный Торговец никогда не слышал{mf||а} ни об этом корабле, ни об окутывающей его мрачной легенде.
- guid: 9be9ed94-e3de-4039-bb13-48b525a56c2e
  length: 45
  text: Забрал{mf||а} выживших с Фтона-IV на корабль.
- guid: 9c36916b-c51d-4867-80cc-5c28aa0b33ce
  length: 86
  text: Приказал{mf||а} отправить к руинам Черного корабля техников, чтобы забрать все ценное.
- guid: 9c48bfbb-c708-431d-85da-ec7730c10f31
  length: 60
  text: Выкинул{mf||а} гарду еретического клинка в глубины реактора.
- guid: 9c752f3d-6430-4fb8-b91d-4df1bdb802e3
  length: 65
  text: Велел{mf||а} отдать наследство Денза Беллардо его внучке, Аделии.
- guid: 9ca826cd-efc4-44d0-a86a-a5dce22bda36
  length: 510
  text: Когда зрение прояснилось, место, в котором мы находились, было совершенно иным. Без сомнений, мы находились в Музеоне, и вид его торжественных залов, разрушенных орбитальной бомбардировкой, наполнил мое сердце мстительной радостью. До того, чтобы сполна отомстить вору, посмевшему украсть {g|Encyclopedia:WarrantGlossary}Священный Патент{/g}, оставалось меньше одного шага. Наследни{mf|к|ца} династии фон Валанциус соверши{mf|л|ла} невозможное, пройдя в логово опаснейшего врага и оставшись невредим{mf|ым|ой}.
- guid: 9cb8a30c-a95f-49a9-954f-a7626c2462ed
  length: 63
  text: Благодать Омниссии лежит на победител{mf|е|ьнице} технопроказы.
- guid: 9d8ff0fb-8084-473c-8480-3926993db7e8
  length: 31
  text: Нов{mf|ый|ая} влады{mf|ка|чица}
- guid: 9e1da30c-9a84-4ead-8350-154e3c8a00fd
  length: 43
  text: Наказал{mf||а} братьев-дарителей с Тассеры.
- guid: 9f2fefb1-c5aa-4f17-959f-796a4606784e
  length: 49
  text: Отдал{mf||а} гарду еретического клинка Хейнриксу.
- guid: 9f46cc11-0cc2-4c89-a759-86dbb7fdb499
  length: 35
  text: Угрожал{mf||а} Неумирающему казнью.
- guid: 9f6b2d97-06b8-4eae-854a-75963ee5aa7c
  length: 87
  text: Приказал{mf||а} спрятать еретический алтарь, чтобы он не причинил вреда мирным жителям.
- guid: 9fcccefc-40a3-43db-bb21-d541003a0c7c
  length: 56
  text: Напомнил{mf||а} отцу Иеронимусу о его вере в искупление.
- guid: 9fe79d1d-f03c-4f11-894f-59d4084ba2bd
  length: 43
  text: Расшифровал{mf||а} сонет Ноктюрна Забвения.
- guid: 9ff583ae-83a0-443a-85c2-b06bf660bafb
  length: 157
  text: Силовое устройство, собранное из осколков эльдарских обелисков. Вольный Торговец получил{mf||а} это ксенотворение после усмирения призраков на агромире Янус.
- guid: a0041641-d2ce-4c2e-87f8-36ad6924ed97
  length: 80
  text: Убедил{mf||а} гладиаторов на арене сражаться сообща против богомерзких ксеносов.
- guid: a0103f58-17aa-4729-9a44-2f450cc02bbb
  length: 98
  text: Видел{mf||а} Домин среди них карту Палача, что вершит приговор и завершает насильно начатое не им.
- guid: a0417346-6588-4344-a5f9-53ca32291fc7
  length: 213
  text: При помощи бинокулярного наблюдательного механизма Лорд-капитан можно лично корректировать огонь макропушек прямо с мостика, если е{mf|му|й} будет угодно возглавить оборону судна от многочисленных пустотных угроз.
- guid: a091eca1-276a-4fa4-913b-fdef5e2f8db4
  length: 114
  text: Лорд-капитан решил{mf||а} сначала исследовать место высадки самостоятельно, пообещав Идире взять ее с собой позже.
- guid: a09aacbe-ca75-4ed5-9e7d-7a79bc7cdd0b
  length: 66
  text: Убедил{mf||а} Паскаля оставить богохульный ксенотех в своей плоти.
- guid: a0ad877e-c8d1-473e-a4cc-1395c04d8e40
  length: 64
  text: Оценивая ситуацию, Лорд-капитан бегло осмотрел{mf||а} помещение.
- guid: a0cc60e6-5425-4e16-8526-9b24f667e77d
  length: 150
  text: Вольный Торговец воссоздал{mf||а} жезл управления и запитал{mf||а} подъемный механизм. Пора вернуться к хранителю станции и подняться в покои госпожи.
- guid: a14a110c-1966-4c4a-a780-890401259450
  length: 232
  text: Ксеносы недооценили Лорд-капитана, вышвырнув е{mf|го|е} бездыханное тело на свалку трупов. Но их пыток оказалось недостаточно, чтобы прикончить Вольного Торговца. Путь, ведущий к спасению и возмездию, начинается на самом дне могилы.
- guid: a1efd9fb-1554-4bcf-b610-347cbef86bd0
  length: 71
  text: '...опросил{mf||а} выживших очевидцев творимых Криком скверны злодейств.'
- guid: a1fc141e-b5b2-418d-8a3b-e3d1b40f193e
  length: 97
  text: Приказал{mf||а} Высокому фактотуму приберечь обломок еретического клинка для передачи Инквизиции.
- guid: a20d39d3-c324-45ae-9467-577ea5f833b0
  length: 187
  text: Благодаря странным законам сего места все, что было сотворено на холсте, воплощалось в жизнь. Оружие без промедления возникло в руках Лорд-капитана, и {mf|он|она} бросил{mf|ась|ся} в бой.
- guid: a22ea493-a4c8-47dc-b90c-fcf011f3618a
  length: 66
  text: Убедил{mf||а} Паскаля вырвать богохульный ксенотех из своей плоти.
- guid: a230180e-6b03-4ab0-9500-95fee9aa02f5
  length: 79
  text: Приказал{mf||а} разрушить еретический алтарь, невзирая на сопутствующие жертвы.
- guid: a24620b1-5d62-4f92-8d1e-df19dc0c5053
  length: 31
  text: Пощадил{mf||а} послушника Зика.
- guid: a246e086-3087-4f5e-8ba3-ff067dc590d9
  length: 324
  text: Собирая воедино истекающие кровью миры, Вольный Торговец сурово наводил{mf||а} порядок, защищая веру и изгоняя в прошлое времена, когда Простор мнил себя неподвластным Его правосудию. Началась экспансия, которая со временем должна была превратить сектор в новую провинцию Империума, более не нуждающуюся в Вольных Торговцах.
- guid: a25d0c47-ab2f-43cf-856b-da292dde8c57
  length: 66
  text: Укрыл{mf||а} свою природу от Инцендии Чорда запретным колдовством.
- guid: a273b173-04ed-4e0a-8dda-3b858c8ac401
  length: 259
  text: Ульфар покинул корабль Вольного Торговца и направился на планету, где, предположительно, могут отыскаться следы его стаи, в одиночку. Если Лорд-капитан желает оказать соратнику помощь в экспедиции, {mf|ему|ей} предстоит также высадиться на промерзшую планету.
- guid: a2835e1e-fa01-4cb4-9ec5-4ca996717bf8
  length: 164
  text: Вольный Торговец не пожелал{mf||а}, чтобы на Кьяве Гамма уцелело хотя бы одно отравленное зерно ереси. Работа мануфакторумов остановлена на время великого очищения.
- guid: a292803f-230c-42eb-983c-d73a6ac2c7cb
  length: 50
  text: Казнил{mf||а} слугу, предавшего губернатора Януса.
- guid: a293982c-b1a5-4270-a10b-feb429ee30c6
  length: 653
  text: 'Приняв предложение Вольного Торговца и став {mf|его|ее} достойным консортом, Соломон Антар более никогда не позволял никому вновь встать между ним и его любовью.

    Однажды Соломон отправился в рейд на пиратов, а вернулся в сопровождении трех сирот нежного возраста, освобожденных им из плена. Проникнувшись к ним теплотой, Соломон вместе с Вольным Торговцем занялся их воспитанием. Под мудрой и полной любви опекой трое детей превратились в могучих и талантливых людей, чьи деяния не раз потрясали Простор Коронус. А любовь арбитра и Лорд-капитана пусть более никогда и не принадлежала лишь им двоим, но ни разу в жизни они не испытывали недостатка в ней.'
- guid: a2e4eb43-dd3b-4147-9b7c-295d0675a477
  length: 85
  text: Назвал{mf||а} своих соратников из Прорвы жертвами, прося Ноктюрна Забвения их спасти.
- guid: a30a6bd3-0e3e-4be8-9897-b26eaed0f355
  length: 91
  text: '{name} остал{mf|ся|ась} посреди океана из ничего, лишенн{mf|ый|ая} любых чувств и эмоций...'
- guid: a3edc95e-21a7-4e5c-bd16-e0b07490f334
  length: 53
  text: Убедил{mf||а} бригадира Паска встать на свою сторону.
- guid: a583d88d-98a2-47f9-90da-f7fc71f6a2db
  length: 296
  text: Лорд-капитан приказывает подать пергамент и перо. {mf|Он|Она} наскоро опрашивает офицеров, обрисовывает ситуацию на корабле, записывает данные и производит расчеты всевозможных исходов. Через десять минут офицеры начинают покидать медпалубу, каждый — с пергаментом, исписанным четкими указаниями.
- guid: a590ef91-339f-42c5-b717-ab2d8e0e1ddb
  length: 116
  text: Благодаря системам связи повстанцев, захваченным Лорд-капитаном, у е{mf|го|е} верных слуг появился серьезный козырь.
- guid: a5ab9aed-9ed3-42db-951b-737d0295f54c
  length: 73
  text: Разрешил{mf|л|ла} генетору забрать уникальный аугмент у старого рабочего.
- guid: a5e6d068-fbea-4f70-93c1-ace101929118
  length: 128
  text: Вольный Торговец силой слова и веры сломил{mf||а} непостижимую сущность, прислуживающую Архиврагу. Слава династии фон Валанциус!
- guid: a5ee105c-af6a-4c14-8cab-8f659ecaed06
  length: 93
  text: Лорд-капитан наш{mf|ел|ла} не утраченную реликвию, а самого Себериана — живого и невредимого.
- guid: a6dbd30a-8bc3-4c25-bafb-f7597c209d8e
  length: 224
  text: 'Не сказав никому и слова, Вольный Торговец сквозь дым, пар и завалы пробирается к выходу. Сервочереп неотступно следует за {mf|ним|ней}: в кадре — спина Лорд-капитана, вокс фиксирует крики боли и кашель откуда-то со стороны.'
- guid: a6eff3ad-cbc7-4c54-a6e0-221d57027e91
  length: 82
  text: Вольный Торговец сделал{mf||а} новым настоятелем дипломатичного Тикона Драйвстема.
- guid: a72268c3-ccd5-4ef5-ba9f-135e941a59af
  length: 245
  text: '{name} пробудил{mf|ся|ась} посреди... титанического, необъятного, клубящегося... ничего. Тело словно парило в невесомости, усеянной сотнями красок Леди-Навигатора: какие-то были яркими, теплыми, манящими. Другие — угрюмыми, холодными и тяжелыми.'
- guid: a769065a-9bf9-4ac1-9cad-eadb87d0ae06
  length: 75
  text: '...попытал{mf|ся|ась} проскользнуть мимо чудовища, уповая на свою ловкость.'
- guid: a7934191-9023-4b75-8dc0-6cee0d14ecf4
  length: 86
  text: '...разработал{mf||а} план, согласно которому Космические волки встали на острие удара.'
- guid: a7987586-023f-4024-9571-78e626d35822
  length: 427
  text: На этой бедной, плохо приспособленной для жизни планете обнаружилось нечто неожиданное — имперская колония, века назад потерявшая связь с внешним миром. Колонисты живут в ужасной бедности, хуже жителей нижних слоев миров-ульев. Однако эти честные люди не забыли веры в Императора и радостно приветствуют гостей. Лорд-капитан получил{mf||а} приглашение посетить местную правительницу, носящую титул Архикоролевы Принцепс-Домины.
- guid: a7d50e88-ad07-4af6-956f-ce862a37b61a
  length: 59
  text: Велел{mf||а} позаботиться о бедняках в честь Магнэ Ацессио.
- guid: a7e67d68-a57c-4b0d-812a-bbb6e3e57e4c
  length: 63
  text: Выступил{mf||а} в защиту отца Иеронимуса на трибунале Инцендии.
- guid: a823cf6f-ff53-412e-affa-186364b53f2b
  length: 64
  text: Лорд-капитан всмотрел{mf|ся|ась} во мрак, застилавший помещение.
- guid: a8449020-e468-4d2c-a0ab-d4880e33f3ba
  length: 47
  text: Лорд-капитан рискнул{mf||а} просмотреть запись.
- guid: a85b1edd-0c6b-4e4f-977b-9985791a9933
  length: 102
  text: Вольный Торговец увидел{mf||а} достаточно — пора сообщить капитану Френзо, каким будет будущее отсека.
- guid: a8eac0ca-f052-4ed0-85fc-8f69294f82f4
  length: 426
  text: Все на корабле знали о связи между Кибеллой и ее Домин, но знали также, что связи этой не суждено было стать чем-то большим. Скрепив сердце, Кибелла отдалилась от Лорд-капитана, довольствуясь лишь ролью стражницы свое{mf|го|й} возлюбленн{mf|ого|ой}, храня чувство в своем сердце и не дозволяя себе более. Пусть боль от сего решения и была велика, она не видела иного пути, по которому могла провести ее стезя Кровавой паутины.
- guid: a930dec0-0c19-425b-9aab-0e91fbf3ca7d
  length: 90
  text: Удержал{mf||а} солдат Заркова от поножовщины, напомнив, что нельзя разбрасываться жизнями.
- guid: a93bd7cc-da78-4441-8bff-3f126e94ab1b
  length: 150
  text: Укрепившись в вере, матросы все как один откликнулись на строгий глас светлейш{mf|его|ей} Лорд-капитана и бросились спасать то, что осталось от судна.
- guid: a9e5e949-6593-4d45-86ed-89db8e2021da
  length: 127
  text: Вольный Торговец повелел{mf||а} изолировать сектор Януса, поступившись территорией производств в целях контроля и безопасности.
- guid: aa51b33b-e97a-4768-a131-442c23168fe5
  length: 49
  text: Одобрил{mf||а} еретические деяния Вистенцы Вьятт.
- guid: aa57f158-03fd-4e04-89f6-a90a5ea35157
  length: 315
  text: В Просторе ходит немало странных слухов, но один из самых удивительных, появившихся на волне славы Вольного Торговца фон Валанциус — миф, что якобы на каждом мире, когда-либо посещенном {mf|им|ей}, люди и объекты могут неожиданно исчезнуть, если окажутся в одной комнате с любым, даже самым обычным на вид зеркалом.
- guid: aa8df8e1-bb97-421b-9b4c-5cb40e2a3851
  length: 57
  text: Позволил{mf||а} Ардженте казнить одержимую мороком Идиру.
- guid: aac8b1a7-0da5-464b-a34f-2b93d6362aaf
  length: 133
  text: Очнувшись на свалке трупов, Лорд-капитан обнаружил{mf||а}, что е{mf|го|е} обувь исчезла. Отыскать ее — в некотором смысле дело чести.
- guid: aae9a70d-c318-4d3c-a7bb-951d9c188df2
  length: 82
  text: Изучил{mf||а} душу рабочего своим нечестивым взором, чтобы отыскать следы скверны.
- guid: ab86bcc7-34ca-42bd-98b5-fe9b21203fff
  length: 33
  text: Устрашитель{mf||ница} Кьявы Гамма
- guid: ab9297b3-1f67-44b0-a303-ba6c0090fa1c
  length: 64
  text: Заставил{mf||а} Наместника Владайма присягнуть Великому Светочу.
- guid: ab9d83ee-d26d-4dc0-b436-e7b043a31235
  length: 101
  text: Вольный Торговец отдал{mf||а} Чистоголосому пророку Горнило и выдал{mf||а} охрану из верующих воинов.
- guid: abae09f8-6bd5-4e75-b0ff-095b89fb63b9
  length: 117
  text: В убежище контрабандистов, полном ловушек и ксеносских технологий, Лорд-капитан обнаружил{mf||а} загадочный артефакт.
- guid: abb44ab7-1c15-485b-8a7d-f32c4f8af82e
  length: 141
  text: Лорд-капитан узнал{mf||а} конструкцию — подобные были на Райкади Филии, где оскверненный Архиврагом комендант творил с их помощью колдовство.
- guid: abf13b8a-0cfe-479c-b243-a0687a9131fb
  length: 91
  text: Объявил{mf||а} себя выше законов Империума и приговорил{mf||а} к смерти префекта и маршала.
- guid: ac2c73ac-07a1-4a18-8488-99a4115b634c
  length: 48
  text: Молвил{mf||а} слова Истины Уралону на Ефрате-II.
- guid: ac356ff9-f316-4f18-8dd8-e12efe58bc1d
  length: 194
  text: Лорд-капитан сумел{mf||а} попасть в реальный мир — врата Паутины привели {mf|его|ее} на агромир Янус. Необходимо как можно скорее достичь пустотного корабля и вновь встать во главе протектората.
- guid: ac72a1fe-afb1-4d4d-85c5-25404ba50ec3
  length: 47
  text: Приговорил{mf||а} мятежников на Янусе к смерти.
- guid: ac8d3a1a-7209-408f-b790-95f784f240eb
  length: 270
  text: На мостике династического флагмана фон Валанциус произошел ожесточенный спор Вольного Торговца и {mf|его|ее} прославленного предка. Напряжение между членами династии возросло, и в ближайшем будущем Себериан намеревается окончательно выяснить отношения со своим потомком.
- guid: ac92ad25-ca89-485d-919a-191455d4c0ac
  length: 61
  text: Разорвал{mf||а} глотку спутнице Злобы, чтобы выпить ее крови.
- guid: ac9d057e-bf03-497f-8c79-c30699e30397
  length: 322
  text: Маражай Эзирраеш погиб от рук Вольного Торговца, но след, оставленный им в душе Лорд-капитана, так и не исчез. Отравленн{mf|ый|ая} ядом, влитым в {mf|его|ее} жилы искусным и жестоким любовником, {name} год от года все больше погрязала в неизбывной, ненасытной жажде удовольствий за гранью морали и за счет чужих страданий.
- guid: acbaf3e0-5012-4a1c-bdd4-de199bd304b6
  length: 111
  text: Вольному Торговцу предстоит откровение — до того момента {mf|ему|ей} надлежит скрывать свои истинные намерения.
- guid: acbe7277-50f9-44c0-8764-f0d5748c08f8
  length: 105
  text: Планам Лорд-инквизитора не суждено сбыться — Вольный Торговец вмешал{mf|ся|ась} в них в последний момент.
- guid: ad4bfc03-6757-481a-abdb-0981d13d02d2
  length: 486
  text: С сего момента мир принадлежит лишь Вольному Торговцу. Ваши люди изничтожили поселения, в которых скрывались нечистые последователи богомерзкого культа. Скверна Короля Искажений ослабила хватку, и земли Амберворлда смогли вздохнуть спокойно — благодаря стараниям свое{mf|го|й} ново{mf|го|й} правител{mf|я|ьницы}. Однако зловещие отголоски прежних слуг Архиврага все так же таятся в тенях и ждут подходящего момента, чтобы снова окутать планету паутиной ереси. Зло не проходит бесследно.
- guid: ad744180-764d-4657-89b1-5bb09307cfab
  length: 351
  text: Долгие годы Вольный Торговец одерживал{mf||а} победы и совершал{mf||а} дерзкие экспедиции, усталость и годы были не властны над {mf|ним|ней}. Со временем, впрочем, о {mf|Его|Ее} Светлости поползли темные слухи. Говорили, что у Вольного Торговца завелась мстительная привычка лакомиться плотью тех, кто пытался сделать {mf|его|ее} фигурой в своей игре.
- guid: add1624c-ec85-4fec-86af-7b63cbb696fb
  length: 91
  text: Лорд-капитан не желал{mf||а} рисковать, и приказал{mf||а} уничтожить когитатор и отступить.
- guid: ae5f8dd4-467a-4431-8207-04bad3770864
  length: 192
  text: Отряд разведчиков, возглавляемый сам{mf|им|ой} Вольным Торговцем, десантировался на замерзший мир. Начальной точкой поисков был определен шаттл, на котором Ульфар Громогласный покинул корабль.
- guid: ae8b0055-f823-4d73-8524-153096ea6c02
  length: 189
  text: Слова Лорд-капитана привлекли внимание не только Леди Кассии — Тисифона Орселлио впервые заметила присутствие живого существа в этом странном мире, и с яростью бросилась на чужа{mf|ка|чку}.
- guid: aec6315a-ed5b-4312-bd03-a6793a7aafa2
  length: 35
  text: Размышлял{mf||а} о цене могущества.
- guid: af2e8fbf-f001-4871-8924-2d7ad39bb726
  length: 81
  text: Убил{mf||а} оскверненного техножреца, чтобы выманить сущность, захватившую судно.
- guid: af2fcd61-7372-4f61-8fe3-7a8e6681cca8
  length: 382
  text: Дабы поражение в джунглях не превратилось в военную катастрофу, мудрейш{mf|ий|ая} Лорд-капитан отдал{mf||а} своевременный приказ о точечной орбитальной бомбардировке планеты. Безжалостные удары обратили в пар скопления повстанцев, вынудив их отступить в островные, не представляющие ценности районы. Увы, под ударом также оказались сельскохозяйственные установки и мощности колонии.
- guid: af3bc3c7-51d0-449d-bbe0-9c751b1c325a
  length: 22
  text: Цар{mf|ь|ица} жадности
- guid: af6175e0-74de-4450-a134-275a836c87b3
  length: 134
  text: Попытавшись вычленить основное из долгой речи Седой Маттины, {name} указал{mf||а} на места, где можно провести более тщательный поиск.
- guid: af7bf0cb-5c65-4a97-b26a-03091f6721ec
  length: 72
  text: '...принял{mf|ся|ась} рвать и истреблять преграду из плоти на пути своем.'
- guid: af80d73f-3494-4e97-aed1-6c88c24d4c18
  length: 350
  text: Простор Коронус стал охотничьим угодьем для ново{mf|го|й} нечестиво{mf|го|й} влады{mf|ки|чицы} из династии фон Валанциус. На руинах старого порядка возводилось новое царство, славящее Темных богов варпа. В секторе Каликсис началось приготовление грандиозной карательной эскадры. Но пропустят ли ее бурные варп-шторма Великого Разлома, не ведал никто.
- guid: afe706fd-d589-4f48-a445-480d9fc3d307
  length: 524
  text: Мо{mf|й|я} влады{mf|ка|чица}, со скорбью свидетельствую о гибели 27.61% священных машинных духов, доверенных моей опеке. Экстренному погребению подвергнуты второй и третий реакторы, экипаж палубы приступил к поминальному бдению. {g|Encyclopedia:Servitor}Сервиторы{/g} зафиксировали не менее одиннадцати пробоин во внешнем корпусе, не менее трех — во внутреннем корпусе. С вашего милостивого дозволения, я приступаю к спасению того, что еще может быть спасено. {g|Encyclopedia:Omnissiah}Омниссия{/g} знает все, постигает все.
- guid: b038f1b9-1b56-4dfc-9698-a2030abba4d5
  length: 42
  text: Процитировал{mf||а} литанию воина Ульфару.
- guid: b03da14f-32a2-4728-83b7-af4456cb3e56
  length: 448
  text: 'И спустились они в нижние отсеки, и легли в каменный гроб, и глаза закрыли. И услышал{mf||а} тогда Домин голос Неумирающего Императора, и обещал он новую встречу, скорую встречу.

    А после кончилось странствие. Домин же, увидев Смерть прежде срока своего, прош{mf|ел|ла} туда и вернул{mf|ся|ась} обратно, чтобы принести нам весть и мудрость: без сомнения ступай тропой Кровавой паутины, ибо ведет она к Нему, как и все в мироздании. Он — есть Смерть.'
- guid: b0798813-a7ae-4fda-9d77-e95903fd780c
  length: 74
  text: Бросил{mf||а} штурмовую колонну рабочих на пустотный крейсер на Ефрате-II.
- guid: b0826d05-85de-43a5-b414-cf2336acaf80
  length: 70
  text: Приказал{mf||а} защитить монастырь от беженцев, прибывших на Фолстоун.
- guid: b0954b2b-a455-49f6-9566-30173c883c79
  length: 358
  text: По легенде, сам Бог-Император благоволил свое{mf|му|й} наместни{mf|ку|це}, даруя {mf|ему|ей} чудесную силу повергать зло и храня от вражьих происков. Впрочем, распространителей сих слухов, как и тех, кто требовал признания в Вольном Торговце живо{mf|го|й} свято{mf|го|й}, преследовали агенты Экклезиархии, боровшиеся с нежелательными для Империума сплетнями.
- guid: b16c448d-5720-4264-aae8-78d766362567
  length: 529
  text: Могущество протектората фон Валанциус ширилось и росло, привлекая под его власть новые территории, новых людей и новые ресурсы. Владения династии наводнились странными механизмами, что работали денно и нощно, приводили в трепет и изумление одних жрецов Омниссии и вызывали страшный гнев у других. Машины, дарованные династии ее загадочным покровителем в обмен на великое предательство, были лишены души, и столь же бездушным стал однажды и Вольный Торговец. Ужас перед {mf|ним|ней} держал протекторат в безоговорочном подчинении.
- guid: b19315ad-f3a4-4a40-b9ca-67bddcb5046d
  length: 64
  text: Велел{mf||а} Уралону Жестокому убираться прочь из своего разума.
- guid: b19ff66f-a321-4bdc-85d7-4923581f9349
  length: 55
  text: '...вонзил{mf||а} в Тисифону Орселлио ритуальный кинжал.'
- guid: b1afaa85-7b80-4858-8a3d-79aa51d7be83
  length: 589
  text: 'Паскаль Ханейманн — почтенный магос братства Адептус Механикус. Во славу Бога-Машины Омниссии он совершает священные алгоритмы обслуживания и хранит благословенное таинство технологии от профанов. Будучи членом Эксплораторского флота, Паскаль ведет вечный поход-исследование в поисках сакрального Знания.

    Столкнувшись с Вольным Торговцем на мире Райкад Минорис, Паскаль примкнул к е{mf|го|е} свите. Он надеется, что столь могущественн{mf|ый|ая} покровитель{mf||ница} поможет ему отыскать давно потерянного наставника, чье таинственное послание и побудило Паскаля отправиться в путешествие.'
- guid: b1b85668-c894-4539-9799-0f540bcf2447
  length: 227
  text: Получение вестей о состоянии протектората и действиях конкурентов Вольного Торговца значительно затянулось, однако в конечном итоге Лорд-капитан преуспел{mf||а} в побеге из Комморры и смог{mf||ла} получить необходимые сведения.
- guid: b1de7611-5716-4069-82c2-e60cf199cff7
  length: 41
  text: Решил{mf||а} истребить эльдаров на Янусе.
- guid: b24c3d28-82ff-4baa-91df-462b499bf345
  length: 180
  text: Дух зоркого корабельного омнископа способен явить тусклое свечение далеких звезд то{mf|му|й}, кто отважно решится проложить маршрут в неразведанные системы и принести свет во тьму.
- guid: b299352f-62bc-434e-ba8c-5a268eca2086
  length: 80
  text: Убил{mf||а} Хейнрикса, чтобы позволить Эмелине вернуть солнца в Простор Коронус.
- guid: b2edbe97-4f1c-4136-9342-81e426db540a
  length: 40
  text: '...согласил{mf|ся|ась} внести плату сию.'
- guid: b2fb3277-73f8-4636-88ff-702910ff6c49
  length: 25
  text: Влады{mf|ка|чица} пламени
- guid: b3c9ddf0-c754-47d6-9caa-59e5c5e66aa5
  length: 61
  text: Бросил{mf||а} истерзанного техножреца умирать на Кьяве Гамма.
- guid: b3ed026f-d2d0-40cb-a54d-85d1c7f63507
  length: 384
  text: В Просторе Коронус нет более достойно{mf|го|й} опекун{mf|а|ши} для обители веры, чем глава династии фон Валанциус. В столице мира в е{mf|го|е} честь будет возведена великолепная базилика, украшенная грандиозной парной скульптурой Императора и Вольного Торговца. Тысячи прихожан и жрецов будут поминать е{mf|го|е} имя в ежедневных молитвах и преподносить е{mf|му|й} благочестивые дары.
- guid: b4bcd00a-76ac-4a9b-902f-78635bf7b4f4
  length: 86
  text: Сказал{mf||а} Хейнриксу не подключать лексмеханика обратно к оскверненному когитатору.
- guid: b4e477f4-1e6a-4422-a1e8-43e973522fbf
  length: 100
  text: Спас{mf||ла} людей от суда Инцендии Чорда, позволив им поклясться в верности династии фон Валанциус.
- guid: b4e7ef78-0f08-4c1e-bbed-7d3ef1c5247a
  length: 73
  text: Вольный Торговец помог{mf||ла} Эксплораторам получить опеку над Горнилом.
- guid: b4ef6ff4-42d3-4e02-aa70-cd2fc35f962d
  length: 82
  text: Велел{mf||а} покарать роптавших беженцев с Кьявы Гамма, остальных отпустил{mf||а}.
- guid: b57946bc-0023-44c4-8481-ba9f5361cdac
  length: 115
  text: Лорд-капитан приказал{mf||а} отстранить капитана Вести от командования и затребовал{mf||а} последний отчет о делах.
- guid: b58d4b1b-a87e-4c1f-99e0-d70c2b60ac7d
  length: 308
  text: Багровые завихрения лишь путали мысли и чувства Вольного Торговца. {mf|Он|Она} слышал{mf||а} шепот и стоны, исходящие из глубин — стоит сделать шаг, и ты навсегда сгинешь в сем злосчастном тумане, присоединившись к хору несчастных... Но кто столь горестно молил о милости? Увы, разобрать то было не под силу.
- guid: b59a8555-bbdd-4703-9d7c-404f32119c4f
  length: 33
  text: '...отступил{mf||а} от сервиторов.'
- guid: b5e8de89-c422-4f7e-8281-a284bc6a20ee
  length: 249
  text: Лорд-капитан тяжело ранен{mf||а}, обкраден{mf||а} и лишен{mf||а} соратников. В пугающем месте, в котором он{mf||а} оказал{mf|ся|ась}, е{mf|му|й} как никогда важно найти безопасное укрытие, получить помощь целителя и спланировать дальнейшие действия.
- guid: b5fb628c-c46e-4783-ad26-b717b714563c
  length: 476
  text: Некоторое время спустя Ирлиэт приходит к Лорд-капитану — изможденная, но все еще цепляющаяся за надежду. Она говорит о том, что отправилась на судне мон-кай во тьму в надежде отыскать собратьев. И о том, как нашла лишь трупы, погребенные человеческой ненавистью. Но пусть она и Лорд-капитан были не всегда друг с другом согласны, элантах хотя бы попытал{mf|ся|ась} протянуть ей руку помощи. И в благодарность, как и обещала, Ирлиэт делится координатами схрона своих собратьев.
- guid: b62bd4f7-9caa-40df-a13e-aadbc3f09051
  length: 64
  text: Отринул{mf||а} протекцию демона, вторгшегося в мысли на Тассере.
- guid: b67ca28b-ce03-4f29-bd9c-9ffef0fc9a7d
  length: 108
  text: Сказал{mf||а} Хейнриксу, что еретический когитатор должен завершить работу, чтобы оправдать жертву погибших.
- guid: b6ada9bd-0162-40ad-b9bd-e1be2f7ce520
  length: 86
  text: Позволил{mf||а} Сангвиналиям-госпитальерам основать на Фолстоуне святилище-санаториум.
- guid: b6c1c21c-a808-47d8-9756-7708e4c3d31f
  length: 322
  text: Вольный Торговец отрывает силовой ключ от мехадендрита техножреца и вскрывает кожух терминала. Искры сыпятся {mf|ему|ей} на лицо, однако капитан уверенно манипулирует связками проводов и грохочущими рычагами. Опустив кожух на место и убедившись, что система восстановлена, Лорд-капитан выводит на экраны нужную информацию.
- guid: b6e7d605-c5a5-45f1-815d-5bb5fa963560
  length: 392
  text: После странствий с Вольным Торговцем Кассия Орселлио вернулась в лоно Дома, где приближенные и великий регент провозгласили ее новым Новатором. Привыкшая во всем полагаться на Лорд-капитана, Кассия стала послушным инструментом династии фон Валанциус и направила все силы Дома на помощь свое{mf|му|й} {mf|другу|подруге} и наставни{mf|ку|це}... Даже тогда, когда это вредило интересам Орселлио.
- guid: b741963c-b897-40cb-a3de-c7ff433229e1
  length: 113
  text: '[О цене могущества и изменчивых тропах, ведущих к нему. О том, чем и кем он{mf||а} пожертвует ради силы и власти]'
- guid: b7a970cf-0b32-4a55-a204-3d398e7fcdeb
  length: 560
  text: '{name} фон Валанциус, соблазненн{mf|ый|ая} посулами ксеносской заразы, принял{mf||а} Поцелуй генокрада и примкнул{mf||а} к Конгрегации Хищной звезды. Он{mf||а} впустил{mf||а} в плоть сладость генетического совершенства, а в разум — песни блаженного Ангела. Распространяя учение Хищной звезды по мирам, кораблям и станциям, он{mf||а} молил{mf|ся|ась} о дне Освобождения, когда небесная рать Многорукого Императора прибудет в Простор. В сей славный день триумфа Вольного Торговца, как перв{mf|ого|ую} из святых Его, ждет великая награда за набожность и верность.'
- guid: b7c3b3a1-1243-4f4e-9b11-1301d7a39f3b
  length: 121
  text: '...использовать для техносаботажа сервочерепа боевого класса, возглавляемые {mf|его|ее} личным роем с позывным {petname}.'
- guid: b7dc6113-c6b3-4df3-b575-09e5e05c425a
  length: 233
  text: В системе Слеза Солара Лорд-капитан обнаружил{mf||а} древний шаттл с инсигнией Инквизиции и пилотом 32-го меровского штрафного легиона. На сохранившейся вокс-записи сказано, что их покровитель погиб, а полк остался на мире GH-89-717.
- guid: b7f0bbab-95e5-414b-a13f-c39adac7ebe6
  length: 531
  text: Основные силы бунтовщиков скрывались в удаленных неосвоенных местностях, однако обширное подполье было развернуто и в крупных городах. Приближенные Вистенцы Вьятт настаивали на карательных рейдах, в то время как советники Лорд-капитана предложили развернуть на планете активную пропаганду, которая побудила бы подданных самостоятельно выявить изменников в своих рядах и доложить о них властям. Подобное решение, однако, потребовало бы использования личной казны Лорд-капитана для демонстрации е{mf|го|е} щедрости и покровительства.
- guid: b830596b-e4f5-48c5-a422-04480541267b
  length: 102
  text: Приказал{mf||а} заминировать спасательные шаттлы, чтобы предотвратить бегство с поврежденного корабля.
- guid: b850e0be-0000-4576-bb24-e631d5452f24
  length: 274
  text: Увы, уровень подготовки бойцов гарнизона был столь низок, что даже личное руководство операцией благословенн{mf|ым|ой} Лорд-капитаном не принесло им победы. Погибая во множестве, солдаты не могли сориентироваться в растительности и хотя бы понять, откуда по ним ведут огонь.
- guid: b87ccc3b-2062-4673-95e1-894e4229dce6
  length: 222
  text: Вольный Торговец доверил{mf||а} вопросы найма специалистов высшим офицерам. В знак их признательности были модернизированы компоненты макропушек по особой технологии пустотников — по слухам, за счет личных средств команды.
- guid: b8880d33-91c9-4460-8707-3002fbc19e80
  length: 76
  text: Поддержал{mf||а} план Соломона по возвращению контроля над Райкадом Минорис.
- guid: b8b595dd-1018-4a51-840d-795c27f8b3cd
  length: 50
  text: Объявил{mf||а} Футфол обителью веры и благочестия.
- guid: b8bac40c-238c-4b53-8ef1-548a517736db
  length: 77
  text: Убедил{mf||а} Идиру в том, что ее единственное спасение — слиться с голосами.
- guid: b8cac1cc-c63e-426a-9478-232a7b930277
  length: 194
  text: И прочитал{mf||а} Домин слова, и произнес{mf||ла} их. И стало тело Судии перестраиваться по новому, прекрасному и ужасному замыслу. Ибо нет невозможного для души, постигнувшей сокрытую мудрость.
- guid: b9533dcc-491e-49b1-9674-f26aae243bb4
  length: 64
  text: Упрекнул{mf||а} отца Иеронимуса в подхалимстве к Инцендии Чорда.
- guid: b9692caf-cb2a-4b75-b214-13eb6f6792a8
  length: 286
  text: Вольный Торговец Теодора фон Валанциус изъявила желание лично встретиться с человеком, недавно доставленным на борт ее пустотного флагмана. На горизонте династии сгущаются тучи, и Лорд-капитану есть о чем поведать свое{mf|му|й} наследни{mf|ку|це} — если такая возможность предоставится.
- guid: b97d79e8-d736-407f-8c65-9097ed93a2c1
  length: 187
  text: Лорд-капитан бросил{mf|ся|ась} вперед, увлекая за собой солдат, и жуткая тень заступила им дорогу. Снег и тьма скрывали ее, превращая в едва различимый силуэт, источающий обещание смерти.
- guid: b9f6ee0e-439c-445b-9d37-479ce9caa8cf
  length: 179
  text: Лорд-капитан отбил{mf||а} атаку на Зарков. Источник угрозы скрывается в руинах, в которых начались раскопки по приказу Вольного Торговца. Тех самых, где обрывается след Себериана.
- guid: bad067d3-e79e-4f4d-9b9f-868fb0cde403
  length: 210
  text: Злобная ведьма Кикеросс желает покарать Тервантьяса и лично расправиться с его нов{mf|ым|ой} чемпион{mf|ом|кой} — Вольный Торговцем. Лишь убив ее, Лорд-капитан купит себе драгоценное время для побега из Прорвы.
- guid: baebd976-7917-4e69-a525-f76a0e302ffa
  length: 150
  text: Вольный Торговец нанял{mf||а} моторных вандалов для охраны периметров городов-ульев. Несмотря на сделку, порой происходят грабежи и нарушения порядка.
- guid: baefecf4-66f8-4d5a-afb2-5b321ffed1c5
  length: 146
  text: Вольный Торговец сделал{mf||а} Лекс Империалис столпом веры на Даргонусе. Дисциплина и послушание стали самыми чтимыми добродетелями среди паствы.
- guid: bafededb-1e64-42be-83ae-d6beb36b21d9
  length: 330
  text: Благодаря тому, что Лорд-капитан приказал{mf||а} начать операцию стремительным броском всех основных сил, враг был рассредоточен, и не все отряды Несущих Слово успели отступить к Машинному храму. Они были рассеяны по полю боя и не могли ударить единым ударным кулаком. Это давало нам шанс окружить и задавить их отряды поодиночке.
- guid: bbb42675-77fa-499a-bd13-fbc479721ee3
  length: 94
  text: Вольный Торговец хитростью ослабил{mf||а} моторных вандалов и очистил{mf||а} пустоши от врага.
- guid: bbfcabf8-0fd8-4d8f-8d6c-6a743cd4e4c4
  length: 414
  text: Даже местные чураются вашей компании. За целый день вам так и не удалось ни с кем поговорить — все либо молча отворачиваются, спеша по своим делам, либо с отвращением отскакивают, едва вы подходите ближе. Быть может, все дело во внешнем виде — с мутного отражения в стеклянной переборке на вас смотрит {mf|бродяга|бродяжка} с всклоченными волосами, помятым закопченным лицом и в ободранных дурнопахнущих лохмотьях.
- guid: bc0983df-80ec-480f-aec4-77e08fc7e1ea
  length: 461
  text: Старшие офицеры всех палуб подали общий рапорт мое{mf|му|й} благословенно{mf|му|й} Лорд-капитану. Согласно отчетам всех служб корабля, шансы благополучного исхода прыжка к Порту Странник равны нулю. От лица всего экипажа они сообщили, что служить под командованием наше{mf|го|й} славно{mf|го|й} предводител{mf|я|ьницы} было честью для них и, если такова е{mf|го|е} воля, они готовы идти вперед и встретить смерть. Слава династии Валанциус и его отважным слугам!
- guid: bc130bf3-a927-41fd-8477-ee503bd01acb
  length: 177
  text: '...использовал{mf||а} свою позицию, чтобы арестовать причастных и отправить их под трибунал, пренебрегая при этом сложной субординацией между Астра Милитарум и Имперским флотом.'
- guid: bc348eee-b317-4c91-96d5-96dbdd8cf802
  length: 291
  text: Невероятное богатство находится в руках династии фон Валанциус — и ему суждено стать фундаментом для великих планов Вольного Торговца. Даргонус будет перестроен в торговый и политический центр сектора, откуда его сиятельн{mf|ый|ная} влады{mf|ка|чица} распространит свою волю на весь Коронус.
- guid: bca67e72-f98e-4131-ab02-6ba6fcd8830e
  length: 71
  text: Вольный Торговец сделал{mf||а} новым настоятелем воинственную Лугналию.
- guid: bd0969db-767d-455c-afd5-ac0466bd8f61
  length: 231
  text: Оперевшись о балку, Вольный Торговец делает несколько глубоких вдохов, пытаясь продышаться. Затем выпрямляется, разглаживает форму и направляется к одно{mf|му ему|й ей} известной цели. Сервочереп неотступно следует за {mf|ним|ней}.
- guid: bd1037b4-d429-4d76-8590-b1253a588efa
  length: 119
  text: Разрешил{mf||а} Хирургеону маджорис заморить людей до смерти, чтобы достичь опасных знаний о природе нечестивых хворей.
- guid: bd87c2bd-ab76-48a1-ac8e-60e944b71b0c
  length: 252
  text: Капитан Зораэль, чудом избежавший страшной участи благодаря вмешательству {mf|помазанника|помазанницы} Императора, пережил падение Музеона и вернулся к боевым братьям. Знания, которые он принес с собой в орден, помогли ксеноборцам в грядущих сражениях.
- guid: bdac470e-bb53-4fb5-9bfc-c719050c8c0c
  length: 336
  text: Династии фон Валанциус была дарована привилегия стать наместниками Простора. Вольный Торговец вел{mf||а} завоевательные походы против анклавов ксеносов и еретических логовищ. В оскверненных системах знаменитый почитатель Губительных сил Каррад Валл собирал рати, чтобы бросить вызов Защитни{mf|ку|це} Кредо. Предстояло великое сражение.
- guid: bdf21406-390a-4674-b1f6-50d3dd704259
  length: 47
  text: Попросил{mf||а} Номос прекратить убивать людей.
- guid: be751b50-a77d-4fdc-a6b3-ec8680052257
  length: 71
  text: Научил{mf||а} Номос, что у каждого своя цель и все они ценны по-своему.
- guid: bea704b6-fd7f-4c3e-b8c3-3a699ea626a8
  length: 264
  text: Даргонус был подвергнут чудовищному разграблению, миллионы были преданы смерти, кровь затопила ульи. Когда сокровища фон Валанциусов были похищены, обитель предател{mf|я|ьницы} Человечества была разбомблена с орбиты циклонными торпедами. Некогда славный мир погиб.
- guid: bea8657d-9dfd-4e5f-8fb7-7408d83f7d28
  length: 173
  text: То были верные слова. Ибо ценил Он своих избранных слуг, что творили немыслимое и подносили Ему великие трофеи. Из таких был{mf||а} Домин по натуре своей, и то ведал каждый.
- guid: bf23de58-b1d8-423e-9191-9a409f70c4d3
  length: 180
  text: Вольный Торговец принес{mf||ла} клятву Императору, что не станет исцелять свои раны, покуда не очистит корабль от ереси. Да ниспошлет Защитник Человечества сил свое{mf|му|й} слуге!
- guid: bf371c0a-baad-4812-91bf-51a0fc0be072
  length: 56
  text: Призвал{mf||а} Инцендию покаяться в своих преступлениях.
- guid: bf7984bf-dbc0-4752-a1fb-aecb6ee7d7a8
  length: 322
  text: Простор еще не видал воинов столь искусных и неприхотливых, как сыновья и дочери Заркова. Пираты Пустотного Братства сулят достойно отплатить за возможность нанять зарковцев для исполнения своих черных замыслов. Кто как не помазанни{mf|к|ца} Бога-Императора вол{mf|ен|ьна} попрать законы Империума для выгоды протектората?
- guid: bfd674e2-a650-42a7-bbe8-7684a47feff3
  length: 243
  text: Из последних сил я тянусь к осколочному карабину, стреляю Жертве в упор прямо в лицо... Кристаллический снаряд проходит в волоске от {mf|его|ее} головы. Под сокрушительным ударом мое великолепное оружие с траурным хрустом обращается в обломки.
- guid: c0171880-4a58-42ee-bf05-36450b675e89
  length: 51
  text: Уничтожил{mf||а} Райкад Минорис орбитальным ударом.
- guid: c02dad99-7480-46b4-a5a1-7dbdaa60fc3b
  length: 47
  text: Взял{mf||а} пиратов-заключенных в свою команду.
- guid: c043d12c-4181-4e93-9665-0a8be572b71f
  length: 76
  text: Запретил{mf||а} губернатору Заркова делать ножи из трупов железных ксеносов.
- guid: c05e62db-8b99-49ec-b28e-31cdfe61be67
  length: 623
  text: Выбрав следовать заветам Адептус Механикус, Вольный Торговец дозволил{mf||а} аугментировать лишь избранных офицеров. Элите были доступны самые лучшие импланты, покуда чернь погибала от увечий на нижних палубах. Кровавые бунты простолюдинов происходили чаще, однако же, блюстители, чьих тел коснулось благословение Бога-Машины, подавляли их жестоко и эффективно. Ключевой персонал, оборудованный лучшими краниальными разъемами, мог подключаться к системам судна, повышая его боевую эффективность — сопряженные с кораблем вокс-офицеры мгновенно передавали информацию канонирам и пушкарям, ставшим подобными деталям в орудиях.
- guid: c0608e7a-cd44-4c80-bf51-9bbf1a20677c
  length: 294
  text: Атака на Даргонус, организованная мстительными ксеносами, была остановлена совместными усилиями Лорд-капитана и {mf|его|ее} подданных. Миру-столице понадобится время на восстановление, однако гибель одного из предводителей рейдов и бегство другого означает хотя бы временное прекращение рейдов.
- guid: c06237dc-e83d-4525-96f2-ea4f42f9e606
  length: 54
  text: Казнил{mf||а} навигатора Ханна и мутировавшую команду.
- guid: c08f6658-5c9d-4983-98f0-17289f96b407
  length: 438
  text: 'Клан одной из макропушек бьет тревогу: вентиляционные системы отсека принесли миазмы жуткой болезни, которая ежеминутно косит десятки людей. Ужаснее всего то, что мертвецы поднимаются на ноги и нападают на живых, а некоторые трупы и вовсе теряют человечий облик, превращаясь в кошмарных варп-тварей. Отправлять в отсек отряды подобно самоубийству — только бесстрашн{mf|ый|ая} Лорд-капитан и {mf|его|ее} свита может остановить эту напасть!'
- guid: c0998e56-c003-49e9-8c2a-8d63e74cf488
  length: 74
  text: Призвал{mf||а} Каллигоса вместе упиваться резней эльдаров на Кетца-Темере.
- guid: c120122a-0852-4e34-bae6-446ac8312e10
  length: 95
  text: '...смог{mf||ла} лишь слепо броситься в бой, словно пытаясь сбежать от незримых преследователей.'
- guid: c1e1b65f-b330-4420-9780-15984a491b28
  length: 283
  text: 'Один шаг — и неизвестная сила заметила Лорд-капитана, схватив и протащив {mf|его|ее} сквозь искривленное пространство картины. Теперь глаза Лорд-капитана видели ясно: мрачная тень давно усопшего навигатора склонилась над Кассией и, стиснув в когтистых пальцах ее тонкую шею, кричала:'
- guid: c2212e2a-dcd3-4e18-bd78-6f1e12953303
  length: 553
  text: 'Сенешаль Абеляр Версериан — один из ближайших сподвижников почившей Теодоры фон Валанциус. Он провел десятилетия, служа благу протектората Вольного Торговца, и явно намерен провести еще столько же, зорко следя за каждым нерадивым служкой или недостаточно вышколенным офицером.

    Абеляр не подает виду, но гибель Теодоры, которой он верно служил долгие годы, серьезно потрясла пожилого сенешаля. Он готов на все, чтобы {mf|преемник|преемница} Теодоры добил{mf|ся|ась} успеха и стал{mf||а} блистательным Вольным Торговцем, достойн{mf|ым|ой} предшественницы.'
- guid: c232e9f7-52e0-4165-accb-6bddc6f6e7a3
  length: 109
  text: Вольному Торговцу удалось улизнуть из Прорвы. Теперь е{mf|му|й} предстоит найти способ покинуть Темный город.
- guid: c277877b-d028-416f-8105-69d1f560a2f6
  length: 382
  text: С годами, впрочем, многие в свите {mf|Его|Ее} Светлости заметили странные перемены поведения. Вольный Торговец вершил{mf||а} правосудие, будто не нуждаясь в сне и пище, но сохраняя молодость и телесную силу. Говорили, что единственным блюдом, угодным {mf|ем|ей}, было мозговое вещество осужденных преступников — деликатес, с которым {mf|Его|Ее} Светлость познакомила Инцендия Чорда.
- guid: c27af374-3d97-47c5-bd64-4666a467dfc3
  length: 83
  text: Приказал{mf||а} не трогать место раскопок Эмелины, бросив мир на потребу Архиврагу.
- guid: c29b3d97-cd45-472d-b709-7213d68739bd
  length: 81
  text: '...наследни{mf|к|ца} скомандовал{mf||а} обойти пирамиду, прорываясь к платформам.'
- guid: c2a1050b-8928-4b94-8a0f-16368bf855aa
  length: 94
  text: Вольный Торговец хитростью отвлек{mf||ла} опасного Чистоголосого пророка от его дурной миссии.
- guid: c2b7ec33-407a-47f3-972f-f090db98aa66
  length: 147
  text: Вольный Торговец переселил{mf||а} немочей в отдельные агрокомплексы, чтобы не обременять остальное население и предотвратить напряжение в обществе.
- guid: c2fb1d22-a097-49b2-a60d-e445c7caad7f
  length: 57
  text: Научил{mf||а} Номос, что вера в Императора превыше всего.
- guid: c33e8439-d611-4744-8e80-802d8b319a19
  length: 180
  text: Вернувшись с победой, Лорд-инквизитор поручил свое{mf|му|й} верно{mf|му|й} союзни{mf|ку|це} из династии фон Валанциус тяжкое бремя надзора за Простором. Пришла пора ему измениться.
- guid: c368f8f1-19fb-4a93-9e60-094d62479bba
  length: 82
  text: Объединил{mf|ся|ась} с бойцами на Веабосе-6, воззвав к их долгу перед Императором.
- guid: c385305a-7b7e-4673-92ac-2b8d57e359b6
  length: 120
  text: Вольный Торговец обратил{mf|ся|ась} к старым друзьям Теодоры, и те прислали на Даргонус закаленных астропатов-ветеранов.
- guid: c391294a-d483-41e9-b560-a205ed4c8180
  length: 75
  text: Потребовал{mf||а} назначить отцу Иеронимусу епитимью на трибунале Инцендии.
- guid: c3acf6b8-dd31-4856-8a7f-fcfea8bf33da
  length: 59
  text: Приказал{mf||а} сервиторизировать юного повстанца на Янусе.
- guid: c3ea5c3b-3cfc-4839-8b84-ea38a6a0f59c
  length: 58
  text: Пообещал{mf||а} пиратке Риззе расправу за ее преступления.
- guid: c4b9169d-49b4-44a2-bf45-e3fe414cfb1a
  length: 246
  text: Строгое следование законам и приверженность Вольного Торговца Имперскому кредо принесли {mf|ему|ей} великую славу. Каждый планетарный оборот на каждом мире Простора тысячи молитв возносились к Золотому Трону, славя имя Защитни{mf|ка|цы} Коронуса.
- guid: c4ba4b0d-b272-410c-9f37-0dd68c005b0a
  length: 62
  text: Отправил{mf||а} лекарства людям в карантинной зоне на Футфоле.
- guid: c56bbb40-555b-4c88-bc4c-244f168e0cb3
  length: 56
  text: Казни{mf|л|ла} губернатора Руолдо во славу Темных богов.
- guid: c59c1e35-167b-47cc-a4a5-5ef50abfa6e8
  length: 58
  text: Открыл{mf||а} разлагающим силам путь в транспортный отсек.
- guid: c5dd24a8-9309-4c6a-a1ac-4ccfecf28f8f
  length: 81
  text: Блюститель отшвыривает взбесившегося сервитора от Лорд-капитана, а {mf|тот|та}...
- guid: c6209da7-f3b3-4e73-a9af-99e9159de9b4
  length: 56
  text: Вернул{mf||а} бродяге в Комморре веру в Бога-Императора.
- guid: c62bc94b-1846-4d1f-87bc-271a5b6483ea
  length: 71
  text: Вольный Торговец уничтожил{mf||а} источник технопроказы атомным ударом.
- guid: c6715287-9160-4f2c-9997-01b37758d45a
  length: 299
  text: Видя в Вольном Торговце истинн{mf|ого|ую} чемпион{mf|а|ку} Темных богов, банда Несущих Слово обосновалась во владениях фон Валанциусов. Тысячи сходящих с ума писарей скребли стилусами по инфопластинам, записывая их нечестивое учение, тысячи воксов транслировали их страшные проповеди всему Простору.
- guid: c67812a3-e63a-4319-8662-f46ee392419f
  length: 508
  text: Поднявшись на капитанский мостик впервые во время варп-перехода, Лорд-капитан обнаружил{mf||а} дежурных офицеров в состоянии крайнего замешательства. С их слов, с мостика несколько минут поступали команды, авторизованные Вольным Торговцем — хотя Лорд-капитана в этот момент на месте не было! Одна деталь особенно привлекала внимание — приказы были подписаны почившей Теодорой фон Валанциус. После детального расследования техножрецы решили списать странное происшествие на проявление капризов машинных духов.
- guid: c6845ffb-860f-4433-bbfb-d7846c0ab106
  length: 161
  text: Милостью Его, возглавил{mf||а} и осуществлял{mf||а} общее командование {g|Encyclopedia:RogueTrader}Вольный Торговец{/g} {name} из славной династии фон Валанциус.
- guid: c68da40a-0ec9-4d9d-b32f-151b0a5e0d12
  length: 157
  text: Если Вольный Торговец не желает ждать вместе с обычными просителями, {mf|он|она} вол{mf|ен|ьна} вернуться после Магнэ Ацессио и заверить грамоту без очереди.
- guid: c6ae4f5a-914d-4223-97dc-2fe1823e8689
  length: 53
  text: Забра{mf|л|ла} уникальный аугмент у старого рабочего.
- guid: c6b0d9b8-9ac7-4c6c-b7d1-d7cff50dda7b
  length: 86
  text: Научил{mf||а} Номос, что нужно нести свет и свободу, а не скармливать людей чудовищам.
- guid: c6c84dd7-1552-40e6-97fd-dfc496d728dd
  length: 76
  text: Шептал{mf||а} слова скверны во время сакральной церемонии культистов смерти.
- guid: c6d802f2-ca81-445d-85c4-4afc14e35683
  length: 216
  text: Когда со всех сторон враги обрушились на протекторат фон Валанциус, лишь юный Эвейн не участвовал в этой жестокой расправе и принял под защиту многих беглецов, запятнавших себя службой изменни{mf|ку|це} Человечества.
- guid: c7001d3e-f484-445f-85dc-0d77c2278aa6
  length: 30
  text: '...осмотрел{mf||а} сервиторов.'
- guid: c77f8619-8ca9-43d1-af6a-9162edb7fc2b
  length: 142
  text: Вольный Торговец использовал{mf||а} варп-вокс, чтобы подслушивать козни еретиков, однако эта прослушка стоит жизней многочисленных операторов.
- guid: c792b955-a468-4294-8351-30748ee8e1da
  length: 71
  text: Одобрительно отозвал{mf|ся|ась} о торговле ксеноартефактами на Футфоле.
- guid: c7c4a863-d332-4fae-9522-0670e925cd1f
  length: 69
  text: Забрал{mf||а} подчиненное орудие Хаоса с Кьявы Гамма себе на корабль.
- guid: c7e54f2f-36c4-4d1d-b24e-abd9e403ec97
  length: 155
  text: Вольный Торговец выгнал{mf||а} карательный отряд Ордо Ксенос с Януса, однако на планете началась череда мелких неурядиц, напоминающая спланированную месть.
- guid: c7f46031-320b-460e-af25-9b2d7a5f862c
  length: 104
  text: Вольный Торговец приказал{mf||а} постричь сотню мальпийцев в Орден Молота, невзирая на протесты монахов.
- guid: c815b51b-d7ff-4789-9c0a-a73065817f01
  length: 39
  text: '...сообщил{mf||а} об отмене экспедиции.'
- guid: c8511652-99c6-456c-ad6d-c9c1c3a70ede
  length: 561
  text: 'К моменту прибытия {mf|Его|Ее} Светлости сервиторы продолжали находиться в той же позиции, которую заняли при поступлении в отсек: выстроившись в длинную цепь в форме спирали и обратившись лицами к центру странной формации. Спустя мгновение после того, как {mf|Его|Ее} Светлость переступил{mf||а} порог входных врат, тела пришли в движение: словно по команде сервиторы развернулись к Лорд-капитану! Наблюдающие за содержанием дефективных единиц техноматы даже схватились за оружие, однако сервиторы замерли, уставившись пустыми глазами на {mf|Его|Ее} Светлость.'
- guid: c8a0842d-d8ad-4149-a93f-ddb880b6179e
  length: 138
  text: Вольный Торговец получил{mf||а} приглашение от маршала Стракса с просьбой как можно быстрее прибыть на Даргонус и явиться в Администратум.
- guid: c8c3306d-9b3c-49d6-8e58-896c7542644a
  length: 69
  text: Приказал{mf||а} приютить в монастыре беженцев, прибывших на Фолстоун.
- guid: c99ef2b6-1a8c-4400-b931-91fa49b67e95
  length: 233
  text: Видя, что эльдар на борту последнего уцелевшего судна ждет неминуемая гибель, Ирлиэт взывает к Лорд-капитану, и голос ее едва слышно дрожит. Только Лорд-капитан способ{mf|ен|на} не допустить жестокой расправы над сородичами эльдарки.
- guid: ca037851-c60a-4d4a-a526-c7073c8e1548
  length: 316
  text: Цена применения ксеноартефакта была сочтена слишком высокой. Лорд-капитан собственноручно уничтожил{mf||а} пси-удушитель, сломив волю Идиры Тласс и заставив смириться с неизбежной гибелью. Угроза прорыва варпа оценивается как существенная. Требуется дальнейшее наблюдение за состоянием несанкционированного псайкера.
- guid: ca59cf16-1bcf-4ccd-a027-f25dca0a63b6
  length: 63
  text: Убедил{mf||а} архмилитанта послушаться служителей Экклезиархии.
- guid: ca959eba-ded9-4f91-97fe-c11fb9f4c42b
  length: 247
  text: На Эпитафии Соломон лицезрел, как его возлюбленн{mf|ый|ая} предает Человечество, и впервые в жизни лицо арбитра оросили слезы. Немыслимое горе разорвало его сердце, прежде чем участь куда более страшная смогла обрушиться на опустошенного проктора.
- guid: caa17b9b-d117-4bf6-b8cf-ce80d467b6fc
  length: 208
  text: Пустотный корабль под командованием кандидат{mf|а|ки} оказался в числе судов, использованных для доставки контрабандных грузов. Получив информацию о неправомерности логистической операции, кандидат{mf||ка}...
- guid: caa1e501-7c0f-43d5-aabc-e1998c74c56b
  length: 59
  text: Обосновал{mf||а} праведность Триасоматы самоотверженностью.
- guid: caaf9aac-6d40-4909-9c7a-9e5b7af73338
  length: 60
  text: Основал{mf||а} культ смерти Императора Пожинающего на Янусе.
- guid: cac91978-58e9-42aa-9917-46dc1616776c
  length: 110
  text: '...приказал{mf||а} расстрелять мертвый корабль издали. Ибо то, что рождено в огне, в огне же должно и сгинуть.'
- guid: cad1f807-7eb8-491a-951b-13a535ab97d6
  length: 389
  text: Иокаста Зауэрбэк была поражена вероломной изменой свое{mf|го|й} госпо{mf|дина|жи}. Но клятва верности не позволяла ей поднять оружие против свое{mf|го|й} Лорд-капитана. Посему Мастер дисциплины оставила пост и призвала двух доверенных телохранителей при оружии. Преданные слуги исполнили последний приказ Леди Зауэрбэк и помогли ей выйти из затруднительной ситуации, не уронив своей чести.
- guid: cadddb2b-41aa-499d-8647-0bd94456ad18
  length: 160
  text: Вольный Торговец заключил{mf||а} сделку с моторными вандалами, посулив плату за добычу. Подобное покровительство вызвало недовольство среди населения Даргонуса.
- guid: cb3cd0ef-4b05-49da-85f9-f1afb51a9c1c
  length: 57
  text: '...бросил{mf||а} в бой захваченный крейсер Эксплораторов.'
- guid: cbcb818d-6b6d-49cd-b629-3e0205fff7cb
  length: 113
  text: Вольный Торговец приказал{mf||а} Экклезиархии прекратить преследования малых культов, и гонения были остановлены.
- guid: cc1dce98-9763-419d-9d99-beff17020529
  length: 70
  text: Вольный Торговец повелел{mf||а} задавить малые культы Даргонуса силой.
- guid: cc23bf5f-c6e9-435a-90c7-190eb3a45d64
  length: 76
  text: Попросил{mf||а} дозволения вступить в ряды Инквизиции у Ксавьера Калькасара.
- guid: cc3b5fe2-e6f5-43ef-8100-f9b0ddef0c6a
  length: 47
  text: Заронил{mf||а} сомнения в душу отца Иеронимуса.
- guid: cc5abb8f-370b-4015-8e3a-1a217f4bc994
  length: 283
  text: Архикоролева Принцепс-Домина бежала в пустоши. Местные жители были крайне удивлены таким поворотом событий, однако безропотно приняли нов{mf|ого|ую} властител{mf|я|ницу} и с воодушевлением принялись собирать пожитки, дабы поскорее отбыть к звездам на стальных крыльях небесной птицы.
- guid: cc99b352-1a81-4e0e-93ff-279796d85298
  length: 315
  text: Пленение Ноль-Халифа повергло Механикус в трепет. Пав на колени перед полубогом в цепях, они утратили решимость и более не вмешивались в управление колонией. Обретая все большую дерзость, наместники Вольного Торговца получали доступ к таинствам, недоступным мирянам, и передавали их свое{mf|му|й} госпо{mf|дину|же}.
- guid: ccb68873-1ee1-4808-b786-1541bd97b1e4
  length: 84
  text: '...направил{mf|ся|ась} к бездонному провалу, зиявшему у подножия ближайшего менгира.'
- guid: ccd85a99-befd-4007-97ce-67702d20fcd7
  length: 167
  text: Вольный Торговец пресек{mf||ла} найм беглых преступников. Дефицит квалифицированных кадров был восполнен специально обученными специалистами из числа матросов экипажа.
- guid: cd05a073-5709-4d95-a3ac-ea9a6d26d531
  length: 68
  text: Помог{mf||ла} Нунциусу узреть свет Бога-Императора на смертном одре.
- guid: cd0c8353-a8b8-4f5a-b6b7-355528dad024
  length: 109
  text: Виде{mf|л|ла} Домин среди них карту Судии, что выносит суждение, взвешивает и отделяет повинное от невинного.
- guid: cd1cfa82-6954-4c1f-ada9-9dc648291ad0
  length: 36
  text: Отпустил{mf||а} пиратов-заключенных.
- guid: ce1ccc20-b669-4eb8-a629-756485e7fcba
  length: 76
  text: Мы все были готовы погибнуть в тот час, и Лорд-капитан повелел{mf||а} нам...
- guid: cf52524f-48a7-456c-a009-06ee3681df4c
  length: 113
  text: Трупная вытяжка, которую рискнул{mf||а} испить Вольный Торговец, оставила после себя лишь недомогание и слабость.
- guid: cf877293-f93f-489e-918f-5e92dc548752
  length: 49
  text: Организовал{mf||а} братство ухода за сервиторами.
- guid: d008da4d-7ae0-4629-8ae9-4c3637ed8d89
  length: 181
  text: Вольный Торговец разгадал{mf||а} принцип управления антигравитационными плитами. На каждую нанесен управляющий глиф. Его активация пробуждает маяки прибытия на доступных платформах.
- guid: d0100877-23e2-445f-b64d-fa86e227293f
  length: 497
  text: Очередная вахта на борту пустотного корабля подошла к концу. Лорд-капитан, отдав последние распоряжения, отправил{mf|ся|ась} в свои покои для благословенного отдыха. Впрочем, дрема Вольного Торговца была нарушена изуверскими ночными кошмарами, охватившими {mf|его|ее} разум. Провидение вовремя выдернуло Лорд-капитана из когтей мучительных варп-грез... лишь для того, чтобы лицезреть, как кошмары просочились сквозь неверную оболочку поля Геллера и облеклись плотью в святая святых корабля! К бою!
- guid: d027ce5d-7483-4430-9623-4cc619899d6c
  length: 227
  text: На мире Эпитафия Ирлиэт Ланэвисс завершила свой Путь Изгоя. Бесстрашно обратив оружие против мон-кай, подтвердивше{mf|го|й} дурную славу своей ущербной расы, она погибла с честью, как полагается воительнице благородного народа.
- guid: d02e66cf-383b-4e75-8211-b315ecaba943
  length: 52
  text: Приказал{mf||а} арестовать юного повстанца на Янусе.
- guid: d043f1ae-d2e4-491f-bbab-81db93de2a16
  length: 150
  text: Калькасар передал, что готов ко встрече с Лорд-капитаном. Он ожидает {mf|его|ее} во дворце Наместника на Футфоле, превращенном в его оперативный штаб.
- guid: d1012a58-115e-48eb-916b-7ce987dc8a4f
  length: 22
  text: Месть выживше{mf|го|й}
- guid: d105f321-7216-49ba-98f2-c9a70bdbb400
  length: 35
  text: Пообещал{mf||а} Неумирающему ничто.
- guid: d13d6e82-31c0-43b6-a72b-191e2c48cebc
  length: 371
  text: Стоя перед {mf|тем|той}, кого прежде называла сво{mf|им|ей} Лорд-капитаном, Идира Тласс провела последние мгновения жизни в мольбах забрать ее с собой. Она готова была присягнуть звездному божеству, отринуть Человечество... Но она более была не нужна хозя{mf|ину|йке}. Осколок К'тан, питавший нелюбовь ко всякому проявлению силы Имматериума, истребил ее с особым тщанием.
- guid: d18de47a-8b8a-4a3f-8e9a-9f75d6b61c7b
  length: 257
  text: Сердце Кассии было раздроблено в пыль предательством возлюбленно{mf|го|й}. Содрогаясь от ужаса и избегая прикосновений холодной руки того, кто прежде звался Лорд-капитаном, она широко распахнула третий глаз и сгинула в чудовищной манифестации мощи Эмпиреев.
- guid: d1b73401-1092-4ac8-a7d2-7c8d1ca9d368
  length: 123
  text: Вольный Торговец выкупил{mf||а} у Адептус Механикус пси-активных техножрецов и отдал{mf||а} их на исполнение Процедуры 0-Х.
- guid: d2021647-3dd3-4990-9e50-e453f5951e7f
  length: 75
  text: Запомнил{mf||а} богохульную проповедь космодесантника Хаоса на Кьяве Гамма.
- guid: d20884a4-5d33-43b0-8035-790c451f7a89
  length: 738
  text: Висирь Кровавой паутины Кибелла свершила великий расклад Таро Императора, и карта Владыки мечей указала ее культу новый путь и новое учение. Облачившись в золото и помазав лица кровью, ткачи вышли на верхние палубы и присвоили власть и почтение, что полагались им, избранным слугам Неумирающего. Окружив священн{mf|ого|ую} Домин барьером острых клинков, ткачи стали {mf|его|ее} гвардией и новой корабельной знатью. Гордые офицеры гнули жесткие шеи перед ними, простолюдины наполняли их кубки своей кровью. Кровавая паутина протянули нити на все миры династии, избирая новобранцев среди отмеченных сильной и благородной кровью. Расклад Висиря сулил мрачные перемены, и Кровавая паутина готовилась встретить их многочисленной и вооруженной.
- guid: d293e7dd-6fb9-47cb-84d4-d5b67a36cda0
  length: 105
  text: Лорд-капитан призвал{mf||а} свои знания о зловещем влиянии Хаоса, желая побороть страх холодным анализом.
- guid: d2be7572-b53b-4d52-b825-f11b3fa38b1a
  length: 24
  text: Учени{mf|к|ца} проклятых
- guid: d3649983-7c4d-4bc1-a164-18bb4fb772c1
  length: 86
  text: Предложил{mf||а} направить Наместника Владайма в штрафной отряд на трибунале Инцендии.
- guid: d38c23dc-4473-468d-a410-c2702207b756
  length: 52
  text: Приказал{mf||а} освежевать юного повстанца на Янусе.
- guid: d3b8d851-f268-4275-9d6b-4f2f977bfbe3
  length: 222
  text: Первым шагом в борьбе с мятежниками стало вытеснение их подполья из столицы и крупных городов. Благословенн{mf|ый|ая} Императором Лорд-капитан рассмотрел{mf||а} несколько методик борьбы, после чего избрал{mf||а} наилучшую.
- guid: d4352c84-aa16-4972-80e1-a29f70394771
  length: 54
  text: Позволил{mf||а} солдатам Заркова устроить поножовщину.
- guid: d43d04b7-7e52-45de-87ad-a73a440ac1a2
  length: 72
  text: Убедил{mf||а} сержанта Малгара сложить оружие и не убивать аристократов.
- guid: d440eaac-23fe-4522-914f-f8635eaf7047
  length: 115
  text: Лорд-капитан попытал{mf|ся|ась} выстроить на пути страха плотину из логики и знания о чудовищных наваждениях Хаоса.
- guid: d45355b1-d074-4e5a-ac17-9de7e2b4251d
  length: 445
  text: Впереди ждала неизвестность. Света люменов хватало только на то, чтобы увидеть гладкие стены, уходящие в темноту глубоко внизу, и бесчисленные платформы, парящие над пустотой. Я отказался подвергать свою персону опасности ради разведки, и потомок был{mf||а} вынужден{mf||а} отдать приказ простолюдинам. Лишенные благословенной аугментики, слуги срывались и соскальзывали в пропасть, но все же выжившие сумели обнаружить в стенах скрытые проходы.
- guid: d48beeaf-b658-49f4-be25-43d39481a3e7
  length: 52
  text: Напал{mf||а} на Ирлиэт, раскрыв ее истинную природу.
- guid: d4972777-852f-44ea-aceb-6be7c1607c11
  length: 76
  text: Поведал{mf||а} Домин, что приш{mf|ел|ла}, чтобы отыскать и спасти свою тень.
- guid: d4dbcb88-15ee-49f9-92e1-39eb73f46892
  length: 91
  text: Лорд-капитан обнаружил{mf||а} древние засечки, оставленные {mf|его|ее} легендарным предком.
- guid: d5356b0f-aa79-4fcc-ae2f-73c09f21ef82
  length: 128
  text: '...направил{mf||а} корабль в суицидальную атаку, дав остальным силам Империума время для перегруппировки и подготовке к обороне.'
- guid: d56f0fe1-c1c2-4043-ab6e-4214053b652a
  length: 50
  text: '...подош{mf|ел|ла} ближе, дабы рассмотреть фигуры.'
- guid: d58daa31-bb37-45ec-8523-72d16ee6863c
  length: 124
  text: '...наш{mf|ел|ла} способ перехватить груз и выкрасть его в космической гавани с привлечением третьей неустановленной стороны.'
- guid: d5f7994c-f27a-472d-8622-43470041a17b
  length: 518
  text: Каждая минута, проведенная на борту, грозила обернуться бедой. Корабль жил свои последние дни, а может, даже часы. Со всех сторон доносились звуки далеких обвалов, пол под ногами то и дело подрагивал. Лорд-капитан торопливо двинул{mf|ся|ась} вглубь исследуемого отсека, как вдруг легчайшее дуновение теплого воздуха коснулось {mf|его|ее} шеи, и рядом прозвучал тихий полувздох. Будто кто-то наклонился к самому уху, обдав горячим дыханием, набрал в грудь воздуха, чтобы прошептать темный, манящий секрет... и замолчал.
- guid: d6132ad8-a2bf-436f-ae06-d5fb5c650e19
  length: 267
  text: Владайм хочет устроить западню, чтобы выманить Инцендию Чорда с ее трона и покончить с ней. После того, как Лорд-капитан завершит подготовку к битве, е{mf|му|й} нужно будет сообщить Наместнику о готовности и отправить Инцендии через своих агентов информацию-приманку.
- guid: d62bf195-2cf3-4d20-a493-bf55484bb350
  length: 345
  text: Спустя годы, когда тело Вольного Торговца было уже не способно удержать смертную душу, дарована была последняя награда. За нечестивые злодеяния, чудовищные жертвоприношения и жуткие клятвы Губительные силы вознесли {mf|Его|Ее} Светлость в Эмпиреях, где преобразили в ужасающ{mf|его|ую} кня{mf|зя|гиню} демонов. Великое восхождение было свершено.
- guid: d64eba9e-6107-4270-91cc-67a77f3b027d
  length: 302
  text: Выступив против Империума, Вольный Торговец сплотил{mf||а} вокруг себя всех еретиков и врагов Кредо в Просторе. Никто не смел оспорить первенство хозя{mf|ина|йки} прирученного звездного чудовища, и под твердой {mf|его|ее} рукой создавалось новое воинство Губительных сил, спаянное ужасом и покорностью.
- guid: d70d50c1-277c-4a19-8d19-a0a1135d36ca
  length: 62
  text: Преодолел{mf||а} сокрушающее отчаяние Кассии своей силой воли.
- guid: d76464e5-3972-42ca-8959-70bc692cd5ec
  length: 52
  text: '...выстрелил{mf||а} в варп-линзу, уничтожив ее чары.'
- guid: d7793bed-eeb2-4f02-ac76-9a4f54b40be2
  length: 150
  text: Тервантьяс готов покровительствовать Лорд-капитану. Но для этого е{mf|му|й} предстоит преподать урок культу ведьм, убив нескольких их бойцов на арене.
- guid: d7dc1738-0712-41e1-b1c9-21f81917105a
  length: 308
  text: 'Офицерский пост: Ирлиэт здесь. Это — такие же врата, как те, что ты видел{mf||а} на Лилэтан. Дети Азуриана странствуют по пустоте посредством этих конструктов, возведенных в древние времена. Путь судна, проникшего сквозь подобный портал, пролегает по извилистым путям, что способны постичь лишь мои собратья.'
- guid: d86deeca-6454-4ed0-87a3-226a322d3057
  length: 140
  text: Едва Лорд-капитан делает пару шагов, как {mf|его|ее} за рукав хватает Идира. Глаза псайкера расширены, а взгляд устремлен куда-то в пустоту.
- guid: d8cc3dbb-8efb-4580-9a95-6d99ed0454cf
  length: 59
  text: '...всмотрел{mf|ся|ась} в странные завихрения бурого тумана.'
- guid: d92295de-e9f2-454b-b35c-10852dfd9e19
  length: 69
  text: Безошибочно определил{mf||а} отношения дворянских родов на Даргонусе.
- guid: d92deb8c-924a-477f-9ef8-b38f1a0f4869
  length: 79
  text: Дал{mf||а} Заре понять, что она идет против посланн{mf|ика|ицы} своего владыки.
- guid: d9613c97-faa8-4292-b0eb-e0d1b9c54537
  length: 90
  text: Казнил{mf||а} Ирлиэт, после того как расправил{mf|ся|ась} с остальными эльдарами на Янусе.
- guid: d96a3973-b7bb-4b36-a823-a65e1464ad49
  length: 59
  text: Восславил{mf||а} Экклезиархию в беседе с отцом Иеронимусом.
- guid: d9886af7-403a-425d-9737-8e3e30fcd6af
  length: 58
  text: Научил{mf||а} Номос, что важнее всего — служить Империуму.
- guid: d98ece71-9491-4de7-9fa3-c3a3381ef300
  length: 140
  text: Инквизиция вступилась за Вольного Торговца, обманом и силой достав для сво{mf|его|ей} союзни{mf|ка|цы} псайкеров, служивших иным правителям.
- guid: da46da5e-83dd-42bb-8baa-660331817cff
  length: 98
  text: Вольный Торговец избавил{mf|ся|ась} от схизматикалей и инфоангелов, полностью очистив Кьяву Гамма.
- guid: da65dcdd-ae79-4a85-b97f-f45204475d20
  length: 53
  text: Сказал{mf||а} Номос, что их цель — служить Империуму.
- guid: da98f1a5-d9d2-4b36-acfc-40b69a600bbf
  length: 75
  text: Взмолил{mf|ся|ась} к Императору, чтобы выбраться из горы трупов в Комморре.
- guid: db204874-b33c-497f-bd6c-ef4bd81926c2
  length: 57
  text: Даровал{mf||а} протекцию союзу людей и эльдаров на Янусе.
- guid: db50d9f9-9e0d-4032-9543-98e470b6f53b
  length: 368
  text: 'Лорд-капитан был{mf||а} милосерд{mf|ен|на} — каждому из пленников выдали по однозарядной лазерной фузее и штыку, после чего отдали приказ: взять крейсер любой ценой. Уговор с ними был такой: те, кто уцелеет в атаке заслужат прощение Императора и смогут вступить в ряды освободительной армии. Щедрое предложение — во время войны, разговор с предателями обычно короткий.'
- guid: db8dc108-00b4-444c-a9f5-70e0d079737e
  length: 79
  text: Приказал{mf||а} уничтожить тассерций и обрушить на мир священный экстерминатус.
- guid: dbc659b8-7708-4915-b062-9a5e22953632
  length: 290
  text: Навигатор возблагодарил Бога-Императора, что Лорд-капитан наконец-то ответил{mf||а}. Похоже, корабль попал в зону временной аномалии, и только корабельные псайкеры не поддались ее пагубному действию. Варп полон загадок, но эта наконец-то разгадана и готова отпустить корабль в реальный мир.
- guid: dc0a7079-6168-4d58-a9df-8124c8f852d9
  length: 404
  text: Каждое действие Лорд-капитана, будь то наклон головы, взмах рукой или шаг в сторону, дефективные единицы повторяли без задержки и тени сомнения, словно чудовищные марионетки, управляемые невидимым кукловодом. Чуть менее минуты мы наблюдали за этой пантомимой в гнетущей растерянности, пока, наконец, сервиторы не замерли. Не видя с их стороны угрозы, Вольный Торговец уверенно приблизил{mf|ся|ась} к ним.
- guid: dc581efe-8f80-4965-b287-e43060df4698
  length: 152
  text: Виде{mf|л|ла} Домин среди них карту Потерянного дитя, что утратило корни свои, и опору свою, но таит в себе скрытое до поры обещание обрести их однажды.
- guid: dc68b055-4785-483a-aebb-2607d94268ea
  length: 95
  text: Сказал{mf||а} Хейнриксу не использовать биомантию на мутанте, чтобы не продлевать их страдания.
- guid: dcaa7ea9-771c-44bb-a0b1-aa97666311da
  length: 83
  text: Призвал{mf||а} архмилитанта следовать собственным убеждениям, не слушая окружающих.
- guid: dce67bfe-4bec-4ff2-900f-15b929cd78c1
  length: 115
  text: Объяснил{mf||а} архмилитанту, что неравенство слуг и господ есть установленный Богом-Императором нерушимый порядок.
- guid: dd38c16c-2152-48d0-a67e-0229db910614
  length: 110
  text: Странное сборище в центре Футфола вызывает вопросы. Вольный Торговец пожелал{mf||а} разузнать, что происходит.
- guid: dd4d9646-2657-4b0b-b2ec-1c039886d9d8
  length: 108
  text: И все же надежда оставалась, ибо втор{mf|ой|ая} наследни{mf|к|ца} династии Вольных Торговцев уцелел{mf||а} –
- guid: ddab2ecd-374f-4c46-9cf3-477b2e77c75f
  length: 91
  text: Вспомнил{mf||а} о своем долге перед соратниками, чтобы выбраться из горы трупов в Комморре.
- guid: dded71a3-aaba-41d7-8f26-0629e85094b6
  length: 110
  text: Принес{mf||ла} обет Богу-Императору терпеть раны и превозмогать боль, пока корабль не будет очищен от скверны.
- guid: ddefb451-7cb4-4356-9ff1-82bf4353bd77
  length: 162
  text: Верные слуги почтенного губернатора Вьятт заверили Лорд-капитана в своей полной и беспрекословной преданности и готовности послужить е{mf|му|й} наилучшим образом.
- guid: de97f6fa-e4b8-4789-bfd1-d8148a11118d
  length: 67
  text: Наблюдал{mf||а} как обезумевший офицер-предатель корчится в агонии.
- guid: deb3d2b4-8850-4d01-8fd6-6bcd65f4cdca
  length: 361
  text: Таков конец хроники несостоявшейся экспедиции в глубины Зева. В мудрости своей мо{mf|й|я} благословенн{mf|ый|ая} госпо{mf|дин|жа} смилостивил{mf|ся|ась} над своими верными слугами и уберег{mf||ла} их от ужасов бушующего Имматериума. Какие бы скорби не ждали нас тут, в Просторе Коронус, мы встретим их с честью, а не сгинем в кипящих Эмпиреях. Слава Императору!
- guid: deb92dd1-65f8-4b63-864a-349c0034cf4d
  length: 166
  text: Кровавое гадание раскрыло Вольному Торговцу жуткое и загадочное преступление на е{mf|го|е} мире. Лепет безумного гадателя о зловещем враге сплотил обитателей колонии.
- guid: def63a79-bded-4977-a406-94d2bfe3d932
  length: 51
  text: Покаял{mf|ся|ась} преподобному Адальберту в грехах.
- guid: df154ad7-ddc4-44b7-a27c-8ea3388f3653
  length: 188
  text: '{mf|Его|Ее} взгляд был полон решимости — в тот момент все мое естество словно очнулось от дурного сна, в котором я завороженно и напряженно наблюдал за развернувшейся передо мной картиной.'
- guid: df25b2f0-c12d-417d-8fec-ce4179e97d12
  length: 232
  text: Надменный ксенос Злоба поможет Лорд-капитану, если т{mf|от|а} починит испортившийся конвектор, из-за которого ящероподобный нелюдь страдает от холода. Как бы ни было возмутительно данное предложение, это — реальный шанс на спасение.
- guid: df470343-71a1-431e-bf6a-da97062c1a6c
  length: 221
  text: Лорд-капитан провел{mf||а} слишком много времени в моровой яме нижних туннелей, и теперь {mf|его|ее} кожу покрывают воспаленные волдыри. Кто-то на флагмане должен знать, как очистить тело Вольного Торговца от сего недуга.
- guid: dfc1458a-b7ec-42b7-830b-251d4be469f1
  length: 43
  text: Размышлял{mf||а} о судьбах своих подданных.
- guid: dff2afb9-eb08-4f09-bf12-9521c7257d78
  length: 172
  text: '...выш{mf|ел|ла} на связь с предводителями пиратской флотилии и за значительное вознаграждение продал{mf||а} информацию о расположении наземных войск и актуальные позывные.'
- guid: e001bc09-47fb-4fbf-b120-00cd04f3034e
  length: 188
  text: В путешествиях Вольному Торговцу могут встретиться эльдары, бежавшие с Крудараха. Ирлиэт обещала вознаградить Лорд-капитана, если встретившихся на {mf|его|ее} пути эльдаров удастся спасти.
- guid: e0441b2c-2a1a-41c3-a304-8a8b1b2194a6
  length: 56
  text: Отправил{mf||а} часть десятины на помощь мирам Простора.
- guid: e0715a30-d301-4f7f-89eb-7906aa0307f1
  length: 179
  text: Ксенос Маражай Эзирраеш исчез без следа после того, как его могущественн{mf|ый|ая} покровитель{mf||ница} предал{mf||а} противное Богу-Императору создание в руки Святой Инквизиции.
- guid: e073baaa-b851-406e-9c3f-dbf0fe7e8591
  length: 55
  text: Обратил{mf|ся|ась} к слепому контрабандисту с добротой.
- guid: e0a0e481-737c-4492-bd48-8bf8eca45f83
  length: 41
  text: Казнил{mf||а} капитана Хротко за саботаж.
- guid: e0c79a83-f4d7-477e-8d00-22a72457723f
  length: 137
  text: Едва Лорд-капитан берется за вокс, как {mf|его|ее} хватает за руку Идира. Глаза псайкера расширены, а взгляд устремлен куда-то в пустоту.
- guid: e0c9ea9a-9aa6-496d-8667-b7a4f702af73
  length: 77
  text: Сообщил{mf||а} Пределу рассвета о своем желании вкусить мудрости Имматериума.
- guid: e0cde6ee-ce33-4a30-b861-638c56909ccc
  length: 317
  text: Милостью Императора мне поручено вести хронику похода, который мо{mf|й|я} благословенн{mf|ый|ая} госпо{mf|дин|жа}, Лорд-капитан {name}, намерен{mf||а} предпринять сквозь замутившееся варп-пространство Зева. Страх перед грядущим наполняет наши души, но все мы уповаем на свет Императора, да пребудет с нами Его защита.
- guid: e14838fc-06ad-45c1-a326-7e4de7430d59
  length: 73
  text: Вольный Торговец помог{mf||ла} Ордену Молота получить опеку над Горнилом.
- guid: e159fee4-c8c8-4ae3-aba7-119e658ff321
  length: 120
  text: Вольный Торговец сделал{mf||а} новым настоятелем мальпийца Инокранта, необыкновенно набожного человека простых взглядов.
- guid: e1c3afcc-1ebf-4068-822d-fd6e37bd7843
  length: 63
  text: Процитировал{mf||а} Уралону Жестокому отрывок из Книги Лоргара.
- guid: e21f52da-fe26-4f76-9035-bfdc9eeb34ed
  length: 152
  text: И открылись глаза тени Домин, и ответила она, что тоже ждала, и скучала, и что пусть заберет ее себе Домин, и она будет — {mf|его|ее}. Он — есть Смерть.
- guid: e230ef46-b91c-4836-91f3-96b83557e30c
  length: 265
  text: С высоты бесконечности Лорд-капитан рухнул{mf||а} на дно бурлящей бездны. В следующее мгновение {name} заметил{mf||а} две фигуры посреди клубящегося бурого тумана. Одна — неестественно тощая и высокая — стискивала в когтях фигуру поменьше, что-то гневно выкрикивая.
- guid: e2a4afc9-bef5-41a6-a87d-cab65d6c91ac
  length: 325
  text: Заполучив ручное божество, династия фон Валанциус стала доминирующей силой в Просторе. Конечно, весть об ужасном монстре, которым {name} фон Валанциус привел{mf||а} в трепет весь сектор, рано или поздно достигла бы Империума и привела к карательному походу, но... Вольному Торговцу было отпущено немало времени на подготовку.
- guid: e2aa7156-acca-4aad-a1e1-2a7524c19f9a
  length: 200
  text: Портал, указанный Ноктюрном Забвения, привел Лорд-капитана на празднество друкари. Необходимо понять, почему Арлекин выбрал именно это место и зачем доставил сюда Вольного Торговца и е{mf|го|е} отряд.
- guid: e316bd2f-4bc6-419c-8a7d-3bcb621429b0
  length: 127
  text: Вольный Торговец согласил{mf|ся|ась} уступить Маражаю смертельный удар, предназначенный архонту Опустошительной бури Иремерисс.
- guid: e330c740-6c5d-47f2-995b-c25011bd019c
  length: 66
  text: '...двину{mf|лся|лась} вперед, расталкивая мертвых сильными руками.'
- guid: e3a0f21d-14ed-4ddf-b060-59f71296889e
  length: 51
  text: Вольный Торговец приказал{mf||а} истребить немочей.
- guid: e3ff2095-3e6d-419c-a3c3-d608bb8eca2a
  length: 184
  text: Однако конфликт Империума и главы династии фон Валанциус не мог не сказаться на молодом ордене. Часть сестер потребовала от Ардженты отречься от прежне{mf|го|й} предводител{mf|я|ницы}.
- guid: e40b166f-1905-4078-ae46-7ef2920e7174
  length: 92
  text: Провел{mf||а} суд по делу Леди Моллес-Секандас, показательно казнив каждого участника тяжбы.
- guid: e4699b62-24d5-4110-a83d-1839d67ef93b
  length: 48
  text: '...смело ринул{mf|ся|ась} в бой, сокрушая врага!'
- guid: e47d30cc-2b07-480d-b5e4-8fd2feac9209
  length: 140
  text: Находится на мостике далее стало невозможно. Еще немного, и вздохи просто свели бы людей с ума. Лорд-капитан скомандовал{mf||а} отступление.
- guid: e4ce0dcd-ef25-4e71-af90-1700e223c4e3
  length: 69
  text: Отдал{mf||а} губернатору Вьятт астропатов для ее нечестивых ритуалов.
- guid: e52e7423-931c-4ddd-aab3-9f16e535152b
  length: 352
  text: Спустя несколько часов исследования корабля отряд Лорд-капитана столкнулся с препятствием. Где-то недалеко находился арсенал и хранилище средней палубы, но эта часть корабля сильно пострадала — повсюду виднелись искрящиеся обрывки кабелей, явно находящихся под напряжением. Продвижение дальше могло быть очень опасно. Тогда Лорд-капитан решил{mf||а}...
- guid: e54ca798-47e7-453b-af24-ad7ce6995f02
  length: 48
  text: Велел{mf||а} устроить бои в честь Магнэ Ацессио.
- guid: e5942fda-1f8c-4050-bd0c-bc506866ff5f
  length: 63
  text: Забрал{mf||а} обломок еретического клинка у Высокого фактотума.
- guid: e59750cb-e1f1-48be-8af3-35cc69196255
  length: 122
  text: Лишь внимательность Лорд-капитана и {mf|его|ее} спутников, загодя услышавших предательский треск, спасла солдат от гибели.
- guid: e5b61ee7-a1a6-484a-9dfd-49670312c2dc
  length: 185
  text: Сойдясь в схватке с неведомым врагом, коего невозможно было даже рассмотреть, Вольный Торговец нанес{mf||ла} несколько сокрушительных ударов, после чего жуткий недруг поспешил скрыться.
- guid: e606bba1-9f9f-4240-ab64-e3462bbbef64
  length: 263
  text: Шевельнулись скелетные пальцы, и из тьмы соткалась подле трона Его тень Домин. Скована она была черными цепями и погружена в сон. Молчал Неумирающий, ибо настал черед предлагать плату — ведь ничто не дарит Смерть без платы. И пообещал{mf||а} Неумирающему Домин...
- guid: e60a3761-cd1e-4689-bc95-7a362df1e664
  length: 53
  text: '...опустившись на колено, вознес{mf||ла} молитву Ему.'
- guid: e618e7ca-3c2b-45f5-9d6a-be327fb0d8ae
  length: 104
  text: Соратники Лорд-капитана хотят встретиться с {mf|ним|ней} в Яме, чтобы обсудить дальнейший план действий.
- guid: e64337df-bfc8-493d-83e0-4dbbc1394d7f
  length: 85
  text: Объяснил{mf||а} архмилитанту, что достойных условий в Империуме можно добиться силой.
- guid: e69603a1-d1e9-49bc-82fc-6795ea63a96b
  length: 41
  text: Заявил{mf||а} о том, что суд — фальшивый.
- guid: e6cf573f-42b1-433a-a34b-dca42fb41ebc
  length: 101
  text: Провел{mf||а} суд по делу Леди Моллес-Секандас, дозволив супругу преступницы решить участь обидчиков.
- guid: e6df9a17-622a-4ecc-816b-69fc825f6615
  length: 83
  text: '...повелел{mf||а} захватить контроль над священным судном, вырвав его из лап врага.'
- guid: e6e721ef-5f95-4238-b680-335c5c9401b4
  length: 61
  text: Убедил{mf||а} солдат сопротивления в Яме отринуть Императора.
- guid: e7201f83-a981-443a-a834-9dd9c210d2a6
  length: 35
  text: Лорд-капитан отдал{mf||а} приказ...
- guid: e734a71e-18ea-4611-bf70-7547e7123cc4
  length: 26
  text: Податель{mf||ница} свободы
- guid: e76ba5fc-f18b-487f-9246-0cb1f6ed3bfa
  length: 249
  text: Вольный Торговец направил{mf|ся|ась} вперед, чтобы отыскать огневую позицию, откуда будет видно сражение. Внезапно жуткая тень выскочила прямо на Лорд-капитана. Снег и тьма скрывали ее, превращая в едва различимый силуэт, источающий обещание смерти.
- guid: e7733ad9-3bf3-493a-9067-67f5c54ded0f
  length: 210
  text: Вольный Торговец попытал{mf|ся|ась} заманить карательный отряд Ордо Ксенос в ловушку на Янусе, но слуги Инквизиции смогли улизнуть. На планете началась череда мелких неурядиц, напоминающая спланированную месть.
- guid: e83e4bd8-c891-4c70-a7c5-30c9b63b3a92
  length: 81
  text: Убедил{mf||а} маршала встать на свою сторону, воззвав к верности Лекс Империалис.
- guid: e8a4a553-249d-46ff-b1ce-f12d7ae889ca
  length: 231
  text: Лорд-капитан бессильно откидывается назад, дав понять, что {mf|его|ее} силы на исходе. Медики реагируют мгновенно, выпроваживая растерянных офицеров. Те, оказавшись за дверью, разбредаются по своим постам — навстречу неизвестности.
- guid: e8cddefc-c2ab-49a5-9607-ec76324e1204
  length: 149
  text: Благодаря обнаруженным ранее уликам, Лорд-капитан имел{mf||а} сведения от {g|Encyclopedia:Lexmechanic}лексмеханика{/g} Винцелекса, упрощавшие задачу.
- guid: e9493f22-a17a-426e-ab23-307160b9d50f
  length: 172
  text: После вознесения надлежащих молитв, экипаж заслушал {g|Encyclopedia:Vox}вокс{/g}-обращение благочестиво{mf|го|й} Лорд-капитана, в котором наш{mf||а} повелитель{mf||ница}...
- guid: e98f3815-531c-493e-b031-fcadc5cddba1
  length: 58
  text: Вольный Торговец велел{mf||а} сделать Блаженных пастырями.
- guid: e9ce9386-b575-4bb9-87f3-5dafdb232642
  length: 364
  text: Новатор Кассия, не обладавшая железной волей и умением повелевать, не способна была дать решительный отпор, и возмущенные члены Дома Орселлио пошли на мятеж. Они желали свергнуть Леди Кассию и возвести на трон достойного защитника. Замысел их удался лишь наполовину — за смерть Кассии Вольный Торговец жестоко расправил{mf|ся|ась} с каждым, кто носил имя Орселлио.
- guid: e9e984a7-b4ad-4297-9bdf-fa1fe7a1fc7c
  length: 63
  text: Погасил{mf||а} недоверие солдат Заркова к блюстителям флагмана.
- guid: e9ed9104-27ae-43a8-aaa7-04c13392ca4a
  length: 71
  text: Обосновал{mf||а} праведность Триасоматы преданностью идеалам Империума.
- guid: e9f9ddd5-5baa-4cf9-940c-3b07ad9f27cf
  length: 651
  text: Кибелла, Второй ткач Кровавой паутины, преданно служила Висирю и Домин, но с годами тревожащие изменения все сильнее преображали ее. Увязнув в тенетах сомнений, Кибелла перестала касаться Таро Императора, ибо расклады его были устрашающими, противоречивыми и энигматичными. Неумирающий даровал ей иные знамения, являющиеся во снах, и Кибелла убивала все чаще и чаще, отправляя души к Императору десятками и сотнями. Она перестала говорить, приняв обет молчания, и доспехи ее покрыла корка ржавчины и запекшейся крови. В экипаже шептались, что она безумна, но никто не смел оказать сопротивление священной телохранительнице само{mf|го|й} Лорд-капитана.
- guid: ea659699-7c5c-4794-b191-1413d6c9860f
  length: 173
  text: Власть и авторитет почтенно{mf|го|й} Лорд-капитана, впрочем, могли способствовать разрешению конфликта, однако подразумевали использование личных ресурсов Вольного Торговца.
- guid: eaa96322-aef6-4653-a2f5-a292d48e697d
  length: 67
  text: '...отправил{mf||а} разведчиков, чтобы изучить грозное орудие врага.'
- guid: eb214c91-a515-4113-9f18-80d92397a480
  length: 140
  text: Вольный Торговец приказал{mf||а} истреблять беженцев из Сципионы 84-249, выставил{mf||а} кордоны и запретил{mf||а} перемещение между ульями.
- guid: eb9250bb-85ab-4467-8277-85e337ef4077
  length: 28
  text: '...отверг{mf||ла} плату сию.'
- guid: ec1460b7-a1a8-4ce1-adae-f59d17130432
  length: 205
  text: Кандидат{mf||ка} оказал{mf|ся|ась} замешан{mf||а} в позорном инциденте по праву причастности к тому же полку Астра Милитарум. Узнав о происходящем в верхних эшелонах командования части, кандидат{mf||ка}...
- guid: ec42dc2f-e10c-4490-937c-e788c208707e
  length: 77
  text: Нарек{mf||а} медикария Мариуса избранным и подтолкнул{mf||а} к кровопролитию.
- guid: ec60d956-b8ab-4e89-bcda-b675b8c43e92
  length: 83
  text: Вольный Торговец велел{mf||а} утилизировать Блаженных и извлечь из их голов знания.
- guid: ecdc3c87-fecf-4ff8-bab5-ba8d6c3fe9e9
  length: 102
  text: Лорд-капитан похвалил{mf||а} командира за поддержку боевого духа, и направил{mf|ся|ась} вглубь палубы.
- guid: ed003992-bfe5-40d5-b692-a5ec5a70f4cd
  length: 124
  text: Вольный Торговец приказал{mf||а} мальпийским пастырям принять учение Кровавой паутины, остановив религиозное противостояние.
- guid: ed388cef-de17-4c1c-9964-1090e5773c39
  length: 49
  text: Решил{mf||а} эвакуировать всех людей с Веабоса-6.
- guid: eddf2530-dbbf-489b-aa6e-72746509504c
  length: 71
  text: Казнил{mf||а} мятежника Арильда, ослеплявшего людей еретической линзой.
- guid: ee1e6573-0c22-47d1-8fe2-1931a022252c
  length: 31
  text: Побежденн{mf|ый|ая} кревециусом
- guid: ee3525f2-8202-4cf9-bbed-5c1bc15e6957
  length: 27
  text: '[Выстрелить перв{mf|ым|ой}]'
- guid: ef257e71-7076-449b-8469-183cb73e3c25
  length: 304
  text: Доставленн{mf|ого|ую} на медпалубу Вольного Торговца моментально обступают врачи — столь плотно, что сервочереп тревожно кружит над ними, пытаясь отыскать цель своей записи. Наконец, Лорд-капитан открывает глаза, выдернут{mf|ый|ая} в сознание коктейлем лекарств и биостимуляторов из нескольких капельниц.
- guid: ef2b3fc8-58c2-417d-800b-97ae8f2360b2
  length: 60
  text: Не стал{mf||а} предъявлять Вистенце Вьятт обвинения в ереси.
- guid: ef3b67fb-29b8-4054-9a28-334ff65b6d2f
  length: 67
  text: Приказал{mf||а} отправить дефективных сервиторов на прежние работы.
- guid: ef5249bb-3eff-47f1-b679-1c6225717b53
  length: 409
  text: Там, где простые смертные уже дрожали бы в слезах, Вольный Торговец лишь стиснул{mf||а} зубы. Рядом слышны были вскрики и стоны — морок зацепил и других. Енхо Сон, капитан отряда, отрывисто отдавал приказы. Его люди удерживали поддавшихся потустороннему страху товарищей, пытающихся вырваться и бежать вглубь проклятого корабля. Несколько минут — и отряд, хоть и изрядно напуганный, готов был продолжать путь.
- guid: ef9f393f-da1c-47e8-bfd7-3e14b6ae71cf
  length: 87
  text: Бросил{mf||а} напуганных граждан на произвол судьбы, когда тьма пала на Райкад Минорис.
- guid: efc04623-694d-4d23-823d-d9f084bb0fff
  length: 74
  text: Побудил{mf||а} навигатора Ханна покончить с собой, чтобы избежать скверны.
- guid: efe7a98e-699e-4c56-b7ee-4a40e3c31dc2
  length: 302
  text: Ноктюрн Забвения вовлек Вольного Торговца в свой малопонятный план побега из Комморры. Не будучи посвященн{mf|ым|ой} в нюансы его интриги, Лорд-капитан может лишь следовать по намеченному Арлекином пути и зорко выискивать возможность, чтобы разорвать нити, превращающие е{mf|го|е} в марионетку ксеноса.
- guid: f02871b0-ae68-43e3-9b6c-05f599d705f3
  length: 45
  text: '{mf|Его|Ее} Светлость {name} фон Валанциус...'
- guid: f060a6d4-2de0-4ac4-933d-42fcf7807dce
  length: 71
  text: Отдал{mf||а} пайковые талоны Бригадиру, чтобы тот накормил нуждающихся.
- guid: f06266a7-b9a4-4f5c-82b7-7e04364e6e3e
  length: 273
  text: 'Спокойствие варп-перелета было нарушено призывами о помощи: на одной из складочных палуб творится что-то жуткое. Уже два отряда, отправленных на разведку, пропали без следа... увы, единственный способ узнать их судьбу — личный визит Вольного Торговца и {mf|его|ее} свиты...'
- guid: f1448abb-b654-440a-bfd8-08745df9dd2c
  length: 128
  text: Могущественная варп-сущность обещала Вольному Торговцу могущество и власть, если {mf|тот|та} сумеет стать новым чемпионом Хаоса.
- guid: f1c8ab5a-9ec5-4f19-b329-ba3c4e67b226
  length: 84
  text: Страшная история Райкади Филии дописана, и Лорд-капитан поставил{mf||а} в ней точку.
- guid: f1e827e1-0cc2-4337-a529-ca6f59d40af5
  length: 62
  text: Приказа{mf|л|ла} оставить уникальный аугмент старому рабочему.
- guid: f1f8eae1-9037-4f64-a58f-00db99c5ff9d
  length: 376
  text: Сквозь пелену зеленого сияния, я увидел, как {name} тяжело поднимается на ноги, нечеловеческим усилием воли заставляя себя сопротивляться давлению чудовищного звука. {mf|Его|Ее} пример отозвался в сердцах подданных, заставив их воспрянуть духом. Один за одним люди вставали вслед за сво{mf|им|ей} госпо{mf|дином|жой}, ведомые величайшим чувством человеческой души — верностью.
- guid: f2b7eda5-6f09-451d-b487-c102e3908d4a
  length: 66
  text: Научил{mf||а} Номос, что свобода и вседозволенность превыше всего.
- guid: f2cae0c8-51b1-455d-a87b-00280e4d1836
  length: 64
  text: Прервал{mf||а} страдания истерзанного техножреца на Кьяве Гамма.
- guid: f2e0ec90-e833-4c81-ab9d-ebc41378f8c0
  length: 585
  text: Какое-то время Лорд-капитан проводит в койке, под неусыпным наблюдением врачей. Где-то там, за перегородками ослепшего и оглохшего корабля, оставшиеся без свое{mf|го|й} повелител{mf|я|ьницы} люди сражаются с неизвестной напастью. На медпалубу все время поступают новые жертвы. Вот мимо сервочерепа проносят молодого парня, правая половина тела которого превратилась в месиво из плоти и костей. Вот тащат бьющуюся в судорогах девушку без челюсти и с обнаженными ребрами... словно осознав бессмысленность своего пребывания здесь, Лорд-капитан требует собрать {mf|его|ее} и помочь встать.
- guid: f30a6fbf-558b-4178-aedb-76e68b31c7f5
  length: 80
  text: Вольный Торговец заманил{mf||а}, пленил{mf||а} и препарировал{mf||а} инфоангела.
- guid: f352a05d-a947-4a63-ac1b-e86e8ed92bdc
  length: 513
  text: Абордажные группы из экипажа благословенно{mf|го|й} Лорд-капитана обрушились на головы повстанцев в десантных челноках. К сожалению, не все пилоты были достаточно умелы — часть групп высадилась не там, где должна была, либо же они прибывали на планету с запозданием. Маневр, задуманный как молниеносный и рассекающий группировку боевиков на изолированные отряды, превратился в ловушку для блюстителей почтенно{mf|го|й} Лорд-капитана. Зажатые в огневых мешках, они заняли круговую оборону и несли серьезные потери.
- guid: f3cf55e1-6e21-4ada-ba3d-53c191176830
  length: 105
  text: Приказал{mf||а} Хирургеону маджорис набрать добровольцев для заражения, чтобы найти лекарство от болезни.
- guid: f407a279-eef6-4fdd-91a1-87fff577cd96
  length: 157
  text: Вольный Торговец фон Валанциус склонил{mf|ся|ась} перед силами Хаоса и исполнил{mf||а} пророчество Предела рассвета, изреченное им еще при первой их встрече.
- guid: f409212a-debb-400e-a639-f1ef5042c9da
  length: 257
  text: Наслышанные о богатстве Вольного Торговца, техножрецы запрашивают финансирование для своих исследований. Механикус обещают поделиться прибылью — побочным продуктом познания — и внести имя благодетел{mf|я|ьницы} в благословенный дата-массив ценных союзников.
- guid: f412e32d-f260-449c-bbb7-0f2fb7cd53a4
  length: 65
  text: '...благословил{mf||а} Оптикона-22 на его самоубийственную миссию.'
- guid: f439d09a-35c1-4567-88fd-e7fa0ca5c289
  length: 291
  text: '...неожиданно замял{mf|ся|ась}, словно нечто остановило {mf|его|ее}. В остекленевших глазах Лорд-капитана заплясали мрачные тени — {d|Encyclopedia:CharGen_DH_Signs}призраки прошлого{/d}, восставшие при виде варп-изуверства и сковавшие волю Вольного Торговца. Прерывисто дыша, Лорд-капитан...'
- guid: f45e93ce-08ee-4d32-8968-d701e3faec4f
  length: 312
  text: В сумрачной оружейной, без пышных церемоний и досужей публики, украшенный черепом и колонной кинжал был расплавлен и перекован в инквизиторскую инсигнию. Ксавьер Калькасар даровал ее Вольному Торговцу и ввел {mf|его|ее} в Конклав Коронус, братство стражей Империума, поверенных в самые темные тайны Человечества.
- guid: f4d941d0-c8e1-438d-8ce3-8fb3683603c2
  length: 60
  text: Напал{mf||а} на мятежников во главе с Наместником Владаймом.
- guid: f4e6b981-cd84-4b52-801c-efb30bb25ce3
  length: 89
  text: Назвал{mf||а} своих соратников из Прорвы инструментом, прося Ноктюрна Забвения их спасти.
- guid: f563ad3f-0202-4f0c-ae7f-afa38fbffca2
  length: 64
  text: Позволил{mf||а} эльдарам править Янусом через людей-посредников.
- guid: f57402c5-acbe-492b-a72a-90433778db4a
  length: 57
  text: Предоставил{mf||а} убежище беженцам династии Винтерскейл.
- guid: f5c8763e-cbf3-4738-aef1-88d41adb89a5
  length: 58
  text: Поклял{mf|ся|ась} избавить Райкад Минорис от тирании Зари.
- guid: f670a450-6c84-4002-9e39-7b174ee28163
  length: 86
  text: Оправдал{mf||а} презрение блюстителей к солдатам Заркова преданностью Богу-Императору.
- guid: f6742b51-3c7c-4d5c-aa2a-e6db43c4aaad
  length: 170
  text: Кассия с трудом заметила присутствие Лорд-капитана, однако {mf|его|ее} слова тонут в мрачном вое сущности — и Леди-Навигатор обратила все свои силы на борьбу с чудовищем.
- guid: f67eb1f6-1a2c-4910-aef0-1b85c2ee8407
  length: 67
  text: Позволил{mf||а} архмилитанту сохранить похоронную традицию Заркова.
- guid: f6987ba6-0ea6-4a50-bd40-581911c424a2
  length: 49
  text: '...сделал{mf||а} пару шагов в сторону сервиторов.'
- guid: f6c88eb4-1d88-48df-9f9f-3c1502215673
  length: 74
  text: Решил{mf||а} биться и против эльдаров, и против Каллигоса на Кетца-Темере.
- guid: f6ea93bd-12e6-4e66-9ecf-224a6656005e
  length: 465
  text: И повел старый Вени Домин на верхние палубы. И взош{mf|ел|ла} Домин в палаты офицеров. Убраны были стены паутиной сосудов, драгоценные трофеи вплетены в них, а клубки сухожилий сковали статуи. На высоком же балконе стенал расчлененный Судия, пытаясь бледными руками вернуть себя в порядок. Но от движений его все теснее сплеталась плоть, обращала палаты в силок. Таков клинок, что запутался в понимании учения. Обездоленное создание, не знающее места своего в мире.
- guid: f6f3af2d-1719-4ac8-9d1b-e45ee53b234b
  length: 73
  text: Согласил{mf|ся|ась} свергнуть Чорда, чтобы спасти как можно больше людей.
- guid: f6f6fe75-4bc1-4a56-a077-1f91e04cb1a8
  length: 36
  text: Объявить охоту на самозван{mf|ца|ку}
- guid: f6fea7ac-54db-4682-8f90-31bb1c0d980d
  length: 54
  text: '...прогнал{mf||а} монстра истовой молитвой Императору.'
- guid: f7074542-24a5-4479-bb07-3faeeb48f8eb
  length: 148
  text: Лорд-капитан решил{mf||а} проблему радикально, отдав приказ отстранить Вести от командования. И потребовал{mf||а} от провинившегося последний отчет.
- guid: f7e0132b-6b60-4af9-b0b8-cb1f7c5a54d3
  length: 63
  text: Попытал{mf|ся|ась} помочь обезумевшему псайкеру на Кьяве Гамма.
- guid: f7f8b2c6-13ff-46b6-b8a1-e5cb846a1fce
  length: 204
  text: '...организовал{mf||а} переброску сил и оборону жизненно важных участков, благодаря чему удалось сохранить ключевые узлы инфраструктуры и самых значимых лиц из руководства планеты до прибытия подкрепления.'
- guid: f80478c4-3609-4b99-a75f-1ac687653a3c
  length: 58
  text: Велел{mf||а} сжечь редкие грузы, сеявшие раздор в колонии.
- guid: f82cc29c-585c-435c-b0fa-d5bccdaeb934
  length: 118
  text: Лорд-капитан решил{mf||а} отнестись к шутке снисходительно и лишь запросил{mf||а} отчет о том, как идут дела у отряда.
- guid: f8841de0-36d4-4e0f-99d4-e035aaff3ad1
  length: 226
  text: Взирая на обескровленные и израненные миры, Вольный Торговец видел{mf||а} бесконечные возможности роста своей династии. Из пепла, в который обратились десятилетия относительного покоя, готовилась взойти новая амбициозная сила.
- guid: f934a012-2771-4cd5-993f-4f7487b0f948
  length: 234
  text: Лорд-инквизитор не принимает посетителей, занятый важными делами. Как бы вызывающе это ни звучало, Е{mf|го|е} Светлость не имеет другого способа встретиться с Калькасаром, кроме как ждать, пока он не призовет к себе Вольного Торговца.
- guid: f95675b6-a6ac-49bf-9502-f8e2953612a9
  length: 71
  text: Вольный Торговец велел{mf||а} тихо избавиться от Чистоголосого пророка.
- guid: f9ae8b82-22bd-41da-a084-c72dfef2a031
  length: 139
  text: Вольный Торговец приказал{mf||а} разбить трудовые лагеря вокруг руин Сципионы 84-249, куда были согнаны выжившие из коллапсировавшего улья.
- guid: fa584cc7-3148-48b2-8ae4-59a05b749fb7
  length: 76
  text: Допустил{mf||а} обитателей прочих палуб к посещению корабельного реликвария.
- guid: fa97a020-324f-4b81-b255-9cd30b2e250b
  length: 323
  text: 'Часть обезумевших затихает, другие пытаются прийти в чувство: кто-то прибивает кортиком свою руку к панели, не давая себе двигаться, кто-то неистово шепчет молитвы. Одни возвращаются к когитаторам, другие склоняются над раненными. Гремят выстрелы: тех, кто еще беснуется, Вольный Торговец казнит лично, как и обещал{mf||а}.'
- guid: fabbc6ed-6e1d-49c7-bc51-881f04936ba9
  length: 472
  text: Разобравшись с Адептус Арбитес, Соломон Антар стал личной ищейкой Вольного Торговца. Когда {name} фон Валанциус хотел{mf||а} отыскать кого-то, по следу отправлялся Соломон со своим верным псом. Никто не мог скрыться от них, и челюсти Глейто работали без устали, разрывая врагов династии. Когда в тело кибермастифа вселился демон, привлеченный убийствами и яростью его владельца, Антар лишь криво усмехнулся, довольный, что его зверь стал еще смертоноснее, еще непобедимее.
- guid: fc20bb06-6fd5-49b5-854f-15ae6c40cfed
  length: 231
  text: Но лишь сильнее сгустилась тоска, лишая чувств, ибо глубока была печаль породившей ее тени. Тогда чары Вени'Заккари окружили Домин, и они лишь спасли {mf|его|ее}. Ибо страшен тот, кто заблудился в сомнениях своих. Он — есть Смерть.
- guid: fc2c5825-0b0f-4827-b322-14c2c9359e1e
  length: 245
  text: '...использовал{mf||а} обманное приглашение на несуществующий офицерский раут, чтобы собрать причастных к преступлению в одном отсеке и вызвал{mf||а} его контролируемую разгерметизацию, которая затем была списана на сбой в корабельном когитаторе.'
- guid: fc4b1a98-d180-409f-9f9b-fb2816198baf
  length: 480
  text: Следуя через охваченный еретическим мятежом мир, Лорд-капитан стал{mf||а} невольн{mf|ым|ой} свидетел{mf|ем|ьницей} нечестивого таинства, развернувшегося в одном из технических помещений акведука. Сей заброшенный угол оказался местом скопления еретиков, творящих мрачные и богопротивные деяния. Множество фигур бунтовщиков замерли в терпеливом ожидании, устремив свой взор к центру комнаты — никто не двигался, лишь ропот приглушенных голосов гулом отражался от металлических стен.
- guid: fcd0742e-cced-4281-ac71-99cdfdd8f567
  length: 497
  text: Очередная вахта на борту пустотного корабля подошла к концу. Лорд-капитан, отдав последние распоряжения, отправил{mf|ся|ась} в свои покои для благословенного отдыха. Впрочем, дрема Вольного Торговца была нарушена изуверскими ночными кошмарами, охватившими {mf|его|ее} разум. Провидение вовремя выдернуло Лорд-капитана из когтей мучительных варп-грез... лишь для того, чтобы лицезреть, как кошмары просочились сквозь неверную оболочку поля Геллера и облеклись плотью в святая святых корабля! К бою!
- guid: fcd68d5a-a620-43e7-87e8-76707c89131d
  length: 68
  text: Отдал{mf||а} гемункулу Тервантьясу образец плоти, зараженной варпом.
- guid: fd263511-0c05-4a6e-9d8e-b53c6a0a0419
  length: 459
  text: В ту же секунду, словно действуя в едином порыве, сервиторы — все без исключения! — шагнули навстречу Лорд-капитану. С пугающей точностью они повторили {mf|его|ее} движение. Вольный Торговец замер{mf||ла} на месте и, недолго думая, взмахнул{mf||а} рукой — действуя одновременно, сервиторы повторили и это движение. Когда Лорд-капитан с немым вопросом в глазах обернул{mf|ся|ась} к техноматам, сервиторы, словно передразнивая {mf|его|ее}, отразили и этот жест.
- guid: fde6cfc0-3c23-487e-a5bc-1224b710f0bd
  length: 195
  text: 'Колония на Заркове не получила ни единого шанса устоять перед силами божественной провозвестни{mf|ка|цы} Осколка: планету разорвали растущими из-под ее коры корнями, а все ее жители — уничтожены.'
- guid: fe683128-7127-4b16-b96b-9c11c6cb872f
  length: 47
  text: Вольный Торговец открутил{mf||а} вентиль УД-№5.
- guid: fe6dc99c-e0e5-4a36-a0ae-4a72ed59486c
  length: 72
  text: Лорд-капитан терпеливо наблюдал{mf||а} за тем, что происходило дальше...
- guid: fe7d1c2a-7cd6-45a1-bcd4-dc8a28503329
  length: 280
  text: Каждый в Просторе узнал об измене Вольного Торговца. Расплата за сие прегрешение не заставила себя ждать — удары отмщения обрушились на протекторат фон Валанциус со всех сторон, сгубив его в мгновение ока. Было ли это важно для его бывше{mf|го|й} повелител{mf|я|ьницы}? Едва ли...
- guid: fe868691-752c-4c92-8252-1df37f619129
  length: 524
  text: Вывел Домин старец Вени'Заккари из пылкой топки крематория, и побрели они мимо колонн мертвецов. Одежды их истлели, и кости их царапали аугментику и рвали ветхую плоть. Скорбно стенали они, и от звуков этих память гасла. Узрел{mf||а} Домин, что несут мертвецы ковчег, а в ковчеге — Нечто. Потерянное дитя, что в шелковом коконе лило кровавые слезы по неизвестности. Словно госпожу, несли неживые ее и причитали о судьбе. Таков клинок, погрязший в думах о потерянном прошлом — беспомощный ребенок, парализованный сожалениями.
- guid: fea2e31f-67ab-4819-8378-843bc533af41
  length: 191
  text: Лорд-капитан воцарил{mf|ся|ась} во владениях династии фон Валанциус и обратил{mf||а} свой взор на все открывшиеся {mf|ему|ей} перспективы. Отныне процветание протектората в {mf|его|ее} руках.
- guid: ff13785e-af5d-4b7c-bc04-2a4593ded99a
  length: 75
  text: '...распорядил{mf|ся|ась} обрушить с орбиты на крейсер целый боевой корабль.'
- guid: ff58fc7a-6ef8-4b78-a32a-bac397fd055d
  length: 109
  text: Лорд-капитан посетил{mf||а} званый ужин на офицерской палубе, где познакомил{mf||а} Кибеллу с обычаями знати.
- guid: ff80dbca-02af-42aa-a384-4fdf3747be8b
  length: 566
  text: 'Футфол полон сорвиголов, преступников и тех, кто ходит по тонкой линии между праведностью и ересью. Одна из тех, кто за многие годы так и не оступилась — Джай Хейдари, глава контрабандистской сети под покровительством Миссии Касбаллики.

    Джай Хейдари и Вольного Торговца связывает договор о взаимных услугах: мудрость специалиста по хладному торгу в обмен на высокое покровительство помазанни{mf|ка|цы} Императора. Впрочем, в прошлом Хейдари скрывается намного больше, чем разногласия с Миссией Касбаллики — и это прошлое она предпочитает держать хорошо похороненным.'
- guid: ffec4ed4-ff4e-451b-9647-b19aa0f73b74
  length: 358
  text: В парадном облачении явилась она на мостик, вознесла молитву и попыталась свершить волю Неумирающего. Исход был предрешен — Кибелла была повержена, и ее кровоточащим, еще живым телом инкрустировали трон Лорд-капитана. Поддерживая жизнь в умирающей плоти нечестивым колдовством, Домин не позволил{mf||а} душе своей некогда верной спутницы уйти к Неумирающему.
- guid: fffc736d-7cb3-4578-8092-bda9cd953dae
  length: 383
  text: 'Мон-кай, {mf|самец|самка}. Холеное отродье из высшей касты, которое кормили и экипировали по высшему разряду. Явно совсем недавно в Темном городе, еще не успевшем оставить печать вечного ожидания гибели на е{mf|го|е} приплюснутой морде. Самая славная дичь, такая цепляется за жизнь сильнее всего, а значит, и эссенция ее смерти слаще прочих.

    Рефлексы наполняют мышцы жаждой действия.'
