- guid: 5124fb5d-36ec-46fe-9151-c01ed10bd8f4
  text: Организация семейств благородных мутантов, обладающих геном навигатора.
- guid: 5125fb3c-99e5-4388-8ab2-12e104b70c86
  text: Недостаточно игроков для кооперативной игры.
- guid: 5164d5d1-ce72-4290-a0d2-d9855e4b38d7
  text: Эту настройку невозможно изменить, если фильтр сглаживания не SMAA или TAA
