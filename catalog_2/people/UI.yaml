    <b>6. ОТКАЗ ОТ ОГРАНИЧЕННОЙ ГАРАНТИИ</b>

    В МАКСИМАЛЬНОЙ СТЕПЕНИ, ДОПУСТИМОЙ ДЕЙСТВУЮЩИМ ЗАКОНОДАТЕЛЬСТВОМ, МЫ ПРЯМО ОТКАЗЫВАЕМСЯ ОТ ЛЮБЫХ КАСАЮЩИХСЯ ВАС ГАРАНТИЙ, ПРЯМЫХ ИЛИ КОСВЕННЫХ, В ОТНОШЕНИИ ИГРЫ, ВКЛЮЧАЯ ЛЮБЫЕ КОСВЕННЫЕ ГАРАНТИИ КАЧЕСТВА, ПРИГОДНОСТИ ДЛЯ КОНКРЕТНЫХ ЦЕЛЕЙ И СОБЛЮДЕНИЯ ПРАВ, НО НЕ ОГРАНИЧИВАЯСЬ ИМИ. ИГРА ПРЕДОСТАВЛЯЕТСЯ "КАК ЕСТЬ" БЕЗ ДАЛЬНЕЙШИХ ГАРАНТИЙ ЛЮБОГО ХАРАКТЕРА. ВЫ ПРИНИМАЕТЕ НА СЕБЯ ВСЕ РИСКИ, СВЯЗАННЫЕ С ЛЮБЫМ УЩЕРБОМ И ПОТЕРЯМИ, ВОЗНИКАЮЩИМИ В РЕЗУЛЬТАТЕ ИСПОЛЬЗОВАНИЯ ИЛИ НЕВОЗМОЖНОСТИ ИСПОЛЬЗОВАНИЯ ИГРЫ. МЫ НЕ ГАРАНТИРУЕМ, ЧТО ИГРА СООТВЕТСТВУЕТ ВАШИМ ТРЕБОВАНИЯМ И ЧТО РАБОТА ИГРЫ БУДЕТ БЕЗУПРЕЧНОЙ И БЕЗОШИБОЧНОЙ.

    <b>7. ОГРАНИЧЕНИЕ ОТВЕТСТВЕННОСТИ</b>

    В МАКСИМАЛЬНОЙ СТЕПЕНИ, ДОПУСТИМОЙ ДЕЙСТВУЮЩИМ ЗАКОНОДАТЕЛЬСТВОМ, НИ МЫ, НИ НАШИ ЛИЦЕНЗИАРЫ ИЛИ ПАРТНЕРЫ НЕ НЕСУТ ПЕРЕД ВАМИ НИКАКОЙ ОТВЕТСТВЕННОСТИ ЗА ЛЮБОЙ УЩЕРБ (ВКЛЮЧАЯ ФАКТИЧЕСКИЕ УБЫТКИ, СЛУЧАЙНЫЕ УБЫТКИ, КОСВЕННЫЕ УБЫТКИ, УПУЩЕННУЮ ВЫГОДУ ИЛИ ПОТЕРЯННЫЕ ДАННЫЕ, НЕЗАВИСИМО ОТ ТОГО, БЫЛ ЛИ ТАКОЙ УЩЕРБ ПРЕДСКАЗУЕМ ИЛИ НЕТ, НО НЕ ОГРАНИЧИВАЯСЬ ИМИ), ВОЗНИКШИЙ В СВЯЗИ С НАСТОЯЩИМ СОГЛАШЕНИЕМ И ЭКСПЛУАТАЦИЕЙ ВАМИ ИГРЫ И ДРУГИХ МАТЕРИАЛОВ, ПРЕДОСТАВЛЕННЫХ ВАМ НАМИ. МЫ НЕ НЕСЕМ ОТВЕТСТВЕННОСТЬ ЗА НЕВОЗМОЖНОСТЬ УСТАНОВКИ ИЛИ ЗАПУСКА ИГРЫ НА ВАШЕМ ЛИЧНОМ УСТРОЙСТВЕ, А ТАКЖЕ ЗА ВОЗМОЖНЫЕ ОШИБКИ И СБОИ В РАБОТЕ ИГРЫ. ДЛЯ ИСПОЛЬЗОВАНИЯ ИГРЫ НЕОБХОДИМО ПОДКЛЮЧИТЬСЯ К ИНТЕРНЕТУ. ВСЕ РАСХОДЫ, СВЯЗАННЫЕ С ПОДКЛЮЧЕНИЕМ К ИНТЕРНЕТУ, НЕСЕТЕ ВЫ. МЫ НЕ НЕСЕМ ОТВЕТСТВЕННОСТЬ ЗА ЛЮБОЙ УЩЕРБ, ПРИЧИНЕННЫЙ ВАМ В РЕЗУЛЬТАТЕ ПОДКЛЮЧЕНИЯ К ИНТЕРНЕТУ ИЛИ УСТАНОВКИ ВРЕДОНОСНОГО ПРОГРАММНОГО ОБЕСПЕЧЕНИЯ НА ВАШЕ УСТРОЙСТВО. В СООТВЕТСТВИИ С ДЕЙСТВУЮЩИМ ЗАКОНОДАТЕЛЬСТВОМ МЫ СНИМАЕМ С СЕБЯ ВСЯКУЮ ОТВЕТСТВЕННОСТЬ ЗА ЛЮБЫЕ ДЕЙСТВИЯ, КОТОРЫЕ МОГУТ СОВЕРШАТЬСЯ НЕСОВЕРШЕННОЛЕТНИМИ БЕЗ РАЗРЕШЕНИЯ ИХ РОДИТЕЛЕЙ ИЛИ ЗАКОННЫХ ОПЕКУНОВ. ЕСЛИ ВЫ ЯВЛЯЕТЕСЬ РОДИТЕЛЕМ ИЛИ ЗАКОННЫМ ОПЕКУНОМ И ДАЕТЕ РАЗРЕШЕНИЕ НА ИСПОЛЬЗОВАНИЕ ИГРЫ ВАШИМ РЕБЕНКОМ, ВЫ НАСТОЯЩИМ СОГЛАШАЕТЕСЬ С УСЛОВИЯМИ, ОТНОСЯЩИМИСЯ К ИСПОЛЬЗОВАНИЮ УСЛУГ ВАШИМ РЕБЕНКОМ. ДАННОЕ ОГРАНИЧЕНИЕ НЕ РАСПРОСТРАНЯЕТСЯ НА ОТВЕТСТВЕННОСТЬ ЗА СМЕРТЬ ИЛИ ТЕЛЕСНЫЕ ПОВРЕЖДЕНИЯ В ТОЙ МЕРЕ, В КАКОЙ ДЕЙСТВУЮЩЕЕ ЗАКОНОДАТЕЛЬСТВО ЗАПРЕЩАЕТ ТАКОЕ ОГРАНИЧЕНИЕ. В ОТДЕЛЬНЫХ ЮРИСДИКЦИЯХ НЕ ДОПУСКАЕТСЯ ИЛИ ОГРАНИЧИВАЕТСЯ ИСКЛЮЧЕНИЕ ИЛИ ОГРАНИЧЕНИЕ ОТВЕТСТВЕННОСТИ ИЛИ НЕ ДОПУСКАЕТСЯ ИСКЛЮЧЕНИЕ ИЛИ ОГРАНИЧЕНИЕ ПОДРАЗУМЕВАЕМЫХ ГАРАНТИЙ, ПОЭТОМУ ВЫШЕУКАЗАННОЕ ОГРАНИЧЕНИЕ МОЖЕТ НЕ ПРИМЕНЯТЬСЯ В НЕКОТОРЫХ ОБСТОЯТЕЛЬСТВАХ.

    <b>8. ПРАВО СОБСТВЕННОСТИ НА ИГРУ</b>

    8.1. <indent=3%> Все имущественные права, права собственности и права интеллектуальной собственности в отношении Игры и любой ее части принадлежат нам или нашим лицензиарам. За исключением случаев, явно оговоренных в настоящем Соглашении, все права, не предоставленные вам по настоящему Соглашению, сохраняются за нами.</indent>

    8.2. <indent=3%> Игра лицензируется, а не продается, т. е. никакие права собственности на Игру вам не передаются и не присваиваются.</indent>

    <b>9. СРОК И ПРЕКРАЩЕНИЕ ДЕЙСТВИЯ</b>

    9.1. <indent=3%><b>Срок действия.</b> Вы можете использовать Игру с момента принятия настоящего Соглашения и до момента прекращения его действия в соответствии с разделами 9.2 и 9.3 ниже.</indent>

    9.2. <indent=3%><b> Прекращение действия по нашей инициативе.</b> Мы можем немедленно прекратить действие настоящего Соглашения, если вы не соблюдаете какие-либо условия и положения настоящего Соглашения. Незамедлительно после прекращения действия вы должны прекратить любое использование Игры, уничтожить все копии Игры, находящиеся в вашем распоряжении или под вашим контролем, и удалить Игру с вашего устройства. Прекращение действия не ограничивает ваши права и средства правовой защиты по закону или по праву справедливости. </indent>

    9.3. <indent=3%><b>Прекращение действия по вашей инициативе.</b> Вы можете немедленно прекратить действие настоящего Соглашения, навсегда прекратив использование Игры и удалив ее со своего устройства.</indent>

    <b>10. ДЕЙСТВУЮЩЕЕ ЗАКОНОДАТЕЛЬСТВО. ЮРИСДИКЦИЯ</b>

    10.1. <indent=3%> Настоящее Соглашение регулируется и толкуется в соответствии с законодательством Кипра. </indent>

    10.2. <indent=3%> В случае возникновения какого-либо спора, вытекающего из настоящего Соглашения или в связи с ним, вы соглашаетесь добросовестно вести с нами переговоры по такому спору в течение 60 календарных дней после получения письменного уведомления о споре. Такое письменное уведомление должно быть направлено физически по почтовому адресу Irodi Attikou, 8A, Lakatamia, 2332, Nicosia, Cyprus и в электронном виде по адресу электронной почты <b>legal@owlcat.games</b> и должно содержать следующую информацию:</indent>

    <indent=4%>•</indent> <indent=5%> полное имя и контактная информация истца и его представителя (если таковой имеется);</indent>

    <indent=4%>•</indent> <indent=5%>описание характера и основания претензии и спора;</indent>

    <indent=4%>•</indent> <indent=5%>описание требуемого от нас исполнения в соответствии и в связи с претензией.</indent>

    10.3. <indent=3%> Вы прямо соглашаетесь с тем, что если спор не может быть разрешен путем переговоров, как указано выше, то в той степени, в которой это допускается действующим законодательством, исключительной юрисдикцией для любых претензий или исков, возникающих из настоящего Соглашения или связанных с ним, будут государственные суды Республики Кипр, и вы прямо соглашаетесь на осуществление персональной юрисдикции таких судов.</indent>

    <b>11. МЕРЫ ПРЕДОСТОРОЖНОСТИ</b>

    11.1. <indent=3%> Когда вы играете в Игру, вам следует соблюдать следующие меры предосторожности: не играть при усталости или недосыпании, играть на достаточном расстоянии от экрана, играть в освещенном помещении и умерить яркость экрана, делать перерывы от десяти (10) до пятнадцати (15) минут каждый час.</indent>

    11.2. <indent=3%> ПРЕДУПРЕЖДЕНИЕ: У НЕКОТОРЫХ ЛЮДЕЙ ВОЗМОЖНЫ ЭПИЛЕПТИЧЕСКИЕ ПРИПАДКИ, ВКЛЮЧАЯ В НЕКОТОРЫХ СЛУЧАЯХ ПОТЕРЮ СОЗНАНИЯ, ОСОБЕННО ПРИ ВОЗДЕЙСТВИИ СИЛЬНЫХ СВЕТОВЫХ РАЗДРАЖИТЕЛЕЙ (БЫСТРОЙ ПОСЛЕДОВАТЕЛЬНОСТИ ИЗОБРАЖЕНИЙ ИЛИ ПОВТОРЕНИЯ ПРОСТЫХ ГЕОМЕТРИЧЕСКИХ ФИГУР, ВСПЫШЕК ИЛИ ВОЗДЕЙСТВИЙ). ТАКИЕ ЛЮДИ ПОДВЕРЖЕНЫ РИСКУ ВОЗНИКНОВЕНИЯ ПРИПАДКОВ ПРИ ИГРЕ В НЕКОТОРЫЕ ВИДЕОИГРЫ, СОДЕРЖАЩИЕ ПОДОБНЫЕ СВЕТОВЫЕ РАЗДРАЖИТЕЛИ; МЫ НАСТОЯТЕЛЬНО РЕКОМЕНДУЕМ ПРОКОНСУЛЬТИРОВАТЬСЯ С ВРАЧОМ ПЕРЕД НАЧАЛОМ ИСПОЛЬЗОВАНИЯ ИГРЫ. РОДИТЕЛИ ДОЛЖНЫ БЫТЬ ОСОБЕННО ВНИМАТЕЛЬНЫ К СВОИМ ДЕТЯМ, КОГДА ТЕ ИГРАЮТ В ВИДЕОИГРЫ. ПРИ ПОЯВЛЕНИИ ОДНОГО ИЗ ТАКИХ СИМПТОМОВ, КАК ГОЛОВОКРУЖЕНИЕ, НАРУШЕНИЕ ЗРЕНИЯ, СУЖЕНИЕ ЗРАЧКОВ, СОКРАЩЕНИЕ МЫШЦ, ДЕЗОРИЕНТАЦИЯ, НЕПРОИЗВОЛЬНЫЕ ДВИЖЕНИЯ ИЛИ КОНВУЛЬСИИ, КРАТКОВРЕМЕННАЯ ПОТЕРЯ СОЗНАНИЯ, СЛЕДУЕТ НЕМЕДЛЕННО ПРЕКРАТИТЬ ИГРУ И ОБРАТИТЬСЯ К МЕДИЦИНСКОМУ СПЕЦИАЛИСТУ.</indent>

    <b>12. ИЗМЕНЕНИЯ В НАСТОЯЩЕМ СОГЛАШЕНИИ</b>

    12.1. <indent=3%> Мы оставляем за собой право время от времени пересматривать условия настоящего Соглашения. Мы предоставим вам возможность ознакомиться с пересмотренной версией и принять ее, а она заменит настоящее Соглашение с даты вашего принятия. Если вы не принимаете пересмотренное Соглашение или не можете выполнить какое-либо условие пересмотренного Соглашения, то вам больше не будет разрешено играть в Игру, и мы оставляем за собой право прекратить действие настоящего Соглашения. Дальнейшее использование вами Игры будет считаться принятием любых пересмотренных условий.</indent>

    <b>13. ПРОЧИЕ ПОЛОЖЕНИЯ</b>

    13.1. <indent=3%>По своему усмотрению мы можем уступить или делегировать свои права и обязанности по настоящему Соглашению или любую их часть любой третьей стороне без уведомления вас. Ваши права и обязанности являются личными и не подлежат уступке или делегированию.</indent>

    13.2. <indent=3%> Настоящее Соглашение представляет собой полное соглашение между вами и нами в отношении использования вами Игры и заменяет собой любые предыдущие устные и письменные соглашения или устные и письменные соглашения, заключенные одновременно с созданием настоящего Соглашения, в отношении предмета настоящего Соглашения, которые объединены в настоящем Соглашении.</indent>

    13.3. <indent=3%>Если какое-либо положение настоящего Соглашения будет признано судом компетентной юрисдикции противоречащим закону, это положение будет применяться в максимально допустимой степени, а остальные положения настоящего Соглашения останутся в силе в полном объеме.</indent>

