  text: Поиск в инвентаре
- guid: 4dbe0b39-66d3-41fb-92f9-0f85f5bdba0b
  text: Торговец не заинтересован в этом грузе.
- guid: 4de30211-d7e8-4950-8487-46b4c806424d
  text: <b>{1}</b> получает эффект <b>{0}</b> (<b>{2}</b>).
- guid: 4e1bb707-40d2-4c3a-900d-1f406f59a57d
  text: Позволяет сделать быстрое сохранение.
- guid: 4e3bae94-0b86-4243-8818-79a1eac47bf9
  text: Пользовательский
- guid: 4e64820e-dcb6-44aa-99db-df7036b713fc
  text: Гальванизация
- guid: 4ed94b88-4ebc-40f1-a321-db1d8e7dfdcc
  text: Выкл
- guid: 4ede9a42-6aa4-4378-9410-9b8d8d9a93c2
  text: Повернуть зону стратегического плана
- guid: 4f02d159-038f-4a0e-960f-7d5fc58c8bd4
  text: Вы уверены, что хотите удалить все сохранения этой группы?
- guid: 4f3a5970-ffcd-4467-9eb4-664a210c3ce4
