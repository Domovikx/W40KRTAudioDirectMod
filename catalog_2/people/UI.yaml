  text: 'Навигаторы — это уникальные представители человечества, обладающие так называемым геном навигатора, известным еще со времен Темной Эры Технологий. У этих высокородных санкционированных мутантов на лбу расположен третий глаз (обычно его называют варп-оком). Он позволяет им вглядываться в Эмпиреи без риска лишиться рассудка.<br>

