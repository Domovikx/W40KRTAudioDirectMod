- guid: 8281113a-6da7-4031-8c46-bdb03746f313
  text: Настройка "Плотность толпы" определяет количество персонажей или объектов, отображаемых на экране. Увеличение этого показателя добавляет больше неигровых персонажей и объектов в окружение, что делает игровой мир более насыщенным и живым. Однако это может повлиять на производительность игры, особенно на старых или менее мощных устройствах, так как большее количество объектов требует больше ресурсов для отрисовки. Эта настройка позволяет вам подобрать нужный вариант с учетом возможностей оборудования и эстетических предпочтений.
- guid: 82a4b77b-7a1f-471f-883f-c94fec61c91e
  text: Принять приглашение?
- guid: 82b64192-18ba-4b66-8b9d-c1effff3c936
