- guid: 50e05860-e20e-49d0-b296-deb3dc4a7797
  text: Друзья
- guid: 50f60686-b63a-4cc7-a875-75fee360257d
  text: Предыдущий член отряда
- guid: 5102e442-fe26-4902-aa02-fcd5fcf80f1a
