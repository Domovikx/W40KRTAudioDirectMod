- guid: acd12774-272d-4fd6-8897-974e570338b4
  text: 'Позволяет установить сложность космических боев. Влияет на эффективность вражеских пустотных кораблей и возможности для ремонта флагмана Вольного Торговца.<br><br><b>Легкий</b> уровень сложности позволяет без труда завершать сражения:

    -<indent=5%>Урон, наносимый врагами, <b>уменьшен на 90%</b>.</indent>

    -<indent=5%>Стоимость ремонта флагмана <b>уменьшена на 95%</b>.</indent>

    -<indent=5%>Показатели некоторых способностей уклонения противников <b>снижены на 75%</b>.</indent>

    -<indent=5%>Максимальная целостность корпуса вражеских пустотных кораблей <b>уменьшена на 40%</b>.</indent><br><br><b>Нормальный</b> уровень сложности позволяет завершать большинство боев с незначительными усилиями:

    -<indent=5%>Урон, наносимый врагами, <b>уменьшен на 40%</b>.</indent>

    -<indent=5%>Стоимость ремонта <b>уменьшена на 20%</b>.</indent>

    -<indent=5%>Вражеские пустотные корабли обладают <b>базовым значением максимальной целостности корпуса</b>.</indent><br><br><b>Бесстрашный</b> уровень сложности предлагает игроку испытать полноценный опыт пустотных сражений:

    -<indent=5%>Враги наносят <b>полный урон</b>.</indent>

    -<indent=5%>Для ремонта необходимо <b>базовое количество металлолома</b>.</indent>

    -<indent=5%>Вражеские пустотные корабли обладают <b>базовым значением максимальной целостности корпуса</b>.</indent><br><br><b>Сложный</b> уровень сложности представляет собой дополнительное испытание для опытных игроков:

    -<indent=5%>Урон, наносимый врагами, <b>увеличен на 25%</b>.</indent>

    -<indent=5%>Для ремонта необходимо <b>базовое количество металлолома</b>.</indent>

    -<indent=5%>Максимальная целостность корпуса вражеских пустотных кораблей <b>увеличена на 20%</b>.</indent>'
