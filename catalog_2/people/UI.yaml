  text: Особый боевой ресурс, необходимый для использования уникальных способностей {g|Encyclopedia:HeroicAct}Героический Акт{/g} и {g|Encyclopedia:DesperateMeasure}Отчаянные меры{/g}. Отряд может использовать лишь одну из этих способностей за раунд. Каждый персонаж может использовать лишь одну способность за весь бой.
