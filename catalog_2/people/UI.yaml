  text: Опыт
- guid: 4f7080c6-4611-4d72-ab6e-b86d54c3d780
  text: Персонаж, носящий эту броню, имеет <u>{armour.dodge}</u>% шанс уклониться от средних вражеских атак в текущей главе.
