- guid: 8b9a5938-da9e-4cc8-a715-66ce42dd35c7
  text: '<size=130%><b>Как правильно отправить отчет об ошибке</b></size><br>

    <color=yellow>Выберите соответствующий контекст ошибки при отправке отчета.</color><br>

    Чтобы отчет об ошибке не потерялся и был взят в работу как можно скорее, рекомендуем выбрать в окне отчета соответствующий контекст обнаруженной ошибки.<br>

    Если ни один из пунктов не подходит для описания контекста ошибки, при отправке следующего отчета рекомендуем выполнить действия ниже:<br>

    1.<indent=5%>Наведите курсор на проблемную зону или объект</indent>

    2.<indent=5%>Нажмите <color=yellow>Alt+B</color></indent>

