- guid: 93c0052f-ee50-444f-a2bc-2891f9df9b90
  text: В мрачной тьме далекого будущего есть только война.<br><br>Этот режим — сложнейшее испытание для самых смелых из Лорд-капитанов, которые хотят по-настоящему погрузиться в мир Warhammer 40,000 с максимально высокими ставками. Все решения, победы и поражения в режиме <b>"Мрачная Тьма"</b> окончательны и необратимы — у вас есть только один файл сохранения, который автоматически обновляется каждый раз при выходе из игры. Никаких загрузок, никаких вторых шансов и никаких изменений уже принятых решений.<br><br>Если вам удастся успешно преодолеть все препятствия и дойти до эпилога, принеся славу династии фон Валанциус, вы получите приз "Есть только война..." и особый предмет для всех будущих прохождений — как свидетельство вашего мастерства и храбрости.<br><br>Если же ваш отряд или пустотный корабль будут повержены в битве, путешествие в режиме <b>"Мрачная Тьма"</b> закончится. Вы сможете либо с честью принять свою судьбу и удалить сохранение, либо продолжить игру в обычном режиме, однако завершение этой истории не принесет вам приза "Есть только война..." и особой награды. Император защищает!<br><br>- Режим <b>"Мрачная Тьма"</b> можно отключить в настройках в любое время, преобразовав его в пользовательский режим. Это действие невозможно отменить. Как только вы смените режим, вы больше не сможете претендовать на приз или награду.<br><br>- Режим <b>"Мрачная Тьма"</b> в настоящее время доступен только в одиночном режиме. Приглашение друзей в игру с этим режимом автоматически преобразует его в пользовательский режим.
