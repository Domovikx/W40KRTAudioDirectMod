  text: Игровая статистика
- guid: 7ff56c44-300d-4b9a-97cb-4aa9758e5365
  text: 'Архетипы служат путями развития, которым следуют ваши персонажи. Каждый архетип включает в себя уникальный набор навыков и экспертиз, а также представляет собой определенную боевую специализацию: от воина на передовой до незаменимого офицера, предпочитающего командовать из глубокого тыла. Только вам выбирать, кем быть в темном будущем Warhammer 40,000: Rogue Trader.'
