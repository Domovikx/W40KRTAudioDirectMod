  text: '<uppercase><size=115%><b>ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ С КОНЕЧНЫМ ПОЛЬЗОВАТЕЛЕМ WARHAMMER 40,000: ROGUE TRADER</b></size></uppercase>

    <b>ВАЖНЫЕ УВЕДОМЛЕНИЯ</b>

    ВНИМАТЕЛЬНО ПРОЧИТАЙТЕ СЛЕДУЮЩЕЕ ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ С КОНЕЧНЫМ ПОЛЬЗОВАТЕЛЕМ ("СОГЛАШЕНИЕ") ПЕРЕД ЗАГРУЗКОЙ, УСТАНОВКОЙ ИЛИ ИСПОЛЬЗОВАНИЕМ ИГРЫ WARHAMMER 40 000: ROGUE TRADER ИЛИ ЛЮБОГО СВЯЗАННОГО С НЕЙ ПРОГРАММНОГО ОБЕСПЕЧЕНИЯ (совместно именуемых "ИГРА"). ЕСЛИ ВЫ НЕ ПРИМЕТЕ ВСЕ УСЛОВИЯ НАСТОЯЩЕГО СОГЛАШЕНИЯ, ВЫ НЕ МОЖЕТЕ УСТАНАВЛИВАТЬ ИЛИ ИСПОЛЬЗОВАТЬ ИГРУ.

    ЕСЛИ ВЫ ЗАГРУЖАЕТЕ ИГРУ, УСТАНАВЛИВАЕТЕ ЕЕ И/ИЛИ ИГРАЕТЕ В НЕЕ, ВЫ ПОДТВЕРЖДАЕТЕ И ПРИЗНАЕТЕ, ЧТО ДОСТИГЛИ СОВЕРШЕННОЛЕТИЯ В СТРАНЕ ПРОЖИВАНИЯ. ЕСЛИ ВЫ НЕ ДОСТИГЛИ СОВЕРШЕННОЛЕТИЯ, ТО ПЕРЕД ПОЛУЧЕНИЕМ ДОСТУПА К ИГРЕ ИЛИ ЕЕ ИСПОЛЬЗОВАНИЕМ ВЫ ДОЛЖНЫ ПОЛУЧИТЬ НЕОБХОДИМОЕ СОГЛАСИЕ ОТ СВОЕГО РОДИТЕЛЯ ИЛИ ЗАКОННОГО ОПЕКУНА.

    НАСТОЯЩЕЕ СОГЛАШЕНИЕ ДОЛЖНО РАССМАТРИВАТЬСЯ ВМЕСТЕ С НАШЕЙ ПОЛИТИКОЙ КОНФИДЕНЦИАЛЬНОСТИ, КОТОРАЯ РАЗМЕЩЕНА НА СТРАНИЦЕ https://owlcat.games/privacy И ЯВЛЯЕТСЯ НЕОТЪЕМЛЕМОЙ ЧАСТЬЮ НАСТОЯЩЕГО СОГЛАШЕНИЯ.

    АНГЛИЙСКАЯ ВЕРСИЯ НАСТОЯЩЕГО ДОКУМЕНТА ЯВЛЯЕТСЯ ЕДИНСТВЕННОЙ ОРИГИНАЛЬНОЙ ВЕРСИЕЙ И ИМЕЕТ ПРЕИМУЩЕСТВЕННУЮ СИЛУ В СЛУЧАЕ ВОЗНИКНОВЕНИЯ КАКИХ-ЛИБО РАЗНОГЛАСИЙ, ВОПРОСОВ ИЛИ СПОРОВ ОТНОСИТЕЛЬНО ЗНАЧЕНИЯ, ФОРМЫ, ДЕЙСТВИТЕЛЬНОСТИ ИЛИ ИНТЕРПРЕТАЦИИ.

    Настоящее Соглашение является юридическим соглашением между вами (<b>"вы"</b>), физическим лицом, и Owlcat Games Ltd. (<b>"мы"</b>, <b>"нас" </b>, <b>"наш"</b>), компанией, созданной и существующей в соответствии с законодательством Республики Кипр, имеющей регистрационный номер HE 398803 и зарегистрированной по адресу Irodi Attikou, 8A, Lakatamia, 2332, Nicosia, Cyprus, в отношении использования вами Игры. Если Игра предоставляется через стороннюю платформу, вы несете полную ответственность за то, чтобы использование вами этой платформы соответствовало ее политике и соглашениям. Учтите, что нам может потребоваться внести изменения в настоящее Соглашение для соответствия требованиям сторонних платформ.

    Любой товар, приобретенный во внутриигровом магазине, будет являться покупкой у компании Sony Interactive Entertainment Network Europe Limited ("SIENE") и подчиняться Условиям обслуживания PlayStation™Network, с которыми можно ознакомиться в PlayStation™Store. Пожалуйста, ознакомьтесь с правами использования — они могут быть различными для разных продуктов. Если не указано иное, товар в любом внутриигровом магазине имеет ту же возрастную категорию, что и игра.

