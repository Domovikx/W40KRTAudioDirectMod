  text: '<uppercase><size=115%><b>ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ С КОНЕЧНЫМ ПОЛЬЗОВАТЕЛЕМ WARHAMMER 40,000: ROGUE TRADER</b></size></uppercase>

    <b>ВАЖНЫЕ УВЕДОМЛЕНИЯ</b>

    ВНИМАТЕЛЬНО ПРОЧИТАЙТЕ СЛЕДУЮЩЕЕ ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ С КОНЕЧНЫМ ПОЛЬЗОВАТЕЛЕМ ("СОГЛАШЕНИЕ") ПЕРЕД ЗАГРУЗКОЙ, УСТАНОВКОЙ ИЛИ ИСПОЛЬЗОВАНИЕМ ИГРЫ WARHAMMER 40 000: ROGUE TRADER ИЛИ ЛЮБОГО СВЯЗАННОГО С НЕЙ ПРОГРАММНОГО ОБЕСПЕЧЕНИЯ (совместно именуемых "ИГРА"). ЕСЛИ ВЫ НЕ ПРИМЕТЕ ВСЕ УСЛОВИЯ НАСТОЯЩЕГО СОГЛАШЕНИЯ, ВЫ НЕ МОЖЕТЕ УСТАНАВЛИВАТЬ ИЛИ ИСПОЛЬЗОВАТЬ ИГРУ.

