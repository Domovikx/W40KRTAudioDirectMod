- guid: afd7c055-ee9a-4e42-b013-4e175d1eacec
  text: Невозможно перезарядить оружие с полным боезапасом.
- guid: aff90c9a-e24a-49f1-b814-a5bc7492e59a
  text: Базовый урон
- guid: b0178c51-8271-4152-a392-5b67d5ef89f6
  text: Передвиньте бегунок, чтобы изменить громкость голосов игровых персонажей.
- guid: b0348976-e229-494f-9c9b-763958dc6551
  text: 'Недоступно. Причина:'
- guid: b04348eb-89d7-4532-b1ae-53c6544faf98
  text: Процентный модификатор значения моментума, получаемого отрядом из разных источников.
- guid: b052cf84-ce93-4ba9-a637-5671c82aac98
  text: Улучшить архетип
- guid: b05ab744-60f7-464c-9233-1fb939c26db5
  text: Удерживайте, чтобы осмотреть все
- guid: b0b910b4-1e6e-47ef-bf9d-3dbe5ba7051f
  text: Значение определяет время, через которое появится описание после наведения курсора на объект.
- guid: b0bccce2-4784-42c4-aa1b-45ee717b921e
  text: Загрузить
- guid: b0ce8273-4a96-4f2e-9581-3490b6018f2b
  text: Ускоренное перемещение
- guid: b0d8a0d8-5731-4d2a-8e37-e2bc08160701
  text: Подтвердите смену управления на геймпад.
- guid: b10a7277-5bd5-4423-ad7b-d9d006dd05a1
  text: квест
- guid: b110104e-6795-4e46-8552-ef68e233aa78
  text: Улучшить до <color=#2EA122><b>безопасного</b></color>
- guid: b14a2e44-d876-4c05-b648-8dfa0081be82
  text: Начать сканирование
- guid: b1b1b59f-ac64-4fd3-a880-edfd42c47927
  text: Приостановить видео
- guid: b1e4d333-7cc1-45cf-9716-a19daf7c6ae2
  text: Количество доступных повышений ранга.
- guid: b1e8dad6-a959-479c-b84b-25e02762f093
  text: Показать карточку профиля
- guid: b1ecce0b-b52c-45ee-b6c6-189bd12660e7
  text: макс.
- guid: b21ed3a4-f110-45fe-8099-790ab72c123f
  text: Навык достиг максимального уровня улучшений
- guid: b2255562-cfd7-4b09-b6ad-1440a177fc46
  text: Поток посетителей
- guid: b23edac2-1d86-4e0c-af4a-fa3b491132eb
  text: Надеть
- guid: b2423eda-61b1-4679-99ff-b1b0e879105e
  text: Стоимость в ОД
- guid: b2430802-7720-43fe-903f-76a7158ede7e
  text: Низкий уровень репутации
- guid: b24a3d32-292b-4781-bb6d-210b57b7635a
  text: Базовое снижение моментума
- guid: b268903f-3b75-410e-a5cb-4f9d66c013d7
  text: Башни
- guid: b278d6be-bd44-4536-8b10-033cfec4aa71
  text: Здесь вы сможете выбрать способности архетипа первой ступени. Сейчас архетип первой ступени не выбран. Повышайте уровень персонажей, чтобы разнообразить набор способностей.
- guid: b2b43c9d-af07-4e02-a3d1-1f4a19386713
  text: 'Исключает проект: {0}'
- guid: b2e5ca6d-0189-4c0c-ae73-dc5d11b188d8
  text: Вы будете перенаправлены на веб-страницу
- guid: b3066795-b73e-4344-91d7-3f624b2bc2a9
  text: Это действие доступно только Вольному Торговцу.
- guid: b34373ee-f8bd-4a77-b504-e9bf32ae0c2f
  text: К архетипам
- guid: b347c9bb-4214-4e96-b7f5-6c538929c8d3
  text: Оставаться на позиции
- guid: b3994ec8-d723-40f1-bb4b-61bcb206dbad
  text: Скорость вращения камеры с помощью мыши
- guid: b3b45990-ef6f-4dce-9540-bc732944bb24
  text: Для начала сделайте выбор
- guid: b3b4d604-4a8b-4681-9de0-b13aa8fa1d38
  text: 'Активные задания:'
- guid: b3c8f2e8-0ec3-448c-b642-a1a0b14603ee
  text: '<b>Репутация фракции увеличена на</b>: {0}'
- guid: b3e341da-956e-4a61-a9e3-d21f5f1650a1
  text: Очки действий
- guid: b3f0cb31-739a-4c14-973d-2c7a7df88dc0
  text: Все
- guid: b476fb64-ddc0-4804-bbf5-dc706ad6a71f
  text: Снижение уклонения
- guid: b4ad0eb1-1544-4146-9e43-5c425c1d3fce
  text: Парирование
- guid: b4f36b36-7651-4208-9f09-15816081a9ed
  text: 'Позволяет скрыть элементы интерфейса при создании скриншота:

    <br>

    0/9 — Скрыть все элементы интерфейса

    1/9 — Отображать статичные элементы (основные панели, меню и др.)

    2/9 — Отображать динамические элементы (интерактивные кнопки, данные о состоянии существ и их действиях, отображаемые над моделями в бою, пузыри речи и др.)

    3/9 — Отображать стандартные элементы (тултипы, руководства и др.)

    4/9 — Скрыть все, кроме курсора

    5/9 — Скрыть все, кроме кнопки сообщения об ошибке

    6/9 — Отображать статичные и динамические элементы

    7/9 — Отображать статичные, динамические и стандартные элементы

    8/9 — Отображать статичные, динамические и стандартные элементы, а также курсор

    9/9 — Отображать все элементы интерфейса'
- guid: b4fb0e7d-528c-43a6-943e-e69bf4d01eeb
  text: Высокоразвитая планета, управляемая Адептус Механикус.
- guid: b5434f8b-559a-43e1-9836-528f74e47714
  text: Несохраненная игра будет потеряна.
- guid: b56d86f3-b4bb-4991-8dee-90ec7a8cd312
  text: При включении этой опции во время боя над персонажем будут показываться оповещения о результате проверок на сопротивление.
- guid: b582340c-ddae-4f00-9af1-c70a6b4fb679
  text: '[<b><color=#{2}>{0} +{1}</color></b>]'
- guid: b584b948-2d26-4a69-90f2-e3a20e3b3765
  text: Ксенос
- guid: b5a63ab3-b399-42fd-8cde-26b5564eb0e7
  text: Завершено
- guid: b5c392f5-25fb-4ca4-9cc6-b3f405a18c5d
  text: Все
- guid: b5e0b3a4-0735-4cfc-831a-08805df7be5f
  text: Мир-кузня
- guid: b5e0e996-4edc-4767-bea1-ff6bced65f2c
  text: Клинок
- guid: b5e41261-f84d-43c9-af11-1d844813014a
  text: В инвентарь
- guid: b605fc55-eea7-4f88-922f-34716c00da19
  text: Выберите талант архетипа второй ступени
- guid: b61548ae-6d19-4a7c-806e-25703e3ffd41
  text: Способности
- guid: b6241637-8145-4952-8659-5e662653a442
  text: Назад
- guid: b6323b52-a69c-41e3-b4df-356d9acb0dc1
  text: Башни
- guid: b63288aa-f041-4d55-b6fc-f459612bb75c
  text: Сложенные здесь трофеи упакуются в грузы.
- guid: b64818ce-b37f-44d4-8c30-f175e3d40963
  text: Клиент обнаружил, что ответы сервера не поступают вовремя.
- guid: b6969013-b507-4f10-84ef-6cca40846176
  text: Поборник
- guid: b6bb4d76-d66a-494b-9162-c4d7c447915c
  text: Похоже, в предыдущий раз игра завершилась из-за недостаточного свободного места на диске.
- guid: b6c2bf69-fb51-4e52-98ab-e090e2bf3d0a
  text: Позволяет подсветить интерактивные объекты.
- guid: b6d09257-7a54-4f57-8551-48d69e264727
  text: Устанавливая этот флажок, вы соглашаетесь получать обновления, связанные с игрой, и другие новости от <link="pp">Owlcat Games</link>.
- guid: b734536b-4921-4788-a00b-1c067447c203
  text: Подразделение Адептус Терра, занимающееся набором и обучением псайкеров для службы Империуму.
- guid: b7761383-d7a4-49a1-bee6-607cecbc6d5a
  text: Максимальный урон
- guid: b77875c5-23ce-4b36-9e9e-a85583c4f3a2
  text: Способность 14
- guid: b789029a-5b57-4024-9ef0-fa7104bce603
  text: Проверка навыка
- guid: b79c1d16-1d5b-4417-a420-b1c68be73bdd
  text: Выберите основную цель
- guid: b7c8e5ca-7e5e-4ef4-be10-163e9f2be6db
  text: Нет особых способностей
- guid: b7ca6b4d-852f-47ec-8eeb-c1cb90f90ce2
  text: Смещение безопасной зоны
- guid: b7ff7430-77a2-4757-ad09-0423ebb325c9
  text: Скрыть непригодное для ношения
- guid: b8008644-8407-4c31-9307-3388e7a895a0
  text: Награда колонии
- guid: b82b03ad-c6c4-406a-aa53-dd4741408ca7
  text: Громкость голосов игровых персонажей
- guid: b83d3d72-f1b1-43c7-8ddd-0cbc3e3de5f6
  text: Осталось здоровья
- guid: b83d50d2-f67e-4c83-b908-0f88661c7fff
  text: Выберите талант гранд-магистра
- guid: b8419951-e92f-48e9-ae84-8b8465306f74
  text: Оружейная способность 1
- guid: b84a95e5-e58a-4dac-9678-62e57b533fab
  text: '<b>Когда истончение завесы достигает 15 и выше:</b>

    -<indent=3%>Шанс вызвать пси-морок возрастает в 4 раза.</indent>

    -<indent=3%>Применение значимых психосил может вызвать появление угроз варпа.</indent>

    -<indent=3%>Используя малые психосилы, несанкционированный псайкер может вызвать пси-морок с шансом <u>(20 + 4 × пси-рейтинг)</u>%.</indent>

    -<indent=3%>Используя значимые психосилы, несанкционированный псайкер может вызвать пси-морок с шансом <u>(20 + пси-рейтинг + значение истончения завесы)</u>%, если угрозы варпа не появились.</indent>

    -<indent=3%>Используя малые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>(10 + 2 × пси-рейтинг)</u>%.</indent>

    -<indent=3%>Используя значимые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>(10 + пси-рейтинг + значение истончения завесы)</u>%, если угрозы варпа не появились.</indent>'
- guid: b8d5b02f-44df-4cab-a88f-98e513c25630
  text: Минимальный урон
- guid: b8e52fd5-72ff-42ee-91e2-e12e73c584ea
  text: Диалог
- guid: b8f1a4bc-0404-4f71-a8a7-d13676373cab
  text: Чем ниже значение броска кубика со всеми модификаторами сложности, тем больше шансов попасть по прямой линии.
- guid: b9146474-7e4a-40d4-aabb-8119ad052c76
  text: '<b>Предметы потеряны</b>: {0}'
- guid: b92fbcc4-d98f-4c35-b68f-a008ef8968b0
  text: Вы уверены, что хотите забрать оставшиеся трофеи и покинуть локацию?
- guid: b934fc5b-cb97-48ac-ba88-3c4bca93b0f1
  text: Необходимо решение Лорд-капитана
- guid: b96cba7c-a455-4ad7-9bbb-41597e2302d8
  text: Корабль Лорд-капитана получит черту {0}.
- guid: b9727e29-68b1-4364-9ea0-cc037ba0e285
  text: Желаете развернуть <b>{text}</b> для добычи ресурса <b>{description}</b>?
- guid: b97e6544-9049-4c12-9290-a6f21db7b54a
  text: Вы не можете выполнять сохранение в режиме "Мрачная Тьма"
- guid: b9b9ddd6-b9b9-4661-8a47-d0abd0998b40
  text: Включить прокрутку камеры вне окна игры
- guid: b9bda211-6c13-415f-bca2-1c92f4f7c014
  text: 'Количество выстрелов: {0}'
- guid: b9c1c9bc-7370-4f0a-b07b-f612041ea436
  text: Сложность броска
- guid: b9f0d181-85da-40fa-a80a-5c5fbbae1fcc
  text: Кликните {mouse_icon|LeftMouse} чтобы показать страницу в Энциклопедии
- guid: b9f22cb5-5fe0-4c82-8a11-f6c273bc9caa
  text: Персонаж
- guid: b9f399d4-0dee-45a8-b547-80946fd4102a
  text: '{0} хочет присоединиться к лобби и ожидает перезапуска игровой сессии.'
- guid: ba3dccf9-be92-491a-b498-cc3b121ce763
  text: Стоимость последующих сбросов прогресса будет увеличена!
- guid: ba41fc72-12ee-41a1-9a35-f167d1835e59
  text: Нет доступных наград
- guid: ba550ecf-375c-404f-b9d6-ec6ba6b7eb52
  text: Способности
- guid: ba5a8e34-c17e-46e9-afc5-b2e1eee346e3
  text: НЕПОДХОДЯЩИЙ ПРЕДМЕТ
- guid: baa17f19-8786-4f29-8267-99d0385a5b4a
  text: Оружейная способность 8
- guid: baaf2326-6849-422f-a331-c414b82a4182
  text: Отражение
- guid: bad2425c-f692-4a97-bbb3-82c5974be7c2
  text: Выбрать
- guid: badf212f-1e5d-4924-87e8-35185684acae
  text: Ускоряет перемещение персонажей вне боя.
- guid: baf546f7-aa78-4fe1-98e0-4acb7c1d2aa9
  text: Бой окончен
- guid: baf6163e-c7a3-4b25-a765-90208e37add5
  text: Воспроизвести видео
- guid: bb2cc192-3a2d-41a7-9ebd-66bbd26fca0d
  text: Дальность
- guid: bb780f34-1941-4673-b4ad-624624d45bc9
  text: Пригласить игрока
- guid: bbc3e7b9-31d5-494b-a8c9-0ca0dcb82130
  text: Стоимость ---
- guid: bbef432e-4fe3-46bc-a3ff-b2e12005df2b
  text: Эксплораторы
- guid: bc007cad-a834-4416-9fe8-660ba52f012a
  text: Автосохранение включено
- guid: bc2f96dd-c33f-42eb-8c59-95da72fe822b
  text: Нажмите {mouse_icon|RightMouse} чтобы развернуть
- guid: bc54db1d-62e8-4e2e-aa10-7585fbbdeab5
  text: Удалить персонажа
- guid: bc5530ad-eaf2-48c7-bf65-2ad04029c4ba
  text: Процент от максимального здоровья, потеря которого за один раунд приводит к ранению персонажа.
- guid: bc9da1b4-f7f1-48e0-9a5d-bc70ad7accda
  text: Целостность корпуса
- guid: bcb3720f-16da-475b-94af-d319eca7cb06
  text: 'Цель находится под воздействием эффекта: {text}'
- guid: bcbe0d34-099e-4985-8916-c9fd953898fd
  text: Показать завершенные проекты
- guid: bcc8684e-5c34-406a-ba7f-475b5305a3ec
  text: Уклонение
- guid: bce11500-f7bb-473f-bac0-43e138a0b081
  text: Кто может приглашать
- guid: bcf0f2dd-da04-40a8-8866-34100703746c
  text: Непрочный союз пиратских фракций Простора Коронус. Они не трепещут перед святынями, не боятся властей и готовы бросить вызов даже самым могущественным Вольным Торговцам и другим слугам Императора. Ризза Калвария, которая говорит от лица братства, охотно примет у вас любой сомнительный груз. Говорят, ее любимое место на Футфоле — "Стойкость мученика".
- guid: bd384cd7-dd2b-41b5-954a-f5eb8a86a41e
  text: Прочее
- guid: bd993e3a-37d1-4011-9df1-fdb3147590c3
  text: 'Способности:'
- guid: bddc3335-765b-4d21-ba21-4b2771d78294
  text: Скорость движения курсора в окне игры.
- guid: be0c039c-0bcc-4349-ad08-0b247c0e1e6c
  text: Бронепокрытие блокирует часть входящего урона.
- guid: be45e419-0709-4043-9239-0f960522ffac
  text: Показать характеристики
- guid: be837c22-c627-414a-9df3-c2dd5e847e4e
  text: Улучшения разблокированы
- guid: beafd014-32e7-4826-9a12-5807ff8de860
  text: Чтобы продолжить, используйте все доступные очки повышения ранга.
- guid: bec5ada3-c67b-48ee-aa51-04cd865296b6
  text: Отношение фракции {0}
- guid: bef8e33a-652c-4a70-a3a1-e2991005e0d1
  text: Для доступа к кооперативной игре у вас должна быть активная подписка PlayStation Plus.
- guid: beffcd74-fdd9-4f21-adf1-02889c9ea7c6
  text: Смертельная
- guid: bf190b1b-80d8-442e-9753-f1d4ab112aaa
  text: Тританопия (синий-желтый)
- guid: bf1bfb88-ce2a-44a4-bf4e-d5b7b572c6ee
  text: Следовать камерой за персонажем
- guid: bf5e3dbb-167d-43a8-8d9f-da9e8e643a7b
  text: Часто
- guid: bf771b1a-a01b-4cb3-a795-8ca9955eaffa
  text: '{0}: модификатор ранга противника'
- guid: bfb0ab66-765b-43ec-bbb9-542bdd19e356
  text: Способность 17
- guid: bfd8b57d-5011-485a-9a06-aa056531090f
  text: Не выполнены требования проекта
- guid: bfdf3aac-e1cc-4220-9544-4367a847c6ee
  text: Скорость движения камеры при перемещении курсора к краю окна.
- guid: bfff4d9e-0ad1-4a85-9661-7bb1681cfe75
  text: Выполняется
- guid: c020bc40-335f-45c2-adab-71324cbff387
  text: Экипаж
- guid: c02565f9-db75-4d6b-b904-0490856a9958
  text: Качество
- guid: c033bc08-4f24-4e3d-a5ec-a7baee8e9c30
  text: Синхронизация частоты кадров игры с вертикальной разверткой монитора.
- guid: c048afbe-16d4-4e2b-a84d-69c8b0d5cda3
  text: Пауза при обнаружении ловушки
- guid: c0496a49-9e23-46f2-a221-4f1ac8db0b67
  text: Нельзя использовать, если потрачено хотя бы 1 ОП
- guid: c070a534-578f-4798-85eb-ae71dbecd981
  text: Отображать рюкзак
