- guid: 53a1a763-2a2d-439a-ba62-ca1f5e00f7fc
  text: Всплывающие оповещения об уроне
- guid: 5422fbda-0437-40cd-9e43-bd4ce08d4bac
  text: 'Требуется все перечисленное:'
- guid: 54274605-49ed-4c86-a811-237d2562ee1e
  text: Переключение видимости пользовательского интерфейса (UI)
- guid: 543301a4-3d88-456b-89c9-cc4f7331aae5
  text: Корабль не имеет повреждений
- guid: 5486d860-7f05-4fcb-8749-d3b9468b26e1
  text: Женщина
- guid: 549a63ee-4e73-47ad-9bb3-7c542589c20d
  text: Одиночный выстрел
- guid: 54e543b5-6d02-4540-8cbe-6a6caa539b3e
  text: Происхождение
- guid: 54e6e6be-d1af-42b1-864f-a1a495445e2e
  text: Позволяет открыть меню персонажа.
- guid: 54fd8267-f7b9-4a03-bc0d-0ea13edbe287
  text: Щит (корма)
- guid: 5532e35e-d8ee-4c51-9d8c-24a604d60ae4
  text: Защитные способности
- guid: 557f50b6-113e-48ae-97d2-7b3f464e04b5
  text: попадает
- guid: 558c29f8-d0e1-4abe-9a7c-1b65187ab285
  text: 'При включении этой опции соратники под управлением искуственного интелекта будут использовать в бою только неограниченные в количестве действия, способности и заклинания.

    При отключении этой опции соратники под управлением искусственного интелекта будут использовать все доступные способности и заклинания, в том числе требующие восстановления отдыхом.

    Предметы не используются.'
- guid: 559781f0-9bb9-4024-8500-e1bcd2c9a00c
  text: ГЛАВНОКОМАНДУЮЩИЙ
- guid: 560aef79-fa65-4911-bddb-34965b810e4b
  text: Невозможно улучшить
- guid: 5631b2c2-545e-48d7-9d25-0934c11b3913
  text: Met
- guid: 563b7837-b055-4477-9e35-db544f57c6cb
  text: Пропуск анимаций неатакующих способностей
- guid: 5642d9da-1fe6-427e-82d2-6b4ca28b090b
  text: Сейчас вы не можете развить этого персонажа. Для начала завершите или отмените повышение уровня другого персонажа.
- guid: 565a088d-7075-4a3b-a6c4-554f746e1354
  text: Немного задело
- guid: 567aa11d-593d-48db-bfb2-68b6c7b312aa
  text: Подготовьтесь к бою. Расставьте персонажей на позиции.
- guid: 568a26ce-4a20-45f0-85d4-64092604d7e8
  text: История
- guid: 569cb77c-d823-4373-9003-7bc8c5f2e43a
  text: 'Для использования собственного набора портретов замените изображения в папке

    <b>{portraits_path}</b>

    Для корректной работы не меняйте название, формат и размеры изображений.'
- guid: 56ac3540-8c3a-4c5a-a548-a8423253d447
  text: Развитие событий через {0}
- guid: 56ee01f4-adbc-4bd5-9d9b-73544fe09dfc
  text: Вы уверены, что хотите отказаться от соглашения и выйти из игры?
- guid: 56fc7cda-3c3b-42d3-9654-be8b67ece019
  text: Ответ в диалоге 1
- guid: 56fdf633-d253-44c9-8f22-2cc6d423c185
  text: 'Не удалось подключиться к лобби. Убедитесь, что оно все еще существует. Код ошибки:'
- guid: 57240d04-4601-4911-a398-86e3aa5eaa2d
  text: Ответ в диалоге 4
- guid: 573bddd6-f160-494e-b660-19911788659d
  text: Решение Лорд-капитана
- guid: 57557b42-a057-4e9b-a16b-50757d379ed3
  text: Для добычи ресурсов необходим экстракциум
- guid: 57777400-aefc-4518-81ad-7612c9c985da
  text: Цветовая схема
- guid: 577a3163-f5b0-4e6f-9581-249c0e9a0c02
  text: Торпедные залпы еще не готовы.
- guid: 57e3598a-f321-4d1a-a23f-1b1c631fc312
  text: Повышение характеристик
- guid: 57e4b20c-ac5d-4762-afd7-0263febddeb1
  text: Нет подходящих грузов
- guid: 58240cda-b108-42c8-9586-93044d20fda3
  text: Отменить сканирование?
- guid: 58273399-3974-4547-807b-79578695a9c9
  text: Квест выполнен
- guid: 584f6fa5-ca4b-426a-8e64-4f95f777c462
  text: Скрыть недоступные
- guid: 58a38f29-f2b9-4fcf-9be4-5f39a87b23f9
  text: Результат броска
- guid: 58b9baee-f7ee-436d-8a78-23039884f8fa
  text: Нормальная
- guid: 58c70787-1749-429f-9ef6-ce86c10a8070
  text: 'Невозможно приобрести:'
- guid: 58d58a79-8e09-4d91-b3f2-b50c646ccea6
  text: Отменить
- guid: 594c1418-afe1-444d-b193-e441135c0078
  text: Качество сглаживания
- guid: 59743555-1d58-4cb9-aacb-7241b00d4fc0
  text: Малые психосилы — завеса истончается на 1
- guid: 597f0852-3765-436b-99ac-71233d6e5f4c
  text: Качество объемного освещения
- guid: 598860d6-a756-4d7e-836d-33858aa640be
  text: Навигатор
- guid: 59acc5e5-f742-4e77-bf96-a48cd3bbf1e7
  text: Провал
- guid: 59c3dd5b-e8ce-415a-b96c-bc302a95caed
  text: ID лобби скопирован.
- guid: 59dfb168-6ae1-419c-8891-740118d8ef95
  text: Ускоряет анимацию персонажей игрока во время их хода.
- guid: 59e0973b-a9c1-4499-8992-458df926d21e
  text: Базовый шанс блока
- guid: 59e750ca-d496-4ddd-a576-d4b33c0236ac
  text: Системная информация
- guid: 5a14714c-c0a6-4d50-8c0d-4384b7cb2ba4
  text: Нет доступных способностей
- guid: 5a5166c8-2976-401f-8349-912c2e717499
  text: Выберите способность
- guid: 5a624981-1d35-4ae1-95e8-b7447c674c14
  text: Вы уверены, что хотите сбросить изменения и вернуться к предыдущему набору подключенных DLC?
- guid: 5a64f3c2-1a87-4793-aa3f-b8a4e7bab3cb
  text: ИИ не использует ограниченные в количестве способности
- guid: 5a65bc56-b829-4c54-a9cf-a3338244c479
  text: Способность не может быть применена снова в этом раунде
- guid: 5a8c419e-bb91-4d5f-9cd3-2161316c9f9d
  text: Громкость голосов
