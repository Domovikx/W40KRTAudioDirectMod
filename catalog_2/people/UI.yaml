- guid: 4b5421de-e9c0-4703-a60a-1c76a532fb41
  text: Здесь вы сможете выбрать таланты архетипов первой и второй ступеней. Сейчас архетип первой ступени не выбран. Повышайте уровень персонажей, чтобы разнообразить набор талантов.
- guid: 4b576345-70d3-4427-b229-f686a6b811d7
  text: Сделка еще не завершена. Вы действительно хотите выйти?
- guid: 4b6cb660-fa13-4c05-93b8-69b89ee4849a
  text: Модификаторы характеристик
- guid: 4b6ffa65-9c50-4529-a74d-c6b88da870ec
  text: Язык
- guid: 4bced02d-47c7-48d8-96fa-0fb8ef27822f
  text: Пауза
- guid: 4bd207e0-5ddd-4a19-a15a-073e8627704f
  text: Подождите, выполняется синхронизация данных.
- guid: 4bfab005-6136-4343-9ab7-92bcd275f639
  text: Левая кнопка мыши
- guid: 4bff4eb0-e05b-4dec-938f-87d8da829c84
  text: Facebook
- guid: 4c2227f1-eec4-4a51-a00f-e652bb04676c
  text: 'Цель находится под воздействием эффекта: {text}'
- guid: 4c249c84-e363-477b-939c-c952a03331a2
  text: Начало хода
- guid: 4c3708fb-18c9-4eeb-b52b-d85a070a0d4e
  text: Эксплораторский флот не осведомлен
- guid: 4cad6f1d-d6bb-492a-95a0-0bbe7208c9c8
  text: Этот контент уже интегрирован в игру и не может быть отключен.
- guid: 4d219ab8-1ce5-4019-acb8-f90de868cda9
  text: Игра на этой сложности не рекомендуется для игроков, не знакомых с системой Rogue Trader и ее воплощением в этой игре.<br>Вы подтверждаете свой выбор?
- guid: 4d35a018-d170-41d1-9e3c-a25fc1f1f302
  text: Вы находитесь в зоне действия слуха.
- guid: 4d377c8a-f3a9-488e-8aba-401c75025740
  text: Изменить отряд
- guid: 4d39f569-1446-4f32-a4ff-f6a0a4acf4fa
  text: Доступные особенности происхождения
- guid: 4d3c3efe-a761-4745-bff7-183225ff5182
  text: Все
- guid: 4d6957dc-fe58-49df-a526-b8d0a6417cc8
  text: Настройки сохранения
- guid: 4d6b05fe-9883-443b-b1de-8bd0dcb1a692
  text: Способности
- guid: 4daf0c44-9f06-426a-8e95-a54dc99b7963
  text: 'Получена награда колонии: <b>{0}</b>'
