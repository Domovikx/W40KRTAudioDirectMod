  text: Ответ в диалоге 5
- guid: 4fd3fa59-74a3-4bd8-92eb-7e3b627d2db4
  text: Быстрое перемещение
- guid: 4fe89236-7cde-428c-87a4-79b7e9970059
  text: Урон
- guid: 4feae4d0-2da4-4782-8cde-b206ab07f00e
  text: Оружие
- guid: 50125ddc-4904-4c1b-b2b3-d1d356d4dafd
  text: Ваш ход
- guid: 501ddf30-80e4-4f04-b72c-46c877cfbb65
