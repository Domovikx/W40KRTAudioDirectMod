- guid: 4a17e580-d538-49cf-8a75-1f08c3a961dd
  text: Выкл
- guid: 4a2a94d3-3165-4993-84c6-2bb6a672e2fd
  text: Выйти из локации
- guid: 4a47537e-f2be-4212-8017-8ed9059c410d
  text: FSR резкость
- guid: 4a9c025e-d4c2-48b3-9270-0f0b42bc782d
  text: Ресурсы отсутствуют
- guid: 4aaf094d-dc17-4254-aadd-cbd8da672cb5
  text: Нет доступных улучшений для архетипа.
- guid: 4ac12230-f064-4d6d-ab47-8591928bb1f0
