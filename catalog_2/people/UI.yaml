total_phrases: 1994
phrases:
- guid: 0004ce39-6474-47b1-a65f-85365b83a5b1
  text: Архетип {0} успешно изучен!
- guid: 0025f947-1af6-41c6-ad7a-cdcd2a4feff0
  text: Санкционированный мутант, гены которого позволяют ему безопасно перемещаться в Имматериуме.
- guid: 002b97fb-671c-4390-b5fc-5f585b5d6df1
  text: Выбрать всех персонажей
- guid: 00413af7-1b17-4e9d-a5e9-2f170ded1409
  text: Управление грузами
- guid: 0099d9db-0a80-45d3-92c4-5ec72ec17f07
  text: Развитие корабля
- guid: 00b21e67-f26a-4510-b9fe-fcd1f87e1fea
  text: Количество раундов до того, как свежее ранение станет старым
- guid: 00bb71ee-b869-42a4-8655-60599daa381c
  text: Нажмите <sprite name=LeftMouseBTN>, чтобы посетить систему
- guid: 00bf112e-7f29-428e-a5c1-551af1d0b6da
  text: Минимальный урон, наносимый вражеским кораблям, с учетом брони и отражения
- guid: 0119f136-c88b-472e-af3e-6e27233b089b
  text: Модификатор накопления моментума отряда (+%)
- guid: 01365d5e-4983-4d36-a719-50eb28ed2b15
  text: Моментум изменен
- guid: 01390848-2fb9-457e-bcae-baefc9d81b8b
  text: 'Не должен иметь особенностей:'
- guid: 015c2548-fc1c-4a06-9af0-63bd04f86664
  text: Веха развития
- guid: 016abf0d-3b02-4108-8dc3-e905d8c5f72f
  text: Экран
- guid: 019420ea-89ec-4f93-8f9a-9c449b494b72
  text: МАСТЕР ЩИТОВ
- guid: 01c56231-60d7-41d9-84ed-997a0264053c
  text: Понятно!
- guid: 01e87a59-29e8-40e9-9d0a-73ab8b2b20b0
  text: У вас пока нет этого DLC
- guid: 01fde9ce-74ef-4bab-8799-dde2cc98e432
  text: Разделить
- guid: 0237ac54-52c8-40a8-92b1-a9d991b8de48
  text: Прав
- guid: 0238d37e-97d9-49f9-9318-64b527526c86
  text: Пропуск катсцены (удерживать)
- guid: 024166d4-0f1a-45e2-97e6-f34ee83cf334
  text: '[<b><color=#{1}>{2}: {0}</color></b>]'
- guid: 02bdc64d-c9ff-467e-b3ef-a81258548f50
  text: Показывать требования к убеждениям в диалогах
- guid: 02c3d53e-b3f2-49d8-a2cb-d2b42811eea1
  text: Показатель очереди
- guid: 03285a2a-d9a5-47e6-85dc-778d1636d350
  text: Трофеи
- guid: 0392358c-a760-4c76-b682-ae7dca88e330
  text: Случайное
- guid: 03a3ce61-ef22-4614-b477-d22819dff0a0
  text: Нос корабля
- guid: 03ddc70d-014d-4c56-b072-932b3a09a9d3
  text: Адептус Милитарум
- guid: 04045416-120f-489d-b26d-eedf38cd6a70
  text: Истек срок ожидания подтверждения (подтверждение от клиента не получено).
- guid: 044fedc5-bf64-44a5-bfb8-3b23e1dd6a29
  text: Предмет будет утрачен навсегда. Вы уверены?
- guid: 04630071-0d0f-4902-9bae-ef9fcb36bc92
  text: Доступное улучшение
- guid: 046c4cd2-9994-4487-9321-1b4e5b3d1832
  text: Введите текст...
- guid: 04b1c687-3d00-49ec-9c18-cb21b19df000
  text: Аугменты
- guid: 04eb4863-34c5-4ad8-8c5f-cd6a652a345c
  text: Невозможно исследовать тьму космоса без двигателя!
- guid: 050eb51a-76fa-424b-b19a-701932315b35
  text: Улучшенная способность
- guid: 05149060-2347-4eb9-8018-89f45b2d8b12
  text: Персонаж не может это использовать
- guid: 0520dd42-0d72-45b8-a6c0-bd8a8a799b78
  text: Создайте собственного Вольного Торговца с нуля. Проработанный процесс кастомизации позволит вам решить, кем ваш персонаж был до начала приключения. Выбирая из множества вариантов, вы сможете настроить его внешность и определить характеристики и возможности для ведения боя.
- guid: 0527ffe8-d96f-47f6-9836-0c0aee6aee69
  text: Создать своего персонажа
- guid: 0538b122-09bb-4c0b-85ae-5d50040602f1
  text: Как правило, в начале боя истончение завесы равно 0. Это значение увеличивается на 1 при каждом применении малой психосилы и на 3 при каждом применении значимой психосилы. При этом каждый раунд значение уменьшается на 1.
- guid: 054768e0-8d61-4ea5-add7-ac56246a9b4b
  text: Ваш путь окончен
- guid: 0551ca23-8d7c-44ad-b906-98c3b6222ef9
  text: Аномальных объектов не обнаружено
- guid: 056dffc7-7b81-40f1-9a75-b3ae68c9a462
  text: 'Похоже, ошибка вызвана повреждением локальных файлов. Рекомендуем проверить локальные файлы на целостность: https://owlcat.games/how-to-verify-integrity [страница на английском].'
- guid: 06270772-6b3e-405e-84e9-c33638631a42
  text: Вооружение корабля
- guid: 06349cd1-fabb-4ba9-998c-d79c07c8fe6e
  text: Аугмент не выбран
- guid: 063b0a98-552a-4a0d-916e-bca584f1bf06
  text: Можно установить в Секторе Бионика
- guid: 06463658-6103-46f7-ae1a-9cc21bace495
  text: Переместить
- guid: 06557e98-55e6-4ee2-b8b2-8e326d35b40e
  text: Фактор прибыли не изменялся
- guid: 06650842-1722-462a-9631-dfb512ce5065
  text: Повернуть камеру на север
- guid: 066540ee-eadd-42e5-8701-abbbc68a1d0d
  text: Сложность варп-маршрутов не может быть выше опасной.
- guid: 06733535-c3be-433b-8a7d-76855a6acd1b
  text: Психосила
- guid: 0683860d-6a6c-4e03-9584-ac427f566cf5
  text: Колесо прокрутки
- guid: 06c1b64e-dd1f-4322-af1b-04e549d9a934
  text: Автоматический провал
- guid: 06fffb8f-56f4-489f-954f-2b0c485cc26f
  text: Шанс блока щитом
- guid: 071fba7a-1cd7-4a1f-8b52-715d76d741fa
  text: Качество
- guid: 07272f0a-61e7-410c-894b-72ace73bc7cc
  text: Число раундов, по прошествии которого свежее ранение становится старым.
- guid: 074ca1b5-f190-4708-bcc1-76ade99630b4
  text: Ускорить ход противников (удерживать)
- guid: 0760ff1d-d1dd-4c32-8a4a-fcd3fce0e540
  text: На цель должен действовать эффект {text}
- guid: 076dc1a9-83a9-42ac-9322-2f774a4e5cc5
  text: Улучшение прошло успешно
- guid: 07742835-3a28-4308-930d-3ddae8d45029
  text: Значение навыка
- guid: 078cfdd0-5c28-4ac6-b0ed-fb5ccc793c11
  text: Сохранить изменения?
- guid: 07a340a2-ac4a-439b-8e69-3cb1937f4527
  text: Открыть глоссарий
- guid: 07b7a7a4-9f43-4e06-868f-82414cd9b015
  text: Включите эту опцию, чтобы скрыть всю маловажную информацию в описаниях заклинаний и способностей. Вы все еще сможете прочитать полную информацию, кликнув по заклинанию правой кнопкой мыши в Книге заклинаний.
- guid: 07c28306-bd4f-4b25-8721-4fe6d6024758
  text: Скрыть недоступные и уже выбранные варианты
- guid: 07de677f-d247-4ddf-90d6-d38b7571250b
  text: Копировать
- guid: 07e7599b-b619-4f9d-bc0f-c0618fadc84b
  text: <color=#777876>Подсветить строку выбора, способность или расходник</color>
- guid: 080d6f9d-2bad-4ad6-bd8a-8e82c5f511fb
  text: Строка
- guid: 0814cc6e-e641-4ab0-9efb-5fd9d3d1241a
  text: Полноэкранное окно без границы
- guid: 0832dede-290a-4f85-8577-34609e834a8a
  text: Поговорить
- guid: 084be864-39e3-4eb4-b4d8-59730b473158
  text: Способность 8
- guid: 0856ea0e-fa86-4130-afd0-6d0f75ee538e
  text: Использование способности запрещено
- guid: 086bae0d-975c-405b-b327-82c2a53df617
  text: В данный момент этот отсек не представляет интереса
- guid: 086d2f8d-4e94-49ec-afb5-40cf038d0fc3
  text: Требования
- guid: 08b02473-03ea-4d66-b691-05cc07df72c2
  text: Борода
- guid: 08caec43-0398-41f3-81ff-81ae28e99027
  text: Никто
- guid: 08df3878-cb2e-4cd7-8be9-ab15d1085f0b
  text: Вы уверены, что хотите сбросить изменения и вернуться к предыдущему набору подключенных модификаций?
- guid: 08f980bd-e877-45e7-811e-d0bba0ef80e4
  text: Используемые
- guid: 09029efb-3052-489f-9969-110ebd214c50
  text: Персонаж погиб или потерял сознание
- guid: 0904239e-1713-4af0-aef6-fa17718024d2
  text: Модификации
- guid: 09073117-95d7-40f9-ad36-7d59bbf56098
  text: Количество ранений, которое приводит к травме [ранения суммируются]
- guid: 091860c0-9160-4796-9aa6-d99d5ef23bdb
  text: Производится смена управления...
- guid: 092f2c0c-ec89-4e7f-97a8-dc8f028c97fb
  text: Открепить
- guid: 0954caf2-af7b-426e-b15e-70bacc8cd995
  text: Всегда складывать в зону "грузы"
- guid: 095a2210-2325-491a-b682-993328286979
  text: Вы уверены, что хотите удалить этого персонажа?
- guid: 098b98c9-5451-413a-80cd-65f09fa0bd69
  text: Приоритетная цель находится вне зоны видимости персонажа.
- guid: 099d090a-01da-45f0-8ccd-22f39cd1ba2a
  text: '{0}: решимость'
- guid: 09f17e2b-4fd7-4a38-bddd-00630dfa8862
  text: 'В колонии должен быть выполнен проект: {0}'
- guid: 0a09c05f-bd2b-4c31-9151-95071ff370be
  text: Мир колонизирован
- guid: 0a4daed6-3c42-493a-aa4e-4c09c7b3189e
  text: Шанс попадания
- guid: 0a639d35-7131-4e3d-8904-4f17c641a770
  text: Прокрутка по краю экрана
- guid: 0ad9d21b-33de-41f9-a854-15d3ee0dacf6
  text: Редактировать
- guid: 0b0e37df-7393-42a7-97f0-ad61c6c23e85
  text: Применить
- guid: 0b185390-9741-485d-993c-bb1c715ec307
  text: Правая кнопка мыши
- guid: 0b437c0b-88c8-443f-a9a7-cc49b9d463d6
  text: '[<b><color=#{1}>{2}: {0}</color></b>]'
- guid: 0b4822cd-3f7b-4ea0-ad38-879cdf95efab
  text: Члены отряда
- guid: 0b4b9b7b-fb30-41a0-ab15-8317d757fac7
  text: Сейчас ход другого игрока
- guid: 0b7de732-1bb0-4f84-91ab-976aa4dd1c87
  text: 'ВНИМАНИЕ: требуется личное присутствие на колонизированном мире!

    Отправляйтесь в систему с колонией и выясните, что происходит на планете.'
- guid: 0b8362ea-e3fd-4c69-ab57-e5cd8f2abe7d
  text: Эта настройка позволяет видеть результаты проверок навыков в диалогах. Когда ваш персонаж совершает действие с выбранным навыком, вы увидите, успешно ли оно выполнено и какие последствия имеет на развитие сюжета. Это поможет вам принимать решения в диалогах и контролировать исход игры.
- guid: 0b90936c-426b-462e-908e-7eb31814670c
  text: Доступны новые ранги
- guid: 0baae72f-4be8-46fe-9c47-eb3f25be9a3b
  text: При включении этой опции в инвентаре и у торговцев будут отображаться описания используемых предметов.
- guid: 0bad0414-d117-46f2-8fe1-051cbd149af3
  text: Активировать режим управления <nobr>Joy-Con 2</nobr> как мышью
- guid: 0bca1981-7bc4-4dd0-b04f-99a7e7132e60
  text: Инсерция правой руки
- guid: 0bddbd5c-2b47-4874-9b8c-10c9846acf62
  text: Можно приобрести
- guid: 0c0157ad-1aee-44fd-80d8-9d41f4ad2090
  text: Догматик
- guid: 0c2a79c5-fce4-4942-9851-bd5d95cc9fcf
  text: Похоже, в предыдущий раз игра завершилась из-за недостатком оперативной памяти, поэтому отчет не может быть отправлен.
- guid: 0c67fc3e-4d65-46a2-b08d-fccbdcc74337
  text: Действия
- guid: 0c6d5277-78db-4fdf-b111-814424e8e7cd
  text: Новая игра
- guid: 0cc4a319-d92c-46ed-a1f4-11994291761c
  text: Обновить
- guid: 0ce86da8-ad69-471e-b72d-1a8baa40ec18
  text: Бонус за полное укрытие
- guid: 0d497e54-5810-438e-82ee-82d8880ad6cc
  text: Возможные дубликаты найденного бага
- guid: 0d4d2672-91ef-4af2-a0be-b20928759320
  text: Новая Игра
- guid: 0d540dad-eeff-4858-8be9-28d06c12b570
  text: Стоимость маршрутов
- guid: 0d81a554-7178-4e8b-ac0d-6148bec6fb6f
  text: '<color=#67ee70><link="{0}">[{1}: Успех]</link></color> {2}'
- guid: 0d8716e8-afc3-4e98-b59e-c74b68ae19a1
  text: Геймпад отключен
- guid: 0d9e0336-e742-46b2-94e6-7a99b7a22e4c
  text: Оружейная способность 10
- guid: 0dbfa4b6-1c97-42c2-9a3b-d1ab93ba2b31
  text: Откройте для себя больше интересных модификаций!
- guid: 0e34d365-180a-4695-8d8d-5a95c6a86691
  text: Скрыть легенду
- guid: 0e37e754-6330-4476-87cf-ba9ac5ac5169
  text: Пауза
- guid: 0e383f61-327e-4fe0-b164-c50e23a52f92
  text: Разрешить сбор трофеев во время боя
- guid: 0e417c3a-29e4-4d73-a812-dc22319fa0fb
  text: 'Вы собираетесь активировать новый контент.

    После активации отключить DLC будет нельзя.'
- guid: 0e523e13-a25a-4cee-a5e4-b017bacc56c6
  text: Адептус Астра Телепатика
- guid: 0e8a4473-0950-4447-aef1-e5c53db105da
  text: Вражеский модификатор уклонения (+%)
- guid: 0ebd958b-77c2-426c-b57e-8ec046f321ec
  text: Выкинуть
- guid: 0ecaf448-dd87-45b3-97a0-3d16dac6a5a2
  text: Основная рука
- guid: 0eeda1c1-83cf-46a5-8012-b468edf1240a
  text: Экран
- guid: 0f866abe-2e85-4e39-941a-7e3388b029cd
  text: можно применить через фамильяра после использования {g|f:eab4d0bba84f4d1294f5cd64a1b33084}Перезарядки{/g}
- guid: 0f99652b-879e-410c-8fb8-aa8c605184bd
  text: Неустановленный объект
- guid: 0f9ef218-3240-443c-bf1f-63eb1da02904
  text: Все
- guid: 0fb3b142-2fe7-414d-86a9-e5e9095300ba
  text: Особенность происхождения
- guid: 0fc1952c-c64b-4cf6-8b47-b74300e2ce4e
  text: Моментум
- guid: 0fd1f2f7-0c3c-45a6-a785-bdcf23b6d895
  text: Недостаточно моментума
- guid: 10126c36-7774-477e-b10d-88ee592f002a
  text: Миры
- guid: 10a1b40c-7151-4535-9114-69fe83ede4a7
  text: Разрешить сбор игровой статистики
- guid: 10aaddba-25ec-4157-bd44-88cc463abd33
  text: Бронепокрытие и щиты
- guid: 10aebe8d-d96d-4b8e-8ee6-b747447943fe
  text: Эту настройку невозможно изменить, если выключен режим FSR
- guid: 10b6a7a0-cc9a-4bd5-8406-3237c1057ee3
  text: Аутентификация (временно) не удалась при использовании подписки на Photon Cloud без CCU Burst.
- guid: 10bbee44-949f-40fe-97c8-c743c2c65dea
  text: Discord (опционально)
- guid: 10fbd317-a47a-4dec-abc7-e6e35929306a
  text: Загрузка...
- guid: 113efb26-79ad-4a2e-9e41-13d644c24b66
  text: Громкость ударов и попаданий
- guid: 1140331a-82d4-4fa9-b4aa-29d0b791dc78
  text: 'Дата:'
- guid: 11719c83-8c33-4b7e-91da-0feafacc292f
  text: Трофеи ожидают визита Лорд-капитана
- guid: 11935290-a8de-45fc-b71e-e5846c02a23b
  text: ({0})
- guid: 11997f6b-2b7e-4e49-a4e1-f14afdb7d9a8
  text: Что-то пошло не так! Отправьте нам сообщение об ошибке или повторите попытку позже.
- guid: 11a5f71d-3c75-4fc0-8a4c-7ca5de50acda
  text: Список сохранений пуст
- guid: 11b771b0-7b29-412d-8f16-f68467be485c
  text: Можно использовать только во время фазы ускорения
- guid: 11bf0425-428c-473a-9508-934c9afc73cb
  text: Архетипы
- guid: 1211102e-0167-4def-a5af-5c8d78018ddb
  text: Талант архетипа второй ступени
- guid: 1211b054-f7fd-47b4-b5ab-5ee97044768b
  text: Уровень репутации
- guid: 1268e471-937e-49ca-8281-da0af9886864
  text: Играть
- guid: 127f32a2-f996-4b1f-9001-4313b094271b
  text: Сложность игры
- guid: 1284da88-2dc2-4f8a-82cf-79ccbb539477
  text: Невозможно разобрать
- guid: 12c3418b-9c4b-479b-8b49-9585b490b68e
  text: Космический объект
- guid: 12d98b70-293d-4a19-95b4-e61bf88ecb28
  text: Настройки видео
- guid: 12efa515-5b08-4078-996c-2b1fc9e54df7
  text: Обзор архетипа
- guid: 1334e988-ac5e-4eb5-9288-93cf6b6da057
  text: 'Груз: {0}'
- guid: 1337e7a9-ed20-44ad-8590-c51974573b78
  text: Влияет на размер теневых текстур и сглаживание теней.
- guid: 13438342-ab46-4cc9-97d7-f159be0de261
  text: Целевая клетка недоступна
