  text: Пока чернь гнет спины в полумраке нижних отсеков, офицеры и высокопоставленные слуги Вольного Торговца пользуются многочисленными благами верхних палуб. Лучшая еда, чистая вода и качественные медикаменты достаются верхушке флагмана.
