  text: Установка имплантов обычным людям столь широко разошлась по протекторату, что перестала быть диковинкой. Преданность простого люда, что стремился трудом отблагодарить своего правителя за потраченные на него ресурсы, позволила династии отстроить и укрепить многие свои владения. Однако число бед, что влекут небрежно установленные или плохо поддерживаемые импланты, удесятерилось. Нижние палубы флагмана Вольного Торговца наводнили полугниющие подданные, ищущие спасения в еще большем металле. Апофеозом стала эпидемия чумы, выкосившая тысячи и тысячи несчастных в один из злополучных вара-прыжков.
