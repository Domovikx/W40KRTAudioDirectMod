- guid: 01851bc2-6b55-4f81-97ad-b9823e02655e
  text: Священные обломки пострадавшего от запуска Горнила монастыря будут перенесены на спутник Фолстоуна. Снабженная двигателями вооруженная луна сойдет с орбиты и отправится в странствие как храмовая комета.
  category: B
  reasons:
