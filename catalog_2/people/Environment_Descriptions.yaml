  text: '[Draft] Катсцена: раненый Медный шепот выбегает в центр Обсерваториума, баркает BrassWhisperDeath, собирается взорвать Эсхатосом корабль, к нему подходит Паскаль и выдирает у него из головы кортикальный имплант.'
  category: B
