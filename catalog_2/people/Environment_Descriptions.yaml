    text_clean: В руинах ксеносов найдена необычная дурманная субстанция. В тайных алхемис-цехах сырье подвергнется химической очистке и возгонке, обратится в чистую эйфорию, усладу грешных душ тоскующих по новым забавам аристократов.
- guid: 023bad05-112a-4640-bf3f-37bf24dc072b
