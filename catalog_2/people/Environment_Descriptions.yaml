    text_clean: Священные обломки пострадавшего от запуска Горнила монастыря будут перенесены на спутник Фолстоуна. Снабженная двигателями вооруженная луна сойдет с орбиты и отправится в странствие как храмовая комета.
- guid: 01db3c1c-cd7d-4ce4-b016-6c5aae959a68
  text: Расположенный на мостике когитатор Вольного Торговца ранее принадлежал Теодоре фон Валанциус — Паскаль уверен, что с помощью этой машины можно расшифровать обнаруженные данные.
  category: B
  reasons:
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Расположенный на мостике когитатор Вольного Торговца ранее принадлежал Теодоре фон Валанциус — Паскаль уверен, что с помощью этой машины можно расшифровать обнаруженные данные.
- guid: 01dd4fb4-86e1-4402-8997-62107d0c9c4f
  text: В гигантских цистернах органическое сырье, несущее в себе психотропные вещества, подвергается химической очистке и возгонке, обращаясь в чистую эйфорию, усладу грешных душ.
  category: B
  reasons:
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: В гигантских цистернах органическое сырье, несущее в себе психотропные вещества, подвергается химической очистке и возгонке, обращаясь в чистую эйфорию, усладу грешных душ.
- guid: 021197fb-d9fb-4b6a-92a8-01e986d26c52
