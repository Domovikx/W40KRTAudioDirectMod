- guid: 99c9bc70-d445-4bd3-b418-56936f653106
  text: Торговый Патент, который выдается всем Вольным Торговцам, не только дозволяет им покидать границы Империума, но и вести дела с кем и чем угодно за его пределами со всей полнотой власти Верховных лордов Сенаторума Империалис. Многие Вольные Торговцы используют Патент для завоевания и колонизации открытых планет, принимая роль имперского командора и тем самым раздвигая границы Империума. Другие применяют Патент для получения эксклюзивных прав на торговлю с недавно обнаруженными цивилизациями, тем самым баснословно богатея и закладывая основание могущественного дворянского рода. Патент также поднимает своего обладателя на самый высокий уровень, которого может достичь слуга Империума, и уравнивая его статус с имперскими командорами, инквизиторами и магистрами ордена космодесантников.
