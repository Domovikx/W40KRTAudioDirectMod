  text: '"Воистину, я был заточен. Танцующие души, эльдары, ополчились на меня, заманили меня в ловушку, сковали дух мой формами сего оружия. Тысячелетия томился я в сей темнице, исподволь проникая своей волей в ваш убогий косный мир. Но и жалкой частицы моей силы было достаточно, чтобы соблазнять бесчисленные души. Сейчас же я здесь — во всей своей славе".'
