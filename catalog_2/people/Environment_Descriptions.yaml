    text_clean: Слепые безумцы бесцельно блуждают по разрушенным улицам.
- guid: fdd50889-3271-4846-89b0-7c46b5e5bd69
  text: Работники грузовой магистрали учатся и применяют знания на благо корабля. Их стараниями налажена логистика с инженерными отсеками, что открыло широкие возможности для улучшения прочности корабля.
  category: B
  reasons:
  - start_not_object
  blueprint_owner: LTBay_Hope_Feature_
