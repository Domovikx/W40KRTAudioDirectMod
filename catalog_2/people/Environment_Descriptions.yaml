- guid: ed33995d-d29a-4ab7-ab0d-7131de56fc92
  text: Победа над врагами Вольного Торговца далась команде дорогой ценой. И все же палубы были очищены от порождений варпа — пускай их следы и были смыты кровью сотен и сотен пустотников.
