  text: Батальон Безымянных Последних, как стали известны стражи гробницы, считались героями, а их подвиг передавался в песнях из поколения в поколение. Выковав крепкую связь с Ордо Ксенос, они продолжили свой вечный дозор. Поддержка агентов Золотого Трона помогла сокращать потери и отбивать натиск свежевателей, когда те вновь вырывались наружу, а некоторые отслужившие в Безымянных вербовались для службы в Инквизиции.
