- guid: 52f78070-184c-4138-b734-f63b51f5daad
  text: Храм, найденный Вольным Торговцем в глубине корневой системы Заркова, стал тайным проклятием планеты. Псайкеры ссылались в его недра, чтобы привлекать Погонщиц и удерживать их внутри, закупоривая гробницу. Эта жертва считалась сакральной, а чудовища стали символом самой планеты и ее богатств.
