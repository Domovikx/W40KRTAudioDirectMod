    text_clean: Дверь намертво заблокирована с другой стороны. Кажется, остается только один путь на палубу — применить взрывчатку.
- guid: fe22e5dd-b784-44fe-a123-88370dcd991a
  text: В затылке у трупа зияет странное узкое отверстие, непохожее на след от привычного имперского оружия. Дырка больше напоминает след от тонкого лезвия, пронзившего череп.
  category: B
  reasons:
  - start_not_object
  scenes:
  - agriworldjungle_defaultmechanics.scenes
