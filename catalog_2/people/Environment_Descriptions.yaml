- guid: 8c1a284e-87ed-45a1-a131-a28942db2cee
  text: Экклезиархия (официальное название — Адептус Министорум) — это огромная организация, осуществляющая контроль над религиозной жизнью Империума в масштабах галактики. Сложная иерархическая система, включающая кардиналов, миссионеров, проповедников и фанатично преданных мирян, следит за проведением предписанных молебнов и дает наставления всему населению по защите от ереси и инакомыслия. Вы входили в число ярких одухотворенных личностей Министорума, уделявших своей пастве самое пристальное внимание.
