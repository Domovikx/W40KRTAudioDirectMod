  text: Самая устрашающая боевая единица во всем Империуме. Каждая из этих шагающих боевых машин, пилотируемых лично элитными аристократами, до зубов вооружена мощнейшими орудиями и защищена мерцающими ионными полями. Имперский Рыцарь может в одиночку уничтожать полчища пехоты и превращать колонны военной техники в дымящиеся обломки.
