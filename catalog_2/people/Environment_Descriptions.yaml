- guid: 355f9250-556c-4538-8bdf-64ec7f1df472
  text: На имперских кораблях обычно установлены пустотные щиты — энергетические поля, поглощающие наносимый кораблю урон. За каждую единицу поглощенного урона щит теряет единицу своего заряда. Пустотный щит делится на 4 сектора, распределенных по сторонам корабля. Каждый сектор независим от других, и если заряд одного сектора исчерпан, он не может больше поглощать урон, даже если все остальные секторы щита целы.
