    text_clean: Сиятельная Лорд-капитан ожидает вас на площади, Ваша Светлость.
- guid: ffcf3e50-13d1-4d3b-b4ed-4eeb4485d5dd
  text: '"Гемункул задействовал механизмы внутри этой комнаты. Поторопись и освободи меня, и я отплачу тебе тем же".'
  category: B
  reasons:
