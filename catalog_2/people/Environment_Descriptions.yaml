    text_clean: Бесценное оружие ксеносов, драгоценности и диковинные артефакты... Раньше вы их здесь не замечали.
- guid: ffe9b2d2-601f-4d15-acf1-fc22fa7f65a8
  text: Где-то на улицах Райкада бродит безумный защитник Человечества. Вероятно, еще возможно отыскать его кровавый след.
  category: B
  reasons:
