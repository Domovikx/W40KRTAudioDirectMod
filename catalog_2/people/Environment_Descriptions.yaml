  blueprint_owner: PrRes12_ResourceProject
  parts:
  - speaker: narrator
    text_clean: Заброшенная пустотная станция на орбите Веабоса-6 может быть превращена в тайный притон для пиратов Простора Коронус.
- guid: 030cb48a-2963-4a38-9b14-dd23eb250aa4
  text: Экспедиция Ксавьера Калькасара отправилась в древние пространственные врата. Чтобы настичь его, Лорд-капитану предстоит последовать навстречу неизвестности.
  category: B
  reasons:
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Экспедиция Ксавьера Калькасара отправилась в древние пространственные врата. Чтобы настичь его, Лорд-капитану предстоит последовать навстречу неизвестности.
- guid: 030dfebd-c1a2-423f-9c97-b3944f413388
  text: Труп выглядит страшно — перед смертью его явно долго били, а потом затолкали в щель между ящиками. В руке мертвеца зажат окровавленный листок бумаги.
  category: A
  reasons: []
  scenes:
