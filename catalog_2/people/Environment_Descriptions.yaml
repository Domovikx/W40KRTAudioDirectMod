- guid: ed8bf41d-7b38-41cc-9f42-31b73070600e
  text: Сам Зарков становится миром, о существовании которого многие знают лишь по слухам. Страшное место из легенд, загадочная планета беззакония, хладного торга и тайны. Посвященные легко находят, где искать источник легенды — для остальных же планета остается всего лишь байкой, случайно услышанной на улицах Футфола.
