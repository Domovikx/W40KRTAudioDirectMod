- guid: eec30a83-9315-40b7-b5ef-102f9260d87c
  text: Иссохшая кожа, обтягивающая скулы, делает выражение ужаса, застывшее на лице мертвеца, еще более гротескным. В груди трупа зияет идеально круглая дыра. Ни одно оружие из известных вам не оставляет подобных ран.
  category: B
  reasons:
