  text: Следы генетора Фебруса, покинувшего свиту Вольного Торговца, затерялись в бесконечности миров Простора Коронус. Изредка всплывали слухи о похищенных людях и странных юродивых из плоти и железа, в ужасе лепетавших о безумце, за плечом которого виднелась сама смерть.
