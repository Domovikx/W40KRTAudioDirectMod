    text_clean: Иссохшая кожа, обтягивающая скулы, делает выражение ужаса, застывшее на лице мертвеца, еще более гротескным. В груди трупа зияет идеально круглая дыра. Ни одно оружие из известных вам не оставляет подобных ран.
- guid: eece3870-2a42-4010-b54b-9f1d6f4a9f20
