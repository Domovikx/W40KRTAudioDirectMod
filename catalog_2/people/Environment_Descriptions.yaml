    text_clean: Следы загадочного врага, повергшего Космического волка, почти скрыл снег.
- guid: 02dd9aca-0225-40fe-84a1-af809cbe9370
  text: '"Живое оружие древнего врага, сгинувшего в безвременье. Этот регион космоса редко привлекает эльдаров, поэтому экспозиция неполноценна. Другие отделения Музеона содержат более интересные экспонаты из данной цивилизации, однако пара интересных вещиц мне удалось обнаружить и в этом захолустье".'
  category: B
  reasons:
  - quotes
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Живое оружие древнего врага, сгинувшего в безвременье. Этот регион космоса редко привлекает эльдаров, поэтому экспозиция неполноценна. Другие отделения Музеона содержат более интересные экспонаты из данной цивилизации, однако пара интересных вещиц мне удалось обнаружить и в этом захолустье.
- guid: 03030c9a-4c41-43cd-9dd8-a10e80e905ef
  text: Заброшенная пустотная станция на орбите Веабоса-6 может быть превращена в тайный притон для пиратов Простора Коронус.
  category: B
  reasons:
