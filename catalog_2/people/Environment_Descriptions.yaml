- guid: 23d2e538-efb0-4f0a-ae13-ad0fd2ec79cc
  text: Улучшенный имплантационный трон приоткрыл генеторам Сектора Бионика тайну сохранения жизни в металле. Благословение Бога-Машины было даровано многим достойным офицерам, священнослужителям и чиновникам флагмана. Священное железо, заменившее их слабую плоть, сделало службу этих людей верной и вечной, пусть и заставляло страдать своих носителей.
