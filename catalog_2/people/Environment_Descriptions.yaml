    text_clean: Работники грузовой магистрали учатся и применяют знания на благо корабля. Их стараниями налажена логистика с инженерными отсеками, что открыло широкие возможности для улучшения прочности корабля.
- guid: fe0a5747-cf9f-4d05-813c-9def59c8f72a
  text: Дверь намертво заблокирована с другой стороны. Кажется, остается только один путь на палубу — применить взрывчатку.
  category: A
  reasons: []
  scenes:
