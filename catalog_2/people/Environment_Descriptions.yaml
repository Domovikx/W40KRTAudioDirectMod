- guid: 53a5868c-dfcb-49f4-aa76-2b3ace16332e
  text: Империум не простил столь дерзкого отступления от уклада, диктуемого Святой Террой. Династия фон Валанциус была обвинена в богохульстве созидания собственной империи. Флот вторжения собирался в секторе Каликсис, и срок жизни, отпущенный молодой утопии, равнялся сроку жизни, отпущенному ее творцу.
