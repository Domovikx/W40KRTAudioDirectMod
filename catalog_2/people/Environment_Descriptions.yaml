    text_clean: Трон снабжен системой подачи проводящего заряда и в любой момент может превратиться в инструмент аутодафе.
- guid: fe5758ef-8483-440f-9f09-18dff18bd6c9
  text: Из глаз трупа тонкими струйками сыпется черный стеклянный песок.
  category: B
  reasons:
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Из глаз трупа тонкими струйками сыпется черный стеклянный песок.
- guid: fe6b5da6-b49d-4e1f-a49c-16fb2fd710a6
  text: '"Сейчас не самое подходящее время для бесед — каждая потерянная минута может стоить нам ценной улики".'
  category: B
  reasons:
  - quotes
  - start_not_object
  parts:
