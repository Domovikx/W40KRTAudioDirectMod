  parts:
  - speaker: narrator
    text_clean: Труп выглядит страшно — перед смертью его явно долго били, а потом затолкали в щель между ящиками. В руке мертвеца зажат окровавленный листок бумаги.
- guid: 033b980c-8dd1-4cc9-bc20-60e23ad22ac4
  text: Ассасины способны мастерски избегать вражеских атак и обрушивать на врага собственные разрушительные атаки в ближнем и в дальнем бою. Их сильная сторона — это высокий шанс уклонения и эффективное снижение уклонения, а также прицельные удары в слабые места.
  category: B
  reasons:
  - encyclopedia
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Ассасины способны мастерски избегать вражеских атак и обрушивать на врага собственные разрушительные атаки в ближнем и в дальнем бою. Их сильная сторона — это высокий шанс уклонения и эффективное снижение уклонения, а также прицельные удары в слабые места.
- guid: 03a881ab-dbf0-4de4-b1a8-8486ef90f3b9
  text: Дверь храма не двигается с места. Возможно, она заблокирована обломками с обратной стороны.
