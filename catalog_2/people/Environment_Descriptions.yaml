  text: '"Здесь. Главным дельцом станции являюсь я, и было бы неуважением с моей стороны предлагать вам вести дела с менее значимыми торговцами Футфола. Впрочем, пара примечательных людей может вас заинтересовать — например, епископ Иеронимус Скорбный. Этот слуга Экклезиархии, по слухам, скупает священные реликвии у капитанов, и другие торговцы не стремятся вступать с ним в конкуренцию".'
