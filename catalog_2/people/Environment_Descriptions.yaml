    text_clean: Равор — Главный кормчий, неразлучный с кораблем фон Валанциус. Стоит задать ему наводящие вопросы.
- guid: 028c0b84-eda6-4292-933b-6e51646a988f
  text: Массивный, испещренный насечками ключ, открывающий ворота в лагере гвардейцев.
  category: A
