- guid: 630df996-ff2d-42a9-8557-06111ee43d5f
  text: Улучшенный имплантационный трон приоткрыл генеторам Сектум Бионика тайну сохранения жизни в металле. Священные технологии с Алтаря-Темплум-Каликсис-Экс-17 позволили создавать аугменты, способные полностью заменить тонкие процессы человеческого организма и спасти жизни даже самых безнадежных. Слухи о чудотворном археотеке разошлись по Простору, собирая как паломников, искавших спасения, так и тех, кто желал возобладать реликвией. Вскоре из аугментированных троном людей возник культ Неисчерпаемой Прогрессии, последователи которого, подняв бунт, попытались насильно аугментировать других членов экипажа. После гибели культистов, их поведение сочли признаком безумия машинных духов трона, и он был объявлен анафемой и уничтожен.
