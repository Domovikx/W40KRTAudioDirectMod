- guid: eebf0709-4f17-4197-a5cf-8f2d3e113d2b
  text: Древнее зенитное орудие расположено на шоссе, ведущем из звездной гавани к командному центру губернатора. Пока его контролируют повстанцы, полеты шаттлов над столицей неприемлемо опасны.
