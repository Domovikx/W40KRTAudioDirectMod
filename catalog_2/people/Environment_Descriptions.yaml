  text: Адептус Механикус обеспокоены вспышкой ереси, произошедшей на Кьяве Гамма. Они готовы заключить торжественный союз с династией фон Валанциус, согласно которому в древнем, законсервированном по приказу Леди Теодоры цеху будет основан приорат скитариус, фабрика по производству непобедимых Тех-стражей . Эти суровые воины, чьи цифровые обеты не знают изъяна, возьмут под охрану все объекты Механикус в протекторате.
