- guid: 009ee723-1079-4078-a4ea-141872be61ff
  text: Черная, непроглядная тьма продолжает свое безмолвное существование.
  category: A
  reasons: []
  scenes:
  - ee_bottomlesspit_mechanics.scenes
  parts:
  - speaker: narrator
    text_clean: Черная, непроглядная тьма продолжает свое безмолвное существование.
- guid: 00a0bd80-39d3-42cf-b40b-c6c508dd7941
  text: '"Медуза... Поборщик страданий и кошмаров. Мои темные кузены используют этих существ, чтобы накапливать эмоции и переживания, а позже — питаться ими".'
  category: B
  reasons:
  - quotes
  - start_not_object
  blueprint_owner: RangerAboutMedusae_
  parts:
  - speaker: narrator
    text_clean: Медуза... Поборщик страданий и кошмаров. Мои темные кузены используют этих существ, чтобы накапливать эмоции и переживания, а позже — питаться ими.
- guid: 010bb729-bf18-45ce-9aba-a2c4580f5813
  text: Мешочек странной пыли, переливающейся невозможными оттенками несуществующих цветов.
  category: B
  reasons:
  - start_not_object
  blueprint_owner: DemonTool_Item_description
  parts:
  - speaker: narrator
    text_clean: Мешочек странной пыли, переливающейся невозможными оттенками несуществующих цветов.
- guid: 010ff5ec-6955-4480-9e4b-d911e18292a5
  text: Во тьме загораются глаза — слишком большие, чтоб принадлежать человеку, слишком разумные — для животного. Миг спустя видение пропадает.
  category: B
  reasons:
  - start_not_object
  scenes:
  - footfallslums_mechanics.scenes
  parts:
  - speaker: narrator
    text_clean: Во тьме загораются глаза — слишком большие, чтоб принадлежать человеку, слишком разумные — для животного. Миг спустя видение пропадает.
- guid: 0118e66f-09d5-4166-85d2-e71a3cd0c66b
  text: Миры-корабли — огромные космические суда, несущие остатки некогда великого и многочисленного народа Азуриани сквозь мрак пустоты. Каждый мир-корабль — шедевр психо-технической инженерии, а также самодостаточная обитель со своей культурой, сформировавшейся среди ее обитателей за время изоляции от других соплеменников.
  category: B
  reasons:
  - too_long
  - encyclopedia
  - start_not_object
  blueprint_owner: CraftworldHomeworld_description
  parts:
  - speaker: narrator
    text_clean: Миры-корабли — огромные космические суда, несущие остатки некогда великого и многочисленного народа Азуриани сквозь мрак пустоты. Каждый мир-корабль — шедевр психо-технической инженерии, а также самодостаточная обитель со своей культурой, сформировавшейся среди ее обитателей за время изоляции от других соплеменников.
- guid: 011e3d4a-41c4-430b-9aeb-ba8e4894d675
  text: Однажды вы уже убивали Тервантьяса Архмахинатора в Темном городе друкари.
  category: B
