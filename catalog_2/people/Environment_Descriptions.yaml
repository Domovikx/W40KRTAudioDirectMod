  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Гемункул задействовал механизмы внутри этой комнаты. Поторопись и освободи меня, и я отплачу тебе тем же.
- guid: ffd082d8-0ed0-412a-bec8-8e7149ad3faa
  text: Бесценное оружие ксеносов, драгоценности и диковинные артефакты... Раньше вы их здесь не замечали.
  category: B
  reasons:
