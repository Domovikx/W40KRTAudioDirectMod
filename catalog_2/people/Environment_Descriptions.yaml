- guid: 02c21844-d2bc-4fb1-9a43-1fda3ff95501
  text: Следы загадочного врага, повергшего Космического волка, почти скрыл снег.
  category: A
  reasons: []
  scenes:
  - ulfarq2_mechanics.scenes
  parts:
