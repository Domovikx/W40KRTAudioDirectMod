- guid: ffc5414e-910f-4de4-ac68-bdfee79e0f06
  text: Это единственный путь на мостик, где скрывается от правосудия капитан Саргона, и точка сбора с союзниками. Арбитры берут на себя самую опасную часть пути — им пригодится любая поддержка, которую может оказать Вольный Торговец.
  category: A
  reasons: []
  parts:
  - speaker: narrator
    text_clean: Это единственный путь на мостик, где скрывается от правосудия капитан Саргона, и точка сбора с союзниками. Арбитры берут на себя самую опасную часть пути — им пригодится любая поддержка, которую может оказать Вольный Торговец.
- guid: ffcc1656-f293-41f8-a23d-5a0e604f25df
  text: '"Сиятельная Лорд-капитан ожидает вас на площади, Ваша Светлость".'
  category: B
  reasons:
  - quotes
  - start_not_object
  scenes:
