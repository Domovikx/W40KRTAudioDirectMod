    text_clean: В затылке у трупа зияет странное узкое отверстие, непохожее на след от привычного имперского оружия. Дырка больше напоминает след от тонкого лезвия, пронзившего череп.
- guid: fe3639d2-9e77-4776-9e41-6d49285ed77c
  text: Трон снабжен системой подачи проводящего заряда и в любой момент может превратиться в инструмент аутодафе.
  category: A
  reasons: []
  parts:
