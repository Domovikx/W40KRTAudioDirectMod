    text_clean: Эта колония — след жадной руки Империума, заклеймивший собой очередную планету во славу Императора. Запершиеся в прочных укреплениях люди цепко укрепились на этой земле и уже алчно смотрят в сторону близлежащих систем.
- guid: 52a01aaf-a029-470d-b842-3d2f9dec4cca
  text: На клумбе собраны самые эффектные представители местной флоры. На аккуратно подстриженных растениях зреют неизвестные вам плоды.
