- guid: 0409c64b-fe90-4bf3-bbd0-dae256eb1bbf
  text: Лишь почтенные и великолепно оборудованные храмы Механикус получают право стать капеллами исчисления. Под величественными сводами кибертеурги заклинают разрушительных цифровых ракшасов, а инфокузнецы пробуждают духов благословенных когитаторов в вычислительных литургиях и лекс-молитвах.
