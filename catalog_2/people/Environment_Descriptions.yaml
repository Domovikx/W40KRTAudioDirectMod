- guid: ff4063ab-a00f-47b9-83d5-05f8ae6a2724
  text: Мало какой материал сравнится по крепости с адамантиумом. Из него изготовляют броню божественных Титанов, обшивку пустотных кораблей и вообще все, от чего требуется повышенная прочность.
  category: B
  reasons:
