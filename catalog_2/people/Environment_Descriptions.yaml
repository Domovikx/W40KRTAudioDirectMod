- guid: 6554da2e-0f18-4cea-a25d-31caf163c27d
  text: '"Мои братья случайно обнаружили эти ледяные гробницы. Злоумышление Аспис повергло их в ужас. Я же помыслил, что если святой Друз принял мученическую смерть и возродился в вере, разве не может кто-то другой пройти его стопами? Я избрал Инцендию — ее нутро было червивым, но не прогнило до конца. Остальных... я предал смерти, ибо и тысячи лет хождения по мукам не хватило бы, чтобы вычистить смрад и прель из их проклятых душ".'
