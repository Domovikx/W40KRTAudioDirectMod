- guid: ed02cc79-2849-4754-96f1-ed6b97f45923
  text: Раскол в стане Адептус Механикус глубже и сложнее, чем может показаться на первый взгляд. Вольному Торговцу стоит провести более тщательное расследование для принятия верного решения.
