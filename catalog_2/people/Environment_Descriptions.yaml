    text_clean: Сейчас не самое подходящее время для бесед — каждая потерянная минута может стоить нам ценной улики.
- guid: fe8fff3f-545d-495f-9968-f227543c4f2c
  text: Один из множества ваших портретов, развешанных по станции подобно иконам. Какой-то обыватель лобызает край его рамы в надежде получить благословение династии фон Валанциус.
  category: B
  reasons:
  - start_not_object
  parts:
  - speaker: narrator
    text_clean: Один из множества ваших портретов, развешанных по станции подобно иконам. Какой-то обыватель лобызает край его рамы в надежде получить благословение династии фон Валанциус.
- guid: fea44f70-823f-4792-b1a5-e55c81552c65
  text: '"Милосердие — это врата, через которые ересь приходит в дом".'
