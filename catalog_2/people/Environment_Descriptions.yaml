  text: 'Всего в игре 4 вида варп-маршрутов: зеленый (безопасный), желтый (небезопасный), оранжевый (опасный), красный (смертельный). Цвет маршрута влияет на частоту и сложность событий, происходящих в варпе. Например, на зеленых маршрутах почти ничего не происходит, тогда как на красных случаются самые опасные инциденты. Иногда события приводят к началу варп-вторжения на корабль, на что Вольному Торговцу придется реагировать с помощью имеющихся у него предметов или путем личного вмешательства.'
