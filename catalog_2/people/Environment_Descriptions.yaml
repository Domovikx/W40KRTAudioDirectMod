  text: '"Мы продолжим очищение усадьбы и прилегающих территорий — от завалов, трупов и прочих последствий боев. Уцелевших сил хватит, чтобы дать отпор случайным атакам врага, буде они состоятся — по последним сведениями ксеносы начали массовый отвод своих сил. Если вас зовут иные дела, я не смею больше задерживать вас — позвольте нам позаботиться о том, чтобы Даргонус был возвращен к былой славе".'
