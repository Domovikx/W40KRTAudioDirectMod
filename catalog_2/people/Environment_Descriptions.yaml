- guid: 022b37f7-ac16-497f-b7ed-4747a751535c
  text: В руинах ксеносов найдена необычная дурманная субстанция. В тайных алхемис-цехах сырье подвергнется химической очистке и возгонке, обратится в чистую эйфорию, усладу грешных душ тоскующих по новым забавам аристократов.
  category: B
  reasons:
