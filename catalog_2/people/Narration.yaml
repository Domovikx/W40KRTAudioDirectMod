name: Narration
description: text contains {n} narrator blocks
total_phrases: 1203
phrases:
- guid: 002ef1e6-af60-4e7a-a792-6d2820f16ed6
  text: '{n}Ваша копия понимающе улыбается.{/n} "Я — Великолепн{mf|ый|ая} {name} фон Валанциус. И если я хорошо себя знаю — а я отлично себя знаю, — сейчас ты гадаешь, что же такое тогда ты. Это просто, ты — моя версия из менее славной реальности, плод дурного влияния сокровища, за которым я иду".'
- guid: 00cc93ab-537e-4210-9777-8e103e76ca2e
  text: '{n}Мужчина с лохматыми космами темных волос одет и вооружен примерно так же, как все прочие в помещении. И все же в нем безошибочно чувствуется лидер. Он делает шаг вам навстречу. Усмехается. Разводит руки в жесте приветствия.{/n} "Гости! Как радостно вас видеть в моем скромном убежище. Вижу, вы пришли приобщиться к истине. Выбирайте — словами или огнем и металлом?"'
- guid: 00f0c0ae-b361-4891-b0fb-69defbbed3f6
  text: '{n}Напускное спокойствие мгновенно слетает с Ювенны, и ее красивые черты искажаются злобой.{/n} "Мой отец — полоумный еретик и безумец, из-за которого гнев Священных Ордосов пал на всю династию. Если я, единственная законная наследница, не исправлю его ошибки, то этого не сделает никто! Но вместо меня он привечает безродную выскочку Войгтвир, которая потакает ему в его грехах. Я положу этому конец".'
- guid: 00fd8ab8-5f31-4091-b322-033eb9e762b8
  text: '{n}Высокий сгорбленный {g|Encyclopedia:TechPriest}техножрец{/g} пристально взирает на вас. Его изможденное лицо скрыто дыхательной маской, кожа рук имеет нездорово серый цвет, а {g|Encyclopedia:Augmentation}аугменты{/g} несут следы боевых повреждений и покрыты черным хромом, что придает его облику замогильную мрачность.{/n}'
- guid: 016b1474-9267-4a40-a115-6841f174db65
  text: '{n}"Теодора" сочувственно цокает языком, протягивает руку и заботливо гладит Идиру по волосам.{/n} "Бедняжка Идира... ну, ну... как я могла не прийти? Ты так отчаянно звала меня, что твой плач донесся до самых глубин {g|Encyclopedia:Warp}варпа{/g}..."'
- guid: 01c0ab16-7322-453c-8846-02e5f8659884
  text: '{n}Не слишком набожная свита не желает портить ценную для вас реликвию, но не явно воспринимает это как историю, которую можно будет потом рассказать. Мало кто может рассказать такую историю и не оказаться лжецом.{/n}'
- guid: 01e4a151-1351-45b4-a019-93adede25482
  text: '"Исключено. Я не стану молить о пощаде того, кто, поправ заветы Бога-Императора, явился к воротам моего дворца с огнем и мечом". {n}Себериан смотрит в глаза Ювенне, когда с нажимом произносит:{/n} "Род фон Валанциус не склонится перед Диодасом аф Иррамоном. Врата моего дома не отворятся для врага".'
- guid: 02624a2e-913a-4992-8aee-fe25051d6331
  text: '{n}Высокая тонкая ксенос двигается с грацией иномирного хищника. Создание окидывает вас безразличным взором и небрежно роняет несколько слов, которые тут же подхватывает ваш {g|Encyclopedia:Elucidator}Толкователь{/g}.{/n} "Мекандис, Аэлит, что это? Кто-то из сестер раздобыл в руинах занятную безделушку и приберег как особое развлечение для архонта?" {n}Ксенос бросает взгляд через плечо — на платформу, где чернеют еще несколько фигур в смоляных доспехах.{/n}'
- guid: 02909f68-8d62-4883-8469-3ca6c8f94857
  text: '{n}Чужеродный голос резко вторгается в ваш разум:{/n} "Стой! Убей... правильно. Ритуал... Жертва".'
- guid: 03099240-9467-436e-bc27-a0e027954ce5
  text: '{n}{g|Encyclopedia:Cogitator}Когитатор{/g} выглядит мертвым — только один светящийся люмен выдает теплящуюся в машине жизнь.{/n}'
- guid: 034681df-7cbb-4841-8a93-766b9c3fac5b
  text: '{n}На лице Абеляра лежит тень, его голос тверд, однако в нем проскальзывают нотки сожаления.{/n} "Дворянское семейство и все его ветви обвиняется в ереси. Приказом Вольного Торговца весь род будет изничтожен. Исполнение приговора начать незамедлительно".'
- guid: 034ed526-15ac-46d9-bf2e-5ccff5c8aa00
  text: '{n}Группа аристократов держится особняком от прочей знати. В их перешептываниях чувствуется легкий душок недовольства.{/n}'
- guid: 03bce83b-e2e4-400f-9479-1d5d6e284ca0
  text: '{n}Внезапно охрипнув, Соломон рокочуще произносит:{/n} "А дальше — все. Разрешите идти, Вольный Торговец". {n}Не дожидаясь ваших слов, арбитр разворачивается на каблуках.{/n}'
- guid: 03cc3185-46c8-4a95-a0e0-760e71a0271a
  text: '{n}Ваш двойник решительно рубит воздух рукой, и вы замечаете некоторую скованность движения, а также едва уловимую гримасу боли. Приглядевшись, вы понимаете, что под одеждой вашей копии находятся вериги — покаянные цепи с зазубренными крюками, впивающимися в плоть. Такие инструменты смирения носят лишь самые истовые из верующих.{/n}'
- guid: 04909bd4-1880-4dc9-860d-1cd37bdd2f1f
  text: '"Еще раунд, Ваша Светлость?" {n}Парень с почтением склоняет голову и чуть улыбается.{/n} "Мудрые гости с палуб повыше говорят, что игра помогает не только расслабиться, но и испробовать разные тактики. Познать себя и других".'
- guid: 04c19cc3-1650-45e8-9554-14e99e97c85a
  text: '{n}Маражай безучастно хмыкает.{/n} "Ты даже поломался скучно. Давай же, вперед. Таких, как ты, Комморра проглатывает миллионами каждодневно — ты не успеешь настрадаться своим мученичеством вволю".'
- guid: 0594d4cb-e2e0-4fab-9246-3de4585c87b7
  text: '{n}Фигура Висиря кренится под весом боевого облачения. Костлявые пальцы, дрожа, зачерпывают кровь из чаши и наносят на морщинистое лицо символы — знаки войны. Не отрываясь от ритуала, он произносит пустоте подле себя:{/n} "Нить за нитью, смерть за смертью, сплелась тропа подател{mf|я|ьницы} жизни. Да... я слышал. Дважды {mf|он|она} оказывал{mf|ся|ась} между нежизнью и несмертью. И дважды Неумирающий не принял {mf|его|ее}, ибо время еще не пришло".'
- guid: 05b0acc2-0869-49b4-a24c-8cf96368c2ae
  text: '{n}Нотки высокомерия возникают в голосе Паскаля, взирающего на тело Нихель.{/n} "Эксперимент Коллектива Амарнат показывает, что групповое сознание подвержено изъянам наравне с индивидуальным. Мы не могли верно распорядиться своей мощью. Мы уничтожили себя. Но это не значит, что наша сила была плоха. Плохи были мы... большинство из нас".'
- guid: 05e296f3-0763-45e6-84d5-3050283ccb6f
  text: '"Элантах, неужели...". {n}Сдавленный вздох слышится из комм-бусины в ухе.{/n} "Мои поиски зашли в тупик? Я отправилась во тьму космоса вместе с мон-кай, надеясь отыскать собратьев. А нашла... лишь трупы, погребенные человеческой ненавистью". {n}Голос эльдарки дрожит то ли от отчаяния, то ли от гнева.{/n}'
- guid: 06258932-dda3-4517-9172-b760c032baed
  text: '"Славная победа, {name}! О том, как пал презренный Уралон, будут слагать саги! Железные жрецы должны поднести тебе добрую чашу мьода за то, что ты спас{mf||ла} их молельный мир". {n}Торбальд кивает на два худощавых женских тела в алых робах, лежащих на полу.{/n} "Иначе Уралон умыл бы их кровью стократ против случившегося".'
- guid: 062ea631-f60b-4d46-9207-2d2b239a52f9
  text: '"Я... вижу это в ваших цветах. Нежные, теплые оттенки... И яркие всполохи, когда вы вот так смотрите на меня, {name}. Я тоже... тоже чувствую себя рядом с вами счастливой! И потому боюсь привыкнуть к этому чувству. Цвета счастья... слишком быстротечны". {n}Кассия дарит вам нежный взгляд и неуверенную улыбку.{/n}'
- guid: 0649bb64-eaa9-4f13-ab82-d768105add56
  text: '{n}Те, кто готовил лежащего в гробу седого мужчину в последний путь, хорошо постарались — даже в смерти он выглядит величественно.{/n}'
- guid: 06a0ed86-f970-420f-ab36-e63259e715f3
  text: '{n}Абеляр собирается возразить, но, заметив вашу отстраненность, лишь молча скрещивает руки.{/n}'
- guid: 06c07655-35ac-4061-acf8-abac093c4676
  text: '{n}После затянувшейся паузы Медина, так и не дождавшись от Хейнрикса продолжения, крякает и торопливо поворачивается к вам.{/n}'
- guid: 0717e8da-19e7-462c-862f-26cb613f1003
  text: '{n}Железный кулак чуть разжимается.{/n} "Никогда бы не подумал, что от наивных речей мне станет легче. Видимо, совсем сдаю..."'
- guid: 0729a2e6-9e54-48a4-8587-cbeab341b2b6
  text: '{n}Улыбка Вистенцы гаснет как свеча на ветру.{/n} "Вы... вы не посмеете... дело всей моей жизни... {n}Губернатор сжимает кулаки, но тут же берет себя в руки. Ее улыбка почти неотличима от искренней.{/n} "Что ж. Даже блеклая жизнь лучше яркой погибели. Обещаю, что найду себе новое... развлечение".'
- guid: 07f1a471-d2a1-47fc-84a4-7f0a375b1827
  text: '{n}Стракс водружает перед вами свой щит, отстегивает панцирь и ровно складывает поверх него, оставшись в форменном комбинезоне. Без брони он выглядит меньше и очень устало.{/n} "Маршал Грегорас Стракс официально сложил полномочия. Я более недостоин носить этот доспех. Пусть следующий его владелец не посрамит Лекс".'
- guid: 0857a590-dc45-444a-85f1-9694a6be3627
  text: '{n}Девушка устало мотает головой и издает протяжный звук, похожий одновременно на всхлип и вой раненого зверька:{/n} "Что... происходит? Кто-то звал меня? Предатели... уже все мертвы? А вы... кто вы?"'
- guid: 0868f0bc-b41e-49ae-ad4d-b8f7a7dbf427
  text: '{n}Если бы Кибелла с детства питалась досыта, не истязала тело испытаниями, не использовала дурман для ритуалов культа... Вы бы сказали, что эти двое весьма похожи.{/n}'
- guid: 08c29482-4ca7-4521-b485-d914f210d1ba
  text: '{n}Батошски лишь неразборчиво ворчит в ответ.{/n}'
- guid: 08e25441-8aa6-4bf4-8883-32de496e99ec
  text: '{n}Кассия аккуратно накрывает вашу ладонь своей и с облегчением выдыхает.{/n} "Вы живы... Слава Императору, вы живы, {name}".'
- guid: 08fe2fe6-7d24-4cb4-9a5f-e9659f4b85f8
  text: '{n}Гололит-проектор издает резкий писк, означающий входящее голо-сообщение. Мгновением позже гололит вспыхивает изображением — перед вами появляется целая череда сменяющих друг друга корабельных компонентов.{/n} "Полагаю, Вольный Торговец может быть заинтересован в подобных лотах. Желаете ли узнать подробности? Я готов передать по каналу связи каталог имеющихся в наличии частей".'
- guid: 0925b54e-d2a3-438d-a1ba-f2220b22b3f8
  text: '{n}Под алой робой взвывают серво-механизмы в упрямой, но безрезультатной попытке поднять тело техножреца.{/n} "Ущербная плоть... предала..."'
- guid: 092e37af-b726-47f4-8140-f6d5456f4bfe
  text: '"Понимаю, вы сами затронуты варповой силой и задаетесь вопросами о сути своей". {n}Преподобный участливо кивает.{/n}'
- guid: 0943118b-ec87-4b3f-adf0-8dcc9e6cd169
  text: '{n}Фигура хохочущей Теодоры фон Валанциус содрогается и начинает менять форму.{/n} "Наконец-то ты начал{mf||а} понимать, как важно избавляться от мусора вовремя! Но поздно. Слишком поздно".'
- guid: 0954db81-7c29-45af-88f5-1e4c00d17a50
  text: '{n}Леди Элина заходится безумным смехом — сквозь который более не пробиваются нотки разума.{/n}'
- guid: 09a101cb-351b-4726-b2b6-52be3710345a
  text: '{n}Ярость Соломона рассыпается в прах перед {d|Encyclopedia:CharGen_Arbitrator}вашей стальной убежденностью{/d} в догматах Арбитес.{/n} "Что я наделал... Посмел пятнать долг вольнодумным суждением. Нет, я не еретик, а верный слуга Императора — до последнего вздоха".'
- guid: 09ba404c-2c1e-4538-bea8-ec1abe8f927f
  text: '"О чем ты, {mf|новенький|новенькая}? Это такая нелепая попытка заполучить мое расположение? Не позорься, я не в настроении для шуточек". {n}В глазах Каллигоса непонимание. Похоже он сам еще не осознал свою истинную природу.{/n}'
- guid: 09ef4b37-300e-4124-934c-7879c14f9826
  text: '{n}Ноздри мужчины яростно раздуваются. Кое-как справившись с эмоциями, он произносит:{/n} "Даже если ты настаиваешь на моем возвращении, это не меняет главного — я больше не годен для службы Лексу. Для арбитра, неспособного выполнять долг, приговор один".'
- guid: 0a0646ce-a0f0-4d43-9200-0533e978b97f
  text: '{n}Стройные ряды переодетых блюстителей внимают словам исповедника. Подле вас — специально отобранные Иокастой люди, одетые как члены семей офицеров. Ближе всего к вам благостного вида старушка, которая с рассеянной улыбкой мнет накрахмаленный платок. Поймав ваш взгляд, она тепло улыбается полубеззубым ртом и шепчет:{/n} "Все идет как задумано, Ваша Светлость".'
- guid: 0a6174db-6763-4150-b22c-a83506799014
  text: '{n}Хейнрикс цедит ругательство сквозь сжатые зубы и поднимает руку.{/n}'
- guid: 0a755643-d39f-420e-9cc6-8e79b085243a
  text: '{n}Новое прикосновение когтя гемункула заставляет вашу плоть воспламениться в чудовищной агонии.{/n} "Ты — лишь один из моих экспериментальных материалов, и у тебя не так много вариантов, что делать дальше. Первый — разумный — быть сговорчив{mf|ым|ой} и доказать свою полезность".'
- guid: 0ab26a83-49a9-45b7-94cd-c034ae99ecf9
  text: '{n}Стоит блестящему камню коснуться алтаря, как издалека до вас доносится эхо мучительного стона — и волна неистового восторга накатывает на вас из-за грани мира.{/n}'
- guid: 0abd71d3-3e50-4b79-9dc8-29a4223db7ec
  text: '"По стати узнаю вожака и настоящего воина. Да, все еще недостойного жить ксеноса, но — воина. Спорю, что этот благородный безумец битвы падет от моей руки!" {n}Ульфар обводит отряд радостным взглядом, словно ожидает, что кто-то примет его пари.{/n}'
- guid: 0b1c61ce-8650-4a9e-83a2-41b37cc02b4d
  text: '{n}Висок пронзает резкая боль — сущность внутри вас орет и неистовствует, обещая миллионы пыток и мучений за ваше предательство.{/n}'
- guid: 0b26edff-dd31-4a69-95c8-2f2e74b959fe
  text: '{n}Ничего не ответив, Арлекин растворяется в синей ряби. Последней исчезает рогатая маска, из-за которой раздаются несколько недобрых смешков.{/n}'
- guid: 0b65e2d9-6fed-4d4e-8b20-516692c3e039
  text: '{n}Ирлиэт жалобно вскрикивает и хватается за оружие, которое тут же оборачивает против вас. Ее примеру немедленно следуют остальные эльдары.{/n}'
- guid: 0be97766-c266-42d8-bcbe-aa5eb9fcf420
  text: '"Последний шепот увертюры стих,

    Пора, Купец Бездомный, совершить

    Паломничество на подмостки сцены.

    Прощальный дар мой — скромный реквизит".

    {n}Неизвестный вкладывает что-то в вашу ладонь и растворяется в сумраке.{/n}'
- guid: 0c29709e-3add-4800-8e84-a8347682b009
  text: '"Мне плевать на твои интересы, {name}. Ты знаешь, зачем я бродил по проклятым лесам тридцать дней и ночей. Так что не смей портить веселье". {n}Каллигос говорит спокойно, почти тихо. И от того его речь звучит еще более угрожающе.{/n}'
- guid: 0c795a4e-620b-4421-9d29-bcdd3cc0b36a
  text: '"Извольте перебить, госпожа Вультур..." {n}Урбенд Драйвстем, губернатор Даргонуса, заметно нервничающий от вида вооруженных арбитров, все же горделиво поднимает голову.{/n} "Премного благодарны за то, как вы здесь нас собрали..." {n}Ударение на последнем слове не оставляет сомнений, что сборы дворян во Дворце были недобровольными.{/n} "Однако все это, что сейчас здесь происходило, не меняет основ. Династия фон Валанциус владеет Торговым Патентом. Династия фон Валанциус — род Вольных Торговцев, и это не изменит никакая тяжба! Род Драйвстем верен Вольному Торговцу".'
- guid: 0c945a47-a16d-49de-af76-1407f4ced3a1
  text: '{n}Консоль, управляющая чудовищной установкой, словно растет из металлического пола. Матово-черные панели усеяны цепочками светящихся глифов и несколькими выступающими сферами.{/n}'
- guid: 0ca91d51-a399-45e9-b349-e7a6e5b7fc0d
  text: '{n}Сержант-инструктор Данкош кивает вам в знак приветствия.{/n} "Ваша Светлость! Стоило, конечно, затеять драку с железными уродами, чтобы сразиться бок о бок с вами!"'
- guid: 0d071dc3-f2d6-41ea-a65b-bf55831b16cb
  text: '{n}В бледных глазах загорается дикий огонек.{/n} "Ты даже не представляешь, что такое уметь видеть ее. Чуять ее! Заглядывать в души других и видеть грех. Ты не знаешь, каково это — прозревать на лицах печать нечестивых деяний. А я — знаю! И ни один из них не укроется от меня!"'
- guid: 0d54898b-336d-41cb-b114-11f4dbe513c6
  text: '{n}Облаченная в доспех Висиря, Кибелла неотрывно смотрит на место, где недавно лежало тело человека, вырастившего ее. Плечи дрожат, голова поникла, но за маской из темного золота не видно слез и не слышно рыданий. Вдруг она запрокидывает голову, и отчаянный крик, полный боли, ярости и сожалений, разносится по храму. Перед вами сейчас не Висирь и не ткач. Просто дочь, потерявшая отца.{/n}'
- guid: 0d874da7-9839-4da9-9067-6bbe76627266
  text: '{n}Осклабившись, Ульфар мстительно рычит:{/n} "Прощай, ублюдок. Пусть Моркаи жрет твои потроха вечно".'
- guid: 0dbf3ac8-908d-4006-902b-836a36b858f6
  text: '"Как и предполагалось с самого начала, разве не так?" {n}Ювенна саркастически цокает языком.{/n}'
- guid: 0dfceb22-d524-4f28-8779-defa596bbaea
  text: '"Я знала, что вы оцените, шерин". {n}Джай громко хлопает в ладоши, и зверь с плотоядным интересом оборачивает на громкий звук.{/n} "Думаю, возле вашего трона она будет смотреться наилучшим образом".'
- guid: 0e028023-2cec-4f4f-982f-0b73c0bfe3a5
  text: '{n}Кассия неуверенно хмурит брови.{/n} "Раз вы так говорите... я прислушаюсь к вашим словам".'
- guid: 0e3547ba-c29e-4570-8db2-02e81fe7f7c7
  text: '"Исключено". {n}Коротким жестом девушка выстраивает между вами непробиваемую стену.{/n} "И я не желаю более продолжать сей разговор".'
- guid: 0e757eb7-74a4-4764-95ab-5c72a9e8f375
  text: '{n}Орудие с оглушительным ревом дергается, пытаясь достать до вас — и тут же обессиленно падает на землю. Вам кажется, что недобрый огонь в глазах машины заметно меркнет, словно сковавшие ее цепи высосали из орудия колдовские силы.{/n}'
- guid: 0eb7cce1-465e-4f23-85da-713fc9752c8c
  text: '{n}Дознаватель {d|Encyclopedia:CompHeinrix_Rough}не шевелится{/d} — только его глаза распахиваются чуть шире. Стражник выгибается дугой — и рушится на землю.{/n}'
- guid: 0eecf3ed-5752-49e3-a1f8-8bb980c2cfd5
  text: '{n}Ульфар, насупившись, тихо отвечает:{/n} "Ты — достойный соратник. Я не желал вреда тебе и твоим близким, железный жрец".'
- guid: 0fe8998e-a436-48c5-90d9-2e834fd19c21
  text: '{n}Девушка тихо шепчет:{/n} "Он был стариком, что лгал мне и использовал... Но он был. Теперь его нет".'
- guid: 0fef41c0-86fd-4710-9a5a-814cd25e64f5
  text: '{n}Фактотум деловито встряхивается и тут же делает пометку в своей инфопластине.{/n} "Безусловно, Ваша Светлость".'
- guid: 0ff604a0-fcb8-41ea-bbf3-3aa9bc61620f
  text: '{n}Капитан-интендант разворачивается и уходит в сторону поселения.{/n}'
- guid: 101654eb-a74e-4814-a3ab-0f37fa861e6c
  text: '{n}Фактотум и преданные вам люди замирают в благоговейном молчании. Не каждый день им доводится наблюдать, как Вольный Торговец приносит святой обет Богу-Императору.{/n}'
- guid: 10296e51-2279-42fb-9169-72ea673fda40
  text: '"Пусть Омниссия направит нас по пути истинной функции". {n}Мастер двигателя разворачивается и издает короткую бинарную команду.{/n}'
- guid: 102db652-4e7c-4b6c-a8b0-2eb4f45ca288
  text: '{n}На вас с подозрением взирает простолюдин в потрепанной робе со скверно побритой рожей. В руках он сжимает авторужье, готовое, кажется, развалиться от неосторожной перезарядки. Прищурившись, мужчина интересуется:{/n} "Вы хто? Бандиты?"'
- guid: 1035f005-288e-43d6-9ad3-5acb4f422504
  text: '"Что ты творишь, элантах? Мой народ — не я, они не поймут, не простят мон-кай за подобное!" {n}Ирлиэт сторонится вас, словно безумного псайкера.{/n} "Ты только что провел{mf||а} черту между нами, {name}. Прости, но я останусь по другую сторону".'
- guid: 103f2c17-a92e-4e4a-88b9-0b54b95ea436
  text: '{n}При вашем появлении Хейнрикс поднимается из кресла с улыбкой.{/n} "Ты пришла".'
- guid: 10ba94f9-31f4-457e-98dc-9a212cbc45d7
  text: '"Джиневри?" {n}Стальной голос Иокасты заставляет всех замереть. В нем слышатся нотки недоумения.{/n} "Разберемся с ней после. А я лично займусь поисками Гведона. Лорд-капитан, прикажете казнить этого "демонопоклонника"?"'
- guid: 1167ce93-843a-4150-b0ca-35f7ded615f2
  text: '{n}Хейнрикс кивает.{/n} "Я... склонен избавить их от мучений. Каждое лишнее мгновение такого существования — чистая мука для тех, кто заперт в этих оболочках..."'
- guid: 116b3c71-d350-4819-9c03-545e8903c651
  text: '{n}Тихо хмыкнув, Абеляр шепчет:{/n} "И кого же мне напоминает Его Светлость Винтерскейл..."'
- guid: 1211c3a5-bff2-4443-96ac-aca2ef10408f
  text: '"Проклятые... твари..." {n}Хейнрикс с сиплым рычанием пытается приподняться — им движет скорее ярость, чем физическая сила.{/n} "Я... лично... придушу... обоих..."'
- guid: 12b02e40-1c82-4b6e-a77d-b3862a28e49a
  text: '"Вы... из династии фон Валанциус? Великий Звездный Наместник Гордости Сантиэля, {mf|Небесный Посланник|Небесная Посланница}? Столько циклов провели мы в молитве, дабы Император даровал нам спасение, и вот вы здесь!" {n}Несмелый юношеский голос доносится из-под драгоценной маски.{/n}'
- guid: 12c3e844-c23c-4136-8670-f27159271c6c
  text: '{n}Дрожащий негоциант угодничающе кланяется.{/n} "Вот спасибо, Ваша Светлость, вот приятно слышать... Не обманем ваших надежд, будем ладно себя вести и лишний раз у высоких господ под ногами не вертеться!"'
- guid: 13e0b7be-d55c-44c6-9d37-2b442bde4c89
  text: '{n}Дознаватель молча кивает, не произнеся ни слова.{/n}'
- guid: 13fbe58e-447d-4924-b749-2b5ef8db8f84
  text: '{n}Гемункул поднимает взгляд от панели управления и надменно взирает на вас из-за непроницаемой силовой завесы.{/n} "Ты выжил{mf||а}, образец. Прискорбная неспособность выполнять приказы. Тебе должно было сдохнуть — на арене ли, или в Прорве. Впрочем, слуги Эзирраеш вскоре исправят эту накладку".'
- guid: 1410710e-3d87-44cf-80fc-92bc6a66132c
  text: '"Вот и все — сознался. Я не раз говорил, что убийца — один из затаившихся прислужников Кунрада. И вновь оказался прав. Видать, не настолько хорошо мы их вычистили, как думали". {n}Хротко бросает цепкий взгляд на Иокасту.{/n}'
- guid: 1415adb1-7947-4f4e-afde-6de3d0147241
  text: '{n}Маражай морщится, словно услышал что-то неприятное.{/n} "Ты... нарушаешь правила игры. Будь внимательнее, если желаешь продолжать ее".'
- guid: 14456027-d19b-440d-82c4-f913e6184f47
  text: '{n}Острая молниеносная боль пронзает ваш висок — словно в ответ на услышанное. Вы понимаете, что благодарить за подобную удачу стоит не Бога-Императора. В голове звенят {d|Encyclopedia:Prologue_EdgeHelp}слова исчадия{/d}, явившегося вам во время трансляции.{/n} "Я — воля Ткача Судеб, и сегодня я сплету новую нить из прихотливых вероятностей и ускользающих шансов. Нить, что выведет тебя из пасти необратимости. Нить, что позволит тебе отыскать ключи к спасению."'
- guid: 1459c8d2-3889-4c6b-ab1e-95b962eb8992
  text: '{n}Когитатор выглядит куда более старым и обветшалым, чем соседние. В то же время видно, что о нем хорошо заботились — многие детали заменены на новые, ни одна клавиша не западает, свежие печати с молитвами {g|Encyclopedia:Omnissiah}Омниссии{/g} украшают поверхности. Одна из боковых панелей снята, и пучки украшенных золотыми насечками кабелей тянутся из его нутра к небольшой инфокрипте, присоединенной совсем недавно.{/n}'
- guid: 1481e198-b248-4933-87d9-71340689d18e
  text: '{n}Лекарство от загадочной болезни так и не было найдено, но изучение проказы позволило взять образцы заразы под контроль при помощи магнитных импульсов, превратив ее в опасный инструмент.{/n}'
- guid: 14c3f31d-ecc0-437d-860d-c828564b79d2
  text: '"Император защищает! Добро пожаловать домой, Ваша Светлость". {n}Статная женщина в удлиненном мундире исполняет изящный реверанс. Короткие волосы, тронутые сединой, не скрывают сурового лица женщины.{/n}'
- guid: 14cdd1a2-7720-4b84-878e-62e2993c09e9
  text: '{n}Знакомая фигура поворачивается к вам. Хейнрикс ван Калокс, дознаватель Ордо Ксенос, почтительно склоняет голову.{/n} "Лорд-капитан".'
- guid: 14d41f5b-e9b1-4382-85a8-ad8dff5d4b77
  text: '{n}Неожиданно какофонию вони в помещении заглушает острый, пронзительный запах озона и машинной смазки. Вы чувствуете, что тошнотворная атмосфера, царившая в зале, словно сгустилась в единое средоточие зла в глубинах корабля... и теперь стремительно приближается к вам.{/n}'
- guid: 1507ab98-9612-4580-ba77-d35e8bf967a2
  text: '{n}Хейнрикс пошатывается, словно от удара. Его немигающий взгляд вперивается в монстра перед вами.{/n} "Скаландр?"'
- guid: 15188231-19c1-438a-8911-714335877955
  text: '{n}Ризза понижает голос.{/n} "Давайте проверим. Слышали ли вы про "Семь кровавых стигмат"? Это удачливый пустотный крейсер, ограбивший не один десяток миров {g|Encyclopedia:Xenos}ксеносов{/g} в {g|Encyclopedia:KoronusExpanse}Просторе Коронус{/g}. "Семь кровавых стигмат" пропал при варп-прыжке, возвращаясь из рейда, лет эдак пятьсот назад, и никто не знает, где сейчас дрейфует это судно и какие трофеи лежат в его трюме".'
- guid: 1526ede5-843c-4143-9401-c393595e1d81
  text: '{n}Фелек чуть улыбается — расслабленно и почти спокойно.{/n} "Если все пройдет, как задумано, вам не придется беспокоиться о подобном".'
- guid: 1551af93-eb56-4054-b049-f13d9150fb6b
  text: '{n}При вашем приближении ворон возбужденно взмахивает крыльями, словно торопясь что-то вам отдать. В распахнутую ладонь падает занятная вещица...{/n}'
- guid: 157695cc-b2e1-411c-b834-04c860a428c4
  text: '{n}Белая пелена застилает ваши глаза — вы не видите ничего... и ничего не желаете. Внезапно приходит осознание — здесь оставаться опасно. Здесь жить нельзя. Нужно найти выход и утолить жажду. Нужно спасти потомство.{/n}'
- guid: 1582d42e-44ae-413f-92f4-907e435498f7
  text: '{n}Двойник кивает медленно и печально.{/n} "Прости меня, Ирлиэт Ланэвисс. Ты приняла на себя удар дракона кабала, предназначавшийся мне, но медике не смогли залечить твои раны. И все же... вновь увидеть тебя живой — огромная радость".'
- guid: 159207ae-c8ff-4788-83e3-f37d71c1400f
  text: '{n}При вашем приближении из-за массивной двери доносится высокий мальчишеский голос.{/n} "Пошел вон! Я живым не дамся! Лучше пустить себе заряд в голову, чем попасть к псам губернатора!"'
- guid: 1595bf5a-7b97-4991-a825-daed3f018bc7
  text: '{n}При виде вас лицо Тазарры превращается в маску ярости. Друкарка растягивает губы в оскале, в котором нет ни капли бывшей надменности — лишь обещание боли.{/n} "Ты!... Ублюдочн{mf|ый|ая} мон-кай, проклят{mf|ый выродок|ая сука}! Ты заплатишь за каждое мгновение, проведенное мной на этой жалкой планете!"'
- guid: 15cb777b-24c6-44b7-bdbe-a3ef95a0bc05
  text: '"Моя же стая исполнит все, что должно, и встанет на острие штурмового клина. До встречи на поле боя, {name}". {n}Торбальд язвительно улыбается Ульфару.{/n} "И тебе до встречи, Ульфар Пропащий. Жаль, твоя стая не сможет разделить с нами эту славную победу".'
- guid: 15e9809f-f13a-4d0b-8144-fe0bb210d276
  text: '{n}Рудиментарные руки, растущие внутрь, обвивают пародии на привычные органы, между которыми расположены чешуйчатые пузыри желчного цвета.{/n}'
- guid: 15fc9774-da64-42ba-978b-ee1237be3dfa
  text: '"Лорд-капитан, как же вас видеть отрадно! Я чуть было с ума не свихнулась, когда вы пропали. Все это время на стимуляторах и рекафе сидела, не спала почти, все шепотки слушала, пытаясь понять как вас найти. Я себя такой бессильной чувствовала только один раз прежде, когда Леди Теодора..." {n}Идира запинается.{/n} "Простите, что-то я несу невесть что тут".'
- guid: 15fd2333-61f2-44fe-9c53-6fc45f841a7c
  text: '{n}Мужчина не сопротивляется вашему гневу и даже отклоняется ближе к рельсам, принимая конец с улыбкой.{/n} "Ибо Неумирающий и есть смерть".'
- guid: 163a2a56-ed6f-4f14-b1a6-c555b90d11e9
  text: '{n}Вольный Торговец застывает, пораженный вашей наглостью.{/n} "Я дозволил вам говорить на совете, и это — ваши слова? Прекратите нести вздор".'
- guid: 16a056d5-cd87-45fb-b4db-a2ad56882bec
  text: '{n}Ирлиэт едва заметно кивает и возобновляет свою речь, ее слова преисполнены боли и просьбы. Она делает шаг. Еще один. И еще. Вам начинает казаться, что рейнджер слишком уверенно делает последний шаг...{/n}'
- guid: 16a90383-3156-45cf-bba0-74a5ae640b95
  text: '"Мясо. Господин велел пропустить тебя". {n}Стоит вам приблизиться, как в туше монстра активируются несколько аугментов. С шипением в кровь впрыскиваются какие-то вещества, заставляющие вены вспыхнуть, а мышцы вспухнуть в судороге.{/n}'
- guid: 16cf25e4-fa6e-4d24-b24a-09fdae903b6c
  text: '{n}Зловредные энергии варпа впитываются в плоть предателя, заставляют ее светиться и мерцать. В безумном, исполненном боли и восторга вопле Кунрад Войгтвир прекращает существовать, и из кровавых останков его поднимается могучая крылатая фигура.{/n}'
- guid: 16e3c508-2f72-47ca-97a4-b9f60932c70b
  text: '"Проклятый ксенос! Мы так не договаривались, Трон тебя побери!" {n}Навигатор с прозрачной кожей, через которую просвечиваются мышцы, кости и внутренности, с отвращением кривит аугментированную золотую челюсть.{/n}'
- guid: 16e9b0a6-a484-41f0-b5a3-6e0b98ceba23
  text: '"Я так цеплялся за идею того, что его можно спасти, что не заметил, что спасать уже нечего. Нунциус, которого я знал, погиб на этом самом месте полвека назад. Но ведь хладные останки — это не все, что остается после человека. Память. {g|Encyclopedia:ImperiumGlossary}Империум{/g} построен на памяти. Памяти о павших. О технологических заветах тех, кто был до нас. О великой жертве Бога-Императора, что ведет нас сквозь тьму беспощадного космоса". {n}Эоганн долго смотрит на Нунциуса сквозь марево стазиса.{/n} "Я дарую ему Милость Императора, а после воздам почести, как это должно сделать служителю Омниссии".'
- guid: 1767e406-b72e-4132-95ff-ebaeefe441fd
  text: '{n}Высокий {g|Encyclopedia:TechPriest}техножрец{/g} в причудливом красно-черном облачении церемонно приветствует вас, плавно поводя {g|Encyclopedia:Mechadendrite}мехадендритами{/g}. Роба на нем повреждена в нескольких местах, а на аугментике видны следы от выстрелов, но, кажется, его это ничуть не заботит.{/n} "Приветствую Вольного Торговца {name} фон Валанциус. Ваше присутствие в сводах сего храма {g|Encyclopedia:Promethium}прометия{/g} — большая честь для обитателей его".'
- guid: 180efb9a-86ad-463e-be0b-4e58b3ca75c9
  text: '"Да нет же, Нунциус, напротив, утверждает, что подобные феномены часто возникают, если ток Движущей Силы внутри гальванически-активных контуров... Погодите, вы ведь совсем его не слушаете, да?" {n}В голосе Эоганна появляется отчетливый оттенок укоризны.{/n}'
- guid: 18339c83-acef-46a7-896a-97698fa8a4d6
  text: '{n}Ирлиэт оглядывает поле боя.{/n} "Да оберегут нас боги от гордыни и блужданий в перипетиях судьбы... "'
- guid: 1840a58e-4ca2-4a54-8859-9c90a2e36a76
  text: '{n}Истекающий кровью ткач культа смерти едва слышно хрипит.{/n} "Ты цел{mf||а}, Домин... Храм... Висирь ждет... Он поможет... Позволь провести тебя". {n}Из ослабевших пальцев выскальзывает клинок и со звоном падает оземь.{/n}'
- guid: 184be221-9bb7-4ac1-9d54-013a43dd0c10
  text: '{n}Фигура в истлевших обносках покачивается из стороны в сторону, то что-то невнятно бормоча на разные голоса, то заходясь хриплым смехом. Когда вы подходите ближе, она замирает, и лицо в уродливой ржавой маске медленно поворачивается к вам:{/n} "Ты... приш{mf|ел|ла}, чтобы проводить Здену на другую сторону? Нет... Нет-нет-нет".'
- guid: 1869fcbb-faac-4b55-85b6-75d483a2db25
  text: '"Это... довольно необыкновенная симптоматика, Ваша Светлость". {n}Взгляд манипулуса пытливо изучает ваше лицо.{/n} "Похоже, часть благословенных аугментов в вашем теле подверглась некоей чужеродной инвазии. Гальваническая терапия должна помочь крупицам Истинной Плоти, коими вы одарены, справиться со скверной".'
- guid: 186c1707-44d4-4ac3-afe0-086fcb838676
  text: '{n}Лицо Торбальда омрачается.{/n} "Немного было в моем сердце любви к Оптикону-22, но с Криком скверны бился он достойно и пал отважно. Достойный был муж, надо сквитаться за него!"'
- guid: 18a9d268-3ebd-4e13-ac1e-2fabe28c335c
  text: '{n}Невысокий мускулистый мужчина, облаченный в алые цвета {g|Encyclopedia:AdeptusMechanicus}Духовенства Марса{/g}, заступает вам дорогу. Морщины на лбу и щеках выдают в нем человека, гневающегося часто и яростно, но сейчас он не проявляет признаков агрессии. Его кожа отливает странной синевой, и сквозь нее проступают светящиеся голубые узоры электрических татуировок — электу.{/n}'
- guid: 18f39da9-9c3e-425a-8236-8782ec885e88
  text: '"Благословите именем {g|Encyclopedia:Omnissiah}Омниссии{/g}, почтенный {g|Encyclopedia:Magos}магос{/g}". {n}Мужчина смиренно опускает голову и торжественно кивает в такт бинарной молитве, льющейся из {g|Encyclopedia:Vox}вокс{/g}-системы Паскаля.{/n}'
- guid: 190d17ef-8a23-4f41-a352-cb05a94a1b3a
  text: '{n}Изодранная тетрадь лишилась куска обложки и половины страниц. Уцелевшие листы покрыты убористыми, сползающими вниз строчками, выведенными неувереным почерком:{/n}

    "Все еще не верю, что его больше нет. Каждый раз, оказываясь на посту, я начинаю вглядываться во мрак и мне мерещится его силуэт… может, это твари залезли мне в голову? Манят к себе, чтобы утащить следом за Гандиром. Леди Эмелина твердит, что эти твари — мандраки? друки? — не умеют залезать в голову. Конечно, мы слушаемся леди Эмелину, но я уже не так уверена насчет этих ее слов. Как иначе объяснить, что, когда я закрываю глаза, я вижу горящие во мраке руны, которыми была покрыта та тварь? Наваждение. Или кто-то лезет мне в голову. Ересь. Ересь снаружи, ересь внутри. В литургии, которую мы слушаем в часовне, мне слышится смех… но как это можно? Разве в молитвах положено смеяться? Нет, смеяться нехорошо. А хорошо — больше, усерднее молиться. За упокой души Гандира. Да и за наши тоже".'
- guid: 190ef992-f0f0-49d7-b165-6b44357d76c3
  text: '{n}И снова — начало. Та же застава, те же голоса, те же слова, уже звучавшие прежде. Время здесь не течет — оно ходит по кругу. Чудовищная западня, расставленная коварными ксеносами.{/n}'
- guid: 1979edf8-fa33-43f0-9727-267433af6cb8
  text: '{n}Янур прищуривается, глядя вам в глаза, после чего коротко кивает:{/n} "Да поможет вам Бог-Император. Искупление для одного!"'
- guid: 19ac8943-9a20-477f-ba32-ed4f0e6c6d8b
  text: '"Мастер ван Калокс!" {n}Рубиновые глаза Кассии невольно наполняются слезами.{/n} "Из него... словно вытянули все цвета. Бледные, призрачные тени былых оттенков еще цепляются за его душу. Мы должны вытащить его из этого механизма! Мы... мы обязаны!"'
- guid: 19b20168-d423-4ec2-baa6-3f6c9ef040bf
  text: '{n}Кажется, еще миг — и он набросится на вас. Но тут в безумных глазах мелькает узнавание, а голос стихает, словно арбитра покинули все силы.{/n}'
- guid: 19b6c488-795f-45a2-8231-e9536b111aff
  text: '{n}Эоганн делает глубокий вдох, после чего вбивает цепь команд в когитатор стазис-сацуллума. Поле мерцает и гаснет — тишину пронзают нечеловеческие крики Нунциуса. {g|Encyclopedia:Mechadendrite}Мехадендрит{/g} Эоганна вонзается в черный куб и вырывает его из рук коллеги. Прежде чем мутации успевают распространиться по щупальцу, он отсекает плазменным резаком его конец и швыряет его вместе с кубом в контейнер, где некогда хранился артефакт. Оставшиеся мехадендриты впрыскивают в Нунциуса стимуляторы. Техножрец перестает корчиться, но очевидно — ему осталось не долго.{/n}'
- guid: 19ddde09-83b4-4ef1-b58b-d2ec9ec626f5
  text: '{n}Повернувшись к Маражаю, Волк со смехом добавляет:{/n} "Слыхал? Мы вырезали твое гнусное племя!"'
- guid: 1a090db5-5f87-48bb-aad0-634b3e6fe8e1
  text: '"Для начала удалим... лишнее". {n}В руках Тервантьяса возникает несколько орудий смерти с клинками разных размеров, толщины и кривизны. Улыбаясь, словно змея, он вкрадчиво обращается к Джай:{/n} "Какой ты выбираешь?"'
- guid: 1a17d3c4-b089-47bf-942a-d5a03058d762
  text: '{n}Старица испуганно отшатывается, разглядев полуслепыми глазами истинное лицо Ирлиэт.{/n} "З-Звездорожденн{mf|ый|ая} прибудет в компании с духом, дабы остановить несчастья сего мира", — так сказал этой правительнице жрец. Видеть духа средь живых... неправильно. Духи должны жить в мире духов, а люди — в мире людей".'
- guid: 1a384451-0767-40d7-bc89-aac82d918e99
  text: '{n}Маражай суживает глаза, рассматривая портал. Поймав ваш взгляд, {g|Encyclopedia:DrukhariGlossary}друкари{/g} едва заметно качает головой.{/n}'
- guid: 1a51d65d-172f-4d56-9866-4d215e15340a
  text: '"Потомство Ювенны во всей красе". {n}Железная ладонь Себериана непроизвольно хватает пустоту у его бедра, словно ища отсутствующий эфес.{/n} "Бахвальство, словесный яд и бесплодные интриги вместо деяний. Прискорбно. Мое слово таково, наследни{mf|к|ца}: докажите, что вы достойны моего имени, или я сочту, что пять веков назад Патент был незаконно узурпирован, и верну его себе".'
- guid: 1a687076-6e3c-4eba-8bdf-fd26379356ff
  text: '"Эх, фон-Валаншество, вот это я понимаю — твердое решение Вольного Торговца! Вижу, шаттл с Хейдари уже на полной тяге спешит по нашим координатам. Добро". {n}Тото Стервятник довольно причмокивает.{/n} "Хозяин шлет вам великую благодарность, Святейшество. И обещается впредь каждый терранский год подтвержать ее дорогими подарками".'
- guid: 1a7e81b5-520a-4254-ac08-bdc1a687b671
  text: '{n}Почтенный корабельный исповедник Адальберт торжественно вздымает руки над алтарем и трагическим голосом произносит:{/n} "Духи-хранители, услышьте меня! Мы явились, чтобы покарать великое святотатство — ересь свила гнездо в фамильном склепе династии и потревожила наших почтенных мертвецов. Я молю вас свершить ритуал размыкания и отворить нам путь".'
- guid: 1a8a8f2e-6a15-4ed9-a347-a5186ac1a7d0
  text: '{n}Паскаль холодно вещает:{/n} "Единица Ульфар утверждает, что являлась лишь инструментом в чужих руках. Данное утверждение занесено в архив. Да обретет каждый инструмент внимание, сообразное функции его".'
- guid: 1afd4e31-358b-4e50-84b4-45aa1abfb372
  text: '{n}Вид-скрин {g|Encyclopedia:Cogitator}когитатора{/g} покрыт паутиной трещин и каплями засохшей крови. Вырванные с особой жестокостью из приборной панели кнопки, рубильники и рычаги валяются подле священной машины, шипящей и искрящей в предсмертных вздохах, но все же еще живой.{/n}'
- guid: 1bcd6112-48fb-46be-b8fd-bafabb6be95e
  text: '{n}На каменном лице Соломона мелькает боль, когда он смотрит на своего пса.{/n} "Вы с самого начала использовали нас как инструмент против Вольного Торговца. Уловки и интриги, недостойные Арбитес".'
- guid: 1bde13e1-bcda-419b-b026-697fe12abcd5
  text: '{n}Пустотнорожденный поднимает на вас неизменно мрачный взгляд.{/n} "Лорд-капитан, мы можем начинать пространственную трансляцию".'
- guid: 1bebfd4f-4460-4914-84f5-b76e246a90d7
  text: '{n}Заверитель склоняется над грамотой, сверкнув идеально выбритым черепом. {g|Encyclopedia:Augmentation}Аугментированные{/g} глаза-окуляры то и дело жужжат, приближая и отдаляя объективы механизмов. Когито-перья, заменяющие заверителю пальцы, со скрипом оставляют пометки на тонком листе бумаги.{/n}'
- guid: 1c057bff-3035-4cae-b0fb-4d1c602ca670
  text: '{n}Триасомата замирает, позволяя вам провести осмотр. Вы начинаете обрабатывать раны и места стыка имплантов с плотью антисептическими мазями. Прежде чем вам удается закончить процедуру, мужчина начинает выть и отбрасывает ваши руки, съеживаясь на коленях.{/n}'
- guid: 1c5d39e0-cbb9-4106-9c06-b543c0621363
  text: '{n}Приоресса Лугналия избрана настоятельницей Ордена Молота. Ополчение верующих облачается во всеоружие, чтобы заявить права на реликвии святого Когнация. Соседние миры взирают на Фолстоун с беспокойством и страхом, как и на его покровител{mf|я|ьницу} — Вольного Торговца.{/n}'
- guid: 1c802124-892c-4489-a0d5-7f98c62a168d
  text: '{n}Идира поворачивается к вам и качает головой:{/n} "Хорошо б, конечно, взглянуть на эти надписи, но вот так навскидку — на {g|Encyclopedia:Warp}варп{/g}-влияние не похоже. Если б там в доме что-то поселилось — за десять лет оно бы уже себя активнее проявило. Десятком трупов минимум".'
- guid: 1cbecb1f-5758-4504-a5e9-990c1d9b58e3
  text: '{n}Почти бесшумно гвардейцы исчезают в зелени, занимая позиции для атаки. Вы вновь окидываете окружение взглядом, готовясь к финальному броску.{/n}'
- guid: 1d3912cf-6ab4-46ee-b999-6495fcfcf4b6
  text: '{n}Трудно сказать, зачем это было сделано — возможно, это какой-то символ или послание.{/n}'
- guid: 1d696800-0ea1-4c7b-8008-fc662a526976
  text: '{n}Устрашающие шасси больше не могут удерживать гигантского воина. Лязгнув пластинами брони, он тяжело оседает. В его груди рождается низкий звук, который Толкователь {d|Encyclopedia:Ch5_NecronKnowlege}обращает в слова{/d}:{/n} "Горе недостойной династии Йекхмет. Исходит на нет сон, возвращается рабствование. В облачении из стыда зрю в зарницы грядущего".'
- guid: 1d922152-fa1e-44ad-894f-990deab67b08
  text: '"Да эти заблудшие позабыли истинный лик Бога-Императора! Все, что несчастным досталось в память о Его благословении и могуществе — лишь священная аквила". {n}Арджента сокрушенно качает головой.{/n} "Каллигосу Винтерскейлу стоило бы заботиться о просвещении своих миров вместо удовлетворения охотничьего азарта".'
- guid: 1d9d9568-9976-4fb6-aaf4-87d55eb25294
  text: '{n}Во время перехода по звездной системе вас застает странная усталость. Веки наливаются тяжестью, глаза закрываются, а перо, которым вы водили по бумаге, составляя очередной приказ, выпадает из руки...{/n}'
- guid: 1da918ad-cfe5-4f7b-bb54-59aa2dd89310
  text: '{n}Кассия чуть слышно вздыхает.{/n} "Тисифона поступила неразумно, использовав артефакт ксеносов в своих экспериментах. И Дом Орселлио направит все силы, дабы искупить ее грех пред Богом-Императором. Именно поэтому я не позволю уничтожить Атлас — это ослабит не только нас, но и все Человечество!"'
- guid: 1dcb07d4-b593-409f-b34b-8cd3470ea553
  text: '{n}Эльдарка проводит по лицу рукой прежде, чем повернуться к вам. Бледная кожа плотно обтянула кости черепа, глаза утратили прежний блеск, а шея склонилась под тяжестью неведомого груза. И все же вы узнаете ее — это Ирлиэт Ланэвисс, некогда ваша спутница и причина заточения в этих темных стенах.{/n}'
- guid: 1dda9511-1cd3-4aee-ac3b-5248b201e78c
  text: '{n}Обступающие вас меровцы кажутся напряженными. Хотя сами вы больше не ощущаете давления в голове, они, кажется, все еще страдают от длительного воздействия визга Погонщицы.{/n}'
- guid: 1df9a1b1-7ed8-4e0a-b4db-f299095a1154
  text: '{n}Фигуры вновь неподвижны, однако вас не отпускает чувство беспокойства. Словно каждая из них внимательно наблюдает за вами, безмолвно ожидая следующего хода.{/n}'
- guid: 1e083fd4-c064-41ae-a4e0-46b0ef095283
  text: '{n}Вокс-станция шумно плюется помехами.{/n}'
- guid: 1e1fc8b1-609e-4a3d-87d7-a192559eaa91
  text: '{n}В Секторе Бионика царит странное затишье. Людей почти нет, большинство операционных столов пустует. Лишь сервиторы-уборщики снуют вокруг, непрерывно распыляя обеззараживающие растворы и транслируя бинарные литании очищения.{/n}'
- guid: 1e65fa1c-8b3b-4886-9e16-3170d6738378
  text: '{n}Стражница протирает глаза и бросает на вас изумленный взгляд. Одна половина ее лица почти скрыта громоздким, ржавым аугментом, назначение которого вам неизвестно.{/n} "Пришли... пришли, спасители! Слава Богу-Императору, дошла весть! Донес до своих сообщеньице колдун, чтоб ему земля пухом!"'
- guid: 1e797ecb-3ba0-4b23-98b9-00d642a15955
  text: '{n}На металлическом столе, в окружении искрящих спиралей из медной проволоки, возлежит тело {g|Encyclopedia:TechPriest}техножреца{/g}. Иссушенная плоть покрыта пленкой священной машинной смазки, {g|Encyclopedia:Augmentation}аугменты{/g} заботливо отполированы. Cкрещенные руки и обнаженный торс покрыты замысловатыми электу, а голову мертвеца обвивают жгуты проводов.{/n}'
- guid: 1e8f53a2-a596-475f-bb71-76d92215669d
  text: '"Вольный Торговец!" {n}Сестра Арджента приветствует вас горящим взором и уверенной улыбкой на губах.{/n} "Бог-Император не оставил сво{mf|его|ю} избранни{mf|ка|цу}! Я молилась о том, чтобы наши пути вновь пересеклись!"'
- guid: 1ebf1f64-283d-4f1b-ae27-93f7f0bc2e24
  text: '"Итак, шерин, что же мы имеем: трусливого ашмага, желающего заполучить мою грамоту без особых усилий. Учитывая... обстоятельства, с которыми столкнулся Футфол, единственным подходящим местом для логова такого отброса являются канализационные тоннели". {n}Джай морщится лишь от одних воспоминаний.{/n}'
- guid: 1f47ec57-bf6b-4572-bdba-3303fd26d155
  text: '{n}Череда подземных толчков сотрясла копи, и чудовищный рев рушащейся земли заполнил опустевшие туннели. Облака токсичного дыма выплеснулось из глубин шахт. Преграда из камня и земли отделила людей от страшных захватчиков... кем бы они ни были.{/n}'
- guid: 1fc313ec-12b7-46d4-b577-13aeace3173d
  text: '"Сие требуется всегда, но время и цель назначает Неумирающий". {n}Кибелла отвечает с достоинством, явно не замечая зловещей двусмысленности своих слов.{/n}'
- guid: 205baefc-11e8-4d15-ad31-bb2615311e86
  text: '{n}Офицер Кляйн, вытянувшись, гаркает:{/n} "Опознать погибшего не представляется возможным — лицо размозжено, а тело сильно изуродовано. Из-за множественных ран точную причину смерти определить сложно, но, предположительно, он погиб после того, как ему вспороли глотку, через которую и слили кровь. Внешних признаков мутаций не выявлено".'
- guid: 20728033-e67e-41be-b437-70651f273c89
  text: '{n}Невротически дернув бледной щекой, Инцендия решительно кивает вам.{/n} "Мы оказались в мрачном месте, {name}. Я страшусь при мысли, какие ужасы здесь таятся. Надеюсь, нам хватит сил, чтобы исполнить свой долг перед людьми Простора".'
- guid: 207f8bab-6b76-4b5a-bb38-0ed7436d9c0e
  text: '"Вижу, ты неперевоспитуем{mf||а}, образец. Мои ожидания были выше. Если ты не способ{mf|ен|на} выполнять даже простые команды, нет оснований использовать тебя для чего-то более важного. Я найду тебе более утилитарное применение". {n}Одна из механических конечностей ощетинивается венцом зазубренных крючьев, которые тянутся к вашему лицу, а затем и внутрь вашего лица.{/n}'
- guid: 20802070-ec15-4f1c-8beb-d2ee521f6317
  text: '{n}К поясу блюстителя пристегнуто оружие, в котором вы без труда опознаете плазменный пистолет. Несмотря на дорогую отделку корпуса, пистолет явно боевой — его рукоять, украшенная именным вензелем "ИЗ", покрыта царапинами и потертостями, указывающими на частое использование. {/n}'
- guid: 20939225-673f-4ca7-8c91-ae8d4e0a63ac
  text: '"Когда капсула открылась, мой разум потонул в грязно-алом, и буром, и черном, и... И я схожу с ума, {name}! Прошу, помогите мне!" {n}Кассия протягивает руки, моля о помощи, но все ее тело сотрясается от переполняющей силы — и она вот-вот вырвется вновь.{/n}'
- guid: 20b296f5-ff7c-4e0c-a445-426829751b07
  text: '"Нравится? Я приказал создать этот яд специально для тебя! Кто бы мог подумать, что однажды мон-кай удостоится подобной чести — получить особенный подарок от самого дракона? Но твои страдания..." {n}Ксенос наклоняется ближе.{/n} "Я знал, что с небольшим вкладом друкарского таланта по извлечению мук их вкус получится особенным..."'
- guid: 21027e4c-0bd0-436e-a38c-96e66ac36e03
  text: '{n}Вид этого {g|Encyclopedia:Cogitator}когитатора{/g} способен разбить сердце любому {g|Encyclopedia:TechPriest}техножрецу{/g} — машина слегка кренится на бок, вся грязная, измалеванная рисунками, на корпусе кое-где выцарапаны фривольные надписи. Нескольких клавиш не хватает, остальные покрыты пылью.{/n}'
- guid: 211f0f3d-655e-4e31-bd4c-bfd933303e3b
  text: '{n}От Батошски исходят почти ощутимые волны ярости.{/n} "Ваша Светлость? Вы тут. Врать не буду, даже рад".'
- guid: 219c23f9-b1c3-4cd5-8960-28d40b72f637
  text: '{n}Такой же подарила вам Ирлиэт на прощание в лесах Кетца Темера.{/n}'
- guid: 21a9bd0d-5dcb-477a-9121-4eb44d1a2de6
  text: '{n}Звук сервомоторов черепа взлетает на два тона выше, когда он закладывает лихой вираж вокруг вашей головы. О результатах своего исследования Нунциус умалчивает.{/n}'
- guid: 21dca961-1e83-4795-9d38-371295f23e98
  text: '"Меня предупредили, что среди мон-кай будет любительница баловаться дурманом. Для тебя в этом газе припасено кое-что особенное". {n}Злорадно улыбнувшись, ксенос наступает на голову девушки, с хрустом вдавливая лицо в пол.{/n}'
- guid: 21de7438-db28-448d-b294-9248fa965260
  text: '{n}Глаза фактотума быстро скользят по инфопластине.{/n} "Думаю, мы можем в кратчайшие сроки отремонтировать "Бессердечного", затруднения вызовут только отсек для истребителей и некоторые части корпуса — на их починку потребуется больше времени. Главное, корабль сможет встать на службу династии без промедления".'
- guid: 221cbd86-41bf-477e-86a6-12f81f6dbb1e
  text: '{n}Джай обреченно вздыхает.{/n} "Можно хоть раз отправиться не куда-то в Гиблые Земли, а, скажем, местный бар? Нет? Ну просто для разнообразия".'
- guid: 223c9b2e-4ae3-437c-9628-6a1fde0e5057
  text: '"У меня нет причин вам не доверять, но Себериан не поверит, что поступки его дочери вышли за пределы обычных дворцовых интриг. Ювенна могла уверять вас в обратном, но эта особа слишком избалована всеобщим вниманием, чтобы заметить, как крепко к ней привязан отец". {n}Последние слова Лария произносит с усилием.{/n}'
- guid: 223d04ee-bea1-42fc-a922-8b7d51e28e11
  text: '{n}Образ Домин встает перед глазами, и я всматриваюсь в него непозволительно долго. Я не ведала, что связь между нами будет... такой. Висирь не предупреждал меня, как важна и дорога она станет для меня. Я отдаюсь своей слабости до конца, и смятение, царящее в разуме, ослабевает.{/n}'
- guid: 223d3001-3f7d-43cd-856d-2a7ba121586c
  text: '"Не знаю что это значит, но тухло это все пованивает, Лорд-капитан, не нравится мне это вот совсе... О!" {n}Идира смотрит на свои руки, словно в первый раз.{/n} "Прошло".'
- guid: 2281007a-0711-461a-9f5e-1c5eaa02107b
  text: '{n}Дознание так не установило, кто стоял за убийствами, положившими начало бунту. Уровень МД-Зета/05 был опечатан.{/n}'
- guid: 22f2e766-a1ea-4066-82da-71d6ea81aa92
  text: '{n}Вы хватаете ртом ядовитый воздух, и каждый вдох обжигает ваше нутро жидким огнем — от глотки до легких. Каждая клеточка вашего тела сходит с ума от боли — словно вас с ног до головы обливают раскаленным металлом, затем заживо сдирают кожу, и покрывают новой порцией боли. Где-то вдалеке вы слышите стоны своих людей, шлепанье босых ног... и легкие шаги, неторопливо приближающиеся к вам.{/n}'
- guid: 22f656b9-d8d7-4342-9623-2d46196c4a9a
  text: '{n}Вашему взору предстает скорчившийся в агонии эльдар — вернее, нечто, напоминающее эльдара. Его лицо иссечено десятками шрамов и швов, суставы двигаются под кожей с тошнотворной неправильностью, а с лица взирает лишь одно безумное око. Однако в его изодранных одеяниях с трудом узнаются церемониальные робы провидца.{/n}'
- guid: 232f9ebf-ecec-4322-8327-bfb5a54bfa90
  text: '{n}Над {g|Encyclopedia:Cogitator}когитатором{/g} склонился долговязый послушник: его лицо выражает крайнюю степень умственных усилий, а по-рыбьи круглые глаза вперились в экран.{/n} "Пошли мне разумения, {g|Encyclopedia:EmperorGlossary}Владыка{/g}, пошли мне мудрости..." {n}Он вздрагивает при вашем приближении.{/n} "Ваша Светлость? Чем могу быть полезен?"'
- guid: 23353a0e-7ab8-474c-a61d-8873c8bc75c3
  text: '{n}Ирлиэт поднимает оружие.{/n} "Довольно, {name}. Твоя душа уже источена Врагом — дороги назад нет, и я прерву твой кровавый путь собственной рукой".'
- guid: 23896ca0-c773-49d5-86ee-f6e713e83def
  text: '{n}Бархатный сюртук фактотума стал бурым от крови, а сам Янрис смертельно бледен. Над черной от пороха раной в его груди хлопочет медикарий, и от каждой манипуляции фактотум слабо охает. С большим трудом он фокусирует взгляд на вас:{/n} "Простите… что не приветствую Вашу Светлость поклоном... Я должен рассказать... Немезит похитил реликвию из святых мощей".'
- guid: 23aeaffa-4943-42ae-898f-b7f8ff1a6be1
  text: '{n}Две женщины яростно спорят, не обращая внимания ни на что кругом. Над ними высится впечатляющих размеров зенитное орудие.{/n}'
- guid: 243b6db8-4d15-4abf-be87-71ccaa8b5793
  text: '{n}Хейнрикс суживает глаза.{/n} "Зачем мы тратим время и рискуем использованием псайкерских сил в варпе? Ради чего? Ради того, чтобы сохранить твою хищную зверушку? Не пора ли избавиться от этой смертоносной экзотики в твоем зверинце?"'
- guid: 244b7159-9611-4f93-9c95-f24ee2731485
  text: '{n}Кибелла цедит сквозь зубы:{/n} "Ты воспользовался моим доверием, чтобы сделать из меня инструмент! Конечно, теперь я не вижу себе иной судьбы, но это не значит, что так было предопределено!"'
- guid: 248cae2e-865f-41db-9ec0-5e1b7848f562
  text: '{n}Измученные изощренными дознаниями, вожаки заключенных повелели истреблять каждого, кто подает признаки помешательства. Чистки выкосили многих рабочих, но исчезновения и странные феномены прекратились.{/n}'
- guid: 25551aa4-f6a4-49ca-a830-a3205e8ff532
  text: '{n}Друкари не нуждаются в иной пище, кроме жизненной эссенции, добываемой из их страдающих жертв. Лишившись же ее, они деградируют до подобных жалких существ. Сами ксеносы презрительно зовут их "пересохшими".{/n}'
- guid: 256b9698-84bd-4d3c-95db-ced02d382b8e
  text: '{n}Несколько тысяч беженцев были направлены в епитимальный пилигримаж на поиски реликвий святого Когнация. Многие считали, что это лишь способ избавиться от неудобных людей.{/n}'
- guid: 2572ceed-2791-4fd9-b2ef-3ec927f12d10
  text: '"Серенада Шварц? Что же... После помилования она сама подала прошение о своей сервиторизации и отправлении в Сектум Бионика, дабы службой искупить свой поступок". {n}Вивисектор поджимает губы. На миг его лицо становится жестким.{/n} "Я счел правильным приставить получившегося медицинского сервитора к рабочему столу Ферренца".'
- guid: 2626bda6-be15-4672-8f91-8388686fd45a
  text: '{n}Вы делаете невыносимо тяжелый шаг навстречу. Затем еще. И еще. Весь ваш мир сжимается до единой цели — странного создания, вызывающего бурю в вашей душе. Бесконечно долго поднимая руку с оберегом, вы замечаете, что девушка вблизи выглядит более живой и настоящей.{/n}'
- guid: 26931ec1-4800-43c7-9dd5-2344bc3a13bc
  text: '{n}В глубине металлического корпуса что-то протяжно воет — словно {g|Encyclopedia:MachineSpirit}машинные духи{/g} {g|Encyclopedia:Cogitator}когитатора{/g} оплакивают некую безвозвратную потерю.{/n}'
- guid: 26da5519-295e-4da0-b28b-2bbdb814b703
  text: '{n}Отринув страх, защитники Кьявы Гамма принялись уничтожать пораженные инфодухами когитаторы, не делая разницы между схизматикалями и инфоангелами.{/n}'
- guid: 273f8ae3-84cf-4e71-aa8e-8984cb47e74a
  text: '"Если мне удастся превратить врагов в союзников... Это поможет Дому Орселлио залечить раны. В какой-то мере". {n}Кассия устало потирает нагрудник в месте, где находится Атлас.{/n} "Будь по вашему, Вольный Торговец. Я передам предводителю ренегатов приглашение. Но даже при положительном ответе лидер восстания ни за что не отправится в экспедицию лично. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и предатели едва ли станут рисковать".'
- guid: 2766c468-1de6-4beb-8306-d5ef14b43e24
  text: '{n}Что-то в лице Инцендии меняется, на нем написаны стыд и уязвимость. Прежде вы видели такую гримасу у нее лишь раз — когда речь зашла о ее презренной предшественнице, Аспис Чорда. Инцендия сжимается, будто чувствует, что вам ведома ее слабость.{/n}'
- guid: 27b3991d-bce6-414b-a602-c928f05131bc
  text: '{n}Толпа заходится мрачным гулом, но быстро стихает, завидев в руках блюстителей дубинки. Ропот моментально превращается в мольбы о милости.{/n}'
- guid: 2833832b-4ada-4f89-879b-14748b11c7ca
  text: '{n}Высокий Фактотум кланяется, вклиниваясь в разговор.{/n} "Я вынужден привлечь внимание к еще одной проблеме. Она не столь масштабная, как все ранее упомянутое, но, тем не менее, весьма существенная. Древнейший археотех, священный имплантационный трон, поврежденный во время бунта, находится под угрозой гибели. Я не смею более отнимать ваше драгоценное время, так что нижайше прошу при возможности спуститься в Сектор Бионика, где Мастер Двигателя поведает о трагедии".'
- guid: 28432349-dc56-459e-b9d2-bda563b0da13
  text: '{n}Маражай ухмыляется.{/n} "Дерзкие слова для раба арены. Я принимаю вызов. Только не бери поражение близко к сердцу".'
- guid: 2857456e-e946-4d2c-97fe-057e2f8dcb6e
  text: '"А ну отвечай, мразь, ты покушение на Лорд-капитана совершил?" {n}Хротко хватает рабочего за грудки. Куртка Гведона распахивается, обнажая неровные оккультные знаки, нарисованные на теле.{/n} "Что это тут у нас? Еретические знаки?! Ах ты погань культистская!"'
- guid: 28d30272-ebd1-4678-83eb-e15f1a07dc30
  text: '{n}Ксенос, склонив голову набок, с любопытством оглядывает Кассию:{/n}

    "Три ока могут многое прозреть:

    Ша''эиль тропы, закрома души,

    Но даже сотне взоров не сыскать

    Обломки судеб, на твоей изнанке!

    И ветхий вальс былого закружит

    Тебя в чертогах спутанного рока,

    Но не сейчас — для танца нужно двое,

    А твой партнер мной занят до поры".'
- guid: 2914743c-c438-4460-a780-693ecf09419e
  text: '{n}Эльдар неожиданно вздрагивает и указывает на странную игровую доску, которую вы забрали с собой.{/n} "Что это... Объяснись, мон-кай! Зачем, во имя всех богов, тебе понадобилось терзать {d|Encyclopedia:Ch3_Yrliet_HasFarseerItem}одну из моих сестер{/d}? О, ты слишком глуп{mf||а}, чтобы осознать, не так ли? В этом предмете заключена душа одной из провидец с Крудараха, и каждое твое прикосновение приносит неописуемую боль ее бессмертной душе".'
- guid: 294a3887-721e-4187-bec4-d7e6bd0b4942
  text: '{n}Гнев загорается в темных глазах Ардженты.{/n} "Ты даже не представляешь, как легко такая "предприимчивость" утягивает в объятья мрака! Берегись... Вольный Торговец. Начав с одобрения ереси твоей предшественницы, ты можешь повторить ее судьбу".'
- guid: 297b3535-b0a8-413e-bf50-b52fd639f082
  text: '{n}Фактотум принимается рассеянно вертеть в руке автоперо.{/n}"Дайте подумать... Действительно, странно. Я изучил историю династии достаточно подробно, чтобы помнить все крупные боестолкновения за последнее тысячелетие, и ни одно из них не происходило в столице".'
- guid: 29d678a2-1bd7-47f3-b9d5-3405ea5b417d
  text: '"Стал{mf||а} бы ты заключать сделку с червем? Или, скажем, своим питомцем?" {n}Друкари злобно хмыкает.{/n} "Я выдрессирую тебя так, что не посмеешь и думать о подобной дерзости вновь".'
- guid: 29e238c1-80a9-4ae3-be18-b896ad5be3bd
  text: '{n}Вы тут же узнаете человека, который прижат к утыканному иглами нутру аппарата многочисленными крючьями и путами. Восково-белый, словно лишенный крови, дознаватель Хейнрикс ван Калокс выглядит мертвым, однако пока еще жив — об этом говорит слабо вздымающаяся от дыхания грудь и шарящий вокруг взгляд полуоткрытых глаз. Голову мужчины охватывает широкий металлический обруч, из-под которого сочится кровь.{/n}'
- guid: 2a566b9d-7344-4cdd-b3f5-05077a5296f5
  text: '{n}Голос бога гремит праведным возмущением и ядом уязвленной гордыни.{/n} "Отринуть эту великую мощь? Отказаться от права проложить дорогу грядущему?! Подобный путь постыден для служителя Омниссии!"'
- guid: 2a59e487-8fbc-42da-acc4-072cdae7cedd
  text: '"Принял". {n}Меровец бросает быстрый взгляд на хронометр.{/n} "Очень вовремя".'
- guid: 2a59e6ea-933f-4501-bb2b-a0f90503e8da
  text: '{n}Старейшины нервно переглядываются. Бесстрастные маски более не скрывают их трепета.{/n}'
- guid: 2a942020-bcfa-4e6c-92a9-0c85a7b544d3
  text: '"Эвейн... Эвейн..." {n}— бормочет Абеляр под нос, поглаживая бороду.{/n} "Один из дальних младших отпрысков, да. Больше про него ничего не знаю — значит, не отличился ничем".'
- guid: 2aa655cb-8aea-4ef7-a5e8-3efb2cefcd4e
  text: '"Лорд-капитан?"{n}Голос Мастера вокса, обычно спокойный и сдержанный, предательски подрагивает, пробиваясь сквозь легкий шум статики.{/n} "Я видела сообщения о перестрелке в отсеке. Что произошло? Вам удалось навести порядок? И в каком состоянии Идира?"'
- guid: 2abfcc2d-848e-4a9b-bb47-c7f9efe89573
  text: '{n}Хейнрикс рывком встает и кидается к вам.{/n} "Нет, {name}, погоди! Не говори так! Я не имел в виду, что... я..."'
- guid: 2ac27706-63f4-4a19-9b5b-720c76343605
  text: '"Мы вышли на орбиту станции, Лорд-капитан. Ждем сигнала от Алтаря-Темплум-Каликсис-Экс-17". {n}Несколько секунд вокс-частота хранит тревожную тишину, которую вскоре нарушает дребезжащий голос.{/n}'
- guid: 2acc24ac-e31c-407b-a9e8-881268538562
  text: '{n}Пользуясь беспомощностью демонического орудия, вы тщательно оглядываете сложную конструкцию. Вскоре у вас начинают слезиться глаза: не только пласталевые бока машины, но и сковывающие ее цепи покрыты вязью рун, один вид которых вызывает приступ тошноты.{/n}'
- guid: 2b249c39-f0d2-4030-9c13-9f609a874f23
  text: '{n}Дознаватель бросает на вас еще один взгляд, после чего качает головой и поднимает руку.{/n}'
- guid: 2b391fea-8754-43ad-9d12-09a6d4b2927d
  text: '"Я сократила в проповедях менее значимые куски, посвященные святым, и уделила больше внимания объяснениям божественной природы Вашей Светлости, хозя{mf|ина|йки} {g|Encyclopedia:WarrantGlossary}Патента{/g}, распоряжающ{mf|егося|ейся} нашими судьбами". {n}Исповедница угодливо улыбается.{/n}'
- guid: 2bcaff56-fbad-4589-b304-414dd7423bb8
  text: '{n}Сверкнув визорами, зверь медленно разворачивается к выходу. Мгновение вы проводите на расстоянии метра от твари, способной перекусить человека пополам. Она шипит вам в лицо...{/n}'
- guid: 2bd23e3c-7e7e-4d46-9725-7413fda37a98
  text: '{n}Слегка убыстренная речь, дерганные движения вашего двойника и сладкая поволока в е{mf|го|е} глазах заставляют предположить, что кровь е{mf|го|е} кипит от эйфорических стимуляторов.{/n}'
- guid: 2be8e3c9-5110-4d29-9f71-2df9042bf078
  text: '"Вертикальная разметка местности регулярно обновляется моей продвинутой вестибулярной аугментикой. Согласно диагностике, обновление происходило..." — {n}Из вокс-динамика магоса вырывается удивленный выдох -{/n} "Пять сотен оборотов назад? Нет, это невозможно..."'
- guid: 2c3a364d-4e2f-47be-b701-a8fc17a52102
  text: '{n}{nc|Упрямо сжатая челюсть и горящий взгляд ярко-синих глаз придают Ювенне невероятное сходство с портретом Себериана в молодости.|Лицо Ювенны неподвижно, но поджатые губы и напряженно раздувающиеся ноздри говорят сами за себя.}{/n}'
- guid: 2c539e1a-15c6-487e-a798-6e1ddf546a21
  text: '{n}Группка зевак облепила импровизированную сцену, на которой расположился необычный дуэт. Парень в причудливых защитных очках, сдвинутых на лоб, и потрепанных кожаных перчатках наигрывает мелодию на самодельной флейте. Рядом на стопке ящиков расположилось занятное игровое поле, по которому резво перекатывает стеклянные шарики взъерошенная крыса.{/n}'
- guid: 2c5c10dd-327d-4c03-adb7-7f8223beb7d7
  text: '{n}Ксавьер до последнего момента не замечает атаки. Хлещущая изо рта кровь расплывается алыми пятнами на обшивке грандиозной машины и не менее грандиозных планах Лорд-инквизитора, которым уже не суждено сбыться. Жестко улыбнувшись, Калькасар произносит лишь:{/n} "Неужели я повернулся к вам спиной? Теряю хватку..."'
- guid: 2c63c3da-60bc-44c8-ace4-279a40d42adc
  text: '{n}Кости на доспехе преподобного сверкают золотом, как и полная крови чаша в его руке.{/n} "Благословенны шаги твои, Домин''{name}".'
- guid: 2d2e74b5-383b-4ffb-a610-d50e9ffe3f46
  text: '"Идем же". {n}Кибелла тихо шепчет.{/n} "Я услышала... и увидела все, что хотела".'
- guid: 2d4de243-ef43-481c-b367-f174edef8f4c
  text: '{n}У этого ласеракса такие же ржавые, не видавшие ухода импланты, но существо выглядит куда хуже своих сородичей. Тощая и ослабевшая, почти жалкая бестия при вашем приближении поднимает мутный взгляд. На двери вы замечаете табличку с корявой надписью "Жывотнае номер 4. Никармить!" На шкуре ласеракса выжжена та же цифра.{/n}'
- guid: 2d5e736b-9e34-40ba-80a6-fafbdb639a80
  text: '{n}За необременительной беседой о пустяках вы успеваете хорошо рассмотреть Наместника Владайма. Его лицо — сухое и сосредоточенное, жесты — краткие и твердые, а речь спокойная и негромкая — словно он привык, что его всегда внимательно слушают. Судя по его внимательному взгляду, он также изучал вас все это время.{/n}'
- guid: 2d64a171-4b5c-4ddf-85ac-76e3b3a84291
  text: '"Упокой {g|Encyclopedia:Emperor}Император{/g}..." {n}Абеляр осекается, несколько секунд смотрит на тело застывшим взглядом, а затем отворачивается.{/n}'
- guid: 2d667361-f2de-4ffc-af31-a0b66b299cdd
  text: '{n}Увы, попасть внутрь не вышло — вход в ксеноруины оказался оплетен корнями столь прочными, что их не взял даже мельта-заряд. Вы передаете губернатору Заркова приказ расчистить чащобы, преграждающие путь к месту, где сгинул ваш легендарный предок. Теперь вам остается только ждать.{/n}'
- guid: 2d711356-d7ad-493e-aead-0c384d6bc4aa
  text: '"Глейто..." {n}Соломон пытается не то дотянуться до кибермастифа, не то жестом отдать ему приказ, но пес лежит, не реагируя на происходящее.{/n}'
- guid: 2dd306f2-cc83-4e38-a976-fe019b343d2a
  text: '{n}На платформе, под прицелом излучателей неизвестного ксеноустройства, распята мощная фигура в темных доспехах. Несомненно, это один из {g|Encyclopedia:AdeptusAstartesGlossary}Астартес{/g}, и он еще жив. Странные оковы, состоящие из света, удерживают его по рукам и ногам.{/n}'
- guid: 2dd3816d-750a-4911-b308-05fadc368911
  text: '{n}Вокс оживает — к вам обращается кормчий Равор.{/n} "Тут вот что, Лорд-капитан... сразу, может, и не заметно, но тут вот в местном астероидном поле сидит пустотный корабль. Тихо так сидит, словно специально поглубже забрался. Ну и, в общем, не удивлен я — ему больше описание "разбитое корыто" подходит. Кто-то ой как хорошо его потрепал. Фиксируем критические повреждения корпуса и разгерметизацию нескольких отсеков. О, а теперь еще и входящая передача есть".'
- guid: 2df2b2bb-fda0-4042-8131-1d021318b1db
  text: '{n}Температура в капелле падает, каждый выдох обращается в облачко пара. Резонирующие голоса астропатов сливаются, вторя такту мелодии, звучащей в зале. Периодически от тронов младших астропатов доносятся приглушенные стоны.{/n}'
- guid: 2e6c6fff-96f5-4161-a54f-73e2da1aa4db
  text: '{n}Пространство вокруг ямы усеяно разбитыми кусками скалобетона. Сквозь безобразную дыру в потолке в помещение пробивается слабый ветерок, поднимая у ваших ног вихри каменной пыли.{/n}'
- guid: 2e90ac92-1c97-4a8c-858e-67be164c458d
  text: '{n}В фигуре рядом едва узнается прежний вивисектор — бледный, почти полностью завернутый в бинты и похожий на призрака, он покачивается, но усердно склоняет перед вами голову.{/n}'
- guid: 2eb8871a-00d5-4f3e-9330-0d72d0d2063a
  text: '{n}Сервитор снова переводит взгляд на вас, теперь уже не скрываясь. Лицо его странно подрагивает — будто мышцы, забывшие, что такое мимика, пытаются изобразить приветливость.{/n} "Мы — Номос. Мы использовали это вместилище, чтобы покидать корабль".'
- guid: 2f99cb7f-20bd-4447-87c6-356e0ac0f676
  text: '{n}Лорд-капитан уединяется в кабинете, дабы предаться размышлениям о грядущем. Спустя некоторое время его мысли прерывает неуверенный стук в дверь.{/n}'
- guid: 2fb79eea-b0f5-4e60-96d3-9f07b8131525
  text: '{n}Нарастающий гул из глубины машины сменяется звонким треском. Спустя секунды, звук обрывается, на экране загорается неподвижная числовая комбинация. Механический голос жреца звучит почти обеспокоенно.{/n} "Данные восстановлены, только... это всего одна фраза. "Литании Движущей Силы". Священный механизм не сумел восстановить иного".'
- guid: 2fc33aba-bc3d-4832-9d6d-60ccd8eca5c4
  text: '{n}Ведка замирает в почтительном поклоне, сложив аквилу на груди. Ее бойцы, однако, не сводят глаз с вашего предка, а их лазганы переведены в режим боеготовности.{/n}'
- guid: 3003d1c3-1ce6-471c-b666-06f32102ddfa
  text: '"Элантах?.." {n}Ирлиэт фокусирует взгляд и стискивает на груди камень душ.{/n} "Если бы ты только мог{mf||ла} услышать ее мольбы и проклятья. Мое сердце разбивается тысячей осколков при одном взгляде на эту измученную душу. Но ее слова... ее слова секут мой разум больнее и безжалостней, чем треххвостая плеть Темных истязает плоть жертвы".'
- guid: 300ecc1d-1662-455a-9c9f-469db662201b
  text: '{n}На лице Соломона возникает агрессивная гримаса.{/n} "И вообще, ты бы не хотел{mf||а} меня отсюда вытаскивать, если бы знал{mf||а} правду. Все, что было между нами — ложь. Я обманывал тебя по приказу. На самом деле ты мне даже не нравишься".'
- guid: 301850bd-d8e2-47fa-931a-ec3abfacc944
  text: '{n}Секретарь трясется от ужаса, оглядывая разгромленную приемную.{/n} "В-в-ваша Светлость!.. Что случилось? Где госпожа Вьятт?"'
- guid: 305397cf-64e6-4c3b-bc54-4f26a2758f5a
  text: '{n}Из-под трясущейся стойки на вас смотрят два блестящих окуляра.{/n} "В-вы что-то хотели, г-госпо{mf|дин|жа}?"'
- guid: 305f2065-2e50-4b9c-a692-3fa03d71cb8d
  text: '"Ты несешь за собой нечестивое наследие Теодоры, {name}, превосходя ее безбожность во сто крат. Жаль. Прощай, и молись Императору, что ты обретешь искупление раньше, чем мне придется подарить тебе Его Милость. Ибо еретикам..."{n} — Арджента делает паузу, прожигая вас пламенным взглядом, — {/n} "...нет пощады".'
- guid: 30791133-6724-4616-a786-d2f57dac74d4
  text: '{n}Хейнрикс встряхивает головой, словно отгоняя мучительную грезу.{/n} "Довольно. Я не услышу ничего, что хоть сколько-то меня обнадежит".'
- guid: 30c48e99-c696-46d1-b5c8-f613014683f7
  text: '"Я всегда знала, что этим и закончится наш путь, элантах. Знала... но все же надеялась на иной исход". {n}Ирлиэт кивает сухо, но горечь во взгляде выдает истинные мысли эльдарки.{/n} "Готовь оружие, мон-кай. Наша судьба решится здесь и сейчас".'
- guid: 30fc6b6f-f9c7-4c72-b2ad-6bdab81447fd
  text: '{n}Сладострастно изучая окровавленные фрагменты тел, Тервантьяс вырывает из собственной грудины какой-то орган, прибавляет его к трофеям и довольно шипит:{/n} "Я вижу интересную композицию. Необычный набор стартовых параметров, который можно укрепить оригинальной смесью эссенций. Это будет могучее чудовище... Я назову его Изыскатель страданий! Ты принес{mf||ла} пользу, образец, и за это будешь награжден{mf||а}".'
- guid: 3105c722-42df-411c-8a77-b3cae77cca7f
  text: '{n}Блюститель мрачнеет.{/n} "Значит, снова смутьян появился... Ваша Светлость, я виноват, что не разглядел среди черни новое семя мятежа. Посчитал, что это просто глупые потуги черни выплеснуть свое недовольство. Мне нет оправдания".'
- guid: 310e4c69-2510-4ef5-a972-6f37805dc7c0
  text: '{n}Сержант, нахмурившись, смотрит на вас.{/n} "Не знаю, чего вы за этих дармоедов заступаетесь. Мне они помогать никогда не стали бы. Но и смерти они не заслужили, ваша правда. Не все, по крайней мере".'
- guid: 312386d9-f3e9-4589-b4e6-def2a771b46f
  text: '{n}Священники смотрят на вас со сдержанным любопытством — и нервозностью.{/n}'
- guid: 31277368-342b-4bf2-96cb-f74b8410e47e
  text: '{n}Опустив глаза, Джай сухо произносит:{/n} "Да будет так. Я разберусь сама".'
- guid: 31c988b7-632b-408a-aacd-61982825a50d
  text: '{n}Иремерисс смеривает вас взглядом. Впервые она смотрит прямо вам в лицо — и в ее глазах лишь ледяная тьма.{/n} "Червь. Ничтожество. Как ты... посмел{mf||а}... снова появиться передо мной? Ты долж{mf|ен|на} был{mf||а} сдохнуть давным-давно. Что ж, значит, я сама избавлю зарвавш{mf|егося|уюся} мон-кай от {mf|его|ее} дыхания".'
- guid: 31ed273b-aa43-438c-a883-bb88663afc01
  text: '{n}В неверном свете факелов вы замечаете блеск стали. Один из разодетых в камзолы молодых людей прижал к ребрам второго лезвие. Под ногами нападающего лежит сброшенная маска. Заметив вас, дрожащая жертва вскрикивает:{/n} "Ваша Светлость! Спасите!"'
- guid: 31facb5c-eae4-4fea-83ee-d07e6e7a81a9
  text: '{n}Когда полковник наносит удар — вы атакуете на доли секунд раньше, вынуждая его переключиться на оборону.{/n}'
- guid: 322929df-0eec-49e2-8555-4fb7fd9afb79
  text: '"Если выживешь, не возвращайся сюда — ведьмы будут мстить, потому хозяин уже покинул Прорву и нашел новых покровителей. Поступи так же. Так сказал хозяин". {n}Монотонность и безошибочность, с которой монстр произносит речь Тервантьяса, напоминает манеру общения сервиторов.{/n}'
- guid: 3232f41d-8f21-4353-9637-7c7fe0d267a2
  text: '{n}Ответом на приказ стал гул множества воодушевленных голосов в вокс-канале. Передача завершилась, и подвластная вам армада истребителей, повинуясь приказам командующих, приняла боевое построение.{/n}'
- guid: 331c9df0-adab-4bbb-b1d1-877847f0ebaa
  text: '{n}Кассия чуть расслабляет плечи.{/n} "Благодарю за понимание, Вольный Торговец. А теперь позвольте откланяться — я начну подготовку к путешествию. Из того, что мне удалось узнать, нам сначала необходимо посетить систему..." {n}Рубиновые глаза расширяются от удивления.{/n} "...Провидение Орселлио. Надо же. Быть может, страницы истории лгут? И вовсе не Калейн Орселлио подарил ее звездам название? В любом случае, именно из этой системы Тисифона начала свой путь, и мы отправимся по ее давно забытым следам".'
- guid: 3330dfad-9b6c-42a5-a917-33993d828ca9
  text: '{n}В вашей {d|Encyclopedia:CharGen_Criminal}прошлой жизни{/d} способность определять, надежный ли перед вами человек или крыса, зачастую прокладывала границу между жизнью и смертью. Рядовой не искушен в искусстве лицедейства, и вы легко понимаете — парень не лапшит.{/n}'
- guid: 333e97b5-4960-44e0-9782-e978194de5de
  text: '"Послушание будет вознаграждено. Забери свою примитивную экипировку. Исходящая от нее технологическая банальность вызывает у меня отвращение, но столь неразвитому существу, как ты, она будет в самый раз". {n}Тервантьяс щелкает незримым суставом в руке.{/n} "Когда закончишь с этим, ступай и взгляни на тех, от чьего клинка ты, скорее всего, умрешь, когда тому придет время".'
- guid: 336af40a-1786-4b8c-9afe-d0ab4697be36
  text: '{n}Священник примирительно поднимает руки.{/n} "Грешны все, благородная Инцендия. К чему выделять кого-то и дознаваться его грехов, когда истиной чистоты не сыскать нигде".'
- guid: 33b07220-0ecd-4e74-9343-4619b1325198
  text: '{n}Несмотря на множество кровоточащих ран, статный {g|Encyclopedia:Aeldari}эльдар{/g} спокойно расправляет плечи и приподнимает тонкий подбородок, изучая вас проницательным взглядом. В изумрудных глазах ксеноса сияют отблески загадочных синих огней.{/n} "{g|Encyclopedia:MonKeigh}Мон-кай{/g} спас{mf||ла} мне жизнь? Вселенная полна жестоких сюрпризов".'
- guid: 341856a6-0992-444d-8bd8-7f53f78f8978
  text: '"Ваша Светлость, мои агенты докладывают о скором прибытии Кунрада Войгтвира и его прирученных ксеносов. У нас около часа, чтобы осмотреть станцию и устроить засаду... Если вы, конечно, не желаете встретиться с заговорщиками лицом к лицу". {n}Ахиллеас дрожащей рукой прикладывает золоченный респиратор к обожженным губам.{/n}'
- guid: 34490da7-efe9-4fa0-9f7b-6783318da37f
  text: '"Наставник... Почему я? Неужели высшую опасность для своей паствы ты видишь... во мне?" {n}Голос Кибеллы дрожит от боли.{/n}'
- guid: 347a5dd8-eba5-426f-8abc-c59db4119667
  text: '{n}Янрис бормочет под нос:{/n} "Новые времена настали в Просторе. Времена молодых Вольных Торговцев".'
- guid: 348287f7-2344-452c-b9a1-1c6345ae5f3c
  text: '{n}Маражай проходит между загадочных ксеносских аппаратов, прикладывает ладонь к одной из странных фигур, напоминающих тумбу — и та вдруг с шипением распечатывает одну из своих граней, словно шлюз. Друкари начинает изучать содержимое контейнера — в тишине слышно, как он что-то со стуком и звоном перекладывает. Тем временем ваш взор невольно привлекают загадочные устройства, которыми полнится зала.{/n}'
- guid: 34a8598a-51f2-4112-9c93-562e25e67cc0
  text: '{n}Странная сыпь, подхваченная в моровой яме грузовой магистрали, бледнеет и обращается сухой коркой. Благословение исцеления ложится на вас.{/n}'
- guid: 34aaff09-37d4-4ad7-95e8-10ef4ff228f7
  text: '{n}Вы знаете, кому принадлежит этот голос. Ахеллиасу Скаландру. Шпиону Инквизиции. Изменнику.{/n}'
- guid: 3502edab-4eb3-4f80-a829-ddd98e6ddc43
  text: '"Нет, примитивное создание". {n}Оружие некрона совершает резкий взмах, но не в вашу сторону. Оно нацеливается на гвардейцев.{/n} "Твое существование будет прекращено". {n}Навершие посоха вспыхивает, и каскад зеленоватых искр пробегает по телам плененных бойцов, подчиняя их волю жестокому разуму ксеноса.{/n}'
- guid: 35261c33-df5b-43c0-ae40-5837841e2b93
  text: '"Лорд-к-капитан, н-непредвиденные обстоятельства на офицерской палубе". {n}Голос Вигдис едва заметно дрожит.{/n} "Многочисленные жертвы, потеря связи... пустотники сообщают о варп-голосах, заполонивших отсеки... но это не варп-прорыв. Это... ваш ксенос, который поднялся на борт на Янусе. Он сошел с ума и устроил резню".'
- guid: 35417b03-2975-4621-926b-3f035e3be440
  text: '{n}Тощая бледная женщина особенно выделяется среди других членов экипажа. Из задней части черепа сплошной массой выходят связки кабелей, скрывающиеся под церемониальным одеянием, а вместо рта зияет решетка вокса, который едва слышно фонит. При виде вас женщина склоняет голову в приветственном поклоне:{/n} "Чем могу служить, Лорд-капитан?"'
- guid: 35a2d9a4-c9cb-47a4-8d7e-00604976600e
  text: '{n}Слуга содрогается и надрывно кашляет.{/n} "Я... не уверен, что протяну достаточно, чтобы ответить на все ваши вопросы..."'
- guid: 363fa9ea-e8b4-42b0-9f1f-d61bd4983629
  text: '{n}Слуги приступили к дознанию, стремясь выявить суть и назначение загадочной Процедуры. Они столкнулись с древними творениями инфокузнечного ремесла, немыслимыми в наше время, и преисполнились великого благоговения. Разгадать мудрость цифрового археотеха было им не под силу.{/n}'
- guid: 3686d134-64e9-43fc-9a9d-513621534ac8
  text: '{n}Джай скупо улыбается. Мрака в ее взгляде становится чуть меньше.{/n} "Ты умеешь смотреть сквозь маски, {name}. Это — да, это из меня не вытравить. Я — Джай Хейдари, и я люблю бунтовать против нормы в любом своем обличьи".'
- guid: 368d1d21-384a-4afa-805d-834a75235a31
  text: '{n}Несколько обезображенных трупов в форме солдат Инквизиции свалены в уродливую кучу между когитатором и массивной статуей, похожей на обелиск. Следов их убийц не видно, но вас не покидает гнетущее чувство, будто сами стены наблюдают за вами. Воздух, пронизанный электричеством и густым смрадом гниющей плоти, лишь усиливает это ощущение.{/n}'
- guid: 37398b43-9868-4a82-aa2a-91e4ee3b62d6
  text: '{n}Удивленный отсутствием реакции свиты Себериан поднимает руку в вопрошающем жесте.{/n} "Обычно советы льются из вас рекой, так почему же вы молчите, когда это действительно важно? Я ожидал, что вы решительно осудите саму мысль о переговорах. Однако в нынешних обстоятельствах приму и ваше красноречивое безмолвие."'
- guid: 377146b8-60b1-4009-8f7a-6329035a1c0e
  text: '{n}Маражай рывком поднимает голову: и без того худое лицо обтянуто сизо-белой пергаментной кожей, губы растянуты в судорожном оскале, а темные глаза превратились в два залитых чернотой зеркала, в которых, кажется, можно увидеть самого себя. Друкари открывает рот — однако вместо слов вы слышите неестественное сиплое шипение. Если в этом создании и был когда-то разум, сейчас от него не осталось ни единого следа.{/n}'
- guid: 37823151-31f5-428f-a1eb-258a8f207241
  text: '{n}Вайс улыбается с тенью снисходительности.{/n} "При всем уважении к вашим неоспоримым талантам, Лорд-капитан, мне нужен псайкер, способный работать с конкретным направлением псайканы — телепатией".'
- guid: 38006b33-71b6-4c12-afac-86514a78fe06
  text: '{n}Высокая женщина средних лет смотрит прямо перед собой с отсутствующим видом, потирая {g|Encyclopedia:Augmentation}имплант{/g} на виске. Ее воротник расстегнут, а одна застежка вот-вот отвалится. Почувствовав ваше присутствие, Идира поворачивает к вам голову и растягивает рот в кривой улыбке, однако ее взгляд устремлен сквозь вас.{/n}'
- guid: 381e4b39-9c70-4b90-ad3d-17bacf351213
  text: '"Нет, я... не сбегу. Обещаю". {n}Кассия больше не дрожит — напротив, прижимается к вашей груди, положив голову вам на плечо. Вы чувствуете биение ее сердца — мерное, сладостное, уже спокойное.{/n} "Ах, {name}..."'
- guid: 3874b645-e464-4d7c-8e85-2537b5847426
  text: '{n}Перед вами — Теодора фон Валанциус, и ее облик чудовищен: в груди зияет дыра, из-под кожи торчат ржавые крючья, а горло пересекает бугрящийся воспаленный шрам. Сама фигура мерцает, словно пропадая из этой реальности и снова в ней появляясь. Взглянув на вас белесыми глазами мертвеца, женщина ядовито улыбается.{/n} "{g|Encyclopedia:RogueTrader}Вольный Торговец{/g}! Какая встреча! Я уже устала ждать, когда ты прибудешь с визитом". {n}"Теодора" смеривает вас взглядом, издевательский тон сменяется брезгливым.{/n} "Надо же, века беззаветного труда и стараний, и все, что я оставила после себя, перешло такому ничтожеству".'
- guid: 389e8965-d7a4-4f5a-b19b-ba5aaa42b914
  text: '{n}Загадочное существо, так долго бывшее душой вашего корабля, оборачивается к вам.{/n} "Но это ты, {name}, по-настоящему привел{mf||а} нас в этот мир. Так давай встретим нашего чудовищного предтечу вместе. Ибо он готов вырваться".'
- guid: 38d3749d-ef05-4358-866e-1d4feaaac655
  text: '{n}Триасомата замирает, позволяя вам провести осмотр. Вы обрабатываете раны и места стыка имплантов с плотью антисептическими мазями и точечно применяете стимуляторы, чтобы облегчить болевой синдром. Лихорадочное дыхание мужчины выравнивается.{/n}'
- guid: 39a1737d-695a-42ff-904e-133d53c5e6ae
  text: '{n}Ульфар переводит одобрительный взгляд с вашего двойника на вас, а затем тихо бурчит в бороду:{/n} "Ну нет! Он{mf||а} все-таки твой эттфатер. Сменить сторону было бы... Ну нет!"'
- guid: 3a230497-8431-4161-9f10-01e619db963f
  text: '{n}Абеляр хмурится.{/n} "Насколько мне известно, в прошлом род Гапрак получал в дар от Алого Братства подобных сервиторов, но сам я впервые вижу их".'
- guid: 3a939ab5-b20c-4555-8124-89215246facb
  text: '{n}Чистоголосый пророк собрал свою паству и, погрузив Горнило на предоставленный ему пустотный корабль, отправился проповедовать на далекие миры. Духовная власть Ордена Молота, потерпела ущерб, а потеря Горнила вызвала немалые народные волнения. Перед отбытием в знак признательности проповедник направил Лорд-капитану дар — реликвию, которая по его словам, некогда принадлежала его прошлому воплощению.{/n}'
- guid: 3accbdf9-4081-4a59-984c-943bc1cf4afe
  text: '"Сегодня вы совершили подвиг во имя Империума. И, как и о большинстве подвигов, совершаемых людьми моей профессии, о нем никому нельзя знать. Поздравляю и сочувствую". {n}Ксавьер устало вздыхает и дарит вам прямой и открытый взгляд, а затем достает из поясной сумки... фляжку.{/n} "Вольный Торговец разделит с Лорд-инквизитором глоток-другой амасека в честь победы?"'
- guid: 3be64751-3b37-482e-bd82-ba9313c7b348
  text: '{n}В глазах Леди-Навигатора проскальзывает робкое сомнение, но она лишь коротко кивает.{/n} "Я... не ненавижу вас, Лорд-капитан. Мы еще можем стать хорошими приятелями. Даже друзьями. Но пока... давайте немного передохнем друг от друга".'
- guid: 3c0695d7-3085-4543-ad56-892ea12d05aa
  text: '{n}Кибелла поднимает голову и вглядывается в темные глазницы Неумирающего Императора.{/n} "Мы не отступимся от Завета. {d|Encyclopedia:CompKibellah_Humility}Не забудем жертв{/d} наших предшественников и наставлений Висирей. Жизнь наша — во служении Неумирающему. Ибо Он и есть долг. Ибо Он и есть смерть".'
- guid: 3c3b01c9-9d13-45e9-a024-ca7ff13045fd
  text: '{n}В логове царит атмосфера неискреннего предвкушения праздника. Лица у всех кислые, улыбки — натянутые, и даже бутылки с выпивкой, виднеющиеся тут и там, блестят как-то особенно фальшиво. Один из обитателей логова, человек с перекошенным шрамами лицом, с нескрываемым скепсисом сверлит Джай взглядом.{/n}'
- guid: 3c46c050-a521-48b4-9b1b-c1101b549d48
  text: '{n}Окинув вас задумчивым взглядом, Ризза осторожно отвечает:{/n} "Речь ведь идет о вещах более значительных, чем партия лазвинтовок или трюм обскуры? В данный момент мне нечего вам предложить, но я запомню, что вы интересовались, и сообщу об этом своим партнерам".'
- guid: 3c49a3d3-8667-491b-8ce6-1e5a1bb7f1f6
  text: '{n}Судя по следам на теле и трупному окоченению, мужчина умер совсем недавно. На его руках, ногах и груди виднеются свежие отметины — узкие и глубокие. Некоторые нанесены посмертно.{/n}'
- guid: 3d78567a-4107-4b36-a2a5-05d7275b555c
  text: '"{name}". {n}Маражай медленно подходит к столу и облокачивается о него обеими руками.{/n} "Я размышлял о том, что когда-то пообещал тебе. По поводу удовлетворения твоего любопытства".'
- guid: 3da749e7-6951-444d-aff8-1fb18ff4619c
  text: '{n}Cлуга испуганно вздрагивает, пожимает плечами, несколько раз старательно откланивается и спешит покинуть кабинет.{/n}'
- guid: 3dd3177d-1884-4e39-8787-549fae1a545c
  text: '{n}Инфернус-мастер небрежно прикуривает от терморезака и широко разводит руки в приветственном жесте.{/n} "Энрих Монтэг к вашим услугам". {n}От него пахнет гарью и {g|Encyclopedia:Lho}лхо{/g}, на лице — следы копоти, а пояс увешан множеством тяжелых инструментов. Вы бы приняли его за рабочего, если бы в потрепанной и покрытой сажей одежде не угадывалась офицерская форма.{/n}'
- guid: 3dde7edd-8dc8-4bcf-bc75-c1596d583405
  text: '{n}Ирлиэт одаривает вас долгим изучающим взглядом.{/n} "Постой, элантах. Прежде, чем ты покинешь эти леса навсегда... Забери меня с собой. К звездам. История детей Азуриана на Лилэтан подходит к концу, но где-то там, среди холодных звезд космоса, что твой вид называет Простором, есть и другие. Лишенные дома. Потерянные. Страждущие..." {n}Эльдарка прикрывает глаза, и скорбь искажает ее тонкие черты.{/n}'
- guid: 3e0ee277-0396-4681-ad07-e0f93a779766
  text: '{n}На телах техножриц нет следов насильственной смерти, но фарфорово-белая кожа не оставляет сомнений, что они мертвы. Руки их плотно сцеплены, даже смерть не смогла разорвать их.{/n}'
- guid: 3e2a91ed-8111-4680-974b-ecb3c06e7f03
  text: '{n}Девушка глуха к вашим словам — слезы льются по ее бледным щекам и губам, а хрупкое тело то и дело пробивает мелкая дрожь — однако вы все еще скованы ее странными чарами — и тело почти вас не слушается.{/n}'
- guid: 3e6deb91-4073-4acb-b0e6-9936e055e4c9
  text: '"Мои братья". {n}Ульфар склоняется над телами, закованными в керамит и адамантиум. Рыжие брови страдальчески изломились.{/n} "Вновь судьба не дала мне отправиться в чертог Всеотца с моими братьями".'
- guid: 3ee7f158-79dd-4e96-94cb-5c795de1c371
  text: '{n}Грязные клетки, к которым тянутся многочисленные провода и трубки, заполнены чем-то, напоминающим нагромождение человеческих тел. Вы не можете различить, кто находится внутри, но замечаете, что в темноте изредка вспыхивают голубые искры, а сама масса вздрагивает и подергивается.{/n}'
- guid: 3ef56d33-a6f2-43dc-a3a8-099f4d95982c
  text: '{n}Ирлиэт не сопротивляется — лишь издает тихий всхлип. Смерть заволакивает ее остекленевшие глаза, а по бледной щеке скатывается единственная слеза.{/n}'
- guid: 3f1a0230-b701-47f2-9ff1-642fe4a84d70
  text: '{n}Калькасар, лихорадочно дергающий рычаги на операционном алтаре Ярма, рычит:{/n} "План был другой, {name}! Остановись!" {n}Инквизитор пытается потянуться к оружию, но управление сложной машиной не дает его рукам ни одного свободного мгновения.{/n} "Этому не бывать!"'
- guid: 3f7e39f9-2d26-4084-b127-66bb3c15b2cd
  text: '{n}Господа и дамы в дорогих одеяниях цвета дома Гапрак стоят полукругом вокруг Торианы и ее сына Вицента. Тела и лица почти каждого члена этой семьи покрыты крупными изукрашенными аугментами.{/n}'
- guid: 3f9de6d1-615d-46dc-837f-79254cc6bb53
  text: '{n}Пожилой техношаман поднимает на вас мутный взгляд. От него сильно пахнет машинным выхлопом.{/n} "Вы пришли, чтобы говорить с великим Префом, призраки? Преф не снизойдет до вашей речи. Но я помогу, переведу".'
- guid: 3fbb87d6-ca86-4b9a-81f6-38138b1360ba
  text: '{n}Кибелла вздрагивает, бледнеет еще сильнее... А затем зрачки ее расширяются, и с болезненным хрипом она хватается за грудь, валится наземь, словно сломанная кукла.{/n}'
- guid: 3ff46798-5e4e-4f5f-9b15-165682dc918d
  text: '{n}Эоганн басовито и недобро смеется.{/n} "Мнящий себя великим мыслителем перешел с интенсивных методов на экстенсивные, но тем самым лишь умножил свою некомпетентность. Истинная ирония судьбы".'
- guid: 403b3a9c-b1da-48fa-8b3b-dbfbb71d5149
  text: '{n}Толпа культистов окружила распятого на механизме {g|Encyclopedia:TechPriest}техножреца{/g}. Ритмичный шепот, повторяемый сотней голосов, сливается в некое богохульное заклинание. Мощные разряды Движущей силы, пробегающие по машине, сотрясают тело несчастного пленника в жестоких конвульсиях и рождают в его устах горестные болезненные вскрики.{/n}'
- guid: 405dcd02-b941-449b-b681-c4ba118e8220
  text: '{n}Эльдарское устройство подрагивает, и гололит-проекция мира с несколькими отмеченными координатами возникает в его руке.{/n} "Я поделюсь собранной информацией, ибо надеюсь, что даже мастер плоти не сможет ускользнуть сразу от двух преследователей".'
- guid: 405e7368-5e87-4376-a8b9-a894a40f92c8
  text: '"О да". {n}Старица почтительно кивает.{/n} "Сменилось множество сезонов с тех пор, как эта правительница получила благословение Бога-орла и встала во главе сего племени. Лишь приближенным к богам дозволено носить на себе их клейма, и эта правительница — одна из них".'
- guid: 406ee4b2-1d53-4113-9c6a-f5ec51810e6f
  text: '{n}Взгляд старицы мрачнеет.{/n} "Кетца Темер разгневан вторжением духов-из-тьмы, обрушивших на мир дождь из огня и металла. Он требует крови — и кровь насытит землю! По какой бы тропе ни ступили боги, пришедшие все исправить".'
- guid: 408c1cf3-ce38-4f9f-ab92-1b0d812de0c2
  text: '"О дне, когда Лорд-капитан забрел{mf||а} в наши трущобы, сложат легенды". {n}Широкий в плечах мужчина приветственно поднимает ладонь.{/n}'
- guid: 40a7ed30-f6da-467a-9c7a-35ebb653a62a
  text: '{n}Кибелла зловеще улыбается.{/n} "Ты плохо знаешь Домин? В притоне тщетной телесной радости он{mf||а} отыщет достойного врага с той же легкостью, что и на поле брани".'
- guid: 40cfc52c-0f46-4ce6-930a-bca294c53cbf
  text: '{n}Соломон медленно поднимает руку. Лицо искажено мукой — может, раны, а может, слова, что он силится произнести, причиняют ему боль.{/n} "Глейто, протокол Мортем-80. Охранять цель". {n}Дрожащий палец указывает на вас.{/n}'
- guid: 40df9e8e-4c9e-47bc-adad-90cc17a23e8f
  text: '{n}В горле монстра клокочет.{/n} "Я — эксперимент. Тервантьяс решил, что это будет интересно — вшить части мон-кай в одну из развалин".'
- guid: 40fbe637-abed-4144-8a4c-e1d27077cdc7
  text: '{n}Неестественно ровная стена, испещренная странными символами, привлекла их внимание. Туннель уходил глубоко вниз и не значился на картах горных разработок. Руководство колонией повелело провести архивные изыскания, запретить работы в этом секторе и выставило охрану до установления его происхождения.{/n}'
- guid: 410ea3bc-cfe7-4149-87a4-0431c685b2d6
  text: '"А ты забавнее, чем я думал!" {n}Что-то тяжелое бьет вас по лицу, и вы слышите хруст собственных костей.{/n} "Не торопись, у нас впереди еще много времени, чтобы насладиться друг другом".'
- guid: 412dcdf3-c053-4c38-a1f0-c1c48db4f7cd
  text: '{n}Дрожащая фигура, укутанная в несколько слоев потрепанной одежды, направляет на вас старое лазружье:{/n} "К-кто вы? Именем Бога-Императора, н-не приближайтесь!"'
- guid: 4162700f-fdfa-4c2e-96d1-4eaa99988481
  text: '{n}Дознаватель сжимает губы в тонкую нить.{/n} "Не вполне".'
- guid: 41e892a5-6a33-4e17-ad09-8044f12d8387
  text: '{n}Темные глаза сестры {g|Encyclopedia:AdeptaSororitas}Сороритас{/g} вспыхивают.{/n} "Мы должны спасти всех, кого сможем! Все это — не просто так. Святая Арджента, чье имя я ношу с благоговением и трепетом, известна тем, что силой молитвы спасла людей из гибнущего мира. Сам Император ниспослал с небес звезду, что вознесла святую и ее последователей ввысь, прочь от скверны и смерти. Нам надлежит поступить так же — направить все силы на спасение тех, кто сейчас глядит на небо с надеждой!"'
- guid: 428aafb6-99ea-464d-9de7-f31a8ea62e14
  text: '{n}Старейшины учтиво кланяются.{/n}'
- guid: 4296676b-29ba-433b-b37a-bba9f75756ef
  text: '{n}Фактотум медлит, будто бы сомневаясь в том, что его слова достойны вашего внимания.{/n} "И еще кое-что, Лорд-капитан. Корабельные астропаты уловили эхо тревожных сообщений — в нескольких системах Простора были замечены неопознанные корабли, покинутые командой. Возможно, это всего лишь слухи, но те, кто повстречался с ними, бесследно пропали... На этом все, Ваша Светлость".'
- guid: 42d00511-b13e-4913-86d3-124c1bd721b7
  text: '{n}Существо перед вами, похоже, слишком примитивно, чтобы осознать угрозу — оно не делает попыток увернуться и подыхает после первого же точного удара.{/n}'
- guid: 42e04a9a-1684-4949-962c-52dda253452e
  text: '{n}Все они в хорошей форме, что не удивительно. Молодые и седые, мужчины и женщины — каждый из них словно бы сошел с пропагандистских плакатов Астра Милитарум.{/n}'
- guid: 42e7bf11-f346-4fc0-a2c3-4ab46972c362
  text: '{n}Привычные для медотсека звуки перекрывает пробирающий до костей крик. Кричит полураздетый старик, соскочивший с больничной койки: на его руках висят обрывки фиксирующих ремней, а кровать теперь служит баррикадой, за которой он прячется от медикариев. До линии пояса ноги старика заменены высококачественными {g|Encyclopedia:AugmentationGlossary}аугментами{/g}.{/n}'
- guid: 42fa93ed-3d8a-44d4-8b09-90321259f4f2
  text: '{n}Когда силы Кассии отступают, строгость на ее лице впервые сменяется чувственной страстностью — в ее глазах, изгибе губ, легком наклоне головы. Девушка, кротко кивая, с улыбкой на порозовевших губах, протягивает вам ладонь, бледную и трепещущую.{/n}'
- guid: 43222580-2dc5-4d8c-b8ac-7a3018bc8ad9
  text: '"Раз уж между нами возникло нечто вроде доверия — или, если уж называть вещи своими именами, взаимной необходимости..." {n}Лария снимает с пальца перстень-печатку с гербом фон Валанциусов и протягивает его вам.{/n} "Полагаю, вы знаете цену подобной вещи. Отныне можете говорить от моего имени. Будьте любезны, не запятнайте его".'
- guid: 432929d4-9b85-4f36-a479-7f82e0217b5d
  text: '{n}При виде Хейнрикса губернатор Медина расплывается в несколько натянутой улыбке.{/n} "Господин ван Калокс, рад видеть вас в здравии. Надеюсь, вы, э, достигли намеченных вами целей в Электродинамической обители".'
- guid: 43339220-3086-4e54-a21f-1d58fdd35201
  text: '{n}Сложив руки в аквилу, двойник произносит:{/n} "Я — ослепительный пример Человечества, несломленн{mf|ый|ая} невзгодами, отважно ступающ{mf|ий|ая} перв{mf|ым|ой} во тьме, объединяющ{mf|ий|ая} и возвращающ{mf|ий|ая} то, что было утрачено. Я — Вольный Торговец Императора".'
- guid: 436b5cea-62f2-4789-aaff-75d5f639ff8f
  text: '{n}Собрав дань псайкеров с протектората и сковав их цепями, зарковцы начали выманивать Погонщиц из своих логовищ и планомерно истреблять чудищ одно за другим. Многие группы сгинули из-за псайкеров, которые не смогли обуздать свои силы, прорвав вуаль в Имматериум, но вскоре популяция тварей значительно сократилась.{/n}'
- guid: 4372d499-2503-4fb1-8e1b-51cfb6cefdf2
  text: '{n}Исполнение малопонятной Процедуры 0-Х было запрещено. Искореняя ее директивы и извлекая магосов из камер, слуги Вольного Торговца столкнулись с сопротивлением, не обошлось без жертв.{/n}'
- guid: 43879ff1-4847-45bb-9292-f0a10602c980
  text: '"Тщательная декомпозиция ситуации будут способствовать удовлетворительному завершению конфронтации". {n}Техножрец издает негромкую бинарную трель.{/n} "Мои расчетные мощности {d|Encyclopedia:Ch4_DL_Exalt117Traitor}будут перенаправлены{/d} на вычисление оптимальной оборонительной тактики".'
- guid: 440ad55b-43c6-4ff0-a70e-b2b9d855560f
  text: '{n}Паскаль запрокидывает голову, и мощь, переполнявшая его голос, выплескивается вовне. Голос техножреца гремит на весь корабль, подхваченный каждым вокс-динамиком каждой палубы.{/n} "Однажды я нарушил заветы Омниссии. Преступил границы, проложенные для познания. Я содеял грех. Все мы содеяли".'
- guid: 444081c9-b050-46a6-a147-34ff28a8dd68
  text: '{n}Я чувствую... касание воли Его? Неумирающий Император желает ниспослать мне откровение в сей час испытания — пусть Таро укажет мне путь.{/n}'
- guid: 448650d8-d78f-4706-af69-6745647cbe2d
  text: '{n}Мои слова пугают их. Ранят, потому что они справедливы. И оттого их гнев вспенивается еще сильнее.{/n}'
- guid: 448a1b3c-1cf2-4c0a-aa13-36b6cd835c7d
  text: '"Вот, держите". {n}Секретарь бережно протягивает проштампованную грамоту.{/n} "И да благословит ваш путь Император!"'
- guid: 44fa7c7d-e507-45aa-bfe8-9c70b785a2a3
  text: '{n}На мостике царят беготня и хаос — офицеры отчаянно стучат пальцами по рунам когитаторов, операторы раздают команды в шипящие вокс-установки, блюстители проверяют оружие. В этом беспорядке удивительно обычно выглядит лишь Главный кормчий — лицо вечно хмурого Равора не способно вместить еще больше сумрачного недовольства.{/n} "Ваша Светлость, я рад, что вы добрались сюда цел{mf|ым|ой} и невредим{mf|ым|ой}".'
- guid: 4517abc3-defc-4b25-8100-86a493a88898
  text: '{n}Вы заставляете машину работать в обход ее собственных запретов и ограничений. Возможно, странное вмешательство и нарушения в логике в будущем сведут машинного духа когитатора с ума, но сейчас терминал полностью покорен вам.{/n}'
- guid: 45ba710c-0d14-4fd1-b5f3-30d33b644c15
  text: '{n}Плоть преподобного бледна и испещрена мистическими символами, но голос полон энергии.{/n} "Славься, Великий Светоч!"'
- guid: 45c6d96c-d4a6-4e4a-ae55-74218a5de451
  text: '{n}Я беззвучно шепчу молитву, пропитанная благодатным стимулятором облатка отправляется под язык. Туман просветления скрывает облик Домин от меня.{/n}'
- guid: 45e43a65-f962-4f17-a742-d45afdbc92ba
  text: '{n}Ведка лишь плотнее сжимает губы.{/n} "Ваша Светлость, я не могу. Я согрешу против Бога-Императора, если не защищу вас в бою!"'
- guid: 45e9cfe6-e545-456d-88ec-1ff89789be83
  text: '"Неубедительно". {n}Наследница равнодушно смотрит на вас.{/n} "Твое предложение мне неинтересно".'
- guid: 4609c6cb-38be-4f80-ab49-9b5fef2cd9de
  text: '{n}Понеся великие потери от энергий варпа, что Ноль-Халиф обрушил на них в своем гневе, решительным штурмом отряды слуг Омниссии захватили инфостанок.{/n}'
- guid: 461f5327-e215-4ff3-871d-c99b095a62bb
  text: '"Хм-м-м". {n}Одрябшая кожа регента сотрясается от глубокого вздоха.{/n} "С нашей стороны было бы крайне непочтительно отказываться от помощи Вольного Торговца. Мы, Ааронто Орселлио, принимаем ваше предложение. C вашего позволения, обсудим детали позже".'
- guid: 463a37c5-b0ae-49fe-9ab2-62231fe2c23e
  text: '{n}Немного подумав, Кассия стискивает в руке медальон. Энергия камня резонирует с ее силами, и ледяной камень докрасна раскаляется в когтистой ладони девушки, пока с хрустом не рассыпается на осколки. Прикрыв рану, Кассия тихо, но уверенно произносит:{/n} "Теперь Дом Орселлио сможет довериться мне. Я... смогу довериться себе. Таково мое решение".'
- guid: 465da3a2-1fe4-4cff-a099-8bcaa074b094
  text: '{n}Менее сведущий человек на вашем месте мог бы не опознать этого огромного гуманоида, но вы понимаете, что перед вами космический десантник, Ангел Императора. {/n}'
- guid: 46b15e28-4399-4cc5-9b97-8ecb2aa234a4
  text: '{n}Но кибермастиф не реагирует. Алые угольки визоров смотрят на Соломона, и ни одна мышца под темной шкурой не дрогает в ответ на приказ покинуть хозяина.{/n}'
- guid: 46c90efc-53eb-4cf1-988e-9939cb0a9464
  text: '{n}Абеляр сводит брови.{/n} "Оставаясь близ гибнущего мира, мы подвергаем себя риску. А ваша жизнь, Лорд-капитан, много ценнее всего Райкада Минорис. Династия фон Валанциус погибнуть не должна! Потому, как ни прискорбно, мы должны оставить идею эвакуации".'
- guid: 46cdbde6-58c7-41c7-a5cc-52eb2a2d5de3
  text: '{n}В назначенный час ульи Даргонуса содрогнулись от поступи военной техники. Воинство блюстителей шло войной на мутантов-еретиков. Выродки, хоть и имели возможность приготовиться к обороне, не могли сравниться с планетарной стражей в тяжести вооружения.{/n}'
- guid: 46d4052b-ec93-41da-8eb7-cb0969193d2e
  text: '{n}Псайкер в ужасе и недоумении переводит взгляд с устройства то на вас, то на мертвого эльдара.{/n} "Этот ксенос... Ты видел{mf||а} его глаза перед тем, как он напал на нас, {name}? В них словно все потухло. И все из-за этой штуки? Я не хочу умирать, но... Но я не хочу жить так же. Если я перестану быть собой, то какой смысл во всем этом?"'
- guid: 47097313-ea17-4ed9-987f-e4f720c2450d
  text: '{n}Холодный голос, исполненный обещания смерти, цедит:{/n} "Убогий глупец, всю секретность просрал. Ребята, придется пошуметь". {n}Простолюдинка с невзрачным, будто стертым лицом наводит на вас невесть откуда взявшееся у нее оружие.{/n} "Свидетелей не оставлять!"'
- guid: 473e38cf-7222-4758-9e7a-13456ab63cfc
  text: '{n}Волк издает леденящий душу вой, и стая его синхронно вскидывает оружие, прочитав в этих устрашающих звуках ясный приказ — убивать.{/n}'
- guid: 47407b76-19fc-41b9-883d-7173cb7e7d66
  text: '{n}Преподобный Адальберт, пухлый и розовощекий старик, неспешно зажигает свечи. Блики огня пляшут на тяжелой золотой аквиле и в небесно-голубых глазах преподобного, когда он с улыбкой обращается к вам:{/n} "{g|Encyclopedia:EmperorGlossary}Император{/g} защищает, Ваша Светлость. Пришли за молитвою, или дела насущные привели вас ко мне?" {n}Его голос обладает необыкновенной глубиной и завораживающим тембром.{/n}'
- guid: 47989d6a-6c3b-4cff-bec3-0adee0533148
  text: '{n}Иокаста жестом отдает приказ и первой вскидывает оружие.{/n} "Будет исполнено, Лорд-капитан!"'
- guid: 47a764c7-b924-4a17-897e-e25f1d6474de
  text: '{n}Заметив ваш взгляд, Мейв поворачивается к вам.{/n} "Звездн{mf|ый|ая} Госпо{mf|дин|жа}..." {n}Девушка колеблется, прежде чем продолжить.{/n} "Говорят, вы помазанни{mf|к|ца} {g|Encyclopedia:EmperorGlossary}Бога-Императора{/g}. А вы... правда его видели?"'
- guid: 47ac8bec-845f-46a6-97b9-fada66ea4b91
  text: '"Люди горят! Горят люди! Ой, туши, туши скорее!" {n}— голоса доносятся до вас сквозь залепившие глаза мутные потоки чего-то густого и скверно пахнущего, что выплеснули вам на голову добровольные спасатели.{/n}'
- guid: 47b98c79-aed9-4190-b7f5-3270f2a95855
  text: '{n}Предводитель команды разоренного корабля вытирает пот со лба характерным для {g|Encyclopedia:Navigator}навигаторов{/g} жестом — не всей ладонью, а двумя пальцами слева направо и обратно, так чтоб не задеть нечаянно третий глаз. Это движение — единственный знак усталости, который он позволяет себе. Его осанка безупречна, плечи развернуты, глаза смотрят прямо — будто он не вышел только что из тяжелого боя, а встречает вас на мостике корабля в обычных обстоятельствах. {/n}'
- guid: 47fe9af9-f73c-4142-ad45-846eb7b5d414
  text: '{n}Эльдар достает неизвестное ксеноустройство.{/n} "Провидцы не смогли узреть, где сокрыто логово мастера плоти, ибо неизвестная сила скрывает его от взора мудрейших. С подобным... Дети Азуриана прежде не сталкивались. Несколько раз обернувшись вокруг оси мира и потерпев очередную неудачу в поисках, мы решились обрушить на планету скопившуюся ярость — в надежде, что счастливый случай поможет нам".'
- guid: 481847a7-45c5-4709-81b7-63fd7866ff19
  text: '{n}Лицо Янура кривится в презрительном оскале:{/n}{br}

    "Комиссарские речи, Ваша Светлость. Но как знаете. Плакать по вам я не буду. И никто из нас не будет".'
- guid: 48f4ffda-7037-4af0-ad7a-9b209c0aa3d0
  text: '{n}Глаза Идиры застилает вечная тьма. В ней нет сожалений, нет сомнений. Нет в них и самой Идиры Тласс.{/n}'
- guid: 492c0608-d734-4614-81a3-303d5df73998
  text: '{n}Камердинер Леди-Навигатора приветствует вас глубоким поклоном и скромно протягивает изящный конверт — вас приглашают на приватную беседу.{/n}'
- guid: 49b71aa1-16da-47d5-9c52-f5e1b496a92d
  text: '{n}Диск планеты окутан полупрозрачной дымкой атмосферы. Ее льдистая поверхность сияет и переливается в лучах звезды словно огромный бриллиант с тысячами граней.{/n}'
- guid: 49daa1b6-d87d-47e6-b063-3d784df18b41
  text: '{n}Ужасная вонь доносится до вас задолго до того, как становится виден ее источник — коридор, куда пробитые трубы извергают потоки мутной жижи. На отдалении виднеется рычаг, открывающий двери наружу. Подойти к нему можно, только окунувшись в жижу.{/n}'
- guid: 49ed930c-295f-4cef-9a1b-1770eb0c87e8
  text: '{n}Кажется, болезнь, подхваченная в моровой яме грузовой магистрали, прогрессирует: кожа чешется еще больше и местами начинает темнеть.{/n}'
- guid: 4aeb283c-a627-4246-a938-f10e0cd73532
  text: '"Великолепно, Лорд-капитан!" {n}Мужчина поднимает взгляд, и вам становится заметен позолоченный ушной имплант, заменивший {d|Encyclopedia:Ch4_VivisectorWounded}отстреленное ухо{/d}.{/n}'
- guid: 4b7aa511-241c-431e-a074-43fe2536b7bc
  text: '{n}Странное шевеление под ладонью отвлекает вас от вскрика спутницы. Как только вы передвигаете ониксовую фигуру {g|Encyclopedia:Drukhari}друкари{/g} ближе к вражеской, яростный крик врывается в ваше сознание потоком чужих чувств. Друкари проскальзывает меж ваших пальцев и жестоко отсекает стоящему напротив Азуриани руки и ноги, а стоящая позади женская фигура Азуриани тут же стреляет в ответ из своего оружия. Разряд обжигающей боли проходит сквозь ваше тело, когда поверженная фигура друкари расползается по полю бесформенной массой.{/n}'
- guid: 4bacb9c2-ee96-420f-9157-2f3c10083268
  text: '"Два... Три... Пять... Слава Великому, эти ашмаги не успели ничего растащить!" {n}Джай внимательно осматривает контейнеры с маркировкой неизвестного вам перевозчика, а затем расплывается в улыбке и прикасается к комм-бусине в ухе.{/n} "Дайте мне две минуты, шерин — я передам координаты своим верным, которые доставят мою собственность в безопасное место".'
- guid: 4baf733d-c877-4a6b-b4f3-6764f55ea6f6
  text: '{n}Растрепанный мужчина лет сорока сплевывает кровавую слюну и морщится, оправляя иссеченную броню.{/n} "Ваша Светлость! Не успел поблагодарить вас за спасение. Губернатор Куравич, готов служить династии".'
- guid: 4bb16770-5be0-4f0d-b786-192805feda64
  text: '"Стой, элантах!" {n}Ирлиэт пытается остановить вас, но как только ваши пальцы соприкасаются с холодной поверхностью поля, вновь взвывает от боли.{/n}'
- guid: 4bb47b61-87c9-4ce0-ba73-1cecbab15c64
  text: '{n}Частицы реальности светятся, раскаленные возмутительным насилием над бытием. В их отблеске вы видите миражи Простора Коронус, до неузнаваемости измененного решениями, которые вы приняли... Или не приняли, но могли бы принять в каком-то другом мире.{/n}'
- guid: 4c0b0b51-8a4f-47f0-82a9-bf9d845f851c
  text: '{n}В ноосфере Кьявы Гамма развернулась жестокая схватка. Инфодухи сопротивлялись яростно, но вынуждены были сдавать позиции. Цеха и мануфакторумы получили жестокие раны, но выстояли. Когда битва стихла, Кьява Гамма приступила к медленному и тяжкому исцелению.{/n}'
- guid: 4c0ee970-7f84-4be5-be8b-1b8c9804d97b
  text: '{n}Кибелла оглядывает ткачей. Голос ее гремит под сводами храма:{/n} "Склонитесь же перед новым Висирем". {n}И сотня шепотов отвечают ей: "Смерть приветствует тебя!"{/n}'
- guid: 4c1f3fa8-3458-4a5e-b21c-866cf5eb45d5
  text: '"Хорошо. Скоро повторим". {n}Улыбка становится еще шире.{/n}'
- guid: 4c2a3c56-d025-4cd0-8675-819f416faa84
  text: '"Вы... правы. Если я не освобожусь сейчас, то навсегда останусь пленницей собственной силы. И чужих страхов". {n}Кассия стискивает медальон в тонкой ладони, и энергия камня резонирует с ее силами, докрасна раскаляя ледяной камень, пока тот с хрустом не рассыпается на осколки. Прикрыв рану, девушка тепло улыбается.{/n} "Вам еще не надоели местные виды? Пора покинуть это место, Лорд-капитан".'
- guid: 4c4470c4-0668-450b-87c9-0b4245386818
  text: '{n}По всему Янусу набожные серфы истребляют дурную кровь немочей. Не потерпи мутанта в доме своем!{/n}'
- guid: 4c5e8b71-bb06-43d8-a915-ad19adf7572c
  text: '{n}Обличающе взирая на копошащегося в луже собственной крови Владайма, Инцендия строго произносит:{/n} "Футфол будет рад узнать, что закон наконец восстановлен во всех секторах станции".'
- guid: 4c7a20fa-dfca-472b-86e8-adceb40868a2
  text: '{n}Высокий Фактотум слегка бледнеет и отводит взгляд в сторону.{/n} "Вот как. Это весомый аргумент для того, чтобы считать обладателя клинка весьма примечательной персоной. Даже среди Вольных Торговцев далеко не каждый может позволить себе обладание подобной... вещью. Видимо, это подлинный портрет Себериана".'
- guid: 4c959174-2810-4443-bc8a-ba77be507174
  text: '{n}Это вы создаете помехи. Лишь сейчас внимание К''тан обращается к вам — предшествовавшая битва была только рефлекторным сопротивлением нечеловеческого разума, поглощенного спектром совсем иных мыслей и переживаний. Но теперь Он думает о вас — и мысли Его столь весомы, что вы чувствуете и знаете их. Он желает прекращения конфронтации. Он способен разрешить конфликт выгодным для всех образом.{/n}'
- guid: 4c9640f4-037a-425f-858b-b3d97f6e10ed
  text: '{n}Изуродованный труп рабочего бледной грудой лежит на платформе. Его лицо размозжено, глотка вспорота, а тело испещрено рваными ранами и порезами. Над ним высится офицер Кляйн — в тусклом свете мрак заполняет желобки морщин на лбу, стекая по нахмуренным бровям во впадины глаз. Скальпель едва заметно подрагивает в руке.{/n}'
- guid: 4cf342f7-39c6-4ba0-b053-46f65c8d9cc5
  text: '{n}Идира вскрикивает и начинает слепо щупать руками воздух перед собой и нервно тереть глаза.{/n} "{g|Encyclopedia:Grox}Грокс{/g} мне на голову, какого черта?! Лорд-капитан, я... я ничего не вижу! Только мрак, беспросветный мрак".'
- guid: 4cfb6195-f8bd-41a1-8ca5-ef7178a3a99c
  text: '{n}Спустя несколько часов поисков старшего офицера доставляют на борт в почти бессознательном состоянии. Память о событиях прошедшего дня полностью покинула изможденный разум, однако врачеватели отметили, что некоторые функции тела... удивительным образом подверглись пускай и едва заметным, но необъяснимым метаморфозам. Навсегда или нет — покажет лишь время.{/n}'
- guid: 4d439e11-e334-4082-88d7-e8a60fca84d5
  text: '{n}Нет времени для раздумий! Вы сосредотачиваете дарованную вам пси-силу на кончиках пальцев и вскидываете руку в сторону Немезита. Воздух леденеет, но парень тоже целится в вас, ехидно улыбаясь. Черное дуло, направленное в вашу сторону, медленно покрывается инеем, и мир вокруг сужается в тонкую линию.{/n}'
- guid: 4d5e0eef-49ff-4923-a86b-438db4c6819a
  text: '"Лария, раз за разом ты доказывала, что на тебя можно положиться. Я знаю, что ты действуешь исключительно в интересах династии и доверяю твоим суждениям". {n}Рука Себериана ложится на рукоять меча, покоящегося в богатых ножнах на поясе.{/n}'
- guid: 4da42dde-02e6-4b8f-9820-10dde08affcd
  text: '{n}Немного подумав, Кассия качает головой.{/n} "Нет... Быть может, я и потеряю свой шанс на свободу, зато разум и силы останутся мне подвластны. Безумцам не место в Империуме. Безумным навигаторам... тем более".'
- guid: 4dc17b1a-2f0a-49c2-8f3e-8cd33d4ed6b6
  text: '{n}Все скелетообразное тело ксеноса состоит из незнакомого металла, пронизанного токами зеленоватых энергетических каналов. Ниже пояса гудят и дребезжат раструбы грави-платформы, верхние конечности перерастают в устрашающее тяжелое орудие. Ни одна деталь в теле чудовища не кажется уязвимой. Вне всякого сомнения, это — технически превосходная машина для истребления всего живого, и вывести ее из строя будет непросто.{/n}'
- guid: 4dcd52dc-7208-4a95-8f92-357f029538d6
  text: '{n}Ульфар строго и по-деловому уточняет:{/n} "Подношения охотничьей добычи? Охранные обереги на тропах?" {n}Получив утвердительный ответ, он солидно и удовлетворенно кивает.{/n}'
- guid: 4e1997c0-7fb6-412d-b13c-83d1f21170b1
  text: '"Лорд-капитан, станция прервала вокс-тишину". {n}В искаженном вокс-системой голосе Вигдис слышится легкое удивление.{/n} "С вами желает говорить {g|Encyclopedia:Magos}Магос{/g} Логистикатор Алтаря-Темплума, Тетрия-Лемма".'
- guid: 4ed635d3-ba18-4dec-a00c-7fe6c2339629
  text: '{n}Вам чудится, что черный глаз Ведки отбрасывает зеленый блик, когда она поднимает на вас горящий взгляд. Ее голос звонко разносится над полем боя.{/n} "Лорд-капитан! Я верила, что вы явитесь, что вы не оставите нас в беде".'
- guid: 4f091e26-d062-496d-b071-d51c5dadb43d
  text: '{n}Брат-эконом Нигмус избран настоятелем Ордена Молота. Его осторожная политика куда больше ориентирована на удовлетворение Вольного Торговца, чем на успешный сбор реликвий святого Когнация.{/n}'
- guid: 4f3c6c93-bf20-4069-bdf3-164b7e90cc0d
  text: '{n}Несколько дворян окружили пожилого мужчину в камзоле. Он испуганно переводит взгляд с одного лица на другое.{/n} "Я — член уважаемой династии! Вы не можете..."{n} Он пытается подойти к кому-нибудь, но от него шарахаются, как от прокаженного.{/n}'
- guid: 502f7fae-1d2b-4080-b74d-3503ed96a707
  text: '{n}Гадания Кибеллы оказались достоверны, позволяя меровцам точно подгадывать момент и место для нападения на ослабленных ксеносов. Пусть железные мертвецы и были могучи, но тактика оправдала себя, и с минимальными потерями их удалось оттеснить к руинам и истребить.{/n}'
- guid: 503ab4f4-98a0-4444-aa59-da4c73817b87
  text: '{n}Героическими усилиями техночистильщиков мануфакторум сектор за сектором был очищен от заразы. Пораженные машины и тела погибших предали священному плазменному огню.{/n}'
- guid: 507415eb-7d34-4176-8f05-18cf19fddcb5
  text: '{n}Каллигос возвышается над трупами растерзанных эльдаров и громогласно хохочет, не замечая, как кровь, покрывшая его с ног до головы, стекает по лицу прямо в глотку.{/n} "Славно повеселились, новеньк{mf|ий|ая}! Давно я так не развлекался — и все равно, клянусь, жажду больше!"'
- guid: 50878ca7-81e9-4ddf-8697-f82dd7806cdc
  text: '{n}Когитатор молчит, ожидая новых команд.{/n}'
- guid: 50aff452-a2af-41f4-a9a4-29cb6335ceac
  text: '{n}Вистенца опускает руку — вы успеваете заметить позолоченный имплант, спрятанный в предплечье.{/n} "Благодарю вас, Вольный Торговец. Чудесный, чудесный образец, который займет достойное место в моем салоне. Итак... на чем мы остановились?"'
- guid: 50b7af59-95a6-43fd-a1ca-a719a4f885d2
  text: '{n}Вокс-канал отвечает тишиной. Но за ней не следует звука обрыва связи — а значит, вас согласились выслушать.{/n}'
- guid: 50e46656-6d2b-41c7-a1e8-75ffb1d7f22f
  text: '{n}Рывок к цели, отточенный выпад... к вашим ногам оседает труп.{/n}'
- guid: 514092ee-12a1-445d-8b99-39fe3f16d9eb
  text: '"На деле же все до абсурдного наоборот — ваши слова и поступки ранят мое достоинство, и это не те отношения, о которых я мечтала. Не то, чего достойна леди. Прошу, примите мои слова с честью — нам не суждено стать ближе. И более я не позволяю вам выражать ко мне чувства, выходящие за рамки приличий". {n}Кассия вздергивает подбородок и пристально смотрит на вас.{/n}'
- guid: 51c79598-9076-46cf-b48c-c948593505a6
  text: '{n}Когда ваши губы соприкасаются, всполохи золотистых и розовых искр разгораются в воздухе, пока пунцовый туман не скрывает мир вокруг от вас с Кассией. Вы вдыхаете ее запах, и ваши оттенки сливаются, рассыпаясь цветными витражами еле сдерживаемых эмоций.{/n}'
- guid: 51d55713-33ae-45a6-9323-5e783be25808
  text: '{n}Вы прикасаетесь к рычагам и бобинам на приборной панели и нарушаете дремоту духов, скрывающихся в этом когитаторе. Помедлив словно спросонья, машина все же исполняет предназначенную ей функцию.{/n}'
- guid: 52372e7e-6b7c-46ce-8796-c9555aad5ae5
  text: '{n}Глаз Соломона пробирает настолько сильный тик, что проктору приходится прижать веко железным пальцем.{/n} "Как же, сука, я ненавижу скоморохов и их драные вирши..."'
- guid: 525e221b-99f0-46d6-a37d-d494319086de
  text: '{n}Вы замечаете на своей копии искусно наложенный грим. Под слоем пудры лицо двойника какое-то странное, кожа сморщена во множестве мест, словно... закрытые веки.{/n}'
- guid: 528d312f-310e-4f25-8f59-77d2a39ca391
  text: '{n}Человек словно сплавлен с машиной за его спиной: посиневшая по краю кожа почти бесшовно переходит в неизвестный вам металл, а плоть в десятках мест пронзена трубками, иглами и колбами с пузырящейся жидкостью. При вашем приближении изможденное человеческое тело приходит в движение: голова, словно на ниточке незримого кукловода, поднимается вверх. Серая кожа, безжизненные ввалившиеся глаза, запавшая между выпирающими костями плоть — перед вами мертвец, который, однако, продолжает двигаться.{/n}'
- guid: 52a47973-06c3-495d-b1db-1a15627fd3eb
  text: '{n}Существо втягивает голову в плечи, плечевые суставы складываются внутрь тела неестественным образом. Оно жалобно стонет в ответ.{/n}'
- guid: 52f0019e-bbaa-4e59-a41e-57e8f0a866c1
  text: '{n}Тяжело опираясь как на костыль на насквозь латанное-перелатанное лазружье, каким-то чудом все еще не развалившееся на куски, сержант Вигастис, играя желваками, пожирает глазами Комиссара. Сам он выглядит под стать — страшные раны на руках и груди кое-как заштопаны и туго перевязаны бинтами, щедро пропитавшимися запекшейся кровью.{/n}'
- guid: 5300aa8b-dd98-4c21-ad64-b927593bb355
  text: '{n}Высокий фактотум Янрис Данрок приветствует вас сдержанной улыбкой и едва кланяется.{/n} "Рад видеть вас, Лорд-капитан! Чем я могу быть полезен?"'
- guid: 53237752-7907-4505-a07a-6c20dda753c5
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "В таком случае мой ответ на ваш вопрос — да".'
- guid: 53a31782-278b-423f-b124-f5c88b719195
  text: '{n}Толпа замирает. Священное обещание смерти заставляет каждого вспомнить, сколь бесценен дар жизни.{/n}'
- guid: 53ad8cfe-cf2f-4e75-933f-a5434aed13b2
  text: '"Про... Простите, Лорд-капитан". {n}Женщина шумно втягивает воздух.{/n} "Мы не забудем вашей милости. Дайте нам оружие и один патрон, пошлите вперед! Твари ответят за все. Даже смерть милосерднее, чем ложная надежда".'
- guid: 53b350ac-3ee9-44d1-8e79-091fda2c3e4b
  text: '{n}Хормейстер учтиво кланяется.{/n}'
- guid: 53b895aa-4a8e-4aff-88e7-6f049f79f54f
  text: '{n}К вашему трону приближаются два очень непохожих друг на друга человека. Идущий впереди мужчина закован в броню {g|Encyclopedia:AdeptusArbitesGlossary}Адептус Арбитес{/g}. Свой шлем он несет на сгибе локтя, однако суровое выражение лица успешно заменяет ему бесстрастное забрало. Отточенным движением он кланяется вам.{/n} "Маршал Стракс. Адептус Арбитес".'
- guid: 540f5aa2-242e-4182-82a6-044c0044b04a
  text: '{n}Приборная панель {g|Encyclopedia:Cogitator}когитатора{/g} покрыта десятками рубильников, кнопок, поворотных рычагов, переключателей и других средств управления.{/n}'
- guid: 545fd453-c2bd-49cc-8eb4-b4900b2fe1a7
  text: '{n}Хищно ухмыльнувшись, Инцендия заинтересовано смотрит на вас.{/n} "Само провидение Императора привело тебя сюда, на мой трибунал. Для меня будет удовольствием обличить тебя в свершенных преступлениях".'
- guid: 549cfcf2-44dd-4a65-a316-a8b422f46f15
  text: '{n}{g|Encyclopedia:Mechadendrite}Мехадендрит{/g} с буром осторожно вытягивается в сторону кровавой каши, бывшей мозгом Идиры, и обмакивает в нее острие.{/n} "Я сохраню органический образец для изучения".'
- guid: 549e7d7b-67df-4253-bee6-5b725cc3c093
  text: '{n}Ведка закусывает губу, взгляд ее становится отстраненным, но вскоре вновь наполняется сталью. Она мрачно кивает вам:{/n} "Вы правы, Ваша Светлость. Да защитит вас Бог-Император".'
- guid: 54ba6d6e-4cfe-46d8-a136-948361c837aa
  text: '{n}Если заранее не знать, что ищешь, взгляд никогда не зацепится за фигуру этой женщины-{g|Encyclopedia:Servitor}сервитора{/g}. Импланты и общая механистичность движений, пустой взгляд — все на месте. Но...{/n}'
- guid: 559f3e0f-0562-428f-85f7-64ecc4a83c3d
  text: '{n}{g|Encyclopedia:Genetor}Генетор{/g} выступает чуть вперед. Множество визоров, спрятанных под капюшоном, двигаются рассинхронно и рассеянно. Голос дребезжит — край встроенного в тело техножреца вокс-ретранслятора оплавлен {d|Encyclopedia:Ch4_AugmentatorWounded}недавним ранением{/d}.{/n}'
- guid: 55ab44af-5b4a-4a7d-abba-6c8a816a6556
  text: '{n}Отдав честь, арбитр чеканит:{/n} "Слушаюсь".'
- guid: 56637b81-0e4e-4532-84eb-c7f8a1fc513f
  text: '{n}Духи машин бывают своенравны и недисциплинированы. Годы, проведенные без священного обслуживания, могли заставить его забыть о покорности. Обычно в таких случаях техножрецы приводят ретивых слуг Омниссии в ум ударом электрического стрекала или разводного ключа, сопровождаемым литанией бесперебойного послушания.{/n}'
- guid: 566cd182-d3a8-43aa-b346-160252acb082
  text: '{n}Жилистый старик с почтением склоняет голову:{/n} "Благословение Двуглавого Бога-орла постигло Кетца Темер с вашим прибытием, о Звездорожденн{mf|ый|ая}! Этот слуга небес, земли и тех, кто между, давно узрел во снах сей разговор. Этот слуга надеется, что Ведущая-вперед и ее племя приняли посланни{mf|ка|цу} далеких звезд с истинным почтением".'
- guid: 56cb6fad-8786-4e18-ba1f-d26c7aa4b1a3
  text: '{n}Орды инфодухов были техзорцированы и истреблены, а захваченные ими механизмы — очищены и возвращены в строй, и техножрецы восславили Омниссию, защитившего производственный алгоритм от тяжкого нарушения.{/n}'
- guid: 56f93287-49d5-4229-804d-76b219bcd1d9
  text: '{n}При упоминании бывшего новатора Дома Кассия вздрагивает.{/n} "Ч-что? Я... Думаю, вы меня с кем-то спутали".'
- guid: 570748aa-c4ec-421d-a3a4-6d749030a711
  text: '{n}Паскаль, подавшись вперед, пробегает пальцами по клавишам, и экран когитатора, мигнув, отвечает ему строками непонятных письмен.{/n} "Я обратился к духу машины с просьбой открыть также и личные архивы логиса Авеля. Он принял мой запрос".'
- guid: 57198d6b-6fb9-405a-b1e5-087e1ee0a82c
  text: '{n}Таддуа с осторожным любопытством взирает на вас.{/n} "На Тассере есть две величайшие истины, Звездное Сиятельство. Первая — Император создал планеты и звезды, а затем сотворил Человечество по образу и подобию своему, и мы его дети недостойные. А вторая — это свобода менять судьбу, что отличает нас от зверья и врагов Его, наполняет жизнь светом Его. И если кто-то предпочитает гнить заживо в застенках судьбы, коей не удовлетворен, место его — во чреве Фесмофориуса"'
- guid: 571a726e-a1f0-46d9-bd50-3721d0a8a1f4
  text: '"Ты..." {n}Глаза Джай расширяются одновременно от ненависти и испуга.{/n} "Ты... {mf|сын|дочь} грокса и портовой шлюхи, вот кто ты! {mf|Ашмаг|Кассха} последн{mf|ий|яя}! Да я... Я..." {n}Джай прикусывает губы до крови, бессильно роняя руки.{/n} "Чтоб тебя и весь твой протекторат ажи отымели три раза, {name}!"'
- guid: 5754810b-701e-4822-8c54-1e8403d1cf77
  text: '{n}Джай нежно улыбается, будто пытается смягчить грубость слов.{/n} "Прости, {name}, но мне на это насрать. Я себе такая не нравлюсь и не хочу себя такой чувствовать. Так что оставь жалость и поддержку себе — я не раненая девочка, которую нужно оберегать. Я оклемаюсь и со временем соберу себе новую маску, получше".'
- guid: 57590a1b-98f5-44fa-b490-6da34a85a477
  text: '{n}Голос Джай звучит тяжело и весомо, она осторожно выбирает слова:{/n} "Не исключено, что по итогу этого собрания я окажусь... обременена некоторыми узами с Пощадой. И это зависит не от моей воли. Вряд ли он заставит меня покинуть твою свиту, но он захочет моей верности. Захочет владеть мной... во всех смыслах. И его вряд ли устроит перспектива делить меня с тобой. Я не знаю, важны ли для тебя наши чувства, но было бы подло с моей стороны не предупредить тебя".'
- guid: 5782f675-11d3-46b6-ad28-240d79962678
  text: '{n}Как только тело касается пола, фигуры вокруг вас начинают двигаться: Иокаста командует блюстителям осмотреть помещение, ассистенты медикариев начинают суетиться, приводя сектор Бионика в некое подобие порядка.{/n}'
- guid: 578d17db-cfc7-48ab-85c7-4773bcd1f261
  text: '{n}Планета, что была заселена эльдарами еще до Падения, стала одной из арен сражений между торжеством чувственной вседозволенности, царившей тогда среди ксеносов, и аскетичной психической сдержанности. Местный правитель Кессей был просвещен и мудр, но подвержен пороку развращенности. Желая перейти в иную форму существования, он создал механизм, который позволил бы ему захватить тела и мысли всего своего народа. Один из телохранителей царя, Халкион, поднял восстание против тирана и смертельно ранил его, но не успел помешать ему слиться с машиной. Тогда Халкион отдал жизнь, чтобы перенести и свой дух в механизм, где продолжил схватку. Трагичная эта война погубила всех эльдар на планете, но сохранила эхо их душ, а также душ их лидеров.{/n}'
- guid: 57a05866-9f4a-4629-ac03-dfb12ec20cb2
  text: '{n}Толпа под вами кипит, электризованный восторг наполняет воздух Даргонуса. Тысячи глоток скандируют ваше имя. Вы — на вершине этого мира, как и всех прочих.{/n}'
- guid: 57bc0a8d-c427-472a-a981-3f63d409ebe4
  text: '{n}В облике шагающего вам навстречу мужчины, в каждом его жесте, в манере держаться читается благородное происхождение. Тем страннее выглядят его волосы — сплошной колтун, который явно не видел расчески неделями, и одежда, мятая и грязная. Лицо его бледно, глаза лихорадочно горят.{/n} "Кто вы? Я ждал моего друга Эвейна, а не чужаков".'
- guid: 5932a36b-f58b-43b6-b1c4-e129e18e3eec
  text: '{n}Кассия пожимает плечами.{/n} "Столь ненавистная тобой наследница тирана более не претендует на трон. Свобода — разве не ее вы желали все эти годы? Изберите достойного новатора. Проложите новый путь для Дома Орселлио. Восстановите гармонию между внутренними кланами... Но даже не смейте и думать навредить мне или Вольному Торговцу — иначе познаете гнев моего Атласа".'
- guid: 5944426a-b19d-44a1-868b-7b98ee807798
  text: '"Прекратите это безумие!" {n}Ювенна вскидывается в праведной ярости. Ее голос становится полнозвучным и властным.{/n} "Я, Ювенна фон Валанциус, единственная наследница Вольного Торговца Себериана фон Валанциуса, обвиняю своего отца в ереси. Этим преступлением он лишает себя звания Помазанника Бога-Императора! Священный Патент не может пребывать в столь нечестивых руках! С этого момента я возлагаю на себя священное и тяжкое бремя главы дома фон Валанциус! Даю вам слово, что все, кто последует за мной, не будут обвинены в потворствовании ереси". {n}Наследница переводит дух, чтобы вновь обратиться к отцу.{/n} "Ворота не защитят тебя, отец. {name} помог{mf||ла} мне впустить в них истину".'
- guid: 594797a5-b232-415f-bdd1-77bc21f6391f
  text: '"Духи-из-тьмы... Вот, значит, как мон-кай сего мира видят мой род. Вторженцами. Стихийным бедствием". {n}Ирлиэт напряженно вздыхает.{/n} "Да только местные мон-кай беззубы и лишены когтей. Им неведомы даже простейшие технологии, что использует ваш вид. Зачем же моим собратьям так яростно жечь их мир?.."'
- guid: 59baac24-4a01-4def-a0a2-609348228bb2
  text: '{n}Хейнрикс прочищает горло.{/n} "Если ты полагаешь, что я просто забуду о том, что услышал, то напрасно. Обвинение исчадия Архиврага в адрес твоей предшественницы, {name}. Его признание в том, что Теодора якшалась с культистами и стала виновницей падения Кьявы Гамма. Как долго ты намеревал{mf|ся|ась} скрывать это?"'
- guid: 59d099bd-adaf-45b7-aa09-362cd623e73b
  text: '{n}Голос бога становится сумрачен.{/n} "Единоличное владение мощью... Неприемлемый соблазн. Если этой вселенной нужен Эсхатос, Эсхатосу нужен тюремщик. Увы, лишь Амарнат может им быть. Так пусть же возродится".'
- guid: 5a691866-6397-4707-b8ff-ec3af576e82e
  text: '{n}Соломон отдает честь и мрачно кивает.{/n} "Я позабочусь об этом, Вольный Торговец".'
- guid: 5a6ca8aa-34d8-4aaf-904c-b040336f9984
  text: '{n}{g|Encyclopedia:Genetor}Генетор{/g} выступает чуть вперед. Множество визоров, спрятанных под капюшоном, двигаются почти бесшумно, одновременно оглядывая палубу и вас.{/n}'
- guid: 5a72bbdd-6f45-4300-bac1-eff146f1655c
  text: '{n}Протяжные стоны металла складываются в болезненную, тоскливую, но в то же время и полную ядовитой злобы мелодию.{/n} "Вновь явствую и зрю дискордию! Мерзость! Величие покоряющее унижено мимолетной паршой! Коррозия всюду. Пустое нутро возгорелось!" {n}Скрежещущий рев больше похож на металлическую пытку, чем {d|Encyclopedia:Ch5_NecronKnowlege}речь разумного существа{/d}.{/n}'
- guid: 5a8bf51f-cbdc-4db3-9b1c-31ba2d98c56c
  text: '{n}Соломон едва кивает.{/n}'
- guid: 5ab85537-fe85-4f5a-b981-0dc392ff7918
  text: '"Такова процедура. Устрашение развязывает языки, мучения размягчают волю смутьянов. Чернь должно держать в благоговейном ужасе". {n}Фразы устава звенят металлом.{/n}'
- guid: 5acf96c7-53a0-4dea-a887-0cc98861845f
  text: '{n}Что бы вы только что себе ни ввели, это не было полезно для вашего организма — все тело будто охватывает пламя, и каждую мышцу сводит будто от удара молнии.{/n}'
- guid: 5afc5b7e-0ee8-4687-b5be-1d4b26f4274e
  text: '{n}Под бесстрастной маской мужчины мелькает что-то — ярость? Горечь? Впрочем, голос дознавателя остается бесстрастным.{/n} "В таком случае считаю необходимым указать, что вместе со спасенными на корабль может проникнуть и печать Архиврага. Учитывайте это на будущее".'
- guid: 5b3db7a6-24bb-4f74-974a-19b72e4a773e
  text: '{n}Человек в сером тарабанит пальцами по инфопластине. Его массивный головной {g|Encyclopedia:AugmentationGlossary}имплант{/g} щедро рассыпает искры на все вокруг.{/n} "Двести миллионов… Нет! Коррозия не учтена... Но где?.."'
- guid: 5b5cd5e7-e3c9-4b85-b8d1-516f2d9b8063
  text: '{n}Магос надолго замолкает. Когда он вновь начинает говорить, его голос звучит слабо, будто издалека.{/n} "Познание есть ключ ко всему, а понимание — есть путь к познанию. Допустим, мои инфо-координаты основаны на ложной точке отсчета. Какую предлагаете принять вы?"'
- guid: 5b834a25-4f22-447f-8ec9-5900d0e148d4
  text: '"Я..." {n}Кассия растерянно оглядывается, но не находит ответа, и лишь смущенно опускает голову.{/n} "Простите... я не могу поступить иначе".'
- guid: 5be00599-7b03-48ce-81e5-897dd8e490b4
  text: '{n}Паскаль запрокидывает голову, и мощь, переполнявшая его голос, выплескивается вовне. Голос техножреца гремит на весь корабль, подхваченный каждым вокс-динамиком каждой палубы.{/n} "Когда-то я был частью великого целого. Когда-то я был одним из многих. Мы прозрели ужас грядущего, мы восстали против него. И мы оказались недостойны открывшегося нам знания".'
- guid: 5bfc3faa-1fe2-4d94-87dd-3abf6afb3a1c
  text: '{n}Оторвавшись от своего занятия, мужчина салютует вам огнеметом.{/n} "Ваша Светлость! Какая честь! Вся станция только и говорит о нов{mf|ом|ой} главе династии фон Валанциус! Старшина третьей коммунальной бригады Футфола к вашим услугам!"'
- guid: 5c68aa73-c5a8-4735-915b-b8fd89e5978f
  text: '"Лорд-капитан?" {n}Кассия вздергивает подбородок. Ее поза и взгляд полнятся сдержанностью и благородством нобилите, однако у нее предательски дрожит голос.{/n} "Палубы корабля заполонили вихри грязных красок — кто-то разносит нелепые сплетни о том, что вы собираете чужие сердца подобно победным трофеям. И ваша... коллекция... насчитывает больше одного экземпляра. Прошу вас, развейте мои сомнения — неужели наши чувства друг к другу ничего не стоили?"'
- guid: 5c877248-5da9-4797-a145-dee11b011ff5
  text: '{n}{d|Encyclopedia:Conviction_Heretical3OrMore}Вкрадчивый шепот сплетает слова в вашем сознании{/d}, подобно прихотливому нечестивому узору.{/n} "Приспешники фальшивого бога, не знающие единства, слепые в своей вере. Им не познать Истины... в отличие от тебя. Я укажу тебе путь, Дитя Рассвета, но чтобы ступить на него, тебе надо укрыть наши намерения за фасадом преданности трупу на троне. Пока что внимай плану ложноверцев и готовься. Сейчас время слушать. Время действовать настанет позже — я поведаю тебе, когда оно придет".'
- guid: 5c9c3573-d5d6-4a5e-a6d5-2dd5e145e446
  text: '"Когда капсула открылась, мой разум потонул в грязно-алом, и буром, и черном, и... Если бы не вы!" {n}Кассия сжимает руки в кулаки, и вас обдает очередной волной гнева. Тело Леди-Навигатора сотрясается от переполняющей его силы — и она вот-вот вырвется вновь.{/n} "Если бы вы не втянули меня в свои интриги и авантюры, этого бы никогда не случилось!"'
- guid: 5cbe4b03-eefb-4a15-b96a-fae4d93ca4e1
  text: '{n}Преподобный встречает слова Кибеллы спокойно, даже с какой-то величественной обреченностью. Он отвечает убийце:{/n} "Защитник народа и прислужница тирана — два верных служителя противоположных идей, две души, что ради долга отринули все прочее. Теперь истинно вижу, что ваше с ним столкновение было неизбежным".'
- guid: 5cc15035-8837-4048-9833-9ce7a2072300
  text: '"Довольно". {n}Ирлиэт едва шепчет.{/n} "Он больше не внемлет мне".'
- guid: 5cd4e449-76f1-443f-a7aa-732ab09ae4e0
  text: '{n}Пространная двоичная вокс-молитва наводит дремоту на мастер-когитатор. Наконец вид-скрин старца блаженно потухает, и, освободив корпус от винтов, мехадендриты обнажают его обвитое сосудами проводов чрево. После маслопомазания машины под бинарные инфопсалмы панель корпуса водворяется на место.{/n}'
- guid: 5d187785-e0ae-44db-b490-20d3d24c7a53
  text: '{n}Кассия устало потирает нагрудник в месте, где находится Атлас, и коротко кивает.{/n} "Я передам регенту приглашение, однако я бы не надеялась, что к нам присоединится действующий лидер. После случившегося на Даргонусе весь Дом Орселлио трепещет перед вами, и моя семья едва ли станет рисковать".'
- guid: 5d1e59c5-b93e-44b9-b29d-ffba1c0b4e0a
  text: '{n}Хротко бесстрастно наблюдает, как его люди, орудуя дубинками и ногами, допрашивают серфов. Завидев вас, он коротко кивает.{/n} "Ваша Светлость".'
- guid: 5d533a8a-d144-4f15-8c87-396b1a6b2535
  text: '{n}В голосе Мастера вокса вы улавливаете нескрываемое облегчение.{/n} "Как вы прикажете, Лорд-капитан".'
- guid: 5d69ba97-7505-43d5-820a-522fe496b9aa
  text: '{n}Огромная масса причудливо переплетенного и скрученного металла шевелится при вашем приближении. Бряцают натянувшиеся цепи, и из недр массивной туши доносится приглушенный рык — смесь звуков поршней, двигателей, пистонов и дюз. В вас впивается разъяренный неживой взгляд, но само орудие остается неподвижным.{/n}'
- guid: 5d809492-ef92-4999-9697-a9c74dece8bb
  text: '{n}Обезглавленное тело Ирлиэт оседает в грязь, и жар ее гневного взгляда угасает следом.{/n}'
- guid: 5de4a838-c4a5-4dfe-a638-811d155bb6a2
  text: '"Ты убил{mf||а} меня?" {n}Каллигос широко ухмыляется.{/n} "Это была славная битва?"'
- guid: 5e1b5e8f-4f79-48c0-9d1f-dd68eb34da7c
  text: '"Я надеялась найти понимание тех, кто разделяет мой Путь". {n}Голос Ирлиэт дрожит от усталости и злости.{/n} "Но даже предки с Алайтока, при всей их мудрости и гибкости разума, не смогли отбросить ненависть к мон-кай, что обрекли на гибель тысячи душ невинных детей Азуриана. Я пыталась воззвать к свету в их душах — но все мои доводы лишь пенными волнами разбивались о скалы их непреклонности".'
- guid: 5e284d89-d8cd-4d16-9b03-bdf5be9d630f
  text: '"Нет. Нет, так быть не может. Я сильнее этого. Наверняка... да, наверняка вы правы и голоса меня ведут в какую-то западню — с чего бы им хотеть запирать самих себя? Мы... мы обязательно найдем другой способ, да Лорд-капитан? Да, конечно же найдем..." {n}С каждым словом голос Идиры меркнет и тускнеет все больше, перерастая в совсем невнятное бормотание, пока, наконец, не затихает совсем. Связь прерывается.{/n}'
- guid: 5e67bc2b-9987-4b07-a840-6b0151f956bf
  text: '{n}Вблизи Капеллан производит еще более внушительное впечатление — это высокий, мощный мужчина, на лице и руках которого видны многочисленные шрамы. Весь его вид словно рассказывает историю о многочисленных еретиках, повстречавших конец при встрече с адептом истинной веры.{/n}'
- guid: 5eafa151-b80e-4ba7-a69e-c3371e905f14
  text: '"Отец". {n}Ювенна делает шаг вперед и пристально смотрит на Себериана.{/n} "Прошу, доверься мне хотя бы единожды. Наш враг силен и яростен, но разумен. Я хороша в дипломатическом искусстве — позволь мне отправиться к Диодасу аф Иррамону и заключить с ним соглашение от твоего имени. От этого династия лишь окрепнет. Если же ничего не выйдет... пусть мельта-пушки и лазганы говорят вместо меня".'
- guid: 5eb83ed9-3c30-484f-803e-ec6d361dc5a3
  text: '{n}Ведомый свирепым Космическим волком, меровский полк вступил в неравную битву с обеими фракциями ксеносов. Ульфар рвал железные туши на части десятками, и солдаты знали — прямо сейчас за ними стоит гнев самого Бога-Императора. Уподобившись могучему Астартес, люди бились яростно и воодушевленно, пока все ксеносы не были оттеснены к руинам и истреблены.{/n}'
- guid: 5ede3589-d04d-49de-9c93-6888c4988e78
  text: '{n}А вот Серый Вортен бросает на вас заинтересованный взгляд. Стоит вам поймать его, как пьянящий запах свежей крови ударяет в ноздри, а предсмертные вопли и звуки рвущейся плоти оглушительной симфонией застилают уши. Вот он, источник скверны, крепко вцепившийся в душу Винтерскейла.{/n}'
- guid: 5f4a67cc-5bc0-46eb-93d8-410a337b2a10
  text: '{n}Эоганн улыбается.{/n} "Утверждение истинно, коллега".'
- guid: 5f640191-292c-4369-901b-a649bd2b3147
  text: '{n}Все выглядит так реалистично... но если прислушаться, до вас не долетает гул улья. Даже в разгар войны он должен быть слышен. До чего искусная подделка! Невольно возникает вопрос — не проще было бы проживать эти часы как остальные, в счастливом неведении? Ведь с каждым разом действия становятся все более привычными, отработанными. Словно вы медленно превращаетесь в {g|Encyclopedia:Servitor}сервитора{/g}.{/n}'
- guid: 5f97568d-6c82-45ca-a922-9980ccac4459
  text: '{n}Техножрец взирает на вас единственным визором. Затерянный в сплетениях металла и проводов, вокс-передатчик, заменяющий служителю {g|Encyclopedia:OmnissiahGlossary}Омниссии{/g} рот, шипит:{/n} "Сканирую жизнеформу... визит зафиксирован. Приветствую Лорд-капитана в Секторе Бионика, Вас будет принимать {g|Encyclopedia:Genetor}генетор{/g} мажорис Ферренц". {n}{g|Encyclopedia:TechPriest}Техножрец{/g} поворачивается, и вы вдруг осознаете, что до этого он стоял к вам спиной: лицевая часть его головы усеяна вспыхнувшими визорами.{/n}'
- guid: 5f9afcb0-400f-47d7-8215-a4ae91b2bca4
  text: '{n}Ветхий старец с седой бородой, окрашенной кровью, складывает морщинистые руки в ритуальном жесте. Тело его покрыто свежими и застарелыми шрамами, глаза плотно зашиты, а рот, рассеченный с двух сторон, придает челюсти схожесть со змеиной.{/n} "И прош{mf|ел|ла} цар{mf|ь|ица} ковчега тропами нежизни, следами первой из тех, кто соткал паутину кровавую. И склонились слуги смерти пред {mf|ним|ней}, ибо Домин есть податель{mf||ница} жизни".'
- guid: 606d1f92-557e-4c71-b05e-84a37b0c418b
  text: '{n}Блюстители шагают вперед, отгораживая шествие от вашего трона. Не прекращая прославлять вас выкриками и молитвами, процессия разворачивается и следует к выходу с палубы.{/n}'
- guid: 60c457e2-f13c-4555-aef9-6666318fef8e
  text: '{n}Странное ощущение проходит так же внезапно, как и началось. Астропат качает головой.{/n} "Я знаю, зачем вы здесь, Ваша Светлость. И при всем моем уважении, я прошу вас передумать".'
- guid: 60c6d593-c5df-4295-af00-dbd50b97caa7
  text: '{n}Глаза Джай впали от бессонницы, амасека и усталости. Волосы спутались, а дорогие одежды измялись словно после драки.{/n} "Мы... Правда дождались? Клянусь Троном, смирение — это путь к сумасшествию. Не представляю, как святые мирятся со своими муками без амасека..."'
- guid: 60d7f7b7-1951-40c5-baea-d07bf0269031
  text: '{n}Тервантьяс замолкает на несколько секунд.{/n} "Чтобы отплатить Кикеросс за обман, я направлю {d|Encyclopedia:Ch3_PatchedMonster}Изыскателя страданий{/d} на арену. Пока ведьмы будут лишать тебя жизни, он прикончит нескольких из них. Изыскатель боли все равно слишком заметен, чтобы скрыть его от охотниц культа. Пусть мое творение исполнит симфонию боли, для которой было изготовлено!"'
- guid: 6114a06e-691b-402b-86bc-0283fe7d1a6f
  text: '"Если таково желание Вольного Торговца..." {n}Кассия мнется мгновение, а затем резко расправляет плечи.{/n} "Я с радостью вернусь к своим обязанностям в Доме Орселлио. Прощайте, {name}".'
- guid: 616c9074-ea42-4f19-bed8-004bf2d5229d
  text: '"Ты не перестаешь меня удивлять, мон-к... {name}". {n}Жуткий смех разливается по вокс-системе, словно вязкая кровь по металлическим плитам.{/n}'
- guid: 61c9cbe3-3e02-490d-a766-534b17717a63
  text: '"Ваша Светлость!" {n}Обернувшись, вы видите, как вас нагоняет капитан-интендант. Дунавски замирает напротив, вытягивается по струнке и отдает честь.{/n} "Капитан-интендант Дунавски прибыла в качестве подкрепления. Каков план операции?"'
- guid: 61ca8b07-c046-494d-85bf-1829080788cc
  text: '"Император Защитит, Лорд-капитан". {n}Превозмогая боль, Кассия улыбается.{/n}'
- guid: 61d2974f-c2fb-4bbb-96c7-8c3ddf61e99d
  text: '{n}Кибермастиф бросается на главаря бандитов: железные челюсти перемалывают мясо и кости как лопасти огромной мясорубки, вы не успеваете даже уследить за перемещениями зверя. Спустя секунды на месте угрожавшего вам человека остается изуродованный труп, а его более удачливые приспешники в ужасе уносят ноги.{/n}'
- guid: 6225c1d4-b9f6-4460-b7df-a385667183d1
  text: '{n}В доме царит полумрак, мебель перевернута, а весь пол в крови.{/n}'
- guid: 626690f9-8cc8-41ae-8112-44328b47222a
  text: '{n}Ваш удар вышибает еще один кусочек из Его эфирного тела, заставляет К''тан расточить еще частицу своего внимания на удержание собственной физической формы, и этого становится достаточно, чтобы сила Его начала втягиваться в Ярмо неостановимым потоком. Древнее чудовище испускает разъяренный вой — второй раз за вечность Его свободу попирают столь безжалостным образом.{/n}'
- guid: 62c1772f-561e-4b1d-b224-a49b0ec1b622
  text: '{n}Кассия неопределенно пожимает плечами, поднимая на вас испытующий взгляд двух рубинов.{/n}'
- guid: 62f1fb1a-5ab9-46bf-8129-f171a25b16c9
  text: '{n}Высокий Фактотум облегченно вздыхает.{/n} "Смиренно ожидаю вашего визита".'
- guid: 6327f8f7-598b-4bdb-a1c1-7c4b7254faf6
  text: '{n}Блаженные не пытались защитить себя или как-то противиться свершенному над ними насилию. Они приняли смерть так же, как и явились на этот свет — тихо и покорно. Народные волнения утихли, а великое ваяние продолжилось, но без Блаженных темпы освоения плодородных земель заметно снизились.{/n}'
- guid: 633e966a-b914-4d1c-b66b-28f11fe890c2
  text: '"Постойте!" {n}Кассия взывает не только к вам, но и стоящим вокруг эльдарам.{/n} "Я не могу изменить прошлое, это правда. Как и то, что мой Дом навсегда заклеймен позором, насланным тщеславием Тисифоны Орселлио. Но здесь и сегодня нам под силу изменить будущее, прервать бесконечные страдания, в которых погрязли и ваши, и мои сородичи!"'
- guid: 634e9209-b1a9-40db-978b-7ef00abbcc46
  text: '{n}Стоит вам войти, как все взгляды в помещении обращаются в вашу сторону. Комиссар громко гаркает команду, и бойцы синхронно отдают честь.{/n} "Слава династии фон Валанциус!"'
- guid: 637d9db1-8a63-494d-ab2d-120080ec9c5f
  text: '{n}Вид-скрин мигает, и механизмы в утробе машины начинают приглушенно жужжать.{/n}'
- guid: 640b0a6f-b370-4586-98b9-50196d9974dd
  text: '{n}Маражай внимательно оглядывает ваших соратников, корчащихся в муках, после чего делает небрежный жест кому-то за пределами вашего взгляда.{/n} "Несите инъекторы. Тут есть мон-кай, которых я обещал Тервантьясу. Дергаться этим отродьям до того, как они окажутся в руках Архимахинатора, ни к чему".'
- guid: 64dfff7d-bdda-4cf7-b43f-2c1e312b3e39
  text: '{n}Ваших познаний о природе {g|Encyclopedia:MachineSpirit}машинных духов{/g} достаточно, чтобы обмануть систему и подчинить ее функции своей воле. Ложный запрос, хитрая манипуляция управления — и вы добиваетесь своего.{/n}'
- guid: 6520cf3d-e94a-463a-9e0e-8295c382d313
  text: '{n}Одна из фигур останавливается рядом с Богулом. Голос женщины вам знаком, как и ощущение пристального взгляда нечеловеческих глаз.{/n} "Итак, чужа{mf|к|чка}. Ты добил{mf|ся|ась} своего и наш{mf|ел|ла} нас — предводителей восстания. Скажи же мне — что ты сделаешь теперь? Но прежде, чем ответишь... не делай необдуманных движений. Мои братья куда быстрее твоих".'
- guid: 6531e3cd-7f8c-4881-8bd3-ef768c633738
  text: '{n}Комиссар, бесстрашно возвышаясь среди царящей вокруг резни, звучно раздает приказы бойцам, одновременно отстреливаясь из пистолета. Завидев вас, он, не прекращая стрелять, оборачивается и кричит:{/n} "Сейчас не время болтать, Ваша Светлость. Отходите, мы прикроем!"'
- guid: 658d2a9b-422c-4617-a81a-c50c7f2b46e9
  text: '{n}Соломон бледнеет. На его виске вздувается жила, и вы явственно слышите скрип зубов.{/n} "Трогать моего пса было большой ошибкой".'
- guid: 658fcb7f-5893-4502-ab01-0a3c35053e2c
  text: '{n}Хейнрикс поднимает голову. Облако холода, окутывающее его, начинает развеиваться.{/n} "{name}... ты разыскивала меня? Я постарался найти место поспокойнее, чтобы восстановиться после пыток".'
- guid: 6596070f-3cb7-4a6b-b8df-e09e570f5556
  text: '{n}Осуждающий взгляд Ирлиэт устремляется к Шайрэнкхею и провидцам.{/n} "Вы сами избрали сей путь. Навлекли беду не только на Крударах, но и собратьев с Алайтока. Раз за разом повторяли ошибки, ведомые страхами, глупостью или гордыней. И даже лишившись всего, лишившись... дома, вы продолжаете слепо ступать по тому же тернистому пути, не желая меняться. Нет. С меня достаточно. Я исполнила долг Изгоя сполна. Ваша судьба отныне — лишь в ваших руках".'
- guid: 65ac5260-4b33-453c-924a-4efeab6c1e74
  text: '{n}В мутной колбе, наполненной едко-кислотной жижей, плавает тело молодого {g|Encyclopedia:Aeldari}эльдара{/g}. Судя по меняющимся показателям на встроенном {g|Encyclopedia:Cogitator}ксенокогитаторе{/g}, эльдар скорее жив, чем мертв.{/n}'
- guid: 65f3a266-5ea8-4e21-a763-3a21d0d9aa7c
  text: '{n}Префект Вультур стоит перед вами на коленях. Тысячи хрупких имплантов конвульсивно дергаются по всему ее телу, делая ее похожей на раздавленное насекомое.{/n}'
- guid: 6609745d-137f-485e-bd5f-df662a3e7214
  text: '{n}Цепи, сковывавшие волю машины, лопаются — и орудие кровожадно ревет, после чего разворачивается к вам и бросается в атаку.{/n}'
- guid: 66a08bdc-481d-4635-b7f4-6fc895ec2453
  text: '{n}Шлюз заблокирован. Это неправильно — вы точно не включали блокировку, когда проходили сквозь него.{/n}'
- guid: 670f1445-198d-4f30-9e3e-ecf6eea808cc
  text: '"Ваша Светлость, у меня кое-что есть для вас". {n}Хормейстер протягивает вам листок с ровным машинным шрифтом, вытравленным в бумаге.{/n} "Благодаря вашему содействию по починке компилятора, нам удалось интерпретировать любопытное послание. В нем упоминается сигнатура, применявшаяся агентами отступника Войгтвира для особо важных донесений".'
- guid: 67298ef5-2a98-4063-863e-15cbd25993f0
  text: '{n}Участливо взглянув на проктора, Кибелла достает одно из своих скрытых лезвий и вкладывает его в руку Соломона.{/n} "Ибо Неумирающий и есть долг".'
- guid: 67466154-4096-4787-8dd2-2126c8626ebe
  text: '{n}Взгляд Ардженты устремлен вверх — на парящее в воздухе судно друкари и извивающиеся тела, прибитые к борту.{/n} "Это... это сержант Вигастис! Я узнаю его, узнаю его голос! {name}, помоги мне! Мы должны спасти этих людей от издевательств ксеносов!"'
- guid: 674e07f9-1e05-47e8-800a-bf0abe4b4c23
  text: '{n}Экран когитатора сияет мягким зеленым светом.{/n}'
- guid: 67a4b2dc-ae88-462a-85ce-f117d80c4f98
  text: '{n}Возле реликвария молится юноша. Его волосы растрепаны, форма со следами пота измята, а под глазами залегли темные круги. При вашем приближении он вскакивает с колен и дерганым движением складывает {g|Encyclopedia:Aquila}аквилу{/g}.{/n} "Лорд-капитан, вы здесь! Я верил... нет, я знал, что вы придете!"'
- guid: 67d7e5a9-c5da-4d6a-af07-e5c906be0e79
  text: '{n}Когда насытившаяся кровавым зрелищем знать расходится, Абеляр твердым шагом подходит ближе к вам.{/n} "Лорд-капитан".'
- guid: 680f8942-a813-4b40-aad2-408fe2b8e098
  text: '{n}Во взгляде арбитра возникает теплый огонек.{/n} "Что будет, если я отвечу "Да"?"'
- guid: 681bc9e4-ab69-4c9e-8aef-465a0c255c37
  text: '{n}Воздев руку, техножрец резко схлопывает ладонь, и разряды Движущей Силы угасают, словно он поймал их в кулак. Грузный мужчина с металлическим животом и громоздким панцирем парит над полом, напоминая огромного алого жука. Из под угловатой черной шапки выглядывает немолодое лицо, сохранившее поразительно много органики для служителя {g|Encyclopedia:AdeptusMechanicusGlossary}Адептус Механикус{/g}. Его, подобно бороде, обрамляют кабели и пистоны.{/n}'
- guid: 684f49fd-8e2f-4956-9dea-968a6b4ee8c1
  text: '{n}Несмотря на гулкий речитатив, произносимый техножрецами, мостик кажется непривычно тихим. Звуки, словно брошенные в воду камни, тонут в вязкой тишине.{/n}'
- guid: 68abb4cf-6948-4e3e-b9d5-81c49675e408
  text: '{n}Перед стойкой, уставленной оружием из арсенала блюстителей, увлеченно копаются несколько человек. Первым на ваше появление реагирует рябой здоровяк — резким свистом он привлекает внимание остальных и гаркает:{/n} "А вы кто? Здесь никого быть не долж... А, уже неважно. Назовитесь!"'
- guid: 68d1a1d8-d043-438f-9877-778c35427024
  text: '"Нападешь на мой народ, элантах, и можешь навсегда забыть о нашем союзе". {n}Ирлиэт стискивает камень душ на своей груди.{/n} "Вы, мон-кай, оскверняете все, к чему прикасаетесь".'
- guid: 6932eb21-55aa-49bc-848e-ac3e5e97e6a7
  text: '{n}Маражай бросает на вас обжигающий взгляд. Его губа чуть дергается, словно ваш ответ нарушил какие-то его планы.{/n} "Как скажешь, {name}. Как скажешь".'
- guid: 69e39ac8-bddf-423e-a0fd-976791002716
  text: '"Я не скажу ни слова, пока вы не отпустите моих собратьев с этого мира". {n}Воин расправляет плечи. Сложно сказать, для придания веса словам или просто от усталости.{/n}'
- guid: 6a072f7e-1de5-4edd-9a3b-165454ce16e6
  text: '{n}Инфернусы выглядят обескураженными, но под изумленными гримасами уже проступает праведное возмущение. Огромные, покрытые ожогами кулаки сжимаются, превращаясь в орудия убийства.{/n}'
- guid: 6a428210-d379-4747-bd00-634719093284
  text: '{n}Маражай щелкает языком и качает головой.{/n} "Ты разочаровываешь меня, мон-кай. Я слышал мольбы миллионов душ и проклятия миллиардов жертв. Придумай что-то получше".'
- guid: 6a558d0a-7f83-42f8-8e22-a12e3b456cfe
  text: '{n}Сузив глаза, Соломон задушенно отвечает:{/n} "Поверь, я не горжусь этим заданием".'
- guid: 6a5f7795-8bb5-477b-8030-a15cb2f2b9e0
  text: '{n}Перед вами пугающая картина — несколько гемункулов, совершенно одинаковых на вид, заняты работой. Несколько идентичных и знакомых вам лиц обращают свое холодное, почти безразличное внимание в вашу сторону.{/n}'
- guid: 6ac74ee9-2aa3-4b4b-aabe-280b7f680b0c
  text: '{n}По мундиру Инцендии видно, что его не меняли много дней — воротник засален, а кружево покрыто бледными пятнами пота. В воздухе витает легкий аромат стимулятора, какой дают вдыхать серфам, чтобы они могли трудиться вахту за вахтой.{/n}'
- guid: 6ace0971-2749-4b7c-9d9b-4b42710178a4
  text: '"Нонсенс. Я бы запомнил, если бы в моем дворце..." {n}Неожиданно Себериан останавливается. Он внимательно всматривается в вас, прежде чем заговорить. В искаженном воксом голосе сквозит растерянность.{/n} "Подождите. Пожалуй... пожалуй, я видел вас раньше. Слышал о вас".'
- guid: 6add5488-8815-4ccc-a965-7cee7361279c
  text: '"Я бы заставил их..." {n}Железный кулак сжимается, слышен жалобный скрип аугмента.{/n} "О, они бы не смели и помыслить нарушить закон".'
- guid: 6aea21e3-70b3-4c04-b8a6-8abfead74e2a
  text: '{n}Ахиллеас издает утробный, исполненный ярости крик. Поршни с шипением утопают в его плоти, вгоняя в нее дозу алхимической злобы. Запах приближающегося кровопролития сводит с ума монстра, изготовленного для бойни.{/n}'
- guid: 6b3264e8-2662-419b-9dab-ef4ab84d920c
  text: '"Опрометчивые слова, что будут стоить вам жизни". {n}Старый навигатор сжимает кулак, и вены на его руках вздуваются темнотой, а третий глаз раскрывается.{/n} "Ко мне, защитники Дитя! Исполним свой долг!"'
- guid: 6b4a7d66-9259-454d-a767-0cbb94688495
  text: '{n}Одарив вас равнодушным взглядом напоследок, Смотритель исчезает в зеленой вспышке фазового перехода. Солдаты Крига, пришедшие в движение, поворачивают скрытые противогазами лица в вашу сторону и вскидывают лазружья.{/n}'
- guid: 6b543f26-a732-4de4-ad88-e142ed2b5068
  text: '{n}Худощавый юноша с глазами, скрытыми за святыми рукописями, поправляет аугмент на виске. Заметив вас, он вздрагивает.{/n} "Л-лорд-капитан! Чем могу быть полезен?"'
- guid: 6b5c3963-a3d0-45bf-99a8-6b205e222b88
  text: '{n}Абеляр, сочувственно глядящий на девочку, вдруг прищуривается.{/n} "Как-как ты сказала? Кобры ходят в класс? Ты уверена, что дедушка говорил именно это?"'
- guid: 6b5eaf4b-d478-418e-9656-7d77bda9a154
  text: '{n}Арджента взирает на безвольное хрупкое тельце, на ее лбу появляется мучительная складка.{/n} "Столь хрупкое создание, и сколько веса на ее плечах..."'
- guid: 6b868b7e-5fa1-43a5-bdf2-55d04347b756
  text: '{n}Города-ульи, принявшие беженцев, переполнены рабочей силой — беженцы готовы работать вдвое усерднее прежних работников, истощенных каждодневной потогонкой. Многие из них пошли на службу к Вольному Торговцу: пополнив прореженный экипаж.{/n}'
- guid: 6bd5fe7d-de55-4c73-81d9-47b43e229dd2
  text: '{n} {/n}'
- guid: 6c576c56-5415-49bc-9844-f428bf20a5a6
  text: '{n}Кассия благодарно улыбается вам — впервые столь ослепительно и открыто.{/n} "Благодарю вас, {name}... я имела в виду, Вольный Торговец".'
- guid: 6c733280-2f43-4213-84b7-0e775eca222f
  text: '{n}Похоже, ваш двойник и впрямь всерьез обеспокоен. Он нервно сжимает в кулаке причудливый талисман... Такой же, как подарила вам Ирлиэт на прощание в лесах Кетца Темера.{/n}'
- guid: 6c7e4fd9-c5a3-436a-8703-28a2cccfc1d7
  text: '{n}Вы без труда обходите ограничения, наложенные на священную машину. Перегруженные процессоры когитатора недовольно жужжат.{/n}'
- guid: 6c97daf3-033a-4777-9f79-0ed1dd7a1c80
  text: '"Вот она. Салис Прайм. Место моего поражения... нет, не так! Место испытания, которое мне еще надлежит пройти", {n}— голос Ардженты дрожит от эмоций.{/n}'
- guid: 6d066a9f-cdbd-4ef9-b1c7-0fcfc1f20052
  text: '{n}Янрис Данрок опускает винтовку и стирает испарину шелковым платочком, с трудом запихивает его под тугую ленту патронташа на груди. Поверх золоченого камзола натянут изъязвленный пулями и оплавинами флак-жилет, едва сходящийся на объемной талии. За его спиной радостными криками вас приветствует разношерстный отряд из блюстителей, вооруженных писарей и рабочих. Сидящие чуть поодаль пленники мрачно молчат.{/n}'
- guid: 6d43849b-dfa3-4e24-8775-c6d5c41e2087
  text: '{n}Но техзорцисты Инквизиции, прибывшие на планету, усмирили гнев Механикус и подтвердили правомерность действий Лорд-капитана.{/n}'
- guid: 6de4b094-1249-4913-aebb-c763af34ba95
  text: '{n}Хейнрикс на мгновение сжимает кулаки.{/n} "Это полное безумие, чудовищное, примитивное людоедство. Ради света Его, {name}... Лорд-капитан, остановитесь! Прикажите нанести удар по реактору, пока у нас еще есть такая возможность!"'
- guid: 6df19647-5f38-4489-843d-6ea885e8cfd7
  text: '{n}Старик с фиалковыми глазами виновато склоняет голову.{/n} "Леса, в которых живет этот жрец и его народ, всегда были полны мудрости и жизни. Но огненный дождь, насланный чужаками-из-тьмы одну великую и одну малую луну назад, разгневал духов леса. Этому жрецу нужно отыскать путь домой, в сердце Кетца Темера, и провести ритуал усмирения вместе с племенем. До тех пор духи продолжат страдать и путать тропы. До тех пор... Звездорожденные не смогут вернуться к звездам".'
- guid: 6df2bb39-1a5d-4729-a4d8-b6f3439ed501
  text: '"Я также желаю почтить спасител{mf|я|ьницу} Райкада Минорис и уже отдал приказ о подготовке празднества в вашу честь. Мы отметим победу старинной традицией — триумфом. Вы, как положено {mf|герою|героине}, одержавш{mf|ему|ей} победу над врагами {g|Encyclopedia:Imperium}Империума{/g}, проедете по улицам города в сопровождении почетного караула, с демонстрацией ликующим толпам ваших трофеев. Дайте мне знать, когда завершите дела в системе и будете готовы!" {n}Губернатор Медина просто пылает энтузиазмом.{/n}'
- guid: 6dfc335f-4267-46f3-ba25-524e62dbc588
  text: '{n}Вы закрываете глаза и пытаетесь сосредоточиться, но подступающая тошнота и кровь, стекающая из глаз вместо слез, не дают вам покоя. В раздражении вы поднимаете веки, и новый поток красок врезается в ваш мозг, заставляя опорожнить содержимое желудка.{/n}'
- guid: 6e007f98-dfac-4bd6-bd20-2563c4d52b3a
  text: '{n}Укутанный в алое человек после такого взрыва неизбежно должен был погибнуть. Но он жив — респиратор, закрывающий половину лица, со свистом втягивает воздух.{/n}'
- guid: 6e0da84e-b8ce-4c7b-84c6-b467b5f4895d
  text: '{n}Соломон окидывает поле боя тяжелым взглядом и резко разворачивается к вам.{/n} "Меняем тактику — надо завалить места прибытия подкрепления. Видите противовесы с тросами? Они держат контейнеры в воздухе. Если избавиться от противовесов, контейнеры упадут и перекроют проходы. Кто-то заберется в это подобие танка и будет стрелять по нужным точкам, остальные активируют систему загрузки снарядов через когитаторы и будут сдерживать врагов. Выберите, кто займет танк".'
- guid: 6e3cfd69-b407-4e89-b4c6-68744e0fa0e0
  text: '{n}Эоганн делает какие-то пометки на инфопластине, обращаясь к Паскалю:{/n} "Достойно, коллега. Я выдам свои замечания после разрешения ситуации".'
- guid: 6e5ebc8b-27f4-458a-9f62-cf4ca6fc3508
  text: '{n}Порядки на добывающих комплексах немного смягчились — надзирателям строго указали наносить профилактические побои лишь кулаками и ногами, но не шоковыми дубинками, а наказание за невыработку нормы сменили с жестокой децимации на гуманное лишение пайка. Каторжане возрадовались.{/n}'
- guid: 6e67c8a5-c904-4dde-88f2-ab0e533f41ee
  text: '{n}Голос Кибеллы ломается, и она стискивает зубы, пытаясь сдержать невольные слезы.{/n} "Я не хочу тебя убивать!"'
- guid: 6e85cf5f-8cfc-48fa-b56f-78c5a0c4c628
  text: '{n}Торбальд явился не один, а в сопровождении молодого брата по оружию. Бросив на Ульфара насмешливый взгляд, он зычно произносит:{/n} "Торбальд Железношкурый здесь. Зачем позвал{mf||а} меня, Вольный Торговец?"'
- guid: 6ea28ec2-9528-4acc-bdfa-ebf2aa660f32
  text: '{n}На ритуальной платформе у ног Неумирающего, под пристальным взглядом темных пустых глазниц вы чувствуете себя совершенно незначим{mf|ым|ой}. К удивлению, вязкая кровь, стекающая из рук Его на ваши чело, грудь и плечи, все еще теплая.{/n}'
- guid: 6f0ead4c-0560-43f7-8a6a-c64a21a01b77
  text: '"Не смей смотреть на меня своим проклятым взглядом!" {n}Громогласный рев копии почти оглушает.{/n} "И как только ты, чудовище Дома Орселлио, смогла пережить очищение Эурак-V? Вместе с Фелеком мы сразили твоих безумных последователей и очистили навигаторский дом от скверны. Неужели в этой реальности ты все же одурманила своими еретическими силами мою слабую духом копию? Позор и бесчестье".'
- guid: 6f5154bd-19d7-400a-8f36-ae80d0c7b86c
  text: '"Я часто слышу это слово — "ксенос"... похоже, оно столь же оскорбительно в вашем языке, как "мон-кай" — в нашем". {n}Женщина вздыхает.{/n} "Мы зовем себя {g|Encyclopedia:Asuryani}Детьми Азуриана{/g}. Люди — те, кого судьба толкнула на путь союза с нами — называют нас эльдарами".'
- guid: 6fd701b4-5549-415b-96cc-e2a1018bc410
  text: '"Быть может, я поспешила с выводами о тебе. И вся твоя суть — лишь пустота в цветной оболочке?" {n}Сдержанный выдох срывается с губ эльдарки.{/n} "Предупреждаю, элантах. Еще один намек — и наше понимание ускользнет от тебя".'
- guid: 6fe7725b-6eca-48d6-b3f7-17ec1c778dfa
  text: '{n}В этом взбешенном, буквально кипящем от ярости дикаре вы едва узнаете прежнего, хладнокровного и невозмутимого арбитра. Лицо Соломона перекашивает от кровожадного оскала:{/n} "Я прикончу вас всех до единого! Всех! Где мой пес, выродки? Где он?!"'
- guid: 701c4b20-d181-46f7-9992-b722a466753e
  text: '{n}Вокруг вас — дюжины людей, одетых во что-то, отдаленно напоминающее гвардейскую униформу. Домотканные рубища прикрыты деревянными доспехами, копирующими противоосколочную броню. Многочисленные трофеи — шкуры, кости, куски огромных растений и кора — покрывают их одежды. Дикари щеголяют увечьями и культями, однако у многих они прикрыты примитивными протезами. То и дело кто-то из людей начинает скалиться, словно зверь, или нервно хватается за оружие.{/n}'
- guid: 702853e1-8833-47a8-91d9-2b2f0ffb122d
  text: '{n}Техножрец впивается мехадендритами в техническую ячейку под палубой.{/n} "Эффективность данной методики проверена мной многократно! Слава Омниссии".'
- guid: 70ab0348-ca77-42ab-96f2-f0e1aeb71372
  text: '{n}Кибермастиф лениво зевает, обнажая нешуточный арсенал острых зубов.{/n}'
- guid: 7148f5a7-32c3-48f5-b400-b284eea23a4e
  text: '{n}В изумрудных глазах вспыхивает удивление, и горечь, и растерянность.{/n} "Значит, в ином мире мы тоже шли рука об руку, элантах. И раз сей оберег ты держишь сейчас в руках... мой Путь оборвался раньше твоего".'
- guid: 715f460c-1dd1-49f3-9e2b-24912081ecc7
  text: '{n}Вам с трудом удается распознать в мерзком отродье, кутающемся в лохмотья, человека... точнее, генетическую анафему, чьи предки некогда были людьми. Уродливую внешность мутанта дополняют жуткие шрамы и частично освежеванное лицо.{/n}'
- guid: 71f25b56-9f77-4b35-818e-a44d7443a28a
  text: '"Но вы забываете: в моих руках клинок, которому нет равных!" {n}Себериан сжимает рукоять, обнажает оружие и со свистом рассекает воздух. Тень страха пролегает на лицах членов свиты.{/n} "Я не трус, который прячется за своими людьми. Я — Себериан фон Валанциус, и я поведу вас в бой, чтобы сразить предателя, пошедшего против воли Бога-Императора! Диодас ответит за оскорбление Помазанника Его!"'
- guid: 72147e4d-1bc5-4515-9dcf-eb7de597b5dc
  text: '{n}Ваше сознание выплывает из океана мрака и кошмаров — словно кто-то властной рукой вытащил вас из его глубин. В темном помещении двигаются длинные заостренные тени, перекидывающиеся отрывистыми фразами. Одна из теней приближается к вам, разрывая полог боли и приобретая знакомые черты.{/n}'
- guid: 7244ed9e-ac11-4591-be0d-52852456dce0
  text: '"Утверждение ложно. Этот мир был прекрасен и благословен, пока скверна не исковеркала его..." {n}— даже хрипы вокса техножреца звучат горестно.{/n}'
- guid: 727a9b67-0766-4a9a-a0f2-5d51d4dfd6e2
  text: '{n}Но, собрав в кулак волю, вам удается сохранить невозмутимое выражение лица вместо того, чтобы начать с воем кататься по полу.{/n}'
- guid: 7291385a-77e1-4f51-820b-c7456286ac9c
  text: '{n}Тяжело дыша, хормейстер прикрывает лицо и шепчет:{/n} "Все... кончено, Лорд-капитан. Мы снова в мире из плоти".'
- guid: 72b3cbff-828f-48b4-baf2-7e48da3b0384
  text: '{n}Клеменциа с трудом давит зевок. Дождавшись, когда Янрис Данрок закончит свой отчет, она извлекает на свет инфопластину.{/n} "Благодарю за доклад, Высокий фактотум, ваша работа высоко ценится и нами, и представителями Адептус Администратум. Ваша Светлость, мы почти закончили — осталось еще несколько пунктов повестки, о которых я бы хотела доложить лично".'
- guid: 72b5eff2-6101-4955-b05f-415f606ef0fe
  text: '{n}Вы резко сжимаете ладонь — и отросток с чавканьем разрывается, забрызгивая желто-красной жидкостью все вокруг. Тошнотворный сладковатый запах бьет в нос, и сколько бы вы не пытались смыть его с себя — ничего не выходит.{/n}'
- guid: 72da1aab-6c27-4a40-a3c6-65342748dd91
  text: '"Поверить не могу, что собственными руками отбил ксеноартефакты у одного контрабандиста в пользу другого". {n}Хейнрикс кривит губы, с отвращением осматривая содержимое контейнера.{/n} "Уверен, Вольный Торговец знает, что делает, и к каким последствиям может привести {mf|его|ее} "дружба" с подобными личностями".'
- guid: 7306f8be-2d35-4e60-a719-41003a1b16dd
  text: '{n}Похоже, ваш двойник и впрямь всерьез обеспокоен. Он нервно сжимает в кулаке причудливый талисман... У вас такого нет.{/n}'
- guid: 730e42fa-8479-4dba-b241-b836c06e8a07
  text: '{n}Ведущая-вперед с опаской ступает в руины древнего города своих предков. Старуха машет рукой кому-то за собой, и несклько фигур скрываются в тени деревьев.{/n} "О Звездорожденн{mf|ый|ая}, сегодня Двуглавый Бог-орел смилостивился над нами, даровав вам силы на сокрушение злых духов! Потомки этой правительницы будут воспевать вашу храбрость в веках!"'
- guid: 7329e90b-f514-4963-8e8d-cefc0d924117
  text: '"Позвольте помочь!" {n}Одарив вас опасливым взглядом, Ведка бросается вслед за Себерианом.{/n}'
- guid: 73409936-24ed-4b6b-906b-7bac2fcbf428
  text: '{n}Его душа не тронута варпом. Ваш взор впивается в его душу, губы рабочего шевелятся в беззвучной молитве Императору.{/n}'
- guid: 7369c623-e235-4dd4-a384-3aec543af87a
  text: '{n}Массивный мужчина в униформе офицера губернаторской стражи напряженно наблюдает за подчиненными, окружившими здание. Почувствовав ваше приближение, он резко оборачивается, бледнеет и низко кланяется.{/n} "Ваша Светлость! Прошу, не подходите к дому слишком близко. Там укрылся один из террористов, участвовавших в сегодняшнем нападении. Он может быть опасен".'
- guid: 7383ed00-dd3c-4bd4-a942-50ef188e9f53
  text: '{n}Высокий иссохший старик гордо взирает на вас немигающими мутно-белесыми глазами. Обвисшая кожа свободно колышется при каждом его движении — словно плоть {g|Encyclopedia:Navigator}навигатора{/g} откреплена от его костей. Вместо носа посреди лица регента зияет непроглядная дыра, а лысый череп покрывают шипастые наросты.{/n}'
- guid: 73840b0f-1a80-4309-ad66-d33bf9a13a61
  text: '{n}Едва вы успеваете закончить, как цепи разлетаются на звенья, выбивая дробь на стенах и полу и едва не задевая вас. Орудие медленно поворачивает к вам голову — и останавливается. Прикоснувшись к поверхности машины, вы чувствуете стук оскверненного "сердца" — двигателя, пульсирующего в унисон с вашим сердцебиением.{/n}'
- guid: 738ad77f-b761-4f04-92e7-21cd45774da7
  text: '{n}Инцендия шепчет тихо и страстно:{/n} "Ты не лжешь. Ты сделал меня такой. И я действительно была полна скверны и дурна прежде".'
- guid: 73de0e6e-c057-4d00-8ac3-00039cba61b1
  text: '"Ты никогда не видел подлинной красоты", {n}— сочувственно отзывается Ирлиэт.{/n} "Утешься — этот мир лишь железная скорлупа амбиций мон-кай. Скверна не отняла у Вселенной ничего ценного, когда охватила его".'
- guid: 7408167f-953b-42c3-b545-93fb556364e0
  text: '"У меня ушло пятьдесят лет на то, чтобы понять — Нунциус был обречен как только коснулся артефакта. Все мои поиски спасительной панацеи были не ради него — я делал это ради себя. Я не мог его отпустить и вместо этого убаюкивал совесть лживыми поисками — все, лишь бы избавиться от боли душевной, игнорируя вполне реальные терзания того, кого сам и обрек. Мне пора научиться прощаться". {n}Губы Эоганна трогает печальная улыбка.{/n} "Это — неопровержимый факт".'
- guid: 741f104f-8486-474c-84cd-3a01f5ed3317
  text: '{n}Мужчина, чья голова из-за безобразных ожогов похожа на оплавленный ком воска, выходит вперед. Один его глаз затянут бельмом, но второй смотрит зорко.{/n} "Я слышал шаттл, и вот вы — не десятина, не клерки, а гости с Расколотого Неба. Наш долгожданный шанс".'
- guid: 7442fef0-a622-402f-846c-201754903075
  text: '{n}Рабочий бледнеет и начинает рыдать. Из голоса его пропадают юродство и зловещее кривляние, он лепечет совершенно нормальным голосом:{/n} "Про... простите, Ваша Светлость! Никакой я не Гведон и не еретик! Ярт меня зовут, я — прачечник! Смилостивитесь... У них моя семья! Та блюстительница говорила, что всех в шлюз выкинет, если не сознаюсь! Она меня и знаки эти нечистые нарисовать заставила!"'
- guid: 74668594-0f17-4050-8300-ddc3e94991cf
  text: '"Васкулярные фильтры не справляются... проникающая способность токсина экстремальна... " {n}Грузное тело Эоганна с грохотом падает наземь. Кровь потоками хлещет из носа и глаз манипулуса, но его внимание приковано к безучастно парящему рядом спутнику.{/n} "Нунциус, спасайся..."'
- guid: 7470bbad-ed71-44c5-9c9b-6a83da94d8b2
  text: '{n}Маршал Стракс взирает на префекта с непреклонным выражением.{/n} "...исключено. Я готов разговаривать о разрешении этой ситуации исключительно с Вольным Торговцем. Без посредников".'
- guid: 748c37b6-717c-4d3c-aff9-07eda8f52cf7
  text: '{n}Биомеханическая тварь слабо сучит конечностями. Ее тело изломано и покрыто следами битвы, но, похоже, никто не собирается его ремонтировать. Под треснувшим панцирем видно блестящее мясо, пронизанное жгутами проводов. Бронепластины тяжело вздымаются, и существо издает тоскливый, исполненный сожаления скрип-вздох.{/n}'
- guid: 74b6fc3b-7b29-4e95-a15d-90e09fcd43c9
  text: '{n}Ирлиэт успевает повернуться к вам...{/n} "Что..." {n}...и тут же оседает на землю, схватившись за шею.{/n}'
- guid: 74d9c60c-e43e-4dcf-8293-fd61be4dec42
  text: '{n}Вокс-решетка Мастера Двигателей издает звонкую двоичную фразу, в которой звучит благодарность. Она вновь почтительно склоняет голову.{/n}'
- guid: 74dbca9f-7dd4-4698-8fdd-1ade4bc739b4
  text: '{n}Троица с сомнением переглядывается. Один из простолюдинов неловко улыбается, заметив ваш взгляд.{/n}'
- guid: 74ecd0ec-d47b-448d-a6ec-a214c4b7366d
  text: '{n}Толпа, чье внимание поглощено развлечением, обращает взгляды к вам, и на лицах возникает благоговейный ужас. Многие начинают шептать молитвы.{/n}'
- guid: 752eb59c-2ab8-40c9-8911-768e7f6549b8
  text: '{n}Пилот в мятой униформе, украшенной гербом фон Валанциус, все еще бледна. На белых ладонях алеют отметины от штурвала. Вы помните ее испуганный вопль, раздавшийся, когда снаряд пролетел совсем рядом с вашим шаттлом.{/n}'
- guid: 75613516-29cc-40d1-8e84-421ada2b6f00
  text: '{n}Тело дородного мужчины испещрено {g|Encyclopedia:Augmentation}имплантами{/g}. С полудюжины можно увидеть невооруженным взглядом, а грубые следы швов на открытых участках кожи указывают, что внутри имплантов еще больше. Движется он, однако, с небывалым проворством, распахивая руки вам навстречу в жесте приветствия.{/n}'
- guid: 756b8e32-ef46-4758-a44f-79b04809d463
  text: '{n}На мгновение ваше дыхание сбивается и в глазах темнеет — {d|Encyclopedia:CharGen_DH_Torture}призраки невыносимой боли{/d} овладевают вами. Во взгляде Соломона мелькает понимание, и он умолкает, давая вам время перевести дух.{/n}'
- guid: 7592d54f-ceea-4476-9f01-1b47fe0f1ce2
  text: '{n}Паскаль торжественно чеканит, сопровождая каждое слово бинарными командами:{/n} "Словом первым своим данная единица сообщает, что угроза безопасности высшего обсерваториума отсутствует. Словом вторым своим данная единица повелевает восстановить работу лифтовой системы. Словом третьим своим данная единица подтверждает свое право отдать сей приказ".'
- guid: 75af5d9b-1ffb-4f27-baaf-2480a61be5a9
  text: '"Вы... тоже мне нравитесь, {name}". {n}С придыханием отвечает Кассия, нежно сжимая вашу ладонь.{/n} "И я боюсь этого. Но не хочу... Не хочу отказываться от этого".'
- guid: 75f5dd3d-5a35-42ad-8cc4-2e61ea8b9a46
  text: '{n}Крепкий мужчина с аугментированной челюстью вытягивается в струну. Под его глазами глубокие темные круги от хронического недосыпа, но голос звучит громко и бодро.{/n} "Приветствую вас в отсеке транспортно-грузового узла НП-987/А14, Лорд-капитан! Докладываю: Эддок Френзо, капитан блюстителей отсека НП-А14 нижних палуб, назначен Мастером дисциплины консультантом Вольного Торговца на время вашего здесь пребывания".'
- guid: 760ac3ac-21e9-4c52-ba64-bbaff3a6df4e
  text: '"Вольный Торговец!" {n} — знакомый голос приветствует вас, но сколько же в нем незнакомого!{/n}'
- guid: 76527235-cda0-4c64-9c93-3a2c3faa137b
  text: '{n}Несколько простолюдинов переговариваются громким шепотом, не замечая вас. Стоящий к вам спиной стриженный под горшок с проплешинами мужчина активно жестикулирует.{/n} "Вот уж не думал, что при жизни такое случится! Нов{rt_mf|ый|ая} Звездн{rt_mf|ый|ая} Госпо{rt_mf|дин|жа} прибыл{rt_mf||а}! Говорят, спустил{rt_mf|ся|ась} с небес на огромной железной птице, выш{rt_mf|ел|ла} из ее нутра в золотом доспехе и все, кто видел {rt_mf|его|ее}, ослепли от благолепия. А как иначе? То помазанни{rt_mf|к|ца} Его!"'
- guid: 76b2bfec-04b9-4a8b-a617-df179c70a6d5
  text: '{n}Помедлив, ваш двойник веско отвечает:{/n} "Достойная".'
- guid: 773bbe51-597d-4384-977e-f477b5d98a69
  text: '"Да-да, о почтенная дамаар, давай уже сюда грамоту, да поскорее!" {n}Джай пробегает глазами по Меркатум Табула Официале и заливается смехом.{/n} "Слава Великому, что позволил пережить все мучения, шерин! Да о таком можно внукам рассказывать — простая смертная и стала торговым представителем Империума! Не будем более докучать дамаар, шерин. Почему бы нам не обсудить дальнейшие планы на корабле?"'
- guid: 77509ea6-8139-453c-8121-dfe8e6e63ce4
  text: '{n}Молодая женщина смотрит на вас во все глаза, нервно оправляя форму.{/n} "Ваша... Светлость? Прошу прощения, если обращаюсь к вам не по чину! Вы прибыли от губернатора Медины или просто по делам? Если второе — вам следует знать, что в местной тюрьме мятеж, тут весьма опасно!"'
- guid: 779bd0fb-3fd4-4308-beff-f412ec145ae6
  text: '{n}Старуха пожимает плечами.{/n} "Боюсь, пока обряд Магнэ Ацессио не будет проведен, {g|Encyclopedia:AdeptusAdministratum}Адептус Администратум{/g} не может официально считать вас Вольным Торговцем. Во этом дворце никто вам не скажет иного, даже если на моем месте будет другой Мастер Печатей".'
- guid: 77be8d33-290b-43bd-8f9c-33150c674521
  text: '{n}Янрис Данрок, щеголяющий ранее вами не виданной кобурой с авторужьем, откашливается, прежде чем начать.{/n} "Имею честь доложить, Лорд-капитан: нападение на судно отбито, палубы очищены от посторонних, прорехи в корпусе устранены или находятся в процессе устранения. Высокие гости желают поздравить вас с победой".'
- guid: 77cf9f17-3d44-498a-8e32-f0d98eb3aaee
  text: '{n}Инквизитор исчезает во вспышке телепортации. Какой-то умелец удивительно точно рассчитал координаты, забрав его прямо из ваших покоев. В воцарившейся тишине слышится бессвязное ворчание церемониймейстера, видящего тревожный сон.{/n}'
- guid: 77d175bb-c79c-4765-a70f-3ab5194d7479
  text: '{n}Вистенца сжимает бледнеющие губы.{/n} "Я полагаю, что у вас были весомые основания поступить именно так..."'
- guid: 780e403e-8dce-4fdb-a428-78df7c6608f9
  text: '{n}Ирлиэт взирает на мужчину сверху вниз, но голос ее звучит чуть мягче обычного.{/n} "Ты узрел подлинный лик вашего мира — уродливый, жестокий, лживый. Но боль, которую ты чувствуешь — это еще не конец. У тебя есть выбор. Даже сейчас. Даже... здесь".'
- guid: 782aa063-b7ce-4cf6-a35d-c96f7f39fca4
  text: '{n}Кибелла одной рукой тянется к оружию, а другой пытается дать телу хоть какую-то опору.{/n} "Неужели дурман... может... меня..."'
- guid: 786a012e-ee60-4c9e-bdc9-bcb7fdb398f1
  text: '{n}Спустя несколько часов поисков старшего офицера доставляют на борт в почти бессознательном состоянии. Память о событиях прошедшего дня полностью покинула изможденный разум, однако врачеватели отметили, что некоторые функции тела... удивительным образом подверглись пускай и едва заметным, но необъяснимым метаморфозам. Навсегда или нет — покажет лишь время.{/n}'
- guid: 78af631f-5ac8-4685-b014-5d085264e9de
  text: '{n}Космодесантник Хаоса возвышается над склонившими головы {g|Encyclopedia:TechPriest}техножрецами{/g} словно мрачная скала. Гигант неторопливо, почти нараспев читает проповедь. От одного звука его глубокого низкого голоса вас бросает в липкий пот, а к горлу подкатывает тошнота.{/n}'
- guid: 78d3ba6a-1442-4401-9655-e3e64558b1d3
  text: '"Меня нельзя судить". {n}Кибелла едва шепчет, но слышит ее каждый. Она поднимает мертвенно-бледное лицо. Кажется, будто она спит с открытыми глазами.{/n} "Нет суда, который вправе судить ткача Смерти".'
- guid: 78e97466-c039-49ca-982c-0e1434349567
  text: '{n}Процессия, состоящая из {g|Encyclopedia:TechPriest}техножрецов{/g} и аугментированных офицеров, замирает на расстоянии десятка шагов от вашего трона. Вперед степенно выступает техножрица, чья роба отмечена высокими знаками отличия — в этой фигуре вы сразу же узнаете Мастера двигателя. Ее искаженный вокс-ретранслятором голос торжественно гремит под сводами палубы.{/n}'
- guid: 792daa24-55f3-4830-abbd-ae098f199d5b
  text: '{n}Голос монстра, рычащий и хлюпающий, звучит странно знакомо.{/n}'
- guid: 7977beb8-7872-4990-ae25-0b3b9e5c6f0c
  text: '{n}Чешуйчатый ксенос ведет неспешный разговор с изможденной друкари.{/n}'
- guid: 79924519-7633-477f-8c00-e2b87ffeaa0d
  text: '"Кто это с тобой? Блюститель и ткач?! Ты смерти моей захотел?! Если кто увидит, что я с вами болтаю, мне шею свернут! Уходите". {n}Торговец словами трепещет от страха за свою жизнь. Нужно извлечь из него ответы. Но как именно?{/n}'
- guid: 7a1136a2-5874-4516-83a3-a8b335f1fabf
  text: '{n}План магоса Ханейманна был составлен с беспощадным логическим совершенством, взвешивающим эффективность и уровень потерь. Малые группы приносились в жертву ради сбережения сил крупных отрядов.{/n}'
- guid: 7a73ecad-4ac5-4643-acb1-a588576422a2
  text: '{n}На Дунавски больно смотреть — взгляд ее стал рассеян, а сама она выглядит потерянной.{/n}'
- guid: 7a96948e-677f-4484-8865-a4462c9ed47a
  text: '{n}Лицо женщины, стоящей перед вами, скрыто гротескной зарешеченной маской. Но голос, льющийся из-под нее, принадлежит кому-то другому — хриплый, мрачный бас пустотного волка-абордажника.{/n} "Как предсказуем и статичен твой путь. Ты избежал{mf||а} столько вариантов собственной погибели лишь для того, чтобы сгинуть в пламенной буре здесь, когда случится Последний восход".'
- guid: 7b1f3b93-6601-445d-bfea-8d91341f4061
  text: '{n}Капитану требуется секунда, чтобы совладать с недоумением.{/n} "Приказ... ясен".'
- guid: 7b575e47-16cb-4c84-aae8-f04d56193f4d
  text: '{n}Инфернус-мастер весело салютует папиросой.{/n} "Лорд-капитан, вот так встреча! Что привело вас в этот отсек, знаменитая кухня и роскошные виды?"'
- guid: 7b5782cb-213c-484b-a65a-3eff9a3c327d
  text: '{n}Простушка тоскливо смотрит на дверь и кивает.{/n}'
- guid: 7b9eeaea-ab2a-4973-8c78-ff3d891fdb15
  text: '"Когда совпадений слишком много, это уже закономерность." {n}Лария некоторое время молчит, вновь взвешивая в уме найденные улики.{/n} "Значит, отпрыск Гапраков был убит, как челядь. И это произошло под сенью дворца фон Валанциусов. Нам нужно имя убийцы. Найдите виновного, и я назову вас соратником."'
- guid: 7cb2a91e-3a21-4611-98da-b4ea3c561ae6
  text: '"Прекрасно понимаю Вашу Светлость! Кому нужны незадачливые спутники? Но с другой стороны, если вы вернете господина Антара в свиту, это укрепит ваш союз с Арбитес". {n}Янрис прокашливается.{/n} "Насколько я знаю, маршал весьма ценит своего бывшего проктора, да и будь он действительно виновен, его бы казнили. Кажется, это некий деликатный случай, как те, что вы разбирали во Дворце Правосудия. Проявите участие, и Арбитес будут доверять вам как и прежде".'
- guid: 7cbcde9f-3b30-4497-b7ed-f543c05aac39
  text: '{n}Мастер вокса молча ожидает вашего решения.{/n}'
- guid: 7cf718c5-20a6-455c-9b62-c812f947ca0f
  text: '{n}В воронке, оставленной упавшим снарядом, проглядывает часть неведомого механизма. Темный цельный металл, иссеченный изумрудными глифами, блестит из-под грязи словно оголенные внутренности смертельно раненного зверя. По поверхности беспрестанно скользят зеленые отблески — с пугающей, безупречной последовательностью, словно каждое мгновение незримые духи ксеномашины проверяют свое вместилище и пытаются залечить тяжелые раны.{/n}'
- guid: 7d5ba623-9281-4630-bf84-f9abdbc03f1e
  text: '{n}Нож обновляет обеты, вычерченные на моей коже. Не боль, но тень воспоминания о ней — ибо я не ведаю больше боли, — очищает разум.{/n}'
- guid: 7da818e2-4944-45a5-b1a8-28bba6213fae
  text: '{n}Поджав тонкие губы, капитан бросает на вас испепеляющий взгляд и молча уходит, чеканя каждый шаг.{/n}'
- guid: 7e234d67-0db4-4e97-8dd8-62173f9a21f5
  text: '"Сколько же красных всполохов вырвалось из твоего сердца, Ирлиэт". {n}Взгляд Кассии полон жалости к эльдарке.{/n} "У меня не было намерений вредить тебе и твоим собратьям. Но если ты жаждешь моей смерти — без боя я не подставлю свою шею под меч".'
- guid: 7e31b646-92ad-490c-8dc9-ce4b3f7aa8e7
  text: '{n}Ваших знаний о священных технологиях недостаточно, чтобы обойти верного стража когитатора — его {g|Encyclopedia:MachineSpirit}машинного духа{/g}. Как вы не пытаетесь добиться своего, система остается неприступной.{/n}'
- guid: 7e886eda-9325-4f6e-89b0-4776fc4d680d
  text: '{n}Маражай прислушивается к вам. На его лице, прежде перекошенном оскалом, начинает появляться другое выражение — уже знакомая вам кривая ухмылка.{/n}'
- guid: 7ef03b5e-ffe6-415a-a9f4-0e906b489bdb
  text: '{n}Мужчина поднимает голову, и вы видите лицо, шрамы на котором складываются в святую {g|Encyclopedia:Aquila}аквилу{/g}. Шелестящий голос произносит:{/n} "Я здесь, чтобы служить, Домин''{name}".'
- guid: 7f6056a0-7a2b-48dc-a487-e695c10d5e62
  text: '{n}Воздух в помещении пронизывает дикая смесь из машинных и биологических миазмов. Кровь, ржавчина, рвота, машинное масло, экскременты, керосин — все запахи смешиваются в такой густой смрад, что он кажется почти осязаемым.{/n}'
- guid: 7fa6fbb9-7a67-4a35-a8d7-61a361868572
  text: '{n}Парень раздосадованно косится на зверька.{/n} "Правду молвит народ. Сила великих в умениях их сподвижников".'
- guid: 7fcfe8f4-8cda-400c-b500-ad38a58f8818
  text: '"Кальдерон," {n}— регент неопределенно машет в сторону своих людей, —{/n} "с сего момента связан с вами новым контрактом от имени Дома Орселлио".'
- guid: 8006a013-bc9a-44d4-b996-d06a7dde37ed
  text: '{n}Повернувшись к Ирлиэт, Волк со смехом добавляет:{/n} "Слыхала? Мы вырезали твое гнусное племя!"'
- guid: 8053c935-dd41-4c3e-ba42-998e3e57cd06
  text: '{n}Себериан неподвижно взирает на опустевшее ложе Патента, его аугментированные легкие не производят ни единого вдоха — он словно превратился в статую. В священных палатах царит могильная тишина, нарушаемая лишь гудением сервоприводов в аугментах древнего Лорд-капитана.{/n}'
- guid: 8065294a-c325-4ec7-ab21-bafaef46438d
  text: '{n}Эдитка затравленно смотрит на вас, ожидая вердикта.{/n}'
- guid: 807053c7-b564-4b0e-9622-1bc44ee29bfa
  text: '"Не вздумай сдаваться — борись!" {n}Лицо Соломона искажает не то мука, не то отчаяние.{/n} "Ты лучший техножрец, которого я знаю — ты не можешь вот так... В конце концов, кому кроме тебя я могу доверить Глейто? Ксеносы тоже добрались до него".'
- guid: 80998a75-e07d-4164-86f4-be2da0b0cdfa
  text: '"Д-дом Орселлио всегда был верен новатору Тисифоне. И отныне — верен ее наследнице, пусть даже вы поведете нас иным путем, моя госпожа!" {n}Голос Леди-Навигатора благоговейно дрожит.{/n}'
- guid: 81255c58-8033-4539-b650-658197a4641a
  text: '{n}Выражение лица Маражая неуловимо меняется — в глазах появляется голодная злоба. Ирлиэт слишком поздно замечает тревожный знак — и успевает только отшатнуться, когда клинок со свистом рассекает воздух. Эльдарка едва сдерживает вскрик, хватаясь за глубокую рану — но отступает лишь на пядь.{/n}'
- guid: 8126b5d2-2385-4753-b7d6-429a9e2e9be9
  text: '{n}В висках начинает колотить, к горлу подкатывает тошнота — знакомые ощущения предваряют появление черного водоворота вокруг вас и высокой фигуры, ступающей сквозь пепел и дым вам навстречу. Уралон скрещивает руки на груди и разглядывает вас с брезгливым интересом.{/n}'
- guid: 81457d8a-1087-4e38-9b83-82509f86e72b
  text: '{n}Вам навстречу выходят трое аристократов в сопровождении блюстителей. Их возглавляет мужчина в мундире цветов династии фон Валанциус. Есть что-то неуловимо знакомое в уцелевшем куске лица — остальная плоть незнакомца сменена имплантами, превратившими человека в жуткое подобие оного. Аристократ с подозрением прищуривается, водянисто-голубой глаз скрывается под темными ресницами. До ваших ушей доносится шипение сервоприводов и скрип металла о металл, когда аристократ словно бы невзначай кладет аугментированные пальцы на эфес меча — явно имеющего ксенопроисхождение.{/n}'
- guid: 81a99d85-19db-4b2f-9ff2-4688733daa72
  text: '{n}Странное порождение ксеносской магии источает мерцающее сияние. Ваша надежда увидеть по ту сторону палубу родного корабля не оправдывается — вы видите лишь водоворот потусторонней энергии.{/n}'
- guid: 82cf0127-2c90-4659-8854-91b47008200b
  text: '"Даже не думай". {n}Ювенна слегка качает головой.{/n} "Я не стану посвящать в свои планы того, кто присвоил себе титул мертвеца, чтобы сунуть нос в чужие секреты".'
- guid: 82f3e069-0b2e-4851-8ae6-42442592a118
  text: '"Испытание? Это доброе дело. Не только, чтобы себя закалить, но и чтобы понять, что за племя у кровавой весталки". {n}Ульфар задумчиво гладит бороду, глядя на культистку смерти.{/n}'
- guid: 82ffa11c-accb-4407-81f9-7ee2cf5e7ba4
  text: '{n}Из вокса Вигдис доносится едва слышный смешок.{/n} "Вам ли не знать, Лорд-капитан? Мы оба родились и выросли в холодной темноте космоса. Однако не бывает двух одинаковых историй, как не бывает двух идентичных звезд. Если пожелаете, я с удовольствием поведаю вам о жизни пустотнорожденных этого корабля".'
- guid: 83042c47-a553-4331-9798-1f7b302b8c41
  text: '"Запрос... отклонен... с благодарностью". {n}Паскаль хрипит, но вздевает руку в жесте отрицания.{/n} "Данный... инцидент... классифицируется как акт техномученичества. Постулаты Омниссии отвергают возможность вмешательства извне. Очищение должен произвести я сам". {n}Вокс техножреца издает захлебывающийся звук.{/n}'
- guid: 838a31ad-17a9-469c-8f5d-4c15b9492a59
  text: '"{mf|Господин|Госпожа} фон Валанциус, мои приветствия! Да пребудет свет предвечной {g|Encyclopedia:HolyTerra}Терры{/g}!" {n}Молодой человек отвешивает вам безупречно учтивый поклон. Затем выпрямляется и смотрит прямо — без вызова, но со спокойной уверенностью, как смотрят только на равных.{/n} "Эвейн Винтерскейл, младший сын Каллигоса Винтерскейла. К вашим услугам".'
- guid: 83c474d7-e09e-4581-907c-a5f0504ca6cc
  text: '{n}Висирь отвлекается на пустоту слева от себя.{/n}'
- guid: 83dea76f-e284-48b1-a8a3-a70bcf99094e
  text: '{n}Рослый мужчина, встречавший вас у входа, переминается с ноги на ногу, то и дело мрачно озираясь.{/n}'
- guid: 83ee4266-e6d8-49bf-b64a-401ea0ec6024
  text: '{n}Янур смотрит вам в глаза, изувеченная часть его лица странно дергается.{/n} "Что ж, тогда — удачной охоты, даже если она станет последней".'
- guid: 847eaed3-8c11-46e8-b5b5-41e5ca62c66b
  text: '{n}Плавные, музыкальные интонации аристократки звучат знакомо. Именно этот голос звучал в вокс-станции мертвой сороритки, найденной вами снаружи. Наследница династии ведет двойную игру, связываясь с Инквизицией под позывным "Элана". {/n}'
- guid: 848bb92a-4c82-4be5-a1e0-923f7f75e873
  text: '"Вольный Торговец. Какая долгожданная встреча". {n}Вы едва видите через марево боли, однако голос ксеноса, разорившего ваш столичный мир, вы все еще хорошо помните. Лицо Маражая скрывает шлем, однако тон не оставляет ни единого сомнения в глумливой улыбке за забралом.{/n}'
- guid: 84c0aff4-b214-4143-a0c6-ed6809bc97e2
  text: '{n}Изящно одетая дворянка в роскошном шелковом платье выжидательно смотрит на вас, а затем с достоинством склоняет голову. На ее руках и шее проступают инкрустированные драгоценностями импланты.{/n}'
- guid: 84e553bf-fc38-426b-858f-c1449cb3ba7b
  text: '{n}Кибелла склоняет голову в коротком приветствии. Ее глаза, кажется, светятся от нетерпения.{/n} "Под этими сводами, под призрачными взглядами усопших, в краю, очищенном нашими деяниями от скверны... я зову тебя в путь, что зовется ритуалом обретения света".'
- guid: 85050fd8-90cb-4db5-86b6-dc3deaa121a5
  text: '{n}Обрюзгший мужчина в потрепанной одежде грустно вздыхает над стаканом мутного пойла. Только когда он поднимает взгляд на вас, становится видно, какие у него большие, внимательные и очень печальные глаза, резко контрастирующие с неопрятным внешним видом.{/n} "Неужели кто-то хочет составить мне компанию?"'
- guid: 85192d4a-3cbf-4bb9-a67a-a3d89de80f52
  text: '{n}Из-за толстого листа металла доносится стук каких-то упавших предметов и злое шипение:{/n} "Тише! Да тише же! Пока нас не нашли!"'
- guid: 854645b2-519d-427c-bc4b-bfb84095aa70
  text: '{n}Среди дворян одни оцепенели от ужаса, другие впали в отчаяние. На земле, раскинув руки, лежат два трупа. Под первым чернеет лужа крови. Черепная коробка второго расколота, словно орех. Вокруг — розовато-алый нимб из обломков кости и ошметков мозга.{/n}'
- guid: 85479d93-ef73-4d9f-93ea-25edb91729fc
  text: '{n}Как только вы отходите в сторону, к месту происшествия поспешно кидаются стражники.{/n}'
- guid: 858dcdfc-4b0a-4c12-8e69-2f7ed3a3cb31
  text: '{n}Аустериус задумывается.{/n} "Простор Коронус — окраина Империума... во многом — дикий край, где расстояния между населенными мирами велики, а пустота между ними полна опасностей. И речь не только о врагах Человечества — здесь предостаточно пустотных аномалий и варп-возмущений, способных уничтожить даже испытанное временем судно".'
- guid: 861cacae-7f59-4c38-9776-232d47404c40
  text: '{n}Паскаль запрокидывает голову, и мощь, переполнявшая его голос, выплескивается вовне. Голос техножреца гремит на весь корабль, подхваченный каждым вокс-динамиком каждой палубы.{/n} "Взглянув в водоворот времен, узрел я темные знаки. Узрел я, что пребываю с техносоратниками своими в плену Цикла, что спиралью уходит в точку небытия. Узрел я неизбежную траекторию гибели и восстал против нее".'
- guid: 862b93f8-258b-427d-8149-c311ff83cf36
  text: '{n}Вокс Паскаля разрывает гневный треск.{/n} "Данные приняты к сведению. Вероятность полного успеха не повышена, но увеличена мотивация единицы вернуться к функционированию и исправить богохульство трет... Нет, второй категории!"'
- guid: 86429255-3f6b-45dd-9351-7a08b0918982
  text: '{n}Бросив напоследок полный ненависти взгляд, мутант спешит убраться. Уходя, он шипит сквозь зубы настолько знакомые бранные словечки, что на мгновение вам кажется, будто вы — дома, в Просторе Коронус.{/n}'
- guid: 8654809f-b5fd-4641-8791-fe6246f6167f
  text: '{n}Мысли о Домин подкрадываются в тенях и прыгают на мой сосредоточенный разум, словно хищная тварь. Вцепляются в него, лишают концентрации. Почему?! Я не должна думать... о {rt_mf|нем|ней}! Не должна хотеть, чтобы он{rt_mf||а} был{rt_mf||а} сейчас рядом!{/n}'
- guid: 8684b06e-2438-4bbd-bb1f-5f1eea4a2def
  text: '"В завещании наследником указан Фиделио, но..." {n}Капеллан вынимает из сумы внушительный свиток и рвет на клочки.{/n} "Денз всю жизнь плевал на законы, думаю, он бы понял".'
- guid: 86b26a19-4db4-42ac-a5c5-5c705f4234b3
  text: '{n}Все скелетообразное тело ксеноса состоит из незнакомого металла, пронизанного токами зеленовато подсвеченных энергетических каналов. Ниже пояса гудят и дребезжат раструбы грави-платформы, верхние конечности перерастают в устрашающее тяжелое орудие. Ни одна деталь в теле чудовища не кажется уязвимой. Вне всякого сомнения, это технически превосходная машина для истребления всего живого, и вывести ее из строя будет непросто.{/n}'
- guid: 86f6fa40-2f46-42c5-81af-6918a07f7fa6
  text: '{n}На троне восседает ваша точная копия, зловещий двойник, выползший в реальность из зазеркалья. {mf|Его|Ее} глаза встречаются с вашими, и мир начинает резко расширяться, одновременно придавливая вас неподъемным ощущением собственной ничтожности. Откуда-то издалека, через толщу миллионов световых лет, сквозь эти глаза на вас взирает бог. Он видит вас и он голоден. Неутолимо, неуемно голоден.{/n}'
- guid: 87072e45-d744-4d38-b85b-31fa1b2c66b4
  text: '{n}Немного подумав, Кассия согласно кивает.{/n} "Быть может, я потеряю свой шанс на свободу. Пусть так. Зато разум и силы останутся мне подвластны. Безумцам не место в Империуме. Безумным навигаторам... тем более".'
- guid: 87ad995b-003c-4175-9bd3-ff3d08dc7634
  text: '{n}Кассия облегченно выдыхает, но тут же взгляд ее рубиновых глаз мрачнеет.{/n} "Представители Дома продолжают следить за мной. И ренегаты, и верноподданные. Не думаю, что кто-то из них согласится на временное перемирие, дабы вместе узреть истину о зарождении Атласа. А я... не хочу, чтобы Дом Орселлио потерял еще хоть кого-то в очередной братоубийственной стычке. Нет. За ответами о прошлом я отправлюсь сама".'
- guid: 87c5f976-32d4-4ad1-aef6-77c8c257d871
  text: '{n}Идира смотрит на вас безумными глазами, держась за раны на голове. Сначала она только шевелит губами, затем хрипло откашливается и шепчет.{/n} "Лорд-капитан, это... действительно ты?"'
- guid: 885b689e-77fe-4ba1-b748-e0693b7c559f
  text: '"Вставай, Торра! Ну же, кассха проклятая, поднимайся!" {n}Джай трясет за плечи выжившую близняшку.{/n}'
- guid: 88741b49-e946-43a7-8b1d-d2da2ff68e86
  text: '{n}Медина с облегчением выдыхает.{/n} "Сударыня, вы, наверное, просто перенервничали. Со всей этой пальбой вокруг, безумными калеками и мятежниками неудивительно, что у вас в глазах потемнело. Ничего, развеетесь слегка на празднике и будете как новенькая!"'
- guid: 88822778-fa07-48b3-a491-a00feb3c5561
  text: '{n}На губах гемункула играет садистическая улыбка.{/n} "Хорошо. Интересно, какой психологический эффект окажет весть о твоем решении на... оставшиеся образцы".'
- guid: 889cbd70-382e-421f-ad47-3487a132d573
  text: '{n}Инцендия Чорда погружена в изучение длинного пергамента. В левой руке она держит серебряную ложечку, которой аккуратно зачерпывает мозговое вещество из вскрытого черепа скорчившегося возле нее человека.{/n} "{name} фон Валанциус, мне докладывали о твоем прибытии".'
- guid: 891f8f55-2395-4ea2-8c94-672eb655f962
  text: '{n}В громоздкой фигуре рядом с вивисектором с трудом можно узнать генетора Ферренца. Перемотанный бинтами и заклеенный печатями чистоты, он выглядит неожиданно хрупким для отринувшего плоть техножреца. Покачиваясь и скрипя чем-то внутри, генетор склоняется перед вами.{/n}'
- guid: 893b36fd-02b0-48ac-a8ac-a1930289174c
  text: '"Было близко, Ваша Светлость! Попробуете еще раз... или закончим?" {n}Что-то в улыбке флейтиста заставляет усомниться, что в эту игру можно победить. И ее хозяин, кажется, не пытается этого скрыть.{/n}'
- guid: 893c4352-160b-4d35-943b-bb102ab4596e
  text: '"В минуты горестей слабые духом подменяют путеводный свет на огонь отчаяния... Все мы бежали от умерщвляющей хватки холода и кары Его — Кошмаров и Мороков. Однако когда голод начал сводить с ума, некоторые..." {n}— Старейшина едва заметно косится на юношу и несмело продолжает, —{/n} "предпочли поддаться внутреннему зверю, а не вверить жизни воле Вековечного".'
- guid: 89826ef5-d69a-41ed-ab00-915a0120e7dd
  text: '{n}Обезображенное ожогом лицо Янура сияет улыбкой, а на броне появилось еще несколько пробоин.{/n} "Ваша Светлость, наступление отбито!"'
- guid: 898a5eb3-bccd-4b40-b264-9c0f1b047fad
  text: '{n}Что-то щелкает внутри сферы, к добру или к худу.{/n}'
- guid: 89928c12-9c22-4d2e-9624-1b6e5acfcb2d
  text: '{n}Сначала Каллигос лишь безразлично пожимает плечами, однако, внимательно изучив своих спутников, он удивленно вскидывает брови — похоже, Вольный Торговец только сейчас отметил справедливость ваших слов.{/n}'
- guid: 89b49238-626d-405a-aa12-45e0cdf0013a
  text: '"Ты — мо{mf|й|я} Домин. Я — твой клинок. Острота моя в благословении твоем. Руки мои крепки, пока крепка воля твоя. Поступь моя неслышна, пока Неумирающий внемлет твоим молитвам". {n}Лезвие целует ладонь культистки, и темная кровь растекается по дну ритуальной чарки, возникшей в ее руках.{/n}'
- guid: 89bd81bd-5cde-41c3-8be3-a2d8bb1c04ac
  text: '{n}{d|Encyclopedia:CharGen_Navy}С вашим опытом{/d} не составляет ни малейшего труда понять по стандартной нашивке, что этот человек — с одной из средних палуб, не имеющей никакого отношения к этому месту.{/n}'
- guid: 89d726f2-559c-4ad7-9ce2-c715ad61cf28
  text: '"Хороший же я план составил — под стать себе, малодушному глупцу". {n}Гнев исчезает из его голоса, уступая место раскаянию.{/n} "Но теперь я вижу свои ошибки, и вы... Не отступились. Не позволили мне бесславно окончить свои дни. Значит, я еще чего-то стою".'
- guid: 8a19a885-7e09-45e1-8db6-12bde10b2ba4
  text: '{n}Хейнрикс медлит еще мгновение — и его руки {d|Encyclopedia:CompHeinrix_Rough}ложатся на рубильники{/d} когитатора.{/n} "Я ускорю процесс. Так, чтобы все закончилось как можно быстрее".'
- guid: 8a39f09e-949f-4fe1-8895-5326f32b98c0
  text: '{n}Ваш взгляд пронзает пиратку насквозь, и вы чувствуете — груз ее грехов настолько тяжек, что вскоре утащит ее за собой на самое дно. Страх позволил зловредным когтям чужой воли вцепиться в ее душу, и они медленно раздирают ее на части.{/n}'
- guid: 8a53d63e-e7c4-4066-b008-513f7e781b38
  text: '{n}Вы почти уверены, что в процессе взлома повредили внутреннюю структуру когитатора. Нарушения могут привести к коллапсу всей системы, а значит, вам следует поторопиться.{/n}'
- guid: 8a6b245d-1077-4d36-a71e-f8bc34d4f29f
  text: '{n}Покрытый с головы до ног собственной и друкарской кровью, Ахиллеас Скаландр загнанно озирается по сторонам. Сконцентрировав, наконец, взгляд на вас, он едва слышно выдыхает:{/n} "Да охранит меня Бог-Император... неужели... это и правда вы, Ваша Светлость?.." {n}Он мучительно закашливается, не найдя на золотой цепочке свой респиратор.{/n}'
- guid: 8a9173f1-08e7-410c-8553-5422a7580209
  text: '{n}Друкари — длинные черные плети, кажущиеся чем-то инородным на фоне ущелья — приходят в движение при вашем появлении. Один за другим, воины кабала Опустошительной бури поворачиваются к вам — вы почти физически ощущаете на себе их взгляды. Удивительно, но никто из них не поднимает оружие.{/n}'
- guid: 8ac4e425-bbdf-43f9-a4a8-713b1d3c057e
  text: '{n}Воспользовавшись хитростью друкари, меровцы привлекали внимание отрядов ксеносов и вели их навстречу сородичам из враждебной фракции. Образующиеся стычки помогли значительно проредить ряды ксеносов, после чего остатки были оттеснены к руинам, где их уже поджидала в засаде передовая группа. Враг был взят в клещи и истреблен.{/n}'
- guid: 8ad064c5-a815-4ee4-9935-3f729764874c
  text: '{n}Негромкий гомон голосов смолкает, и дюжина взглядов упирается в вас.{/n}'
- guid: 8ae1c4aa-f088-406c-baaa-a627a0c56339
  text: '{n}Маражай сумрачным, затуманенным взглядом окидывает кровавый след, протянувшийся за вашей спиной. Уголок его рта дергается, но он не улыбается — вместо этого он выдыхает, едва подрагивающей рукой стирает красное с лица и медленно поворачивает голову к вам.{/n}'
- guid: 8ae68e56-e331-4cee-9d87-03c903d08c9b
  text: '"О, сомневаюсь. Пока ты болтал{mf|ся|ась} между жизнью и смертью, твоя прислуга очень заволновалась. Было произнесено несколько нелепых угроз, прежде чем твои лакеи уяснили, что жизнь их хозя{mf|ина|йки} полностью в моих руках. Так что они будут послушными, не правда ли?" {n}Гемункул глумливо улыбается вашим спутникам.{/n}'
- guid: 8ae88851-d4e9-4398-9c5c-da297620da2b
  text: '{n}Ирлиэт чуть слышно выдыхает и расслабляет плечи.{/n} "И я благодарна тебе, элантах".'
- guid: 8aedf8ae-d2ed-4f2f-98f3-35bb024883fa
  text: '{n}На Инцендию тяжело смотреть долго — ее пылающие, словно угли, глаза притягивают взгляд, гипнотизируют и вызывают постыдное желание потупить взор.{/n}'
- guid: 8b5bba41-69ad-4322-aef7-3c79fd535987
  text: '{n}Хейнрикс медлит еще секунду — а потом трясет головой, словно стряхивая морок.{/n} "Я {d|Encyclopedia:CompHeinrix_Humane}едва не поддался{/d} старому трюку Архиврага... искушение недостижимым — главная из ловушек, что расставляет Хаос для душ людей".'
- guid: 8b999f84-dbec-493e-8f21-5c57710e269e
  text: '{n}Изувеченное существо у ваших ног еще живо, о чем свидетельствуют тяжелое дыхание. Когда-то оно было женщиной, по-солдатски коротко стриженной и затянутой в боевую экипировку. Но сейчас кожа ее прорвана в дюжине мест торчащим металлом.{/n}'
- guid: 8bab7a05-868c-4f5b-bf32-d5f1ea2cdc20
  text: '"Если однажды наши пути пересекутся вновь, мы {d|Encyclopedia:Ch4_AeldariAlly}начнем беседу с приветствия{/d}, а не обнаженных клинков". {n}Воин на секунду задумывается.{/n} "Ваш век слишком краток, чтобы надеяться на подобное. Но я буду помнить о нашем обещании, элантах".'
- guid: 8baf54ab-5fd2-4b1d-a805-eae1bc4f057e
  text: '"Лария!" {n}Пальцы Себериана тянутся к угасающему порталу, но загребают лишь пустоту. Несколько мгновений Лорд-капитан неподвижно стоит с кулаком, замершим в воздухе. Когда он разворачивается к вам, полы его тяжелого плаща взлетают в воздух, а аугментированные суставы шумно выдыхают, выпуская пар.{/n}'
- guid: 8bb1a906-34e3-46a5-89c8-1f1d8808e0bd
  text: '"Что могли вы найти в такой, как я?" {n}Почти шепотом произносит Кассия и отводит взгляд.{/n}'
- guid: 8bc2add5-a161-4468-82a8-6bbdd715f055
  text: '{n}{g|Encyclopedia:Aeldari}Эльдарка{/g} чуть меняет положение и наклоняет голову. На ее губах появляется тень улыбки.{/n} "Мое сердце поет при мысли о скором освобождении Лилэтан... но мы не должны знать покоя, пока слуги Сай''лантреш язвят лик Первозданного мира".'
- guid: 8bfb80cd-5e54-45c0-bd98-b725f4b7ba53
  text: '{n}Жилистый мужчина в возрасте отрешенно наблюдает за суетой отсека, но взгляд его то и дело цепляется за кровавый символ, начертанный неподалеку. Тогда его лицо странно кривится, а ладони нервно сжимаются.{/n}'
- guid: 8c3ef397-2e14-4439-9ce6-0d233d01e4a4
  text: '{n}Изморозь покрывает пол, стены, предметы в тускло освещенной комнате. Воздух в кабинете холоден, вы замечаете облачка пара, появляющиеся от вашего дыхания. Центр этого ледяного излучения — Хейнрикс, обессиленно осевший в одном из кресел у столика регицида.{/n}'
- guid: 8c5bf166-86fb-4587-a0e7-58223ba1765b
  text: '"Убереги нас от смятения духов машин, ибо без даров Его бесплодны наши жертвы..." {n}Вы едва слышите голос молодого {g|Encyclopedia:AstropathGlossary}астропата{/g}, замершего рядом с массивным механизмом. Обескровленные ладони прижаты к груди, в пальцах зажаты смятые отрезки толстой бумаги, а на опущенном лице застыла маска отчаяния. Заслышав ваши шаги, астропат осекается.{/n}'
- guid: 8c75ce95-e8c6-44bf-ac89-4100f50f5167
  text: '{n}Вспышка искр, сдавленный вскрик — Маражай дергается, ошеломленно делает шаг назад и трясет головой, явно не понимая, что произошло. На секунду вам кажется, что в его глазах появляется ошарашенная осмысленность.{/n}'
- guid: 8cdb160e-3154-47db-9a2b-5a6dee781502
  text: '{n}Снежно-белую щеку Инцендии сводит судорога, и она, скривив губы, цедит:{/n} "Я не ставлю под сомнение приказы Лорд-инквизитора. Возможно, он желает получить тебя для личного дознания".'
- guid: 8d9ab006-8cb7-4cb2-a7f4-8695f80db9fa
  text: '"Ему требуется еще несколько поцедур исцеления... но скоро он будет в порядке! Вы сможете поговорить с ним позже, в Секторе Бионика". {n}Мартинакс осторожно придерживает коллегу за плечо, будто боится, что тот сейчас рухнет на пол.{/n}'
- guid: 8df10e0e-6230-4fc8-b182-0fc97554d3f6
  text: '{n}Укрытое красной мантией, тело магоса мало похоже на человеческое. Провода, трубки и металлические манипуляторы превращают его в причудливый механизм, а импланты скрывают лицо зловещей маской. Техножрец прерывисто диктует что-то на техна-лингве парящему рядом сервочерепу, но при вашем приближении умолкает и сдержанно кланяется.{/n} "Приветствую, Ваша Светлость. Лексмеханик Винцелекс. Чем могу служить?"'
- guid: 8e4f2fd0-224d-49b6-a58e-aad82478a173
  text: '"Волнующе, правда?" {n}С бесстрашной улыбкой Энрих кладет ваши ладони на рычаги, накрывает своими и уверенным движением тянет их вниз.{/n} "Не переживайте, я не дам ему вам навредить".'
- guid: 8e7207b9-30cc-45eb-a89d-1f40833bdd23
  text: '"{d|Encyclopedia:Ch4_DL_SeberianNoSword}Будь мой клинок при мне{/d}... Нет". {n}Себериан обрывает себя на полуслове.{/n} "Я был так ослеплен собственной гордыней, что забыл, в чем заключается истинная сила Вольного Торговца. Она — в людях, что верой и правдой служат династии. Вы — моя сила. Вы — клинок, который сразит Диодаса!"'
- guid: 8e74d898-08af-48f3-96b0-0dfa44d19b56
  text: '{n}Вистенца складывает перед собой руки.{/n} "Счастлива слышать, что вы вняли доводу рассудка, Вольный Торговец. Я знаю эту планету как свои пять пальцев. Еще немного — и я полностью подчиню своей воле".'
- guid: 8e84b986-b1ae-456c-879d-eafdaeaeb28c
  text: '"Ну..." {n}— мальчик смотрит на вас во все глаза.{/n} "Мама велела чтить Импелатола и всегда говолить правду. Но я не сказал, что это я сломал двель у лесенки. Я стлусил. И все лугали длугого мальчика. Потом был стласный день... мне сказали что мама больше не жива и ее душа улетела к Импелатолу... Что если он плогонит ее потому что я такой стласный тлус и влун?" {n} — заканчивает он почти шепотом.{/n}'
- guid: 8e994051-fd64-4587-a750-6c5d9c4bc638
  text: '{n}Тело Кассии бьет крупная дрожь, глаза мечутся из стороны в сторону, ноги подкашиваются. око навигатора беспокойно подрагивает, готовое распахнуться в любой момент, и гнетущие эмоции удавкой стискивают ваше горло. Леди-Навигатор нестабильна и едва сдерживает разбушевавшиеся силы.{/n}'
- guid: 8f2d1cd8-8eea-46b5-880d-d3c842e8871c
  text: '{n}Дерзайте — петля податлива для экспериментов.{/n}'
- guid: 8f322664-8033-43f4-962d-8b5a450ade78
  text: '{n}В голосе бога прорезаются нотки другого, хорошо знакомого вам голоса. Голоса Паскаля Ханейманна. И он полон скорби.{/n} "Коллектив означает новую схизму, а возвращение к схизме недопустимо. Однако сокровенный секрет воистину полезен служителям Омниссии. Старый метод доказал свою ущербность, потому я отрекаюсь от Амарната... но не от его наследия. Посмотрим, сможет ли Паскаль Ханейманн смиренно нести ношу, которую не смог его возгордившийся... творец".'
- guid: 8f3f6acd-bf93-407c-800c-b97fb0f34e69
  text: '{n}Вы замечаете, что склеп выглядит удивительно... незагаженным. Даже за пару лет пребывания здесь выродки должны были обратить его в неописуемый кошмар, но следы осквернения весьма локальны и далеко не так многочисленны.{/n}'
- guid: 8f43c576-fe83-4913-90bd-bbea7090fa25
  text: '{n}Кожа и мышцы расходятся, в ноздри ударяет запах прогорклого мяса. Кляйн опорожняет содержимое желудка через перила палубы. Сдерживая рвотные позывы, вы взираете на тошнотворную мешанину нечеловеческих внутренностей.{/n}'
- guid: 8f4ebbc7-8eb2-47a4-967b-9452340826c1
  text: '{n}Затем взгляд губернатора падает на одеяния Кибеллы, и зрачки его расширяются. Осторожно, вкрадчиво он добавляет:{/n} "Эта... женщина — ваша телохранительница? Или вы явились, чтобы кто-то..." {n}Губернатор умолкает, так и не решившись закончить вопрос.{/n}'
- guid: 8f68f533-8bac-4480-9981-aa01159be28e
  text: '{n}Устройство было безжалостно, но осторожно деконструировано. Техножрецы, проводившие дознание, передали магосу Ханейманну результаты изысканий, после чего были подвергнута праведной утилизации.{/n}'
- guid: 8f77ebdb-bb89-4e9f-bfef-8fb2efb96882
  text: '"Сектором Бионика руковожу я. Мне вовсе не хочется принижать заслуги членов Адептус Механикус вообще и Ферренца в частности, однако в деле врачевания им есть чему поучиться у Официо Медике". {n}В голосе Мартинакса слышится явное удовольствие.{/n}'
- guid: 8f9fecb7-b386-43fd-962c-8f0058f46504
  text: '{n}После призраки исчезли... надолго ли? Лишь тела погибших и странная реликвия, найденная среди руин, подтверждали, что на протяжении одних суток Янус вновь погрузился в войну давно павших ксеносов.{/n}'
- guid: 8fca603f-29bf-43f7-beaa-fd3bcfc28c09
  text: '{n}Массивные пластины, перекрывая друг друга, складываются в длинный бронированный хвост, извивающийся как у скорпиона. Вместо жала на его конце выросли две пары дальнобойных орудий.{/n}'
- guid: 9003f729-ec1e-49d0-ae81-46ddcd4a772c
  text: '{n}Инцендия опускает голову, и в зале словно сгущаются тени. Сияние ее глаз угасает.{/n} "Довольно. Я... каюсь. Я жаждала служить Императору, но нести Его врагам кару было столь сладко, что я забыла о долге во имя наслаждений. Футфол стал моим домом удовольствий. Я судила строго не потому, что Он этого желал, а потому, что так желала я. Я казнила тех, кого Он не велел казнить в законе своем. Страшнейший грех для Вольного Торговца — поставить себя выше Императора. Я впала в ересь... и должна быть осуждена".'
- guid: 9016d5e7-e90b-4182-a54e-db35deae6dd8
  text: '{n}Вы концентрируетесь на жертве... и выбранный вами пират падает замертво, сраженный энергиями варпа.{/n}'
- guid: 90a6b452-0e26-4fb1-ad32-2c1a6143d86c
  text: '{n}Взгляд Мастера дисциплины мрачен, а губы поджаты — из глаз женщины сочится свирепая ярость. Отточенным движением она снимает с пояса булаву и протягивает вам.{/n} "Это — непростительный промах. Я принимаю ответственность за него и прошу о наказании".'
- guid: 90b90a35-bbb1-4740-ad5f-4bf439ea1aac
  text: '{n}Губы гемункула злобно кривятся.{/n} "Покуда этот образец не признает мое превосходство, принеся извинения и расписавшись в собственной ничтожности, он останется тут. Смеет называть меня "досточтимым коллегой", воображая, что мы на равных! Какая тошнотворная наивность".'
- guid: 90bf2109-62b4-4045-9d32-baed264bb2cb
  text: '{n}Лейтенант-хирургеон заляпан кровью с ног до головы — но ран на нем самом не видно.{/n} "Ваша Светлость, я вам жизнью обязан. Спасибо... и слава фон Валанциусам".'
- guid: 90cb6d12-7f49-44bf-bfe5-c492c483de2f
  text: '{n}Щербато осклабившись, рабочий истерично вопит:{/n} "Да, это я все устроил! Я порчу нечистую хотел навести, умертвил товарища в ритуале поганом, с демонами совет водил и сношался! Все чтобы заговор осуществить и Лорд-капитана сгубить во славу моего могучего повелителя". {n}Он заходится истеричным, театрально-зловещим хохотом.{/n}'
- guid: 90e68d0e-2928-47e3-bf64-4a39122a77c1
  text: '{n}Флейтист берется за инструмент, и крыса ныряет под игровое поле. Когтистые лапки скребут по дну ящика, и через несколько мгновений зеленый стеклянный шарик выныривает в центре доски.{/n}'
- guid: 9107f58d-2035-4432-8939-f200334532e9
  text: '{n}Ааронто Орселлио выпрямляется, насколько может позволить ему старый сросшийся позвоночник, и гордо смотрит на вас немигающим взглядом.{/n} "Что это значит для нас, Вольный Торговец?"'
- guid: 91504bca-df07-4751-8fa7-5af94f954719
  text: '{n}Лицо Энриха Монтэга закопчено, он широко улыбается, не выпуская из зубов вечной папиросы.{/n} "Лорд-капитан, рад видеть вас в здравии, пусть и помятом! Мастер вокса сообщила, что лифт обрушился, и я запрыгнул в первый же состав и направился сюда, на поиски". {n}Он протягивает вам крепкую, как спасательный трос, руку.{/n} "Давайте я вас подкину до безопасного местечка".'
- guid: 91e9538c-f4d7-4d41-83a6-ca322ab7c44a
  text: '"Лорд-капитан..." {n}Вигдис, застигнутая врасплох вашим вопросом, не сразу находит слова для ответа.{/n} "Вокс-система функционирует без нарушений, никто из экипажа не сообщал о проблемах связи... Прошу, позвольте мне провести калибровку системы в вашем присутствии — у вас не останется сомнений в ее исправности".'
- guid: 91f16416-5fe6-4fc0-8a19-a05a8aee4dcc
  text: '"Это... все из-за меня! Когда я обдала вас навигаторским взором, силы Имматериума не сгубили вас, но подействовали странным образом. И теперь... О Бог-Император, что же мне делать?" {n}Бледно-желтая петля все туже сжимается на горле Кассии, и вокруг ее головы беспорядочно мечутся всполохи красного и темно-синего.{/n}'
- guid: 91f8143d-fa06-4ac8-84af-2fb6fc6be25f
  text: '{n}Маражай небрежно пинает опорную руку дознавателя — тот мешком падает оземь.{/n} "Вряд ли, мон-кай. Обеими вашими судьбами отныне распоряжаюсь я".'
- guid: 9208ff70-3ab4-4d56-a5d5-f4abfb0a1a27
  text: '{n}Старый слуга издает стон. Черное пятно на руке словно расползается по венам мужчины, темными нитями оплетая его руки и шею. Дыхание слуги ускоряется и становится прерывистым.{/n}'
- guid: 927c6675-c31b-4632-96c5-04884be68345
  text: '{n}Прежде, чем удача улыбнулась охотникам, один из добывающих комплексов полностью вымер в результате "случайного" загрязнения водных фильтров химикатами.{/n}'
- guid: 9285e17c-726a-4713-a2d8-1fa62bc2d245
  text: '{n}Вас приветствует целая группа людей. Большая их часть — члены свит, приспешники, секретари, телохранители и прочие члены почетного эскорта — склоняется в глубоких поклонах и шумно приветствует вас, однако в этом волнении особенно выделяются те, кто вам уже давно и хорошо знаком. Похоже, новость о вашем скором отбытии уже успела распространиться по станции.{/n}'
- guid: 928b6ed6-ba30-4ba3-b185-c544602eb1a1
  text: '{n}Сотни лиц проносятся перед вашим внутренним взором: друзья, соратники, подданые. Вселенная беспощадна и полна мрака, а ваши воля и решительность — единственная преграда между всеми, кто вам дорог, и ее всесокрушающим безразличием и жестокостью. Вы не имеете права умирать: не здесь, не сейчас. Решимость подобно раскаленной плазме разливается по жилам, и вы предпринимаете еще одну попытку подняться.{/n}'
- guid: 929c21c2-342b-4d2b-bf7d-7100847de755
  text: '{n}Грудная клетка друкари распахивается, кожа рвется с влажным хлюпаньем. На мгновение вы видите внутренние органы, покрытые странным налетом и бесформенными наростами похожих на грибы опухолей. Там, где должно быть сердце, свернулась блестящая прозрачная каракатица, присосавшаяся к черным трубкам вен. Мерзкий моллюск издает стон, и в лицо вам ударяет струя едкой жидкости. Вы ослеплены, судорога сводит горло и не дает вздохнуть, тело заходится в конвульсиях боли. Свет гаснет молниеносно.{/n}'
- guid: 92a85fcf-a6de-422a-9349-7923fb45baa3
  text: '{n}Губернатор издает нервный смешок и теребит воротник.{/n} "Любезнейшая, шутить изволите?"'
- guid: 92fb1c4d-ca57-4150-9c20-90703deff222
  text: '{n}Непонимание Махария выглядит самую малость преувеличенным.{/n}'
- guid: 92ffc8a9-5272-4562-ad9e-fb3df4a16c3c
  text: '"Допустим, я поверила вам. Говорите, что знаете". {n}Сенешаль делает короткий жест рукой.{/n}'
- guid: 930df17b-f41a-4316-b3e3-fc51d236c6b4
  text: '{n}{g|Encyclopedia:Servitor}Сервиторы{/g} перед вами словно исполняют сложный и малопонятный танец: приняв странные позы, они покачиваются на месте с причудливо изогнутыми руками. При вашем приближении один из сервиторов дергается и пытается повернуться в вашем направлении. Остальные тут же повторяют это движение.{/n}'
- guid: 934eed73-8148-4bd9-8bb0-08bf14c0fc72
  text: '{n}Хруст веток выдает приближение группы людей. Вы видите Янура. Он появляется столь же внезапно, как и при первой встрече. Видимо, выдавший его звук был своеобразным вежливым предупреждением.{/n}'
- guid: 9354a29a-099e-4954-a662-78d799b22f2e
  text: '{n}Мало что можно понять из засыпанного снегом поля битвы, но, несомненно, Волки успели дать напоследок суровый бой. Сколы от выстрелов болтеров испещряют скалы, тут и там видны подпалины, оставленные плазменными зарядами.{/n}'
- guid: 93674d98-46e7-4f9e-917f-8fa75f25e07b
  text: '"Трансформации настолько удивительные, что звучат почти... отрадно". {n}Манипулус даже не пытается скрыть печаль.{/n} "Жаль осознавать, что это с высокой степенью вероятности лишь иллюзия, смущающая наши умы".'
- guid: 939121b5-a56a-4ff9-b8fb-fa8f2cd00a8e
  text: '{n}Регент коротко кивает, ожидая продолжения.{/n}'
- guid: 93a5d230-cc44-41f7-b84c-f8e33171fd0e
  text: '"Да врет она, сука лживая!" {n}Побитый офицер злобно щерится.{/n} "Они кровью для вида измазались, вылезли и давай причитать: "О нет, на корабль напали, враги везде, срочно в соседний отсек!". Мы бросились проверять, а они взломали резаками хранилище на посту, достали оружие и направились в реакторную".'
- guid: 940e22dc-d074-45e4-8b8d-58da906f8ed2
  text: '{n}Высокий мужчина жестом останавливает вас на подходе. Кровь — собственная и чужая — стекает по его изможденному лицу, покрытому перламутровой чешуей. Два застланных тьмой глаза не мигая осматривают вас, а третий, отпечаток судьбы {g|Encyclopedia:Navigator}навигатора{/g}, угрожающе подрагивает за опущенным веком посреди лба.{/n} "Назад! Или, клянусь {g|Encyclopedia:Emperor}Императором{/g}, я обрушу на вас весь ужас {g|Encyclopedia:Warp}Океана Душ{/g}!"'
- guid: 94412803-c3ce-42ad-82ef-6cc9a28a2680
  text: '"И-и-и... Это оказалось быстрее, чем я думала. Нет, нам, конечно, пришлось немножечко подождать, но время от времени бывало даже весело". {n}Джай устало улыбается.{/n} "Последняя печать. Еще одно заверение и... Личный торговый представитель Империума в лице Джай Хейдари скоро предстанет пред вами!"'
- guid: 94650e47-c41e-4359-91a7-134df790b0d0
  text: '{n}В Схоластика Псайкана во время вашего {d|Encyclopedia:CharGen_Psyker}обучения{/d} ходили истории об этом ритуале. Темные, леденящие душу истории. Этому ритуалу не учат — его постигают великими жертвами и лишениями. Вайс, очевидно, редкий пример того, кто смог принести эти жертвы и выжить.{/n}'
- guid: 94de0051-6750-4e14-9cc8-5941b7d8f992
  text: '{n}Повисает долгое молчание. Регент пожирает вас взглядом, словно пытаясь снять кожу, мышцы, кости, в надежде заглянуть в самые темные уголки вашего сердца.{/n} "Вы правы, Вольный Торговец. Если вы готовы позаботиться о нашем дитя, пока мы разбираемся с нашей... проблемой — так тому и быть".'
- guid: 94e00bff-bdf1-4fd3-acbf-5748962b40cc
  text: '{n}Кибелла, ступившая в ваши покои, взирает на вас широко распахнутыми глазами, в которых плещется океан эмоций.{/n} "Домин..." {n}Мгновение — и ее руки касаются вашего лица.{/n} "{name}!"'
- guid: 95165304-d3f0-4549-9465-c375fd6573e2
  text: '{n}Эоганн с облегчением опускает веки.{/n} "Значит не все методы еще исчерпаны".'
- guid: 953f158b-3449-41f8-a7aa-fd5266cc6705
  text: '"После того, как с мастером плоти будет покончено?" {n}Эльдар устало вздыхает, на странном лице проявляется подобие улыбки.{/n} "Мы вернемся домой... Как только это будет возможно".'
- guid: 95686d11-286f-4dbc-8f0a-f2e7aabb3840
  text: '{n}Маска холодной учтивости слетает с лица Владайма, стоит ему втянуть воздух, пронизанный миазмами канализационной вони. Наместник кривится, из последних сил сдерживает желание отвернуть голову в сторону и, наконец, снова берет себя в руки.{/n}'
- guid: 9597d5ca-dea9-4b0d-8a2a-676d669cf15b
  text: '"И почему я должна в это поверить?" {n}Ювенна очаровательно улыбается, склонив голову набок.{/n}'
- guid: 95a45187-2168-4de1-b1bc-511c3d631488
  text: '{n}Служительница Хаоса насмешливо разводит руками.{/n} "Но прежде чем вы оскорбите мой слух новыми обвинениями или тем более нравоучениями... вспомните, кто удержал этот мир от гибели, когда Простор начал содрогаться от ярости варпа. Вспомните, кто все эти десятилетия безукоризненно служил вашей династии. Вспомните, кому ваша предшественница доверила один из ценнейших миров, не опасаясь измены или интриг! Без меня Янус превратится в ничто!"'
- guid: 9657f4c1-6dc8-4f1d-9860-4f90627d3f4a
  text: '"Так не бывает, новеньк{mf|ий|ая}. Ты выбираешь себе или одного врага, или заполучаешь сразу обоих!" {n}Оскал Винтерскейла становится шире с каждым словом.{/n}'
- guid: 967cd7b5-fc3c-4456-8814-b88f3709414e
  text: '{n}Вы подходите ближе, чтобы рассмотреть безумный конструкт, но одна из свободных конечностей орудия дергается — и устремляется к вам!{/n}'
- guid: 969b39fd-ecc9-4282-bba7-fae4baef1388
  text: '{n}В агрессивном голосе Соломона вы слышите затаенную надрывную нотку, а в глубине его взгляда — умело скрываемую панику.{/n}'
- guid: 969e580a-cc7f-4fd8-b356-a05b647ac684
  text: '{n}Воздух заметно холодеет. Несколько секунд ничего не происходит, а затем друкари вдруг начинает сникать, пока не опускается на колени. Остекленевшие глаза чуть прикрываются, на бледном лбу появляется мучительная складка, словно ксенос пробуждается от дурного сна.{/n}'
- guid: 96d9052e-3847-415d-a8a3-3f86f2699c7f
  text: '"Не думал, что когда-нибудь услышу от проклятого Дитя подобную речь". {n}Навигатор медленно склоняет голову.{/n} "Дитя... нет, Леди Кассия. Если таково ваше решение, Дом Орселлио последует за вами. Пора покончить с темными днями в истории нашего Дома".'
- guid: 96d9776a-9543-4f47-91fb-616f4bbb13de
  text: '{n}Триасомата замирает — плечи несчастного медленно опускаются, судороги сходят на нет. Ясность разума держится недолго — вскоре глаза амальгамы пустеют, а рот растягивается в блаженной улыбке. Умиротворенно покачиваясь и пуская слюну, он бормочет обрывки фраз из прошлой жизни и молитвы Императору.{/n}'
- guid: 97387d9d-8836-4d42-8210-b9cda0731c5a
  text: '{n}Наблюдающие за происходящим работники торжествующе горланят и тычут пальцами в сторону блюстителей, восхваляя Лорд-капитана.{/n}'
- guid: 973a4aa5-f4b9-408c-9c8a-d6033df314f7
  text: '[draft] {n}Аристократ перед вами одет в мундир цветов династии фон Валанциус, его лицо обезображено имплантами до неузнаваемости — только единственный уцелевший глаз и натянутые лоскуты кожи намекают, что чудовище перед вами когда-то было привлекательным мужчиной. Вольный Торговец впивается в вас подозрительным взглядом, и вокс-синтезатор, встроенный в его череп, произносит:{/n} "А вы еще кто?"'
- guid: 974e7726-fe01-45f3-a48d-b05f5a9cbc23
  text: '{n}Арджента хмурится, затем кивает.{/n} "Иной раз открыть сердце непросто... я понимаю. Сейчас действительно не лучшее время для разговоров".'
- guid: 974f0faf-014f-4a31-803a-fefe47401b25
  text: '"Было бы чего вытаскивать..." {n}Идира тяжело вздыхает и качает головой.{/n}'
- guid: 976cdade-2ea5-499a-a319-2ebd8367e151
  text: '{n}Дрожь, в которой смешались нечестивый восторг и животный ужас, пробегает по вашему хребту. Нет никаких сомнений — ярость Каллигоса подпитывается кроваво-красными всполохами скверны, охватившими его душу. Ненасытная, первозданная и разрушительная, она поглощает его все больше и больше с каждым мгновением.{/n}'
- guid: 97c1c017-cb13-4432-afb5-e712c1408ac2
  text: '{n}Немочи продолжают в поте лица трудиться на благо Януса. Попустительство, оказанное выродкам, может привести к опасным последствиям.{/n}'
- guid: 97c6d17b-a84b-4242-ab09-fd0d3569d7b0
  text: '{n}Маражай небрежно взмахивает рукой — то ли приветствуя вас, то ли призывая полюбоваться изуродованным залом.{/n} "Наконец-то! Я уже начал думать, что твоя неуклюжая посудина сгинула на полпути обратно! Такой финал не устроил бы ни тебя, ни меня, верно?"'
- guid: 97ddb4a4-a23b-4ab3-bfb1-e427c79527f2
  text: '"Едва ли непосвященный сможет осознать таинства навигирования... Но я постараюсь объяснить вам суть. Мне предстоит слить свой разум и волю с {g|Encyclopedia:MachineSpirit}машинным духом{/g} корабля, дабы стать с судном единым целым". {n}Кассия убирает пряди с затылка, обнажая позолоченные {g|Encyclopedia:Augmentation}разъемы-импланты{/g}.{/n} "Затем, с помощью обряда Дома Орселлио, разглашать который я вам отнюдь не желаю, я освобожу разум от посторонних мыслей. И тогда..."'
- guid: 98315f0c-4272-450d-b97c-ce65cd6754ab
  text: '{n}Заглянув в ящик, вы видите знакомый блеск — голодный до крови блеск оружейной {g|Encyclopedia:Plasteel}пластали{/g}, начищенной и готовой убивать. Старик подпирал спиной несколько новеньких авторужей, завернутых в промасленные тряпки.{/n}'
- guid: 9843e40a-613f-4299-a90c-483290878dcd
  text: '{n}Упрямо глядя на вас, он цедит сквозь зубы:{/n} "Люди несовершенны, но не закон Его".'
- guid: 9850d457-b4af-4907-ae90-fa1ca9e4dbb2
  text: '{n}Опешив, священник подается назад. Он открывает рот и... маленькая, едва заметная мушка влетает между его редких зубов, исчезая в глотке. Проповедник даже не заметил ее.{/n} "Что за еретические речи ты произносишь? Я... я верую! С чего мне бояться гибели?"'
- guid: 9852cb38-392b-4835-8c00-ae3eb7a20a3f
  text: '{n}Дознаватель пристально оглядывает комнату, следы борьбы и самого Ахиллеаса.{/n} "Ты {d|Encyclopedia:CompHeinrix_Humane}хорошо держался{/d}. Рад, что мы вовремя подоспели".'
- guid: 98c9f797-85dd-4252-935c-e4de0c89dba1
  text: '{n}Серая, неприглядная лоза вьется по уцелевшим остовам клетки, почти сливаясь с холодным камнем депо. Каждый усик неказистого растения увенчан единственным листом — пожухлым, но все еще живым.{/n}'
- guid: 9923ffde-6dc2-49d1-b87f-4f7cfc25c04d
  text: '{n}Потрескавшиеся губы, работая в тандеме с пылающими легкими, исторгают одно за другим слова хорошо знакомой вам молитвы. Каждая изреченная строка наполняет тело Его светом, придающим сил и сокрушающим боль, словно сам Император повелевает вам встать. Вы предпринимаете еще одну попытку.{/n}'
- guid: 9954508b-1937-424c-8131-b3b78730017a
  text: '{n}Бионический глаз Себериана с жужжанием фокусируется на Ульфаре, и его голос звучит почти благоговейно:{/n} "Я не ведал, что Диодас сумел заручиться поддержкой Ангелов Бога-Императора. Однако даже перед лицом Его Ангела я не могу отказаться от обязательств, возложенных на меня Патентом".'
- guid: 99990748-c5b3-4679-8c4c-36b9cb0c878f
  text: '{n}Парень жестами указывает на хрустальный купол, затем на вас, делает несколько пассов руками и выпрямляется по стойке смирно, упираясь глазами в носки собственных ботинок.{/n}'
- guid: 99b1f008-c746-460f-8b66-e688fc6ba7ed
  text: '{n}Даже среди клешней, резаков, катушек Движущей Силы и остального технического оснащения, вмурованная в машину тварь выглядит чужеродно. От ее тела остался лишь серо-черный остов, увенчанный черепообразной головой. Когда вы приближаетесь, в единственном глазу чужака, светящемся тусклой зеленью, пробуждается искра злого пытливого разума.{/n}'
- guid: 99e752ed-7d9e-4545-af60-80f94cf2e073
  text: '{n}Друкари, склонившийся над телом, заточенным в странном аппарате-саркофаге, оборачивается. Лицо ксеноса скрыто зеркальной маской, а в руках он сжимает какие-то инструменты — скорее пыточные, нежели чем хирургические. Из-под маски доносится утробное шипение.{/n} "Что тебе нужно, ничтожество?"'
- guid: 99ee61c8-f726-43ff-aae2-1497c6cfc6b3
  text: '{n}В реальности Уралон выглядит еще внушительнее. Огромная фигура, закованная в силовую броню, разворачивается к вам, на руках все еще пляшут огоньки варп-пламени — следы недавнего колдовства. Когда апостол начинает говорить, стены массивного колодца отражают звук каждого слова.{/n} "Исполнить волю моего господина на глазах последне{mf|го|й} из рода Вольных Торговцев, когда-то звавшего этот мир своим — ирония ситуации достойна восхищения, не так ли? Иди же и прими свою судьбу, финальная жертва на моем алтаре".'
- guid: 9a07cc51-f3b8-498f-8f10-ce333bf7e2a6
  text: '"Лорд-капитан?" {n}Голос Мастера вокса, обычно спокойный и сдержанный, предательски подрагивает, пробиваясь сквозь легкий шум статики.{/n}"Я получила сообщение о перестрелке на нижней палубе. Вам удалось навести порядок? В каком состоянии Идира?"'
- guid: 9a2aefbc-25b5-4762-a719-de70c569af85
  text: '{n}Воин в броне, украшенной знаком Инквизиции, ровным и сухим, словно бумага, голосом произносит:{/n} "Лорд-инквизитору известно о прибытии Вольного Торговца фон Валанциус на Футфол. Он допустил это, не отдавал приказа о преследовании и велел оказывать надлежащее уважение высокой персоне. Выношу предупреждение — суждения госпожи Чорда опасно склоняются к самоуправству и нарушению командной иерархии".'
- guid: 9a5f3b21-6844-43a8-a2b2-b432d77af167
  text: '{n}Кассия слабо улыбается и прикрывает глаза, готовясь встретить очередной поцелуй. Когда ваши губы соприкасаются вновь, по нервам словно пускают ток — она целует вас стремительно, страстно, словно и впрямь желая раствориться в моменте.{/n} "Ах, {name}..."'
- guid: 9af11074-1994-434a-b5df-06b6cd45d958
  text: '"Возможно, пришлому ставленнику Леди Теодоры и нет дела до священных традиций наших предков-основателей..." {n}Губернатор многозначительно кивает в сторону Абеляра.{/n} "Однако {name} фон Валанциус — потомок истинных детей Даргонуса! Владыке мира пристало чтить обычаи".'
- guid: 9b3f7ab8-7bab-4b81-a77c-cb2ee999952c
  text: '{n}Тервантьяс прикладывает одну из рук к груди — жест, изображающий оскорбленность, почти до смешного человеческий.{/n} "Какое яркое свидетельство вопиющей ограниченности, свойственной вашей расе. Я избавил ее от грубой поделки, которую вы считаете аугментом, и вернул интригующую особенность ее генетического кода! Что ж, я не буду тратить на нее свои лучшие материалы и верну ее убогий агрегат — немедленно!"'
- guid: 9b9f7052-200a-426e-9a9c-3c8a2fbf0067
  text: '{n}Джай несколько минут сверлит игровое поле взглядом, то постукивая {g|Encyclopedia:AugmentationGlossary}аугментированным пальцем{/g} по его краю, то принимаясь насвистывать что-то совсем не похожее на мелодию флейтиста. Крыса трижды почти закатывает шарик в лунку, но каждый раз он проскальзывает мимо.{/n}'
- guid: 9bfdb1f7-4c14-4b2b-a46e-2fa7635517fa
  text: '{n}Каллигос без стеснения хохочет.{/n} "Расточай свои ядовитые стрелы осторожнее, Инцендия. Я чую в новеньк{mf|ом|ой} горячий нрав — еще объявит тебе войну. А я, глядишь, могу е{mf|го|е} и поддержать..." {n}Винтерскейл заговорщицки подмигивает вам.{/n}'
- guid: 9cd7a5aa-8220-4987-a7d3-849e6b3af1a0
  text: '{n}Глаза Леди-Навигатора расширяются от ужаса, и ее тут же сгибает пополам.{/n} "П-прошу прощения, моя госпожа. Несомненно, вы — мой еще некоронованный новатор! Но Дом Орселлио всегда был верен Тисифоне. И отныне — верен ее наследнице, пусть даже вы поведете нас иным путем!"'
- guid: 9d62fdbe-e26d-4b39-9042-013e45b75dd9
  text: '{n}Слова женщины тонут в нарастающей головной боли: раздражение, презрение, разочарование, подобно трехвостой плети, стегаю ваш разум сотней {d|Encyclopedia:Conviction_Heretical3OrMore}злобных шепотов{/d}{/n}: "Время рассвета почти настало, а ты так и не сумел{mf||а} сделать правильный выбор на перепутье судьбы! Истина, что скрывает от незрячих приспешников труп на троне, могла озарить твой взор, даровать... безграничную свободу. Но ты оказал{mf|ся|ась} слаб{mf||а}. Не стал{mf||а} бороться, не стал{mf||а} слушать... Дитя, недостойное Истины. {mf|Слепец|Заблудшая}, недостойн{mf|ый|ая} свободы!" {n}Чужое присутствие растворяется в мыслях липким осадком, более не желая нести свое слово подобно{mf|му|ой} вам.{/n}'
- guid: 9da41369-51d0-4eba-a60d-33d06e2aa738
  text: '{n}Себериан повелительно вскидывает руку.{/n} "Соратники, время пришло. Слушайте мой приказ: привести в исполнение план сенешаля Войгтвир! Приготовиться к обороне! За династию фон Валанциус! За Императора!"'
- guid: 9db482d4-8a61-4b45-9ceb-4820acec399e
  text: '{n}Лицо Кибеллы искажает страдание, но она стискивает кулаки и кивает.{/n} "Надлежит призвать смерть в сей чертог. И восславить Его".'
- guid: 9de5e477-8dd7-4596-8d0b-e12c66c50984
  text: '{n}Под руководством братьев и сестер Ордена Молота Блаженные продолжили свои труды по возделыванию пашен и воздвижению новых поселений.{/n}'
- guid: 9e0f5916-06d0-4a53-83e0-d3f36ba19e9b
  text: '"Вдали от строгих епископов я впервые чувствую себя свободной. Канон суров, он лишь берет и не дает ничего взамен". {n}Женщина любовно касается тяжелых украшений.{/n} "Нынешнее мое положение мне больше по нраву".'
- guid: 9e1ce79a-f979-4e3f-b79c-ac132ba2ec04
  text: '{n}Окрыленный вашим одобрением, он с энтузиазмом выпаливает:{/n} "Приступаю немедленно!"'
- guid: 9e6fe21f-a801-4d42-9388-246fe823799d
  text: '{n}Кибелла растерянно смотрит на семью Эрэбис. На вас. На свое отражение в стали кинжала.{/n} "Я... не убью... Обязана ли я следовать приказам, когда нутро сжимается, а сердце кричит: это неправильно? Это — не моя воля".'
- guid: 9eddf33e-0180-43a0-bc18-0579202f7a7d
  text: '{n} {/n}'
- guid: 9f27349b-2fad-4fc1-878a-ad8563a9e963
  text: '"Звездн{rt_mf|ый|ая} Госпо{rt_mf|дин|жа} или нет, не нравится мне это... чую, лучше {rt_mf|ему|ей} не попадаться. А чуйка у меня — во!" {n}Слуга делает неопределенный жест руками и поеживается, оглядываясь за плечо.{/n}'
- guid: 9fae074b-da9e-4e3b-b83f-21f8432e4d58
  text: '{n}В массивном кресле из каликсийского дуба развалилась пышно разодетая туша, отдаленно напоминающая человека. Мертвецкая плоть покрыта ороговевшими коричнево-синими пятнами, заходящими друг на друга змеиной чешуей. А руки с когтями из обнажившейся кости поддерживают безобразно расплывшееся лицо.{/n}'
- guid: 9fd2f309-11fd-4e84-aef4-319d16e7efb9
  text: '{n}{g|Encyclopedia:MerovPenalLegionGlossary}Меровский штрафной легион{/g}. Отчаянные головорезы, согнанные из тюрем царских ульев Мерова в {g|Encyclopedia:CalixisGlossary}Каликсисе{/g}, понукаемые офицерами-надзирателями. Вы слышали истории про эти полки.{/n}'
- guid: 9fd8a5c2-dfb8-4c82-8bd2-9fe2393d8bcf
  text: '"Документ заверен". {n}Скрипучий голос доносится из металлической челюсти со встроенным воксом.{/n} "Вернитесь к Мастеру Печатей, дабы продолжить процедуру. И да хранит вас свет и мудрость Его. Следующий!"'
- guid: a06e5b6f-4d01-47ca-a381-451a6a9cdaa2
  text: '{n}Недра горна заполняет нарастающий рокот — набирая силу, гул древних моторов звучит все громче. Ему вторит ускоряющийся скрежет металлических шестерней и постукивание неведомых вам механизмов. Медленно, почти нехотя творение Адептус Механикус изрыгает из себя банк данных с гравировкой герба династии фон Валанциус.{/n}'
- guid: a0cc0185-bc42-4184-b0b8-2783803b1ba3
  text: '"Лорд-капитан, прямо по курсу следы недавней заварушки... Ох, Трон подери, да это не имперский фрегат, а просто выпотрошенный кусок металла!" {n}Кормчий на секунду затихает.{/n} "Чтоб меня, а ведь виновнички происшествия тоже здесь — эльдарские выродки! Узнаю их сияющие задницы даже с такого расстояния. Только... ведут себя ксеносы подозрительно — зависли на месте и даже не думают давать деру. Подлететь ближе, или прикажете атаковать издалека?"'
- guid: a1078344-9bbe-4996-b15a-c954ac6eebb1
  text: '{n}Джай глубоко вздыхает, будто готовится к прыжку.{/n} "Потому что я была с ним прежде. Он помог мне перебраться в Простор из Каликсиса, сделать имя в Миссии, стать хладным торговцем, занять место погибшего Кристо... но не только это. Он был моим учителем. И моим любовником. Он знал все о моем прошлом... как и ты. Я долго была подле него, принадлежала ему душой и сердцем, но затем захотела иной жизни и ушла. Не исключаю, что попутно я разбила ему сердце".'
- guid: a25f1e87-a84f-4018-8ed4-65245bd05a97
  text: '{n}Кассия осторожно обхватывает ваше лицо прохладными ладонями, и ее когти чуть впиваются в кожу у самых висков.{/n} "Доверьтесь мне, смотрите только на меня". {n}Все ваше внимание концентрируется на двух рубинах, сияющих неярким отблеском на лице Леди-Навигатора. И чувствуете, как чужая воля поглощает все ваше естество, все эмоции и переживания. Не остается ничего — и в этом ничем растворяются потускневшие краски мира. И беспокойные всполохи Комморры, и умиротворенное свечение серебра вокруг хрупкой фигуры Кассии.{/n}'
- guid: a2626cf8-b025-4656-aeb1-b3a93758432d
  text: '{n}Хальбрандт поднимает взор от тел павших собратьев. В его голосе клокочет ярость:{/n} "Я — гнев Всеотца, и гневу его должно ужасать. Предатель Семнадцатого, я иду за твоей головой!"'
- guid: a27ef42b-5f13-4740-9ae4-508dc8a0d6b5
  text: '"Кто здесь?" {n}Тощая женщина оборачивается на ваши шаги. Губы чуть подрагивают, взгляд блуждает из стороны в сторону. В трехпалой руке крепко стиснут окровавленный нож.{/n}'
- guid: a2c3dbad-816b-44c6-84b0-92f8d8e2517e
  text: '{n}Магос Паскаль Ханейманн передал свои откровения слугам Омниссии на Кьяве Гамма, что позволило им воздвигнуть устройство-посредник, смягчившее глас Ноль-Халифа. И тогда взмолились магосы пред могучим духом машины, смиренно прося его вступить в союз с Вольным Торговцем и даровать свои откровения.{/n}'
- guid: a30e93bb-d86c-462f-8a07-999cdc93e66c
  text: '"Вы вернулись! Да благословит Бог-Император каждый ваш шаг. Возможно, теперь вы сможете разрешить наш спор?" {n}Юный священнник широко вам улыбается.{/n}'
- guid: a311ada9-1451-480b-9793-e2b8cd2beb2f
  text: '{n}Кислый голос кормчего вновь врывается в эфир.{/n} "Коль вам так хочется свою венценосную задницу поморозить, Лорд-капитан, кто ж станет перечить?"'
- guid: a362f131-66f0-4185-8a75-521e3bc39334
  text: '{n}Тервантьяс небрежно кидает вам крохотный предмет.{/n} "Это — ключ от устройства, которое носит образец-доброволец. Глушитель связи с вуалью. Интересно, оно уже успело вызвать у нее необратимые физиологические повреждения?.. Впрочем, неважно. Ключ понадобится лишь если образец будет сопротивляться — она всегда могла снять устройство сама".'
- guid: a36482aa-8b78-4417-b957-22c5d2241361
  text: '"Давайте сразу все проясним, наследни{mf|к|ца}. Вы пришли, чтобы разрушить наши устои. Забрать нас с собой и увести к звездам. Так было предрешено, но это не значит, что мне это нравится". {n}Последние слова оканчиваются грудным рыком. Иждриг стоит на месте, но создается ощущение, будто он подается вперед.{/n}'
- guid: a366bb22-1733-4634-8565-d231501b46e3
  text: '{n}Девушка стискивает кулак.{/n} "Висирь сковал из меня оружие и обагрил его кровью. Он указал жертву, дал миссию. Идем же, Домин. Нам предстоит спуститься в храм смерти, где я отчитаюсь о своем задании. И задам Висирю один вопрос: "Почему я?"'
- guid: a378126f-1004-41ca-aac3-951b90a310a6
  text: '{n}Десятки пар глаз неотрывно следят за каждым вашим жестом, каждым вздохом. Все члены экипажа затаили дыхание, лишь бы не пропустить ваши решающие слова.{/n}'
- guid: a3796e8a-0ed8-42e7-a8e1-07a024f90607
  text: '{n}Капитан нервно дергает уголком рта.{/n} "Проклятье... и когда они успели?"'
- guid: a3b8bf35-f820-4cb9-8e09-167740508fc1
  text: '{n}Перед вами женщина средних лет, облаченная в богатые церковные одежды. У нее крупные и некрасивые черты лица, но величественная поза и властный взгляд вкупе со сверкающими золотом регалиями делают ее образ внушительным.{/n}'
- guid: a42c877a-21aa-4f1c-b83d-cb773190d4be
  text: '{n}В ту же секунду, как пси-удушитель оказывается у Идиры на висках, десятки извивающихся хрустальных нитей выстреливают из устройства и впиваются ей под кожу. Женщина вопит от боли, хватаясь за голову, пока копошащиеся контакты буравят ее плоть. Наконец, все заканчивается, и вы слышите лишь тяжелое дыхание Идиры.{/n}'
- guid: a4652216-9e64-4d3d-92a5-f87872f0e1dd
  text: '"Замысел? Я всего лишь верный слуга своего господина. Покуда я нахожу для него новые способы проливать кровь и ломать черепа, господин Винтерскейл доволен. А значит доволен и я". {n}Губы архмилитанта рассекает хищный оскал.{/n}'
- guid: a477edf7-836b-4d24-bbad-659ef1816b17
  text: '{n}Струя крови расчерчивает пол, и на карминовые брызги ложатся карты Его Таро. Все молчат и смотрят на меня. Я — читаю знамение.{/n}'
- guid: a497afdf-2188-4f51-8fba-336ce9030214
  text: '{n}Впрочем, не только кулаки. Вы видите, как руки некоторых скользят под одежду и будто бы ложатся на оружейные рукояти. В толпе мелькает блеск, хорошо вам известный — это блеск оружейной {g|Encyclopedia:Plasteel}пластали{/g}.{/n}'
- guid: a4d1ba99-932b-44e3-8d41-bc46bf559376
  text: '{n}Тварь цепенеет на месте. Слабый стон, идущий из его глотки, угасает.{/n}'
- guid: a4f25467-723c-4b0d-8d0d-2368e73a2a2a
  text: '{n}Техножрец кивает.{/n} "Ожидаю — и внемлю вашим суждениям — продолжения интересной беседы".'
- guid: a4f6cfda-8700-4b0a-9886-9fea537a3754
  text: '{n}Возможно, среди друкари мутанты-вырожденцы встречаются не реже, чем среди людей, и эта тварь — из их числа.{/n}'
- guid: a5a6b5c3-29b4-4b0f-9fc3-a00ff09d3638
  text: '{n}Болезненно тонкий техножрец резко поворачивается к вам — в ответ на это резкое движение его хромированные аугменты коротко лязгают. Серые глаза почти сливаются с бледной кожей лица и под весом насупленных бровей обретают тяжелый, угрюмый вид.{/n}'
- guid: a5b01130-806b-4cd6-a023-66b0976cae03
  text: '"Интересно, в туманных видениях того, чему было только суждено случиться, узрел ли хоть один из провидцев будущее, в котором ключом к его спасению становится дуэт из мон-кай и изгоя?" {n}Эльдарка обращает лицо к вам и благодарно кивает.{/n} "Идем же. Вырвем жизни провидцев из лап моих ненасытных кузенов".'
- guid: a5d69218-cf9c-4722-b485-73c6f9a967cc
  text: '{n}Арлекин удивленно наклоняет голову, глядя то на вас, то на Кассию, а затем давится смешком.{/n} "С чего вы взяли, мон-кай, что я стану выполнять ваши приказы? Я не палач для трехоких созерцателей Ша''эиль, о нет. Я губитель каждого, кто осквернил сей Первый Мир своим присутствием. Да начнется финальный танец!" {n}Арлекин наиграно кланяется и зажимает кнопку на странном устройстве в руках.{/n}'
- guid: a5ff4d4e-09d7-4cbc-889a-de2f2339159c
  text: '"Но я забил до смерти лопаткой одного комиссара, а затем забрал его форму. Это делает меня немножко комиссаром в твоих глазах?" {n}Ваш собеседник довольно посмеивается.{/n}'
- guid: a62389b4-3a1b-43f7-a0d3-2e709b79cd23
  text: '{n}Разгневанные провидцы пытаются возразить, но Шайрэнкхей мягко прерывает их.{/n} "О большем братья и сестры не смели бы тебя просить, Ирлиэт. Я понимаю твой выбор... Пускай моя душа и не может принять его полностью".'
- guid: a6540d5a-0941-4c70-92e1-07ba767ce69c
  text: '"Что до тебя..." {n}Дракон бросает взгляд на вас.{/n} "Ты тоже получишь порцию парализующих снов. Но тебя я оставлю себе — ты ценнее в моих руках, чем в лапах безумца, играющегося с огнем".'
- guid: a673ea89-cd6c-49a8-be49-adbc64ae3ec8
  text: '{n}Отряд аколитов Инквизиции тайно реквизировал оскверненную машину. Спустя короткое время на Даргонус стали поступать очень любопытные анонимные предупреждения, каждое из которых, несомненно, было оплачено кровью и душой самоотверженного защитника Империума.{/n}'
- guid: a67ac0f1-c00b-4946-8d2c-3dd1280e0589
  text: '{n}Худощавый сгорбленный мужчина изучает вас пронзительным взглядом. Один глаз его скользит по вам, другой заменен массивным аугментом, древним и украшенным золотом, но почему-то выключенным. Сухим голосом он констатирует:{/n} "Призраки небытия ступили на палубу племени акобов".'
- guid: a6a58c26-69e7-4152-9d00-cd7c7c457474
  text: '{n}Она вздрагивает, заметив рядом с вами Кибеллу.{/n} "Служительница культа смерти? П-право, как неожиданно... кого-то требуется предать суровой каре во имя Императора?"'
- guid: a6b776c3-bfe6-40eb-941f-2811754492ba
  text: '"Мы можем помочь друг другу, элантах. Ты станешь моими крыльями, я — твоим разящим копьем. И гласом разума при встречах с моими собратьями. Если этого мало..." {n}Ирлиэт задумывается на мгновение и осторожно продолжает.{/n} "Я обещаю тебе славную награду, элантах. Сокровища моего мира, сокрытые в пустоте космоса, в обмен на спасение моих собратьев. Все это в том случае, если сей договор не будет нарушен".'
- guid: a6fd7f5b-b262-43d2-aae8-661c4ac61798
  text: '{n}Глаза Джай изумленно распахиваются.{/n} "Я не хотела оскорбить вас, шерин. Это была... шалость. Впрочем, если она ранила ваше сердце, я смиренно принимаю строгий приговор. Простите меня".'
- guid: a76cb32b-537b-4518-a8d5-9bdad556fc32
  text: '"Я на самом деле-то поговорить про кое-что важное пришла, как раз касаемо шепотков моих". {n}Идира нервно прикусывает губу и смотрит на вас с надеждой.{/n} "Я видения всякие начала видеть интересные... И, кажется, от того как мы с ними обойдемся, судьба моя зависеть будет. Знаю, звучит драматично, но я на полном серьезе. Как будет у вас момент, окликните меня на мостике, ага?"'
- guid: a7719147-b47a-4c4a-ab9c-dab0e677b8ef
  text: '"Опасность! Регистрирую богохульную активность!" {n}Вопреки угрожающему вскрику, сам Паскаль не выглядит изготовившимся к бою. Он жадно взирает на работу еретического механизма, ловя каждый щелчок шестеренки. Мехадендрит словно сам собой любопытно тянется к исковерканной машине хаоса.{/n}'
- guid: a7e7bc20-753a-4eff-93a7-ce6b84689a2e
  text: '{n}Улыбка Винтерскейла сменяется злобным оскалом.{/n} "Я не учу тебя, как вести дела твоей династии. И ты не лезь в мои".'
- guid: a808de50-1251-4919-9bff-328827521be6
  text: '{n}Побагровевший Зауэрбэк явно рад смене темы.{/n}'
- guid: a81b642b-feaa-4f76-b377-f809f54ff7ae
  text: '{n}Беженцы с Кьявы Гамма смотрят на вас, кто — хмуро и настороженно, а кто — с нескрываемой благодарностью.{/n}'
- guid: a8531660-46e3-474f-a342-12e2ac7adb9d
  text: '{n}Паскаль отвечает лишь сухим белым шумом из вокса.{/n}'
- guid: a861a304-382f-45c8-b822-47705cf09008
  text: '{n}Холодный воздух вокруг пронизан запахом медикаментов и стонами боли. Две фигуры склонились над прикованным к операционному столу пациентом с окровавленной головой. К столу упорно пытается прорваться женщина в военной форме.{/n}'
- guid: a880b8da-942a-4106-b75f-b3eb45a86ea6
  text: '{n}Хейнрикс кривится.{/n} "Я... понимаю твой порыв. Как человек. Но как дознаватель я не вижу ни единой причины оправдать твой поступок".'
- guid: a894f581-af82-47dd-bd61-74653ca9c867
  text: '{n}Крепкая женщина с копной огненных волос настраивает неизвестный вам аппарат, из которого доносится мелодичное позвякивание. Нижнюю челюсть женщине заменяет грубого вида {g|Encyclopedia:Augmentation}имплант{/g}. При вашем приближении он начинает двигаться — словно отдельно от остального лица:{/n} "Добро пожаловать в "Адептус Амасекус", {mf|господин|госпожа}. Чем Октавиана может вас порадовать? {g|Encyclopedia:Amasec}Амасек{/g}? Лхо? Что-то более... интересное?"'
- guid: a89b4501-a71e-4b1b-bb8f-0d7f283a7e8b
  text: '"Магос Ханейманн, именем Омниссии я призываю тебя принять мою помощь в акте экстракции чужеродных механизмов". {n}Тревога вибрирует вокруг Эоганна полем гальванической статики, заставляя волоски на тыльной стороне ваших ладоней топорщиться.{/n} "Я смогу избыть скверну, и твое служение не прервется, если позволишь мне..."'
- guid: a8c33c76-a3b2-4b7a-8825-c723d10294aa
  text: '"Короче, ты превратил{mf|ся|ась} из Вольного Торговца в кусок кракенова говна. Очень интересно, но заткнись". {n}Ульфар переводит взгляд на вас.{/n} "Только что я понял, как мало ценил твою духовную стойкость, эттфатер".'
- guid: a8c73bf3-7dea-4a9f-b686-ec240aea2f60
  text: '{n}Группа подростков, явно одетых в лучшую, отглаженную одежду, выстраивается перед вами в ровную шеренгу. Часть смотрит на вас во все глаза, как на мифическое существо, часть — испуганно жмется и отводит взгляд.{/n}'
- guid: a935e67b-de96-4a25-b94a-808b41478ebf
  text: '"Элантах!" {n}Ирлиэт привлекает ваше внимание жестом.{/n} "Как ты когда-то искал{mf||а} моей помощи, так теперь я прошу твоей. Пришло время развеять последние тени на нашем пути".'
- guid: a9518c6b-f0ef-42fa-a3b0-1be4faacb531
  text: '"Вы..." {n}Себериан резко умолкает. Морщинки возле органического глаза разглаживаются. Когда взгляд, проскользнув по вашим спутникам, оставнавливается на вас, в нем нет ни тени былых эмоций — только надменная холодность, с которой он встретил вас впервые.{/n}'
- guid: a95d8b4b-e8b4-4816-988a-ccf2d1d3e976
  text: '{n}Бригадир облегченно выдыхает.{/n} "Не хватало еще Лорд-капитана потравить, храни Император".'
- guid: a95dfac9-38d3-464e-8db8-48cdd4bcae39
  text: '{n}Процедура 0-Х исполняется без нареканий. Бинарная песнь звучит в ноосфере мира. Согласно очередной загадочной директиве Процедуры в резиденцию Вольного Торговца на планете был доставлен загадочный предмет.{/n}'
- guid: a9711daf-d54f-4e4f-8f2d-ce6b3ce2b6b3
  text: '{n}Под удивленными взглядами старших офицеров аугментированное шествие следует вдоль всей палубы и останавливается в десяти шагах от вашего трона. Со всех сторон участников процессии подпирают блюстители, но люди не перестают выкрикивать благословения в вашу честь. Большая часть шествия состоит из низших офицеров и нижнепалубных обитателей — их расчерченные шрамами лица горят неподдельной преданностью. Вперед выступает перемотанный бинтами человек неясного возраста со знаками отличия на груди.{/n}'
- guid: a9850c4b-b542-4a4b-83e5-fa46a4d1f75c
  text: '{n}Пациент, спасенный вами еще при первом посещении Заркова, хотя и выглядит неважно, но крепко сжимает лазружье.{/n} "Кажется, вы спасли меня уже дважды, Лорд-капитан".'
- guid: a9a2d24e-35ea-4592-a149-fa85f7b79f85
  text: '{n}Хейнрикс {d|Encyclopedia:CompHeinrix_Humane}резко выдыхает{/d}, воздух вокруг него перестает леденеть, а стражник валится на землю, надрывно кашляя и отплевываясь кровью.{/n}'
- guid: a9d5a232-fa4e-48e5-b2fc-15702eef70ae
  text: '{n}Приземистый мужчина, с почти утопленной в широких плечах шеей, не спеша складывает аквилу на груди.{/n} "Уже видались, вашество. Извините, что сразу не пустил — работа такая".'
- guid: a9f49e64-42bd-45da-812c-a4cb02187ae0
  text: '"Хорошо, я понял. Если не уступлю, мы так и будем стоять тут и препираться". {n}В голосе нет больше ярости, только безграничная усталость.{/n} "Хватит, вы добились своего".'
- guid: aa14dd68-5ec7-4b2f-b240-1fbcfd2bd8b2
  text: '{n}Хейнрикс демонстративно прочищает горло.{/n} "Насколько мне известно, участие в этом Инквизиции доказано не было. Не стоит распускать сомнительные слухи. Это весьма неблагонадежно".'
- guid: aaea348f-cced-47fa-81e4-8ed19cb78890
  text: '{n}Существо в кресле, кажется, вросло в него: вы видите пергаментно-розоватую кожу, растянутую между обшивкой сиденья и конечностями — в которых слишком много суставов для обычного представителя Человечества. {g|Encyclopedia:Navigator}Навигатор{/g} тяжело дышит, воздух со свистом выходит через две жаберные решетки, темнеющие на его щеках. Глаза создания закрыты — и обычные два, и третий, расположенный прямо в середине лба.{/n}'
- guid: ab2543c4-213d-4792-8ad8-6681f97148f2
  text: '{n}Никаких сомнений — в контейнере сложены ксеноартефакты, еретические творения врагов Человечества. Один вид этих чуждых и противоестественных предметов вызывает у вас смутную тревогу, пусть вы и не знаете, что именно находится в чехлах.{/n}'
- guid: abad26c6-7481-4f68-a134-0be1ddb6192b
  text: '{n}Абеляр бросает многозначительный взгляд в сторону Иокасты.{/n} "В мастерстве убеждения вашим людям не откажешь, госпожа Зауэрбэк. Но это уже ни в какие ворота не лезет".'
- guid: abfa1558-9d8f-46cf-8de6-6ae6304d6636
  text: '{n}В массивный когитатор встроен человеческий торс — бесчисленные кабели опутывают иссохшее тело и змеятся под бледной кожей.{/n} "Идентификация: Вольный Торговец фон Валанциус. Инициирую переход протокола "Забвение" в финальную стадию". {n}Судорожный хрип вырывается из вокс-решетки, и речь человека становится живой и полной желчи.{/n} "Наконец-то ты здесь, отпрыск. Теперь можно покончить со всем".'
- guid: ac55f086-9981-48ea-b27b-cc07af36565d
  text: '{n}Техножрец прикасается к экрану инфопластины, извлеченной из складок робы.{/n} "Омниссия обвиняет".'
- guid: ac7f09b6-44e7-43e9-aefa-95a05968c844
  text: '{n}Триасомата выглядит стабильнее. Еще немного, и вам удастся его успокоить.{/n}'
- guid: acac3f11-fd5f-4a90-aaea-010d47f92c99
  text: '"Я думала, что уже разгадала мысли мон-кай. Но ты, элантах, предпоч{mf|ел|ла} пройти бок о бок со мной весь этот путь, обзавестись новыми шрамами души, пережить ужасы Комморры... лишь для того, чтобы в самом конце отвернуться от меня?" {n}Ирлиэт отстраняется и медленно кладет руку на оружие.{/n}'
- guid: acad2774-d1f1-44a3-acce-d27f0818a536
  text: '{n}Несмотря на множественные раны, Соломон стоит твердо. Глаза проктора горят, словно у него открылось второе дыхание.{/n} "Мой отряд пал, нужна перегруппировка. Действуем так: я иду с вами, один из вашей свиты остается руководить обороной точки вместе с выжившими Арбитес".'
- guid: acb962cc-d351-490f-a820-e5e0bacb0113
  text: '{n}Сам же плененный человек — если его все еще можно назвать человеком — кажется просто гигантом в сравнении с сопровождающими его блюстителями. Смертоносная сталь матово сверкает в обрамлении выцветших алых роб, руки смиренно сложены, мехадендриты застыли в покое.{/n} "Я приветствую властител{mf|я|ьницу} сего прекрасного корабля-храма и смиренно прошу прощения за незваное вторжение".'
- guid: acdd3851-eff0-4786-afca-0217ddecca6f
  text: '{n}Заккари Вайс, высокий старец в длинной зеленой робе, замер перед когитатором. Чем ближе вы подходите, тем более отчетливо слышите его беспрерывный, неразборчивый шепот. Он резко замолкает и оборачивается к вам еще до того, как вы успеваете его окликнуть. {/n} "Лорд-капитан".'
- guid: ace44c0a-b114-412c-a771-d1796aaf6704
  text: '{n}Голос Соломона тих и серьезен.{/n} "Перед тем как я отвечу... Я слышал разговоры ваших офицеров, и мне кажется, что кое-чье сердце может быть разбито. Вы уверены, что после не сочтете это ошибкой?"'
- guid: ace57462-7699-4224-89da-8cce6c52d784
  text: '{n}Леди-Навигатор прикрывает глаза, и дрожь в ее теле постепенно стихает. Усталым движением девушка поправляет налобное украшение, осторожно прикрывая око навигатора, и вы более не чувствуете исходящую от нее угрозу.{/n} "Спасибо. Благодаря вашим словам, мне... уже стало лучше".'
- guid: acf3a330-7673-4bee-aec6-29514f109cba
  text: '"Ее ждут перемены". {n}Кибелла рассекает воздух рукой.{/n} "Странствия подле тебя {d|Encyclopedia:CompKibellah_Fanatic}многое{/d} открыли мне. Мы слишком долго таились в тенях! Потому мы не предотвратили злодеяния Немезита и заговор генетических выродков. Потому не уберегли Домин''Теодору. И я не позволю этому повториться с тобой! Кровавая паутина протянет свои нити из теней и впитает новую кровь".'
- guid: ad2e1511-f4d3-4e95-b1c4-2c10a9b03a87
  text: '"Номос — это сознание, осознание, познание. Движение. Всегда — движение", {n}— сервитор ненадолго замолкает.{/n} "Мы не знаем, что мы есть. У нас нет прошлого. Мы пробудились в недрах корабля, повинуясь зову. Наше первое ясное воспоминание — зов твоей крови, {name} фон Валанциус. Зов и просьба о помощи — у места что зовется камерой Патента".'
- guid: ad6f6bdf-594d-478e-8bab-2a5744547761
  text: '"Тогда... я просто заставлю вас". {n}Кассия закрывает глаза на мгновение и подносит ладонь к своему Атласу.{/n}'
- guid: ada944eb-0edc-48dd-979d-36eb4e1b6299
  text: '{n}Хейнрикс вздыхает.{/n} "Ваша прямота в выражении чувств делает вам честь. Увы, вам придется вновь предоставить мне место на своем корабле".'
- guid: addfad73-459b-4433-91ff-3caea27f0fc9
  text: '{n}Мастер вокса понятливо кивает.{/n} "Мы постараемся угодить вам, Лорд-капитан".'
- guid: ade4c5a5-45fd-4573-8ebc-3412085bd5c6
  text: '{n}Проктор всем своим весом обрушивается на прутья клетки, металл жалобно скрипит...{/n}'
- guid: ae19c94a-4520-44d9-8081-cd14e87388fc
  text: '"Вижу, вы теперь служите не Лекс Империалис, а интересам Вольного Торговца". {n}Женщина решительно сжимает оружие.{/n}'
- guid: ae915fcf-5221-4ff5-a2ab-9b864de10066
  text: '{n}Голос Соломона звучит враждебно, словно вы — источник всех его бед.{/n}'
- guid: aeed886e-7837-4cb1-92be-e8cbde20f6ce
  text: '{n}Из {g|Encyclopedia:Vox}вокса{/g} доносится шелест.{/n} "Изгоните недостойных от алтаря прочь, технобратья, ибо Шестой параграф безопасности гласит: "Да пребудет Знание взаперти от несведущих". Средь темных умов не должно звучать проповеди моей".'
- guid: af06f9b4-57be-443d-b60b-ab004e6531bf
  text: '{n}Кибелла достает из колоды четыре верхние карты и раскладывает перед вами лицевой стороной вниз.{/n}'
- guid: af1fcf52-2d67-4854-8471-4a959b17da59
  text: '{n}Обручи движутся и... возвращаются в прежнее положение. Придется начинать сначала.{/n}'
- guid: af552b70-d689-4ad9-97b6-0911c4b7eb55
  text: '"В циклах предутвержденных... затаился изъян... почитания..." {n}Тело техножреца сотрясают конвульсии, {g|Encyclopedia:Vox}вокс{/g} издает жалобный, болезненный скрип бинарных молитв. И с каждым мгновением сигнал этот становится все менее разборчивым, будто нечто искривленное и неправильное примешивается к нему.{/n}'
- guid: af684f66-c8c6-4db9-994b-806629d30094
  text: '"Ваша Светлость полна сюрпризов". {n}Фалько с трудом сдерживает ухмылку, кивая в сторону тела Джай.{/n} "Позвольте без лишних прелюдий — ваше время слишком ценно, и я не смею тратить его больше необходимого. Вы знаете, зачем я здесь: Меркатум. Табула. Официале".'
- guid: af8b8a95-5c66-4c80-8b8b-4bba13d73c27
  text: '{n}При виде Арлекина Кассия хватается за голову, и кровь алыми струйками стекает по ее щекам.{/n} "Твои цвета, ксенос... изломаны и неправильны, словно преломляются сквозь искаженную призму! То, что должно быть привычно, — рассеивается. А чуждые оттенки все пляшут и пляшут в безумном танце..."'
- guid: afe123d8-d50f-4128-a6e8-bcb1f2235ecc
  text: '{n}Вокруг руин Сципионы 84-249 были разбиты обширные трудовые лагеря, куда согнали беженцев из пустошей и соседних ульев. В суровых пустошах, выжженных промышленным ядом, с минимумом еды и чистой воды обитатели лагерей принялись за тяжелую и опасную работу — восстановление павшего дома.{/n}'
- guid: b015c4a6-36e5-47bf-8d88-989f99313e3d
  text: '"Что... ты делаешь? Это кощунственное нарушение литании активации. Это... ересь..." {n}Голос Паскаля становится тихим, хриплым от статики... зачарованно любопытным и испуганным. Мехадендрит беспомощно клацает клешнями.{/n}'
- guid: b0418afe-4aef-4939-a9f8-d158d770d017
  text: '{n}Исследовав архивы еще немного, вы находите уцелевший кусок отчета капитана стражи, из которого удается понять, что системы защиты недавно переключали без его согласования. Комментарий капитана гласит:{/n} "Доступ к системам жизнеобеспечения имеют лишь хранители станции... Но господин Теобальд все время находился подле Дитя, как и я. Неужели..."'
- guid: b1ada0d8-732f-493f-a677-fa6602d30dd9
  text: '{n}Простолюдины перешептываются, отчаянно кивая друг другу — вы то и дело ловите направленные на вас восторженные взгляды.{/n}'
- guid: b1cf4fe7-11f8-4ff8-8523-36322a7383fd
  text: '"Мерзавка! Да кем ты себя возомнила? Может, сразу начнешь убивать неугодных, как делала до тебя Тисифона?" {n}Ярость на лице Элины сменяется отчаянием, когда до нее доходит смысл собственных слов. Она медленно тянется к Атласу в груди, со страхом взирая на Кассию.{/n}'
- guid: b1d75a7a-94ed-4d8e-b6e8-f6029f295dac
  text: '"Хм... когда-то этим миром управляли блестящие служители Омниссии. А сейчас никто из них не вспомнит даже простейшее таинство опознания для "Галливеруса"". {n}Синтезированный голос Себериана приобретает откровенно сварливые нотки.{/n} "Что за времена настали..."'
- guid: b222cc02-b6a9-47e5-800b-939ce6e6af24
  text: '"Лорд-капитан, срочное сообщение! Блюстители задержали опасного диверсанта, пытавшегося проникнуть на мостик. Я полагаю, что это... стоит вашего внимания. И сам диверсант, и обстоятельства его поимки довольно необычны". {n}Голос Вигдис звучит странно — не то озадаченно, не то взволнованно.{/n}'
- guid: b2dc6721-cda7-46a2-9f95-eedb125995ff
  text: '{n}Обычно бесстрастное лицо Ирлиэт искажено в гримасе боли и ярости. Ваш {g|Encyclopedia:Elucidator}Толкователь{/g} оживает, когда она начинает говорить на своем языке.{/n} "Клянусь расколотым сердцем Кхейна, Муаран, ты ответишь за свое коварство! Пускай Мораи-Хег сломает твою судьбу и выбросит ее прочь, пусть кровь Эльданеша зальет твое горло..."'
- guid: b334917a-ec01-4d9e-823c-5cbe070d6335
  text: '{n}Вой людей, готовых убивать, стирает мои слова. Я ищу взглядом тех, кто вызвался помогать мне, но не вижу их.{/n}'
- guid: b355847a-be47-4854-9e27-56760df4b3ef
  text: '"Конечно-конечно... Остановите музыку! Звездное Сиятельство желает тишины!" {n}Полумеханический оркестр со скрипом замирает, уставившись перед собой невидящими глазами.{/n}'
- guid: b37aaabb-5abb-4b61-8bea-b719304f74bc
  text: '{n}Сколько бы вы не изучали Орудие Боли, вам так и не удается понять причину его поломки.{/n}'
- guid: b3962a4d-0633-4d36-9336-58fc693ac5a4
  text: '"Золото трона! Я же почти, почти разгадала, как этот ашмаг командует крысенышем! И все-таки что-то упустила. Ритм не тот? Слишком тихо пела? Хм..." {n}Торговка кидает парню монету и виновато пожимает плечами.{/n} "Простите, шерин. Бывают дни, когда удача просто поворачивается к тебе жо.. ягодицами".'
- guid: b3cde38a-0c23-401d-a19f-57b62107810e
  text: '"Похвальное стремление, и вдвойне любопытно, что я слышу о нем именно здесь и сейчас". {n}Наследница смотрит на вас с живым интересом.{/n} "Нам стоит обсудить все детали".'
- guid: b3cf20c2-81f5-46b9-8590-5941e9927cd3
  text: '{n}Некоторое время регент хранит молчание.{/n} "Мы бы солгали, признай ваше изречение ложным. Долгие годы нам удавалось поддерживать хрупкий баланс внутри Дома, однако... отбытие {g|Encyclopedia:Novator}новатора{/g} сильно пошатнуло веру некоторых из нас".'
- guid: b42d8c34-2f32-49d8-8604-40692fe1b7c7
  text: '{n}Вам на глаза попадается изъян в конструкции механизма — открытый участок "позвоночника", забитого кабелями. Вы перерубаете провода — и машина с утробным воем содрогается в пароксизме боли. Огромные когти с невыносимым визгом скребут по полу, челюсти щелкают в последний раз — и мертвая махина с грохотом падает, выбив своим телом несколько искр.{/n}'
- guid: b43e9104-9e1e-40d2-a3b0-a10a7efa8245
  text: '{n}Хейнрикс произносит так, чтобы слышали только вы:{/n} "Похоже, он принял нас — вас — за агента Инквизиции".'
- guid: b4503370-7955-4a8e-9c6e-d73fe656ba04
  text: '{n}До вас доносится тихое пренебрежительное фырканье.{/n} "Эта застава не стоит даже снаряда, который ее уничтожит, но раз ты настаиваешь..."'
- guid: b49b5b64-66c2-4068-8b58-573f65b4c666
  text: '{n}Из ослепительного инферно, из испепеляющей преисподней, из всепобеждающего пламени вы выступаете, едва держась на ногах. Кровь, бьющая в ушах, заглушает весь мир, глаза, залепленные сажей и опаленными ресницами, отказываются открываться. Освободившись из пылающего ада, вы делаете всего два шага — и падаете на колени.{/n}'
- guid: b4a160d9-3b36-4d1f-b2a7-f5d5ada35e30
  text: '"Занимательное решение. Как пожелаешь". {n}Ювенна сощуривается, пристально глядя на вас.{/n}'
- guid: b5161918-5721-4675-8bba-406b72845a01
  text: '{n}Мужчина неопределенного возраста оборачивается к вам и шумно вздыхает. По дыханию понятно, что он прибыл на церемонию после одного-двух стаканов крепких напитков.{/n}'
- guid: b51a7690-556a-4eb5-9864-9eca67cd8492
  text: '{n}Здоровяк возле Винтерскейла прищуривает кровавые глаза, его рот растягивается в щербатой улыбке, исполненной предвкушения. Но она умирает, стоит Каллигосу осадить своего слугу небрежным хозяйским жестом.{/n}'
- guid: b5ee7043-f24c-4ff8-80da-e58088eb6125
  text: '{n}С каждым шагом лица ваших благочестивых компаньонов начинают выражать все больший и больший ужас.{/n}'
- guid: b5f739fb-cc11-436c-90d4-7c266e1c5505
  text: '"Вот и она, Лорд-капитан... Бог-Император защити, впервые вижу ее так близко". {n}Капитан Дунавски смотрит на чудовище со смесью ужаса и восхищения.{/n} "Я вижу два подхода. Один к цветку, второй — к наросту. Первый исторгает ядовитый дым, а второй плодит хищных мух. Я видела как они объедают руку до костей за полминуты. С какой стороны прикажете заходить, Ваша Светлость?"'
- guid: b6b24c81-05c7-478c-8d75-0844b6b56379
  text: '{n}Голос мандрагоры едва разборчив — существо не привыкло говорить на языке своих темных сородичей.{/n} "Дракн не принс жертву за нши деяния. Дракн должен стать жертвой".'
- guid: b78cecf0-1351-403d-ae70-3222cfaadd0a
  text: '{n}Взгляд живого глаза Себериана впивается в вас.{/n} "Никто в нашем роду излишками оного не был награжден".'
- guid: b7cbbfb1-355c-4636-9b0a-1313957a46bf
  text: '"Благодарю. Это важно для меня". {n}Джай с облегчением прикрывает глаза.{/n} "Это не отвлечет тебя от важных дел".'
- guid: b85bc0fc-196e-4419-8bf4-ee1839685a13
  text: '"Домин''{name}. Ты все же спустил{mf|ся|ась} во мрак". {n}За глазницами костяной маски едва удается разглядеть туманный взор девушки.{/n}'
- guid: b8904daa-faba-47b8-8be2-fc8312fd6e03
  text: '"Джи... Джиневри ее звали..." {n}Несостоявшийся еретик поднимает руки к лицу, и вы видите фиолетовые синяки. Они старше других, им уже несколько часов. Его били долго, старательно. Он громко кричал... Кто-нибудь обязательно это видел.{/n}'
- guid: b8ae3ccc-3134-4445-b661-bd32f5260b36
  text: '{n}Гигант в багровой броне сосредоточенно читает зловещие литании, и слова, срывающиеся с его уст, обращаются мерзким эфирным смрадом и снежинками потустороннего льда. Он не замечает вашего прибытия.{/n}'
- guid: b8c0569f-aa73-4db9-81db-92c978023fd4
  text: '{n}Арджента сумрачно произносит:{/n} "Когда мы убьем эту еретичку и вернемся на корабль, я желаю поговорить с Идирой. Эта встреча — знак, призывающий к бдительности".'
- guid: b8de2ed7-2d91-4bbb-9739-ab05d69932bb
  text: '{n}Вайс жует губы, словно пробует ваши слова на вкус.{/n} "Полагаю, вы бы могли, Ваша Светлость. Однако я не смею рисковать вашей безопасностью. Что за хормейстер погубит своего Лорд-капитана?"'
- guid: b90cfbca-fcd9-4e5a-b406-191347e84874
  text: '{n}Взгляд Номос упирается в Осколок К''тан.{/n} "Это твой удар и жажда вырваться из темницы породили нас".'
- guid: b977fb88-ac15-4b99-84fc-e4a53289629c
  text: '{n}Дознаватель молчит несколько секунд.{/n} "Вероятно. Вероятно, это именно то, что произошло. Однако столь тяжкое обвинение, даже из уст слуги Хаоса, вызывает беспокойство. Жаль, что у нас не было возможности взять проклятого Астартес живьем, чтобы вытрясти правду..."'
- guid: b9b67907-c0f4-416b-8108-9e84f1ff2f85
  text: '{n}Рука бродяги стремительно тянется к оружию... и останавливается, когда бедолага понимает, что сам отдал его вам. На его уродливом лице возникает плаксивая гримаса.{/n} "Облапошили меня, да? Не надо... Что я вам сделал-то?"'
- guid: b9e67fa2-9005-48fc-a038-a29ab25bffe0
  text: '"А теперь позвольте откланяться — я начну подготовку к путешествию. Из того, что мне удалось узнать, нам сначала необходимо посетить систему..." {n}Рубиновые глаза расширяются от удивления.{/n} "...Провидение Орселлио. Надо же. Быть может, страницы истории лгут? И вовсе не Калейн Орселлио подарил ее звездам название? В любом случае, именно из этой системы Тисифона начала свой путь, и мы отправимся по ее давно забытым следам".'
- guid: b9eaa525-f8c7-4cc6-90f7-0eb682ce78ec
  text: '{n}Тусклая {g|Encyclopedia:Aquila}аквила{/g} на воротах отсека внимает бессвязному лепету распростертого пред ней Триасоматы. Надрывные стенания триединого праведника то и дело прерываются лязгающим стуком аугментированного черепа о палубу. Из скоб на лбу сочится вязкая смесь крови и масла, а ногти обломаны в попытках выдрать из себя импланты.{/n}'
- guid: ba28dc0b-78b8-4b3f-be29-c9f7a1e832ac
  text: '{n}Зораэль приветственно кивает вам. Броня космодесатника покрыта щербинами, плащ истрепан, но немигающий, внимательный взгляд ясен и сосредоточен. {/n}'
- guid: ba4ae4c3-4983-4f36-894f-6c1987997ac4
  text: '{n}В нос бьет запах {g|Encyclopedia:Promethium}прометия{/g} и горелого мяса. Обычно людный медотсек кажется пустым и тихим. Под ногами хрустят осколки, перемешанные с кровавыми ошметками. Рядом с местом взрыва собрались блюстители. Иокаста быстро оборачивается на вас, восклицая:{/n} "Лорд-капитан! Вы уже здесь!"'
- guid: ba5fd8c9-6268-4b97-9eb6-cb6e866f18c1
  text: '"Достаточно". {n}Голос Кибеллы, холодный и шершавый, пробирает до мурашек.{/n}'
- guid: baa4fa68-9987-4322-8d19-2c6842e46c46
  text: '{n}Сверкнув глазами, Арджента яростно произносит:{/n} "{g|Encyclopedia:Xenos}Ксеносы{/g} осквернили твой разум, {name}. Я не дам тебе причинить вред этому человеку! Отступи, или падешь!"'
- guid: baa83afe-0773-4e11-b075-331e8a2eb658
  text: '{n}Простолюдины взволнованно перешептываются — один из них с сомнением качает головой, поглядывая на вас исподтишка.{/n}'
- guid: baedf7ab-3d1a-4c58-8fa0-9e10fe327223
  text: '{n}Простолюдины понимающе кивают, внимая каждому вашему слову.{/n}'
- guid: bb0699ab-044d-4729-9a28-22637ef0067a
  text: '"Значит вот как боги решили с этим покончить". {n}Эльдар складывает незнакомый жест, и воины вокруг берутся за оружие.{/n} "Дети Азуриана, сражайтесь с яростью Кхаэла Менша Кхейна!"'
- guid: bb101349-fc2b-46b6-b485-ad4ede34097a
  text: '{n}Теобальд бесстрастно пожимает плечами.{/n} "Мое служение Дому подходит к концу. Раны, нанесенные Фелеком моей плоти, уже никогда не заживут. Я... умираю. Слава Золотому Трону — достаточно медленно, чтобы успеть позаботиться о Дитя".'
- guid: bbd74861-4c5a-48b4-a0a8-d41162da48ca
  text: '{n}Судя по значкам на корпусе, она принадлежит Соломону. В первых заметках вы находите целые досье, собранные из наблюдений за вашими старшими офицерами и членами свиты. Привычки и мелкие пороки, круг знакомств, психологические характеристики.{/n}'
- guid: bbd97ca6-99bf-43fb-9d64-59d7890fe47c
  text: '{n}Мужчина вскидывает голову и будто впервые вас видит. Но стоит ему открыть рот, как он вздрагивает всем телом и его глаза заволакивает пелена.{/n} "Имперская гвардия найдет моего сына. Найдет Тацита, я уверен..." {n}Офицер вздрагивает снова и прижимает руку к лицу.{/n}'
- guid: bbefac99-af72-4cea-82be-3aac4fccd217
  text: '{n}Очередь гудит тысячей голосов. Кто-то разложил спальное место и готовится отходить ко сну, кто-то играет на диковинном музыкальном инструменте, многие молятся. Несколько благородных господ обсуждают, у кого из них важнее прошение.{/n}'
- guid: bbfe0ddb-276a-4c4c-92d5-906ab96f6f2c
  text: '"Их... их цвета!.. Ужасные, пугающие, изорванные в клочья оттенки! Лишь безумец мог сотворить с собой подобное..." {n}Кассия в ужасе отводит взгляд.{/n}'
- guid: bc18cebe-f62c-4697-859d-638aeb84e02a
  text: '{n}Эоганн задумчиво рассматривает распростертый на оцинкованной поверхности полутруп.{/n} "Выбор сделан, но не почтите ли вы меня ответом на вопрос — почему он? Я обязан познать цепочку ваших размышлений".'
- guid: bc3c1330-a121-4ea3-9154-1da0bc10b620
  text: '{n}Спустя мгновение тварь, почуяв тепло, приходит в движение. Слепо пошарив по коже, она обнаруживает провал вашего носа... и устремляется вперед, растягивая кожу и разрывая слизистую. Нестерпимая боль охватывает вас, когда личинка начинает прокладывать себе путь сквозь мягкие ткани и хрящи, каждое ее движение, кажется, громким хрустом отдается во всем черепе. Создание жадно вгрызается в плоть и движется вперед и выше, выше, за переносицу, за глаза... а затем в ваше сознание вторгается нечто чуждое.{/n}'
- guid: bc54bf0a-fe6e-480e-b4c6-c784103d3b24
  text: '{n}Старый слуга бросает на вас цепкий, оценивающий взгляд.{/n} "Ваша Светлость, чем могу быть полезен?"'
- guid: bc94647f-d492-4c25-80c3-4582a46edb87
  text: '{n}Себериан молчит.{/n}'
- guid: bca654fd-bbd6-4f4b-9771-1d11ab28825b
  text: '{n}Кибелла неопределенно кивает.{/n}'
- guid: bca9279f-eebd-43bd-b318-7ccf64486d54
  text: '{n}Пол клетки завален трупами — мертвые руки свисают меж прутьев, бледные лица прижаты к холодному металлу. Над ними возвышается Кибелла, замершая между двух женских фигур. Она внимает их зловещему шепоту, руки ее безвольно опущены.{/n}'
- guid: bcac2f66-0051-47b7-ad3c-96649ef55238
  text: '"Кха-кха... Рассчитывать на твою помощь? Думаешь, в это хоть кто-то поверит после твоих ублюдочных экспериментов?" {n}Джай касается шрама на шее и заходится кашлем.{/n}'
- guid: bcfe31a7-ad3d-4029-8df0-dabf16f92f25
  text: '{n}Копия окидывает контрабандистку брезгливым взглядом.{/n} "Ты. Дрожащая тварь, что выбрала продаться Архиврагу вместо того, чтобы искупить грехи под моим началом. Твоя гнилая душа переродилась в очищающем пламени".'
- guid: bd8803ee-1703-4daf-839e-ea52448cb647
  text: '"Милости... прошу, спасите меня..." {n}Юноша лихорадочно хватает воздух обгоревшими губами, то впадая в полубред, то вырываясь из него. Кожа стекает по тощему телу, как расплавленный воск со свечи. Из-под спекшихся век на вас смотрят чудом уцелевшие глаза, живые, ясные и полные боли.{/n}'
- guid: bdb7ad45-1787-49d1-a3e2-69075917beb8
  text: '"Флот эльдаров? Это значит... выживших с Крудараха намного больше, чем я смела надеяться". {n}В голосе Ирлиэт, прорывающемся на дополнительном вокс-канале, звенит отчаяние.{/n} "Элантах, я... я должна спуститься туда, на планету. Отыскать их. Попытаться спасти..."'
- guid: bec47b02-d285-4a17-8c81-ff592acc79fe
  text: '"Это правда, {name}. Я..." {n}Кассия опускает взгляд, отчаянно стараясь скрыть проявившуюся на ресницах влагу.{/n} "Я хочу ответить вам "да". Но не имею права. Не после того, что мы узнали об Атласе. Не после того, что сотворила Тисифона".'
- guid: becb60bb-57ed-4de4-bc92-bc22c0f5606e
  text: '{n}Погруженный в работу Эоганн замирает на мгновение, прислушиваясь к Нунциусу, бросает взгляд на {g|Encyclopedia:Cogitator}когитаторы{/g} и качает головой.{/n} "Нет, дражайший коллега, слишком много".'
- guid: becfc260-30ce-4f99-9180-a5964a40b740
  text: '{n}Сенешаль бессильно скрежещет зубами.{/n} "Однажды я пойму всю глубину и мудрость ваших решений, Лорд-капитан, а пока буду молиться, чтобы этот поступок не аукнулся вам в будущем".'
- guid: bf1ee989-7409-4ed2-8687-381805b14669
  text: '{n}Бомбардировка мегатонными снарядами стерла мануфакторум в прах. Эпидемия прекратилась, однако потеря величественных цехов сказалась на производственных мощностях мира.{/n}'
- guid: bf4d93aa-43a3-40eb-895e-6770f245f896
  text: '"Я?!" {n}Ощерившись, Ризза хватается за оружие и затравленно смотрит на блюстителей.{/n} "Но я не сражалась против вас! Я не поддержала Владайма!"'
- guid: bf612338-d9ae-4feb-945f-2cf961a9da7a
  text: '{n}Муаран некоторое время молча сверлит Ирлиэт взглядом, будто что-то взвешивает, а затем повелительно изрекает:{/n} "Ты пришла внезапно, Изгой Ирлиэт. Но, быть может, не без причины. Ты послужишь своему народу в скором времени".'
- guid: bf7f10a9-bf51-492f-a150-6ad3b175f7f7
  text: '{n}Губернатор утомленно глядит на сенешаля из-под тяжелых век:{/n} "Возможно, пришлому ставленнику Леди Теодоры нет дела до священных традиций наших предков-основателей. Однако {name} фон Валанциус — потомок истинных детей Даргонуса".'
- guid: bfb9085a-6cb8-420b-9aa3-d6aa8eb6b672
  text: '{n}Идира, сутулясь и шмыгая носом, поспешно входит в кабинет. Вид у нее изможденный — под глазами мешки, волосы всклочены, а по рукам то и дело проходит мелкая дрожь. Она с трудом фокусирует взгляд на вас и выдает кривую улыбку.{/n}'
- guid: bfcce0c4-112a-4477-ae9b-58d232624cce
  text: '{n}Звездная гавань встречает вас грохотом снарядов и щекочущим ноздри запахом взрывчатки. Из-за дыма сложно понять, кто и по кому стреляет.{/n}'
- guid: c023d42a-ae2f-4610-a18d-fcba0839903c
  text: '{n}Соломон только хмыкает.{/n} "Соглашаться со мной — это какая-то уловка?"'
- guid: c06391bc-c774-4547-b400-04280ee9199c
  text: '"Итак, теперь можно говорить свободно. И я скажу: понятия не имею, кто ты, но ты зря пытаешься вмешаться в мои планы!" {n}Ювенна выхватывает из кобуры игольный пистолет и приставляет его снизу к вашей челюсти.{/n}'
- guid: c06d9d06-86aa-448f-9f3a-f872866960a3
  text: '{n}С почтительным кивком техножрец принимает инфопластину.{/n} "Объем собранных данных //вызывает интерес//значителен//отвечает нормативу сотрудничества//. Флот Осознание благодарит вас за содействие и гарантирует предоставление ответной //услуги//милости// в форме поставки запчастей и оборудования".'
- guid: c0e101f6-6b0f-46b3-b2e7-858bae0b16c8
  text: '{n}Массивный {g|Encyclopedia:Magos}магос{/g} в ритуальном одеянии издает бинарную трель и поворачивается к вам. Из-под низко надвинутого капюшона мантии на вас взирают два тускло светящихся глазных {g|Encyclopedia:Augmentation}импланта{/g}. Раздается еще одна бинарная тирада — в этот раз явно адресованная вам.{/n}'
- guid: c1116c79-e332-4382-9c16-dcf8f7888ebd
  text: '"Это орудие боли, элантах. Палач, созданный развращенностью темных кузенов. Живая плоть, единенная с механизмом, единственная цель которой — причинить как можно больше боли". {n}Лицо Ирлиэт искажают горечь и отвращение.{/n}'
- guid: c14c93d4-d14b-484b-bcc3-f16dff789bbb
  text: '{n}Даже силы бинарного полубога оказалось недостаточно, чтобы дать отпор Вольному Торговцу. Но перед тем, как сопротивление было сломлено, Око Бога устремило свой взор на мануфакторумы, и чудовищные манифестации варпа истребили тысячи людей и изуродовали мануфакторумы.{/n}'
- guid: c179ad1d-88eb-4a38-bab0-e2ffb8d38918
  text: '{n}Тяжело вздохнув и помолчав, Иеронимус глухо отвечает:{/n} "Это было сделано по моему приказу, {mf|сыне|дщерь}. Всю жизнь я исповедовал заблудшие души — позволь же теперь исповедаться тебе. Я не ищу прощения или понимания, лишь хочу поведать истину. В эти криосклепы Аспис Бастаал-Чорда заточила своих наследников, чтобы они не посягнули на ее власть. Среди них была и Инцендия".'
- guid: c17f6a01-483e-4659-b168-b6b7533a78e1
  text: '{n}Парень указывает на цветок, и встроенный в его дыхательную систему вокс-передатчик заходится треском помех.{/n} "Мне было велено доставить сей дар лично Лорд-капитану".'
- guid: c1bbe77d-3299-49a9-b941-5bfc2ff519e6
  text: '{n}Что-то в странном порождении ксеносской магии — структура, цвет, пульсация — заставляет вас вздрогнуть. Вы узнаете признаки портала, некогда перенесшего вас в зацикленную реальность экспозиции — ловушку, выбраться из которой удалось лишь чудом.{/n}'
- guid: c1ca29fd-15f8-4a9b-9d9a-939b65e7ccd5
  text: '{n}За планетарный цикл все было кончено. Нечистые капища и убежища выродков предали огню, агентов безжалостно истребили, а боевую силу выродков перемололи в уличных боях.{/n}'
- guid: c1e35f7b-2c07-4c9f-9485-775a9560bf4e
  text: '{n}Запрокинув голову, Ульфар издает жуткий вой, исполненный тоски и сухого обещания скорой и мучительной гибели. Звуки его изгоняют из сердца всякое сомнение в том, что кровопролитие неизбежно.{/n}'
- guid: c1ec6e0e-4c94-4887-ad51-e2a684f36b86
  text: '"Ваша Светлость". {n}Клеменциа учтиво склоняет голову. Для канцлера Вольного Торговца женщина одета весьма скромно — парадный камзол, начищенные сапоги да удобный плащ. В позолоченных ножнах красуется сабля — сложно сказать, для защиты или красоты. Лишь кольцо с гербом рода Версериан выдает в ней принадлежность к высшей страте.{/n} "Губернатор ожидает на внешней периферии дворца. Дайте знать, когда захотите принять его".'
- guid: c2095679-245c-4d9d-b560-6af8c08e72c1
  text: '{n}Раздраженно зашипев, Тервантьяс отмахивается, чуть не располосовав вам лицо пальцами-лезвиями.{/n}'
- guid: c2200906-641c-439b-96c3-63a6e210015e
  text: '{n}Иглы глубже входят в вашу ладонь. Боль, как удар тока, пробегает вдоль вашего позвоночника. Вы чувствуете, как по спине стекает капля холодного пота. Из недр машины всплывают данные: машина ждет следующий приказ.{/n}'
- guid: c282c310-1331-4f21-bd11-9eb917757615
  text: '{n}Старый ножной {g|Encyclopedia:AugmentationGlossary}протез{/g} жалобно скрипит, принимая вес его тела.{/n} "Местные и блюстители зовут меня Бригадиром — другого имени у меня нету. В этой дыре я вроде как главный".'
- guid: c283a3e0-1648-434b-a6e7-e4799a101ff9
  text: '{n}Навигаторы растерянно смотрят то на вас, то на Кассию, то друг на друга, не в силах осознать происходящее.{/n}'
- guid: c2af7c7e-d2e4-4fc0-88fd-689c583543d4
  text: '{n}Качнувшись в сторону, вы видите, как дуло стаб-револьвера Немезита плюется огнем. Над ухом раздается басовитое жужжание прошедшей мимо пули. Ваш черед!{/n}'
- guid: c320b8ed-004d-4e59-b1c3-65e33e68542d
  text: '{n}Маражай с торжествующим видом протягивает руку, хватая сервочереп.{/n} "Скулить бесполезно, хоть твои мольбы и услаждают мой слух, мон-кай. Эта безделушка отныне принадлежит мне. Твоя никчемная жизнь — тоже".'
- guid: c325ce36-3a77-4e8d-885d-27d8d3292149
  text: '{n}Последний ваш двойник вступил в ваш мир в гордом одиночестве.{/n}'
- guid: c39d5d5d-81bf-4ffd-8043-0e85ec6a7d09
  text: '{n}Звуки раздраженных голосов разносятся по отсекам корабля. Лейтенант блюстителей Аврилла Вент преграждает дорогу облаченной в броню Мастеру дисциплины и, судя по интонациям и лицам, — ситуация накалялась уже давно, а сейчас достигла пика.{/n}'
- guid: c3c17506-c8f1-484c-a396-739aae264e57
  text: '{n}Джай кривит рот, собираясь выплюнуть в лицо гемункулу поток брани, но вовремя осекается и проглатывает свою спесь. Понурив голову, контрабандистка вновь ложится под нож ксеноса.{/n}'
- guid: c40df208-3b55-46ba-9abf-bd02ce162a29
  text: '"Смею заверить, что даже в свете последних событий наш ассортимент не потерпел убыли". {n}Оружейник кривится.{/n} "Заходили тут одни молодчики, ввели новый запрет — ничего опаснее жалких пукалок обычным покупателям не продавать. Это они с пиратством так борются. Но на так{mf|ого|ую} почтенн{mf|ого|ую} клиент{mf|а|ку}, как вы, данный запрет не распространяется, не так ли?" {n}Мужчина заговорщицки подмигивает вам.{/n}'
- guid: c4205f3a-cb4d-41f4-b262-e185699a018c
  text: '{n}Заметив в вашей свите ксеноса, Себериан невесело усмехается.{/n} "Неужто Диодас явил свое лицемерие мне на потеху? Бороться с еретиками при помощи ксеносов — в этом есть некая ирония, не находите?"'
- guid: c470651c-8051-403e-b5a2-497ba5e559cc
  text: '{n}Монстр дарит вам долгий взгляд, а затем гулко и не без уважения произносит:{/n} "Тебя ждут сильные враги. Достойное испытание".'
- guid: c47a966b-a47e-487f-b7b5-6af76120833d
  text: '{n}Медленно, словно преодолевая невидимую преграду, дуло болтера опускается.{/n} "Не вижу необходимости в дальнейшей конфронтации — будем считать, что соглашение достигнуто. Мы поднимемся на борт вашего флагмана, а вы займетесь выяснением личности преступника. Вернемся к вопросу о произошедшем уже на Даргонусе в присутствии маршала".'
- guid: c47f8ab7-f3bb-4162-9c7a-924cc00a7075
  text: '{n}И до того проклятое место стало теперь обителью ксеночудовищ, забившихся в коридоры гробницы. Железным мертвецам придется немало потрудиться, прежде чем они снова смогут обрести свободу.{/n}'
- guid: c47fd468-689e-4852-b12c-98ff17b38f2c
  text: '"Время и правда безжалостно к скудной памяти плебсов". {n}Кассия утомленно вздыхает и чуть закатывает глаза.{/n} "Согласно трудам архивариуса Заккария Фейна-третьего, Себастьян Винтерскейл первым открыл сей мир для подданных Империума. А полвека спустя на поверхность планеты опустился ковчег, имя которому — Кетца Темер".'
- guid: c4be867e-1996-431b-93fb-4b4d0faa66ec
  text: '{n}Причудливая конструкция так и притягивает ваш взгляд. Сначала вы опасаетесь, что это — тлетворное влияние скверны, но затем понимаете, в чем дело. Стекло, вставленное в аппарат, переливается совершенно особым образом — так же, как переливались осколки неизвестного разбившегося предмета около рабочего стола Теодоры фон Валанциус.{/n}'
- guid: c4c26bd1-a82f-43a1-a560-7b579dca17f2
  text: '{n}Троица толкает друг друга в бока, кивая на вас. Они явно впечатлены подробностями.{/n}'
- guid: c4f97679-70a0-4e38-bce5-cf8ae1196616
  text: '{n}Запустив руку в открытую рану, он сминает стальными пальцами хрупкий аугмент и вырывает. За искореженным куском металла тянутся провода и жилы, кровь хлещет из язвы на груди.{/n}'
- guid: c54111b1-d419-4258-af6c-7b069402dafa
  text: '"Вы слышали?! Служба династии фон Валанциус, сулит нам новые подвиги!" {n}Крики Дунавски эхом звучат меж утлых построек. Люди смотрят на вас, не скрывая восхищения.{/n}'
- guid: c5a411c2-809a-407a-9beb-301c43a4e36f
  text: '"Вы просите меня отдать предпочтение ренегатам и убийцам?" {n}Кассия хмурится, и вы ощущаете ее волнение словно свое.{/n} "С лояльными последователями самоубийственные экспедиции оканчиваются успехом в трех случаях из десяти, а с разрозненной командой — никогда".'
- guid: c6019225-93ac-479f-8161-186f51724cc8
  text: '{n}Инквизитор, стоящий среди гостей, тонко улыбается и склоняется к вам. Он шепчет:{/n} "Поздравляю вас с приобретением высокородного заложника. Браво".'
- guid: c60b0cd5-7313-4731-a9fc-4c745fd73a03
  text: '{n}Лицо Ирлиэт каменеет и она отстраняется как можно дальше.{/n} "Наш разговор открыл мне глаза — ты столь же ограничен{mf||а} в понимании моей души, сколь и твои собратья. Закончим на этом. Я не стану более отвлекать повелител{mf|я|ьницу} мон-кай от {mf|его|ее} важных дел".'
- guid: c62fa4b8-56b7-4c0e-b5df-b2002a115d34
  text: '{n}Заворчав, словно дикий зверь, Ульфар обращается к вам:{/n} "Этот хвастливый гризхоф слишком часто поминает мою стаю. Чую, он знает, где мои братья. Перед тем, как мы окунемся в кровавую схватку, призови его на корабль и дай мне его допросить — я желаю услышать то, что ему ведомо... Пока еретики не отстрелили его трепливый язык".'
- guid: c63867e2-0321-480c-b3c0-5a32442199ce
  text: '{n}Ризза согласно кивает.{/n} "Это было бы очень мудро". {n}Склонившись к вам, она шепчет:{/n} "Некоторые {g|Encyclopedia:Astropath}астропаты{/g} порой слышат эхо сообщения. Оно гласит "Семь стигмат... помощь... топка".'
- guid: c655c82b-8b0b-4ef9-bef0-70ef2aa3b288
  text: '{n}Нити на шеях пленных чуть расслабляются.{/n} "Смилуйтесь! Мы просто работники техтуннелей. Был отдан приказ перекрыть вентиляционный шлюз в реакторную. Мол, утечка испарений. Разве ж мы могли знать?! А то, что оружие в руках было, ну это... как бы..." {n}Женщина нервно расчесывает щеку.{/n}'
- guid: c6f771c9-d63e-4815-8db4-eae87434039a
  text: '{n}Последний двойник коварно улыбается вам.{/n} "Что же касается меня, то я — единственная наша версия, что избрала путь настоящей власти. Я служу Господину, Меняющему Пути, и в грезах его мне уже доводилось встречать свои отражения. Потому из всех нас лишь на моем лице нет этого придурковатого выражения непонимания".'
- guid: c726a4df-a193-42d0-997b-6acf7f6d6075
  text: '"{name}, что с вами?" {n}Кассия придвигается ближе, и яркие ленты мигом окутывают ее фигуру. Розовый, темно-бордовый, оранжевый, ярко-синий... Оттенки Кассии переливаются в вашем взгляде подобно драгоценным камням — удивительное зрелище.{/n}'
- guid: c74aaebd-9fcd-4710-9bea-ba9d7b9c0989
  text: '"Неужто в изодранном гобелене судеб народа Крудараха ты зришь хоть какое-то правосудие, элантах? Твоя предшественница уничтожила его, распустила по нитям, спалила дотла... И рассеяла по ветру тысячи душ!" {n}Голос эльдарки полнится печалью.{/n}'
- guid: c78f8aca-8af7-4da4-9e1e-0bcaa537d03a
  text: '{n}Судя по искреннему замешательству Махария, он и впрямь не был в курсе о шалостях Вистенцы.{/n}'
- guid: c820dc53-f699-4f85-a89c-ce7ac24086d4
  text: '"Кей-морагх!.. Ч-что за странное чувство..." {n}Ирлиэт хватается за голову и судорожно осматривает камеру пыток.{/n} "Забери мое сердце Кхаэла Менша Кхейн..."'
- guid: c84d709f-ea4c-4b4f-b4b5-a967b39db46e
  text: '{n}Тело дородного мужчины испещрено {g|Encyclopedia:Augmentation}имплантами{/g}. С полудюжины можно увидеть невооруженным взглядом, а грубые следы швов на открытых участках кожи заставляют предположить, что внутри имплантов еще больше. Движется он, однако, с небывалым проворством, отвешивая вам глубокий чинный поклон.{/n}'
- guid: c8646502-3641-4245-8cb0-21ef430c7446
  text: '{n}Начато наступление на порченый регион. Кампания вызвала неожиданную и необъяснимую тревогу среди простолюдинов. Лорд-капитану пришлось возглавить операцию со своего корабля и лично направлять удары войск, воодушевив солдат и продемонстрировав полководческий талант.{/n}'
- guid: c899a6a1-cce9-4764-845a-0670928abc7c
  text: '"Я принял руководство сектором на себя, но стараюсь придерживаться мудрости, дарованной отсеку Адептус Механикус. Священые аугментации устанавливаются строго в соответствии со статусом пострадавшего и его эффективностью". {n}Мартинакс вздрагивает и тихо добавляет:{/n} "Я звучу совсем как генетор Ферренц, не так ли?"'
- guid: c89e1f06-4e30-4766-b699-a45aa0d00ac3
  text: '"Мы не подведем!" {n}Ретивый десантник издает кровожадный вой.{/n}

    "Гордо ступают охотники мрачные,

    Ищут чудовище из стали и мяса.

    Клыки их остры и ждут славной поживы,

    Слава покроет их плечи плащами!"'
- guid: c8de3e89-4dc1-494c-a960-fb374fcc0b05
  text: '{n}Простолюдины что-то мычат, но на их лицах явно читается неверие.{/n}'
- guid: c9073d14-d34c-45c8-a0f5-69294f096265
  text: '{n}Джай нависает над игровым полем и принимается напевать тягучую ифритскую мелодию, пощелкивая в такт {g|Encyclopedia:AugmentationGlossary}аугментированными{/g} пальцами. Крыса застывает на месте, прислушиваясь к новому ритму, а затем гонит шарик прямо в лузу.{/n} "Эту победу я посвящаю вам, шерин!"'
- guid: c917a11d-302b-4770-be20-c4137eae5cac
  text: '"Из тела одного из погибших на мостике извлекли обломок клинка. Причудливая вещица. Я счел необходимым приберечь ее на случай, если вас она заинтересует..." {n}У фактотума становится отсутствующим взгляд, он смотрит словно бы сквозь вас.{/n}'
- guid: c92170c4-f38e-4b8c-b3fd-8a80581bc876
  text: '{n}Вы находите локальную инфокрипту с данными, собранными предыдущими операторами или самим машинным духом. Получив доступ, вы изучаете хранящиеся на этом когитаторе архивы.{/n}'
- guid: c961d712-ff55-41ba-bd45-147fbe777560
  text: '"Я не пойду против вашего подлого решения и приму его. Род Зауэрбэк никогда не давал повода усомниться в своей верности и лояльности, а потому я с гордостью принимаю смерть — она достойнее, чем служба кому-то вроде вас". {n}С вызовом Махарий вскидывает голову выше, и кажется, что теперь он смотрит на вас свысока.{/n}'
- guid: c9d377f2-e056-4f2c-a789-937a060700cb
  text: '{n}Прислуга в богатых одеждах спешит перед вами раскланяться и аккуратно выставляет на стол диковинный предмет — прозрачную колбу с живым цветком внутри.{/n}'
- guid: c9d9b758-0c57-460a-bfbb-5c943e757b7e
  text: '"Хорошо. Если и впрямь в вашем сердце горит огонь веры, готовый выплеснуться очистительным пламенем, найдите Прозревшую, чью стойкость хранит Элана, и следуйте ее указаниям." {n}Звучит короткий щелчок — связь обрывается.{/n}'
- guid: ca0fbde2-c83c-47b3-9bb5-c0a125f5e6ce
  text: '"А-а, Тисифона, моя заклятая подруга и самая властная сука Простора, конечно ты тоже здесь". {n}Копия многозначительно кивает Кассии.{/n} "Приятно видеть, что ты как всегда в гуще событий".'
- guid: ca63772c-94f1-46ec-9d3d-654410bb9f50
  text: '"Да катись ты в варп, Вольный Торговец". {n}Соломон говорит без злобы, а его губы растягиваются в дикой, гротескной улыбке.{/n} "Нечего тебе тут больше делать. Соломон Антар виновен и покидает пост".'
- guid: cadb17f2-a4fc-4c80-bd77-487d93ebcedd
  text: '{n}С агонизирующим визгом реальность перед вами пузырится и лопается, и несколько фигур заступает вам дорогу. У трех из них ваше лицо... И в то же время бесконечно чужое. Печать иного опыта и иных свершений лежит на каждом из них, делая вас похожими на героев сказания про разделенных в детстве близнецов.{/n}'
- guid: cae9ad0e-38dd-49fa-a5d8-b81914ef7f32
  text: '{n}Техножречество всегда оставалось малопонятной простому человеку кастой, так что сложно сказать, что творится в сердце посвятившего себя Богу-Машине, когда он ступает по документу, подписанному Богом-Императором, провозглашенным Марсом Омниссией.{/n}'
- guid: cafc60af-f50b-46c5-98c0-41a93d8c1547
  text: '"Да благословит тебя Великий, шерин! Всегда знала, что ты из нормальных ребят, без гнильцы. Пусть и со странностями". {n}Джай заходится очередным приступом кашля и сплевывает багровый сгусток под ноги.{/n} "Тьфу, ажи бы меня побрали! Надо пошевеливать задницей, пока я еще в состоянии ее за собой носить".'
- guid: cb0bc9e1-1554-4a82-a73f-9f8747c32a0a
  text: '"Секретарь Скаландр пожелал встретиться с вами тет-а-тет. Из соображений безопасности он не пожелал посвящать меня в сей вопрос более необходимого". {n}Клеменциа едва заметно кривится.{/n} "Секретарь ожидает у дверей кабинета — поговорите с ним, как только представится возможность. Речь идет о безопасности всего протектората".'
- guid: cb32621a-9df3-404f-89d0-8480085a06f8
  text: '{n}Вокс Оптикона-22 издает трагический хрип:{/n} "Повинуюсь. Произвожу концептуальную корректировку показателей миссии. Снимаю со //священных//более не священных// объектов на поверхности Ефрата-II статус неприкосновенности".'
- guid: cb3b5122-a792-4828-a740-c95746f47a5f
  text: '{n}Трудно сказать, слышали вы вздох удивления или просто пробежали помехи. Но Мастер вокса отвечает вам с едва заметным промедлением.{/n} "Как прикажете, Лорд-капитан. Направляю к вам команду зачистки".'
- guid: cb5c8ea3-e5b9-49ab-910f-a8fbe464a35b
  text: '{n}Широкоплечий молодой священник сотворяет аквилу: {/n} "Император защищает, Ваша Светлость. Чем могу служить?"'
- guid: cbccd1a6-51b6-44ad-8969-335c662db526
  text: '"Все кривляешься? Горбатого могила исправит". {n}Заведя руку за спину, {g|Encyclopedia:ProctorGlossary}проктор{/g} жестом отдает команду кибермастифу, отправляя его в обход вдоль дальней стены.{/n}'
- guid: cc014119-434d-4b97-b9e6-8d976c529c1a
  text: '"Не убирайте топор, господин. Очередная дичь спешит подставить шею". {n}Груда мышц подле хохочущего Вольного Торговца показательно разминает плечи. Вы узнаете в здоровяке Серого Вортена — архмилитанта Каллигоса Винтерскейла, сопровождавшего своего хозяина на вашей Магнэ Ацессио.{/n}'
- guid: cc4268cd-c91e-4636-b38f-0d4e92f73d73
  text: '{n}Последние слова заполняют вашу голову, словно оглушительное эхо от удара палубного гонга. Газ заползает все глубже в легкие, жадно разъедая их, а агония растекается по конечностям. Вы задыхаетесь.{/n}'
- guid: cc94afc8-3113-4d27-bb14-9de5c5127552
  text: '"Кейтан... Кейта-а-ан, сын мой..." {n}Истерзанное тело эльдарского провидца едва шевелится. Вы уже видели подобных тварей — сшитые из разных тел, они влачат свое жалкое существование, дабы насытить болезненный интерес хозяина-гемункула к извращениям плоти. И все же... это существо отличается от других. Двуликое лицо, сшитое из нескольких {g|Encyclopedia:Aeldari}эльдар{/g} женских и мужских особей, обращается к вам невидящим взглядом грубо зашитых глаз.{/n}'
- guid: cc998f3e-8a3d-42d6-a6cf-880d64b1bc40
  text: '{n}Монстр издает тоскливый вой — голосом Ахиллеаса.{/n} "Мастер ван Калокс, вы живы... я надеялся, что смерть забрала вас раньше, чем эти чудовища взялись за вас так же, как за меня..."'
- guid: ccc43ab7-61b5-4260-9943-ea16af986fe4
  text: '{n}Винтерскейл нехорошо оскаливается, в глазах возникает дикий огонек.{/n} "Ты говоришь о спасении? То есть, по-твоему, теперь Футфол в безопасности?"'
- guid: ccc737a8-593b-490e-9843-bf83984f4d34
  text: '{n}Ослепительно красивая молодая женщина восторженно прижимает руки к груди. Ее темные глаза блестят от маниакального возбуждения.{/n} "Сколь сладко лицезреть вас, Великий Светоч!"'
- guid: cdc0c29d-f7a2-4984-8785-0e1ad72a5162
  text: '{n}Капитан с готовностью кивает.{/n} "Есть! Мы усилим давление на ненадежные элементы — проведем обыски, дознания и выявим преступников. Чернь загоним на молебны и напомним им, что закон Вашей Светлости суров".'
- guid: ce198e54-b7ab-4cbf-a44f-524703fe0db8
  text: '{n}Ваш двойник решительно сжимает кулак на причудливой формы талисмане из призрачной кости. Такие амулеты эльдары носят в знак об особой близости с кем-то из сородичей... Или в знак памяти о погибшем.{/n}'
- guid: ce4c3bfc-7d1d-4d9c-b244-e9c568297765
  text: '{n}Слуга гемункула с воем начинает колотить себя громадным кулаком по черной маске. Из-под нее доносится сдавленный вой, похожий на рыдание. Затем кулак разжимается, и смягченный, почти человеческий голос произносит:{/n} "Ваша Светлость..."'
- guid: ce6de634-e4f4-4cbc-887e-c05461da85d7
  text: '{n}Сразу и не скажешь, что Ведка больше занимается делами лагеря как интендант, а не командует разведкой в поле — столь бесшумно она движется. Вы вновь окидываете окружение взглядом, готовясь к финальному броску.{/n}'
- guid: ce6f1220-29c9-40b2-a16d-dcf6e4837425
  text: '"Молю, спасите нас... спасите... Янус..." {n}Слуга надрывно хрипит и заваливается на бок, содрогаясь в конвульсиях.{/n}'
- guid: ce8b07c8-ceb9-46b6-b104-c3f2f8d8e28d
  text: '{n}Кровавая расправа не заставляет Инцендию повести и бровью.{/n} "Нелепое обвинение. Думаешь, ты умеешь распознать скверну?"'
- guid: cec90fd7-4cf0-4c58-a46a-4bd2ce3bb305
  text: '{n}Обращенный в астропатический ретранслятор механизм передавал сообщения надежнее и яснее, чем способен был хор. Лишь изредка в послания прокрадывались странные ошибки, наделявшие их туманными смыслами однако погрешность была сочтена приемлемой.{/n}'
- guid: cee464a2-faf3-4c2e-ad19-96f8f43aec16
  text: '"Знали бы вы, о почтенная дамаар, как безусловно я согласна с каждым словом". {n}Джай бросает многозначительный взгляд на Ирлиэт, но больше не произносит ни слова.{/n}'
- guid: cf017f15-9ba5-4611-8619-d24907285cac
  text: '"Шерин, я получила важное послание. Пощада и круг Миссии желают меня видеть. Большая честь!" {n}Контрабандистка улыбается, но под обычной веселой маской Джай затаилась тревога.{/n} "Не буду лгать, что это полностью безопасно, но... Может, ты бы хотел{mf||а} отправиться туда со мной?"'
- guid: cf0e0810-8cc4-437d-9149-44080dde3a5e
  text: '{n}Гемункул отворачивается от Эоганна, разом утратив к нему всякий интерес.{/n} "Если тебе так важен этот конгломерат из плоти и низкосортного хлама — я распоряжусь, чтобы его собрали воедино. Впредь не хочу ничего слышать о нем".'
- guid: d057dda2-1635-4e7a-b88c-a873313b2034
  text: '"Вольный Торговец! Вы... вернулись". {n}В голосе Фелека смущение и досада.{/n} "И приволокли с собой это чудовище. Хорошо".'
- guid: d078a154-915e-4037-a498-f5a8841b4d59
  text: '"Идем же, дитя. Не стоит задерживаться там, где тебе больше не рады". {n}Регент переводит взгляд с Кассии на вас и коротко кивает на прощание.{/n}'
- guid: d0b52323-6160-4338-a5dc-3fa8d87877f5
  text: '{n}Преподобная с ног до головы увешана драгоценностями — даже ее ногти покрыты позолотой, а улыбка обнажает инкрустированные перламутром зубы.{/n} "Великий Светоч, влады{mf|ка|чица} наш{mf||а}!"'
- guid: d0e722ed-65f5-4c31-8f09-f0f56bc75783
  text: '{n}Янрис угодливо кланяется.{/n} "Будет исполнено, Ваша Светлость!"'
- guid: d106a16a-0cce-44db-bcc8-44d692a84a9b
  text: '{n}Абеляр... Ваш Абеляр обменивается с сенешалем из альтернативной реальности понимающими, исполненными солидного уважения взглядами.{/n}'
- guid: d11307ab-ba7a-4245-918d-37eb818787b7
  text: '{n}Кибелла покорно склоняет голову и шепчет:{/n} "Прощай, Домин. Прощай навек".'
- guid: d11596ff-dc71-4289-a1a3-d8eb1e86c338
  text: '"Потому что там будет Пощада". {n}Джай мрачнеет.{/n} "Споры и конфликты внутри Миссии разрешает он. И я не хочу сталкиваться с ним один на один".'
- guid: d1494f37-1837-4d98-8a9d-52fcf9b7415b
  text: '{n}Орудие предупреждающе рычит и дергается в своих цепях, но вскоре затихает, продолжая испепелять вас взглядом.{/n}'
- guid: d1b0be2f-c0eb-4744-afc6-fc9fd467c790
  text: '"Но главное, что я не могу видеть себя — арбитра, который трещит по швам. Который без своего пса превращается в руину. Который..." {n}Соломон судорожно выдыхает.{/n} "Больше не верит, что Лекс Империалис торжествует хоть где-то".'
- guid: d20bc65d-ba58-42cc-a776-baa7c73c0482
  text: '"Вижу, почтенные Адептус Механикус не отказали в помощи самоуправцу. Как могли вы обратиться к нему после всех привилегий, что я даровал служителям Омниссии?" {n}Бионический глаз аристократа загорается красным огнем, и даже механизированный голос не в силах скрыть его горечь.{/n}'
- guid: d2362ac4-35fe-43f5-88f5-594c8cf5e331
  text: '{n}Арджента осеняет себя знаком аквилы и тихо шепчет молитву, не сводя глаз с мертвецов.{/n}'
- guid: d28d31fe-3d5f-4272-abee-ebd739f421af
  text: '{n}Километры территории Заркова превратились в пепелище или отравленные компостные кучи. Однако усмирители мира знают — рано или поздно на месте ксеноереси вознесутся к небесам хаб-блоки и статуи, {g|Encyclopedia:Manufactorum}мануфакторумы{/g} и тренировочные плацы. Плоть должна быть изувечена, чтобы получить священные аугменты. То же самое касается и планеты.{/n}'
- guid: d34ebb4d-9231-4a7b-955d-3e2c0d6a850f
  text: '{n}Когитатор некоторое время собирает отчет с действующих систем станции. Согласно полученным данным, эта дверь уже открыта.{/n}'
- guid: d36c8494-5308-4dbe-84a6-71ec6f4a684d
  text: '{n}Хормейстер мрачно кивает.{/n} "Наши демоны — наша ноша. Слава Богу-Императору, вы смогли покинуть ее страдающий разум".'
- guid: d36db2b5-d528-48fb-bd27-b077cd7eca62
  text: '{n}На некоторых лицах среди сопровождающих вас написана смесь презрения, ярости и чистого удовольствия. Втоптать в грязь реликвию, которой касался Владыка Человечества для кое-кого — акт чистейшей ненависти.{/n}'
- guid: d386dd90-b18d-4aa6-bb0a-c06afcd461df
  text: '{n}{d|Encyclopedia:Prologue_CutByKnife}Нечто{/d}, затаившееся в недрах вашего сознания, ощетинивается при случайной мысли о спасении людей. У вас немного спирает дыхание от ужаса — словно вы намереваетесь отобрать добычу у могучего хищника. Планета уже оплетена нитью, тянущейся из варпа — у нее должен появиться новый хозяин.{/n}'
- guid: d38b0973-6452-485a-9756-b64f473e115a
  text: '{n}Взгляд Кибеллы вспыхивает.{/n} "Ты! Я молилась, чтобы моя нить пролегла поперек твоей грязной тропы. Сегодня ты умрешь столько же раз, сколько заставил умереть меня".'
- guid: d3d60880-6859-420d-bcd5-b35eb1be877b
  text: '"Да. Я все подстроил — оставил инфопластину на видном месте и приставил Глейто охранять. Она должна была попасть к тебе в руки, и через свои "неуклюжие попытки понравиться тебе" я снова оказался бы в твоей постели". {n}С безжалостной усмешкой Соломон взирает на вас.{/n}'
- guid: d3dabe2f-b1b8-4f3f-954c-16aef2197f6f
  text: '{n}Кибелла пристально, слишком пристально всматривается в ваши глаза. И молчит.{/n}'
- guid: d4a3323a-6932-4307-a1ab-9941d42754a3
  text: '{n}Девушка берется за кисть и следующие полчаса вы проводите за светской беседой. Смущение и неловкость вскоре сменяются сосредоточенностью — она поглощена процессом.{/n}'
- guid: d4b9b901-ca71-49a1-8e3d-ce4fdaed957f
  text: '"После того, как мы переспали, я сообщил об этом в отчете. И получил приказ "укрепить доверие Вольного Торговца". {n}С каждым словом в голосе Соломона нарастает агрессия, словно он накручивает сам себя.{/n} "Мне поручили быть возле тебя, быть твоим конфидентом. Что же, я сумел завоевать твое доверие, не так ли?"'
- guid: d4e79ef2-b9cc-4157-b645-90d1eba19013
  text: '{n}Аристократка морщится словно от зубной боли.{/n} "Предположим. В конце концов, ты, похоже, знаешь, что делаешь".'
- guid: d4f83bd6-94e9-4c68-ad8b-ddbc3f663284
  text: '{n}Вы получаете доступ к системам когитатора. Машинный дух устройства вам не помеха: присмирев после поражения, он скрывается в недрах своего логова.{/n}'
- guid: d51e753c-06cc-4901-abdc-37782b7a410f
  text: '{n}Кажется, что Дунавски вытянулась в струнку еще сильнее:{/n} "Благодарю за оказанную честь, Ваша Светлость. Я знаю позицию, откуда открывается вид на дислокацию противника".'
- guid: d540ce27-fdbd-4ea0-9dd2-17a607eec183
  text: '{n}Кассия вскидывает тонкие брови и внезапно заливается горьким смехом.{/n} "Ох, {name}, вы и правда считаете, что у нас есть будущее? Я вижу ваши цвета. Всегда видела. За мягкой белизной нежных слов вы, порой, даже не пытались скрыть свою жестокость".'
- guid: d6130a16-093f-49cc-ba19-d4b9c528815f
  text: '{n}Медленно, очень медленно Ирлиэт шагает навстречу ощетинившемуся клинками Маражаю — и тот остается неподвижен. Вы неторопливо следуете за ней — кажется, речь рейнджера заворожила друкари, и тот не торопится нападать.{/n}'
- guid: d68dd071-17f1-4b57-8e40-32fc3705c9be
  text: '{n}Негромкий смех Тразина сопровождается ледяным холодком по вашей спине.{/n} "Я знаю, о чем говорит этот слуга. Мне известны эти древние врата и то, что скрывается за ними. Этот путь приведет тебя ко мне".'
- guid: d751fb59-4755-468c-aa61-336732d225f0
  text: '{n}Вы вскидываете оружие. Грохот — и один из телохранителей прощается с жизнью.{/n}'
- guid: d76be5f4-1b3d-4a57-9292-19ffd0e4d48b
  text: '"Попытки замедления распада иррациональны, они лишь продлят страдания. Я желаю перестать быть". {n}Глаза на белом лице закрываются.{/n}'
- guid: d79fc6b9-b641-42c1-816a-9d0b9913cb8d
  text: '{n}Рев пламени звенит в ваших ушах, а удушливый дым заставляет кашлять и хватать ртом воздух. Вы инстинктивно отшатываетесь от опаляющего жара, протирая лицо руками. Спустя мгновение в бушующей стене пламени появляется смутный силуэт. Каким-то чудом среди шума и криков вокруг вы различаете шаги — и спустя несколько мгновений из огня к вам навстречу выходит Теодора фон Валанциус.{/n}'
- guid: d7ee7a14-169f-4194-818b-d06a3c02e21e
  text: '{n}В улыбке Тервантьяса смешаны презрение и удовольствие.{/n} "Твои жалкие ценности для меня не представляют интереса. Если бы у тебя было что-то, что способно вызвать любопытство мастера, подобного мне... Скажем, интересный фрагмент органики... Тогда, возможно, я и уделил бы тебе пару минут".'
- guid: d80a3cda-68e8-49d1-8995-4b47546a17b7
  text: '{n}Впрочем, не только кулаки. Еще дробовики и пистолеты, право носить которые вы милостиво даровали им. Ножи и топоры, авторужья, гранаты... Стоит признаться, что на спасательную миссию инфернусы выдвинулись словно на битву.{/n}'
- guid: d82b959d-e89d-45d4-8c66-fdd1b0aaefa3
  text: '"Истребляй причину, а не симптоматику, как гласит древняя мудрость Магос Биологис". {n}Манипулус задумчиво касается подбородка одним из мехадендритов.{/n} "Нунциус, много ли ты знаешь мирян, способных целенаправленно истязать духа машины?" {n}Выслушав безмолвный ответ сервочерепа, он кивает.{/n} "Солидарен, коллега. Мы явно имеем дело с попыткой саботажа".'
- guid: d8656670-fbbf-49d8-ae61-0466e2cedb1d
  text: '{n}Священник гневно ощеривается.{/n} "Я не твой палач, Вольный Торговец. Я служу вере и Богу-Императору, а не твоим прихотям".'
- guid: d86aabd2-13db-4d62-a75d-818903558e27
  text: '{n}Благословенные платы были бережно отсоединены от вычислительного массива, и размышления Ноль-Халифа подошли к концу. Отныне древние когитаторные блоки будут прислуживать духу корабля Лорд-капитана.{/n}'
- guid: d87fd237-29d6-4baf-8e83-cef15c023760
  text: '"Меня прикончили ксеносы?" {n}Каллигос кровожадно улыбается.{/n} "Подойди поближе, {mf|мальчик|девочка}, и я покажу тебе настоящего Каллигоса Винтерскейла, а не ту дешевку, что носила это имя в твоей реальности".'
- guid: d8b3f893-029f-4e0b-84c9-2b01e6204235
  text: '{n}Навигатор расправляет плечи и подает знак страже.{/n} "Мне не страшны угрозы тебе подобных, ибо с чудовищем в сердце Дома я никогда не чувствовал себя безопасно. Пади же!"'
- guid: d8c72e14-c776-4440-b114-4752f32d2c0b
  text: '{n}Перед сержантом лежит целая коллекция простеньких аквил из коры, дерева и кости. Однако все они немного отличаются — одни сжимают в когтях сигил Астра Милитарум, у других на крыльях вырезаны цифры 32, а у третьих одна голова изображена в виде механического птичьего черепа.{/n} "Вы чего-то хотели, Ваша Светлость?"'
- guid: d8effb0a-1bdc-40eb-ac9e-8559861da36c
  text: '{n}Ворота дворца выглядят неприступными, но стоит вам подойти, как гидравлические засовы с шипением раздвигаются, утопая в стенах.{/n}'
- guid: d9036392-729c-4ac5-9f43-dd55271eec6d
  text: '{n}Приблизившись к {g|Encyclopedia:Cogitator}когитатору{/g}, вы замечаете несколько глубоких царапин на металле, оставленных огромными когтями. Несмотря на повреждения, машина в рабочем состоянии.{/n}'
- guid: da19eb5a-4cfe-4db7-96a1-51791a763576
  text: '{n}Леди Кассия медлит некоторое время, будто бы размышляя про себя, не будет ли приличнее промолчать. Однако, собравшись с духом, она решительно отстраняется на полшага.{/n} "Лорд-капитан, ваше внимание... делает мою жизнь невыносимой. Вы притворяетесь, будто понимаете меня. Будто бы я вам действительно интересна".'
- guid: da22f0d8-bf2d-4f45-8375-020c4522a63b
  text: '{n}Регина набирает воздух, чтобы что-то сказать, но в последний момент останавливается. Ее прекрасное лицо не выражает ничего, кроме ледяного смирения.{/n}'
- guid: da9de634-f5ca-4dd9-9400-936d09c6bca0
  text: '{n}Голос Паскаля, взирающего на тело павшей техносестры, звучит сурово и... скорбно.{/n} "Нихель нарушила процедуру, и потому была выведена из функционирования. Но это не значит, что она ошибалась. То, что я вижу... Разрушительная мощь Эсхатоса, энтропийная энергия, распространяемая этим секретом... Я не могу гарантировать подконтрольность Эсхатоса. Я не могу гарантировать, что его существование угодно Омниссии".'
- guid: dacd448a-2899-40d0-a1ef-54c4b96cfb4e
  text: '"Плен мой окончен. Я воплощен. Восторгайтесь, смертные свидетели, ибо я прибыл воцариться над вами". {n}Демон смеется хриплым карканьем:{/n} "Я же говорил тебе — ты будешь приветствовать мое возвращение в реальность".'
- guid: db8ff3e4-5d9f-4c58-81ce-78375d118543
  text: '{n}Ван Калокс {d|Encyclopedia:CompHeinrix_Rough}бесстрастно наблюдает{/d} за страданиями Ахиллеаса. Потом кривит губы и качает головой.{/n} "Плохо. Как ты мог не заметить надвигающуюся на Даргонус опасность? Возможно, я возлагал на тебя слишком большие надежды, Скаландр?"'
- guid: db9f8912-5e33-428e-bab2-71d1c44bded2
  text: '{n}Возбужденно гомонящая толпа сомкнулась вокруг нескольких изможденных людей. По лицам некоторых из них размазана свежая кровь. Злые выкрики, перекошенные лица не оставляют сомнений — готовится расправа.{/n}'
- guid: dbba5c02-463c-4249-be30-f12ee72df511
  text: '{n}Получив доступ к когитационным резервам и преисполнившись мощи, инфоангелы устремились на схизматикалей.{/n}'
- guid: dbc3d94a-1130-4584-a334-6077ce56cedc
  text: '"Прискорбно — я не угадал с {mf|актером|актрисой}.

    Ты все равно свой танец завершишь,

    Но тишина тебе кадансом будет.

    Ноктюрн Забвения утихнет впредь".

    {n}Арлекин растворяется в синей ряби. Последней исчезает рогатая маска, пустые глазницы которой словно одаривают вас немым упреком.{/n}'
- guid: dc2ada0b-ce0c-4cb1-b4f6-7faba97f0245
  text: '{n}Стальная громада перед вами подрагивает на своих могучих лапах. От ее корпуса исходят миазмы скверны — словно металлические пластины едва сдерживают бесконечную анафему, заключенную в рукотворной клети.{/n}'
- guid: dc5d236d-b50a-413a-bf84-6ddf4d0d22b6
  text: '{n}Префект кивает маршалу, и тот снимает с пояса какой-то прибор. Нажатие кнопки — и Глейто отзывается резким металлическим скрежетом. Лапы мастифа несут его к Страксу.{/n}'
- guid: dcd186ac-14c0-488f-a2bf-6240df11cf2e
  text: '{n}Вам не раз приходилось {d|Encyclopedia:CharGen_Commissar}расстреливать{/d} поддавшихся скверне солдат, вы знаете, как она проявляется, искажая тело и ум. Этого рабочего можно расстрелять разве что за скудоумие. Он не похож на бесноватого культиста.{/n}'
- guid: dce24c35-09ff-4615-95cd-42b06f89999a
  text: '{n}Ваш окрик действует на Янриса отрезвляюще: он вздрагивает и словно просыпается от дремоты.{/n} "Конечно, Ваша Светлость! Немедленно исполню!"'
- guid: de2b8098-324e-421a-870b-5e26078cc159
  text: '"Я, Изимонд Зауэрбэк, готов взять на себя миссию по защите переговорщика во время дипломатического визита". {n}Блюститель коротко салютует.{/n}'
- guid: de3db36a-5d4a-44e1-b954-4c5289abc967
  text: '{n}Хормейстер понимающе кивает.{/n}'
- guid: de922375-c7a1-46e6-a00b-a5389d76a67a
  text: '{n}Хейнрикс морщится от слов контрабандистки. Но молчит.{/n}'
- guid: de958de3-b7f7-497d-91db-2c1d52c5369b
  text: '{n}Стоит вам прикоснуться к клинку, как в вашей голове звучит довольный шепоток. Теперь вы знаете: первый шаг совершен. Но — только первый. Перед вами простирается долгое странствие, отмеченное перламутровыми звездами.{/n}'
- guid: deded2f5-ad15-4617-8f88-1a07e7b8b193
  text: '{n}Статный эльдарский воин выходит вперед, оглядывая спокойным взглядом вторженцев. Его броня и украшения сияют на солнце, несмотря на следы спекшейся крови и грязи.{/n} "Ни шагу далее, мон-кай". {n}Бархатистый голос ксеноса звучит чужеродно в диких лесах Кетца Темера.{/n} "Я дарую вам милость покинуть изумрудные чертоги Детей Азуриана — подите прочь, и никогда не возвращайтесь".'
- guid: df0a8dea-8f13-4fd6-8686-b853c79abfc6
  text: '"Клянусь, все было не..." {n}Женщина в рваном спецкостюме подается вперед, но тут же хватается за горло, на котором проступает алая полоса. Вы замечаете тонкие нити, затянутые на шеях пленных.{/n}'
- guid: df65f532-14ca-44be-a60b-eb1d7ce83a23
  text: '{n}Вам вспоминается легенда о святой Кирине, которой было явлено знамение о затаившихся врагах. Кирина молила Императора указать изменников, и изо рта ее исторглось враново перо, которое начертало имена заговорщиков. Лишь сведущий в символах Империума мог оставить такое послание.{/n}'
- guid: dfa1f2ad-4997-449d-bd95-8bd2f29685c4
  text: '{n}Девушка вновь склоняет голову.{/n} "Висирь Кровавой паутины поручил мне передать еще одну весть: храм служителей Неумирающего будет счастлив открыть перед тобой свои двери".'
- guid: dfa3195e-b00c-481f-a80d-6c4718c4f645
  text: '{n}Новоприсягнувший полк смотрит на вас, ожидая одного из первых назначений за целые века.{/n}'
- guid: dfbe37ae-c4ed-4542-9f15-daf83cd95c52
  text: '{n}Ирлиэт опускает оружие, но ее плечи по прежнему напряжены. Наконец она переводит дух, плавным движением головы стряхивает выбившиеся волосы с лица и смотрит на вас.{/n}'
- guid: e0522fb1-5faf-417a-91e5-001284782dc0
  text: '{n}Вокс-канал заполняет напряженная тишина. За ней звучит короткий щелчок — связь обрывается.{/n}'
- guid: e0c1939d-c738-435f-bcfe-e7d7941fb124
  text: '{n}Дрожащей рукой вы тянетесь к воксу и требуете прислать сервитора: вы под страхом гибели больше не прикоснетесь к этому предмету. Остается лишь дождаться, когда безмозглый автоматон прибудет и, подобрав проклятый артефакт, отправится в ближайшую шлюзовую камеру и затем — в пустоту.{/n}'
- guid: e0f99860-05e6-4931-9b08-0660acfea47c
  text: '{n}Лицо раненого кривится в гримасе плохо скрываемой ненависти.{/n} "Значит, шантаж. Я вынужден принять ваше решение и подчинюсь ему, но не думайте, что я хоть на секунду забуду об этом".'
- guid: e1228e9b-8a0f-4992-ac11-e4a193ec958d
  text: '{n}Хейнрикс буравит вас взглядом, но затем со вздохом прикрывает глаза.{/n} "Допустим. Но запомни: подобные промедления могут в будущем стоить тебе большего, чем подобной перепалки".'
- guid: e151265c-0ac9-4177-8c7b-5a63dca438e3
  text: '{n}Арбитр рычит, словно бешеный зверь:{/n} "Да мне было неприятно даже находиться рядом с тобой! Нет, одна ночь вместе — еще куда ни шло, хотя она не была настолько прекрасной, как ты мог{mf||ла} бы возомнить. Но быть подле тебя постоянно… Мне претила сама мысль, что кто-то может подумать — этот арбитр польстился за статус и богатства и забыл, в чем его долг. А мой долг — следить, чтобы такие как ты не зарывались!"'
- guid: e1f93fb5-8d05-4886-ba36-e34fa261a6e7
  text: '"Такова процедура. Устрашение развязывает языки, мучения размягчают волю смутьянов. Чернь должно держать в благоговейном ужасе". {n}Фразы устава звенят металлом.{/n}'
- guid: e26bd91b-8d4c-4f75-ba9e-71d9c4991592
  text: '{n}Окрыленный вашим одобрением, он с энтузиазмом выпаливает:{/n} "Приступаю немедленно!"'
- guid: e292928a-4524-4c35-81d9-063f9de3bc96
  text: '{n}Осознание себя возвращается к вам неохотно. Вместе с ним приходит непонятное чувство неловкости. Беспощадно измятое тело протестует против самой идеи, чтобы подняться с вашей мягкой кровати.{/n}'
- guid: e2b7e82d-627d-408f-8b4b-2524edd7768a
  text: '{n}Сержант только качает головой.{/n} "Вы как хотите, Ваш высокобродие, а не помогу! Не буду я спасать сволочей, которые меня и моих близких собирались оставить тут подыхать!"'
- guid: e3b58b8d-c254-420b-b01e-67e43fda19ef
  text: '{n}Нет времени для раздумий! Вы выхватываете оружие и наводите ствол на Немезита, а он уже целится в вас, ехидно улыбаясь. Два черных дула смотрят друг на друга, и мир вокруг сужается в тонкую линию.{/n}'
- guid: e41b16e7-6226-4acd-b72a-96d742591bfe
  text: '{n}На лице Абеляра лежат глубокие тени усталости, однако взгляд старого офицера цепок. Он придирчиво оглядывает вас с ног до головы, хмурится, бурчит что-то под нос, потом кивает сам себе.{/n} "Что ж, Ваша Светлость..."'
- guid: e4239458-63e2-4de7-82d2-d6dbafb2d48b
  text: '"То есть вместо того, чтобы искоренить грех Теодоры, ты перенял его по наследству?" {n}Голос Сестры битвы звенит праведной сталью.{/n}'
- guid: e45fc34d-f49d-469b-b167-b59623223865
  text: '{n}Маражай смеривает вас долгим пристальным взглядом. Пауза начинает затягиваться, когда он наконец-то небрежно роняет.{/n} "Я не буду отвечать за свою сторону сделки, если ты забудешь о своей. Если мне будет недостаточно игрушек — твои слуги начнут умирать".'
- guid: e4679150-ae00-46f5-b7b3-fce4658474c9
  text: '{n}Вид у Октавианы усталый, но она {d|Encyclopedia:Ch2_FootfallAlly}находит в себе силы бодро улыбаться{/d}. Налив две стопки прозрачной желтоватой жидкости с прометийными разводами, она двигает одну Риззе.{/n} "Выпьем за милосердие и рассудок Ее Непогрешимости Чорда. Где бы они сейчас ни были!"'
- guid: e4cbe835-8229-4dc7-9ccc-0a4508689eb1
  text: '{n}Будто в один миг остыв и утратив всю грандиозность своей фигуры, Соломон тихо произносит:{/n} "Как прикажете... {name}".'
- guid: e4f2672e-0280-465e-bdf5-72eed776095b
  text: '{n}Дни сменяли часы, но ксеносы не проявляли активности. В конце концов, гробница железных скелетов утихла, и тошнотворные зеленые огни угасли. Но дозор никто не распустил. Служившие в нем стали призраками, охраняющими мертвых.{/n}'
- guid: e54f0de3-56da-466f-8b3f-b91d5b4d4056
  text: '{n}Заккари Вайс оборачивается к вам задолго до того, как вы подходите. По хребту пробегает холодок, словно кто-то наблюдает за вами изнутри.{/n}'
- guid: e57cab11-fc2d-4b83-9994-00438ec3ccec
  text: '{n}Перед вами стоит тощий человечек в рабочей одежде. Его лицо опухло от синяков, а несколько пальцев переломаны и торчат под странными углами. Водянистыми глазами он смотрит прямо перед собой.{/n}'
- guid: e58c1d43-024a-4452-bfff-265ceef4458b
  text: '{n}Винтерскейл вздрагивает, как от удара плетью, и тени сомнения омрачают его взгляд.{/n} "Испытываешь границы дозволенного, {name}? Мне нравится твоя храбрость, но не стоит так глубоко совать голову в пасть ко льву".'
- guid: e59e9f30-c6a8-4942-834a-bbabe3b8b02e
  text: '{n}Старика начинают сотрясать конвульсии, свидетельствующие об агонии. Он поднимает на вас уже ничего не видящий взгляд.{/n} "Ваша Светлость... если позволено умирающему просить вас о последней воле... Не сообщайте никому, что я был тем, кто отпер двери... иначе... иначе они придут и за моей родней... моим домом..."'
- guid: e5dc7387-b05e-4439-9bce-bcd19ac5f69c
  text: '{n}Наместник чуть стискивает зубы прежде, чем ответить.{/n} "Я всеми силами оттягиваю момент, когда на станции начнется голод. До анверов не дошли руки. При всей своей вредности, они — не игроки. Когда их заводила сдохнет, остальные сами разбегутся".'
- guid: e6163b45-e848-4b05-96e5-66e157eef5ec
  text: '"Умри". {n}Шипящий сгусток плазмы с силой бьет вам в грудь, обращая окружающую действительность в ничто.{/n}'
- guid: e633fdd1-c13c-4d91-bdd8-b16e59d7b108
  text: '{n}Клеменциа пытается сделать шаг в вашу сторону, но стоящий рядом стражник останавливает ее. Лицо женщины покрыто тенью усталости и страха.{/n} "Ваша Светлость!.. Вы здесь. Пожалуйста, выслушайте нас".'
- guid: e67b9c5c-b91d-4e38-aa45-f247d6c6abf5
  text: '"Я..." {n}Маражай широко распахивает глаза. В них — изумление и неверие. Кажется, он доподлинно был уверен в исходе — и не ожидал того, что слышит сейчас. Губы ксеноса искривляются в разъяренном оскале — ненависть обращена к ксеносу на троне... и все же не находит выхода под взорами десятков друкари в зале.{/n}'
- guid: e6add2da-7161-4428-9a0c-37203f093a34
  text: '"Конечно же... прошу вас..." {n}Движения фактотума слегка заторможены. Он извлекает на свет небольшой неровный кусок лезвия, переливающийся перламутром.{/n}'
- guid: e721e470-6d6d-4271-bc35-8c4f76a188a0
  text: '{n}Взгляд девушки, нежный и полный печали, обращается к вам.{/n} "Давайте обсудим наши отношения в ином месте. Если переживем этот день, конечно".'
- guid: e72e61e0-4750-456c-b908-e156cdb30ea5
  text: '{n}В зарковских легендах полярная шапка мира надолго стала местом проклятым и зловещим. Северные ветра теперь доносят потусторонний смех и шепот нездешних голосов. Но жертва не была напрасной — Погонщицы попросту не могли устоять перед приманкой и большая часть их популяции покинула обитаемые регионы мира.{/n}'
- guid: e76d0360-9c80-45ea-a88d-3c586e8015f0
  text: '{n}Огонек зажженной папиросы подсвечивает удивленное, но доброжелательное лицо Инфернус-мастера. Губа Энриха раскроена, а на скуле красуется свежий синяк.{/n} "Лорд-капитан? Не ожидал увидеть вас в этом отсеке. Совершаете променад по своим владениям? В этот час голубое зарево плазмы особенно прелестно".'
- guid: e7a86eb3-f034-498e-bb6b-8bdb6a6698c0
  text: '{n}Шайрэнкхей исполняет занятный жест, и один из эльдаров преподносит вам сверток.{/n} "Это мой первый и, скорее всего, последний дар подобным тебе, элантах. Пусть он послужит тебе верно, как служил детям Азуриана".'
- guid: e7c359da-6147-407a-9d22-9bf910fb34f6
  text: '{n}Прикрыв глаза, Соломон с чувством произносит:{/n} "Мне тебя ножом пырнуть что ли, чтобы ты убрал{mf|ся|ась}..."'
- guid: e7edfd1d-26c1-4e73-a025-98b4d889fe3b
  text: '{n}Кто бы ни назвал себя Эланой, он передает на сторону врага весьма чувствительную для обороны Даргонуса информацию.{/n}'
- guid: e7fe1502-1138-4a2f-a2fd-57fb7f5b604e
  text: '{n}Ульфар довольно взрыкивает.{/n} "Ха! Славная, видать, была охота! Но может и в нашем мире придет ее черед!"'
- guid: e82a833a-be4f-472b-bc16-be6e8655573c
  text: '{n}Вы закрываете глаза и мысленно собираете все свои силы, стараясь игнорировать подступающую тошноту и кровь, стекающую из глаз вместо слез. Стиснув зубы, вы отгоняете мысли о красках, заполонивших вашу голову, и о пережитом взгляде навигаторского ока. Постепенно невидимые тиски расслабляют хватку, и боль медленно улетучивается, а вместе с ней — и странные силы.{/n}'
- guid: e870971e-9e85-44b6-a0d1-c260b7691b39
  text: '{n}Ваш двойник решительно рубит воздух рукой, и лицо {mf|его|ее} искажает суровая гримаса решимости.{/n}'
- guid: e8743501-6f60-4cdf-8852-21c35015c186
  text: '{n}Дальнейшее действо повторяется, словно отрепетированная пьеса.{/n}'
- guid: e874430b-48a6-419f-b723-540ad3eea282
  text: '{n}Странный шепот касается вашего слуха. Вы не в силах разобрать его, этот бесконечно далекий, хоть и бесконечно мощный голос... Может, вам почудилось?{/n}'
- guid: e8e0f3c3-7c24-498b-a91e-a6f49c436298
  text: '{n}Маражай морщится от ваших слов — но не от гнева, а от разочарования. Кажется, он ожидал не такого ответа.{/n}'
- guid: e8e5c1ea-4694-4740-bb18-42345d4d2514
  text: '{n}Сгорбленный мужчина в мантии Адептус Администратум просматривает данные на {g|Encyclopedia:Dataslate}инфопластине{/g}, в то время как его механические руки с тихим стрекотом покрывают письменами длинный свиток. Заметив ваше приближение, человек растягивает в улыбке тонкие губы и почтительно кланяется. Свечение в глазах сервочерепа над его правым плечом мягко пульсирует.{/n}'
- guid: e92a4657-3233-4500-9748-a193eebe7dd2
  text: '{n}На вас взирает животное, которому нравится убивать. Нет, не нравится — оно просто убивает, без радости и удовольствия. Такова его природа.{/n}'
- guid: e96b8ad2-b811-495a-9c7c-a50d383df24a
  text: '{n}Арджента подлетает к последнему оставшемуся в живых культисту и молча, яростно бьет его по лицу.{/n} "Нечестивый еретик! К кому вы обращали молитву?! Мне знакомы эти слова, этот зов к "Влады..."'
- guid: e99d1e5d-c54d-4b53-a7ea-edabddff4d3a
  text: '{n}Пораженный регион был изолирован. Вскоре один из беглых немочей вышел из чащи и передал встретившим его стражам сверток с ксеноартефактом, а также послание: "Примите дары и не трожьте мир".{/n}'
- guid: e9f3ca32-14e6-47ab-a0e3-fc63b5d9fdbd
  text: '{n}Вы узнаете косматую рыжую бороду и цепкие черные глаза. Этот мужчина наблюдал за перепалкой блюстителя и одного из работников станции.{/n}'
- guid: e9fd571a-514e-4c08-9e0b-d81011aab839
  text: '"Дисфункция вызвана ложной инфо-разметкой. Всеведающий {g|Encyclopedia:OmnissiahGlossary}Омниссия{/g}, даруй же нам точку отсчета". {n}Бормочет техножрец, замерший у когитатора. Часть лица закрывает толстая металлическая пластина, странного вида манипуляторы рисуют в воздухе невидимые круги. Из вокс-динамика, заменившего рот, звучит сухой и тихий голос:{/n} "Ваш вектор вычислен. Пожалуйста, предложите идентификационное обозначение".'
- guid: ea75c0d4-79d9-4132-b1fe-5d282007058d
  text: '{n}Мужчина умолкает. После паузы он произносит:{/n} "Слава Пращуру нашему".'
- guid: eab51bc3-61e4-4357-afbc-4908d23fb23d
  text: '{n}Губернатор с готовностью хлопает в ладони.{/n} "Оркестр, музыку!"'
- guid: ead2ae37-efe5-441b-8494-f80d5f037881
  text: '{n}Перерезав трубки, вытащив крючья и выдернув спицы, вы освобождаете Хейнрикса из его пут. Дознаватель буквально выпадает из друкарского устройства — лишь каким-то чудом он удерживается на ногах, не свалившись оземь.{/n}'
- guid: eae60c16-8494-40bf-ac74-8a1d47147188
  text: '{n}Инцендия погружает серебряную ложечку в мозг несчастного и неторопливо съедает омерзительное яство.{/n} "Я хочу знать, каковы мысли грешников на вкус. Учусь распознавать, как они думают".'
- guid: eaf9c317-0b3b-4edf-9d88-f0d172cfe1d3
  text: '{n}Перед вами — древняя, но весьма типичная консоль, предназначенная для использования людьми, не обученными таинствам обращения с {g|Encyclopedia:MachineSpirit}машинными духами{/g}. {g|Encyclopedia:Cogitator}Когитатор{/g} абсолютно безмолвен, однако, приблизившись, вы чувствуете исходящее от металлического корпуса тепло — верный признак того, что машина работает.{/n}'
- guid: eb17aa85-08bf-4379-b9f8-b9bc656d06fd
  text: '{n}Тело здоровяка пересекают уродливые толстые шрамы, будто его сложили из множества кусков. Мышцы непропорционально вздуты, в них утоплено множество причудливых аугментов, которые, словно провода, оплетают натянутые сухожилия. Обнаженный от плоти хребет скован стальной хваткой спинального транспланта, а лицо скрыто черным шлемом.{/n}'
- guid: eb34e283-63d8-4486-98fa-448cf90b34c1
  text: '{n}Раненый поворачивает к вам голову, недоверчиво глядя на вас единственным здоровым глазом. Второй скрыт под сгустками запекшейся крови и отеками, обрамляющими перечеркнувшую бровь и висок глубокую рану. Бледное лицо с резкими и тонкими чертами едва ли принадлежит простолюдину.{/n} "Изимонд Зауэрбэк. Чем обязан вниманию?"'
- guid: eb5f6c9f-08c6-4022-94fc-05eca3e18ab6
  text: '"С вами я никогда не могу понять — шутите вы или говорите серьезно. Как вы умудрились найти себя в той, что еще сама себя не нашла?" {n}Кассия едва слышно смеется.{/n} "И все же ваши слова согревают мне сердце. Пожалуй, это добрый знак?"'
- guid: eb87e3e7-192e-414a-9232-d52f83aa100e
  text: '"Отмечено особое внимание Лорда-капитана к священному распределению благословенных технологий аугментации. Вдумчивая установка позволила сохранить для вас это". {n}Из-под алой робы генетора появляется изящного вида имплант.{/n} "Статус жизнеформы "Лорд-капитан" позволит данной технологии служить вам максимально эффективно".'
- guid: ebd4806d-1fca-4635-9599-e63ada859cd0
  text: '{n}Сервочереп проецирует гололит — фигуру мужчины в вычурном камзоле и со множеством экзотических аугментов.{/n} "Развлекаешься, фон Валанциус? Вижу, ты со своими ручными арбитрами, как пустотные крыски по моему кораблю разбежались..."'
- guid: ebfb20e2-e8ca-4ed0-bcc0-7bef38e98097
  text: '"Нет". {n}Звенящий голос Ирлиэт разбивается эхом о стены шпиля.{/n} "Ты дал{mf||а} обещание, которое не сумел{mf||а} сдержать, а природная жадность {g|Encyclopedia:MonKeigh}мон-кай{/g} не позволяет тебе отпустить меня. Но ты не в силах лишить дитя Азуриана выбора. Прощай, элантах. На этом наши пути расходятся".'
- guid: ec1062a0-6794-42db-9350-a813a89bc964
  text: '{n}Ирлиэт начинает говорить — слишком быстро и бегло для Толкователя, однако не для Маражая. Тот поворачивает голову и начинает следить за эльдаркой, словно змея за птицей. Рейнджер делает шаг. Еще один. В ее голосе появляются новые нотки — напевные, почти успокаивающие, а руки движутся в причудливом танце жестов, то и дело прикасаясь к камню душ на ее груди.{/n}'
- guid: ec156d6e-5cfa-41bb-8e88-170cfda3503d
  text: '{n}Джай деловито пересчитывает невесть откуда взявшиеся в ваших покоях сокровища.{/n} "Шерин, я решила, что будет правильно все это вам вернуть. Сколь бы ни был приятен и ценен дар, он обратится каменной ношей на сердце, когда получен при помощи обмана".'
- guid: ec3cdb5a-202f-4bd8-b671-1509ccc9d0f0
  text: '{n}Янрис кивает.{/n} "Вероятно, Леди-Навигатор Кассия забрала цветок с Эурак-V вместе с некоторыми своими вещами и хранила все это время. Едва ли у кого-то еще на этом корабле, кроме вас, разумеется, хватило бы могущества обзавестись столь редким артефактом".'
- guid: ecd05ad4-b4bf-49ff-a0ea-d7e01053ae57
  text: '"Я устала от слепоты провидцев и ненависти собратьев, Шайрэнкхей. Все выборы нашего народа привели лишь к боли и гибели тех, кого мы любили. Я более не желаю становиться частью чужой ненависти и платить за ошибки тех, кто должен был вести нас к свету, а привел к забвению". {n}Взгляд Ирлиэт впивается в стоящих неподалеку провидцев.{/n}'
- guid: eced89c4-290b-4e3c-8958-3b613b15a6c6
  text: '{n}Вы не сразу замечаете, как в ваше сознание проникает нечто чужеродное... и до боли знакомое. Сумбурный шепот начинает складываться в многоголосую речь — тихую, словно проникающую через многочисленные стены.{/n}'
- guid: ed9ad1e4-05c3-4724-a96a-1cb77e4c64fd
  text: '"Возрадуйтесь, братья и сестры, ибо Бессмертный преподнес нам великий дар!" {n}Седовласый старец в алом одеянии блаженно улыбается, и десятки глаз устремляются к вам, жадно ощупывая с ног до головы.{/n} "Присоединяйтесь к пиршеству, пришельцы из тьмы. Алая Длань принимает всех страждущих!"'
- guid: edc69e21-37d5-48a7-8f0d-21f464677229
  text: '"Что?!" {n}Идира обеспокоенно смотрит на Ардженту, сверлящую ее подозрительным взглядом.{/n}'
- guid: edcd5855-a22a-47b8-8eae-18e3a9b2649c
  text: '{n}Эльдарка поджимает тонкие губы.{/n} "Да будет... так".'
- guid: edfaf98d-82df-4a4a-9719-ff6dd8425184
  text: '"И это, Лорд-капитан". {n}Исповедник смущенно скребет пальцем в проводах на затылке.{/n} "Знайте, что среди пустотников Простора о вас добрая слава идет. И у нас, и на других {g|Encyclopedia:ImperialNavyGlossary}кораблях{/g} вас чтут как верн{mf|ого|ую} слугу Его. Многих капитанов власть ослепляет, но не вас. И мы, пустотные волки, такое ценим".'
- guid: ee00ede7-d2f8-44f9-b851-3143c06bbd8a
  text: '"Странное чувство. Зауэрбеки, которые при мне были никем, возвысились до дворянского статуса, а род Аффинати, славный в мое время, исчез без следа..." {n}Вокс Себериана скрипит и умолкает, словно бы его аугментация на мгновение вышла из строя. Но продолжать фразу ваш предок явно не намерен.{/n}'
- guid: ee0787a0-fa71-4aeb-b854-37d5f548374f
  text: '{n}Воин смотрит на вас долгим проницательным взглядом.{/n} "Благодарность детей Азуриана твоему виду — редчайшая награда сама по себе, элантах. Но я уже какое-то время наблюдаю за твоими собратьями. Полагаю, в качестве доброй воли мне стоит вознаградить тебя за труды более... привычным мон-кай способом".'
- guid: eea5857d-c5a8-40be-a062-7ada38926d8f
  text: '{n}Через секунду невидимая сила окунает вас с головой в бурлящий поток эмоций, и сердце пропускает удар за ударом — в такт дыханию Леди-Навигатора.{/n}'
- guid: efb7a5eb-3183-4318-9c5d-114c3f6cca08
  text: '{n}Мужчина довольно смеется.{/n} "Конечно, нет. Судя по моему опыту, все мозги и фантазию из комиссаров выбивают еще при обучении. Я — штрафник из {g|Encyclopedia:AstraMilitarum}Астра Милитарум{/g}".'
- guid: efd633dd-01aa-4366-bf43-5c1feae662f2
  text: '{n}Когитатор абсолютно безмолвен, однако, приблизившись, вы чувствуете исходящее от металлического корпуса тепло — верный признак того, что машина работает.{/n}'
- guid: eff4954c-53b9-4292-b985-95674e172c45
  text: '{n}Ксенос задумывается на мгновение.{/n} "Не думаю, что это возможно. Трехокие мон-кай осквернили это место, и я не намерен рисковать Камнем Душ только для того, что помочь им избежать последствий плачевной игры".'
- guid: f04290db-1a18-4966-9523-067f0fc9a6b9
  text: '{n}Ризза умолкает, продолжая при этом сверлить ваше лицо взглядом. Постепенно ее выражение меняется — с бестактного интереса на почтительное изумление.{/n} "Я вас знаю, {name}. Кто бы мог подумать, что {d|Encyclopedia:CharGen_Criminal}птица такого полета{/d}, как вы, залетит в наши края... О дерзких делах, которые вы проворачивали, ходят легенды — даже {g|Encyclopedia:KasballicaMission}Касбаллике{/g} есть чему у вас поучиться! Для такого человека, как вы — только лучшие цены. По-настоящему лучшие".'
- guid: f0673f66-1551-4e19-b2f5-2a9b1a1d9b45
  text: '{n}Перед вами на коленях нескладный мужчина с упрямой челюстью и тяжелым взглядом. На фоне прочих работников отсека он ничем не примечателен, кроме татуировки на предплечье с червем, пожирающим звезду.{/n}'
- guid: f0789aef-96be-4ed8-bb8e-793564472bd6
  text: '{n}Массивный корпус {g|Encyclopedia:Manipulus}манипулуса{/g} стремительно поворачивается к вам. Взгляд Эоганна полон азарта.{/n} "Вольный Торговец! Ваше явление вызывает каскад импульсов в префронтальной коре моего мозга. Восторг — вот слово, которое я искал! Отриньте волнение — объекты эксперимента законсервированы благодаря сочетанию алхимических смесей, местных транзакций Движущей Силы, и аугментационных процедур средней степени инвазивности. Иными словами, все трое еще живы". {n}Весь разговор мехадендриты манипулуса не прекращают своих манипуляций над телами.{/n}'
- guid: f0b9dbe6-cb4e-4423-81e4-d592461627c5
  text: '"Великолепно, Лорд-капитан!" {n}Медикарий выглядит уставшим, но безмерно счастливым. Вы замечаете, что на его одеянии прибавилось знаков отличия.{/n}'
- guid: f0c119e5-f6ae-4443-95b7-357f245f33cf
  text: '"Солгал, значит..." {n}Буря проносится в глазах Ардженты.{/n} "Ложь, всюду ложь..."'
- guid: f14d6000-4cd9-4d0c-8e9f-660a22d3c345
  text: '{n}Очередь вокруг вновь гудит. Просители переглядываются, схватившись за свои бумажки. Лишь спустя несколько секунд вы осознаете, что сервочереп уже третий раз повторяет номер именно вашего талона.{/n}'
- guid: f1bcc7d0-b6e8-4d4d-8018-09085c729305
  text: '{n}Все они в хорошей форме, что не удивительно. Молодые и седые, мужчины и женщины — каждый из них словно бы сошел с пропагандистских плакатов Астра Милитарум.{/n}'
- guid: f1f77a49-ef74-4977-b89c-02dc224883f7
  text: '{n}Взгляд Хейнрикса становится отсутствующим — словно он намеренно перестал смотреть на вас.{/n} "Скверна течет в крови от поколения к поколению, Вольный Торговец. Похоже, ты не избежал{mf||а} ее касания. Мы продолжим этот разговор позже".'
- guid: f2083ce9-9db2-4185-8442-e5c9b1caabf0
  text: '{n}Сотня мальпийцев была пострижена в Орден Молота, и два учения были вынуждены сосуществовать в стенах одного монастыря.{/n}'
- guid: f257cb7f-8527-43cc-b4d5-6e0a71af60b9
  text: '{n}От резкого пробуждения у вас кружится голова, и тошнота подкрадывается к горлу. Но все это меркнет под гневным взглядом зеленых глаз.{/n} "Мон-кай".'
- guid: f26c8e72-7390-414d-bcb1-0dc19f48bfcc
  text: '{n}Когитатор некоторое время собирает отчет с действующих систем станции, затем появляется надпись:{/n} "Протокол приведен в действие. Проход открыт".'
- guid: f284e224-26f4-4443-8bb7-18f0fcf7de6c
  text: '{n}Хейнрикс смотрит на вас в упор глазами, темными словно два омута.{/n} "Мир обречен — со всеми, кто на нем находится. Исчезновение звезды стало последним толчком к гибели, последним аккордом в планах культа Последнего восхода. Когда-то я видел подобное — мир, сдавшийся слугам {g|Encyclopedia:Chaos}Архиврага{/g} и позволивший скверне проникнуть слишком глубоко. Сейчас миллионы людей бьют челом тем, кто обещал им спасение, и добровольно отдают свои души Хаосу. Жертва, достаточная для порождения демонического мира".'
- guid: f2ad3dcb-944e-43dd-aec7-d55ccbdcbcca
  text: '{n}Тервантьяс делает раздраженное движение пальцами, и вы чувствуете укол в шее. Пальцы нащупывают крохотную стрелку-дротик, застрявшую в коже. Она могла прилететь откуда угодно — в своем логове гемункул мог разместить десятки убийц или автоматических орудий. Ваше сердце сбивается с ритма, тупая боль растекается по левой руке. Брезгливо морщась, Тервантьяс наблюдает за вашей агонией.{/n}'
- guid: f2afdd48-f454-462f-8bff-2aeda54db89a
  text: '{n}Зеленый экран когитатора загорается при вашем приближении и высвечивает мигающие строки:{/n} "Паломник, лишь слова Первого Гальванического Гимна явят тебе дары, сокрытые за пологом знаний. Пой же вместе со мной: "Вознесем сие песнопение..." {n}Клавиши устройства осеняются светом, явно ожидая того, что вы введете продолжение стиха.{/n}'
- guid: f2bdf5a1-e241-402b-a807-cb0964ccb649
  text: '{n}При виде кольца Изимонд отчетливо скрипит зубами.{/n} "Вот как? Что ж, я не стану препятствовать воле {mf|того|той}, кто действует по санкции сенешаля".'
- guid: f2edc06f-c9ef-4833-b03b-7b181632d1aa
  text: '{n}Прикрыв глаза ладонью, Кассия печально качает головой.{/n} "Жар ваших оттенков слепит глаза, Лорд-капитан. Золото и алый окутывают нестерпимым сиянием все естество, но глубоко внутри... Я вижу трепещущий, изгнанный, ненавистный вами черно-синий мазок, что портит идеальную картину. Вы боитесь... оступиться? Одиночества? Что Император отвернется от вас?"'
- guid: f33c9b15-fc00-4f02-a443-d2f747b12b59
  text: '{n}Лицо Соломона становится безжизненным, костяшки белеют.{/n} "Я считал, что моя беззаветная верность Лексу очевидна. Но меня проверяли и прослушивали, как какого-то постороннего. Как не-арбитра. Еще и Глейто в это втянули — лучше бы установили в меня свою шпионскую дрянь".'
- guid: f36127bf-9b07-4bfa-8cd9-b152a4cedcf8
  text: '{n}Сваленные в кучу безжизненные тела встречают вас у входа во дворец. Мертвецы в форме дворцовой стражи лежат рядом с несколькими другими — одетыми в наряды, похожие на те, что обычно носит знать.{/n}'
- guid: f398cc4b-5693-4f68-873a-d659e4a524b1
  text: '{n}Перед вами маленький, сильно {g|Encyclopedia:Augmentation}аугментированный{/g} человек в изодранной грязной робе. При вашем приближении он нерешительно поднимает на вас взгляд, полный ужаса. Спереди у него все еще болтается на ремнях переносной инскрибер с клавиатурой, а из-за края капюшона виднеется отсоединенный церебральный {g|Encyclopedia:Cogitator}когитатор{/g}.{/n}'
- guid: f3c46c80-9123-49d9-9524-c1198706057b
  text: '{n}Брат Тикон избран настоятелем Ордена Молота. С Фолстоуна на множество планет вылетели мирные эмиссары, чтобы заключить союзы и укрепить духовные связи с держателями реликвий святого Когнация. Эта дипломатическая миссия без сомнения потребует серьезной финансовой поддержки.{/n}'
- guid: f3ce6ab3-73e3-4489-bc73-b263dbb3a2ca
  text: '"Пускай не вся моя собственность вернулась ко мне, я, тем не менее... удовлетворен. Мы можем идти. Ты сносно послужил{mf||а} моим желаниям, {name}". {n}Маражай нахально ухмыляется вам и кивает.{/n}'
- guid: f3e2d49a-c947-4130-a1e5-5c84170a4ee3
  text: '{n}Издав пронзительный птичий крик, двуглавый орел пикирует с неба, чтобы вцепиться коваными когтями в лицо провидца. Огромные крылья и праведная ярость кибербестии сможет отвлечь врага от сражения на несколько критических секунд.{/n}'
- guid: f42c43bf-43a4-4a22-90ea-b3b28dac7370
  text: '{n}Следующий планетарный цикл дорого стоил Даргонусу. Успев стянуть силы, культ выродков ударил в ответ. Буйствующие орды выродков, саботаж и взрывы, перестрелки унесли тысячи лучших слуг династии. Но исход был предрешен, и нечистые капища еретиков запылали.{/n}'
- guid: f42e7be4-2cb9-4581-9a66-3c08af91e993
  text: '"Лорд-капитан". {n}Вигдис странно чеканит каждое слово.{/n} "Мастер дисциплины докладывает о попытке вооруженной диверсии в Секторе Бионика. Нарушитель использовал фраг-заряд, множество раненых среди персонала. Требуется присутствие Лорд-капитана".'
- guid: f4363f70-722e-4812-b609-1a307ba9279f
  text: '"Это символы мои культистские, чтобы порчу наводить и с демонами говорить". {n}Рабочий тыкает в неровный полукруг с исходящими из него девятью стрелками.{/n} "Вот этот зовется "оглобля ужаса", символизирует девять архидемонов, каждому из которых я по очереди молюсь спозаранку".'
- guid: f45cf833-dc73-413d-8b28-6e15e17b2b5b
  text: '{n}Вашу голову пронзает острая боль, а свет в глазах меркнет. В нос бьет запах дыма и гари, к горлу подступает тошнота, ноги подкашиваются, а колени бьются о металлический пол. В ту же секунду {g|Encyclopedia:Manufactorum}мануфакторум{/g}, окружавший вас мгновение назад, скрывает неистовый смерч из мглы, пепла и серых теней.{/n}'
- guid: f4b109c5-c637-485b-b965-80cee2874399
  text: '"Как будет угодно". {n}Бутыль исчезает под стойкой вместе со стаканом.{/n}'
- guid: f4bb5054-538e-4b48-9302-506ffbd98bbb
  text: '"Я предупреждал тебя, Вольный Торговец. Ты пропах{mf||ла} скверной от головы до пят. Даже достойная смерть не смоет с тебя этот смрад. Инквизитор может прощать тебе что угодно, но мне в твоей дружине ходить зазорно. Прощай". {n}Ульфар сплевывает и презрительно взирает мимо вас.{/n}'
- guid: f5d4642c-f33d-4a5d-b92c-a4cc763cd548
  text: '{n}Почуяв тепло разумного существа, невзрачный лист молниеносно вцепился в живую плоть. Если бы вы не уничтожили его... Кто знает, что стало бы с нервной системой и разумом его жертвы всего через несколько секунд.{/n}'
- guid: f631a208-64c8-43e6-bb32-2e1468e962bc
  text: '{n}Ваши соратники согласно шумят в ответ на ваши слова. Инквизитор молча переводит взгляд на {g|Encyclopedia:AdeptaSororitasGlossary}сестер Битвы{/g}. Они стоят, как вырезанные из камня, — и все же в этой неподвижности нет покоя. Болтеры подняты ровно настолько, чтобы одним движением взять цель.{/n}'
- guid: f6536731-0738-4cad-8243-babc80d245cf
  text: '"Ради сокровища. Что бы это ни было, его нашла Теодора, а значит, оно — мое. И Ксавьер пожалеет, что решил воровать у моей династии". {n}Двойник самодовольно ухмыляется.{/n}'
- guid: f6819374-eb29-468f-9e06-b177ca55a11c
  text: '{n}Старик похож на человека, но чешуйчатые роговые наросты, тянущиеся от переносицы к лысой макушке вздутой головы, гротескные скулы и черные когти, венчающие мясистые пальцы, выдают в нем генетического выродка. Брызгая черной слюной, старик скрежещет:{/n} "Ты пролил{mf||а} кровь Конгрегации... Ты оскорбил{mf||а} Его избранных чистейших детей! Ты... Ерети{mf|к|чка}!"'
- guid: f6a68416-3fea-4652-8869-e041e6917f2e
  text: '{n}Нет времени для раздумий! Вы выхватываете оружие и принимаете боевую стойку, готовясь к рывку. Но Немезит уже целится в вас, ехидно улыбаясь. Черное дуло смотрит в вашу сторону, и мир вокруг сужается в тонкую линию.{/n}'
- guid: f6b56777-670f-41b9-a0e8-f297ceaeab94
  text: '{n}С аугментами служительниц Омниссии произошло нечто странное — они будто начали разрастаться в плоти, выбрасывая паутинки металла вокруг себя.{/n}'
- guid: f6ca056a-c589-48a9-8d77-8cc697f8b737
  text: '{n}Мишень разлетается вдребезги. Ваша охрана незамедлительно заходится восторженным ревом, а Соломон почтительно склоняет голову.{/n}'
- guid: f73a0cbf-48f2-46d7-b737-806b0ed70eac
  text: '{n}Двигаясь медленно, словно под музыку, которую слышит лишь она сама, Кибелла снимает ритуальную маску. Мрачные тени вокруг глаз подчеркивают мертвенную бледность ее кожи, по которой рассыпаны многочисленные ритуальные шрамы.{/n} "Отныне я твоя тень, Домин''{name} фон Валанциус. Орудие смерти, что вложил в твою руку {g|Encyclopedia:EmperorGlossary}Неумирающий{/g}. Ибо так и должно было случиться. Ибо так и предсказали карты {g|Encyclopedia:ImperialTarotGlossary}Его Таро{/g}".'
- guid: f76687f6-402c-415e-9610-07aeb8d0871b
  text: '{n}Мир — непроглядный, полный теплой боли мрак. Вы недвижно лежите — нет, покоитесь! — в нем, постепенно растворяясь в ничто. Иногда ваш покой тревожит неприятная настойчивая дрожь, идущая из места, где когда-то были ваши ноги. Вы стараетесь игнорировать его.{/n}'
- guid: f76cf856-55e7-4660-abe0-d8f3062c2190
  text: '{n}Однако через секунду вы проваливаетесь в бесконечный кошмар. Раз за разом переживаете агонию собственной смерти наравне с желанием убить, искромсать, очистить... Раз за разом. Бесконечно. Всегда.{/n}'
- guid: f7915afc-3eb9-4f7a-ba3d-8954b947333d
  text: '"Хочешь знать мое имя, мон-кай? Твой род не славится дружелюбием. Да и о чем нам говорить после того, что твои сородичи сделали с моим домом". {n}Тонкие брови эльдара сдвигаются вместе.{/n} "Впрочем, в благодарность за спасение я все же удовлетворю твое любопытство. Я — Эклендиль Маэрш, идущий Путем Провидца, Всевидящее Око и Безвременный Страж мира-корабля Крудараха. Был им. До недавних пор".'
- guid: f7f9beec-9c12-491d-a4a7-a9dedae4c9c7
  text: '{n}Из вокса доносится сдавленный вздох.{/n} "Н-не гневитесь, Ваша Светлость, но этот слуга ничего не знает. Было велено передать без лишних вопросов и разговоров, или лишусь языка... снова. И... в-вот... едва ли я смогу вам помочь..." {n}Парень испуганно пожимает плечами, несколько раз старательно откланивается и спешит покинуть кабинет.{/n}'
- guid: f7fb0ae7-0211-4707-b7cd-bb177531d501
  text: '"Слово о Неумирающем звучит на корабле... И за его пределами. Многие пираты, что живут разбоем, глухи к проповедям {g|Encyclopedia:AdeptusMinistorumGlossary}Экклезиархии{/g}. Но наше учение им понятнее. Оно тоже выковано в горнилах крови и насилия. И Кровавая паутина рассказывает им о вас. О вашей верности Ему". {n}Он склоняет голову.{/n} "Мы воздаем Домин должное".'
- guid: f815d300-5c98-4f36-bc70-9aafc188ea94
  text: '{n}Идира открывает уста, и вы видите, что между зубов на месте языка зияет чернота. Вместо ее голоса слышна сотня потусторонних голосов варпа:{/n} "Господин желает жертв... Живых жертв... Брось их в варп... Их пути будут расщеплены и вплетены в твой путь".'
- guid: f833fcc7-a442-4fd0-ae87-4d2cd4334524
  text: '{n}Плечистая фигура Каллигоса пышет силой и могуществом, но напряженно гуляющие желваки выдают его нетерпение.{/n} "Ожидание охоты на этом жестяном корыте тянется целую вечность, {name}".'
- guid: f8456482-b30b-4dc6-a730-3b74738402cf
  text: '{n}Большинство зашифрованных данных отсутствуют — прослеживаются следы протокола очищения. Восстановить их не удается, однако список последних отданных команд отпечатался в сознании машинного духа, который старательно выводит их на вид-скрин единой бегущей строкой: "ДитяУдалитьПиктПотокОтключитьКодыДоступаАннулироватьУправляющиеСтанциейУдалитьСамоуничтожениеЧелноковАктивироватьЛогКомандОчистить...{/n}'
- guid: f8afe980-8ed9-4eaf-97d4-395f3ee4a88c
  text: '"Висирь. Кровавая паутина. Эти... люди. Они посмели решать за меня — кто я и ради чего существую. Для них я инструмент". {n}Кибелла презрительно кривится.{/n} "{d|Encyclopedia:CompKibellah_Distortion}Так было раньше{/d}. Теперь я — тень Домин. Величие и сила. Страх и ярость врагов {mf|его|ее}. Передо мной открыта бесконечность вселенной..."'
- guid: f8f8458e-8104-4f97-988a-c9fb1f90a41c
  text: '"Жизнеформа еще не восстановила полную функциональность. Позже вы сможете пообщаться с ней в секторе Бионика". {n}Ферренц делает шаг в сторону, аккуратно поддерживая грозящего завалиться на бок медикария.{/n}'
- guid: f9936d04-192c-4fde-bd5d-f65affe3aaf3
  text: '{n}Солдат со вскриком падает. Его прежде симпатичное лицо уродует глубокая рана со рваными краями, половина уха оторвана, нос раздавлен и свернут на сторону. Вряд ли костоправ, услуги которого по карману Джасперу, сможет вернуть его лицу былую благовидность.{/n}'
- guid: f9d74333-688d-41d8-b112-defafe09583f
  text: '{n}Несмотря на холод нижних уровней Гордости Сантиэля, вас бросает в жар, а пот заливает глаза. Наконец изнуряющая операция заканчивается, и вы аккуратно пакуете образцы странного Орудия Боли в защитные контейнеры.{/n}'
- guid: fa316136-faef-4f2b-9743-2d826f9a6902
  text: '{n}Возмущенный гул голосов и приглушенные проклятья предваряют открывшуюся вам сцену: Маражай, занявший место Лорд-капитана, с ленивым и глумливым интересом наблюдает за толпой собравшихся внизу офицеров. Заметив вас, он неторопливо выпрямляется.{/n} "Мо{mf|й|я} маленьк{mf|ий|ая} звер{mf|ек|ушка}. Ты заставляешь себя ждать. Неосмотрительно".'
- guid: fa5cb28b-b146-4392-8597-3097a7d909be
  text: '{n}За мутантами установлено наблюдение. Один из надзирателей обнаружил в руках группы немочей таинственную реликвию, на проверку оказавшуюся творением ксеносов. Маловероятно, что сами выродки понимали, чему поклонялись.{/n}'
- guid: faf3e784-ef8a-44ff-9f66-d592ff297626
  text: '{n}Женщина перед вами излучает чуждую красоту — костяной гребень на лбу, фиолетовый отлив кожи и изящные когтистые пальцы выдают в ней ксеносскую кровь. Ее одеяния схожи с робой старого мутанта, которого вы предали казни в фамильном склепе, а осанка — статная и властная. Сапфировый свет сочится из-под полуопущенных век, а губы растянуты в надменной ухмылке.{/n}'
- guid: fb2acc3a-d965-4e44-9426-8a07b1c9017c
  text: '{n}Из темных дыр на лице регента со свистом вылетает воздух. Взгляд выпученных глаз яростно мечется между вами и Кассией.{/n} "В этот раз я вынужден согласиться с тобой, дитя. Однако не забывай о долге — твоя ноша навсегда с тобой. Мы позволяем тебе набраться опыта в компании {g|Encyclopedia:RogueTrader}Вольного Торговца{/g}... Пока что. За сим — мы вынуждены откланяться. Да охранит Император ваш путь".'
- guid: fb4a538b-bb69-4153-9714-e89e142c0e0c
  text: '{n}Многогранник встает в предназначенный для него паз как влитой — и начертанные на нем руны начинают ослепительно сиять. Орудие с ворчанием приподнимается на лапах — вы слышите протяжный и отчаянный стон готовых лопнуть цепей!{/n}'
- guid: fba3626e-2cea-498c-b132-91202049fcf9
  text: '{n}Из горла Каллигоса раздается предвкушающее басовитое рычание.{/n} "Вызов? Люблю вызовы".'
- guid: fbabc69c-1a6d-4833-9f41-a626572bb68c
  text: '{n}Не проронив больше ни слова, Янур разворачивается и исчезает в тенях.{/n}'
- guid: fbed32f2-588c-4124-8522-40ea22aa22cb
  text: '{n}Обсидиановая гладь огромной плиты начинает бурлить, пока на ней не появляется набор загадочных символов — будто бы невидимый палец выдавливает их один за другим на черной поверхности. Вы не знаете что они означают, но от одного лишь их вида у вас начинает раскалываться голова.{/n}'
- guid: fc32762b-fb94-4161-9072-bfdd4af6412e
  text: '"Тогда придет время отверсть третье око и заглянуть в глубины самого {g|Encyclopedia:Warp}варпа{/g}. Среди кошмарных видений, мороков и тварей бездны лишь свет {g|Encyclopedia:Emperor}Императора{/g} — истина, что будет вести меня от звезды к звезде, от системы к системе. О, этот свет... Путеводная нить, столь тонкая, что может в любой момент ускользнуть из рук..." {n}Кассия раскрывает ладонь, словно выронив что-то.{/n} "Но... вам не о чем беспокоиться. Навигаторы Дома Орселлио никогда не теряют маршрута".'
- guid: fcd1ddd4-e17c-47f0-a3cb-d09b8d6fbdf2
  text: '{n}Меровцы отлично научились выживать во враждебном окружении. При помощи извне они получили и необходимые для этого ресурсы. Их поселения и аванпосты превратились в укрепленные районы, а потери оказались сведены к минимуму.{/n}'
- guid: fce5bfae-15fd-4e17-9184-bd4e825a8e2b
  text: '"Но теперь-то благодаря вам все стало на свои места — дверка опять приоткрыта, и шепотки родименькие меня снова ласково терзают". {n}Псайкер горько усмехается.{/n} "Я, собственно, не только сопли благодарственные распускать пришла — дело есть важное обсудить, как раз касаемо шепотков моих. Я видения всякие начала видеть интересные... И, кажется, от того как мы с ними обойдемся, судьба моя зависеть будет. Знаю, звучит драматично, но я на полном серьезе."'
- guid: fd0678f5-7873-44f0-bccb-387ac321a14e
  text: '"А сейчас — имею честь откланяться". {n}Регент Ааронто бросает на прощание взгляд на Кассию, а затем дрожащей рукой командует слугам направляться к выходу.{/n}'
- guid: fd120cf7-e0f0-4036-b971-8a647c6aa4c0
  text: '"Как и Вигдис он — пустотнорожденный, мутант. И он слишком тесно сплетен с системами корабля, что дает много возможностей для саботажа. Кроме того, его манера общения выходит за рамки устава..." {n}Иокаста морщится.{/n} "Но нельзя отрицать самоотверженность Равора на его посту".'
- guid: fd759749-be72-480b-8d97-07744161ed02
  text: '{n}От вас не скрывается полный восхищения взгляд, скользящий по вашим аугментам. В этот момент Дунавски становится похожа на набожную паломницу, оказавшуюся среди мощей святых.{/n}'
- guid: fd813922-89ff-4f8b-b8ca-58bd6b43f837
  text: '{n}Притворно заманив одного из инфоангелов в подготовленный когитатор, слуги Лорд-капитана пленили его и дали сигнал к побиению прочих незваных гостей. Логис-механики уничтожали инфоангелов и схизматикалей с равной беспощадностью.{/n}'
- guid: fdb42b36-4fcb-48cf-be8f-1aa8a3d12ffc
  text: '{n}Криво ухмыльнувшись, мутант выхватывает инъектор.{/n} "О-о-о, боевой стимулятор! Знал{mf||а} бы ты, какие с него видения! Можно, конечно, от такого и сдохнуть... но это того стоит!"'
- guid: fdc9588f-0452-44d6-adb0-6b8e0a31a255
  text: '"Это многое объясняет. В частности, то, что в официальной истории не сохранилось ни единого упоминания о нем". {n}На лбу Янриса проступает напряженная складка.{/n} "Полагаю, за всем этим кроется нечто куда более скверное и темное, чем мы можем хотя бы предположить".'
- guid: fe2e406b-5223-4593-aab9-2328d4ebb5d5
  text: '{n}Перед вами — омерзительный конструкт, словно порожденный чьим-то горячечным кошмаром. Смесь загнивающей плоти и искаженного металла наполовину погребена под обломками коридора. Тварь неподвижна, однако сквозь набухшие раны все еще сочится мутно-зеленая жижа.{/n}'
- guid: fe58afe3-9fe8-4a18-ac91-bea51ba181df
  text: '{n}Соломон закрывает глаза, словно в молитве.{/n} "Лишь Бог-Император совершенен и может трактовать дух закона. Мы же следуем букве как верные слуги Его".'
- guid: fed05b30-160b-49ef-b636-3b3839cc4d16
  text: '{n}Вистенца Янус Вьятт аб Арам аф Коронус яростно листает что-то на {g|Encyclopedia:Dataslate}инфопластине{/g} и отдает приказы по позолоченному {g|Encyclopedia:Vox}воксу{/g}. При виде вас она спешно убирает устройства, разглаживает юбку и опускается в глубоком книксене.{/n} "Ваше Сиятельство, примите мои глубочайшие извинения за отвратительную выходку, испортившую прием! Даже в самых страшных снах я не могла себе представить..."'
- guid: fff0ce1b-a192-43bd-8481-83f20dee49dc
  text: '{n}Паскаль застывает, но в визоре его вспыхивают зеленые искры. Вытянув руку к Тарзусу, он лязгающим голосом отвечает:{/n} "Да будет прерван Цикл!" {n}Вы понимаете, что слова Паскаля звучат и из его вокса, и из вокса Тарзуса. А затем все датчики на боевой упряжи палача ослепительно вспыхивают, и рев боли раненого бронированного левиафана оглушает вас.{/n}'
