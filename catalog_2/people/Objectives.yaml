name: Objectives
description: dialog_owner Objective*/Obj* — quest objective nodes
total_phrases: 639
phrases:
- guid: 000d2bef-b966-4bb5-9f95-954055a3f068
  text: Вернуться на Алтарь-Темплум-Каликсис-Экс-17
- guid: 000dc8cd-0695-4f57-9ab9-8e812517e998
  text: Найденный корабль оказался "Странником в пустоши" — древним ковчегов миссионеров святого Друза, что сгинули на мире, погубленном богомерзкими ксеносами.
- guid: 007ecda3-b73d-4dad-ab1f-3e8b5576a8c9
  text: Свидание в корабельном склепе
- guid: 00d0e33a-b478-4417-94ad-94f282500bbb
  text: Справиться у Мастера вокса о здоровье Ульфара
- guid: 0144c788-a4d7-4fe0-8f5e-c1bdf8c299e7
  text: Та, Что Жаждет хочет заполучить душу Ирлиэт в обмен на свое благословение. Алтарь в кабинете Вольного Торговца готов принять подношение в виде камня души ксеноса.
- guid: 01697eb1-6c83-43d0-acce-4a80e1d6ceda
  text: Исследовать кластер систем вокруг Слезы Солара
- guid: 01b2b2ba-a9e8-4d1d-9325-2fa1ee90c89a
  text: Магос Экзальт-177 не поддерживает план Ювенны. Необходимо либо переубедить его, либо устранить иным способом.
- guid: 021c4c59-b088-4f32-851e-86ee1f8a409f
  text: Лорд-капитан свершил{mf||а} великий суд, решивший, кому будет принадлежать Футфол. Те, кто осмелился оспорить приговор, приняли суровую смерть.
- guid: 023b7151-a03d-46af-b7c5-511116690b40
  text: Неопознанная аномалия
- guid: 02902a43-13d1-45fa-8ccc-334626fa2dbd
  text: В распоряжении Лорда-капитана еще не оказывалось имплантов такого высокого класса, как недавно обретенные. Чтобы понять тонкости их установки, нужно обратиться к специалистам.
- guid: 02997a69-ed58-4ba5-a02c-5dd900c8412a
  text: Голос Ювенны как наследницы имеет особый вес. Необходимо найти способ вывести ее из игры.
- guid: 02cf7f8e-6fa1-4731-9d33-c9b87c16f2e6
  text: Команда Вольного Торговца вновь встретилась с Паломником.
- guid: 02d476d5-b333-45c1-88c7-0de26afe44ad
  text: Чтобы востребовать обещанную плату, Вольному Торговцу необходимо вернуться на станцию Алтарь-Темплум-Каликсис-Экс-17 и поговорить с техножрецами.
- guid: 02e05996-8ee3-4e87-8b0b-fcf1f7607abf
  text: Изимонд утверждает, что получил осколочное ранение, однако рана нанесена холодным оружием.
- guid: 031bbbfd-ea3a-45d9-abbf-89545eb38b4f
  text: Изимонд особо следит за Ярубом как за самым ненадежным из меровцев. Необходимо предупредить Яруба, чтобы он держался с блюстителем настороже.
- guid: 0454a1a3-af28-4f41-be3b-834a4ba5b947
  text: Каллигос Винтерскейл сумел не только выжить в суровых лесах Кетца Темера, но и приумножить свою коллекцию ксенотрофеев.
- guid: 04bcf0c9-2783-4619-b151-d1b848e0aed5
  text: Между Эоганном и Паскалем разгорелся жаркий спор. Паскаль запрашивает вмешательства Вольного Торговца и просит найти его на мостике, когда {mf|тот|та} будет готов{mf||а} вмешаться.
- guid: 04c3c989-3986-4a8e-b820-a177f793cd10
  text: Одолеть Осколок К'тан
- guid: 0507f175-3b69-4856-80f1-fa740dc112a0
  text: Допросить Корабельного исповедника
- guid: 05246107-85da-4387-b93c-3099c620ef2d
  text: Помочь отбиться интенданту Куравичу.
- guid: 057ef596-f85f-49c8-8706-dd0c7c3459c9
  text: Отправиться в руины
- guid: 0580ff07-c6ba-4614-9ed8-66a332ca3b59
  text: Команда Вольного Торговца вновь наткнулась на разграбленное судно с древними машинами. На сей раз техножрецы ревностно досмотрели каждую шестерню, однако смогли добыть лишь очередную крупицу археотечного механизма. Быть может, где-то в Просторе есть еще корабли, подобные этому.
- guid: 0595053c-81e3-47c2-b47b-ddc6629fa2ab
  text: Высадиться на Амсанкт
- guid: 059e4fa2-bfad-448e-8528-04cf99a45ef1
  text: Правда о Нааки Эрэбис раскрыта, и Кибелла сделала свой выбор. Вольному Торговцу предстоит сопроводить Второго ткача в храм для отчета перед Висирем.
- guid: 05a500e9-8bd8-41d4-8cb8-82ed91895e05
  text: Все шаттлы уничтожены, вероятность успешной эвакуации Лорд-капитана отсутствует. Рекомендовано провести перезарядку всего доступного оружия и приготовиться к последней схватке с превосходящими силами противника.
- guid: 063fa111-13bd-4468-b8b3-1dfba84dfbe2
  text: Цена праведности
- guid: 072078f8-e1b0-47bb-b960-534946f60573
  text: Багряная пляска Кхейна слишком пугает свиту, чтобы та решилась пойти против Себериана.
- guid: 077c3e37-b403-46b5-910b-fb966ae706ac
  text: Монастырь Адептус Механикус расположен на отдалении от ульев Райкада Минорис, на территориях, дарованных в управление Духовенству Марса. Ввиду масштабных волнений на планете, метод орбитального десантирования рекомендован как оптимальный способ достичь монастыря.
- guid: 07b1ae50-0cc7-4830-8064-4a0448e1e78d
  text: Спрятано в топке
- guid: 07f465ca-425e-4d8e-911c-5493c0521e1e
  text: 'Группа злостных пиратов не первое столетие безнаказанно грабит грузовые суда по всему Простору — даже славной Теодоре фон Валанциус не удалось призвать мерзавцев к ответу, ибо те успешно избегали смертоносной встречи. Однако Вольному Торговцу представился шанс положить конец безнаказанному разбою: корабли назойливой шайки были замечены в системе Пояс Лангренна во главе с флагманским судном "Неуловимое презрение".'
- guid: 080b32cf-26ea-44b0-95eb-e4955db786a2
  text: Преподобный Иеронимус обернулся против Лорд-капитана. Это дерзкое выступление должно быть подавлено, а слушающие проповедника фанатики — казнены.
- guid: 082bae2f-11ac-49c6-9db4-cfda19976f59
  text: Необходимо вернуться на корабль Вольного Торговца и подвести итоги операции.
- guid: 0848ee76-b1e8-49d4-bfea-1df28334a211
  text: Наблюдать за следствием
- guid: 084bc4cd-6342-4419-9640-a4aead3749a7
  text: Отыскать Триасомату и решить его судьбу
- guid: 084f0093-0803-4f30-97a5-f2b8bfb7ab93
  text: Джай намекнула, что была бы рада получить от Лорд-капитана подарок, достойный связавших их отношений. Для Вольного Торговца нетрудно раздобыть почти что угодно — достаточно лишь повелеть Высокому фактотуму предоставить это. Но вот в вопросе выбора {mf|Его|Ее} Светлости придется положиться на себя... или советы членов своей свиты.
- guid: 0908c827-12c4-4fe0-8209-caee35718354
  text: Груз найден и по праву спасения теперь принадлежит Лорд-капитану.
- guid: 0a212e37-85d0-4ac3-a9f0-b4123a2da9d0
  text: Пытаясь вымолить помилование, еретичка и пиратка Ризза поведала координаты одного из своих тайников с неправедно нажитым добром. Лорд-капитану рекомендуется реквизировать награбленное имущество, пока его не обнаружили другие пираты.
- guid: 0a5ff382-7aae-48f4-802b-8272d3773b87
  text: Третий лицемер найден. Где-то здесь должен скрываться еще один — последний.
- guid: 0a7722c0-1492-42cc-8e85-11d2c1dcf163
  text: Предательство на мостике
- guid: 0ab8eaa8-cb22-4349-8961-f57859882a59
  text: Станция обслуживания фамильяра
- guid: 0af48058-5cd9-46b6-9455-c54f51dd622a
  text: 'Данные расходятся в деталях, однако сходятся в одном: на Кьяве Гамма, богатом рудой и минералами мире, который принадлежит династии Вольного Торговца, произошла некая катастрофа.'
- guid: 0af76edb-7c92-4d91-a830-1cbcae0ef644
  text: Сброшенный груз
- guid: 0b559194-63c3-4709-ae7d-a681a105b865
  text: Заговорщик выдал, что его подельники скрываются в фамильном склепе династии. Доступ блюстителей в святое место может открыть лишь Лорд-капитан.
- guid: 0bf10e0d-1f91-4e66-9d3f-d95b05642151
  text: Вольному Торговцу удалось найти координаты места, где капитан Саргона спрятал нечто ценное. Тайник находится в системе Тенебрис Акваэ.
- guid: 0c6ed361-d542-428d-a5ef-98b36befb46e
  text: За пропажей Торгового Патента стоит Тразин Неисчислимый, от заключения которого Лорд-капитан ранее освободил{mf||а} Себериана. Ксенос передал, что вернет Патент в обмен на предка {mf|Его|Ее} Светлости — и для заключения сделки ожидает Вольного Торговца в одной из систем за запретными варп-вратами.
- guid: 0d571b52-f89d-4859-964a-2edc15c27831
  text: Клич соратников
- guid: 0dc14704-e7ac-4287-b451-13162a50f727
  text: Не самая большая из проблем
- guid: 0e10707a-194c-44f8-a0a5-3e87a3997b1a
  text: Тайна исповеди
- guid: 0e68175e-13fd-4a43-9bae-4fe02f2ebcb8
  text: Исправная работа зенитного комплекса — дополнительный довод в пользу обороны.
- guid: 0e7319eb-846d-4f73-9773-3ca438b31e84
  text: Вольный Торговец решил{mf||а} понаблюдать за работой блюстителей и почтить своим присутствием штаб дознания на офицерской палубе.
- guid: 0e9e5b22-4bd5-413e-a3dc-8e576170e631
  text: Восстановив события былых лет, Вольному Торговцу удалось обнаружить наваждение, что терзает Заккари Вайса.
- guid: 0eac860e-954d-47ea-a41c-97ffc40de098
  text: Самопознание
- guid: 0f51612d-9fbe-4722-b3c0-9a01fcdd357e
  text: Выбраться с нижних палуб
- guid: 0f7e653b-4956-4c02-b0e0-eff72181488e
  text: Реколлигеры под управлением Реты Максимовой нуждаются в поставках текстиля и провизии. В качестве благодарности за помощь они готовы предоставить Вольному Торговцу корабельные компоненты, добытые в остове погибшего пустотного судна.
- guid: 1020f1df-06b2-4cee-abaa-9009e7875227
  text: Рапорт Соломона
- guid: 112cf9d9-a20e-49a1-bf80-2e1df11692a6
  text: Расправиться с Зарей
- guid: 11425f73-2ae8-4ecb-9b86-0c013ed5ef9c
  text: Праздник воссоединения
- guid: 11457264-d699-4780-81fe-11d95300cff5
  text: Равноценный обмен
- guid: 13071675-78ee-497b-807e-324dd6a2d85f
  text: По следам "Неуловимого презрения"
- guid: 132f96fc-cd74-4d79-9375-a448dbf8b34b
  text: Завершить расследование в кают-компании офицерской палубы
- guid: 1373ffd9-35c9-4f39-bfb7-d24ad0d870cd
  text: Найдена колония реколлигеров.
- guid: 13993d30-38b8-4b12-8512-f477fdeb61f2
  text: Корабли в Просторе Коронус передают данные о неопознанной космической аномалии в системе Нармер-IV. Об этом явлении известно лишь то, что сам космос вокруг искривлен и нестабилен, а при приближении к аномальной зоне любое судно исчезает без следа.
- guid: 14d14070-137f-4a7e-8310-ab2fd810b567
  text: Летус встретил Вольного Торговца лабиринтом контейнеров. Нужно найти проход к укреплениям Адептус Арбитес.
- guid: 15ad7aa9-1d10-46eb-adf1-af90dbeb8dea
  text: Лорд-капитан наш{mf|ел|ла} авторов трех необычных исповедей и удовлетворил{mf||а} свое любопытство.
- guid: 16943025-bd21-400c-a77f-9b29369b88f2
  text: Ничейные миры
- guid: 16ee9ab7-b2db-4d63-8a15-5c13be267dfe
  text: Лорду-капитану удалось выяснить, что шпионом Инквизиции оказалась Ювенна фон Валанциус.
- guid: 17059520-55a9-4958-923a-4a2b832d90b2
  text: Поговорить с Эоганном на мостике
- guid: 17225426-aade-42b7-bfb2-0be66ceaed40
  text: Импланты высокого класса
- guid: 172260da-e64e-4bdc-99d5-e8b128116024
  text: Ярость в цепях
- guid: 177a4fb0-57dc-4145-a50f-1b96ce364008
  text: Запрос и отклик
- guid: 1883bbca-f7a9-473f-8867-bc761b48d9d9
  text: Эоганн без объяснений бежал на Футфол, забрав с собой Нунциуса. Нужно найти его и узнать причины странного поступка.
- guid: 18d70165-23f4-49c8-af1c-f9d5d75d3951
  text: Исполнить на колонии самый сложный проект развития
- guid: 18de3242-d4a1-4d69-a8bb-80d64d41bb85
  text: Отыскать сущность, поселившуюся в капелле
- guid: 1970fddf-4e03-480f-84ed-eb9ad799ad1b
  text: Гордость Сантиэля была обескровлена и разграблена друкари. Даже светило этой звездной системы было похищено ими.
- guid: 1990312a-7a0c-41fe-bafd-94d4c2e49d85
  text: По данным от блюстителей Чорда, Владайм проводит тайные встречи в баре "Адептус Амасекус". Встретившись с ним, Лорд-капитан сможет обсудить сложившуюся на Футфоле обстановку.
- guid: 19a06734-f1a8-46ae-bc53-0e474b176935
  text: Падение Гордости Сантиэля
- guid: 19fcb605-60f3-4285-9251-69f4983c2471
  text: Сундук мертвеца
- guid: 1a350100-7be7-4d3d-81e3-edf0100e80ad
  text: Оставить свой след в жизни отсека
- guid: 1b4a779b-bc8e-4dc1-a6c6-768c5863684e
  text: Дождаться прибытия псайкера
- guid: 1b53cbb6-179d-499a-9c4d-b1112c5e0a88
  text: Убить киберласераксов
- guid: 1b5e6773-7700-44c5-bb5c-1987e21b5ffa
  text: Говорят, Вольный Торговец заключил{mf||а} сделку с некой сущностью, управляющей миром Амберворлд долгие десятилетия. Скорее всего, это просто слухи. Не мог{mf||ла} же помазанни{mf|к|ца} Императора действительно заключить сделку с Архиврагом?..
- guid: 1b881dce-e360-408d-9dba-ac0ac3e2aa80
  text: Одной ногой в могиле
- guid: 1d916e88-8a87-47bd-91f8-0a11349dc7ee
  text: Кораблю требуется новый Технопровидец, какового, вероятно, можно отыскать где-то в системе.
- guid: 1d9c8cf6-a6f4-4caa-9526-ec38f31d103e
  text: Коварство обитателей Комморры заманило Вольного Торговца на бойцовскую арену Губительной жажды. Чтобы продолжить поиск пути на свободу е{mf|му|й} предстоит выжить в жестоком бою.
- guid: 1dfd7dd7-315c-4d55-a52d-0087e89dc52f
  text: Войти в диораму дворца
- guid: 1ec9db4d-52fa-4a3e-8db4-34884ab52b7d
  text: Ковчег пилигримов оказался ловушкой. Единственный путь из нее — сквозь главный шлюз, через который Вольный Торговец проник{mf||ла} на корабль. И е{mf|му|й} стоит поторопиться, пока нелюди не настигли е{mf|го|е}!
- guid: 1f000618-ff8d-4624-ba95-fc8e6d394a23
  text: Себериан полагается исключительно на свой клинок, что мешает ему услышать доводы свиты на совете. Пока клинок при нем, шансы направить ход событий в иное русло невелики.
- guid: 1f0cfe15-05ec-460e-b427-0a32194f87b1
  text: Вольного Торговца обманом заставили принять участие в гладиаторских боях. Тот, кто сделал это, скорее всего находится в Яме, логове Ревущих. Стоит наведаться туда, чтобы свести счеты, а также разжиться хорошей экипировкой из запасов, собранных Злобой.
- guid: 1faa5b83-1b40-4ce4-9cbb-8ae970fa7c84
  text: Эоганн хочет обсудить Нунциуса. Он ждет Вольного Торговца на мостике.
- guid: 201cb6ae-0cb0-4e49-9611-4766726a7cf1
  text: Камилла Драйвстем препятствует плану сенешаля. Нужно либо убедить ее перейти на другую сторону, либо устранить иным способом.
- guid: 21129cd1-6caf-445b-bcf8-ad7ff1346c89
  text: Себериан слишком полагается на ксеносский клинок. Это мешает ему довериться союзникам.
- guid: 2143012c-4485-41de-8c83-63de285f89ac
  text: Кибелла предложила Вольному Торговцу поговорить с каждым членом дома Эрэбис отдельно, в более непринужденной обстановке.
- guid: 215a84fb-7a64-409a-ab54-bc6e1059597b
  text: Ксеносов друкари в нескольких невероятно редких случаях уже уличали в похищении светил Простора Коронус. Подобные грабительские налеты несут погибель целым звездным системам, однако частота, с которой они совершают кражи драгоценных звезд Человечества, вызывает подозрения. Что вызвало это учащение хищнических свершений?
- guid: 2178fbda-d4bf-4e2d-a303-49b6e9651c3b
  text: На птичьих правах
- guid: 2183fc8f-8bf4-4ae2-8ab7-8c4cc122b578
  text: Сообщить Тервантьясу о победе
- guid: 2185bea9-e4ba-4a39-bc5d-61dfcc8a4352
  text: На мире Даргонус прошла церемония Магнэ Ацессио. Имя "{name} фон Валанциус, Вольный Торговец" раскатистым эхом разносится по всем уголкам Простора Коронус.
- guid: 2229bba7-d4fa-4f65-9a1f-d76b399ef3eb
  text: Чтобы отыскать Калькасара, Вольному Торговцу необходимо спуститься в глубины разрушающейся ксеносской гробницы.
- guid: 22363218-0ab2-42e1-850d-f7b27eac9911
  text: Активировать подъемник
- guid: 2332f714-220e-4669-8274-721427d626d4
  text: В плену гемункула томится могучий космический десантник, Ангел Императора. Привлечь его на свою сторону было бы мудрым поступком.
- guid: 238f2cc5-d9c5-4159-848a-a7352132525a
  text: Аванпост нуждается в помощи
- guid: 23cbe5e4-f1c4-4cd2-94b2-93016725e733
  text: Догнать Эоганна
- guid: 23f80ccf-3402-4ae1-83ce-ef4a7c04502a
  text: Путь в один конец
- guid: 23fb04b8-ada4-4255-964c-674f30fc0d0c
  text: Дар гемункула
- guid: 24a10e9d-02d9-46b3-b1ac-215380a8dbba
  text: Спросить про импланты в Секторе Бионика
- guid: 24dcda78-4709-4174-8ce8-4358fece595d
  text: Высадиться на планету Эпитафия
- guid: 250bc159-0ed8-4eb6-b5dd-4cd11e97d30d
  text: Отыскать Ульфара
- guid: 250ec1ca-eef1-4358-bca1-f7a80930b8ab
  text: Мастер дисциплины лично взялась отыскать подозреваемого Гведона, чтобы Вольный Торговец смог{mf||ла} принять его исповедь. Расследование завершится там же, где и началось — в кают-компании офицерской палубы.
- guid: 252dcc8f-2514-476d-ae3c-988913281768
  text: Поговорить с Кибеллой
- guid: 259c2eee-4978-4886-be5d-04810c5e5021
  text: Система, в которой находятся эльдарские беженцы, расположена на краю Простора Коронус. Восстановить с ними связь не представляется возможным, потому Вольному Торговцу рекомендовано отправиться по полученным координатам лично.
- guid: 26bb91d1-ad55-46a1-bf5e-796d596f2480
  text: Ждать результатов следствия
- guid: 276f7b6b-9d33-4488-86db-696ecf42f61b
  text: Принять участие в ритуале
- guid: 2943b8ca-b641-4bb3-a78d-bfa5fadd09d6
  text: Реколлигеры нуждаются в предметах первой необходимости
- guid: 2966f922-2788-4dbe-8b57-5f78b7ad515b
  text: Placeholder
- guid: 2a1b1694-4e49-4283-a9c8-f5a052a3bb7c
  text: Отыскать архимагоса Амарната в монастыре Адептус Механикус
- guid: 2a636b92-983b-4f93-be3f-a446ddde51b6
  text: Высадиться на "Герметико"
- guid: 2ad80eec-0eb0-45f6-b824-60d424096e1a
  text: Согласно данным Ахиллеаса Скаландра, рейды ксеносов могли затронуть мир-тюрьму Веабос-6. Требуется уточнение имеющейся информации.
- guid: 2b5474ff-f3d7-48a3-8d6a-b6543c2448e7
  text: Яруб обещал ждать Вольного Торговца у госпиталя, чтобы передать клинок.
- guid: 2bc57928-9619-471a-81f9-989c968527fe
  text: Найдите впавшую в немилость незнакомку в баре "Адептус Амасекус" в районе теневых кварталов Футфола.
- guid: 2c87e1a9-14dc-4403-9826-f024b7761f62
  text: Одолеть мстительных духов
- guid: 2cf121d2-5d3a-491c-b6a3-c86dbeb540a4
  text: Предательницей, скрывавшейся под позывным "Элана", оказалась Ювенна.
- guid: 2d1090e8-3ab8-4211-87ab-8f90483bcaf0
  text: Хранители криосклепов
- guid: 2e2aa0c9-7408-4320-9ae8-2a827b9f9089
  text: Найти помощь
- guid: 2e9ebc0c-f283-45a0-bc0c-2abedf6a5025
  text: Забрав голову Немезита в качестве трофея-подношения Неумирающему Императору, Кибелла удалилась размышлять о странных переплетениях нитей их судеб. Возможно, позже она поделится с Лорд-капитаном своими мыслями.
- guid: 2ec7764c-efef-4002-9046-2ea6566696d9
  text: Экзальт-177 прислушивается к Ларии — его поддержку следует сохранить.
- guid: 2f622042-d7ff-4f57-97ca-dbd513d786e4
  text: Защитить шаттлы
- guid: 2f80a4c8-3b06-40f7-89c4-7e35eb63abcd
  text: Изгнать призрака
- guid: 2f991013-f31d-4ac8-99e8-193c6e7bab6b
  text: Найти тайник на Кьяве Гамма
- guid: 2fb61b1a-69f3-4a13-837f-6dc2e8e4bc66
  text: Вольный Торговец Инцендия Чорда взяла контроль над Футфолом, где учинила суд и жестокие расправы над еретиками. Бывший Наместник, Владайм Токара, ушел в подполье и оказывает ей сопротивление. Вмешательство Лорд-капитана может принести победу как одной, так и другой стороне.
- guid: 2fcdb9b9-6dbe-45a4-b88a-b189d5c87fea
  text: Тень двоевластия
- guid: 2fd6bd41-75ec-49b8-8721-a460b2a0fa6e
  text: Отправиться в систему Атласов Предел
- guid: 30ca0813-56b9-4c7a-ab62-3f8c0bdd146c
  text: Авгуры корабля Вольного Торговца не могут пробиться сквозь магнитный шторм, окутавший планету. Лишь воистину могучие священные технологии смогут узнать, что скрывается в эпицентре бури.
- guid: 30fecfd5-f107-41bf-a4b1-1469a1c85180
  text: Века назад Себериан фон Валанциус отправился к руинам, сокрытым в корневой системе мира. Возможно, его тело до сих пор лежит там, моля об упокоении в династическом кенотафе. Как только Лорд-капитан вернется на флагман, {mf|ему|ей} следует просканировать предполагаемое место гибели Себериана с помощью авгуров.
- guid: 3125ba57-afed-4449-b9af-a05799514ea0
  text: Предостережение
- guid: 315d20c0-b715-4485-9f83-7df7715b49a3
  text: Подарок для Джай Хейдари
- guid: 3192743c-00be-45ac-8402-978463dd0e2d
  text: Звезды укажут путь
- guid: 345fb870-ad49-44bc-8889-c48521cf630a
  text: В тайниках своей предшественницы Вольный Торговец обнаружил{mf||а} дополнительные данные, которые были загружены в бортовой когитатор для дальнейшего анализа.
- guid: 353e490d-4894-4eb0-8278-6bfa2c14cab0
  text: Чтобы спасти плененного еретиками техножреца, необходимо ликвидировать охраняющую его банду культистов.
- guid: 358b51ed-5ba8-4b81-90c1-2fe9a364fa4c
  text: Шепот переговоров
- guid: 363d4538-c9df-4d9d-9a8b-9494fbdadd64
  text: Маражай жаждет встречи с кабалитами Опустошительной бури, которые, вероятно, будут изгнаны из Комморры. Бывший дракон настаивает на том, чтобы лично иметь дело с теми, кем раньше повелевал.
- guid: 37014716-2566-438e-a3d5-1a3d431de0ea
  text: Исследовать останки "Перста скорби"
- guid: 3859ae99-0f89-47c0-9a2e-fa39f940be52
  text: Себериан слишком полагается на ксеносский клинок. Это мешает ему довериться союзникам.
- guid: 38b2a01d-de26-4fc0-b913-37ddd9f91875
  text: Око магнитного шторма
- guid: 39c17b4e-0698-4871-a9ee-9c2685a9ec86
  text: Найти тайник на Даргонусе
- guid: 39fd3f37-4050-4a40-ad05-5c2c0da5a737
  text: Отыскать стаю Ульфара
- guid: 3a71fd42-dba0-43bb-a0bc-edd3961f37f8
  text: Весть о необычайной благосклонности Лорд-капитана к диковинным грызунам быстро разлетается по палубам корабля.
- guid: 3add70c4-8942-4098-ae9d-daf8b8e4becb
  text: Смерть и десятина
- guid: 3bdfca02-3ff3-4e50-a287-6fb5c2ff6d91
  text: Мастер дисциплины направила блюстителей собирать информацию о следующем шаге Немезита. Когда отчет будет готов, Лорд-капитан и офицеры смогут составить план действий.
- guid: 3bfb1c40-cd7e-4390-878d-4453cac061fa
  text: Яростный Космический волк Ульфар уничтожил любую возможность мирных переговоров с собравшимися друкари. Остается лишь один путь — путь войны.
- guid: 3c53534b-f824-4a16-a282-4cfa34a0bce7
  text: Багряная пляска Кхейна слишком пугает свиту, чтобы та решилась пойти против Себериана.
- guid: 3c9305b5-9d6a-48d9-87df-ee30427c36fd
  text: Посещение медицинских специалистов показало, что Вольный Торговец здоров.
- guid: 3ca6a491-a28d-47cd-835b-3f231641e2ba
  text: Уничтожить Нихель
- guid: 3cca8e08-ace8-4b8f-96b1-9db54e4e702e
  text: Возглавить следствие
- guid: 3dc6d426-1ce4-4b74-a3f6-b2d014e9e45e
  text: Камилла Драйвстем на стороне Ювенны — ее поддержку следует сохранить.
- guid: 3dd9107f-6890-4346-b399-e094ea558730
  text: Кровавая охота
- guid: 3e573c8e-c222-42e2-9392-ad3e13dfd657
  text: '"Неуловимое презрение", злосчастный пиратский корабль, замечен вновь! Пираты остановились на ремонт в системе Молчание Мер-Сегрит — настал момент избавить Простор от преступников, предавших заветы Императора!'
- guid: 3e9d459b-83e2-4768-9b8d-3f0d7814d54a
  text: Погонщик Кошмаров
- guid: 3eff3bf3-6011-431a-919a-043fb9398c79
  text: Вольному Торговцу не удалось обнаружить следов присутствия имперской цивилизации на замерзшей планете несмотря на документы, подтверждающие сей факт. Возможно, дело в недостаточно мощных авгурах корабля.
- guid: 3f1c69fa-3ad9-4195-a642-17e59dc6d075
  text: Старейшины Детей Искупления с Гордости Сантиэля молят о помощи — некое безжалостное чудовише охотится на выживших в недрах улья, не позволяя покинуть убежища.
- guid: 3f7c4d0c-c0d8-4e07-bd4f-373d1a8f9a3d
  text: Вольный Торговец настиг Тразина Неисчислимого. Пришло время вернуть украденное горделивым ксеносом.
- guid: 3f8dc703-8146-4a74-aacc-33d4e0d61c99
  text: Видения во тьме
- guid: 3fa48eb2-a4a1-495e-ba3d-94c3be53365e
  text: Магос Экзальт-177 не поддерживает план Ювенны. Необходимо либо переубедить его, либо устранить иным способом.
- guid: 3fcf580c-f03e-4b3e-b040-3af723d67e04
  text: Эксцентричный любитель животных
- guid: 40856786-a6e2-41be-adc5-f14848ba50ab
  text: Расправиться со врагами в буровой шахте
- guid: 4108c647-827a-4110-b405-d02284b496ca
  text: Отправиться на Ефрат-II с Ульфаром
- guid: 4168dd01-4c5a-42ef-b68e-f37216cb82f6
  text: Встретиться на Даргонусе с семьей Эрэбис
- guid: 41c46d94-15c0-4b96-9957-29ba756524cb
  text: Неисправность в интерпретаторе компилятора устранена.
- guid: 41e24783-7dee-40f1-9cad-057104dd9e44
  text: Пропажа
- guid: 4225eec8-b937-4e49-b4fb-52ad9cd077ff
  text: Пылающие миры
- guid: 422a8203-b8cd-44e5-ad7f-05dc0dcf3dd6
  text: Первый лицемер найден.
- guid: 4265e3f3-2195-4303-b0a5-fb62c7eb5a9d
  text: Найденный схрон принадлежал неизвестной фракции пиратов, которые в отместку объявили охоту на Вольного Торговца.
- guid: 4353cf9e-8096-4b69-9245-0027bb42ffcd
  text: Янрис Данрок занялся организацией раута. Он сообщит как только все будет готово.
- guid: 43576383-88c8-4200-a572-72cfc6772c9d
  text: Чаша весов, благодаря Вольному Торговцу, склонилась на сторону Ювенны фон Валанциус.
- guid: 439c33b6-4711-4e63-829b-e5e4f598d7cf
  text: Шепот из глубин
- guid: 43edb3f1-6fab-4a30-8e5e-c55ed39c3b03
  text: Пленником ксеносов оказался и Ангел Императора. Он не в силах отвратить свою судьбу, но жаждет продолжить служение. Ныне его жизнь находится в руках Лорда-капитана.
- guid: 4451fc4d-d47b-4f3e-9d9d-93195154ac2d
  text: Ульфар доказал, что, пока он жив, жива и стая Зловещий вой. Торбальд Железношкурый передал ему координаты места, в которое направились его братья. Но путь этот ведет в области страшные, неразведанные и исполненные зла.
- guid: 44cd6bb4-34f0-458c-ab0e-c9057c1caefb
  text: Высокий фактотум вычислил, как генокрады попали в Простор. Если его теория верна, то Вольный Торговец обнаружит подтверждение этому в дрейфующих останках торгового корабля "Перст скорби".
- guid: 451e73f9-a965-4ace-bd00-f98bec61d01c
  text: Лария пытается убедить Себериана действовать осмотрительно и положиться на соратников. Быть может, если склонить участников совета на ее сторону, удастся разорвать временную петлю.
- guid: 4642de71-4f61-4eaf-9a2d-2d35f62d5d14
  text: Поговорить с хормейстером
- guid: 46cbbeb1-787e-4c0e-a355-f9f9a4a84a53
  text: Заманить Инцендию в "Адептус Амасекус"
- guid: 46eb7292-e7c7-47bd-b2f3-c1176472aac6
  text: Обыскать лабораторию
- guid: 472baefe-0e30-481b-a91f-4f0f108faf54
  text: Утерянный в пустоте
- guid: 481bc577-4f9b-441c-ab85-4cd0917ae3bf
  text: Убить лидера выродков
- guid: 486c9ec7-6cef-4450-8228-8a23ef187793
  text: Дать поручение Высокому фактотуму
- guid: 48a33a25-9d85-4179-9a47-bbc9abd815d1
  text: Последние события принесли Вольному Торговцу немало жесточайших испытаний. Предстоит выяснить, не сказались ли они на здоровье представителя древней династии.
- guid: 495cb642-2e58-488e-bd86-d2219a218729
  text: Вольному Торговцу необходимо присутствовать при допросе заговорщика. Допрос будет происходить на месте поимки, в палатах плазмадвигателя.
- guid: 497e6bde-fb29-41b8-9978-0ea7d91dd8f5
  text: Соперники Вольного Торговца пали, и теперь он{mf||а} может потребовать от гемункула обещанного содействия побегу.
- guid: 498babaa-7ebd-4fe4-917d-64d3dfaab12a
  text: Космодесантники действительно прибыли в Простор Коронус после сообщений о нападениях ксеносов. Два отряда Космических волков были отправлены под управление Лорд-инквизитора Ксавьера Калькасара самими предводителями славного Ордена Астартес.
- guid: 49aa9a1b-c8f6-406b-8e9d-904c8ea0c3d6
  text: Вольному Торговцу и Арбитесу предстоит вынести окончательный приговор планете и ее обитателям.
- guid: 4a16492d-f2ff-4363-9e3b-9cb5dd7bbe7c
  text: Дабы помочь Кибелле одолеть сомнения, Лорд-капитану необходимо проникнуть в ее потревоженный разум. Только могущественный проводник, псайкер из астропатического хора, способен погрузить их в телепатический транс.
- guid: 4a214068-8c25-4b83-b0d2-28f3c8c832f3
  text: Placeholder
- guid: 4a55290a-40da-4e2a-b050-5208bfe4fc18
  text: Если на военном совете последние сомнения Себериана и свиты связаны с мечом, можно предъявить, что клинок — подделка.
- guid: 4a648970-87a0-4075-b154-03bf59978289
  text: Торговый Патент возвращен в охраняемые палаты и вновь освящен кровью {name} фон Валанциус, законн{mf|ого|ой} нынешне{mf|го|й} держател{mf|я|ьницы}.
- guid: 4ad84ecd-02dd-493d-94f4-9d48d4790111
  text: Несколько почитателей святого Друза были застигнуты Вольным Торговцем на необитаемой планете. Они оберегали тайный подземный комплекс и пытались убить всякого, кто проник в их убежище. В недрах комплекса были обнаружены криосклепы, внутри которых были заключены мертвецы.
- guid: 4b7c507d-7a8b-4d81-9952-194e8ad0ed88
  text: Обыскать палаты плазмадвигателя
- guid: 4bdb2289-a874-45cb-a6fd-5657358f3b36
  text: Кораблю требуется новый Навигатор, искать которого нужно на станции Навис Нобилите.
- guid: 4bf1900c-4ca5-43aa-ba95-832c8a1e2d99
  text: В системе Проклятые Берега сгинуло несколько кораблей. Астропаты со всего Простора передают друг другу тревожные предупреждения о неизвестной угрозе в этом регионе.
- guid: 4c2fe40e-8bd1-4ea5-a5f2-7d6782adc940
  text: Видения хормейстера указали, что скверна скрывается в палатах плазмадвигателя.
- guid: 4c35ee51-7cae-4452-8f30-897591c5dfc2
  text: Лорд-капитан сокрушил{mf||а} железных мертвецов. Здесь, среди обломков, когда-то сгинул Себериан — существует ли награда достойнее утраченного клинка-реликвии?
- guid: 4c4e3344-1d31-44b7-8206-f7aaa66a6b61
  text: Губернатор Райкада Минорис руководит освобождением планеты из укрепленного бункера. Единственный путь туда пролегает через Верхний проспект, захваченный бунтовщиками.
- guid: 4cda980d-8beb-40ec-a439-b81628273bf5
  text: Корабль "Семь Кровавых Стигматов" пропал во время варп-прыжка, однако есть те, кто сумел расшифровать блуждающие астропатические сообщения и узнать, что легендарное судно может находиться в системе Рикатус.
- guid: 4ce74d56-01c5-481f-a2f7-4fa4d8debb14
  text: Инфопластина, которую охранял Глейто, принадлежит Соломону. И сведения, содержащиеся в ней, заслуживают приватной беседы с арбитром.
- guid: 4d98fb6c-375e-4ce7-87cd-3a610926c336
  text: Встретиться с Арбитес на Даргонусе
- guid: 4eb5a7fc-32aa-43a6-a437-8d9f76442c60
  text: Новый раут с Кибеллой
- guid: 4eec49d7-3ef5-4dba-ad3a-e9f6fa59657d
  text: Говорят, Вольный Торговец {name} фон Валанциус никогда не упустит выгоду, даже если для этого приходится сдирать дань с жалких мусорщиков.
- guid: 4f422b4f-fd5b-4dc6-85a9-0fde0acc81cd
  text: Отряду Соломона необходимо прорваться к турелям и уничтожить их.
- guid: 4f900618-94ff-4b59-9556-8c247b900d9d
  text: Зловещий вой
- guid: 505704dc-59bf-45d0-a78b-0e0ff9a2e5a7
  text: Ликвидировать Немезита в ловушке, устроенной на офицерской палубе
- guid: 505c0bee-37b0-43af-b1ec-8e984f557554
  text: '"Навиика"'
- guid: 50aab16c-8a75-44d6-9b89-e4e9460b4674
  text: Сообщение о гибели Зари и успешной зачистке монастыря Адептус Механикус ознаменует конец масштабных волнений на Райкаде Минорис.
- guid: 50b3fd35-966f-409f-b8e4-25f33edd3b63
  text: Изимонд Зауэрбэк предан Ювенне — его поддержку следует сохранить.
- guid: 50f989e4-258d-4323-929d-743531e80516
  text: Посетить Дворец Правосудия
- guid: 51486d46-863f-454e-9123-b89ac848818f
  text: Генетор экстремис Эоганн Фебрус пригласил Вольного Торговца в Сектор Бионика для участия в эксперименте. Его цель — обуздать смерть и вычислить формулу праведности.
- guid: 5200d835-2829-4683-bd26-83ceb873c250
  text: Отыскать путь в Музеон
- guid: 52bf9338-21cf-456f-8641-91b2861d7e86
  text: Путь отвращения
- guid: 5385292c-1250-40dd-b604-4e9597e9a0ec
  text: Кормчий Равор хочет обсудить с Вольным Торговцем нападение на своих матросов. Он будет ждать Лорда-капитана на мостике.
- guid: 542d7598-7ed8-417b-b701-d9ceceb02aab
  text: Посетить станцию Алтарь-Темплум-Каликсис-Экс-17
- guid: 547e49cf-f8c9-4329-a32a-63a6c1b95786
  text: Медицинское освидетельствование
- guid: 54a56fb8-9e09-4158-8a7d-f96b6047e98f
  text: Поговорить с Кровавыми прозелитами
- guid: 54b46151-38d7-4115-99b7-58cae5b34b2e
  text: Основать новую колонию
- guid: 54f01a4e-5ad8-4f36-8267-778e05e7de9d
  text: Герольд Короля
- guid: 55a3649e-0cd1-429e-8327-db2c296062c3
  text: Спасение обреченных
- guid: 55a5c74a-54ea-4de6-b439-d19848f5fbc5
  text: Лорд-инквизитор Калькасар объявил себя комендантом Простора Коронус и разместил свою ставку на Футфоле, как в наиболее логистически удобной точке. Лорд-капитану необходимо обсудить с ним происходящее в Просторе и дальнейший план действий.
- guid: 55fcce6f-99e9-48d7-9cb1-0933429639b0
  text: Путешествие корабля Касбаллики
- guid: 56083541-369a-45ad-9b3f-ebf84c71137d
  text: Лорд-капитану удалось прорваться через хаос уличных боев и встретиться с губернатором мира Райкад Минорис.
- guid: 563d2097-9922-4614-9406-a6efe50cbc1f
  text: Весть из системы Провидение Орселлио — на одной из планет было замечено множество ксеносских судов. Причина их пребывания на этом мире неясна.
- guid: 577dddff-ae37-41fe-bc9c-2bc82df242e7
  text: Мастер вокса сообщила, что в астероидном поясе в системе Могила Сотто обнаружили аномально крупный астероид размером с небольшую планету. Вероятно, в нем могут обнаружиться крупные месторождения ценных ресурсов.
- guid: 584d595a-f030-49e3-8312-11ba1b9486c0
  text: Лорд-капитану удалось избежать гибели и найти безопасное укрытие... в той или иной мере. Теперь е{mf|му|й} предстоит обдумать свои следующие шаги.
- guid: 58fb68f9-26e0-40b7-a291-32f3b6e53350
  text: Вина предателя определена — пришло время воздать Корабельному исповеднику за измену.
- guid: 59452582-a46e-4754-be84-a61d6a8434ab
  text: Делегация Навис Нобилите ожидает встречи с Вольным Торговцем и Леди-Навигатором Кассией на мире-столице. О проведении встречи необходимо уведомить канцлера — Клеменцию Версериан.
- guid: 59c44831-f5c3-44a1-9b4a-180eac8fa68d
  text: Последний удар
- guid: 59e91e3b-2bc9-4f30-b7f4-9c934005a017
  text: Реколлигеры нуждаются в одежде и обуви
- guid: 5a88b3ce-f18a-4548-b8ca-8f2af7afc569
  text: Шепот переговоров
- guid: 5aae092f-af44-423a-99dc-f19e9408b26f
  text: Ксавьер Калькасар достаточно доверяет Лорд-капитану, чтобы разделить с {mf|ним|ней} бремя заботы о Просторе Коронус. В результате важного совещания он поручил попечению династии фон Валанциус судьбу атакованного мира Ефрат-II.
- guid: 5b0e7c7f-fdb1-4f69-a4e2-71b2e04d72a0
  text: Генетор Ферренц может знать, что нужно для установки уникальных имплантов. Его можно найти в Секторе Бионика.
- guid: 5b783a13-df7b-4399-b82b-228fd20ee619
  text: Ярубу нужны подходящие условия. Вольный Торговец может либо отвлечь стражу, либо воспользоваться смятением, вызванным бомбардировкой.
- guid: 5bb06b7d-51bc-4692-863e-97a03b884310
  text: Проводник
- guid: 5cafe45f-668e-43a6-b8f4-10222c653082
  text: Дух машины
- guid: 5d587e8f-ee08-4d2c-93d0-026cc5059345
  text: Последовать за Калькасаром в пространственные врата
- guid: 5d9d6547-6275-4a29-bd97-5791c654d1a6
  text: Инквизиции нужна помощь Вольного Торговца, дабы склонить Себериана к переговорам.
- guid: 5de9e3d7-4916-4e1a-8293-33a28bc74079
  text: Нападение в системе Молчание Мер-Сегрит
- guid: 5e769f3f-cae8-42a4-bb21-9a5034222c2c
  text: Продажа чужой души
- guid: 5ede4f93-9663-4157-be8a-9bb974a88a01
  text: Гемункул Тервантьяс желает создать новое чудовище. Для этого ему нужны особые органы и части тел, достойные того, чтобы их носил его нечестивый титан.
- guid: 5eeb5140-5e23-4442-815f-4d0435473da5
  text: Последняя воля
- guid: 601719c6-dbb3-4a19-89df-3668a19dd5be
  text: Планета Райкад Минорис гибнет под напором сил Архиврага. Несмотря на все усилия Лорд-капитана, предсказание еретиков о Последнем восходе все же сбылось. Тем, кто не желает быть пожранными губительными силами Архиврага, остается лишь бежать с планеты.
- guid: 6096eae0-b270-4af8-acc9-6eac29f68e2d
  text: Адептус Администратум заметили странности в последних поставках десятины, поступающей с феодального мира Тассера. Вольный Торговец и Арбитес должны провести инспекцию планеты.
- guid: 61136b5e-00b0-458b-a2cf-87afbe4ccbe8
  text: Те, кого мы оставили
- guid: 61813377-a3a6-46db-b664-f54dc76c87da
  text: 'Лорд-капитан услышал{mf||а} три необычные исповеди, заинтересовавшие е{mf|го|е}. В первых двух удалось разобрать голоса мужчин: один горевал о погибших в варпе, а второй был обеспокоен положением сирот на корабле. Третья исповедь принадлежит женщине и посвящена неким "вислоухим клеппам".'
- guid: 61993204-bd49-479d-9922-a965f983fbc7
  text: Защитить баржи
- guid: 63531541-de6b-4327-bdd5-7c9f7c506b11
  text: '{name} фон Валанциус вступил{mf||а} в права'
- guid: 63938aa9-7a6d-45ce-a739-f4af0b96dff3
  text: Бесчинства ксеносов
- guid: 648dcfa9-22b4-4768-96dc-cf04da4aee99
  text: Вольный Торговец решил{mf||а} лично ознакомиться с жизнью своих подданных на грузовой магистрали. Для этого придется посетить даже самые мрачные уголки отсека.
- guid: 65244b80-52b9-432b-af2d-b8e2b3d7edd3
  text: Багряная пляска Кхейна слишком пугает свиту, чтобы та решилась пойти против Себериана.
- guid: 65409316-2ce8-4826-bcca-772e1544bb82
  text: Соломон Антар просит Лорд-капитана принять его рапорт.
- guid: 658edaab-d3ff-443b-bdbf-dede5e1b797e
  text: Высокий фактотум сообщил, что Соломон провалил миссию Адептус Арбитес и был разжалован. Чтобы вернуть его в свиту, Вольному Торговцу нужно отправиться на Веабос-6.
- guid: 65b489d6-d69f-4cda-828a-cf84a5110faa
  text: Неутолимая жажда
- guid: 65de05f5-fca1-4ab8-8834-690e6d3ccc04
  text: В указанном месте, как и прежде, был обнаружен маяк ксеносов. С какой целью и для кого гемункул разместил их на разных планетах?
- guid: 660b890a-9496-4caa-a8a9-d9baa1cb2fb3
  text: Аванпост получил необходимые ресурсы.
- guid: 6644dd9a-955b-4671-8b72-ac993fd5cb21
  text: По указанным координатам среди богомерзкого цирка гемункульских уродцев находится друкарский маяк. Установив контакт с призмой, маяк передал ей координаты некой планеты.
- guid: 6676f04f-7b1d-4115-9852-15bb7652e744
  text: Добраться до командного пункта
- guid: 681c8da7-7b50-4f27-aa63-196c9ebae8d5
  text: Победить Немезита и его последователей
- guid: 684a5ef8-1328-4065-8c31-34ec8908e19c
  text: Капитан "Бессердечного" зажат в угол. Пора заставить его ответить за свои преступления.
- guid: 687e8368-82db-4a7d-84af-54a65095e766
  text: Реколлигеры нуждаются в лекарствах
- guid: 68db283d-e0c6-4d43-babb-3f869322c831
  text: Префект будет ожидать Вольного Торговца в Администратуме на Даргонусе.
- guid: 68f5c911-748e-4d9e-a86f-58099c0f322a
  text: Отправиться в систему Фурибундус
- guid: 695427d3-17a3-4ab3-b629-5ac71a561810
  text: 'Печальная судьба постигла одну из величайших династий Простора: Вольный Торговец Каллигос Винтерскейл и его приближенные сгинули в охотничьих угодьях мира Кетца Темер.'
- guid: 6a3674d3-af9e-499e-9660-f6f68705cb1f
  text: Мейв осталась в живых. Возможно, она сможет пролить свет на творящееся здесь безумие.
- guid: 6a4d1d43-a84f-474f-89b4-52dcb08a658f
  text: Передать информацию о планетах Оптикону-22
- guid: 6a581802-7c1d-4182-b6a8-163f188d6ac2
  text: Авгуры Лорд-капитана прозрели завесу магнитных излучений и обнаружили на поверхности планеты странный рукотворный комплекс.
- guid: 6aa6ff22-affb-46b9-b830-2f5bc383f2fd
  text: Отыскать затерянные руины с орбиты Заркова
- guid: 6aafe6c9-5898-40ec-8b21-ae412f5e6702
  text: Адептус Арбитес просят об аудиенции на Даргонусе. Вольному Торговцу надо отдать приказ уполномоченному лицу во дворце, чтобы начать прием делегации.
- guid: 6ae23337-d57b-4d85-834c-01397328d3a2
  text: Потери, понесенные командой корабля во время налета культистов, можно восполнить на планете Райкад Минорис.
- guid: 6b324862-612b-40d7-96f6-8cf547b1cbd1
  text: Прикончить ведьму Кикеросс
- guid: 6ba3ed65-9b5c-401f-9bd0-c7caf2d74b28
  text: Судьба десятины решена, но кто-то решил вмешаться в ее транспортировку. Необходимо доложить об этом маршалу Страксу
- guid: 6ba72030-2737-4096-b60f-115d66a1e87a
  text: Праздник Джай Хейдари
- guid: 6bf4d3ed-ce08-4744-9d78-41bdd2ce9d66
  text: Ксавьер Калькасар спустился на планету Эпитафия. Вольному Торговцу предстоит последовать за ним.
- guid: 6c302e0d-facc-4fcd-94a4-065dbc023a82
  text: Голос Ювенны как наследницы имеет особый вес. Необходимо найти способ вывести ее из игры.
- guid: 6c7260ce-979a-431a-97f6-80e28ae8912c
  text: Посетить запретные места отсека
- guid: 6e21eb40-ab9a-4129-8522-c213f3d4796a
  text: Встретившись с губернатором, Лорд-капитан сможет нанять новых членов экипажа для корабля, восполнить ресурсы, а также узнать больше о том, что случилось на Райкаде Минорис.
- guid: 6e5a9ea4-94e6-430a-bd6e-043bd920be2d
  text: Уничтожить меч
- guid: 6ee7332e-4b9a-44fe-8ac1-8d8bddb142c9
  text: Чаша весов, благодаря Вольному Торговцу, склонилась на сторону Ларии Войгтвир.
- guid: 6ef85254-6e06-44da-9fdc-d292d09683c9
  text: Пока не грянул бой
- guid: 6f14152e-3a15-4dbe-b790-49741734f943
  text: Губернатор обратился за помощью к Губительным силам. Нужно одолеть его и его приспешников.
- guid: 6f5d84fd-0383-4e16-8174-28bc21b71f2d
  text: Стая Зловещий вой погибла скверно, и их яростные души желают отмщения. Вольный Торговец долж{mf|ен|на} даровать покой суровым Волкам.
- guid: 7049b6b7-270b-42b1-8ae3-e92bc89408eb
  text: Обследовать склеп
- guid: 70904c3e-cd96-42ab-89e5-70581ef9731e
  text: Вопросы и ответы
- guid: 70de0813-7767-4ef4-9230-900fe434feef
  text: Дознаватель наверняка посещал Райкад Минорис — возможно, губернатор планеты в курсе его местоположения или дальнейших планов.
- guid: 70f2b5ab-3f99-453d-a8b2-44de1dc391d7
  text: Аудиенция Адептус
- guid: 71fdc975-7941-40d2-bc12-a3ed7bbc7c94
  text: Между жизнью и смертью
- guid: 7214d734-8152-405e-80bb-b6217f764f2b
  text: Чудо Императора в Цинерус Малефикум
- guid: 7254322f-0c19-46ab-b914-398f7525d77f
  text: Обследовать дворец Наместника
- guid: 72a4fa46-68f2-4cc7-981c-9c5fcf8904a4
  text: Грехи Вигдис
- guid: 72b8303c-02ff-4017-bae9-adbf2fdb9702
  text: Вольный Торговец поручил{mf||а} блюстителям поиски преступника. Необходимо дождаться доклада Мастера дисциплины.
- guid: 72e17b99-6831-410c-ba99-facfa2e9574e
  text: Чужая среди своих
- guid: 72e78ff6-bc14-461f-a60d-5747c345c506
  text: Странствующий торговец, представившийся Паломником, жаждет информации о мирах, богатых энергетическими кристаллами. Мужчина сообщил, в какой области его можно найти в ближайшее время.
- guid: 73f18b96-132c-4b81-88a5-caab075797d6
  text: Райкад Минорис встретил Лорд-капитана не фанфарами и пышным парадом, а выстрелами и грохотом битвы. Впрочем, это не меняет цели, с которой Вольный Торговец прибыл{mf||а} на планету — е{mf|му|й} по-прежнему необходимо отыскать губернатора этого мира и затребовать у него необходимые кораблю ресурсы.
- guid: 74031d02-6910-4e70-a07a-0b8af59f6472
  text: Кибелла пригласила Вольного Торговца на встречу в корабельном склепе.
- guid: 740a96a4-8554-4e79-8ba9-490539396acd
  text: Лекарство от сыпи
- guid: 752d8c5e-cbcb-42c8-b5df-b62e1041d9e9
  text: Нихель, техносестра Паскаля Ханейманна и его соратница в рядах Коллектива Амарнат, заманила Вольного Торговца и е{mf|го|е} спутника в ловушку. Необходимо уничтожить ее и ее свиту.
- guid: 759667be-9003-47d9-bd43-6060609ac4d3
  text: Новая кровь
- guid: 75b2dc98-8bce-44e5-8ec3-1cb4520d5aa3
  text: Неизвестные корабли пытаются перехватить баржи с десятиной. Нужно их остановить.
- guid: 75ead9e6-85c3-439c-b28e-0c2354194296
  text: Вопрос Нунциуса
- guid: 75eca516-f0ec-462d-9bbc-73e3cdbc84cc
  text: В районе системы Безымянной Звезды ютится обреченный мир Каллигоса Винтерскейла, погруженный в агонию вековой войны.
- guid: 761c6f38-b526-4f3a-8789-18f8fb91bbb7
  text: Направиться в монастырь
- guid: 7754fb5b-027d-4ec2-9fa2-ca6fcfe10026
  text: Саботаж на производстве
- guid: 779f960d-1d60-4c4b-9606-9bf3c1a71c18
  text: Паскалю Ханейманну не удалось встретиться со своим наставником. Однако в своем искании он наткнулся на брата по вере, носящего загадочное имя и имеющего загадочную связь с архимагосом Амарнатом.
- guid: 77d81fe3-0f4f-41c9-852b-238835edaf4f
  text: Вернуться на аванпост
- guid: 7875fc02-7429-47fc-afc5-c1215e90c681
  text: Лария фанатично предана отцу. Чтобы она решилась поддержать переговоры с Инквизицией, нужно предъявить нечто по-настоящему весомое.
- guid: 78e4e9fc-63d8-4f55-9965-e9e932b47c12
  text: Эвакуация Лорд-капитана и е{mf|го|е} свиты с Райкада Минорис осуществлена успешно.
- guid: 790a1f24-2ee8-4927-b2f9-08e1d22e9eec
  text: Могучий хелбрут, показавший свою нечестивую мощь при планетарном штурме, укрывается в Машинном храме Ефрата-II. Молодой Хальбрандт из стаи Грозовых укусов желает покарать его, но Ульфар намерен опередить дерзкого собрата и сам снискать славу победителя могучего еретика.
- guid: 79b60c0c-7c31-4ad9-883f-2b522d334825
  text: Арестовать Владайма
- guid: 79b7f4db-2d9d-4d4a-b2d8-6a0283e7aafc
  text: Камилла Драйвстем препятствует плану сенешаля. Нужно либо убедить ее перейти на другую сторону, либо устранить иным способом.
- guid: 79c5739e-91b2-4fbc-810b-786a77133330
  text: Камилла отреагировала на предположение о ее губернаторстве подозрительно бурно. Не стремится ли она занять этот пост? И каким образом?
- guid: 7ce96106-7a46-4837-a214-7430a30fe8e7
  text: Специалист, необходимый для проведения ритуала, скоро прибудет на корабль. Пока Вольный Торговец может посвятить себя другим делам.
- guid: 7cf95b3a-d69a-44b0-bc2d-34ca336363c2
  text: Лария фанатично предана отцу. Чтобы она решилась поддержать переговоры с Инквизицией, нужно предъявить нечто по-настоящему весомое.
- guid: 7d22f6e7-01a2-4375-9917-60ef8596ab7c
  text: Placeholder
- guid: 7d63ec69-24b2-4b69-a5c0-c03470bea332
  text: Наведаться в жилые ячейки
- guid: 7d710a3d-f2d9-45a9-802c-6847cec0c388
  text: Соломон выявил сговор в составе старших офицеров флагмана и просит аудиенции с Вольным Торговцем.
- guid: 7dc17945-8333-4a47-bda0-2a25ed9836ab
  text: Дождаться отчета блюстителей
- guid: 7e01020f-b32d-4b2c-a251-df5877993c67
  text: Сообщить о результатах "переговоров" префекту
- guid: 7eef4b4e-c0f9-4c41-a96c-444be45025a6
  text: Механический ковчег "Герметико", считавшийся потерянным много десятилетий назад, вновь объявился в освоенных системах Простора. Необходимо отыскать его в Зеркальной системе и высадить на борт десантную группу.
- guid: 7fedd04a-ab50-4469-ba40-264d476e0e52
  text: По словам паломников на Футфоле, некий мир у холодной звезды в Цинерус Малефикум достиг таких духовных высот, что Император вознес все население в свои чертоги.
- guid: 7ff6f445-ba3a-4bcf-9955-9a18c48d083b
  text: Техножрец, спасенный Лорд-капитаном, может обладать информацией, полезной в деле обеспечения безопасности археотех-реактора.
- guid: 8258e4ef-7aaf-4d0f-8bd1-89b677b7a0f0
  text: Найден тайный вокс-передатчик. Искусное исполнение выдает высокий статус его владельца.
- guid: 8280c9af-6091-47bc-a2a9-89ed08843b80
  text: Передышка в преисподней
- guid: 828452a5-c659-4459-abcf-a05c602fae69
  text: Найти Адептус Арбитес
- guid: 82d8d3e8-395a-4f40-a6d1-6716e7d10898
  text: Лорд-капитан настиг{mf||ла} легендарных пиратов и воздал{mf||а} им по заслугам за все совершенные преступления.
- guid: 82f2b5f3-b48f-404e-a14d-24d293137a83
  text: Встретиться с Лорд-инквизитором
- guid: 82f8282e-f9cb-4265-a73b-66d77712e571
  text: Прежде чем отправляться в палаты плазмадвигателя, Кибелла просит Лорд-капитана провести ритуал кровавого благословения ее на охоту за Немезитом.
- guid: 83814bbc-2632-49f2-878a-7f7be23c8ecf
  text: Разгромить эскадру, прикрывающую Машинный храм
- guid: 83cdc37f-b3d4-41fe-93f2-3ec22cf6b643
  text: Нерадивый офицер отправил в мусоросброс ценный груз с корабля. Это могло произойти где-то в системах Перекресток Сотни Снов и Пояс Лангренна.
- guid: 842e92a8-29f7-45ad-bc0d-41541d5ba1e6
  text: Себериан фон Валанциус, узнав о требовании Тразина, согласился на предложенную ксеносом сделку. Его верность принадлежит династии, а без Патента ее попросту не существует.
- guid: 844c8264-7f74-42b5-bb50-1d1c040f481a
  text: Высадиться на борт "Бессердечного"
- guid: 84feb698-f181-434f-9418-1a20d9e3ed5c
  text: Дурное предчувствие
- guid: 859c23aa-f25b-4fd7-9b1d-a687ebd6ae5f
  text: Сохранить жизнь сержанту-инструктору Данкошу.
- guid: 863ef466-59cf-458a-b25e-c20db3452498
  text: Поговорить с Торбальдом
- guid: 86ada8ce-f22b-42c6-8519-e5075b5379fe
  text: Вольный Торговец решил{mf||а} возглавить поиск виновника, явиться на офицерской палубе и принять доклад блюстителей.
- guid: 86ea4c3b-8adc-4042-ada2-049a7ab2e5ca
  text: Хтонос
- guid: 8792e871-265b-43ad-b006-3ff96776a879
  text: Пока корабли еретиков прикрывают с орбиты ставку мятежников, наземные силы не смогут начать наступление. Вольному Торговцу предстоит дать им бой.
- guid: 87bbd7f3-8a48-4459-ab74-d2de33175e3a
  text: По крупицам
- guid: 885e623b-fbd8-4c35-844f-85522e49d152
  text: Победить Калькасара
- guid: 88d51534-1c67-49de-bc5c-4418fbe6b048
  text: Корабль, что некогда считался одним из лучших исследовательских судов протектората фон Валанциус, был искажен силами Архиврага.
- guid: 890e48ed-00f2-4eb5-a34c-ba10840687b6
  text: Сохранить жизнь сержанту-инструктору Йовахе. Вновь.
- guid: 89a641ba-4695-4b44-bc38-7f1cb0404480
  text: Трое друзей долгие циклы выживали на погибшем мире, пока подлые ксеносы не загнали несчастных в ловушку. Станет ли Вольный Торговец новым светом для обреченных?
- guid: 8ab2eb61-8f12-42d3-9f8c-f86be07d988b
  text: Конец неуловимой легенды
- guid: 8aedc83e-feb3-4e04-b253-1f86e5b053e7
  text: Вернуться на Даргонус
- guid: 8bcd3e4f-6db2-41a5-bde4-349be8365c4d
  text: Кто это здесь оставил?
- guid: 8bd470a2-ab23-4d9d-a201-97dc64e2feca
  text: Стало известно, что Себериан отправился на поиски неких артефактов, способных "спасти династию". Вместе со своим реликварным клинком он сгинул где-то в кластере систем, состоящем из Врата Смелых, Игнис Корона и Слеза Солара.
- guid: 8be16db6-2851-40a0-8741-54bf76692ebe
  text: Поговорить с губернатором
- guid: 8c06366c-82d6-4c45-98fd-76870fa09c71
  text: Путь друкари
- guid: 8c25ab37-330a-4a46-8792-b5c1bcc4bc56
  text: Лария готова арестовать Изимонда на основании собранных улик, однако Вольный Торговец хочет сперва переговорить с блюстителем.
- guid: 8ca466cf-51c4-40af-8eff-a281730f6238
  text: Поговорить со стражем Летуса
- guid: 8de8506b-c54e-4287-bbc8-2e12e17b539e
  text: Неуловимые грабители
- guid: 8e144bae-948a-4d01-9f45-acccbed7c00e
  text: Завоевать доверие Ларии, раскрыв дело о пропаже подкрепления рода Гапрак.
- guid: 8e54289a-bd60-4bcb-9d6c-50a4e8566da6
  text: Похоже, Вольный Торговец {name} фон Валанциус принимает никчемных мусорщиков за равных. Куда катится династия?
- guid: 8fc90096-857c-48e3-8db6-22d0b57f479c
  text: Протекторат силен, пока он растет. Стабильные, сытые владения неизбежно начинают разрушаться. Присоединив к своей собственности новую планету, Лорд-капитан докажет, что династия фон Валанциус не утратила амбиций и сил.
- guid: 8fed26f8-fa84-4dd3-868c-1097f9cd83c4
  text: Кощунственная реплика дворца на Даргонусе — лишь декорация, интерактивная диорама безумного ксеноса. Но именно там должны покоиться останки Себериана и Багряная пляска Кхейна.
- guid: 90fd50af-03da-498e-88f4-236da26aeaf7
  text: Дружественный корабль Касбаллики, занимающийся поиском пылающих миров и скупкой информации о них, сообщил, в какой области его можно будет найти в ближайшее время.
- guid: 9133002a-5e2a-4317-8796-63469be9667b
  text: Убить преподобного Адальберта
- guid: 91705067-8b02-43e7-85f6-60bb59297ed0
  text: Странники, прибывающие на Футфол, передают слухи о благословенных ангелах Императора, прибывших в регион для отражения ксеноугрозы. Священные воины малочисленны и сражаются в самых отдаленных уголках Простора Коронус.
- guid: 9193e971-cade-4e60-91fc-d6419a1e63b5
  text: Сломанная реликвия
- guid: 91b6a472-af60-457b-a8e1-4dbd2046733c
  text: Гнездовье ксеноереси
- guid: 91bcfd7f-e969-4c0c-8b53-26468638d689
  text: Согласно гипотезе Паскаля Ханейманна архимагос Амарнат, скрывающийся под именем "Авеля Ханейманна", находится в Благословенной Электродинамической Обители.
- guid: 91d9de53-ebce-4897-b99b-9aa3c549f897
  text: Губернатор Амберворлда поведал Вольному Торговцу о небесной колеснице некоего Короля Искажений — местного бога, что изменяет тела людей. Похоже, колесницей называют неизвестную аномалию, образовавшуюся в системе.
- guid: 92347ad1-4403-45fe-9be6-3463105de52d
  text: Ритуал связывания
- guid: 924438f3-837e-4fdf-9dab-2f07eb221a79
  text: Хейнрикс упомянул, что ему потребуется время для восстановления в одном из укромных уголков логова Ревущих. Возможно, стоит узнать, как дознаватель перенес пытки.
- guid: 929ee7ef-e4f2-41ae-8cb9-9e91ad7e5e0d
  text: Джай предложила Вольному Торговцу отпраздновать обретение ею Меркатум Табула Официале в кругу ее команды на Футфоле. Вечеринка в кругу хладных торговцев может стать интересным развлечением.
- guid: 92e3b128-4706-4205-97ba-8e60f193f143
  text: Уничтожить уцелевших лидеров восстания
- guid: 937d372b-adfd-43d7-b666-486bc88180d9
  text: Говорят, общение с чернью не проходит даром. Слухи о том, что Вольный Торговец {name} фон Валанциус копошится в космическом мусоре, быстро расходятся по Простору.
- guid: 93a3d59f-b6c4-427d-8a7d-984509e5259e
  text: Реколлигеры нуждаются в провизии
- guid: 93b14bef-f3d0-4c8b-98b3-6ca334317da9
  text: Войти в Главный вычислительный собор
- guid: 94eddbfa-a5ae-4782-a679-f17c2b3ab803
  text: Не только Вольный Торговец желает вернуть украденное имущество протектората — другие пираты жаждут завладеть награбленными богатствами династии фон Валанциус и тоже охотятся за "Неуловимым презрением"!
- guid: 94fe733b-f185-4a35-8872-4b3c87874ca1
  text: Могила Сотто
- guid: 9625c035-d0b4-4002-8ba5-796e40186b24
  text: Когда-то 32-ой меровский штрафной легион служил Себериану. Капитан-интендант просила обновить их клятвы и вновь взять на службу. Однако полковник Батошски не рад этому. Остается надежда на то, что его уважение можно завоевать.
- guid: 9651af17-e81b-45ac-9cb2-b76db5be63c2
  text: Жизнь низших
- guid: 9679af45-4e78-4841-ae51-88123bf0f650
  text: С мастером астропатического хора происходит что-то неладное. Необходимо выяснить в чем дело.
- guid: 969dc6d5-1cca-475d-bb1a-390d8498c449
  text: Смена власти
- guid: 976b3990-a27d-4bf7-9a38-df6384e20ceb
  text: Эоганн хочет подвести итоги эксперимента — он попросил Вольного Торговца отыскать его на мостике.
- guid: 986a1a2d-3f3f-4503-98e4-c019858e0836
  text: Провести церемонию сплетения
- guid: 98e57b79-ef0b-42e4-a566-189941451618
  text: Подозрительные корабли
- guid: 99445e3f-de35-4f6a-a349-664cf8dbb81a
  text: Помочь отбиться губернатору Дунавски.
- guid: 999fe732-c580-4396-ac62-3b5c561605cb
  text: Посетить грузовую магистраль
- guid: 9a0ffdb9-67cc-4324-9763-54e475563477
  text: Свершить суд над Саргоной
- guid: 9a6223b0-c4a1-4ad0-b60d-18b057c1ed56
  text: На Футфоле приветствуют нов{mf|ого|ую} главу династии фон Валанциус. Что случилось с Леди Теодорой? Кто эт{mf|от|а} новоявленн{mf|ый|ая} Вольный Торговец? Вопросы и слухи множатся каждый час.
- guid: 9b06df88-33a1-42bf-8c86-246cfe636dae
  text: Собранные исследовательские данные необходимо доставить представителю Адептус Механикус, обосновавшемуся на станции Футфол.
- guid: 9bfb5b09-1985-4252-aecb-4e1dc719d55a
  text: Лорд-инквизитор и Лорд-капитан
- guid: 9bfbef9c-7d67-4dc5-b54b-ebe87bd8994f
  text: Провести планетарный штурм
- guid: 9c312933-92fa-4641-8d03-2aa4f24a8280
  text: Уничтожить пиратов-ксеносов
- guid: 9cfa1d89-2fb0-4add-a7bf-f94a5d3bd83a
  text: Слух оказался горькой неправдой — население мира у звезды Ледяной Принц не вознеслось, а было истреблено служителями Архиврага.
- guid: 9d0147a3-afc4-494a-91de-134c43296e53
  text: Захватить транспорт
- guid: 9d3291db-c6a4-48db-8b21-76765cde9393
  text: В стане Себериана завелся предатель, чьими руками Инквизиция дотягивается до самого сердца дворца.
- guid: 9d3c7c49-fb6d-4123-90c0-0a9abfc8f18d
  text: Поговорить с членами семейства Эрэбис
- guid: 9d835692-ce6a-4422-bdd4-e583dc643c2e
  text: Краденые звезды
- guid: 9db26250-72d6-4ffd-aff7-6ebf48ffaa63
  text: Изимонда к убийству подтолкнула Камилла. Необходимо выяснить, зачем герцогиня затеяла этот заговор.
- guid: 9ddaa8be-536d-45e3-91ae-2668c8d0ba97
  text: Скальпель, иглы и нити
- guid: 9e4a8c7a-62d6-4340-85ef-4b6cadcb2ab8
  text: Силы рода Гапрак должны были прибыть на помощь Даргонусу, однако подкрепление так и не явилось. Необходимо найти любые сведения об их судьбе.
- guid: 9e5f6e64-6b8d-4fb5-893a-78dd13be373e
  text: Воссоединение
- guid: 9ee6c6f9-ce7e-45c4-b1f7-8848fa3dd5f0
  text: Отыскать Лорд-инквизитора
- guid: 9f625a66-b0cc-4867-86ad-78e6364e0dfd
  text: Себериан лишен клинка, и теперь ему будет легче увидеть свою истинную опору — свиту.
- guid: 9f9e28a4-0d0e-4ef9-8aff-d4fb7231b910
  text: Заккари Вайс задолжал исповедь Вольному Торговцу.
- guid: 9fe5cc9d-60c3-4746-9b88-26564084a0cc
  text: Защитить хирургеона Лукху.
- guid: 9fedc51e-888a-44a0-9b0d-5601d9230540
  text: Изимонд готов на любые крайности, лишь бы его род получил титул.
- guid: a0bbe40f-9169-4c48-8ce5-7593b87714c9
  text: Изимонд владеет именным плазменным пистолетом.
- guid: a14a110c-1966-4c4a-a780-890401259450
  text: Ксеносы недооценили Лорд-капитана, вышвырнув е{mf|го|е} бездыханное тело на свалку трупов. Но их пыток оказалось недостаточно, чтобы прикончить Вольного Торговца. Путь, ведущий к спасению и возмездию, начинается на самом дне могилы.
- guid: a273b173-04ed-4e0a-8dda-3b858c8ac401
  text: Ульфар покинул корабль Вольного Торговца и направился на планету, где, предположительно, могут отыскаться следы его стаи, в одиночку. Если Лорд-капитан желает оказать соратнику помощь в экспедиции, {mf|ему|ей} предстоит также высадиться на промерзшую планету.
- guid: a3c16e09-9139-4aee-9191-6c6df524fa28
  text: Победить на арене
- guid: a4983727-eaa9-43c1-82fd-f656d9a74861
  text: Содержимое найденных на Даргонусе и Кьяве Гамма банков данных оказалось зашифровано. Повторить процедуру дешифровки можно на мостике, используя когитатор Вольного Торговца.
- guid: a4d2aa15-25f0-4f27-b67c-c28bc412bdab
  text: Всякое общество порождает изгоев и отщепенцев. Лишь узрев их убогое существование, можно сложить всю картину жизни в отсеке.
- guid: a4f32702-7668-4a8e-99fd-e8440bbdbd56
  text: Получив сигнал маяка, призма указала на следующую планету.
- guid: a5205d5f-cd64-432e-a4a6-1187ed3f6f08
  text: Вигдис сообщила о вокс-передаче, перехваченной у пиратов. Судя по всему, на одной из планет в системе Колыбель Хепри можно разжиться чем-то ценным.
- guid: a541eba7-b923-4a7e-8237-3fd3f34a977e
  text: Лария раскрыла нам кодовую фразу, предназначенную для ее доверенных агентов.
- guid: a561239f-a395-4d58-9d44-6c48fcec6785
  text: Организовать прием Навис Нобилите на Даргонусе
- guid: a59d7e48-abe1-464a-a7bb-c32dadfada41
  text: Ритуал пошел не по плану, как и предрекал Заккари Вайс. Хормейстера надо защитить любой ценой, иначе все обречены.
- guid: a5e6d068-fbea-4f70-93c1-ace101929118
  text: Вольный Торговец силой слова и веры сломил{mf||а} непостижимую сущность, прислуживающую Архиврагу. Слава династии фон Валанциус!
- guid: a5ee105c-af6a-4c14-8cab-8f659ecaed06
  text: Лорд-капитан наш{mf|ел|ла} не утраченную реликвию, а самого Себериана — живого и невредимого.
- guid: a6064bb6-fd3d-49bc-afc5-4527aa5311c8
  text: Лаборатория гемункула, мир Кетца Темер
- guid: a6128af2-879a-46b2-aa89-b6f261e47422
  text: Последние координаты привели Вольного Торговца к наиболее мерзкому из всех зрелищ, встреченных на этом долгом пути, но здесь Лорд-капитан наконец смог получить достойную награду.
- guid: a614ffd6-82a0-4546-88f9-ccba16ca2c95
  text: Эвакуироваться на шаттле
- guid: a6785d32-05c5-43af-955b-8f1ae7793718
  text: Тайник на Кьяве Гамма
- guid: a6dd3590-f90c-47e9-93d1-0c59fad808b4
  text: Пробудить генератор
- guid: a739deb2-9fb8-4f69-9a62-2bc3eb6c84db
  text: На Даргонусе (система Мундус Валанциус) готовится пышное торжество. Руководит его подготовкой церемониймейстер, ожидающий во дворце.
- guid: a77cc4df-f2f6-4fdc-b551-e55cf5e8fc05
  text: Раскрыть мотивы Камиллы Драйвстем
- guid: a7deea92-5dc8-4f2a-a2b7-bf40e9010610
  text: Тысячи беженцев из владений Винтерскейлов прибыли на Футфол на борту транспорта "Навиика", но не нашли там приюта и направились к пустынному миру Фолстоун.
- guid: a81e3ea3-3d91-47f9-84e7-6a746b9672c2
  text: Себериан одержим Багряной пляской Кхейна, что заставляет его свиту дрожать от страха, а его самого — полагаться лишь на себя.
- guid: a85b1edd-0c6b-4e4f-977b-9985791a9933
  text: Вольный Торговец увидел{mf||а} достаточно — пора сообщить капитану Френзо, каким будет будущее отсека.
- guid: a87ea249-be67-4d25-9a3e-d67dfb73f2c0
  text: Одержать победу
- guid: a8d903c1-562c-46ad-bbe5-b09ba75de42e
  text: Инфернус-мастер предоставит людей для организации засады возле тайника, обнаруженного Лорд-капитаном.
- guid: a8db5daf-5f6c-4477-9fc7-cc0db17691b4
  text: Уничтожить Крик скверны
- guid: a921deb3-4a5d-4c44-b843-f5e134f5f0d6
  text: Техножрецы, населяющие Алтарь-Темплум-Каликсис-Экс-17, откликнулись на призыв Вольного Торговца и приглашают посетить их обитель для обоюдовыгодного обмена информацией.
- guid: a96c9b68-cbb1-45aa-84ae-064b70997145
  text: Если лишить Себериана меча, но позволить свите и дальше тянуть его в разные стороны на совете, он обвинит Вольного Торговца в краже и казнит его. Стоит позаботиться и о мече, и о свите.
- guid: a9a63932-1d4b-4236-93cb-248da3ed638d
  text: Космический мусорщик
- guid: aa3eca6e-df5b-4a0b-b2e9-68de1e97f83a
  text: Произвести разведку на "Герметико"
- guid: aa4c770b-05cd-4b4c-93ce-d93f93088d0a
  text: Тайник в бывшей лантерне
- guid: aa5eafa3-8317-4fff-8797-6c7af0551e56
  text: Экзальта-117 можно убедить в существовании хроноаномалии и заручиться его поддержкой на совете.
- guid: aac8b1a7-0da5-464b-a34f-2b93d6362aaf
  text: Очнувшись на свалке трупов, Лорд-капитан обнаружил{mf||а}, что е{mf|го|е} обувь исчезла. Отыскать ее — в некотором смысле дело чести.
- guid: aaec7ae2-c942-49d5-a463-21945379faea
  text: До Вольного Торговца дошли слухи о корабле ксеносов, потерпевшем крушение на одном из океанических миров Простора Коронус.
- guid: aaf3527b-7b01-4e5c-b96e-d201cb083de2
  text: Благодарственная процессия
- guid: ab5e6e07-bbe4-4770-ac3a-087e21315784
  text: Команда Вольного Торговца наткнулась на разграбленные останки древнего имперского судна. Среди скудной добычи обнаружилась замысловатая деталь, которую служители Машинного культа определили как часть археотечного механизма неизвестного назначения. Удивительная находка!
- guid: abae09f8-6bd5-4e75-b0ff-095b89fb63b9
  text: В убежище контрабандистов, полном ловушек и ксеносских технологий, Лорд-капитан обнаружил{mf||а} загадочный артефакт.
- guid: ac1069db-f188-452d-98bc-37aa08e6f0c1
  text: Небесная колесница
- guid: ac8d3a1a-7209-408f-b790-95f784f240eb
  text: На мостике династического флагмана фон Валанциус произошел ожесточенный спор Вольного Торговца и {mf|его|ее} прославленного предка. Напряжение между членами династии возросло, и в ближайшем будущем Себериан намеревается окончательно выяснить отношения со своим потомком.
- guid: acbe7277-50f9-44c0-8764-f0d5748c08f8
  text: Планам Лорд-инквизитора не суждено сбыться — Вольный Торговец вмешал{mf|ся|ась} в них в последний момент.
- guid: ace46ee6-02d2-42a3-94b5-dc106c0e47c2
  text: Транспортные плиты парят, попирая гравитацию мощью ксенотехнологий. И пусть человеку не дано постичь принципы их работы — эти ксеномеханизмы способны вызволить Вольного Торговца из западни.
- guid: ace5239e-6765-45fa-b1a8-61abcb34dcf6
  text: Выжить в схватке
- guid: ad210e40-b19a-4c37-8f87-bad2ac6f2bbb
  text: Посреди разрушенных диорам Лорд-капитан обнаружил друкхарский антиграв-транспорт — такой же, что вознес его к шпилю Опустошающей бури. Вот он, путь к похитителю.
- guid: ad98a5af-b3a8-4d8d-8cb4-51a1ee2f505d
  text: Ангелы Императора в Просторе
- guid: adb530db-a1ab-4912-9832-dc5f2596bb94
  text: Персона нон грата
- guid: ade4fc70-7b44-4fe7-a64b-33f8721b671c
  text: Бранек Зарков действует так, как прикажет Лария. Следует либо отдать ему иной приказ, либо вывести его из игры.
- guid: ae3464a3-bba6-41d5-afd6-b9f0a7107565
  text: Нечестивая добыча
- guid: ae7030df-5da0-49f0-b28e-9f296837e525
  text: Это дело считается завершенным.
- guid: ae9a0efe-fc27-4b5c-981e-abcce125cf41
  text: В системе Пояс Лангренна была замечена группа сильно поврежденных ксеносских кораблей.
- guid: af01bb83-eeda-4aec-943b-b0fcda232787
  text: Вольный Торговец заключил союз с Комиссаром. Для успешного побега из Комморры им предстоит расправиться с ксеносом Злобой, из логова которого и начнется их путь спасения.
- guid: af1354c4-19d3-4d34-9849-1d435d49c305
  text: Отправиться в систему Ничейные миры
- guid: af357b11-24af-4f50-a017-61fb0ed769a3
  text: Предстать перед Висирем Кровавой паутины
- guid: af430d34-ee19-46cd-8c24-3311809ff6ba
  text: Жадность не порок
- guid: afdf622f-435b-480a-ba38-ce58b68e378a
  text: 'В обмен на жизнь Кибеллы Смерть прошептала имя: "Нааки Эрэбис". Что это за человек — неизвестно, но Янрис Данрок имеет доступ ко всем корабельным летописям и архивам, он может помочь.'
- guid: b02cfc25-b3c5-4a77-a338-3afe3d7afca0
  text: Флагман Каллигоса Винтерскейла нагнал свою добычу в системе Безымянная Звезда.
- guid: b1875be8-c316-4429-ab36-befbd8217347
  text: Разобраться с бедой Заккари Вайса.
- guid: b1a3ac94-7ad0-40e3-9d2f-b0a94755f820
  text: Нескончаемая война
- guid: b1cad4be-f70e-4d5e-bcf5-c5a168bc272f
  text: Уничтожить турели
- guid: b1d293b3-4c58-4d53-9880-09c21b1d72b3
  text: Гигантский астероид
- guid: b30b7482-5ed9-4690-9513-4dd57fd03546
  text: Ритуалы верхних палуб
- guid: b32d7bbc-a739-48c5-8b7e-d72424111a78
  text: Тайник обнаружен.
- guid: b3fc736d-b2bc-4cde-8162-22a82cc31140
  text: Путь Паломника
- guid: b54e7bf9-2c20-41bb-b012-17371133d739
  text: Данные на инфо-банке оказались повреждены, но Вольному Торговцу удалось выяснить — больше информации скрыто в тайных хранилищах Теодоры. Одно из них расположено где-то на мире Кьява Гамма.
- guid: b55c7b91-fc7c-4ce2-b504-ad2278df89f1
  text: Извращенная силами Архиврага нечестивая тварь, что некогда была местным аристократом и сгубила тысячи жизней, пала от руки Лорд-капитана.
- guid: b5e8de89-c422-4f7e-8281-a284bc6a20ee
  text: Лорд-капитан тяжело ранен{mf||а}, обкраден{mf||а} и лишен{mf||а} соратников. В пугающем месте, в котором он{mf||а} оказал{mf|ся|ась}, е{mf|му|й} как никогда важно найти безопасное укрытие, получить помощь целителя и спланировать дальнейшие действия.
- guid: b60d5bad-aace-41ea-8a0e-3d6a90adfc6f
  text: Финальное устранение ксеносов позволит агрокомплексу Януса восстановить рабочие процессы и наладить внешние поставки.
- guid: b7473761-0cd1-433a-a2b2-73ae93816562
  text: Чтобы взять флагман на абордаж, необходимо ослабить корабельные системы противника.
- guid: b753a41c-99f9-49fb-8e35-ebaf518c1574
  text: Слова Изимонда Зауэрбэка идут вразрез с планом сенешаля. Нужно либо убедить его перейти на сторону Ларии, либо устранить иным способом.
- guid: b77ef7f3-ccfe-4337-8047-5f25fabe2433
  text: Кибелла приняла предложение Лорд-капитана познакомиться с церемониями верхних палуб.
- guid: b7dc6113-c6b3-4df3-b575-09e5e05c425a
  text: В системе Слеза Солара Лорд-капитан обнаружил{mf||а} древний шаттл с инсигнией Инквизиции и пилотом 32-го меровского штрафного легиона. На сохранившейся вокс-записи сказано, что их покровитель погиб, а полк остался на мире GH-89-717.
- guid: b7e7d243-94aa-4589-bdf5-024b8e8aa584
  text: Выгодное дельце
- guid: b8143ef1-87d5-4a2c-8b94-e414bcdee6fb
  text: Согласно имеющимся у Арбитес данным, флагман капитана Саргоны скрывается именно там.
- guid: b86e2e28-89a6-4f4c-9a34-6a5a7c449d2b
  text: Охраняемый шаттл готов доставить Лорд-капитана на корабль.
- guid: b8a93043-6ed4-49e5-8368-7ce68c050bfa
  text: Убийца Короля
- guid: b8ffad3b-d828-4517-92f3-99d2d552502e
  text: Приговоренный
- guid: ba0a8cac-28f2-4345-82ea-b8d6438e2b5f
  text: Ожидать вызова Калькасара
- guid: ba24c2f3-8f73-4c16-a3da-bc3763a49430
  text: Допросить заговорщика
- guid: ba6bc033-cba9-4937-8850-1fd78545edd1
  text: 'На третьей планете посреди пастбища для искалеченных мутантов, как и прежде, установлен ксеносский маяк, жадно поглощающий боль. Установив связь с ним, призма показала короткое сообщение гемункула, адресованное некому архонту: занятное путешествие, полное отборных измученных жертв, подходит к концу. Щедрый дар ждет того, кто пройдет этот путь до конца. Призма указывает координаты мертвого мира в системе Перекресток Сотни Снов.'
- guid: ba81ae84-a6c8-41d7-8837-2420b0e83ea1
  text: Поговорить с губернатором
- guid: baae3651-4d62-48eb-a753-7c20da3bb0dd
  text: Одолеть Иеронимуса Скорбного
- guid: bad067d3-e79e-4f4d-9b9f-868fb0cde403
  text: Злобная ведьма Кикеросс желает покарать Тервантьяса и лично расправиться с его нов{mf|ым|ой} чемпион{mf|ом|кой} — Вольный Торговцем. Лишь убив ее, Лорд-капитан купит себе драгоценное время для побега из Прорвы.
- guid: bb13d983-039f-4618-bd22-f3492fd98c26
  text: Поговорить с хормейстером Вайсом
- guid: bb4e132e-6320-4163-ba1b-181cefdfdefb
  text: Бегство
- guid: bb5eed5f-d702-4528-b5a8-a411002370dc
  text: Вернуться в зону высадки
- guid: bc0e62eb-69a3-42d3-b799-d967a6a499fc
  text: Сообщить о победе над Уралоном на поверхность
- guid: bccc1090-39eb-415d-b1b8-3c83d3b9f4e3
  text: Секретные сведения
- guid: bd6b5e17-f26c-48c2-8170-c88ebac21736
  text: В системе Рикатус находится утраченный пустотный крейсер
- guid: bdb8b97c-694e-4a8e-a350-e0deb0834d9c
  text: Сгинувшая капитан ван Дейн в предсмертном послании просила забрать фамильные реликвии из тайника на Кьяве Гамма.
- guid: be30d13f-f66a-4308-af72-a6cfce979324
  text: Мастер-код управления вратами найден. Стоит сообщить об этом Ювенне.
- guid: bec11e06-5d9c-4d86-ae1c-a79cc68a88e1
  text: Посетить раут
- guid: bef0059f-caf9-4d26-9b61-1d3ffcc13339
  text: Провести непростой разговор
- guid: bfae0593-3a1e-4c7a-915c-1bcf35bc599f
  text: Реколлигеры нуждаются в помощи эксперта
- guid: bfeb1198-2ccf-43b6-b673-7eaa0d531b5b
  text: Поговорить с Соломоном на мостике
- guid: c096ca89-0876-4750-afa9-0da9b544ceb0
  text: Все спутники Лорд-капитана, угодившие в плен к друкари, были обнаружены.
- guid: c10ac65b-9d77-4515-8475-2fef54f52478
  text: Принять доклад о допросе мастер-когитатора
- guid: c169d5bf-16af-443c-a0e5-191401793172
  text: Ювенна предлагает Себериану пойти на переговоры с Инквизицией. Возможно, если участники совета поддержат ее, такой исход разорвет временную петлю.
- guid: c1f2bca2-5dd8-43d1-8e71-d2a9cf1b520c
  text: Осада Ефрата-II
- guid: c21b1c8e-9deb-4ca1-9830-6e609261dddb
  text: Бранек Зарков действует так, как прикажет Лария. Следует либо отдать ему иной приказ, либо вывести его из игры.
- guid: c24bdac2-9eff-4480-8888-8a8609b0d49b
  text: Техножрец Паскаль Ханейманн прибыл на Райкад Минорис по повелению своего наставника, архимагоса Амарната. Восстание на планете помешало им встретиться, однако магос Ханейманн решительно намерен отыскать своего учителя.
- guid: c2a404dc-53ac-42bc-8696-84448d350e90
  text: Исследовать грузовую магистраль флагмана
- guid: c2c8a241-77f1-40a9-be31-842f4b982ab4
  text: Украденное право
- guid: c2ee63ef-a48e-4ff7-9989-75b3cf85a06d
  text: Брошенные на Фолстоуне зловредным капитаном "Навиики", беженцы вынуждены были просить об укрытии суровых отшельников из Ордена Молота, почитающих святого Когнация.
- guid: c3347664-4e9a-465c-8718-723c0ad41c58
  text: Инстинкт подсказывает Лорд-капитану, что из личных покоев что-то пропало. Нужно удостовериться, что все на своих местах.
- guid: c352bb9a-867e-40e0-bd6c-0e26852d865a
  text: Хормейстер готов совершить обряд. Время Вольному Торговцу узреть лица своих врагов.
- guid: c358827a-6ec4-46d5-8fe1-aa4390dca4a6
  text: Проложить путь до Веабос-6
- guid: c39064cd-7dff-4f9e-b806-08bf48f03749
  text: Последние почести
- guid: c3c6697c-2336-4f41-aa0a-962644531781
  text: Команда Вольного Торговца вновь повстречала корабль касбаллитов.
- guid: c48a1bd6-fbe6-4a69-bb2d-e30436c064f4
  text: Звездная гавань
- guid: c58c0ae3-25c8-45d8-9c91-aa8dc6d64215
  text: Созданный Эоганном триединый праведник сбежал из Сектора Бионика, устремившись на нижние палубы. Вольному Торговцу нужно найти его и решить как поступить со сбежавшим экспериментом.
- guid: c622a8e6-96e0-4c68-a80f-181e74297e8e
  text: Заплутавшее подкрепление
- guid: c7c30c3b-5460-4d78-8a85-372f017a8743
  text: Ложная идентификация
- guid: c83b591e-5118-412a-86be-2901cb043195
  text: Еретик уничтожен, Лорд-капитан может беспрепятственно покинуть Райкад Минорис на уцелевшем шаттле. Рекомендовано воспользоваться этой возможностью в кратчайшие сроки.
- guid: c8aee2f8-45ff-46a1-87af-f9ab7a576ce0
  text: Бедствие на индустриальном мире
- guid: c910e59e-14fa-4474-81ab-dacba4c81cbd
  text: Поговорить с церемониймейстером
- guid: c988a81f-e67b-4e99-884d-e02438d71a23
  text: Добраться до Уралона
- guid: ca26788b-7290-44fa-92b7-a07408644545
  text: Ахиллеас Скаландр передал новые данные о планируемой атаке. Ксеносы уже готовятся нанести удар — необходимо срочное вмешательство Вольного Торговца.
- guid: cb76f981-b784-4378-a580-4b06cf73b6b6
  text: Решить судьбу Нунциуса
- guid: cbb27008-05b6-4653-8bc1-aedc84a7bb27
  text: Лорд-инквизитор ускользнул от Вольного Торговца, отправившись в экспедицию на ту сторону древних пространственных врат. Там, в неизведанных звездных системах, лежат ответы на вопросы Лорд-капитана.
- guid: cbd9a56f-bcf5-40dc-919f-033a9aa0542e
  text: Кибелла желает вновь посетить светский раут, но на этот раз местом встречи станет Даргонус. Янрис Данрок будет ожидать Лорд-капитана во дворце для начала мероприятия.
- guid: cc6de76c-a544-4473-8605-a75ee32fd739
  text: Вигдис доложила, что проктор Антар саботирует работу команды флагмана. Она ожидает Вольного Торговца на мостике.
- guid: cd0f9851-fd02-4925-9a17-e4e4ad257880
  text: Найти способ побеседовать с Ульфаром
- guid: cd25e3cd-a1c8-44d4-8f9d-13d21c42dd87
  text: Мотив не установлен
- guid: cdcba978-4b20-4ba5-b7fc-bd45b11c7d12
  text: Встреченный Лорд-капитаном друкари Маражай в своеобразной манере поведал о неком человеческом судне, которое постигло нечто ужасное в регионе Цинерус Малефикум. Впрочем, едва ли можно доверять словам ксеноса.
- guid: ce0db80f-a2b1-4a91-af59-1abeca736f4e
  text: Бранек Зарков действует так, как прикажет Лария. Следует либо отдать ему иной приказ, либо вывести его из игры.
- guid: ce298fb9-739b-4f61-8a3a-bafeff86af92
  text: Жалкие пираты собирались присвоить себе то, что по праву принадлежит Вольному Торговцу, однако значительная часть их флота была разбита. К несчастью, "Неуловимому презрению" вновь удалось улизнуть.
- guid: ce31a322-199d-41fa-8e14-a878ef5d029c
  text: Лучшие умы корабля провели не один цикл, пытаясь понять назначение диковинной призмы, найденной в Комморре. Активировать предмет исследователям повезло лишь однажды — распахнувшись на множество лепестков, призма воссоздала голографическое изображение и координаты Ледяной планеты в системе Пояс Лангренна, после чего захлопнулась вновь.
- guid: cf199f59-996b-489f-bb83-627f2b87b9bd
  text: Ксеносы, вторгнувшиеся в Простор Коронус — друкари, разновидность эльдаров. Эти беспощадные головорезы хорошо известны обитателям региона, однако в последнее время их активность резко увеличилась.
- guid: cf339baa-1cf3-472d-8d46-f601c92a7eee
  text: Праведная измена
- guid: cf6d8a43-c839-424b-9c39-c11802fde8c5
  text: Отправиться в корабельный склеп
- guid: cf76bbe9-1eea-4069-aa6c-1a88ff7d28bd
  text: На заснеженной планете развернулось тошнотворное зрелище — сотни богомерзких мутантов бродили в загоне, оснащенном шипами, крючьями и прочими орудиями пыток, испытывая невыносимые муки тела и разума. Питаемый их агонией друкарский маяк вновь пробудил призму гемункула, указавшую координаты лавовой планеты в системе Нармер-IV.
- guid: d008da4d-7ae0-4629-8ae9-4c3637ed8d89
  text: Вольный Торговец разгадал{mf||а} принцип управления антигравитационными плитами. На каждую нанесен управляющий глиф. Его активация пробуждает маяки прибытия на доступных платформах.
- guid: d043f1ae-d2e4-491f-bbab-81db93de2a16
  text: Калькасар передал, что готов ко встрече с Лорд-капитаном. Он ожидает {mf|его|ее} во дворце Наместника на Футфоле, превращенном в его оперативный штаб.
- guid: d05d98f7-ac3b-405e-a12a-43e641776793
  text: Поговорить со спасенным техножрецом
- guid: d07b162f-3f7c-4c6c-b409-2999d57d2ee8
  text: Мастер-код управления вратами найден. Стоит сообщить об этом Ювенне.
- guid: d1012a58-115e-48eb-916b-7ce987dc8a4f
  text: Месть выживше{mf|го|й}
- guid: d2703db7-1903-4078-9039-8f27b84f440f
  text: Убить Злобу
- guid: d2d262f8-3bad-40fa-ae7a-5e74778b86fc
  text: Покровитель мусорщиков
- guid: d2d51823-8cdb-45ac-a14c-c0392ccaf35b
  text: Фенрис йольда
- guid: d36ff241-db86-4978-8c62-4fb1bb58e579
  text: Сокровище в океане
- guid: d3ab6bae-bd16-48b6-8a8b-9a9e128b7d0d
  text: Тайник найден! Находящаяся там информация позволяет предположить наличие иных тайников на Футфоле.
- guid: d4815c72-6ff0-45c1-94da-e36376fb821b
  text: О Ярубе говорят как о человеке с преступными дарованиями.
- guid: d4dbcb88-15ee-49f9-92e1-39eb73f46892
  text: Лорд-капитан обнаружил{mf||а} древние засечки, оставленные {mf|его|ее} легендарным предком.
- guid: d5a50b5e-3565-4166-93df-9d2357d0a1a3
  text: Богомерзкие эльдары вторглись во владения самого неистового Вольного Торговца Простора — Каллигоса Винтерскейла. Неотвратимая кара ожидает ксеносов, ибо охота уже началась!
- guid: d6132ad8-a2bf-436f-ae06-d5fb5c650e19
  text: Владайм хочет устроить западню, чтобы выманить Инцендию Чорда с ее трона и покончить с ней. После того, как Лорд-капитан завершит подготовку к битве, е{mf|му|й} нужно будет сообщить Наместнику о готовности и отправить Инцендии через своих агентов информацию-приманку.
- guid: d631c589-2131-42b9-9096-ac40d33818cc
  text: На диком мире Зарков Вольного Торговца ожидает схватка с серьезным противником. Следует подготовиться, вызнав информацию у местных жителей.
- guid: d6603e54-59a0-45af-a45f-b7454c0bcff8
  text: Наследие Истины
- guid: d661aa0a-c3a4-4268-8181-5c3b0177f67a
  text: Высадиться на Райкад Минорис
- guid: d692afcf-475f-4995-aa69-d6833afa88f7
  text: Редкая находка
- guid: d69776d3-6390-40f1-bd0c-67b8b76971af
  text: Второй лицемер найден.
- guid: d71921c3-a944-4733-8c4a-ee0fd1844b8c
  text: Великий Суд
- guid: d768aed0-1665-4ab8-86b2-54f9bace7b77
  text: Обсудить вознаграждение
- guid: d7793bed-eeb2-4f02-ac76-9a4f54b40be2
  text: Тервантьяс готов покровительствовать Лорд-капитану. Но для этого е{mf|му|й} предстоит преподать урок культу ведьм, убив нескольких их бойцов на арене.
- guid: d81f99db-f4a7-4e27-9d12-861bc9f1ab19
  text: Отныне для Лорд-капитана нет тайн о жизни даже самых нижайших из своих слуг.
- guid: d87b4a80-7734-44b5-8870-dcc92f5a9460
  text: Теологические прения
- guid: d88f8566-ddb3-4d31-b0ad-2d86fd1eb27b
  text: Исправная работа зенитного комплекса — дополнительный довод в пользу обороны.
- guid: d8ac1f57-c17c-4140-a81d-6677dc27bf94
  text: Леди-Навигатор не ладит с командой, что приводит к форс-мажорам на корабле. Мастер вокса просит Вольного Торговца поговорить с Кассией, дабы исправить ситуацию.
- guid: dbdb2ec3-6e97-489a-9976-92a61f5b752d
  text: Неотвратимость торжества
- guid: dc093f46-33c9-414d-9e40-ce03bfba5509
  text: Немезит планирует нанести удар во время торжественной церемонии принятия у офицеров клятвы-присяги новым корабельным исповедником. Вместо высоких гостей и их семей Мастер дисциплины отправит на церемонию переодетых блюстителей. Как только Немезит решит напасть на "беспомощных гостей" — капкан захлопнется.
- guid: dc277119-82ff-40d6-9291-ccc0a0027292
  text: Странствующий торговец, представившийся Паломником, передал Вольному Торговцу в благодарность за помощь древние имперские документы. Если верить свиткам, на неком "перепутье" Простора около двух веков назад сгинул целый имперский мир.
- guid: dc72a60a-31f1-40f2-a037-00c9c7cea8b4
  text: В системе Фурибундус Паскаль обнаружил инфо-банк, принадлежавший Теодоре фон Валанциус. Зашифрованная на нем информация может быть полезна новому Вольному Торговцу.
- guid: dd1d0946-f3c9-4c0c-8a05-ab9cbd477363
  text: Расправиться с мятежниками
- guid: dd30f870-4ed0-4c32-b93c-feaaad68f3a0
  text: Осколки бури
- guid: de93738f-b0ed-4ce7-bb43-d13c1a287742
  text: Лорд-капитан разгадал замысел Касбаллики.
- guid: def0b1c1-df65-4937-89b2-f6679df1d609
  text: Найденная Вольным Торговцем призма гемункула способна настраиваться на друкарские маяки, расположенные по всему Простору. Установив связь со вторым маяком, также питаемым страданиями омерзительных мутантов, ксеноартефакт вновь активировался. Устройство указало путь к следующей планете — расколотому миру в системе Лапидус Мортус.
- guid: defcb0da-13f0-4eb0-a0c8-865dd8efaf45
  text: Лария фанатично предана отцу. Чтобы она решилась поддержать переговоры с Инквизицией, нужно предъявить нечто по-настоящему весомое.
- guid: df25b2f0-c12d-417d-8fec-ce4179e97d12
  text: Надменный ксенос Злоба поможет Лорд-капитану, если т{mf|от|а} починит испортившийся конвектор, из-за которого ящероподобный нелюдь страдает от холода. Как бы ни было возмутительно данное предложение, это — реальный шанс на спасение.
- guid: df3a3ff4-9b2d-4831-8ce2-51f800e74723
  text: Бежать!
- guid: df470343-71a1-431e-bf6a-da97062c1a6c
  text: Лорд-капитан провел{mf||а} слишком много времени в моровой яме нижних туннелей, и теперь {mf|его|ее} кожу покрывают воспаленные волдыри. Кто-то на флагмане должен знать, как очистить тело Вольного Торговца от сего недуга.
- guid: e00ba191-a2d1-416a-b385-97fb534902f3
  text: Колыбель Хепри
- guid: e044b31e-f19e-4b8f-83d3-2a1e5e8209a0
  text: Ефрат-II объят огнем битвы с ересью, но эксплораторского флот Осознание категорически отказывается от поддержки — настолько сильна ли в них подозрительность к мирянам.
- guid: e089ca1a-a7c7-48c9-a28c-fbea7c48d6bc
  text: Узреть истину
- guid: e129ff1e-c5a2-4d7f-919b-652b52bdc1fb
  text: Оказалось, что за убийством отпрыска Гапраков стоит Ювенна. Такие вести наверняка заинтересуют сенешаля Ларию.
- guid: e14384db-04cd-470a-88bc-ba5823de2432
  text: Команда Вольного Торговца обнаружила на ледяном мире схрон, заполненный подозрительными веществами. Остается надеяться, что хозяин не сильно опечалится из-за пропажи.
- guid: e18abf35-b190-44eb-8021-b3ea9f490822
  text: Дефективные сервиторы
- guid: e1afe32b-fe74-4941-87cb-f163e14d34ad
  text: Призма гемункула
- guid: e1c1ca04-070a-486f-8a08-3df8e97d5184
  text: Найти опись десятины
- guid: e2449ac9-6e28-47ca-bed3-8b8ff9f41a35
  text: Погрузиться в разум Кибеллы
- guid: e2f2d435-b97d-4609-a88c-43fcd2a7f956
  text: Чаша весов, благодаря Вольному Торговцу, склонилась на сторону Ювенны фон Валанциус.
- guid: e316bd2f-4bc6-419c-8a7d-3bcb621429b0
  text: Вольный Торговец согласил{mf|ся|ась} уступить Маражаю смертельный удар, предназначенный архонту Опустошительной бури Иремерисс.
- guid: e48a5d64-268c-4d02-bdb2-b6521879655b
  text: Ювенна предлагает искать союза с Инквизицией посредством переговоров и ей нужна помощь Вольного Торговца, чтобы убедить в этом Себериана.
- guid: e49c564b-835d-46df-8344-7f460e3a77ac
  text: Пора показать обезумевшим бестиям, кто здесь настоящая добыча.
- guid: e56d83ee-6017-4767-af21-890559bd6095
  text: Корабль архимагоса Амарната лежит в руинах. Необходимо выяснить, что на нем произошло и кто послал сообщение, приведшее Вольного Торговца и Паскаля Ханейманна на борт.
- guid: e58ada51-b02c-4638-8535-06dfde69dcc8
  text: Владайм Токара решил оказать сопротивление. Бунт должен быть подавлен максимально быстро и жестко.
- guid: e618e7ca-3c2b-45f5-9d6a-be327fb0d8ae
  text: Соратники Лорд-капитана хотят встретиться с {mf|ним|ней} в Яме, чтобы обсудить дальнейший план действий.
- guid: e6c21f43-b399-4180-8017-06e47ffa870f
  text: Выяснить, что здесь происходит
- guid: e76049d1-c376-4851-b152-9904d99722a3
  text: Помощь реколлигерам
- guid: e79d835f-0b57-412b-b829-841167f5c22b
  text: Отбить мостик
- guid: e7c8341f-bb0e-4589-a6e4-6c3cebeba2cb
  text: Слова Изимонда Зауэрбэка идут вразрез с планом сенешаля. Нужно либо убедить его перейти на сторону Ларии, либо устранить иным способом.
- guid: e8a0a1c2-d8b3-4b00-9605-6b4a218e78db
  text: Корабль Касбаллики ищет пылающие миры и готов платить за информацию о них. Цель этого поиска неизвестна.
- guid: e90a8fe6-731d-49a7-ac66-74d58bf1bc00
  text: Беглец
- guid: ea0c0923-520a-46ef-ae0e-6017ed3f8fab
  text: Высадиться на планете
- guid: ea44b57a-227a-4943-a6de-25c70b61b557
  text: Держаться до последнего
- guid: eac808a8-2eaa-4e35-86ca-f8d93de6d91f
  text: На военном совете ни одна из сторон не сможет склонить чашу весов без вмешательства Вольного Торговца. Лария предлагает положиться на союзников и держать оборону.
- guid: eb51c34b-1ec7-47c0-bfc2-195b1ce644f7
  text: На острие ярости
- guid: ebcfddab-62a7-4058-bc80-01faf92c158c
  text: Похищения звезд совершались по велению гемункула Тервантьяса, ибо он нуждался в их энергии для работы над неким нечестивым "шедевром".
- guid: ec60a0e0-9272-43b5-94cc-9e69fe6933f3
  text: Хранитель духа машины
- guid: ecc9323a-e7e2-4af2-a68e-19e13be052a5
  text: Космический волк Ульфар желает отыскать своих братьев по стае. Торбальд Железношкурый, вожак стаи Грозовых укусов, может что-то знать об их местонахождении, вот только поведает ли он это знание Ульфару?
- guid: edf37b63-0a51-4336-93b4-7faff9bbc046
  text: Убийца арестован, однако причины, толкнувшие его на такой риск, остаются неясны. Возможно, Вольный Торговец еще постарается найти ответ.
- guid: ee833f94-0785-4216-a336-673178a58982
  text: Помочь отбиться губернатору Батошски.
- guid: ee8fb2da-b480-4b88-92d0-6292bb2877a1
  text: Устроить засаду возле тайника
- guid: eed1f298-66d4-4428-bd9c-517747c06de0
  text: Хладная торговка, что недавно присоединилась к свите Вольного Торговца, уже готова вести дела — малые и великие. Лорд-капитан волен выслушать интригующее предложения Джай на капитанском мостике своего корабля
- guid: ef0962c4-3396-4df2-86c3-0624ab39cc67
  text: Войска, собравшиеся на поверхности мира, будут счастливы услышать триумфальную весть о победе Вольного Торговца.
- guid: ef5a0c7e-fced-4efe-b079-c414595082a0
  text: Омерзительная находка
- guid: ef95ce60-6150-48a8-8c06-751f9a98b6df
  text: На Футфоле шепчутся о рейдах ксеносов — проклятых врагов Человечества. Коварные твари якобы нападают на населенные миры и беспощадно уничтожают форпосты Империума.
- guid: f150283c-a99c-43f6-800b-4fd2096da0be
  text: Расшифровать данные на персональном когитаторе
- guid: f1524c31-b745-4aac-94f6-3d3931a7a620
  text: Команда Вольного Торговца пережила встречу с варп-аномалией.
- guid: f1f1124a-aede-47ab-9019-d152f9740f16
  text: Корабль найден, его груз послужит благу династии фон Валанциус.
- guid: f25a1ba6-6d45-4a70-a998-95e30683f40d
  text: Стычка ксеносов
- guid: f27875b4-05fd-441d-8b07-52dc4375e806
  text: Ксеностраж музеона признал, что Багряная пляска Кхейна похищена и обращена в экспонат. Чтобы ее отыскать, сперва следует найти "интерактивную диораму".
- guid: f2ba3bdf-d075-41bb-b6cb-5a2ed4006612
  text: По данным от блюстителей Чорда, Владайм проводит тайные встречи в баре "Адептус Амасекус".
- guid: f48024eb-d9b7-40a9-8277-620a230104bf
  text: Игры ксеносов
- guid: f4ea28c3-35be-44e4-80b0-f59dc24b7f39
  text: Неопознанный механизм
- guid: f50dc8ce-e5da-419a-bb06-1e7965f0f935
  text: Магос Экзальт-177 не поддерживает план Ювенны. Необходимо либо переубедить его, либо устранить иным способом.
- guid: f549459e-eeca-4c10-8f40-f5e2b4c39bb8
  text: Обновить клятвы 32-го меровского
- guid: f646bbb3-dfea-488f-ba99-e104b24d1a43
  text: Назначение археотечной детали остается загадкой даже для служителей Адептус Механикус.
- guid: f6a06b9f-f784-48a2-8ba5-7810c51cc289
  text: Вольный Торговец обнаружил реплику дворца Даргонуса в осаде.
- guid: f6d8229e-4445-422f-b4ee-414f0cbb1ef0
  text: '"Странника в пустоши" отыскали на мире, погубленном богомерзкими ксеносами.'
- guid: f70f8c2e-f48c-47a2-a3f8-74634f70c08f
  text: Маршал Адептус Арбитес ждет Вольного Торговца на Даргонусе. У него есть какое-то дело к династии фон Валанциус. Чтобы начать аудиенцию, Лорд-капитану надо поговорить с Соломоном в тронной зале во дворце Даргонуса.
- guid: f75e37f5-0f15-45b4-9de6-26e7a32c7351
  text: Помощница губернатора
- guid: f81ebac6-1496-4def-b858-51459bf4d7ea
  text: Разобраться в конфликте
- guid: f88ef195-f636-48de-94ce-3979ff3d3db7
  text: По стопам истории
- guid: f934a012-2771-4cd5-993f-4f7487b0f948
  text: Лорд-инквизитор не принимает посетителей, занятый важными делами. Как бы вызывающе это ни звучало, Е{mf|го|е} Светлость не имеет другого способа встретиться с Калькасаром, кроме как ждать, пока он не призовет к себе Вольного Торговца.
- guid: f9e498e3-f533-4eda-b451-7313bb90c689
  text: Вынести приговор Тассере
- guid: fa7a99f1-9ca4-4563-b51f-ec87309be6dc
  text: Встретиться с Владаймом
- guid: fc252689-2ddc-4671-953a-69d5000e2325
  text: Защитить хормейстера
- guid: fcb29b62-c3d5-490d-93b9-9530af6bc41b
  text: Понаблюдать за казнью
- guid: fcc7c392-e13c-439d-86c8-6dc786102470
  text: Префект Вультур и маршал Стракс снова взывают к Вольному Торговцу. В этот раз дело касается самой охраняемой тайны Простора.
- guid: fe50b730-06d2-4a2e-86c8-c055d3109221
  text: Обезглавленный грифон
- guid: fe71bb8e-5ba1-475e-abb5-04125db22cbb
  text: Поговорить с губернатором
- guid: fe9ebed4-47b4-4bb0-98fe-a5f5d9f6493f
  text: Расправиться с ксеносами
- guid: feb13d3e-9847-4ded-80a1-6821cfd5e28b
  text: Уничтожить всех еретиков
- guid: feb7cb4b-dedd-4cdb-80ed-1bf3270de36f
  text: Следует убедить Ювенну довериться Вольному Торговцу.
- guid: fec59bbe-e564-4aff-9b5c-cdf62b016009
  text: Кьява Гамма пала на милость культистов — служителей Архиврага, превративших индустриальный мир в горнило зла и ереси.
- guid: fef9042e-cd83-4a31-9aff-afa35c64e22b
  text: Слуга ксеноса
- guid: ff015afe-82dd-46d8-a448-28fef0dc8564
  text: Найденные улики указывают на Изимонда. Стоит проверить, достаточно ли их, чтобы убедить Ларию в виновности блюстителя.
- guid: ff497aab-ec0a-4d65-b953-3a9c74b55cbe
  text: Гордость Сантиэля — мир, принадлежащий династии Чорда, — был атакован зловредными ксеносами друкари. Вскоре после сообщения о рейде связь с системой была потеряна. С тех пор оттуда не пришел ни один корабль.
- guid: ff58fc7a-6ef8-4b78-a32a-bac397fd055d
  text: Лорд-капитан посетил{mf||а} званый ужин на офицерской палубе, где познакомил{mf||а} Кибеллу с обычаями знати.
- guid: ffcfe821-83b1-42f4-8770-4e018e5af519
  text: Эхо мрачных песен и легенд донеслось до астропатического хора следом за чередой неясных сигналов о помощи, поступающих со всех уголков Простора. Последний из таких сигналов удалось отследить — он был передан с пустотного корабля из системы Омикрон.
