name: Barks
description: blueprint owner matches bark|banter|randomphrase — NPC barks
total_phrases: 1936
phrases:
- guid: 002c727f-aef4-4883-b501-7833de0d6b53
  text: '"Приветствуем вас, Ваша Светлость!"'
- guid: 005d274f-2785-4d89-9b75-dad1e9e0cbd9
  text: Гниющая плоть спадает с тела просящего ошметками, обнажая кишащие червями раны.
- guid: 008b2628-eb03-4f61-9ab1-536b9f0cb348
  text: '"Так сильно ему господин блюститель бока мял, что с господской руки аж перстенек слетел..."'
- guid: 00aff69d-d7ef-47f3-9250-c6f805256d8e
  text: '"Снаружи настоящая бойня... Но здесь, Ваша Светлость, вам ничего не угрожает!"'
- guid: 00bdc26e-1bf5-41e6-9f31-4f202fb7165a
  text: '"Это... это что, сам{mf||а} Вольный Торговец?!"'
- guid: 00c1b55f-ba7d-437b-a1f8-65a560c40cf9
  text: '"Ни для чего, кроме вашего развлечения, мастер".'
- guid: 00e75009-fcbe-4490-a4f9-5cf7cd2cc993
  text: '"Вторженье сбылось. Изничтожен быть должен дерзнувший. Воспряньте, постигшие сон, обреките карой его".'
- guid: 0101dde4-c54f-4833-b20b-b501fd6e8b42
  text: '"Ну-ка сейчас заглянем за дверку, к тем, кто на нас так хочет посмотреть".'
- guid: 0118ccfa-4d5a-42b6-9911-ff0f3a95c179
  text: '"Да, Ваша Светлость?"'
- guid: 012c454f-6e30-41f2-abff-87b85f968758
  text: '"Сбежали... судя по облачению тех ксеносов, они не ровня убитым тобой бойцам — скорее их предводители".'
- guid: 012feee2-77f8-4366-ac3c-2b533f8328dd
  text: '"Волки, к бою! Не давайте малефику передышки! Фон Валанциус, укройся, пока голову не оторвало!"'
- guid: 01a824dd-180a-4958-98be-5c31d5bdab9e
  text: '"Вы насладились? Вы удивлены? Падший дракон одолел лучших воинов арены! Культ оценил это. Маражаю Эзирраешу даровано право примкнуть к Кровавым прозелитам, нашему братству чемпионов".'
- guid: 01cbbc24-d03d-4340-a786-d72cc1c998c7
  text: '"Все, что у вас есть сейчас, вы получили на золотом блюдечке. Но достойны ли вы этого?"'
- guid: 02266b61-2e30-496c-9dbb-eb365cc8f466
  text: '"Слышал, кто-то напялил на себя костяную маску и теперь ходит по палубам. Людей режет да аквилы кровью рисует".'
- guid: 023147fc-0658-408f-98c2-a8e061d3f820
  text: '"Эту штуку вы ведь уже проверили, да, Лорд-капитан?"'
- guid: 0250c5c2-9e63-4b6d-a1d1-1818d1f9b27f
  text: '"Людей в список за взятки вносят! Это все знают!"'
- guid: 0257246d-7324-41f2-b613-11a64b5f25a9
  text: '"С Сэйха в руке вернулась Сирлаэль в Комморру и низвергла тех, кто служил ей, а потом предал ее. И явилась она на порог арены своей, и выкрикнула имя своей ученицы, что низложила ее когда-то".'
- guid: 02629914-fae3-44c3-9770-307588b50a71
  text: '"Фу... Ну и запах. Надеюсь, Великий зачтет нам то, что мы избавили мир от его злобного двойника".'
- guid: 026f1641-1f2f-4ab8-b8da-12ccdeefb845
  text: '"Ты тянешься к душе, которую не понимаешь сполна. Боишься, что ваши различия принесут лишь боль, но не давай страху определять твою судьбу".'
- guid: 029e29cc-1150-4f70-b3eb-fdefb6909b86
  text: '"Прощайте. Если кому-то посчастливится выжить, найдите Лорд-инквизитора Калькасара и сообщите ему, что видели здесь".'
- guid: 02fec7c8-7aac-4bca-a9f4-13ae485c91bb
  text: '"Мы умертвим плененных апостатов, дабы изъять Истинную плоть. Готовьте инструменты, братья".'
- guid: 036f6fa5-a83a-4706-b6fe-9d699fcf73ed
  text: '"Да хранит Император владык Даргонуса!"'
- guid: 03ebfcdf-edd5-41a0-a831-c7a97eb97b8e
  text: '"Я знаю, знаю. Поверьте, я бесконечно благодарен Лорд-капитану за наше чудесное спасение с Райкада..."'
- guid: 03ecc870-e5f2-4ab1-8007-cf43cced1fd5
  text: '"Господа, прошу вас, разойдитесь! Не толпитесь. Губернатор Драйвстем все уладит..."'
- guid: 041e0449-4641-42e5-b7c4-d50b2aa6e7bf
  text: '"Милый мой, я тебе обед принесла, какой ты любишь..."'
- guid: 042842ea-0eee-4df9-8346-b2b8c33a9cbb
  text: '"Это лишь иллюзия, созданная для того, чтобы отвлечь вас от истины. Не рекомендую тратить на нее время".'
- guid: 042f77ea-4da2-4ce1-93db-c49918a88437
  text: '"Похоже, ядовитые испарения как-то попали в систему вентиляции бункера".'
- guid: 045c76ec-b3ae-4335-b605-0d5e80dcca69
  text: '"Кабалиты Опустошительной бури, я оставляю этого мон-кай вам. Развлекайтесь".'
- guid: 045d2d7f-5eb8-49dd-b4b9-8bcd53c6fa96
  text: '"Смерть слугам трупа на троне!"'
- guid: 048af68c-9587-44b0-bdc3-c44504eb1874
  text: '"Ну наконец-то, нормальная жрачка!"'
- guid: 048f618b-89b2-432c-85d9-38115ee9ca23
  text: '"И даже видели. Только... я себе как-то иначе представлял Леди Теодору..."'
- guid: 04954060-02f7-4311-8360-e7f9ee94cd23
  text: '"Как дальше работать, если ребра все-таки сломали?..."'
- guid: 04aa37de-3869-46e1-b4dc-6681aa483fdb
  text: '"Император милосердный, услышь мои молитвы..."'
- guid: 04b570ea-8d7d-4ca5-97a4-1c09271e940b
  text: '"Вот это заварушка! Слава Трону, что мы не втроем сюда поперлись".'
- guid: 04da7550-2299-4d28-980a-941630ee93d7
  text: '"...Рэндора и Ксиони из дома Эрэбис. В сопровождении наследников Маттиса, Лорны, Роно и Люми Эрэбис. Слава династии!"'
- guid: 0576721a-c4d5-445f-8c00-0df3a68707d4
  text: '"Надеюсь, ксенос будет держать руки при себе".'
- guid: 0580308e-34ed-484f-8e19-1de8b3a4d915
  text: '"{name} фон Валанциус без ума от Джай Хейдари!"'
- guid: 059e3398-a437-450d-8897-8eb88877ea24
  text: '"Слушайте-слушайте, я вам такую историю расскажу!"'
- guid: 05a5ac08-86fb-491f-9fa5-0e0bd07e2f08
  text: '"Так точно, сэр!"'
- guid: 05a62b7f-31dc-47e3-b73c-5eb9ec96626f
  text: '"Я знаю, вы все... все предатели. Они сказали мне, нашептали... Эй, а вы еще кто?!"'
- guid: 05fe080a-29c4-42f0-86db-e7c595b6653c
  text: '"Вольный Торговец, назад! Сей том пропитан ересью, не стоит его трогать!"'
- guid: 0617aef2-d0c2-46c1-aaee-7b2656270870
  text: Друкари ядовито шипит изощренное ругательство.
- guid: 064acbd5-4ec7-42dc-b5ec-c09ea93c441d
  text: '"Поместье под контролем! Вы в полной безопасности, Ваша Светлость!"'
- guid: 064bb19f-12d3-4a08-867a-172577242266
  text: '"Однажды Неумирающий прошепчет мне твое имя. Я свершу волю Его без колебаний, ибо я — твоя смерть, Домин''{name}".'
- guid: 07078a1d-7e46-4508-851b-49975ea1bd0f
  text: '"Кто-нибудь знает, что случилось на четвертой складочной? Ну ту, с которой офицер прибежала?"'
- guid: 071d2bad-84c6-42ab-9a9d-b2d4a708665d
  text: '"Нарушители! Здесь! Как и предупреждал Фалько!"'
- guid: 07436262-f92d-473e-997e-9a83097922d8
  text: '"Проклятая плоть, ты предаешь меня, я вязну в трясине из мяса и жил, но дух мой стремится к совершенству Машины!"'
- guid: 0744de44-57d3-4624-9588-633999309db8
  text: '"Гра-а-х! Защити-и-и-ть... Дитя-я-я!"'
- guid: 07564c5d-5bf5-45d5-9c11-8fc47b2a5c4d
  text: '"Дай мне сил дожить до конца смены... всего-то немножечко сил..."'
- guid: 075928f5-a4ee-4fba-82c6-931d4de4a42c
  text: '"Пять циклов ждала, и еще столько же подожду — только бы голова на плечах осталась!"'
- guid: 07c4d52d-034b-4d48-adbd-86ff7b9887dc
  text: '"Поганое дело — наша служба..."'
- guid: 07f69fdf-e413-4617-b21c-2dd58167132f
  text: '"Мы победили? Мы победили!"'
- guid: 08041010-7867-4d6b-a8c5-331a6336e5e6
  text: '"Падение было предначертано. Пророчество будет исполнено".'
- guid: 08222ac1-3073-45f2-b28a-9bfcacc1cd34
  text: '"Прикончим ашмагов! Цельтесь в бочки с топливом — они отлично взрываются. И... держитесь подальше".'
- guid: 083860aa-874a-4104-941a-6236e08f78ea
  text: '"Если лишь свет Императора ведет нас вперед, но только истинные боги даруют силу... Возможен ли мир во вселенной?"'
- guid: 084304f9-5794-4ff4-9762-641c3e628257
  text: '"...Отсек DF-541, направляю к вам техноматов. Ожидайте дальнейших распоряжений".'
- guid: 088c0da7-b9f0-4bb5-acd4-b5db1f441016
  text: '"Я словно хожу по месту преступления".'
- guid: 089f515a-7897-4271-8fc7-0f5354abf63a
  text: На экран выведено сообщение о снятии первого блока с подъемника.
- guid: 08dc4355-a267-4ead-bd73-42d7c12a0610
  text: '"Когда настанет день, в который мы откажемся лезть в самые темные места и искать самые жуткие знамения... Я пойму, что душа моя направилась к Великому".'
- guid: 090f0e94-2f7e-4ff8-a437-60bd9bf10434
  text: Сервитор смотрит мимо вас, не замечая вашего присутствия.
- guid: 0913fdf1-be4c-49e3-b1d0-7634c846a498
  text: '"Вот те на! Кто-то хорошенько расшатал занавеску между мирами — и совсем недавно. Гости с той стороны так и норовят в наш мир продраться".'
- guid: 0929210a-bd7a-47cf-8543-5a2efb642800
  text: '"Эта боль... не имеет значения. Лишь она покажет мне истинный свет..."'
- guid: 09771028-0e3f-409d-9793-0571f1c5a8b6
  text: '"Восславляю Омниссию за свершение статистического чуда и обращение неблагоприятного тактического прогноза в благоприятный".'
- guid: 09c134e8-46d6-4adb-bdb8-ea3d91e985d2
  text: Словно черная статуя, тварь абсолютно недвижима. На черном металле ее тела нет видимых следов повреждений.
- guid: 09c9dbac-3a74-454d-9ba1-3e26fe63e966
  text: '"Но и оставшегося хватит, чтобы нас прикончить. Ослабь его физическую оболочку, отвлеки, а я встану за управление Ярмом и попытаюсь пленить чудовище!"'
- guid: 09d4edd0-6238-4766-ab13-2509ca987cb8
  text: '"Слыхал про Саргону? Арбитры до него добрались. Выпьем, чтоб пустота была пухом этому гаду".'
- guid: 09e6a731-4426-4f08-aca5-42e7ac6ff321
  text: '"Где Дитя? Оно в порядке?"'
- guid: 0a459441-4080-4492-b6b5-2418ddcb0eba
  text: '"Тише! Будете много болтать, за вами тоже после смены придут. Хотите исчезнуть как Эндо?"'
- guid: 0a99a2fe-d90d-49b2-ba6b-711d5107638e
  text: '"Эй, разве ксеноское отродье раньше не ошивалось поблизости?"'
- guid: 0abf9d75-6092-42b0-b00f-aa035c4e1b1d
  text: '"Грядет ультимативное прервание Йекхмет".'
- guid: 0adf28cd-2c48-4b50-82fd-0379455cdb85
  text: '"Пустотные псы, достойные только дубины и плети!"'
- guid: 0aebaff1-73c9-4d36-aecc-a10e4cd01520
  text: '"Версерианы зазнались. Хорошо, что их век у власти был недолгим".'
- guid: 0b0296ff-a0c6-4a70-8cb6-d038f59c0596
  text: '"Какой к гроксу клипер?! Я двадцать два года станцию не покидал! Я в жизни краденного в руках не держал! Не грабил я никаких клиперов!"'
- guid: 0b32c12b-9050-4e7d-a4f7-11213c79a32b
  text: '"Стольких потеряли... но ничего, выстоим!"'
- guid: 0b6bddd5-0f1d-4557-a3ab-d40d9b1e62d5
  text: '"Критическая ошибка служебного когитатора. [[Повторная проверка]] Обработка прошения не может быть завершена".'
- guid: 0b826a8e-252a-4eaa-a76e-26cc333ac607
  text: '"Я даровал ему две дюжины несмертельных ран, ты успеешь насладиться страданиями".'
- guid: 0b9600cc-e969-44f8-a9a3-2dcc55aa1302
  text: Мир внезапно теряет прочность и несомненность, все вокруг выглядит лишь декорацией и подделкой под реальность. Грудь сдавливает ужас.
- guid: 0b962e20-0c6d-49f5-867d-129b190a8431
  text: '"Да благословит Дедушка Император сей котел, ибо весь мир — сад Егойный, в котором всяк да пребудет сыт и доволен".'
- guid: 0bb7f3e7-bc92-4f19-ad55-28ca4911390c
  text: '"Ты пожалеешь об этом!"'
- guid: 0bbd3cbb-86cd-46d8-8897-1ee937b94a91
  text: '"Токи энергий Имматериума да вольются в чрево механизма сего".'
- guid: 0bfdcb9c-13e1-4bd0-bc51-b6dc21d9db6f
  text: '"Если прорвемся на галерею, там уже два шага останется..."'
- guid: 0c0f8b8d-e145-4f44-8e6d-d756f44cbbc7
  text: '"Отступайте во дворец и держите оборону! Сейчас же!"'
- guid: 0c2906bb-56bb-4ae1-8ebc-38bacb8c6310
  text: '"Кругом предатели. Комиссар предал. Даже Император предал. Теперь-то я понимаю — кто первый предал, тот и прав".'
- guid: 0c33e5e7-dd6e-4893-8dec-a9eecc36eab6
  text: '"Почему Император еще не направил ткачей воздать мне за грехи? Видно, заслуживаю я смерти не от клинка, а от гнили моровой ямы..."'
- guid: 0c488553-0515-4458-958d-cde9e5086c61
  text: '"Смерть отступникам!"'
- guid: 0c4ac59c-4b8c-4031-8d90-f73b04121a55
  text: '[DRAFT] Похоже из таких вот дырок мутанты лезут в эти отсеки.'
- guid: 0c513702-5f44-4581-aae2-924cb6a76c99
  text: Жалобно лязгнув, клешня сервитора стыкуется с механизмом и начинает производить необходимые манипуляции.
- guid: 0c8ab7f6-e76d-478a-b603-a2a87d256ac4
  text: '"Что... что происходит? А-аах!"'
- guid: 0c997200-2063-46fd-8fcf-6f09c8c5a6c7
  text: '"Только посмотри: молодые, сильные, жаркие тела. Страх придает их крови особенно сладкий привкус".'
- guid: 0c9ea3ac-79ff-4cf7-b2ff-caad0ba286a4
  text: '"Нести стражу на Лилэтан — мой родовой долг".'
- guid: 0cd7f6e7-77cd-413d-8588-a28a70974865
  text: '"...418, 419, 420. Бог-Император, глазам своим не верю. Еда, да не откуда-то, а аж с самого Януса".'
- guid: 0cdb0eba-fb46-4ec4-9a99-d16a23531fce
  text: '"Настоящ{mf|ий|ая} Лорд-капитан, надо же... Хоть знаю теперь, за кого помирать буду".'
- guid: 0d151457-2383-42e3-97f5-03a6cb34c915
  text: '"Ничтожный выродок, ты что же, хочешь драки? Хорошо, сегодня я еще никого не убивал".'
- guid: 0d482609-3512-4761-9e84-056a63c9e719
  text: '"Мои дикие гончие выйдут на арену вкусить крови отчаянных претендентов. Омывайте их страданиями свои души, делайте ставки, сможет ли кто-нибудь из них одолеть ловчих тварей!"'
- guid: 0d4b6dfe-c2d2-43f2-b931-0c5a824bdfc7
  text: '"Занять оборону! Никто из врагов не прорвется в эту дверь!"'
- guid: 0d5d0b08-edee-4373-9125-6f057654f4df
  text: '"Э! Уши греть вздумали?"'
- guid: 0d734cc8-c47e-4bcc-badb-6eceafdd58b6
  text: '"Ты видела свежее мясо на арене? Там был{mf||а} од{mf|ин|на} любопытн{mf|ый|ая} мон-кай".'
- guid: 0d7e3e33-cb74-47d0-a333-9f07d3d30501
  text: '"Это безумие..."'
- guid: 0d97bcc4-2a92-4ac3-aace-1c55fcc1cffa
  text: '"Да не толкайтесь вы так, мест много — всем хватит".'
- guid: 0d9d5daf-9e97-4e77-b6c6-c10d3d830230
  text: '"Вы прибыли нас забрать? Вы же нас спасете?"'
- guid: 0db3f098-97af-49cc-9ce4-cbde03aefc2e
  text: Требуется жезл управления
- guid: 0e063269-045d-49e2-a6a2-346bb15b3cb2
  text: '"Бедный-бедный старик... А ведь я ему говорил!"'
- guid: 0e1f1aa6-48d2-47c5-bac2-b10ed140c026
  text: '"Посмотрите кто к нам снизошел... Что, жизнь сытая наскучила?"'
- guid: 0e2adbe4-9337-430f-b602-14237c8de43b
  text: Боец Инквизиции сурово молчит и сверлит вас ледяным взглядом.
- guid: 0e3a9ef4-33d9-46e1-b751-bbf677d60358
  text: '"Ржавая железяка, ты-то нам и пригодишься".'
- guid: 0ea7ddfe-d18e-4dd3-9574-1e9df857863c
  text: '"Прекратите вести себя с аколитом Святой Инквизиции словно на светском приеме в кругу воздыхателей. Вы слишком легкомысленны для главы великой династии".'
- guid: 0eaee7e5-f628-4cfe-b765-b99d85428d52
  text: '"Мы найдем и четвертуем каждого, кто посмеет угрожать высоким гостям, будьте уверены!"'
- guid: 0f043ce9-55da-4aa7-aa2d-846473cf50a9
  text: '"Мое! Пшел вон! Порежу!"'
- guid: 0f08ab85-f3a3-44b2-87da-a6b42ebe361a
  text: '"Ч-что это за монстр? Его лик... искажает скверна! О Император, неужели моя жизнь оборвется столь скоро?"'
- guid: 0f535ee6-4050-49c2-955c-478f5137717f
  text: '"Проклятье! Я всякое повидал, но это что за тварь?!"'
- guid: 0fb9465f-b597-4213-9987-eb7313a8b513
  text: '"...бейтесь, не жалея самой жизни своей, и не опускайте окровавленных рук, пока последний враг Человечества не испустит дух...'
- guid: 0ffbef4d-fa3e-4136-a5da-bbb52b0c6912
  text: '"Вверь жизнь свою Неумирающему, Домин''{name}".'
- guid: 101867a7-4d60-487a-a986-8cc2a82e09e4
  text: '"О! Я понял, понял! Послушай... нет, снова ускользнуло..."'
- guid: 101f4e5d-4b26-4958-8d0c-c7dba94cc557
  text: '"Этот психопат ушел? Я слышал крики, кажется, он кого-то прямо голыми руками и прикончил".'
- guid: 1040dabb-5c47-40f2-90d6-be3f559f5f27
  text: '"Холодная безжалостность интриг

    Дыханье обращает в иней вмиг!"'
- guid: 10425002-22b8-4b48-9969-d1e56ab5a4ba
  text: '"Демон? Ну конечно. Разве нам могло повезти дважды?"'
- guid: 10657ab2-9545-4f19-9c1b-9c136cde12bb
  text: Отсеченные части людских тел.
- guid: 1088ea49-e8e3-4a56-936b-0440c3758ea9
  text: '"Не проходите мимо! "Адептус Амасекус" — лучший бар Футфола!"'
- guid: 10f0699c-ca27-4044-b907-8f5518ae1d62
  text: '"Мне нужно... отлучиться. По неотложному делу".'
- guid: 113b8cac-ba2d-4ebf-af3d-992c08262f25
  text: '"Узрите, как сии буйные и беспощадные воители сойдутся в смертной схватке на потеху вам, простому люду! Участвовать имеет право каждый, победителям в поединках будет дарована привилегия стать рядовыми в страже династии фон Валанциус! Веселитесь и славьте Вольного Торговца!"'
- guid: 118ee00a-0f4c-4194-9498-c23aaee13019
  text: '"Что за безобразие! Такое произошло прямо во дворце Вольного Торговца!"'
- guid: 11a613fa-4d35-4b0e-a2a9-802113b7c165
  text: '"Клешня готова к перемещению!"'
- guid: 11bac42c-b7ce-4140-a086-db217565a2a9
  text: '"Еретик во главе династии! Это конец времен!"'
- guid: 120c4c21-84dc-4514-8128-bb66c11b7063
  text: '"Надеюсь, никто не заметит, что я третий раз стою в очереди..."'
- guid: 12150b4c-cf99-46e8-9d20-a5edbed340a1
  text: '"Чем услужить можем? Припугнуть кого, кошель срезать, пырнуть в подворотне?"'
- guid: 121c92ec-bc7e-4998-98d6-17fb0169a5cd
  text: '"Дрянной морок! Не дай ему провести себя еще раз, эттфатер".'
- guid: 1228c166-0897-4b11-8aec-ea6ef92cd1a8
  text: '"Сыпь еще эта... только бы надсмотрщик не увидел — он такой зверюга в последнее время..."'
- guid: 128f3dfd-f16a-4401-bb0e-b7f22a1499b8
  text: '"А-а-ах, Лорд-капитан, помогите мне!"'
- guid: 12a72557-3197-44aa-80f4-6c5d744cb8ad
  text: '"Слушай... ты же знаешь, что случилось с Лоутоном? Уже после того, как он на борту оказался? Он же сам себе глаза выр..."'
- guid: 12d30f0d-47f4-4fee-80fb-60d8dae866ce
  text: '"Бойцы! С нами Вольный Торговец, а значит, и сам Император! Все, кто может держать оружие — на передовую!"'
- guid: 12db1cdb-bc3e-43d4-a1e9-fef4917a2b2e
  text: '"Как они успевают строить свои лачуги быстрее, чем мы их жжем?!"'
- guid: 12e52fea-350a-4311-a686-c596f1aa2fa4
  text: '"Продолжаю прослушивать доступные частоты. За последний час только несколько сигналов бедствия от мирного населения — ничего важного для текущей миссии".'
- guid: 131cf31a-a18d-41d9-9c7f-f9097674c28f
  text: '"Но... Кто это? Где же Теодора фон Валанциус?'
- guid: 134b9aa2-a53f-4c78-a0bd-708e3d1a448e
  text: '"Скардас, ты слишком разошелся! Мон-кай сейчас отправится к праотцам".'
- guid: 13536772-ef3a-4fd8-bc61-fea95475ca94
  text: '"Помогит..!"'
- guid: 135eeb61-6d99-414f-83e5-049f49a8c591
  text: '"Они хотели сжечь нас всех сжечь сжечь сжечь".'
- guid: 13639490-533c-4d4c-9c00-d12e526a1cec
  text: '"Безопасность Дитя на первом месте. Слава Дому Орселлио!"'
- guid: 136770d8-0f4e-4b04-9f46-282db0558059
  text: '"А слыхали вы про Смеющегося гонщика? Того, что каждый раз на арене гибнет, а потом здесь встает живьем и уходит..."'
- guid: 13a12485-eef0-4b26-b759-030cd2adf301
  text: Человек перед вами внимательно изучает инфопластину. Знак Священной Инквизиции висит на его груди.
- guid: 13a273ae-3ba1-40ac-96ea-a459ec63fd75
  text: '"Хватит тренироваться на чучелах! Отработаем удар на живой мишени!"'
- guid: 13bf9dbc-2e42-480e-987b-f56a7f2d9ddf
  text: '"Через два дня придут за долгом... да откуда мне монет-то взять, я после перелома и украсть толком ничего не могу!"'
- guid: 13fa4170-d16e-46d7-874b-7e3af6600893
  text: '"Кто посмел сюда вломиться?!"'
- guid: 14088d23-2d75-45a9-8234-67a4cef38ceb
  text: '"Количество преступлений на нижних палубах увеличилось в пять раз. Серфы как с цепи сорвались".'
- guid: 14139243-a0d1-4c6a-ad63-d2d22d60a694
  text: '"Оно говорит со мной, прямо в голове! Нет, замолчи!"'
- guid: 143cc084-3f1d-40fb-9a75-d80261ad8cf5
  text: '"А я-то думал, что охранять зону отдыха для богатеев — непыльная работка!"'
- guid: 144fc41c-2fed-467f-8c53-020f08e49042
  text: '"Император, защити нас от зла, что восстало над нами!"'
- guid: 14706558-e6e9-49f9-85a2-864c88a8049c
  text: '"Моя новая ступня при ходьбе издает странный звук. Так и должно быть?"'
- guid: 14933d46-f6f7-4daa-a1f3-6dafcb8da796
  text: '"Регент Ааронто Орселлио, уважаемая делегация. Вольный Торговец и протекторат фон Валанциус приветствуют вас — прошу, пройдемте за мной".'
- guid: 14e67a4b-85a1-449d-a1d7-fbded6c8130a
  text: '"Голоса шепчут, подсказывают... БЕРЕГИСЬ!"'
- guid: 14f28e3d-d620-4e0e-a24d-10fb2759ff1d
  text: '"...нас не страшат враги Человечества, ибо ни одному из них не суждено одолеть подлинных слуг Империума, готовых отдать свою жизнь за помазанников Его..."'
- guid: 1514d4a9-0528-4cd5-bf99-863fc3fbe8ca
  text: '"Судьбы здесь путаются, лица меняются… Кто знает, может к сумеркам сам{mf||а} себя потеряешь..."'
- guid: 151b8be1-4013-4f84-b44f-99eeb8b127c5
  text: '"Император защищает! А еретиков — карает!"'
- guid: 15479ec8-bff1-41b7-a9f9-6da058ebaa2d
  text: '"Слишком тощий. Пошел вон, тебе контейнер руки оторвет".'
- guid: 154d7be5-1718-4174-ae88-e4fc9008613d
  text: '"Было уже такое! Надо его повязать, он тогда вырубится, очухается и потом опять нормально работать будет... Только осторожно!"'
- guid: 157fa7f0-18aa-40bb-b7bc-7c99eb4ddc2f
  text: '"Эта бессмысленная возня меня изрядно утомила. Пора вернуться к действительно значимым делам".'
- guid: 15902329-3508-4f5b-9aef-46cfe2902c55
  text: '"Даже монстры неведомых секторов Паутины страшились ее и бежали прочь! Одиноко блуждала Сирлаэль, пока не заступил ей дорогу великий мечник, не имевший лица. Он жаждал ее испытать".'
- guid: 159a682b-66b3-433e-9deb-1383dcffadbd
  text: '"В работу священного механизма вмешались без должного почтения. Цикл обработки данных... увеличился втрое".'
- guid: 159e1460-b121-4a76-b5c0-be975216a774
  text: '"Я уверен, что мы могли бы договориться о... более элегантном применении моих талантов, Ваша Светлость".'
- guid: 15b46127-eb7e-437c-8be8-77156b951ce7
  text: '"Касание Той, Что Жаждет обезобразило даже самых малых детей Лилэтан... как глубоко проникла скверна?"'
- guid: 15c26df0-2e78-41d3-98db-fa33a6f0d430
  text: Пропустить фразу
- guid: 15d5826d-9448-4469-afba-ad48782cab43
  text: Висящий на конструкции труп с хрустом оборачивает к вам освежеванное лицо и мерзко хихикает.
- guid: 15f077f2-9d77-416f-b132-3380f91ae5d9
  text: '"У меня почти ничего не осталось, но я все отдам, только не убивайте!"'
- guid: 1608786a-d785-4fb2-9f64-6d322895ae11
  text: '"Шерин, не волнуйтесь, вы все делаете правильно! С удовольствием приму роль вашей преемницы, когда вас не станет".'
- guid: 161524e1-68a4-47e4-9b39-453aa7839bcd
  text: '"Иди сюда, головастик. Я покажу тебе, чего стоит Злоба".'
- guid: 16164e09-64c1-41cf-b53d-a8a2458b7b18
  text: '"Запись о преступлениях единицы {name} фон Валанциус против священных законов Омниссии занесена в каталог. Возмездие неизбежно".'
- guid: 161aabfc-2988-478b-99b5-bcff78fb6e3c
  text: '"Я понял... вы заодно с ними! Что? Предатели? Да, так и есть... Предатели заслуживают смерти!"'
- guid: 163407e2-9414-42bf-81ca-4d7a2b1b90b0
  text: '"Как бы ты ни прикрывал{mf|ся|ась} Патентом — я вижу тебя насквозь. Однажды ты оступишься, и тогда, можешь не сомневаться, я буду рядом. Карающей дланью Лекс Империалис".'
- guid: 1656d543-762b-40a5-9e8c-2f2c2d58ae35
  text: '"Звездорожденн{mf|ый|ая} спустил{mf|ся|ась} на огненных крыльях Бога-орла, чтобы помочь нам!"'
- guid: 165e7358-f97c-4e69-83ee-d44df94bb079
  text: '"Ну-ка вместе! Давайте, давайте! Искупление для одного!"'
- guid: 1702ba8b-16db-4fd9-909f-dcdc419010e5
  text: '"Давай же, новеньк{mf|ий|ая}! Посмотрим, кто нарубит больше голов!"'
- guid: 173ab9d6-fdc1-4366-bde5-d8b15514dcfa
  text: '"Не желаете ли напиток, Ваша Светлость?"'
- guid: 175eb8a4-10d2-4db7-a364-404b784e2cd0
  text: '"Благодарю вас за учение, мастер".'
- guid: 176ff325-904a-4e09-a360-5d5ab7abda11
  text: '"Некогда сие великое вместилище полнилось гулом сервомоторов и трелями священной электрики! Но духи машин покинули это место".'
- guid: 178cad3f-b6c4-4b4c-b761-bca81c489001
  text: '"Да не кочевряжься ты! Как там культисты смерти говорят? Твое время пришло и все такое..."'
- guid: 178e3632-a733-4afe-bb5b-a048cf330945
  text: '"Так-с. Посмотрим, чего тут можно наворотить аккуратненько..."'
- guid: 179c2839-4744-4ab9-a405-37c665e618b2
  text: '"Нас уже на суд вели, когда ребята господина Токара налетели и отбили нас! Храни его Император!"'
- guid: 179dda84-81f7-461a-90e0-92c249bca7de
  text: '"Покуда ты не оборвешь жизнь той, что запятнала Лилэтан скверной, нам не о чем говорить".'
- guid: 17a4b60b-f394-4f12-8cff-a0e2a1ff9072
  text: '"Не отставайте!"'
- guid: 17b050cb-4b78-44a9-acaf-920ce74981ad
  text: Панель управления не реагирует на ваше прикосновение — система заблокирована.
- guid: 17d6bd5c-a16e-4500-87fc-252a8a5735f9
  text: '"Возносите молитву смиренную к подножию трона Его, поминайте в мыслях своих Его, страшитесь гнева Его, преследуйте сомнения в Нем и восставайте против хулы на Него".'
- guid: 17e0d768-43b0-45e0-bccf-b5b0d12a96db
  text: '"Говорят, в теневых кварталах не все видит — он к нам спиной стоит. Кха! Ну вот, теперь и это богохульство замаливать. Доведет меня мой язык..."'
- guid: 17e41fa5-4de4-42de-adc5-bfc18ba2d8a6
  text: '"Значит, правильные вещи говорит. А еще от его благословений похлебка стала не такой мерзкой, так что пусть остается".'
- guid: 17f6c31a-ed47-41b8-b02c-af0da9aa4c55
  text: '"Мон-кай отравили сей мир, а затем мир их и сгубил. Что ж, хотя бы местные примитивные технологии способны избавить нас от схожей участи".'
- guid: 17f6fe48-4999-42c4-8616-20cbdf5380fb
  text: '"Стой, брат! Присмотрись — они тоже выжившие! Я позову наимудрейших, пускай старейшины решают судьбу пришельцев".'
- guid: 1836a6fc-9315-4e7f-b79a-5437b69273ef
  text: '"Прочь, тебе не место в реальности! Я не должна видеть тебя... не этими глазами!"'
- guid: 18555a0e-8b9e-4318-8eb8-a8bf9e3c07db
  text: '"Нет, я тоже это слышу. О, Император, как же громко он кричит!"'
- guid: 18909657-1a75-4112-bbe1-3f0ed5303eb9
  text: Дверь намертво заблокирована людьми Комиссара.
- guid: 195ff8d1-670a-4fad-b044-af4a0a2335b5
  text: '"Чтоб я еще раз доверился этому идиоту! Очередь из-за него пропустил, теперь опять целую даргонскую неделю стоять. Пусть возмещает убытки за простой торговли!"'
- guid: 197b51aa-8bd9-4f5d-9505-33319c9994ad
  text: '"Кровью еретиков должно омывать палубы флагмана! Как я могу служить Неумирающему, если руки мои связаны клятвой тебе, Домин''{name}?"'
- guid: 19c2411f-8e42-4821-b963-50b5d8eabc61
  text: '"Это животное пытается говорить со мной?"'
- guid: 19c7c620-c0f8-4c2f-964e-567d6cf5cd32
  text: '"Слава {mf|Его|Ее} Светлости Вольному Торговцу!"'
- guid: 19ca5e0c-c2cf-49a4-bdc6-499b28f7925e
  text: '"Периметр под контролем".'
- guid: 1a0b9f11-c0bf-4253-8b00-fd7ab86daa02
  text: '"От этого "алтаря" исходит странная энергия. Словно множество раз здесь проводили ритуалы, используя силы псайканы".'
- guid: 1a25e9fc-1d19-4921-b445-ff63ec9e4bc6
  text: '"Ты слишком торопишься. Сохрани свой гнев и следующую добычу заставь страдать много дольше".'
- guid: 1a7519ec-ccac-43fe-bb7c-ea5b8439f5ce
  text: '"Шерин, я здесь! Сколь радостно, что вы пришли! За мной, прошу!"'
- guid: 1ad36bbb-418d-486a-a553-cc8c4eb746e7
  text: '"Еще двенадцать часов... всего двенадцать часов — и я смогу поспать..."'
- guid: 1aefab81-2554-41c4-8c3e-2207238a6dc8
  text: '"Оказаться в центре расследования Инквизиции можете и вы, Вольный Торговец. Будьте осмотрительны".'
- guid: 1b17887f-42d5-4bdc-94de-29eb33569e7f
  text: '"В каком мануфакторуме куют такие машины? Колдовство какое-то, не иначе!"'
- guid: 1b21e1f7-6401-410a-95cb-9b3df88298d0
  text: '"Помилуй нас, Император. Я не дам этим богохульным мутантам захватить мой корабль".'
- guid: 1b501945-d5da-4ab7-a555-7e42e4a8f7bd
  text: '"За-а-а Императора-а-а!"'
- guid: 1b50d47d-4fbe-4383-a299-65affb7c3b52
  text: '"Да хранит Бог-Император Лорд-капитана, что вступил{mf|ся|ась} за нас! Еще чуть-чуть и руку сломали бы, семью кормить не смог бы".'
- guid: 1b69a5f6-d82b-43f1-8c27-66e3f2438734
  text: '"Да обагрит правление твое Кровавую паутину, Висирь!"'
- guid: 1b6e53bf-d3fc-430f-9cae-b056f476b804
  text: '"Ишь, какие разодетые! Важные господа, поди. Да только в этом Троном прокл... кхм, благословенном месте все равны".'
- guid: 1b73e474-b890-4e0b-a6cd-7ba865d1020b
  text: '"К сожалению, да. Наглость и болтливость — врожденные черты мон-кай".'
- guid: 1b85045a-b664-400e-95ec-e1101959eede
  text: '"При Владайме честному люду вообще житья не стало... зато всяким ублюдкам раздолье!"'
- guid: 1ba4ccf6-c74e-4d23-8f81-538ffdfc8d57
  text: '"Такого праздника у нас не было уже давно!"'
- guid: 1bb8b501-ae3b-403a-ad23-2be7b08274dd
  text: Неизвестная авария обрушила шахту лифта. Чтобы добраться до нижних уровней, необходимо прислать команду разработки.
- guid: 1c3eab03-97bd-49fe-997f-6c136798523e
  text: '"Херетек Паскаль, я свершу над тобой кару во имя Деус Механикус!"'
- guid: 1c558c4c-14bb-428d-a7fd-fdf0d7850c00
  text: '"Но не слишком ли опасно выставлять такую вещь во дворце? Вдруг она несет порчу?"'
- guid: 1c5da9a6-cb9d-4718-bcaa-9b124e33ff16
  text: Сквозь трескучее шипение вокса прорываются неразборчивые голоса.
- guid: 1c72c966-f24e-4261-bfa1-7eb6db54dfce
  text: '"Эээ, здрасьте, эээ, ваше вашество!"'
- guid: 1c930c1d-e418-4999-a67c-d48da726ad65
  text: '"Благородный господин, умоляю вас, отпустите... Я ничего не видел!"'
- guid: 1c94b94d-b3fe-421a-8e3e-08ce5baaa570
  text: '"Никогда не думал, что увижу эту палубу в таком состоянии..."'
- guid: 1d335d33-2898-4541-9762-a01b38f30c43
  text: '"Эй, ты! Знаешь правило? Положил руку или глаз на анверское добро — остался без руки или глаза!"'
- guid: 1d3a0bdd-1dc3-4b53-af31-9ddd601af20a
  text: '"Как я вас учил! Выстрел — попадание!"'
- guid: 1d5fca1a-71c0-429f-ba5e-b49e61cf0ef6
  text: '"Сегодня я вновь видел сестру. Она наслаждалась чьей-то кровью, как иные — вином. Я... тоже хочу попробовать".'
- guid: 1d8333d6-205a-4ccc-9d2f-9cedefe4ea11
  text: '"И пусть! Довольно мы взирали, как Валанциус попирает Кредо. Пора выжечь ересь из каждого угла его замка!"'
- guid: 1dbbc1b6-bbc2-4df2-af13-05d111dd94f4
  text: '"Проклятье! Все назад, это прорыв варпа!"'
- guid: 1dc22b78-3f51-41cb-a4d6-aec256c850e2
  text: '"Лучше уж тут тихо сгнить, чем подохнуть от непосильной работы".'
- guid: 1dd3b25d-e6a2-4943-99d8-18d10315d780
  text: '"Мы готовы к трансляции. Запускаем варп-двигатели!"'
- guid: 1e174176-2cf3-4e04-aa9e-a1802ec84ce5
  text: '"Ага, только я как-то слыхал, что он говорит... Мне хватило, чтобы больше никогда не вслушиваться в его шепот".'
- guid: 1e4b63a5-897e-41ad-a99d-93a8533451e6
  text: '"Довольно, мальчишка! Ты предал Дитя, наш Дом и саму Тисифону! Сдавайся!"'
- guid: 1e4bb6fb-3d79-4e37-9cd0-f93461f8f88b
  text: '"Проклятье овладело династией... горе, горе нам всем!"'
- guid: 1e5040a0-bdba-474a-9313-77e0658224cc
  text: '"Вдруг и меня завтра убьют? И знать не буду, за что".'
- guid: 1e63fa73-4ec0-4a8a-809c-82a44b090fa4
  text: '"Священная земля. Священное место. Священные предки. Этот слуга богов и родичи его приносят дары и возносят молитвы правителям былого, дабы процветало племя под огненными крылами Бога-орла".'
- guid: 1ef88fa0-43dd-4a09-bc6e-4615f8751f38
  text: '"Именем священной Инквизиции, приказываю пропустить {mf|сего господина|сею госпожу} вперед! Во имя исполнения священного долга перед Империумом".'
- guid: 1f01f4f8-cf16-49c6-a32c-27a5c259cecf
  text: '"Надеюсь, вы можете позаботиться о себе сами. Все силы арбитров направлены на подавление бунта — мы не сможем оказать вам поддержку".'
- guid: 1f15f779-379a-44a6-b24e-f5b128005312
  text: '"Продам местечко в очереди — спешите приобщиться к благословенной Капитанской похлебке! Придает сил, недуги снимает, здоровыми будете как Лорд-капитан!"'
- guid: 1f83c1a1-af73-4adf-9aee-ce8f0a579676
  text: Крепко сжимая в левой руке паяльник, жрец неспешно приваривает контакты импланта в правой руке к приборной доске.
- guid: 1fb809eb-0119-48be-ae0f-4bfd6eb39b7e
  text: '"Вот когитатор, о котором я говорила, шерин. Надеюсь, мы сможем его включить".'
- guid: 1ff64dc9-633e-4d5e-9a4a-73c529e2bcd5
  text: '"Прочь, Кошмары! Гореть вам в Его карающем пламени!"'
- guid: 203263a1-9982-44fb-a8d8-509e490fe838
  text: '"Госпожа Кассия, Его Светлость прибыли по вашему приглашению!"'
- guid: 2039d532-7e0d-48c4-88bc-057da54289e4
  text: '"Держись, соратник! Ты еще оклемаешься и прикончишь сотню ксеносов во имя Императора!"'
- guid: 203e40f3-ec87-4e29-a87d-c7ed510060c6
  text: '"Говорят, при Парсимусе Девейне всем жителям Футфола давали по ящику ротгата каждый месяц!"'
- guid: 206d7a15-2d99-4ef9-b11c-b40ff5931b47
  text: '"Тебя зовут Лордом Капитанов — это что-то вроде Владыки Перемен, да? Не терпится принять участие в твоих махинациях, почтеннейш{mf|ий|ая}!"'
- guid: 20baed9c-bc5a-406b-b7fe-f450e5a24db0
  text: '"Представляю. Ты вылакала уже вторую бутылку".'
- guid: 20decf00-9230-441b-8ea0-028711919c2f
  text: Под покрасневшей кожей эльдарки проступают линии, похожие на вены. Но это сеть подвижной проволоки, проникшей внутрь и взрезающей плоть Ирлиэт.
- guid: 20f2cc2b-64a7-4904-9a6f-9f111bc6ffdf
  text: '"Отпустите меня! Ты л{mf|жец|гунья}, Торговец! Л{mf|жец|гунья}!"'
- guid: 20fb1edd-73a9-46b6-8374-6630eef7443f
  text: '"Это еще что, приятель. Только первая партия! В варп, сегодня все мои троны уйдут на настоящий пир для семьи. Поднимем тост за фон Валанциусов. Ты тоже приходи, и детишек приводи".'
- guid: 2103f250-f4b0-455f-8f15-9499d201b53d
  text: Хотя вам удалось обезвредить бомбу, бедолага скончался от глубоких ран — из-под его одежды вываливаются окровавленные кишки. Чудо, что он вообще так долго продержался.
- guid: 2109a3f3-ca09-42b0-a756-5782433103b3
  text: '"Подозрительно... Но эта тварь не кажется агрессивной".'
- guid: 210d3304-4354-4dc5-b528-a0d1389d6d2b
  text: '"Пс-с-с! Не в ту сторону!"'
- guid: 2136ada3-23bf-4abd-9e4a-642e1a116bf4
  text: '"Кто здесь? Кто говорит со мной? О духи машин, вы ли это?"'
- guid: 2147fe96-8c9c-4bdc-9354-a56a5af02dc9
  text: '"Прислужник СК-291, по завершению смены вам назначено... пять... ударов плетью за... нарушение пункта протокола пять-три-девять-точка-шесть-два...".'
- guid: 21492ba8-d3d1-440d-a317-aefbde981c9d
  text: '"Сержант, зачем? Мы уже проиграли... какой смысл?"'
- guid: 215395c9-d60b-4671-80f2-ee7c609c7ac4
  text: '"...фиксирую. Дверь шлюза не поддается командам, открывается и закрывается без команды оператора. Есть погибшие".'
- guid: 21c618c0-68e9-4819-beec-942ab91d6e5f
  text: '"Грязно{mf|му|й} мон-кай пора поделиться своими страданиями!"'
- guid: 21d61ff6-4360-4b61-8d85-636af81d5c66
  text: '"...И прошептал Неумирающий Император: "Благородных ткачей нарекаю вестниками воли своей в пустоте меж звезд..."'
- guid: 21fe1d23-8fab-4aaa-b97c-cfb4140d2ee7
  text: '"Валим, валим, пока {mf|Его|Ее} Светлость не разгневал{mf|ся|ась}!"'
- guid: 2208023f-acc6-4a72-8d88-544c699f3862
  text: '"Кхе-кхе... отчалил наш старик Денз, такие дела..."'
- guid: 222e686a-ece1-4350-b213-92528a85264d
  text: '"Предатель{mf||ница}! Я разрублю твою дурную голову и умоюсь кровью фон Валанциус! Черепа трону Вольного Торговца!"'
- guid: 22782c55-1849-43d9-98fb-d3613cfc3cf7
  text: '"Извлекаю данные когитатора... ошибка в данных. Погрешность составляет ноль целых шестьдесят пять тысячных. Необходим аудит и перерасчет материалов за двенадцать циклов".'
- guid: 22f3fb07-5265-4deb-8c14-7dfe4cd07cca
  text: '"Установка качественных аугментов значительно повышает эффективность любой биологической жизнеформы".'
- guid: 23066e17-b2b9-4365-ab63-ad4b0d81b62c
  text: '"Когда-то бы тебя лишили Истинной плоти за такие речи. Благословен будь тот день, когда Фабрикатор-Цензор избрал нас для нового пути!"'
- guid: 230751af-6448-4847-a8f7-d47efa1022df
  text: '"Вперед, чистые! Сокрушите тех, кто противится пришествию Многорукого Императора!"'
- guid: 2342622e-fb03-4442-8e67-238de386bc60
  text: '"...обращается Лорд-капитан, чьей династии каждый из вас поклялся служить до последнего вздоха. Да не оскудеют ваши души на рвение и огонь, что питают ненависть к врагам Империума Человечества..."'
- guid: 234a30f6-9b37-4ded-8975-317d71fe6527
  text: '"Смотри, доча, какой я тебе гостинец добыл. Это лакомство с Януса, называется "суха-фрут". Кушай на здоровье!"'
- guid: 2365556d-5eb9-4c5f-a87e-51dc56d85e24
  text: '"Фу... на нижних уровнях воняет даже хуже, чем я представлял".'
- guid: 237872f5-30a3-4eaa-a490-8e6ae160f6a0
  text: '"Каждый Версериан положил жизнь на служение династии фон Валанциус. Мы не предаем наши идеалы".'
- guid: 239deacd-27e7-4a6e-83e0-03a5630fa4d4
  text: '"Я не жрал несколько дней..."'
- guid: 23b2e049-de64-474f-9f72-1e08d43b300f
  text: '"Да. Исправим тебя!"'
- guid: 23bf6178-4dc5-4c25-87d1-662e7d5e069b
  text: '"Треснувший сундук изменил ожидаемый результат. Итог: демон. Уровень угрозы: максимальный".'
- guid: 24033682-2228-4e51-993b-e5bd8d974bcc
  text: '"Пощадите, умоляю!"'
- guid: 24656732-f058-488b-8408-844b7ef6186f
  text: '"Лорд-капитан, дознание идет полным ходом. Мы найдем негодяя!"'
- guid: 2469cf6f-df67-4fc6-b41b-d70f1d98642a
  text: '"Будь точен. Если повредишь медузу — следующая будет пить уже твои грезы".'
- guid: 2486e7c7-3c12-4645-8b65-d3aaff9eaea9
  text: '"Исповедь облегчает душу, не правда ли, сестра? Чувствуешь, как бремя стыда и позора на твоих плечах стало капельку легче? Пойдете с нами, в исповедальные камеры. Я помогу вам снять с себя тяжесть ваших грехов".'
- guid: 24a7b705-bd2f-4706-b509-6e198492f7d7
  text: '"Живущие-в-лесах приветствуют посланни{mf|ка|цу} звезд!"'
- guid: 24bc5a31-72af-4611-a878-c1e85c3418b5
  text: '"Владыка Галактики простил наши грехи! Звездные посланцы спустились с небес, чтобы спасти нас!"'
- guid: 24cb2ae8-4990-4e20-be96-a83b3ab35c64
  text: '"Смерть шепчет твое имя, Висирь! Смерть приветствует!"'
- guid: 24f3a39a-b6a7-4f57-9b2b-abba767d72f8
  text: '"Все достается лишь слугам бхугара... Надеюсь, хоть парочка мон-каи вылезет наружу и попадется нам!"'
- guid: 251105f1-3d6d-438b-96e7-4c9bc1d5dc4c
  text: '"Владайм — кремень, не то что предыдущий наместник!"'
- guid: 253a5c5c-0a3c-45ad-a3d9-e59baa209afa
  text: '"За семьи, за мир, за честь!"'
- guid: 25601e24-9f5d-4c76-80ee-295bec704d88
  text: '"Надеюсь, однажды ты угодишь под поезд!"'
- guid: 256e396b-ba77-429b-a4d8-3809016dd3a4
  text: '"Другие меня уже вдовой зовут и сервиторской женой, но я знаю — ты еще здесь, родной. Ну хоть взгляни на меня..."'
- guid: 25abef6f-daa9-41d2-909d-7421c3fd73aa
  text: '"Кошмар, стоило Лорд-капитану благословить котел, как набежали всякие проходимцы! Так ведь и всю похлебку слопают, и что тогда?"'
- guid: 25d2dd15-4b78-4edd-a81e-1ecd4008c7e0
  text: '"Тьма уже пустила корни в твоей душе, и этого не исправить. Но ты все еще можешь принять ее — и запечатать глубоко внутри. Борись! И не поддавайся ей впредь".'
- guid: 25ec17c0-24c0-472b-a9ea-8c1d1e38fbcf
  text: '"Что ни утро — кого-то не досчитываемся... много еретиков на Футфоле укрывалось! Ну теперь-то всех разгонят..."'
- guid: 260fdde8-d0ef-4e50-a59a-5fda79242d08
  text: Любые попытки обратить на себя внимание бесплодны.
- guid: 2629a4df-6825-4873-bb0e-b6bff2bd63f1
  text: '"Ваша... Светлость наверное желает выслушать... доклад?"'
- guid: 2647bb5b-a177-4d4a-857a-b883a9c36c6c
  text: '"Мое почтение! А также уважение!"'
- guid: 268b2936-4999-4409-aa62-5b7ea8d87bd8
  text: '"Когда сюда Винтерскейл с парнями захаживал, никогда без мордобоя не обходилось... Прямо интересно теперь, как вы развлекаться будете!"'
- guid: 2699e9ce-8f27-451a-9e6d-de3860150eab
  text: '"Гляди, сам успокоился! Такого с ним раньше не бывало. Чудеса..."'
- guid: 26c6beeb-eaf5-4552-8e7c-ce7aca9fc9ea
  text: '"Не трясись! Я целых два раза видел, как техножрец это делает. И один раз даже кадило ему подносил! Послушаются, как ми..."'
- guid: 26d6f1b7-0f2d-4525-b1ad-0e846cea4e7c
  text: '"Император защищает!"'
- guid: 26db1066-8c0f-44ed-a922-91cfcb17a1c2
  text: '"Еще одна метка. Ха, Вольный Торговец, кто-то явно хочет поиграть с тобой".'
- guid: 26e7d984-d9aa-4bf2-a4ce-8962d94e645b
  text: '"Как тщетен и тщеславен тот, кто надеется, что спасет свою душу подачками!"'
- guid: 2735a200-5da9-447b-9b67-d6191e55e5be
  text: '"Стоять, приспешники Тисифоны! Чтобы остановить вас, нам пришлось вновь объединиться с ксеносами... Пусть так. Небольшая цена за гибель проклятого Дитя".'
- guid: 278695eb-b16b-4dd5-9fa4-baa9f0a99666
  text: '"За прошедшие двенадцать циклов производство улья Шаргара выросло на одну целую триста восемьдесят пять процента. Необходимо сопоставление с данными архива".'
- guid: 278e6ac7-146c-48e5-ba38-36f0757a7d1d
  text: Едва слышные стоны доносятся из разбитого рта. Мольбы это о пощаде или о скорой смерти — разобрать невозможно.
- guid: 27a2d659-be2b-41a9-87ee-00264bea1fed
  text: '"Не касайся этого порождения вуали. Оно — обман, элантах".'
- guid: 27a5ae57-c7bd-45f2-ab9d-5e7f2c0e9d23
  text: '"Я знаю людей, готовых заплатить хорошие деньги за подобные диковинки..."'
- guid: 27c9a9cf-da10-45a2-a705-3317ff9349f2
  text: '"Благословенный день для торговли!"'
- guid: 27d1e451-40ba-4728-aa26-0bda297e00c5
  text: '"Да направит стопы мои Император и Друз-Воитель!"'
- guid: 27d2ec44-0b33-45c4-8949-5ac121f03f01
  text: '"Фенрис фэйрир морд! Хейдур Расс!"'
- guid: 27e328d2-ef83-475d-bbee-8794a6b01038
  text: 01010000 01110010 01100001 01101001 01110011 01100101 00100001
- guid: 286f9d1b-9780-463f-b389-06440b08932a
  text: '"Служу Лекс Империалис!"'
- guid: 28b10878-aa15-4c91-b3c4-593862b24e0a
  text: '"Мы держим данное слово, мон-кай. Смерть пробуждается, война зовет!"'
- guid: 28d5120d-8f03-49e2-b5f7-e43415bca52c
  text: '"Вихерд не слушался хозяев, и хозяева съели Вихерда... Я буду слушаться!"'
- guid: 28d8e070-8422-474e-b6d7-9fe334d746de
  text: '"Обратитесь к карте системы в центре мостика, чтобы отдать приказания команде".'
- guid: 28e904fe-4d17-4982-99b3-cf86f1760231
  text: '"А-а-а! Хватит! Вы же сказали, мы теперь товарищи!"'
- guid: 29021e13-ef7e-40ff-9814-9f4550451539
  text: '"Слава династии фон Валанциус! Император защитит!"'
- guid: 2930baa7-54e9-48a0-9256-84bf400f54a3
  text: '"Узрите, братья и сестры, свежатина высшего сорта сама пришла к нам в руки!"'
- guid: 2956fa62-96e4-499f-843d-24c75e7b3198
  text: '"Разрешите доложить! Мы получили предварительное заключение о последних инцидентах".'
- guid: 296b5129-e79c-43f0-b1b7-ddc8ceba48ec
  text: '"Лорд-капитан, они нас в упор не замечают. Что, во имя Трона, здесь творится?"'
- guid: 29876ced-7f10-4a6a-8917-c842e618cc78
  text: '"Эх, жалко простых работяг... Но ведь если сунусь помочь, меня к ним в трущобы и выкинут".'
- guid: 29955079-5bfe-46b6-9998-afeef7f17ebc
  text: Звуки закольцовываются в страшную петлю самоповтора, со скрежетом смешиваются, становятся высокими и острыми, словно зубья пиломеча, и рвут слух.
- guid: 2997e52e-6222-4766-b1af-5ef642a4044b
  text: '"Поразительно сложные оттенки! Жители верхних палуб восхитительны..."'
- guid: 29bd29a3-4ea9-4d73-8989-03ccaf3211b4
  text: '"Моя бабушка ходила сюда каждый день и каждый раз брала новый талон, но не использовала его. Один из них достался мне в наследство — храни бабулину душу Бог-Император!"'
- guid: 29bfa005-36d8-44e0-be15-1af328ca0c95
  text: '"Боженька наш понимающ и заботлив к чадам Своим, и в глазах Его вы все чисты. А эти изуверы-белорясники, что вас корят да стыдят, недостойны даров Его!"'
- guid: 29c5c691-e969-4f1b-b42a-29fc43692dd0
  text: '"Когда напитывался моей силой, убивал меня... Что ты чувствовал? Тебе понравилось?"'
- guid: 2a01562a-060b-49c0-806f-b2c80f3e9590
  text: '"У моей жены грыжа вылезла — можно ей на кухню?"'
- guid: 2a02430c-c249-44f6-8b1f-258b6f6bfa94
  text: Вы склоняетесь над бойцом — и успеваете заметить спрятанную под телом взведенную мину.
- guid: 2a19cc87-6920-4532-aa4c-68a12b4cb0c1
  text: '"Ох ты ж... это тот самый бедолага? Которому анверы язык отрезали?"'
- guid: 2a2a0fe9-7f4c-4224-b976-0fbe8665f64c
  text: '"Данный бункер находится под контролем Арбитес. Удобств вам не предоставлю, но безопасность внутри периметра гарантирую".'
- guid: 2a62fade-7e3d-43f4-bf57-cd1aabeadbdf
  text: '"Я слышу шепоты... Они зовут меня забыться долгим сном..."'
- guid: 2a7b8b2f-f18e-4fc3-a2db-a05adbcd99db
  text: '"Кхе-кхе".'
- guid: 2a899c07-9c21-4cce-95ac-65058ff9e212
  text: '"Солдаты, врубаю вышку! Искупление для одного!"'
- guid: 2a95d47b-3203-445b-8b70-768b18829b2e
  text: Вы узнаете обломок на постаменте — это тот самый загадочный артефакт, украденный Тразином Неисчислимым из покоев Вольного Торговца.
- guid: 2addc247-da94-47ad-8655-61d6bb9fb7f7
  text: '"Ч-что это такое? Неужели... Атлас?"'
- guid: 2af76c7c-af2f-4938-8f71-0539b3b4c0d4
  text: '"Шерин, я тут подумала. Нельзя просто бросить здесь эту... ксеноересь. Позвольте моим ребятам избавить вас от грязной работы, ну а я в долгу не останусь".'
- guid: 2b109ec2-e933-421a-911f-5abc40c1ba4d
  text: '"Я тоже это слышал. Захлопнулась, распахнулась и снова захлопнулась — передавила в кашу тех, кто сквозь нее шел..."'
- guid: 2b1ebc9c-bcf7-4877-8cb0-0d63196c3459
  text: '"Храни вас Император! Я был в шаге от гибели!"'
- guid: 2b3ffcae-e125-4d02-acdd-cdcaf80efe29
  text: '"Помогите... Больно..."'
- guid: 2b742384-5dc4-41f0-8e97-70b4129e0cff
  text: '"У нас получилось, элантах! Пока твой мир напоминает реальность, но вскоре ты научишься погружаться глубже".'
- guid: 2ba839b7-97ac-44aa-954d-740488706d1d
  text: '"Император защищает, Лорд-капитан!"'
- guid: 2bab45fb-5441-41d3-8b7d-4d2d573c3ac7
  text: '"Надо обоймы пересчитать. Последний час только и делаю, что стреляю без перерыва..."'
- guid: 2bb45c25-53fa-4f55-ad35-a6137c01ec9d
  text: '"Пускай и по-своему, но жители Кетца Темера верят в Бога-Императора всей душой. Но Адептус Министорум наверняка посчитало бы подобное поклонение ересью".'
- guid: 2bf51645-aa25-4500-8184-87ed6cb401d8
  text: '"Пощады! Я сознаюсь в чем угодно, только перестаньте бить!"'
- guid: 2c041c07-2b0a-49c7-9403-d117214e387f
  text: '"Ох! Со мной сам{mf||а} Вольный Торговец заговорил{mf||а}! Кому расскажу — не поверят!"'
- guid: 2c249ffb-225b-48e4-ae16-af5f94b7f159
  text: '"Мы проведем тщательный осмотр каждого из поддающихся аугментации органов в вашем теле, Лорд-капитан, и заменим наименее эффективный".'
- guid: 2c7f3333-3b84-4aa0-933f-20986e2c7aaa
  text: '"Как ты думаешь, обитатели этих забытых систем могут страдать? Надеюсь, да".'
- guid: 2caea827-f1df-4361-ad18-6ee59d470ce0
  text: '"Ах ты ж... Тревога! Убить чужаков!"'
- guid: 2cb99dd8-6178-46f2-a74d-4bcc2ff1cbd9
  text: '"Обычные мон-кай недолговечны. В этот раз выжил{mf||а}, завтра Кровавые прозелиты выпотрошат".'
- guid: 2cbde046-8695-4603-a52b-8defad5f311d
  text: '"Успейте купить свежее! Не проходите мимо!"'
- guid: 2ccfa21d-488d-498a-aca7-c975c59ce0a8
  text: Раздосадованный блюститель яростно тискает рукоять дубинки каждый раз, когда серф не может ответить на вопрос, но сдерживается.
- guid: 2d2a2b71-b399-457a-97e2-ebe25768f7b0
  text: '"Бремя ответственности лежит на твоих плечах, элантах, но дух притупляется от утомления. Сбрось же оковы усталости".'
- guid: 2d3bec73-f3b8-45f8-beef-379bfe55dac8
  text: '"Госпожа Клеменциа... Она не допустит нашей смерти, правда?"'
- guid: 2d473900-6eef-4bdf-80aa-0f49943aaaec
  text: '"Губители душ вернулись! Кхейн, наполни яростью наши сердца!"'
- guid: 2d539aab-fa3d-4555-a0ce-c0774a67165a
  text: '"И запомните: мы все попадем в длани Неумирающего. Потому ступайте без страха. Потому разите без сожалений!"'
- guid: 2d54439e-8d74-4265-8521-fca38e76ea38
  text: '"Может, при установке что-то напутали?"'
- guid: 2d8d2c0b-6914-45b8-bb81-cd35cd724066
  text: '"Стреляйте, {name}! Стреляйте, и не дайте ему подойти к вам!"'
- guid: 2d9446b7-26eb-43bf-a4ff-a4f061be3866
  text: '"Шерин, используйте укрытия подальше от бочек!"'
- guid: 2da46228-bba8-4665-818f-11e4f4805962
  text: '"Чем могу служить?"'
- guid: 2db0358c-d451-4a09-b946-d0bb9245f338
  text: '"Сюда! Помогите, ради Императора, я ранен..."'
- guid: 2dbb0e88-b6bd-473a-8d2a-39bfdcd301e0
  text: '"Источник боли... виден, осязаем. Ощущается... ничего не ощущается".'
- guid: 2df910f7-0be2-47c4-9b77-b6805785bfe5
  text: '"Кровью врагов причащусь, яростию веру напитаю и снова отправлюсь в бой — пожинать смерть неугодных".'
- guid: 2e27bd4b-a205-4f0b-91b2-305be853688e
  text: '"Если бы эта вещь была опасна, стали бы ее выставлять здесь..."'
- guid: 2e44b7f5-db3c-43ac-97c9-581e4361a214
  text: '"Спасибо господам офицерам, послабление ввели — каждые четыре часа можно десять минут передохнуть!"'
- guid: 2eb6c9ff-fa75-4255-8f4f-4e7eb206b464
  text: '"Не открывается! Проклятые еретики заблокировали дверь — не иначе, чтобы помешать праведным!"'
- guid: 2ed967c4-39a2-4758-8987-ee43616ea34f
  text: '"А теперь пош{mf|ел|ла} вон, мон-кай. И передай Тервантьясу, что он заплатит за это оскорбление".'
- guid: 2ef065db-aec6-48c2-b102-4e2ebf70217d
  text: '"Эй! Куда делись все слуги? Я хочу вина".'
- guid: 2f0063e8-31fa-4e7d-9112-0bebc4a09988
  text: '"Опять свечи потухли у тридцать четвертого... Надеюсь хоть в этот раз не придется с них психический лед соскабливать".'
- guid: 2f5b948f-fa4c-4a1d-82b8-280b07baed73
  text: '"Не трать больше время на эту тварь, Вольный Торговец. Она уже явила свою лживую суть".'
- guid: 2f689d70-df8c-400a-8643-2a6e78bf1d90
  text: '"Прими служение верных слуг Твоих, даруй отдохновение трудящимся во благо Твое..."'
- guid: 2f7d0002-dd97-4890-a3b2-ca3f3ea1b5e2
  text: '"Ты еще что тут забыла, девочка? А ну кыш отсюда!"'
- guid: 2fa0dd92-c7f8-408b-8457-fc33fc137f7a
  text: '"Что... это такое?! Голоса все вопят, рыдают, задыхаются — перед нами воплощенная смерть!"'
- guid: 2fa9ca0a-a57e-4239-94a7-e3bfe99ee6ed
  text: '"Как? Почему?"'
- guid: 2fdfbcbb-391c-42b5-9d82-bee3d061837f
  text: '"Следы охоты Каллигоса Винтерскейла, я полагаю".'
- guid: 2feaf3a7-e5e9-4e48-95ff-0e1532fa12e4
  text: '"Да настигнет тебя очищающее пламя!"'
- guid: 2ffe82bf-c1bd-4848-b293-8fded25c8e70
  text: '"Следственные мероприятия не должны мешать бдению над священными механизмами".'
- guid: 2ffe88bf-9a1b-4b95-801f-6d0609405ba6
  text: '"Ах ты мразь! Я ведь знала, что не может так везти!"'
- guid: 301ac31a-ca0e-41ab-9c42-3ac0ef67a2a6
  text: '"Это невозможно! Дочь моя!..."'
- guid: 301bc9c5-d332-42ea-b02d-bc54daf65c03
  text: '"Ну я это, тогда вперед пойду. Да хранит вас Бог-Император!"'
- guid: 30212058-3b67-4032-85e2-47e940ca495d
  text: '"Дубины и плети, сэр!"'
- guid: 3033e268-3a9c-4b2a-bb13-b1087d7bc249
  text: '"Лучше умереть. Лучше просто умереть, чем жить так!"'
- guid: 3035b643-b281-4259-a4e3-8472ac2453fa
  text: '"Жалкий червь, как смеешь ты пререкаться с хозяином?"'
- guid: 304908a4-4d6c-4d1f-b46c-c98d7d3d8ec5
  text: '"Неужели мои глаза изменяют мне? Объяснись, элантах. Почему в твоих покоях таится осколок Крудараха?"'
- guid: 307717a0-1fb0-4261-82cb-42a1681c9a9c
  text: '"Тогда и нам стоит быть там. Уверена, что благословенн{mf|ый|ая} глава династии фон Валанциус также захочет присоединиться к их беседе".'
- guid: 30b083be-386e-4cd7-8a38-dbb2288183c6
  text: '"Никчемная шваль! Кем ты себя считаешь, гнида?!"'
- guid: 30dc90cb-e9e6-4ceb-a6e9-b0dc2699e871
  text: '"И они дождались каждого последнего шаттла! Каждого! Никого не оставили!"'
- guid: 30ed6cb9-402e-420b-be43-2b554255689e
  text: '"Это просто кусок колонны, обвешанный побрякушками. В нем нет ничего божественного или мистического".'
- guid: 314fa6d5-7c6a-4819-b2b4-d2a57f25c5c9
  text: '"Вещь должна быть покорной! Вещь должна исполнять приказы, а убивать только приказы!"'
- guid: 3198ba59-9c59-4c9b-8014-cea025080040
  text: '"Лживый ты кусок фекке! Смеешь глумиться над сынами Фенриса? Xочешь крови нашей отведать? Так подойди и отведай!"'
- guid: 31cd932a-414a-43c3-a6e7-77df524bd4fa
  text: '"Вероятно, часть улья питает остывающий геотермальный узел. Но я бы не надеялся найти здесь выживших".'
- guid: 31f068c1-f2c9-4a3f-80e8-377ce40ec223
  text: Плотный полог занавеса пытается оттолкнуть вас, выпихнуть прочь с неожиданной для бездушной тряпки силой.
- guid: 321091ab-0cef-4f25-954d-623c9b6d7ccc
  text: Слуга исполняет замысловатый жест, явно призванный сообщить о вашем прибытии.
- guid: 32273709-1c5f-4bb2-8d2a-8153f523005d
  text: '"Необходимо избавить мир от ксенотеха, что порочит учение Бога-Машины и саму суть Его законов. Если позволите, мои сервиторы позже очистят это место".'
- guid: 3244d2e7-b9cd-44b5-9359-e552fb444286
  text: '"Лорд-капитан! У нас тут непредвиденные неприятности..."'
- guid: 32663ccb-d177-4654-bff9-caf461482cab
  text: '"Раз это — трофей Вольного Торговца, владевшие им ксеносы уже либо мертвы, либо порабощены. Ты кого больше боишься, мертвых нелюдей или невольников?"'
- guid: 32a8d88e-0129-4869-92d5-f321df059fbb
  text: '"Пока реликвия пребывает во власти династии Вольного Торговца фон Валанциус, что спас реликвию от гибели. Куда употребить могущество реактора — на {mf|его|ее} совести".'
- guid: 32fdd0a1-266d-43c5-b00f-ff31231b3df5
  text: '"Ваш кормчий, Равор, между делом провел меня по палубам. Великолепный у вас корабль — "Страж Бездны" с ним рядом не стоял. Но я все равно скучаю по той старой посудине..."'
- guid: 33009715-676e-4ad6-b606-233db82a20a8
  text: '"Хвост грокса! Опять спину надорвал".'
- guid: 3355201f-3dd2-4c29-b1c2-01a8c1962083
  text: '"Я едва могу дышать в присутствии такой значительной особы!"'
- guid: 3369f524-ad50-43bc-b14f-66f09058dd09
  text: '"Ну вот, а ты ныл, что нам вилы! Сами Адептус Арбитес к нам на подмогу пришли! Видел их щиты? А пса того железного?"'
- guid: 339bca09-bde4-4ae3-964b-705a87ad91a0
  text: '"У вас ко мне дело?"'
- guid: 33a769fd-c320-48ab-9c85-ecb57ebf5cf2
  text: '"На перегоне 00-1-02 снова помехи".'
- guid: 33afa608-090e-4f45-a730-94779ef98086
  text: '"Убереги нас Трон... Что здесь случилось?!"'
- guid: 33c38e37-aaf1-4103-bcee-de3db1247c5e
  text: Позволяет перейти к следующему варианту ответа в диалоге.
- guid: 33d07bd3-28d8-4015-95fa-9ec1a3ab4e75
  text: '"Создания эти были когда-то столь робки и скрытны... неужели семя зла проникло и в них?"'
- guid: 33df5409-88dc-4bc4-98a7-71917ffdf58b
  text: '"Уж не знаю, зачем вы здесь, но хоть бы не по мою душу..."'
- guid: 33f10b1e-bd04-427b-b6d3-9100a8cb6974
  text: '"Император защитит..."'
- guid: 33f65257-2051-41eb-aa84-070ada974682
  text: '"Кшер-мон''не, мон-каи. Полуживым ты тоже сгодишься".'
- guid: 340f3716-928b-4cec-845f-62de118b98f8
  text: '"Сейчас, братцы! Позову подмогу!"'
- guid: 344bbfb2-e561-4ff0-841f-eafba976282a
  text: '"Позвольте поздравить вас со вступлением в наследство".'
- guid: 34833e80-af9e-4f3c-ad1d-97445abb336f
  text: '"Принято. С большей вероятностью ключевые для нас объекты пали. Действуем по протоколу М-Н-23".'
- guid: 34834f00-f971-4ce3-9f56-e4b037d3345c
  text: '"За мной, Купец Бездомный, поспеши!

    Не будет газ безумства вечно в силе!"'
- guid: 3489650b-d32c-4170-a9ac-8f31fcad9ae5
  text: '"Да возобновится бег шестерней, да напитаются батареи благословенным ядом ирреальности, да будет проложен вектор".'
- guid: 349f5baa-3e28-4592-ac70-c0d699085fd9
  text: '"Культистка смерти здесь? Так и знал, что надо было сегодня сменами поменяться".'
- guid: 34aba8bc-9654-4480-9bcc-1bacaf1e2c45
  text: '"Атмосферные датчики указывают на наличие неизвестных примесей. Высокий риск заражения".'
- guid: 34ed5c16-97e6-4a20-b7a4-8c5dc8bcebc0
  text: '"Святой механизм ниспослал откровение — фиксирую сообщаемые координаты на одном из миров системы Одиночество Пелиона".'
- guid: 35030e74-b1e5-4891-ad89-e6f93d80cad0
  text: '"Честь имею!"'
- guid: 351b0585-3475-4ca9-b209-559a30c1c1f8
  text: '"Как же меня достал Алый! Ни пожрать без разрешения, ни морду набить без молитвы!"'
- guid: 352af9a0-53c6-4fe7-b396-23efe0570bd0
  text: '"...обратите взоры к сему предмету, облеченному особой значимостью..."'
- guid: 35320dbd-3362-4f81-9b5b-80bb770ca5ef
  text: '"К оружию! Целимся в стены или пол — внешнюю дверь быстро не снести!"'
- guid: 355e2ad5-be22-4f32-8cb5-4f84fc68e36f
  text: '"Ну и мерзкое местечко, словно кракен отхаркнул. Не трожь тут ничего, воняет заразой".'
- guid: 356ca253-1b67-4481-a652-411ed1017b3d
  text: Простолюдинка вжимается в стену и что-то бормочет под нос.
- guid: 3574d9f4-b245-4d4f-9947-b11b8517beed
  text: '"Это еще что такое?"'
- guid: 3585b2e3-34c0-455c-b53f-e028f9a23332
  text: '"Если переживу все это, брошу пить, клянусь! После того как выпью за новую жизнь, конечно же..."'
- guid: 3596dfcf-5fe6-4b9d-8d3a-ffc337d280b2
  text: '"Зафиксировано нарушение. Сбой в центральном процессоре. Сбой в центральном процессоре. Сбой..."'
- guid: 35a97328-a593-4527-b2d2-3eaa80c0a0b6
  text: '"А я все же попробую прошмыгнуть. Вдруг не снизойдут!"'
- guid: 35ad27e1-561c-4fb3-8824-9600648790bf
  text: '"Ай, {name}, голосочки мои заныли, что быть крови..."'
- guid: 35bb413a-ff3a-4aea-8dd0-1eaf45b9779a
  text: '"Вот теперь заживем! Говорят, склады ломятся от питбрикетов — всем, даже теневым хватит!"'
- guid: 35ced39f-1286-42d9-bb8b-4df147189e1f
  text: '"Это сколько же людей на планете погибло? Ох, Император защищает..."'
- guid: 35e76187-64d6-41ea-acd8-b04da3f6c503
  text: '"Видишь ли ты себя теперь, элантах? Так{mf|им|ой} же сияющ{mf|им|ей}, как видят тебя другие?"'
- guid: 36007b52-657f-4af0-8dc2-3c00845f6c69
  text: '"Освободись от тяжести бесполезного груза, элантах. И позволь спокойствию наполнить свое естество".'
- guid: 3627b0bd-6ab9-482d-a25b-0195fef2cacc
  text: '"Лагерь разгромлен. Это... ярость моих собратьев? Они боролись с монстрами в лице мон-кай и сами в итоге стали похожи на монстров".'
- guid: 363f6e12-df6b-427d-afa3-a20efd182562
  text: '"Ты слышишь это?.. Будущее грядет! Мои глаза слепы, но я наконец вижу его!"'
- guid: 36491d1b-f0c4-4cbf-ac9b-f516406cffae
  text: '"С тех пор, как Вистенца исчезла и эти... создания... стали появляться в поселках, прошло уже немало времени. Удивительно, что мы еще не слышали о преступлениях против Человечества".'
- guid: 36535426-2452-421a-9fd6-3da87a3d99ec
  text: '"Предатель крови Императора! Архискверна! Моя смерть будет достойной!"'
- guid: 36674f5f-0e39-40b8-8ec3-a46de7380481
  text: Судя по данным на экране, функции подъемника восстановлены в полном объеме.
- guid: 367d6f65-9bb8-4e1d-9f84-aca85ae99051
  text: '"Ошибка: недостаточно энергии".'
- guid: 36a60f39-1962-464e-8bdc-ea78e5559370
  text: '"Да будет известно, что волей моей и в соответствии с данным документом я нарекаю сего человека держателем Патента Вольного Торговца и возлагаю на него и его династию великую Миссию..."'
- guid: 36a8a330-94c8-43e2-809b-54729b3cd94d
  text: '{n}Камень души идет трещинами, после чего разлетается на куски. Тени в форме клешней и щупалец окутывают вырвавшуюся из него эссенцию и поглощают ее навеки. Вы чувствуете как благодать Той, Что Жаждет извиваясь вползает в вашу душу.{/n}'
- guid: 36ce5567-e047-468b-b4d7-2b1a07d674fa
  text: '"Какое оскорбление для культа. Ведьмы потеряли лицо... И скоро это может перестать быть фигурой речи".'
- guid: 36d61c87-1f15-49af-ae5c-28d8aeead70f
  text: '"Где же она... я точно помню, что она была где-то здесь..."'
- guid: 37177d25-44a5-4933-9b1c-a2123ad4cf5c
  text: 01000101 01101101 01100010 01110010 01100001 01100011 01100101 00100000 01110100 01101000 01100101 00100000 01110000 01110010 01101111 01100111 01110010 01100101 01110011 01110011 00100001
- guid: 3749f940-2fa3-4483-a7af-20c417b142f6
  text: '"Дворец Администратума — оплот порядка в протекторате фон Валанциус".'
- guid: 3750be9d-c86b-4a26-b8ee-2840d447bc8d
  text: '"В атаку! За Императора и Вольного Торговца!"'
- guid: 3796fb34-97d1-4d31-9d2b-e6a05ae7cbce
  text: '"Сегодня я вновь видел сестру — наяву, а не во сне. Она... меня не заметила".'
- guid: 37a63df5-4afa-4ca1-a129-7c466ea408dc
  text: '"Подтверждаю. Начинаю подготовку запроса".'
- guid: 37d65462-4b74-44b0-a1f2-36e70ed00903
  text: '"Вы не видели Галена сегодня?.. Мы прибыли вместе, но разминулись. Если он не поторопится, то пропустит все самое интересное".'
- guid: 37f5d758-12f1-469c-955e-07bcd26083b0
  text: '"Ну что, дармоеды, по приказу Лорд-капитана некоторые из вас будут учиться писать и читать".'
- guid: 384cadc6-7b43-4fc5-b6b8-074d434acf64
  text: '"Я черпаю вдохновение в наших трудах, технобрат. Совершенные механизмы, что мы создаем, наполняют мой ум непревзойденными идеями и схемами".'
- guid: 3856ce82-1146-4cff-97f2-6b5bf777db9d
  text: '"...я закрою глаза на... мелкие вольности, которые вы, почтенный Вольный Торговец, себе позволите..."'
- guid: 385ac474-e577-4dce-979f-3d3eeca66396
  text: '"Солдаты Бога-Императора! Кому еще уши мешают слушать?! Шаг вперед, обрежу!"'
- guid: 389c62c1-b303-4dff-bcb2-a629d8eda06c
  text: '"И как еще блюстители не выдали тебе горячих за "такие истории"?'
- guid: 38a7549a-4329-4f89-abbf-b1a1e7a50d83
  text: '"Так-то лучше. Вот выпустят тебя на арену, тогда и..."'
- guid: 38ab420a-94a7-42b4-991a-540ce536c4cb
  text: '"Глазам не верю..."'
- guid: 38e082c5-f30f-4b06-90cb-fc1fae89836d
  text: '"Неужто все к лучшему поменяется?"'
- guid: 38e6c1ec-9cfc-4643-8fc0-63985fe58357
  text: '"Дите нужно? Возьмите дите. Недорого отдам, за два рациона".'
- guid: 39201c74-ac16-4236-95d2-66c0b7ad537f
  text: '"Мисс Хейдари просто чудо! Не припомню, когда двор Даргонуса был так взволнован".'
- guid: 395295b0-5d74-4d0e-bae7-dae50a5c5b35
  text: '"Обожаю подтухшее мясцо — такое поддатливое, м-м-м, и мягкое..."'
- guid: 39834818-0db7-4842-b621-c3902f115279
  text: '"Кто это? Ты — т{mf|от|а} сам{mf|ый|ая} Звездн{mf|ый|ая} Госпо{mf|дин|жа}? Напрасно ты приех{mf|ал|ала}".'
- guid: 39d38175-6fea-401b-b182-4438918161cc
  text: '"Тогда наш выбор очевиден".'
- guid: 3a77126c-601a-4dac-9c4b-f4f6e534adbe
  text: '"Знакомая пташка! На ней летают местные Адептус Механикус. От пиратско-контрабандисткой сволочи их машины легко отличить".'
- guid: 3a869f3a-a81c-4fb6-83a7-03b1ec785b46
  text: '"...Во время тестирования нового снаряжения, призванного упростить выполнение исследовательских задач в условиях отсутствия атмосферы, теплорегуляторы вышли из строя..."'
- guid: 3a9a119c-7f3b-4de7-a94a-d4357b754483
  text: '"Тише, Клеон, о чем ты? Свет Императора снизошел на нас с Его посланни{mf|ком|цей}. Мы выберемся, слышишь?"'
- guid: 3aa2b8b6-9751-4810-86e4-ff817b604e06
  text: '"Бог-Император, сохрани души детей своих, сгинувших без вести в непроходимых лесах сего мира".'
- guid: 3aa6b8ab-dab7-4a76-ab4b-afc7230f56d2
  text: '"Прием? Лейтенант, что у вас... лейтенант! Мы не слышим, повторите! Что?.. Да поможет им Император..."'
- guid: 3ac5cc4a-6ac6-4b3c-beb2-a2e746f704eb
  text: '"Слышал, что парни из космопорта говорят? Про врагов Человечества?"'
- guid: 3b01dcf8-d4c4-41b6-b598-85584be55cf1
  text: '"Держитесь за мной, Лорд-капитан! Я задержу его сколько смогу".'
- guid: 3b28cb4d-7ef0-4a5a-93c4-988df4dd50e8
  text: '"Нас не убил целый мир, не убьют и эти твари!"'
- guid: 3b3dbc9d-eace-49af-adb3-ddb4933f220f
  text: '"А ну заткнись — не видишь, что ли, это не тот бугай? Так что поживем еще сегодня... Наверное".'
- guid: 3bd8a8c9-99b1-4753-aa04-dbed75bca78d
  text: '"Дернуло меня лихо подтуннельное дом на окраине построить — куда там! Расплодились, крысы пустотные, и этот уровень заняли. Жизни старику не дают!"'
- guid: 3c429b6e-c854-49a3-be3a-5c45246055ab
  text: '"Если же душа ваша так очерствела, что лишь триумф насилия может смягчить ее шрамы — наслаждайтесь резней грозного Плотояда! Сегодня мы вновь попытаемся убить его!"'
- guid: 3c5d66fd-fc23-4be9-b4f2-271006ef029b
  text: '"Обработочный цикл прерван. Необходима виза старшего надзирателя".'
- guid: 3cc829c7-2ce1-413c-849a-94f2ec99fd83
  text: '"Не верю своим глазам... Жители звезд ступают по нашей планете!"'
- guid: 3ccde5b5-cdaa-43ad-9da7-157c13ee19d3
  text: Страж пострадал от взорвавшейся мины.
- guid: 3cd28409-fe41-4b2e-a5ee-5eadba31d89a
  text: '"У него граната! Закройте Лорд-капитана!"'
- guid: 3cdf13f0-b512-4b92-bfce-6467925d96d9
  text: '"Нет! Я не пойду туда! Пожалуйста, я хочу жить!"'
- guid: 3ce1572a-0158-4865-9723-a9cfaa84261b
  text: Жрец занят попытками сшить торчащие из раны в животе кишки с гибким проводом, выныривающим из недр перегородки.
- guid: 3d062dd9-f930-4dbe-ab0d-0d3eb66c770a
  text: '"Уберемся отсюда, найдем себе место в Просторе. И... я больше не проктор".'
- guid: 3d534be9-e68f-4a45-a024-104063441081
  text: '"Весь высший свет Даргонуса собрался сегодня во дворце..."'
- guid: 3d5ce25b-a0ec-4560-a4e1-3e1a79faae4e
  text: '"Что за... Альбрис? Что они с тобой сотворили?"'
- guid: 3d64e768-18e9-4a9e-8556-2482c8f0673e
  text: '"Я наслышан о богатой истории фон Валанциус... но эти истории превосходят все мои ожидания!"'
- guid: 3d830d9b-412b-4179-baff-58e6409bf46c
  text: '"Не помнишь? Вот незадача. Ничего, еще полвахты в одиночке освежит твою память".'
- guid: 3d9bc6eb-76c6-4a2e-b350-a38d787553bd
  text: '"Не натянешь платок — станешь чьим-то врагом. Натянешь — тоже".'
- guid: 3dccddc4-ed0d-44c5-a7c5-008b96e4dda0
  text: '"Надо родичей на освободившиеся посты подтащить. За работу в капелле двойной паек как никак!".'
- guid: 3def2bb4-32ae-435b-a588-11d5eb0aba1e
  text: Кажется, что в черных впадинах безжизненных глаз вот-вот вновь загорится пламя старинной ненависти, однако глазницы остаются пустыми.
- guid: 3e21dade-c157-45af-9972-35a70100064d
  text: '"Второй поворот большого стержневого винта свершен. Поднесите дары, исторгнутые из тел апостатов".'
- guid: 3e9eb1fd-cdf3-40a1-ba79-8e5cc1734611
  text: '"Не падала она! И не все померли. Офицеры, что там были, но только ног-рук лишились, рассказывают, будто дверь в отсек захлопнулась, когда их отряд сквозь нее проходил".'
- guid: 3ebed516-5f56-472b-91f2-c742d393129d
  text: '"Проктор Келлик! На суде говорили о чистках. По каким критериям будет оцениваться добросовестность кадрового состава?"'
- guid: 3efac325-b6cd-4d81-9b82-2eb122029b06
  text: '"Солдаты словно единовременно заснули. И больше не проснулись".'
- guid: 3f918473-156c-4142-b090-b3d908f3c576
  text: '"Кровь для благородных ткачей!"'
- guid: 3faa54a0-bb23-43d1-b7d9-7f0861bfdde9
  text: '"Это уже десятое автоперо, что я опустошил за сегодня!"'
- guid: 3fd01974-633f-4597-9b50-514dad37fb49
  text: '"Любовь... Что за пустое слово, Домин''{name}? Разве не видишь ты, что лишь Неумирающий есть в моем сердце? Не ты. Никогда".'
- guid: 3fe084ea-ada5-42c2-98f2-64dc2bb58681
  text: '"Шпигель, шельмец! Его рот подобен решету, и я не об отсутствии зубов".'
- guid: 3ffa49c2-2aec-467d-b1c6-3059b1928ac9
  text: '"Вон какие блюстители с {mf|Его|Ее} Светлостью! Злющие, зверем глядят!"'
- guid: 40959d3b-14e8-4f10-a7fa-20dbd3589338
  text: '"Футфол прямо загудел, когда первые поставки пошли. Блюстители звереть перестали — на той неделе даже не забили насмерть никого!"'
- guid: 40a674be-c9b6-434b-9692-5f98929dae53
  text: На экран выведено сообщение о снятии второго блока с подъемника.
- guid: 40e390ba-0573-4a80-8559-afe32b0ffd99
  text: '"Но она же... воровка!"'
- guid: 41252be4-f92f-4a77-8a4e-5bbb0d40b82d
  text: '"Вина, боль, отчаяние — все эти чувства застят рассудок и искажают мысли, элантах. Лишь принятие и осмысление содеянного способны истинно возвеличить тебя... или уничтожить окончательно".'
- guid: 414b6be0-7b78-4e8e-a8ef-f26586bbbd59
  text: '"Очень вовремя. Наш гость уже почти исчерпал свою интересность".'
- guid: 4160430e-f11b-4381-bdd4-b127b41eea9b
  text: '"{mf|Его|Ее} Светлость жив{mf||а}! Мы здесь, держимся! Слава династии фон Валанциус!"'
- guid: 41b976ba-822c-4501-b36a-69c98a214f43
  text: '"Дайте милости... Пусть больше не болит..."'
- guid: 41ee57c1-7ee8-4d18-acaf-f31dd9a2db5f
  text: '"Если есть куда идти... на Футфоле не задерживаются".'
- guid: 41fb9303-898a-4774-8f8f-7905031aa46a
  text: '"Не беспокойтесь, мастер Вайс. Пока я жив, барьер будет стоять".'
- guid: 420050d6-8bac-40a6-af51-8ac942f73246
  text: '"Ай! Может, больше не стоит крутить эти штуки?!"'
- guid: 42018a91-bb5b-4c2a-b8ee-6230951be9a2
  text: '"Мои блюстители в вашем распоряжении, Лорд-капитан".'
- guid: 420dacb0-9431-43eb-b0d1-8a58734d2a8c
  text: '"Убери от меня эту гнусь!"'
- guid: 423af694-2280-4828-9559-faa52181682b
  text: '"Ты слышишь музыку? Какая она... самое жуткое, что я слышал в своей жизни... жуткое... и красивое..."'
- guid: 42932471-3d83-49ad-8a71-b9f5f1799c49
  text: '"Лишь признав свою порочность и встав на путь искупления, исторгнете вы мрак из своей души и впустите свет Императора!"'
- guid: 431ca9f4-01cd-4bd3-b6f4-cb4317c06a91
  text: '"Сдохните, ксеносские выродки! Жги нелюдь!"'
- guid: 434f4505-b83a-4d80-8c5e-d0742547fa42
  text: '"Заткнись, пассажир. Все тихо".'
- guid: 43b8d157-eba7-460e-b532-f28f74a6ab7b
  text: '"Арсенал открыт, вооружайтесь и сражайтесь!"'
- guid: 43bf79e4-42de-42dc-baa4-15085aabac0e
  text: '"Но если Император бросил нас, то кто же теперь услышит наши молитвы?"'
- guid: 43d3a23e-0bc4-443c-a9ad-371129f37f32
  text: '"Версерианы стоят под стражей прямо в тронном зале. Чую, еще немного и снова прольется чья-то кровь... Так увлекательно!"'
- guid: 440e3a0d-bf2e-458c-abf0-8beb0b71f17d
  text: '"Госпо{mf|дин|жа}, прошу Вас, проходите..."'
- guid: 447cb24f-50d9-442a-a97a-2bab84549a71
  text: '"Неужто тени усопших играют с моим разумом? Я вижу огни в чреве замерзшего мира!"'
- guid: 452c70ce-5967-47f7-b008-0787fc849f87
  text: '"Как вышло, что только вам удалось вырваться из ловушки на Райкаде Минорис? Сколько правды в слухах еретика Кунрада Войгтвира, распространяемых о вас?"'
- guid: 4569f754-a235-453f-ad5c-eb3577441737
  text: '"Говорят, Немезит важную шишку обидел, и блюстители рейд готовят на наш отсек. Нужно бежать! Они не станут разбираться, кто виновен!"'
- guid: 45933caa-b216-4642-b12d-c4b52221140e
  text: '"Не помню, когда к нам последний раз прилетал кто-то со звезд!"'
- guid: 45a4b39c-1b41-49aa-9a59-0fc24a93a158
  text: '"Фиксирую нестандартное использование полевой конструкции: ритуальное захоронение останков не соответствует протоколам Астра Милитарум. Гипотеза: ритуал проведен представителями местного населения".'
- guid: 45c1d141-7ac3-4689-9155-6c7116a126da
  text: '"Подвергаете опасности тысячи людей на корабле и миллиарды подданных по всему протекторату!"'
- guid: 45d67bf5-114c-467f-aba5-3beae41c0175
  text: '"Вот теперь и разгуляться можно, без блюстителей. Теперь пограбим, да как заживем!"'
- guid: 4604a769-86d8-4d0f-92a5-85dc7e2f7c8d
  text: '"У нас попытка прорыва. Экипаж, к оружию!"'
- guid: 46406c17-0272-4159-8fb2-bf37ce0c1e9e
  text: '"Отставить ныть госпо{mf|дину|же} Вольному Торговцу, салага! Ваша Светлость, разрешите доложить! Несем охранение временного лазарета для пострадавших! Господин губернатор с сержантом Малгаром там, на посадочных, планируют эвакуацию!"'
- guid: 46490536-7afa-4af0-8416-be7cf858b8f4
  text: '"Свет Терры, не покинь меня в час нужды, не оставь во тьме".'
- guid: 469b96c3-94d2-4d80-b2b0-ad7e48d52817
  text: '"Вот как выглядят верные своему сюзерену слуги! Вперед, мои подданные, защитите своего Лорд-капитана!"'
- guid: 46b7adce-66e8-4f6c-9eaa-977ba1506ead
  text: '"Последний маяк не спасти от тринадцатой бури! Любимый сын заблудшего отца разверзнет пасть!"'
- guid: 46e782eb-71c7-48ed-8996-95ca1edc6f05
  text: '"Мы целы и живы... Все наладится, так ведь?"'
- guid: 46e808de-c0bf-40dd-b2e8-8d82b70d96d2
  text: '"Слава Омниссии, подателю Знания".'
- guid: 470fc5d1-2294-4468-a0bd-cdd3423bfcaf
  text: '"Пристрелить! Сейчас же!"'
- guid: 47bed171-2fd3-4b84-a67a-217133056098
  text: '"Внимательнее слушайте {mf|его|ее}. Исполняйте свой долг. И, Трона ради, задавайте поменьше вопросов".'
- guid: 47f84deb-dbde-4f17-85eb-dcb6abe59126
  text: '"Тьфу ты! Я думала, это у меня от проклятого газа голова гудит. А нет — газ-то все. Это мертвые. Плачут о своей печальной судьбе".'
- guid: 48491c01-50ba-4195-8d03-3dea9e8e89fd
  text: Бинарный гимн пробуждает запорные механизмы врат.
- guid: 485334fe-8ff5-4682-a52d-24d8b64679c6
  text: '"Ни шагу назад! С нами Звездные Союзники!"'
- guid: 48753cc3-e6b5-458f-b8c2-6e5691263049
  text: '"Лорд-капитан, ваши решения всех нас погубят! Лишь жалкие пираты умирают, не рискуя ничем, кроме собственной шкуры. А что вы?"'
- guid: 48859c68-e6ba-4e69-bd57-145c691fadd1
  text: '"Запрос №232-05-68Х ожидает обработки Мастера Печатей... //Исход уровня С// Прошение отклонено".'
- guid: 48afd56b-f0e9-44e1-a68f-d1a1d4c6778f
  text: '"Это возмутительно! Я буду жаловаться!"'
- guid: 48dbac65-5f71-41d9-8dff-b65c257688b3
  text: Культист смерти с почтением склоняет голову.
- guid: 48fe55c4-8624-40a8-a601-21841dc9b7c5
  text: '"Еще раз увижу, как поднял голову — сдам техножрецам на сервиторизацию!"'
- guid: 4930da16-1106-443a-85ce-4a0629f60809
  text: '"Благословенная Электродинамическая обитель приветствует сво{mf|его|ю} спасител{mf|я|ьницу}".'
- guid: 49638d14-5c40-475a-8826-4491ec1115a9
  text: '"Проклятье, почему именно Годьерда? Не знаю, зачем Император велел тебе убить ее, но эта смерть не должна быть напрасной".'
- guid: 497d9e04-caf4-4454-b7ba-6e439ccdb1fd
  text: '"Мы уже выяснили, что эта сущность — не наша цель, {name}. Надо искать дальше".'
- guid: 498caea1-03b6-4c78-828b-cafb08ade53f
  text: '"Ты всегда верил только в себя, а в Него — нет. Что же, Он тоже в тебя не поверил".'
- guid: 49935b88-f5e8-4d0c-b764-9b14ea7a1d89
  text: '"Сколько еще раз я должен вам, гнидам неблагодарным, повторять? Нужно платить за свои ошибки!"'
- guid: 49c37fd8-474b-4fd4-bcaf-268ada88b3ea
  text: '"Пощадите нас! Пожалейте!"'
- guid: 49e75e9d-abca-4bdb-8e9a-4f89707c3bc0
  text: '"А блюстяки, псины пустотные, обосрались-то, что шишки с верхних палуб в гости пожалуют, да все их дерьмецо увидят".'
- guid: 4a0f0990-1fb6-4726-9b3b-9267edc9c345
  text: '"Глейто почуял еще один знак. Кровь свежая... Что за игру ведут эти фанатики?"'
- guid: 4a308b7c-a88c-4e1a-981a-7ff0b4f7b0de
  text: '"Безумием было бросать вызов Диодасу. Теперь это погубит всю династию".'
- guid: 4a57c617-3584-409f-b1ef-00da0059d4ae
  text: '"Похоже, ткач его убил. Кто-то знает мертвеца? Он же еретиком был, да?"'
- guid: 4a6737a0-bc36-42ac-b918-52da725ff7bf
  text: '"Скорее всего еще и убийца. Но это-то и волнует сердце! У {mf|Его|Ее} Светлости такой тонкий вкус!"'
- guid: 4a6e809d-d7ee-444f-9f4a-6abf0f9f414c
  text: '"Ксеносы... уже внутри! Мы не смогли остановить... да смилостивится Император... над нашими душами..."'
- guid: 4a84e6de-c63f-4159-a4fa-4c5af8846933
  text: '"Маловато сегодня просителей. Неделю назад пришлось дополнительную смену брать из-за нахлынувшей толпы".'
- guid: 4b0042f0-7a68-44c6-9b21-2a0257131565
  text: '"Убранство этого судна полно особо древних и священных механизмов! Сколь велик был сей храм!"'
- guid: 4b040fe0-8925-4379-9743-bc90237d7b5d
  text: '"Дождитесь своей очереди..."'
- guid: 4b0d954c-c80a-44ee-96aa-49b7f0b0c7db
  text: '"Осталось одиннадцать стаканов, пять мисок и три шкатулки... уместим?"'
- guid: 4b2b7aa0-4181-4b87-9f8d-1ac92e1b0757
  text: Кибелла бросает взгляд на кровавый символ и отстраняется, внимательно наблюдая за вашей реакцией.
- guid: 4b4491bc-4fe2-42a8-a7e0-80bfc41fb0c7
  text: '"В-в-ваша Светлость! К-какая ч-честь!"'
- guid: 4b51c7d3-b17b-4af5-b0cc-3518daf3acda
  text: '"Ко дворцу Вольного Торговца прибыли многоуважаемые представители Навис Нобилите: Регент великого Дома Орселлио — Ааронто Орселлио".'
- guid: 4b5922ec-6dca-4b95-a626-be7c61af9c4f
  text: '"Покончим с тиранией Тисифоны! Убейте девчонку!"'
- guid: 4b7d7222-f368-4162-97c2-6b9c7327ff27
  text: '"Считаешь меня чудовищем, Фелек? Да будет так".'
- guid: 4b9a99fd-7f63-476f-b960-e6bef367c7af
  text: '"Страдания?! Их камни душ разбиты, Ссиртан, и Та, Что Жаждет давно закончила пир! Мы уничтожим их. Каждого мон-кай, что... Ты это слышал?"'
- guid: 4bf1066a-f92e-4ab2-9364-a86de72d286b
  text: '"Ваше сиятельство, нижайше кланяюсь!"'
- guid: 4c027474-71b7-4af9-84b3-dac1ec443677
  text: '"Ой, ваше вашество, это мусор, чего вы копаитись-та в нем?"'
- guid: 4c1661f3-aa2b-451d-9e16-f2acc0ccb538
  text: '"Идентифицируйте себя".'
- guid: 4c3fd1cf-f535-45a1-8b79-e194aa41a6c5
  text: '"Благодарствую за оказанную помощь, Ваша Светлость!"'
- guid: 4c8bfcd4-7e1e-4794-a511-516c294c4a06
  text: '"Не представляю, как такое могло случиться... Проклятые предатели! Да как они посмели ранить Дитя!"'
- guid: 4c908247-0eb2-42eb-865e-591323fc7b4a
  text: На лице сержанта Вигастиса появился румянец, и раны уже явно не так сильно его тяготят. Со своим видавшим виды лазружьем он расставаться, судя по всему, отказался.
- guid: 4d04adcc-14e3-4c95-9cdc-ec78c12ff741
  text: '"Хорошо. Послушный мон-кай".'
- guid: 4d29eb3c-f743-4c9a-b445-a334b161c2a8
  text: '"Дай мне сил, благослови величием! Лишь прошепчи, какую жертву желаешь..."'
- guid: 4d5390b5-99fd-400d-a7d9-9b36553f759b
  text: '"Вольный Торговец {name} фон Валанциус, вы нас разочаровали".'
- guid: 4d7636d4-9f60-4ebc-8553-bcd4e245d708
  text: '"Разберитесь с этим".'
- guid: 4d8a9e49-a93d-4824-9461-12e77c0dece4
  text: '"У меня уже два наряда вне очереди... один за другим! Если доживу к их концу — считай, повезло!"'
- guid: 4d8dc371-0598-4cb1-acba-fa7d7a8fe511
  text: '"Хм. Посмотрим, что с ним произойдет дальше? Не сомневаюсь, это будет очень любопытное зрелище".'
- guid: 4e1d87be-5340-44a3-b651-edab8f6aaed2
  text: '"Ммм... Изысканный аромат... Невозможно остановиться".'
- guid: 4e87d970-620b-4911-91d3-eccbc94e39d4
  text: '"Каждый псайкер на борту должен быть уничтожен. Очистите огнем каждый закуток этого судна!"'
- guid: 4e8870d4-a95c-4b0d-98cd-bde13ac7a02e
  text: '"Ксеносы добрались до беглецов быстрее нас. Не думаю, что кто-то еще остался в живых".'
- guid: 4e91f4c9-43c8-4dcc-aff2-cc9e7d3785a4
  text: '"Неужели это та самая авантюристка и преступница, которую приблизил{mf||а} к себе {mf|Его|Ее} Светлость?"'
- guid: 4eb54821-2486-4311-a869-1bdaadd0574a
  text: '"Слышали крики? Пошевеливайтесь!"'
- guid: 4ee79c69-8fd9-46a3-874a-7ec28e4d001b
  text: '"В-вы! Н-но... П-простите, Ваша Светлость! Мы уже уходим!"'
- guid: 4f59e1c9-cf8f-46e8-b14c-0c32d730497d
  text: '"Хм... Вы что-то сказали?"'
- guid: 4f690706-35fe-4bbd-aa02-2e50e8857590
  text: '"Сколько можно измываться над нами? Мы есть хотим! Мы хотим работать!"'
- guid: 4f81fc7b-c3f1-46e3-bf98-03db5308d56c
  text: '"Темные владыки взирают на тебя. Я вижу ожоги от их взглядов на твоей душе".'
- guid: 4f9266d0-ebb6-4aa2-9d00-313a3d068a16
  text: '"То огромное расписное корыто в углу комнаты — это чтобы топить врагов, да? Неплохо, но Р''Изза предпочитает выкидывать их в шлюз: так они смешнее барахтаются!"'
- guid: 4fb4bf56-3e4d-49d4-ad05-195d885507e3
  text: '"Ищете зрелищ да развлечений попроще, Ваша Светлость? На Футфоле на любой вкус найдется!"'
- guid: 4feb3129-f989-42c7-87ac-a86756af6f6e
  text: '"Ну что? Упросил Версериана на отгул на Футфоле?"'
- guid: 50169101-ce1a-420c-8ce0-e9c458fce253
  text: '"Тебе никогда не изгнать печаль".'
- guid: 501e64ea-137a-4030-9f15-c8711b66d3cf
  text: '"Опасность. Фиксирую экстремальные показатели загрязнения. Запускаю протокол общей тревоги".'
- guid: 50574cb5-e8ed-4656-984a-5be34626e313
  text: '"Внимание! Некорректные показатели давления в системе! Ожидаемое значение: 10".'
- guid: 50771884-45d4-46c0-9c7b-60d9a10d898f
  text: '"Из лабиринта чужой души нет пути наружу".'
- guid: 508e25ee-cc28-47f4-b687-e29be1c5f281
  text: '"Вам нужна помощь?.. Хотя, знаете, мы лучше вас оставим, наверное..."'
- guid: 50b22091-6656-4693-a95d-237c7bb42c7c
  text: '"Во имя Золотого Трона, держать строй!"'
- guid: 50b8b7c0-475f-4fcb-8d05-28a8ff7d0e21
  text: '"Прошу вас, только не на рудники!.. Я расскажу все, что видел..."'
- guid: 50cb85b7-3c6c-475e-ab8a-5b4739fca0b4
  text: '"В смерти видим мы триумф!"'
- guid: 50e14c5c-a68a-4c06-bad8-2c38726a7ef2
  text: '"Там кроме Йеремии еще троим жизнь не мила стала от этих воплей, а один до сих пор слюни в подушку пускает".'
- guid: 511cf1ca-1ebe-43ee-b5f9-f9949b9e4d82
  text: На белесом камне хорошо заметны следи грязи — чернозема с крупными цветными вкраплениями. Вы подбираете щепотку странной почвы и заворачиваете ее в платок.
- guid: 51275cba-66c2-4fc1-b1e0-172c6f52ce75
  text: '"Угроза устранена, Ваша Светлость. Мои люди проверили помещение — можете осмотреть сами, если изволите".'
- guid: 51371e2d-e795-4836-bbbe-a640be39f60b
  text: '"Тоже мне страх! Смеющийся гонщик... Вот ур-гуль, что здесь завелся — вот это страх!"'
- guid: 513b908d-6adf-448e-9327-49284c66a734
  text: '"Запрос на установку аугментаций принят. Омниссия благоволит избавлению от слабостей плоти".'
- guid: 515590e5-f92f-4685-b8d3-a21483d44913
  text: '"Это заразное место стоит сжечь, ибо это угодно Великому. Не трогайте ничего".'
- guid: 5185f32e-de80-49be-adb2-9c0b24b8b57f
  text: '"Дружочки в мой голове просто сходят с ума от восторга. В дверку то и дело стучатся гости с той стороны, желая поделиться своими предсмертными видениями. В очередь вы, идиоты! Я одна, а вас вон сколько!"'
- guid: 518cd1fe-c40f-4b3f-9f9d-df965b54d493
  text: Комиссар щелкает каблуками и делает символ аквилы на груди, после чего на мгновение рушит словно сошедший с плаката образ героя Империума, хитро вам подмигнув.
- guid: 51e17b98-2076-4b2d-82ad-a101a0f4d762
  text: '"Тот, кто вздумает брать пример с Краанта, закончит свои дни или в одиночке, или как сам Краант. Кстати, его останки все еще надо оттереть с переборки — этим вы и займетесь, когда мы закончим. Вам все ясно?"'
- guid: 51f3d505-7b74-4495-bfcf-6ee10d28ef78
  text: '"Спасибо, Ваша Светлость. Без вашей протекции я бы был уже мертв".'
- guid: 52153bcf-392c-41d7-b0c2-50b947df7a05
  text: '"Хм, тут посторонние. Оставим добычу, пусть думает, что спасся... Чтобы наш последний визит раскрыл весь букет отчаяния".'
- guid: 5221e449-8a22-461a-a834-77b188a39bac
  text: '"Не буду я за Саргону пить — ублюдком он был, своих грабил и ксеносам на мясо продавал".'
- guid: 523e291c-b5ea-407c-a4bf-82b2cfd43ece
  text: '"Ахахахахахаха!"'
- guid: 525335ee-f5e6-41a1-994c-2ebac99efe11
  text: '"Визит в усадьбу фон Валанцус стоил того острова, который мне пришлось продать!"'
- guid: 52778831-b46c-4b16-bf33-c45427bcdab1
  text: '"Ты даже не представляешь..."'
- guid: 5313679e-4870-41fd-b210-617c1653594f
  text: '"Ну и ну... Отчет из медотсека. Только послушай!"'
- guid: 53249e29-306d-432e-bf9d-90d8344c7ea8
  text: '"Сбывается ночь, коей не положен предел..."'
- guid: 5348e6c7-046d-4d76-8e85-353771d0b000
  text: '"Эй, да не зыркай ты так, друже! Что, как? Как служба, как жизнь?"'
- guid: 535ed4bb-38ec-48cb-9f32-7795027dd2b9
  text: '"Само существование священного корабля в столь ужасающем состоянии — неприемлемое кощунство!"'
- guid: 53c883b6-588d-4b7c-a92a-b980de8d2d5a
  text: '"Подойди ближе, дитя! Вкуси плоть Бессмертного, дабы причаститься к Алым братьям и сестрам. И да нести волю Его — кровью собственной и жертвенной!"'
- guid: 53e14bfb-b73f-4f40-956d-70e04a235109
  text: '"А? Что? Не отвлекайте меня".'
- guid: 53e396e6-d44b-41f4-a3c8-6eda62efc12e
  text: '"Проктор Келлик! Если Адептус Арбитес больше не существует... Что с нами будет?"'
- guid: 541bbeca-38b7-4bc1-b568-96113e684320
  text: '"Ваша Светлость, срочное собрание в Яме — вы нам нужны! Комиссар просил передать вам эту записку".'
- guid: 54373d12-2b99-43cd-b9c9-37e7f3d683ad
  text: '"Твоя душа подобна неухоженному саду, где заросли сорной травы душат побеги хрупких цветов".'
- guid: 543d356c-fd0f-4a6a-8bf4-c635ddd166e9
  text: '"Поговаривают, что Теодора хотела видеть своим наследником кого-то другого... Вздор! Есть лишь один истинный Вольный Торговец".'
- guid: 544d7728-c6fc-4f86-9d74-0ff177ca741d
  text: '"Никакой самодеятельности. Никакой личной инициативы. Только предписания Омниссии и соблюдение протоколов".'
- guid: 545b6295-7465-4080-869e-98e3452e849f
  text: '"Никакой это не Вольный Торговец, а переодетый блюститель! Зуб даю! Они что-то задумали, а нас за дураков держат!"'
- guid: 5469688a-1e4c-40c3-b5b4-1d4e135ce835
  text: '"Помилуйте. Раз мы не нужны вам, отпустите..."'
- guid: 546bf02d-28c7-4da6-a728-5b8f80ef98e8
  text: '"Какие господа важные в "Адептус" захаживать начали... эй, не купите мне выпить?"'
- guid: 54898bba-4d99-4179-b750-a01269f8626c
  text: '"Смотри на меня, Кхаэла Менша Кхейн!"'
- guid: 54900d55-f5c1-4749-87f0-7656c77d575b
  text: '"Если госпоже понравится вкус этого плода, мы с тобой вознесемся".'
- guid: 5492bffd-478b-42fe-9888-66c1158b588b
  text: '"Ваша Светлость, рад вас видеть в добром здравии! До сих пор не могу поверить, что мы спаслись из Комморры. Я у вас в долгу".'
- guid: 54958f91-4e48-47e4-82cf-107bac2bc07d
  text: '"И вроде поспокойнее с патрулями стало, но вот только если один из них к тебе прицепится..."'
- guid: 54b8b8b0-473b-4bf9-88a2-13c17f6b2d65
  text: '"Полет чрез владения Архиврага был столь долгим... но наконец мы достигли цели!"'
- guid: 552da446-a1bf-411e-837d-51b83a64e396
  text: '"Курьерская служба Зандера Сонатуса! Вам письмо!"'
- guid: 5535af93-a27d-44ff-bc1e-00ec0075c880
  text: '"Да, и она неотразима! В ней столько жизни и энергии, сколько нет во всех аристократках столицы!"'
- guid: 553ffa59-cf37-49e5-8d7c-47b642f4fdd7
  text: '"Фу, ну и рожа. Проваливай, такой урод не нужен".'
- guid: 5564a7ee-7ec4-4698-9b60-9fd79e48a20d
  text: '"...принимаю запрос. Нижняя палуба, отсек XT-942. Понижение температуры до 20 градусов".'
- guid: 5589b818-58e7-4590-9c9e-9bdce57c0d85
  text: '"Так-то лучше".'
- guid: 5595e656-faeb-46d6-bf0e-7ca4eb4034fe
  text: '"Мы с вами, Ваша Светлость!"'
- guid: 55b1a062-d3e7-4ac0-b0a6-053c3454d904
  text: '"З-с-снай, что Кикерос-с-с дорого обошлась твоя с-с-смерть. Уже ц-с-селую эпоху никто не нанимал меня — так дорого мое мас-с-стерство".'
- guid: 55d3b9bc-4c6a-4376-bbc9-849e1c68baee
  text: '"Долгих лет жизни Вольному Торговцу и его дому!"'
- guid: 55d9cb51-2c55-4bc4-ba34-0bcd854820b0
  text: '"...Величие будет узрето и познано. Отчаяние будет рождено и испробовано. Все жалкие порождения будут изничтожены с нашим явлением".'
- guid: 562c3ae9-0ebc-44a9-812a-db0bab4f9418
  text: '"Первый поворот большого стержневого винта свершен. Омойте сочленения кровью".'
- guid: 565fcb54-bfe7-408e-997d-27798f28aa13
  text: '"О, Бессмертный Бог-Император, будь к нам милосерден..."'
- guid: 566f625a-7ad7-43ea-98ef-00e565f3f83a
  text: '"Благодарение Богу-Императору! Не забыли про нас, не забыли!"'
- guid: 56a778d7-3b5a-4167-b1e8-2edc6a89d1db
  text: '"Нравится мне ваш камзол, сил нет... "'
- guid: 56bff354-7877-498c-9705-a88f1574ace6
  text: '"А вот и "Бессердечный"! Орудия — к бою, цельсь строго в двигатели, за сохранность десятины отвечаем головой!"'
- guid: 570d460b-5444-4271-b3f9-e411c49c9287
  text: '"Воистину! Отпустить свой разум в свободное странствие и смело черпать из накопленного Знания — удовольствие превыше всех прочих!"'
- guid: 57620352-2a04-41ea-90f6-4209412f27fb
  text: '"Почему они... Золото Трона! Неужели Вольный Торговец завел{mf||а} нас в ловушку?"'
- guid: 5775e722-1fbc-4031-8f75-23cedd75e82e
  text: '"Что-то не так, Ваша Светлость?"'
- guid: 57c95823-7d31-479f-8068-5247c4da9884
  text: '"Разложение благодатно, ибо что есть гниение как не копошение новой жизни на останках праведника? Кто мы такие, чтобы прерывать цикл жизни? Нет, мы должны принять сию истину и посвятить себя ей!"'
- guid: 57eb3089-cdd2-41b5-a80d-cb50f8e97558
  text: '"Верша расправу там, где мог быть мир,

    {mf|Ты сам клинок возмездия вознес|Ты вознесла тот мстительный клинок},

    Что окропит лишеньями твой дом.

    Я — тот клинок. До новых встреч, Купец".'
- guid: 57f7c154-aa5f-4a9e-9abc-72afe2ef57ae
  text: Ступеньки норовисто взбрыкивают, кривятся под ногами, пытаются лишить вас равновесия и заставить сломать на них шею.
- guid: 5825beb5-0b02-40c4-af17-2a5403250ce9
  text: '"Тот, кто что-нибудь здесь тронет, подарит мне много минут удовольствий агонии, пока будет умирать от здешней заразы".'
- guid: 5858ed28-e557-4222-98bd-5d71db0cd014
  text: '"Нарушители! Сдавайтесь или будете убиты!"'
- guid: 588a5234-89d8-4be7-aa46-67516de3a2cd
  text: '"Радуйся, что ты здесь, а не в одном из изолированных поселков. У меня дядя из такого сбежал... от того, что рассказывает, волосы на голове шевелятся".'
- guid: 58a3e144-d67c-4091-b2a7-314db0c0fb63
  text: '"Пусть так. Небольшая цена за освобожения Дома Орселлио от оков тирании".'
- guid: 58c35a5a-2136-4dda-ab0d-197627c5fe22
  text: '"Какое счастье видеть вас в добром здравии, Ваше Сиятельство!"'
- guid: 58d6735b-9c03-45b7-b81d-59404ebdc3c7
  text: '"Я и себе пайков набрал, и семье брата... с тех пор, как его в жернове перемололо, худо им приходилось. Ну теперь ничего, авось все детки выживут!"'
- guid: 58f3f7eb-8b5b-43a9-9234-04ed9aefe6f0
  text: Жрец, чье тело покрывают вырезанные по металлу и плоти символы, шепчет слова молитвы.
- guid: 58f4d78b-108a-474e-9067-a41c78dce75a
  text: '"Какой здесь зловонный, спертый воздух... Неужели никто еще этого не заметил?"'
- guid: 59188245-a5d2-4fd4-a422-d5cd9f8cd026
  text: '"И да очистится мир от ереси, закалится в священном пламени..."'
- guid: 593fec34-3221-4aff-a7c4-9dba5d95b474
  text: '"Кей-морагх!"'
- guid: 5994457b-82c6-4e47-8ecd-3c32e6f23328
  text: '"Отребье! Всех вас постигнет забвение за преступления против Дома Орселлио!"'
- guid: 5a2406f7-6ae1-47f6-81ba-9ddacdebd3d2
  text: '"Надеюсь, хоть в этот раз достанется что-то кроме жижи".'
- guid: 5a538166-0fb0-47f8-862c-ed9133c31599
  text: '"И так вы и спаслись с Райкада?"'
- guid: 5a8810c4-5f75-4ee3-af31-ee3b40bd0847
  text: '"Если кому ума хватит сунуться на Даргонус, то быстро пожалеет. Ты батареи наши хотя бы раз видал? А полки стражей, которые на нижних уровнях держат?"'
- guid: 5a88b443-facc-4c79-a3c2-ea8fd8b9107b
  text: '"Хм. За этой решеткой достаточно места, чтобы уместился небольшой отряд".'
- guid: 5a9db537-32f3-4220-9d4f-474788cb1ada
  text: '"Очистим наш мир от предателей Империума!"'
- guid: 5abf31c8-a9b7-47ad-b05f-c75b99c19b88
  text: '"Снова вверх..."'
- guid: 5aca066c-fb1d-4b01-9e2f-900d8e33dee8
  text: '"Что-то не так с новыми пайками... может, не жрать их? Хотя с голодухи помирать устал уже..."'
- guid: 5ae4f8f5-01f9-4203-808b-3d1243dec13a
  text: '"Мы... живы? Лорд-капитан, мы живы!"'
- guid: 5ae5559b-84c5-4f49-9582-fb5db5373de3
  text: '"Правосудие Императора есть благо. Противление ему — ересь!"'
- guid: 5ae6df8a-13dc-4417-a67d-128aa5347ea3
  text: '"Уважьте звездных господ! Купите больше в их честь!"'
- guid: 5b3ce2a5-9d63-4ae7-a8f2-93a178552690
  text: '"Идем же, Домин. Нам предстоит спуститься в храм смерти, где я отчитаюсь о своем задании. И задам Висирю один вопрос: "Почему я?"'
- guid: 5b5b6526-dbef-4f1a-a525-39751cecfba5
  text: '"Ого, смотри какие гости, важная персона наверное!"'
- guid: 5b71651d-a951-4791-a2d3-ba01b733ce7c
  text: '"Только скажите — и мы установим вам лучшие из аугментов, Лорд-капитан!"'
- guid: 5b740e02-e8d7-4a7b-9bdc-d6e2693955a4
  text: '"Император, пошли мне сил, ибо ужас Имматериума низвергся на нас!"'
- guid: 5b7d4395-f81b-47eb-be72-5d3a3493a38c
  text: '"После услышанного я должен не менее трех вахт молиться за Вашу Светлость!"'
- guid: 5b90dfd1-ced4-4086-8f01-bb4e397dc0de
  text: '"Вроде на кость похоже. Только тварей таких размеров я даже представить не могу, не то чтобы поверить в них".'
- guid: 5b9956db-6594-4926-9b7d-3ae3c6a19fb7
  text: '"Ваша Светлость!"'
- guid: 5ba93f1d-0ae0-43fa-aa44-422a3a75dafa
  text: '"Ваши слова могут быть истолкованы слишком превратно. Я — мутант. Вы со мной только играете?"'
- guid: 5bd8badc-ca83-4044-9162-ba33580aec10
  text: '"Ибо праведность есть наше оружие, преданность — наша броня, а смерть за Него — наша цель и наш смысл. Услышьте весть мою и возрадуйтесь: Император защищает".'
- guid: 5bebab67-8761-441d-9b15-0097b31adb8b
  text: '"Что ж, допустим... На этом этом все. Стража, за мной".'
- guid: 5bed994c-2e3f-4787-be78-bdbf7df6c3b2
  text: '"Они у меня всех убили! Отомщу! Все отомстим!"'
- guid: 5c0a5360-c52f-4d98-b6b0-3425f77fe03d
  text: '"Смерть моих братьев не помешает взойти новому солнцу!"'
- guid: 5c7b82a5-7f0f-4e6a-9092-8f1b1a7976e2
  text: '"И все же остается Патент. Себериан должен быть предан смерти — но истребить весь род?.."'
- guid: 5c93b6e8-fc21-4c3f-93f3-6d102b837d0d
  text: '"Золото Трона, что сегодня за смена..."'
- guid: 5ca35cf6-ae7d-4f4a-b6fc-48eff671238b
  text: '"Смерть угнетателям!"'
- guid: 5cccb833-5233-441d-ab33-5d4848bcdd12
  text: '"Обыск проходит с применением кибермастифа. Не двигайтесь — у служителей Администратума есть другие заботы, кроме как оттирать от пола вашу кровь".'
- guid: 5ce91f1b-f2f4-4c14-91d8-b889a0ad9678
  text: '"Лорд-капитан!"'
- guid: 5cea5229-20f7-4688-bcfa-2ddf3a4b4008
  text: '"Враги! Интересно! Я хочу посмотреть, как вы устроены внутри!"'
- guid: 5d16071c-10d9-4497-b20f-ecde63b4388f
  text: '"Отпусти все, элантах. Сомнения. Страхи. Переживания. Отбрось тяжесть тела. Очисти разум".'
- guid: 5d1bf4f9-39dd-4777-9d85-c311fd60bbf9
  text: '"Так я и не спорю. Но его законники порешали — не за их же победу стакан опорожнять?"'
- guid: 5d6082b5-be80-4cf7-9bd1-34cc20b45937
  text: '"Ваша Светлость, я не жалуюсь, но наши сервиторы словно разум потеряли! Хотя чего там терять-то..."'
- guid: 5d7bcd27-bd1b-4d29-8e94-765edd036c44
  text: '"Покайся — каков был последний приказ старика? Что вы задумали?"'
- guid: 5da821b5-0e22-48ce-bf60-ea3a31f134a1
  text: '"Почему тени движутся, словно живые? Это все из-за того, что я башкой ударился?"'
- guid: 5dcfc05b-3bf9-4d1c-bf52-cceb6a7df8a5
  text: '"Тише! Тише! У них тонкий слух. Лучше не рисковать, говоря так о новых любимцах Вольного Торговца".'
- guid: 5e0e5dbb-e524-4acf-81d8-1b9159f0d29a
  text: '"Во веки веков благословенен пусть будет род ваш, посланни{mf|к|ца} небес!"'
- guid: 5e163d39-8c2a-4df3-b9d2-54d796a7c0ae
  text: '"За языком следи, а то вдруг кто услышит, что ты на Лорд-капитана напраслину возводишь..."'
- guid: 5e512492-ceda-4d3d-9d68-6fccda05909b
  text: '"Как он мог предать нас! Еще комиссаром прикидывался, падаль!"'
- guid: 5e64ccb7-d602-4929-8e25-727c0510840f
  text: '"...Предварительное заключение — сбой в системе терморегуляции. Направляю в отсек XT-942 ремонтную службу".'
- guid: 5e7faac8-afe6-48e2-904d-45419f4fae53
  text: '"Продолжаем играть, не отвлекаемся! Четвертый игрок выбыл, а мне удача улыбается".'
- guid: 5eb0e7b8-4532-472a-8eab-3c9bc0d8a5fc
  text: '"Да! Надо же, на моей памяти такого не случалось, чтобы Леди Теодора держала одного из этих на борту так открыто!"'
- guid: 5eb5a6bb-48c4-4be2-8c09-aeb526365bca
  text: '"Не может быть! Почему... здесь? В руинах ксеносов? Немедля изучите артефакт!"'
- guid: 5eb69340-949c-41ae-b7ef-ec3e27bbc39e
  text: '"УРА! УРА! УРА-А-А-!"'
- guid: 5f15002f-6c64-4466-8fb4-8ae45873b158
  text: '"Еще немного... и... упаду. Или уже лежу?"'
- guid: 5f32539f-b8e3-465b-ae61-f3d0496f0643
  text: Тело человека представляет из себя сплошной синяк. Кажется, он вот-вот перестанет дышать.
- guid: 5f5a8126-0287-4db5-8b73-53a288de6c70
  text: Чиновник пятого ранга Морбецио Кавалли
- guid: 5f7d9c69-39a1-47da-941e-03b3e01baf0b
  text: '"Это? Лишь случайная стычка, недостойная внимания. Настоящая охота ждет господина и его гостей впереди".'
- guid: 5fa81dc3-0b89-451d-ada1-0e364eb5ca4e
  text: '"Такое важное событие — визит Вольного Торговца! И такое отвратительное происшествие..."'
- guid: 600311ae-ea54-4177-9521-cee197e8aa8f
  text: В контейнерах лежат остатки камней и фресок с изображениями черного пятна, вокруг которого высятся какие-то постройки.
- guid: 6011f58d-d60e-47b4-b731-b04305b3e3e4
  text: '"Аделина... Сегодня мы наконец встретимся".'
- guid: 603e98bf-c840-4c74-933d-c3310175e525
  text: '"Что ты сказал, мон-кай? Я не расслышал".'
- guid: 60479080-2979-4af1-b930-e1750ed831b4
  text: '"...Ваша Светлость, позвольте представить следующих гостей: защитников Даргонуса, пришедших из тьмы меж звезд..."'
- guid: 6065d492-37ac-4cc0-9a85-bc8d81150496
  text: Офицер смущенно отводит взгляд и почему-то косится на Вигдис.
- guid: 606be05e-dce4-4056-a066-294c70817552
  text: '"Внуши силы нам и дай мужество превозмозмочь беды и страдания во имя Твое..."'
- guid: 6077d22f-f2ef-4c33-b4e6-c0e2dc611a35
  text: '"Я это первый увидел!"'
- guid: 607d3d74-4a16-41ab-b01b-300a2b743d94
  text: '"Не сомневаюсь, что Темные ушли довольные нами — мы преподнесли им прекрасное пиршество боли и страданий".'
- guid: 6094fbf0-5a74-494f-9c59-336f9a64f9c6
  text: '"Защитник человечества здесь!"'
- guid: 60e6cac7-af36-49a7-90c8-ba19bb9ee937
  text: '"Нет... Это невозможно! Во имя Лекса, как подобное может существовать?"'
- guid: 6121e26d-6d53-43c1-9de6-29ff39acb885
  text: '"Это же Эрдриг ван Торнстен, сенешаль Каллигоса Винтерскейла! Бог-Император, да его разрубили пополам одним ударом!"'
- guid: 6126c826-9a06-4a83-a968-741c3001d57c
  text: '"Запаса топлива едва хватает на смену. Надо стащить у Октавианы пару ящиков ее "фирменного", сойдет для дела".'
- guid: 614e0c2e-b424-4ba8-8758-7d12c6407a49
  text: '"Дорогой мой, вы живы. Можете и потерпеть временные неудобства, пока не доберетесь до владений своей семьи".'
- guid: 616d606b-e647-4bf9-b0f9-61904a0ac74e
  text: '"Кто мы? Ты стимуляторами обкололся, дядя?"'
- guid: 61819bcb-8192-4236-b0ce-61dc31c7efcd
  text: '"Да, помойка та еще. Хоть догадался сенешалю за его благоволение бутылку амасека раздобыть?"'
- guid: 61915084-98de-4eba-a879-12c92b3fbe1f
  text: '"Остановитесь, братья! Это я!"'
- guid: 619ce47b-3c1f-41a5-9c39-7f2055dfe02a
  text: '"Да? А какой дурень молился, что б нас грамоте учили? Лучше б башмаков новых попросил или рационов на халяву".'
- guid: 61a46549-711b-47a4-a016-27e81bb18b73
  text: '"Трон Терры, как же больно! Пощадите! Прошу, умоляю, прекратите это! ПРЕКРАТИТЕ! Мммммммгггххх!"'
- guid: 61bddc93-47c9-4c7f-b8eb-70676f182fd5
  text: '"Я равнялась на тебя, следовала каждому твоему слову. Если бы только я догадалась ослушаться тебя в решающий момент..."'
- guid: 61cb39dc-ed96-4608-b171-28c84b0bb396
  text: '"Бить перестали, а толку-то? Сейчас они сдерживаются, так после при инспекциях отсеков отыграются..."'
- guid: 61da5f75-e911-4fe8-bfe5-3e86c5be845b
  text: '"Милость в обмен на милость, Ваша Светлость. Не беспокойтесь, послушничество не загубило мои навыки блюстителя".'
- guid: 6208ac9e-1eae-4dbe-962c-4aa41cde7051
  text: '"Помилуйте, добрые люди! В чем нам каяться? Мы — обычные портовые рабочие. Клянусь ранами Императора, мы закон не нарушем!"'
- guid: 6219c4ee-83e3-4512-a058-b2c1881305cd
  text: '"Род Зауэрбэк веками служил династии Вольных Торговцев фон Валанциус. Мы никогда не давали повода усомниться в нашей верности".'
- guid: 6235fc1d-af43-41e6-be9d-3019073d2f36
  text: '"Какая удивительная смесь богомерзкости и утонченности. Творения ксеносов так упадочно забавны!"'
- guid: 624ea091-cb93-4cac-8486-2497ab5a623c
  text: '"Блюстители на днях нашли еще одну заблокированную секцию на средних. Разрезали двери, а там трупов битком. То ли их что порезало, то ли сами с перепугу друг друга перебили".'
- guid: 62514622-4e09-40e7-bf2b-dcde91b6ba33
  text: '"Проклятые ксеносские твари, мы заберем вас с собой! За Императора!"'
- guid: 62514b5a-39d0-4df8-b9cd-74a9a26e11e6
  text: '"Интригует".'
- guid: 629cad4b-52f6-4e1a-9545-f0bebccc0308
  text: '"Когда долг стискивает сердце подобно железной клетке... Выберешь ли ты близость в неволе? Или прорвешься сквозь прутья на свободу, обломав при том крылья?"'
- guid: 62cfbb9b-905a-4709-8313-a315a0aebeac
  text: '"Тише. Лоутон был дураком и трусом, таким и помер. Не надо о нем вслух".'
- guid: 62d0b96c-89ec-4c1c-a99b-68f4498a17e3
  text: '"Все разумные существа боятся встретить свой конец. Чтобы избавиться от страха — нужно сначала принять его".'
- guid: 62f406b4-2ea7-4733-9a74-194266b6b6ac
  text: '[Анализ состояния топливной системы] // [Статус: Диагностика] // [...] // [Заключение: Нарушения не выявлены. Система работает исправно.]'
- guid: 62f9d703-031a-4b72-9f75-702accd97c85
  text: '"Я жду исполнения завета, мон-кай".'
- guid: 62fa5214-4d31-4c2d-9676-1bd2ce8f9de4
  text: '"Номер одна тысяча сорок четыре, заверитель ожидает вас".'
- guid: 6384250e-a0c4-40f2-ac19-07ac2b2f5622
  text: '"Никто о нас, сирых, не думает... знай, работай да помалкивай..."'
- guid: 6395ad52-2e4c-4c28-9a88-c97144adaa81
  text: '"Бог-Император, даруй мне сил выжить и отомстить..."'
- guid: 63ac7346-e538-4d12-a414-3de873d7d2b5
  text: '"Слава венценос{mf|ному|ной}! Ура фон Валанциусам!"'
- guid: 63bc78de-4e01-4920-9cf2-bd543041c0d5
  text: Громкий свист расходится эхом по канализации... и затихает. Похоже, вы повредили клапан, когда вставляли баллон в приемник.
- guid: 63dd278c-3faf-41fe-9a24-0cf0004d94ab
  text: '"Мне нравится твой клинок. Отдай-ка его".'
- guid: 63f5e46f-f5c0-4455-b03b-0b79c857601a
  text: '"Ваша Светлость, что же это за напасть?! Нешто последние дни пришли?! Помилуй нас Император, нешто все помрем..."'
- guid: 63f85689-2a7f-4c4a-8b6d-5105368a96fc
  text: '"Слышал, Кхорган пригнал новую партию машин".'
- guid: 64357da1-1a26-48ad-b849-1c80e4fb840c
  text: '"Тебе просто повезло, мон-кай. Но везение — это все, что у тебя есть. Ты слаб{mf||а}... Так что готовься страдать!"'
- guid: 64ba24a9-969e-4197-99d6-9a839e97b0c4
  text: '"Слушай, Зандер. Я тебя уже пять лет знаю, и все эти пять лет ты так представляешься. Зачем, когда вся "служба" — это только ты?"'
- guid: 64ba551e-4a05-4968-a818-429677d5087a
  text: '"Ха-ха-ха! Мой взор ясен и разум чист! Я вижу смерть и будущее!"'
- guid: 64ea5077-7000-46aa-a72c-3f04aace2ec1
  text: '"Гр-р-р".'
- guid: 64f12456-aa2d-46ec-91b4-578adca19320
  text: '"Страсть связала сердца Вольного Торговца фон Валанциус и Джай Хейдари!"'
- guid: 64f9f159-9542-4a1b-a4ad-2006c6dbec13
  text: '"С ума сошел? Версериан мне голову оторвет, если решит, что я ему взятку дать пытаюсь!"'
- guid: 6531c3a8-22a2-490d-b1e1-7a58e4fdb0b0
  text: '[Draft]'
- guid: 6579bb28-6189-4648-aa32-a50ffa6ad09c
  text: '"Катарина... где ты... Я потерял тебя... всех потерял..."'
- guid: 658742c8-7115-4e96-8be1-15d357d2732e
  text: '"Тс-с-с... Ты даш-ше не претс-с-тавляеш-шь..."'
- guid: 65a4c7a8-fc7b-4a37-9c7b-2e434afe12d4
  text: '"Шепотки с той стороны что-то разнервничались, не нравится им этот символ. Отличный знак, нужно продолжать искать!"'
- guid: 65cde82c-8072-4e9a-b59b-84139edb7ed3
  text: '"Тлен... тлен..."'
- guid: 65ef500d-f08f-4306-a181-3220cdbf0c95
  text: '"Трон святый, ты все еще боишься, что за тобой придет Инквизиция? Нужен ты ей!"'
- guid: 660149c2-a143-4d43-8cb1-15ffc2d7965b
  text: '"Не говори со мной без разрешения, игрушка".'
- guid: 660c3a5b-113b-45b2-8f92-15ee471f9b8d
  text: '"Это ложь... Это ЛОЖЬ! Эти... пути не мои, жизни не мои. Есть только одна я, настоящая я... Пойдите прочь!"'
- guid: 66290b3f-ae10-4693-8d96-fc04c5f45403
  text: '"Только жижа горькая и сочится. Засуха, видать".'
- guid: 6629828e-6962-42f3-8482-4c1d03a5df74
  text: '"Этот шпиль пронизан энергией тысяч истерзанных душ. Я чувствую их ярость и желание отомстить. И их беспомощность".'
- guid: 664237b8-0305-4a35-89a7-39160dfbde09
  text: '"Ого! А мне кое-что интересное попалось!"'
- guid: 66496a85-a655-427c-8af8-2b49e17b8aa3
  text: '"Раз вы здесь, семьи от вас отказались. Вы все отбросы, достойные только вони нижних палуб!"'
- guid: 665ba2ca-b06e-47cf-b9f0-3d9202a4ed49
  text: '"Критерии будут заданы Вольным Торговцем, арбитр".'
- guid: 6672497a-29bd-4e37-bccd-6d402c6a97dd
  text: '"Познай дар тлена!"'
- guid: 6691e05d-2a65-4928-b7be-394f0b9a2d9a
  text: '"Эти Версерианы... те еще выскочки. Чем они только заслужили свое положение?"'
- guid: 669bd416-6cbf-4fe9-97b3-1a0a90e0fb49
  text: '"Надеюсь, я не ошибся..."'
- guid: 669f8a10-ef4e-43df-8aff-231fd45e63ee
  text: '"Сюда-сюда, за мной, скорее!"'
- guid: 66a7bf67-b987-4bdb-b176-a2c88c5d8363
  text: '"Пьем за ваше здоровье и благополучие!"'
- guid: 6700a244-9522-4b6a-a8be-e79f7fe112cd
  text: '"Я в грезе песнопения или... Это правда вы, Лорд-капитан?"'
- guid: 67063bb2-3d1a-403c-92f1-91d239918ae1
  text: '"Три вещи по цене четырех, только на время прибытия Звездн{mf|ого|ой} Госпо{mf|дина|жи}!"'
- guid: 6716d908-e37f-44cd-9b71-dbec35144767
  text: '"Слышали последние новости? Говорят, с последней загрузкой на планете на нижних появилось много новичков. Интересно, это у нас мор в экипаже, раз решили восполнить недостаюших? В прошлый раз сизая проказа многих выкосила..."'
- guid: 67250c5b-6550-417a-b18d-368ee563d264
  text: '"Ааа! Забери меня тьма!"'
- guid: 672e2045-6225-43da-b693-03b3b45e8e86
  text: '"Поторопитесь — каждая минута может стоить госпоже жизни!"'
- guid: 6735d2d5-20ab-487b-9fbb-e716cc1ae9ad
  text: '"Стремление заменить плоть священным металлом квалифицировано как естественное".'
- guid: 674c41e2-7c1b-418f-a49d-b38b91be791c
  text: '"Вашей Светлости угодно проследовать во двор?"'
- guid: 675b5f1a-9db4-4d89-b157-be9a5982b269
  text: '"Наконец свежий воздух. Воистину мы не ценим то, что имеем".'
- guid: 6771ad3b-34a5-4762-8e1c-43922eacf0c1
  text: '"Это последняя ампула, выделенная узлу на рабочий цикл. Ты хоть понимаешь, сколько она стоит?"'
- guid: 67877257-9b82-4b01-8861-858c97702e9b
  text: '"Ох ты! Никак с верхних палуб к нам их благородия пожаловали!"'
- guid: 678c6399-399d-474f-876f-c6d368ee49d0
  text: '"За вами и в огонь, и в воду!"'
- guid: 678e65aa-d260-4555-b3d2-14431bb1815c
  text: '"Он{mf||а} убил{mf||а} Кикеросс! Арена оскорблена!"'
- guid: 67f557cf-c183-4192-817f-c9b1b93c09a8
  text: '"А что, если та тварь-охотник придет? Ну та, которая в тенях ползает".'
- guid: 680a76c3-9fe7-4a74-8453-2b82d10ee5e5
  text: '"Леди Теодора порой так надолго исчезала в своем кабинете... говорят, в прямом смысле слова! Слуги не могли ее отыскать, а потом она вновь появлялась за своим столом!"'
- guid: 6868d638-5025-4dbe-9fe1-8f5f5ceea022
  text: '"Облегчи душу. Твои подельники уже во всем сознались. Покаешься — бить будем только палкой да стрекалом. А будешь упорствовать, так я нож достану".'
- guid: 68693b99-7a33-4708-aeae-67eba5013770
  text: Большинство несчастных покончили с жизнью, выпустив себе кишки.
- guid: 686c8de5-4ef0-43be-972f-000b02c5c594
  text: '"Господин, за кого вы меня принимаете? Разве у вас хотя бы раз была проблема с нашим товаром?"'
- guid: 6874e37e-ed65-456e-8d4f-63f64312f550
  text: Страж бормочет слова благодарности, протягивая вам какой-то предмет.
- guid: 688d0e6d-01d5-4be1-975c-7e5b6953bbc2
  text: '"У нас, считай, нога под землями пылала. Я сам видел, как люди с ума сходят — вдруг падали на колени и начинали глаза себе вырывать..."'
- guid: 688e6c18-f496-408b-9027-6846efae768d
  text: '"На линии все спокойно, Лорд-капитан!"'
- guid: 68d40548-1996-418a-b50f-ffb233959eaa
  text: '"Я... Был полностью поглощен расследованием нападений по всему протекторату. Я подозревал, что атаки ксеносов скрывают за собой нечто большее, но..."'
- guid: 68e15f0d-7f5c-4566-be1b-d8b7b6c5c52d
  text: '"Умоляю, нет! Только не в сервиторы!"'
- guid: 68e9e536-7730-471b-9929-cac1d18a6971
  text: 'На панели застыла надпись: "Аварийная блокировка. Необходим офицерский ключ доступа".'
- guid: 68ef2a0b-5a8b-4222-aee9-05a9a9c5572d
  text: Экран выводит схему блокировки подъемника. Два механизма не дают машине заработать.
- guid: 69a31e4d-5264-487d-8f29-9e582211a519
  text: '"Инквизиция? Здесь?"'
- guid: 6a0b8d5c-6bba-4986-910b-252a4a6c85d3
  text: '[Draft]'
- guid: 6a195181-b18e-4ef3-8ae7-1e2b25e5dbdc
  text: '"Будьте прокляты!"'
- guid: 6a1f9b0c-2e3d-43ae-be04-138f43638427
  text: '"Может, и не грабил. Значит, знаешь, кто грабил. Или кто товар сбывал. Или кто болтал, что знает, кто сбывал. Ничего, ты у нас в исповедальне покаешься. Все каются".'
- guid: 6a24983a-0f39-4100-afee-1988e534e881
  text: '"Подобным образом Имматериум откликается на силы тех, что властен над варпом. Псайкеров... или же навигаторов".'
- guid: 6a60ba33-f953-4fd6-86a2-71cdfa9ebe5b
  text: '"Ну и работенка — поддерживать порядок в таком месте, как Футфол..."'
- guid: 6a9b9c8c-2ef5-4578-b9a7-5acba23a84af
  text: '"Только посмотрите — да эти контейнеры просто напичканы взрывчаткой! Ваши ребята умеют ставить растяжки, правда?"'
- guid: 6a9e7404-7dc9-4119-a5ce-2b9d6a737b90
  text: '"Куда же вы, шерин? Охота на пустотных крыс только началась".'
- guid: 6a9f7a31-53c5-491d-a3b3-b8bf1a30c8c6
  text: '"П-помилуйте! М-меня уже ободрали до н-нитки!"'
- guid: 6aa31184-c24b-472c-bbc1-441193215fca
  text: '"Едва ли служители Адептус Министорум приблизятся к миру Вольного Торговца и станут наказывать местных. У династии Винтерскейл непростые отношения с последователями Его".'
- guid: 6af5c71b-d76b-4937-b2c5-d77479ad852f
  text: '"Напои меня своей болью, мон''кай!"'
- guid: 6b02f1ca-067f-4286-a0e3-f6d55d98377d
  text: '"Если же желаете узреть более изысканное развлечение, то узрите, как низвергнутый дракон Опустошительной бури бьется за жизнь против великолепных чемпионов арены, Кровавых прозелитов!"'
- guid: 6b0f2c58-867a-4c1d-98e8-d8b978bdf275
  text: '"Какой лежать! Мы еще не выпили за здоровье его святейшества Иеронимуса!"'
- guid: 6b1b5106-0544-46ba-b163-e2953e5e1764
  text: '"Конечно, передам. Никогда такой грех на душу не возьму, чтоб присвоить церковные пожертвования. Император все видит!"'
- guid: 6b5be4fb-af7c-4dc6-8b28-3c2c78685e98
  text: '"Кто это? Неужели... неужели помощь прибыла!"'
- guid: 6b9f04b8-5f2b-4b11-a74a-3c8a09b22003
  text: '"О, тебе тоже это интересно? Скоро узнаем!"'
- guid: 6c05007c-6c55-4937-88d8-c24c810e96bf
  text: Великолепный алтарь во славу Бога-Императора, Защитника Человечества, властителя Терры
- guid: 6c1c0ab0-12ae-4e81-b61f-718a6c0f76d4
  text: '"Кх-ха-а..."'
- guid: 6c1cd360-301d-467e-9405-8622141d6684
  text: '"О, Бессмертный Император, охрани слуг своих ото зла..."'
- guid: 6c1f3673-6d54-4bf1-9859-38c092634d3c
  text: '"Коллапс явствует, но Йекхмет бьется. Йекхмет яроствует".'
- guid: 6c3427c9-6b14-46c7-8282-87baa9d96887
  text: '"Он пал, а мы — живы. И это чудо Его!"'
- guid: 6c6b1947-fbd7-4370-a6d7-8d45a20be3ee
  text: '"Вижу один из нужных вентилей, шерин".'
- guid: 6c77da9f-9563-4a6c-a2a6-56f38dcc6b4d
  text: '"Говорят, для своих у Октавианы, хозяйки "Адептус Амасекус", под стойкой припрятаны интересные товары..."'
- guid: 6ca91db9-fbe3-45ab-8c2a-a18e782e1ad3
  text: '"... отсек DF-541. Ваше обращение: несанкционированное открытие шлюза. Опишите ситуацию".'
- guid: 6cbf1c93-82c7-4f32-ac84-2a4d77fa1deb
  text: '"Приветствую, Ваша Светлость! Так, на чем я остановился? Протокол дознания номер Д-379, приложение А15, экземпляр третий..."'
- guid: 6d196d57-60d0-462d-9d9d-b64b763cb20a
  text: '"А? Кто это говорит? Нет, не слушаю! Опять ересь!"'
- guid: 6d294758-1b34-4b5b-a669-2cd4ad905ed6
  text: Панель мерцает зеленым светом.
- guid: 6d41f94c-bf56-4421-b527-39421038cc23
  text: '"Помеха в освобождении, я заметил тебя. Ты будешь устранена".'
- guid: 6d5eced7-79bb-46a4-a52f-c9c7d0de523f
  text: '"Просмотр — бесплатно! За пару монет можно выместить гнев на поганых тварях!"'
- guid: 6d708abd-8b07-4a9e-a08f-831d8ea08e89
  text: '"Не губи, ваше вашество!"'
- guid: 6dae6d7d-75ef-4353-8c29-6311a9c033db
  text: '"Говорят, раньше здесь спокойнее было. А теперь то зверье нападает, то травятся местным хавчиком..."'
- guid: 6dc18403-40dd-4812-aa71-73e4dbe12bce
  text: '"Давно таких перелетов не было, как от Райкад к Фурибундусу. Слыхали про седьмую топливную?"'
- guid: 6df5fd9d-6b61-48dd-aee2-23c1b8e62f76
  text: '"Мы не знаем, где ваш зверь! Не убивайте, не надо!"'
- guid: 6e14213b-6f85-41a7-a058-b4bb9c7d951e
  text: '"Приговор — смерть, оспариванию не подлежит. Привести в исполнение!"'
- guid: 6e38bdca-960d-47bc-81f7-c386e15320d4
  text: '"А там кормят? Если да, то готов учиться!"'
- guid: 6e4996ac-d69b-4ec4-b833-3c64a0767d6c
  text: '"Ты чувствуешь тлетворные миазмы этого места? Не прикасайся ни к чему!"'
- guid: 6e659736-29da-4f69-9708-c610e5f1f613
  text: '"Вынужден констатировать, что для данных мирян наше присутствие остается незарегистрированным".'
- guid: 6e7e3fb6-11e9-43a2-b0ce-ac5c5dbf0738
  text: '"Хочу. Вот, держи. Только передай или преподобному, или кому-то из проповедников лично в руки!"'
- guid: 6e827e47-62e4-4b9a-892c-31bfccbd14ab
  text: '"Проклятый трон, да мы сейчас сгорим! Пушки наголо, надо прострелить ход наружу!"'
- guid: 6f1a3554-e146-42b3-9ed6-cfbccf923ff5
  text: Взбешенные потревоженным сном, машинные духи обдают вас плетью электрических разрядов... И лишь после оживляют когитатор.
- guid: 6f230ac0-6c1c-4022-9158-24d9437a0c2c
  text: '"Ты... годишься. Зачислен в ближайшую грузовую смену. Шевелись!"'
- guid: 6f3fe9ba-c941-431a-90ec-af4ab27a63c1
  text: Похоже, этот узор больше не работает.
- guid: 6f94a77c-22c4-4380-b8f1-5bf726842bd6
  text: '"Когда ты последний раз видел Кава?"'
- guid: 6fbf974d-ebb7-4d86-a20b-68e9a643d767
  text: '"Кровь еще не засохла. Кто-то ждал, когда мы придем".'
- guid: 6ffb2b90-74bd-498c-8f51-a5c75c81794b
  text: '"Что? Как вы сюда попали?.. Именем Небесной Посланницы, ни шагу дальше!"'
- guid: 701219e3-70bb-422f-bfea-7b7da5a41e95
  text: '"Происходящее сейчас — только начало. Мир погрузится во тьму и в ней лишь верные Заре обретут спасение..."'
- guid: 70346e94-121f-4f8b-be28-54a45fa36827
  text: '"Место для баллона с газом — у всех на виду, и при этом самое неприметное".'
- guid: 708c749e-ad3b-4a38-a4c2-697de0b008ac
  text: '"Лорд-капитан! Раскрыта ячейка заговорщиков — предатели убиты, оружие конфисковано".'
- guid: 7099fea1-2080-4f52-a722-e8c53d1a1b37
  text: '"Лорд-капитан, прикажите отставить огонь — металлолом на абордаж не возьмешь, да и десятина пропадет!"'
- guid: 709b9da1-2ba1-4416-b8d6-e87b837233a2
  text: '"Всего вам наилучшего, Ваше вашество!"'
- guid: 70ace22d-0048-4cd2-a364-fae58406bd8b
  text: Запорные механизмы врат требуют вознесения бинарной молитвы.
- guid: 70b27ee4-ddaf-487a-86d6-8d4c4f5969ca
  text: Нужно... убить... врагов!
- guid: 70b7c735-4f90-4165-a762-22fffc165c8e
  text: '"Подходите! Подходите! Посмотрите в глаза врагам Человечества!"'
- guid: 70edecd0-aba8-45f6-8dcb-82657df7af89
  text: '"На удивление спокойный варп-переход. Помню, пару циклов назад было жестко — и психоз словили многие, и ведьма опять начудила..."'
- guid: 71499107-9bce-4bbd-906a-fa898ed1b65d
  text: '"Ксенос здесь! Император защити..."'
- guid: 71591ec0-c8c5-4064-adb8-abaf3133e7d1
  text: '"Но из этого же огня ты черпаешь свою силу. Прими его без остатка. Прими себя — и усмири бушующее пламя".'
- guid: 7160ebff-941e-40dd-a32f-4af07c7ecb97
  text: Механизм собирал безумец — компоненты друг другу не подходят и лишь смущают разум, однако вы вовремя замечаете скрытый триггер. Ловушка!
- guid: 7197eb4e-57ed-49af-9538-c7b25dc7f929
  text: '"Назад! Или эта тварь превратит вас в безмозглых рабов!"'
- guid: 71a3d9f2-7eb3-4d06-b69c-8294c9c61856
  text: '"Истинно говорю, они еще вернутся. И всех нас сожгут!"'
- guid: 71a8c4ee-c51a-466c-bac2-e035afe42ca6
  text: Бедолага, расписанный пиратскими татуировками, глупо пялится на вас и шевелит слюнявыми губами.
- guid: 71a99ec5-10bb-46d8-b172-dc162f2a7c4f
  text: '"Могу чем-то помочь?"'
- guid: 71b3849f-5814-45c9-9ae0-d3c04d2ccb3c
  text: '"Покайтесь, грешники. Облегчите душу, и Император смилуется. Живо признавайтесь, пиратствуете?! Воруете?! Торгуете контрабандой?! Не молчать!"'
- guid: 71c89fe5-dc6e-4c3b-86f1-627bbfd47d48
  text: '"Ваше святейшество, преподобный Иеронимус! Я уполномочен передать вам анонимное пожертвование".'
- guid: 720360c2-07e0-4ce1-90cf-b820e90043fc
  text: '"Ваше стремление к усовершенствованию тела вызывает искреннее восхищение! Уверен, вы осознаете, что делаете".'
- guid: 720b39ee-1629-4c5c-bff9-0e6960f4ff72
  text: '"Заткнись, пока я не сдал тебя за преступные разговоры! Ты в своем уме, такое болтать вслух? Держи язык за зубами, понял?!"'
- guid: 720e29b1-0c20-4486-8871-e927e0359e55
  text: '"Видеть персон таких кровей — высшее благословение!"'
- guid: 722b7d07-63f4-41fc-bcda-d457aaf35ae8
  text: '"И что же сей нечестивый сын грокса и брахана хочет от меня на сей раз?"'
- guid: 7246304c-4281-4009-83e6-8058fb0baec1
  text: '"Служу Человечеству!"'
- guid: 7278756c-e4ea-449e-a583-5a72e1a69ac1
  text: '"Домин''{name}, кровавые смотрители приветствуют тебя! Мы — твой щит".'
- guid: 72cb1b8e-cda5-4bf5-9881-128c962e8969
  text: '"Спасайтесь!"'
- guid: 732124f3-4202-4f38-9fbf-62cfe759fde7
  text: '"Друкари! Почему проклятый друкари здесь?"'
- guid: 7396d086-3cb2-4c10-a044-811cff28c442
  text: '"Они не тычут в меня пальцем и не призывают сжечь... эти мон-каи сломаны".'
- guid: 73978c93-40ed-4396-a812-50d87deaae67
  text: '"Сраженный рукой Сирлаэль, опустился на колено мечник и признал ее мастерство. Был он не смертным, но творением богов, ведавшим почтение к совершенству. В награду за победу предложил он Сирлаэль дар — указал, где она сможет отыскать отмщение".'
- guid: 73b9ac7e-9218-43de-b77a-85f5c73dd9e0
  text: '"Вставай! Нам предстоит увидеть новый свет вместе!"'
- guid: 73ffc0a6-c6e0-40da-9807-50a3f3db142f
  text: '"Познавшие благо болезни и прения, несите нашу Истину братьям и сестрам! Подобно хвори, наши верования должны разойтись повсюду, наградив праведников благими нарывами!"'
- guid: 744f0703-94e9-483d-a65f-6a21abd80bf1
  text: '"Придурок, смерти ищешь! Они сюда для того и прилетели, чтобы таким как мы кишки выпускать!"'
- guid: 7458e199-6fb9-4b35-bd69-de038d0260f2
  text: '"Не советую. Я видел, что наши "друзья" сделали с придурком, который решил помочиться на одно из этих каменных лиц. Ты не хочешь оказаться на его месте".'
- guid: 7487df1e-6af5-4da2-8787-4687f01ac7fa
  text: '"O, я читал об этом".'
- guid: 74b31845-1315-46f7-bbc0-554c11018b64
  text: '"Я все видел! Ты мухлюешь!"'
- guid: 74ba9b50-a1fd-4b6c-8d5d-f3a1931c7917
  text: '"Еще мон''кай? Смотрите, братья, да им самим не терпится умереть!"'
- guid: 74bc8ac9-3373-45dc-9f74-87178fe34cbc
  text: '"Слава династии фон Валанциус, покорителям неизведанных звезд!"'
- guid: 7510b088-9142-4932-8de8-e1d4fdb88ac0
  text: '"Кто-нибудь! Откройте дверь! Откройте дверь, пока он не добрался до меня!"'
- guid: 7548e17d-4ad0-40a9-a093-053d4fc66110
  text: '"Ладно, ты глупые сплетни не повторяй только".'
- guid: 757d1e5a-e605-451b-8f76-17db686d7293
  text: '"Архонт забрала всех ценных пленников, захваченных в рейде. Эти — ни на что не годные отбросы".'
- guid: 7586cd8d-0dc1-4cfa-89f5-fc9216365325
  text: '"По сюжету она повергла их всех и пошла дальше... Но наша история будет короче. Взять!"'
- guid: 75cf7f0c-a1b1-4b1b-9790-bc81b4ac1e1e
  text: '"Тяжелый день?"'
- guid: 75e815bf-9718-467d-a004-ec141cdb6125
  text: '"Я позволю тебе уйти, человек. У тебя есть... потенциал. Возможно, ты еще сможешь оставить след".'
- guid: 761de32a-a657-4d5f-ba88-5e23b44874ab
  text: '"Установлено некорректное значение. Сбрасываю настройки к стартовым. Ожидаемое значение: 10".'
- guid: 76233013-b145-49ff-af86-2c67546df279
  text: '"Почему мне никто не сказал про талон? Я здесь уже семь оборотов торчу!"'
- guid: 76515010-f300-4191-b118-ad95f00393c6
  text: '"Анализ стороннего оборудования..."'
- guid: 766b9f96-2990-47d3-9ae8-f7a4642ff3b9
  text: '"Сей призрак был послан, дабы запутать нас. Направь свои шаги прочь от него, Домин".'
- guid: 76de5798-7ced-4f85-b12c-7f5796548ed7
  text: '"Ересь проникла в стены почтенного Дома Навис Нобилите. Скорбный день".'
- guid: 7700eed4-b06d-4d2f-ae52-7b8d3c324173
  text: '"Боюсь, {name}, мы уже ничем не поможем тем, кто пытался здесь спрятаться".'
- guid: 772b8b33-2f88-4c28-b7b4-0a750e5a6769
  text: '"Нет, засунь это обратно! Не надо из меня ничего вытаскивать!"'
- guid: 77a2188c-9f49-462a-ac1b-3cc73513668e
  text: Вы возносите молитву, прося сил для защиты того, что вам дорого.
- guid: 77b287c6-cac2-426e-8e74-52ab84e15bfb
  text: Вы нащупываете пыльную кнопку, замаскированную под аквилу. Нажав ее, вы слышите скрип древнего механизма — где-то что-то открылось.
- guid: 77c5c05e-b4e3-4518-9eaf-4b48bc74e624
  text: '"Вселенная велика и исполнена кошмарами, хищными и богомерзкими. Человек есть добыча их, утоление глада их".'
- guid: 77fe187a-73b9-47c2-bb3a-cfcb2beca678
  text: '"Кто знает, кто знает... при Леди Теодоре так было, а сейчас все по-новому..."'
- guid: 781e6353-9cf0-4a02-bf6b-b206a063e760
  text: '"Демон Имматериума! Мужайтесь, нас ждет кошмар наяву!"'
- guid: 784869b9-dd8e-4271-847c-0ee9c1889ac8
  text: '"М-мы остаемся на станции? Но она же вот-вот..."'
- guid: 78641f48-9801-48fc-a9c2-4c460b67837d
  text: '"Ты будешь очищен{mf||а} Движущей силой, богохульни{mf|к|ца}!"'
- guid: 788c6d8c-01e9-48cd-ba05-64aaf5f2dcdd
  text: '"Лорд-капитан, я точно помню, этот морок — ловушка".'
- guid: 78a0dece-f0e8-4d84-81f2-038e4f615124
  text: '"Да? Что-то не так?"'
- guid: 78cd1b50-577d-4e06-8d73-49d9acfa4270
  text: '"Такие похороны Дензу пришлись бы по вкусу. Храни вас святой Друз, Ваша Светлость!"'
- guid: 79163e18-1b60-4964-901a-f5c307be87a1
  text: '"Если бы меня как его били, я бы и не такого наболтал. Хранит меня Император, хранит..."'
- guid: 7931d337-f930-4b32-b3da-538a31a874e9
  text: '"Это ты прикончил{mf||а} Кикеросс? У нас сегодня деликатесная жертва!"'
- guid: 793cc11e-b161-40d7-88b9-88923adf1ed3
  text: '"Слава Вольному Торговцу!"'
- guid: 796b0a3b-8754-4836-9b39-d0b985ac39d2
  text: '"Избавитель{mf||ница}! Да здравствует Вольный Торговец!"'
- guid: 797cc9f2-e284-4fdb-a0cc-ef0eef47b617
  text: '"Футфол... наконец-то... неужели я своими ушами услышу проповедь преподобного Иеронимуса?"'
- guid: 7984760b-8039-4d22-b28a-eea88f695b8d
  text: '"Истина, направь мой удар!"'
- guid: 79a66c98-7e6e-4576-afc1-1c7ef9af24ac
  text: '"Может, кто из Кровавой паутины выжил? Надеюсь, это просто слухи, и настоящий священный убийца не ходит среди нас..."'
- guid: 79d04217-5924-4921-acc3-0e736a9b9d52
  text: По аугментированному телу сервитора пробегает заметная дрожь.
- guid: 79e3145f-1119-461a-b87e-8fa614828630
  text: '"Уа-а-а-х. От этих испарений клонит в сон..."'
- guid: 79ec853f-e7ab-4937-a204-120d4a4b29bb
  text: '"Отныне ты — воин Кровавой паутины. Клинок, напившийся гнева Неумирающего..."'
- guid: 7a0fb7c3-28c1-4a31-8dc3-9aac1c8b50dd
  text: '"Да пребудут твои священные коннекторы в безопасности от зла энтропии..."'
- guid: 7a71a689-1d44-4fbc-b340-db5fdd4c12a4
  text: '"Владыка фон Валанциус устелет путь на волю вашими внутренностями!"'
- guid: 7a9d8e78-4a6a-401e-a10c-51dd460926bb
  text: '"Ваша Светлость, ваш клинок рассыпался в руках гнусного вора! Виновный казнен. Готов понести наказание за дурные вести".'
- guid: 7ac251f1-b201-4c8a-bb81-2fdaf2029770
  text: '"Наконец-то... можно дышать полной грудью... Еще немного, и я бы упала в обморок!"'
- guid: 7acd361c-0fed-4e00-bc3a-1eff729b74d8
  text: '"Проклятые ксеносы обрушились на нас поздней ночью, перебили три отряда блюстителей! Пришлось отступать в леса. А Эрдриг... я понял, что он не выжил, когда проклятый лес вновь сомкнулся за нашими спинами".'
- guid: 7ae1d1b5-2f35-4eca-8ab6-ea00b8c80fe8
  text: '"Слава Лорд-капитаншеству!"'
- guid: 7af5fe59-f45c-43d7-bc89-93c3d44e12a5
  text: '"В забытом обрывке Паутины отыскала она логово, что охранял древний монстр неисчислимой плоти. Сколько ни разила его Сирлаэль, не убывало тело его и не слабел его рев!"'
- guid: 7b34830f-2f39-45b9-96cf-a1ee7d141ff7
  text: '"Тебе так нравится боль, {name}? Тогда не буду мешать".'
- guid: 7b4ffdcf-3040-47e0-8c0a-e30037be82e2
  text: '"Где ты? Откуда говоришь со мной? Вернись! Вернись!"'
- guid: 7b735a4d-498c-4fdd-a979-fdc24900bb03
  text: '"Курьерская служба Зандера Сонатуса! Вот ваш заказ!"'
- guid: 7b84f48b-45a8-4ca2-ba98-b57c5dbb5c93
  text: '"Да сохранит вас Император, Ваша Светлость!"'
- guid: 7bb0ca11-5c4b-4548-bd84-bcfb9b611da9
  text: '"Помогите! Помогите! Мой брат... он упал с крыши, он истекает кровью!"'
- guid: 7bcc03d8-2c36-4a12-82f7-7da2d0fd2db8
  text: '"Я... жив, и Глейто тоже... Воистину, Император защищает — другого объяснения нет".'
- guid: 7c003faf-1451-4940-8435-c3c1a2d18193
  text: '"Если бы не святая сестра и не вы... не думаю, что мы выстояли бы".'
- guid: 7c12777f-6a5d-4f2e-a7d5-37e4904f5619
  text: '"Они еще живы! Тащи сюда стимуляторы, все что есть!"'
- guid: 7c2814f7-9d95-4eb5-8cb2-77bb53d5aafe
  text: '"Я вырву твою печень и отдам на съедение духам ветров!"'
- guid: 7c441a82-87b0-41ef-81ce-fbd1012cc2ca
  text: '"Я не хочу бросать тебя в одиночестве — ты бы этого не оценил{mf||а}, верно?"'
- guid: 7c5e51ed-e2fb-4f23-b19b-f7e6062c6fef
  text: '"Смотри, в пасти что-то происходит!"'
- guid: 7ca59cd2-f759-4da8-9960-a9ab3bc2ec99
  text: '"В моровой яме смерть витает в воздухе, но тебе еще рано уходить. Не трогай лишнего, Домин''{name}".'
- guid: 7ca6b67a-38dd-4bd8-82fb-6eeed97dc688
  text: '"Члены экипажа сторонятся меня, и это ожидаемо. Облик членов Навис Нобилите вселяет ужас в сердца простых обывателей".'
- guid: 7d23c94d-dd93-4886-a3d5-21db13ef3e2b
  text: 'Это кажется невозможным, однако трупы шепчутся меж собой: "...МЫ — должны — ПоМоЧЬ — ПОМОЧЬ — госпоже — ГОСПОЖЕ — ГоСПоЖе — мы..."'
- guid: 7d32f900-18fb-4768-9018-df598bd9948c
  text: '"Может, попробовать распилить? Вдруг там внутри что-то ценное..."'
- guid: 7d5f73ba-9c28-48fd-ada4-a59250fa31eb
  text: '"Символы на коже должны кровоточить... Еще раз. Держите его крепче".'
- guid: 7d7fdde5-2ea2-4194-b0c5-b1b672268fbc
  text: '"...быть ослепительным примером Человечества,

    Несломленным невзгодами,

    Отважно ступать первым во тьму,

    Объединить и вернуть то, что было утрачено..."'
- guid: 7dda051c-b6b0-4e03-a930-6e09aad1e8c0
  text: '"Мой меч?!"'
- guid: 7e090278-830e-48a4-a266-98dcc024f642
  text: Воин Инквизиции держит оружие странного образца, какого вы прежде не видели.
- guid: 7e137836-c79b-4d9b-8438-f40d37da8e2f
  text: '"Бросьте сверкать своими неразумными глазками, мон-кай. Я вам не иссушеный лист, на месте не вспыхну".'
- guid: 7e36492d-0483-441f-93ee-26a098554140
  text: '"Я здесь, чтобы убить тебя? Чтобы предать тебя? Чтобы служить тебе? Друг или враг? Что думаешь, {name}?"'
- guid: 7e382d9a-6ac3-45e3-9808-d875693a6ebc
  text: Окровавленный боец что-то невразумительно мычит, цепляясь за изуродованное лицо
- guid: 7e856648-686d-42cd-b2eb-9f3cd3d1c0c6
  text: '"Император храни! Что ж у них жа жаконы такие? Даже перднуть нельжя — шмерть".'
- guid: 7ea8751d-43ff-4035-9d51-4f8c76d1af39
  text: '"Именем Дома Орселлио приказываю — казнить неверных!"'
- guid: 7ebb9d1a-0f54-4b25-b5bb-86de15f802c9
  text: '"Ч-чем помочь, Ваша Светлость?"'
- guid: 7ed0893d-da89-47de-8ba5-6f3ce0dc6372
  text: '"А остальное опять на ротгат спустил? Больше я поблажек тебе делать не буду — завязывай с пьянством или привыкай к жизни в моровой яме".'
- guid: 7ede3776-579e-4eed-b94b-b2f3d32f5eab
  text: '"Посторонитесь! Пропустите {mf|Его|Ее} Светлость — Вольного Торговца!"'
- guid: 7ee9f55b-fcce-44e1-b077-a62b3fbca232
  text: '"Я просто хотела жить. Почему? Почему?!"'
- guid: 7eec579a-b5f2-436d-b60a-29765e428558
  text: Пневмоприводы двери явно вышли из строя — открыть ее теперь можно только вручную, отыскав перед этим подходящий вентиль.
- guid: 7f10a02e-acf1-4279-9831-b8288614a371
  text: '"Где мой пес, отродья?!"'
- guid: 7f2f8e0f-011b-4154-ba7e-9ac6f325d6e7
  text: '"Блюстители... Ворвались и всех наших убили... Даже трупы забирать не стали... Как они узнали?.."'
- guid: 7f4b074f-0430-4d29-aea6-793ccd3e7105
  text: '"Честь имею, Ваша Светлость!"'
- guid: 7f78fabd-680a-4ee1-9eff-08072a0d8b7c
  text: '"За Янус!"'
- guid: 7faa6572-c286-400f-b20c-7f4b7beffa9e
  text: '"Седьмая топливная слишком близко к нижним. К ним постоянно лезут мутанты оттуда. Жаль, что нельзя передавить всю эту мразь и дело с концом..."'
- guid: 7fcc2258-c323-48b4-a31a-32ac1e39209a
  text: '"Хм... вы выглядите знакомо..."'
- guid: 7fce0f8f-9ed4-464c-bd3f-1cf053cfb138
  text: '"Слышали? К нам с верхних палуб Вольный Торговец спустился!"'
- guid: 7fce5ac3-53db-40d9-9622-31f923b54427
  text: '"Версерианы слишком далеко зашли. Хорошо, что господин Урбенд смог так быстро распознать их грязный заговор".'
- guid: 7fdda311-f540-4674-a9ec-562b9fb63434
  text: '"Значит, так. С этого момента любые работы с вакуумным шлюзом проводятся только в присутствии досточтимых техножрецов".'
- guid: 7ff267fe-b261-415f-8179-e8a54403d057
  text: '"Мощь нашего врага... немыслима. Вознесите молитву Неумирающему, ибо скоро мы будем подле Трона Его".'
- guid: 801f6a96-5991-49af-ac15-a3d3fdff1e93
  text: '"Я последую за вами... Пока что".'
- guid: 80282285-8522-4115-bfb5-568276151010
  text: '"Вот как? Надо, значит, на почтительном расстоянии от них держаться... Мало ли чего".'
- guid: 8037a84c-515c-4b3f-a551-4fd74a307505
  text: '"Десница Бессмертного возвратил{mf|ся|ась} в колыбель свою!"'
- guid: 8040cde7-3f2e-473a-8803-852c012022a2
  text: '"Раз даже Лорд-капитан отведал{mf||а} похлебки, может слизнеплесень теперь этот, как его, деликатес? Это, получается, мы тут как богачи пируем?"'
- guid: 80a0f0ed-d1e3-4b05-9291-2d2d0181d4d7
  text: '"Глубокое одиночество связывает мон-кай нитями привязанности. Но осколки неисцеленной боли терзают их вновь и вновь, порождая новые раны".'
- guid: 810f2723-e517-418c-8f98-498ad8e376ea
  text: '"Для меня любой житель Империума подозрителен, пока не докажет свою благонадежность".'
- guid: 815fd7c1-292d-4b32-ba22-5f70528374b1
  text: '"Пространство для маневров и защита с фронта... Удачное место для засады".'
- guid: 81879d39-cbf9-431b-abb8-64b55bd7d624
  text: '"...сей артефакт был изыскан при жизни великого предка нынешнего Вольного Торговца и почитается как святыня, знаменующая торжество Человечества над врагами его..."'
- guid: 8199d2f2-e082-425d-b99e-664772f54753
  text: '"Это не живые люди, а отголоски прошлого, вызванные к жизни колдовскими силами. Будь осторожнее".'
- guid: 819f0558-2b63-4318-90a0-c4e39a115ee4
  text: '"Вмешательство мирян в работу священных механизмов тревожит машинных духов. Во имя Омниссии, воздержитесь от профанных деяний".'
- guid: 81d1ce2c-02f3-4cea-ab4e-2a784265a3b2
  text: '"Узнаю кровь старины Абеляра — не видишь дальше своего носа, дорогая Клеменциа. Это не взятка, это подарок! А что до печати..."'
- guid: 81f033fb-1112-429f-98c4-e8f5bb38638a
  text: Грандиозный палубный храм занимает все пространство под офицерской палубой и освещен мириадом свечей и люменов.
- guid: 81fa1053-3f15-4f35-a18f-abae0d275805
  text: '"Смотрите по сторонам, твари могут лезть из труб или прыгать с потолка!"'
- guid: 81fd8b9c-6ec0-44f8-abef-deec6cf76ba7
  text: '"Фиксирую наличие дремлющих механизмов. Аномалия: неизвестные ритуалы усыпили машинных духов в обход положенных протоколов".'
- guid: 820e77c2-3edd-44e8-aec6-ae4f510bdaf1
  text: '"Друкари ведь безобиден, пока Вольный Торговец здесь? Так ведь?"'
- guid: 82102756-530f-45b4-a6ac-84345c93b1c5
  text: '"Горжусь тобой, {name}. Ты стал{mf||а} достойн{mf|ым|ой} преемни{mf|ком|цей} — и может быть даже лучш{mf|им|ей} Лорд-капитаном".'
- guid: 822137bb-1a40-452c-8f2c-76b72f6db60d
  text: '"Ку-да же вы? Я еще не вку-сил ва-шей пло-ти... кх''арг маар!"'
- guid: 824ae5e0-2a00-492d-bfc4-359907ed61d1
  text: '"Выходит, думают все-таки там, наверху о нас, нижнепалубных..."'
- guid: 8262b021-559e-48fa-82d9-cc20e202c948
  text: '"Зазнаешься, Лорд-капитан. Ты так же далек{mf||а} от простого люда, как проржавевший Футфол от Терры".'
- guid: 82807d36-11f9-4647-a139-f2c9a6775052
  text: '"Куда делся этот тунеядец? Паразита найти и отправить на разгрузку, дуделку сломать, крысу — в суп".'
- guid: 829561bb-d906-47f6-8471-6a86524f1b79
  text: '"Это, видимо, с того раза, когда машинные духи взбесились. Сколько людей погибло..."'
- guid: 82c559b3-1b88-4627-ac5e-44a076ede17c
  text: '"Хорош прохлаждаться, ублюдки. Пророк призывает — пришло время восславить Кровавого!"'
- guid: 82ec90d1-d116-4eed-8fd2-8c5ff6cc31fc
  text: '"Лорд-капитан сама к нам спустилась... благость-то какая..."'
- guid: 830ae478-6f73-4186-b572-54ed0d170d2d
  text: '"Странная энергия у этой штуковины. Она баюкает, слышите? Нет?.. Голоса уснули".'
- guid: 830d1cf2-64c6-4647-800f-5d1eb9da1773
  text: '"Вы знаете, я вроде видел кого-то в пламени... а, не берите в голову".'
- guid: 8330147b-58db-4c96-ad2a-3165c0090e0b
  text: '"Яростное пламя нашего крестового похода разгонит мрак этих упадочных систем!"'
- guid: 8338270a-3447-4104-8994-2b240d4790a3
  text: '"Если же наши пути сойдутся вновь и к тому моменту ты станешь кем-то значимым — что ж, у тебя будет шанс стать моим экспонатом".'
- guid: 8357768d-83ff-49ba-a9e7-5c2295e336d4
  text: '"Те, кто это устроил, поплатятся за все".'
- guid: 838d3d2b-7320-480c-b078-a2179d891482
  text: '"Говорят, эти ксеносы крайне редкие. Вольный Торговец наверняка кругленькую сумму за нее отвалил".'
- guid: 839eb6af-1726-412e-9afd-b64a2eeff46b
  text: '"Что вы... наделали..."'
- guid: 83a6e786-5e3f-441c-a6f9-f56005eef228
  text: Вас не удостаивают ни взглядом, ни жестом, ни словом.
- guid: 83aefe0d-7b13-445f-afe4-730c99b366de
  text: '"Слава Лорд-капитану!"'
- guid: 83c057b6-4e2b-4798-9895-6c7f2e9934f7
  text: '"Сколько боли в воздухе... сколько бессмысленных, пустых страданий вокруг нас..."'
- guid: 83d1f3e3-eaab-4a1e-95ea-12a2d367c4d2
  text: '"Что? Какие пайковые талоны? В чей карман? А ну молчать, выродки! Не сметь обвинять во взяточничестве господина блюстителя!"'
- guid: 84038293-a1c1-4d42-81d5-3d2f82cb5510
  text: '"Вы ж Фиделио, да? Вы ж никуда не торопитесь, да?"'
- guid: 84053cd4-bf13-4cfb-aef5-e6cc11aabe0f
  text: '"Леди-навигатор Элина-Хаттерия Орселлио обвиняется в покушении на жизнь наследного новатора Кассии Орселлио, покушении на жизнь Вольного Торговца, а также атаке на дворец. И да начнется суд!"'
- guid: 841054cb-3eb2-4723-b430-c3dd061b5d26
  text: '"Послал нам Боженька-Император милость свою в темнейший час! И облачил во всеоружие гнева Его!"'
- guid: 8440441f-7578-49ba-9e0c-cf22ac43d64a
  text: '"Ты об этом еще пожалеешь. Взять ее!"'
- guid: 8448af04-f5e1-417e-9735-e786bc95bb77
  text: '"Мои легкие все еще полнятся ядом, {name}. Система аварийной вентиляции — вот что нам нужно".'
- guid: 845ecba2-a5e5-4d1e-a69a-684166b2d1c0
  text: '"Слыхали? На верхних палубах шороху навели, а следы к нам в палаты ведут! Скоро блюстяки спустятся, всех нас порешат!"'
- guid: 8467a373-b7f5-42da-b837-c20ff5d7f23d
  text: '"Кажется, что-то пошло не так, а, {name}?"'
- guid: 846d512a-3e74-4c4d-9365-6e06250c6f3e
  text: '"Сэр, с вами все в порядке? Мы ничего не слышим"'
- guid: 847140de-b575-4bb4-9826-2b127c30d0f1
  text: '"Вы нарушили пункт 193 параграфа 8 Декрета Антара, поправка №6, гласящий: "Выражать неудовольствие касательно своего долга или наказания — запрещено".'
- guid: 847235b5-d829-41f8-85f8-82155c1ee757
  text: '"В прошлый раз впятером его валили, так он челюсть одному раскрошил! Осторожнее, все! Так, на счет три..."'
- guid: 84af3eac-dd84-4cb3-8e8e-86906fad4265
  text: '"Ого, быстро. Я уж думал вообще не получу посылочку — теневые кварталы-то того, в карантине..."'
- guid: 84c31fb7-888b-45e2-a9d3-db5462f59462
  text: Сквозь прутья решеток, по которым вы идете, видна бездонная пустота. Она манит прыгнуть в нее, обещает быть мягче любых перин.
- guid: 84d22357-2451-4feb-9308-a1b4148e0b7d
  text: '"Не торопитесь, шерин, впереди патрульные Фалько! Нужно слиться с тенями, двигаться тихо..."'
- guid: 84e75fdc-1efb-47a0-a02b-37c4468af126
  text: '"Твое милосердие дает смысл моему странствию во тьме".'
- guid: 84ee187a-43d4-4338-9af1-24c2210efbed
  text: '"Это место объято грязно-алым туманом — я едва вижу дальше вытянутой руки. И черные тени ждут за каждым углом... Иногда мой дар видеть суть больше похож на проклятие".'
- guid: 85043f6e-0735-454c-b9f0-2d0869d30329
  text: Множество ран и увечий указывают на особо жестокое убийство. На лопатке жертвы вырезаны буквы "АНВ".
- guid: 853217a0-d36e-4b17-824a-9925b8f3a4e1
  text: '"Чего они задумали? Эй, вы чего здесь собрались, жестянки! На что они смотрят..."'
- guid: 854e3bfb-9395-4d29-a55b-ce95f7d2c0ac
  text: '"Теперь я видел все, Ваша Светлость".'
- guid: 85622501-a680-45f1-a314-fa5f336f01bb
  text: '"Лорд-капитан, голоса галдят, зовут меня — дверь где-то здесь! Нам вглубь, дальше, дальше..."'
- guid: 857fe225-3f57-4985-b37e-965a02e5b06c
  text: '"...Температура продолжает падать. Фиксирую — опустилась до 28 градусов ниже нуля".'
- guid: 858de057-fda1-43f6-ad82-99d688cf4c5d
  text: '"Похоже на... трофеи? Но чьи?"'
- guid: 85982e09-63ef-4469-8439-ae0589a333ec
  text: '"Любые мольбы о пощаде будут считаться сопротивлением".'
- guid: 85b3ecf4-1220-461e-8478-738743dea80f
  text: '"Слыхали. Байка это. Смеющий гонщик, убивающий бродяг! Чушь!"'
- guid: 85c1a386-473d-488d-81bf-906c4031212a
  text: '"Всю жизнь на Футфоле провел. Слышал, на планетах то темно, то светло... ерунда какая-то!"'
- guid: 85ce03cd-bef4-4339-b626-0449dcc43f7c
  text: '"Госпожа, прошу вас, успокойтесь. Вы видели, что здесь произошло?"'
- guid: 85d3a58e-396f-4180-acd6-18a67e00e295
  text: '"[[Протокол приветствия]] Добро пожаловать во Дворец Адептус Администратум <распознавание личности> Ваша Светлость. Следуйте за мной".'
- guid: 85d800bb-feb1-4b29-ac3b-ecfb5651d487
  text: '"Подайте талончик... Помираю с голоду. Смилуйтесь".'
- guid: 85f25b5d-3bee-41c0-8a9e-347873b70abc
  text: '"Вниманию транспортно-грузового узла НП-987/А14! Лорд-капитан в отсеке!"'
- guid: 85f29200-62e5-45ab-8281-ab6e69586cca
  text: На белесом камне виднеется темная грязь, явно не похожая на почву в поместье. Большую часть вы уже собрали.
- guid: 863367b2-d5da-412a-96a8-7c0d3b9baadf
  text: '"Интересное решение, Лорд Капитан".'
- guid: 86435479-1af9-4fa4-9cf8-8e7cac0da8ef
  text: '"Пало чудовище неисчислимой плоти, ведь всеразмерности его была противопоставлена сосредоточенная в иглу воля Сирлаэль. Пронзила она насквозь монстра, нанизала сердце и извлекла. И было то сердце черным кристаллом Сэйха, Дарующим Мощь".'
- guid: 8663f129-b6d7-4195-b72c-d0425bc88922
  text: '"Ушли! Троном клянусь, мы найдем этих богомерзких тварей и отплатим им за все, что произошло в этом месте!"'
- guid: 86c24f69-968d-4299-bc61-a1cd4c34a502
  text: '"Смилостивились над нами, удивительное дело".'
- guid: 86dc9a7b-f570-4613-9451-678a5c663936
  text: '"Начальник, смотри: руки-ноги целы! Могу пахать без перерыва! Выбери меня!"'
- guid: 86dfda4e-f072-4b90-90b5-68dad550a84e
  text: '"Слыхал, что на средних палубах стряслось?"'
- guid: 86ee5e89-928b-46b0-8ff1-67cbea44af04
  text: '"Школько можно терпеть? Этот новичок-ублюдок Коннага прикончил! Прирежем его, шкажем, это жаклющенные шделали".'
- guid: 86f36e1b-231b-4afe-88dd-e968c56eba6d
  text: '"Доигрался ты, дружок. Взбесил влиятельных людей".'
- guid: 86fc48fc-6f04-4ba9-8eb6-ef7d405d42b2
  text: 'Под пропитанной кровью и гноем робой дрожит в цепях изувеченный человек: его волосы, зубы и ногти выпали, а кожа скукожилась и покрылась нарывами.'
- guid: 870f302a-9ae5-40dd-83e7-01c371db8874
  text: '"Прошу, не будем больше притрагиваться к... этому. В прошлый раз оно причинило нам боль".'
- guid: 871b488d-74dd-44e5-8f1d-764cea55870a
  text: '"Эти паразиты не иначе как колдовством владеют! Они своей халупой вент-вытяжку перекрыли, соседний отсек чудом не передох без воздуха!"'
- guid: 8728a61d-f957-4900-a2e6-fbe70deb5613
  text: '"Да здравствует фон Валанциус!"'
- guid: 8754f26f-0a0d-4148-8510-a6cd15a78e09
  text: '"В необозримой щедрости своей он повелел выдать каждому нуждающемуся по дневному пайку и индивидуальной топливной ячейке, дабы в сей день всякий был сыт и пребывал в тепле. Славьте великодушие Вольного Торговца!"'
- guid: 87998d00-b8d9-4557-b7c0-a7fd21ed243d
  text: '"Чтобы заставить этого духа машины подчиниться, надо знать верную молитву. Стражу нужен пароль".'
- guid: 87bda7f5-c7c0-451c-9dad-b50a10d1ecab
  text: '"Я видела, как господин Гапрак беседовал с кем-то здесь, Ваша Светлость..."'
- guid: 8833aa85-a963-43e3-a613-8282b2695e94
  text: '"Люблю эту работу. Все не в мануфакторуме спину гнуть..."'
- guid: 885d78d1-b69c-4b35-b13d-93146b6faccd
  text: '"Бог-Император, защити Дитя от врагов наших!"'
- guid: 887a9289-4303-4a16-8887-4330a1952d21
  text: '"В скитаниях углубилась она в дикие области Паутины, и жутких чудовищ повергала там, дабы не пасть самой".'
- guid: 8885fa68-7b37-4e84-9d9a-3de69328682e
  text: '"Тысяча раз, тысяча два... Тысяча... Тысяча... Раз, два, три, четыре..."'
- guid: 88892d88-4684-451b-b52d-0a1a2e367012
  text: '"Уже лучше, мон-кай. Еще раз — что ты такое?"'
- guid: 888c6233-46ec-4dbf-b8d4-8c2f4cff4121
  text: '"Я надеюсь, еретики не пришлют подмогу своим".'
- guid: 88eb538b-dd3d-4e6c-8952-248815bc8928
  text: '"Тюрьма чудовища пала, но Ярмо начало связывание! Большая часть сил чудовища будет скована машиной!"'
- guid: 8945f67d-628d-4afa-a39f-283f1721d1ac
  text: '"...проверяю. Отсек DF-541, инспеция шлюза была проведена менее пяти вахт назад, неисправностей не выявлено".'
- guid: 894c5650-1227-4235-ab71-505a73c99bb0
  text: '"Господин фактотум помирает! Скорее в медотсек!"'
- guid: 89500b74-22de-4a2c-8bad-3e4b31ea49a1
  text: '"Я вообще-то тут живу! А все шастают!"'
- guid: 8955b774-8fca-4677-a02e-ef081f33934d
  text: '"Это отделение Музеона обречено... нет смысла тратить время на его спасение — самые ценные экспонаты уже были извлечены".'
- guid: 89701cd2-969c-4934-8515-6ed5c4d8e6b5
  text: '"Знаешь, как приятно говорить "служба Зандера Сонатуса"? Сразу чувствую себя кем-то важным, а не нищим молокососом на побегушках!"'
- guid: 89ccc56a-ac75-4d7a-9b46-73f8e3cc6bd1
  text: '"Уместим конечно, я и не такое паковал!"'
- guid: 89cf12fd-8937-4c3a-989d-5b5447f5957c
  text: '"Превосходный бой, Ваша Светлость. Даже наваждения варпа не в силах устоять перед вами".'
- guid: 89ec4679-2f60-4b7e-8602-5ae91886499f
  text: '"Премного благодарна вам за возможность служить, Ваша Светлость. Это было весьма захватывающе!"'
- guid: 89f59912-00f4-48d1-95ec-43ec71689e1b
  text: '"Домин''{name}. Неумирающий прошептал, что ты почтишь храм смерти своим визитом. Мы готовы служить тебе".'
- guid: 89ffdd02-263a-40fb-b3ce-a5bf6c21fc76
  text: '"А ты сходи, посмотри. Может, убийца уже ушел, а пожитки мертвеца оставил — разжиться можно".'
- guid: 8a148fd2-fc0a-49c7-b410-ec4c0e60637a
  text: '"Я слышу так много голосов... кажется, протяни руку — и коснешься говорившего!"'
- guid: 8a209eda-a145-41b5-a8a2-46c88c30a66d
  text: '"Вот и вы, {mf|господин|госпожа}! Убежище совсем рядом — прямо по коридору".'
- guid: 8a2d9165-8453-476b-a5ab-90d427731d28
  text: '"Бог-Император... ты слышишь меня? Если слышишь, забери меня к себе поскорее..."'
- guid: 8a7273e9-0dd0-4c72-9e4c-2144accc79e5
  text: '"И все? Ты просто отдашь мне своих ручных шутов? Не обижайся, если я сломаю твои любимые игрушки, Кикеросс".'
- guid: 8a733128-92e0-4770-81c5-d1c328b9cb09
  text: '"Я уже видела это место раньше... Вот этот бедняга сидел себе на горе золота и радовался, а потом утонул в потоке крови".'
- guid: 8a747513-74c1-4df5-99b9-3c12c0fba014
  text: '"Этот день в Четвертом Складочном точно на годы вперед отмечаться как праздник будет!"'
- guid: 8ac102fd-7a0a-44cb-a803-123573d19938
  text: '"Пожалуйста! Возьмите все, что у меня есть, но помогите! Тут недалеко!"'
- guid: 8ae2bd13-92a1-4fc3-9ec0-dba1e01592c7
  text: '"Невероятно... пережить встречу с еретиком Астартес..."'
- guid: 8af68ed1-13e8-40ba-8795-daafc91d23c6
  text: '"Ловлю каждое ваше слово!"'
- guid: 8afe4258-c0d7-4c62-8f63-0c5ab942f082
  text: '"От символа еще исходит цвет, похожий на... кровь, смешанную с молоком. Это должно тревожить, но почему на душе так спокойно?"'
- guid: 8b0b72ba-76d9-451a-87e9-661f34b2fa82
  text: '"Но несмотря на то, что вы самые убогие из блюстителей, ваша цель — служить династии фон Валанциус!"'
- guid: 8b2bec67-2f66-43e4-86aa-d25ccd937fc8
  text: '"Понятия не имеет. Может, с губернатором поссорил{mf|ся|ась}. Может, не понравился климат. Кто их, наверху, разберет..."'
- guid: 8b43e591-1912-4945-a09e-adf27c0a9b47
  text: '"За что? Я же... ничего... не делал..."'
- guid: 8b84f3d8-0e3f-47c0-ad22-2b72c51fb743
  text: '"Звездная гавань, вызывает шаттл династии фон Валанциус. Как приняли?"'
- guid: 8b876c3d-c888-45fb-a2b5-b35072102770
  text: '"Да здравствует защитни{mf|к|ца} Футфола! Слава Вольному Торговцу фон Валанциус!"'
- guid: 8bb3f1c1-c87d-4a6e-818c-cada84ed9c97
  text: '"Истинной кровью фон Валанциус да будет смыта скверна с Патента, десницею Его подписанного. Возвращенный на ложе свое, да вернет святыня к праву дарованному династию".'
- guid: 8bc54c36-a372-4727-9847-b87d0c6abf59
  text: '"Как догорит, велено зону огородить, зачистить и никого дальше платформы не пускать. За ослушание вышибай мозги — взялись за них наконец!"'
- guid: 8bcdf0c4-45ae-47d5-8302-8e59ca66e8b6
  text: '"Продолжать бездумно играться с этой ксеноересью неразумно, Лорд-капитан".'
- guid: 8c04349c-dcbc-4c30-abad-997b31b41f00
  text: '"Концентрация патогенов в этом месте превышает все мыслимые и немыслимые пределы. Ни к чему не прикасайтесь! Нунциус, подготовь пробирки — мне необходимы образцы".'
- guid: 8c08899c-1962-47af-92a3-52a61c54b1fc
  text: '"Лорд-капитан, этот контейнер как целый состав весит. Может, вам будет угодно воспользоваться грузовым краном?"'
- guid: 8c13668d-b84e-485b-be41-8e2149ae0026
  text: '"Вы обвиняетесь в сношении с ксеносами, предательстве Империума и пренебрежении интересами Человечества".'
- guid: 8c41ab6b-786a-4ef2-bbff-91d4c3ea7b1d
  text: '"Миряне отвлекают сего ткача от медитации. Впрочем, и такую помеху можно обратить в тренировку, что закалит концентрацию".'
- guid: 8c45d3bf-11d7-4406-bea2-fa472f53ffcf
  text: '"Как же хочется на другой астероид переехать... В теневых кварталах жизни нет!"'
- guid: 8c51f8fc-a72a-479a-a16b-64634db19514
  text: '"Лес — наш дом. Но лес злится. Говорящий-с-Богами умилостивит лес, и мы заживем как прежде".'
- guid: 8c630f1e-8224-4767-9f05-b7db7d549884
  text: '"Я — прах и покорность, мастер".'
- guid: 8c6ec9c1-1349-4ecf-b575-2b935a97e210
  text: '"Нас обещали приставить к грузовому составу несколько вахт назад! Нам семьи надо кормить!"'
- guid: 8cc1acff-db7f-4e90-8b05-ad25458937ae
  text: '"Лорд-капитан, я бы хотел переговорить с вами до того, как корабль покинет Фурибундус. Наедине, если позволите".'
- guid: 8ccedad6-995d-41d3-bfef-dd0d463bbab5
  text: Машинный алтарь принимает гимн восстановления контактной цепи с почтительным рокотом.
- guid: 8ce2dd6e-fcf2-4179-8b02-d74699d9190c
  text: '"Ни шагу далее!"'
- guid: 8cea1887-881e-4069-8c84-3216050bacc5
  text: Слуга приоткрывает рот в молитве, и вы замечаете во рту обрубок купированного языка.
- guid: 8d017cb6-ff2e-4c16-9224-8569484c2371
  text: '"Оставайся на месте, нарушитель, иначе будешь аннигилирован!"'
- guid: 8d264779-8f98-4c5e-8634-f7b73a91c40a
  text: '"Хорошо разметало. Айда скинем его барахло на торговище, пожрем сегодня похлебки!"'
- guid: 8da3748a-5e47-4cc2-9fa4-11a3b28c577a
  text: '"Да, продолжай так думать, конечно. А если сюда сунутся?"'
- guid: 8dbd3d77-5c6d-4b96-9110-8dc46e5ba238
  text: '"Император защищает! Слава Богу-Императору! Слава Ее Светлости Инцендии Чорда!"'
- guid: 8dc77e50-caa0-48d7-b948-a46620cf0097
  text: '"В сменную вахту я снова застал хормейстер за молитвой. Как и в те разы. Кажется, он вообще не спит, только молится".'
- guid: 8de985e3-cc08-4542-8846-d609307e1b54
  text: '"Глаза и разум подводят меня? Или сам{mf||а} Вольный Торговец только что коснул{mf|ся|ась} меня плечом?"'
- guid: 8de9dc7c-7cb3-4002-90fe-263bc7c56827
  text: '"{mf|Господин|Госпожа} Фиделио, мое почтение!"'
- guid: 8e053f26-ca07-4cfa-b8e4-89323f4a8c53
  text: '"Здесь вы в безопасности, Ваша Светлость!"'
- guid: 8e213626-6774-457c-8095-b4555805c332
  text: '"Мы — глас угнетенных, мы — возмездие!"'
- guid: 8e29b04e-6f6f-4e20-896f-dd66e7c11b7e
  text: '"Что-то потеряла, голубка? Не своего ли владыку всех звезд и просторов?"'
- guid: 8e4eead2-676c-4688-8006-a674fc016e0e
  text: '"Раненные? Есть раненные?"'
- guid: 8e6232b8-e927-41c8-a4cc-151e74c2d43c
  text: '"Прошу сюда, Ваша Светлость. Все уже готово для особого вечера".'
- guid: 8efad119-37a3-44d3-8729-95b229b052c5
  text: '"Говорят, на Футфоле можно найти все, что пожелает душа..."'
- guid: 8f107007-11b4-4f04-a7e1-172686ed5dcf
  text: '"Кей-морагх! Священное оружие Детей Азуриана должно покоиться с павшими, а не служить стервятникам мон-кай!"'
- guid: 8f412684-c166-4298-a88d-65524a375816
  text: '"Невероятно".'
- guid: 8f6f5fce-a57f-4697-b518-40724308c516
  text: '"Всем офицерам и членам экипажа, сохранившим верность присяге. Этот корабль — наш! Слава династии фон Валанциус!"'
- guid: 8f8d7db5-15c0-4027-9a46-31286166fced
  text: '"Мне не нужны данные от Глейто, чтобы сказать — тут все в заразной дряни. Держите руки при себе, хворь может быть смертельна".'
- guid: 8ff00b9b-13c1-4b92-800a-89f88e20ee28
  text: '"Немедленно пропустите! У меня назначена встреча с канцлером Клеменцией Версериан!"'
- guid: 8ffa7e1a-af7c-4416-9b6e-90aa3a6a2818
  text: '"По Твоей милости и Твоему благословению шествуем во мрак, обращая в прах все, что претит видению Твоему, и в этом служении радуемся..."'
- guid: 900af70a-c2ce-494c-a959-dd9b095f86cf
  text: '"Гр-р-р-агх!"'
- guid: 90144912-3860-4570-82b4-9c39087d1bce
  text: '"Я бы не советовал прикасаться к сему проклятому артефакту, если ваша душа вам все еще дорога".'
- guid: 905bd70f-00cf-4795-bdbc-cbda19edd945
  text: '"Угу. А ты отойди от этой зверюги подальше — не ровен час еще прыгнет..."'
- guid: 90785939-5ad7-4ab1-b612-ba01742aeccb
  text: '"Я Беонна и я не еда. Я Беонна и я не еда. Я Беонна и я... Еда для истинных владык космоса!"'
- guid: 90cbd26b-16dc-4837-8e1b-ece1912f9527
  text: '"Совет, не более: берегись мерцающей синевы. А то закончишь как Горгориус Фальт..."'
- guid: 9103179f-7ceb-4446-8b64-0e348a13739a
  text: '"Слышал, сам{mf||а} Лорд-капитан пожаловал{mf||а} в наш отсек!"'
- guid: 910d4988-cf5f-4ac0-b5e1-40ef5db4ec9e
  text: '"Умный образец. Да, мы — лжецы, и ты снова окажешься под ножом. Но если ты положишь оружие, я его хотя бы наточу".'
- guid: 911804e2-f64a-444e-89be-cc93b938e896
  text: '"Вир, это ты? Помилуй Бог-Император, они надели на него... надели... ЭТО!"'
- guid: 912750a4-b5c7-4122-8f78-160469f4fc04
  text: '"Пусть это и вынужденный союз, мы следуем за вами".'
- guid: 913e58a5-fbb2-404e-9b81-e2bb36e71ad4
  text: '"...В отсеке содержится 124 рабочие единицы. Все с признаками обморожения".'
- guid: 914a68fa-cba6-426d-9940-02c4c41ae376
  text: '"Теперь вы, ублюдки ленивые, солдаты Бога-Императора! Его диверсионный отряд!"'
- guid: 916b8f60-ec52-4414-bb43-03edc9267f3c
  text: '"Ниче-ниче, ребята, скоро пожрем! Если опять котел не перекроют, конечно".'
- guid: 91817ebb-9d6e-490d-990f-c1d04fcfc756
  text: '"Каждый сгинувший блюститель забрал с собой десяток еретиков. Пролить кровь за династию фон Валанциус — великая честь".'
- guid: 918ceefa-3472-42a6-861d-d9528dbe21b1
  text: '"Ладно, с этим уродцем мы разобрались. Лорд-капитан, так возьмете меня к дверке?"'
- guid: 91c4a2a3-2202-4a25-a7e7-c838494746c7
  text: '"Вот бедняга... А как убедительно врал! Я аж поверил, что он и вправду колдун".'
- guid: 91f06721-56d4-4b7e-ac24-a9a22d414647
  text: '"Безмозглые мон-кай не могли добыть дары Темного города! Кто посмел их сюда притащить?"'
- guid: 91f5f855-d1e2-4dfb-9c4d-2c8ebd323a67
  text: '"Не надо! За что?!"'
- guid: 9238b919-0329-4c32-a93f-a5e9297ed2a0
  text: '"За Всеотца! За Расса!"'
- guid: 92bd2cd8-c8d3-4083-8c8a-ba3172fb6e10
  text: '"Эй, сюда! Я слышу голоса под завалами!"'
- guid: 92cadf99-a983-4730-8115-2a0282bd32c1
  text: '"Видал, как эта мутантка сняла цель? Наши около губернаторши только рты раззявили, а она ему уже мозги вышибла!"'
- guid: 92f6c9bf-11d9-48d3-bd38-7418fe72ab47
  text: '"Было честью помочь вам..."'
- guid: 930affa1-ac0b-412b-87d4-fb335f023250
  text: '"От-с-с-тань... м-мне нравит-ся... лежать!"'
- guid: 9319d4a2-790d-4972-945c-f874a7d85df6
  text: '"Подать мне секретаря... Где мой парадный мундир?.. Я не потерплю такого беспорядка на вверенном мне корабле!.."'
- guid: 93421b8d-cc7c-4551-82cf-acce66a047c0
  text: '"Это что же — нас распустят теперь? Может, хоть переведут куда?"'
- guid: 934543c0-e69b-4835-9373-e2e0d8982ccc
  text: '"Вот так, прямо за мной..."'
- guid: 93477674-cdea-4dfa-9027-729339db16dd
  text: '"В зубы получать, конечно, не сахар, но зато от работы отдохнуть можно".'
- guid: 93543ae7-9522-464d-950e-dbbe38a11077
  text: '"Вы поплатитесь за предательство Фелека и нашей свободы, Вольный Торговец! Убить всех!"'
- guid: 937b3dc1-f899-4125-9b5d-7fb244753b5d
  text: '"Во тьме лишь те, кто добровольно отдался ей, смогут найти путь к новому свету".'
- guid: 93f7ddfd-2617-4c40-af3f-bacc8cbe798a
  text: '"Ты смотри, ему башку проломили, а он все дерется!"'
- guid: 93fc988d-b1a3-4f5c-b19c-d268f7a5e750
  text: '"За свободу, за справедливость!"'
- guid: 94080b83-33c3-4385-9762-59db9d79a433
  text: '"Муки телесные неизбежны. Так зачем же противиться им? Лелейте свои недуги, ибо истление тела есть путь к новому бытию!"'
- guid: 9412210d-c47e-49dc-972a-6f6f55ea80fa
  text: 01010000 01110010 01100001 01101001 01110011 01100101 00100000 01000001 01101110 01101110 01101001 01101000 01101001 01101100 01100001 01110100 01101111 01110010 00100001
- guid: 94222061-955b-4a18-8b97-a0c971235a84
  text: '"Страж номер Каппа-322, прибыл для несения караула на посту Карцер-Главный".'
- guid: 94287c18-9087-4c41-8abe-7965a7c300f0
  text: '"Вы получили свое искупление, братцы".'
- guid: 943117c7-a11f-44e4-9799-ff07769aa0d2
  text: '"Нам нужно вперед, но... там наверняка устроили засаду. Осторожнее, заклинаю..."'
- guid: 94531bf1-8e59-497a-a553-40e9a68eb330
  text: '"В некотором смысле так мы и поступим".'
- guid: 94535639-fc6e-42d0-87cc-dc306cfbfd2f
  text: '"Кровавый бог, прими эту жертву! Черепа к трону черепов!"'
- guid: 946ed036-b3ae-4bf6-b62e-1b6b378021b1
  text: '"Да свершится Правосудие Императора! Презренный еретик и нечестивый ксенос, ваш приговор — смерть!"'
- guid: 9473ca54-f087-47e9-aabd-fe8d16af3039
  text: '"Это кто так{mf|ой|ая}? Больно знатно выглядит".'
- guid: 94b16b19-9684-446e-ac95-dc8b62d2e2ab
  text: '"Опять донесения с нижних палуб?"'
- guid: 94cfa632-108b-4a2d-82b7-4825e8f8cf77
  text: '"Ты про тех несчастных? Да уж, ну и судьба — помереть под рухнувшей дверью..."'
- guid: 94e009a2-a8be-4fbb-817a-4359152d1eb4
  text: '"Мне кум говорил, будто своими глазами видел, как один аристократ проиграл в карты... планету!"'
- guid: 951f913c-3d2d-471e-871f-10f5bc8dfb9d
  text: '"Повезло нам с командиром! Это ж каким отчаянным воякой уродился Комиссар!"'
- guid: 953d4c8d-8c8d-467d-8fc8-563463a55a39
  text: '"Весь этот переполох из-за Версерианов. Они явно не заслуживают такого внимания..."'
- guid: 954d28ba-5ccf-4db6-b612-4ded8c5892db
  text: '"Огонь веры пылает в твоей душе, сжигая тебя изнутри. Поддашься ему однажды — и рискуешь сгореть сам{mf||а}".'
- guid: 9568ad08-7190-4a80-9d2a-0215ff9b6566
  text: '"Сенешаль, говорят, опять недавно устроил публичную выволочку старшим офицерам. За что — не знаю, да, собственно, Версериану хватает и мелочи, чтобы взбучку закатить..."'
- guid: 95b4e7a5-8cbc-4247-8f15-9aabac14842e
  text: Жрец бессвязно бормочет череду терминов и обозначений.
- guid: 95e71370-3013-44e1-af7b-f298b6fe0bc6
  text: Кажется, техножрец так поглощен молитвой, что не замечает вашего присутствия.
- guid: 95e7dae8-bc92-4f24-b997-bc01d5bf6fad
  text: '"Да умастят священные масла твои сочленения..."'
- guid: 95ed8265-86bb-4296-b5c4-d868c872b1e7
  text: '"Однажды святую Джустинию спросили..."'
- guid: 95f80a1e-d28c-4c7f-9e10-ca905539b81b
  text: '"Не вам я поклялся служить в сих стенах. Мои уста сомкнуты".'
- guid: 961b3672-ee40-42f5-ad43-24ca2ad117d1
  text: '"Ха, наконец-то можно повеселиться!"'
- guid: 961e94aa-0977-4b61-8fc7-65f6d448124e
  text: '"Столь же кровавый, сколь и разочаровывающий финал. Руками недостойных претендентов ничтожества, ложно занявшие места чемпионов арены, были низвергнуты. На пики их, и слава победител{mf|ю|ьнице}".'
- guid: 963ecf29-6b51-4673-80fe-6e9e873381d4
  text: '"О Бог-Машина! Избавь меня от гнета плоти, дай приблизиться к совершенству механизма".'
- guid: 964b2b85-f863-45b6-9ab7-35fbfb24956c
  text: '"Проклятые предатели! Не представляю, как такое могло случиться... И все же Дитя в порядке — это главное".'
- guid: 964fc88c-2771-4f08-b35f-1e76d9d1cd66
  text: '"Мне странно знакомы чертоги этого священного корабля".'
- guid: 9658157e-821c-47cf-9c5d-50a65430accd
  text: '"Будет вспорото чрево теми, кто слышит... Теми, кто потушит голодный огонь..."'
- guid: 96a36151-6b61-4a97-b516-8c52b5f9cb1b
  text: '"{mf|Его|Ее} светлость примет правильное решение и накажет виновных — в этом можно не сомневаться".'
- guid: 96e84364-d945-4b72-9ee9-6d59f739f960
  text: '"Окти, шерин, свет очей моих! Видишь же, душа моя полна печали — неужто нет у тебя сердца, чтобы оставить мысли о бренном и позволить мне горевать?"'
- guid: 976afda2-f9a4-46c0-ad17-40bff940bd61
  text: '"Ты о чем? Только не говори, что веришь этим нелепым слухам про призрак Вольного Торговца..."'
- guid: 978a6033-211b-4c8b-99f8-16533a3f00a8
  text: '"Это — циркулярный когитатор. Вход в укрытие электрожрецов должен быть где-то рядом".'
- guid: 9839cbf8-dc50-4eac-9d73-922997732824
  text: '"Идите ко мне, маленькие смертные! Вместе нам будет намного веселей..."'
- guid: 9846170d-b4c8-4ba6-877f-e230d9d061f7
  text: '"Хм, ты выглядишь смутно знакомо... А, неважно! Почтеннейш{mf|ий|ая}, возрадуйся, ибо перед тобой Р''Изза, Герольд легкой наживы!"'
- guid: 984c2921-d9bf-4e19-9ad7-df671fdcb4d5
  text: '"Слава Домин, что позволил{mf||а} нам воссиять! Слава Висирю, что напоила нас кровью!"'
- guid: 987079ef-837f-4635-8481-1ddbee5c264f
  text: '"Быстрее, быстрее... чем скорее выкурим эту гниду, тем быстрее рапортуем о завершении зачистки".'
- guid: 98b4bcfc-b655-4bea-aee8-bd2b49c4cbc2
  text: '"Годьерда мертва? Ха! Гуляем, пока ее не хватились и нового блюстяка не приставили!"'
- guid: 98b93a1b-9b21-4646-8045-9d58720e3a5c
  text: '"Кайся, нечистая душа! Исповедуйся во грехе! Ведаешь, кто навел пиратов на клипер "Святой Когнаций"?! Сам там душегубствовал?! Или только на стреме стоял?!"'
- guid: 98cf99d1-0881-46ba-8a2e-6e49b8326fd5
  text: '"Кто там на побои жаловался? Тоже на кухню. Я сегодня добрый, хе-хе".'
- guid: 98f7e8a8-d2f7-49a5-adf8-9f9c8d4d77fa
  text: '"Да! Прими нашу жертву, Бессмертный, и да начнется пир!"'
- guid: 98f89f0b-3805-45a9-b9f8-025d5236614f
  text: '"Да ладно, брось... все, молчу уже".'
- guid: 990f768c-3c29-43a8-ae43-b6ae06dd12c8
  text: '"В напоминание всему народу о смирении и верности нашем следующий цикл службы во всех храмах протектората фон Валанциус будут проводиться беспрерывно! Всякому подданному надлежит посетить их и вознести молитву во благодарение Богу-Императору. Храните веру и славьте набожного Вольного Торговца!"'
- guid: 994dbfe0-b2bc-4c76-8af1-68b20dbcc92f
  text: '"Хорошо. Еще одно гнездо еретиков выжжено дотла".'
- guid: 997fb780-50e1-4ede-9721-784eb52f48ab
  text: '"Данная единица испытывает экзальтацию в вашем присутствии, Лорд-капитан".'
- guid: 9a073ca4-c2ab-4dc9-99a2-547ec7336f86
  text: '"Что надо?"'
- guid: 9a0dc0b9-b928-45ed-abdd-7f1d522f1905
  text: '"К вашим услугам, Ваша Светлость!"'
- guid: 9a415e34-0dda-4400-835e-f2f57828a051
  text: '"Что радуешься? Они и еретиков убивали, а теперь скверне, что затаилась среди нас, некому нести суровую кару Его".'
- guid: 9a488b9c-5c7e-4166-9d01-f5b4dd21a48c
  text: '"Великолепный прием! Достойный Вольного Торговца!"'
- guid: 9a4d32a8-3b24-4945-ae7c-fe1aa22700ae
  text: '"Где та тварь, что отсекла мне руку? Я достану тебя! Вырву твое сердце!"'
- guid: 9a5bd03b-98df-480d-bd0b-4a78ba20e6e4
  text: '"Если нужно оборвать нить жизни быстро — цельтесь в шею. Если жертва заслуживает наказания перед смертью — вскройте брюхо".'
- guid: 9a6e4e24-fb6a-496e-a0bc-cfa111793f12
  text: '"Да здравствует Вольный Торговец, властитель{mf||ница} Даргонуса!"'
- guid: 9a76d11d-74d3-473c-b8d3-5a38310b9e8c
  text: '"Понятия не имею, на кой вам грамота, но чтоб учились, пока мозги не вытекут".'
- guid: 9ac6ed62-4bdc-448a-a711-0eea665b93dc
  text: '"Глаза в пол, падаль! В пол, я сказал!"'
- guid: 9aec7e81-b599-438f-b6f4-6339d3d01cf2
  text: '"Господа, не губите! Это он от страху сболтнул! Каюсь, чистосердечно признаю своей грех — мы с мужем товар укрываем для Касбаллики. Нелюдские штуковины с приходящих кораблей забираем, а затем на другие относим. Каемся!"'
- guid: 9aeecb5d-563e-4048-a630-b33ff1e53273
  text: '"Ну может быть. Хотя лично вот мы что поделать-то сможем? Торчим тут посередь этой роскоши, тут ни укреплений, ничего — все на внешнем периметре..."'
- guid: 9af89cc7-c74c-41e2-8071-ed9cd54424af
  text: '"Истина, скрой путь от нечестивцев!"'
- guid: 9b194a8c-cfce-47dd-b402-864b76eb5317
  text: Разрыв в ткани пространства искрит энергией энтропии, расплетающей нити материи.
- guid: 9b47ec2e-e4ca-4121-a09d-f0b5087078b8
  text: '"Нет, слишком рано! Надо активировать Ярмо, иначе все обречено!"'
- guid: 9b5f7bfa-f759-4c09-a64a-4d42613f462a
  text: '"Вы бы поосторожнее в этих краях. Того и гляди из какой-нибудь трубы полезет дрянь, такое тут не редкость".'
- guid: 9b94a88d-cc96-439a-a6fa-2f05cdb8bc21
  text: '"Подателям милости Императора — слава!"'
- guid: 9baf5219-cfb1-41c0-833f-1d56ebb2a775
  text: Механическая дверь ведет куда-то на нижние ярусы, притаившиеся под проспектом.
- guid: 9bbf5577-93be-4053-8635-4f77baa3c576
  text: '"У-у-у-у-у!"'
- guid: 9bd37395-98d9-414a-88ba-3fe7a635433e
  text: '"Боюсь или нет, а лучше промолчать лишний раз. Не от Инквизиции, так от старшего офицера за такие разговоры влетит!"'
- guid: 9be35f71-8ed0-400a-aae8-552952918a37
  text: '"После аварии на соседнем узле невозможно спокойно работать! То шмонают, то бьют, то допрашивают..."'
- guid: 9c836105-8afc-4532-a759-fcb3a9edf415
  text: '"Захлопнись и пошевеливайся, Кор, нужно открыть проход в тоннели и запустить наших. Джай, по твоему сигналу".'
- guid: 9cc215d1-1079-4482-b4c5-ae877c2c91aa
  text: '"Конечно я с вами лишь из-за тронов и власти, шерин! Вы же не надеялись на истинные чувства?"'
- guid: 9cc488b6-c975-4a48-8f8d-d8a8caa26dd8
  text: '"Ранами Императора, говоришь? То есть, если вдруг мы знаем, что ты нам лжешь, ты уже не просто преступник, но еще и богохульник? А знаешь, что положено за хулу на Него?"'
- guid: 9d21f023-9375-48f1-ab3e-294360348453
  text: '"Ого, как они кричали-кричали, а теперь и затихли. Что? Неужели никто не слышал?"'
- guid: 9d3017c2-d6d5-4e45-b264-3f4e43a30a72
  text: '"Слава фон Валанциус! Слава Вольному Торговцу!"'
- guid: 9d4ddb6e-dcc2-4fd3-b2bd-155a36bad240
  text: '"Все эти обвинения... У них не может быть доказательств! Мы не причастны к заговору".'
- guid: 9d571b4a-a2f0-4069-abf4-69437bd00d8d
  text: '"Ваши палаты готовы, Ваша Светлость!"'
- guid: 9d68dd1d-9bb6-4077-8074-888118e9b6e9
  text: '"Какой же бедлам... Лорд-капитан, вы удовлетворены? Тогда, если позволите, давайте покинем этот балаган и обсудим все случившееся по пути".'
- guid: 9d7990cc-42ae-4fd3-a0be-6cfbeffb21c2
  text: '"Быть не может, мы трижды все отдраили перед прибытием Вольного Торговца! Проклятье, нам капитан головы оторвет!"'
- guid: 9d9f96d5-75d1-44eb-a10b-301aad029873
  text: '"Надеюсь, мне не надо проверять их на спектрографе?"'
- guid: 9dd02d4c-6de1-4c92-bb48-5988d05f4ae6
  text: '"И услышала ее Суккуб Синистериа, и сошла к ней по ступеням арены".'
- guid: 9dd0b434-ad3e-440d-b8eb-ba388b1934ec
  text: '"Подходите ближе, братья и сестры, ибо сейчас я поведаю вам об истинной вере и смирении перед ликом невзгод".'
- guid: 9de53cc8-0fc1-48d0-8375-bd008446e2b0
  text: Резервуар с технической жидкостью. Если проделать течь, энергия проводящего заряда незаметно растечется по полу.
- guid: 9e0a9d75-1c3a-4c31-ac35-7ad50de75116
  text: '"Вы думали, что убили Зарю, ложноверцы?! Дрожите, ибо я — Заря! Я — глашатай перемен! Узрите Последний восход — и умрите!"'
- guid: 9e0dd595-fca6-4007-9c43-49be13612a0a
  text: '"Слушайте, недоноски, появились места на кухонные работы. Туда отправятся те, кто не годен трудиться на магистрали".'
- guid: 9e22eda7-5e0c-4bd0-aff6-5e535872b847
  text: '"...возвыситься над невыразимыми кошмарами,

    Твердо держать поводья судьбы,

    Стойко идти тернистой дорогой,

    Через боль — к величию".'
- guid: 9e241c32-551b-4e17-a32f-b35cc0b92513
  text: '"Смотрю на вас, а страх не берет. Наверно, я столько аварий повидал, что смерти уже не боюсь".'
- guid: 9e577f90-4452-40e7-94ce-80fbd134770a
  text: '"Кей-морагх, элантах... Я сделаю это. Но лишь потому, что не могу более выносить смрада такого количества мон-кай вокруг".'
- guid: 9e62e201-8c52-47c9-a183-a4dc3708c1ec
  text: '"Поосторожнее с трубами. Не хватало еще выпустить ядовитое облако на территории усадьбы".'
- guid: 9e740fd0-4109-4455-9ef4-6ba5f76ef58f
  text: Чего-то не хватает.
- guid: 9e7ad338-bf65-483e-92f5-204105a338fb
  text: '"У нас передача! От второго отряда!"'
- guid: 9e87b467-fc57-4b20-8403-b7b82b14b0c7
  text: '"А духи машин точно тебя послушаются? Наверняка они очень суровые!"'
- guid: 9ef2b627-53c3-4dd8-ae44-2f4f754bf12b
  text: Отрежем ксеносам пути подхода! Свет — нужен свет, чтобы развеять тени по углам!
- guid: 9f039937-feaf-42c0-ba41-19c1a1d5ac59
  text: '"Напрасная патетика, Себериан. Твоя истина была искусным творением, замершим в вечности..."'
- guid: 9f5c885c-b1d0-410a-9ec5-4e139dba4102
  text: '"Я хотел бы сказать, что наводить порядок на палубе проще, чем разбираться с бардаком на Футфоле... Однако ваши подданые находят все новые способы удивлять меня своей неопрятностью".'
- guid: 9f950074-2ca9-4e50-8488-1fa5aef1ee47
  text: '"Говорят, что Император послал сюда своих ангелов, и они мечами высекли эту величественную статую из астероида!"'
- guid: 9fdb06d6-77b3-447d-822c-0d2e7822aa6f
  text: '"Во имя процветания нашего и торжества правосудия сии грешники, изменники и казнокрады да будут преданы строгой казни! Сообщайте о всяком известном вам грешнике и славьте Вольного Торговца, принесшего нам очищение от паразитов и тварей хищных!"'
- guid: 9ff88afa-6935-4a5e-af9e-238c78ac7913
  text: '"Расслабься. Кровавая паутина служит Вольному Торговцу, ткачи не станут вредить нам. Но знаешь... на всякий случай молись сегодня поусердней".'
- guid: 9ffd7993-5aef-423d-ad09-2246fc052d3f
  text: '"В бездну душу, богов и друзей! Лишь сила расплавит галактику, позволив сваять этот мир под себя!"'
- guid: a00d8b63-5fa5-4e1e-a52b-ebf49f8f15c4
  text: '"Пока никаких происшествий, Ваша Светлость. Дежурим!"'
- guid: a02adb26-bab8-4f3e-af17-3fdaf91bf936
  text: '"Я каюсь! Каюсь! Пожалуйста, только не виселица и не огонь!"'
- guid: a059c461-59d4-4efb-8f9f-dfee9c4eb361
  text: '"Да, он вроде был из Касбаллики... все, отмучался теперь".'
- guid: a05a2d9e-711d-444e-95a0-e38bbd18a869
  text: '"Хотя погоди... Точно, мне все равно. На сей вечер у меня лишь один план — утопить свои несчастья в море амасека!"'
- guid: a07601cc-05e8-4449-b28e-7978b80783b9
  text: '"Плевать на скаф, нет времени — давай респиратор и горелку, так полезу".'
- guid: a0900926-44bf-4a4a-80b5-39caf7d4912c
  text: '"Отваги и стали мало, чтобы изменить начертанные моим Господином Пути!"'
- guid: a0992542-ae19-4cd6-90c6-774c7ab65b49
  text: '"Лорд-капитан, сюда сгоняют больных и убогих подыхать от болезней! Ничего не трогайте!"'
- guid: a0a1c3cf-4ed7-4002-b2e7-f6551a959c55
  text: '"Эй, ты чего?"'
- guid: a0c9d6b3-783b-4eb8-8441-6013c7ee2683
  text: '"Слава Вольному Торговцу, что разгадал{mf||а} секрет священной реликвии".'
- guid: a0da81e5-fa51-44f8-8c03-b4464603cbbf
  text: '"Вы воистину спаситель Заркова, ниспосланный Императором! Мы вернемся в Клеть и сообщим новости полковнику. Ваша Светлость, ждем вас с триумфом".'
- guid: a1303d09-f1f3-4a60-bf31-bf45e2e73a27
  text: '"Истина, прими дары верных!"'
- guid: a13c3295-2dcd-452b-b96e-d8748dcef4ac
  text: '"...черпайте силы свои в непоколебимой вере и обретайте мужество в исполнении последнего долга, ибо слабость перед врагами Его есть ересь..."'
- guid: a13e0ca5-617a-42bc-84b0-56b0fe419d62
  text: Чиновник пятого ранга Алангар Квисторис
- guid: a15b8831-8031-4231-9ddd-a342406d4a49
  text: '"Не нравится мне все это".'
- guid: a172b58c-91cf-4cdc-8a98-001af72a97ec
  text: '"Я, знаешь ли, ненавижу, когда мои игрушки ломают. Ты поплатишься за это!"'
- guid: a186ee29-1abb-4e02-a7fb-59b7157de119
  text: Сервитор не обращает никакого внимания на ваше присутствие.
- guid: a1a4eb6a-61d6-4628-8127-4053df080a3e
  text: '"Живущему будет даровано причастие страха и страдания, дарованы будут погибание и неизбежность его..."'
- guid: a1ce92a7-0b3a-4215-969b-47073e9e3fc4
  text: 01010011 01100101 01100101 01101011 00100000 01110100 01101000 01100101 00100000 01110100 01110010 01110101 01110100 01101000 00100001
- guid: a1d1dbd4-a2ae-424b-8d7e-4d2b3c679e42
  text: '"Если мы идем по стопам святой, Богу-Императору угодно, чтобы мы прошли этот путь до конца".'
- guid: a1d767e2-451e-48ab-8595-9d005756278b
  text: '"Причина того, что мы стоим здесь — лживые обвинения и не более того".'
- guid: a2002c79-efad-423c-8c09-f747d6c5b723
  text: Искаженные образы мечутся в тенях. Их невозможно увидеть — но вы непрестанно чувствуете липкий взгляд сотен глаз.
- guid: a207d169-40bc-433a-a5be-294eac9cb5bd
  text: '"Гангрена все больше... ниспошли мне стойкости... дабы трудиться во благо Твое..."'
- guid: a22ddf96-5fd6-47c8-b1a3-7ba3ed14f52c
  text: '"Даже здесь, на мостике, я чувствую отголоски варпа... Этот корабль столь много раз пересекал завесу Имматериума, что его переборки впитали в себя его энергии".'
- guid: a23f57de-5a47-4cbe-b7bc-abc45dbbebdb
  text: '"Ваша Светлость! Император благословил этот день вашим визитом".'
- guid: a25454fd-b8aa-4b8f-854a-81d1992d7629
  text: '"Анализирую врага... Ошибка. Это невозможно... Помилуй меня Омниссия, что это?!"'
- guid: a2cddf45-eaab-4413-9237-71aadf11d9ff
  text: '"Нет... НЕТ! Убейте же... Просто прикончите меня, прошу!"'
- guid: a2dcc8cc-4084-4d80-b920-aeaa90ccada2
  text: '"Могучей владычицей культа была Сирлаэль, почитаемой и смертоносной! Танец битвы ее был совершенен, чарующ и ужасен! Но настал час, и дерзкая ученица свергла Сирлаэль, обратила слуг ее против нее и прогнала прочь из Темного города".'
- guid: a308727a-74ad-4857-aa8c-bfda761f7752
  text: '"Это ж что делается: хибары не жгут, блюстяки присмирели, за пайки на талон меньше дерут".'
- guid: a30972b4-2566-4fb7-b647-1378c4383e4b
  text: '"Так точно, сержант!"'
- guid: a3938fee-3212-40cc-84e2-972026e2816a
  text: '"Не стреляйте! Дом Орселлио не причастен к атаке!"'
- guid: a3b3266e-8152-4989-9ebf-2090a109767c
  text: '"Все отдашь, говоришь?.. Ну, ладно. Веди, только быстро".'
- guid: a3bdd764-7fd2-4c29-b2f0-938010e0b87e
  text: '"Литании служения исполнены — духам машины возданы необходимые почести. Запрашиваю разрешение на свершение таинства облачения".'
- guid: a3c01931-d23a-46b1-a3b5-186325ad8a80
  text: '"Есть еда? Нет? Тогда чего над душой висишь!"'
- guid: a3deaeeb-0717-4723-9e1d-e8c0c3f784f9
  text: '"Я знаю, ты с Расколотого Неба. Держись подальше".'
- guid: a3ece6b6-4064-455d-a4eb-712eafaca3aa
  text: '"Навигатор Кассини к вашим услугам, Лорд-капитан".'
- guid: a402daff-c4e3-4172-81ae-e5cb4b0f2c7e
  text: '"Прошу не шевелиться, мастер Вайс. Больно будет только первое время..."'
- guid: a40f101c-211b-45d2-83ff-ed3ae057c57d
  text: '"Ну что, есть еще трусы?! Марш на позиции!"'
- guid: a420c5c9-ca5c-4c15-a376-e46f0afa2b4b
  text: '"Во имя Великого, шерин, постарайтесь не привлекать столько внимания, когда будете откручивать вентили!"'
- guid: a427c127-ee4b-458d-a680-2813beaf95dd
  text: '"У-убейте... молю..."'
- guid: a43aaa66-13fe-407b-be07-c2e93423feb0
  text: '"Император упаси, я лучше вернусь через двадцать лун..."'
- guid: a44bdd9a-1e9a-48f9-8aa4-fa6c73029fb8
  text: '"Неумирающий и есть смерть!"'
- guid: a48a0409-3c16-483d-a333-43f88417cbc1
  text: '"Нет! Вы снова положите меня под нож! Вы — лжецы!"'
- guid: a4c78bad-16d3-4411-9ad7-b8430eb4f280
  text: '"Хм, у вас знакомое лицо..."'
- guid: a4e42da5-445f-465c-a616-9d40d434f160
  text: '"Одна из трофейных фон Валанциус. Возможно, после визита к Лорд-капитану вы захотите посетить этот зал..."'
- guid: a55fea03-7582-486d-b673-65c248f274d1
  text: Вы целиком предаетесь молитве и чувствуете присутствие чего-то большего.
- guid: a56500ac-ce80-4396-95ed-507c9d3998e1
  text: '"Если какая чернь посмеет непочтительность проявить — мы рядом. Усмирим".'
- guid: a58aa0b0-b879-4f0c-bf6e-65d667d3f2b1
  text: '"Когда же эта безмозглая чернь утихомирится..."'
- guid: a58ce131-aa80-41dc-aec1-45857031b215
  text: '"Мы идентифицировали род ксеносов, представляющих угрозу — это эльдары, древние и коварные враги Человечества".'
- guid: a5a1fb7a-7ccf-40bb-ab40-6ca5b1e765b0
  text: '"Это вряд ли... Боритесь, друзья! Не бойтесь, умирать за правое дело не больно!"'
- guid: a5b04aa6-a860-4d4c-be6e-ab3563b1bf66
  text: '"Если эти символы угроза тебе, элантах — найди и искорени ее. Если знаки почтения — прими такими, какие они есть".'
- guid: a5c7f3be-cce1-4495-b7e0-aba69a4085c9
  text: '"Служители Омниссии страшатся и презирают подобную техноересь. Мне не раз приходилось карать нечестивцев, поддавшихся искушению ксенотехнологий".'
- guid: a61de17b-bfed-4f49-a9e1-cd82a5205e63
  text: '"Император, прими мою душу для последнего суда, ведь то, что я вижу — смерть!"'
- guid: a6382595-505d-47f7-98ae-4b6cb6e3178e
  text: '"Ты был никудышным наставником. Твоя неудача только подтвердила мои ожидания. Тебе следовало знать свое место..."'
- guid: a64aa18c-4faf-434e-b9c9-bd95c736edab
  text: '"Зачем блюстители явились, Лорд-капитана охранять? Неужто думают, что мы {mf|его|ее} в обиду дадим?!"'
- guid: a69342c4-4aba-4b61-8c20-42a2c97e9717
  text: Глаза жреца совершенно пусты — он смотрит сквозь вас и не видит.
- guid: a6956b1b-36e9-49cd-ba3b-053c86fed6ca
  text: '"...пока непросвещенные дикари не нарушили целостность экспозиции".'
- guid: a6a7d194-6675-4581-bce2-6397362a442e
  text: '"Хватит уже про "святого Когнация". Сгинул ваш "Когнаций" в перелете, без всяких врагов Человечества впридачу".'
- guid: a6c6d242-57c3-40f7-bd26-bc621474fb7e
  text: Лучи, испускаемые светочами, ищут ваши зрачки, впиваются в них и пытаются выжечь, словно разъяренные сотканные из света змеи.
- guid: a6ca83bd-fe0d-4888-a89d-a72ea393fbf9
  text: '"Я для тебя всего лишь пес, которому позволено есть из золотой миски, но только пока он не наскучит".'
- guid: a6d55f34-fc9a-4a77-9e81-a8a813776455
  text: '"Что за тощая пародия на человека".'
- guid: a6e7384b-12ec-4a8d-b171-41acebbaed6e
  text: '"Примитивные ритуалы исполнены. Духи священной машины смиренно ожидают приказа активировать систему аварийной вентиляции".'
- guid: a6fe2d71-13cc-4ff0-9730-15bd9c672b74
  text: '"Какая же жуткая образина... ты только посмотри..."'
- guid: a75477ba-f86b-4933-a392-7620f1f60824
  text: '"Карающие плети Его секут спины нечистых багряным пламенем. Ибо Неумирающий есть долг!"'
- guid: a79d39af-a11c-4f35-956e-60d111608e72
  text: '"Следование символам поможет стандартизировать неучтенную группу экипажа и отыскать не нанесенный на карты отсек. Методика одобрена".'
- guid: a7cbae17-4565-43da-83ec-d8314fb65817
  text: '"Его нутро не для твоих очей".'
- guid: a7d4f221-eb3d-401a-9614-7ce095bbb50e
  text: Рядом с бережно сооруженным местом для поклонения тихо и спокойно.
- guid: a80430d0-b8e2-4c99-8a28-c508d462b7a2
  text: '"Никак праведников искал для кровавого ритуала? Надо возблагодарить Императора, что не указал ни на кого знамением в этот день..."'
- guid: a831e96d-823b-4d38-a02f-a1d4929398de
  text: '"Сей древний том исходится лилово-тленной гнилью. Не приближайтесь!"'
- guid: a835635d-f9e0-4cc5-a215-8d7f600ee83b
  text: '"Шли бы вы, {mf|господин|госпожа} хорош{mf|ий|ая}, отсюда..."'
- guid: a84ea58c-8b6f-4f39-80d1-8b86fb55f865
  text: '"Слава династии фон Валанциус! Избавили нас от палачихи!"'
- guid: a854ef9f-3b5f-4301-a387-d6de21a640b7
  text: '"Ага, конечно... аккуратнее "пакуй", а то если ты сейчас что-то раздавишь или сломаешь — оба на растопку Фесмофориуса пойдем".'
- guid: a8631ea3-10cd-42ba-b551-a63eae42e477
  text: '"Какой разгром... ужасно, просто ужасно..."'
- guid: a8af4a3e-43b4-4a15-807f-d02c7c28f668
  text: '"Не надо! Я же безоружен!"'
- guid: a8cd64bc-cdae-4e7b-8337-80e1f41c1dec
  text: '"Стоять до конца — не дадим нечестивым осквернить Дом Орселлио!"'
- guid: a8f72822-2114-4158-8a27-3c0fae30b72d
  text: '"Ты точно знаешь, что делаешь?"'
- guid: a9163d2b-7902-4d40-b3c1-9d66c2443443
  text: '"Мне одной кажется, что в этом месте произошло что-то... неправильное? Что-то, чего мы не видим и не понимаем?"'
- guid: a94be4ab-db0f-47cc-b55f-c12f4fa798cc
  text: '"А ты не слышал? Новая питомица Вольного Торговца прогнала часть служителей с нижнего уровня, и теперь ошивается там, в тенях".'
- guid: a9b84ce6-6d81-460a-be86-398c20e31c5d
  text: '"Возгорание на третьей, отключаю подачу воздуха... Ликвидировано... Разгерметизация на седьмой, блокирую шлюзы..."'
- guid: aa324437-ae14-4ed5-af5d-56c6eb9535d2
  text: '"Огонь по неприятелю! За дом Орселлио!"'
- guid: aa5b4537-ef47-47f7-b8a5-f2932503534e
  text: '"По заключению техноматов причиной перепадов мог стать системный сбой... но обнаружить его не удалось. Техножрецы возносят молитвы Омниссии в надежде исправить это".'
- guid: aa5bc0d0-f107-4adc-a119-7bfb7e6145c6
  text: '"Мечтай-мечтай. Самый тугоухий и сиплый вокс-оператор Толиман — на средние палубы!"'
- guid: aa6e6544-9c04-4d7a-a466-59b3394d9b8b
  text: '"Кто-то из нашего отсека напал на храм? Выдайте их блюстителям! Не хочу сдохнуть за чужие грехи!"'
- guid: aa847cf0-ed4b-48e6-93cb-87f508103f9d
  text: '"Оно... не имеет ни нити, ни имени. Наставь меня, Неумирающий... Как можно убить Это?!"'
- guid: aa91f583-73b5-499e-850d-e4e72fe6a4cd
  text: '"Для нас честь принимать столь высоких гостей, Ваша Светлость!"'
- guid: aa9a6d93-9eab-4c86-8543-b52c618a522e
  text: '"Слава Машинному Богу!"'
- guid: aa9dbde5-32bf-4d75-8c29-dfe4b6138693
  text: '"Знаки коллапса явствуют, проступают сквозь реальность".'
- guid: aaf6f228-8411-4156-a589-5e6b0519335c
  text: '"Познай дар тлена".'
- guid: aafbf9b9-bd1d-4ba5-9300-9534c3f7d586
  text: '"Я еще не насытился. Последние умирали слишком быстро".'
- guid: ab42195c-fcf8-45f0-9ec0-d77166aa1229
  text: '"Император избави от мерзкого ксеноса!"'
- guid: ab5014b5-e6fb-4181-bac8-9f19932df5f4
  text: '"Кей-морагх, это было слишком легко!"'
- guid: ab59d00c-a6cd-4066-82f4-6a37d5551a17
  text: '"Возможен лишь один исход! Пророчество Зари воплотится!"'
- guid: abc723f5-fdd5-4a32-9a43-772622e2dbed
  text: '"Несем безустанное бдение!"'
- guid: abdb9d0b-0f12-49f9-9232-3f629ce8e252
  text: '"Ты не поверишь — да. Дал одну вахту, туда и обратно. И вроде и хорошо, что ноги размял, а с другой стороны как поглядел на этот Футфол, так сразу же обратно на борт захотел..."'
- guid: ac139460-48cf-4677-b207-5e24bc594067
  text: '"Отбить мост! В атаку!"'
- guid: ac82c4ea-be41-4bd2-a41b-74ba209fe4a2
  text: '"Гравитационные волны Фурибундуса опять шалят. Помяните мои слова, когда-нибудь эта звезда просто перегреется и взорвется..."'
- guid: ac839541-ac82-4002-9bb1-df2a12c42c49
  text: '"Элантах, ты... Тянешься к вечной силе, дарованной скверной. Я обещала не судить тебя, но предупредить обязана".'
- guid: aceb8d5e-deb5-4e39-b7db-1ff84b7435c3
  text: '"Ликуйте, подданные династии фон Валанциус! В честь своего возвышения новый Вольный Торговец щедро являет вам свою милость!"'
- guid: ad02fca4-8f2e-4f72-b37c-3a2f938a4cb5
  text: '"Фиксирую источники инфекции. Запрашиваю категорический запрет на соприкосновение с зараженными областями".'
- guid: ad0a21e6-74ae-4793-b327-27e588286176
  text: '"Но ведь это правда! Тут старший офицер к этой штуке подошел слишклом близко — и все, тронулся. Изрисовал свою каюту надписями безумными, теперь только и делает, что бормочет бессмыслицу!"'
- guid: ad1d3815-3cfd-4cec-91a7-2b4de6e2d388
  text: '"Ожидали ли вы, что претендент мон-кай выживет в дикой охоте? Счастливы ли вы вновь узреть, как Плотояд пожирает плоть растерзанных врагов? Утолена ли ваша Губительная жажда?!"'
- guid: ad3dd58e-c585-4240-bbd9-b847a77ffb72
  text: 'Бедолага, расписанный пиратскими татуировками, глупо пялится на вас и еле слышно шепчет: "Убейте меня".'
- guid: ad55f9db-970a-465f-82c9-71accd85271e
  text: '"Э-это что, кровь?"'
- guid: add9066f-c4f8-4cc0-9386-4df400240791
  text: '"Это место переходит под командование Адептус Арбитес".'
- guid: ae08d197-42c4-4a23-8818-6843915c584e
  text: '"Тут надо сторонкой, по теням, в обход... В Прорве везде просочиться можно".'
- guid: ae19aa9e-72a3-4d07-8401-692399d70824
  text: '"Дерьмо! Не смей подыхать не по регламенту! Одного не досчитаются — всех накажут!"'
- guid: ae670e18-3a51-48a3-b66d-0c3ec219d65b
  text: '"Отступитесь, во имя милости Иши! Мы здесь, чтобы помочь вам!"'
- guid: ae95559a-16a9-4447-a2fd-bf74cf60121b
  text: '"И восстали мы из тьмы и пепла, дабы стать смотрителями крови, что течет по венам флагмана".'
- guid: aeb88bcd-dc2e-42b1-a0f8-559cc07f883d
  text: '"И забрала Сэйха, Дарующий Мощь, из ее холодной руки!"'
- guid: aef02cec-7d82-48d8-8d27-3bb0a8447668
  text: Техножрец едва стоит на ногах. Из многочисленных ран, оставшихся на месте вырезанных кусков плоти, сочится кровь вперемешку с машинным маслом.
- guid: aef7d60b-7557-428f-ab5a-5b06ed8dda44
  text: '"Трон меня разрази, снова клешню заело! Теперь ее к контейнеру придется крепить вручную".'
- guid: af1a9d96-d867-4a75-9ff9-5a7f0dcab829
  text: '"Однажды пережив предательство, сложно вновь доверять кому-то. Особенно самым верным и приближенным".'
- guid: af31e264-1c1f-4766-9178-22c79a35b750
  text: '"Спасибо за помощь, Лорд-капитан! Будьте осторожны".'
- guid: af859edc-8e8b-43e7-a835-fccfd4672547
  text: '"Может, и не верю. Но откуда-то же они появляются? Кто-то что-то видел... или хочет заставить других считать, что видел".'
- guid: aff7b14e-8c8f-47f9-86b8-d73075db829c
  text: '"Император защищает!"'
- guid: b0198d82-e153-4143-ab59-0a16fe6b8e46
  text: '"Ваша Светлость, одарите пайковым талончиком!"'
- guid: b03f4781-b55c-453e-ab58-d69afc71e28d
  text: '"Держи монету, парень, и бывай".'
- guid: b05da95f-0454-4d55-ad61-17f1d2ff580a
  text: '"Металлолом и шашки. Ну конечно. Каждый хладный торговец обязан хоть раз обобрать орка".'
- guid: b082a4f6-c77b-495e-8d5a-0bc0a2f487e3
  text: '"Культист он или нет, за такую ересь все равно казнить надо".'
- guid: b09ff6c2-1485-4eff-8975-1abd2986caf7
  text: '"Да врал твой кум, где в Просторе такого аристократа найти?"'
- guid: b0bdf42e-8ad3-412b-8746-76807677fa78
  text: '"Отличное место, чтобы припрятать от чужих глаз накопленное добро. Советую глядеть в оба — нам вряд ли будут рады".'
- guid: b0da49d7-9dc9-4bd5-aed9-f45d92189f65
  text: '"Свято пребудет вместилище, реликвию хранящее, неустанен будет слуга Твой, трудами живущий".'
- guid: b0fbc586-e7ef-43bb-b5de-541425a4e773
  text: '"Что? Но... кха... ох, святые Императора, что со мной происходит..."'
- guid: b0ff794d-af83-4ae8-ba23-b4370140cf87
  text: '"Без оков ложного бога я наконец-то смогла создать чертеж машины, порожденной работой моего ума. Могла ли я помыслить о таком, все еще пребывая в тенетах Омниссии?"'
- guid: b102d025-f2cf-4010-8df5-60d77e23bf1b
  text: '"Вы напрасно тратите ресурсы. Части тела еще могли пойти на материал для сервиторизации"'
- guid: b1549f07-92c8-4381-ac76-f5fed004021e
  text: '"Песок! Песок их союзник! Берегись!.."'
- guid: b16407c5-3102-4b74-bfdb-d5547cbc966e
  text: '"Видите сервиторов? Они медленные, но бьют со всей дури. Не подпускайте их слишком близко!"'
- guid: b1898e99-a08e-4360-991e-e8b6cfc92742
  text: '"Как же я хочу пить..."'
- guid: b19639bb-221f-48ec-94b7-10a14d414689
  text: '"Слава Императору и династии фон Валанциус!"'
- guid: b2252699-4e1c-499c-a4b6-8aeff40625a7
  text: '"Ты поплатишься за предательство, Фелек! Что... Что происходит?!"'
- guid: b236c656-0c42-48ac-a673-accedaa70c3e
  text: Мордатый блюститель лоснится довольством, словно обожравшаяся плотоядная тварь.
- guid: b2511466-78fb-42fc-8fab-2d70e8e09642
  text: '"Первый патруль — двое... Второй — трое... Начинать надо с троицы, у них дробовики..."'
- guid: b25d9bfd-ce02-43b2-b689-6b6b1ab16240
  text: '"[[Внимание]] Неполадки в зале ожидания // [Ожидаемый исход] Замена служебного сервитора".'
- guid: b29dbf75-d951-4b01-b27a-edc85911f468
  text: '"Возьмите меня на учебу, вон у меня башка какая большая!"'
- guid: b29fd9b7-febd-4830-8104-6d6faa25225f
  text: '"Грузопоток — в норме. Пассажиропоток — в норме. Служу династии!"'
- guid: b2df1a31-fb55-4f98-8f60-4400d2db3487
  text: '"...огромную роль в становлении Имперского культа на Даргонусе. Миссия пресветлой Экклезиархии была основана после прибытия двух пустотных кораблей, несущих на себе поколения пилигримов..."'
- guid: b2e91295-0886-49d8-bdae-173fd3268e8a
  text: '"Жизнь вас, мон-кай, ничему не учит. Мне начинает казаться, что вам просто не терпится угодить в наши сети".'
- guid: b30c0317-fa7f-4501-bdf0-29e87d05526f
  text: На мгновение кажется, что в пустом, безразличном взгляде сервитора мелькает тень какой-то мысли. Должно быть, показалось...
- guid: b3166507-a404-4d62-9a4c-a5a6d8fcfe25
  text: '"То Бог-Император услышал наши молитвы и послал Лорд-капитана, которо{mf|му|й} не плевать на простой люд!"'
- guid: b31fde25-bd78-493e-ac9b-ae98c0b82dfa
  text: Человек довольно причмокивает, высасывая жидкость из глазного яблока.
- guid: b3314704-180a-4728-a512-18fc210960cf
  text: '"Пусть Вольный Торговец нас и рассудит".'
- guid: b3400bcf-72f1-443a-a5e1-cc0e77a6a367
  text: '"Машина безмолвствует. Поднесенные дары неугодны духам".'
- guid: b35b6b66-d180-4529-9935-3f28e6c41c8b
  text: '"Неужели у губернатора Драйвстема действительно есть доказательства вины рода Версериан?"'
- guid: b36defee-a683-4a9c-a203-d24a8271f755
  text: '"Продавец запчастей из дока Т-4095 зачастил с грязными поставками — половина документации подложная. Думаю, он выведет нас на синдикат Красного Мученика, надо только подтолкнуть".'
- guid: b3973273-97bd-459e-b66d-5125ed7f2a29
  text: '"Соболезную, дорогой мой. Надеюсь, вывезенных облигаций хватит, чтобы найти транспорт до Каликсиса..."'
- guid: b3c29d5a-7c0e-4ef6-b8d5-83ae3a4a987b
  text: '"Сегодня великий и древний враг пал по воле Его. Восхвалим Неумирающего за то, что сделал нас исполнителями сей почетной миссии".'
- guid: b3e49e7b-aba4-4df3-af2f-3e88436a51c8
  text: '"Этот амасек... ну с той планеты, да... у нас еще осталось?"'
- guid: b3f63481-af45-4846-a09a-cd330f474783
  text: '"...кто отступит и дрогнет в мужестве своем, будет предан позорной казни как предатель династии и пособник врагов Человечества. Изгноните сомнения из ума своего, ибо то есть врата к проклятию..."'
- guid: b40f3d23-a2df-4e2e-bfcc-c10ee2af01a3
  text: '"Фенрис жаждет отмщения!"'
- guid: b41087a5-3266-4a29-b60b-0dd76087b92e
  text: '"Проклятье, от этого дыма до сих пор глаза слезятся..."'
- guid: b421f784-b5e7-4b7d-9b29-d940a220e33f
  text: '"Во имя Золотого Трона живем и умираем, дабы охранить свет Его от тьмы истребляющей..."'
- guid: b43b06f2-93c3-40a9-8791-1ecf049b995b
  text: '"01110101 01101110 01101011 01101110 01101111 01110111 01101110 00100000 01101101 01101001 01110011 01110100 01100001 01101011 01100101"'
- guid: b43e42f8-415c-446e-8bdc-23060238c95a
  text: '"Сэр, что вы делаете? Придите в себя, сэр!"'
- guid: b4af198a-7eb3-42e0-9fe6-d4a172fccfcc
  text: '"Для чего ты живешь?"'
- guid: b4cd7ccd-9ecd-4653-884e-e61c8be9d502
  text: '"Новые игрушки для наших забав!"'
- guid: b4e44b5d-ad0e-4b89-af7b-4398aaade985
  text: '"Ну уж нет! Я в ту сторону ни ногой. Никакая пожива не стоит того, чтобы снова столкнуться с тем безумцем".'
- guid: b4e8d016-03ca-410f-816e-07b0a66369f4
  text: '"Сомкнуть ряды! Не отступать!"'
- guid: b4f0dad8-ebf3-4ebb-a79d-0ec804069b19
  text: '"Как только Версерианы могли пойти против Его Светлости! Немыслимо..."'
- guid: b4f688db-55e1-473f-9042-7e74db147891
  text: '"Муан грам. Что у тебя?"'
- guid: b4fbd8bc-891c-4399-a205-4ca122416eee
  text: '"Сюда нельзя. Держитесь на виду".'
- guid: b4fd2407-b994-4d45-9e01-627ed76acaf7
  text: '"Помни, что все здесь — лишь отражение твоих мыслей, чувств и желаний. Не бойся смотреть им в лицо".'
- guid: b5463534-ad01-4e70-9d7d-d44f46eb6545
  text: '"Вот, пятьдесят семь пайковых талонов! Клянусь Троном, это все, что есть!"'
- guid: b5bde4e3-99bb-4478-9cae-365938ee88ae
  text: Рано. Добыча не должна видеть как охотник расставляет силок.
- guid: b5ce17fd-f7f0-42b5-b04b-570b66a57198
  text: '"Что ж. Есть и иной способ".'
- guid: b5ee3f32-535f-4506-94a3-cca8903185fc
  text: '"Ни одна зараза не проскочит, будьте уверены!"'
- guid: b616e008-1e39-4352-9104-9b8000488cc2
  text: '"Жаждущие! Желаете ли вы стать свидетелями великой легенды, старой как сама Комморра? Я дарую вам ее сегодня! Узрите сказание о Сирлаэль Изгнаннице, низвергнутой Суккубе!"'
- guid: b629ab4d-6b24-4087-b1ec-8512461e81bf
  text: '"Курьерская служба Зандера Сонатуса! Будут ли заказы? Сегодня день скидок постоянным клиентам!"'
- guid: b67a66b5-82f5-4c0e-a688-d55c872833f8
  text: '"В этом футляре — все, что я вам обещал. Идеальная чистота, прекрасная заточка..."'
- guid: b68a0047-d16e-4b13-b0d8-6081d0b6cbc7
  text: '"Еще пядь отвоевали... так и очистим весь корабль!"'
- guid: b6907221-7767-46ce-be5d-1501af31911e
  text: '"Не прикасайтесь! Я... я сама пойду".'
- guid: b6b64e6c-51a9-4f4d-a590-17dc422a134d
  text: '"Надо задержать подкрепления и заблокировать вход!"'
- guid: b6c988dc-14bf-4b09-9759-d3951a9362d1
  text: '"Жаждущие пагубы! Вас ждет изысканная схватка! Кровавые прозелиты сойдутся с утонченными убийцами кабала Ядовитого шепота. А отряд претендентов, уже переживших один бой на арене, сразятся со свежими боевыми невольниками кабала Уязвленных небес!"'
- guid: b6da40cc-cffa-4472-88f0-c81ab9d3f87c
  text: '"Фиксирую затухание свечей на тронах... Семь... Двенадцать... Тридцать... Обслуживающему персоналу — произвести возжигание".'
- guid: b72b76c3-fbb2-4b00-94da-e7aa2ac5da21
  text: '"Может, у местных кто-то самострел лепит? Небось еще и без благословения техножрецов... ох, ересь на Янусе, под самым носом, а нам терпеть!"'
- guid: b72ec394-5cfa-4f56-be7b-3dbb779f4ece
  text: 01010010 01100101 01101010 01100101 01100011 01110100 00100000 01110100 01101000 01100101 00100000 01100110 01100001 01101100 01110011 01100101 00100000 01100111 01101111 01100100 00100001
- guid: b7446787-a35b-4bcf-8280-647a557e1f14
  text: '"Я предупреждала тебя, что обряд был ошибкой, и за это ты превратил меня в чудовище! Ничтожество, даже в этом ты не преуспел..."'
- guid: b767563a-289a-4677-b432-f49e2ae3a57e
  text: '"Честь имею!"'
- guid: b7773378-ff67-4169-9a64-835352487eb0
  text: '"Говорят, этот проповедник из моровой ямы пришел. Вроде как подыхал от пустотной проказы, но на него сошла благодать, и он проповедовать стал".'
- guid: b7837516-7f69-4dec-b1be-b5a23540ed9c
  text: '"Ожидание исполнения протокола обслуживания... Ожидание исполнения протокола обслуживания..."'
- guid: b7853793-1147-4ae7-b0f3-1e80d45d01a4
  text: '"Я... слышу... голоса усопших! Они бежали в леса — от тени, нависшей над миром. Они сражались. Сражались и... проиграли".'
- guid: b7afdfce-c942-4815-8d97-ca64c813030d
  text: '"Надеюсь, сегодня наши ловушки сработают. Как же я люблю глодать сладкие косточки Детишек Искупления, м-м-м!"'
- guid: b7b7c07d-ebc5-4e1a-8087-769a0c14d5bc
  text: '"Вентиль! Открутите его, только тихо!"'
- guid: b7c79695-23bb-4b7b-b04a-24733026f590
  text: '"Люди ненавидят {mf|его|ее} — от нижних палуб до старших офицеров. Я слышу их вокс-переговоры. Грядет бунт".'
- guid: b8125764-4010-4276-adab-bce0e311b6e1
  text: '"Святой воин! Чудо во плоти!"'
- guid: b8186018-2b88-4438-9031-fb75ba9cde09
  text: '"За кусок заплесневевшего батончика из трупной муки местные готовы что угодно сделать. Подпалубные неудачники".'
- guid: b81e5f13-1611-4417-aa6f-a0a337696b9a
  text: '"Я помню, что должен был где-то быть... что делать... ох, что-то голове тяжело..."'
- guid: b84e388d-ec40-4978-ad29-d285d7a53ffe
  text: '"Именем Вольного Торговца династии фон Валанциус! Кто вторгся в покои {mf|Его|Ее} Светлости будет уничтожен!"'
- guid: b84f2da8-b5cf-4c42-873e-4034f47ab9e9
  text: '[Draft]'
- guid: b85f10b8-2b12-4516-81dd-90c7bde8343a
  text: '"Не держите зла, начальник… Покойничек я уже. Вон и черви во мне копошатся".'
- guid: b86b5e97-ab5d-454a-80e7-3f648e7c6205
  text: '"Подержанные вещи, недорого! Пятна от супа сами отмоете, за то и скидка!"'
- guid: b88c40aa-81e2-4259-b276-4a2dd4c29af7
  text: '"Я открыл свой взор истине... и наконец узрел неизбежное будущее!"'
- guid: b89343a2-b47f-46aa-a830-951f48b9511a
  text: '"Эй, эй, туда не ходите! Сюда!"'
- guid: b8bca5a5-21be-4107-b44c-df5e0da8923f
  text: '"Каюсь в грехах моих, отвергаю слабости плоти, возношу молитву Машине, чтобы стоять смело перед ликом твоим, о Омниссия!"'
- guid: b8bdf4b9-b182-4a81-a6da-f2900c7b092d
  text: '"Мы подвели вас, госпо{mf|дин|жа}..."'
- guid: b917a3f3-94d4-42f6-ab3b-25e40d1dfd01
  text: '"Шерин, даже мои бионические легкие перестают справляться с местным гостепреимством. Не пора ли запустить систему вентиляции?"'
- guid: b91de02a-58f4-40ec-9891-e9f5cf6f56d4
  text: '"Артиллерия! Как слышите меня?! Запрашиваю огневой барраж по взлетной площадке номер три!"'
- guid: b920cb95-8e8e-469c-b24b-10efe9468fd1
  text: Гвардеец старательно отводит глаза, будто боится встретиться с вами взглядом.
- guid: b9259e37-741e-4229-982d-c37b6e41d54d
  text: '"Ваша Светлость, вам в услужение верные люди не нужны? Я хоть сейчас!"'
- guid: b9a97ae4-9c0e-4376-b7b5-487bc95411e8
  text: '"Я не могу покинуть пост".'
- guid: b9b458f9-dc0c-4a35-b922-dadfa71cd2f3
  text: '"Думаешь? А если правду болтают? Ну, знаешь, про "святого Когнация"..."'
- guid: b9c6745a-4bba-4d65-8073-d616b0350269
  text: '"...но мне нужно думать о будущем. Мы остались без гроша, и я не хочу, чтобы мои дочери оставались в этом ужасном месте ни минутой дольше необходимого".'
- guid: b9e67462-13f8-48f5-968c-43db9156e081
  text: '"Это уже интересно... Давай, прыгай!"'
- guid: b9f09540-d2f1-4d83-af92-3d4072a73200
  text: '"Мое почтение, Вольный Торговец!"'
- guid: ba10506d-a3ee-4679-a49e-7ee176085c9c
  text: '"Да! Утолена!"'
- guid: ba50d881-8637-4b92-8075-0681c7a0a72f
  text: '"На Фенрисе говорят: если отчаянно искать встречи со смертью, она настигнет тебя в ту секунду, когда ты от нее отвернешься".'
- guid: ba5da723-d387-4793-8e7f-5cc523a280ca
  text: '"Славная битва, {name} фон Валанциус. Быть может, однажды я вновь позову тебя на охоту. Ну а пока — ты отправляйся по своим делам, а мне пора на корабль. Свидимся среди звезд!"'
- guid: ba6ed69b-f799-4df5-9a84-f9b19f634f5a
  text: '"Неумирающий шепчет о крови, и мы даруем Ему алые реки!"'
- guid: baa616ad-c8b3-4de6-9504-31cec866b002
  text: '"Ничего странного не слышу. По-моему, тебе стоит еще и слух проверить".'
- guid: bab607ca-e055-4dde-bdc6-839ceb512c13
  text: '"Стойте! Опустите оружие!"'
- guid: babba01e-e406-4418-9e62-8f5d88bbb952
  text: '"Докладывайте. Что известно о перепадах температур на корабле?"'
- guid: baeea9ed-195b-4a94-9f22-4c940ec6cb9f
  text: '"Стойте! Не делайте этого!"'
- guid: bb032a30-841c-4ccc-b214-5853e7608ded
  text: '"Его отправитель слишком скромен, чтобы вручить дар лично. Но надеется, что он пойдет на благо служителям истинной веры!"'
- guid: bb32f303-b51a-43f3-8b71-dfadf47a1e40
  text: '"Пусть Омниссия повырывает ноги тому дегенерату, который в последний раз задабривал машинного духа моего судна..."'
- guid: bb4353bb-7e09-49ba-bb48-406ff80de702
  text: '"Леди Иокаста распорядилась нести вахту в отсеке, пока вы оказываете здешним работягам честь своим визитом".'
- guid: bb963132-6be4-498b-b6ff-17c5196ff105
  text: '"Смерть апостатам!"'
- guid: bc135028-8872-4098-a7ea-6083555d5551
  text: '"Ваша Светлость, вы... уже уходите? Но ведь все так ждут вашего решения... Нижайше прошу, поговорите с губернатором Драйвстемом перед уходом..."'
- guid: bc2c2a70-fa10-4c57-a0a6-1010124ba531
  text: Рваное дыхание пробивается сквозь давящую тишину залы. Кто-то еще жив.
- guid: bc34a475-8b40-4ed6-ab86-46377e1ebbb3
  text: '"Славно, а то я малость заскучал".'
- guid: bc948fef-3008-47bd-ab06-45b321d37cd9
  text: '"Ваша Светлость, благодарю за своевременное спасение из Комморры! Комиссар Иако Сотний готов к службе. Вы же никому не расскажете нашу маленькую тайну?"'
- guid: bcb44232-057e-417b-b194-ae441c18861e
  text: '"Скорее! Уничтожьте это поле! Не заставляйте нашего господина ждать!"'
- guid: bce5920e-67bd-4612-baf1-40f72fc456cc
  text: '"Да? Чем обязан?"'
- guid: bd4eed3a-7c1b-4230-99bc-fab4543cbd68
  text: '"Проклятые... ксеносы... Сдохните, сдохните!"'
- guid: bd612f00-8bac-48b5-83cb-9c82853e4b14
  text: '"Говорят, один из астероидов сорвался с привязи... Надо глядеть в оба".'
- guid: bd6dd327-1479-4e1b-b60c-096d8fef5417
  text: '"Это... мерзкое чувство... Варп извращает реальность!"'
- guid: bd969883-5796-46a1-905a-252657a884ed
  text: Содержимое инъектора интригующе булькает, будто призывает испытать удачу и вместе узнать, яд внутри или лекарство.
- guid: bda7eddc-5cfd-49d5-a247-2ba0d35625af
  text: '"Да я лучше один раз сгорю заживо, чем буду всю оставшуюся жизнь горбатиться на сменах, а потом меня еще изобьют и пайковые талоны отожмут!"'
- guid: bdb00c5c-9f75-4a8c-9de0-df85b99d7a1b
  text: '"Размести заказ покрупнее, вышли аванс и назначь встречу. Возьмем на горячем".'
- guid: bdcc9bbb-c02f-45a0-b4c7-24d69f05886e
  text: '"Что... Это я выдолбил? Почему я ничего не помню..."'
- guid: be2c3452-a96e-492c-95ab-c8c801bf5bf1
  text: '"Клинки в руках ваших — не орудие, но продолжение вас. Слейтесь с металлом. Вкусите лезвием кровь!"'
- guid: be9b96f8-7199-4c69-8399-754f814ac223
  text: '"Ой, как вкусно! Когда я вырасту, а ты старенький станешь, я тебе тоже буду лакомства приносить".'
- guid: bec89cf4-a2b1-4d81-8d28-c65a846a276d
  text: '"Ваша Светлость! Вы найдете губернатора Драйвстема в тронном зале".'
- guid: bee67051-ecce-41ab-9a27-6c20b76a80a5
  text: '"Еще немного — и я начну слышать шепот Той... Скорее бы вернуться в Комморру и попасть на трибуны арены!"'
- guid: bf38509b-1aaf-4d8a-a606-7c160eb4dc07
  text: '"Что... что это было?.. Помню только жуткий смех и мрак вокруг..."'
- guid: bf7e4021-8dfd-48c9-9ecb-e2e520158ccb
  text: '"Неужели успел{mf||а} позабыть обо мне, {name}? О, не забывай ни на минуту. Ибо как только ты отвернешься, я воткну осколок своего меча тебе в глотку!"'
- guid: bf996b3e-9331-4150-8d96-f836f211df3f
  text: '"...служит напоминанием о священной миссии Вольных Торговцев, что все думы и стремления направляют к одной цели — служению Его Воле..."'
- guid: bfdd9fc6-92f3-46f8-bbf3-ca3156f54cc0
  text: '"Скорее, скорее, пока Лорд-капитан не осерчала..."'
- guid: bfebb1f2-8e9e-4a08-82df-d8d123b648ed
  text: '"Странно... голосочки заткнулись. Только хихикают тихо, когда вы что-то трогаете. Может, вернемся и вымоем руки с мылом раз десять?"'
- guid: c00491fa-57d2-43cf-ae60-f1bbf15c7234
  text: '"Какие развлечения я могу вам предложить?"'
- guid: c014ee7d-491b-49d8-a9a7-81eff0fcb9e8
  text: '"Тебе сюда нельзя, мясо".'
- guid: c0438d7a-c76a-4fcf-8a5a-057823a5a220
  text: '"Пока я могу использовать {mf|его|ее} троны, мне все равно".'
- guid: c072cd51-c350-4cc1-a5d1-0af2dca742f3
  text: '"[[Расчет координат]] Дальнейший путь лежит в этом направлении // Запись встречи занесена в архив".'
- guid: c0b6d9cb-2a04-47f8-ae1c-0e4049e475df
  text: '"Госпожа Хейдари, мое терпение сложно истощить, но у вас почти получилось. Повторяю еще раз: нет, я не выдам вам никакую печать. Ни за честное слово, ни за взятку".'
- guid: c0c52bbc-c201-4688-b9a2-633d632ac56a
  text: '"Здесь нас никто не тронет. И тебя уже никто не тронет".'
- guid: c1026cb7-a151-4ce8-afb6-f3d41278a298
  text: '"Не очень понятно — поменяется для нас что-то или нет. Но хоть помилование получили..."'
- guid: c129bc84-7c7d-44b1-813f-22f25d9327ba
  text: '"Слава фон Валанциус! Кабы не {mf|его|ее} милость — друг друга бы вскорости жрать начали!"'
- guid: c1553011-a0be-4b5e-aa49-77de210d375d
  text: '"{name}! Нет, {name}!"'
- guid: c16b45e9-de37-48d4-b091-1e1c7f8910a3
  text: '"Это было ужасно! Они выглядели как обычные аристократы низшего звена — в своих безвкусных вычурных нарядах, а потом... потом они выхватили оружие! Какой кошмар... Подайте мне вина".'
- guid: c189c602-3435-401b-931a-65121c90fdaa
  text: В сердце Футфола находится колоссальная статуя Императора, высеченная из целого астероида.
- guid: c1bfd3c0-d4fd-43b5-99c5-4cf48f17331b
  text: '"Свет... я вижу свет..."'
- guid: c1c85c7b-7549-4989-9d8a-b2d302367893
  text: '"Такой перстенек славный был, куда же делся? Если найду да господину блюстителю подам, авось отпустит за службу добрую... Точно отпустят..."'
- guid: c1d004f6-8864-4376-8ae1-1fd433c17fcf
  text: '"Смерть в дланях Его!"'
- guid: c1d44966-d5a6-477c-ab99-3c10348b234b
  text: '"Я редко задумывалась о том, какую цену платят темные кузены, чтобы сберечь свои души от лап Той, Что Жаждет. Зато теперь я вижу, какую цену платят их жертвы. Какую цену заплатили мои братья".'
- guid: c1f26a23-9494-4f81-9f58-196fdddb2ef5
  text: '"Все кончено-о-о! Нас скоро убьют... Я больше так не могу-у-у!"'
- guid: c21ba46f-4daa-41e6-9096-dc978abe196d
  text: '"Разве образец не должен был уже начать трансформироваться? По-моему он просто скучно и предсказуемо умирает".'
- guid: c22bc5d8-dfa3-456d-9530-e4274b8b2666
  text: '"Мы близко! Я почти чувствую ручку двери под своей ладонью... Что? Да, слышу вас, шепотки родименькие, ведите нас!"'
- guid: c2453972-b9d5-4383-84a2-adb99d65558d
  text: '"Глядите, глядите, во образина!"'
- guid: c28f6cca-d711-43f5-a389-687c11c0fd02
  text: '"Исполнять волю владыки — наш долг. Мы более не проводим души на другую сторону. Когда время настанет, Неумирающий заберет их сам".'
- guid: c299dd6c-a0c4-4377-9412-ee1bdae8c1b7
  text: '"Нет, пожалуйста, только не меня! НЕТ!"'
- guid: c2b8b7eb-0acb-4cc9-b58f-c43417e0a18d
  text: '"Смотрите, шерин! В глубинах улья горят фонари. Неужели кто-то пережил катастрофу?"'
- guid: c2d49130-41cd-4126-b234-5f251bcc945a
  text: '"Неисправность предохранителя на троне тридцать... Требуется вмешательство технопровидца".'
- guid: c304a3f7-7271-4377-9de1-004cb0cb4fbe
  text: '"Все судьбы господина уже выточены в камне! Вы не сможете их разрушить покуда я жив".'
- guid: c3429a4d-555c-478f-a68e-7a5de127732f
  text: '"Да не оскудеет заряд благости Омниссии в батареях преданных!"'
- guid: c36c4dbd-e6c9-4b74-8744-f8feeaff0081
  text: '"Я уже видела этот коридор. Направо — мы почти там. Это сон или явь? Впрочем, какая разница, путь лишь один... да, направо!"'
- guid: c3c38c05-2e97-4869-a239-5e816f16d956
  text: '"Я лишь хотела помочь. Спасти тебя. А ты... Что ты со мной сделал?!"'
- guid: c3c53bd0-72f4-4879-93b0-bf026cc72a1b
  text: '"Стой, проклятое Дитя! Чтобы остановить тебя, нам пришлось вновь объединиться с ксеносами..."'
- guid: c42eeb1e-908a-4832-aa36-17b9deb6c638
  text: '"Господь-Император, какая скука! Хоть бы поругаться с кем-нибудь".'
- guid: c43df3d8-ef6c-44b9-a7a2-fc5ba55c336e
  text: '"Что происходит? Куда все бегут?"'
- guid: c451c534-9dea-450b-844b-5e5497495462
  text: '"Это вам не проходной двор! Эй! Кыш! Да что ж это такое..."'
- guid: c494f88c-f0c0-4414-9bfe-56b643ac5b81
  text: '"Светом своей души ты рассекаешь тьму, готов{mf|ый|ая} подарить надежду тем, кто нуждается в ней. Прими свой свет".'
- guid: c4a06a52-86df-4695-9977-7f425ecb2344
  text: '"Кто-нибудь... По-помогите!.."'
- guid: c4adf899-6e93-4b3a-bda8-861254d9e609
  text: '"Обитатели этих миров давно мертвы. Но и мертвые подсудны Богу-Императору!"'
- guid: c4c0a083-c21b-4f79-b956-368d58c2bba1
  text: Взгляд проходит сквозь вас, будто вас вовсе не существует.
- guid: c4cb276f-a233-4e6d-a244-cd69420978b1
  text: '"Император, веди мою руку, ибо мне суждено взрезать и исцелить плоть страждущего. Не дай дрогнуть ни мне, ни моему сердцу..."'
- guid: c4ce775c-4761-4cb4-9a83-56e7b024a245
  text: '"Ваша Светлость! Мы проследим, чтобы больше ни один выродок не потревожил покой усопших".'
- guid: c4cf936d-3af0-45d1-a981-eda2baf6d506
  text: '"К ору... погодите-ка! Это же {mf|Его|Ее} Светлость фон Валанциус! Ох, я уж решил, псы Чорды снова с проверкой пожаловали... отбой тревоги!"'
- guid: c4f8c782-4341-424e-a677-3ee2eb29fb1a
  text: '"Как мерзостны бывают следы мон-кай. Не трогай ничего, тут всюду цепкая смерть".'
- guid: c5640e73-a8cc-4b53-bd2d-b5310751d8e4
  text: '"Избавились от одного Вольного Торговца — избавимся и от это{mf||й}".'
- guid: c58b9852-fa06-4f21-8842-088ab9a58f0b
  text: '"Нас наняли убивать мон-кай. Тебя? Или ты приш{mf|ел|ла} сказать, кого?"'
- guid: c5ce223d-32ce-491b-b215-30587f17f84c
  text: '"Если губернатора не станет, значит... значит, я смогу вернуться домой..."'
- guid: c5dd6f37-c50b-4a10-bb5b-f1c65680057f
  text: '"Мои легкие полнятся гнилью бездыханных тел. От них... исходят всполохи ядовитых оттенков. Прошу, не трогайте ничего!"'
- guid: c5f969cd-50dc-4a29-a75c-8af7a4ba80c2
  text: '"Вольно. По завершении молебена проведите осмотр систем терморегуляции и представьте подробный отчет".'
- guid: c6185e17-8d94-4b85-8dd0-0de80df3f63c
  text: '"Захватите разрывные пули из арсенала. С оторванными ногами он не убежит далеко".'
- guid: c627a6a0-c516-4e32-a7ef-c777427d5bc3
  text: '"Слава Вольному Торговцу!"'
- guid: c643c99c-f30c-4561-9b25-84d7632597ca
  text: '"Тс-с-с, тише!.. Кажется, Великий и на сей раз отвел беду. Но молю вас, шерин, всеми звездами галактики молю — больше ошибаться нельзя. Нервы Фалько уже на пределе".'
- guid: c65a64fc-252f-4cc2-a46c-fc8d2fe86752
  text: '"И спустил{mf|ся|ась} {mf|он|она} на мир с небес, и наступил на мире том золотой век!"'
- guid: c6a18d37-02c7-4433-b167-2cbdebc03809
  text: '"Ткач кровавых сетей! Пусть не еретик я, но молю тебя о смерти! Сделай исключение для исстрадавшейся души..."'
- guid: c6a5b76e-1248-4202-9f4b-e605b81cb4d7
  text: '"Что-что? Ребра болят? Это я еще ласково. Сознавайся, пока я по-плохому не начал!"'
- guid: c6aae37e-c53e-46d9-8f86-5523c653af48
  text: '"Да что ж такое!"'
- guid: c6e8cfe2-cba0-42ef-a884-74b64ee57584
  text: '"Нет... не так... это фальшивка! Все было не так!"'
- guid: c6f28496-0ec9-4dc4-be1c-977e0bbfe213
  text: '"Я покину тебя ненадолго, эттфатер. Хочу размяться".'
- guid: c701d502-67fc-42bf-94a2-08f1dcb8e03e
  text: '"Смерть нарушителям! Смерть святотатцам!"'
- guid: c7078b74-35ed-4993-8bfe-99f9543817e7
  text: '"Нет смысла думать о слабаках, что не смогли здесь выжить. Господину не нужны слабаки в свите. Господину нужны лучшие".'
- guid: c71e9961-2c17-4c9d-b869-0bfeb52b26a2
  text: '"Трон подери, теперь Фалько точно знает, что мы здесь! Нужно спасти ребят, скорее!"'
- guid: c73be9cb-ca59-4b58-884d-435174a02c0b
  text: '"Ищете крепких парней в найм, Ваша Светлость?"'
- guid: c73ccf07-492c-44fa-8675-a54ffd410caa
  text: '"И убила ее!"'
- guid: c744d3a9-c4c1-4b6b-919f-1bb153f87d74
  text: '"Воистину благие вести. Когда же сможем мы лицезреть его, дабы преклонить колени и вознести молитвы древним духам машины?"'
- guid: c76a7644-cfb2-4e42-abe8-ed0504745b21
  text: '"И передай Фалько, чтобы в следующий раз приходил сам!"'
- guid: c776460e-2240-4ded-96e9-57b60532f828
  text: '"Да не спрашивай. Опять они... ну, ты знаешь... анверы. Совсем оборзели твари, спасу нет".'
- guid: c776c302-4a59-4443-9696-bbf6224da429
  text: '"Когда-нибудь Наместник избавится от каждого из вас, никчемный скот!"'
- guid: c7829af3-e9b4-4fc9-8be5-4e9a905fa846
  text: '"Милосердная Иша... Лишь настоящее чудовище способно на подобное зверство".'
- guid: c7aabfca-fe17-4dee-b795-3e6f6ad58b17
  text: '"Господин, на станции посторонние".'
- guid: c7c867df-0005-4155-a708-7a98d048a90c
  text: '"Я буду молиться о ниспослании Вольному Торговца откровения Омниссии, что позволит найти Чудотворному Реактору место, что отвечает могуществу сей машины".'
- guid: c7ddf648-2c39-4ce6-95a6-f0628278e987
  text: '"Боль, агония, страх, безумие... Что за чудный коктейль из страданий мы пропустили!"'
- guid: c7f89fa1-22b7-45b4-9522-f11c07588ca8
  text: '"Император храни, ну куда же вы идете?!"'
- guid: c8440e78-8483-4cf8-8095-9c81cda1c2a8
  text: '"На этом пересказ летописи фон Валанциус завершен. Вознеситесь мыслями к избранникам Бога-Императора и возблагодарите Его за дарование так{mf|ого|ой} защитни{mf|ка|цы} вашего мира!"'
- guid: c846e060-6c9b-40af-8001-f7796559cb8c
  text: '"Скорее! Надо пробиться наружу! О Император, защити!"'
- guid: c86cb196-d338-4f08-9cfe-fdf42d96d36f
  text: '"А фактотум-то наш боевой оказался!"'
- guid: c8794d12-93be-43fe-b752-0273a252991f
  text: '"...Пожалуй, мы вычеркнем это из протокола..."'
- guid: c88887d0-a556-4b05-8350-e2be488d51e2
  text: '"А я тебе говорил — надо на того ставить, на ком язв больше. Они почему-то самые живучие".'
- guid: c8895384-116a-45fe-919e-53b284b2bacc
  text: '"Что-то потерял, друг? Давай-ка мы тебе подсобим. Ребята, хватайте его!"'
- guid: c8a6110d-864d-438b-98ca-fef24aa44abe
  text: '"И не говори. У меня от нее мороз по коже. Стремная на вид, говорит странно, а с оружием обращается... я, кстати, впервые такое ружье вижу. Интересно, откуда?"'
- guid: c8eb8f15-85e0-4146-a535-b225ee39fdbe
  text: '"Месяц красный, как вино.

    Кто скребет в мое окно?

    Тень шепнула не тая:

    Это смерть пришла — ТВОЯ!"'
- guid: c9085b65-cd08-4f73-9078-4128ca299686
  text: '"А вот и еда! Сама пришла к нам в руки!"'
- guid: c929a93d-5df4-4bb7-b35e-77e8f5450cd0
  text: '"На самом деле ты ни во что не веришь, {name}. Ни в Бога-Императора, ни в людей, ни в Архиврага. Ты и в себя-то веришь с трудом. Жаль тебя".'
- guid: c941531c-5652-4bef-9e12-0f5b53735651
  text: '"Не напоминай. У меня приятель в блюстителях есть... был. Сгинул, когда эти проклятые выродки от варп-колдовства взбесились".'
- guid: c95db39e-7c25-4630-a6b2-1dc44da9b2a1
  text: '"Сии священные машины нуждаются в ритуале обслуживания и могут послужить союзниками в борьбе с предателями".'
- guid: c963fe0c-7cf8-45c7-83f7-78c37f9b6ed7
  text: '"Будем считать это обменом. Я заберу твой меч, а тебе достался мой".'
- guid: c96f75e0-741f-4a99-a249-4ea862adeba8
  text: '"Спасибо, спасибо. Давно писем не получал, надеюсь это от какой-нибудь очарованной мною молодой особы! ...А. Хм. Нет. Это счета..."'
- guid: c990dff0-a182-48a4-a6c7-be23b0121269
  text: '"Проклятье Трона, да это место — почти братская могила! Обычные гвардейцы свалены снаружи, важная шишка подохла внутри. Хах. В Империуме ничего не меняется".'
- guid: c9957980-7011-4833-89c5-cee2f352f107
  text: '"Думаешь, я не могу просто размозжить тебе башку? Подумай еще раз!"'
- guid: c9a8bb4d-c4bf-480d-8b4a-ba498608c654
  text: '"Завтра полезу наверх, к атриуму... может, перепадет чего, еще день ноги не протяну..."'
- guid: c9c8689b-35b7-4b69-a552-d98bfc196242
  text: '"Песнь священных механизмов содержит ошибку. Обнаружены следы вмешательства..."'
- guid: ca6217d7-1b85-48d5-8765-082818c6a86c
  text: '"Вы прибыли по месту назначения. А теперь — умрите! За Зарю и Последний восход!"'
- guid: ca814311-bdff-43fc-907d-3946f9251bcc
  text: '"Не можешь мне навредить? Какая досада! Видимо, судьба не на твоей стороне!"'
- guid: ca86cc05-b455-4ed0-b35a-1f1135e375f3
  text: '"Пойдем же. Вскоре ты все увидишь сам{mf||а}, элантах".'
- guid: cb210acf-b5b2-4580-83fd-36ec3af3bf8b
  text: '"После каждого варп-перелета на палубе в одном и том же месте появляется кровавое пятно. Впрочем, я не жалуюсь. Доля истинного слуги Императора — неустанно уничтожать скверну. Не так ли?"'
- guid: cb5d8187-cd2c-49c9-a4f1-40ef85ad0cc2
  text: '"Не стойте на месте! Помогите Вольному Торговцу защитить Дитя и дворец!"'
- guid: cb73931a-3fbe-432a-9931-e3ab7d245dba
  text: '"Славься, ангел Императора!"'
- guid: cb7c8a5e-150b-46ab-bee0-1a99fe2cef28
  text: '"Неумирающий есть смерть. Неумирающий есть долг".'
- guid: cba2a146-6e2d-4447-ae0b-c51d517825a8
  text: '"Очередные прихвостни Фелека? Я ВСЕХ ВАС УНИЧТОЖУ!"'
- guid: cba687d7-6e05-475f-bcee-953bffc6c357
  text: '"Говорят, он целого архонта плазмой пожег!"'
- guid: cbb3bde8-c0b5-4b06-9446-a18a1f4721d8
  text: '"Я после этого три дня из часовни не выходил — за защиту семьи Владыку благодарил. Все мои выжили, а ведь через две переборки такая резня случилась... и взаправду Император беду отвел!"'
- guid: cbb492c3-fd66-47be-8292-d3aa4c869008
  text: '"Я пришел накормить вас своей смертью!"'
- guid: cbdb7970-8e28-49ce-b777-3f7664f21046
  text: '"Прощайте, моя госпожа".'
- guid: cbf4410c-b0bb-4200-a691-d1f78b7652fe
  text: '"Слишком много голосов... Я слышу их ярость. "Дверь открыта — иди, отомсти за нас", — говорят они".'
- guid: cc197764-1b70-4010-be9b-2c3311ef64c0
  text: '"Ксеносская падаль, познайте нашу кровавую жажду!"'
- guid: cc35d2ee-008b-4540-929d-19a42e56e42c
  text: '"Прошу прощения, господин, дальше нельзя — по распоряжению губернатора Драйвстема".'
- guid: cc6d9ec1-f34e-42bd-8383-71f1f92da3bd
  text: '"Солнце погаснет, мир переродится! Заря приведет нас к новому свету!"'
- guid: cc74a7ba-50d5-4e41-9cdc-ad1c2b02b602
  text: '"Мы уже обожглись об этого ажи. Поищем еще, шерин?"'
- guid: cc91f40e-3574-4d33-b009-5a92a1594714
  text: '"...Видите? Яд уже начал распространяться по его телу. Кровь в глазах — первый признак поцелуя смерти".'
- guid: cce36380-fc48-4cd1-ab9a-c31c49c1b69c
  text: '"Врага Человечества не оставляй в живых!"'
- guid: cd0409af-f6bd-47c6-afe7-41defb9d079a
  text: '"Мое дело не языком молоть, а за такими, как ты, приглядывать".'
- guid: cd04f3da-ae81-4b18-921b-08aed23ff37a
  text: '"Раскаяние рождается в муках. Душа, свободная от мук, готова впустить в себя скверну".'
- guid: cd278fbd-212d-4f8e-8d2d-bfe2fd855823
  text: '"Каждая мразь, стучавшая на своих блюстителям, ответит за грехи. Теперь наш суд!"'
- guid: cd5b2d4a-9c08-464a-9a3e-8ac6f8895815
  text: '"Безумие и гениальность — два явления одного порядка, и это неоспоримый факт. Спросите себя, Вольный Торговец: так ли вы близки ко второму и далеки от первого? Путь вашего восхождения устлан бесчисленными жертвами, но вы избегаете смотреть себе под ноги, чтобы не сойти с ума."'
- guid: cd8809ae-e65a-4859-95bc-1f2023dd5265
  text: '"Во имя Великого, постарайтесь не привлекать внимание, шерин! Иначе Фалько ребятам быстро головы пооткручивает!"'
- guid: cdc5577d-2b45-4f7b-adaa-1eca4144fed3
  text: '"Ты, хромой, — на кухню. Все равно больше не пригодишься нигде".'
- guid: cde4f30c-ba84-422f-ad55-b8268b677777
  text: '"Император защищает!"'
- guid: ce06c9da-9741-4a0f-afb7-d631f569a8fb
  text: '"Еретики и ксеносы получат по заслугам... ведь так?"'
- guid: ce37778b-4642-48dc-8feb-1f3d3244b78d
  text: '"Где же вы откопали такой бриллиант, Ваша Светлость? Дамы как мисс Хейдари — настоящее сокровище!"'
- guid: cebde9b3-5c6d-4a9d-ae05-25748e4d7e57
  text: '"Он? Что вы, это вздор! Он никогда не имел никаких дел с этими... заносчивыми наглецами".'
- guid: cf1f6017-4b38-4f35-919d-4cb43fb85441
  text: '"Лучший аттракцион Футфола — живые ксеносы в клетках!"'
- guid: cf200d06-9cbc-410c-a04d-1ff96fa91734
  text: '"Послушайте, я — друг культа, может быть, мы сможем..."'
- guid: cf51c340-4a80-4e37-994a-c5201ae819a5
  text: '"Как насчет освежиться после смены. Говорят, в "Приюте" появилась нормальная обскура".'
- guid: cf5c5cd9-3527-4405-a0cf-b086c2482c63
  text: '"Оценка вероятности конфликта: неизбежен. Инициирую протокол //отступления//избежания конфронтации//смены дислокации//".'
- guid: cf5e26c9-67be-4026-bba8-02eb856dc6ef
  text: Для регулирования потоков необходим клапан.
- guid: cf8a405c-a454-4b78-99fc-5e46021d7f88
  text: '"Я не… Не хотел… Не могу больше..."'
- guid: cfad0719-946d-4284-95c1-68196c820098
  text: '"Процедура перезапуска завершена. Приступаю к выполнению программных задач".'
- guid: cfd9dae7-fa4a-41e0-92cc-12887d2ff345
  text: '"Какая удивительная ксенотварь. Мне не доводилось слышать о таких уродцах. Интересно, с какой она планеты?"'
- guid: d0a102ca-3f52-4023-a0f5-163a310f017f
  text: '"Старший лейтенант Эрэбис, Лорд-капитан! Слежу за порядком на мостике!"'
- guid: d0ae8619-49c0-4e92-bbef-7991b4f4cd00
  text: '"Ней... рохирургческая... стим-уляция задней час-ти... гип-тлам...ламуса... Необходима... для чего?.."'
- guid: d0cd7dcd-69fe-4c95-a3ac-4bb76039ef84
  text: '"...И должно заблудшим слушать пастырей своих, и следовать за ними, и быть кроткими и благодарными..."'
- guid: d0f09b04-eef3-4a95-858d-1be05574f638
  text: Из плоти усопших прорастают зловонные некротические цветы, выпускающие облачка сияющих спор.
- guid: d0f439de-5d0b-451c-979c-049f3b1a7f99
  text: '"Я снова видела их. Какие ужасные, противоестественные существа..."'
- guid: d0f5e83a-7256-4223-95c1-8692e9103d07
  text: '"Ваше вашество, здоровы будьте! А мы тут вот... старика нашего Денза провожаем..."'
- guid: d14cfdb5-4758-4d1f-8e1a-298259403dbd
  text: '"К оружию, верные! Сегодня мы положим конец тирании!"'
- guid: d15566b2-8252-4701-a786-e0db0a068214
  text: '"Лишь глупцы и безумцы всегда уверены в своих силах. Мудрые же полны сомнений, но умеют их отпускать".'
- guid: d16bafef-a7ec-44ac-8744-1eaed06316ac
  text: '[Draft]'
- guid: d18ddb12-77ea-4522-8450-192d497f069a
  text: '"Продолжай опыты, Фси''кхир. Каэ морган тшане".'
- guid: d1b35090-17ad-4913-8d6b-f139cda01660
  text: '"Прекрати корчить из себя невежду. Ты знаешь, зачем я тут".'
- guid: d1c211e2-b522-40a2-82a9-7752148f7ada
  text: '"Благодарю, госпожа. Быть может, вы помните еще что-нибудь?"'
- guid: d1efa215-b2d1-40e8-8daf-b331bede27ef
  text: '"Защити нас от ужасов варпа, от нечистых ксеносов, от всякого зла, противного замыслу Твоему".'
- guid: d20ea980-8ed7-422c-8511-ded9c4b7f753
  text: '"Когда прибудет мой шаттл? Мое терпение почти на исходе!"'
- guid: d2125193-8f90-492e-b8ec-44c0f5eb08af
  text: '"Вы... Тоже выжившие, да? Подождите немного, я позову наимудрейших. Они вершат наши судьбы".'
- guid: d224ed6a-63c8-463f-bd10-90c939cc35fa
  text: '"А я ведь говорил — не надо им на глаза попадаться. Охотнички, живодеры проклятые".'
- guid: d2288cec-c60b-4012-8a23-1875d4f78be9
  text: '"Ожидаемое значение: 10".'
- guid: d24487f5-0a76-4670-b354-d80a6bf296be
  text: '"Неумирающий Император прошептал свою волю. Душа твоя отныне ему дарована".'
- guid: d27090cd-0510-4c30-8510-fd7ec678b52b
  text: '"Император... хе-хе... смешное слово какое. Никогда не задумывался... а смешное..."'
- guid: d2bb9882-cbaf-4252-8b15-812eceeed5f7
  text: Машинный алтарь функционирует, но готов отозваться лишь на особую команду, неизвестную вам.
- guid: d2da1c45-cc1d-439a-b6b3-dd3360be49ec
  text: '"Если эти ашмаги покусились хотя бы на что-то из груза..."'
- guid: d3021c15-5398-4dca-ac11-8e291aaaeab7
  text: '"Положи оружие, и тебе ничего не сделают. Я клянусь".'
- guid: d337f162-447b-43da-99d5-e0328d7f657c
  text: '"Ваш-Светлость!"'
- guid: d343e582-33f6-4854-aff4-e8b222b50cb8
  text: '"Собственность Вольного Торговца фон Валанциус. Не приближайтесь, или это будет расценено как покушение"'
- guid: d377f44d-fbfe-443b-ab38-b085574f12a0
  text: '"Мне однажды довелось побывать на мизинце статуи Императора!"'
- guid: d3799912-eeb6-449d-a3db-9b778347cec9
  text: '"Я — спаситель нашего Дома! И я готов за это заплатить высшую цену. Убейте их!"'
- guid: d3912e3b-4dba-47d9-9dfe-bc0e62b59f06
  text: '"Отныне ты плетешь кровавую сеть. Отринь мирское, и кровь из рук Его очистит тебя. И будет свершен ритуал отказа от бремени".'
- guid: d393172a-6c6f-4b0b-ab78-5e79cb86129c
  text: Судя по скрипу механических частей и тошнотворному запаху от плоти, сервитор плохо обслуживается и явно преодолел порог допустимого износа.
- guid: d3aacaf3-8685-41db-9162-fe5fcdcd2aff
  text: '"Забвение неизбежно, закат бескрайний сменится кошмарным восходом! Извергнет чрево в мир стенаний!.."'
- guid: d3e08786-c7f4-4339-951e-8237102774e1
  text: '"Хорошо. А теперь попытайся заглянуть в свою душу. Узри ее робкое сияние и... погружайся".'
- guid: d3ed7ed2-9da0-4d37-af93-f8c79978aec8
  text: '"Сконцентрируйтесь на ногах. Не думайте — чувствуйте! И тело само поведет вас".'
- guid: d3f737c4-6ffb-4ae9-8e5e-0d654b657ec2
  text: '"Гончие Кикеросс мертвы! Мы показали себя, может, культ даже возьмет нас под покровительство! Вот только нас... слишком много. А много победителей не бывает!"'
- guid: d404b345-7d0e-4e08-8dbb-f161858aeec7
  text: '"Слишком слабые. Нужен достойный противник".'
- guid: d43fed65-8ff3-4eb8-8bcc-2178f7a5c928
  text: '"Штатным с авгуров только страху наводить. Чтобы чувствовать себя важнее".'
- guid: d45088d2-b8c5-41e2-9127-fa196a87d924
  text: '"Некоторые слова необходимо услышать хоть раз, чтобы в них поверить".'
- guid: d4717b5f-7857-4201-bba7-578f265e7c1c
  text: '"Да? Чем помочь?"'
- guid: d4d8ca52-2544-442b-adf9-47c86a9c771d
  text: '"Посмотри на себя, ничтожество. Чем ты стал. Нам пророчили величие, но ты выбрал утопать в самоутешениях и лжи".'
- guid: d53411ed-5475-4912-b417-846cb3437d0d
  text: '"Куда? Куда бежать?"'
- guid: d56756cd-e720-4525-bfe8-71d59edcfb90
  text: '"Сдохни, ксеносская погань!"'
- guid: d575e88d-406f-4c4a-8535-5a04d88b32a6
  text: '"Да это же Версериан! Получи, сволочь!"'
- guid: d5c38faa-0e6f-4331-a5f9-67ceb0bdf782
  text: '"Говорят, шестеренки крадут на Футфоле людей и потом приносят в жертву на своей станции у звезды. И как Император такое терпит..."'
- guid: d5ddec0f-680f-44e2-812c-2cc88c58044f
  text: '"Берегись! Предатели жаждут прорваться к комнатам охраны!"'
- guid: d5e99d4a-08a9-4c0a-a5cb-679570c30aad
  text: '"Выбери меня, начальник! До смерти благодарен буду!"'
- guid: d61769d1-d946-4170-98ef-cfa96a40a580
  text: '"В таком случае, этих паразитов надо поскорее извести. Я никогда не был в нижних секторах, но, уверен, простое население очень страдает от такого омерзительного соседства".'
- guid: d6351ff9-e57d-4647-80b5-b84c961f71ce
  text: '"Не знаю, кто этот мон-кай, но воспоминания о нем вязнут в твоей душе склизкой грязевой жижей. Давай смоем их, подобно родниковой воде".'
- guid: d6368ca3-5534-4ef7-ae96-d7c85ecbb9c9
  text: '"Заткнись, дубина! Слышишь?.. Валим, кто-то идет!"'
- guid: d650f339-ce15-4ba1-b12b-2fccd780fa93
  text: '"Стойте! Нет! Подождите!"'
- guid: d669b959-59e9-413f-a452-f2f11905d487
  text: '"Рев! Рев! Рвать! Рвать!"'
- guid: d68f2f1e-0980-449b-b94a-e17af251e48e
  text: '"Кажется, после того, как ты попортил{mf||а} ксеносам все веселье, этот мир им стал не нужен".'
- guid: d6972f22-0e74-464b-8255-17deb255cdb9
  text: В утробе недовольно урчат заспанные шестерни, но машинные духи покорно пробуждают экран когитатора.
- guid: d6a6ab70-59db-4c1a-a2a3-db66deb89654
  text: '"Ну же, беги! Кричи! Мы еще недостаточно с тобой поиграли перед завершением пиршества..."'
- guid: d6dce3b4-1e5f-4d8f-96bc-22bbee0b187d
  text: '"Это следы порчи... не гниение и не болезнь... но как..."'
- guid: d6fd4a8a-8f2e-4686-96f9-3213048bc060
  text: '"Растерзаем е{mf|го|е} и поднесем останки культу!"'
- guid: d725879a-2e0d-40fa-9214-0ea101930429
  text: '"Эх, славная здесь была битва! Я бы сейчас тоже с радостью отсек парочку голов грязным ксеносам!"'
- guid: d79da1d2-7e51-4ee7-a1f0-1764d18aa165
  text: '"Кх-кх, это еще не все. Нужно запустить систему вентиляции, скорее!"'
- guid: d79fe6ae-04ce-469c-b65e-55ce5afa27fe
  text: '"Стойте! Когда душа упадет на чашу весов, бренную плоть ожидает лишь два пути... Награда и кара... Суд грядет!"'
- guid: d7a4ca45-51c0-498a-ae48-55b1563b8145
  text: '"Понял вас, господин Келлик".'
- guid: d7c97bd3-da5a-400e-a428-2d45ebf3e027
  text: '"Мы прикрываем тылы, Ваша Светлость. Никому не дадим пройти!"'
- guid: d7d48cff-b116-4fa8-8774-b88b9be4332b
  text: '"Стены твоего дома душат меня, элантах. Я жажду покинуть этот изуродованный мир — при первой возможности".'
- guid: d7e1f329-6539-4056-a8a0-08bed16c3510
  text: '"Да! И он{mf||а} на меня посмотрел{mf||а}! Когда леди Вигдис узнает, она повысит меня до средних палуб!"'
- guid: d803ccc6-2333-42c7-950c-38335c6436e9
  text: '"Приказ проигнорирован нарушителем. Взываю к протоколу аннигиляции!"'
- guid: d815ed83-ef3b-4e54-8cd6-2f1af136ae0f
  text: '"Сколько смотрю, все не могу понять, из чего они сделаны".'
- guid: d822ba31-eaca-4446-bf0b-49bc0f136a26
  text: '"Четыре часа назад в медотсек были направлены 87 служащих разведслужбы — все с одинаковыми повреждениями..."'
- guid: d83ea1fc-ea29-421e-a199-4e4f93e09cb2
  text: '"Я должна вернуться в логово Ревущих. Меня зовет мой долг".'
- guid: d8610ca3-bc14-41fb-9f44-742b89f9d8b9
  text: '"Ты оскорбил{mf||а} культ Губительной жажды, чужа{mf|к|чка}! Ты оскорбил{mf||а} саму арену! Ведьмы желают твоей смерти!"'
- guid: d88ab978-276c-497b-97e7-72e652cce2f0
  text: Тела эльдаров порублены с чрезвычайной жестокостью, судя по характеру ран — неким силовым оружием. От пролитой крови почва под телами стала ржаво-бурого цвета.
- guid: d8b7aede-cd21-4fde-921f-1d6944c611cd
  text: '"Вот так связываться с Владаймом Вакемо. Была Чорда — и нет ее".'
- guid: d8d85965-20f6-47b8-a9ae-4060e4898201
  text: '"Это неправильно! Вы не можете так обращаться с нами! Что вы намерены с нами делать? Мы хотим жить!"'
- guid: d971a551-0912-46e4-bb8f-7fe81a3f20db
  text: '"Что-то не так. Караул, к бою! Доложить на мостик, что у нас подозрительное поведение. Все назад, мутанты проклятые!"'
- guid: d98d6a27-ddde-47b1-bcd5-ab81c24dd900
  text: '"Ты про ту сумасшедшую, которая прямо сюда прорвалась? Не думаю, что такую выходку ей просто спустили".'
- guid: d9952d5e-be4a-4218-9ebc-1f6167783589
  text: '"Мы здесь, чтобы выразить почтение величайше{mf|му|й} из великих!"'
- guid: d9ac1568-7098-4347-b6dd-cd26863cc1d0
  text: '"Пощады! Пощады!"'
- guid: d9cdf688-f040-4e87-a04a-a544d3ad2dba
  text: '"Трон побери! Видели, как та блюстячка поджарилась? Так ей и надо! Хоть пару часов поживем без битья".'
- guid: d9f2d731-6a54-46ad-b523-4b8f17a8a9ce
  text: '"Мы будем удерживать позицию... да поможет нам Император!"'
- guid: da366a60-0885-4ef4-94de-2dbaa10e2318
  text: '"Слава династии... э-э... Лорд-капитана!"'
- guid: da954737-6291-477b-b0fe-69e01bcf9866
  text: '"Терпи! Это же посвящение! В Ревущих нет места соплякам!"'
- guid: daa012a6-68cf-492e-87c2-0d5b8e567b49
  text: '"Храните бдительность. Проверяйте умиротворительный предохранитель трона перед эксплуатацией".'
- guid: dacb1104-c9df-42e8-956c-4053bd728549
  text: '"Да... После того, как блюстители истребили культистов смерти, преступная чернь распоясалась".'
- guid: dacb62a1-b6e6-451d-af2d-a3afa661df9c
  text: '"Да здравствует госпо{mf|дин|жа}... {mf|Принц|Королева}...Звезд?"'
- guid: dadd02df-633c-4e74-8a8b-aac1021e082f
  text: '"Эй, нечестно! Пророку опять достанется самое вкусненькое!"'
- guid: daf7a8ff-90e2-4437-824c-72f4937db2e7
  text: '"Мы прикроем зону высадки, Ваша Светлость! Слава династии фон Валанциус!"'
- guid: db00062f-67ed-4747-9998-8885dbb13d8e
  text: '"Удалось ли вам связаться со своими родичами?"'
- guid: db4b96bd-1a85-4fc9-94a2-c3980a4b09ea
  text: '"Вместо того, чтобы заниматься самолюбованием, мон-кай следует почаще обращать свой взор на окружающий мир".'
- guid: db69a00f-6f08-4eae-8d67-aff7aa70b793
  text: '"Анализ угрозы указывает на несокрушимое превосходство. Прогноз выживания неутешителен".'
- guid: db8b4acd-e6c2-42e3-a86a-3f852e6f5f26
  text: '"Прирезать всех их, всех до единого. Если выбраться можно только по горе трупов — пускай. Вольный Торговец указал{mf||а} мне верный путь!"'
- guid: db9a6500-91f5-4f69-9842-1a24805f0ed2
  text: '"Хейдари, сколько можно громить мой бар?! Вали отсюда и отоспись, о возмещении позже поговорим!"'
- guid: dba0835b-26ae-409f-bf21-b2be376ea110
  text: '"Смотрю, все дружно красные платки поснимали. Перехотелось играть в Немезитов?"'
- guid: dbc08945-c23e-4a08-bd6f-391e288790b9
  text: '"Мы прибыли следом за тобой, Дитя, ведомые Атласом. Встань подле нас! Дом Орселлио не променяет наследие Тисифоны на ложные идеалы слепцов!"'
- guid: dbdfae1b-dbfe-4d81-81b4-16f7aa8af83f
  text: '"Выполнение заданной рабочей процедуры..."'
- guid: dbe15e01-82cd-4330-8e09-5e1884b5a4af
  text: '"Наше времечко теперь. Мы тут власть".'
- guid: dbec2198-8691-41f2-b2bb-676cfd1a22d3
  text: '"Устремляем силы все на борьбу с врагами Его, ибо мученичество есть единственный путь воздаяния за жертву и раны Его..."'
- guid: dbeeb1c1-7c8d-454d-8e24-7c4f1aabed26
  text: '"Идентификация. Вольный Торговец, алое братство приветствует вас".'
- guid: dc09ed47-b567-4bff-b2a4-01716cec3a5e
  text: '"Где же почтенный губернатор Драйвстем? Неужто он прячется от Вольного Торговца?"'
- guid: dc0b8186-c3ab-46a4-9a14-45492bc79de1
  text: '"Ничего. Здесь. Не трогай".'
- guid: dc9f1682-cb3d-4a4c-a0e3-be003e88cb1b
  text: '"Мельта-заряд поможет расчистить дорогу. Наверняка где-то здесь найдется такой..."'
- guid: dcf88c10-3d24-4071-ba76-d02cebfb1995
  text: '"Эй... слыхали? Опять видели! Теперь на средней палубе!"'
- guid: dd202ae4-4ff2-411b-b36a-19c5bdfbda8c
  text: Татуированная мумия с выжженной аквилой на лбу и в странных меховых одеждах покоится в ритуальной позе.
- guid: dd380ddb-6706-45c1-9ea7-46a97ee97341
  text: '"Лорд-капитан здесь! А говорили, что {mf|его|ее} убили в купальне..."'
- guid: dd3a1430-b341-4703-9473-8db97b253909
  text: Кабель, по которому струится энергия проводящего заряда. Один взмах клинка — и душа блюстительницы отправится к Неумирающему.
- guid: dd6accf0-f377-4646-bafc-c4ffef8a6681
  text: '"Ваша Светлость, чем можем услужить?"'
- guid: dd7df929-1915-4be8-adee-03377a394b8f
  text: '"Сомневаюсь, что культ смерти заманивает нас в ловушку, но... Я передал Вигдис наши координаты".'
- guid: dd93fcfe-1c6a-4197-8a28-0eb51918a231
  text: '"Да! Вся моя семья, все... теперь будем осматриваться тут, искать, куда себя пристроить".'
- guid: ddaf7e88-f106-49ae-ae94-e83cb608ac85
  text: '"Говорят, лишь безумцы ничего не боятся. Ерунда! Я уже ничего не боюсь, и разве я похож на безумца?"'
- guid: ddba422d-d769-4a53-a24b-79509230e3a5
  text: '"Вот-вот, даже не взаперти! Интересно, зачем? Может, хочет сдать на вивисекцию Механикус? Или на Футфоле продать?"'
- guid: ddd6323c-02c9-4099-b383-501b8353633c
  text: '"Приступаю к исполнению Протокола 1-04-01. Активировать двигательный аугмент..."'
- guid: ddeb61cd-2d2a-49e6-b4e1-b3413ce91fec
  text: '"Курьерская служба Зандера Сонатуса! Вам доставлен... щелбан!"'
- guid: ddf6d680-8493-4193-92a0-bcf5e60e9c57
  text: '"Заповедь Адептуса Фердинанда IX Толкователя 56, 18 гласит: "Подчиняйся закону буквенному, ибо он есть воля Бога-Императора".'
- guid: de025b85-d0b7-4f52-9f87-37f0fd87904b
  text: '"Смерть прошептала его имя!"'
- guid: de033790-1ba9-43f9-ab9b-4daeea32a562
  text: '"Ткач Кровавой паутины пришел сегодня на служение! Думал, убьет кого, а он только вознес тихую молитву и удалился. До сих пор мурашки по коже".'
- guid: de299446-8bef-4ada-935b-7c0d717d1db6
  text: '"Правильно говорят — о тех, кто в этом секторе оказался, Он позабыл..."'
- guid: deedd894-9560-4049-9465-200c98a59730
  text: '"Да в ту самую ночь и видел. Как вышел за периметр, так и сгинул. Небось напоролся на какую-нибудь дрянь в темноте".'
- guid: df477cc2-1e12-4222-a466-75152ae89f7b
  text: '"Джай Хейдари! Фалько передает привет!"'
- guid: df4ab34a-42b6-47e7-8652-4d2894d1228a
  text: '"Его спутники: Леди-навигатор Гликерия Орселлио. Навигатор Лесо-Кимон Орселлио и его суженая Леди-навигатор Олександрина Орселлио. Леди-навигатор Элина-Хаттерия Орселлио. Навигатор Данакс Орселлио".'
- guid: dfc21757-85e8-46a6-aaef-7594e766a11e
  text: '"Ох, не ровен час, ересь колдовская среди экипажа завелась..."'
- guid: dfe3a092-ba85-47f4-8457-be854c8ff7ea
  text: '"Никак эти гады пайки тайком урезали? Готов поспорить, что на обед раньше давали больше похлебки..."'
- guid: e0157c72-2845-4534-80c6-06a2055c4381
  text: '"Оттенки багрового и алого... сколь явное желание убивать! Куда ведет этот след?"'
- guid: e0191c37-e73e-4c5a-9875-abaefef494f5
  text: '"Говорят, эти фанатики и порядочных людей убивают. Мол, Императору это угодно..."'
- guid: e01d3a59-e0f7-44a6-a019-6377d2cae436
  text: '"Не подвергни сомнению веру и власть, ибо сомнения порождают ересь".'
- guid: e01fd68b-7ea0-4032-a01c-cccdd7fb6755
  text: '"Хорошо, что Кровавая паутина перестала убивать. Надоело оттирать кровь с молелен".'
- guid: e0425182-9f32-45b6-819f-2baf3abc117f
  text: '"От этих никакого толку, господин. Прикажете казнить?"'
- guid: e06b8b62-cb86-4405-896b-39c7491d503a
  text: '"Мон-кай свойственно желание близости с себе подобными. Но это же желание порождает немало сомнений".'
- guid: e09864e9-ffa9-44c4-afcf-4adf7c3ca67e
  text: '"Слышал, в восточной части дворца достроили еще десяток уровней. Когда я встал в очередь, еще даже чертежи не утвердили..."'
- guid: e09c69ef-990c-473a-8785-0d2e00598495
  text: '"Боевой арсенал перемещен в командный центр. В полном объеме. Без повреждений".'
- guid: e0b0a532-4399-46ca-a8cc-4e6d2f4a6e8d
  text: '"Это он{mf||а}? Т{mf|от|а}, что прикончил{mf||а} Кровавых прозелитов?"'
- guid: e0b353fc-6283-4e5a-bdc6-54bcf9f56575
  text: '"Во имя Трона, одумайтесь!"'
- guid: e0dcea62-25d4-44a0-92f3-69f73c0d665f
  text: '"Мастер Вайс набожный человек, тебе стоило бы брать с него пример".'
- guid: e1016871-42a2-4eb5-9f2a-7acd02377de0
  text: '"Да охранит вас Бог-Император от всяческих бед, как вы охранили Футфол от голодной смерти!"'
- guid: e1308dca-40f6-4662-a4dd-80ac232ab639
  text: 01000101 01111000 01100001 01101100 01110100 00100001
- guid: e1335a68-ad61-425f-b106-b526ebe36a31
  text: '"Выпотрошите чужаков! Смешайте их кровь с маслом!"'
- guid: e15e2fb5-38f1-4283-82c5-5f87e7fa63b3
  text: '"Я готов... познать... тлен... А-а-а!"'
- guid: e15e86a8-1b6c-4a79-aef2-80bdc9024ba4
  text: '"Опять имплант барахлит. Может, масла священного плеснуть? Уж с этим я справлюсь и без надзора технопровидца".'
- guid: e161cbf0-1b49-4140-9fb5-a0f1a7bfbe4c
  text: '"Да поможет мне Бог-Император..."'
- guid: e16612f5-de9e-4b06-b8b9-f4335f1461d8
  text: '"Хрост, дружище, ну разве это изоляция? Если ты нас угробишь, Матиас меня с того света достанет. Переделай, я проверю".'
- guid: e17d95ea-c360-4b8e-b7dc-02ff1136d1b4
  text: '"Что тебе нужно, мон-кай?"'
- guid: e1915082-64d3-4723-a4f9-1f25a9e8c86c
  text: '"Вновь плен? Нет! Ваша ловушка будет уничтожена!"'
- guid: e1b25a99-b11a-4bd4-a8f5-bec5e07e2c58
  text: '"Какой банальный исход. Но гипотеза была смелой и оправдала трату небольшого объема подопытного материала".'
- guid: e26e41c7-4679-4fd7-9f09-3b00cdc06684
  text: '"Прикрой меня!"'
- guid: e2777559-6bfe-449e-8d2b-0b4f5f612006
  text: '"За Бога-Императора и династию фон Валанциус! Искупление для одного!"'
- guid: e2b60fdc-56ec-4279-8b4a-d30f26580117
  text: '"От анверов просто житья не стало..."'
- guid: e2bc82b3-0031-4bcf-a08e-9b20c7025386
  text: '"Пока во главе нашего рода стоит Махарий, нам не о чем беспокоиться".'
- guid: e3b05433-0281-4502-b03b-68b84a255699
  text: '"Служу Лорд-капитану!"'
- guid: e3c61152-d89a-44b6-a10c-b2e0ac000f4f
  text: '"По пути сюда я слышал странные шорохи. Надеюсь, Кошмары не идут по нашему следу".'
- guid: e3d616d9-0488-407c-8182-2f6d88ece00b
  text: '"Ууу... Мурашки по коже от этих жутких фигур. Эй, вы слышите? Они еще и разговаривают! Они... оно... Ай, эта штука живая! Прочь, прочь из моей головы!"'
- guid: e3dc44de-e061-419c-8261-b6a3891ad741
  text: '"Смотрите, там есть спуск к воде! Быть может, прервемся на мгновение и сходим посмотреть?"'
- guid: e3e7b18c-2777-4e5f-a899-36bab10acbc7
  text: Холодный пол под вашими коленями, возня служек в отдалении и — больше ничего. Скука быстро одолевает вас.
- guid: e4023e87-f4b8-486a-a673-a5a535e9daff
  text: '"Клыки Простора, цепные псы войны, приветствуют Вольного Торговца!"'
- guid: e4076a91-c7d9-46d6-b29c-aac28ed96821
  text: '"Лорд-инквизитор! Продвижение идет согласно плану, наши солдаты уже у цели".'
- guid: e41e036f-fdf6-4b8a-9286-6ede45f190e7
  text: '"Пять поколений ткачей охраняли сию реликвию, чтобы она послужила достойнейшему из Домини. Время пришло".'
- guid: e4222a55-5cc8-494d-8f3d-9a61ee5748a1
  text: '"Проклятье! Больно! Позовите медика, я чувствую себя... странно. И дурно!"'
- guid: e43c2d89-3acc-4d30-812e-9e03c369ee44
  text: '"О, господин, не стоит так кричать — вы же не хотите, чтобы о ваших пристрастиях узнал весь дворец, не так ли?"'
- guid: e456a034-052b-4056-a182-5eaa5a4d0b21
  text: '"Славься, Бог-Император!"'
- guid: e4694ec6-bdf9-46be-bb3a-d4e0b06724bb
  text: '"Стой, мон-кай! Протяни руку помощи, и я укажу тебе путь домой".'
- guid: e49fb20c-5164-4fb5-bae4-f8e519b13405
  text: '"Ха, Погонщица мертва. Я-то думал, на ее месте будем мы. Ваша Светлость, мы вернемся в лагерь и доложим полковнику".'
- guid: e4a20d59-e4f8-4822-8de7-b99e213c63ea
  text: '"Посягнувший на подател{mf|я|ьницу} жизни не услышит сигнал следующей вахты".'
- guid: e4a48733-6407-45b0-9d84-8abbcf07b54d
  text: Тварь издает низкий гул, перемежающийся странным механическим визгом.
- guid: e4c543f5-b70b-49fe-a1ba-baabc830788d
  text: '"Руки немеют... Может сегодня хотя бы четвертинка пайка перепадет? Ха! Держи карман шире..."'
- guid: e4f91d13-ee01-499e-b2b9-50e0a0387d5a
  text: '"Ибо ищете вы его снаружи, а обратить взор вам нужно во внутренность свою. Узрите скверну, окутавшую ваши души!"'
- guid: e5560a0d-15f9-40f8-a232-06cbf318ea3b
  text: '"[Подтверждение] // [Удивление] // [Восхваление Омниссии]".'
- guid: e5915e27-fcba-419f-b354-9025e85a7a04
  text: '"Хм... чутье подсказывает мне, что затевается заварушка... уж не в логове ли Ревущих?"'
- guid: e5a0edd7-2dd1-4769-942b-1eb23d4b873d
  text: '"Взгляните на себя, ютящихся в притоне сем, аки затравленные звери! Напрасно уповаете вы на спасение!"'
- guid: e5a5a9a3-4e9c-49ab-9ece-834b519859e2
  text: '"Разорвите их на части! Во имя Его!"'
- guid: e5e34d8d-5f54-4203-8143-07153a60058f
  text: Свежая кровь пропитывает бесценные шелковые покрывала, уродливым пятном расползаясь под трупом... Вашим трупом.
- guid: e5f4e2ca-00df-427a-af79-8c8824382e1b
  text: '"Благие вести сообщили мне духи вокса. В систему был доставлен Чудотворный Реактор Синтеза, священный артефакт, сопровождаемый свитой электрожрецов".'
- guid: e5fb9097-84ab-4424-84c2-ad84d0195fbe
  text: '"Думаете, Злоба побоится ступить на арену? Когда-то я царил на ней!"'
- guid: e622a455-eed6-457a-8cbc-c229fa4f3642
  text: '"Эти мрази с дубинками совсем озверели. Слышали, они снова сожгли двадцать наших вместе с хибарами!"'
- guid: e6443344-61b1-41e8-b79a-5c84dc5d0f36
  text: '"Буду ждать от вас нового вокс-сообщения, молодой господин".'
- guid: e665ce79-bce7-4006-9b34-1528069e783f
  text: '"Что это еще за спешка? И куда это — в логово Ревущих?"'
- guid: e6956ef3-bf04-4e97-b268-c1fe5fa1428d
  text: '"Прочь, отступники!"'
- guid: e6b6447d-5958-42cf-996c-e55b1be6a6ba
  text: '"Внимайте, дабы не свершить грех производственной аварии! Прежде чем длань на рычаг наложить, надлежит восхвалить Омниссию трижды. Рычаг давить надобно уверенно и равномерно, ибо дух машины расторопности не терпит..."'
- guid: e6e0b627-fa14-42c0-83b6-681956adb247
  text: '"Хотя, если что, тут куча мест, где можно спрятаться получше и пересидеть, пока пронесет..."'
- guid: e6ea724b-5076-4151-acda-3a4587bd3302
  text: '"Господин, потеряна связь с трюмными секциями номер двести тридцать восемь и двести тридцать девять! Мятеж распространяется!"'
- guid: e6f2b3ad-c369-47ad-9cfc-2dfb1cab13ab
  text: '"А-хаха-хахаха!"'
- guid: e7057152-4bb1-42d6-b5f0-86083aa92621
  text: Сверкнув блестящим боком, монетка с бульком падает в прозрачную воду и опускается на дно.
- guid: e79d9017-57de-4887-8aeb-7ba52053c223
  text: '"Хотелось бы, конечно, когда-нибудь глянуть на то место, откуда поставки везут... ну да пустое это. Тут мое место".'
- guid: e7f83cc5-4cff-4bc0-bb09-5449c767ea86
  text: 'Стоит вам коснуться обелиска, как сознание наполняется древними ксеносскими символами: "Открыть карманное хранилище?"'
- guid: e817be01-84b7-4c16-b373-c9e10bb48aa4
  text: '"Двигатели разнесли — теперь он от нас никуда не денется!"'
- guid: e836b6cb-399d-46e6-a921-e114f8aae9b8
  text: '"Нет, ну вы слышали? Заверитель не принимает просителей без подписанного талона! Слава Великому, я успела заполучить такой в соседней очереди!"'
- guid: e886ccb9-2d53-4dd0-8f87-07f572360710
  text: '"Нет! Не бейте! Погодите, а вы не из этих..."'
- guid: e8a77fe7-02a7-4bb0-b210-6a38f2283ab5
  text: '"Гкх! Пощады! Пощад-ы-ы-ы..."'
- guid: e8bad4b7-f2c6-4d28-beb4-553fb89dbce1
  text: '"Я и половины его речей не понимаю, но слышу, что он святых отцов изуверами зовет. Почему его еще блюстители не повязали?"'
- guid: e8c320e6-eb9c-4caa-8bcd-d074de2314e6
  text: '"Ваша Светлость, назад, назад! Ублюдки захвати..."'
- guid: e8d5d03b-1094-439d-b25b-c8c0836abe0e
  text: '"Новое сообщение от господина Скаландра, Лорд-капитан. Помощники Ахиллеаса сообщили, что предводитель возглавит атаку на райский мир Грантис".'
- guid: e8f180ba-1ab8-4b66-9cd1-caab61289873
  text: '"Может быть... они здесь не для того, чтобы вредить нам? Насколько я знаю, агрокомплексы работают, поставки отправляются. Жизнь... словно идет как шла до этого".'
- guid: e8faa03a-b894-40bc-a6cc-05b31c37ca5d
  text: '"Тревога! Кощунственное нарушение алгоритма".'
- guid: e9778164-df89-4b24-95e0-548922cb96dc
  text: '"Эмпирическим путем было определено, что данная сущность — ложная. Прогноз повторного контакта — негативный".'
- guid: e977b7a7-9e54-466b-99f7-fd83018b321f
  text: '"...Ведают звезды, что даровано им будет угаснуть. Ведают миры, что даровано им будет стать прахом с приходом нашим".'
- guid: e9787a8c-048e-4e05-99d4-1e593a710d61
  text: '"Что ты здесь делаешь?! Ты должен прибирать в голубых покоях!"'
- guid: e9c6bfa6-6015-4998-a976-634cb7a3a346
  text: '"Подданные Империума, приготовьте документы — от имени Адептус Арбитес я инициирую проверку и обыск".'
- guid: e9c7dd77-9077-4ad8-931e-d96998f2224d
  text: '"Как смеешь ты тревожить покой машин! Святотат{mf|ец|ица}!"'
- guid: e9d166f0-afca-4f4f-859d-d5bcfc077a52
  text: '"Я могу поклясться, что видела однажды такую зверушку, когда пролетала над нижними секторами столицы. Должно быть, эти ксеносы водились здесь еще до людей и не были до конца истреблены".'
- guid: e9d1cdf5-efe2-4122-af26-257429c1f0f9
  text: '"Я не промахнусь. Паразит выпьет каждый миг агонии этого ничтожества, гибнущего в огне".'
- guid: e9ee73a2-e55b-4b74-935f-b2a7cf9fdec2
  text: '"Тсссс! Тише! Не вздумай болтать об этом вот так, да еще и здесь!"'
- guid: e9f8217d-3e42-428e-8d48-04c882001adf
  text: '"Мое почтение, Ваша Светлость!"'
- guid: ea015134-2e6f-4e80-8034-0410bc469281
  text: '"Они же обычно не используют эти инструменты? Ну и ну..."'
- guid: ea100307-5df0-4535-9046-37b006142beb
  text: '"Как же вы все меня утомили... Сдохни уже! Неужели так сложно?!"'
- guid: ea363ee8-24b7-41f7-830d-4b13ee9e5485
  text: '"Почему меня отправили морозить зад в самую холодную часть улья?"'
- guid: ea7f83d9-1f2c-492b-8b6a-07878e909735
  text: '"Уходи. Дай мне побыть с ним наедине..."'
- guid: ea9376c2-7143-42a4-9e37-944e8cd0fea1
  text: '"Смотрите, кто это! Ваше Сиятельство, мы у вас в неоплатном долгу!"'
- guid: eafcc50b-8dec-4d7c-bf27-810c89c551cf
  text: '"Голоса ангелов да не умолкнут в моих снах, да сделаю я желания их явью!"'
- guid: eb159320-2963-4ced-b9f9-dfed309cbd49
  text: '"Ложный след. Твари морочат нас — надо искать в другом месте, Вольный Торговец".'
- guid: eb47c374-6cdb-4ce3-a0e6-bd1b81353fda
  text: '"Слушайте, слушайте... вы видели... ее? Ксеноса?"'
- guid: eb56d47e-e3c8-4276-9329-74964a949e57
  text: '"Витражи, трон, прислуга... Да уж, по сравнению с Ямой у вас тут настоящий дворец! Хотя, признаться, я уже почти скучаю по ее незамысловатой, но уютной убогости. Почти".'
- guid: eb5ea659-0b35-4b01-912a-63140aa1107d
  text: '"Запрос отклонен. Таинство облачения приостановлено на время визита привилегированной единицы".'
- guid: eb631287-826f-471a-bc7d-0d4bbee17547
  text: '"Отступите, хранитель. Вы проиграли сей бой. Опять".'
- guid: eb66778f-668f-427f-bc81-7ad902f9e7b5
  text: '"Твой жалкий бог, мон-кай, здесь не поможет!"'
- guid: eb885dab-ce5b-4a92-84d1-d8946f79471c
  text: '"Вы слышите это? Этот... крик?"'
- guid: eb8db845-c054-487b-aac8-c45be911b05c
  text: '"Кей-морагх!"'
- guid: eb8eeaa1-29e8-4643-a07c-f5f5d35e36ec
  text: '"Все время кажется, что кто-то наблюдает за мной. Думаешь, это..."'
- guid: eb8f20ca-24d0-444e-a319-b576479e367c
  text: '"П-приветствуем, ваши милости!"'
- guid: eba96c56-912e-4a84-84a7-3f099c6ac2b9
  text: '"За Четвертый Складочный!"'
- guid: ebb817d6-f470-43d0-93f6-de55bd73de06
  text: '"Каждому блюстителю выдан комплект стимуляторов. Никто не посмеет спать, пока виновник не найден".'
- guid: ebc22c27-d86b-4949-aa1e-8a1046c22611
  text: '"Вот бы взглянуть на звездные чудеса... Хоть одним глазком!"'
- guid: ebda47cf-982f-4d33-a1ba-fb9917fe9949
  text: '"Стой, идиот! В смысле, стойте, почтенный...!"'
- guid: ebdc317f-0840-482b-b7d7-7dc490596a5a
  text: '"Звездная гавань, вызывает шаттл династии фон Валанциус. Подготовьте посадочную площадку и церемониальный эскорт".'
- guid: ec095a8e-f9c3-4ef8-8935-7748c124ee8a
  text: '"Опыт четыре тысячи триста... триста одиннадцать?.. Нет... Семнадцать?.. Что это за опыт?"'
- guid: ec0ac2b7-06f8-4365-97b0-cdd2d98b7280
  text: '"Во славу рода фон Валанциус! К победе!"'
- guid: ec33567d-46a1-4cc2-8e0f-d1390333c7f0
  text: '"Владайм сказал — сделать, чтоб тебя тут больше не было. Мы сделаем".'
- guid: ec4e9de2-3320-4c25-8e83-3933629f0913
  text: '"Чего ты радуешься? Все только хуже стало! Теперь бьют больнее и чаще".'
- guid: ec760051-fa21-42b3-aac4-2a4a5cc53b98
  text: '"Йеремия с первой смены недавно почил. Предохранитель на троне не сработал и он, обезумев, себе зенки инструментом выколол".'
- guid: ec7c3a9c-0264-40c0-ae6a-29bfedb83cf8
  text: '"Ничего ты не с-снаеш-шь, ас-сурьяни. Твои с-собратья с-слабы. Пус-сть мы и отс-ступили, в той битве они проиграли".'
- guid: ecadc040-d1a5-45a4-8bdf-b9f9758bc5cd
  text: '[DRAFT] Этот лаз уничтожен и мутанты больше отсюда не вылезут.'
- guid: ecb9330d-7bd2-4016-bf02-9a74813b11d1
  text: '"Зубы сомкнулись... Не будет пощады! Не будет пощады..."'
- guid: ecc5b354-342e-4e7d-bad8-3fed5b234d9d
  text: '"Голоса... столько голосов..."'
- guid: ece487e8-5e41-4297-a379-b5fe1ed2c5c4
  text: '"От фигур исходит довольно сильная пси-активность, я бы не советовал их трогать. Кто знает, что за ловушку мог оставить здесь такой безумец, как друкарский гемункул".'
- guid: ecf32552-cf0e-4e3e-9f87-29440821aa57
  text: '"Я просто слуга, господин... Я верный подданный Императора — служу лишь ему и нашему славному Вольному Торговцу!"'
- guid: ed09196b-847a-480b-93a0-24bb56b276a9
  text: '"Служим династии! Слава Вольному Торговцу!"'
- guid: ed17ee10-ecd9-4b36-b6cf-78d267dcd9b8
  text: '"Я здесь, рядом. Скажи лишь слово, и я облекусь гневом Его против врагов наших!"'
- guid: ed2383dd-2fe3-4bff-bbb3-20065764ffe4
  text: '"Что ж ты делаешь, бездушная тварина... Ой! Это я сервитору, не вам, Ваша Светлость!"'
- guid: ed407ecf-fd03-472a-86bb-a8913f076b90
  text: '"Еретики заслуживают разоблачения и смерти. Даже среди нас".'
- guid: ed735b04-826b-4590-ae67-1f6ae13a90a5
  text: '"Вольный Торговец запретил{mf||а} ткачам Кровавой паутины убивать... Вот чернь страх и потеряла".'
- guid: ed896270-628c-4376-b91f-b0d04d8d778c
  text: Жди. Наблюдай. Готовься. Она видит тебя. Момент еще не настал.
- guid: ed8ff903-c27e-4317-8fff-f99000d92259
  text: '"Бегите! Сервиторы взбесились!"'
- guid: ed9bd6ca-d02b-4a46-938f-c5f5556e6e2c
  text: '"Тише ты! Последних зубов не жаль? Давно прирезали бы да хрен прирежешь. Сволочь-то не простая — арбитровская".'
- guid: eda5d7da-4a81-4dd7-bee0-f31e442ece6a
  text: '"Трибунал ожидает ваших объяснений. Подойдите ближе".'
- guid: edb21bea-8b90-48a1-ad82-a60dbd858f05
  text: '"Но как? Все наше время и все наши мысли должны же быть направлены на служение Истине Изначальной и сотворение ее детей-машин".'
- guid: edb6a74b-4d2b-4c1a-9a6a-5f69cf117e56
  text: '"Кажется, я оглох от грохота..."'
- guid: edce90e4-f316-4d05-98aa-4a1f480d3e7f
  text: '"Дом Грантис никогда не внушал уважения или доверия. Не сомневаюсь, это они притащили в поместье слуг-предателей!"'
- guid: edd70686-cfac-446e-b2a3-ce53b65a9cee
  text: '"Успокойся, штопарь знает, что делает. Ты ведь знаешь, штопарь?"'
- guid: edf09a97-53cc-4a52-8984-bca1f32f848e
  text: '"Гален? Да, я видел его мельком — он был так напряжен, почти искрился. Кажется, он шел в сторону входной залы, там, где алтари. Думаете, Гален что-то знает о преступлениях Версерианов?"'
- guid: ee2292a4-be42-4cdd-a902-9d4bcd122fa2
  text: '"Далекие предки этого слуги возвели сие чудо, дабы племена могли поклоняться Богу-орлу, приносить Ему дары и говорить с Ним. Здесь этот слуга слушает и слышит. И несет волю Его своему племени".'
- guid: ee29fa18-8532-43de-90b3-8a592c79fa7d
  text: '"Как я могу услужить вам?"'
- guid: ee43ab64-23db-4622-8bad-cc479c49f8f3
  text: '"Мы верно служим истинному наследнику Теодоры фон Валанциус, нашему Вольному Торговцу..."'
- guid: ee5345f7-fa4b-4220-b8d5-057a99267d3a
  text: '"Никто не остановит будущее! Солнце погаснет! Пророчество Зари воплотится!"'
- guid: ee5ac323-bd39-43af-953d-c306f77c4779
  text: '"Пришло время отплатить предателям Дома. Идемте".'
- guid: ee8b0525-ca99-47b2-83a8-9ef90df7c373
  text: '"О, Владыка Галактики, храни свою паству от чужаков! О, Охранитель Света, направь луч, что покажет тропу на нашем темном пути! Мы Твои воины и слуги Твои, что избавлены от слепоты сердца

    И облачаемся в цепи ненависти, презрения и злобы..."'
- guid: eeb820c8-206f-4966-9c55-c579039f8eb0
  text: Подъемники, развозящие людей по палубам, двигаются с громким скрежетом.
- guid: eedb7115-4c72-43f0-ad80-3002266f7691
  text: '"Раз сам не покушался, так виновен в укрывании, поди! Все вы, серфы, о мятеже помышляете!"'
- guid: ef22c6c2-38a1-4a7a-b71c-d3c438fea7d4
  text: '"Не придет. А придет — убьем ее во имя Императора!"'
- guid: ef39d630-1226-4ab1-bb57-04e7d6a71290
  text: 'Вокс в наручниках с треском оживает: "Повинен пред ликом Императора".'
- guid: ef55f0ee-d597-464f-8d87-882598f38a65
  text: '"Арбитес? Почему они здесь?"'
- guid: ef7dfe3e-a9d3-4744-b071-9b7e2d92f151
  text: '"Говорят, в теневых костры недавно пылали... целыми семьями жгли..."'
- guid: ef7e2aa2-ec4a-421e-9684-049c0808d269
  text: '"Неблагодарное отребье. Мы охраняем их, а пляшут на наших костях! Я запомнила это лицо. И еще вернусь".'
- guid: ef96b3be-2653-401e-9642-502b6f753dc5
  text: Вы произносите молитву — ту, которую лучше всего помните.
- guid: ef9e7261-c3d2-4cc6-a2b2-33cf656a9d94
  text: '"Только что говорил с пустотником с корабля, который прибыл последним... он говорит, что был на мостике, когда Лорд-капитан отдал{mf||а} приказ уничтожить целую планету!"'
- guid: efc221f5-90c0-4061-a5c1-2217c1d50882
  text: '"Справка ТЕ-231... форма РП-1208 с печатью ИЛ-1а... выписка из реестра А-856... Чего-то точно не хватает".'
- guid: efe46ddb-7346-49e5-9696-59aa6be306e6
  text: '"Что? Снова? Ручки и поручни в голубых покоях надраиваются пять раз в день! Почему не отправить сервитора?"'
- guid: efe73c9e-cec6-425e-ae80-254ebcad06df
  text: '"Приветствую, о обольстительная Ризза! Не хочешь ли отправить очередное анонимное пожертвование его святейшеству?"'
- guid: eff1f78d-37fe-41c0-b5a1-6551148ec12a
  text: '"Урбенд не осмелился бы на подобную дерзость. Он удалился во двор подышать свежим воздухом вместе с Лорд-инквизитором".'
- guid: effb7094-1188-4c5a-9880-609f0e0b8c54
  text: '"Мое ложе вскоре займет другой ткач... Прискорбно. Я буду тосковать по беседам с моими неживыми сестрами и братьями".'
- guid: f0670ae8-6dab-4cd3-95ce-49018ad453a5
  text: '"Почему так странно внутри? А-а-а! Буду убивать!"'
- guid: f0a173aa-8eb9-4406-ae90-f908b2ef1097
  text: '"Псст... посмотри, только аккуратно... это Вольный Торговец!"'
- guid: f0ea82d0-1520-4d19-b705-4b1abdc585d6
  text: '"Не спеши. Мы потрапезничаем твоей болью, когда закончим с предыдущим гостем".'
- guid: f1037909-dad1-4245-acd1-8a60a58e1961
  text: '"Я тоже! Так громко! Пожалуйста, прекратите эту пытку! Зачем вы нас мучаете?!"'
- guid: f133af81-4dc6-4510-b9c1-ce378f0a9b06
  text: '"Не засыпай! Повторяй за мной: "Император защищает!"'
- guid: f17ba4df-811d-4571-927d-cf1a70d6e34c
  text: '"Ведите нас в бой, командир!"'
- guid: f180e03e-4770-4147-b8bf-f117ad4af073
  text: '"Ар-р-гх!"'
- guid: f1a1a616-4e99-4013-9867-d733957d3694
  text: '"Вольный Торговец может проиграть планету, но что-то не слыхал я, чтоб Чорда или там Валанциус такое выкидывали..."'
- guid: f1a4e536-fd54-453a-86e6-17b7f7e10f20
  text: Командный трон еще не готов к литании энергетических установок.
- guid: f1d045bc-617e-4dbb-860c-5a2520b2dcfe
  text: Техножрец почтительно, но коротко кивает вам, издавая едва слышный бинарный напев.
- guid: f1e38488-89a4-48c0-bb51-0a073f4fc6ff
  text: '"Заступни{mf|к|ца} Даргонуса! Благослови Император вас и ваш протекторат!"'
- guid: f25d30ea-fcc9-4d0c-a060-e1552b86e9fb
  text: '"Бедняга... Даже сквозь века я чувствую поглотившее его отчаяние..."'
- guid: f2a18cb7-4fcf-49de-9c62-8953660a7b57
  text: '"Блюстительница сама подохла или... ей кто-то помог? А, без разницы. Лишь бы труп поскорее забрали. Прошлый раз от смрада блевать хотелось всю смену".'
- guid: f2a1abaa-2e2d-4e45-a3f9-d9b9052860ec
  text: '"Я предпочитаю боле выдержанные напитки. С терпкими нотами горечи по угасающей жизни".'
- guid: f2b8653a-a86e-4763-a0a4-d5e9cb5e56da
  text: '"Прочь, ксеносы! Живым вы меня не возьмете!"'
- guid: f2d81e4b-f01e-405e-9e66-a9eacb30e800
  text: '"Кому-то знатно промыли мозги. Может, свалим отсюда, пока сами не начали восхвалять новых владык?"'
- guid: f2e28691-0d2c-4ef5-bed6-bedd906cda8f
  text: '"Вроде и голод прошел, а лучше не стало... морок какой-то на станцию напал. В страшное время живем..."'
- guid: f348aa07-4016-43ec-adaa-08fc2a9debcc
  text: '"Лишь в сиянии Его способен человек обрести силу противостоять ужасам, взрашенным светом неведомых звезд. Лишь в воле Его способен узреть смысл своего бытия".'
- guid: f361020f-b1ac-4d0a-b68d-df7aa8ee0568
  text: '"Кхе... ну и запашок..."'
- guid: f3c0ec20-d7d6-4f8f-bdad-a292134fa976
  text: '"Да уж видел... Видел, как они одному из наших щитом челюсть свернули. Замешкался дорогу им освободить".'
- guid: f3d367d8-6329-4bd8-a9f5-63816802b493
  text: '"Виг, да ты просто счастливчик! Ушел на смерть, а вернулся с подмогой! Старейшины тебя точно вознаградят".'
- guid: f3d5dac7-10d9-4dae-adc7-b43171b7f228
  text: 'Серийный номер на контейнере: FVDA1-16165'
- guid: f3df96cc-1b5f-4361-85ca-43bd9eecef0f
  text: '"Все будет внесено в протокол — за любым словом может таиться ложь или истина".'
- guid: f42c7e79-c1e7-4acb-ac38-fb735a3e660b
  text: '"Ваша Светлость! Простите за шум, мы уже удаляемся!"'
- guid: f4858299-d715-4220-8891-6f21206451be
  text: '"Барьер еле держится, приготовиться к обороне!"'
- guid: f4897c8f-c241-4bb3-952c-5320799ba5d9
  text: '"Бренная плоть... слаба, но вера моя — несокрушима. Я — вершащая длань Его! Я... кара!"'
- guid: f49d5160-58f0-47c9-84b6-9bd38c474e37
  text: '"Устраните его, немедленно!"'
- guid: f4aadefa-adbd-4761-ad02-5d562a6e4b5a
  text: '"Вот так, вниз, аккуратнее..."'
- guid: f4c5da20-a67d-4166-a5c4-75e33047ece6
  text: С террасы слышны легкие шаги ксеносов и исполненные предвкушения голоса.
- guid: f4d6cbcf-4198-424c-9eac-ed54d28276e8
  text: '"Что? Молодой господин, я не понимаю, о чем вы".'
- guid: f54cf039-8bf6-4759-a489-9bad3b2d4145
  text: '"Ишь кто пожаловал! Все из-за него! Все!"'
- guid: f57545c7-47ed-4df5-94ac-c41cf8a90d5a
  text: '"Служу Вольному Торговцу!"'
- guid: f5775061-0ac6-4acb-869e-aac85cdf1973
  text: '"Я немедленно начну подготовку к ритуалу, Ваша Светлость".'
- guid: f577a986-061d-4f99-935e-042303b82e2d
  text: '"...умерщви мои страсти, очисти от скверны, сокруши пороки, ибо Тебя славлю, о Император!"'
- guid: f585d388-2d45-4685-9c07-1340151a496c
  text: '"Отродье варпа! Уничтожим это исчадие!"'
- guid: f5f1ad41-72c8-4153-afc5-940d74d95ec6
  text: Лифт застрял между платформами. Где-то в отсеке должны быть механизмы, которые смогут напитать духа машины энергией.
- guid: f617952c-f8f9-4574-84a6-930a362d9fd9
  text: '"Так вот как выглядит хозя{mf|ин|йка} Януса. Ха!"'
- guid: f625bc00-ace8-41c0-8606-ff1936156294
  text: '"Проклятье! Опоздали!"'
- guid: f6a33889-13fd-45c8-a840-7bdfb39b0f9c
  text: '"Как больно... Больно в груди!"'
- guid: f6ccfdc1-e080-4737-9710-b107f188b5b0
  text: '"Почтеннейш{mf|ий|ая}, клянусь, мои ребятки тебе что угодно из варпа достанут! Всего-то и надо, что разок отключить поле Геллера при следующем перелете!"'
- guid: f6f1b50b-9cfd-4613-b673-a6c1f8649042
  text: '"Страх оказаться использованн{mf|ым|ой}... Все мы его испытываем. Но чем больше мы можем предложить — тем он сильнее".'
- guid: f74a642d-9953-41c8-933b-1bf09160608e
  text: '"Еще раз посмеешь мне перечить — я исполню твое пожелание, и уборкой ты будешь заниматься уже в виде безмозглого чучела на аккумуляторе!"'
- guid: f74be827-3543-48a0-93fc-a213e291d332
  text: '"Молитвы тебе не помогут, служитель проклятых".'
- guid: f77143e1-792f-4bac-9d4c-35f143fb72ee
  text: '"Подтверждаю. Авгуры засекли активный геотермальный источник питания".'
- guid: f788846c-ff5b-4360-ae9d-e9a82c4452c5
  text: '"В-вы же не за мной пришли, да? Я ничего дурного не делал".'
- guid: f78df4a4-33cc-4c0e-a2de-c94781a854d8
  text: 'На костяной табличке под древней реликвией изящной вязью вырезана надпись: "Если жизнь тебе дороже долга, ее ты не стоишь. Висирь Джеофранус".'
- guid: f78e64b3-350d-4136-aa52-084b3eeec869
  text: '"Эта единица испытывает недоумение. Протокол ошибочен, рекомендовано немедлен..."'
- guid: f793e915-dbee-4bb2-abe0-4fd18b0fa98c
  text: '"Ничего не помню... Трон, помилуй, у меня шок!.. Нужно непременно передохнуть..."'
- guid: f796025f-7bf4-435f-acd1-178b9606fbe4
  text: '"Его цвета пылали столь неистовым алым... Слава Императору, они не опалили наши души!"'
- guid: f7a99a0c-c76e-4dd6-b238-fc7d34f13f47
  text: '"Ты глянь... пришлые... что вы тут забыли? Футфол — наш! Анверы — сила!"'
- guid: f7e5dc82-cc8d-496b-a19b-7a9ce3b18eb4
  text: Верхний проспект расположился на широком мосту, нависающем над бурными водами реки. Мост густо застроен массивными, вычурными зданиями — прихоть власть имущих, не иначе.
- guid: f7fbcbb2-ea45-4382-abb8-4a62877ae8cf
  text: '"Боль обращается ко мне. Она хочет, чтобы ее чувствовали".'
- guid: f8336d07-892a-4c5a-a9ed-b7aa764cbd34
  text: '"Когда ты завершишь свой труд, я бы хотел взглянуть на него. Быть может, твои открытия заставят и мое сознание стряхнуть пепел ложной веры и откроют новые горизонты".'
- guid: f83630f7-f593-4b7e-8921-8d77172a0783
  text: '"Я все еще чувствую запах крови, что пропитал это место. Сколько же мон-кай здесь погибло от рук моих озлобленных кузенов? Дюжина? Может, три?".'
- guid: f853af87-3415-4b25-b18c-121c4121a8b4
  text: '"Ого! Впервые так близко Вольного Торговца вижу!"'
- guid: f85687ad-b185-468a-b958-b8a025529e33
  text: '"Я чувствую, как реальность истончается с каждой неудачной попыткой..."'
- guid: f8b2e9ba-55be-4b3f-861b-de5bc07e9011
  text: '"Дворцовая стража... на страже, Ваша Светлость! Больше никто не потревожит вас и ваших гостей".'
- guid: f8d15463-211f-4ab2-8975-0bd4b06e69fb
  text: '"Давай заканчивай с двигателем! Мон''кай уже тут!"'
- guid: f8d4e357-50ba-4203-9e7a-0f328add974a
  text: '"...похожие находки по всей планете. Многие мудрецы и аколиты тайных наук ломали головы над сим трофеем, привезенным с позабытого мира на окраине Простора Коронус..."'
- guid: f8ee1020-5950-4c8f-b373-5eb0feebc745
  text: '"Сначала я слышал жуткий смех, теперь вижу великих господ в этой дыре... Я схожу с ума!"'
- guid: f91be1f9-5bcd-4a50-924e-fe9b1b63260a
  text: '"О Эндриэль, Калаинэн, Итриша... Мон-кай поплатятся за ваши страдания!"'
- guid: f92a099a-dc3a-47d9-adbd-0d40c64cc7a2
  text: '"Видишь? Я уже начала подбирать себе новый экипаж. Увы, эти отбросы оказались предателями. Но я нашла и тех, кто остался мне верен!"'
- guid: f999ccf6-3549-4825-918e-2b3c1074ac7f
  text: '"Я словно незрима... Их разум затуманен?"'
- guid: f99a84aa-5d69-4228-9e4d-206e7d1a09f1
  text: '"Вековечный Император, храни династию фон Валанциус!"'
- guid: f99b19a2-f781-4bd8-b83e-140491be56b9
  text: '"Губернатор не даром занимает свой пост. В его верности и служению Вольному Торговцу нельзя усомниться".'
- guid: f9afd5fc-a328-4347-9392-05291e36d7da
  text: '"Мой меч?! Я сдержу ярость лишь потому, что такую весть лучше услышать до битвы. Прочь!"'
- guid: f9ea6465-df4b-474a-b221-0a1f5e59034f
  text: '"...Температура внутри скафандров достигла 92 градусов, что привело к обширным ожогам. Неисправностей в снаряжении не обнаружено".'
- guid: f9eba86f-2bdb-4fbd-ac43-cdf20a2d14d3
  text: '"Поторопимся с поисками, пока завеса еще держится в этом месте. Вы... едва ли выстоите против демонов".'
- guid: fa054a85-afcd-4b48-b619-53bf0ae16272
  text: '"Вот так был человек — и нет человека. Она даже не узнает, ради чего погибла. А ткачи продолжат вершить что им вздумается".'
- guid: fa3f6736-cc92-480e-819d-c9972ad0d3b8
  text: '"Ах ты вшивая крыса! Так и знал, что это ты стукач! Думал, тебе сойдет с рук донос на мою мать?!"'
- guid: fa6bd7e0-13d0-4a5a-9c52-f9aa87e79aaa
  text: '"Мы тут всех прижмем. Каждого грешничка, каждого еретичка!"'
- guid: fae9bd93-7d35-4ccb-8b14-2cea79665da4
  text: '"Придать протоколу аннигиляции наивысший статус! Немедленно уничтожить нарушителя!"'
- guid: fafee614-73e7-4ed2-be19-4b87e912272d
  text: '"Это же Вольный Торговец!"'
- guid: fb1c5dbc-0dca-47b9-8cf6-095f205685f0
  text: '"Заре ведомо грядущее... Только Заря направит нас к спасению..."'
- guid: fb3e7d6d-0ced-4d44-b8a9-e658ab592a3b
  text: '"По-щады... У-Умоляю!.."'
- guid: fb6dbada-493d-47f8-aa47-3c1a4f5f7dac
  text: '"Троном молю, смилуйтесь!"'
- guid: fb75f823-1bae-42b0-b360-0ddf59bd165f
  text: '"Н-нижайше прошу п-прощения, Ваша Милость..."'
- guid: fb9900df-411d-44ef-bdca-e5a3be497210
  text: '"...ваше... ик... здоровье, Звезд{mf|ный|ая} гос... гос... {mf|подин|пожа}!"'
- guid: fbbf04d2-a710-46fd-b086-c7a49f6db935
  text: '"Да будет утолена Губительная жажда!"'
- guid: fbd4166b-d01c-43d3-9676-b2650138ec04
  text: '"Сперва нужно обрести мир в своей собственной душе".'
- guid: fbecb3c3-f9e7-44cd-ba8a-a761a6094a0a
  text: '"Нет, увы... на Футфоле не чтят мое положение, а местный астропатический хор — беспомощное сборище еретиков!"'
- guid: fc1d2491-1060-4f6e-bfc2-31b3bc822a14
  text: '"Где же? Я же прямо тут это видел..."'
- guid: fc2eef5e-6322-4b7c-8612-cd5a0bcc11e0
  text: '"В-ваша Светлость, это не мы, клянусь Троном!"'
- guid: fc3f42ca-7a52-44e2-93e1-168f43a995ff
  text: '"Я уже десять вахт жду!"'
- guid: fc49199d-7447-48f9-ba33-d44c2ef54669
  text: '"Брат мой, ты нуждаешься в ритуал-протоколе ремонта. Мы исправим тебя".'
- guid: fc8f189c-22d1-4b3f-9685-833afcd3a689
  text: '"Необходима технолитания о машинном смирении. Воксирую о начале освящения масел и подготовке техноматов".'
- guid: fc969011-e415-4d3c-a4fe-0932a9e4a17f
  text: '"Храни вас Бог-Император от ереси и скверны!"'
- guid: fcbd7880-1851-466d-8db7-f72e69893f2b
  text: '"Ага... Посвящение... Вот же уморительный бедолага".'
- guid: fcd6a2bb-1496-4e5c-b09d-7ae09cc4a7bb
  text: '"Главные ворота заперты, открывайте эти! Быстрее, бездари!"'
- guid: fcf43664-f559-47be-b6bd-535ea5b5947c
  text: '"Чтоб их проказа пустотная поразила!"'
- guid: fcf6d4b0-8807-41ca-af2e-4d09489ddc07
  text: '"Страшно блюстителям на глаза попадаться. Раньше за провинности били, а теперь хватают и морят работой".'
- guid: fcfec95d-1cf5-48aa-bbfd-cf6ee7f2ff94
  text: '"Твою флотилию, огонь! Стреляем! Стреляем в стены и пол — дверь укреплена!"'
- guid: fd03c4bc-24a5-4682-87a6-143d858d7d40
  text: Рабочий старательно пыхтит папиросой лхо, пытаясь успеть скурить ее за свой короткий перерыв.
- guid: fd1106f5-2c8a-4490-97b1-70aae1f6c53f
  text: '"Она нас по одному прикончит. Только что парню виселицу выписала за то, что блюстителю под ноги плюнул. Это — мятежное подстрекательство, оказывается!"'
- guid: fd178ad5-2861-4a93-a588-df1df7c77505
  text: '"Похоже, Злоба не стоит ничего. Дни твоей славы прошли, старик. Ты стал вялым и ленивым".'
- guid: fd30b0f2-c96a-4e42-8f53-496c22a60597
  text: '"Лорд-капитан, получена астропатическая передача с Даргонуса! Ахиллеас Скаландр сообщает о рейде ксеносов против торгового судна в системе Несчастье Гартрафала!"'
- guid: fd4fe20d-c056-4043-91e9-c15b64f3f3b8
  text: '"Похоже, все, что уцелели, теперь прячутся под нами — патрули давно не приводили пленных".'
- guid: fd5b8601-86ed-4311-8ebd-48d8c53e2879
  text: '"В жизни столько еды не видел. Как бы уместить в себя побольше, чтобы потом не голодать..."'
- guid: fd9496f6-9202-4386-814e-ba5cbe327823
  text: '"Кран активирован, Лорд-капитан!"'
- guid: fe012ffd-6838-4f2a-bb72-c8d46682991c
  text: '"Вольный Торговец... Изменни{mf|к|ица}! Я знал, что стоит тебя убить".'
- guid: fe01f1e9-7679-45be-9fe9-76afdd90d861
  text: '"Мы не виноваты, Лорд-капитан! Это все блюстители окаянные... а мы — честные люди!"'
- guid: fe22e588-c71a-4188-a437-4e6d5f1b2900
  text: '"Не думаю, ашмаг".'
- guid: fe7bf493-ba82-4e76-aacb-62b3ec90ed2d
  text: '"Ликуйте, живущие на шпилях, ибо я пришла утолить вашу Губительную жажду! Сегодня да случится дикая охота!"'
- guid: fe7d4610-5f5e-4f43-bdf9-d73282d3bdbe
  text: '"Какие новости? Давно у нас гостей из Каликсиса не было..."'
- guid: fe879c68-3e91-4739-8729-298840b34bda
  text: '"Вот это судьба! Владеть целыми звездами..."'
- guid: fe8a66f1-bd96-48ac-a3a6-3530c73f5442
  text: '"Ааа! Идира, давай, ищи... В пол, надо стрелять в пол! Скорее!"'
- guid: febaf131-3a70-4945-a97a-705cff2dcd33
  text: '"Отступись, мон-кай".'
- guid: fec13337-7afd-4ed0-bbef-1cd93ce33647
  text: '"В-ваша Светлость?.. П-приносим свои извинения... за вторжение!"'
- guid: fed2490d-e1f2-4910-bc13-07c151924193
  text: '"Стоя за штурвалом и вглядываясь во тьму космоса... Ты чувствуешь себя так же одиноко среди тысяч звезд, как и я — среди своих собратьев".'
- guid: fed90a27-139c-4347-bc83-1e449b5d7529
  text: '"Наследник дома Эрэбис вернулся на флагман... До сих пор не верится!"'
- guid: fee0d878-e252-46a0-8b7b-acb1bbc56722
  text: '"Трусливые ублюдки выпрыгнули из засады и ранили моего Навигатора. За что и поплатились — я лично порубил каждого!"'
- guid: ff3ac464-bafd-415d-8279-bc1d11c3441d
  text: '"Эта игровая доска заключена в оковы из багряного и черного. Цвета такие насыщенные... Но как это возможно? Обычно предметы источают лишь отголоски красок своих хозяев".'
- guid: ff43c334-033a-4a9d-8181-321097a5785a
  text: '"Состав Тета-34 запрашивает ремонтную бригаду и медикариев — авария в последнем вагоне".'
- guid: ff530135-a683-4f66-b773-838394dc00b4
  text: '"Передать по вокс-связи: именем инквизитора Ютана Холла всему экипажу предписывается вооружиться и начать общую зачистку трюмов".'
- guid: ff808391-9b48-497d-8c90-2553872fd46e
  text: '"...Ибо кровь ваша — в их руках и сердцах. Ибо смерть ваша — в дланях моих".'
- guid: ff97d54e-7803-49c9-b617-140321be792d
  text: '"Видели? Звездн{mf|ый|ая} Госпо{mf|дин|жа} благослови{mf|л|ла} мою лавку взглядом!"'
- guid: ff9fee4b-49d5-4ab2-9bb2-88aec53cf87f
  text: '"Сравнение допустимых задач..."'
