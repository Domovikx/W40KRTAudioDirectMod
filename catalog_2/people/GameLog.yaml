  text: '{source} получает дополнительный ход'
- guid: c530abc7-682a-41a2-83d9-5934021125e4
  text: <b>{source}</b> замечает тайную дверь.
- guid: c65460b8-57c6-4051-a947-5ef36b307993
  text: Создан груз <b>{text}</b>. Заполненность <b>{count}%</b>.
