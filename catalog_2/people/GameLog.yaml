- guid: fc90d8ab-c8c5-494c-9448-e24478840c0a
  text: '<b>{target}</b>: ранение <b>{text}</b> исцелено'
- guid: fd65a125-0cc0-4000-87a6-0da9f3122b40
  text: Бронепокрытие
- guid: fdbf7ca5-3e98-4f83-9c8e-49cf45d53c54
  text: <b>{source}</b> проваливает обезвреживание ловушки и та случайно срабатывает.
- guid: fe434e2d-758b-48bc-abe3-c1baa231d58e
  text: <br>Срабатывает {overpenetration}
- guid: ff6cc72c-bbbe-4fec-8271-8a1f4f00db74
  text: Наносит урон (<b>{result_damage}</b>, {damage.type}) цели {target}<br>{critical_hit}{description}
