  text: Безопасность в колонии изменилась
- guid: bb19787d-968c-41ee-9eb8-fe0ea784c9e9
  text: атака <b>очередью</b>
- guid: bb4c0dd9-b365-4669-ac1d-b5542a7aa3cd
  text: Модификатор броска
- guid: bd26ae0c-715c-4713-94c0-d55547379cfd
  text: Поглощенный урон
- guid: bdb0df91-858c-4f63-bc5e-dbb0278f36b1
  text: Летальность ассасина
- guid: be7942ed-3af1-4fc7-b20b-41966d2f80b7
  text: '<b>{source}</b> использует: <b>{text}</b>.'
- guid: bf598ca6-9cf7-4b0b-aff2-3454f64b1ab1
  text: <b>Урон</b>
- guid: c039829d-eaa9-4aa9-bff0-af191843297c
  text: Уведомления об изменениях в трофеях
- guid: c0ef7311-1b6a-4f2e-98b9-1e8dda5e30ea
