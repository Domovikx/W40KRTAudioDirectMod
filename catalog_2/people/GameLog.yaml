- guid: b3b9fad6-d1c5-4802-8784-5beba994df7c
  text: 'Репутация фракции <b>{text}</b> понижена на: <b>{count}</b>.'
- guid: b43087c0-dbd3-4216-b3f6-4aae5b74d0ab
  text: <b>Итоговый показатель брони</b>
