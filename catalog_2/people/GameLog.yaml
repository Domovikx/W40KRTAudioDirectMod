- guid: fc086b56-6d2b-476e-bdfe-4a9caa735e3c
  text: <b>Уклонение</b>
- guid: fc45edaf-fa17-4585-a56d-4cb64385fad1
  text: Эффективность колонии изменилась
- guid: fc7a1264-0a0b-41e7-97c4-06f72f9a8213
