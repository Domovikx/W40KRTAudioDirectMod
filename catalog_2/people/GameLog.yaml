- guid: c2666bd4-18c4-4b6b-8a99-f07c98c6fedb
  text: '<b>{target}</b>: {count_form|получена|получено} <b>{count} {count_form|единица|единиц} урона характеристики ({description})</b> от неизвестного источника.'
