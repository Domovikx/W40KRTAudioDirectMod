- guid: cac30236-5efb-4048-b8e6-4bc6befa4c6d
  text: '{target} пропускает ход'
- guid: cafe8175-96cd-4f76-a3a9-a110945d7224
  text: 'Причины:'
- guid: cbc0da99-f2b0-4d1d-8197-1388e2aa7675
  text: <b>Изначальный урон</b>
- guid: cbd85c72-6d7c-4f00-98bb-d5d3f573917a
  text: '{source}<b>{text}</b> наносит урон (<b>{result_damage}</b>, {damage.type}) цели {target}{description}'
- guid: cc2142fc-376e-427d-a739-f609492c002c
  text: Исцеляет цель (<b>{target}</b>) на <b>{count}</b> здоровья.
- guid: cd8c0ca1-6209-40c5-bc19-b00a2ff23047
  text: Парирование
- guid: d0a880cf-09f1-4055-a995-19fdfb42dcb1
  text: к мин урону
- guid: d0b65e0c-47ce-423c-808e-2f57de97d044
  text: Цель ({target}) заблокировала
- guid: d0e572ce-40b8-4b01-bad6-10d88e52dff4
  text: 'Ланс-импульс: урон (<b>{roll}</b>). {critical_hit}'
- guid: d1725727-ceb7-4f6f-989a-1dabaaa4f5ae
  text: '<b>{source}</b> наносит урон (<b>{count}</b>) цели: <b>{target}</b>.'
- guid: d1bb75e1-b67a-4848-aefc-fa652f75df6b
  text: Наносит урон щитам (<b>{Penetration}</b>) цели <b>{target}</b>
- guid: d213d103-695d-4058-9bb8-b76aff62f0b0
  text: Наносит урон щитам (<b>{Penetration}</b>) и корпусу (<b>{count}</b>) цели <b>{target}</b>
