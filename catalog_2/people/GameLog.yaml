  text: '<b>{source}</b>: опыт составляет <b>{text}</b>, нужно еще <b>{count}</b>, чтобы получить следующий уровень'
- guid: d31d2048-c37d-4be7-9717-e7380fed4a7b
  text: '{veil} изменилось: <b>{veil_state}</b>'
- guid: d4a039cd-d9ad-4925-9413-a8a3ed6cfa36
  text: <b>Эффективное уклонение</b>
- guid: d69fec0c-db7e-4ef6-b63e-c38db247cba5
  text: 'Источник: <b>{source}</b>.'
- guid: d82adc19-cdef-403a-8230-548b38a63dd4
  text: к макс урону
- guid: d8ebd97c-33bb-4b39-a297-accae412ec41
  text: '{source} получает {count} опыта за бой'
- guid: d9a914ae-6028-4d39-a1bf-07252b5ee6b1
