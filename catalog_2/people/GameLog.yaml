  text: '{text} наносит урон ({count}) цели {target}.'
- guid: e169f9a7-dcc1-4761-823b-375362351cf3
  text: <b>Критический урон</b>
- guid: e1aaa47d-4eaa-4301-b104-51bf9c412a96
  text: 'Сработал <b>автопромах</b>, причина:'
- guid: e5883ace-c986-408e-955d-c7a9094019f0
  text: Попадает по укрытию вместо цели {target}
- guid: e86e6e3d-7125-489d-83c1-22bb871e841d
  text: '<b>{target}</b>: наложен эффект <b>{text}</b>'
- guid: ea43c9cd-91d3-44ea-9b9d-b3477fadc7fb
  text: <b>{source}</b> наносит <b>{count} {description}</b> урон(а) цели (<b>{target}</b>).
- guid: eaad8f99-9050-4aad-8c24-3afffc6d2c31
  text: <b>Базовый урон</b>
- guid: ecb60c86-b9d3-4114-849b-5163ef561563
  text: <b>Причина урона</b>
- guid: f1be8c30-87a1-4238-97fc-eba660ffc41e
  text: Мин значение
- guid: f2f525fd-fbc4-4a18-a625-37daa84fa97c
  text: <b>{source}</b> избегает пси-морока!
- guid: f3292fda-646b-47f3-badf-37fc19cdba2b
  text: '<b>{source}</b>: к группе применен эффект <b>{text}</b>'
- guid: f34dfcc2-7325-4074-a470-4f6d77321410
  text: Пополнен груз <b>{text}</b>. Заполненность <b>{count}%</b>.
- guid: f5613875-b90e-4cf9-b205-9cf37e6fa1b7
  text: <b>Сквозное пробитие</b>
- guid: f751d600-e358-42d1-a5fa-39459e662e55
  text: Безопасность изменилась во всех колониях
- guid: f9c1f058-5c56-45fb-84df-705ec38bf4ed
