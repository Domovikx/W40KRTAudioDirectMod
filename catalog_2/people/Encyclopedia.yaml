phrases:
- guid: 0527283b-6052-40fe-b549-fdd7170671e2
  text: 'Жрецы Адептус Механикус посвящают себя Богу-Машине, Омниссии, и Движущей Силе: источнику всех знаний и воплощению мудрости. Прибегая к изощренным ритуалам, механически аугментированные жрецы создают, обслуживают и чинят все устройства, созданные человечеством.'
- guid: 05cdc0a9-55ea-4c5b-bc75-03efa9c64fbe
  text: 'Репутацию у торговцев можно повысить, сдавая им заполненные до 100% грузы с различными предметами.

    Приобретение предмета у торговца не расходует никаких ресурсов, но имеет либо один из двух, либо оба требования: уровень {g|Encyclopedia:ProfitFactorFullGlossary}фактора прибыли{/g} и уровень репутации.

    Предмет может быть приобретен только в том случае, если все требования выполнены.

    Начиная со второй главы Вольный Торговец сможет связываться с торговцами через своего Высокого фактотума на мостике пустотного корабля.'
- guid: 07204487-4de4-42d3-a251-d15f293e0a0a
  text: Рыцарские миры играют ключевую роль в обороне Империума в бесчисленных секторах. С помощью гигантских боевых машин они защищают своих союзников от инопланетных захватчиков и еретиков.
- guid: 08c1a97a-4d75-4758-bada-d2dbd70e7902
  text: Множество эпох назад народ эльдаров разделился на несколько кланов и расселился по дальним регионам галактики. Несмотря на свою малочисленность, они остаются силой, с которой стоит считаться, благодаря своим продвинутым технологиям, изощренному разуму и врожденным психическим способностям.
- guid: 0915d1ec-a20a-405f-bc63-1b72376c68ee
  text: Прокторы стоят во главе небольших оперативных отрядов Арбитес и подчиняются напрямую действующему Маршалу. Они могут выполнять различные по важности задания — от поимки самых опасных преступников Простора до обычного патрулирования районов в мирах-ульях.
- guid: 0a0f716c-3a2a-4d0a-9018-9509b841179f
  text: 'Заряд щита не восстанавливается в течение боя, но он полностью восстанавливается между боями и его можно перезаряжать способностью корабля <b>Перезагрузка щитов</b>.

    Щиты не всегда поглощают весь получаемый урон. В зависимости от их оставшегося заряда, щит может поглотить как весь урон, так и его половину, или не поглотить ничего вообще. Чем больше остаток заряда — тем больше шансов на поглощение. При полностью заряженном щите гарантированно поглощается весь урон. При заряде больше половины поглощается либо весь, либо половина урона. При заряде щита меньше 50% поглощается либо половина урона, либо ничего.'
- guid: 0c7ab3dc-f0e5-4c92-ae94-78312eac587a
  text: Размер фазы завершения (и фазы ускорения — начальной фазы движения корабля, требуемой для некоторых способностей) зависит от установленного <b>двигателя</b>. Некоторые двигатели обладают хорошей динамикой и имеют увеличенные фазы завершения и ускорения (именно такой тип двигателя установлен на корабле изначально), другие обладают повышенной {g|Encyclopedia:SpeedSpace}скоростью{/g} и оснащенный ими корабль может передвигаться быстрее.
- guid: 12536968-7356-4010-817f-22853bc1b535
  text: Инквизиция всеми средствами уничтожает скверну, вызванную силами Хаоса, еретиками, мутантами и пришельцами. Инквизитор имеет право призвать к себе в услужение любые подразделения вооруженных сил Империума — чем сильнее угроза человечеству, тем мощнее собираются армии, чтобы с ней бороться.
- guid: 13ba4e42-e432-45bc-a58f-6b97039ed99d
  text: 'Вторая ключевая {g|Encyclopedia:Ability}способность{/g}, {g|f:530b6d2cefef42f180b90c7bdbb99f90}Наслаждение убийствами{/g}, позволяет мгновенно восстановить дыхание, но может быть использована только после убийства 3 врагов в текущем бою.

    Ее применение дает солдату ряд {g|Encyclopedia:Bonus}бонусов{/g} до конца боя: +10 к {g|Encyclopedia:WarhammerBallisticSkill}Дальнему Бою{/g}, <b>+<u>(5 + 2 × бонус {g|Encyclopedia:WarhammerAgility}Ловкости{/g})</u>%</b> к {g|Encyclopedia:CritChancesAndCritDamageGlossary}критическому урону{/g} и <b>+<u>бонус Ловкости</u>%</b> к {g|Encyclopedia:CritChancesAndCritDamageGlossary}шансу критического попадания{/g}.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} солдата мгновенно {g|Encyclopedia:Reload}перезаряжает{/g} его оружие и позволяет ему без затрат ОД совершать дополнительные атаки — те, что при использовании выбранного оружия в обычном случае требуют меньше всего {g|Encyclopedia:ActionPoints}ОД{/g}. Количество этих атак равно {g|Encyclopedia:RateOfFire}скорострельности{/g} оружия (минимум 2). До конца {g|Encyclopedia:Turn}хода{/g} солдата каждое первое его попадание в новую цель становится критическим.

    <b>Важные характеристики солдата</b>: Дальний Бой, Ловкость, {g|Encyclopedia:WarhammerPerception}Восприятие{/g}, {g|Encyclopedia:WarhammerIntelligence}Интеллект{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} солдата</b>: {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}.

    Солдаты могут стать {g|Encyclopedia:CareerVeteranGlossary}архмилитантами{/g}, {g|Encyclopedia:CareerHunterGlossary}охотниками за головами{/g} или {g|Encyclopedia:CareerTacticianGlossary}мастерами-тактиками{/g}.'
- guid: 13ffb14b-d66e-42bd-a9cf-094338facbed
  text: 'Охотник за головами может видеть {g|Encyclopedia:DifficultyTier}ранг противника{/g} (от I до VII).

    Ключевая {g|Encyclopedia:Ability}способность{/g} охотника за головами, {g|f:802d21391d2f4573bfff126023df39bb}Законная добыча{/g}, имеет 3 заряда и позволяет за один заряд наложить на врага {g|Encyclopedia:CommonStatusesGlossary}эффект{/g} {g|Encyclopedia:Prey}добыча{/g}.

    Когда охотник за головами убивает добычу, он получает {g|Encyclopedia:Bonus}бонусы{/g} до конца боя в зависимости от ее ранга:

    <b>I–II</b>: +25% от {g|Encyclopedia:MaxWounds}максимального здоровья{/g} охотника за головами в качестве {g|Encyclopedia:TemporaryWounds}временного здоровья{/g}.

    <b>III–IV</b>: +<u>(5 × ранг добычи)</u>% {g|Encyclopedia:CritChancesAndCritDamageGlossary}критического урона{/g} и +<u>(2 × ранг добычи)</u>% шанса критического попадания.

    <b>V–VII</b>: оба предыдущих бонуса.

    Эти бонусы суммируются.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} охотника за головами позволяет ему мгновенно атаковать все цели с эффектом "добыча" в {g|Encyclopedia:LineOfSight}зоне видимости{/g}.

    Эти атаки всегда {g|Encyclopedia:HitSequenceGlossary}попадают{/g} и всегда являются критическими.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} охотника за головами</b>: {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}, {g|Encyclopedia:WarhammerPerception}Восприятие{/g}, {g|Encyclopedia:WarhammerAgility}Ловкость{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} охотника за головами</b>: {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillLoreXenos}Знания: Ксеносы{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}.'
- guid: 14a67102-6e34-49f2-9498-40d0bdb19207
  text: Археотех часто обнаруживают на окраинах галактики. Хотя Адептус Механикус особо заинтересован в возвращении и обладании столь древними технологиями и считает все подобные устройства священными артефактами, некоторый археотех может расцениваться как запретный и даже еретический.
- guid: 184fd851-17ac-4e6e-9757-41f4637cba77
  text: 'Большая часть богатства Вольного Торговца выражена в эффективности и благополучии подконтрольных ему <b>колоний</b>. Вольный Торговец уже владеет 4 колониями, с которыми предстоит восстановить связь: Янус, Кьява Гамма, Даргонус и Веабос-6. По мере прохождения сюжета можно присоединить к владениям новую колонию — Фолстоун.

    Для развития колоний необходимо выполнять проекты, обычно связанные со строительством или оказанием услуг различным фракциям. Проекты приносят уникальные награды, {g|Encyclopedia:Reputation}репутацию{/g} фракций или очки {g|Encyclopedia:SoulmarkTypesGlossary}убеждений{/g} и являются основным источником {g|Encyclopedia:ProfitFactorFullGlossary}фактора прибыли{/g}. Выполнение проекта требует времени, поэтому колонии сами уведомят вас о том, что проект завершен, и доставят уникальные награды прямо на корабль Вольного Торговца. Забрать награды можно из окна менеджмента колонии.

    У каждой колонии есть своя история — <b>хроника</b>, которая влияет на ее развитие и приносит уникальные награды или эффекты. Хроники обновляются во время важных этапов строительства колонии.

    В колониях также происходят уникальные события, которые могут принести {g|Encyclopedia:Bonus}бонусы{/g} или потребовать от Вольного Торговца лично расправиться с недругами, терроризирующими поселение.'
- guid: 18cca473-e30b-4bd9-af50-f6552775f530
  text: За долгую и прославленную историю существования, в летописи легиона было внесено немало записей о громких победах, однако эти победы были омыты кровью бесчисленного количества бойцов. Стремясь заслужить прощение, меровцы добровольно отправляются на выполнение самых опасных тактических операций.
- guid: 1b9314ef-bd03-4118-915b-3fb8f9b31653
  text: Они — живое воплощение жестокости и распутства расы эльдар. Крайне умные и коварные до одури, друкари — извращенные и отвергнутые ксеносы, вечно жаждущие поглощать психическую энергию, выделяемую из страданий и отчаянья других разумных существ, чтобы спасти свои собственные проклятые души.
- guid: 1bb84e5d-9f5c-4707-af1a-4db8ed4e6f3f
  text: Созданные, чтобы быть во всех отношениях лучше обычных людей, смыслом их жизни является борьба против любых угроз человечеству. У каждого Ордена Космодесанта есть своя родная планета, воинская культура и стратегическая специализация.
- guid: 1c204a77-1af8-450c-ad3e-eb2846270676
  text: Все псайкеры черпают силы из внепространственного измерения под названием варп. Из-за этого псайкеры, особенно человеческие, часто подвергаются опасности. Им может грозить безумие, одержимость демонами или полное подчинение Губительным силам.
- guid: 1f7d39ba-7431-492b-bed4-dff3fb93109e
  text: Существует множество инопланетных видов, враждебных Империуму Человечества, и каждый из них — ересь в глазах Бога-Императора, которую необходимо искоренить. Вольные Торговцы и некоторые избранные имеют право мирно взаимодействовать с ксеносами в целях торговли, заключать с ними временные союзы или даже брать их в команду в качестве наемников.
- guid: 2060c1ee-5350-4425-9abb-4027bde6a6e1
  text: Миры-ульи предоставляют рабочую силу, материалы и другие товары, необходимые Империуму. Также из их огромной массы населения вербуются бесчисленные воинские подразделения.
- guid: 21459649-d263-43a5-bacb-8f21c83ae3af
  text: '<b>Когда истончение завесы меньше или равно 14:</b>

    -<indent=5%>Малые психосилы могут вызвать {g|Encyclopedia:PsychicPhenomena}пси-морок{/g} с шансом <u>(5 + {g|Encyclopedia:PsyRating}пси-рейтинг{/g})</u>%.</indent>

    -<indent=5%>Значимые психосилы могут вызвать пси-морок с шансом <u>(20 + 4 × пси-рейтинг)</u>%.</indent>

    -<indent=5%>Используя малые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>((5 + пси-рейтинг) / 2)</u>%.</indent>

    -<indent=5%>Используя значимые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>(10 + 2 × пси-рейтинг)</u>%.</indent>{br}

    <b>Когда истончение завесы достигает 15 и выше:</b>

    -<indent=5%>Шанс вызвать пси-морок возрастает в 4 раза.</indent>

    -<indent=5%>Применение значимых психосил может вызвать появление {g|Encyclopedia:PerilsOfWarp}угроз варпа{/g}.</indent>

    -<indent=5%>Используя малые психосилы, несанкционированный псайкер может вызвать пси-морок с шансом <u>(20 + 4 × пси-рейтинг)</u>%.</indent>

    -<indent=5%>Используя значимые психосилы, несанкционированный псайкер может вызвать пси-морок с шансом <u>(20 + пси-рейтинг + значение истончения завесы)</u>%, если угрозы варпа не появились.</indent>

    -<indent=5%>Используя малые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>(10 + 2 × пси-рейтинг)</u>%.</indent>

    -<indent=5%>Используя значимые психосилы, санкционированный псайкер может вызвать пси-морок с шансом <u>(10 + пси-рейтинг + значение истончения завесы)</u>%, если угрозы варпа не появились.</indent>'
- guid: 245230ed-1b7c-41aa-8919-5176203beeb8
  text: Большинство умирают во время испытаний, но выжившие могут стать санкционированными псайкерами и служить Империуму множеством путей. Некоторые становятся Астропатами, связующими миры друг с другом с помощью телепатических способностей, либо же Боевыми Псайкерами — живыми орудиями, идущими в бой плечо к плечу с Имперской Гвардией.
- guid: 289ccc68-ba0f-4716-9d9e-0378ebd9e80b
  text: 'Если оперативник атакует цель с {g|Encyclopedia:Exploit}уязвимостью{/g}, такая {g|Encyclopedia:HitSequenceGlossary}атака{/g} наносит на <b><u>(5 × {g|Encyclopedia:Bonus}бонус{/g} Восприятия)</u>%</b> больше {g|Encyclopedia:DamageGlossary}урона{/g}, дополнительно увеличиваемого на 10% за каждую уязвимость на цели. При этом все уязвимости снимаются.

    Оперативник также может активно применять {g|f:502b9195c84c42c5b180f3f63ed7955c}Анализ целей{/g}, чтобы наложить на врага <b><u>(1 + бонус {g|Encyclopedia:WarhammerIntelligence}Интеллекта{/g} / 2)</u></b> уязвимостей.

    Вторая ключевая способность оперативника, {g|f:fbdba5fe2a264c25bada29aecd64049a}Выявление слабостей{/g}, снимает все уязвимости с врага и снижает его {g|Encyclopedia:DodgeGlossary}уклонение{/g}, {g|Encyclopedia:Parry}парирование{/g} и {g|Encyclopedia:WarhammerArmourGlossary}броню{/g} на <b><u>(10 + количество уязвимостей × бонус Восприятия)</u>%</b> до начала следующего {g|Encyclopedia:Turn}хода{/g} оперативника.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} оперативника накладывает 1 уязвимость на всех врагов в бою, после чего оперативник атакует цель, всегда попадая по ней. Цель этой атаки получает {g|Encyclopedia:Penalty}штраф{/g} 30% к уклонению и броне до конца боя.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} оперативника</b>: Интеллект, Восприятие, {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}

    <b>{g|Encyclopedia:Skills}Навыки{/g} оперативника</b>: {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillLoreXenos}Знания: Ксеносы{/g}, {g|Encyclopedia:SkillLoreImperium}Знания: Империум{/g}, {g|Encyclopedia:SkillTechUse}Техника{/g}, {g|Encyclopedia:SkillLogic}Логика{/g}.

    Оперативники могут стать {g|Encyclopedia:CareerAssassinGlossary}ассасинами{/g}, {g|Encyclopedia:CareerStrategistGlossary}великими стратегами{/g}, {g|Encyclopedia:CareerHunterGlossary}охотниками за головами{/g} или {g|Encyclopedia:CareerExecutionerGlossary}палачами{/g}.'
- guid: 308b7aec-501e-402f-8c32-10014e10c6ff
  text: Оружие, установленное на {g|Encyclopedia:ProwSpace}носу{/g}, стреляет вперед, установленное по бортам — вбок. Самые лучшие {g|Encyclopedia:FiringArcSpace}сектора стрельбы{/g} в 270 градусов имеет оружие, установленное в {g|Encyclopedia:DorsalSpace}башенных{/g} слотах, куда можно установить только специальные облегченные версии {g|Encyclopedia:MacroCannonsSpace}макропушек{/g} и {g|Encyclopedia:LanceWeaponSpace}лэнс-излучателей{/g}.
- guid: 30c3100f-61fb-4786-b651-05d8fa3d28c7
  text: Его территория включает в себя мириады звезд и бесчисленные людские народы, объединенные узами вида и всеобъемлющей верой в Императора. Пришельцы и мистические силы неустанно посягают на владычество Империума, вынуждая человечество сражаться в бесконечных войнах.
- guid: 33987d4e-3c4d-49a9-b97e-56098e9348a0
  text: Великие Дома Навис Нобилите — одни из самых состоятельных и влиятельных знатных домов Империума. Они поддерживают свой рецессивный Ген навигатора с помощью селекции, хотя в действительности сам ген, скорее всего, вызывает генетическую нестабильность и мутации по мере того как навигатор становится сильнее и старше.
- guid: 39f8b3f0-59fa-48f7-817b-e46a5dbb4430
  text: Миссия Касбаллики заключает выгодные долгосрочные сделки с Вольными Торговцами, корсарами, пиратами и прочими искателями приключений, получая процент за сбыт и продажу нелегальных товаров. Она специализируется на хладном торге запретными артефактами ксеносов.
- guid: 3bdf7991-9f8e-41e9-bc8c-aa9180573599
  text: '<b>Атака по возможности</b>:

    -<indent=5%>Соответствует обычной одиночной атаке имеющимся оружием {g|Encyclopedia:MeleeAttacksGlossary}ближнего боя{/g}.</indent>

    -<indent=5%>Как и с обычной атакой, цель может парировать ее или {g|Encyclopedia:DodgeGlossary}уклониться{/g}.</indent>

    -<indent=5%>Может модифицироваться различными {g|Encyclopedia:Talent}талантами{/g} атакующего, действующими именно на нее, например, иметь увеличенный {g|Encyclopedia:DamageGlossary}урон{/g} или {g|Encyclopedia:HitSequenceGlossary}шанс попадания{/g}.</indent>

    -<indent=5%>Не тратит {g|Encyclopedia:ActionPoints}очки действий{/g} атакующего.</indent>

    <b>Свойства области угрозы</b>:

    -<indent=5%>Внутри зоны нельзя использовать {g|Encyclopedia:Range}дистанционное{/g} оружие, за исключением пистолетов и дробовиков.</indent>

    -<indent=5%>Попытка выйти из зоны (т.е. переместиться из клетки внутри зоны в клетку за ее пределами) вызывает атаку по возможности.</indent>

    -<indent=5%>Перемещение по клеткам внутри зоны стоит 3 {g|Encyclopedia:MovementPoints}ОП{/g} (обычно от 1 до 2 ОП). Вход в область угрозы стоит 1 ОП, как обычно.</indent>

    -<indent=5%>Некоторые действия невозможно совершать в области угрозы (например, стрельбу из дистанционного оружия), иные действия провоцируют атаку по возможности, а некоторые не вызовут каких-либо последствий. Информацию о том, вызовет ли реакцию то или иное действие внутри зоны, можно увидеть во всплывающих подсказках при выборе {g|Encyclopedia:Ability}способностей{/g} или оружия.</indent>

    -<indent=5%>Области угрозы разных персонажей могут пересекаться друг с другом. В таком случае атаки по возможности совершают по очереди все персонажи, в чьей области угрозы находится цель.</indent>'
- guid: 3bdfc05d-c032-4d80-9940-5483896f13c1
  text: Друзианцы верят в продолжение Крестового Похода Человечества с целью присоединения новых миров к Империуму. Подобно своему святому покровителю, они ценят аскетизм, высокие моральные принципы, преданностью идее и бесстрашие.
- guid: 3d165fb7-5bf8-408c-9743-4240b4ef8a0a
  text: Последствия появления Великого Разлома затронули весь космос — его влияние проявляется в аномалиях пространства и времени, а также усилении иных варп-штормов, что может приводить к таким последствиям, как исчезновение ранее известных маршрутов через Имматериум.
- guid: 3ebdc079-bfac-4498-a354-1736ecd297d9
  text: 'Ключевая пассивная {g|Encyclopedia:Ability}способность{/g} мастера-тактика, {g|f:b669fe2c03a240fca1b3b2429ca87414}Тактическое преимущество{/g}, позволяет ему получать уровни уникального одноименного {g|Encyclopedia:CommonStatusesGlossary}эффекта{/g}, каждый раз когда он или его союзники получают {g|Encyclopedia:MomentumWithDetailsGlossary}моментум{/g}.

    Число уровней этого эффекта составляет 20% от всего полученного моментума (т. е. 1 уровень за каждые 5 моментума). Мастер-тактик начинает бой с количеством уровней, равным его {g|Encyclopedia:Bonus}бонусу{/g} Общительности.

    Ключевая активная способность мастера-тактика, {g|f:7989c6e3109841329aee9e4546138395}Дополнительное преимущество{/g}, усиливает его следующую атаку, нанося 4% дополнительного {g|Encyclopedia:DamageGlossary}урона{/g} за каждый уровень {g|f:b669fe2c03a240fca1b3b2429ca87414}тактического преимущества{/g}, который есть у мастера-тактика, но тратит половину уровней тактического преимущества (с округлением в большую сторону).

    {g|Encyclopedia:HeroicAct}Героический акт{/g} мастера-тактика позволяет ему разметить на поле боя область 3×3. Мастер-тактик и все его союзники, у которых в этой области есть хотя бы один враг {g|Encyclopedia:LineOfSight}в зоне видимости{/g} и доступный для {g|Encyclopedia:HitSequenceGlossary}атаки{/g} выбранным в данный момент оружием, немедленно проводят одиночную атаку по случайному противнику из числа доступных целей в этой области.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} мастера-тактика</b>: {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}, {g|Encyclopedia:WarhammerAgility}Ловкость{/g}, {g|Encyclopedia:WarhammerFellowship}Общительность{/g}, {g|Encyclopedia:WarhammerWillpower}Воля{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} мастера-тактика</b>: {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}, {g|Encyclopedia:SkillPersuasion}Убеждение{/g}, {g|Encyclopedia:SkillLoreImperium}Знания: Империум{/g}.'
- guid: 446f229a-9242-41a1-82f5-fbccc1b2df4a
  text: Много тысяч лет назад, Сангвиний принес величайшую жертву во благо Человечества — сойдясь в битве с Великим Предателем, он пожертвовал своей жизнью, дабы Император мог нанести Архиврагу решающий удар. Память о нем неукоснительно чтится всеми верными подданными Империума и по сей день. Адептус Астартес из ордена Кровавых Ангелов являются хранителями священного наследия примарха.
- guid: 455640cd-4697-4a9d-b4d4-97aaa751aa06
  text: У всех навигаторов на лбу есть третий глаз, позволяющий им вести пустотные корабли сквозь варп. Без навигаторов Империум Человечества не смог бы существовать, так как любые путешествия между звездными системами, кроме самых ближайших, были бы слишком трудны и опасны.
- guid: 45fa2e37-f333-425f-afff-faa14e7659af
  text: Большинство детей, когда вырастут, пойдут служить в Министорум, станут военачальниками или вступят в войска специального назначения. Женщины, скорее всего, присоединятся к одному из Воинствующих Орденов Адепта Сороритас. Те же, кто проявят психические способности, продолжат обучение в качестве санкционированных псайкеров, если они будут достаточно сильны волей.
- guid: 4a20b9db-33eb-44a0-baca-2e4a6e736978
  text: Отец, Хранитель и Бог Человечества. Возвышаясь над своими преданными слугами, Император восседает на Золотом Троне Терры в сердце Империума. Он был и остается сильнейшим из когда-либо существовавших человеческих псайкеров. Благодаря его Империуму, Человечество едино и остается одним из сильнейших разумных видов в галактике.
- guid: 5005a46a-e17e-484e-a9e9-57f3f82cdcdd
  text: Как правило, он зависит от типа планеты и обозначается в формате "класс" (Экзактис, Декума или Солюцио) и "степень" (Экстремис, Партикулар, Прима, Секундус или Терциус). Война и иные обстоятельства могут стать причиной изменения ранга. Ранг десятины миров-кузниц, кардинальских миров Адептус Министорум, рыцарских планет и миров Ордена Космодесанта всегда соответствует Аптус Нон.
- guid: 53305a19-d32c-464a-a4c8-9d542f16d01a
  text: Миры-кузни являются основным поставщиком техники для Империума. На них производится все, от сельскохозяйственных инструментов до военной техники, вроде космических кораблей, танков и истребителей. Поверхность каждого мира-кузни полностью покрыта массивными заводскими комплексами, уничтожающими экосистему планеты на корню.
- guid: 55daac3a-57d0-4e2a-977c-e64eab7b40bc
  text: Аугментации заменяют поврежденные или пораженные болезнью органы, улучшая возможности человеческого тела и даже продляя жизнь их обладателям. Все члены Адептус Механикус заменяют свою нечестивую плоть священными технологиями, однако большинство людей заменяет свои органы бионическими аналогами из-за травм или для профессиональных нужд.
- guid: 59002452-776e-4ef4-9933-03769a4713ca
  text: 'Во время большинства {g|Encyclopedia:AreaOfEffect}атак по области{/g} траектория полета снаряда рассчитывается от центра поражаемой зоны. Если {g|Encyclopedia:DetailsOfTheCoverGlossary}укрытие{/g} не располагается между центром поражаемой зоны и персонажем, то оно не сработает и персонаж не сможет воспользоваться укрытием. При этом {g|Encyclopedia:HitSequenceGlossary}шанс попадания{/g} все еще будет учитывать эффективную {g|Encyclopedia:Range}дальность{/g} оружия и дистанцию до цели.

    Если враг находится за укрытием, у него есть шанс воспользоваться им — частичные укрытия дают 35% шанс избежать атаки, а полные укрытия повышают его до 60%. Кроме того, этот шанс может меняться под действием {g|Encyclopedia:Ability}способностей{/g} персонажа, а также положительных или {g|Encyclopedia:NegativeEffectTypesGlossary}негативных эффектов{/g}. Если цель воспользовалась укрытием, она получает {g|Encyclopedia:DamageGlossary}урон{/g} от {g|Encyclopedia:GrazingHit}<b>попадания по касательной</b>{/g}, но все еще может избежать и его, если сумеет успешно {g|Encyclopedia:DodgeGlossary}уклониться{/g}. Базовый шанс уклонения равен <b><u>(30 + {g|Encyclopedia:WarhammerAgility}Ловкость{/g} цели − {g|Encyclopedia:DodgeReduction}снижение уклонения{/g} атакующего)</u>%</b>. Общий шанс уклонения может меняться под действием способностей и эффектов, дающих {g|Encyclopedia:Bonus}бонусы{/g} или штрафы к уклонению цели либо снижению уклонения атакующего. При успешном уклонении враг может полностью избежать урона и покинуть зону поражения атаки по площади — максимальная дистанция такого уклонения равна трем клеткам. Если по какой-то причине цель уклонилась, но не может покинуть зону поражения, она автоматически получает урон от <b>попадания по касательной</b>.'
- guid: 598d3caa-b315-4316-a542-be4530dcde55
  text: '{g|Encyclopedia:HitSequenceGlossary}Шанс попадания{/g} не может быть больше 95%. Каждый 1% выше 95% попадания трансформируется в 1% шанса совершить {g|Encyclopedia:CritChancesAndCritDamageGlossary}критическое попадание{/g}.

    Если враг находится за {g|Encyclopedia:DetailsOfTheCoverGlossary}укрытием{/g}, у него есть шанс воспользоваться им — частичные укрытия дают 35% шанс избежать атаки, полные укрытия повышают его до 60%. Кроме того, этот шанс может меняться под действием {g|Encyclopedia:Ability}способностей{/g} персонажа, а также положительных или {g|Encyclopedia:NegativeEffectTypesGlossary}негативных эффектов{/g}. Если цели не удалось воспользоваться укрытием, она попробует {g|Encyclopedia:DodgeGlossary}уклониться{/g} от атаки. Базовый шанс уклонения равен <b><u>(30 + {g|Encyclopedia:WarhammerAgility}Ловкость{/g} цели − {g|Encyclopedia:DodgeReduction}снижение уклонения{/g} атакующего)</u>%</b>. Общий шанс уклонения может меняться под действием способностей и эффектов, дающих {g|Encyclopedia:Bonus}бонусы{/g} или штрафы к уклонению цели либо снижению уклонения атакующего.

    Цель получает {g|Encyclopedia:DamageGlossary}урон{/g}, если не смогла воспользоваться укрытием и уклониться от одиночного выстрела.'
- guid: 5c254446-f427-4c58-97fd-6a071ce6ae4d
  text: 'Вторая ключевая {g|Encyclopedia:Ability}способность{/g} {g|f:4d2f2a839d2340388d45cf4cf66c947b}Стойкость{/g} дает временное здоровье и отражение урона, равное <b><u>({g|Encyclopedia:Bonus}бонус{/g} {g|Encyclopedia:WarhammerToughness}Выносливости{/g} / 2)</u></b>.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} воина мгновенно восстанавливает ему все {g|Encyclopedia:ActionPoints}ОД{/g} и дает <b><u>(2 × бонус {g|Encyclopedia:WarhammerAgility}Ловкости{/g})</u></b> {g|Encyclopedia:MovementPoints}ОП{/g}, а также снимает ограничение на количество атак в этот {g|Encyclopedia:Turn}ход{/g}.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} воина</b>: {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerStrength}Сила{/g}, Выносливость, Ловкость.

    <b>{g|Encyclopedia:Skills}Навыки{/g} воина</b>: {g|Encyclopedia:SkillCoercion}Напор{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}.

    Воины могут стать {g|Encyclopedia:CareerVanguardGlossary}авангардами{/g}, {g|Encyclopedia:CareerVeteranGlossary}архмилитантами{/g}, {g|Encyclopedia:CareerAssassinGlossary}ассасинами{/g} или {g|Encyclopedia:CareerExecutionerGlossary}палачами{/g}.'
- guid: 5dc33c29-ebdd-4e6d-8ec9-56b8f7dcaa71
  text: 'Каждая дисциплина {g|Encyclopedia:PsykerPowersGlossary}психосил{/g} открывает свои возможности — например, пиромантия позволяет псайкеру создавать пламя и сжигать врагов дотла, тогда как биомантия дает власть над биологическими процессами, протекающими внутри живых существ, и с ее помощью псайкер может усиливать своих союзников и залечивать их раны.

    Когда псайкер выбирает новую {g|Encyclopedia:Ability}способность{/g} {g|Encyclopedia:Career}архетипа{/g}, он вместо этого может овладеть новой психосилой или дисциплиной. Выбрав новую дисциплину, псайкер также получает доступ к базовой психосиле этой дисциплины. Психосилы бывают разных уровней. Прежде чем выбрать психосилу высокого уровня, псайкеру необходимо овладеть психосилой более низкого уровня из той же дисциплины, а также иметь достаточно высокий {g|Encyclopedia:PsyRating}пси-рейтинг{/g}, который можно повысить вместо выбора очередного {g|Encyclopedia:Talent}таланта{/g}, если псайкер достиг требуемого уровня персонажа.

    Все психосилы опасны, поскольку контакт с варпом может вызвать {g|Encyclopedia:PsychicPhenomena}пси-мороки{/g} — жуткие проявления потусторонних сил, снижающие {g|Encyclopedia:MomentumWithDetailsGlossary}моментум{/g} отряда. Простейшие психосилы из доступных псайкерам называются малыми. При их применении есть лишь шанс вызвать {g|Encyclopedia:PerilsOfWarp}пси-морок{/g}, а показатель истончения {g|Encyclopedia:VeilThickness}завесы{/g} повышается на 1.

    Существуют также и куда более опасные, значимые психосилы, которые сопряжены с куда более высоким риском возникновения пси-морока, а завеса при их применении истончается сразу на 3 отметки на шкале. Когда истончение завесы достигает 15, любое применение значимых психосил становится особенно опасным, поскольку может вызвать угрозу варпа.

    Для сотворения некоторых психосил требуется особый проводник, роль которого играет посох псайкера. Чтобы применять такие, как правило, значимые психосилы в виде {g|Encyclopedia:HeroicAct}героического акта{/g} или {g|Encyclopedia:DesperateMeasure}отчаянных мер{/g}, псайкеру необходимо держать в руках соответствующий посох. Мощь таких психосил заметно возрастает в зависимости от качества посоха. Когда псайкер использует посох, чтобы прибегнуть к отчаянным мерам, это всегда провоцирует возникновение угрозы варпа.{g|Encyclopedia:BurningEffect}{/g}'
- guid: 661a54e9-303b-4d0b-9117-b581206321c7
  text: На индустриальных мирах население довольно малочисленно, по сравнению с мирами-ульями или мирами-кузнями. Несмотря на то, что те виды миров тоже посвящены промышленности, на индустриальных мирах большая часть работ выполняется с помощью машин, а производство сильно автоматизировано.
- guid: 6674e55c-0d77-480a-95a3-3d9fa6572576
  text: Избранные, чтобы стать Астропатами, проходят ритуал Связывания Душ, который очищает их тело и дух. Церемония ослепляет Астропатов, но зато они обретают связь с Императором, и их обучают посылать свои мысли сквозь варп на другие концы галактики.
- guid: 6b364192-e4a2-4dd3-ad2e-58bdaa2dcb2b
  text: 'Персонаж не может выбрать другого персонажа целью одиночного выстрела или {g|Encyclopedia:BurstAttacksGlossary}очереди{/g}, если тот находится от него на расстоянии, превышающей максимальную дальность стрельбы.

    Параметры максимальной и эффективной дальности стрельбы могут отличаться у разных единиц оружия.

    Дистанционная {g|Encyclopedia:HitSequenceGlossary}атака{/g} по цели, находящейся в области эффективной дальности стрельбы, не имеет базовых негативных модификаторов от дальности цели.

    При дистанционной атаке по цели, находящейся в области максимальной дальности стрельбы:

    -<indent=5%>{g|Encyclopedia:SingleRangedAttacksGlossary}Одиночный выстрел{/g} имеет шанс попадания вдвое ниже, чем шанс попадания в эффективной области стрельбы.</indent>

    -<indent=5%>Стрельба очередью имеет шанс выстрела по центральной траектории вдвое ниже, а количество возможных траекторий отклонения вдвое больше за счет увеличения разброса и конуса стрельбы.</indent>'
- guid: 6c5f5161-8c08-4191-9e1d-5c58b23b624b
  text: 'Каждая ветка развития {g|Encyclopedia:SoulmarkTypesGlossary}<b>убеждений</b>{/g} Вольного Торговца имеет 5 уровней. Когда игрок набирает необходимое количество очков для получения нового уровня убеждения, ему дается определенный {g|Encyclopedia:Bonus}бонус{/g} — как правило, пассивная или активная {g|Encyclopedia:Ability}способность{/g}.

    В игре есть три типа убеждений, каждое из которых символизирует определенный вид отыгрыша персонажа.

    {g|Encyclopedia:SoulMarkFaith}<b>Догматик</b>{/g} — путь Имперского кредо и спасения Человечества путем уничтожения всего незнакомого, непривычного и чуждого.

    {g|Encyclopedia:SoulMarkHope}<b>Схизматик</b>{/g} — путь идеалиста, верящего, что даже в жестокой вселенной есть место благородству и состраданию.

    {g|Encyclopedia:SoulMarkCorruption}<b>Еретик</b>{/g} — путь Хаоса и растления души. Это убеждение увеличивается не только от решений, но и использования оскверненных предметов и накопления запретных познаний.

    Также в игре есть особые предметы, дополнительные свойства которых открываются только обладателям соответствующих убеждений.'
- guid: 710a912d-d82c-48ec-a329-a3de7c9c681a
  text: 'Призванный наемник получает тот же уровень и то же количество опыта, что и отряд Вольного Торговца на данный момент, при этом наемник не получает никаких предметов и снаряжения.

    Вы можете изменять любого наемника через систему перераспределения умений, аналогичную таковой для главного персонажа.

    Вы можете иметь неограниченное количество наемников в своем распоряжении. При этом в 1 главе есть ограничение по количеству персонажей в отряде (3 за исключением главного героя). Некоторые события в течение 1 главы увеличивают этот лимит до максимума в 6 персонажей.

    Каждый призыв наемника снижает {g|Encyclopedia:ProfitFactorFullGlossary}фактор прибыли{/g} на 1.'
- guid: 7369b249-52b3-4dfd-a7b1-73af4f2ff018
  text: 'Шанс успешно {g|Encyclopedia:Parry}парировать{/g} атаку равен <b><u>(20 + {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g} цели + ее {g|Encyclopedia:Bonus}бонусы{/g} к {g|Encyclopedia:ParryReduction}парированию{/g} − (Ближний Бой атакующего + снижение парирования))</u>%</b>. Если при этом рядом с целью или атакующим персонажем находится союзник с рукопашным оружием, используется правило {g|Encyclopedia:MeleeSuperiority}превосходства в ближнем бою{/g}, которое дает

    1) +10 Ближнего Боя атакующему за каждого союзника с рукопашным оружием рядом с целью

    2) +10 Ближнего Боя цели за каждого союзника с рукопашным оружием рядом с атакующим

    Базовый шанс {g|Encyclopedia:DodgeGlossary}уклониться{/g} от такой атаки равен <b><u>(30 + {g|Encyclopedia:WarhammerAgility}Ловкость{/g} цели − {g|Encyclopedia:DodgeReduction}снижение уклонения{/g} атакующего)</u>%</b>. Общий шанс уклонения может меняться под действием {g|Encyclopedia:Ability}способностей{/g} и эффектов, дающих бонусы или штрафы к уклонению цели либо снижению уклонения атакующего. Цель получает {g|Encyclopedia:DamageGlossary}урон{/g}, если не смогла уклониться от атаки или парировать ее.

    Атаки рукопашным оружием {g|Encyclopedia:AreaOfEffect}по области{/g} совершаются так же, как и одиночные, но {g|Encyclopedia:Test}проверки{/g} против каждой цели в зоне поражения совершаются отдельно. Урон от атак по области получают все цели в зоне поражения — как союзники, так и противники.'
- guid: 77950ea2-fd51-4db9-a719-46ade461d531
  text: Святая Терра, имеющая первостепенное значение в Империуме, классифицируется как A0. Марс и ряд других миров-кузен — как A1, поскольку они менее приоритетны, чем столица. Как и ранг десятины, эстимаре-рейтинг планеты может меняться с течением времени.
- guid: 7b1f63c4-1209-446d-a571-d41d2dd1f97f
  text: 'Урон вычисляется по формуле:

    <b><u>Урон = ((расчет урона со всеми множителями − ({g|Encyclopedia:Deflection}отражение{/g} − {g|Encyclopedia:DeflectionNegation}подавление отражения{/g})) × (1 − ({g|Encyclopedia:WarhammerArmourGlossary}броня{/g} − {g|Encyclopedia:ArmourPenetration}пробитие брони{/g}) / 100))</u></b>

    В первую очередь производится расчет урона со всеми множителями. К показателю урона добавляются модификаторы (например, +2, −3, +4) — они указаны в описании оружия или выбранной {g|Encyclopedia:Ability}способности{/g}. Затем к ним добавляются процентные множители (+20%, +35%, −10%) — например, урон увеличивается на определенный процент в случае {g|Encyclopedia:CritChancesAndCritDamageGlossary}критического попадания{/g} или перегрева плазменного оружия. Также у некоторых противников есть собственные уникальные процентные {g|Encyclopedia:Bonus}бонусы{/g} к урону.

    Из полученной суммы сначала вычитается показатель <b>отражения</b> с учетом подавления отражения (значения выражаются в натуральных числах, например, 2, 4, 5), а затем — показатель брони с учетом <b>пробития</b> (выражается в процентах, например, 20%, 50%).

    Значение урона всегда округляется в меньшую сторону (вплоть до нуля).'
- guid: 7c44e24c-75b2-45a9-8d20-1e8c0a81e592
  text: 'Первое применение {g|Encyclopedia:HeroicAct}<b>героического акта</b>{/g} в бою стоит 75 единиц моментума, с каждым следующим применением стоимость увеличивается на 25 единиц.

    У каждого члена отряда есть параметр {g|Encyclopedia:Resolve}решимость{/g} — базово его значение равно {g|Encyclopedia:Bonus}бонусу{/g} {g|Encyclopedia:Characteristic}<b>характеристики</b>{/g} {g|Encyclopedia:WarhammerFellowship}Общительность{/g}, но этот показатель может меняться под действием различных {g|Encyclopedia:Ability}способностей{/g}, {g|Encyclopedia:Talent}талантов{/g} и эффектов. Показатель решимости используется для расчетов начисления и потери моментума.

    Значение моментума в бою постоянно меняется. Например, на него могут повлиять следующие события:

    1) В начале {g|Encyclopedia:Turn}хода{/g} персонажа, который в этом бою не применял <b>героический акт</b> или {g|Encyclopedia:DesperateMeasure}<b>отчаянные меры</b>{/g}, моментум отряда увеличивается на показатель решимости этого персонажа.

    2) Убивая противника, отряд получает моментум, равный <b><u>(решимость атаковавшего × {g|Encyclopedia:DifficultyTier}ранг{/g} поверженного противника)</u></b>. Ранг зависит от силы врага.

    3) Если {g|Encyclopedia:HitPoints}здоровье{/g} одного из членов отряда опустилось ниже 0, весь отряд теряет моментум, равный <b><u>(решимость павшего союзника × 10)</u></b>.'
- guid: 7cf2fc1d-1f85-4cb2-9456-5d7a1be9c8f9
  text: На многих агромирах целые континенты отданы под выращивание урожая или разведение скота. Другие же покрыты океанами, кишащими рыбой. Третьи предназначены исключительно для поставки питьевой воды.
- guid: 7f4a91dc-936c-4c05-9c0f-6d09b48bcbf0
  text: 'У великого стратега есть набор ключевых {g|Encyclopedia:Ability}способностей{/g} — {g|f:e4e45f74936c4740b7bc03013f6991ba}Стратегический план{/g}: {g|f:7cdf3a1dd3b5477096e008492e738587}передовая{/g}, {g|f:bc99e6ba256f45368bc6bc529e59effd}вторая линия{/g} и {g|f:b1e24d15bb6841d89b9873829f7b3ba5}тыл{/g}. Все они позволяют размечать функциональные зоны на поле боя, с которыми взаимодействуют остальные способности великого стратега, давая различные {g|Encyclopedia:Bonus}бонусы{/g} союзникам и {g|Encyclopedia:Penalty}штрафы{/g} врагам.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} великого стратега применяется к одной из зон. Каждый союзник, находящийся в этой зоне в начале следующего {g|Encyclopedia:Turn}хода{/g} великого стратега, получает {g|Encyclopedia:ExtraTurn}дополнительный ход{/g} с 1 {g|Encyclopedia:ActionPoints}ОД{/g} и 2 {g|Encyclopedia:MovementPoints}ОП{/g}, прежде чем великий стратег начнет действовать.

    Количество предоставляемых ОД увеличивается на 1 (до 3), а количество ОП — на 2 (до 6) за каждого врага, убитого в этой зоне с момента применения героического акта до начала дополнительных ходов.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} великого стратега</b>: {g|Encyclopedia:WarhammerFellowship}Общительность{/g}, {g|Encyclopedia:WarhammerIntelligence}Интеллект{/g}, {g|Encyclopedia:WarhammerPerception}Восприятие{/g}, {g|Encyclopedia:WarhammerWillpower}Воля{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} великого стратега</b>: {g|Encyclopedia:SkillPersuasion}Убеждение{/g}, {g|Encyclopedia:SkillCommerce}Коммерция{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}, {g|Encyclopedia:SkillLogic}Логика{/g}, {g|Encyclopedia:SkillTechUse}Техника{/g}, {g|Encyclopedia:SkillLoreImperium}Знание: Империум{/g}, {g|Encyclopedia:SkillLoreXenos}Знание: Ксеносы{/g}.'
- guid: 806ab694-2ee6-4dc2-ae53-cc468b3828dd
  text: '<b>Фактор прибыли</b> является числовым значением, которое может увеличиваться или, реже, уменьшаться.

    -<indent=5%>ФП не может опускаться ниже 0.</indent>

    -<indent=5%>Если действие должно уменьшить ФП ниже 0, оно становится недоступным.</indent>

    -<indent=5%>Верхнего предела ФП нет.</indent>

    Фактор прибыли может увеличиваться:

    -<indent=5%>при выполнении сюжетных заданий;</indent>

    -<indent=5%>в результате выбора опции в диалоге;</indent>

    -<indent=5%>при выполнении контракта;</indent>

    -<indent=5%>при завершении проекта в колонии.</indent>

    Фактор прибыли может снижаться:

    -<indent=5%>при выполнении сюжетных заданий;</indent>

    -<indent=5%>в результате выбора опции в диалоге;</indent>

    -<indent=5%>при выполнении контракта;</indent>

    -<indent=5%>при старте проекта в колонии.</indent>'
- guid: 83b42bda-6d6b-4449-9251-0f2b76fcadbd
  text: 'Некоторые {g|Encyclopedia:Talent}таланты{/g} и {g|Encyclopedia:Ability}способности{/g} могут менять {g|Encyclopedia:DamageGlossary}урон{/g} от {g|Encyclopedia:PushGlossary}столкновений{/g} и эффекты, срабатывающие при отталкивании. В случаях, когда два эффекта отталкивания происходят одновременно (например, при применении {g|f:bd5f109c46684a09b07fb13743d2a6d7}Оттесняющего удара{/g} молота вместе со способностью {g|f:93d58dfeb6c648858c130e0a902f6ed6}Отталкивающий удар{/g}), расстояние, на которое смещается цель, суммируется.

    Больших существ оттолкнуть сложнее. Существа, занимающие четыре клетки на поле боя, отталкиваются на вдвое меньшее расстояние, а врагов еще большего размера и вовсе нельзя оттолкнуть.'
- guid: 86397ebc-525b-4fc1-bfbd-337692a8414d
  text: Вольные Торговцы — это потомственные аристократы Империума, обладатели священного Торгового Патента, позволяющего им исследовать неизведанные миры за пределами Империума. Они сами вольны решать как им поступать с инопланетными цивилизациями, древними технологиями, новыми планетами или обитателями давно утерянных человеческих миров. В первую очередь, они сами владыки своей судьбы.
- guid: 872b1347-70ae-4b5c-bc49-e21f0aecd29a
  text: 'К общим негативным эффектам относятся:

    -<indent=5%>{g|Encyclopedia:BurningEffect}Горение{/g} — цель каждый {g|Encyclopedia:Round}раунд{/g} получает {g|Encyclopedia:FireDamage}огненный урон{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:BleedingEffect}Кровотечение{/g} — цель получает {g|Encyclopedia:DamageGlossary}урон{/g} в начале каждого {g|Encyclopedia:Turn}хода{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:ToxinEffect}Отравление{/g} — в начале каждого своего хода цель должна пройти проверку Выносливости на {g|Encyclopedia:ResistanceTest}сопротивление{/g}, чтобы попытаться снять этот {g|Encyclopedia:CommonStatusesGlossary}эффект{/g}. При провале цель получает урон.</indent>

    -<indent=5%>{g|Encyclopedia:FatiguedEffect}Утомление{/g} — каждый уровень эффекта дает {g|Encyclopedia:Penalty}штраф{/g} −10 при любых проверках {g|Encyclopedia:WarhammerStrength}Силы{/g}, {g|Encyclopedia:WarhammerToughness}Выносливости{/g} и {g|Encyclopedia:WarhammerAgility}Ловкости{/g}, а также −1 {g|Encyclopedia:MovementPoints}очко передвижения{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:DisturbedEffect}Тревожность{/g} — каждый уровень эффекта даетштраф −10 при прохождении любых проверок {g|Encyclopedia:WarhammerWillpower}Воли{/g} и {g|Encyclopedia:WarhammerFellowship}Общительности{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:PerplexedEffect}Замешательство{/g} — каждый уровень эффекта дает штраф −10 при любых проверках {g|Encyclopedia:WarhammerBallisticSkill}Дальнего Боя{/g}, {g|Encyclopedia:WarhammerWeaponSkill}Ближнего Боя{/g}, {g|Encyclopedia:WarhammerIntelligence}Интеллекта{/g} и {g|Encyclopedia:WarhammerPerception}Восприятия{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:BlindedEffect}Ослепление{/g} — цель получает штраф −30 при любых проверках {g|Encyclopedia:WarhammerBallisticSkill}Дальнего Боя{/g} и {g|Encyclopedia:WarhammerWeaponSkill}Ближнего Боя{/g}, а также −30% к шансу {g|Encyclopedia:DodgeGlossary}уклонения{/g} и {g|Encyclopedia:Parry}парирования{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:StaggeredEffect}Ошеломление{/g} — цель получает штраф −20 при прохождении любых проверок {g|Encyclopedia:WarhammerWeaponSkill}Ближнего Боя{/g}, {g|Encyclopedia:WarhammerBallisticSkill}Дальнего Боя{/g}, {g|Encyclopedia:WarhammerStrength}Силы{/g}, {g|Encyclopedia:WarhammerToughness}Выносливости{/g} и {g|Encyclopedia:WarhammerAgility}Ловкости{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:SlowedEffect}Замедление{/g} — количество {g|Encyclopedia:MovementPoints}очков передвижения{/g} уменьшается на 3.</indent>

    -<indent=5%>{g|Encyclopedia:CalmedWarpEffect}Пси-подавление{/g} — {g|Encyclopedia:PsyRating}пси-рейтинг{/g} снижается на 1.</indent>

    -<indent=5%>{g|Encyclopedia:Stun}Оглушение{/g} — в состоянии оглушения персонаж не может парировать, уклоняться и совершать {g|Encyclopedia:AttackOfOpportunityFullGlossary}атаки по возможности{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:ImmobilisedEffect}Обездвиживание{/g} — обездвиженные цели не восстанавливают очки передвижения в начале своего хода и не могут применять {g|Encyclopedia:Ability}способности{/g}, позволяющие перемещаться или добавляющие очки передвижения.</indent>

    -<indent=5%>{g|Encyclopedia:CantAttackEffect}Неспособность атаковать{/g} — цель не может использовать оружие.</indent>

    -<indent=5%>{g|Encyclopedia:PsychosomaticTraumaEffect}Психосоматическая травма{/g} — цель не может использовать {g|Encyclopedia:PsykerPowersGlossary}психосилы{/g}.</indent>

    -<indent=5%>{g|Encyclopedia:ProneEffect}Опрокидывание{/g} — цель не может совершать действия и получает штраф −30% к парированию и уклонению.</indent>

    Все остальные негативные эффекты считаются уникальными — они встречаются сильно реже и, как правило, их могут накладывать особые противники или способности.'
- guid: 8a731a1d-7136-4b8f-8d6a-9d47d70849d3
  text: 'Новые компоненты можно добыть из многих источников — в боях, во время событий, в колониях или у торговца в системе Фурибундус, предварительно подняв свою {g|Encyclopedia:Reputation}репутацию{/g} с фракцией.

    Помимо сменяемых есть 2 системных компонентов, части корабельной конструкции, которые нельзя менять, но можно улучшать.

    Еще одним ограничением является необходимость установки двух разных типов оружия в {g|Encyclopedia:ProwSpace}носовые{/g} слоты — два одинаковых не будут работать совместно.'
- guid: 8c716395-7fda-4132-87c9-04d70f6bd7f3
  text: 'Палачами, подлинными мастерами различных эффектов периодического урона, могут стать {g|Encyclopedia:CareerFighterGlossary}воины{/g}, {g|Encyclopedia:CareerBladedancerGlossary}танцоры смерти{/g} и {g|Encyclopedia:CareerAdeptGlossary}оперативники{/g}.

    Первая ключевая способность {g|f:47f5b3809fba409b9d27611ef0a77cd3}Секущие удары{/g} позволяет палачу накладывать кровотечение на все цели, получившие от него попадание в ближнем бою. Таким образом, враги палача постоянно страдают от эффектов периодического урона.

    Вторая ключевая способность называется {g|f:4f04773685be45c29927c6740ccf64d8}Принудительное покаяние{/g}. Когда палач накладывает эффект периодического урона на цель, на которую уже действует эффект того же типа, {g|f:4f04773685be45c29927c6740ccf64d8}Принудительное покаяние{/g} заставляет цель немедленно получить дополнительный урон от действующего на нее эффекта. Кроме того, до конца боя будет увеличен уровень всех эффектов периодического урона того же типа, которые будут наложены на цель позже.

    Когда палач применяет третью ключевую способность {g|f:5c06542194b74ecc922b92f3543703d2}По больному{/g}, его следующая атака заставляет цель мгновенно получить увеличенный в несколько раз урон от действующих на нее эффектов периодического урона. После этого эффекты снимаются.

    Героический акт палача немедленно накладывает горение, кровотечение и отравление на всех противников в бою, при этом уровень этих эффектов существенно повышается. Теперь время работает на вас, а враги станут легкой добычей.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} палача</b>: {g|Encyclopedia:WarhammerIntelligence}Интеллект{/g}, {g|Encyclopedia:WarhammerStrength}Сила{/g}, {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerToughness}Выносливость{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} палача</b>: {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillLoreXenos}Знания: Ксеносы{/g}, {g|Encyclopedia:SkillLoreImperium}Знания (Империум){/g}.'
- guid: 8c85f768-a4b0-4654-882a-c58255183721
  text: 'Вероятность сквозного пробития зависит от параметра сквозного пробития оружия (чаще всего равен 50%), {g|Encyclopedia:ArmourPenetration}пробития брони{/g} оружия и {g|Encyclopedia:WarhammerArmourGlossary}брони{/g} цели. Шанс равен <b><u>(сквозное пробитие + пробитие брони − броня цели)</u>%</b>. {g|Encyclopedia:DamageGlossary}Урон{/g}, наносимый следующей цели, равен <b><u>(предыдущий процент × изначальный урон первой цели)</u></b>, однако этот урон не может превышать 100% от нанесенного первой цели урона. Сквозное пробитие может произойти повторно после нанесения урона второй цели, однако вероятность этого будет еще ниже за счет брони как первой, так и второй цели. Один выстрел может пробить насквозь сколь угодно много целей, при условии что постоянно уменьшающийся из-за брони шанс сквозного пробития превышает 0%.

    Каждая {g|Encyclopedia:HitSequenceGlossary}атака{/g} в рамках сквозного пробития рассчитывается отдельно, и часть таких атак могут оказаться {g|Encyclopedia:CritChancesAndCritDamageGlossary}критическими попаданиями{/g} или вызвать одно или несколько срабатываний {g|Encyclopedia:Talent}талантов{/g} и эффектов.

    Некоторые {g|Encyclopedia:Ability}способности{/g}, таланты и особенности оружия могут повысить шанс сквозного пробития. Например, способность {g|Encyclopedia:CareerHunterGlossary}охотника за головами{/g} {g|f:e92f1c119dd64d3981fd750a56e5aab2}Выстрел насквозь{/g} увеличивает параметр сквозного пробития на целых 100%. Применяя эту способность, охотник может повысить шанс до более чем 100% — в таком случае при сквозном пробитии выстрел нанесет урон большему числу врагов, прежде чем вероятность опустится ниже 100%.'
- guid: 8fbfc490-2c7b-40da-9a1d-d53915d53880
  text: 'Во время стрельбы из {g|Encyclopedia:Range}дистанционного оружия{/g} <b>шанс критического попадания</b> повышается на 1% за каждый процент попадания по цели выше 95%. В {g|Encyclopedia:MeleeAttacksGlossary}ближнем бою{/g} <b>шанс критического попадания</b> увеличивается на 1% за каждую единицу превосходства — разницы между значениями {g|Encyclopedia:Characteristic}характеристики{/g} {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g} атакующего и его цели.

    <b>Критический {g|Encyclopedia:DamageGlossary}урон{/g}</b> также зависит и от характеристики выбранного оружия. Значение <b>критического урона</b> вычисляется до вычитания защиты и прибавляется к прочим процентным источникам увеличения урона, не умножая их.'
- guid: 9569ba0b-73e3-48f8-8e68-44af403341c7
  text: В Просторе Коронус есть всего несколько молодых Имперских колоний, его природные ресурсы практически непочаты, а варп-пространство коварно и неизведанно. Пока Вольные Торговцы соревнуются друг с другом за тайные и явные ресурсы в попытках обосновать свои протектораты, пираты, ксеносы и слуги Темных богов терроризируют Простор, желая обречь человечество на ужас и погибель.
- guid: 97a069be-add5-4321-89ab-ff0bf47a3838
  text: 'Вторая ключевая {g|Encyclopedia:Ability}способность{/g} {g|f:c3d6e29e74e440a79cb243e4e93e0501}Смерть свыше{/g} позволяет танцору смерти прыгнуть на небольшое расстояние и после приземления нанести урон всем противникам на соседних клетках. Эту способность можно использовать сколько угодно раз за ход, но для каждого применения требуется заряд. Заряды можно получать за убийства противников. {g|f:c3d6e29e74e440a79cb243e4e93e0501}Смерть свыше{/g} значительно улучшает мобильность танцора смерти и предоставляет ему возможность совершать серии убийств.

    Его героический акт — это смертоносная комбинация прыжков и ударов. Танцор смерти прыгает к цели, как при выполнении {g|f:c3d6e29e74e440a79cb243e4e93e0501}Смерти свыше{/g}, а затем наносит удар мечом. Эта последовательность повторяется несколько раз против случайных целей в радиусе действия.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} танцора смерти</b>: {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerToughness}Выносливость{/g}, {g|Encyclopedia:WarhammerAgility}Ловкость{/g}, {g|Encyclopedia:WarhammerStrength}Сила{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} танцора смерти</b>: {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}.

    Танцоры смерти могут стать {g|Encyclopedia:CareerVeteranGlossary}архмилитантами{/g}, {g|Encyclopedia:CareerAssassinGlossary}ассасинами{/g}, {g|Encyclopedia:CareerTacticianGlossary}мастерами-тактиками{/g} или {g|Encyclopedia:CareerExecutionerGlossary}палачами{/g}.'
- guid: 9969e124-fef9-40f6-bc13-ab8a23f0f4ea
  text: Формирует верования триллионов людей на бесчисленных мирах галактики. Основой могущества Экклезиархии является Культ Империалис, также известный как Имперское кредо. Любые радикальные отклонения от его догматов и теологии считаются ересью и жестоко пресекаются.
- guid: 9e6df687-4169-4d7b-add1-78b804983b53
  text: 'Для определения траектории выстрелов в рамках очереди используется {g|Encyclopedia:Characteristic}<b>характеристика</b>{/g} персонажа {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}.

    Выстрелы в рамках очереди могут быть направлены по прямой, с отклонением или с незначительным отклонением в любую из сторон. В эффективном радиусе оружия траектории с незначительным отклонением совпадают с центральной линией, а выстрелы со стандартным отклонением смещаются на 1 клетку вправо или влево от центральной линии. В максимальном радиусе незначительное отклонение означает смещение на 1 клетку от центральной линии, а стандартное отклонение – смещение на 2 клетки.

    Базовый шанс направить выстрелы по центральной линии или с незначительным отклонением равен <b><u>(40 + Дальний Бой / 2)</u>%</b> — этот показатель не может быть ниже 30% и выше 95%. Эти выстрелы с равной вероятностью распределяются между центральной линией и незначительным отклонением. Остальные выстрелы выполняются со стандартным отклонением.

    Если выстрел {g|Encyclopedia:HitSequenceGlossary}попадает в цель{/g} за {g|Encyclopedia:DetailsOfTheCoverGlossary}укрытием{/g} на любой из траекторий, цель может воспользоваться шансом избежать атаки. Частичное укрытие дает шанс избежать атаки, равный 35%, а полное увеличивает его до 60%. Этот шанс может меняться под действием {g|Encyclopedia:Ability}способностей{/g} персонажа, а также положительных или {g|Encyclopedia:NegativeEffectTypesGlossary}негативных эффектов{/g}. Если воспользоваться укрытием не удалось, цель попробует {g|Encyclopedia:DodgeGlossary}уклониться{/g} от атаки. Базовый шанс уклонения равен <b><u>(30 + {g|Encyclopedia:WarhammerAgility}Ловкость{/g} цели − {g|Encyclopedia:DodgeReduction}снижение уклонения{/g} атакующего)</u>%</b>. Общий шанс уклонения может меняться под действием способностей и эффектов, дающих {g|Encyclopedia:Bonus}бонусы{/g} или штрафы к уклонению цели либо снижению уклонения атакующего. Цель получает {g|Encyclopedia:DamageGlossary}урон{/g}, если не смогла воспользоваться укрытием и уклониться от {g|Encyclopedia:SingleRangedAttacksGlossary}одиночного выстрела{/g}.

    Для выстрелов по центральной линии действует правило: каждый 1% шанса попадания выше 95% трансформируется в 1% шанса совершить {g|Encyclopedia:CritChancesAndCritDamageGlossary}критическое попадание{/g}. При этом <b>шанс критического попадания</b> рассчитывается отдельно для каждого выстрела.

    Для всех выстрелов очереди действуют правила {g|Encyclopedia:OverpenetrationFullGlossary}сквозного пробития{/g} и {g|Encyclopedia:PushGlossary}<b>отталкивания</b>{/g}.'
- guid: a00214df-5579-4c8d-8711-6b9c497ae311
  text: Эти {g|Encyclopedia:Talent}таланты{/g} более сильные, чем обычные, и большинство из них универсальны — только редкие требуют особых условий (например, умение применять {g|f:4955b43454f6488f82892e166c76c995}Рывок{/g} или {g|Encyclopedia:PsykerPowersGlossary}психосилы{/g}).
- guid: a35617af-f78c-440d-9773-33da6d6fa1de
  text: 'Сбор десятины — неотъемлемая часть экономики Империума. Условия поставок определяются Администратумом и варьируются от планеты к планете: ее могут собирать как ежедневно, так и раз в 50 лет. Что конкретно изымается — еда, промышленные товары или даже люди — обуславливается рангом десятины.

    Черные корабли приходят за своей данью независимо от сбора имперской десятины, и мирам необходимо уплачивать оба налога, дабы не навлечь на себя гнев высших властей.'
- guid: ad253aa5-63df-4f4a-b4c5-cb02ba8a57e8
  text: 'Ключевая пассивная {g|Encyclopedia:Ability}способность{/g} авангарда {g|f:fc83a8ac57e54db59c3bb70083dc385c}Знак стойкости{/g} позволяет ему накапливать уровни одноименного эффекта, которые он получает за каждую атаку по себе.

    Каждый {g|Encyclopedia:UnyieldingBeacon}знак стойкости{/g} увеличивает {g|Encyclopedia:Resolve}решимость{/g} авангарда на 1 до максимума 15. Союзники в радиусе двух клеток получают 1/5 от этого {g|Encyclopedia:Bonus}бонуса{/g}.

    Кроме того, авангард может накапливать {g|Encyclopedia:TemporaryWounds}временное здоровье{/g} до начала своего следующего {g|Encyclopedia:Turn}хода{/g}.

    Если оставшееся количество временного здоровья меньше количества знаков стойкости, оно становится равным количеству этих знаков, даже если в начале своего хода у авангарда не было временного здоровья.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} авангарда позволяет ему до начала своего следующего хода атаковать врагов каждый раз, когда они нападают на союзников авангарда в радиусе 3 клеток от него.

    Авангард также отвечает атакой на каждую атаку до начала своего следующего хода.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} авангарда</b>: {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerToughness}Выносливость{/g}, {g|Encyclopedia:WarhammerFellowship}Общительность{/g}, {g|Encyclopedia:WarhammerWillpower}Воля{/g}, {g|Encyclopedia:WarhammerStrength}Сила{/g}

    <b>{g|Encyclopedia:Skills}Навыки{/g} авангарда</b>: {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}, {g|Encyclopedia:SkillPersuasion}Убеждение{/g}, {g|Encyclopedia:SkillCoercion}Напор{/g}'
- guid: b41bc8de-d5c3-4a09-9f05-bc4184707805
  text: 'Эффекты периодического урона наносят существу заданное количество урона в начале его {g|Encyclopedia:Turn}хода{/g}.

    Могут сниматься предметами или {g|Encyclopedia:Ability}способностями{/g}.

    Например, эффект {g|Encyclopedia:BleedingEffect}кровотечение{/g} наносит урон в начале хода и имеет бесконечную длительность, но может быть снят с помощью медкомплекта.

    Для некоторых эффектов, наносящих урон ({g|Encyclopedia:ToxinEffect}отравление{/g}, кровотечение, {g|Encyclopedia:BurningEffect}горение{/g} и т. д.), рядом указана интенсивность.

    Например: горение (4) означает, что эффект наносит 4 урона каждый ход, пока не будет снят.

    На это значение могут влиять различные {g|Encyclopedia:Talent}таланты{/g}, способности и предметы снаряжения.

    Интенсивность не суммируется. При наложении эффекта с большей интенсивностью он заменяет аналогичный эффект с меньшей интенсивностью.

    Например, если существо, на которое действует горение (5), атаковано из огнемета, накладывающего горение (6), то на существо будет действовать горение (6). Если после этого существо атакуют из огнемета с горением (3), на него по-прежнему будет действовать горение (6).

    Модификаторы {g|Encyclopedia:Characteristic}характеристик{/g} и параметров могут как понижать какие-либо показатели персонажа, так и повышать их. Обычно они являются временными и снимаются через определенное количество раундов или в конце боя. Например, эффект {g|Encyclopedia:BlindedEffect}ослепление{/g} понижает {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g} и {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g} на 30, а шанс {g|Encyclopedia:DodgeGlossary}уклонения{/g} и {g|Encyclopedia:Parry}парирования{/g} — на 30%.

    Для всех эффектов минимальное значение характеристики равно 1. Никакой эффект не может снизить характеристику ниже этого значения.

    Контроль лишает персонажа возможности совершать какие-либо действия.

    Такие статусы всегда имеют ограниченное время действия.

    Например, эффект {g|Encyclopedia:ImmobilisedEffect}обездвиживание{/g} лишает персонажа способности перемещаться.'
- guid: b68b6099-f96e-4780-9053-77b9691f4959
  text: Совмещая роли искателей приключений, воинов и послов Машинного культа, они исследуют галактику с помощью своих Эксплораторских флотов. Эксплораторы обладают завидным могуществом и множеством ресурсов, а в их распоряжении находятся бесчисленные слуги, сервиторы и адепты.
- guid: b7c12ce9-9960-4317-9a43-f8f02bb6cc0f
  text: 'Ключевая пассивная {g|Encyclopedia:Ability}способность{/g} ассасина, {g|f:74a1e39f3d0c4cab828d49d4acd54851}Знать слабые места{/g}, позволяет им видеть уязвимые точки у противника, {g|Encyclopedia:HitSequenceGlossary}удар{/g} по которым будет наиболее эффективным и нанесет дополнительный {g|Encyclopedia:DamageGlossary}урон{/g} в размере 10% от {g|Encyclopedia:MaxWounds}максимального здоровья{/g} цели.

    Ключевая активная способность, {g|f:e2af8c0124f94ca5b9a8b3f91982908a}Поиск слабого места{/g}, позволяет ассасину создавать дополнительные {g|Encyclopedia:Opening}слабые места{/g} на ближайшей к персонажу стороне.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} ассасина проводит атаку по цели. Эта атака всегда попадает и наносит на 50% больше урона, а также дополнительный урон в объеме 25% от потерянного здоровья цели.

    Для этой атаки {g|Encyclopedia:DodgeGlossary}уклонение{/g}, {g|Encyclopedia:DodgeReduction}снижение уклонения{/g}, {g|Encyclopedia:ArmourPenetration}пробитие брони{/g} и {g|Encyclopedia:ParryReduction}снижение парирования{/g} ассасина удвоены.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} ассасина</b>: {g|Encyclopedia:WarhammerAgility}Ловкость{/g}, {g|Encyclopedia:WarhammerPerception}Восприятие{/g}, {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}

    <b>{g|Encyclopedia:Skills}Навыки{/g} ассасина</b>: {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillCoercion}Напор{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}.'
- guid: bbe8251e-8a7d-4ed9-a27c-77c562daa8b7
  text: 'Также для каждого поста можно получить одну особую способность. Такая способность требует заряда, накапливающегося каждый раунд боя, дополнительно с его окончанием и в некоторых событиях вне боя. Можно зарядить сразу несколько таких способностей на разных постах, но использовать можно только одну особую способность в каждом бою.

    На посты корабля лучше назначать офицеров из числа компаньонов. Для каждого поста требуется определенный навык или условие, зато у компаньонов есть специальные умения, усиливающие некоторые корабельные способности.'
- guid: c43f5e0d-8795-4246-be03-2d8d3c143f17
  text: Братья Караула Смерти не являются его постоянными членами — прочие ордена Астартес откомандировывают их для выполнения определенной миссии или на определенный срок. Миссии ордена проходят в условиях жесточайшей секретности, а информация о его существовании доступна далеко не каждому. Все, кто вступил в это таинственное братство, связаны множеством древних обетов, и эти клятвы сохраняют завесу тайны вокруг деятельности Караула лучше, чем любые другие предохранительне меры.
- guid: c4e06299-2343-45ae-bf35-849e97aaf098
  text: Выбрав сообщение в логе боя, вы можете подробнее узнать о факторах, повлиявших на результативность и эффективность действий как противников, так и ваших персонажей, например, увидеть источники дополнительного урона, защиты и шанса попадания.
- guid: c7e5a029-cf5b-4ceb-95dd-9d921ff30c0c
  text: Хаос воплощают вредоносные сущности, называемые Богами Хаоса, и связанные с ними демоны. Этим термином также называют смертных, присягнувших искажающим силам Хаоса.
- guid: cbab1363-bf13-4831-939e-99ef78c4f673
  text: Среди Вольных Торговцев и их приближенных Футфол славится не только своим портом. Здесь можно собрать информацию о конкурентах, воспользоваться широким ассортиментом нелегальных услуг, набрать новых рекрутов или принять участие в смертоносных интригах. На Футфоле также можно починить или переоборудовать свое судно.
- guid: cc8c7513-2430-4fdd-8c85-38c71cd8156a
  text: 'Вторая ключевая {g|Encyclopedia:Ability}способность{/g}, {g|f:5bfccf14d8604ae1a041fb347fb8f19f}Особое поручение{/g}, мгновенно дает союзному персонажу {g|Encyclopedia:ExtraTurn}дополнительный ход{/g} без {g|Encyclopedia:MovementPoints}ОП{/g}, но с 2 {g|Encyclopedia:ActionPoints}ОД{/g}.

    Если союзник находится под действием {g|f:9c78e44bf8ff44a9afff8370c673c9ad}Приказа командира{/g} и убивает врага до конца хода офицера, то он получает <b><u>(2 × {g|Encyclopedia:Bonus}бонус{/g} ОБЩ офицера)</u></b> {g|Encyclopedia:MomentumWithDetailsGlossary}моментума{/g}.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} офицера мгновенно дает дополнительный ход союзнику с полными ОП и ОД. Этот союзник не имеет лимита на атаки до конца этого {g|Encyclopedia:Turn}хода{/g}.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} офицера</b>: {g|Encyclopedia:WarhammerFellowship}Общительность{/g}, {g|Encyclopedia:WarhammerWillpower}Воля{/g}, {g|Encyclopedia:WarhammerToughness}Выносливость{/g}, {g|Encyclopedia:WarhammerWeaponSkill}Ближний Бой{/g}, {g|Encyclopedia:WarhammerBallisticSkill}Дальний Бой{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} офицера</b>: {g|Encyclopedia:SkillPersuasion}Убеждение{/g}, {g|Encyclopedia:SkillCoercion}Напор{/g}, {g|Encyclopedia:SkillCommerce}Коммерция{/g}, {g|Encyclopedia:SkillLoreImperium}Знания: Империум{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}.

    Офицеры могут стать {g|Encyclopedia:CareerVanguardGlossary}авангардами{/g}, {g|Encyclopedia:CareerStrategistGlossary}великими стратегами{/g} или {g|Encyclopedia:CareerTacticianGlossary}мастерами-тактиками{/g}.'
- guid: cd630505-014b-401e-8bed-7e3852e8b2a5
  text: 'Когда противники с противоположной от укрытия стороны атакуют персонажа, он выполняет {g|Encyclopedia:Test}проверку{/g} использования укрытия. В случае успеха персонаж избегает {g|Encyclopedia:DamageGlossary}урона{/g} от атаки. При этом, если укрытие может быть разрушено, оно получит урон вместо персонажа.

    Укрытия не могут защитить персонажа от {g|Encyclopedia:MeleeAttacksGlossary}атак в ближнем бою{/g}. {g|Encyclopedia:AreaOfEffect}Атаки по области{/g} (в том числе рукопашным оружием) могут полностью уничтожить разрушаемое укрытие.

    <b>Полные</b> и <b>частичные укрытия</b> отличаются шансом избежать вражеской атаки. <b>Частичные укрытия</b> защищают персонажа от атак, источник которых находится хотя бы через одну клетку от укрытия, а не стоит вплотную к нему.

    <b>Полные укрытия</b> закрывают персонажа целиком с одной из сторон. Чтобы совершить атаку из-за укрытия, персонаж должен находиться у самого его края. При выстреле он автоматически вышагивает на незанятую клетку рядом, проводит атаку и возвращается обратно в укрытие.

    Противники могут стрелять в персонажа, стоящего за <b>полным укрытием</b>, только если они видят клетку, на которой он находится, или клетку, на которую он вышагивает для совершения своих атак.{g|Encyclopedia:Range}{/g}'
- guid: d3f97d9a-ea0d-4c46-a003-af6f428bb8f1
  text: 'Неподкупные на службе и безжалостные при исполнении приговора, арбитры вершат суд над преступниками и бдительно следят за своевременной выплатой имперской десятины, обязательной для большинства миров. Их появление неспроста вызывает трепет: неисчислимы имена тех, кто в жалкой попытке попрать священный порядок Империума был стерт из анналов истории залпом дробовика Адептус Арбитес.'
- guid: e1cbca22-300c-4bd2-ae21-0b43adeb2e2d
  text: 'Получить {g|Encyclopedia:ScrapSpace}металлолом{/g} можно с разбитых в бою кораблей врага и из некоторых других источников.

    В случае острой нехватки металлолома на ремонт можно разобрать ранее улучшенный системный компонент и вернуть часть металлолома, затраченного на улучшение.'
- guid: e66dc27b-a1eb-4fd6-b467-a1f35d056b4b
  text: 'При попадании есть шанс, что атака окажется критической и нанесет двойной урон. Этот шанс также задается корабельным ауспексом.

    В случае наличия у цели <b>пустотных щитов</b> урон от попавшей атаки поглощается ими. Оставшийся непоглощенным урон уменьшается броней, после чего цель получает остаток как финальный урон атаки.'
- guid: ece57084-7591-477d-906d-e3d0f3f166ca
  text: В отличие от Низкого готического, на котором говорит любой гражданин Империума от жалкого серфа до Верховного лорда Терры, на Высоком готическом пишутся священные тексты, наименования древних организаций и потомственные титулы. Владеют им отнюдь немногие, а устно его применяют лишь для религиозных обрядов и официальных церемоний.
- guid: ed76dbc5-9d22-445e-a10e-63f93b8a66a0
  text: При развитии корабля можно улучшать его очередность специальными умениями и опережать врагов в очереди хода.
- guid: eea25729-0082-48b6-a382-6e00a0b66f45
  text: Сердце гигантской бюрократии, контролирующей правительство Империума Человечества. Администратум поделен на бесчисленное множество департаментов, отделов и ведомств, управляющих миллионами человеческих миров по всей галактике.
- guid: ef9a72bc-ddf8-46b6-9df3-67fd17aacc31
  text: В секторе Каликсис расположено множество населенных значимых миров, однако сам он расположен на значительном удалении от основных секторов Империума. Первым губернатором сектора был Друз, один из наиболее талантливых генералов Ангевина и ныне почитаемый как святой Имперского культа. Сектор Каликсис плотно связан, политически и логистически, с фронтиром Простора Коронус — единственный известный путь в него пролегает через Проход Коронус, стабильный, но опасный варп-маршрут, который был проложен на внешней границе сектора Каликсис.
- guid: f24a1586-5c33-4027-878c-e5d30bbf89e7
  text: 'Формула {g|Encyclopedia:Damage}расчета урона{/g} с учетом защиты от {g|Encyclopedia:DamageGlossary}урона{/g} выглядит так:

    <b><u>Урон = ((расчет урона со всеми множителями − ({g|Encyclopedia:Deflection}отражение{/g} − {g|Encyclopedia:DeflectionNegation}подавление отражения{/g})) × (1 − (({g|Encyclopedia:WarhammerArmourGlossary}броня{/g} − {g|Encyclopedia:ArmourPenetration}пробитие брони{/g}) / 100)))</u></b>

    {g|Encyclopedia:Bonus}Бонусы{/g} и {g|Encyclopedia:Penalty}штрафы{/g}, влияющие на урон, включая {g|Encyclopedia:CritChancesAndCritDamageGlossary}критический урон{/g}, суммируются до вычисления защиты от урона.'
- guid: f35854cc-8623-482f-be9c-560fa71a8ce8
  text: '{g|Encyclopedia:LanceWeaponSpace}<b>Лэнс-излучатели</b>{/g} имеют высокую дальнобойность и урон, но при этом громоздкие и часто обладают ограниченным {g|Encyclopedia:FiringArcSpace}сектором стрельбы{/g}. Они устанавливаются на {g|Encyclopedia:ProwSpace}носу{/g} корабля, а их облегченные версии — на {g|Encyclopedia:DorsalSpace}башнях{/g}. Лэнс-излучатели наносят урон несколькими короткими импульсами, но при этом броня применяется только один раз, на всю атаку орудия целиком. Поэтому они особенно эффективны против высокобронированных целей — крупных кораблей.

    {g|Encyclopedia:MacroCannonsSpace}<b>Макропушки</b>{/g} не так дальнобойны, но их часто больше и каждый их выстрел считается независимым. Корабли с толстой броней могут сильно снизить урон макропушек.

    {g|Encyclopedia:TorpedoLaunchersSpace}<b>Торпедные аппараты</b>{/g} выпускают торпедные залпы — отдельные объекты на поле. Торпеды начинают ходить в следующем раунде и управляются игроком.

    По торпедам можно стрелять, как и по кораблям. Но у них нет параметра {g|Encyclopedia:HullIntegritySpace}целостности{/g} — при каждом попадании любого оружия уничтожается одна торпеда из залпа, снижая его потенциальный урон.

    У торпед есть 2 вида урона — прямой и по области. Когда {g|Encyclopedia:TorpedoSalvoSpace}торпедный залп{/g} попадает в цель, каждая оставшаяся в залпе торпеда атакует цель. При такой атаке торпеда, с той же вероятностью, что и у обычного оружия корабля, попадает точно в корабль и взрывается внутри, нанося большой урон, но только самой цели. Если же случился промах, торпеда взрывается снаружи, нанося несколько меньший урон и самой цели, и всем остальным объектам в радиусе 1 клетки. Также торпеды всегда можно взрывать способностью самоуничтожения, нанося такой же как при промахе урон по области.'
- guid: f4026cd5-7cec-4bee-bfc4-c5b10e9879c1
  text: 'Персонаж или объект могут поменять параметр брони с помощью снаряжения или особых {g|Encyclopedia:Ability}способностей{/g}.

    При расчете {g|Encyclopedia:DamageGlossary}урона{/g} атаки параметр брони цели может быть, в свою очередь, снижен характеристикой {g|Encyclopedia:ArmourPenetration}пробития брони{/g} этой атаки.

    При этом пробитие брони не может уменьшить броню ниже нуля.'
- guid: f726259a-9dcc-436f-8f43-483f5e3caf90
  text: '{g|Encyclopedia:PhysicalDamage}<b>Физический</b> урон{/g} обычно наносится снарядами дальнобойных орудий и {g|Encyclopedia:MeleeAttacksGlossary}рукопашным оружием{/g}. Типы физического {g|Encyclopedia:DamageGlossary}урона{/g}:

    -<indent=5%><b>Ударный</b>: все, что может нанести удар тупым предметом, например тупое оружие, удары без оружия, болты и взрывы.</indent>{g|Encyclopedia:Traumas}{/g}

    -<indent=5%>{g|Encyclopedia:RendingDamage}<b>Раздирающий</b>{/g}: все, что имеет острый край, например холодное оружие, и острые снаряды, например сюрикены.</indent>

    -<indent=5%><b>Пронзающий</b>: любые проникающие снаряды, такие как пули или игольчатые боеприпасы.</indent>

    -<indent=5%><b>Силовой</b>: все, что действует за счет поля, разрывающего молекулярные связи материи. Обычно это силовое оружие, такое как силовой меч, силовая булава или силовой топор.</indent>{br}

    {g|Encyclopedia:EnergyDamage}<b>Энергетический</b>{/g} обычно наносят различные химические вещества, огонь, электричество и энергетические лучи. Эта группа включает:

    -<indent=5%><b>Огненный</b>: все, что поджигает цель.</indent>

    -<indent=5%><b>Электрический</b>: все, что поражает цель электрическим током.</indent>

    -<indent=5%><b>Токсичный</b>: все, что наносит урон ядом, едкой кислотой и прочим.</indent>

    -<indent=5%><b>Термический</b>: все энергетическое и плазменное оружие.</indent>{br}

    {g|Encyclopedia:IrreducibleDamage}<b>Неснижаемый</b> урон{/g} игнорирует {g|Encyclopedia:WarhammerArmourGlossary}броню{/g} и включает следующие типы:

    -<indent=5%><b>Варп</b>: любой вид воздействия энергий варпа.</indent>

    -<indent=5%><b>Психический</b>: все, что повреждает нервную систему органических целей. Неорганические цели, такие как машины и физические {g|Encyclopedia:DetailsOfTheCoverGlossary}укрытия{/g}, невосприимчивы к этому типу урона.</indent>

    -<indent=5%><b>Машинный</b>: все, что влияет исключительно на машины и технологии. Органические цели и немеханические физические объекты невосприимчивы к этому типу урона.</indent>{br}

    Также существует {g|Encyclopedia:DirectDamage}<b>прямой</b> урон{/g}. Урон этого типа нельзя уменьшить за счет характеристик или {g|Encyclopedia:Bonus}бонусов{/g} цели.'
- guid: f77fd9b0-8599-4537-8e3b-d74f3644a5b2
  text: 'Ключевая пассивная {g|Encyclopedia:Ability}способность{/g} архмилитанта, {g|f:7f7d109653f24774939f758d094b8812}Универсальность{/g}, позволяет ему получать уровни эффекта этой способности при каждой атаке, тип которой отличается от типа предыдущей атаки архмилитанта.

    Типами атак в данном контексте являются: {g|Encyclopedia:SingleRangedAttacksGlossary}одиночный выстрел{/g}, рукопашная атака (одиночная или {g|Encyclopedia:BurstAttacksGlossary}очередью{/g}), рукопашная атака по области, {g|Encyclopedia:Range}дистанционная{/g} атака по области, выстрел очередью.

    За каждый уровень эффекта "универсальность" архмилитант получает +5 к {g|Encyclopedia:WarhammerWeaponSkill}Ближнему Бою{/g} и {g|Encyclopedia:WarhammerBallisticSkill}Дальнему Бою{/g}.

    Если архмилитант накапливает 4 или больше уровней эффекта, то его атаки начинают наносить <b>+<u>(3 × {g|Encyclopedia:Bonus}бонус{/g} Ближнего Боя)</u>%</b> или <b>+<u>(3 × бонус Дальнего Боя)</u>%</b> {g|Encyclopedia:DamageGlossary}урона{/g} дополнительно — в зависимости от того, какое значение выше.

    {g|Encyclopedia:HeroicAct}Героический акт{/g} архмилитанта позволяет ему проводить на 1 атаку больше каждый {g|Encyclopedia:Turn}ход{/g} до конца боя, включая ход применения героического акта. Первая атака после использования героического акта, а впоследствии и первая атака в каждый ход стоит 0 {g|Encyclopedia:ActionPoints}ОД{/g}.

    <b>Важные {g|Encyclopedia:Characteristic}характеристики{/g} архмилитанта</b>: Ближний Бой, Дальний Бой, {g|Encyclopedia:WarhammerAgility}Ловкость{/g}, {g|Encyclopedia:WarhammerStrength}Сила{/g}, {g|Encyclopedia:WarhammerToughness}Выносливость{/g}.

    <b>{g|Encyclopedia:Skills}Навыки{/g} архмилитанта</b>: {g|Encyclopedia:SkillAwareness}Наблюдательность{/g}, {g|Encyclopedia:SkillMedicae}Медицина{/g}, {g|Encyclopedia:SkillCarouse}Устойчивость{/g}, {g|Encyclopedia:SkillAthletics}Атлетика{/g}, {g|Encyclopedia:SkillDemolition}Взрывотехника{/g}.'
- guid: fa711804-f8ae-48eb-b7ad-51b0582535c7
  text: 'При получении <b>K</b> ранений персонаж снимает с себя все ранения и получает {g|Encyclopedia:Traumas}травму{/g}.

    Первые <b>M</b> {g|Encyclopedia:Round}раундов{/g} (или <b>M×6</b> cекунд во внебоевой обстановке) ранение называется свежим. После истечения срока оно превращается в {g|Encyclopedia:Injury}старое ранение{/g}.

    Разные типы ранений лечатся по-разному.

    Параметры <b>N</b>, <b>K</b>, <b>M</b> изменяются относительно выбранной сложности игры. Для сложности "Бесстрашная" эти значения находятся в районе <b>50%/3/3</b>.

    Персонаж избавляется от травм следующим образом:

    -<indent=5%>Отдыхом на корабле / в специально отведенных на зонах местах. На корабле травмы излечиваются как только персонаж заходит на мостик. Отдельных действий (таких как сон в кровати, разговор с медиками, проматывание времени и т.п.) не требуется.</indent>

    <indent=5%>В случае, если персонажу недоступен возврат на корабль, на локации находятся точки для отдыха и/или восстановления (например, медикае-станция, дружественный NPC-лекарь или просто безопасное место, где можно отдохнуть). Взаимодействие может выполняться как через диалог, так и просто кнопкой "исцелить травмы".</indent>

    -<indent=5%>Редкими и дорогими расходными предметами.</indent>

    Персонаж избавляется от ранений следующим образом:

    -<indent=5%>Отдыхом на корабле / в специально отведенных на зонах местах.</indent>

    -<indent=5%>Редкими и дорогими расходными предметами.</indent>

    -<indent=5%>Применение медкомплекта автоматически снимает одно свежее ранение. Если свежих ранений нет, персонаж выполняет {g|Encyclopedia:Test}проверку{/g} навыка {g|Encyclopedia:SkillMedicae}Медицина{/g} со сложностью 0. В случае успеха медкомплект снимает одно старое ранение.</indent>'
- guid: fbd5bbb6-1f7e-42f0-9c42-70a8bf92f3f6
  text: 'Например, персонаж пытается обезвредить ловушку. Сложность этого испытания −10, а навык Взрывотехника персонажа равен 50.

    Эмулируется бросок кубика, в результате которого игрок получает результат 75.

    Так как для успеха персонажу нужно было выкинуть 40 или ниже (Взрывотехника + модификатор сложности = 50 + (−10)), а бросок кубика 75 > 40, то испытание провалено.

    Если бы в таком же случае результат броска кубика = 17, то 17<40, испытание было бы пройдено.'
