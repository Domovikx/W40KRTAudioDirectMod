  text: Имперский флот насчитывает десятки тысяч военных кораблей и грузовых судов всевозможных размеров. Помимо космических кораблей, в структуру флота входят военные космопорты, космические станции, шахтерские и заводские корабли, а также различные орбитальные исследовательские станции.
