# Character voice assignments for W40KRT Audio Direct Mod
# Engine: Silero TTS v5_5 | Format: 48kHz 16-bit mono
# Last updated: 2026-07-14

# ── Voice reference ──────────────────────────────────────────────
# eugene  (M) — командный, уверенный, низкий тембр
# aidar   (M) — спокойный, вкрадчивый, ровный
# xenia   (Ж) — энергичный, чёткий, властный
# baya    (Ж) — тёплый, нежный, мягкий
# kseniya (Ж) — звонкий, высокий, быстрый

characters:
  # ─── ПРОЛОГ ──────────────────────────────────────────────────
  - name: "Кунрад Войгтвир"
    role: "Мастер шепотов"
    age: "средний"
    personality: "коварный, манипулятивный, вкрадчивый, resentful"
    voice: "aidar"
    rationale: >
      Кунрад не кричит и не командует — он шепчет, плетёт интриги, говорит тихо и
      опасно. aidar — самый спокойный и ровный мужской голос, идеален для
      персонажа, который всегда держит себя под контролем и носит маску
      обходительности.

  - name: "Теодора фон Валанциус"
    role: "Вольный Торговец"
    age: "пожилая"
    personality: "властная, жёсткая, решительная, eccentric"
    voice: "xenia"
    rationale: >
      Теодора — правительница династии, женщина, которая командует флотом и
      тысячами людей. xenia — самый энергичный и чёткий женский голос, с
      интонациями приказа. НЕ baya — она не тёплая, она властительница.

  - name: "Абеляр Версериан"
    role: "Сенешаль"
    age: "пожилой"
    personality: "суровый, верный, строгий, gruff, отеческий"
    voice: "eugene"
    rationale: >
      Абеляр — старый военный, правая рука Вольного Торговца. eugene даёт
      глубину, возраст и авторитет. Он строгий, но не злой — командный,
      отеческий тембр.

  - name: "Идира Тласс"
    role: "Псайкер"
    age: "средний"
    personality: "уставшая, дерзкая, циничная, haunted"
    voice: "xenia"
    rationale: >
      Идира резкая, эмоциональная, говорит то, что думает. xenia с её
      энергичным тоном передаёт её дерзость и внутреннее напряжение.

  - name: "Эдельтрад"
    role: "Наследник-псайкер"
    age: "молодой"
    personality: "испуганный, неуверенный, сломленный"
    voice: "aidar"
    rationale: >
      Эдельтрад — тихий, забитый, напуганный своими силами. aidar (самый
      мягкий мужской) подходит для его неуверенной речи.

  # ─── ГЛАВА 1 — Rykad Minoris ────────────────────────────────
  - name: "Хайнрикс ван Калокс"
    role: "Интеррогатор Инквизиции"
    age: "средний"
    personality: "холодный, строгий, принципиальный, puritan"
    voice: "aidar"
    rationale: >
      Хайнрикс — человек долга, без эмоций, без лишних слов. aidar (ровный,
      спокойный) передаёт его ледяную выдержку.

  - name: "Сестра Арджента"
    role: "Сестра Битвы"
    age: "молодая"
    personality: "пламенная, фанатичная, дерзкая, бескомпромиссная"
    voice: "xenia"
    rationale: >
      Арджента горит верой. xenia с её энергией и напором — идеальное
      совпадение для её пламенных речей.

  - name: "Паскаль Ханеуманн"
    role: "Магос Адептус Механикус"
    age: "древний (клонированное тело)"
    personality: "логичный, отстранённый, монотонный, machine-focused"
    voice: "aidar"
    rationale: >
      Паскаль — техножрец. aidar (монотонный, ровный) плюс возможная
      post-обработка (эффект вокса/робота) — лучший выбор для его
      бесстрастной, машинной речи.

  # ─── ГЛАВА 2 — Footfall / Dargonus ──────────────────────────
  - name: "Джаэ Хейдари"
    role: "Агент Касабаллики"
    age: "молодая"
    personality: "хитрая, игривая, скользкая, quick-witted"
    voice: "kseniya"
    rationale: >
      Джаэ говорит быстро, с хитринкой, с улыбкой в голосе. kseniya —
      самый звонкий и высокий голос, что придаёт ей лёгкость и
      пронырливость.

  - name: "Кассия Орселлио"
    role: "Навигатор"
    age: "юная"
    personality: "ранимая, застенчивая, аристократичная, earnest"
    voice: "baya"
    rationale: >
      Кассия — молодая девушка из знатного рода, воспитанная в тепличных
      условиях. baya (тёплый, нежный) идеально передаёт её мягкость и
      ранимость.

  # ─── ГЛАВА 3 — Аэльдари ─────────────────────────────────────
  - name: "Йрлиет Ланаэвисс"
    role: "Аэльдари-рейнджер"
    age: "древняя (сотни лет)"
    personality: "меланхоличная, гордая, спокойная, созерцательная"
    voice: "baya"
    rationale: >
      Йрлиет — отрешённая, печальная, говорит тихо и плавно. baya с её
      тёплым, спокойным тоном подходит для её меланхоличного, но не
      агрессивного характера.

  - name: "Маражай Аэзирраэш"
    role: "Друкари-архонт"
    age: "древний (тысячи лет)"
    personality: "хищный, садистичный, надменный, насмешливый"
    voice: "eugene"
    rationale: >
      Маражай — опасный, уверенный, с оттенком жестокости. eugene (низкий,
      командный) добавляет ему угрожающей глубины.

  # ─── ГЛАВА 4+ ───────────────────────────────────────────────
  - name: "Ульфар Громолёт"
    role: "Космический Волк"
    age: "столетний"
    personality: "грубый, воинственный, саговый, honourable"
    voice: "eugene"
    rationale: >
      Ульфар — гигант в броне, говорит раскатисто, сурово. eugene — самый
      низкий и мощный мужской голос, единственный вариант для космодесантника.

  - name: "Кибелла"
    role: "Ассасин Культа Смерти"
    age: "юная"
    personality: "тихая, смертоносная, преданная, cold"
    voice: "kseniya"
    rationale: >
      Кибелла говорит мало, тихо, с металлическими нотками. kseniya (звонкий)
      с пониженной громкостью создаёт эффект холодной, острой стали.

  - name: "Соломон Антар"
    role: "Арбитр"
    age: "средний"
    personality: "суровый, справедливый, неподкупный"
    voice: "eugene"
    rationale: >
      Соломон — законник, твёрдый, уверенный. eugene подходит для его
      командного, судейского тона.
