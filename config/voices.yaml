# ──────────────────────────────────────────────
# Каждая запись — результат прогона tools/qwen3_voice_design.py
# Формат:
#   voice_name:
#     wav: path/to/reference.wav       # эталонное аудио (голос)
#     txt: path/to/reference.txt       # транскрипт референса (обязательно для Full ICL)
#     instruct: "..."                  # текстовое описание голоса (для VoiceDesign)
#     description: "..."               # понятное описание
#     characters: []                   # список персонажей, использующих этот голос

