# ──────────────────────────────────────────────
# Voice References for Full ICL (Base model)
# Справочник: .opencode/skills/qwen3-full-icl/SKILL.md
# ──────────────────────────────────────────────
# Каждая запись — результат прогона tools/qwen3_voice_design.py
# Формат:
#   voice_name:
#     wav: path/to/reference.wav       # эталонное аудио (голос)
#     txt: path/to/reference.txt       # транскрипт референса (обязательно для Full ICL)
#     instruct: "..."                  # текстовое описание голоса (для VoiceDesign)
#     description: "..."               # понятное описание
#     characters: []                   # список персонажей, использующих этот голос

references:
  wh40k_narrator:
    wav: refs/narrator/reference.wav
    txt: refs/narrator/reference.txt
    x_vector_only: true
    description: "Наталья Фролова — женский, книжный, спокойный (клон из аудиокниги)"
    characters:
      - narrator
      - system
      - loading_screen

  teodora:
    wav: refs/teodora/reference.wav
    txt: refs/teodora/reference.txt
    description: "Теодора — низкий/средний женский, властный, аристократичный"
    characters:
      - Теодора

  kunrad:
    wav: refs/kunrad/reference.wav
    txt: refs/kunrad/reference.txt
    description: "Кунрад — средний/низкий мужской, холодный, кибернетический оттенок"
    characters:
      - Кунрад_Войгтвир
      - Кунрад

